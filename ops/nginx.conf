# hukuk.arxdigitalsevice.com — Plesk "Additional nginx directives"
# (/var/www/vhosts/system/hukuk.arxdigitalsevice.com/conf/vhost_nginx.conf).
# Plesk kendi "location /" bloğunu yazdığı için genel yönlendirme regex (~ ^/) olmalı
# (sunucudaki helezon/ads yapılandırmasıyla aynı desen).
# API yalnız 127.0.0.1:8810'da dinliyor (docker-compose.yml).

# Web sürümü (iPhone ve tarayıcı): Plesk kök klasöründeki app/ altında statik dosyalar.
# ^~ öneki aşağıdaki regex'ten önce eşleşir; uygulama içi yollar index.html'e düşer.
# Derleme: app/ dizininde EXPO_BASE_URL=/app ile `expo export --platform web` (bkz. DEPLOY.md).
location = /app {
    return 301 /app/;
}
location ^~ /app/ {
    try_files $uri $uri/ /app/index.html;
    add_header Cache-Control "no-cache";
    location ^~ /app/_expo/ {
        expires 30d;   # dosya adları içerik özetli; yeni sürüm yeni ad alır
    }
}

location ~ ^/ {
    proxy_pass http://127.0.0.1:8810;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 45m;      # not yükleme sınırı 40 MB + pay
    # asistanın derin cevabı 2-4 dk sürebilir
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
