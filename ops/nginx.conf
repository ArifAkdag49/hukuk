# hukuk.arxdigitalsevice.com — Plesk → subdomain → "Additional nginx directives"
# API yalnız 127.0.0.1:8810'da dinliyor (docker-compose.yml).

client_max_body_size 25m;          # not yükleme sınırı 20 MB + pay

location / {
    proxy_pass http://127.0.0.1:8810;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # asistanın derin cevabı 2-4 dk sürebilir
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
