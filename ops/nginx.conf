# hukuk.arxdigitalsevice.com — Plesk "Additional nginx directives"
# (/var/www/vhosts/system/hukuk.arxdigitalsevice.com/conf/vhost_nginx.conf).
# Plesk kendi "location /" bloğunu yazdığı için genel yönlendirme regex (~ ^/) olmalı
# (sunucudaki helezon/ads yapılandırmasıyla aynı desen).
# API yalnız 127.0.0.1:8810'da dinliyor (docker-compose.yml).

location ~ ^/ {
    proxy_pass http://127.0.0.1:8810;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;      # not yükleme sınırı 20 MB + pay
    # asistanın derin cevabı 2-4 dk sürebilir
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
