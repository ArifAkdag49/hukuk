# örf-adet hukukudur; bunlar mevzuat servisinde yoktur. Türk hukukuyla bağlantı: AY m. 90, 92, 104;
# 5718 sayılı MÖHUK m. 49 (yargı bağışıklığı). 244 sayılı Kanun'un usul maddeleri 2018'de 703 sayılı
# KHK ile kaldırıldı. Konuların çoğu kanunsuzdur.
# Elle (Claude Code'da) kuruldu.
