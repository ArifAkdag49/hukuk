doktrin: |
  ### Kurucu ve açıklayıcı kuram
  Kurucu kurama göre devlet ancak tanınmakla kişilik kazanır; açıklayıcı kurama göre unsurlar gerçekleşince devlet vardır ve tanıma bunu tespit eder. Baskın görüş açıklayıcı kuramdır; Montevideo'nun 3. maddesi bu yöndedir. Buna karşılık etkinliği tartışmalı varlıklarda (Kosova, Filistin) tanımanın fiilen kurucu ağırlık taşıdığı da ileri sürülür.

  ### Ek ölçüt ve tanıma ödevi
  Bir görüşe göre Montevideo ölçütlerine hukuka uygun doğuş ve self-determinasyona saygı da eklenmelidir (Rodezya, Kuzey Kıbrıs). Karşı görüşe göre bunlar devletliğin şartı değil, tanımama ödevinin konusudur. Unsurları taşıyan varlığı tanımanın hukuki ödev olup olmadığı da tartışmalıdır: baskın görüşe göre tanıma takdirî ve siyasidir; ödev yalnız belirli hâllerde tanımama yönündedir.

  ### BM üyeliği ve hükümet tanıması
  Baskın görüşe göre üyeliğe kabul her üye için ayrıca ikili tanıma sonucu doğurmaz; karşı görüş kolektif tanıma etkisi tanır. Hükümet tanımasında Tinoco etkinliği esas alır; meşruiyet (anayasal ya da demokratik köken) arayan uygulama da vardır. Bazı devletler hükümet tanımasını terk etmiştir; bunun hukuki anlamı tartışmalıdır.
sozluk:
  - terim: Devlet
    tanim: "Montevideo ölçütlerine göre sürekli nüfusu, belirli ülkesi, hükümeti ve diğer devletlerle ilişkiye girme ehliyeti olan uluslararası hukuk kişisi."
  - terim: Kurucu (constitutive) kuram
    tanim: "Devletin ancak diğer devletlerce tanınmakla uluslararası kişilik kazandığını savunan kuram."
  - terim: Açıklayıcı/bildirici (declaratory) kuram
    tanim: "Devletin unsurlar gerçekleşince var olduğunu, tanımanın yalnızca bunu tespit ettiğini savunan baskın kuram."
  - terim: Açık ve örtülü tanıma
    tanim: "Açık tanıma bildirimle; örtülü tanıma tanıma niyetini gösteren işlemle (ör. büyükelçi teatisi) yapılır."
  - terim: Tanımama ödevi
    tanim: "Kuvvet kullanma ya da emredici norm ihlaliyle doğan bir durumu hukuka uygun saymama ve sürdürülmesine yardım etmeme yükümlülüğü."
  - terim: Hükümetin tanınması
    tanim: "Bir devlette fiilen iktidarda olan makamın o devleti temsil eden hükümet olarak kabul edilmesi."
  - terim: De facto / de jure tanıma
    tanim: "Tanımanın derecesi: de facto tanıma geçici ve koşullu, de jure tanıma tam ve kesin tanımadır."
  - terim: Etkinlik (effectiveness) ölçütü
    tanim: "Bir hükümetin ülkeyi fiilen, barış içinde ve rakipsiz yönetmesine bakan ölçüt."
  - terim: Estoppel
    tanim: "Kişinin önceki tutumuyla çelişen bir iddiada bulunmasının engellenmesi; Tinoco'da tanımama estoppel doğurmamıştır."
  - terim: Erga omnes
    tanim: "Bütün devletlere karşı ileri sürülebilen (hukuki sonuç ya da yükümlülük)."
kararlar:
  - uluslararasi: true
    mahkeme: Uluslararası Adalet Divanı
    ad: "Kosova'nın Tek Taraflı Bağımsızlık Bildirisinin Uluslararası Hukuka Uygunluğu (danışma görüşü)"
    tarih: "22.07.2010"
    kaynak: https://legal.un.org/icjsummaries/documents/english/st_leg_serf1_add5.pdf
    ozet: |
      Genel Kurul, 63/3 sayılı kararla Divan'a Kosova Geçici Özyönetim Kurumları'nın tek taraflı bağımsızlık bildirisinin uluslararası hukuka uygun olup olmadığını sordu. Divan soruyu dar yorumladı; Kosova'nın devlet olup olmadığına ve tanımaların geçerliliğine girmedi. Genel uluslararası hukukun bağımsızlık bildirilerini yasaklamadığını, ülke bütünlüğü ilkesinin devletler arası ilişkilerle sınırlı olduğunu belirtti ve bildirinin uluslararası hukuku ihlal etmediğine 10'a karşı 4 oyla karar verdi.
  - uluslararasi: true
    mahkeme: Uluslararası Adalet Divanı
    ad: "Güvenlik Konseyi'nin 276 (1970) sayılı Kararına Rağmen Güney Afrika'nın Namibya'da Kalmaya Devam Etmesinin Hukuki Sonuçları (danışma görüşü)"
    tarih: "21.06.1971"
    kaynak: https://legal.un.org/icjsummaries/documents/english/st_leg_serf1.pdf
    ozet: |
      Güvenlik Konseyi'nin 284 (1970) sayılı kararıyla istenen görüşte Divan, Güney Afrika'nın Namibya'daki varlığının hukuka aykırı olduğuna ve idaresini çekmesi gerektiğine 13'e karşı 2 oyla karar verdi. BM üyelerinin bu aykırılığı ve Güney Afrika'nın işlemlerinin geçersizliğini tanımakla, varlığı destekleyecek işlemlerden kaçınmakla yükümlü olduğunu 11'e karşı 4 oyla belirtti. Tanımama doğum, ölüm ve evlilik kaydı gibi işlemlere geçersizlik yaymaz.
  - uluslararasi: true
    mahkeme: Hakem Mahkemesi (tek hakem William H. Taft)
    ad: "Tinoco Davası, Büyük Britanya - Kosta Rika (hakem kararı)"
    tarih: "18.10.1923"
    kaynak: https://legal.un.org/riaa/cases/vol_I/369-399.pdf
    ozet: |
      Darbeyle yönetimi alan Tinoco yaklaşık iki yıl direnişsiz yönetti; sonraki hükümet dönemin işlemlerini hükümsüz saydı. Hakem, fiilen ve rakipsiz yöneten hükümetin devleti bağlayabileceğini, anayasaya aykırı kuruluşun engel olmadığını, tanımamanın delil olduğunu ama estoppel doğurmadığını kabul etti. Talepler yine de esastan başarısız oldu: ödeme Tinoco ve kardeşinin kişisel kullanımı içindi, imtiyaz ise 1917 Anayasası'na göre de geçersizdi.
sorular:
  - soru: |
      Montevideo Sözleşmesi'nin 1. maddesi sayılan niteliklerden hangisi devletin unsurları arasında **yer almaz**?
    siklar:
      - "Sürekli nüfus"
      - "Belirli ülke"
      - "Diğer devletlerce tanınmış olma"
      - "Diğer devletlerle ilişkiye girme ehliyeti"
    dogru: 2
    aciklama: |
      Montevideo Sözleşmesi'nin 1. maddesi dört nitelik sayar: sürekli nüfus, belirli ülke, hükümet ve diğer devletlerle ilişkiye girme ehliyeti. Tanınma bu listede değildir; Sözleşme'nin 3. maddesi devletin siyasi varlığını tanımadan bağımsız sayar.
  - soru: |
      Montevideo Sözleşmesi'nin 3. maddesinin ifade ettiği yaklaşım hangisidir?
    siklar:
      - "Devlet ancak tanınmakla uluslararası kişilik kazanır."
      - "Devletin siyasi varlığı diğer devletlerin tanımasından bağımsızdır."
      - "Tanıma yalnızca Güvenlik Konseyi tarafından yapılabilir."
      - "Tanınmayan devletin bütünlüğünü savunma hakkı yoktur."
    dogru: 1
    aciklama: |
      3. madde açıklayıcı (bildirici) kuramı yansıtır: devletin siyasi varlığı tanımadan bağımsızdır ve tanınmadan önce de bütünlüğünü ve bağımsızlığını savunma hakkı vardır.
  - soru: |
      A devleti, yeni kurulan B devletine tanıma notası vermemiştir; ancak B ile büyükelçi teatisi yapmıştır. Montevideo Sözleşmesi'nin 7. maddesine göre A'nın durumu nedir?
    siklar:
      - "B'yi tanımamıştır; tanıma yalnız yazılı bildirimle olur."
      - "B'yi ancak Güvenlik Konseyi onaylarsa tanımış sayılır."
      - "B'yi geçici olarak tanımıştır ve istediği zaman bu tanımadan dönebilir."
      - "B'yi örtülü olarak tanımıştır; çünkü tanıma niyetini içeren her işlem örtülü tanımadır."
    dogru: 3
    aciklama: |
      Montevideo Sözleşmesi'nin 7. maddesine göre tanıma açık ya da örtülü olabilir; örtülü tanıma, yeni devleti tanıma niyetini içeren her işlemden doğar. Büyükelçi teatisi buna örnektir.
  - soru: |
      A devleti, B devletini resmen tanımış; sonra iki devlet arasında siyasi anlaşmazlık çıkınca A "tanımayı geri çekiyorum" demiştir. Montevideo Sözleşmesi'nin 6. maddesine göre sonuç nedir?
    siklar:
      - "Tanıma kayıtsız şartsız ve geri alınamaz olduğundan geri çekme hukuken sonuç doğurmaz."
      - "Tanıma her zaman geri alınabilir."
      - "Geri çekme ancak BM Genel Kurulu onaylarsa geçerli olur."
      - "Tanıma yalnız on yıl geçerlidir."
    dogru: 0
    aciklama: |
      Montevideo Sözleşmesi'nin 6. maddesi devlet tanımasının kayıtsız şartsız ve geri alınamaz olduğunu söyler. Bu kural devlet tanıması içindir; hükümet tanımasına ilişkin Sözleşme'de bir hüküm yoktur.
  - soru: |
      Güvenlik Konseyi, 662 (1990) sayılı kararla Irak'ın Kuveyt'i ilhakı hakkında hangi sonuca varmıştır?
    siklar:
      - "İlhakı yasal sayıp tanımayı devletlerin takdirine bırakmıştır."
      - "İlhakın hukuki geçerliliği olmadığına ve hükümsüz sayıldığına karar vermiş; karar oybirliğiyle alınmıştır."
      - "Karar 13 oyla, 1 ret ve 1 çekimser oyla alınmıştır."
      - "İlhakı tanımayı yalnız BM üyesi olmayan devletlere yasaklamıştır."
    dogru: 1
    aciklama: |
      662 sayılı kararın birinci paragrafı ilhakın hukuki geçerliliği olmadığını ve hükümsüz sayıldığını belirtir; devletlerin ilhakı ve dolaylı tanıma sayılabilecek işlemleri tanımamaları istenir. Karar oybirliğiyle alınmıştır. 13 oy, 1 ret ve 1 çekimser, 541 (1983) sayılı kararın oylamasıdır.
  - soru: |
      UAD'nin Kosova danışma görüşüne (22 Temmuz 2010) göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Kosova devlettir ve bütün devletler onu tanımak zorundadır."
      - "Bağımsızlık bildirileri genel uluslararası hukukla yasaklanmıştır."
      - "Divan, Kosova'nın devlet olup olmadığını ve tanımaların geçerliliğini incelemeyi gerekli görmemiştir."
      - "Ülke bütünlüğü ilkesi, bir devlet içindeki gruplara karşı da uygulanır."
    dogru: 2
    aciklama: |
      Divan soruyu dar yorumlayıp yalnızca bildirinin genel uluslararası hukuku ihlal edip etmediğine baktı ve ihlal olmadığı sonucuna vardı. Devletlik ve tanıma sorularına girmedi. Ülke bütünlüğü ilkesinin kapsamını da devletler arası ilişkilerle sınırlı gördü.
  - soru: |
      Güney Afrika'nın Namibya'yı yöneten idaresi sırasında tutulmuş bir doğum kaydı için Namibya görüşündeki (UAD, 1971) tanımama yükümlülüğünün sonucu nedir?
    siklar:
      - "Kayıt, tanımama yükümlülüğü gereği tümüyle geçersiz sayılır."
      - "Kayıt yalnızca Güney Afrika'nın izniyle geçerli olur."
      - "Kayıt, evlilik ve ölüm kayıtları hariç geçersiz olur."
      - "Kayıt geçerliliğini korur; tanımama doğum, ölüm ve evlilik kaydı gibi işlemlere geçersizlik yaymaz."
    dogru: 3
    aciklama: |
      Divan'a göre tanımama, Namibya halkını uluslararası işbirliğinin yararlarından yoksun bırakmamalıdır; doğum, ölüm ve evlilik kayıtları gibi işlemlere geçersizlik yayılmaz.
  - soru: |
      X devletinde bir general darbeyle iktidarı almış, iki yıl boyunca direnişsiz ve rakipsiz yönetmiştir. Y devleti bu hükümeti tanımamıştır. Sonraki hükümet, darbe hükümetinin bütün işlemlerini hükümsüz ilan etmiştir. Y, vatandaşı adına talepte bulunmak istemektedir. Tinoco kararındaki hakemin yaklaşımına göre hangisi doğrudur?
    siklar:
      - "Darbe hükümeti devleti bağlayamaz, çünkü anayasaya aykırı kurulmuştur."
      - "Y tanımadığı için talepte bulunamaz; estoppel doğmuştur."
      - "Etkin ve rakipsiz yönetim, hükümetin devleti bağlayabilmesi için yeterlidir; Y'nin tanımaması estoppel doğurmaz."
      - "Tanıma, hükümetin varlığının tek delilidir; tanımayan devlet için hükümet yoktur."
    dogru: 2
    aciklama: |
      Tinoco'da hakem Taft, fiilen ve rakipsiz yöneten hükümetin devleti bağlayabileceğini, anayasaya aykırı kuruluşun buna engel olmadığını ve tanımamanın yalnız delil niteliği taşıdığını, tanımayan Büyük Britanya'yı estoppel nedeniyle talepten engellemediğini belirtti.
  - soru: |
      Aşağıdakilerden hangisi kuvvetle elde edilen ülke kazanımlarının tanınmaması kuralına dayanak oluşturur?
    siklar:
      - "AY m. 104"
      - "Genel Kurul'un 67/19 sayılı kararı"
      - "BM Genel Kurulu'nun 2625 (XXV) sayılı kararı"
      - "Montevideo Sözleşmesi'nin 2. maddesi"
    dogru: 2
    aciklama: |
      2625 (XXV) sayılı karar, kuvvet tehdidi ya da kullanımı sonucu hiçbir ülke kazanımının hukuka uygun tanınmayacağını söyler; Montevideo Sözleşmesi'nin 11. maddesi de akit devletler için benzer ödev getirir. 67/19 Filistin'in gözlemci devlet statüsüyle ilgilidir; 216 sayılı karar Güney Rodezya hakkındadır.
  - soru: |
      UHK Devlet Sorumluluğu Maddeleri'nin 41. maddesinin 2. fıkrasına göre emredici bir normun ağır ihlaliyle yaratılan bir durum karşısında devletlerin yükümlülüğü nedir?
    siklar:
      - "Durumu hukuka uygun olarak tanımamak ve sürdürülmesine yardım ya da destek vermemek"
      - "Durumu mutlaka tanımak"
      - "İhlali yapan devleti BM'den çıkarmak"
      - "Yalnızca ihlalden zarar gören devletle işbirliği yapmak"
    dogru: 0
    aciklama: |
      41. maddenin 2. fıkrası, hiçbir devletin 40. madde anlamında ağır bir ihlalle yaratılan durumu hukuka uygun tanımayacağını ve durumun sürdürülmesine yardım etmeyeceğini söyler.
  - soru: |
      Bir bölgenin halk temsilcileri bağımsızlık ilan etmiş, onlarca devlet bu yeni varlığı tanımıştır. Varlık BM'ye üyelik için başvurmuştur. Bu durumda aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Onlarca devletin tanıması, kendiliğinden BM üyeliği sağlar."
      - "Üyelik, Güvenlik Konseyi'nin tavsiyesi üzerine Genel Kurul kararıyla olur; tanıyan devletlerin sayısı yetmez."
      - "Üyelik yalnız Genel Kurul'un tek başına vereceği karara bağlıdır."
      - "Tanınan varlık, Güvenlik Konseyi'nden bağımsız olarak üyedir."
    dogru: 1
    aciklama: |
      BM Şartı'nın 4. maddesinin 2. fıkrası üyeliğe kabulü Güvenlik Konseyi'nin tavsiyesi üzerine Genel Kurul kararına bağlar. Tanıma her devletin tek taraflı işlemidir; üyelik örgüt kararıdır.
  - soru: |
      Türk hukukunda yabancı devlet temsilcilerini kabul etme yetkisi kime aittir?
    siklar:
      - "TBMM'ye"
      - "Bakanlar Kurulu'na"
      - "Anayasa Mahkemesi'ne"
      - "Cumhurbaşkanına"
    dogru: 3
    aciklama: |
      AY m. 104'e göre Cumhurbaşkanı, yabancı devletlere Türkiye Cumhuriyeti'nin temsilcilerini gönderir ve Türkiye Cumhuriyeti'ne gönderilecek yabancı devlet temsilcilerini kabul eder.
olaylar:
  - olay: |
      A devleti, komşusu B devletinin Z ilini silahlı kuvvetle işgal edip kendi topraklarına katmıştır. Güvenlik Konseyi oybirliğiyle aldığı bir kararla ilhakın hukuki geçerliliği olmadığını ve hükümsüz sayıldığını belirtmiş, devletleri ilhakı tanımamaya ve ilhakı dolaylı yoldan tanımak anlamına gelebilecek işlemlerden kaçınmaya çağırmıştır. C devleti ise Z'de A'nın kurduğu yönetimin büyükelçisini kabul etmiş ve A ile ilhakı tanıyan bir ticaret antlaşması imzalamıştır. Öte yandan Z'deki bazı vatandaşlar, A'nın idaresi sırasında tutulan doğum ve evlilik kayıtlarının geçerliliğinin tartışıldığını belirtmektedir.
      1. İlhak hukuka uygun biçimde tanınabilir mi?
      2. C'nin büyükelçiyi kabul etmesi ve antlaşma imzalaması hukuken nasıl değerlendirilir?
      3. Z'de A'nın idaresi sırasında tutulan doğum ve evlilik kayıtları geçersiz olur mu?
    olcut:
      - {tespit: "Kuvvet kullanımı sonucu elde edilen ülke kazanımının hukuka uygun olarak tanınamayacağı", puan: 25, madde: "BM Genel Kurulu'nun 2625 (XXV) sayılı kararı"}
      - {tespit: "Güvenlik Konseyi'nin 662 (1990) benzeri kararıyla ilhakın hükümsüz sayılması ve tanımama çağrısı yapılması; C'nin antlaşmasının bu çağrıyla bağdaşmaması", puan: 25, madde: "S/RES/662 (1990)"}
      - {tespit: "Büyükelçinin kabulünün tanıma niyetini gösteren işlem olarak örtülü tanıma sayılabilmesi", puan: 15, madde: "Montevideo Sözleşmesi'nin 7. maddesi"}
      - {tespit: "Tanımama ödevinin dayanağı: kuvvet kullanma / emredici norm ihlaliyle doğan durumların tanınmaması", puan: 15, madde: "UHK Devlet Sorumluluğu Maddeleri'nin 41. maddesinin 2. fıkrası"}
      - {tespit: "Doğum ve evlilik kayıtlarının tanımama nedeniyle geçersiz sayılmaması (Namibya istisnası)", puan: 20, madde: "UAD Namibya danışma görüşü (1971)"}
    cozum: |
      **Nitelendirme:** Olay, kuvvet kullanımı sonucu gerçekleşen bir ilhakın tanınıp tanınamayacağı ve tanımama yükümlülüğünün kapsamıyla ilgilidir.

      **Hukuki sorunlar:** (1) Kuvvetle edinilen ülkenin tanınması, (2) C'nin işlemlerinin tanıma anlamı ve Konsey kararıyla ilişkisi, (3) tanımamanın sınırı.

      **İlgili hükümler:** BM Genel Kurulu'nun 2625 (XXV) sayılı kararı; Güvenlik Konseyi'nin 662 (1990) sayılı kararı; Montevideo Sözleşmesi'nin 7. maddesi; UHK Devlet Sorumluluğu Maddeleri'nin 41. maddesi; UAD'nin Namibya danışma görüşü (1971).

      **Değerlendirme:** Birinci soru: 2625 sayılı karara göre kuvvet tehdidi ya da kullanımı sonucu hiçbir ülke kazanımı hukuka uygun tanınmaz. Olayda Konsey ayrıca ilhakın hükümsüz olduğunu belirtmiş ve devletleri tanımamaya çağırmıştır; bu yaklaşım 662 (1990) sayılı kararla aynıdır. Dolayısıyla ilhak hukuka uygun biçimde tanınamaz.

      İkinci soru: Montevideo Sözleşmesi'nin 7. maddesine göre tanıma açık ya da örtülü olabilir; örtülü tanıma, tanıma niyetini içeren her işlemden doğar. Bir yönetimin büyükelçisini kabul etmek ve ilhakı tanıyan antlaşma imzalamak ilhakı tanıma niyetini gösterir. Konsey'in açık tanımama çağrısı karşısında bu işlemler çağrıyla bağdaşmaz. Ayrıca UHK Devlet Sorumluluğu Maddeleri'nin 41. maddesinin 2. fıkrası, emredici normun ağır ihlaliyle doğan durumun tanınmamasını söyler; ancak bu hükmün örf ve âdet niteliği tartışmalı olduğundan çözüm Konsey kararına ve 2625 sayılı karara dayandırılmalıdır.

      Üçüncü soru: UAD, Namibya görüşünde tanımama yükümlülüğünün sınırını çizmiştir: tanımama, halkı uluslararası işbirliğinin yararlarından yoksun bırakmamalı, doğum, ölüm ve evlilik kayıtları gibi işlemlerin geçersizliğine yayılmamalıdır. Bu nedenle Z'deki kayıtlar geçerliliğini korur.

      **Sonuç:** İlhak tanınamaz; C'nin büyükelçiyi kabulü ve antlaşması örtülü tanıma niteliği taşır ve Konsey'in tanımama çağrısıyla bağdaşmaz; ama Z'deki doğum ve evlilik kayıtları geçerli sayılmaya devam eder.
  - olay: |
      X ülkesinde bir general, Ocak ayında darbeyle iktidarı ele geçirmiş, yeni anayasa çıkarmış ve yaklaşık iki yıl boyunca direnişsiz ve rakipsiz yönetmiştir. Y devleti bu hükümeti tanımamıştır. Darbe hükümeti, Y vatandaşı M Bankası ile iki işlem yapmıştır: devletin meşru ihtiyaçları için bir kredi sözleşmesi ve generalin ve kardeşinin kişisel kullanımı için yapılmış, bankanın bunu bildiği bir ödeme. Sonradan iktidara gelen hükümet, darbe dönemi işlemlerini kanunla hükümsüz ilan etmiştir. Y, bankası adına X'e karşı talepte bulunmuştur. X, Y'nin hükümeti tanımamış olduğundan talepte bulunamayacağını, ayrıca darbe hükümetinin anayasaya aykırı kurulması nedeniyle devleti bağlayamayacağını savunmaktadır.
      1. Darbe hükümeti X devletini bağlayabilir mi?
      2. Y'nin hükümeti tanımamış olması talebine engel midir?
      3. Kişisel kullanım için yapılan ödeme bakımından X sorumlu tutulabilir mi?
    olcut:
      - {tespit: "Etkin ve rakipsiz kontrol varsa hükümetin devleti bağlayabileceği (Tinoco)", puan: 25, madde: "Tinoco hakem kararı (1923)"}
      - {tespit: "Anayasaya aykırı kuruluşun tek başına engel olmadığı", puan: 20, madde: "Tinoco hakem kararı (1923)"}
      - {tespit: "Tanımamanın yalnız delil değeri taşıdığı ve estoppel doğurmadığı", puan: 25, madde: "Tinoco hakem kararı (1923)"}
      - {tespit: "Hükümet değişikliğinin devleti ve devletin yükümlülüklerini etkilememesi (devlet-hükümet ayrımı)", puan: 15, madde: "Tinoco hakem kararı (1923)"}
      - {tespit: "Kişisel kullanım için yapılan, bankanın bildiği ödeme bakımından devletin sorumlu tutulamaması", puan: 15, madde: "Tinoco hakem kararı (1923)"}
    cozum: |
      **Nitelendirme:** Olay, darbeyle gelen hükümetin devleti bağlama gücü, hükümet tanımasının sonuçları ve hükümet değişikliğinde devletin sürekliliğiyle ilgilidir.

      **Hukuki sorunlar:** (1) Darbe hükümetinin bağlayıcılığı, (2) tanımamanın talebe etkisi, (3) kişisel kullanım amaçlı ödeme.

      **İlgili hükümler:** Tinoco davası (Büyük Britanya - Kosta Rika, hakem kararı, 18 Ekim 1923).

      **Değerlendirme:** Birinci soru: Tinoco kararında hakem Taft, yaklaşık iki yıl direnişsiz ve rakipsiz yöneten hükümeti fiilî ve gerçek hükümet saymış, devleti bağlayabileceğini kabul etmiştir. Hükümetin anayasaya aykırı kurulması buna engel değildir, çünkü devrimle kurulan hükümetten eski anayasaya uygunluk beklenemez; ölçüt, kontrolün etki alanındakilerce kabul edilmesi ve karşısında hükümet iddiasında bir gücün bulunmamasıdır. X'in savunması bu nedenle yerinde değildir. Ayrıca sonraki hükümetin işlemleri kanunla hükümsüz ilan etmesi, devletin yükümlülüklerini ortadan kaldırmaz: hükümet değişse de devlet aynıdır.

      İkinci soru: Hakem, tanımamanın bir hükümetin varlığına karşı delil olabileceğini, ancak meşruiyet gerekçesine dayanan tanımamanın delil değerinin azaldığını belirtmiştir. Tanımayan devletin estoppel nedeniyle talepte bulunamayacağına dair genel kabul görmüş bir kural da yoktur; çünkü tanımama, X'i konum değiştirmeye yöneltmemiştir. Bu nedenle Y talepte bulunabilir.

      Üçüncü soru: Tinoco'da banknotlara ilişkin ödeme Tinoco ve kardeşinin kişisel kullanımı içindi ve banka bunu biliyordu; bu nedenle talep esastan başarısız oldu. Aynı mantıkla devletin meşru kullanımı için yapılan kredi sözleşmesi bağlayıcı olabilir; ama kişisel kullanım için yapılan ve bankanın bildiği ödeme bakımından X sorumlu tutulamaz.

      **Sonuç:** Darbe hükümeti X'i bağlayabilir; Y'nin tanımamış olması talebe engel değildir; devletin meşru ihtiyacı için yapılan kredi darbe hükümetince de devleti bağlayabilir; kişisel kullanım ödemesi bakımından talep başarısız olur.
kartlar:
  - on: "Montevideo Sözleşmesi'nin 1. maddesine göre devletin dört niteliği nedir?"
    arka: "Sürekli nüfus, belirli ülke, hükümet ve diğer devletlerle ilişkiye girme ehliyeti."
  - on: "Montevideo Sözleşmesi hangi tarihte imzalandı ve niteliği nedir?"
    arka: "26 Aralık 1933'te Montevideo'da; Amerikan devletleri arasında yapılmış bölgesel bir sözleşmedir. Ölçütlerin genel geçerliliği örf ve âdet hukuku niteliğinden gelir (öğreti)."
  - on: "Kurucu ve açıklayıcı kuram arasındaki fark nedir?"
    arka: "Kurucu kuram devletin ancak tanımayla kişilik kazandığını, açıklayıcı kuram unsurlar gerçekleşince devletin var olduğunu ve tanımanın bunu tespit ettiğini söyler. Baskın görüş açıklayıcıdır."
  - on: "Montevideo'nun 3. maddesi ne söyler?"
    arka: "Devletin siyasi varlığı diğer devletlerin tanımasından bağımsızdır (açıklayıcı kuram)."
  - on: "Montevideo'nun 6. ve 7. maddeleri tanıma hakkında ne söyler?"
    arka: "6. madde: tanıma kayıtsız şartsız ve geri alınamaz. 7. madde: tanıma açık ya da örtülü olabilir; örtülü tanıma, tanıma niyetini içeren her işlemden doğar."
  - on: "Kuvvetle elde edilen ülke kazanımı tanınır mı?"
    arka: "Hayır. 2625 (XXV) sayılı karara göre kuvvet tehdidi ya da kullanımı sonucu hiçbir ülke kazanımı hukuka uygun tanınmaz; Montevideo'nun 11. maddesi de benzer ödev getirir."
  - on: "UHK Devlet Sorumluluğu Maddeleri'nin 41. maddesinin 2. fıkrası ne söyler?"
    arka: "Hiçbir devlet, emredici normun ağır ihlaliyle yaratılan durumu hukuka uygun tanımaz ve sürdürülmesine yardım ya da destek vermez."
  - on: "Güvenlik Konseyi'nin tanımama çağrısı yaptığı örnek kararlar hangileridir?"
    arka: "216 ve 217 (1965, Güney Rodezya), 541 ve 550 (1983 ve 1984, Kuzey Kıbrıs), 662 (1990, Kuveyt; oybirliği)."
  - on: "Namibya görüşünde (1971) tanımamanın sınırı nedir?"
    arka: "Tanımama doğum, ölüm ve evlilik kaydı gibi işlemlerin geçersizliğine yayılmaz; Namibya halkı uluslararası işbirliğinin yararlarından yoksun bırakılmamalıdır."
  - on: "Kosova danışma görüşü (22 Temmuz 2010) ne söyler, neyi söylemez?"
    arka: "Genel uluslararası hukukun bağımsızlık bildirilerini yasaklamadığını söyler (10'a karşı 4 oy). Kosova'nın devlet olup olmadığına ve tanımaların geçerliliğine girmez; ayrılma hakkı da tanımaz."
  - on: "Tinoco kararının (1923) ana ilkeleri nelerdir?"
    arka: "Etkin ve rakipsiz hükümet devleti bağlar; anayasaya aykırı kuruluş engel değildir; tanımama delildir, estoppel doğurmaz; hükümet değişikliği devletin yükümlülüklerini etkilemez."
  - on: "BM üyeliği nasıl kazanılır, tanımayla ilişkisi nedir?"
    arka: "Güvenlik Konseyi'nin tavsiyesi üzerine Genel Kurul kararıyla (BM Şartı'nın 4. maddesinin 2. fıkrası). Tanıma her devletin tek taraflı işlemidir; tanınmak üyelik için yetmez."
