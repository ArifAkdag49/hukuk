sorular:
  - soru: |
      Devlet halefiyeti, 1978 Antlaşmalara İlişkin Devlet Halefiyeti Viyana Sözleşmesi'ne göre nasıl tanımlanır?
    siklar:
      - "Bir devletin ülke, nüfus ve hükûmet değişikliklerine rağmen aynı hukuki kişi olarak sürmesidir."
      - "Bir ülkenin uluslararası ilişkilerinden sorumlulukta bir devletin yerini başka bir devletin almasıdır."
      - "Yeni kurulan devletin diğer devletlerce tanınmasıdır."
      - "Bir devletin başka bir devletin iç işlerine askerî müdahalesidir."
    dogru: 1
    aciklama: |
      Sözleşme halefiyeti, bir ülkenin uluslararası ilişkilerinden sorumlulukta bir devletin yerini başkasının alması olarak tanımlar. Aynı hukuki kişinin sürmesi devamlılıktır, halefiyet değildir; tanınma ise halefiyetin değil devletin doğuşunun sorunudur (6. konu).
  - soru: |
      A devletinin sömürgesi olan X, bağımsızlığını kazanmıştır. A, X adına C devleti ile ikili bir ticaret antlaşması yapmıştı. A, C ve X, 1978 Sözleşmesi'ne taraftır. Bağımsızlıktan sonra X ile C arasında bu antlaşmanın akıbeti nedir?
    siklar:
      - "Antlaşma, yalnız X'in ülkesinde yürürlükte olduğu için X'i kendiliğinden bağlar."
      - "Antlaşma kendiliğinden sona erer; X ile C açık ya da davranışla anlaşsalar bile yürürlüğe giremez."
      - "Antlaşma, X ile C açıkça ya da davranışlarıyla bu yönde anlaşırsa yürürlükte sayılır."
      - "Antlaşma yalnızca A'nın onayıyla X bakımından sürebilir."
    dogru: 2
    aciklama: |
      X sömürgeden doğan, yani yeni bağımsız bir devlettir. Temiz sayfa kuralına göre antlaşmayı yalnız ülkesinde yürürlükte olduğu için sürdürmek zorunda değildir (1978 Sözleşmesi'nin 16. maddesi). İkili antlaşma ise tarafların açık anlaşması ya da davranışla anlaşmış sayılmaları halinde yürürlükte kabul edilir (24. madde). Selefin onayı aranmaz.
  - soru: |
      Türkiye'nin 1978 Antlaşmalara İlişkin Devlet Halefiyeti Viyana Sözleşmesi bakımından durumu aşağıdakilerden hangisidir?
    siklar:
      - "Sözleşme'ye taraftır ve hükümleri Türkiye'yi doğrudan bağlar."
      - "Sözleşme'yi imzalamış ama onaylamamıştır."
      - "Sözleşme'ye ne imzacı ne de taraftır; kurallar ancak örf ve âdet olduğu ölçüde uygulanır."
      - "Sözleşme'ye çekince koyarak katılmıştır."
    dogru: 2
    aciklama: |
      Sözleşme 6 Kasım 1996'da yürürlüğe girmiştir; treaties.un.org kayıtlarına göre Türkiye imzacı da taraf da değildir. Bu nedenle Sözleşme'nin kuralları Türkiye bakımından ancak örf ve âdet hukuku niteliğinde olduğu ölçüde uygulanır.
  - soru: |
      D devleti, Y bölgesini antlaşmayla E devletine devretmiştir. D'nin F devleti ile yaptığı ve Y'de uygulanan bir yatırım antlaşması vardır. D, E ve F, 1978 Sözleşmesi'ne taraftır. Devirden sonra bu antlaşma Y bakımından ne olur?
    siklar:
      - "Y bakımından halefiyet tarihinden itibaren sona erer; E'nin antlaşmaları Y'de başlar."
      - "Y bakımından E'yi kendiliğinden bağlar, çünkü ülkesel rejim sayılır."
      - "Y bakımından F'nin rızasıyla E'ye geçer."
      - "Y bakımından askıya alınır ve devirden 5 yıl sonra yeniden uygulanır."
    dogru: 0
    aciklama: |
      Ülke parçası devrinde selefin antlaşmaları o ülke bakımından halefiyet tarihinden itibaren sona erer, halefin antlaşmaları ise yürürlüğe girer (1978 Sözleşmesi'nin 15. maddesi, hareketli antlaşma sınırları). Yatırım antlaşması sınır ya da ülkesel rejim niteliğinde değildir; D ile E arasındaki devir anlaşması da F'yi yalnız bu nedenle bağlamaz (8. madde).
  - soru: |
      1978 Sözleşmesi'ne göre, sömürgeden bağımsızlığını kazanan devletin, selefin yaptığı sınır antlaşması bakımından durumu nedir?
    siklar:
      - "Temiz sayfa kuralı gereği sınır antlaşmasıyla bağlı değildir."
      - "Antlaşmayla çizilmiş sınır halefiyetten kendiliğinden etkilenmez."
      - "Sınır antlaşması ancak halefiyet bildirimiyle sürer."
      - "Sınır antlaşması yalnız üçüncü devletler izin verirse sürer."
    dogru: 1
    aciklama: |
      Halefiyet, antlaşmayla belirlenmiş sınırı ve sınır rejimine ilişkin hak ve yükümlülükleri kendiliğinden etkilemez (1978 Sözleşmesi'nin 11. maddesi). Temiz sayfa kuralı (16. madde) bu koruma karşısında sınır antlaşmasında işlemez. Halefiyet bildirimi çok taraflı antlaşmalar içindir (17. madde).
  - soru: |
      S devleti dağılmış, ülkesinde P ve R adlı iki yeni devlet doğmuştur. S'nin bütün ülkesinde yürürlükte olan çok taraflı bir çevre antlaşması vardır. Her şey 1978 Sözleşmesi'ne tabidir. Antlaşmanın akıbeti nedir?
    siklar:
      - "Temiz sayfa gereği P ve R için sona erer."
      - "Yalnız en büyük halef için sürer."
      - "P ve R'nin her biri bakımından sürer; aksine anlaşma, bağdaşmazlık ya da köklü değişiklik saklıdır."
      - "Yalnız S'nin eski başkentinin bulunduğu devlet bakımından sürer."
    dogru: 2
    aciklama: |
      Ayrılma ya da dağılmada, selefin bütün ülkesinde yürürlükte olan antlaşma, her halef devlet bakımından sürer (1978 Sözleşmesi'nin 34. maddesi). Temiz sayfa yalnız sömürgeden doğan yeni bağımsız devletler içindir; dağılmayla doğan devlet bu tanıma girmez.
  - soru: |
      Self-determinasyon ve ilgili belgelerle ilgili aşağıdaki ifadelerden hangisi doğrudur?
    siklar:
      - "BM Şartı'nın 1. maddesinin 2. fıkrası self-determinasyonu 'hak' olarak düzenler, Genel Kurul'un 1514 sayılı kararı ise 'ilke' olarak anar."
      - "Genel Kurul kararları kendiliğinden bağlayıcıdır; bu yüzden 1514 sayılı karar doğrudan antlaşma niteliği taşır."
      - "BM Şartı'nın 1. maddesinin 2. fıkrası self-determinasyonu 'ilke' olarak anar; 1514 sayılı karar ise 'hak' kavramını kullanır ve UAD tarafından örf ve âdetin açıklayıcısı sayılmıştır."
      - "Self-determinasyon ilk kez 2625 sayılı kararla ortaya çıkmıştır; ondan önce hiçbir belgede yer almaz."
    dogru: 2
    aciklama: |
      Şart'ın 1. maddesinin 2. fıkrası halkların eşit haklılığı ve self-determinasyonu "ilkesine" saygıdan söz eder; 1514 sayılı karar ise "hak" ifadesini kullanır. Genel Kurul kararları kendiliğinden bağlayıcı değildir; UAD, Çagos görüşünde 1514'ü örf ve âdet bakımından açıklayıcı saymıştır.
  - soru: |
      Genel Kurul'un 1541 (XV) sayılı kararındaki üç seçeneğe 2625 (XXV) sayılı kararla hangi dördüncü seçenek eklenmiştir?
    siklar:
      - "Kendi kendini yönetmeyen ülkenin vesayet altına alınması."
      - "Yöneten devlet ile federasyon kurulması."
      - "Halkın serbestçe belirlediği başka bir siyasal statüye ulaşması."
      - "Üçüncü bir devlet tarafından ilhak edilmesi."
    dogru: 2
    aciklama: |
      1541 sayılı kararın VI. ilkesi bağımsız devlet olmayı, bağımsız bir devletle serbest ortaklığı ve bağımsız bir devlete katılmayı sayar. 2625 sayılı karar bunlara halkın serbestçe belirlediği herhangi başka bir siyasal statüye ulaşmayı ekler.
  - soru: |
      Portekiz, Avustralya'nın Endonezya ile yaptığı Timor Gap antlaşması nedeniyle Avustralya'yı UAD'de dava etmiştir. Portekiz ve Avustralya UAD Statüsü'nün 36. maddesinin 2. fıkrası beyanı vermiş, Endonezya vermemiştir. Doğu Timor kararında (1995) Mahkeme ne sonuca varmıştır?
    siklar:
      - "Self-determinasyon erga omnes olduğu için Endonezya'nın rızası aranmaksızın esasa girmiş ve Avustralya'yı sorumlu bulmuştur."
      - "Esasa girmiş ve Avustralya'nın hukuka uygun davrandığına karar vermiştir."
      - "Davayı gerçek bir uyuşmazlık bulunmadığı gerekçesiyle reddetmiştir."
      - "14'e 2 oyla yetkisini kullanamayacağına karar vermiştir; çünkü rızası olmayan Endonezya'nın hak ve yükümlülüklerini belirlemek gerekecekti."
    dogru: 3
    aciklama: |
      Mahkeme "gerçek uyuşmazlık yok" itirazını reddetmiş, ama Endonezya'nın hak ve yükümlülükleri hükmün asıl konusu olacağından rızası olmayan devlet hakkında karar veremeyeceğini belirtmiştir. Erga omnes nitelik, yargı yetkisine rıza kuralının yerini tutmaz.
  - soru: |
      UAD'nin Kosova danışma görüşü (2010) ile ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Mahkeme, bağımsızlık ilanının uluslararası hukuku ihlal etmediği sonucuna varmış; ancak ayrılma hakkını (remedial secession) ve Kosova'nın devletliğini çözmemiştir."
      - "Mahkeme, Kosova'nın bir devlet olduğunu ve tanımaların geçerli olduğunu belirlemiştir."
      - "Mahkeme, ilanın uluslararası hukuku ihlal ettiğine karar vermiş ve ülke bütünlüğü ilkesini mutlak saymıştır."
      - "Mahkeme, halkın baskı altında olduğu durumlarda ayrılma hakkının bulunduğunu açıkça kabul etmiştir."
    dogru: 0
    aciklama: |
      Soru dardı ve yalnız ilanın uluslararası hukuka uygunluğunu içeriyordu. Mahkeme 10'a 4 oyla uygulanabilir bir kuralın ihlal edilmediğini söyledi; devletlik, tanıma ve remedial secession sorunlarını çözmedi. Ülke bütünlüğü ilkesinin kapsamını devletler arası ilişkilerle sınırlı saydı.
  - soru: |
      H devleti, yönettiği kendi kendini yönetmeyen Z ülkesinin bir adasını, bağımsızlıktan önce askerî üs kurmak için ayırıp ayrı bir sömürge yapmış, Z halkına danışmamıştır. Z bağımsız olduktan sonra ada H'de kalmıştır. UAD'nin Çagos görüşündeki yaklaşıma göre bu durum nasıl değerlendirilir?
    siklar:
      - "Hukuka uygundur, çünkü sömürge yöneten devlet ülkeyi dilediği gibi bölebilir."
      - "Hukuka uygundur, çünkü Z'nin sonradan bağımsız olması ayrılmayı sonradan geçerli kılar."
      - "Hukuka aykırıdır, çünkü halkın özgür ve gerçek iradesine dayanmayan parça ayırma self-determinasyona aykırıdır; sömürgeden kurtuluş hukuka uygun tamamlanmamıştır."
      - "Mahkeme bu soruya hiçbir ölçüt getirmemiştir."
    dogru: 2
    aciklama: |
      Çagos görüşünde Mahkeme, kendi kendini yönetmeyen ülkenin ülke bütünlüğü hakkını self-determinasyonun doğal sonucu olarak örf ve âdet kuralı saymış, halkın özgür iradesine dayanmayan parça ayırmanın self-determinasyona aykırı olduğunu belirtmiştir. Sömürge yönetimindeki Bakanlar Kurulu'nun onayı özgür ve gerçek irade sayılmamıştır.
  - soru: |
      1983 Devlet Malları, Arşivleri ve Borçlarına İlişkin Viyana Sözleşmesi'nin metnine göre, sömürgeden doğan yeni bağımsız devlete selefin devlet borcu hangi koşulda geçer?
    siklar:
      - "Selefin ve halefin aksi yönde anlaşması olmadıkça hiçbir devlet borcu geçmez; anlaşma doğal kaynaklar üzerindeki sürekli egemenliği de ihlal edemez."
      - "Her zaman tamamı geçer."
      - "Her zaman yarısı geçer."
      - "Yalnız alacaklı devletler talep ederse geçer."
    dogru: 0
    aciklama: |
      Sözleşme'nin 38. maddesine göre yeni bağımsız devlete, aralarında aksine anlaşma yoksa selefin devlet borcu geçmez. Not: 1983 Sözleşmesi yürürlüğe girmemiştir; soru metnin içeriğine ilişkindir.
olaylar:
  - olay: |
      A devleti, yönettiği sömürge ülke X'in bağımsızlığını 2027'de tanımıştır. Bağımsızlıktan önce A, X için şunları yapmıştı: B devleti ile X'in sınırını belirleyen bir antlaşma, C devleti ile iki taraflı bir ticaret antlaşması ve çok taraflı bir posta sözleşmesinin X ülkesine uygulanması. A, B, C ve X, 1978 Antlaşmalara İlişkin Devlet Halefiyeti Viyana Sözleşmesi'ne taraftır. Bağımsızlık sonrasında X hükûmeti "selefin antlaşmaları bizi bağlamaz, sınırımızı da yeniden konuşalım" demiştir. C devleti ticaret antlaşmasının sürdüğünü bildirmiş, X de bu antlaşma kapsamında C'ye ihracat kolaylıkları sağlamayı sürdürmüştür. X, posta sözleşmesine ise taraf olmayı düşünmektedir.
      1. X'in hukuki durumunu nitelendiriniz.
      2. X, B ile yapılan sınır antlaşmasından kurtulabilir mi?
      3. C ile ticaret antlaşması bakımından durum nedir?
      4. X, posta sözleşmesine nasıl taraf olabilir?
    olcut:
      - {tespit: "X'in sömürgeden doğan yeni bağımsız devlet olduğunun ve halefiyetin hukuka uygun olduğunun nitelendirilmesi", puan: 15, madde: "1978 Sözleşmesi'nin 2. maddesinin 1. fıkrasının (f) bendi"}
      - {tespit: "Temiz sayfa kuralı: antlaşmalar yalnız ülkede yürürlükte oldukları için bağlamaz", puan: 20, madde: "1978 Sözleşmesi'nin 16. maddesi"}
      - {tespit: "Antlaşmayla belirlenmiş sınırın halefiyetten etkilenmemesi", puan: 25, madde: "1978 Sözleşmesi'nin 11. maddesi"}
      - {tespit: "İkili ticaret antlaşmasının açık ya da davranışla anlaşmayla yürürlükte sayılması", puan: 20, madde: "1978 Sözleşmesi'nin 24. maddesi"}
      - {tespit: "Çok taraflı posta sözleşmesine halefiyet bildirimiyle taraf olunması", puan: 15, madde: "1978 Sözleşmesi'nin 17. maddesi"}
      - {tespit: "Borç sorusunun 1983 Sözleşmesi yürürlükte olmadığından olayın çözümüne alınmaması", puan: 5, madde: "1983 Sözleşmesi'nin 38. maddesi"}
    cozum: |
      **Nitelendirme:** Olayda bir sömürge ülke (X), yöneten devletten (A) bağımsızlaşmaktadır. X, halefiyetten hemen önce bağımlı bir ülke olduğundan 1978 Sözleşmesi anlamında **yeni bağımsız devlettir** (2. maddenin 1. fıkrasının (f) bendi). Halefiyetin uluslararası hukuka uygun gerçekleştiği varsayıldığından Sözleşme'nin uygulanması önünde engel yoktur (6. madde); bütün devletlerin Sözleşme'ye taraf olması uygulamayı kolaylaştırır.

      **Hukuki sorunlar:** (1) Selefin antlaşmaları X'i bağlar mı? (2) Sınır antlaşması bakımından temiz sayfa işler mi? (3) İkili antlaşma sürer mi? (4) Çok taraflı sözleşmeye katılma yolu nedir?

      **İlgili hükümler ve değerlendirme:** Yeni bağımsız devlet, bir antlaşmayı yalnız halefiyet tarihinde ülkesinde yürürlükte olduğu için sürdürmek ya da ona taraf olmak zorunda değildir (16. madde, temiz sayfa). Bu nedenle X hükûmetinin "selefin antlaşmaları bizi kendiliğinden bağlamaz" tezi genel olarak doğrudur.

      Ancak temiz sayfa sınırı silmez. Halefiyet, antlaşmayla belirlenmiş sınırı ve sınır rejimine ilişkin hak ve yükümlülükleri kendiliğinden etkilemez (11. madde). B ile yapılan sınır antlaşması bu nedenle X'i bağlamaya devam eder; X sınırı yeniden müzakere edebilir, ama tek taraflı olarak kendini sınırdan kurtulmuş sayamaz.

      Ticaret antlaşması iki taraflıdır. Bu tür antlaşma, yeni bağımsız devlet ile diğer taraf açıkça yürürlüğün sürdüğü konusunda anlaşırlarsa ya da davranışlarıyla böyle anlaşmış sayılırlarsa yürürlükte kabul edilir (24. madde). Olayda C antlaşmanın sürdüğünü bildirmiş, X ise ihracat kolaylıklarını sürdürmektedir; bu davranışlar davranışla anlaşma yönünde kuvvetli bir göstergedir. Ancak davranışın bu anlama gelip gelmediği olayın bütününe göre değerlendirilir.

      Posta sözleşmesi çok taraflı antlaşmadır. X, **halefiyet bildirimi** yaparak sözleşmeye taraf statüsünü kurabilir (17. madde); sözleşmenin konu ve amacıyla bağdaşmazlık bunun istisnasıdır.

      Devlet borcu ve mallar sorusu olayda yoktur; 1983 Sözleşmesi yürürlükte olmadığından bu konudaki kurallar bağlayıcı sayılmamalıdır.

      **Sonuç:** X yeni bağımsız devlettir. Temiz sayfa nedeniyle selefin antlaşmalarıyla kendiliğinden bağlı değildir, fakat B ile yapılan sınır antlaşması halefiyetten etkilenmez. Ticaret antlaşması açık ya da davranışla anlaşma halinde sürer; posta sözleşmesine halefiyet bildirimiyle taraf olunur.
  - olay: |
      D devleti, Y bölgesini antlaşma ile E devletine devretmiştir. Y'de D ile F devleti arasındaki yatırım antlaşması uygulanmaktaydı; E ise G devleti ile bir vergi antlaşması yapmıştı. D ile E, devir antlaşmasında "D'nin Y bölgesine ilişkin yükümlülükleri E'ye geçer" diye anlaşmışlardır. F devleti, E'nin yatırım antlaşmasına bağlı olduğunu ileri sürmektedir. Y'de yaşayan Ayşe, D vatandaşıdır ve Y'de mutad meskeni bulunmaktadır. D, E, F ve G, 1978 Sözleşmesi'ne taraftır.
      1. D-F yatırım antlaşması Y bakımından ne olur?
      2. E-G vergi antlaşması Y bakımından ne olur?
      3. F'nin, D ile E arasındaki devir anlaşmasından E aleyhine hak çıkarabileceği iddiasını değerlendiriniz.
      4. Ayşe'nin uyrukluğu bakımından hangi ilkeler dikkate alınır?
    olcut:
      - {tespit: "Olayın ülke parçası devri olarak nitelendirilmesi", puan: 15, madde: "1978 Sözleşmesi'nin 15. maddesi"}
      - {tespit: "D-F antlaşmasının Y bakımından halefiyet tarihinden itibaren sona ermesi", puan: 20, madde: "1978 Sözleşmesi'nin 15. maddesinin (a) bendi"}
      - {tespit: "E-G antlaşmasının Y'de halefiyet tarihinden itibaren yürürlüğe girmesi", puan: 20, madde: "1978 Sözleşmesi'nin 15. maddesinin (b) bendi"}
      - {tespit: "Devir anlaşmasının F'ye karşı E'yi yalnız bu nedenle bağlamaması", puan: 25, madde: "1978 Sözleşmesi'nin 8. maddesi"}
      - {tespit: "Uyrukluk için mutad mesken esası ve seçme hakkının dikkate alınması", puan: 15, madde: "UHK 1999 Maddeleri'nin 20. ve 11. maddeleri"}
      - {tespit: "UHK Maddeleri'nin antlaşma değil taslak metin olduğunun belirtilmesi", puan: 5, madde: "UHK 1999 Maddeleri"}
    cozum: |
      **Nitelendirme:** D, Y bölgesini mevcut bir devlet olan E'ye antlaşmayla devretmiştir. Bu, **ülke parçasının devridir**; yeni bir devlet doğmamıştır, dolayısıyla temiz sayfa (16. madde) ya da ayrılma kuralları (34. madde) değil, 15. madde uygulanır. Taraf devletlerin tümü 1978 Sözleşmesi'ne bağlıdır.

      **Hukuki sorunlar:** (1) Selefin ve halefin antlaşmalarının Y bakımından akıbeti nedir? (2) D ile E arasındaki devir anlaşması üçüncü devleti etkiler mi? (3) Y'de yaşayanların uyrukluğu nasıl belirlenir?

      **İlgili hükümler ve değerlendirme:** Ülke parçası devrinde selefin antlaşmaları o ülke bakımından halefiyet tarihinden itibaren yürürlükte olmaktan çıkar; halefin antlaşmaları aynı tarihten itibaren o ülkede yürürlüğe girer (15. madde). Dolayısıyla D-F yatırım antlaşması Y bakımından sona erer. E-G vergi antlaşması Y'de yürürlüğe girer. Antlaşmanın konu ve amacıyla bağdaşmazlık ya da uygulama koşullarının köklü değişmesi halinde sonuç farklı olabilir; olayda böyle bir bilgi yoktur.

      F'nin iddiası bakımından, selef ile halef arasında yapılan devir anlaşması, **yalnız bu nedenle** üçüncü devletler bakımından hak ve yükümlülük doğurmaz (8. madde). D ile E'nin "yükümlülükler E'ye geçer" şeklindeki anlaşması bu nedenle F'yi E'ye karşı otomatik olarak yatırım antlaşmasından hak sahibi yapmaz. Olayda E'nin F'nin iddiasını ayrıca kabul ettiğine dair bir bilgi de yoktur.

      Uyrukluk antlaşma konusu değildir. UHK'nin 1999 Maddeleri bağlayıcı bir antlaşma olmayıp Genel Kurul'un bir kararına ekli taslak metindir. Devirde kural olarak **mutad mesken** esası geçerlidir (20. madde): Y'de mutad meskeni bulunan Ayşe'nin E'nin uyrukluğunu kazandığı karine olarak kabul edilir (5. madde). Ayşe'ye makul bir süre içinde **seçme hakkı** tanınmalıdır (11. madde); vatansızlık önlenmelidir (4. madde).

      **Sonuç:** D-F antlaşması Y'de sona erer, E-G antlaşması Y'de başlar. Devir anlaşması F'ye karşı E'yi yalnız bu nedenle bağlamaz. Ayşe'nin uyrukluğu mutad mesken esası ve seçme hakkıyla çözülür; bu kurallar antlaşmadan değil, UHK Maddeleri'nden gelir.
kartlar:
  - on: "Devlet halefiyeti nedir?"
    arka: "Bir ülkenin uluslararası ilişkilerinden sorumlulukta bir devletin yerini başka bir devletin alması (1978 Sözleşmesi'nin 2. maddesinin 1. fıkrasının (b) bendi)."
  - on: "Devamlılık ile halefiyet arasındaki fark nedir?"
    arka: "Devamlılıkta devlet aynı hukuki kişi olarak sürer (örnek: Rusya Federasyonu'nun BM'de SSCB'nin yerini sürdürmesi); halefiyette yeni bir devlet selefin yerini alır."
  - on: "1978 ve 1983 Sözleşmeleri'nin durumu?"
    arka: "1978 Sözleşmesi 6 Kasım 1996'da yürürlüğe girdi; 1983 Sözleşmesi yürürlüğe girmedi. Türkiye 1978 Sözleşmesi'ne imzacı da taraf da değil."
  - on: "Yeni bağımsız devlet kimdir?"
    arka: "Halefiyetten hemen önce bağımlı ülke olan, yani sömürgeden doğan halef devlet. Temiz sayfa (16. madde) yalnız ona uygulanır."
  - on: "Temiz sayfa kuralı neyi söyler, neyi söylemez?"
    arka: "Yeni bağımsız devlet, yalnız ülkesinde yürürlükte olduğu için antlaşmayı sürdürmek zorunda değildir (16. madde). Ama antlaşmayla belirlenmiş sınır (11. madde) ve ülkesel rejimler (12. madde) etkilenmez."
  - on: "Ülke parçası devrinde antlaşmalara ne olur?"
    arka: "Selefin antlaşmaları o ülkede sona erer, halefinkiler başlar (15. madde, hareketli antlaşma sınırları)."
  - on: "Ayrılma ve dağılmada antlaşmalar?"
    arka: "Selefin bütün ülkesinde yürürlükteki antlaşma her halef bakımından devam eder (34. madde); yalnız ayrılan parçadakiler yalnız o halef için."
  - on: "Yeni bağımsız devlet çok taraflı antlaşmaya nasıl taraf olur?"
    arka: "Halefiyet bildirimiyle (17. madde). İkili antlaşma ise açık ya da davranışla anlaşmayla yürürlükte sayılır (24. madde)."
  - on: "Self-determinasyon BM Şartı'nda hak mı, ilke mi?"
    arka: "Şart'ın 1. maddesinin 2. fıkrasında ilke olarak geçer. 'Hak' ifadesi 1514 sayılı Genel Kurul kararında bulunur; bu kararlar kendiliğinden bağlayıcı değildir."
  - on: "1541 ve 2625 sayılı kararların seçenekleri?"
    arka: "1541 (1960): bağımsız devlet, serbest ortaklık, katılma. 2625 (1970) dördüncüsünü ekler: halkın serbestçe belirlediği başka siyasal statü."
  - on: "Doğu Timor (1995) kararında UAD ne yaptı?"
    arka: "14'e 2 oyla yetkisini kullanamayacağına karar verdi: Endonezya'nın rızası yoktu. Erga omnes nitelik, yargı yetkisine rızanın yerini tutmaz."
  - on: "Kosova (2010) ve Çagos (2019) görüşlerinin özeti?"
    arka: "Kosova: ilan uluslararası hukuku ihlal etmedi (10'a 4); ayrılma hakkı ve devletlik çözülmedi. Çagos: sömürgeden kurtuluş 1968'de hukuka uygun tamamlanmadı (13'e 1); halkın iradesi olmadan parça ayırma self-determinasyona aykırıdır."
