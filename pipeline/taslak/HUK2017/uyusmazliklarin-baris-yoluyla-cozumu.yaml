doktrin: |
  ### Otomatik çekince

  İç yetki alanına giren konuyu beyan sahibinin kendisinin belirlemesini öngören "otomatik" (öz-yargı) çekince tartışmalıdır. Bir görüşe göre bu çekince 36/6'ya aykırıdır ve çekince ya da bütün beyan geçersizdir. Karşı görüş, beyanın tek taraflı ve gönüllü olduğunu, devletin kapsamı istediği gibi belirleyebileceğini söyler. Divan bu soruyu genel olarak karara bağlamaktan kaçınmıştır.

  ### Beyanın geri alınması

  Nikaragua (1984) kararı, beyanın kendi bildirim şartına bağlı olduğunu gösterdi. Süresiz ve şartsız beyanların makul bir süre tanınmadan geri alınıp alınamayacağı öğretide tartışmalıdır.

  ### Geçici tedbir ölçütleri

  Tedbirin bağlayıcılığı LaGrand'dan beri tartışmasızdır. Ölçütler (ilk bakışta yetki, hakların makullüğü, telafisi imkânsız zarar, aciliyet) öğretide ayrıca tartışılır.

  ### 2. maddenin 3. fıkrasının kapsamı

  Yükümlülük yalnız barışı tehlikeye sokan uyuşmazlıklara mı (33. maddenin lafzı), yoksa bütün uyuşmazlıklara mı (2/3 ve 2625'in genel dili) uygulanır? Baskın görüş genel bir yükümlülük olduğudur; ama bu, belirli bir yola başvurma zorunluluğu getirmez.

  ### Tedbire uyulmamasında 94. madde

  BM Şartı'nın 94. maddesinin 2. fıkrası "karar" (judgment) için Konsey'e başvuruyu düzenler. Tedbir kararına uyulmaması hâlinde Konsey'e başvurulup başvurulamayacağı tartışmalıdır; LaGrand iki yorumu da açık bıraktı.
sozluk:
  - terim: Müzakere
    tanim: "Tarafların uyuşmazlığı doğrudan görüşmeyle çözmeye çalışması; en yaygın siyasi yol."
  - terim: Dostça aracılık (iyi niyet hizmeti)
    tanim: "Üçüncü tarafın yalnızca tarafları bir araya getirmesi; çözüm önermez."
  - terim: Arabuluculuk
    tanim: "Üçüncü tarafın görüşmelere katılıp çözüm önermesi; öneri bağlayıcı değildir."
  - terim: Uzlaştırma
    tanim: "Komisyonun olguları inceleyip bağlayıcı olmayan öneri raporu vermesi."
  - terim: Tahkim
    tanim: "Tarafların hakemleri, usulü ve uygulanacak hukuku özel anlaşmayla belirlediği, bağlayıcı karar veren hukuki yol."
  - terim: Özel anlaşma (compromis)
    tanim: "Tarafların mevcut uyuşmazlığı tahkime ya da UAD'ye götürmek için yaptığı anlaşma (UAD Statüsü'nün 36. maddesinin 1. fıkrası)."
  - terim: Yetki şartı (compromissory clause)
    tanim: "Antlaşmanın, ileride doğacak uyuşmazlıkları UAD'ye bırakan hükmü."
  - terim: İhtiyari kayıt (isteğe bağlı yargı yetkisi) beyanı
    tanim: "Devletin, aynı beyanı veren devletlere karşı UAD'nin zorunlu yargı yetkisini önceden tanıdığı tek taraflı beyan (36/2)."
  - terim: Karşılıklılık
    tanim: "Davalının, davacının beyanındaki çekincelerden de yararlanabilmesi; süre ve sona erme gibi biçimsel şartlara uygulanmaz."
  - terim: Ad hoc yargıç
    tanim: "Divan'da kendi uyruğundan yargıç bulunmayan tarafın bir davaya özgü seçtiği yargıç (UAD Statüsü'nün 31. maddesi)."
  - terim: Forum prorogatum
    tanim: "Tarafın Divan'ın yetkisini sonradan, açık bir mektup ya da davranışla gönüllü kabul etmesi."
kararlar:
  - uluslararasi: true
    mahkeme: Uluslararası Adalet Divanı
    ad: "Ege Denizi Kıta Sahanlığı (Yunanistan - Türkiye), yetki"
    tarih: "19.12.1978"
    kaynak: https://www.icj-cij.org/case/62
    ozet: |
      Yunanistan tek taraflı başvuruyla kıta sahanlığının sınırlandırılmasını istedi; Türkiye davaya katılmadı. Divan yetkisini kendiliğinden inceledi, müzakerelerin sürmesini engel saymadı. 1928 Genel Senedi, Yunanistan'ın "ülke statüsü" çekincesine Türkiye'nin karşılıklılık yoluyla dayanması nedeniyle; 1975 Brüksel Ortak Bildirisi ise yalnız ortak başvuruyu öngördüğü için yetki dayanağı olmadı. Divan 12'ye karşı 2 oyla yetkisiz olduğuna karar verdi.
  - uluslararasi: true
    mahkeme: Uluslararası Adalet Divanı
    ad: "Nikaragua'da ve Nikaragua'ya Karşı Askerî ve Paramiliter Faaliyetler (Nikaragua - ABD), yetki ve kabul edilebilirlik"
    tarih: "26.11.1984"
