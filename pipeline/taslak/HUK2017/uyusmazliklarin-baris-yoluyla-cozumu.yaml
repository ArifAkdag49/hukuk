      ABD, başvurudan günler önce 1946 beyanını Orta Amerika uyuşmazlıklarına uygulamayacağını bildirmişti; beyanı ise altı aylık fesih bildirimi gerektiriyordu. Divan, karşılıklılığın taahhüdün kapsamıyla ilgili olduğunu, beyanın süresi ve sona ermesi gibi biçimsel şartlara uygulanmadığını söyledi. Konsey'in konuyu incelemesi de engel olmadı. Divan yetkisini 11'e karşı 5 oyla kabul etti, başvuruyu oybirliğiyle kabul edilebilir buldu.
