slug: ulke-ve-ulke-edinme
beceriler:
  - anayasa-hukuku/temel-kavramlar-ve-sistem
maddeler: []
ozet: |
  - **Ülke** devletin unsurudur; kara ülkesi, iç sular ve karasuları ile bunların üzerindeki **hava sahasını** kapsar. Ülkesel egemenlik, ülkede **münhasır** devlet işlevlerini yerine getirme hakkıdır (Palmas).
  - **Ülke edinme yolları (öğreti sınıflandırması):** işgal (terra nullius üzerinde etkin işgal), devir (cession), kazandırıcı zamanaşımı (**tartışmalı**), doğal oluşum/eklenti, fetih (bugün hukuka aykırı). Kuvvetle edinilen ülke hukuka uygun tanınmaz (GK 2625).
  - **Palmas (1928):** keşif yalnız **tamamlanmamış (inchoate) hak** doğurur; makul sürede **etkin işgalle** tamamlanmalıdır. Bu hak, başka devletin sürekli ve barışçı otorite gösterimine üstün gelmez.
  - **Doğu Grönland (UDAD, 1933):** sürekli ve barışçı otorite gösterimi iki unsur ister: egemen olarak davranma **iradesi** ve otoritenin **fiilen kullanılması**. Kritik tarih 10 Temmuz 1931'dir. İhlen beyanı Norveç'i bağlar.
  - **Sınırlar:** **uti possidetis juris** sömürgesizleşmede bağımsızlık anındaki idari sınırı uluslararası sınıra çevirir; hukuki unvan fiilî zilyetliğe üstündür; haritalar tek başına unvan değil, delildir (Burkina Faso/Mali, 1986, UAD Dairesi).
  - **Pedra Branca (2008):** asli unvan, egemen sıfatıyla davranışa uzun süre tepkisiz kalınırsa kabullenmeyle başka devlete geçebilir; geçiş açık ve şüphesiz kanıtlanmalıdır.
  - **Hava sahası (Şikago Sözleşmesi, 1944):** her devlet ülkesi üzerindeki hava sahasında tam ve münhasır egemenliğe sahiptir (1); karasularının üzeri de dahildir (2). Sözleşme yalnız **sivil** hava araçlarına uygulanır (3). Tarifeli seferler izne bağlıdır (6), tarifesiz uçuşlar izne bağlı değildir (5). 3 bis: uçuştaki sivil uçağa karşı silah kullanmaktan kaçınma.
  - **Uzay (1967 Dış Uzay Antlaşması):** uzay, Ay ve gök cisimleri ulusal sahiplenmeye konu olamaz (II); keşif "bütün insanlığın alanı"dır (I); kitle imha silahı yasağı (IV); devlet özel kuruluşların faaliyetinden de sorumludur (VI); sicil devleti yetki ve denetimi korur (VIII).
  - **1972 Sorumluluk Sözleşmesi:** yeryüzü ya da uçuştaki hava aracına zarar verilirse fırlatan devlet mutlak sorumludur (II); uzayda başka uzay cismine zarar için sorumluluk kusura bağlıdır (III). **1979 Ay Anlaşması** (11): Ay "insanlığın ortak mirası"dır.
anlatim: |
  ## 1. Ülke ve ülkesel egemenlik

  Ülke, devletin unsurlarından biridir (6. konuda Montevideo ölçütleriyle birlikte işlenir). Hukuki anlamda ülke şunlardan oluşur: **kara ülkesi**, **iç sular ve karasuları** ve bunların **üzerindeki hava sahası**. Karasuları ülkeye dahildir; deniz hukukunun ayrıntıları bu dersin kapsamında değildir.

  **Ülkesel egemenlik**, Island of Palmas kararında anlatıldığı gibi, devletin ülkesi üzerinde diğer devletleri **dışlayarak** devlet işlevlerini yerine getirme hakkıdır. Egemenliğin bağımsızlıkla ilişkisi 1. konudadır.

  ## 2. Ülke edinme yolları

  Aşağıdaki sınıflandırma **öğretiden** gelir; kitaplarda adlandırma ve sıra değişebilir.

  | Yol | Özü |
  |---|---|
  | İşgal | Terra nullius (kimsenin olmayan) ülkede etkin otorite kurma |
  | Devir (cession) | Antlaşmayla ülkenin devri; devralan, devredenin hakkından fazlasını alamaz |
  | Doğal oluşum / eklenti | Volkanik patlama, birikme gibi olaylarla kıyıda yeni toprak oluşması |
  | Kazandırıcı zamanaşımı | Uzun, barışçı, itirazsız egemenlik kullanımı; bağımsız bir yol olup olmadığı tartışmalı |
  | Fetih | Tarihsel bir başlık; bugün edinme yolu değil |

  > **Örnek:** Kıyı önünde volkanik bir patlamayla yeni bir ada doğarsa bu toprak kıyı devletinin ülkesine katılır (eklenti).

  > ⚠️ **Sınavda dikkat:** Kuvvet tehdidi ya da kullanılmasıyla elde edilen ülke edinmesi **hukuka uygun tanınmaz** (BM Genel Kurulu'nun 2625 (XXV) sayılı kararı). Kitaplardaki "fetih" başlığı bu yüzden tarihsel bilgidir. Kuvvet yasağının ayrıntıları 15. konudadır.

  ### 2.1. Keşif, işgal ve Palmas

  Island of Palmas (Miangas) davasında (Hollanda - ABD, tek hakem Max Huber, 4 Nisan 1928) ABD, hakkını 1898 Paris Antlaşması'yla İspanya'dan devralmıştı; İspanya ise adanın **keşfine** dayanıyordu. Hollanda uzun süreli devlet otoritesi gösterimine dayandı. Hakem, 19. yüzyıldan beri keşfin yalnızca **tamamlanmamış (inchoate) bir hak** doğurduğunu, bunun makul sürede **etkin işgalle** tamamlanması gerektiğini söyledi. Tamamlanmamış hak, başka devletin **sürekli ve barışçı** egemenlik gösterimine üstün gelemez. Sonuç olarak ada Hollanda ülkesidir. Keşfin etkisi kendi döneminin hukukuna göre değerlendirildiği için bu karar zamanlararası hukukun da örneğidir.

  Karardan öğretide şu pratik sonuç çıkarılır: devralan, devredenin hakkından fazlasını alamaz. Bu "nemo dat" biçimindeki formül karar metninde bu sözcüklerle geçmez, olgulardan çıkarılan bir öğreti ifadesidir.

  > ⚠️ **Sınavda dikkat:** **Keşif işgal değildir.** Keşif tek başına ülke kazandırmaz. İşgalin edinme yolu olabilmesi için ülkenin **terra nullius** olması ve işgalin **etkin** olması gerekir; başka devletin ülkesi işgalle edinilemez.

  ### 2.2. Etkin otorite gösterimi: Doğu Grönland

  Legal Status of Eastern Greenland davasında (Danimarka - Norveç, UDAD, 5 Nisan 1933) Norveçli avcılar 1931'de Doğu Grönland'da bayrak çekmiş, Norveç de önce bunu özel bir iş saymış, **10 Temmuz 1931** tarihli kararla bölgenin işgalini ilan etmişti. Norveç bölgenin terra nullius olduğunu ileri sürdü. Danimarka ise unvanını belirli bir işgal işlemine değil, **sürekli ve barışçı devlet otoritesi gösterimine** dayandırdı.

  UDAD şunları söyledi:

  - Böyle bir unvan **iki unsur** ister: egemen olarak davranma **iradesi** ve otoritenin **fiilen kullanılması**.
  - **Yasama**, egemenliğin en açık kullanım biçimlerindendir. Bölgenin Arktik ve ulaşılmaz niteliği ile rakip egemenlik iddiasının bulunmaması karşısında, daha az fiilî kullanım yeterli sayıldı.
  - **Kritik tarih** 10 Temmuz 1931'dir (Norveç'in işgal ilanı). İşgalden hemen önceki dönemde geçerli bir unvanın varlığı Danimarka için yeterlidir.
  - Norveç Dışişleri Bakanı İhlen'in 22 Temmuz 1919 tarihli sözlü beyanı, Norveç'i Grönland'ın hiçbir bölümünü işgal etmemekle **bağlar**. Divan bunu kesin bir tanıma değil, işgalden kaçınma taahhüdü olarak değerlendirdi. Dışişleri bakanının, görev alanındaki bir konuda yabancı temsilcinin talebine hükümeti adına verdiği cevap devleti bağlar (tek taraflı işlemler 2. konuda).
  - Karar 12'ye 2 oyla çıktı.

  > 💡 **Püf nokta:** Doğu Grönland'ın iki sınav cümlesi vardır: "irade + fiilî kullanım" ve "ıssızlık, unvanı kaybettirmez; az kullanım yeter". Ayrıca ıssız bir yerin terra nullius olduğu sonucu çıkmaz.

  ### 2.3. Kabullenme ve zımni geçiş: Pedra Branca

  Sovereignty over Pedra Branca/Pulau Batu Puteh (Malezya - Singapur, UAD, 23 Mayıs 2008) Singapur Boğazı'nın girişindeki küçük bir adaya ilişkindi. Üzerinde 1850-1851'de Singapur tarafından yapılan Horsburgh feneri vardır. Divan, **asli unvanın Johor Sultanlığı'nda** olduğunu kabul etti. Ancak Singapur'un adada egemen sıfatıyla (à titre de souverain) davranışlarına karşılık Malezya'nın uzun süre tepki vermemesi, 1953'te Johor'un adanın mülkiyetini iddia etmediğini bildirmesi ve Malezya'nın 1962-1975 tarihli resmî haritalarının adayı Singapur'a ait göstermesi nedeniyle egemenliğin **1980'e kadar Singapur'a geçtiğine** karar verdi.

  İlke: egemenlik antlaşmayla veya davranıştan doğan zımni anlaşmayla geçebilir; ama geçiş "açıkça ve şüpheye yer bırakmadan" kanıtlanmalıdır. Diğer devletin davranışının cevap gerektirdiği hâllerde sessizlik de bir anlam taşır. **Kabullenme, tanıma değildir:** tanıma açık irade beyanıdır, kabullenme sessizlikten çıkar.

  Aynı davada Middle Rocks Malezya'ya, South Ledge ise hangi devletin karasularında yer alıyorsa ona ait sayıldı. Oylar: Pedra Branca 12'ye 4 (Singapur), Middle Rocks 15'e 1 (Malezya), South Ledge 15'e 1.

  ## 3. Sınırlar

  - **Tahdit (delimitation)**, sınırın hukuki olarak belirlenmesi; **tespit (demarcation)**, arazide işaretlenmesidir (öğreti ayrımı).
  - **Kritik tarih** ve **effectivités** (devlet otoritesinin fiilî gösterimi) delil değerlendirmesinde belirleyicidir. Kritik tarihten sonra yapılan işlemler kural olarak dikkate alınmaz (öğreti).

  ### 3.1. Uti possidetis juris: Burkina Faso/Mali

  Frontier Dispute (Burkina Faso/Mali, UAD Dairesi, 22 Aralık 1986) iki eski Fransız Batı Afrikası parçasının sınırına ilişkindi ve tüm Divan değil, **Daire** tarafından oybirliğiyle karara bağlandı. Daire şunları söyledi:

  - **Uti possidetis juris** sömürgesizleşmede genel bir kuraldır; sömürge döneminin idari sınırları bağımsızlıkla **uluslararası sınıra dönüşür**. Amacı, sınırların tartışılmasından doğacak kardeş kavgalarını önlemektir. ADÖ'nün 1964 Kahire kararı bu ilkeyi benimsemişti.
  - İlke **hukuki unvanı fiilî zilyetliğe üstün tutar.** Effectivités unvan değil delildir.
  - İlke görünüşte **self-determinasyonla çatışır**; Afrika devletleri istikrar için bu ilkeyi bilinçli olarak seçmiştir (7. konuda halefiyet ve self-determinasyon).
  - **Haritalar** tek başına hiçbir zaman unvan oluşturmaz; "dış delil"dir. Değeri teknik güvenilirliğine ve tarafsızlığına bağlıdır. Tarafsız bir harita, başka delil yoksa belirleyici olabilir.
  - Mahkeme ex aequo et bono yetkisi (tarafların istemi) olmadan karar vermediği için hakkaniyetten değil, **infra legem hakkaniyetten** yararlandı: sınır olan Soum gölü, yağmur mevsimindeki en geniş alanı eşit bölünecek biçimde ikiye ayrıldı.

  > **Örnek:** P ve R devletleri aynı sömürge idaresinin iki idari biriminden 1962'de bağımsız oldu. Köyü 1950'lerden beri R'nin memurları yönetiyor; sömürge kararnamesi köyü P'nin birimine bırakıyor. Uti possidetis juris uygulanır: bağımsızlık anındaki hukuki sınır belirleyicidir, R'nin fiilî yönetimi delil rolündedir.

  ## 4. Hava sahası (1944 Şikago Sözleşmesi)

  Sözleşme 7 Aralık 1944'te imzalandı, 4 Nisan 1947'de yürürlüğe girdi. Kurallar şunlardır:

  - **Egemenlik (Şikago 1):** her devlet ülkesi üzerindeki hava sahasında tam ve münhasır egemenliğe sahiptir. "Tanır" (recognize) ifadesi, öğretide mevcut örf ve âdet kuralının teyidi diye okunur.
  - **Ülke (Şikago 2):** karasularının üzeri de ulusal hava sahasıdır; açık deniz üzeri değildir.
  - **Devlet hava araçları (Şikago 3):** Sözleşme yalnız **sivil hava araçlarına** uygulanır. Askerî, gümrük ve polis hizmetindeki hava araçları devlet hava aracıdır; bunlar başka devletin ülkesi üzerinde özel anlaşma ya da başka yolla izin almadan uçamaz ve inemez.
  - **3 bis maddesi:** her devlet uçuş hâlindeki sivil hava araçlarına karşı **silah kullanmaktan kaçınmalıdır**; önlemede yolcuların hayatı ve uçağın güvenliği tehlikeye atılamaz. İzinsiz uçan sivil uçaktan belirli bir havaalanına inmesi istenebilir ve uçak bu emre uymak zorundadır. Madde 1984'te kabul edildi, 1 Ekim 1998'de yürürlüğe girdi; eski kitaplarda "yürürlükte değil" diye geçebilir.
  - **Tarifesiz uçuş (Şikago 5):** tarifeli hizmet yapmayan hava araçları, önceden izin almadan girme, aktarmasız geçme ve ticari olmayan iniş hakkına sahiptir.
  - **Tarifeli uluslararası hizmet (Şikago 6):** devletin özel izni ya da yetkisi olmadan işletilemez.
  - **Kabotaj (Şikago 7):** devlet, ülkesindeki iki nokta arasında ücretli taşıma iznini yabancı hava araçlarına vermeyi reddedebilir.
  - **Pilotsuz hava aracı (Şikago 8):** devletin özel izni olmadan o ülke üzerinde uçurulamaz.
  - **Tescil (Şikago 17):** hava aracı kayıtlı olduğu devletin uyruğundadır.

  > ⚠️ **Sınavda dikkat:** Tarifesiz uçuş (5. madde) **izinsiz**, tarifeli sefer (6. madde) **izinlidir**. İkisi sık karıştırılır. Ayrıca Şikago Sözleşmesi devlet hava araçlarına uygulanmaz; 3. maddenin (c) bendi yalnızca izinsiz uçamayacaklarını söyler.

  ## 5. Uzay

  Hava sahası ile uzay arasındaki sınır **tartışmalıdır**; işlevsel ölçütü savunanlar ile mekânsal bir yükseklik (sık anılan yaklaşık 100 km, "Kármán çizgisi") isteyenler vardır. İki metinde de yükseklik yazmaz, bu yüzden rakam ezberlenmemelidir.

  ### 5.1. 1967 Dış Uzay Antlaşması

  GK 2222 (XXI) ekidir; 27 Ocak 1967'de imzaya açıldı, 10 Ekim 1967'de yürürlüğe girdi.

  - **I. madde:** keşif ve kullanım "bütün insanlığın alanıdır" (province of all mankind); herkese ayrımsız serbesttir.
  - **II. madde:** uzay, Ay ve gök cisimleri egemenlik iddiası, kullanma, işgal ya da başka bir yolla **ulusal sahiplenmeye konu olamaz** (resmî olmayan çeviri). Dış Uzay Antlaşması "ortak miras" demez; bu ifade Ay Anlaşması'ndadır.
  - **IV. madde:** nükleer silahları ve kitle imha silahlarını taşıyan cisimler Dünya yörüngesine yerleştirilemez, gök cisimlerine kurulamaz, uzaya konuşlandırılamaz. Ay ve gök cisimleri yalnız barışçı amaçla kullanılır: askerî üs, silah denemesi ve askerî manevra yasaktır; bilimsel amaçla askerî personel serbesttir. Uzay boşluğunun tamamen askerden arındırılması söz konusu değildir.
  - **V. madde:** astronotlar "insanlığın elçileri"dir.
  - **VI. madde:** devlet, uzay faaliyeti hükümet kuruluşlarınca ya da hükümet dışı kuruluşlarca yürütülsün, uluslararası sorumludur; hükümet dışı faaliyet izne ve sürekli denetime bağlıdır.
  - **VII. madde:** fırlatan devlet, cismin verdiği zarardan uluslararası sorumludur. **VIII. madde:** sicil devleti, cisim ve personel üzerinde yetki ve denetimi korur.

  ### 5.2. Sorumluluk ve Ay

  - **1972 Sorumluluk Sözleşmesi:** Dünya yüzeyinde ya da uçuştaki hava aracına verilen zarardan fırlatan devlet **mutlak (kusursuz)** sorumludur (II. madde); başka bir uzay cismine Dünya dışında verilen zararda sorumluluk **kusura bağlıdır** (III. madde).
  - **1979 Ay Anlaşması** (11. madde): Ay ve doğal kaynakları "insanlığın ortak mirası"dır. Dış Uzay Antlaşması'ndaki kavram ile bu kavram karıştırılmamalıdır.

  > **Örnek:** Bir devletin özel şirketi uydu fırlatırsa devlet bu faaliyetten Dış Uzay Antlaşması'nın VI. maddesi uyarınca sorumludur ve şirketin faaliyetini izne bağlayıp sürekli denetlemelidir. Şirket Ay'ın bir bölgesini "şirket ülkesi" ilan ederse bu ilan, II. madde uyarınca hükümsüzdür.

  ## 6. Denetim şeması: olay sorusunda sırayla

  1. Konu kara/deniz ülkesi mi, hava sahası mı, uzay mı?
  2. **Ülke edinme:** keşif mi, etkin işgal mi, devir mi? Terra nullius mu? Başka devletin sürekli ve barışçı otoritesi var mı? (Palmas, Doğu Grönland)
  3. **Kritik tarih** hangisi? O tarihte unvan var mı?
  4. **Sınır:** sömürgeden doğan devlet mi? Uti possidetis juris; effectivités yalnız delil; harita dış delil. (Burkina Faso/Mali)
  5. Egemenliğin **kabullenmeyle** geçip geçmediği (Pedra Branca).
  6. **Hava sahası:** sivil mi devlet hava aracı mı, tarifeli mi tarifesiz mi, karasuları üzeri mi? (Şikago 1, 2, 3, 5, 6)
  7. **Uzay:** sahiplenme yasağı, VI. madde sorumluluk, sicil devleti yetkisi.
kritik: |
  - 📌 **Palmas:** keşif yalnız tamamlanmamış (inchoate) hak doğurur; makul sürede etkin işgalle tamamlanmalıdır. Başka devletin sürekli ve barışçı otorite gösterimine üstün gelmez.
  - 📌 **Doğu Grönland (UDAD, 1933):** sürekli otorite gösterimi için iki unsur: egemen olarak davranma iradesi + fiilî kullanım. Kritik tarih 10 Temmuz 1931. Karar 12'ye 2.
  - ⚠️ **Keşif işgal değildir; terra nullius ıssız yer demek değildir.** Başka devletin ülkesi işgalle edinilemez.
  - 📌 **İhlen beyanı** (1919): kesin tanıma değil, Norveç'i Grönland'ın hiçbir bölümünü işgal etmemekle bağlayan taahhüt.
  - 📌 **Uti possidetis juris:** bağımsızlık anındaki idari sınır uluslararası sınır olur; hukuki unvan fiilî zilyetliğe üstündür (Burkina Faso/Mali, 22 Aralık 1986).
  - ⚠️ Burkina Faso/Mali **Divan'ın Dairesi** tarafından oybirliğiyle karara bağlanmıştır; harita tek başına unvan değil, dış delildir.
  - 📌 **Pedra Branca (2008):** asli unvan Johor'da; ama Singapur'un egemen sıfatıyla davranışı ve Malezya'nın tepkisizliği nedeniyle egemenlik 1980'e kadar Singapur'a geçti. Oylar: 12-4, 15-1, 15-1.
  - ⚠️ **Kabullenme ≠ tanıma.** Kabullenme sessizlikten çıkar ve "açıkça ve şüphesiz" kanıtlanmalıdır.
  - 📌 **Karasuları üzeri** ulusal hava sahasıdır; açık deniz üzeri değildir (Şikago 2).
  - 📌 **Şikago yalnız sivil hava araçlarına** uygulanır; askerî, gümrük ve polis hava araçları devlet hava aracıdır ve izin almadan uçamaz (Şikago 3).
  - ⚠️ **Tarifesiz uçuş (Şikago 5) izinsiz; tarifeli sefer (Şikago 6) izinlidir.** Uçuştaki sivil uçağa karşı silah kullanma 3 bis ile yasaktır (yürürlük 1 Ekim 1998).
  - 📌 **Dış Uzay Antlaşması:** II. madde sahiplenme yasağı; IV. madde kitle imha silahı yasağı, Ay'da askerî üs yasağı; VI. madde devletin özel faaliyetten sorumluluğu; VIII. madde sicil devleti yetkisi.
  - ⚠️ "Ortak miras" Ay Anlaşması'nın 11. maddesindedir; Dış Uzay Antlaşması "bütün insanlığın alanı" der.
  - 📌 **1972 Sorumluluk Sözleşmesi:** yeryüzü/uçuştaki hava aracı zararında mutlak sorumluluk; uzayda uzay cismine zararda kusur şartı.
doktrin: |
  ### Kazandırıcı zamanaşımı bağımsız bir yol mudur?

  Bir görüşe göre başkasının ülkesinde uzun süre, barışçı ve itirazsız egemenlik kullanmak ülke kazandırır. Karşı görüşe göre zamanaşımı için gereken süre belirsizdir; olan biti açıklayan kavram aslında kabullenmedir. Pedra Branca'da Divan sonucu "zamanaşımı" diye değil, davranışa dayalı **geçiş ve kabullenme** olarak kurdu.

  ### Hava sahası ile uzayın sınırı

  Bir görüşe göre faaliyetin niteliğine bakan işlevsel bir ölçüt uygulanmalıdır. Karşı görüşe göre mekânsal bir yükseklik (sıkça yaklaşık 100 km) belirlenmelidir. Her iki metinde de yükseklik yoktur, bu yüzden bir rakam kesin bilgi olarak verilmemelidir.

  ### Uzay kaynaklarının çıkarılması

  Bir görüşe göre Dış Uzay Antlaşması'nın II. maddesi yalnız **devletlerin** ulusal sahiplenmesini yasaklar; çıkarılan kaynak üzerinde mülkiyet mümkündür. Karşı görüşe göre her türlü sahiplenme ve mülkiyet bu yasağa aykırıdır; Ay Anlaşması'nın 11. maddesi ayrıca "ortak miras" ilkesini açıkça koyar.

  ### Uti possidetis ve self-determinasyon

  Burkina Faso/Mali, çatışmanın yalnız görünüşte olduğunu, Afrika devletlerinin istikrar için ilkeyi bilerek seçtiğini söyler. İlkenin sömürge dışı bağlamlarda (federasyonların dağılması gibi) uygulanıp uygulanmayacağı tartışmalıdır.

  ### Hukuka aykırı işgalin hükmü

  Doğu Grönland'da çoğunluk, Norveç'in işgalinin hukuka aykırı ve geçersiz ("unlawful and invalid") olduğu sonucuna varmıştır. Karşı oy kullanan yargıçlardan biri işgalin hukuka aykırılığını kabul etmiş, ama "geçersiz" denemeyeceğini savunmuştur.
sozluk:
  - terim: Terra nullius
    tanim: "Henüz hiçbir devletin egemenliği altında bulunmayan ülke; ancak ıssız olması bunun için yetmez."
  - terim: Etkin işgal
    tanim: "Terra nullius üzerinde devletin fiilen ve sürekli otorite kurması; keşfin tamamlanmasını sağlayan unsur (Palmas)."
  - terim: Tamamlanmamış hak (inchoate title)
    tanim: "Keşfin doğurduğu, makul sürede etkin işgalle tamamlanmazsa başka devletin sürekli ve barışçı otorite gösterimine yenilen hak."
  - terim: Devir (cession)
    tanim: "Ülkenin antlaşmayla bir devletten diğerine geçmesi; devralan, devredenin hakkından fazlasını alamaz."
  - terim: Kritik tarih
    tanim: "Unvanın değerlendirildiği tarih; Doğu Grönland'da 10 Temmuz 1931 (Norveç'in işgal ilanı)."
  - terim: Effectivités
    tanim: "Devlet otoritesinin fiilî gösterimi; uti possidetis juris karşısında unvan değil, delil rolündedir."
  - terim: Uti possidetis juris
    tanim: "Sömürgesizleşmede bağımsızlık anındaki idari sınırların uluslararası sınır olması ilkesi."
  - terim: Tahdit ve tespit
    tanim: "Tahdit sınırın hukuki olarak belirlenmesi, tespit arazide işaretlenmesidir (öğreti ayrımı)."
  - terim: Kabullenme (acquiescence)
    tanim: "Diğer devletin egemen sıfatıyla davranışına cevap gerektiği hâlde sessiz kalma; açıkça ve şüphesiz kanıtlanırsa egemenlik geçebilir (Pedra Branca)."
  - terim: İnfra legem hakkaniyet
    tanim: "Hukuka dayanan, hukukun yorumunu amaçlayan hakkaniyet; ex aequo et bono ile karıştırılmaz."
  - terim: Devlet hava aracı
    tanim: "Askerî, gümrük ve polis hizmetindeki hava aracı; Şikago Sözleşmesi uygulanmaz, izin olmadan başka devlet ülkesinde uçamaz."
  - terim: Fırlatan devlet
    tanim: "Uzay cismini fırlatan ya da fırlattıran devlet; zarardan Dış Uzay Antlaşması ve 1972 Sorumluluk Sözleşmesi uyarınca sorumludur."
sorular:
  - soru: |
      Island of Palmas kararına göre bir devletin bir ada üzerindeki keşfi hangi hukuki sonucu doğurur?
    siklar:
      - "Adanın tam egemenliğini hemen ve süresiz olarak kazandırır."
      - "Yalnız tamamlanmamış bir hak doğurur; makul sürede etkin işgalle tamamlanmalıdır."
      - "Keşfin hiçbir hukuki etkisi yoktur; yalnız devir ülke kazandırır."
      - "Keşfeden devlet, başka devletin fiilî otorite gösterimine her zaman üstün gelir."
    dogru: 1
    aciklama: |
      Palmas'ta tek hakem Huber, 19. yüzyıldan beri keşfin tamamlanmamış (inchoate) bir hak doğurduğunu, bunun makul sürede etkin işgalle tamamlanması gerektiğini ve başka devletin sürekli ve barışçı egemenlik gösterimine üstün gelemeyeceğini söylemiştir.
  - soru: |
      Bir devletin karasularının üzerindeki hava sahası, 1944 Şikago Sözleşmesi'ne göre hangi niteliktedir?
    siklar:
      - "Açık deniz üzeri gibi serbesttir."
      - "Yalnız sivil uçuşlara kapalıdır; askerî uçuşlar serbesttir."
      - "Ulusal hava sahasına dahildir; devletin tam ve münhasır egemenliği altındadır."
      - "Uluslararası örgütün (ICAO) ortak yönetimi altındadır."
    dogru: 2
    aciklama: |
      Şikago Sözleşmesi'nin 1. maddesi her devletin ülkesi üzerindeki hava sahasında tam ve münhasır egemenlik sahibi olduğunu, 2. maddesi ise ülkenin karasularını da kapsadığını söyler. Açık deniz üzeri ulusal hava sahası değildir.
  - soru: |
      S devletinin tescilli sivil yolcu uçağı, tarifeli sefer yaparken T devletinin ülkesi üzerinden T'nin izni olmaksızın geçmek istemektedir. Şikago Sözleşmesi'ne göre durum nedir?
    siklar:
      - "Tarifeli uluslararası hava hizmeti, üzerinden uçulan devletin özel izni ya da yetkisi olmadan işletilemez."
      - "Tarifeli seferlerin izne ihtiyacı yoktur; yalnız tarifesiz uçuşlar izne bağlıdır."
      - "Sivil uçaklar için izin hiçbir hâlde gerekmez."
      - "İzin yalnız uçak askerî nitelikteyse gerekir."
    dogru: 0
    aciklama: |
      Şikago Sözleşmesi'nin 6. maddesi tarifeli uluslararası hava hizmetlerini devletin özel izni ya da yetkisine bağlar. Tarifesiz uçuşlar ise 5. madde uyarınca önceden izin alma zorunluluğu olmadan girme, aktarmasız geçme ve ticari olmayan iniş hakkına sahiptir; bu iki madde sık karıştırılır.
  - soru: |
      S devletinin askerî keşif uçağı, T devletinin ülkesi üzerinde izin almadan uçmaktadır. S, "Şikago Sözleşmesi'ne göre bir devletin ülkesi üzerinde uçuş serbesttir" demektedir. Doğru değerlendirme hangisidir?
    siklar:
      - "Sözleşme tüm hava araçlarına uygulanır ve serbest uçuş hakkı tanır."
      - "Askerî uçaklar yalnız karasuları üzerinde izin almak zorundadır."
      - "Sözleşme yalnız sivil hava araçlarına uygulanır; askerî uçak devlet hava aracıdır ve özel anlaşma ya da başka bir izin olmadan başka devletin ülkesi üzerinde uçamaz."
      - "Askerî uçak, Sözleşme'ye taraf olduğu için tarifesiz uçuş hakkından yararlanır."
    dogru: 2
    aciklama: |
      Şikago Sözleşmesi'nin 3. maddesi Sözleşme'nin yalnız sivil hava araçlarına uygulanacağını; askerî, gümrük ve polis hizmetindeki hava araçlarının devlet hava aracı sayıldığını ve bunların başka devletin ülkesi üzerinde özel anlaşma ya da başka yolla izin olmadan uçamayacağını söyler.
  - soru: |
      S devletindeki özel bir şirket, Ay'da bir bölgeyi "şirket ülkesi" ilan etmiştir. Dış Uzay Antlaşması bakımından en doğru değerlendirme hangisidir?
    siklar:
      - "İlan, şirket özel olduğu için antlaşma kapsamı dışındadır ve geçerlidir."
      - "İlan, S devleti onaylarsa geçerli olur."
      - "Ay yalnız devletlerce sahiplenilemez; özel şirketler serbestçe sahiplenebilir."
      - "Ay ulusal sahiplenmeye konu olamaz; ayrıca S devleti şirketin faaliyetinden uluslararası sorumludur ve faaliyeti izne ve sürekli denetime bağlamalıdır."
    dogru: 3
    aciklama: |
      Dış Uzay Antlaşması'nın II. maddesi uzayın, Ay ve gök cisimleri dahil, egemenlik iddiası, kullanma, işgal ya da başka yolla ulusal sahiplenmeye konu olamayacağını söyler. VI. madde devletin hükümet dışı kuruluşların faaliyetinden de sorumlu olduğunu, bu faaliyetin izin ve sürekli denetim gerektirdiğini belirtir. Özel şirketlerin mülkiyeti konusu ise doktrinde tartışmalıdır.
  - soru: |
      Bir devletin uzay cismi, Dünya yüzeyinde bir kişinin evine düşerek zarar vermiştir. 1972 Sorumluluk Sözleşmesi'ne göre fırlatan devletin sorumluluğu nasıldır?
    siklar:
      - "Yalnız fırlatan devletin kusuru ispatlanırsa sorumludur."
      - "Mutlak (kusursuz) sorumludur."
      - "Sorumluluk yalnız uzay cismi sicil devletine aittir, fırlatan devlete değil."
      - "Evin bulunduğu devlet zararı kendisi karşılar."
    dogru: 1
    aciklama: |
      1972 Sorumluluk Sözleşmesi'nin II. maddesi, Dünya yüzeyinde ya da uçuştaki hava aracına verilen zararda fırlatan devleti mutlak (kusursuz) sorumlu tutar. Başka bir uzay cismine Dünya dışında verilen zararda sorumluluk ise III. madde uyarınca kusura bağlıdır.
  - soru: |
      Doğu Grönland davasında UDAD'ye göre sürekli ve barışçı devlet otoritesi gösterimine dayalı egemenlik iddiası hangi iki unsuru gerektirir?
    siklar:
      - "Keşif ve bayrak dikme"
      - "Egemen olarak davranma iradesi ile otoritenin fiilen kullanılması"
      - "Komşu devletin tanıması ile uluslararası örgüt kaydı"
      - "Yerleşik nüfusun varlığı ile devletin sivil idaresi"
    dogru: 1
    aciklama: |
      UDAD, Danimarka'nın unvanının sürekli ve barışçı devlet otoritesi gösterimine dayandığını, bunun iki unsurunun egemen olarak davranma iradesi ve bu otoritenin bir ölçüde fiilen kullanılması olduğunu belirtmiştir. Fiilî kullanımın yoğunluğu bölgenin niteliğine göre değişir; Arktik ve ulaşılmaz bölgede az kullanım yeterli sayılmıştır.
  - soru: |
      Doğu Grönland kararında Norveç Dışişleri Bakanı İhlen'in 1919 beyanıyla ilgili olarak UDAD hangi sonuca varmıştır?
    siklar:
      - "Beyan hukuki sonuç doğurmayan bir nezaket ifadesidir."
      - "Beyan, Norveç'i Grönland'ın hiçbir bölümünü işgal etmemekle yükümlü kılan, devleti bağlayan bir taahhüttür."
      - "Beyan, Danimarka'nın egemenliğinin kesin ve nihai tanınmasıdır."
      - "Beyan yalnız Norveç Parlamentosu onaylarsa bağlayıcıdır."
    dogru: 1
    aciklama: |
      UDAD, dışişleri bakanının, yabancı temsilcinin talebi üzerine görev alanındaki bir konuda hükümeti adına verdiği cevabın devleti bağladığını belirtmiş; İhlen beyanını kesin bir tanıma olarak değil, Norveç'i Grönland'ın hiçbir bölümünü işgal etmemekle yükümlü kılan bir taahhüt olarak değerlendirmiştir.
  - soru: |
      P ve R devletleri aynı sömürge idaresinin iki ayrı idari biriminden bağımsız olmuştur. Sınırdaki bir köyü fiilen R yönetmekte, sömürge kararnamesi ise köyü P'nin idari birimine bağlamaktadır. Burkina Faso/Mali kararındaki ilkeye göre hangisi doğrudur?
    siklar:
      - "Fiilî yönetim her zaman hukuki unvana üstündür; köy R'nindir."
      - "Karar ex aequo et bono ile köyün yarıya bölünmesi yoluyla verilir."
      - "Bağımsızlık anındaki idari sınır uluslararası sınırdır; hukuki unvan fiilî zilyetliğe üstün tutulur, R'nin yönetimi yalnız delil olarak değerlendirilir."
      - "Sömürge kararnameleri bağımsızlıktan sonra hükümsüzdür."
    dogru: 2
    aciklama: |
      Burkina Faso/Mali kararında Daire, uti possidetis juris ilkesinin hukuki unvanı fiilî zilyetliğe üstün tuttuğunu ve idari sınırları bağımsızlıkla uluslararası sınıra dönüştürdüğünü belirtmiştir. Effectivités (fiilî yönetim) delil niteliğindedir. Kararda ex aequo et bono uygulanmamış, yalnız infra legem hakkaniyet gözetilmiştir.
  - soru: |
      Bir sınır uyuşmazlığında taraflardan biri, kendi hazırladığı bir haritaya dayanarak ülke unvanı iddia etmektedir. Burkina Faso/Mali kararına göre harita hakkında hangisi doğrudur?
    siklar:
      - "Resmî olarak basılmış her harita, tek başına ülke unvanı oluşturur."
      - "Haritalar hiçbir zaman delil olarak kullanılamaz."
      - "Harita yalnız bağımsızlıktan sonra çizilmişse delildir."
      - "Harita tek başına hiçbir zaman unvan değildir; dış delildir ve değeri teknik güvenilirliğine ve tarafsızlığına bağlıdır."
    dogru: 3
    aciklama: |
      Daire, haritaların tek başına hiçbir zaman unvan oluşturmadığını, diğer delillerle birlikte değerlendirilen dış delil olduğunu ve değerinin teknik güvenilirlik ile tarafsızlığa bağlı bulunduğunu belirtmiştir. Tarafsız bir harita, başka delil yetmezse belirleyici olabilir.
  - soru: |
      Pedra Branca kararında UAD, Malezya'nın Johor Sultanlığı'na dayanan asli unvanına rağmen adayı Singapur'a vermiştir. Divan'ı bu sonuca götüren dayanak hangisidir?
    siklar:
      - "Singapur'un egemen sıfatıyla uzun süre davranması ve Malezya'nın buna cevap gerektiren durumda tepkisiz kalması nedeniyle egemenliğin kabullenmeyle geçmesi."
      - "Singapur'un adayı terra nullius olarak ilk kez işgal etmesi."
      - "Malezya'nın adayı kuvvet kullanarak Singapur'a devretmesi."
      - "Adanın kazandırıcı zamanaşımıyla Singapur'a geçtiğinin Divan'ca açıkça ilan edilmesi."
    dogru: 0
    aciklama: |
      Divan asli unvanın Johor'da olduğunu kabul etmiş, ancak Singapur'un egemen sıfatıyla davranışlarına karşılık Malezya'nın tepkisizliği, 1953'te Johor'un mülkiyet iddia etmediğini bildirmesi ve Malezya'nın resmî haritaları nedeniyle egemenliğin 1980'e kadar Singapur'a geçtiğine karar vermiştir. Sonuç "zamanaşımı" olarak değil, davranışa dayalı geçiş ve kabullenme olarak kurulmuştur; ada terra nullius değildi.
  - soru: |
      A devleti 1890'da ıssız bir adayı keşfetmiş, bayrak dikmiş, sonra bir daha hiçbir işlem yapmamıştır. B devleti 1920'den beri adada fener işletmekte, adayı idari bölümüne bağlayan yasa çıkarmakta, vergi ve av izni vermektedir; A itiraz etmemiştir. Palmas ve Doğu Grönland kararları ışığında hangisi doğrudur?
    siklar:
      - "A'nın keşfi tek başına egemenlik kazandırır; B'nin işlemleri hükümsüzdür."
      - "Ada ıssız olduğu için B'nin işlemleri yetersizdir; unvan doğmaz."
      - "Sonuç, adanın A ve B arasında yarı yarıya bölünmesidir."
      - "A'nın keşfi yalnız tamamlanmamış bir hak doğurmuş, B'nin sürekli ve barışçı otorite gösterimi (irade ve fiilî kullanım) unvan doğurmuştur."
    dogru: 3
    aciklama: |
      Palmas'a göre keşif yalnız tamamlanmamış bir hak doğurur; etkin işgalle tamamlanmadıkça başka devletin sürekli ve barışçı otorite gösterimine üstün gelmez. Doğu Grönland'a göre bu gösterim iradeyi ve fiilî kullanımı gerektirir; yasama en açık biçimlerden biridir ve ıssızlık aleyhe sayılmaz, çünkü ulaşılmaz bölgelerde az kullanım yeterli olabilir.
olaylar:
  - olay: |
      Okyanustaki X adası ıssız bir kayalıktır. A devleti 1890'da adayı keşfetmiş, bayrak dikmiş ve bir tutanak tutmuş, ancak sonraki yıllarda adada hiçbir idari, hukuki ya da fiilî işlem yapmamıştır. B devleti 1920'den itibaren adaya bir fener kurmuş, adayı kendi idari bölümüne bağlayan bir yasa çıkarmış, adada av izni ve vergi uygulamış, ada çevresinde düzenli devriye yapmıştır. A devleti bu işlemlerin hiçbirine itiraz etmemiştir. 2024'te A, bayrak diktiği tarihe dayanarak adanın kendisine ait olduğunu ileri sürmüş ve uyuşmazlık uluslararası yargıya götürülmüştür. A ayrıca, adanın ıssız olması nedeniyle B'nin fiilî kullanımının "yetersiz" kaldığını iddia etmektedir.

      1. A'nın 1890'daki keşfi egemenlik unvanı doğurur mu?
      2. B'nin unvanı hangi unsurlara dayanır?
      3. Adanın ıssız olması B'nin aleyhine midir?
      4. Bu uyuşmazlıkta kritik tarih ne işe yarar?
    olcut:
      - {tespit: "Keşif yalnız tamamlanmamış (inchoate) hak doğurur; makul sürede etkin işgalle tamamlanmalıdır", puan: 25, madde: "Island of Palmas kararı (1928)"}
      - {tespit: "Tamamlanmamış hakkın başka devletin sürekli ve barışçı otorite gösterimine üstün gelememesi; A'nın itiraz etmemesi", puan: 20, madde: "Island of Palmas kararı (1928)"}
      - {tespit: "B'nin unvanının iki unsuru: egemen olarak davranma iradesi ve otoritenin fiilen kullanılması", puan: 20, madde: "Doğu Grönland kararı (UDAD, 1933)"}
      - {tespit: "Yasama (adayı idari bölüme bağlayan yasa) egemenliğin en açık kullanım biçimlerindendir", puan: 15, madde: "Doğu Grönland kararı (UDAD, 1933)"}
      - {tespit: "Issızlık aleyhe değildir; ulaşılmaz bölgede az fiilî kullanım yeterli olabilir", puan: 10, madde: "Doğu Grönland kararı (UDAD, 1933)"}
      - {tespit: "Kritik tarihte unvanın varlığı değerlendirmenin ölçüsüdür", puan: 10, madde: "Doğu Grönland kararı (UDAD, 1933)"}
    cozum: |
      **Nitelendirme:** Olay, ıssız bir kayalığın egemenliğine ilişkin, keşif ile etkin otorite gösterimi arasındaki yarışı içerir.

      **Hukuki sorunlar:** (1) Keşfin hukuki değeri; (2) B'nin unvanını kuran unsurlar; (3) ıssızlığın etkisi; (4) kritik tarihin rolü.

      **İlgili hükümler ve değerlendirme:** Island of Palmas kararında tek hakem Huber, 19. yüzyıldan beri keşfin yalnız tamamlanmamış (inchoate) bir hak doğurduğunu, bu hakkın makul bir sürede etkin işgalle tamamlanması gerektiğini ve tamamlanmamış hakkın başka devletin sürekli ve barışçı egemenlik gösterimine üstün gelemeyeceğini belirtmiştir. Olayda A, 1890'daki bayrak dikme ve tutanaktan sonra hiçbir işlem yapmamıştır; bu nedenle keşfi tamamlanmamış hak olarak kalmış ve etkin işgalle tamamlanmamıştır. Keşfin kendi döneminin hukukuna göre değerlendirilmesi (zamanlararası hukuk) de bu sonucu destekler.

      B'nin unvanı ise Doğu Grönland kararındaki ölçüte dayanır: sürekli ve barışçı devlet otoritesi gösterimi, egemen olarak davranma iradesi ve otoritenin fiilen kullanılması olmak üzere iki unsur ister. B'nin adayı idari bölümüne bağlayan yasa çıkarması hem iradeyi hem kullanımı gösterir; UDAD yasamayı egemenliğin en açık kullanım biçimlerinden saymıştır. Fener kurulması, vergi ve av izni uygulaması ile düzenli devriye de fiilî kullanımın somut örnekleridir. A'nın bu işlemlere itiraz etmemesi, B'nin gösteriminin barışçı ve rakipsiz sürmesine katkıda bulunur.

      A'nın ıssızlık itirazı da yerinde değildir. Doğu Grönland'da UDAD, bölgenin Arktik ve ulaşılmaz niteliği ile rakip bir egemenlik iddiasının bulunmaması karşısında az sayıdaki fiilî otorite gösteriminin yeterli olabileceğini belirtmiştir. Issız bir yerin terra nullius olduğu sonucu çıkmaz; ayrıca fiilî kullanımın yoğunluğu bölgenin niteliğine göre değişir. Kritik tarih ise unvanın hangi tarihe göre değerlendirileceğini belirler; Doğu Grönland'da bu tarih, işgalden hemen önceki döneme bakılarak 10 Temmuz 1931 olarak alınmıştır. Kritik tarihten sonra yapılan işlemlerin kural olarak dikkate alınmadığı öğretide kabul edilir.

      **Sonuç:** A'nın keşfi unvan doğurmaz, yalnız tamamlanmamış hak olarak kalır; B'nin sürekli ve barışçı otorite gösterimi irade ve fiilî kullanım unsurlarını karşıladığı için adada B'nin unvanı doğmuştur. Issızlık B'nin aleyhine değildir.
  - olay: |
      S devletine ait, kendi sicilinde kayıtlı sivil bir yolcu uçağı, tarifeli bir uluslararası sefer yaparken T devletinin karasuları üzerinden, T'nin hiçbir izni olmaksızın geçmektedir. Aynı gün S'nin askerî keşif uçağı da T'nin ülkesi üzerinde izinsiz uçmaktadır. T, sivil uçağı durdurup iniş yapmaya zorlamak, gerekirse silah kullanmak istemektedir. Bunun yanında S'deki özel bir uzay şirketi, Ay'ın kuzey bölgesini "şirket ülkesi" ilan etmiş ve bu bölgede sınırlı bir madencilik başlatacağını duyurmuştur. Şirketin faaliyeti S'nin onayına tabi değildir ve denetlenmemektedir. T, S'nin sorumluluğunu ileri sürmektedir.

      1. T'nin karasuları üzerindeki hava sahası hukuken kime aittir?
      2. Tarifeli sivil uçağın izinsiz geçişi ve T'nin silah kullanma niyeti hakkında ne söylenebilir?
      3. S'nin askerî keşif uçağının izinsiz uçuşu hukuka uygun mudur?
      4. Şirketin Ay'daki ilanı geçerli midir; S'nin sorumluluğu var mıdır?
    olcut:
      - {tespit: "Karasuları üzerindeki hava sahası T'nin tam ve münhasır egemenliği altındadır", puan: 15, madde: "Şikago Sözleşmesi'nin 1 ve 2. maddeleri"}
      - {tespit: "Tarifeli uluslararası sefer, T'nin özel izni olmadan işletilemez", puan: 15, madde: "Şikago Sözleşmesi'nin 6. maddesi"}
      - {tespit: "Askerî keşif uçağı devlet hava aracıdır; izin olmadan başka devletin ülkesi üzerinde uçamaz", puan: 20, madde: "Şikago Sözleşmesi'nin 3. maddesi"}
      - {tespit: "Uçuştaki sivil uçağa karşı silah kullanmaktan kaçınma yükümlülüğü; T iniş isteyebilir, uçak buna uymalıdır", puan: 20, madde: "Şikago Sözleşmesi'nin 3 bis maddesi"}
      - {tespit: "Ay ulusal sahiplenmeye konu olamaz; şirketin ilanı geçersizdir", puan: 15, madde: "Dış Uzay Antlaşması'nın II. maddesi"}
      - {tespit: "S, hükümet dışı kuruluşun uzay faaliyetinden uluslararası sorumludur; faaliyet izin ve sürekli denetime bağlıdır", puan: 15, madde: "Dış Uzay Antlaşması'nın VI. maddesi"}
    cozum: |
      **Nitelendirme:** Olay hava sahası egemenliği (sivil ve devlet hava araçları) ile uzayın hukuki rejimi (ulusal sahiplenme yasağı ve devlet sorumluluğu) sorunlarını bir arada içerir.

      **Hukuki sorunlar:** (1) Karasuları üzerindeki hava sahasının hukuki durumu; (2) tarifeli sivil sefer ve silah kullanma; (3) devlet hava aracının izinsiz uçuşu; (4) Ay'ın sahiplenilmesi ve devletin sorumluluğu.

      **İlgili hükümler ve değerlendirme:** Şikago Sözleşmesi'nin 1. maddesi her devletin ülkesi üzerindeki hava sahasında tam ve münhasır egemenliğe sahip olduğunu, 2. maddesi ise ülkenin karasularını da kapsadığını belirtir. Dolayısıyla T'nin karasuları üzerindeki hava sahası T'nin ulusal hava sahasıdır; açık deniz üzerinden farklı olarak serbest değildir.

      Sivil uçağın seferi tarifeli olduğundan 6. madde uygulanır: tarifeli uluslararası hava hizmeti, üzerinden uçulan devletin özel izni ya da yetkisi olmadan işletilemez. Tarifesiz uçuşlara tanınan izinsiz giriş ve geçiş hakkı (5. madde) burada geçerli değildir. Böylece uçuş izinsizdir ve T'nin tepki hakkı vardır. Ancak 3 bis maddesi her devleti uçuştaki sivil hava araçlarına karşı silah kullanmaktan kaçınmakla yükümlü kılar; önlemede yolcuların hayatı ve uçağın güvenliği tehlikeye atılamaz. T, uçaktan belirli bir havaalanına inmesini isteyebilir ve uçak bu emre uymak zorundadır; ama silah kullanamaz. Madde 1984'te kabul edilmiş, 1 Ekim 1998'de yürürlüğe girmiştir.

      Askerî keşif uçağı bakımından 3. madde belirleyicidir: Sözleşme yalnız sivil hava araçlarına uygulanır; askerî, gümrük ve polis hizmetindeki hava araçları devlet hava aracıdır ve başka devletin ülkesi üzerinde özel anlaşma ya da başka yolla izin olmadan uçamaz ve inemez. S'nin keşif uçağının izinsiz uçuşu hukuka aykırıdır.

      Ay konusunda Dış Uzay Antlaşması'nın II. maddesi, Ay ve gök cisimleri dahil uzayın egemenlik iddiası, kullanma, işgal ya da başka bir yolla ulusal sahiplenmeye konu olamayacağını söyler. Şirketin "şirket ülkesi" ilanı bu nedenle geçersizdir. VI. madde ise devletin, uzay faaliyeti hükümet dışı kuruluşlarca yürütülse bile uluslararası sorumlu olduğunu ve bu faaliyetin izin ile sürekli denetim gerektirdiğini belirtir. S bu denetimi yapmadığı için sorumludur. Özel mülkiyet ve kaynak çıkarma konusu doktrinde tartışmalıdır; olayın sonucu bu tartışmaya bağlı değildir.

      **Sonuç:** Karasuları üzeri T'nin hava sahasıdır; tarifeli sivil sefer izinsiz yapılamaz ama silah kullanılamaz; askerî uçağın izinsiz uçuşu hukuka aykırıdır; Ay ulusal sahiplenmeye konu olamaz ve S, şirketin faaliyetinden sorumludur.
kartlar:
  - on: "Palmas'a göre keşif ne tür hak doğurur?"
    arka: "Yalnız tamamlanmamış (inchoate) hak; makul sürede etkin işgalle tamamlanmalıdır ve başka devletin sürekli ve barışçı otorite gösterimine üstün gelmez."
  - on: "Doğu Grönland'a göre otorite gösterimine dayalı egemenliğin iki unsuru nedir?"
    arka: "Egemen olarak davranma iradesi ve otoritenin fiilen kullanılması (UDAD, 5 Nisan 1933, 12'ye 2). Kritik tarih 10 Temmuz 1931."
  - on: "İhlen beyanı nedir ve hukuki sonucu nedir?"
    arka: "Norveç Dışişleri Bakanı'nın 1919 tarihli sözlü cevabı; kesin tanıma değil, Norveç'i Grönland'ın hiçbir bölümünü işgal etmemekle bağlayan taahhüt."
  - on: "Uti possidetis juris ne söyler?"
    arka: "Bağımsızlık anındaki sömürge idari sınırı uluslararası sınır olur; hukuki unvan fiilî zilyetliğe üstündür (Burkina Faso/Mali, UAD Dairesi, 22 Aralık 1986, oybirliği)."
  - on: "Burkina Faso/Mali'ye göre harita ve effectivités ne değerdedir?"
    arka: "Harita tek başına unvan değildir, dış delildir; değeri teknik güvenilirlik ve tarafsızlığa bağlıdır. Effectivités unvan değil, delildir."
  - on: "Pedra Branca'da egemenlik nasıl Singapur'a geçti?"
    arka: "Asli unvan Johor'daydı; Singapur'un egemen sıfatıyla davranışı ve Malezya'nın tepkisizliği (kabullenme) nedeniyle 1980'e kadar geçti. Oylar 12-4 (Pedra Branca), 15-1 (Middle Rocks), 15-1 (South Ledge)."
  - on: "Şikago Sözleşmesi'nin 1 ve 2. maddeleri ne söyler?"
    arka: "Her devlet ülkesi üzerindeki hava sahasında tam ve münhasır egemenliğe sahiptir; ülke karasularını da kapsar, açık deniz üzerini kapsamaz."
  - on: "Şikago'nun 3. maddesine göre devlet hava aracı nedir ve hangi kural uygulanır?"
    arka: "Askerî, gümrük ve polis hizmetindeki hava aracıdır. Sözleşme uygulanmaz; başka devletin ülkesi üzerinde özel anlaşma ya da başka izin olmadan uçamaz ve inemez."
  - on: "Tarifesiz uçuş ile tarifeli sefer farkı nedir?"
    arka: "Tarifesiz uçuşlar önceden izin gerektirmeden giriş, transit ve ticari olmayan iniş hakkına sahiptir (5. madde); tarifeli seferler üzerinden uçulan devletin özel iznine bağlıdır (6. madde)."
  - on: "Şikago Sözleşmesi'nin 3 bis maddesi neyi yasaklar, ne zaman yürürlüğe girdi?"
    arka: "Uçuştaki sivil hava araçlarına karşı silah kullanmaktan kaçınma yükümlülüğü. 1984'te kabul edildi, 1 Ekim 1998'de yürürlüğe girdi."
  - on: "Dış Uzay Antlaşması'nın II., IV. ve VI. maddeleri ne söyler?"
    arka: "II: uzay, Ay ve gök cisimleri ulusal sahiplenmeye konu olamaz. IV: kitle imha silahı yerleştirme yasağı, Ay'da askerî üs yasağı. VI: devlet özel kuruluşların faaliyetinden de uluslararası sorumludur ve faaliyeti izin ve sürekli denetime bağlar."
  - on: "1972 Sorumluluk Sözleşmesi'ne göre fırlatan devletin sorumluluğu nasıldır?"
    arka: "Dünya yüzeyinde ya da uçuştaki hava aracına zarar verirse mutlak (kusursuz, II. madde); başka uzay cismine uzayda zarar verirse kusura bağlı (III. madde). 'Ortak miras' ise Ay Anlaşması'nın 11. maddesindedir."
kararlar:
  - uluslararasi: true
    mahkeme: Uluslararası Daimi Adalet Divanı
    ad: "Legal Status of Eastern Greenland (Danimarka/Norveç) (esas)"
    tarih: "05.04.1933"
    kaynak: https://legal.un.org/PCIJsummaries/documents/english/PCIJ_FinalText.pdf
    ozet: "Norveç 1931'de Doğu Grönland'ı terra nullius sayarak işgal ettiğini bildirdi; Danimarka bölge üzerinde eski egemenlik iddia etti. Divan 12'ye karşı 2 oyla Danimarka'yı haklı buldu. Unvan, egemen olarak davranma iradesi ile bu otoritenin fiilen sergilenmesine dayanır; ulaşılmaz bölgelerde gereken yoğunluk düşüktür. Norveç Dışişleri Bakanı Ihlen'in 1919 tarihli beyanı Norveç'i bağladı; kritik tarih 10 Temmuz 1931'dir ve işgal hukuka aykırı sayıldı."
  - uluslararasi: true
    mahkeme: Uluslararası Adalet Divanı
    ad: "Frontier Dispute (Burkina Faso/Mali) (esas)"
    tarih: "22.12.1986"
    kaynak: https://legal.un.org/icjsummaries/documents/english/st_leg_serf1.pdf
    ozet: "Fransız Batı Afrikası'ndan doğan Burkina Faso ve Mali, sınırlarının bir bölümünü özel anlaşmayla Divan Dairesi'ne götürdü. Daire, uti possidetis juris ilkesinin sömürgesizleşmede genel kapsamlı bir kural olduğunu, bağımsızlık anındaki idari sınırları uluslararası sınıra dönüştürdüğünü ve hukuki unvanı fiilî zilyetliğin önüne koyduğunu belirtti. Haritalar tek başına unvan değil, delildir. Hukuka dayanan hakkaniyet uygulandı; sınır çizgisi oybirliğiyle belirlendi."
  - uluslararasi: true
    mahkeme: Uluslararası Adalet Divanı
    ad: "Sovereignty over Pedra Branca/Pulau Batu Puteh, Middle Rocks and South Ledge (Malezya/Singapur) (esas)"
    tarih: "23.05.2008"
    kaynak: https://legal.un.org/icjsummaries/documents/english/st_leg_serf1_add5.pdf
    ozet: "Malezya ve Singapur, Singapur Boğazı'ndaki Pedra Branca adası ile iki küçük oluşum üzerindeki egemenliği özel anlaşmayla Divan'a taşıdı. Divan, asli unvanın Johor'da olduğunu, ancak Johor'un 1953'te adanın mülkiyetini iddia etmediğini bildirmesi ve Singapur'un egemen sıfatıyla uzun süre yaptığı eylemlere tepkisiz kalınması sonucu egemenliğin geçtiğini belirtti. Pedra Branca 12'ye karşı 4 oyla Singapur'a, Middle Rocks Malezya'ya verildi."
