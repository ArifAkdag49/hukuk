doktrin: |
  ### Yorum yöntemi

  Bir görüş yorumda metne (olağan anlam), bir görüş tarafların gerçek iradesine, bir görüş konu ve amaca öncelik verir. VAHS'ın 31. maddesi bunları tek "genel kural"da birleştirir; 32. maddenin hazırlık çalışmalarını ikincil tutması metinci yaklaşımın ağır bastığı şeklinde okunur. 31. maddedeki öğeler arasında sıra bulunup bulunmadığı tartışmalıdır.

  ### 52. maddede "kuvvet"

  Bir görüşe göre yalnız silahlı kuvvet; karşı görüşe göre ağır siyasi ve ekonomik baskı da kapsama girer.

  ### 46. madde ve parlamento izni

  Parlamento iznini arayan anayasa kuralının (Türkiye'de Anayasa'nın andlaşmaları uygun bulma kuralı gibi) her durumda "temel önemde" sayılıp sayılmayacağı ve ihlalin ne zaman "açık" olduğu somut olaya göre tartışılır.

  ### Rebus sic stantibus'un dayanağı

  Bir görüş antlaşmada zımni bir şart bulunduğunu savunur. Baskın görüş ve VAHS bunu, tarafların iradesinden bağımsız nesnel bir kural sayar.

  ### 56. maddede "niteliği gereği" çekilme

  Hangi antlaşmaların çekilmeye elverişli olduğu (ittifak, ticaret) ve hangilerinin olmadığı (sınır, barış, insan hakları) öğretide tartışmalıdır.

  ### Türkiye'de çekilme yetkisi

  TBMM'nin uygun bulduğu bir antlaşmadan Cumhurbaşkanının kararla çekilip çekilemeyeceği iç hukukta tartışmalıdır. Bir görüş Cumhurbaşkanının yetkili olduğunu savunur; karşı görüş, uygun bulmada olduğu gibi TBMM iradesinin de gerektiğini (yetkide paralellik) söyler. Uluslararası hukukta çekilme ise antlaşma hükmü ya da 54 ve 56'ya göre değerlendirilir.
sozluk:
  - terim: Pacta sunt servanda
    tanim: "Ahde vefa: yürürlükteki antlaşma tarafları bağlar ve iyi niyetle ifa edilir (VAHS'ın 26. maddesi)."
  - terim: Hazırlık çalışmaları (travaux préparatoires)
    tanim: "Antlaşmanın müzakeresine ve yapılışına ilişkin belgeler; yorumda yardımcı araç (VAHS'ın 32. maddesi)."
  - terim: Bölünebilirlik
    tanim: "Geçersizlik ya da sona erme sebebinin yalnız belirli hükümler için ileri sürülebilmesi; 51-53'te yasak (VAHS'ın 44. maddesi)."
  - terim: Hak kaybı
    tanim: "Devletin olguları öğrendikten sonra antlaşmanın geçerli olduğunu kabulü veya davranışıyla razı olması nedeniyle bir sebebe dayanamaması (VAHS'ın 45. maddesi)."
  - terim: Jus cogens (emredici norm)
    tanim: "Aykırı davranışa izin verilmeyen ve ancak aynı nitelikte sonraki bir normla değiştirilebilen genel uluslararası hukuk normu (VAHS'ın 53. maddesi)."
  - terim: Hata (error)
    tanim: "Antlaşma yapıldığında var sayılan ve rızanın esaslı temelini oluşturan bir olguya ya da duruma ilişkin yanılgı (VAHS'ın 48. maddesi)."
  - terim: Esaslı ihlal
    tanim: "Sözleşme'nin izin vermediği reddetme ya da konu ve amaç için esaslı bir hükmün ihlali (VAHS'ın 60. maddesinin 3. fıkrası)."
  - terim: Askıya alma
    tanim: "Antlaşmanın ifa yükümlülüğünün geçici olarak durması; diğer hukuki ilişkiler sürer (VAHS'ın 72. maddesi)."
  - terim: İfa imkânsızlığı
    tanim: "Antlaşmanın ifası için vazgeçilmez nesnenin kalıcı yok oluşu (sona erme) ya da geçici imkânsızlık (askı) (VAHS'ın 61. maddesi)."
  - terim: Rebus sic stantibus
    tanim: "Koşulların temelden değişmesi; rızanın esaslı temeli olan, öngörülmemiş ve yükümlülükleri kökten dönüştüren değişiklik (VAHS'ın 62. maddesi)."
  - terim: Uzlaştırma
    tanim: "BM Genel Sekreteri'ne başvurulan ve Ek'te düzenlenen çözüm yolu; 53 ve 64 dışındaki uyuşmazlıklar için (VAHS'ın 66. maddesi)."
kararlar:
  - uluslararasi: true
    mahkeme: Uluslararası Adalet Divanı
    ad: "Gabčíkovo-Nagymaros Projesi (Macaristan/Slovakya) (esas hakkında hüküm)"
    tarih: "25.09.1997"
    kaynak: https://legal.un.org/icjsummaries/documents/english/st_leg_serf1_add2.pdf
    ozet: "Macaristan 1977 antlaşmasına dayanan Tuna projesindeki işleri 1989'da askıya almış, 19 Mayıs 1992'de antlaşmanın sona erdiğini bildirmişti. Divan, zorunluluk hâlinin antlaşmayı sona erdirme sebebi olmadığını, imkânsızlık ve temel değişiklik şartlarının gerçekleşmediğini, Çekoslovakya'nın henüz esaslı ihlal işlemediğini belirtti. 60-62. maddeler birçok yönden örf ve âdetin kodifikasyonu sayıldı. Fesih bildirimi erkendi; antlaşmayı sona erdirmedi (11'e karşı 4 oy)."
  - uluslararasi: true
    mahkeme: Uluslararası Adalet Divanı
    ad: "Preah Vihear Tapınağı (Kamboçya/Tayland) (esas hakkında hüküm)"
    tarih: "15.06.1962"
    kaynak: https://legal.un.org/icjsummaries/documents/english/st_leg_serf1.pdf
    ozet: "1904 antlaşması sınırı su bölümü çizgisine bağlamış, 1908'de Siyam'a iletilen harita tapınağı Kamboçya tarafında göstermişti. Tayland haritayı hatalı inançla kabul ettiğini savundu. Divan, Siyam makamlarının uzun yıllar tepki göstermemesi nedeniyle haritayı kabul etmiş sayıldığını, incelemeden kabul eden devletin hataya dayanamayacağını belirtti. Tapınak Kamboçya egemenliğindedir (9'a karşı 3 oy)."
sorular:
  - soru: |
      VAHS'ın 31. maddesine göre antlaşmanın yorumlanmasında genel kural hangisidir?
    siklar:
      - "Antlaşma, terimlerinin bağlamı içindeki olağan anlamına göre, iyi niyetle ve konu ve amacının ışığında yorumlanır"
      - "Antlaşma önce hazırlık çalışmalarına bakılarak yorumlanır; metin ancak bunlar yetmezse dikkate alınır"
      - "Antlaşma yalnız tarafların müzakere sırasındaki gerçek iradesine göre yorumlanır"
      - "Antlaşma, en dar anlama gelen yorumla yorumlanır; konu ve amaç dikkate alınmaz"
    dogru: 0
    aciklama: |
      VAHS'ın 31. maddesinin 1. fıkrası, iyi niyet, terimlerin bağlamı içindeki olağan anlamı ve konu ve amacı birleştirir. Hazırlık çalışmaları ise 32. maddede yardımcı araç olarak yer alır; metin önce gelir.
  - soru: |
      İki devlet arasındaki bir antlaşmanın bir terimi, 31. maddedeki genel kural uygulanınca açık ve makul bir anlam vermektedir. Devletlerden biri yine de müzakere tarihçesine (hazırlık çalışmalarına) başvurmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Hazırlık çalışmalarına başvurmak kesinlikle yasaktır, çünkü metin açıktır"
      - "Hazırlık çalışmalarına yalnız 31. madde ile belirlenen anlamı doğrulamak amacıyla başvurulabilir"
      - "Hazırlık çalışmaları genel kuralın birinci aracıdır ve her zaman metinden önce incelenir"
      - "Hazırlık çalışmalarına yalnız antlaşma çok dilli ise başvurulabilir"
    dogru: 1
    aciklama: |
      VAHS'ın 32. maddesi hazırlık çalışmalarına, 31. maddenin verdiği anlamı doğrulamak için başvurulmasına izin verir. Anlamı belirlemek için başvuru ise yalnız 31. maddenin uygulanması anlamı belirsiz ya da kapalı bırakıyorsa veya açıkça saçma ya da makul olmayan sonuç doğuruyorsa mümkündür.
  - soru: |
      Türkçe ve İngilizce metinleri eşit derecede geçerli olan bir antlaşmada bir terim iki metinde farklı anlam taşımaktadır. 31 ve 32. maddelerin uygulanması ayrılığı gidermemiştir. Bir resmî olmayan Almanca çeviri de vardır ve taraflar onun asıl metin olduğunu kabul etmemiştir. Hangisi doğrudur?
    siklar:
      - "Almanca çeviri kararı belirler, çünkü tarafsız bir dildedir"
      - "Türkçe metin üstündür, çünkü müzakere o dilde yürümüştür"
      - "Konu ve amaç gözetilerek metinleri en iyi uzlaştıran anlam benimsenir"
      - "Antlaşma ayrılık nedeniyle hükümsüz sayılır"
    dogru: 2
    aciklama: |
      VAHS'ın 33. maddesinin 4. fıkrasına göre 31 ve 32. maddelerle giderilemeyen ayrılıkta, antlaşmanın konu ve amacı gözetilerek metinleri en iyi uzlaştıran anlam benimsenir. Kimliği doğrulanmamış dildeki metin ancak antlaşma öngörür ya da taraflar kabul ederse asıl metin sayılır (33. maddenin 2. fıkrası).
  - soru: |
      C Devleti'nin anayasası, belli antlaşmalar için parlamento onayı aramaktadır. C'nin temsilcisi bu onayı almadan bir ticari antlaşmayı imzalamış, ancak bu anayasa kuralının ihlali normal uygulamada diğer devletlerce nesnel olarak görülebilecek durumda değildir. C, antlaşmanın geçersizliğini ileri sürmek istemektedir. Hangisi doğrudur?
    siklar:
      - "C, iç hukuk ihlali olduğu için her durumda geçersizliği ileri sürebilir"
      - "C ancak ihlal açık ve iç hukukun temel önemde bir kuralına ilişkinse ileri sürebilir; ihlal nesnel olarak belli olmadığından 46. maddeye dayanamaz"
      - "C, yalnız antlaşmanın bölünebilir hükümleri için geçersizliği ileri sürebilir"
      - "C, antlaşma yapıldıktan sonra on iki ay içinde ileri sürerse her durumda başarılı olur"
    dogru: 1
    aciklama: |
      VAHS'ın 46. maddesine göre iç hukuka aykırı rıza ancak ihlal açık (nesnel olarak belli) ve iç hukukun temel önemdeki bir kuralına ilişkinse ileri sürülebilir. İhlal açık olmadığından C'nin dayanağı yoktur. İç hukukun ifa etmemeye gerekçe yapılamaması kuralı da bunu destekler (27. madde).
  - soru: |
      X Devleti, bir sınır antlaşmasını imzalarken sınırın bir nehrin ortasından geçtiğine ilişkin hatalı varsayım yapmış; oysa X'in haritayı incelemesi ve hatayı fark etmesi mümkündü ve X yıllarca antlaşmadan yararlanmıştır. Hata hakkında hangisi doğrudur?
    siklar:
      - "X, hata nedeniyle antlaşmayı her zaman iptal ettirebilir"
      - "Hata yalnızca metnin ifadesine ilişkin olduğu için antlaşmayı hükümsüz kılar"
      - "X, kendi davranışıyla hataya katkıda bulunmuş ya da olası hataya karşı uyarılmış sayıldığından hataya dayanamaz"
      - "Hata ileri sürmek için antlaşma yapıldıktan sonra on iki ay beklemek gerekir"
    dogru: 2
    aciklama: |
      VAHS'ın 48. maddesinin 2. fıkrasına göre devlet, hataya kendi davranışıyla katkıda bulunmuşsa ya da koşullar onu olası bir hataya karşı uyarmış olmalıysa hataya dayanamaz. Preah Vihear kararında UAD haritayı incelemeden kabul eden devletin hataya dayanamayacağını belirtmiştir. Yalnız metnin ifadesindeki hata geçerliliği etkilemez (48. maddenin 3. fıkrası).
  - soru: |
      A Devleti, silahlı işgal tehdidi altında B Devleti ile bir antlaşma imzalamak zorunda bırakılmıştır. Antlaşmanın bazı hükümleri tarafsız ve makuldür. A, yalnız zorlama ürünü hükümlerin geçersizliğini ileri sürüp diğerlerini ayakta tutmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Bölünebilirlik kuralı uygulanır ve A yalnız zorlama ürünü hükümleri geçersiz kılabilir"
      - "Antlaşma BM Şartı ilkelerine aykırı kuvvet tehdidiyle yapıldığı için batıldır ve hükümleri ayrılamaz"
      - "A, geçersizliği ileri sürmezse antlaşma 12 ay sonra geçerlilik kazanır"
      - "Zorlama ancak temsilciye yönelikse sonuç doğurur; devlete yönelik zorlamanın sonucu yoktur"
    dogru: 1
    aciklama: |
      VAHS'ın 52. maddesine göre BM Şartı'nda somutlaşan uluslararası hukuk ilkelerine aykırı kuvvet tehdidi veya kullanılmasıyla yapılan antlaşma batıldır. 51, 52 ve 53. maddelerde hükümlerin ayrılması yasaktır (44. maddenin 5. fıkrası). Hak kaybı da bu sebepler için öngörülmemiştir (45. madde).
  - soru: |
      Bir antlaşma yapıldığı sırada geçerliydi. Sonradan genel uluslararası hukukta yeni bir emredici norm ortaya çıkmış ve antlaşma bu normla çatışır hâle gelmiştir. Sonuç hangisidir?
    siklar:
      - "Antlaşma baştan beri batıldır ve bütün sonuçları geriye dönük olarak ortadan kalkar"
      - "Antlaşma çatışma nedeniyle ancak tüm tarafların oybirliğiyle sona erdirilebilir"
      - "Antlaşma batıl olur ve sona erer; önceden doğmuş durumlar yeni normla çatışmadıkça sürdürülebilir"
      - "Antlaşma hiçbir etkilenmez; yeni emredici norm yalnız sonradan yapılan antlaşmalara uygulanır"
    dogru: 2
    aciklama: |
      VAHS'ın 64. maddesine göre mevcut antlaşma yeni emredici normla çatışıyorsa batıl olur ve sona erer. VAHS'ın 71. maddesinin 2. fıkrasına göre önceden doğmuş durumlar ancak yeni normla çatışmadıkları ölçüde sürdürülebilir. Baştan batıllık 53. maddenin konusudur.
  - soru: |
      Çok taraflı bir antlaşmada taraflardan biri antlaşmanın esaslı bir hükmünü ihlal etmiştir. Bu ihlalden özellikle etkilenen taraf K, ihlalci ile arasındaki ilişkiyi ne yapabilir?
    siklar:
      - "K, ihlalci ile arasında antlaşmayı tek başına sona erdirebilir"
      - "K, yalnız ihlalci ile arasındaki ilişki bakımından antlaşmayı askıya alabilir"
      - "K, hiçbir şey yapamaz; yalnız bütün diğer taraflar oybirliğiyle karar alabilir"
      - "K, ihlalci ile arasında antlaşmayı sona erdirebilir ve ayrıca diğer tarafları da bağlar"
    dogru: 1
    aciklama: |
      VAHS'ın 60. maddesinin 2. fıkrasının b bendi, ihlalden özellikle etkilenen tarafa kendisi ile ihlalci arasında antlaşmanın uygulanmasını yalnız askıya alma hakkı verir. Sona erdirme ya da herkes arasında askı için diğer tarafların oybirliği gerekir (60/2-a).
  - soru: |
      E ve F ortak bir adada fener işletmek için antlaşma yapmıştır. Ada depremle kalıcı olarak sular altında kalmıştır ve fener işletmek artık imkânsızdır. Hangisi doğrudur?
    siklar:
      - "Antlaşmanın ifası için vazgeçilmez nesne kalıcı olarak yok olduğundan taraflar antlaşmayı sona erdirebilir veya çekilebilir"
      - "Yalnız askıya alma mümkündür, çünkü her imkânsızlık geçicidir"
      - "Antlaşma kendiliğinden ve bildirimsiz sona erer, usul gerekmez"
      - "Taraflar koşulların temelden değişmesini ileri sürerek ancak bir yıl sonra çekilebilir"
    dogru: 0
    aciklama: |
      VAHS'ın 61. maddesinin 1. fıkrasına göre antlaşmanın ifası için vazgeçilmez bir nesnenin kalıcı olarak yok olması sona erme ya da çekilme sebebidir; imkânsızlık geçiciyse yalnız askı sebebidir. Sona erme için usul hükümleri (65 ve devamı) uygulanır.
  - soru: |
      F Devleti, E Devleti ile yaptığı sınır antlaşmasından, kendisinde rejim değişikliği olduğunu ve koşulların temelden değiştiğini ileri sürerek çekilmek istemektedir. Hangisi doğrudur?
    siklar:
      - "F, rejim değişikliği nedeniyle 62. maddeye dayanarak çekilebilir"
      - "62. maddeye dayanılamaz, çünkü sınır kuran antlaşmada koşulların temelden değişmesi ileri sürülemez"
      - "F, çekilmek için ancak E'nin kabulünü bekleyebilir; 62. madde sınır antlaşmaları için de mümkündür"
      - "Sınır antlaşmaları 62. madde yerine yalnız 56. madde uyarınca sona erdirilir"
    dogru: 1
    aciklama: |
      VAHS'ın 62. maddesinin 2. fıkrasının a bendi, antlaşma bir sınır kuruyorsa koşulların temelden değişmesinin ileri sürülemeyeceğini belirtir. Ayrıca Gabčíkovo kararında UAD, siyasi koşulların ve ekonomik sistemin rızanın esaslı temeli olmadığını belirtmiştir.
  - soru: |
      Macaristan, Gabčíkovo-Nagymaros antlaşmasını 19 Mayıs 1992'de sona erdirdiğini bildirmiştir. UAD'nin 1997 tarihli kararının sonucu hakkında hangisi doğrudur?
    siklar:
      - "Zorunluluk hâli antlaşmayı sona erdirme sebebi olduğu için bildirim geçerli sayıldı"
      - "Bildirim erken olduğu için antlaşmayı sona erdirmedi; zorunluluk hâli antlaşmayı sona erdirme sebebi değildir"
      - "Antlaşma, Çekoslovakya'nın dağılmasıyla kendiliğinden sona ermiştir"
      - "UAD, antlaşmayı 62. madde uyarınca sona erdirilmiş saydı"
    dogru: 1
    aciklama: |
      UAD, zorunluluk hâlinin (var olsa bile) antlaşmayı sona erdirme sebebi değil, ancak ifa etmeyen devleti sorumluluktan kurtarabilecek bir hâl olduğunu belirtti. Çekoslovakya Ekim 1992'de Tuna'yı saptırınca ihlal etmişti; 19 Mayıs 1992 bildirimi erkendi ve antlaşmayı sona erdirmedi (11'e karşı 4 oy). Temel değişikliğin şartları da gerçekleşmemişti.
  - soru: |
      Bir devlet, geçersizlik sebebini ileri sürüp bildirimde bulunmuş, diğer taraf itiraz etmiştir. İtirazdan itibaren on iki ay içinde çözüm bulunamamıştır. Uyuşmazlık VAHS'ın 53. maddesindeki emredici normla ilgilidir. Hangisi doğrudur?
    siklar:
      - "Uyuşmazlık yazılı başvuruyla UAD'ye götürülebilir"
      - "Uyuşmazlık yalnız BM Genel Sekreteri'nin kuracağı uzlaştırma komisyonuna gider"
      - "Uyuşmazlık BM Güvenlik Konseyi'ne gönderilir"
      - "Bildirim yapan devlet önlemi hemen, süre beklemeden uygular"
    dogru: 0
    aciklama: |
      VAHS'ın 66. maddesinin a bendine göre 53 veya 64 uyuşmazlıkları, itirazdan itibaren 12 ay içinde çözülemezse yazılı başvuruyla UAD'ye götürülebilir (ortak rızayla tahkim saklıdır). Diğer sebepler için 66. maddenin b bendinde uzlaştırma öngörülür.
olaylar:
  - olay: |
      C Devleti'nin Dışişleri Bakanı, C anayasasının parlamento izni aradığı bir ticari antlaşmayı (T1) D Devleti ile bu izni almadan imzalamıştır. C'nin bu izin kuralını D bakımından nesnel olarak görülebilir kılan bir duyuru ya da uygulama bulunmamaktadır. C sonradan T1'in geçersiz olduğunu ileri sürmektedir.

      Ayrıca D Devleti, C'nin müzakere heyeti başkanına para vererek ikinci bir antlaşmayı (T2) imzalatmıştır. C, olguyu öğrendikten sonra T2'nin geçersizliğini ileri sürmek istemektedir. C, T2'nin yalnız bir hükmünün (9. madde) geçersizliğini ileri sürüp diğerlerini sürdürmeyi de düşünmektedir. Bu hükmün kabulü C'nin rızasının esaslı temeli değildir ve kalanın ifası haksız olmayacaktır. C, olguyu öğrendikten sonra T2'nin yürürlükte olduğunu yazılı olarak açıkça kabul etmiş olsaydı hukuki durumun ne olacağı da sorulmaktadır.

      Sorular:
      1. C, T1 bakımından VAHS'ın 46. maddesine dayanabilir mi?
      2. T2 bakımından hangi geçersizlik sebebi söz konusudur ve C hangi seçeneklere sahiptir?
      3. T2 bakımından D, hukuka uygun biçimde yapılmış işlemlerin korunmasını isteyebilir mi?
      4. C'nin T2'nin yürürlükte olduğunu açıkça kabul etmesi hâlinde sonuç ne olur?
    olcut:
      - {tespit: "Antlaşma yapma yetkisine ilişkin iç hukuk kuralı ihlalinin ancak açık ve temel önemde kural bakımından ileri sürülebilmesi; ihlal nesnel olarak belli olmadığından C'nin 46. maddeye dayanamaması", puan: 20, madde: "VAHS'ın 46. maddesi"}
      - {tespit: "İç hukukun ifa etmemenin gerekçesi olamaması", puan: 10, madde: "VAHS'ın 27. maddesi"}
      - {tespit: "T2'de temsilcinin başka müzakereci devletçe rüşvetle elde edilmesi (50. madde); C'nin yalnız ileri sürmesiyle geçersizlik", puan: 20, madde: "VAHS'ın 50. maddesi"}
      - {tespit: "Rüşvette mağdur devletin tümü ya da 44/3 şartlarıyla belirli hükümler arasında seçim yapabilmesi", puan: 20, madde: "VAHS'ın 44/4 ve 44/3. maddeleri"}
      - {tespit: "Rüşvet yüklenebilen D'nin 69/2 korumasından yararlanamaması", puan: 15, madde: "VAHS'ın 69/3. maddesi"}
      - {tespit: "Olguları öğrendikten sonra açıkça kabul eden C'nin 46-50 sebeplerine dayanma hakkını kaybetmesi", puan: 15, madde: "VAHS'ın 45. maddesi"}
    cozum: |
      **Nitelendirme:** Olay, iki ayrı geçersizlik iddiasını içerir: T1 bakımından iç hukuk kuralı ihlali (VAHS'ın 46. maddesi), T2 bakımından temsilcinin rüşvetle elde edilmesi (VAHS'ın 50. maddesi). Bu nedenle sorun, ilk grup geçersizlik sebeplerinin ileri sürülmesine bağlı olmasıdır; her ikisi de devletin ileri sürmesine ve hak kaybı rejimine tabidir. Türkiye VAHS'a taraf olmadığı için bu kuralların örf ve âdet niteliği ölçüsünde uygulandığı da akılda tutulmalıdır.

      **Hukuki sorunlar:** (1) İç hukuk ihlalinin ileri sürülebilmesinin şartları; (2) rüşvetin geçersizlik sonucu ve bölünebilirlik; (3) 69. madde korumasının kapsamı; (4) hak kaybı.

      **İlgili hükümler ve değerlendirme:** T1 bakımından, VAHS'ın 46. maddesi uyarınca rızanın iç hukuk kuralına aykırı verildiği ancak ihlal açıksa ve iç hukukun temel önemdeki bir kuralına ilişkinse ileri sürülebilir. İhlal, olaya normal uygulamaya ve iyi niyete uygun davranan her devlet bakımından nesnel olarak belli olmalıdır. Olayda böyle bir duyuru ya da uygulama bulunmadığından ihlal açık değildir; C, 46. maddeye dayanamaz. VAHS'ın 27. maddesi de iç hukukun ifa etmemenin gerekçesi olamayacağını belirtir. Dışişleri Bakanı ayrıca antlaşmanın yapılmasına ilişkin işlemlerde yetki belgesiz temsilcidir.

      T2 bakımından, başka bir müzakereci devletin temsilciyi rüşvetle elde etmesi VAHS'ın 50. maddesi kapsamındadır. C, rızasının geçersizliğini ileri sürebilir; bu sebep kendiliğinden hükümsüzlük doğurmaz, C'nin ileri sürmesine bağlıdır. VAHS'ın 44. maddesinin 4. fıkrasına göre rüşvette mağdur devlet tümüne ya da, 44. maddenin 3. fıkrasındaki şartlar (hükümler ayrılabilir, kabulleri rızanın esaslı temeli değil, kalanın ifası haksız olmayacak) varsa belirli hükümlerine dayanabilir. Olayda 9. madde bu şartları taşıdığından C yalnız onu hedef alabilir. VAHS'ın 69. maddesinin 2. fıkrası, geçersizlik ileri sürülmeden önce iyi niyetle yapılan işlemlerin salt bu yüzden hukuka aykırı olmayacağını söyler; ancak VAHS'ın 69. maddesinin 3. fıkrası, hile, rüşvet ya da zorlamadan sorumlu tarafın bu korumadan yararlanamayacağını öngörür. Dolayısıyla D bu korumayı isteyemez. Son olarak, VAHS'ın 45. maddesine göre C olguları öğrendikten sonra T2'nin yürürlükte olduğunu açıkça kabul etseydi, rüşvet sebebine artık dayanamazdı.

      **Sonuç:** C, T1 bakımından 46. maddeye dayanamaz; T2 bakımından rüşvet sebebiyle (50) geçersizliği tümüne ya da 44/3 şartlarıyla 9. maddeye karşı ileri sürebilir. D 69/2 korumasından yararlanamaz. C açıkça kabul ederse 45. madde gereği bu sebebe dayanma hakkını kaybeder.
  - olay: |
      E ve F devletleri iki ayrı antlaşma yapmıştır. İlki, ortak bir adada fener işletmeyi öngören antlaşmadır (T3). Ada büyük bir depremle kalıcı olarak sular altında kalmıştır. İkincisi, iki devlet arasındaki kara sınırını çizen antlaşmadır (T4). F'de rejim değişikliği olmuş, yeni yönetim ekonomik külfet ve siyasi koşulların değiştiğini ileri sürerek T4'ten çekilmek istemektedir. F bu gerekçeyi yazılı olarak E'ye bildirmiştir. E bu bildirime itiraz etmiş, aradan on iki ay geçmesine rağmen çözüm bulunamamıştır.

      Sorular:
      1. T3 bakımından hangi sebep söz konusudur? Ada sular altında kalmak yerine geçici olarak bir süre kullanılamaz hâle gelseydi sonuç ne olurdu?
      2. F, T4'ten VAHS'ın 62. maddesine dayanarak çekilebilir mi?
      3. E'nin itirazı üzerine izlenecek yol nedir; 12 ay sonra hangi yol işler?
      4. Bildirim usulüne ilişkin kurallar nelerdir?
    olcut:
      - {tespit: "T3: Vazgeçilmez nesnenin kalıcı yok oluşu nedeniyle sona erme veya çekilme", puan: 25, madde: "VAHS'ın 61/1. maddesi"}
      - {tespit: "Geçici imkânsızlıkta yalnız askıya alma", puan: 10, madde: "VAHS'ın 61/1. maddesi"}
      - {tespit: "T4: Sınır kuran antlaşmada 62. maddeye dayanılamaması", puan: 25, madde: "VAHS'ın 62/2(a). maddesi"}
      - {tespit: "Ekonomik külfet ve rejim değişikliğinin tek başına rızanın esaslı temeli değiştirmemesi (Gabčíkovo)", puan: 10, madde: "VAHS'ın 62/1. maddesi"}
      - {tespit: "İtiraz hâlinde BM Şartı'nın 33. maddesindeki yöntemler; 12 ayda çözüm yoksa 53/64 dışındaki uyuşmazlıkta uzlaştırma", puan: 15, madde: "VAHS'ın 65/3 ve 66(b). maddeleri"}
      - {tespit: "Bildirimin yazılı olması ve itiraz yoksa özel ivedilik dışında en az 3 ay beklenmesi", puan: 15, madde: "VAHS'ın 65/2 ve 67/1. maddeleri"}
    cozum: |
      **Nitelendirme:** Olay, iki farklı sona erme sebebini ve bunlara ilişkin usulü sorar. T3 bakımından ifa imkânsızlığı, T4 bakımından koşulların temelden değişmesi (rebus sic stantibus) ileri sürülmektedir. Bu nedenle sorun, iki sebebin kapsamı, sınır antlaşmalarının özel durumu ve itiraz hâlinde izlenecek yoldur. Türkiye VAHS'a taraf değildir; kurallar örf ve âdet niteliği ölçüsünde değerlendirilir.

      **Hukuki sorunlar:** (1) 61. maddenin uygulanması; (2) 62. maddenin sınır antlaşmasında uygulanabilirliği; (3) itiraz ve çözüm yolu; (4) bildirim usulü.

      **İlgili hükümler ve değerlendirme:** T3 bakımından, VAHS'ın 61. maddesinin 1. fıkrası, antlaşmanın ifası için vazgeçilmez bir nesnenin kalıcı olarak yok olmasını sona erme veya çekilme sebebi sayar. Ada kalıcı olarak sular altında kaldığından taraflar T3'ü sona erdirebilir veya T3'ten çekilebilir. Eğer imkânsızlık yalnız geçici olsaydı (örneğin ada bir süre kullanılamaz olsa) bu, yalnız askıya alma sebebi olurdu. İmkânsızlık, ileri süren tarafın kendi ihlalinden doğmadığı sürece ileri sürülebilir (61. maddenin 2. fıkrası).

      T4 bakımından, F'nin gerekçesi VAHS'ın 62. maddesine dayanır. Bu maddeye göre öngörülmemiş temel değişikliğin ileri sürülebilmesi için değişikliğin rızanın esaslı temelini oluşturması ve kalan yükümlülüklerin kapsamını kökten dönüştürmesi gerekir. Üstelik sınır kuran antlaşmada koşulların temelden değişmesi hiçbir hâlde ileri sürülemez (62. maddenin 2. fıkrasının a bendi). Gabčíkovo kararında UAD siyasi koşulların ve ekonomik sistemin rızanın esaslı temeli olmadığını belirtmiştir; rejim değişikliği ve ekonomik külfet tek başına 62. madde sayılmaz. Dolayısıyla F, T4'ten bu gerekçeyle çekilemez.

      Usul bakımından, sebebi ileri süren taraf yazılı bildirimde bulunmalı ve önlemi ile gerekçesini göstermelidir (VAHS'ın 65. maddesinin 1. fıkrası ve 67. maddenin 1. fıkrası). İtiraz gelmezse özel ivedilik dışında bildirimin alınmasından en az üç ay sonra önlem uygulanabilir (65. maddenin 2. fıkrası). İtiraz gelirse taraflar BM Şartı'nın 33. maddesindeki yollara başvurur (65. maddenin 3. fıkrası). İtirazdan itibaren 12 ay içinde çözüm bulunamazsa, uyuşmazlık 53 veya 64'e ilişkin olmadığından BM Genel Sekreteri'ne başvurularak uzlaştırma işletilir (66. maddenin b bendi).

      **Sonuç:** T3 sona erdirilebilir ya da çekilinebilir (geçici imkânsızlıkta yalnız askı); T4 bakımından F, 62. maddeye dayanamaz. E'nin itirazı üzerine önce 33. maddedeki yollar, 12 ay sonunda çözüm yoksa uzlaştırma işler. Bildirim yazılı yapılır ve itiraz yoksa en az üç ay beklenir.
kartlar:
  - on: "VAHS'ın 31. maddesine göre genel yorum kuralı nedir?"
    arka: "Antlaşma, terimlerinin bağlamı içindeki olağan anlamına göre, iyi niyetle ve konu ve amacının ışığında yorumlanır."
  - on: "Hazırlık çalışmaları ne zaman kullanılır?"
    arka: "31. maddenin verdiği anlamı doğrulamak için ya da anlam belirsiz veya açıkça saçmaysa belirlemek için (VAHS'ın 32. maddesi). Yasak değil, ikincildir."
  - on: "Çok dilli antlaşmada ayrılık nasıl giderilir?"
    arka: "Her asıl metin eşit geçerlidir; 31-32 ile giderilemeyen ayrılıkta konu ve amaç gözetilerek metinleri en iyi uzlaştıran anlam benimsenir (VAHS'ın 33. maddesinin 4. fıkrası)."
  - on: "İç hukuk ihlali hangi şartla geçersizlik sebebidir?"
    arka: "İhlal açık (nesnel olarak belli) olmalı ve iç hukukun temel önemdeki kuralına ilişkin olmalı (VAHS'ın 46. maddesi)."
  - on: "Hangi geçersizlik sebepleri bölünemez?"
    arka: "Temsilciye zorlama (51), devlete zorlama (52) ve jus cogens'e aykırılık (53); hükümlerin ayrılması yasaktır (VAHS'ın 44. maddesinin 5. fıkrası)."
  - on: "Hak kaybı hangi sebepler için öngörülmüştür?"
    arka: "Yalnız 46-50, 60 ve 62 için; devlet olguları öğrendikten sonra antlaşmayı açıkça kabul eder ya da buna razı sayılırsa dayanamaz (VAHS'ın 45. maddesi)."
  - on: "53 ile 64 arasındaki fark nedir?"
    arka: "53: yapıldığı anda emredici normla çatışan antlaşma batıldır; 64: sonradan doğan yeni emredici norma aykırı mevcut antlaşma batıl olur ve sona erer."
  - on: "Çok taraflı antlaşmada esaslı ihlalde kim ne yapabilir?"
    arka: "Diğer taraflar oybirliğiyle askı veya sona erdirme; ihlalden özellikle etkilenen taraf yalnız askı (VAHS'ın 60. maddesinin 2. fıkrası)."
  - on: "61. maddeye göre kalıcı ve geçici imkânsızlığın sonucu nedir?"
    arka: "Vazgeçilmez nesnenin kalıcı yok oluşu sona erme veya çekilme sebebi, geçici imkânsızlık yalnız askı sebebidir."
  - on: "Rebus sic stantibus hangi durumlarda ileri sürülemez?"
    arka: "Sınır kuran antlaşmada ve değişiklik ileri sürenin kendi ihlalinin sonucuysa (VAHS'ın 62. maddesinin 2. fıkrası)."
  - on: "Bildirim ve itiraz süreleri nelerdir?"
    arka: "İtiraz yoksa özel ivedilik dışında en az 3 ay (VAHS'ın 65. maddesi); itirazdan 12 ay sonra 53/64 için UAD, diğer sebepler için uzlaştırma (VAHS'ın 66. maddesi). Hükümsüz antlaşmadan izinli çekilmede en az 12 ay (VAHS'ın 56. maddesi)."
  - on: "Gabčíkovo-Nagymaros kararında zorunluluk hâli ve fesih bildirimi hakkında ne söylendi?"
    arka: "Zorunluluk hâli antlaşmayı sona erdirme sebebi değildir; Macaristan'ın 19 Mayıs 1992 bildirimi erken olduğundan antlaşmayı sona erdirmedi (11'e karşı 4 oy)."
