  - soru: |
      A Devleti, B Devleti'ne karşı silahlı saldırıya girişmiştir. B bunu açıklamamış ve kimseden yardım istememiştir. Üçüncü devlet C, "B'yi savunmak" amacıyla A'nın limanlarına mayın döşer. UAD'nin Nikaragua'daki ilkesine göre C'nin toplu meşru müdafaa savunması hakkında ne söylenebilir?
