    aciklama: |
      Şart iki temel istisna tanır: Şart'ın 51. maddesindeki meşru müdafaa ve Konsey'in 39-42. maddelere dayanan önlemleri. Bölgesel örgütlerin zorlama eylemi Konsey iznine bağlıdır (53. madde), misilleme kuvvet içeriyorsa yasaktır (2625 sayılı karar), insani müdahale ise tartışmalıdır.
  - soru: |
      A Devleti, komşusu B'deki silahlı muhaliflere silah ve lojistik destek vermektedir. UAD'nin Nikaragua kararındaki yaklaşımına göre B Devleti'nin durumu aşağıdakilerden hangisidir?
    siklar:
      - "A'nın bu desteği tek başına silahlı saldırı sayıldığı için B, A'ya karşı meşru müdafaa hakkını kullanabilir"
      - "Destek, silahlı saldırı sayılmaz; bu nedenle B'ye tek başına Şart'ın 51. maddesine dayanan silahlı karşılık hakkı doğmaz"
