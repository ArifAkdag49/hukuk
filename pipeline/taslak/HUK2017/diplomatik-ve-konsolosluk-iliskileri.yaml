doktrin: |
  ### Misyon binasına acil durumda girilebilir mi?

  Bir görüşe göre VDİS'in 22. maddesi istisna içermez (VKİS'in 31. maddesinin 2. fıkrasının aksine) ve dokunulmazlık mutlaktır. Karşı görüşe göre zorunluluk hâli ya da insan hayatını koruma gibi genel hukuka uygunluk sebepleri dar ölçüde ileri sürülebilir. Metinde istisna öngörülmemiştir.

  ### Diplomatik çantanın taranması

  Bir görüş, çantanın röntgenle taranmasını "açma" saymaz. Karşı görüş bunu VDİS'in 27. maddesinin 3. fıkrasının amacına aykırı bulur.

  ### VKİS'in 36. maddesindeki hakların niteliği

  Meksika, bu hakların insan hakkı olduğunu savundu; Divan Avena'da bu soruya karar vermeyi gerekli görmedi. LaGrand'da bu hakların bireysel haklar olduğu kesindir; insan hakkı niteliği ise tartışmalıdır.

  ### Görev sonrası bağışıklık

  VDİS'in 39. maddesinin 2. fıkrası, görev sona erdikten sonra görevsel işlemler bakımından bağışıklığın sürdüğünü söyler. Hangi işlemlerin "görevsel" sayılacağı tartışmalıdır.

  ### Diplomatik hukuk kapalı bir rejim midir?

  Tahran kararında Divan, zorlama yerine diplomatik hukukun kendi araçlarına (persona non grata, ilişkileri kesme) işaret etti. Diplomatik hukukun genel karşı tedbirleri tümüyle dışlayıp dışlamadığı tartışmalıdır.
sozluk:
  - terim: Agrément
    tanim: "Gönderen devletin misyon şefi olarak önerdiği kişi için kabul eden devletin verdiği önceden onay; ret gerekçesi bildirilmez."
  - terim: Exequatur
    tanim: "Konsolosluk şefinin kabul eden devletçe göreve kabulünü sağlayan izin."
  - terim: Persona non grata
    tanim: "Kabul eden devletin, gerekçe göstermeden istenmeyen kişi ilan ettiği diplomatik görevli."
  - terim: Diplomatik ajan
    tanim: "Misyon şefi ya da misyonun diplomatik personelinden biri."
  - terim: Dokunulmazlık (inviolability)
    tanim: "Kişi ve bina üzerinde tutuklama, giriş, arama gibi tedbirlerin uygulanamaması; bağışıklıktan (yargılanmama) farklıdır."
  - terim: Bağışıklık (immunity)
    tanim: "Kabul eden devlet mahkemelerinde yargılanmama; ceza yargısında tam, hukuk ve idari yargıda üç istisnalıdır."
  - terim: Diplomatik çanta
    tanim: "Resmî belge ya da resmî kullanıma ayrılmış eşya taşıyan, dış işareti olan paket; açılamaz ve alıkonamaz."
  - terim: Koruyucu devlet
    tanim: "İlişkiler kesildiğinde bina, arşiv ve çıkarların korunmasını üstlenen üçüncü devlet."
  - terim: İşlevsel gereklilik
    tanim: "Ayrıcalıkların kişilere yarar sağlamak için değil, misyonun görevini etkin yapması için tanındığı fikri."
  - terim: Gönderen ve kabul eden devlet
    tanim: "Misyonu gönderen devlet ve misyonu ülkesinde kabul eden devlet."
  - terim: Fahri konsolos
    tanim: "Meslekten olmayan konsolosluk memuru; ailesine ayrıcalık tanınmaz."
kararlar:
  - uluslararasi: true
    mahkeme: Uluslararası Adalet Divanı
    ad: "United States Diplomatic and Consular Staff in Tehran (ABD / İran) (esas hakkında karar)"
    tarih: "24.05.1980"
    kaynak: https://legal.un.org/icjsummaries/documents/english/st_leg_serf1.pdf
    ozet: |
      4 Kasım 1979'da militanlar Tahran'daki ABD Büyükelçiliği'ni bastı, personeli rehin aldı; İran önlem almadı, sonra devlet organları işgali onaylayıp sürdürdü. Divan, İran'ın misyonu koruma ödevini ihlal ettiğine ve sorumlu olduğuna, rehinelerin bırakılması ve tazmin gerektiğine karar verdi. İran'ın ABD faaliyetleri savunmasını reddetti: diplomatik hukuk persona non grata ve ilişkileri kesme araçlarını sunar, zorlama meşru değildir.
  - uluslararasi: true
    mahkeme: Uluslararası Adalet Divanı
    ad: "LaGrand (Almanya / ABD) (esas hakkında karar)"
    tarih: "27.06.2001"
    kaynak: https://legal.un.org/icjsummaries/documents/english/st_leg_serf1_add2.pdf
    ozet: |
      Alman vatandaşı LaGrand kardeşler 1982'de Arizona'da yakalandı ve ölüm cezasına çarptırıldı; VKİS'in 36. maddesinin 1. fıkrasının (b) bendi uyarınca bildirim yapılmadı. Divan, bu hükmün bireysel haklar yarattığına, ihlal bulunduğuna, procedural default kuralının bu olaydaki uygulamasının 36. maddenin 2. fıkrasını ihlal ettiğine ve geçici tedbire uyulmamasının ihlal olduğuna karar verdi.
  - uluslararasi: true
    mahkeme: Uluslararası Adalet Divanı
    ad: "Avena ve Diğer Meksika Vatandaşları (Meksika / ABD) (esas hakkında karar)"
    tarih: "31.03.2004"
    kaynak: https://legal.un.org/icjsummaries/documents/english/st_leg_serf1_add3.pdf
    ozet: |
      Meksika, ABD'de ölüm cezasına çarptırılmış 52 vatandaşı için dava açtı. Divan, birçok kişide VKİS'in 36. maddesinin ihlal edildiğini saptadı; "gecikmeksizin"in zorunlu olarak "hemen" olmadığını, ancak kişinin yabancı olduğu anlaşılınca bildirim ödevinin başladığını belirtti. ABD'nin mahkûmiyet ve cezayı yargısal süreçle etkili biçimde yeniden incelemesi gerektiğine, af sürecinin tek başına yetmeyeceğine karar verdi.
sorular:
  - soru: |
      X Devleti, Türkiye'ye büyükelçi olarak önerdiği kişi için agrément talep etmiş, Türkiye bu talebi reddetmiştir. X, redde gerekçe gösterilmesini istemektedir. VDİS'e göre hangisi doğrudur?
    siklar:
      - "Kabul eden devlet agrément reddi için gerekçe göstermek zorunda değildir."
      - "Ret ancak yazılı gerekçeyle yapılabilir."
      - "Ret için X Devleti'nin onayı gerekir."
      - "Agrément yalnız konsolosluk şefi için aranır."
    dogru: 0
    aciklama: |
      VDİS'in 4. maddesine göre kabul eden devlet, agrément reddi için gerekçe bildirmek zorunda değildir. Konsolosluk şefi için aranan izin agrément değil exequatur'dur (VKİS'in 12. maddesi).
  - soru: |
      Persona non grata ilanı hakkında VDİS'e göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Kabul eden devlet bunu her zaman ve kararını açıklamadan bildirebilir; kişi ülkeye varmadan da ilan edilebilir."
      - "Yalnız kişinin ağır suç işlemesi hâlinde ilan edilebilir."
      - "İlan için gönderen devletin onayı gerekir."
      - "Kişi ülkeye girmeden önce ilan edilemez."
    dogru: 0
    aciklama: |
      VDİS'in 9. maddesi, kabul eden devlete bu bildirimi her zaman ve kararını açıklamak zorunda kalmadan yapma imkânı tanır; kişi ülkeye varmadan önce de ilan edilebilir. Gönderen devlet makul sürede geri çağırmazsa kişi misyon üyesi sayılmayabilir.
  - soru: |
      Aşağıdakilerden hangisi VDİS'in 22. maddesinin metnine uygundur?
    siklar:
      - "Kabul eden devletin görevlileri misyon şefinin rızası olmadan misyon binasına giremez."
      - "Yangında misyon şefinin rızası varsayılır."
      - "Misyon binasına kabul eden devletin polisi arama yapabilir."
      - "Binanın dokunulmazlığı yalnız şefin konutunu kapsar."
    dogru: 0
    aciklama: |
      VDİS'in 22. maddesi misyon binasını dokunulmaz kılar ve görevlilerin şefin rızası olmadan girmesini yasaklar; metinde yangın gibi bir istisna yoktur. Yangında rızanın varsayılması kuralı VKİS'in 31. maddesinin 2. fıkrasındadır ve konsolosluk binasına ilişkindir.
  - soru: |
      Gümrük görevlileri, X Devleti büyükelçiliğine ait bir diplomatik çantada silah bulunduğundan ciddi biçimde şüphelenmektedir. VDİS'e göre ne yapılabilir?
    siklar:
      - "Çanta açılamaz ve alıkonamaz."
      - "Çanta gönderen devlet temsilcisinin huzurunda açılmak üzere istenebilir."
      - "Çanta ciddi şüphe varsa gümrük görevlilerince açılabilir."
      - "Çanta yalnız röntgenle taranabilir, taranması da zorunludur."
    dogru: 0
    aciklama: |
      VDİS'in 27. maddesinin 3. fıkrası diplomatik çantanın açılamayacağını ve alıkonamayacağını belirtir. Gönderen devlet temsilcisinin huzurunda açılmasının istenebilmesi kuralı VKİS'in 35. maddesinin 3. fıkrasında, konsolosluk çantası için vardır.
  - soru: |
      Diplomatik ajan hakkında VDİS'in 32. maddesine göre feragat bakımından hangisi doğrudur?
    siklar:
      - "Feragati gönderen devlet yapar ve feragat her zaman açık olmalıdır."
      - "Feragati diplomatın kendisi örtülü olarak yapabilir."
      - "Kabul eden devlet bağışıklığı tek taraflı olarak kaldırabilir."
      - "Yargılamadan feragat icradan da feragat sayılır."
    dogru: 0
    aciklama: |
      Bağışıklıktan feragat gönderen devlete aittir ve her zaman açık olmalıdır. Hukuk ya da idari davada yargılamadan feragat, icradan feragat anlamına gelmez; ayrı bir feragat gerekir (VDİS'in 32. maddesinin 4. fıkrası).
  - soru: |
      X Devleti'nin diplomatik ajanı Ali'nin Türkiye'deki özel yazlığına ilişkin tapu iptali davası açılmıştır. Yazlık, misyon amacıyla X Devleti adına tutulmamaktadır. VDİS'e göre hangisi doğrudur?
    siklar:
      - "Ali bu davada bağışıklık ileri süremez; özel taşınmaza ilişkin ayni dava istisnadır."
      - "Diplomatın hukuk yargısından bağışıklığı istisnasızdır; dava reddedilir."
      - "Dava ancak X Devleti açıkça feragat ederse görülebilir."
      - "Dava, yargı bağışıklığı değil kişi dokunulmazlığı nedeniyle reddedilir."
    dogru: 0
    aciklama: |
      VDİS'in 31. maddesinin 1. fıkrası, hukuk ve idari yargı bağışıklığına üç istisna getirir; kabul eden devlet topraklarındaki özel taşınmaza ilişkin ayni dava (misyon amacıyla gönderen devlet adına tutulmuyorsa) bunlardan biridir. İstisnasız bağışıklık yalnız ceza yargısı içindir.
  - soru: |
      X Devleti büyükelçiliğinin yabancı uyruklu, Türkiye'de daimi ikametli olmayan idari-teknik personeli Zeynep, görev dışında bir trafik kazasına karışmış ve hakkında tazminat davası açılmıştır. VDİS'e göre hangisi doğrudur?
    siklar:
      - "Hukuk yargı bağışıklığı görev dışı işlemlere uzanmadığından tazminat davası görülebilir."
      - "İdari-teknik personel, diplomatlar gibi hukuk yargısından tam bağışıktır."
      - "İdari-teknik personel hiçbir bağışıklıktan yararlanmaz."
      - "Dava ancak gönderen devletin açık feragatiyle görülebilir."
    dogru: 0
    aciklama: |
      VDİS'in 37. maddesinin 2. fıkrasına göre idari ve teknik personelin hukuk ve idari yargı bağışıklığı görevleri dışında yaptıkları işlemlere uzanmaz. Ceza yargısı bağışıklığı ise tamdır.
  - soru: |
      Diplomatik ilişkilerin kesilmesinin konsolosluk ilişkilerine etkisi VKİS'e göre nedir?
    siklar:
      - "Diplomatik ilişkilerin kesilmesi konsolosluk ilişkilerini kendiliğinden kesmez."
      - "Konsolosluk ilişkileri de kendiliğinden sona erer."
      - "Konsolosluk ilişkileri yalnız gönderen devletin onayıyla sürer."
      - "Konsolosluk ilişkileri ancak koruyucu devlet aracılığıyla sürebilir."
    dogru: 0
    aciklama: |
      VKİS'in 2. maddesinin 3. fıkrası, diplomatik ilişkilerin kesilmesinin konsolosluk ilişkilerinin kesilmesini kendiliğinden gerektirmeyeceğini söyler.
  - soru: |
      Y Devleti'nin İstanbul Başkonsolosluğu'nda görevli bir konsolos, ağır bir suçtan şüphelenilmektedir. Hakkında yetkili yargı makamının tutuklama kararı vardır. VKİS'e göre hangisi doğrudur?
    siklar:
      - "Konsolos ağır suç ve yargı kararı bulunduğundan tutuklanabilir."
      - "Konsolos, diplomatlar gibi hiçbir tutuklamaya tabi tutulamaz."
      - "Konsolos yalnız gönderen devlet rıza verirse tutuklanabilir."
      - "Konsolos ancak persona non grata ilan edildikten sonra tutuklanabilir."
    dogru: 0
    aciklama: |
      VKİS'in 41. maddesine göre konsolosluk memurları, ağır suç ve yetkili yargı makamının kararı dışında yargılama öncesinde tutuklanamaz ya da gözaltına alınamaz. Diplomatik ajanın kişi dokunulmazlığı ise mutlaktır (VDİS'in 29. maddesi).
  - soru: |
      Z Devleti vatandaşı Ahmet, İstanbul'da tutuklanmıştır; kimliğinden yabancı olduğu anlaşılmıştır, ancak ona konsolosluk hakları bildirilmemiştir. VKİS'in 36. maddesi bakımından hangisi doğrudur?
    siklar:
      - "Makamlar Ahmet'e haklarını gecikmeksizin bildirmek zorundaydı; konsolosluğa bildirim ise onun isteğine bağlıdır."
      - "Haklar yalnız Ahmet bildirim talep ederse hatırlatılır."
      - "Bildirim yalnız suçun ağırlığına göre yapılır."
      - "Bildirim ancak Ahmet'in vatandaşı olduğu devletin yazılı talebiyle yapılır."
    dogru: 0
    aciklama: |
      VKİS'in 36. maddesi, tutuklanan kişiye haklarının gecikmeksizin bildirilmesini her durumda şart koşar; konsolosluğa bildirim ise kişinin isteğine bağlıdır. Hakların bildirilmemesi ihlaldir.
  - soru: |
      Türkiye'nin 1961 ve 1963 Viyana sözleşmeleri bakımından durumu hangisidir?
    siklar:
      - "VDİS'e 6 Mart 1985'te, VKİS'e 19 Şubat 1976'da katılmıştır; ihtiyari protokollere taraf değildir."
      - "Her iki sözleşmeyi onaylamış ve her iki ihtiyari protokole taraftır."
      - "VDİS'e taraf, VKİS'e taraf değildir."
      - "Her iki sözleşmeye de ihtiyari protokollerle birlikte katılmıştır."
    dogru: 0
    aciklama: |
      treaties.un.org kayıtlarına göre Türkiye her iki sözleşmeye katılma yoluyla taraftır (VDİS 6 Mart 1985, VKİS 19 Şubat 1976); ihtiyari protokollere taraf değildir.
  - soru: |
      Tahran'daki ABD Diplomatik ve Konsolosluk Personeli kararında UAD'ın yaklaşımı hangisidir?
    siklar:
      - "İran, misyonu korumadığı için sorumludur; persona non grata ve ilişkileri kesme diplomatik hukukun olağan araçlarıdır, zorlama meşru değildir."
      - "İran'ın sorumluluğu yalnız militanlara aittir, devlete yüklenemez."
      - "İran, ABD'nin faaliyetleri kanıtlanırsa misyon binasına el koyabilir."
      - "Diplomatik hukuk, kabul eden devleti binayı koruma ödevinden kurtarır."
    dogru: 0
    aciklama: |
      Divan, İran'ın baskını önlemek ve durdurmak için hiçbir şey yapmamasının sorumluluk doğurduğuna, ayrıca sonradan işgalin onaylanıp sürdürülmesiyle eylemlerin devlete yüklendiğine karar vermiştir. İran'ın savunması kabul edilmemiş; diplomatik hukukun kendi araçları (persona non grata, ilişkileri kesme) bulunduğu belirtilmiştir.
olaylar:
  - olay: |
      X Devleti'nin Ankara Büyükelçiliği müsteşarı Boris (diplomatik personel, Türk vatandaşı değil), bir gece alkollü araç kullanırken yaya Ayşe'ye çarpar ve Ayşe ağır yaralanır. Polis, Boris'i gözaltına almak ve ardından özel konutunda arama yapmak ister. Ayşe, Boris aleyhine tazminat davası açmayı düşünmektedir. Bakanlık ise Boris'e karşı bir tedbir arayışındadır.
      1. Polis Boris'i gözaltına alabilir mi? Konutunda arama yapabilir mi?
      2. Boris hakkında Türk mahkemelerinde ceza davası açılabilir mi? X Devleti ne yapabilir?
      3. Ayşe'nin tazminat davası görülebilir mi?
      4. Türkiye hangi aracı kullanabilir?
    olcut:
      - {tespit: "Diplomatik ajanın kişisi dokunulmazdır; gözaltı mümkün değildir", puan: 20, madde: "VDİS 29"}
      - {tespit: "Özel konutun misyon binasıyla aynı dokunulmazlıkta olduğu; arama yapılamayacağı", puan: 15, madde: "VDİS 30 ve 22"}
      - {tespit: "Ceza yargısı bağışıklığının istisnasız olduğu; yalnız gönderen devletin açık feragatiyle kalkabileceği", puan: 20, madde: "VDİS 31/1 ve 32"}
      - {tespit: "Tazminat davasında üç istisnadan hiçbirinin bulunmadığı, bağışıklığın sürdüğü", puan: 20, madde: "VDİS 31/1"}
      - {tespit: "Persona non grata ilanının gerekçesiz yapılabileceği", puan: 15, madde: "VDİS 9/1"}
      - {tespit: "Bağışıklığın gönderen devlet yargısında yargılanmayı engellemediği", puan: 10, madde: "VDİS 31/4"}
    cozum: |
      **Nitelendirme:** Boris, misyonun diplomatik personeline mensup bir diplomatik ajandır; Türk vatandaşı olmadığı için VDİS'in 38. maddesi devreye girmez. Olayda kişi dokunulmazlığı, konut dokunulmazlığı, ceza ve hukuk yargısı bağışıklığı ile kabul eden devletin tedbir imkânları birlikte sorulmaktadır.

      **Hukuki sorunlar:** (1) Boris gözaltına alınabilir mi, konutu aranabilir mi? (2) Ceza ve hukuk yargısı bağışıklığı var mı, hangi istisnalar uygulanır? (3) Türkiye'nin elindeki araç nedir?

      **İlgili hükümler:** VDİS'in 29. maddesi diplomatik ajanın kişisini dokunulmaz kılar ve hiçbir tutuklama ya da gözaltına izin vermez. VDİS'in 30. maddesi özel konutu misyon binasıyla aynı dokunulmazlığa bağlar; VDİS'in 22. maddesi de binaya şefin rızası olmadan girilemeyeceğini söyler. VDİS'in 31. maddesinin 1. fıkrası ceza yargısı bağışıklığını istisnasız tanır; hukuk ve idari yargı bağışıklığına üç istisna getirir. VDİS'in 32. maddesine göre feragat gönderen devlete aittir ve açık olmalıdır. VDİS'in 9. maddesi persona non grata ilanına imkân verir.

      **Değerlendirme:** Polis, Boris'i gözaltına alamaz; kişi dokunulmazlığı tam ve istisnasızdır. Özel konut aynı dokunulmazlıkta olduğundan arama da yapılamaz. Ceza yargılaması Türk mahkemelerinde mümkün değildir; yalnız X Devleti açıkça feragat ederse bu engel kalkar. Bağışıklık cezasızlık değildir: Boris kendi devleti yargısında yargılanabilir (VDİS'in 31. maddesinin 4. fıkrası). Ayşe'nin tazminat davasında bakılması gereken şey, olayın hukuk yargısı bağışıklığının üç istisnasından (özel taşınmaz, özel sıfatla miras, görev dışı mesleki ya da ticari faaliyet) birine girip girmediğidir. Trafik kazası bunlardan değildir; bu nedenle bağışıklık sürer. Kıyas olarak, olayda konsolosluk memuru bulunsaydı, VKİS'in 43. maddesinin 2. fıkrasındaki taşıt kazası istisnası nedeniyle bağışıklık olmayabilirdi; ancak Boris diplomatik ajandır. Türkiye'nin aracı, gerekçe göstermeden Boris'i persona non grata ilan etmektir; gönderen devlet makul sürede geri çağırmazsa kabul eden devlet onu misyon üyesi saymayı reddedebilir. Boris ülkeden ayrılana ya da makul süre dolana kadar ayrıcalıklarını korur (VDİS'in 39. maddesi).

      **Sonuç:** (1) Gözaltı ve konut araması mümkün değildir. (2) Ceza davası açılamaz; X Devleti açık feragat edebilir; Boris X Devleti'nde yargılanabilir. (3) Tazminat davası bağışıklık nedeniyle görülemez. (4) Türkiye gerekçesiz persona non grata ilan edebilir.
  - olay: |
      Y Devleti'nin İstanbul Başkonsolosluğu'nda bir gece yangın çıkar; itfaiye ekibi konsolosluk şefine ulaşamaz. Ertesi gün gümrük görevlileri, içinde silah bulunduğundan ciddi biçimde şüphelendikleri bir konsolosluk çantasını açmak ister. Aynı konsolosluktaki konsolos Murat ise ağır bir suçtan şüphelidir ve hakkında yetkili bir yargı makamı tutuklama kararı vermiştir.
      1. İtfaiye ekibi şefin rızasını beklemeden konsolosluk binasına girebilir mi?
      2. Gümrük görevlileri çantayı açabilir mi? Başka ne yapılabilir?
      3. Murat tutuklanabilir mi?
    olcut:
      - {tespit: "Yangın hâlinde konsolosluk şefinin rızasının varsayılabilmesi", puan: 25, madde: "VKİS 31/2"}
      - {tespit: "Konsolosluk çantasının açılamayacağı, ciddi şüphede gönderen devlet temsilcisi huzurunda açılmasının istenebileceği", puan: 25, madde: "VKİS 35/3"}
      - {tespit: "Ret hâlinde çantanın menşeine geri gönderilmesi", puan: 15, madde: "VKİS 35/3"}
      - {tespit: "Konsolos Murat'ın ağır suç ve yargı kararıyla tutuklanabileceği", puan: 25, madde: "VKİS 41/1"}
      - {tespit: "Bina ve kişi bakımından VDİS'ten farkın gösterilmesi (rıza varsayımı, tutuklama imkânı)", puan: 10, madde: "VDİS 22 ve 29"}
    cozum: |
      **Nitelendirme:** Olay, diplomatik misyona değil konsolosluğa ilişkindir; bu nedenle VKİS uygulanır. Üç ayrı konu vardır: konsolosluk binasına yangında giriş, konsolosluk çantasının açılması ve konsolosluk memurunun tutuklanması.

      **Hukuki sorunlar:** (1) Şefin rızası alınamıyorsa binaya girilebilir mi? (2) Konsolosluk çantası hangi şartla açılabilir? (3) Konsolos tutuklanabilir mi?

      **İlgili hükümler:** VKİS'in 31. maddesinin 2. fıkrasına göre yangın ya da hemen koruyucu tedbir gerektiren başka bir afet hâlinde konsolosluk şefinin rızası varsayılabilir. VKİS'in 35. maddesinin 3. fıkrası, konsolosluk çantasının açılamayacağını ve alıkonamayacağını söyler; yetkililer çantada resmî belge ve eşya dışında bir şey bulunduğuna ciddi sebeple inanırsa gönderen devletin yetkili temsilcisi huzurunda açılmasını isteyebilir, talep reddedilirse çanta menşeine geri gönderilir. VKİS'in 41. maddesinin 1. fıkrasına göre konsolosluk memurları, ağır suç ve yetkili yargı makamının kararı dışında yargılama öncesinde tutuklanamaz ya da gözaltına alınamaz.

      **Değerlendirme:** İtfaiye ekibi şefe ulaşamıyorsa bile binaya girebilir; çünkü yangında rıza varsayılır. Bu kural diplomatik misyon binası için geçerli değildir; VDİS'in 22. maddesinde böyle bir istisna yoktur. Çanta konusunda gümrük görevlileri çantayı kendileri açamaz ve alıkoyamaz. Silah bulunduğuna dair ciddi şüpheleri varsa Y Devleti'nin yetkili temsilcisinin huzurunda açılmasını isteyebilirler. Y Devleti reddederse çanta geldiği yere iade edilir. Diplomatik çantada ise açma talebi dahi söz konusu olmaz (VDİS'in 27. maddesinin 3. fıkrası). Murat bakımından ağır suç şüphesi ve yetkili yargı makamının kararı vardır; bu iki şart birlikte gerçekleştiği için tutuklama VKİS'in 41. maddesine aykırı değildir. Diplomatik ajan olsaydı VDİS'in 29. maddesi mutlak dokunulmazlık sağlayacak ve tutuklama imkânsız olurdu.

      **Sonuç:** (1) İtfaiye girebilir; rıza varsayılır. (2) Çanta açılamaz; ancak gönderen devlet temsilcisinin huzurunda açılması istenebilir, ret hâlinde geri gönderilir. (3) Murat ağır suç ve yargı kararı nedeniyle tutuklanabilir.
kartlar:
  - on: "Agrément ile exequatur arasındaki fark?"
    arka: "Agrément misyon şefi (diplomatik) için, exequatur konsolosluk şefi için gerekir. Agrément reddinde gerekçe gösterilmez (VDİS'in 4. maddesi; VKİS'in 12. maddesi)."
  - on: "Persona non grata ne zaman ve nasıl ilan edilir?"
    arka: "Kabul eden devlet her zaman, gerekçe göstermeden ve kişi ülkeye varmadan da ilan edebilir (VDİS'in 9. maddesi)."
  - on: "VDİS'in 22. maddesinde yangın istisnası var mı?"
    arka: "Hayır. Misyon binasına şefin rızası olmadan girilemez. Yangında rıza varsayımı VKİS'in 31. maddesinin 2. fıkrasındaki konsolosluk binası kuralıdır."
  - on: "Diplomatik çanta ile konsolosluk çantası farkı?"
    arka: "Diplomatik çanta hiç açılamaz ve alıkonamaz (VDİS 27/3). Konsolosluk çantası ciddi şüphede gönderen devlet temsilcisi huzurunda açılmak üzere istenebilir; ret hâlinde geri gönderilir (VKİS 35/3)."
  - on: "Diplomatın kişi dokunulmazlığı ile konsolosun farkı?"
    arka: "Diplomat hiçbir tutuklamaya tabi değildir (VDİS 29). Konsolos ağır suç ve yargı kararıyla tutuklanabilir (VKİS 41)."
  - on: "Diplomatın hukuk ve idari yargı bağışıklığının üç istisnası?"
    arka: "Özel taşınmaza ilişkin ayni dava, özel sıfatla miras davası, görev dışı mesleki ya da ticari faaliyet (VDİS 31/1). Ceza bağışıklığı istisnasızdır."
  - on: "Diplomatik bağışıklıktan kim, nasıl feragat eder?"
    arka: "Gönderen devlet, açıkça. Yargılamadan feragat icradan feragat sayılmaz (VDİS 32)."
  - on: "VKİS 36 uyarınca tutuklanan yabancıya ne yapılır?"
    arka: "Haklarının gecikmeksizin bildirilmesi şarttır; konsolosluğa bildirim kişinin isteğine bağlıdır."
  - on: "Konsolosluk memurunun bağışıklığı kapsamı?"
    arka: "Yalnız konsolosluk görevleri sırasındaki işlemler (VKİS 43/1). Taşıt kazasından doğan üçüncü kişi davası istisnadır (43/2)."
  - on: "Tahran'daki ABD Personeli (1980) kararının ilkesi?"
    arka: "Kabul eden devletin misyonu koruma ödevi vardır; ihlalde diplomatik hukukun araçları persona non grata ve ilişki kesmedir, zorlama meşru değildir."
  - on: "LaGrand (2001) kararının ilkesi?"
    arka: "VKİS 36/1 bireysel haklar yaratır; uyruk devlet bunları UAD'da ileri sürebilir; geçici tedbir kararları bağlayıcıdır."
  - on: "Türkiye VDİS ve VKİS'e ne zaman, nasıl taraf oldu?"
    arka: "Katılma yoluyla: VDİS'e 6 Mart 1985, VKİS'e 19 Şubat 1976. İhtiyari protokollere taraf değildir."
