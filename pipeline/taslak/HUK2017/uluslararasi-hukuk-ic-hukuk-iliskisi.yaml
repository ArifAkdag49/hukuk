  - 📌 VAHS'ın 27. maddesi: iç hukuk, antlaşmayı yerine getirmemenin mazereti olamaz. UHK Maddeleri'nin 3. ve 32. maddeleri aynı yönde.
  - 📌 AİHM'in kesinleşmiş ihlal kararı: ceza davasında yargılamanın yenilenmesi (karar kesinleşince 1 yıl, CMK m. 311/1-f); hukuk davasında yargılamanın iadesi (HMK m. 375/1-i).
  - ⚠️ AY m. 148/1'de eski kitaplarda "kanun hükmünde kararnameler" yazar; 2017'den beri "Cumhurbaşkanlığı kararnameleri" ifadesi vardır.
doktrin: |
  ### Türkiye monist mi, düalist mi?
  Bir görüşe göre antlaşma, uygun bulma kanunu ve onaydan sonra yayımlanmakla ayrıca dönüştürülmeden iç hukukun parçası olur ve kanun hükmünde uygulanır; bu nedenle sistem ılımlı monizme yakındır. Karşı görüşe göre uygun bulma kanunu bir iç hukuk işlemidir ve antlaşmanın iç hukuktaki gücünü uluslararası hukuk değil Anayasa belirler (kanun hükmünde); sistemde düalist izler vardır. Yaygın tutum, kesin bir model yerine karma/ılımlı sistem nitelendirmesidir. AYM, AİHS'in doğrudan uygulanma kabiliyetini haiz olduğunu söylemiştir; fakat bir kuramı açıkça benimsememiştir.

  ### Temel haklara ilişkin antlaşmanın hiyerarşideki yeri
  Bir görüşe göre 2004 ek cümlesiyle bu antlaşmalar kanunüstü konuma geçmiştir. Karşı görüşe göre ek cümle bir hiyerarşi değil, yalnız bir çatışma (öncelik) kuralıdır: antlaşma kanunu iptal etmez, uygulanmasını engeller. AYM her iki dili de kullanmıştır ("bir çeşit hiyerarşi", "zımni ilga kuralı", "özel bir çatışma kuralı").

  ### Antlaşma ile Anayasa
  Üçüncü cümle yalnız "kanunlar"dan söz eder. Temel haklara ilişkin antlaşma ile Anayasa çatışırsa hangisinin uygulanacağı ve uygun bulma kanununun denetlenip denetlenemeyeceği tartışmalıdır.

  ### Kapsam ve sonraki kanun
  "Temel hak ve özgürlüklere ilişkin" antlaşmanın yalnız insan hakları sözleşmelerini mi, yoksa başka antlaşmaların temel hakları ilgilendiren hükümlerini de mi kapsadığı tartışmalıdır. Sonraki kanun ile önceki sıradan antlaşma çatışırsa bir görüş "sonraki kanun önceki kanunu kaldırır" ilkesini, bir görüş antlaşmanın özel hüküm sayılacağını, bir görüş de ahde vefa ve VAHS'ın 27. maddesi gereği antlaşmanın uygulanması gerektiğini savunur. Örf ve âdet (teamül) hukukunun iç hukuktaki yeri de Anayasa'da açık hüküm bulunmadığından öğretide tartışmalıdır.
sozluk:
  - terim: Monizm
    tanim: "Uluslararası hukuk ve iç hukuku tek bir hukuk düzeni sayan kuram; antlaşma ayrıca bir işleme gerek kalmadan iç hukukun parçası olur."
  - terim: Düalizm
    tanim: "İki hukuk düzeninin birbirinden ayrı olduğunu savunan kuram; antlaşma iç hukukta ancak bir iç hukuk işlemiyle dönüştürülerek uygulanır."
  - terim: Dönüştürme (transformation)
    tanim: "Antlaşmanın ayrı bir iç hukuk işlemiyle iç hukuk normuna çevrilmesi."
  - terim: Doğrudan uygulanabilirlik (self-executing)
    tanim: "Antlaşma hükmünün, ek bir iç düzenleme beklemeden hâkim ve idare tarafından uygulanabilecek açıklıkta olması."
  - terim: Usulüne göre yürürlüğe konulmuş
    tanim: "AY m. 90 uyarınca uygun bulma, onay ve gerektiğinde yayım usulünün tamamlanmış olması; AY m. 90/5'in koşuludur."
  - terim: Çatışma kuralı
    tanim: "İki normun aynı konuda çelişmesinde hangisinin uygulanacağını belirleyen kural; AY m. 90/5 son cümlesi böyle bir kuraldır."
  - terim: Zımni ilga
    tanim: "Bir kuralın açıkça kaldırılmadan, çelişen kural nedeniyle uygulanamaz hâle gelmesi; AYM, AY m. 90/5 son cümlesini bu nitelikte görmüştür."
  - terim: Ortak koruma alanı
    tanim: "Bir hakkın hem Anayasa'da hem AİHS ve Türkiye'nin taraf olduğu protokollerde güvence altında olması; bireysel başvurunun kabul şartıdır."
  - terim: Somut norm denetimi (itiraz yolu)
    tanim: "Davaya bakan mahkemenin uygulanacak kanunu Anayasaya aykırı bulması hâlinde AYM'ye başvurması (AY m. 152)."
  - terim: Yargılamanın yenilenmesi / iadesi
    tanim: "Kesinleşmiş hükmün belli sebeplerle yeniden görülmesi; AİHM'in kesinleşmiş ihlal kararı ceza davasında yenileme, hukuk davasında iade sebebidir."
kararlar:
  - id: "8f246960-a8e1-6980-147e-9d67463cb40f"
    ozet: |
      İstanbul Barosuna bağlı bir avukat 2005'te evlendi, evlilik öncesi soyadını kullanmaya devam etti ve yalnız bu soyadını kullanabilmek için dava açtı. Derece mahkemeleri ve Yargıtay talebi reddetti. AYM, soyadını AY m. 17 kapsamında, AİHS'in 8. maddesindeki özel hayatla birlikte inceledi. AY m. 90/5 son cümlesiyle kanunlar ile temel haklara ilişkin antlaşmalar arasında bir çeşit hiyerarşi kurulduğunu, çatışmada yargı mercilerinin kanunu bırakıp antlaşmayı uygulamakla yükümlü olduğunu ve kuralın bir zımni ilga kuralı olduğunu belirtti. Mahkemeler antlaşmaları uygulamadığı için müdahale kanunilik şartını sağlamamış, AY m. 17 ihlal edilmiştir; dosya yeniden yargılama için mahkemeye gönderilmiş, karar oybirliğiyle verilmiştir.
  - id: "a3df0d9a-8d52-f974-219b-2540e9d0c9db"
    ozet: |
      Zonguldak taşkömürü havzasında maden faaliyetinin yol açtığı çökme nedeniyle başvurucunun taşınmazındaki binalar kullanılamaz hâle geldi. Tazminat davası, ilgili kanunun mevcut hükmü nedeniyle reddedildi ve Yargıtay kararı onadı. AYM Genel Kurulu, mülkiyet hakkıyla (AY m. 35) bağlantılı olarak etkili başvuru hakkının (AY m. 40) ihlal edildiğine karar verdi. Konu bakımından kilit nokta şudur: AY m. 90 son fıkrasındaki ek cümle özel bir çatışma kuralıdır; ancak hak Anayasa ile AİHS'in ortak koruma alanındaysa uygulanacak kanunun Anayasaya aykırılığını ciddi bulan mahkemeden önce AY m. 152 itiraz yoluna başvurması beklenir. AY m. 90 son fıkrası itiraz yolunun mümkün olmadığı veya hakkın yalnız antlaşmada düzenlendiği durumlarda uygulanabilir. Karar oybirliğiyle verilmiştir.
  - id: "1213661600"
    ozet: |
      Türk bir holding şirketi, %46,12 paylı Avusturya mukimi ortağına temettü ödemiş ve Türkiye-Avusturya çifte vergilendirmeyi önleme anlaşmasının temettü maddesine göre %5 stopaj kesmiştir. İdare, Avusturya şirketinin aracı olduğunu, gerçek lehdarın Fransa mukimi %100 ortak olduğunu ve %15 kesilmesi gerektiğini ileri sürerek cezalı tarhiyat yapmıştır. Vergi mahkemesi tarhiyatı kaldırmış, bölge idare mahkemesi istinafı reddetmiştir. Danıştay 3. Daire, ilgili mevzuat olarak AY m. 90'ın son fıkrasını da anarak iki anlaşmanın temettü maddelerini doğrudan uygulamış ve bölge idare mahkemesi kararını oyçokluğuyla bozmuştur. Kararda kanun ile antlaşma arasında bir çatışma tartışılmamıştır; karar, antlaşmanın kanun hükmünde olduğunu ve ayrı dönüştürme işlemi aranmadan doğrudan uygulandığını gösterir.
sorular:
  - soru: |
      AY m. 90/5'in birinci cümlesine göre usulüne göre yürürlüğe konulmuş milletlerarası antlaşmaların iç hukuktaki gücü aşağıdakilerden hangisidir?
    siklar:
      - "Anayasa hükmündedir."
      - "Kanunüstüdür ve her zaman kanunlara üstündür."
      - "Kanun hükmündedir."
      - "Cumhurbaşkanlığı kararnamesi hükmündedir."
    dogru: 2
    aciklama: |
      AY m. 90/5'in birinci cümlesi antlaşmaları kanun hükmünde sayar. Kanunüstü olma yalnız temel haklara ilişkin antlaşmaların kanunla çatışmasında, üçüncü cümlenin şartları varsa söz konusu olur; kural, genel bir üstünlük değildir (AY m. 90).
  - soru: |
      Bir asliye ticaret mahkemesi, Türkiye'nin taraf olduğu ve usulüne göre yürürlüğe konulmuş bir taşıma sözleşmesinin bir hükmünün Anayasaya aykırı olduğu kanaatine varmıştır. Mahkeme aşağıdakilerden hangisini yapabilir?
    siklar:
      - "Antlaşma hakkında Anayasaya aykırılık iddiasıyla AYM'ye başvuramaz; AY m. 90/5 ikinci cümlesi bunu engeller."
      - "Davayı geri bırakıp AY m. 152 uyarınca itiraz yoluyla AYM'ye başvurur."
      - "AYM'ye beş ay içinde karar vermesi için başvurur."
      - "Antlaşmayı kendiliğinden iptal eder."
    dogru: 0
    aciklama: |
      AY m. 90/5'in ikinci cümlesi, usulüne göre yürürlüğe konulmuş antlaşmalar hakkında Anayasaya aykırılık iddiasıyla AYM'ye başvurulmasını yasaklar. İtiraz yolu da yalnız kanun ve Cumhurbaşkanlığı kararnamesi içindir (AY m. 152/1); mahkemenin iptal yetkisi de yoktur.
  - soru: |
      Bir mahkeme, uygulayacağı bir kanun hükmünün, hem Anayasa'da hem AİHS'te güvence altında olan bir hakka aykırı olduğu kanısındadır. AYM Genel Kurulu'nun Hulusi Yılmaz kararındaki yaklaşımına göre mahkemeden ne beklenir?
    siklar:
      - "Kanunu her hâlde uygulamaktan kaçınması ve bunu AYM'ye bildirmemesi"
      - "Hiçbir yola başvurmadan kanunu olduğu gibi uygulaması"
      - "Kararı AİHM'in vermesini beklemek üzere davayı süresiz geri bırakması"
      - "Öncelikle AY m. 152 uyarınca itiraz yoluna başvurmayı düşünmesi; AY m. 90/5 son cümlesi bu yolun mümkün olmadığı ya da hakkın yalnız antlaşmada bulunduğu hâllerde öne çıkar"
    dogru: 3
    aciklama: |
      Genel Kurul'a göre hak ortak koruma alanındaysa uygulanacak kanunun Anayasaya aykırılığını ciddi bulan mahkemeden önce itiraz yolu beklenir; çünkü bu yol kanunu iptal eder. AY m. 90/5 son cümlesi yine uygulanabilir, ama özellikle itiraz yolunun kapalı olduğu ya da hakkın yalnız antlaşmada düzenlendiği durumlarda öne çıkar (AY m. 152).
  - soru: |
      Türkiye, bir insan hakları sözleşmesini imzalamıştır; ancak TBMM bu sözleşmeyi uygun bulan kanunu çıkarmamış, sözleşme onaylanmamıştır. Sözleşme hükmü ile bir kanun hükmü çatışırsa mahkemenin durumu hangisidir?
    siklar:
      - "AY m. 90/5 son cümlesi gereği sözleşme hükmünü esas almalıdır."
      - "Sözleşme usulüne göre yürürlüğe konulmadığı için AY m. 90/5'in önceliğinden yararlanamaz."
      - "Sözleşme imzalandığı için kanun hükmündedir ve sonraki kanunu ilga eder."
      - "Sözleşme Anayasa hükmündedir, kanun uygulanamaz."
    dogru: 1
    aciklama: |
      AY m. 90/5 ancak "usulüne göre yürürlüğe konulmuş" antlaşmalar için geçerlidir. Uygun bulma ve onay olmadan antlaşma iç hukukta kanun hükmünde değildir (AY m. 90/1, AY m. 104).
  - soru: |
      Danıştay, Türkiye-Avusturya çifte vergilendirmeyi önleme anlaşmasındaki stopaj oranını ayrıca bir iç hukuk kanunu aranmadan uygulamıştır. Bu uygulama aşağıdakilerden hangisini gösterir?
    siklar:
      - "Bu anlaşma temel hak antlaşması olduğu için kanundan önce uygulanmıştır."
      - "Türkiye'nin kesin olarak düalist bir sistemi benimsediğini"
      - "Usulüne göre yürürlüğe konulmuş antlaşmanın kanun hükmünde olduğunu ve doğrudan uygulanabildiğini"
      - "Antlaşmaların Anayasa Mahkemesince denetlendiğini"
    dogru: 2
    aciklama: |
      Vergi anlaşması temel hak antlaşması değildir; ama kanun hükmündedir ve ayrıca dönüştürme işlemi aranmadan uygulanır (AY m. 90/5, birinci cümle). Karar, kanun-antlaşma çatışması içermez ve düalizmi ya da AYM denetimini göstermez.
  - soru: |
      Aşağıdakilerden hangisi **düalizm** kuramının tanımıdır?
    siklar:
      - "İki hukuk düzeni birbirinden ayrıdır; antlaşma iç hukukta ancak bir iç hukuk işlemiyle dönüştürülerek uygulanır."
      - "Uluslararası hukuk ve iç hukuk tek bir düzendir ve antlaşma ayrı işlem olmadan uygulanır."
      - "Her antlaşma, iç hukukta Anayasa'dan üstündür."
      - "Antlaşmalar iç hukukta hiçbir zaman uygulanmaz."
    dogru: 0
    aciklama: |
      Düalizm iki ayrı düzen kabul eder ve antlaşmanın iç hukukta uygulanması için dönüştürme arar. Öbür şık monizmi anlatır.
  - soru: |
      A Devleti, B Devleti ile yaptığı yürürlükteki bir antlaşmayla B vatandaşlarına tanıdığı vergi muafiyetini sonradan çıkardığı bir kanunla kaldırır. A, "kendi iç hukukumuza göre kanun geçerlidir" diye savunma yapar. Her iki devlet de VAHS'a taraftır. A'nın savunması hakkında hangisi doğrudur?
    siklar:
      - "Geçerlidir, çünkü iç hukuk düzeni devletin egemenlik alanındadır."
      - "Geçerlidir, çünkü sonraki kanun önceki antlaşmayı ilga eder."
      - "Geçerlidir, çünkü uluslararası hukukta düalizm esastır."
      - "Geçersizdir; taraf, antlaşmayı yerine getirmemesini haklı göstermek için iç hukukunu ileri süremez (VAHS'ın 27. maddesi)."
    dogru: 3
    aciklama: |
      VAHS'ın 27. maddesi iç hukukun antlaşmaya aykırılığın mazereti olamayacağını söyler. UHK Devlet Sorumluluğu Maddeleri'nin 3. maddesi de fiilin uluslararası hukuka aykırılığını iç hukukun etkilemeyeceğini belirtir. İç hukukta hangi kuralın uygulanacağı ayrı bir sorudur.
  - soru: |
      UHK Devlet Sorumluluğu Maddeleri'nin 3. maddesine göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İç hukukta hukuka uygun sayılan fiil uluslararası hukukta da hukuka uygun sayılır."
      - "Bir fiilin uluslararası hukuka aykırılığı uluslararası hukuka göre belirlenir; iç hukukta hukuka uygun sayılması bunu etkilemez."
      - "Yasama organının davranışı devletin fiili sayılmaz."
      - "Uluslararası aykırılık iç hukuk mahkemelerinin kararına bağlıdır."
    dogru: 1
    aciklama: |
      3. madde nitelendirmeyi uluslararası hukuka bırakır. Aynı metnin 4. maddesi, yasama organının davranışını da devletin fiili sayar; bu yüzden şıkların ikisi yanlıştır.
  - soru: |
      Bir başvurucu, yalnızca AİHS'te güvence altında olup Anayasa'da bulunmayan bir hakkın kamu gücü tarafından ihlal edildiği iddiasıyla olağan yolları tükettikten sonra AYM'ye bireysel başvuru yapmıştır. AYM'nin yerleşik yaklaşımına göre başvurunun durumu nedir?
    siklar:
      - "Esastan incelenir, çünkü AY m. 90/5 AİHS'i Anayasa'nın üstüne çıkarmıştır."
      - "Esastan incelenir, çünkü AİHS kanun hükmündedir."
      - "Ortak koruma alanı dışında kaldığı için kabul edilemez."
      - "AİHM'e gönderilir."
    dogru: 2
    aciklama: |
      Bireysel başvuruda hak hem Anayasa'da hem AİHS'te bulunmalıdır (AY m. 148/3; 6216 sayılı Kanun m. 45/1). İnceleme ölçütü Anayasa'dır, AİHS yalnız kapsamı belirler. AY m. 90/5 ile AY m. 148/3 farklı işler görür.
  - soru: |
      AY m. 90/5'in üçüncü cümlesine göre antlaşmanın esas alınması için aşağıdakilerden hangisi gereklidir?
    siklar:
      - "Antlaşmanın temel hak ve özgürlüklere ilişkin olması ve kanunla aynı konuda farklı hüküm içermesi"
      - "Antlaşmanın Anayasa Mahkemesince iptal edilmiş olması"
      - "Kanunun Anayasa Mahkemesince Anayasaya aykırı bulunmuş olması"
      - "Antlaşmanın Resmî Gazete'de yayımlandıktan sonra bir yıl geçmiş olması"
    dogru: 0
    aciklama: |
      Üçüncü cümlenin şartları: usulüne göre yürürlük, temel hak ve özgürlüklere ilişkin olma ve kanunla aynı konuda farklı hüküm içerme. Kanunun iptal edilmiş olması aranmaz; öncelik çatışma kuralıdır (AY m. 90).
  - soru: |
      AY m. 148/1'e göre Anayasa Mahkemesi aşağıdakilerden hangisinin Anayasaya uygunluğunu denetler?
    siklar:
      - "Usulüne göre yürürlüğe konulmuş milletlerarası antlaşmaların"
      - "Bakanlar Kurulu yönetmeliklerinin"
      - "Uygun bulma kanununu çıkarmayan her devletin antlaşmalarının"
      - "Kanunların, Cumhurbaşkanlığı kararnamelerinin ve TBMM İçtüzüğünün"
    dogru: 3
    aciklama: |
      AY m. 148/1 bu üç normu sayar. Antlaşmalar listede yoktur ve AY m. 90/5 ikinci cümlesi başvuruyu kapatır. Eski kitaplardaki "kanun hükmünde kararnameler" ifadesi 2017'den beri "Cumhurbaşkanlığı kararnameleri" olmuştur.
  - soru: |
      Ali'nin mahkûmiyeti kesinleşmiştir; AİHM, bu mahkûmiyetin AİHS'in ihlaliyle verildiğini ve hükmün bu aykırılığa dayandığını kesinleşmiş kararıyla tespit etmiştir. Ali yargılamanın yenilenmesini hangi süre içinde isteyebilir?
    siklar:
      - "AİHM kararının verildiği tarihten itibaren üç ay"
      - "AİHM kararının kesinleştiği tarihten itibaren bir yıl"
      - "Süre sınırı yoktur"
      - "Mahkûmiyetin kesinleştiği tarihten itibaren beş yıl"
    dogru: 1
    aciklama: |
      CMK m. 311/1-f'ye göre yargılamanın yenilenmesi, AİHM kararının kesinleştiği tarihten itibaren bir yıl içinde istenir.
olaylar:
  - olay: |
      Avukat Zeynep 2005'te evlenmiş, evlendikten sonra da evlilik öncesi soyadını kullanmaya devam etmiştir. Yıllar sonra yalnız evlilik öncesi soyadını kullanabilmek için dava açmış, ancak aile mahkemesi "Türk Medeni Kanunu'nda böyle bir imkân yok" diyerek talebi reddetmiştir. Zeynep yargılama boyunca, evli kadının soyadı konusunda yargı mercilerinin AİHS'in özel hayatı koruyan hükmünü ve ayrımcılık yasağını da dikkate alması gerektiğini ileri sürmüştür. Karar temyizde onanmış, olağan kanun yolları 2012 yılında tükenmiş ve karar kesinleşmiştir. Olay, 2013 öncesindeki mevzuata göre değerlendirilecektir.
      1. AİHS iç hukukta uygulanabilir mi?
      2. Kanun hükmü ile AİHS çatıştığında hangisi esas alınır? Bu, kanunun iptali anlamına gelir mi?
      3. Zeynep AYM'ye bireysel başvuru yapabilir mi, AYM nasıl bir sonuca varabilir?
    olcut:
      - {tespit: "AİHS'in usulüne göre yürürlüğe konulmuş antlaşma olarak kanun hükmünde olduğunun ve AYM'ye göre iç hukukta doğrudan uygulanabileceğinin tespiti", puan: 15, madde: "AY m. 90"}
      - {tespit: "Temel haklara ilişkin antlaşma ile kanunun aynı konuda farklı hüküm içermesi hâlinde antlaşma hükmünün esas alınacağı (üç şartın tespiti)", puan: 25, madde: "AY m. 90"}
      - {tespit: "Önceliğin iptal değil çatışma kuralı olduğu; kanunun yürürlükte kalıp yalnız somut uyuşmazlıkta uygulanmayacağı", puan: 20, madde: "AY m. 153"}
      - {tespit: "Bireysel başvuru koşulları: kamu gücü, olağan yolların tükenmesi, ortak koruma alanı (soyadının AY m. 17 ve AİHS kapsamı)", puan: 25, madde: "AY m. 148"}
      - {tespit: "Sonuç: derece mahkemelerinin antlaşmayı uygulamaması kanunilik şartını sağlamadığından AY m. 17'nin ihlali ve yeniden yargılama", puan: 15, madde: "AY m. 17"}
    cozum: |
      **Nitelendirme:** Olay, usulüne göre yürürlüğe konulmuş bir temel hak antlaşmasının (AİHS) bir kanun hükmüyle çatışması ve bu çatışmanın bireysel başvuruda nasıl çözüleceğiyle ilgilidir. Yargılama 2013 öncesindeki mevzuata göre değerlendirilir.

      **Hukuki sorunlar:** (1) AİHS'in iç hukuktaki gücü, (2) çatışma kuralı ve niteliği, (3) bireysel başvurunun şartları ve sonucu.

      **İlgili hükümler:** AY m. 90/5; AY m. 148/3; AY m. 17; 6216 sayılı Kanun m. 45; AY m. 153.

      **Değerlendirme:** Birinci soru: Usulüne göre yürürlüğe konulmuş milletlerarası antlaşmalar kanun hükmündedir (AY m. 90/5, birinci cümle). AYM, Sevim Akat Eşki kararında AİHS'in iç hukukta doğrudan uygulanabilir olduğunu söylemiştir.

      İkinci soru: AİHS temel hak ve özgürlüklere ilişkin bir antlaşmadır. Soyadını kullanma konusunda kanun hükmü ile antlaşma aynı konuda farklı hüküm içerir. Bu durumda AY m. 90/5'in üçüncü cümlesi gereği antlaşma hükümleri esas alınır. Bu bir iptal değil, çatışma kuralıdır; AYM ona "zımni ilga kuralı" ve "bir çeşit hiyerarşi" demiştir. Kanun yürürlükte kalır, ama uygulanma kabiliyetini bu olay bakımından yitirir. Kanunun yürürlükten kalkması ancak TBMM'nin değişikliği ya da AYM'nin iptal kararıyla (AY m. 153) olur.

      Üçüncü soru: Bireysel başvuruda temel şartlar vardır: ihlalin kamu gücünden gelmesi, olağan kanun yollarının tüketilmesi ve hakkın hem Anayasa'da hem AİHS'te güvence altında olması (AY m. 148/3; 6216 sayılı Kanun m. 45/1). Soyadı, AY m. 17'deki maddi ve manevi varlığı koruma hakkı ve AİHS'in özel hayatı koruyan hükmü kapsamındadır; ortak koruma alanı vardır. Olağan yollar da tükenmiştir. Derece mahkemeleri çatışmada antlaşmayı esas almadığı için müdahale kanunilik şartını sağlamamıştır. AYM'nin Sevim Akat Eşki kararında vardığı sonuç da budur.

      **Sonuç:** AİHS kanun hükmündedir ve soyadı konusunda kanunla çatıştığı için esas alınır. Bu bir iptal değildir. Bireysel başvuru şartları sağlandığı için Zeynep AYM'ye başvurabilir ve AY m. 17'nin ihlali tespit edilerek yeniden yargılama için dosyanın mahkemeye gönderilmesi beklenir.
  - olay: |
      X Taşımacılık A.Ş., Türkiye'nin taraf olduğu ve usulüne göre yürürlüğe konulmuş çok taraflı bir uluslararası taşıma sözleşmesine dayanarak bir yük taşımasında sorumluluğunu sözleşmedeki sınırla sınırlandırmak istemiştir. Davacı Y Ltd. Şti. ise bu sınırın Anayasa'daki mülkiyet hakkına aykırı olduğunu ileri sürmüş ve davaya bakan asliye ticaret mahkemesinden bu hükmün Anayasaya aykırılığı nedeniyle Anayasa Mahkemesi'ne itiraz yoluyla başvurmasını istemiştir. Y ayrıca, sözleşmenin iç hukukta ancak ayrı bir kanunla "dönüştürülürse" uygulanabileceğini, bunun yapılmadığını söylemektedir.
      1. Mahkeme, sözleşme hükmü için AYM'ye itiraz yoluna gidebilir mi?
      2. Sözleşmenin iç hukuktaki gücü nedir; ayrıca dönüştürme kanunu aranır mı?
      3. Y'nin ileri sürdüğü iddia AY m. 90/5'in üçüncü cümlesinin konusu mudur?
    olcut:
      - {tespit: "Antlaşma hakkında Anayasaya aykırılık iddiasıyla AYM'ye başvurulamayacağı", puan: 30, madde: "AY m. 90"}
      - {tespit: "İtiraz yolunun yalnız kanun ve Cumhurbaşkanlığı kararnamesi için olduğu; AYM'nin denetim alanının antlaşmaları içermediği", puan: 20, madde: "AY m. 152"}
      - {tespit: "Antlaşmanın usulüne göre yürürlüğe konulmuşsa kanun hükmünde olduğu ve ayrıca dönüştürme işlemi aranmadığı", puan: 20, madde: "AY m. 90"}
      - {tespit: "Mülkiyet hakkı iddiasının bir Anayasaya aykırılık iddiası olduğu; kanun-antlaşma çatışması olmadığı için üçüncü cümlenin konusu olmadığı", puan: 20, madde: "AY m. 90"}
      - {tespit: "AYM'nin denetim yetkisinin kanun, Cumhurbaşkanlığı kararnamesi ve TBMM İçtüzüğüyle sınırlı olduğu", puan: 10, madde: "AY m. 148"}
    cozum: |
      **Nitelendirme:** Olay, usulüne göre yürürlüğe konulmuş bir antlaşmanın iç hukuktaki gücü ve Anayasaya aykırılık iddiasının hangi yolla ileri sürülebileceği sorunudur.

      **Hukuki sorunlar:** (1) Antlaşmaya karşı itiraz yolu, (2) antlaşmanın iç hukuktaki gücü ve dönüştürme gerekliliği, (3) iddianın AY m. 90/5 üçüncü cümlesi kapsamında olup olmadığı.

      **İlgili hükümler:** AY m. 90/5; AY m. 152; AY m. 148/1; AY m. 35.

      **Değerlendirme:** Birinci soru: AY m. 152/1 itiraz yolunu, uygulanacak "kanun veya Cumhurbaşkanlığı kararnamesi" hükmü için düzenler. Antlaşma bu listede yoktur. AY m. 90/5'in ikinci cümlesi de usulüne göre yürürlüğe konulmuş antlaşmalar hakkında Anayasaya aykırılık iddiasıyla AYM'ye başvurulamayacağını açıkça söyler. AYM'nin denetlediği normlar da kanun, Cumhurbaşkanlığı kararnamesi ve TBMM İçtüzüğüdür (AY m. 148/1). Dolayısıyla mahkeme, Y'nin talebi üzerine AYM'ye gidemez.

      İkinci soru: AY m. 90/5'in birinci cümlesine göre antlaşma usulüne göre yürürlüğe konulmuşsa kanun hükmündedir. Y'nin "dönüştürme kanunu" itirazı Türk sisteminde yerinde değildir: Anayasa, antlaşmanın iç hukuktaki gücünü doğrudan belirler; uygun bulma, onay ve gerekirse yayım yeterlidir (AY m. 90/1-3, AY m. 104). Türk sisteminin monist mi düalist mi olduğu ayrıca tartışmalıdır; ama bu olayda sonucu belirleyen şey AY m. 90/5'in metnidir.

      Üçüncü soru: Y'nin iddiası, antlaşma hükmünün Anayasa'nın mülkiyet hakkına (AY m. 35) aykırı olduğu iddiasıdır. Bu bir antlaşma-kanun çatışması değil, antlaşma-Anayasa uyuşmazlığıdır. AY m. 90/5'in üçüncü cümlesi yalnız temel hak ve özgürlüklere ilişkin antlaşmalarla kanunların çatışmasına ilişkindir ve olayda uygulanmaz.

      **Sonuç:** Mahkeme AYM'ye itiraz yoluyla gidemez. Antlaşma kanun hükmünde olup ayrıca dönüştürme gerektirmeden uygulanır. Y'nin iddiası üçüncü cümlenin konusu değildir.
kartlar:
  - on: "Monizm ile düalizm arasındaki temel fark nedir?"
    arka: "Monizm tek hukuk düzeni kabul eder; antlaşma ayrı işleme gerek kalmadan iç hukukun parçası olur. Düalizm iki ayrı düzen kabul eder; antlaşma iç hukuka dönüştürülerek uygulanır."
  - on: "AY m. 90/5'in birinci cümlesi ne söyler?"
    arka: "Usulüne göre yürürlüğe konulmuş milletlerarası andlaşmalar kanun hükmündedir (AY m. 90)."
  - on: "AY m. 90/5'in ikinci cümlesi ne söyler?"
    arka: "Usulüne göre yürürlüğe konulmuş antlaşmalar hakkında Anayasaya aykırılık iddiasıyla Anayasa Mahkemesi'ne başvurulamaz."
  - on: "AY m. 90/5'in üçüncü cümlesi hangi tarihte ve hangi kanunla eklendi?"
    arka: "7/5/2004 tarihli, 5170 sayılı Kanunun 7. maddesiyle. Temel hak ve özgürlüklere ilişkin antlaşmalar ile kanunlar çatışırsa antlaşma esas alınır."
  - on: "Üçüncü cümledeki öncelik hangi şartlara bağlıdır?"
    arka: "Antlaşma usulüne göre yürürlüğe konulmuş, temel hak ve özgürlüklere ilişkin olmalı ve kanunla aynı konuda farklı hüküm içermelidir."
  - on: "Öncelik kuralı kanunu iptal eder mi?"
    arka: "Hayır. Kanun yürürlükte kalır; hâkim yalnız o uyuşmazlıkta uygulamaz. AYM kuralı zımni ilga kuralı ve bir çeşit hiyerarşi olarak nitelemiştir (Sevim Akat Eşki)."
  - on: "AYM hangi normları denetler (AY m. 148/1)?"
    arka: "Kanunları, Cumhurbaşkanlığı kararnamelerini ve TBMM İçtüzüğünü. Antlaşmalar listede yoktur."
  - on: "Bireysel başvuruda 'ortak koruma alanı' ne demektir?"
    arka: "Hakkın hem Anayasa'da hem AİHS ve Türkiye'nin taraf olduğu protokollerde güvence altında olması (AY m. 148/3; 6216 sayılı Kanun m. 45/1)."
  - on: "Hulusi Yılmaz (Genel Kurul) kararında mahkemeden ne beklenir?"
    arka: "Hak ortak koruma alanındaysa, uygulanacak kanunu Anayasaya aykırı bulan mahkemenin önce AY m. 152'ye göre itiraz yoluna gitmesi beklenir."
  - on: "VAHS'ın 27. maddesi ne söyler?"
    arka: "Taraf, antlaşmayı yerine getirmemesini haklı göstermek için iç hukukunu ileri süremez. Bu kural 46. maddeye halel getirmez."
  - on: "UHK Devlet Sorumluluğu Maddeleri'nin 3. maddesi ne söyler?"
    arka: "Bir fiilin uluslararası hukuka aykırı sayılması uluslararası hukuka tabidir; iç hukukta hukuka uygun sayılması bunu etkilemez."
  - on: "AİHM'in kesinleşmiş ihlal kararı iç hukukta hangi sonucu doğurur?"
    arka: "Ceza davasında yargılamanın yenilenmesi sebebidir, karar kesinleşince bir yıl içinde istenir (CMK m. 311/1-f). Hukuk davasında yargılamanın iadesi sebebidir (HMK m. 375/1-i)."
