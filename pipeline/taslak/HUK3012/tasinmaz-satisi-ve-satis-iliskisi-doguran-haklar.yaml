    Zeynep dairesini Mert'e taksitle satıp tapuda resmî senetle devretmiştir. Zeynep, "son taksit ödenene kadar dairenin mülkiyeti satıcıda kalır" kaydının tapu siciline tescilini istemektedir. Bu istem hakkında ne söylenebilir?
  siklar:
  - Taraflar anlaştığı için kayıt tescil edilir.
  - Taşınmaz satışında mülkiyeti saklı tutma koşulu tescil edilemez.
  - Kayıt, alıcının yerleşim yeri noterliğindeki özel sicile kaydedilirse tescil edilir.
  - Taksitli taşınmaz satışı baştan geçersizdir.
  dogru: 1
  aciklama: |
    TBK m. 243/2'ye göre taşınmaz satışında mülkiyeti saklı tutma koşulu tescil edilemez. Noterlik özel sicili yolu taşınırlar için öngörülmüştür (TMK m. 764/1). Zeynep alacağını güvenceye almak istiyorsa kanuni ipotek hakkının tescilini isteyebilir (TMK m. 893/1). Taksitli satış taşınmazda da geçerlidir; geçersiz olan yalnız saklı tutma kaydının tescilidir.
- soru: |
    Mehmet, kadastro görmüş ve resmî ölçüme dayanılarak tapuda 800 m² yazılı arsasını Cem'e satmıştır. Cem arsayı ölçtürünce 770 m² olduğunu öğrenmiştir. Sözleşmede yüzölçümüne ilişkin bir güvence verilmemiştir. TBK m. 244/2'ye göre sonuç nedir?
  siklar:
  - Mehmet, yüzölçümünü özellikle üstlenmemiş olduğu için tazminatla yükümlü değildir.
  - Mehmet eksik her metrekare için tazminat öder.
  - Cem yalnız sözleşmeden dönebilir.
  - Cem yalnız ayıp bildirimi süresi içinde tazminat isteyebilir.
  dogru: 0
  aciklama: |
    TBK m. 244/2'ye göre satılan taşınmaz, resmî bir ölçüme dayanılarak tapu siciline yazılmış yüzölçümü tutarını içermiyorsa satıcı, özellikle üstlenmiş olmadıkça tazminat ile yükümlü değildir. Olayda üstlenme yoktur. Sözleşmede "eksik çıkarsa bedelden indirim yapılır" gibi bir hüküm olsaydı sonuç değişirdi.
- soru: |
    Müteahhit Selim, villayı 01.03.2019'da satmış ve tescil ettirmiştir. 2026'da temelde yapı ayıbı ortaya çıkmıştır; Selim'in ağır kusuru bulunmadığı belirlenmiştir. Yapının ayıplı olmasından doğan dava hakkında TBK m. 244/3'e göre ne söylenebilir?
  siklar:
  - Dava, mülkiyetin geçmesinden başlayan beş yılın dolması nedeniyle zamanaşımına uğramıştır.
  - Dava zamanaşımına uğramamıştır; yirmi yıl her olayda uygulanır.
  - Zamanaşımı ayıbın öğrenildiği tarihten itibaren beş yıldır.
  - Zamanaşımı henüz başlamamıştır; teslimden itibaren işler.
  dogru: 0
  aciklama: |
    TBK m. 244/3'e göre yapının ayıplı olmasından doğan davalar mülkiyetin geçmesinden başlayarak beş yılın ve satıcının ağır kusuru varsa yirmi yılın geçmesiyle zamanaşımına uğrar. Başlangıç tescil anıdır. Selim ağır kusurlu olmadığından beş yıllık süre uygulanır ve bu süre 2024'te dolmuştur. Yirmi yıl yalnız ağır kusur varsa devreye girer.
- soru: |
    Ayşe depoyu 01.04.2025'te Cem'e satmış ve tescil yapılmıştır. Taraflar aynı gün yazılı bir sözleşmeyle deponun 01.05.2025'te teslim edileceğini kararlaştırmıştır. Teslimden önce, 20.04.2025'te meydana gelen deprem depoyu yıkmıştır. Hasarı kim taşır?
  siklar:
  - Cem; çünkü yarar ve hasar tescille geçmiştir.
  - Ayşe; çünkü yarar ve hasar bu durumda alıcıya teslimle geçer.
  - Taraflar yarı yarıya taşır.
  - Tapu müdürlüğü taşır.
  dogru: 1
  aciklama: |
    Taşınmazda yarar ve hasar kural olarak tescil anına kadar satıcıya aittir (TBK m. 208/1). Tescilden sonraki bir zamanda teslim alınması için sözleşmeyle süre belirlenmişse yarar ve hasar alıcıya teslimle geçer (TBK m. 245/1). Bu anlaşma yazılı yapılmıştır (TBK m. 245/2). Deprem teslimden önce olduğu için hasar satıcı Ayşe'dedir.
olaylar:
- olay: |
    Mehmet, Bodrum'daki dükkânının maliki ve komşusu Ayşe ile 10.01.2024'te kendi aralarında adi yazılı bir sözleşme imzalar. Sözleşmeye göre Mehmet dükkânı satmaya karar verirse Ayşe, dükkânı satıcının üçüncü kişiyle kararlaştıracağı koşullarla öncelikle satın alma hakkına sahip olacak ve bu hak 10 yıl geçerli kalacaktır. Sözleşme tapu kütüğüne şerh edilmez.

    Mehmet, 05.05.2024'te dükkânı tapuda resmî senetle 8.000.000 TL bedelle Cem'e satar ve aynı gün mülkiyet Cem adına tescil edilir. Ayşe satışı 10.05.2024'te mahalle muhtarından öğrenir. Ne Mehmet ne de Cem, Ayşe'ye noter aracılığıyla bir bildirimde bulunmuştur. Cem, Ayşe ile Mehmet arasındaki sözleşmeyi bilmediğini söylemektedir. Ayşe, 15.07.2024'te önalım hakkını kullanmak için dava açmak istemektedir.

    1. Ayşe ile Mehmet arasındaki sözleşme şekil ve süre bakımından geçerli midir? Şerhin eksikliği sözleşmenin geçerliliğini etkiler mi?
    2. Ayşe'nin davası süre bakımından açılabilir mi? Noter bildiriminin yapılmamasının etkisi nedir?
    3. Ayşe davayı kime karşı açmak zorundadır? Dükkânın Cem'den alınması mümkün müdür?
  olcut:
  - tespit: Önalım sözleşmesinin yazılı şekille geçerli olması; şerhin geçerlilik şartı olmaması
    puan: 15
    madde: TBK m. 237
  - tespit: On yıllık süre kanuni üst sınır içindedir
    puan: 10
    madde: TBK m. 238
  - tespit: Dükkânın satılması önalımın kullanılabileceği işlemdir; istisna hâllerinden biri yoktur
    puan: 10
    madde: TBK m. 240
  - tespit: Noter bildirimi yapılmadığı için üç aylık sürenin işlememesi; satıştan başlayan iki yıllık sürenin dolmamış olması
    puan: 25
    madde: TBK m. 242
  - tespit: Şerh olmadığı için davanın satıcıya karşı açılması gerektiği; iki şartın birlikte aranması
    puan: 25
    madde: TBK m. 242
  - tespit: Mülkiyet Cem'e geçtiği için dükkânın alınamaması; Mehmet'in sözleşmeye aykırılığından doğan zararın tazmini
    puan: 15
    madde: TBK m. 112
  cozum: |
    **Nitelendirme:** Ayşe ile Mehmet arasında sözleşmeden doğan bir önalım hakkı vardır. Mehmet'in dükkânı Cem'e satması önalım hakkının doğurduğu durumu ortaya çıkarmıştır. Soru, hakkın geçerliliği, kullanılma süresi ve davalının kim olduğu noktalarında toplanır.

    **Hukuki sorunlar:** (1) Sözleşmenin şekli, süresi ve şerhin etkisi; (2) önalım hakkının kullanılabileceği işlem; (3) dava süreleri ve bildirim eksikliğinin sonucu; (4) davalının belirlenmesi ve sonuç.

    **İlgili hükümler:** TBK m. 237/3, TBK m. 238, TBK m. 240, TBK m. 241 ve TBK m. 242, TBK m. 112.

    **Değerlendirme:**

    *1. Geçerlilik:* Önalım sözleşmesinin geçerliliği yazılı şekle bağlıdır (TBK m. 237/3). Adi yazılı sözleşme bu şartı karşılar. Önalım hakkı en çok on yıllık süre için kararlaştırılabilir (TBK m. 238); sözleşmedeki on yıl kanuni üst sınırın içindedir. Hakkın şerh edilmesi mümkündür, ama geçerlilik şartı değildir; şerhin bulunmaması yalnız hakkın üçüncü kişilere karşı ileri sürülebilmesini ve davanın kime yöneltileceğini etkiler.

    *2. Önalımın kullanılabileceği işlem:* Mehmet'in dükkânı Cem'e satması, önalımın kullanılabileceği satış işlemidir (TBK m. 240/1). Cebrî artırma, mirasın paylaşımı ya da kamu hizmeti gibi istisnalardan hiçbiri bulunmadığından önalım hakkı kullanılabilir (TBK m. 240/2).

    *3. Süre:* Satıcı veya alıcı, satışı önalım hakkı sahibine noter aracılığıyla bildirmek zorundadır (TBK m. 241/1). Olayda bildirim yapılmamıştır. Dava süresi, satışın hak sahibine bildirildiği tarihten başlayarak üç ay ve her hâlde satışın yapılmasından başlayarak iki yıldır (TBK m. 242). Bildirim bulunmadığından üç aylık süre işlemeye başlamamıştır. Yargıtay'ın yerleşik uygulamasına göre satışın muhtardan öğrenilmesi noter bildiriminin yerine geçmez; bu durumda yalnız iki yıllık üst süre işler. Satış 05.05.2024'te yapılmış olduğundan bu süre 2026 yılı mayıs ayında dolar; 15.07.2024'teki dava süresindedir. Ayşe'nin öğrenme tarihinden itibaren hesaplanacak üç aylık süre kabul edilse bile dava bu sürenin içinde açılmış olacağından tartışmaya gerek kalmaz.

    *4. Davalı ve sonuç:* Hak şerhedilmiş ve mülkiyet alıcı adına tescil edilmişse dava alıcıya, aksi takdirde satıcıya karşı açılır (TBK m. 242). Olayda tescil yapılmıştır, ama önalım hakkı şerhedilmemiştir; iki şart birlikte aranır. Bu yüzden Ayşe davayı satıcı Mehmet'e karşı açmak zorundadır. Mülkiyet Cem'e geçtiği ve şerh bulunmadığı için Ayşe'nin dükkânı Cem'den alması kural olarak mümkün değildir; Cem sözleşmeyi bilmediğini söylediğinden alıcının kötüniyeti gibi tartışmalı bir durum da yoktur. Mehmet, önalım sözleşmesine aykırı davranmıştır ve kusurunun bulunmadığını ispat edemedikçe Ayşe'nin bundan doğan zararını gidermekle yükümlüdür (TBK m. 112).

    **Sonuç:**
    - Sözleşme geçerlidir; şerhin eksikliği geçerliliği etkilemez.
    - Dava, iki yıllık üst süre içinde ve bildirim yapılmadığı için süresindedir.
    - Dava şerhsiz olduğundan satıcı Mehmet'e karşı açılır.
    - Dükkân Cem'den alınamaz; Ayşe'nin istemi Mehmet'ten tazminat yönündedir.
- olay: |
    Zeynep, İstanbul'daki dairesini 01.04.2025'te tapuda resmî senetle Mert'e 5.000.000 TL'ye satar ve aynı gün mülkiyet Mert adına tescil edilir. Bedelin 2.000.000 TL'si peşin, kalanı 12 aylık taksitlerle ödenecektir. Zeynep, taksitler tamamen ödenene kadar mülkiyetin kendisinde kalması için bu kaydın tapu siciline işlenmesini ister; tapu memuru isteği reddeder.

    Daire kiracılı olduğu için Zeynep ve Mert aynı gün adi yazılı bir protokolle dairenin 01.05.2025'te anahtar teslimiyle Mert'e teslim edileceğini kararlaştırır. Daire 20.04.2025'te meydana gelen depremde ağır hasar görür.

    Mert'in komşusu Ali de Zeynep'ten aynı gün başka bir daire satın almış ve tescil yaptırmıştır. Ali'nin dairesinin teslim tarihinin (01.05.2025) de Zeynep ile sözlü olarak kararlaştırıldığı, hiçbir yazılı belge bulunmadığı bilinmektedir. Ali'nin dairesi de aynı depremde zarar görür.

    1. Tapu memurunun isteği reddetmesi yerinde midir? Zeynep taksitlerini nasıl güvenceye alabilir?
    2. Mert'in dairesindeki hasarı kim taşır?
    3. Ali'nin dairesindeki hasarı kim taşır?
  olcut:
  - tespit: Taşınmaz satışında mülkiyeti saklı tutma koşulunun tescil edilememesi; tapu memurunun isteği reddetmesinin yerinde olması
    puan: 25
    madde: TBK m. 243/2
  - tespit: Satıcının bedel alacağı için kanuni ipotek tescilini isteyebilmesi
    puan: 10
    madde: TMK m. 893/1
  - tespit: Taşınmazda yarar ve hasarın kural olarak tescil anına kadar satıcıya ait olması
    puan: 15
    madde: TBK m. 208/1
  - tespit: Tescilden sonra teslim için süre belirlenmişse yarar ve hasarın teslimle geçmesi; Mert'in dairesinde hasarın Zeynep'te kalması
    puan: 20
    madde: TBK m. 245/1
  - tespit: Teslim anlaşmasının yazılı şekle bağlı olması; adi yazılı protokolün yeterli olması
    puan: 10
    madde: TBK m. 245/2
  - tespit: Ali'nin sözlü anlaşmasının geçerli olmaması; genel kural gereği hasarın tescille Ali'ye geçmiş olması
    puan: 20
    madde: TBK m. 245/2
  cozum: |
    **Nitelendirme:** Olay üç ayrı sorun içerir: taksitle satılan taşınmazda mülkiyeti saklı tutma kaydı, tescilden sonra teslim süresi kararlaştırılması hâlinde yarar ve hasar ve bu anlaşmanın şekli.

    **Hukuki sorunlar:** (1) Mülkiyeti saklı tutma kaydının tescil edilebilirliği ve satıcının güvence yolu; (2) tescilden sonra teslimi ertelenen taşınmazda hasarın geçiş anı; (3) teslim anlaşması yazılı yapılmamışsa sonuç.

    **İlgili hükümler:** TBK m. 237/1, TBK m. 243/2, TBK m. 208/1, TBK m. 245/1-2, TMK m. 893/1.

    **Değerlendirme:**

    *1. Tapu memurunun reddi:* Taşınmaz satışı resmî şekilde yapılmıştır (TBK m. 237/1). Taşınmaz satışında mülkiyeti saklı tutma koşulu tescil edilemez (TBK m. 243/2). Taşınırlar için öngörülen noterlik özel sicili yolu (TMK m. 764/1) taşınmazda uygulanmaz. Bu yüzden tapu memurunun isteği reddetmesi yerindedir. Zeynep taksit alacağını güvenceye almak istiyorsa satış bedeli alacağı için satılan taşınmaz üzerinde kanuni ipotek hakkının tescilini isteyebilir (TMK m. 893/1).

    *2. Mert'in dairesi:* Taşınmaz satışında yarar ve hasar, ayrık hâller dışında, tescil anına kadar satıcıya aittir (TBK m. 208/1). Tescil 01.04.2025'te yapılmıştır; ayrık hâl olmasaydı hasar Mert'e geçmiş olurdu. Ne var ki satılanın tescilden sonraki bir zamanda alıcı tarafından teslim alınması için sözleşmeyle bir süre belirlenmişse yarar ve hasar alıcıya teslimle geçer (TBK m. 245/1). Bu sözleşmenin geçerliliği yazılı şekle bağlıdır (TBK m. 245/2); adi yazılı protokol bu şartı karşılar, resmî şekil aranmaz. Deprem 20.04.2025'te, yani teslim tarihinden önce olmuştur. Teslim gerçekleşmediği için yarar ve hasar henüz Mert'e geçmemiştir; hasarı Zeynep taşır.

    *3. Ali'nin dairesi:* Ali ile Zeynep teslim tarihini yalnız sözlü kararlaştırmıştır. TBK m. 245/2 bu anlaşmanın geçerliliğini yazılı şekle bağladığından sözlü anlaşma geçerli değildir. Bu durumda TBK m. 245/1'deki ayrık hâl kurulamaz ve genel kural uygulanır: Yarar ve hasar tescille alıcıya geçmiştir (TBK m. 208/1). Hasarı Ali taşır. Teslim tarihinin kararlaştırılmış olması tek başına hasarı satıcıda bırakmaz.

    **Sonuç:**
    - Tapu memurunun reddi yerindedir; Zeynep kanuni ipotek isteyebilir.
    - Mert'in dairesindeki hasarı, yazılı teslim anlaşması nedeniyle teslim gerçekleşmediğinden Zeynep taşır.
    - Ali'nin dairesindeki hasarı, anlaşma yazılı yapılmadığından tescille hasarın geçmesi nedeniyle Ali taşır.
kartlar:
- arka: Resmî şekil; resmî şekilde düzenlenmedikçe geçerli olmaz (TBK m. 237/2). Noterde düzenleme şeklinde yapılır (1512 sayılı Kanun m. 89).
  'on': Satış vaadi, alım ve geri alım sözleşmelerinin şekli?
- arka: Geçerliliği yazılı şekle bağlıdır; resmî şekil aranmaz (TBK m. 237/3).
  'on': Önalım sözleşmesinin şekli?
- arka: On yıl; kanunlarda belirlenen süreyle tapuya şerh edilebilir (TBK m. 238). Şerhin etkisi her durumda on yılda sona erer (TMK m. 735/2, TMK m. 736).
  'on': Önalım, alım ve geri alım hakkı en çok kaç yıl için kararlaştırılabilir?
- arka: Aksine anlaşma yoksa devredilemez, ama miras yoluyla geçer (TBK m. 239/1).
  'on': Sözleşmeden doğan önalım, alım ve geri alım hakları devredilebilir mi?
- arka: Mirasın paylaşımında mirasçılardan birine özgüleme, cebrî artırma yoluyla satış, kamu hizmetleri ve benzeri amaçlarla edinme (TBK m. 240/2).
  'on': Önalımın kullanılamayacağı üç hâl?
- arka: Hak şerhli ve mülkiyet alıcı adına tescilliyse alıcıya; aksi hâlde satıcıya (TBK m. 242).
  'on': Sözleşmesel önalım davası kime açılır?
- arka: Bildirimden itibaren üç ay ve her hâlde satıştan itibaren iki yıl (TBK m. 242). Yargıtay uygulamasında bildirim yoksa yalnız iki yıllık üst süre işler.
  'on': Sözleşmesel önalım davasının süreleri?
- arka: Koşul gerçekleşmedikçe tescil yapılamaz; mülkiyeti saklı tutma koşulu tescil edilemez (TBK m. 243). Satıcı kanuni ipotek isteyebilir (TMK m. 893/1).
  'on': Taşınmaz satışında koşul ve mülkiyeti saklı tutma kaydı?
- arka: Sözleşmede yazılı miktar eksikse (aksine sözleşme yoksa) tazminat öder (TBK m. 244/1). Resmî ölçüye dayanan tapu miktarında özellikle üstlenmedikçe sorumlu değildir (TBK m. 244/2).
  'on': Yüzölçümü eksikliğinde satıcı ne zaman sorumludur?
- arka: Mülkiyetin geçmesinden başlayarak beş yıl; satıcının ağır kusuru varsa yirmi yıl (TBK m. 244/3).
  'on': Yapı ayıbı davalarının zamanaşımı?
- arka: Alıcıya teslimle geçer; anlaşmanın geçerliliği yazılı şekle bağlıdır (TBK m. 245). Aksi hâlde kural tescil anıdır (TBK m. 208/1).
  'on': Tescilden sonra teslim için süre kararlaştırılırsa yarar ve hasar ne zaman geçer?
- arka: Satıştan başlayan üst süre iki yıldan bir yıla indi (TMK m. 733/4). Önalım bedeli hâkimce belirlenen rayiç bedel ve alıcıya düşen tapu giderleridir; kesin süre içinde nakden yatırılır (TMK m. 734/2).
  'on': 7571 sayılı Kanunla yasal önalımda ne değişti?
