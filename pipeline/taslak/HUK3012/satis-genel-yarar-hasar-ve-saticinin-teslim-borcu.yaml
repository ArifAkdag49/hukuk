  - id: "1230291000"
    ozet: |
      Alıcı, 30.04.2022'de sipariş verdiği ve üç faturaya bağlanan toplam 670.669,00 TL'lik ticari emtianın bedelini ödemiş, ancak mallar teslim edilmediği için aynen teslim istemiştir. Satıcı, alıcıyı telefon ve e-postayla malları almaya çağırdığını, alıcının kendi deposunda yer olmadığı için almadığını, sonradan satıcının deposunda çıkan yangında malların yandığını ve alıcının devralmada temerrüde düştüğünü savunmuştur. İlk derece mahkemesi, devir olmadan satıcının deposunda doğan hasarın TBK m. 208 gereği satıcıda kaldığını, alıcının temerrüdünün TTK m. 18/3'te sayılan araçlarla ispatlanamadığını ve stoktan sürekli alınan, ayırt edici işareti bulunmayan mallar aynen teslim edilebileceği için davayı kabul etmiştir; istinaf başvurusu reddedilmiş, Yargıtay 11. Hukuk Dairesi bu hükmü oy birliğiyle onamıştır. Karar, zilyetlik devredilmeden satıcının elinde doğan hasarın satıcıya ait olduğunu, tacirler arasında alıcının devralmada temerrüdünün ispatında TTK m. 18/3'e uygun belgelerin arandığını ve aynı nitelikte stok malın yanmasının aynen teslim borcunu ortadan kaldırmadığını gösterir.
  - id: "1223739300"
    ozet: |
      Alıcı, 13.11.2017 tarihli sabit fiyatlı sözleşmeyle metreküpü 129,00 TL'den 20.000 m³ hazır beton almış ve bedelin tamamını ödemiştir. Satıcı 16.937 m³ teslim ettikten sonra 13.07.2021'de sözleşmeyi feshetmiş ve teslim etmediği 3.063 m³ için eski fiyattan 358.449,57 TL iade etmiştir. Alıcı ihtirazi kayıtla iadeyi kabul etmiş, ıslahla 505.132,65 TL zarar istemiştir. İlk derece mahkemesi feshi haksız bulmuş, ancak zararı alıcının fesihten dava tarihine kadar üçüncü kişilerden fiilen aldığı 356 m³ üzerinden hesaplamış (67.846,00 TL); istinaf mahkemesi ise iadenin kabulüyle sözleşmenin ortadan kalktığını ve TBK m. 213'e göre müspet zarar hesaplanamayacağını belirterek ilk derece kararını kaldırmış, yalnız faiz başlangıcını değiştirerek yine 67.846,00 TL'ye hükmetmiştir. Yargıtay 11. Hukuk Dairesi alıcının itirazlarını oy birliğiyle kabul ederek kararı bozmuştur: Piyasa fiyatı bulunan malda ikame alım zorunlu değildir; fiilen alınan miktar için gerçekten ödenen birim fiyat, teslim edilmeyen geri kalan miktar için dava tarihindeki rayiç esas alınarak fark hesaplanmalıdır. Karar, TBK m. 213/2 ve TBK m. 213/3'ün birlikte uygulanabileceğini gösterir.
  - id: "1131677500"
    ozet: |
      Satıcı, 488.916,98 TL değerindeki ipliklerin taşıyıcının aracıyla Gaziantep'ten Osmaniye'ye giderken tek taraflı kazada yok olması üzerine, sigortadan aldığı 100.000 TL'yi düşerek kalan 388.916,00 TL için taşıyıcıya karşı icra takibi başlatmış ve itirazın iptalini istemiştir. Taşıyıcı, sevk irsaliyelerindeki "Satışlarımız Gaziantep işyeri teslimidir" kaydı nedeniyle hasarın TBK m. 208/3 uyarınca alıcıya geçtiğini ve satıcının dava hakkı bulunmadığını savunmuştur. İlk derece mahkemesi, alıcının isteği üzerine malın başka yere gönderildiğine dair delil bulunmadığını, irsaliyeye satıcı tarafından tek taraflı yazılan kaydın zilyetlik devredilmeden hasarı alıcıya geçirmeyeceğini belirterek davayı kabul etmiştir. İstinaf başvurusu reddedilmiş, Yargıtay 11. Hukuk Dairesi oy birliğiyle onamıştır. Karar, TBK m. 208/3'ün uygulanması için alıcının isteğiyle başka yere gönderilmenin ispatlanması gerektiğini, bunun yokluğunda zilyetlik devredilene kadar hasarın satıcıda kaldığını (TBK m. 208/1) gösterir.
  - id: "1219334500"
    ozet: |
      Alıcı, 11.08.2016'da 550.000 TL karşılığında aldığı dubleks dairenin, satıcının eşinin aile konutu olduğu iddiasıyla açtığı tapu iptali ve tescil davasında alıcı adına kaydın iptal edilip satıcı adına tescil edilmesi üzerine tazminat istemiştir. Satıcı, vekilinin görevini kötüye kullanarak bedeli almadan devir yaptığını savunmuştur. İlk derece mahkemesi yalnız 415.000 TL'nin ödendiğinin ispatlandığı kabulüyle oranlama yapmış; istinaf mahkemesi, daire sonradan ipotek nedeniyle satıldığı için davayı konusuz bulmuştur. Yargıtay 3. Hukuk Dairesi mahkemelerin gerekçesini hatalı bularak hükmü gerekçesi değiştirilerek ve düzeltilerek oy birliğiyle onamıştır. Daire, TBK m. 207/2'deki aynı anda ifa kuralının ifadan kaçınma imkânı ve edimlerin aynı anda ifa edildiği karinesi olmak üzere iki işlevi bulunduğunu belirtmiştir. Resmî satışla devir yapılmış ve sözleşmede aksi yazılmamışsa bedelin tamamı ödenmiş sayılır, ödenmediğini ispat yükü satıcıdadır; alıcının bir kısmı çekle ödediğini söylemesi veresiye satışın ikrarı sayılmaz.

sorular:
  - soru: |
      Tacir Sevgi A.Ş., tacir Tuna Ltd. Şti.'den 500 gömlek satın almıştır. Sözleşme kısım kısım ifaya elverişlidir. Tuna 300 gömlek teslim etmiş, Sevgi bunları çekince koymadan kabul etmiştir; kalan 200 gömleği teslim etmemiştir. Kalan kısmın teslim edilmemesi sözleşmeden beklenen yararı ortadan kaldırmamaktadır. Sevgi A.Ş.'nin durumu hangisidir?
    siklar:
      - "Haklarını yalnız teslim edilmeyen 200 gömlek hakkında kullanabilir."
      - "Sözleşmenin tamamından dönerek teslim aldığı 300 gömleği de iade edebilir."
      - "Kısmi teslimi çekince koymadan kabul ettiği için hiçbir hakkını kullanamaz."
      - "Teslim edilen 300 gömleğin bedelini ödemekten kurtulur."
    dogru: 0
    aciklama: |
      Ticari satışta kısım kısım ifa mümkünse ya da alıcı çekince ileri sürmeden kısmi teslimi kabul etmişse, alıcı haklarını yalnız teslim edilmemiş kısım hakkında kullanabilir (TTK m. 23/1-a). Sözleşmeden beklenen yarar ortadan kalkıyorsa sözleşmeyi feshedebilirdi, ancak olayda böyle bir durum yoktur. Kısmi teslimin kabulü, teslim edilmeyen kısımdaki hakları sona erdirmez.

  - soru: |
      Ahmet, buğdayını "teslim günü Polatlı Ticaret Borsası kapanış fiyatından" Fatma'ya satmıştır. Sözleşmede başka bir rakam yoktur. Bedel bakımından hangisi doğrudur?
    siklar:
      - "Rakam yazılmadığı için bedel belirsizdir ve sözleşme geçersizdir."
      - "Bedel durum ve koşullara göre belirlenebildiği için kararlaştırılmış bedel hükmündedir."
      - "Sözleşme ancak hâkim bedeli belirledikten sonra bağlayıcı olur."
      - "Bedel yalnız taraflar rakam üzerinde anlaşırsa kararlaştırılmış sayılır."
    dogru: 1
    aciklama: |
      Durum ve koşullara göre belirlenmesi mümkün olan bedel, kararlaştırılmış bedel hükmündedir (TBK m. 207/3). Teslim günü borsa fiyatı, objektif olarak belirlenebilir bir ölçüttür. Bedelin rakamla yazılması şart değildir.

  - soru: |
      Mehmet, otomobilini noterde Kerem'e devretmiştir. Sözleşmede vade veya taksit yoktur. İki yıl sonra Mehmet, bedelin 200.000 TL'sinin ödenmediğini ileri sürerek dava açmıştır. İspat yükü kimdedir?
    siklar:
      - "Kerem'dedir; her hâlde bedeli ödediğini belgelemelidir."
      - "Taraflar arasında eşit paylaştırılır."
      - "Mehmet'tedir; devir, bedelin peşin ödendiğine dair karine oluşturur."
      - "Hâkim bunu re'sen araştırdığı için ispat yükü kimsede değildir."
    dogru: 2
    aciklama: |
      Aynı anda ifa kuralı (TBK m. 207/2), satılanın devri hâlinde bedelin peşin ödendiğine dair kanuni karine oluşturur. Bedelin ödenmediğini, yani satışın veresiye yapıldığını iddia eden satıcı bunu ispat etmelidir. Alıcı, karineden yararlandığı için ödemeyi ayrıca ispatla yükümlü değildir.

  - soru: |
      818 sayılı eski Borçlar Kanunu ile TBK m. 208 karşılaştırıldığında yarar ve hasarın geçişi bakımından hangisi doğrudur?
    siklar:
      - "Eski kanun devir ya da tescili esas alıyordu; TBK sözleşmenin kurulduğu anı esas alır."
      - "Eski kanun sözleşmenin kurulduğu anı esas alıyordu; TBK taşınırda zilyetliğin devrini, taşınmazda tescili esas alır."
      - "Her iki kanun da yarar ve hasarı sözleşmenin kurulduğu anda alıcıya geçirir."
      - "TBK taşınırda da tescili esas alır, çünkü taşınırlar için sicil tutulur."
    dogru: 1
    aciklama: |
      Mülga 818 sayılı Borçlar Kanunu yarar ve hasarın sözleşmenin kurulduğu anda alıcıya geçeceğini öngörüyordu. TBK bu çözümü terk etmiş; ayrık haller dışında yarar ve hasar taşınırda zilyetliğin devrine, taşınmazda tescil anına kadar satıcıya aittir (TBK m. 208/1). 818 sayılı Kanun TBK m. 647 ile yürürlükten kaldırılmıştır.

  - soru: |
      Zeynep, belirli bir ikinci el buzdolabını Mehmet'e 20.000 TL'ye satmış, bedeli peşin almıştır. Teslim ertesi hafta yapılacaktır. Teslimden önce Zeynep'in dükkânında kimsenin kusuru olmadan çıkan yangında buzdolabı yanmıştır. Sözleşmede hasara ilişkin özel bir kayıt yoktur. Sonuç hangisidir?
    siklar:
      - "Sözleşmenin kurulduğu anda hasar Mehmet'e geçtiği için Mehmet kaybı taşır, bedeli geri isteyemez."
      - "Bedel peşin ödendiği için hasar Mehmet'e geçmiştir."
      - "Taraflar kaybı yarı yarıya paylaşır."
      - "Zilyetlik devredilmediği için hasar Zeynep'tedir; Zeynep aldığı bedeli geri verir."
    dogru: 3
    aciklama: |
      Ayrık hâl bulunmadığından taşınır satışında yarar ve hasar zilyetliğin devrine kadar satıcıya aittir (TBK m. 208/1). Belirli bir mal yok olduğu için satıcının borcu sona erer; satıcı karşı taraftan aldığı edimi geri vermek zorundadır (TBK m. 136/2). Bedelin peşin ödenmesi hasarın geçişini sağlamaz.

  - soru: |
      Kemal, 50 çuval çimentoyu Ayşe'ye satmıştır. Kemal teslimi usulüne uygun teklif etmiş, ancak Ayşe haklı bir sebep olmadan çimentoyu devralmayı reddetmiştir. Ertesi gün Kemal'in deposunu basan selde çimento zarar görmüştür. Hasar bakımından sonuç hangisidir?
    siklar:
      - "Ayşe devralmada temerrüde düştüğü için hasar, devir gerçekleşmiş gibi ona geçmiştir."
      - "Zilyetlik devredilmediği için hasar kesinlikle Kemal'dedir."
      - "Alıcının temerrüdü hasarı etkilemez; yalnız temerrüt faizi doğurur."
      - "Sel gibi mücbir sebeplerde hasar her hâlde satıcıda kalır."
    dogru: 0
    aciklama: |
      Taşınır satışında alıcı satılanın zilyetliğini devralmada temerrüde düşerse, zilyetliğin devri gerçekleşmiş gibi satılanın yarar ve hasarı alıcıya geçer (TBK m. 208/2). Genel kural olan zilyetliğin devrine kadar hasarın satıcıda olması, bu ayrık hâl karşısında geri çekilir. Satıcı teslimi teklif etmiş, devir alıcının kusurlu davranışı yüzünden gerçekleşmemiştir.

  - soru: |
      İzmir'de atölyesi bulunan Zeynep, sözleşmeye göre mobilyayı atölyesinde teslim edecektir. Alıcı Mert'in isteği üzerine mobilyayı Konya'ya göndermek üzere bir nakliyeciye teslim etmiştir. Yolda kamyon yanmış, mobilya yok olmuştur. Satıcı ile alıcı arasındaki ilişkide hasar kimdedir?
    siklar:
      - "Zeynep'tedir; hasar yalnız mobilya Konya'da teslim edilince geçer."
      - "Zeynep'tedir; çünkü zilyetlik Mert'e hiç geçmemiştir."
      - "Mert'tedir; yarar ve hasar mobilyanın taşıyıcıya teslim edildiği anda alıcıya geçmiştir."
      - "Taraflar arasında paylaştırılır."
    dogru: 2
    aciklama: |
      Satıcı alıcının isteği üzerine satılanı ifa yerinden başka bir yere gönderirse, yarar ve hasar satılanın taşıyıcıya teslim edildiği anda alıcıya geçer (TBK m. 208/3). Olayda ifa yeri atölyedir, gönderme alıcının isteğiyledir. Mert bedeli ödemekten kurtulmaz; taşıyıcıya karşı haklarını ayrıca kullanabilir.

  - soru: |
      Bir satış sözleşmesinde teslim yerinin alıcının deposu olduğu ve satıcının malı kendi aracıyla oraya getireceği kararlaştırılmıştır. Satıcının aracı yolda tek taraflı kaza yapmış ve mal yok olmuştur. Satıcı ile alıcı arasında hasar bakımından hangisi doğrudur?
    siklar:
      - "Hasar alıcıdadır; çünkü mal taşıyıcıya, yani satıcının aracına verilmiştir."
      - "Hasar alıcıdadır; çünkü sözleşme kurulduğu anda hasar alıcıya geçer."
      - "Hasar taraflarca eşit paylaşılır."
      - "Hasar satıcıdadır; borç alıcının deposunda ifa edilecek, zilyetlik devredilmemiştir ve olay gönderme satışı değildir."
    dogru: 3
    aciklama: |
      Gönderme satışı, malın alıcının isteği üzerine ifa yerinden başka bir yere gönderilmesidir (TBK m. 208/3). Olayda ifa yeri alıcının deposudur ve satıcı götürme borcu altındadır. Zilyetlik devredilmediği için genel kural işler ve hasar satıcıdadır (TBK m. 208/1).

  - soru: |
      Satıcı bir şirket, sevk irsaliyelerine kendi başına "satışlarımız işyeri teslimidir" yazmıştır. Mallar taşıyıcının aracıyla gönderilirken kazada yok olmuştur. Alıcının isteği üzerine malın başka bir yere gönderildiği ispatlanamamıştır. Satıcı ile alıcı arasındaki ilişkide hasar kimdedir?
    siklar:
      - "Satıcıdadır; irsaliyedeki tek taraflı kayıt hasarı alıcıya geçirmez ve zilyetlik devredilmemiştir."
      - "Alıcıdadır; irsaliyedeki kayıt gönderme satışını kanıtlar."
      - "Taşıyıcıdadır; satıcı ve alıcı sorumsuzdur."
      - "Taraflar arasında eşit paylaştırılır."
    dogru: 0
    aciklama: |
      Gönderme satışında hasarın taşıyıcıya teslimle geçmesi (TBK m. 208/3), alıcının isteği üzerine malın başka bir yere gönderilmesine bağlıdır. Bu ispatlanmadıkça satıcının irsaliyeye tek taraflı yazdığı kayıt hasarı alıcıya geçirmez; zilyetliğin devrine kadar hasar satıcıdadır (TBK m. 208/1). Taşıyıcının sorumluluğu ayrı bir meseledir.

  - soru: |
      Selim, fabrikasını tapuda Duru Ambalaj Ltd. Şti.'ye satmış ve tescil yapılmıştır. Taraflar aynı gün adi yazılı bir protokolle fabrikanın tescilden iki ay sonra teslim edileceğini kararlaştırmıştır. Teslimden önce fabrika depremde hasar görmüştür. Yarar ve hasar bakımından hangisi doğrudur?
    siklar:
      - "Tescil yapıldığı için hasar alıcıya geçmiştir."
      - "Yarar ve hasar teslimle geçeceğinden hasar henüz satıcıdadır; adi yazılı protokol bunun için yeterlidir."
      - "Protokol resmî şekilde yapılmadığı için hükümsüzdür; hasar alıcıdadır."
      - "Protokol imzalandığı anda hasar alıcıya geçmiştir."
    dogru: 1
    aciklama: |
      Satılanın tescilden sonraki bir zamanda alıcı tarafından teslim alınması için sözleşmeyle süre belirlenmişse yarar ve hasar alıcıya teslimle geçer. Bu sözleşmenin geçerliliği yazılı şekilde yapılmış olmasına bağlıdır (TBK m. 245). Adi yazılı şekil yeterlidir; resmî şekil aranmaz.

  - soru: |
      Aşağıdakilerden hangisi TBK m. 209'a göre taşınır satışıdır?
    siklar:
      - "Tapuda kayıtlı bir arsanın satışı"
      - "Yıkılacak bir binanın yıkıntılarının, yıkıldıktan sonra mülkiyeti devredilmek üzere satılması"
      - "Bir taşınmaz satış vaadi sözleşmesi"
      - "Arsa üzerindeki binanın tapu devri ile birlikte satılması"
    dogru: 1
    aciklama: |
      Ürünler, bir yapının yıkıntıları ve taş ocağından çıkarılacak taşlar gibi, taşınmazdan ayrıldıktan sonra mülkiyeti devredilecek bütünleyici parçaların satılması da taşınır satışıdır (TBK m. 209/2). Diğer seçeneklerde satış taşınmaz üzerindedir ya da tapu devri gerektirir.

  - soru: |
      Aksine sözleşme ya da âdet bulunmayan bir satışta, satılan buğdayın tartılması giderleri ile satılanın ifa yerinden alıcının fabrikasına taşınması giderleri kime aittir?
    siklar:
      - "Tartma gideri satıcıya, taşıma gideri alıcıya"
      - "Tartma gideri alıcıya, taşıma gideri satıcıya"
      - "İkisi de satıcıya"
      - "İkisi de alıcıya"
    dogru: 0
    aciklama: |
      Ölçme ve tartma gibi devir giderleri satıcıya; satılanı devralmak üzere yapılan giderler ve satılanın ifa yerinden başka yere taşınması gerektiğinde taşıma giderleri alıcıya aittir (TBK m. 211/1). Kanun gider türüne göre ayırır; tek bir tarafa topluca yüklemez.

  - soru: |
      Bir satış sözleşmesinde "gidersiz devir" kararlaştırılmış, başka gider kaydı konulmamıştır. Taşıma giderleri bakımından hangisi doğrudur?
    siklar:
      - "Taşıma giderleri genel kural gereği alıcıya aittir."
      - "Satıcı taşıma giderlerini üstlenmiş sayılır."
      - "Taşıma giderleri taraflarca yarı yarıya paylaşılır."
      - "Gidersiz devir yalnız tartma ve ölçme giderlerini satıcıya yükler, taşıma giderine etki etmez."
    dogru: 1
    aciklama: |
      Gidersiz devir kararlaştırılmışsa satıcı taşıma giderlerini üstlenmiş sayılır (TBK m. 211/2). Genel kuralda taşıma giderleri alıcıya aittir (TBK m. 211/1); sözleşmedeki bu kayıt kuralı satıcı lehine değil alıcı lehine değiştirir.

  - soru: |
      "Liman ve gümrük giderleri olmaksızın devir" kararlaştırılmış bir satışta satıcı aşağıdakilerden hangisini üstlenmiş sayılmaz?
    siklar:
      - "Dış satım vergilerini"
      - "Transit vergilerini"
      - "Satılanın alıcı tarafından devralındığı sırada ödenmiş olan tüketim vergilerini"
      - "Dış alım vergilerini"
    dogru: 2
    aciklama: |
      Liman ve gümrük giderleri olmaksızın devir kararlaştırılmışsa satıcı dış satım, transit ve dış alım vergilerini üstlenmiş sayılır; satılanın alıcı tarafından devralındığı sırada ödenmiş olan tüketim vergilerini ise üstlenmiş sayılmaz (TBK m. 211/3).

  - soru: |
      Güneş Tekstil Ltd. Şti., Aksu Mağazacılık A.Ş.'ye 1.000 montu en geç 15 Ekim'de teslim etmeyi taahhüt etmiştir; sözleşmeye göre bu tarihten sonraki teslim kabul edilmeyecektir. Güneş montları teslim etmemiştir. Aksu, 15 Ekim'den sonra satıcıya hiçbir bildirimde bulunmamıştır. TBK m. 212 bakımından alıcının tercihi hakkında hangisi doğrudur?
    siklar:
      - "Aksu'nun montların aynen teslimini istediği kabul edilir."
      - "Aksu'nun sözleşmeden döndüğü ve yalnız menfi zararını isteyebileceği kabul edilir."
      - "Aksu'nun devir isteminden vazgeçerek ifa edilmemesinden doğan zararının giderilmesini istediği kabul edilir."
      - "Susma hiçbir tercih sayılmaz; satıcı yeniden temerrüde düşürülmeden alıcı bir hak kullanamaz."
    dogru: 2
    aciklama: |
      Zilyetliğin devri için belirli bir süre konulmuş ticari satışlarda satıcı temerrüde düşerse alıcının, devir isteminden vazgeçerek borcun ifa edilmemesinden doğan zararının giderilmesini istediği kabul edilir (TBK m. 212/2). Sessizlik dönme değil, müspet zararın seçilmesi sonucunu doğurur.

  - soru: |
      Tacir Güneş Tekstil Ltd. Şti., tacir Aksu Mağazacılık A.Ş.'ye 1.000 montu en geç 15 Ekim'de teslim etmeyi taahhüt etmiştir; sözleşmeye göre bu tarihten sonraki teslim kabul edilmeyecektir. Güneş süreyi kaçırmıştır. Aksu, montların yine de aynen teslimini istemek niyetindedir. TBK m. 212 bakımından ne yapmalıdır?
    siklar:
      - "Hiçbir şey yapmasına gerek yoktur; aynen ifa hakkı süre sonunda da aynen saklıdır."
      - "Mahkemeden satıcıya süre verilmesini istemelidir."
      - "Belirlenen sürenin bitiminde bunu satıcıya hemen bildirmelidir."
      - "Bir yıl içinde dava açmalıdır."
    dogru: 2
    aciklama: |
      Alıcı, satılanın devredilmesini isteme niyetindeyse belirlenen sürenin bitiminde bunu satıcıya hemen bildirmek zorundadır (TBK m. 212/3). Aksi hâlde karine işler ve alıcının müspet zararı seçtiği kabul edilir. Genel hükümde böyle bir bildirim gerekmediği için bu, ticari satışa özgü bir farktır.

  - soru: |
      Ahmet, 50 ton buğdayı ton başına 10.000 TL'den Fatma'ya satmış, ama teslim etmemiştir. Fatma ihtiyacı için aynı nitelikte 50 ton buğdayı dürüstlük kurallarına uygun şekilde ton başına 12.500 TL'den başka bir satıcıdan satın almıştır. TBK m. 213/2'ye göre hesaplanan zarar kaç TL'dir?
    siklar:
      - "625.000 TL"
      - "500.000 TL"
      - "125.000 TL"
      - "2.500 TL"
    dogru: 2
    aciklama: |
      Somut hesapta alıcı, satış bedeli ile kendisine devredilmeyen satılanın yerine bir başkasını satın almak için dürüstlük kurallarına uygun olarak ödediği bedel arasındaki farkı ister (TBK m. 213/2). Ton başına fark 2.500 TL'dir ve 50 tonla çarpıldığında 125.000 TL bulunur. Diğer rakamlar ya ikame alımın ya da sözleşme bedelinin kendisidir.

  - soru: |
      Borsada kayıtlı 10 ton bakır, ton başına 300.000 TL'den satılmış, satıcı teslim etmemiştir. Belirlenmiş ifa günündeki borsa fiyatı ton başına 340.000 TL'dir. Alıcı hiçbir ikame alım yapmamıştır. Alıcı ne isteyebilir?
    siklar:
      - "Hiçbir tazminat; ikame alım yapmadığı için zararı doğmamıştır."
      - "3.400.000 TL; malın ifa günündeki tüm değeri."
      - "40.000 TL; ton başına farkın bir ton için tutarı."
      - "400.000 TL; ikame alım yapmaksızın satış bedeli ile ifa günündeki piyasa fiyatı arasındaki fark."
    dogru: 3
    aciklama: |
      Satılan borsada kayıtlı veya piyasa fiyatı bulunan mallardan ise alıcı, başka bir mal satın alma zorunda olmaksızın satış bedeli ile belirlenmiş ifa günündeki piyasa fiyatı arasındaki farkı isteyebilir (TBK m. 213/3). Fark (340.000 - 300.000) x 10 = 400.000 TL'dir.

  - soru: |
      Ali ile Veli, bir taşınmaz için adi yazılı olarak "Ali, taşınmazı beş yıl içinde geri alabilir" şeklinde bir geri alım sözleşmesi yapmıştır. Sözleşme hakkında hangisi doğrudur?
    siklar:
      - "Geçerlidir; geri alım sözleşmesi için adi yazılı şekil yeterlidir."
      - "Geçerli değildir; geri alım sözleşmesi resmî şekilde düzenlenmedikçe geçerli olmaz."
      - "Geçerlidir; ancak yalnız üç yıl için kararlaştırılabilir."
      - "Geçerli değildir; çünkü geri alım hakkı hiçbir süre için kararlaştırılamaz."
    dogru: 1
    aciklama: |
      Taşınmaz satışı vaadi, geri alım ve alım sözleşmeleri resmî şekilde düzenlenmedikçe geçerli olmaz (TBK m. 237/2). Önalım sözleşmesinin ise yazılı şekilde yapılması yeterlidir (TBK m. 237/3). Beş yıllık süre sorun değildir: Bu haklar en çok on yıllık süre için kararlaştırılabilir (TBK m. 238).

  - soru: |
      Tacirler arasındaki bir satışta satıcı, alıcıya "malınızı alabilirsiniz" diye mesaj atmış, alıcı malı almamış ve iki hafta sonra satıcının deposunda çıkan yangında mal yanmıştır. Satıcı, alıcının devralmada temerrüde düştüğünü ileri sürmektedir. Sözleşmede hasara ilişkin özel kayıt yoktur. Hangisi doğrudur?
    siklar:
      - "Mesaj, tacirler arasında temerrüde düşürme ihtarı yerine geçer; hasar alıcıdadır."
      - "Tacirler arasında temerrüde düşürme ihtarı TTK m. 18/3'te sayılan araçlarla yapılmadığı için temerrüt ispatlanmamıştır; hasar satıcıda kalır."
      - "Alıcı malı almadığı için sözleşme kendiliğinden sona ermiştir."
      - "Yangın mücbir sebep olduğundan hasar alıcı ile satıcı arasında paylaşılır."
    dogru: 1
    aciklama: |
      Tacirler arasında diğer tarafı temerrüde düşürmeye ilişkin ihtarlar noter aracılığıyla, taahhütlü mektupla, telgrafla veya güvenli elektronik imza kullanılarak kayıtlı elektronik posta sistemiyle yapılır (TTK m. 18/3). Sıradan bir mesajla temerrüt ispatlanamazsa TBK m. 208/2 uygulanamaz ve hasar, zilyetlik devredilmediği için satıcıda kalır (TBK m. 208/1).

olaylar:
  - olay: |
      Kayseri'deki Anadolu Tohum A.Ş., İstanbul'daki Marmara Gıda Ltd. Şti.'ye 20 ton çiğ kabak çekirdeğini ton başına 90.000 TL'den (toplam 1.800.000 TL) satmış ve bedelin tamamını sözleşme günü peşin almıştır. Çekirdek piyasada serbestçe bulunan bir üründür; teslimin yalnız belirli bir depodaki stoktan yapılacağı kararlaştırılmamıştır.

      Sözleşmeye göre ilk 10 ton Kayseri'deki depoda teslim edilecek, ancak Marmara Gıda'nın isteği üzerine İstanbul'a gönderilecektir. Nakliye giderine ilişkin sözleşmede bir kayıt yoktur. Anadolu Tohum bu 10 tonu, Marmara Gıda adına bir nakliyeciye teslim etmiştir. Nakliyecinin kamyonu yolda heyelan nedeniyle devrilmiş ve çekirdekler kullanılamaz hâle gelmiştir.

      Kalan 10 ton için teslim tarihi kararlaştırılmamıştır. Anadolu Tohum bu miktarı depodaki genel stokundan vermeyi planlamıştır; ancak mal Marmara Gıda adına ayrılmamıştır ve teslim borcu bu stokla sınırlandırılmamıştır. Anadolu Tohum, Marmara Gıda'ya bir WhatsApp mesajı atarak "malınızı alabilirsiniz" demiştir. Marmara Gıda malı almamış, iki hafta sonra Anadolu Tohum'un deposunda çıkan yangında bu mallar yanmıştır. Marmara Gıda, kalan 10 tonun aynen teslimini istemektedir.

      1. İlk 10 tonun zararı kime aittir? Peşin ödenen bedel bakımından sonuç nedir?
      2. İlk 10 tonun İstanbul'a taşınma giderini kim öder?
      3. Yangında yok olan 10 ton bakımından hasar kime aittir? WhatsApp mesajının önemi nedir?
      4. Marmara Gıda kalan 10 tonun aynen teslimini isteyebilir mi?
    olcut:
      - {tespit: "Sözleşmenin satış sözleşmesi olarak nitelendirilmesi; satıcının zilyetlik ve mülkiyeti devretme, alıcının bedel ödeme borcu; tarafların tacir olması", puan: 10, madde: "TBK m. 207"}
      - {tespit: "İlk 10 tonda gönderme satışı şartlarının gerçekleşmesi (alıcının isteği, ifa yerinden başka yere gönderme); yarar ve hasarın taşıyıcıya teslimle alıcıya geçmesi; bedelin geri istenememesi", puan: 30, madde: "TBK m. 208"}
      - {tespit: "Sözleşmede ve âdette aksi yoksa ifa yerinden başka yere taşıma giderlerinin alıcıya ait olması", puan: 10, madde: "TBK m. 211"}
      - {tespit: "Kalan 10 tonda zilyetlik devredilmediği için hasarın satıcıda kalması; alıcının temerrüdü gerçekleşmediğinden TBK m. 208/2'nin uygulanmaması", puan: 20, madde: "TBK m. 208"}
      - {tespit: "WhatsApp mesajının tacirler arasında temerrüde düşürme ihtarı için aranan araçlardan olmaması; temerrüdün bu yolla kurulamaması", puan: 15, madde: "TTK m. 18"}
      - {tespit: "Cins borcunda aynı nitelikte stok malın yanmasının ifayı imkânsızlaştırmaması; alıcının satıcının teslim borcuna dayanarak aynen teslim isteyebilmesi", puan: 15, madde: "TBK m. 210"}
    cozum: |
      **Nitelendirme:** Anadolu Tohum A.Ş. ile Marmara Gıda Ltd. Şti. arasında, taşınır mal (çiğ kabak çekirdeği) üzerine bir satış sözleşmesi vardır. Satıcı mülkiyet ve zilyetliği devretme, alıcı bedel ödeme borcu altındadır (TBK m. 207/1). Bedel peşin ödenmiş, iki taraf da tacir olduğundan TTK hükümleri de devrededir.

      **Hukuki sorunlar:** (1) İlk 10 tonda hasarın geçiş anı ve bedelin akıbeti; (2) taşıma giderinin yükü; (3) kalan 10 tonda hasarın kimde olduğu ve alıcının temerrüdü; (4) yangından sonra aynen teslim talebi.

      **İlgili hükümler:** TBK m. 207/1, TBK m. 208/1-3, TBK m. 210, TBK m. 211/1 ve TTK m. 18/3.

      **Değerlendirme:**

      *1. İlk 10 ton:* Genel kuralda taşınır satışında hasar zilyetliğin devrine kadar satıcıdadır (TBK m. 208/1). Ancak Marmara Gıda'nın isteği üzerine mal ifa yeri olan Kayseri'den başka bir yere, İstanbul'a gönderilmektedir; bu, gönderme satışıdır. Bu durumda yarar ve hasar satılanın taşıyıcıya teslim edildiği anda alıcıya geçer (TBK m. 208/3). Anadolu Tohum malı nakliyeciye teslim ettiği anda hasar Marmara Gıda'ya geçmiştir. Heyelan zararını Marmara Gıda taşır; hasar alıcıda olduğundan peşin ödediği bedeli satıcıdan geri isteyemez. Taşıyıcıya karşı haklarını kullanması ayrı bir konudur.

      *2. Taşıma gideri:* Aksine sözleşme veya âdet yoksa satılanın ifa yerinden başka yere taşınması gerektiğinde taşıma giderleri alıcıya aittir (TBK m. 211/1). Olayda gidere ilişkin kayıt yoktur; nakliye bedelini Marmara Gıda öder.

      *3. Kalan 10 ton:* Mal Marmara Gıda'ya hiç devredilmemiştir. Genel kural gereği hasar satıcıda kalır (TBK m. 208/1). Satıcının, alıcının devralmada temerrüde düştüğünü ileri sürebilmesi için temerrüdün kurulması gerekir (TBK m. 208/2). Taraflar tacir olduğundan diğer tarafı temerrüde düşürmeye ilişkin ihtar noter, taahhütlü mektup, telgraf ya da güvenli elektronik imzalı kayıtlı elektronik posta ile yapılmalıdır (TTK m. 18/3). WhatsApp mesajı bu araçlardan değildir; Marmara Gıda temerrüde düşürülmemiştir. TBK m. 208/2 uygulanamaz ve yangın zararı satıcıya aittir.

      *4. Aynen teslim:* Kalan 10 ton cinsiyle belirlenmiş bir borçtur, malın piyasada başka örnekleri bulunur ve teslim belirli bir stoka bağlanmamıştır. Deposundaki mallar yansa bile Anadolu Tohum aynı nitelikte başka mal teslim edebilir; ifa imkânsız hâle gelmemiştir. Satıcı, mülkiyeti geçirmek amacıyla zilyetliği devretmekle yükümlüdür (TBK m. 210). Yargıtay da stoktan sürekli alınan, ayırt edici işareti bulunmayan malların yanmasını aynen teslim borcunu ortadan kaldırmayan bir hâl olarak değerlendirmiştir.

      **Sonuç:** İlk 10 tonun zararı alıcı Marmara Gıda'ya aittir ve bedeli geri istenemez; taşıma gideri de alıcıya aittir. Kalan 10 tonda hasar satıcı Anadolu Tohum'dadır, çünkü alıcı usulüne uygun bir ihtarla temerrüde düşürülmemiştir. Marmara Gıda kalan 10 tonun aynen teslimini isteyebilir.

  - olay: |
      Yapı-Ka İnşaat A.Ş., Beton-Sa Hazır Beton A.Ş. ile 10.000 m³ C25 hazır betonun metreküpü 1.500 TL'den (toplam 15.000.000 TL) satışı için sözleşme yapmış ve bedelin tamamını peşin ödemiştir. Sözleşmede betonun en geç 15.05.2026 tarihinde teslim edilmesi, bu tarihte teslim edilmemesi hâlinde ifanın artık kabul edilmeyeceği açıkça kararlaştırılmıştır.

      Beton-Sa, 6.000 m³ betonu zamanında teslim etmiş, Yapı-Ka da bunları çekince koymadan kabul etmiştir. 15.05.2026'da Beton-Sa, kalan 4.000 m³'ü teslim etmeyeceğini bildirmiş ve bu miktarın bedeli olan 6.000.000 TL'yi iade etmiştir. Yapı-Ka, belirlenen sürenin bitiminde aynen teslim isteğini Beton-Sa'ya bildirmemiştir.

      Yapı-Ka daha sonra 1.000 m³ betonu dürüstlük kurallarına uygun olarak başka bir üreticiden metreküpü 2.400 TL'den satın almıştır. Kalan 3.000 m³ için ikame alım yapmamıştır. Hazır beton piyasa fiyatı bulunan bir maldır; 15.05.2026 günündeki piyasa fiyatı metreküp başına 2.300 TL'dir. Yapı-Ka, Beton-Sa'dan tazminat istemek istemektedir.

      1. Beton-Sa'nın durumu ve Yapı-Ka'nın tercihi hakkında TBK m. 212 bakımından ne söylenebilir?
      2. Yapı-Ka'nın kısmi teslimi çekincesiz kabul etmesinin etkisi nedir?
      3. Yapı-Ka'nın talep edebileceği zarar nasıl hesaplanır ve kaç TL'dir?
    olcut:
      - {tespit: "Sözleşmenin taşınır satışı olarak nitelendirilmesi; tarafların tacir olması ve ticari satış kurallarının uygulanması", puan: 10, madde: "TBK m. 207"}
      - {tespit: "Teslim günü belirli olduğundan satıcının süre sonunda ihtarsız temerrüde düşmesi", puan: 15, madde: "TBK m. 117"}
      - {tespit: "Belirli süreli ticari satışta satıcı temerrüde düşünce alıcının devir isteminden vazgeçip ifa edilmemesinden doğan zararını istediğinin kabul edilmesi; aynen teslim için hemen bildirimin yapılmamış olması", puan: 20, madde: "TBK m. 212"}
      - {tespit: "Kısmi teslimin çekincesiz kabulü nedeniyle alıcının haklarını yalnız teslim edilmeyen 4.000 m³ hakkında kullanabilmesi", puan: 10, madde: "TTK m. 23"}
      - {tespit: "Fiilen ikame alım yapılan 1.000 m³ için somut hesap: (2.400 - 1.500) x 1.000 = 900.000 TL", puan: 20, madde: "TBK m. 213"}
      - {tespit: "İkame alım yapılmayan 3.000 m³ için soyut hesap: ifa günü piyasa fiyatı ile fark, (2.300 - 1.500) x 3.000 = 2.400.000 TL; ikame alım zorunluluğunun bulunmaması", puan: 20, madde: "TBK m. 213"}
      - {tespit: "Toplam zararın 3.300.000 TL olması; satış bedelinin iade edilmiş olması nedeniyle yalnız farkın istenebilmesi", puan: 5, madde: "TBK m. 213"}
    cozum: |
      **Nitelendirme:** Taraflar arasında taşınır mal (hazır beton) satışı vardır. İki taraf da anonim şirket, yani tacirdir; bu nedenle satış ticari satıştır ve TBK hükümleri, TTK m. 23'teki özel kurallar saklı kalmak üzere uygulanır (TTK m. 23/1).

      **Hukuki sorunlar:** (1) Satıcının temerrüdü ve belirli süreli ticari satış karinesi; (2) kısmi teslimin etkisi; (3) zararın hesabı.

      **İlgili hükümler:** TBK m. 117/2, TBK m. 212/1-3, TBK m. 213/1-3 ve TTK m. 23/1-a.

      **Değerlendirme:**

      *1. Temerrüt ve karine:* Teslim günü sözleşmeyle belirlenmiştir. Borcun ifa edileceği gün birlikte belirlenmişse bu günün geçmesiyle borçlu temerrüde düşer (TBK m. 117/2). Beton-Sa 15.05.2026'da kalan 4.000 m³'ü teslim etmediğinden temerrüttedir. Sözleşmede teslim tarihinin kaçırılması hâlinde ifanın artık kabul edilmeyeceğinin kararlaştırılmış olması vadenin kesin vade olduğunu gösterir; bu nedenle belirli sürenin niteliğine ilişkin görüş ayrılığı (doktrin bölümü) sonucu değiştirmez. Zilyetliğin devri için belirli süre konulmuş ticari satışta satıcı temerrüde düşerse alıcının, devir isteminden vazgeçerek borcun ifa edilmemesinden doğan zararının giderilmesini istediği kabul edilir (TBK m. 212/2). Alıcı satılanın devredilmesini istemek niyetindeyse sürenin bitiminde bunu hemen bildirmek zorundaydı (TBK m. 212/3). Yapı-Ka bildirim yapmadığından devir isteminden vazgeçmiş, müspet zararı seçmiş kabul edilir.

      *2. Kısmi teslim:* Satış kısım kısım ifaya elverişlidir ve Yapı-Ka 6.000 m³'ü çekince koymadan kabul etmiştir. Bu durumda alıcı haklarını yalnız teslim edilmemiş kısım hakkında kullanabilir (TTK m. 23/1-a). Dolayısıyla talep 4.000 m³ ile sınırlıdır; teslim alınan 6.000 m³ yönünden bir hak doğmaz.

      *3. Zarar:* Borcunu ifa etmeyen satıcı, alıcının bu yüzden uğradığı zararı gidermekle yükümlüdür (TBK m. 213/1). Fiilen satın alınan 1.000 m³ için somut hesap uygulanır: satış bedeli ile dürüstlük kurallarına uygun ödenen bedel arasındaki fark istenir (TBK m. 213/2). Fark metreküp başına 2.400 - 1.500 = 900 TL, toplamda 900.000 TL'dir. Kalan 3.000 m³ için ikame alım yapılmamıştır, ama beton piyasa fiyatı bulunan bir maldır; alıcı başka mal satın alma zorunda olmaksızın satış bedeli ile belirlenmiş ifa günündeki piyasa fiyatı arasındaki farkı isteyebilir (TBK m. 213/3). Fark metreküp başına 2.300 - 1.500 = 800 TL, toplamda 2.400.000 TL'dir. Yapı-Ka'ya 4.000 m³'ün bedeli olan 6.000.000 TL iade edildiği için talep edilebilecek tutar yalnızca bu farklardır.

      **Sonuç:** Beton-Sa temerrüttedir; Yapı-Ka devir isteminden vazgeçerek müspet zararını seçmiş sayılır. Talep yalnız teslim edilmeyen 4.000 m³ ile sınırlıdır. Yapı-Ka, 900.000 TL (somut) ile 2.400.000 TL (soyut) olmak üzere toplam 3.300.000 TL tazminat isteyebilir.

  - olay: |
      Selim Yıldız, bir üretim binası ile idari binadan oluşan ve tek parsel üzerinde bulunan fabrika taşınmazını 02.03.2026'da tapuda Duru Ambalaj Ltd. Şti.'ye satmış, devir aynı gün tapu siciline tescil edilmiştir. Aynı gün taraflar iki ayrı adi yazılı belge imzalamıştır. Birinci belgede fabrikanın 02.05.2026'da fiilen teslim edileceği yazılıdır. İkinci belgede Selim'in, fabrikayı üç yıl içinde geri alma hakkı bulunduğu belirtilmiştir. Her iki belge de taraflarca imzalanmış, ancak noterde onaylanmamıştır.

      Fabrikanın fiilî zilyetliği protokole uygun olarak Selim'de kalmıştır. Duru Ambalaj, bu süre içinde fabrikada bir üretim hattı kurmak üzere hazırlık yapmaktadır.

      15.04.2026'da meydana gelen depremde fabrikanın üretim binası ağır hasar görmüştür. Fabrika henüz Duru Ambalaj'a fiilen teslim edilmemiştir. Duru Ambalaj, zararın Selim'e ait olduğunu ileri sürmektedir. Selim ise tescil yapıldığı için mülkiyetin ve zararın alıcıda olduğunu savunmakta, ayrıca ikinci belgeye dayanarak fabrikayı geri alma hakkını kullanacağını söylemektedir.

      1. Deprem zararı bakımından yarar ve hasar kimdedir?
      2. Selim'in geri alım hakkına ilişkin belgenin hukuki durumu nedir?
    olcut:
      - {tespit: "Taşınmaz satışının resmî şekilde (tapuda) yapılmış olması nedeniyle satışın geçerli olması", puan: 10, madde: "TBK m. 237"}
      - {tespit: "Genel kuralda taşınmaz satışında yarar ve hasarın tescil anına kadar satıcıya ait olması; tescil yapıldığı için ayrık hâl olmasa hasarın alıcıya geçmiş olacağı", puan: 20, madde: "TBK m. 208"}
      - {tespit: "Tescilden sonraki bir zamanda teslim alınması için sözleşmeyle süre belirlenmişse yarar ve hasarın alıcıya teslimle geçmesi", puan: 30, madde: "TBK m. 245"}
      - {tespit: "Teslim protokolünün adi yazılı şekilde yapılmasının yeterli olması; 15.04.2026 depreminin teslimden önce gerçekleşmesi nedeniyle yarar ve hasarın hâlâ satıcıda olması", puan: 15, madde: "TBK m. 245"}
      - {tespit: "Geri alım sözleşmesinin resmî şekilde düzenlenmedikçe geçerli olmaması; adi yazılı belgenin hükümsüz olması", puan: 20, madde: "TBK m. 237"}
      - {tespit: "Üç yıllık sürenin on yıllık sınır içinde kalması; sorunun süre değil şekil olması", puan: 5, madde: "TBK m. 238"}
    cozum: |
      **Nitelendirme:** Taraflar arasında taşınmaz satışı vardır. Satış resmî şekilde, tapuda yapılmış ve tescil edilmiştir. Ayrıca iki ayrı adi yazılı belge vardır: bir teslim protokolü ve bir geri alım taahhüdü. Birincisi satılanın teslim zamanına, ikincisi satıcıya tanınan bir geri alım hakkına ilişkindir.

      **Hukuki sorunlar:** (1) Tescil yapılmış olmasına rağmen yarar ve hasarın kimde olduğu; (2) adi yazılı geri alım belgesinin geçerliliği.

      **İlgili hükümler:** TBK m. 208/1, TBK m. 237/1-2, TBK m. 238 ve TBK m. 245/1-2.

      **Değerlendirme:**

      *1. Yarar ve hasar:* Taşınmaz satışının geçerli olabilmesi için sözleşmenin resmî şekilde düzenlenmesi şarttır (TBK m. 237/1); bu şart yerine getirilmiştir. Genel kural olarak ayrık hâller dışında taşınmazın yarar ve hasarı tescil anına kadar satıcıya aittir (TBK m. 208/1). Tescil 02.03.2026'da yapıldığından ayrık hâl bulunmasaydı hasar alıcıya geçmiş olurdu. Ne var ki satılanın tescilden sonraki bir zamanda alıcı tarafından teslim alınması için sözleşmeyle bir süre belirlenmişse onun yarar ve hasarı alıcıya teslimle geçer (TBK m. 245/1). Taraflar, fabrikanın tescilden iki ay sonra, 02.05.2026'da teslim edileceğini kararlaştırmıştır. Bu sözleşmenin geçerliliği yazılı şekilde yapılmış olmasına bağlıdır (TBK m. 245/2); adi yazılı protokol yeterlidir, resmî şekil aranmaz. Deprem 15.04.2026'da, yani fiilî teslimden önce olmuştur. Yarar ve hasar henüz alıcıya geçmediği için hasar satıcı Selim'dedir. Selim'in "tescil yapıldı, zarar alıcıya ait" savunması, TBK m. 245 karşısında dinlenemez. Bu hâlin alıcı bakımından ayrıntılı sonuçları (bedelin ve tazminatın akıbeti) genel hükümlerle çözülür; bu soruda aranan, geçiş anının doğru tespitidir.

      *2. Geri alım:* Taşınmaz satışı vaadi, geri alım ve alım sözleşmeleri resmî şekilde düzenlenmedikçe geçerli olmaz (TBK m. 237/2). Selim'in geri alım hakkına ilişkin belge yalnızca adi yazılı olduğundan geçerli değildir; Selim bu belgeye dayanarak fabrikayı geri alamaz. Üç yıllık süre, geri alım haklarının en çok on yıllık süre için kararlaştırılabilmesi sınırının (TBK m. 238) altındadır; geçersizlik sebebi süre değil şekildir. Aynı belge önalım sözleşmesi olsaydı yazılı şekil yeterli olurdu (TBK m. 237/3), ama olayda geri alım söz konusudur.

      **Sonuç:** Deprem zararı bakımından yarar ve hasar henüz alıcıya geçmemiş, satıcı Selim'dedir. Selim'in geri alım hakkına ilişkin adi yazılı belge, resmî şekil eksikliği nedeniyle geçersizdir.

kartlar:
  - on: "Satış sözleşmesinin tanımı nedir? (TBK m. 207/1)"
    arka: "Satıcının satılanın zilyetlik ve mülkiyetini alıcıya devretme, alıcının buna karşılık bedel ödeme borcunu üstlendiği sözleşme."
  - on: "Bedel rakamla yazılmamışsa sözleşme geçerli mi? (TBK m. 207/3)"
    arka: "Evet; durum ve koşullara göre belirlenmesi mümkün olan bedel kararlaştırılmış bedel hükmündedir (ör. teslim günü borsa fiyatı)."
  - on: "Aynı anda ifa kuralı ne söyler? (TBK m. 207/2)"
    arka: "Aksine sözleşme ya da âdet yoksa satıcı ve alıcı borçlarını aynı anda ifa eder. Yargıtay'a göre ifadan kaçınma imkânı verir ve peşin satış karinesi doğurur."
  - on: "Peşin satış karinesinde ispat yükü kimdedir?"
    arka: "Satıcıdadır. Satılanın devri bedelin peşin ödendiğine karinedir; ödenmediğini, yani veresiye satışı satıcı ispat eder."
  - on: "Yarar ve hasar kural olarak kimdedir? (TBK m. 208/1)"
    arka: "Taşınır satışlarında zilyetliğin devrine, taşınmaz satışlarında tescil anına kadar satıcıdadır."
  - on: "Eski Borçlar Kanunu yarar ve hasarı ne zaman geçirirdi?"
    arka: "Sözleşmenin kurulduğu anda alıcıya. TBK bunu terk etti; esas devir (taşınır) ya da tescildir (taşınmaz)."
  - on: "Alıcı zilyetliği devralmada temerrüde düşerse hasar ne olur? (TBK m. 208/2)"
    arka: "Zilyetliğin devri gerçekleşmiş gibi yarar ve hasar alıcıya geçer. Tacirler arasında temerrüt ihtarı TTK m. 18/3'e uygun olmalıdır."
  - on: "Gönderme satışında hasar ne zaman geçer? (TBK m. 208/3)"
    arka: "Satıcı, alıcının isteği üzerine satılanı ifa yerinden başka yere gönderirse, satılanın taşıyıcıya teslim edildiği anda alıcıya geçer."
  - on: "Götürme borcunda taşıma sırasındaki hasar kimdedir?"
    arka: "Satıcıdadır. Teslim yeri alıcının adresiyse zilyetlik devredilmemiştir; TBK m. 208/3 yalnız gönderme satışında uygulanır."
  - on: "Satıcı sevk irsaliyesine 'işyeri teslimidir' yazarsa hasar alıcıya geçer mi?"
    arka: "Hayır. Alıcının isteğiyle başka yere gönderildiği ispatlanmadıkça tek taraflı kayıt hasarı geçirmez; zilyetliğin devrine kadar hasar satıcıdadır."
  - on: "Taşınmazda tescilden sonra teslim süresi kararlaştırılırsa hasar ne zaman geçer? (TBK m. 245)"
    arka: "Alıcıya teslimle (ya da alıcının teslim almada temerrüdüyle) geçer. Sözleşmenin geçerliliği yazılı şekle bağlıdır."
  - on: "Hangi bütünleyici parçaların satışı taşınır satışıdır? (TBK m. 209/2)"
    arka: "Taşınmazdan ayrıldıktan sonra mülkiyeti devredilecek ürünler, yapı yıkıntıları ve taş ocağından çıkarılacak taşlar gibi parçaların satışı."
  - on: "Satıcının teslim borcu nedir? (TBK m. 210)"
    arka: "Satılanın mülkiyetini geçirmek amacıyla zilyetliğini alıcıya devretmek."
  - on: "Aksine sözleşme ya da âdet yoksa devir ve taşıma giderleri kime aittir? (TBK m. 211/1)"
    arka: "Ölçme ve tartma gibi devir giderleri satıcıya; devralma giderleri ve ifa yerinden başka yere taşıma giderleri alıcıya."
  - on: "Gidersiz devirde ne olur? (TBK m. 211/2)"
    arka: "Satıcı taşıma giderlerini üstlenmiş sayılır."
  - on: "Liman ve gümrük giderleri olmaksızın devirde satıcı hangi vergileri üstlenmez? (TBK m. 211/3)"
    arka: "Alıcı tarafından devralındığı sırada ödenmiş olan tüketim vergilerini. Dış satım, transit ve dış alım vergilerini üstlenir."
  - on: "Belirli süreli ticari satışta satıcı temerrüde düşerse ne kabul edilir? (TBK m. 212/2)"
    arka: "Alıcının devir isteminden vazgeçerek borcun ifa edilmemesinden doğan zararının giderilmesini istediği kabul edilir."
  - on: "Belirli süreli ticari satışta aynen teslim isteyen alıcı ne yapmalıdır? (TBK m. 212/3)"
    arka: "Belirlenen sürenin bitiminde bunu satıcıya hemen bildirmelidir."
  - on: "Somut ve soyut zarar hesabı arasındaki fark nedir? (TBK m. 213)"
    arka: "Somut: satış bedeli ile ikame alım için dürüstlük kurallarına uygun ödenen bedel arasındaki fark. Soyut: borsa ya da piyasa fiyatı varsa ikame alım olmadan ifa günü fiyatıyla fark."
  - on: "Ticari satışta kısmi teslim çekincesiz kabul edilirse alıcı hangi kısım için hak kullanır? (TTK m. 23/1-a)"
    arka: "Yalnız teslim edilmemiş kısım için. Beklenen yarar ortadan kalkıyorsa sözleşmeyi feshedebilir."
  - on: "Taşınmaz satışı, satış vaadi, alım, geri alım ve önalım hangi şekle tabidir? (TBK m. 237)"
    arka: "Satış, satış vaadi, alım ve geri alım için resmî şekil; önalım için yazılı şekil."
