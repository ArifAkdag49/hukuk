    ozet: |
      Davacı alıcı, Mart 2013'te noterde, satış bedeli 20.000 TL gösterilen ikinci el bir otomobili satın almış; aracın sonradan 2010-2011 yıllarında dört kez çarpma sonucu ağır hasarlı olduğunu öğrenince bedel farkı olarak 11.000 TL istemiştir. Davalı satıcı, ilanda plakanın herkes sorgulayabilsin diye açık bırakıldığını ve basit bir araştırmayla öğrenilebilecek bir hususun ayıp sayılamayacağını savunmuştur. Asliye Hukuk Mahkemesi ayıbı gizli sayarak davayı kabul etmiş; Özel Daire (kapatılan 19. Hukuk Dairesi) noter senedindeki "alıcı bu aracı hâlihazır durumu ile görüp beğenerek teslim almıştır" kaydına ve satıcının ayrıca garanti taahhüdü verdiğinin kanıtlanmadığına dayanarak bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu direnmeyi oy çokluğuyla yerinde bulmuştur: kayıt açık ayıplar bakımından satıcının sorumluluğunu kaldırır, ama gizli ayıplar için sorumluluk sürer ve satıcının ayrıca garanti taahhüdü vermesine gerek yoktur; satıcı gizli ayıp bakımından ağır kusurludur, bu yüzden ayıbın süresinde bildirilmediğini ileri süremez (TBK m. 221 ve TBK m. 225); alıcının trafik ve sigorta kayıtlarını inceleme yükümlülüğü yoktur ve alıcının ayıbı bildiğini ispat yükü satıcıdadır. Miktara ilişkin itirazların incelenmesi için dosya 11. Hukuk Dairesine gönderilmiştir.
  - id: "863280800"
    ozet: |
      Davacı şirket, davalıdan aldığı üç cihazın (IPL epilasyon cihazı dahil) teslimden sonra aynı arızaları tekrar tekrar verdiğini, iki cihazın 2012'de yenisiyle değiştirilmesine ve sürekli servis müdahalesine rağmen arızaların sürdüğünü belirterek sözleşmeden dönmüş ve bedel iadesi istemiştir. Davalı satıcı şirket, TBK m. 231/1'deki iki yıllık zamanaşımının dolduğunu savunmuştur. İlk derece mahkemesi ayıpların gizli olduğunu, ihbarların süresinde yapıldığını kabul ederek davayı kısmen kabul etmiş; bölge adliye mahkemesi de bu davalı yönünden istinaf başvurusunu esastan reddederek davayı kısmen kabul etmiştir. Özel Daire (kapatılan 19. Hukuk Dairesi) bölge adliye mahkemesinin kararını iki yıllık sürenin dolduğu gerekçesiyle bozmuş, bölge adliye mahkemesi direnmiştir. Hukuk Genel Kurulu direnmeyi oy birliğiyle uygun bulmuştur: ticari satışa TBK hükümleri uygulanır, TBK m. 225/1 ticari satışlarda da uygulanabilir ve arızaların tekrarlanması ile servisin sürekli müdahalesi karşısında satıcı ağır kusurludur; ağır kusurlu satıcı ayıbın süresinde bildirilmediğini kısmen de olsa ileri süremez ve bu nedenle zamanaşımı savunması da sonuç vermemiştir. Davanın esası ve miktar için dosya 11. Hukuk Dairesine gönderilmiştir.
  - id: "1132283600"
    ozet: |
      Davacı tacir, davalı tacire sattığı konfeksiyon ürünlerinin iki faturasından (toplam 350.056,18 TL) 60.000 TL tahsil edebilmiş, kalan bedel için başlattığı takibe yapılan itiraz üzerine itirazın iptali davası açmıştır. Davacı, davalının son teslimden 54 gün sonra ihtar çekerek TTK m. 23/1-c süresini kaçırdığını ileri sürmüştür. Bakırköy 6. Asliye Ticaret Mahkemesi sekiz günlük sürede ihbar yapılmadığı gerekçesiyle davayı kabul etmiş; İstanbul Bölge Adliye Mahkemesi 12. Hukuk Dairesi ise bilirkişinin saptadığı bariz ayıplar nedeniyle satıcının ağır kusurlu olduğunu ve TBK m. 225 gereği süre savunmasına dayanamayacağını kabul etmiş, bu ürünlerin bedelini düşerek davayı 87.053 TL yönünden kısmen kabul etmiştir. Yargıtay 11. Hukuk Dairesi davalının temyizini miktar bakımından reddetmiş, davacının temyizini inceleyerek istinaf kararını usul ve kanuna uygun bulup oy birliğiyle onamıştır. Karar, ticari satışta meslekten satıcı ve açık ayıp bakımından tartışmalı bir noktaya ilişkindir (doktrin bölümüne bakınız).
  - id: "1102815600"
    ozet: |
      Davacılar, davalı arsa sahibinden tapuda satın aldıkları dairelerde çevre düzenlemesi, iç yan duvar mermerleri, sığınak ve garaj gibi imalatların projeye ve sözleşmeye aykırı ya da eksik olduğunu ileri sürerek eksik işler bedelini istemişlerdir. Asliye Hukuk Mahkemesi bozmaya uyarak ayıba karşı tekeffül hükümlerinin uygulanacağını, ancak TBK m. 231/1'deki iki yıllık zamanaşımının dolduğunu kabul etmiş ve davayı reddetmiştir. Yargıtay 3. Hukuk Dairesi kararı oy birliğiyle bozmuştur. Daireye göre taşınır satışına ilişkin kurallar taşınmaz satışında da uygulanır (TBK m. 246); mahkemenin önce iddiaları ayıp kavramı içinde değerlendirmesi, açık ve gizli ayıp ayrımını ortalama (vasat) bir alıcının bilgisine göre yapması, gizli ayıpların hemen bildirilip bildirilmediğini araştırması gerekir. Yapı ayıbına ilişkin davalarda ise TBK m. 244/3 gözetilmemiştir. Eksik inceleme nedeniyle bozma yapılmıştır.

sorular:
  - soru: |
      TBK m. 219'a göre satıcının ayıptan sorumluluğu hakkında hangisi doğrudur?
    siklar:
      - "Satıcı yalnızca ayıbı bildiği hâllerde sorumlu olur."
      - "Satıcı, ayıpların varlığını bilmese bile onlardan sorumludur."
      - "Satıcı ancak ağır kusurlu ise sorumlu olur."
      - "Satıcı yalnızca yazılı olarak bildirdiği niteliklerden sorumludur."
    dogru: 1
    aciklama: |
      TBK m. 219/2 satıcının bu ayıpların varlığını bilmese bile onlardan sorumlu olduğunu açıkça söyler; yani ayıptan sorumluluk kusursuz sorumluluktur. Ağır kusur, sorumluluğun doğması için değil, sorumsuzluk anlaşmasının geçersizliği ve geç bildirim savunmasının engellenmesi için önem taşır (TBK m. 221 ve TBK m. 225). Niteliğin "herhangi bir surette" bildirilmesi yeterlidir, yazılı olması şart değildir (TBK m. 219/1).

  - soru: |
      Van'daki kırtasiyeci Selin, İstanbul'daki bir toptancıdan kargoyla gelen 30 koli defterin ıslanmış ve kullanılamaz durumda olduğunu görür. Toptancının Van'da temsilcisi yoktur. Selin kolilerde hiçbir koruma önlemi almadan ve durumu tespit ettirmeden malı aynı gün toptancıya geri gönderir. Hangisi doğrudur?
    siklar:
      - "Alıcı ayıplı olduğunu ileri sürdüğü malı her hâlde derhal iade edebilir."
      - "Geri gönderme serbesttir; tespit yalnızca satıcının yararınadır ve alıcıya bir sonuç doğurmaz."
      - "Selin malın korunması için gerekli önlemleri almadan malı geri gönderemez; ayrıca durumu gecikmeksizin tespit ettirmediği için ayıbın mal kendisine ulaştığında var olduğunu ispat yükü ona düşer."
      - "Satıcının temsilcisi bulunmadığı için Selin'in hiçbir yükümlülüğü yoktur."
    dogru: 2
    aciklama: |
      TBK m. 226/1'e göre alıcı, bulunduğu yerde satıcının temsilcisi yoksa malın korunması için gerekli önlemleri geçici olarak almak zorundadır ve bu önlemleri almadan ayıplı olduğunu ileri sürdüğü malı geri gönderemez. TBK m. 226/2'ye göre alıcı malın durumunu gecikmeksizin usulüne göre tespit ettirmelidir; yaptırmazsa ayıbın mal kendisine ulaştığı zamanda var olduğunu ispat yükü alıcıya düşer. Temsilcinin bulunmaması alıcıyı yükümlülükten kurtarmaz, tam tersine koruma yükümlülüğünün doğmasının şartıdır.

  - soru: |
      Aşağıdakilerden hangisi TBK m. 219 anlamında **ekonomik ayıp** örneğidir?
    siklar:
      - "Satın alınan makinenin, benzerlerinin üç katı yakıt harcaması"
      - "Satın alınan kumaşta yırtık bulunması"
      - "İmarlı arsa diye satılan taşınmazın yeşil alan çıkması"
      - "Satıcının 'yeni motor' dediği makinede ikinci el motor bulunması"
    dogru: 0
    aciklama: |
      Ekonomik ayıp, malın ekonomik değerini ve verimini düşüren eksikliktir; fazla yakıt harcayan makine bunun tipik örneğidir. Kumaştaki yırtık maddi ayıp, yeşil alan çıkması hukuki ayıp, "yeni motor" vaadine rağmen ikinci el motor bulunması ise bildirilen niteliğin yokluğudur (TBK m. 219/1).

  - soru: |
      TBK m. 220'ye göre hayvan satışında satıcı hangi hâlde ayıptan sorumlu olur?
    siklar:
      - "Her zaman, ayıbı bilmese bile."
      - "Yalnızca alıcı bir yıl içinde dava açarsa."
      - "Yalnızca ayıp sorumluluğunu sözlü olarak üstlenmişse."
      - "Yazılı olarak üstlenmişse veya ağır kusuru varsa."
    dogru: 3
    aciklama: |
      TBK m. 220'ye göre hayvan satışında satıcı yazılı olarak üstlenmedikçe veya ağır kusuru olmadıkça ayıptan sorumlu olmaz. Genel kural olan kusursuz sorumluluk (TBK m. 219/2) hayvan satışında bu iki koşulla sınırlandırılmıştır. Sözlü üstlenme yetmez, yazılı olmalıdır.

  - soru: |
      Arda, 4 Nisan'da bir inek satın alıp teslim alır. Satıcı ayıp sorumluluğunu yazılı olarak üstlenmiştir, ancak sorumluluk süresi yazılı belirlenmemiştir. İnekte gebelikle ilgili olmayan bulaşıcı bir hastalık ortaya çıkar. Arda hastalığı 10 Nisan'da satıcıya bildirir; ancak hayvanın bilirkişilerce gözden geçirilmesini yetkili makamdan 20 Nisan'da ister. Hangisi doğrudur?
    siklar:
      - "Satıcı sorumludur; hayvan satışında yalnızca bildirim yeterlidir."
      - "Satıcı sorumlu olmaz; bildirim süresinde yapılmış olsa da bilirkişi istemi aynı dokuz günlük sürede yapılmamıştır."
      - "Satıcı sorumlu olmaz; çünkü hayvan satışında yazılı üstlenme olsa bile ayıp sorumluluğu doğmaz."
      - "Satıcı sorumludur; bilirkişi istemi için herhangi bir süre sınırı yoktur."
    dogru: 1
    aciklama: |
      TBK m. 224'e göre süre yazılı belirlenmemiş ve ayıp gebeliğe ilişkin değilse satıcı, ancak ayıbın devrin yapıldığı günden başlayarak dokuz gün içinde kendisine bildirilmesi ve ayrıca hayvanın bilirkişilerce gözden geçirilmesinin aynı süre içinde yetkili makamdan istenmesi hâlinde sorumlu olur. İki şart birlikte aranır. Arda bildirimi süresinde yapmış, ama bilirkişi istemini dokuz günlük sürenin dışında yaptığı için satıcı sorumlu olmaz. Yazılı üstlenme sorumluluğun doğması için gerekli koşulu karşılar (TBK m. 220), fakat TBK m. 224'teki kısa süre ayrıca aranır.

  - soru: |
      Satıcının satılanı ayıplı olarak devretmekte ağır kusurlu olması durumunda, ayıptan sorumluluğu kaldıran veya sınırlayan anlaşmanın hukuki sonucu nedir?
    siklar:
      - "Geçerlidir; ancak alıcı bir yıl içinde iptalini isteyebilir."
      - "Geçerlidir; ancak yalnızca açık ayıplar bakımından sonuç doğurur."
      - "Kesin olarak hükümsüzdür."
      - "Noterde düzenlenmişse geçerlidir."
    dogru: 2
    aciklama: |
      TBK m. 221'e göre satıcı satılanı ayıplı olarak devretmekte ağır kusurlu ise ayıptan sorumluluğunu kaldıran veya sınırlayan her anlaşma kesin olarak hükümsüzdür. İptal edilebilirlik ya da geçerlilik söz konusu değildir; noterde düzenlenmiş olması da sonucu değiştirmez.

  - soru: |
      Hakan, Cemil'den ikinci el bir otomobili noterde satın alır. Noter senedinde "alıcı bu aracı hâlihazır durumuyla görüp beğenerek teslim almıştır" kaydı vardır. Araçta, Cemil'in bildiği ve gizlediği, ağır hasar onarımı olduğu sonradan anlaşılır. Cemil bu kayda dayanarak sorumlu olmadığını savunur. Hangisi doğrudur?
    siklar:
      - "Kayıt açık ayıpları kapsar; gizli ayıp bakımından satıcıyı kurtarmaz ve ağır kusurlu satıcı yönünden TBK m. 221 gereği hükümsüzdür."
      - "Noterde yapıldığı için kayıt gizli ayıp dahil her ayıp bakımından sorumluluğu kaldırır."
      - "Kayıt, yalnızca Hakan araç için sigorta ve hasar sorgusu yapmışsa geçerlidir."
      - "Cemil'in sorumlu olması için ayrıca yazılı bir garanti taahhüdü vermiş olması gerekir."
    dogru: 0
    aciklama: |
      Yargıtay Hukuk Genel Kurulu'na göre matbu "görüp beğenerek teslim aldı" kaydı alıcının gördüğü ve kabul ettiği açık ayıpları kapsar; gizli ayıpta sorumsuzluk anlaşması sayılmaz. Cemil ayrıca ağır kusurludur; TBK m. 221 gereği sorumluluğu kaldıran anlaşma kesin hükümsüzdür ve TBK m. 225/1 gereği süresinde bildirilmediğini de ileri süremez. Sorgulama yapma yükümlülüğü alıcıda yoktur ve ayrı bir garanti taahhüdü de aranmaz.

  - soru: |
      Cem, ikinci el bir dizüstü bilgisayarın ekranında çatlak olduğunu satın alma sırasında kendisi görür ve fiyatta indirim alarak sözleşmeyi yapar. Sonradan anakartta bir arıza ortaya çıkar ve Cem bunu hemen satıcıya bildirir. Hangisi doğrudur?
    siklar:
      - "Satıcı kusursuz sorumlu olduğu için ekran çatlağından da anakart arızasından da sorumludur."
      - "Cem, ekran çatlağına dayanabilir; çünkü ayıp varlığı satıcı tarafından bilinmemektedir."
      - "Satıcı her iki ayıptan da sorumlu değildir; çünkü bilgisayar ikinci el satılmıştır."
      - "Satıcı, sözleşme kurulurken Cem'in bildiği ekran çatlağından sorumlu değildir; ancak anakart arızasından sorumludur."
    dogru: 3
    aciklama: |
      TBK m. 222/1'e göre satıcı, sözleşmenin kurulduğu sırada alıcı tarafından bilinen ayıplardan sorumlu değildir; Cem ekran çatlağını biliyordu. Anakart arızasını bilmediği için bu ayıp bakımından satıcının sorumluluğu devam eder (TBK m. 219/2), Cem de ayıbı hemen bildirerek külfetini yerine getirmiştir (TBK m. 223/2). İkinci el olması, ayıp sorumluluğunu kendiliğinden ortadan kaldırmaz.

  - soru: |
      TBK m. 222/2'ye göre, alıcının satılanı yeterince gözden geçirmekle görebileceği bir ayıp bakımından satıcının durumu nedir?
    siklar:
      - "Satıcı her hâlde sorumludur."
      - "Satıcı, ancak böyle bir ayıbın bulunmadığını ayrıca üstlenmişse sorumlu olur."
      - "Alıcı ayıbı fiilen bilmiyorsa satıcı sorumludur."
      - "Satıcı, bir sorumsuzluk anlaşması varsa sorumlu olur."
    dogru: 1
    aciklama: |
      TBK m. 222/2'ye göre satıcı, alıcının satılanı yeterince gözden geçirmekle görebileceği ayıplardan da ancak böyle bir ayıbın bulunmadığını ayrıca üstlenmişse sorumlu olur. Alıcının ayıbı fiilen bilmesi bu fıkrada aranmaz; aranan, yeterli gözden geçirmeyle görülebilecek olmasıdır. Sorumsuzluk anlaşması satıcının sorumluluğunu kaldırır, doğurmaz.

  - soru: |
      TBK m. 223'teki gözden geçirme ve bildirim yükümlülüğü ve ihmalinin sonucu hakkında hangisi doğrudur?
    siklar:
      - "Bir borçtur; ihmal edilirse satıcı alıcıdan tazminat isteyebilir."
      - "Bir külfettir; ihmal edilirse sözleşme geçersiz olur."
      - "Bir külfettir; ihmal edilirse alıcı satılanı kabul etmiş sayılır."
      - "Bir külfettir; ihmal edilirse herhangi bir sonuç doğmaz."
    dogru: 2
    aciklama: |
      Gözden geçirme ve bildirim, alıcının kendi hakkını korumak için yerine getirmesi gereken bir külfettir; satıcı bunu alıcıya karşı dava edemez. İhmalin sonucu, TBK m. 223/2'ye göre satılanın kabul edilmiş sayılmasıdır; gizli ayıpta ise ayıp hemen bildirilmezse satılan bu ayıpla birlikte kabul edilmiş sayılır. Sözleşme geçersiz olmaz.

  - soru: |
      Ali ve Veli tacir değildir. Ali, Veli'den ikinci el bir mobilya takımı satın alır ve teslim sırasında bir dolap kapağının kırık olduğunu görür. Ali bu ayıp bakımından hangi ölçüye uymak zorundadır?
    siklar:
      - "İmkân bulunur bulunmaz gözden geçirmeli ve ayıbı uygun bir süre içinde satıcıya bildirmelidir."
      - "Ayıbı iki gün içinde bildirmelidir."
      - "Ayıbı, eski kanundaki gibi derhal bildirmelidir; uygun süre kavramı yoktur."
      - "Teslimden sonra sekiz gün içinde inceleyip bildirmelidir."
    dogru: 0
    aciklama: |
      Taraflar tacir olmadığı için TBK m. 223/1 uygulanır: alıcı imkân bulunur bulunmaz gözden geçirir ve ayıbı uygun bir süre içinde bildirir. İki gün ve sekiz gün tacirler arasındaki ticari satışa özgüdür (TTK m. 23/1-c). Eski Borçlar Kanunu'ndaki "derhal" ifadesi TBK'da "uygun bir süre içinde" olarak değiştirilmiştir.

  - soru: |
      Elif, tacir olmayan birinden ikinci el bir bisiklet satın alır. Altı ay sonra çerçevenin içinde olağan bir incelemeyle görülemeyecek bir çatlak olduğunu fark eder, ancak bunu satıcıya üç ay sonra bildirir. Satıcı ayıbı bilmemektedir ve ağır kusurlu değildir. Sonuç nedir?
    siklar:
      - "Gizli ayıp bakımından bildirim her zaman geçerlidir, süre aranmaz."
      - "Bildirim uygun süre içinde sayılır; çünkü gizli ayıpta süre yoktur."
      - "Satıcı ayıbı bilmediği için hiçbir hâlde sorumlu değildir."
      - "Ayıp anlaşılınca hemen bildirilmediği için bisiklet bu ayıpla birlikte kabul edilmiş sayılır."
    dogru: 3
    aciklama: |
      TBK m. 223/2'ye göre olağan bir gözden geçirmeyle ortaya çıkarılamayacak ayıp sonradan anlaşılırsa hemen satıcıya bildirilmelidir; bildirilmezse satılan bu ayıpla birlikte kabul edilmiş sayılır. Elif ayıbı anladıktan üç ay sonra bildirdiği için süreyi kaçırmıştır. Satıcının ayıbı bilmemesi, ayıbın sorumluluğu doğurmasına engel değildir (TBK m. 219/2); ama alıcı külfetini yerine getirmediği için haklarını yitirmiştir. Satıcı ağır kusurlu olsaydı geç bildirim savunması yapamazdı (TBK m. 225/1).

  - soru: |
      A Ltd. ve B A.Ş. tacirdir. A, B'den aldığı 100 kutu seramiğin 10'unun kırık olduğunu teslim sırasında açıkça görür ve bunu dört gün sonra B'ye bildirir. Kırıklar hasar A'ya geçmeden önce, B'nin bilmesi beklenemeyecek biçimde oluşmuştur; B ağır kusurlu değildir. Hangisi doğrudur?
    siklar:
      - "Süre sekiz gündür; bildirim zamanında yapılmıştır."
      - "Teslimde açıkça belli ayıp iki gün içinde ihbar edilmeliydi; süre geçtiği için A bu kutulardaki ayıbı kabul etmiş sayılır."
      - "Ticari satışta ayıp bildirimi için süre yoktur; bildirimin hemen yapılması yeterlidir."
      - "Süre uygun bir süredir; dört gün makuldür."
    dogru: 1
    aciklama: |
      TTK m. 23/1-c'ye göre malın ayıplı olduğu teslim sırasında açıkça belli ise alıcı iki gün içinde durumu satıcıya ihbar etmelidir. Sekiz günlük süre ayıp açıkça belli değilse işler. Dört gün iki günü aştığı için TBK m. 223 uyarınca A, o kutulardaki ayıbı kabul etmiş sayılır. B ağır kusurlu olmadığı ve kırıkları bilmesi de beklenemediği için TBK m. 225 de devreye girmez.

  - soru: |
      TTK m. 23/1-c'ye göre malın ayıplı olduğu teslim sırasında açıkça belli değilse, tacir alıcı ne yapmakla yükümlüdür?
    siklar:
      - "Ayıp anlaşılınca hemen ihbar etmekle."
      - "İki gün içinde ihbar etmekle."
      - "Malı teslim aldıktan sonra sekiz gün içinde incelemek veya incelettirmekle ve ayıp çıkarsa bu süre içinde ihbar etmekle."
      - "Malı teslimden sonra otuz gün içinde incelemekle."
    dogru: 2
    aciklama: |
      TTK m. 23/1-c'ye göre ayıp açıkça belli değilse alıcı malı teslim aldıktan sonra sekiz gün içinde incelemek veya incelettirmekle ve bu inceleme sonucunda ayıp ortaya çıkarsa haklarını korumak için durumu aynı süre içinde satıcıya ihbarla yükümlüdür. "Hemen" ölçüsü, kanunun "diğer durumlar" dediği gizli ayıplar içindir (TBK m. 223/2); otuz günlük süre ise bu hükümde yoktur.

  - soru: |
      Z Ltd. ve K A.Ş. tacirdir. Z, 4 Mayıs'ta teslim aldığı pres makinesinde Ağustos ayında, olağan bir incelemeyle anlaşılamayacak bir döküm kusuru fark eder ve aynı gün K'ya bildirir. K, sekiz günlük sürenin geçtiğini savunur. K'nın savunması hakkında hangisi doğrudur?
    siklar:
      - "Yerinde değildir; çünkü bu durumda TBK m. 223/2 uygulanır ve ayıp anlaşılınca hemen bildirilmesi yeterlidir."
      - "Yerindedir; çünkü gizli ayıp da teslimden sonra sekiz gün içinde bildirilmelidir."
      - "Yerindedir; çünkü ticari satışta gizli ayıp hiçbir hâlde ileri sürülemez."
      - "Yerinde değildir; çünkü ticari satışta hiçbir ayıp için bildirim süresi yoktur."
    dogru: 0
    aciklama: |
      TTK m. 23/1-c'nin iki gün ve sekiz günlük süreleri ayıbın teslimde açıkça belli olduğu veya inceleme sonucunda ortaya çıktığı durumlar içindir. Diğer durumlarda, yani olağan incelemeyle anlaşılamayan gizli ayıplarda TBK m. 223/2 uygulanır ve ayıp anlaşılınca hemen bildirilmelidir. Z aynı gün bildirdiği için külfetini yerine getirmiştir.

  - soru: |
      Kemal, Murat'a sattığı kamyonun fren sistemindeki ayıbı bile bile gizlemiştir. Murat ayıbı fark ettikten üç ay sonra Kemal'e bildirir. Kemal "ayıp zamanında bildirilmedi" diye savunma yapar. Hangisi doğrudur?
    siklar:
      - "Savunma yerindedir; geç bildirim her satıcı için sorumluluktan kurtulma sebebidir."
      - "Savunma yalnızca tazminat bakımından yerindedir."
      - "Savunma yerinde değildir; çünkü gizli ayıpta bildirim süresi yoktur."
      - "Savunma yerinde değildir; çünkü ağır kusurlu satıcı, ayıbın süresinde bildirilmediğini ileri sürerek kısmen de olsa sorumluluktan kurtulamaz."
    dogru: 3
    aciklama: |
      Kemal ayıbı bilerek gizlediği için ağır kusurludur. TBK m. 225/1'e göre ağır kusurlu satıcı, ayıbın kendisine süresinde bildirilmediğini ileri sürerek sorumluluktan kısmen de olsa kurtulamaz. Gizli ayıpta da hemen bildirim aranır (TBK m. 223/2); sorun bildirimin geç olmasında değil, bu savunmanın ağır kusurlu satıcıya tanınmamasındadır.

  - soru: |
      TBK m. 225/2 neyi düzenler?
    siklar:
      - "Hayvan satışında sorumluluğun yazılı üstlenmeye bağlı olduğunu."
      - "Satıcılığı meslek edinmiş kişilerin bilmesi gereken ayıplar bakımından da ağır kusurlu satıcıya ilişkin hükmün geçerli olduğunu."
      - "Başka yerden gönderilen malı alıcının mahkeme aracılığıyla sattırabileceğini."
      - "Alıcının bildiği ayıplardan satıcının sorumlu olmadığını."
    dogru: 1
    aciklama: |
      TBK m. 225/2, satıcılığı meslek edinmiş kişilerin bilmesi gereken ayıplar bakımından da aynı hükmün, yani ağır kusurlu satıcının süresinde bildirilmediğini ileri sürerek kurtulamayacağı kuralının geçerli olduğunu söyler. Hayvan satışı TBK m. 220'de, sattırma yetkisi TBK m. 226/3'te, alıcının bildiği ayıp TBK m. 222/1'de düzenlenmiştir.

  - soru: |
      İstanbul'daki bir manav, Antalya'dan kamyonla gelen domateslerin yolculukta bozulmaya başladığını görür. Satıcının İstanbul'da temsilcisi yoktur ve domatesler kısa zamanda çürüyebilir. Manav ne yapabilir?
    siklar:
      - "Hiçbir işlem yapamaz; satıcının talimatını beklemek zorundadır."
      - "Malı dilediği gibi satabilir; satıcıya bildirmesi gerekmez."
      - "Malı bulunduğu yerdeki mahkeme aracılığıyla sattırmaya yetkilidir; satıcının yararı gerektiriyorsa sattırmakla yükümlüdür ve durumu satıcıya en kısa zamanda bildirmelidir."
      - "Malı hemen satıcıya geri göndermelidir."
    dogru: 2
    aciklama: |
      TBK m. 226/3'e göre satılanın kısa zamanda bozulma tehlikesi varsa alıcı onu bulunduğu yerdeki mahkeme aracılığıyla sattırmaya yetkili, satıcının yararı gerektiriyorsa sattırmakla yükümlüdür. Durumu satıcıya en kısa zamanda bildirmezse bundan doğan zarardan sorumlu olur. Koruma önlemi almadan geri gönderme ise TBK m. 226/1 ile bağdaşmaz.

  - soru: |
      Tuğba, kendi evinde kullanmak için bir mağazadan aldığı çamaşır makinesinin motorunun teslimden dört ay sonra arızalandığını görür. Satıcı "makine teslim anında ayıpsızdı" diyor. Karinenin uygulanmasına engel bir durum yoktur. İspat yükü hakkında hangisi doğrudur?
    siklar:
      - "Teslimden itibaren altı ay içinde ortaya çıkan ayıp teslimde vardı kabul edilir; malın ayıplı olmadığını satıcı ispat etmelidir."
      - "Ayıbın teslim tarihinde var olduğunu Tuğba ispat etmelidir."
      - "İspat yükü üreticidedir; satıcı hiçbir hâlde ispatla yükümlü değildir."
      - "Altı ay yalnız onarım süresidir ve ispat yükünü etkilemez."
    dogru: 0
    aciklama: |
      TKHK m. 10/1'e göre teslim tarihinden itibaren altı ay içinde ortaya çıkan ayıpların teslim tarihinde var olduğu kabul edilir ve malın ayıplı olmadığını ispat yükü satıcıya aittir. Karine yalnız malın veya ayıbın niteliği ile bağdaşmıyorsa uygulanmaz; soruda bağdaşmaktadır. Altı ay onarım süresi değildir (onarım süresi TKHK m. 11/4'te ayrıca düzenlenir).

  - soru: |
      Murat, tüketici sıfatıyla bir bayiden aldığı fırının teslimden iki ay sonra ayıplı çıkması üzerine fırının üreticisine başvuruyor. Üreticiden hangi hakkı isteyebilir?
    siklar:
      - "Yalnızca ayıp oranında bedelden indirim."
      - "Sözleşmeden dönme, çünkü üretici ve satıcı her konuda müteselsilen sorumludur."
      - "Yalnızca tazminat."
      - "Ücretsiz onarım veya ayıpsız misli ile değiştirme; dönme ve bedelden indirim ise satıcıya karşı kullanılır."
    dogru: 3
    aciklama: |
      TKHK m. 11/2'ye göre ücretsiz onarım veya malın ayıpsız misli ile değiştirilmesi hakları üretici veya ithalatçıya karşı da kullanılabilir ve bu hakların yerine getirilmesinde satıcı, üretici ve ithalatçı müteselsilen sorumludur. Bu fıkra dönme ve bedelden indirimi kapsamaz; bunlar satıcıya yöneltilir (TKHK m. 11/1).

olaylar:
  - olay: |
      Ayşe, 12 Mart 2026'da noterde, Mehmet'ten 2019 model ikinci el bir otomobili 850.000 TL'ye satın alır. Mehmet ilanda ve pazarlıkta aracın "kazasız, boyasız" olduğunu söylemiştir. Noter satış senedinde matbu bir kayıt vardır: "Alıcı bu aracı hâlihazır durumuyla görüp beğenerek ve bedelini tamamen ödeyerek teslim almıştır." Ayşe, aracın sigorta ve hasar kayıtlarını sorgulamamıştır. Mehmet aracı bir yıl önce "ağır hasarlı" kaydıyla satın almıştır ve bu kaydı bilmektedir. Tarafların ikisi de tacir değildir.

      Eylül 2026'da Ayşe aracı satmak için ekspertize götürür. Şasedeki onarım izi ve ağır hasar kaydı ancak ekspertizde ve sigorta kayıtlarından anlaşılabilmektedir. Ayşe aynı gün Mehmet'e noter aracılığıyla ihtarname göndererek ayıbı bildirir. Mehmet şöyle savunur: "Senette aracı görüp beğenerek aldığı yazıyor. Ayrıca sigorta sorgusu yapmadı, bu onun ihmali. Ben de bu yüzden sorumlu değilim ve zaten bildirim geç kaldı."

      1. Aracın ağır hasar geçmişi nitelik bakımından ayıp mıdır? Hangi ayıp türleri söz konusudur?
      2. Senetteki matbu kayıt Mehmet'i sorumluluktan kurtarır mı?
      3. Ayşe'nin sigorta sorgusu yapmamasının etkisi nedir?
      4. Ayşe bildirim külfetini yerine getirmiş midir? Mehmet'in "bildirim geç kaldı" savunması dinlenir mi?
    olcut:
      - {tespit: "Bildirilen niteliğin (kazasız) bulunmaması ve değeri önemli ölçüde azaltan maddi ayıp; satıcının ayıbı bilip bilmemesinin sorumluluğun doğması için aranmaması", puan: 20, madde: "TBK m. 219"}
      - {tespit: "Matbu 'görüp beğenerek aldım' kaydının yalnız açık ayıpları kapsaması, gizli ayıpta sorumsuzluk anlaşması sayılmaması", puan: 15, madde: "TBK m. 221"}
      - {tespit: "Mehmet'in ayıbı bilip gizleyerek ağır kusurlu olması ve sorumluluğu kaldıran anlaşmanın kesin hükümsüz olması", puan: 20, madde: "TBK m. 221"}
      - {tespit: "Alıcının ayıbı bilmemesi; sorgulama yapma yükümlülüğünün bulunmaması ve bilmesi gerektiğini ispat yükünün satıcıda olması", puan: 15, madde: "TBK m. 222"}
      - {tespit: "Ayıbın gizli olması ve anlaşıldığı gün 'hemen' bildirim yapılması", puan: 15, madde: "TBK m. 223"}
      - {tespit: "Ağır kusurlu satıcının geç bildirim savunmasına dayanamaması", puan: 15, madde: "TBK m. 225"}
    cozum: |
      **Nitelendirme:** Mehmet ile Ayşe arasında taşınır nitelikte bir mal olan ikinci el otomobilin satışı vardır. Taraflar tacir olmadığı için adi satış söz konusudur ve ayıp sorunu TBK hükümlerine göre çözülür. Ayşe'nin iddiası, aracın ağır hasar geçmişinin bir ayıp oluşturduğudur.

      **Hukuki sorunlar:** (1) Ayıp var mı ve hangi türdendir? (2) Noter senedindeki kayıt satıcıyı kurtarır mı? (3) Alıcının sorgulama yapmaması sonucu etkiler mi? (4) Bildirim külfeti yerine getirilmiş midir?

      **İlgili hükümler:** TBK m. 219, 221, 222, 223, 225.

      **Değerlendirme:**

      *1. Ayıp:* Mehmet aracı "kazasız, boyasız" diye bildirmiştir. Araç ağır hasar kaydı taşıdığı için bildirilen nitelik satılanda bulunmamaktadır (TBK m. 219/1). Ayrıca ağır hasar, aracın değerini kullanım amacı bakımından önemli ölçüde azaltan maddi bir ayıptır. Satıcının ayıbı bilip bilmemesi sorumluluk için aranmaz (TBK m. 219/2); burada Mehmet ayıbı zaten bilmektedir.

      *2. Senetteki kayıt:* Yargıtay Hukuk Genel Kurulu'na göre noter senedindeki "görüp beğenerek teslim aldı" kaydı alıcının görüp kabul ettiği açık ayıpları kapsar; gizli ayıpta sorumsuzluk anlaşması sayılmaz. Şasedeki onarım izi ve sigorta kaydı ancak ekspertizle anlaşılabildiği için gizli ayıptır. Ayrıca Mehmet ayıbı bilerek gizlemiştir; bu, kasıt anlamında ağır kusurdur. TBK m. 221'e göre satıcı ayıplı devirde ağır kusurlu ise sorumluluğu kaldıran ya da sınırlayan her anlaşma kesin olarak hükümsüzdür. Kayıt Ayşe'ye karşı ileri sürülemez.

      *3. Sorgulama yapılmaması:* TBK m. 222/1'e göre satıcı yalnız sözleşme kurulduğunda alıcının bildiği ayıplardan sorumlu değildir; Ayşe ayıbı bilmiyordu. Alıcının ayıbı bildiğini veya bilmesi gerektiğini satıcı ispat etmelidir ve Mehmet bunu ispat edememektedir. Gizli ayıp bakımından alıcının sigorta ve trafik kayıtlarını araştırma yükümlülüğü yoktur. "Kendi ihmali" savunması bu nedenle sonuç vermez.

      *4. Bildirim:* Ayıp olağan bir gözden geçirmeyle ortaya çıkarılamayacak niteliktedir; ortalama bir alıcının bunu fark etmesi beklenemez. TBK m. 223/2'ye göre böyle bir ayıp sonradan anlaşılırsa hemen bildirilmelidir. Ayşe ayıbı anladığı gün ihtarname göndermiştir; külfetini yerine getirmiştir. Bildirimin geç olduğu varsayılsa bile Mehmet ağır kusurlu olduğundan TBK m. 225/1 uyarınca ayıbın süresinde bildirilmediğini ileri sürerek sorumluluktan kurtulamazdı. Bildirimi yaptığının ispatı Ayşe'ye aittir; noter ihtarnamesi bu ispat için elverişli bir araçtır.

      **Sonuç:**
      - Ağır hasar geçmişi bildirilen niteliğin yokluğu ve değeri önemli ölçüde azaltan maddi ayıptır.
      - Senetteki matbu kayıt gizli ayıbı kapsamaz; ağır kusurlu Mehmet yönünden TBK m. 221 gereği kesin hükümsüzdür.
      - Ayşe'nin sigorta sorgusu yapmaması sorumluluğu kaldırmaz.
      - Ayşe bildirim külfetini yerine getirmiştir; Mehmet'in geç bildirim savunması ağır kusuru nedeniyle de dinlenmez. Ayşe'nin hangi seçimlik hakkı kullanabileceği bir sonraki konunun işidir.

  - olay: |
      Erzurum'daki X Kafe Ltd. Şti., İzmir'deki Y Makine A.Ş.'den 20 adet espresso makinesi satın alır. İki şirket de tacirdir. Makineler 2 Mart 2026'da kargo ile teslim edilmiştir; Y A.Ş.'nin Erzurum'da bir temsilcisi yoktur. Y A.Ş.'nin ayıpları bildiği ya da bilmesi gerektiği ileri sürülmemektedir ve ağır kusuru yoktur.

      (a) Teslim sırasında iki makinenin gövdesinde, makineler kargoya verilmeden önce oluşmuş ezik ve çizikler açıkça görülmüş, X bunu 9 Mart'ta e-postayla Y'ye bildirmiştir.

      (b) Altı makine kutudan çıkarılmadan depoya konulmuş; X kutuları 20 Mart'ta açıp makineleri ilk kez çalıştırdığında ısıtıcının çalışmadığını görmüş ve aynı gün bildirmiştir. Bu arıza makine ilk çalıştırıldığında anlaşılabilecek niteliktedir.

      (c) Dört makinede ise basınç valfinde, ancak aylarca kullanımla ortaya çıkabilen ve olağan bir gözden geçirmeyle anlaşılamayacak bir imalat kusuru vardır. X kusuru 5 Ekim 2026'da fark eder ve aynı gün Y'ye bildirir. Y "sekiz günlük süre geçti" savunmasını yapar.

      (d) X, (c)'deki dört makineyi ayıplı olduğunu ileri sürerek hiçbir koruma önlemi almadan ve durumun tespitini de yaptırmadan, açık bir kamyonetle yağmurlu havada Y'ye geri gönderir; makineler ıslanıp zarar görür.

      1. Uyuşmazlığa hangi hükümler uygulanır?
      2. (a) ve (b)'deki makineler bakımından X'in durumu nedir?
      3. (c)'deki makineler bakımından Y'nin savunması yerinde midir?
      4. (d)'deki geri göndermeyi ve ispat bakımından X'in durumunu değerlendiriniz.
    olcut:
      - {tespit: "Tacirler arasındaki ticari satışta TBK satış hükümlerinin uygulanması ve ayıp bildirimi için TTK'daki özel sürelerin geçerli olması", puan: 10, madde: "TTK m. 23"}
      - {tespit: "(a): teslimde açıkça belli ayıp için iki günlük ihbar süresi; 9 Mart ihbarının geç olması ve ayıbın kabul edilmiş sayılması", puan: 20, madde: "TTK m. 23/1-c"}
      - {tespit: "(b): açıkça belli olmayan ayıpta sekiz gün içinde inceleme ve ihbar külfeti; 20 Mart'ta açılan kutularda süre geçmiş olması", puan: 20, madde: "TTK m. 23/1-c"}
      - {tespit: "(c): olağan incelemeyle anlaşılamayan gizli ayıpta TBK m. 223/2'nin uygulanması, anlaşıldığı gün bildirimin 'hemen' olması ve sekiz gün savunmasının yersizliği", puan: 25, madde: "TBK m. 223"}
      - {tespit: "(d): satıcının temsilcisi yokken koruma önlemleri alınmadan malın geri gönderilememesi", puan: 15, madde: "TBK m. 226"}
      - {tespit: "(d): gecikmeksizin tespit yaptırılmadığı için ayıbın mal ulaştığında var olduğunun ispat yükünün alıcıya düşmesi", puan: 10, madde: "TBK m. 226"}
    cozum: |
      **Nitelendirme:** İki tacir arasında bir ticari satış vardır. Taşınır mallar kargo ile başka yerden gönderilmiştir ve satıcının alıcının bulunduğu yerde temsilcisi yoktur. Her makine grubu için ayıbın türü (açıkça belli, inceleme ile ortaya çıkan, gizli) farklıdır.

      **Hukuki sorunlar:** (1) Hangi hükümler uygulanır? (2) Açıkça belli ve açıkça belli olmayan ayıplarda süreler kaçırılmış mıdır? (3) Gizli ayıpta "hemen" bildirim yapılmış mıdır? (4) Başka yerden gönderilen malın geri gönderilmesi ve ispat.

      **İlgili hükümler:** TTK m. 23/1, 23/1-c; TBK m. 223, 226; TTK m. 18/2.

      **Değerlendirme:**

      *1. Uygulanacak hükümler:* TTK m. 23/1'e göre özel hükümler saklı kalmak şartıyla tacirler arasındaki satışlara TBK'nın satış hükümleri uygulanır. Ayıp bildirimi bakımından özel hüküm TTK m. 23/1-c'dir. Her tacir basiretli bir iş adamı gibi hareket etmek zorundadır (TTK m. 18/2). Y'nin ağır kusuru olmadığı için TBK m. 225 devreye girmez.

      *2. (a) ve (b):* (a)'da ayıp teslim sırasında açıkça belli olduğundan X'in iki gün içinde ihbar etmesi gerekirdi (TTK m. 23/1-c). X ihbarı yedi gün sonra, 9 Mart'ta yapmıştır; süre geçmiştir. Gözden geçirmeyi ve zamanında bildirimi ihmal eden alıcı satılanı kabul etmiş sayılır (TBK m. 223/2); X bu iki makine bakımından ayıba dayanamaz. (b)'de ayıp açıkça belli değildir; bu durumda alıcı malı teslim aldıktan sonra sekiz gün içinde incelemek veya incelettirmekle ve ayıp çıkarsa aynı süre içinde ihbarla yükümlüdür. X kutuları 18. günde açmıştır; aynı gün bildirmiş olması süreyi geri getirmez, çünkü ihmal edilen şey sekiz gün içinde inceleme külfetidir. Bu altı makine bakımından da X ayıbı kabul etmiş sayılır.

      *3. (c):* Basınç valfindeki kusur olağan bir gözden geçirmeyle anlaşılamayan gizli ayıptır. TTK m. 23/1-c bu "diğer durumlarda" TBK m. 223/2'yi uygular: ayıp sonradan anlaşılırsa hemen satıcıya bildirilmelidir. X kusuru fark ettiği gün bildirmiştir; külfetini yerine getirmiştir. Y'nin "sekiz gün geçti" savunması, sekiz günlük süre yalnız açıkça belli olmayan ve inceleme ile ortaya çıkan ayıplar için işlediğinden yersizdir. (Alıcının hangi seçimlik hakları kullanacağı ve zamanaşımı sonraki konudur.)

      *4. (d):* Y'nin Erzurum'da temsilcisi olmadığından X, malın korunması için gerekli önlemleri geçici olarak almak zorundadır ve bu önlemleri almadan ayıplı olduğunu ileri sürdüğü makineleri geri gönderemez (TBK m. 226/1). X makineleri yağmurlu havada açık kamyonetle göndererek bu yükümlülüğe aykırı davranmıştır. Ayrıca X, makinelerin durumunu gecikmeksizin usulüne göre tespit ettirmemiştir. Bu nedenle valf kusurunun mal kendisine ulaştığında var olduğunu ispat yükü X'e düşer (TBK m. 226/2). Makineler hâlâ gizli ayıp nedeniyle Y'nin sorumluluğuna konu olabilir; ama X'in ispat durumu zayıflamıştır.

      **Sonuç:**
      - Tacirler arasında TBK satış hükümleri ve TTK m. 23/1-c'nin özel süreleri uygulanır.
      - (a) ve (b)'de iki gün ve sekiz gün kaçırıldığı için X ayıplı makineleri kabul etmiş sayılır.
      - (c)'de gizli ayıp hemen bildirilmiştir; Y'nin sekiz gün savunması yersizdir.
      - (d)'de X koruma önlemleri almadan malı geri gönderemez ve tespit yaptırmadığı için ayıbın varlığını ispat yükü ona düşer.

  - olay: |
      Tuğba, Kadıköy'deki bir elektronik mağazasından (S Ltd. Şti.) Ü A.Ş. üretimi bir buzdolabını 1 Haziran 2026'da kendi evi için satın alır. Dolap aynı gün S'nin elemanlarınca eve getirilip monte edilir. 4 Ekim 2026'da dolabın motoru arızalanır. Ayrıca montaj sırasında hatalı yapılan su bağlantısı yüzünden mutfak parkeleri kabarmıştır. Tuğba arızayı aynı gün S'ye telefonla ve e-postayla bildirir. S şöyle yanıt verir: "Tacirler arasında sekiz günlük ihbar süresi vardır, süre geçti. Üstelik arıza kullanım hatasından kaynaklanıyor."

      Tuğba, S'nin bu yanıtı üzerine üretici Ü A.Ş.'ye başvurur. Ü A.Ş.'den önce sözleşmeden dönmeyi, olmazsa dolabın ayıpsız misli ile değiştirilmesini ister. Taraflar arasında teslim ve montaj dışında dolabın kullanımına ilişkin özel bir sözleşme koşulu yoktur.

      1. Ayıp hangi ana göre değerlendirilir ve ispat yükü kimdedir?
      2. Su bağlantısının hatalı yapılmasının hukuki niteliği nedir?
      3. S'nin TTK'ya dayanan savunması yerinde midir?
      4. Tuğba'nın üreticiye karşı istemleri hakkında ne söylenebilir?
    olcut:
      - {tespit: "Ayıplı malın tüketiciye teslimi anındaki sözleşmeye aykırılık olarak tanımlanması; ayıbın teslim anına göre değerlendirilmesi", puan: 15, madde: "TKHK m. 8"}
      - {tespit: "Teslimden itibaren altı ay içinde ortaya çıkan ayıbın teslimde var olduğunun kabulü; ayıplı olmadığını ispat yükünün satıcıda olması", puan: 25, madde: "TKHK m. 10"}
      - {tespit: "Montajın satıcı tarafından yapıldığı hâlde hatalı yapılmasının sözleşmeye aykırı ifa sayılması", puan: 15, madde: "TKHK m. 8/3"}
      - {tespit: "TTK'daki iki gün ve sekiz günlük sürelerin tacirler arasındaki satışa özgü olması; tüketici satışında TKHK'da böyle bir bildirim süresinin bulunmaması", puan: 15, madde: "TTK m. 23"}
      - {tespit: "Üreticiye karşı yalnız ücretsiz onarım veya ayıpsız misli ile değiştirme isteneceği; satıcı, üretici ve ithalatçının müteselsil sorumluluğu", puan: 20, madde: "TKHK m. 11/2"}
      - {tespit: "Dönme ve bedelden indirim haklarının satıcıya yöneltilmesi", puan: 10, madde: "TKHK m. 11/1"}
    cozum: |
      **Nitelendirme:** Tuğba kendi evi için mal aldığından tüketici sıfatındadır; satıcı S Ltd. Şti. ise ticari faaliyet yürütmektedir. Uyuşmazlık tüketici satışına ilişkindir ve 6502 sayılı Kanun öncelikle uygulanır; Kanun'da hüküm bulunmayan hâllerde genel hükümlere dönülür (TKHK m. 83/1).

      **Hukuki sorunlar:** (1) Ayıp tespiti ve ispat yükü; (2) montaj hatası; (3) TTK sürelerinin uygulanması; (4) üreticiye karşı kullanılabilecek haklar.

      **İlgili hükümler:** TKHK m. 8, 10, 11; TTK m. 23/1-c.

      **Değerlendirme:**

      *1. Ayıp ve ispat:* Ayıplı mal, tüketiciye teslimi anında örnek ya da modele uygun olmaması veya objektif olarak sahip olması gereken özellikleri taşımaması nedeniyle sözleşmeye aykırı olan maldır (TKHK m. 8/1); ayıp teslim anına göre değerlendirilir. Teslimden itibaren altı ay içinde ortaya çıkan ayıpların teslim tarihinde var olduğu kabul edilir ve malın ayıplı olmadığının ispatı satıcıya aittir (TKHK m. 10/1). Motor arızası teslimden dört ay sonra çıkmıştır; altı ay içindedir. Karinenin uygulanmasına engel bir durum da görünmemektedir. Dolayısıyla S, arızanın kullanım hatasından kaynaklandığını ve dolabın teslimde ayıpsız olduğunu ispat etmelidir; Tuğba ayıbın teslimde var olduğunu ispatla yükümlü değildir.

      *2. Montaj hatası:* Montajı satıcı tarafından veya onun sorumluluğu altında yapılan malda, mal gereği gibi monte edilmemişse bu sözleşmeye aykırı ifadır (TKHK m. 8/3). Dolap S'nin elemanlarınca monte edildiği için hatalı su bağlantısı S'nin sorumluluğundadır. Parkelerdeki zarar bakımından tüketici, seçimlik haklarından biriyle birlikte TBK hükümlerine göre tazminat da isteyebilir (TKHK m. 11/6).

      *3. TTK savunması:* TTK m. 23/1-c'deki iki gün ve sekiz günlük ihbar süreleri tacirler arasındaki satış ve mal değişimleri için öngörülmüştür (TTK m. 23/1). Tuğba tacir değil tüketicidir; bu süreler ona uygulanmaz. TKHK m. 8-12'de de ayıp için muayene ve ihbar süresi öngörülmemiştir. Ayrıca Tuğba arızayı zaten hemen bildirmiştir. S'nin savunması yerinde değildir.

      *4. Üreticiye karşı istemler:* Ücretsiz onarım veya malın ayıpsız misli ile değiştirilmesi hakları üretici veya ithalatçıya karşı da kullanılabilir; bu hakların yerine getirilmesinde satıcı, üretici ve ithalatçı müteselsilen sorumludur (TKHK m. 11/2). Sözleşmeden dönme ve bedelden indirim ise satıcıya karşı kullanılır (TKHK m. 11/1). Bu nedenle Tuğba, Ü A.Ş.'den ayıpsız misli ile değiştirmeyi ya da ücretsiz onarımı isteyebilir; dönmeyi ise yalnız S'ye karşı ileri sürebilir.

      **Sonuç:**
      - Ayıp, teslim anına göre değerlendirilir; altı ay içinde çıktığı için teslimde var sayılır ve ayıpsızlığı S ispat etmelidir.
      - Hatalı montaj TKHK m. 8/3 uyarınca sözleşmeye aykırı ifadır.
      - TTK'daki sekiz günlük süre tüketici satışında uygulanmaz; S'nin savunması yersizdir.
      - Üreticiden yalnız onarım veya değiştirme istenebilir; dönme S'ye karşı kullanılır.

kartlar:
  - on: "Satıcı ayıbı bilmiyorsa sorumlu olur mu? (TBK m. 219/2)"
    arka: "Evet. Satıcı, ayıpların varlığını bilmese bile onlardan sorumludur; ayıptan sorumluluk kusursuz sorumluluktur."
  - on: "TBK m. 219/1'e göre satıcı hangi iki gerekçeyle sorumlu olur?"
    arka: "Bildirdiği niteliklerin satılanda bulunmamasından; değeri ve beklenen faydayı ortadan kaldıran veya önemli ölçüde azaltan maddi, hukuki ya da ekonomik ayıplardan."
  - on: "Ayıp türleri ve birer örnek?"
    arka: "Maddi: kumaşta yırtık. Hukuki: imarlı denen arsanın yeşil alan çıkması. Ekonomik: makinenin üç kat yakıt harcaması. Bildirilen nitelik: '%100 ipek' halının sentetik çıkması."
  - on: "Eski Borçlar Kanunu'ndan farklı olarak TBK m. 219'a ne eklendi?"
    arka: "'Ekonomik ayıp' ve 'niteliği etkileyen niceliğe aykırılık' ifadeleri metne eklendi."
  - on: "Hayvan satışında satıcı ne zaman sorumlu olur? (TBK m. 220)"
    arka: "Yazılı olarak üstlenmişse veya ağır kusuru varsa."
  - on: "Hayvan satışında bildirim süresi? (TBK m. 224)"
    arka: "Süre yazılı belirlenmemiş ve ayıp gebelikle ilgili değilse devirden itibaren dokuz gün içinde bildirim ve aynı süre içinde yetkili makamdan bilirkişi istemi; ikisi birlikte aranır."
  - on: "Sorumsuzluk anlaşması ne zaman hükümsüzdür? (TBK m. 221)"
    arka: "Satıcı satılanı ayıplı olarak devretmekte ağır kusurlu ise anlaşma kesin olarak hükümsüzdür."
  - on: "Noter senedindeki 'görüp beğenerek aldım' kaydının kapsamı?"
    arka: "Yalnız açık ayıpları kapsar. Gizli ayıpta sorumsuzluk anlaşması sayılmaz; ağır kusurlu satıcı yönünden TBK m. 221 gereği zaten hükümsüzdür."
  - on: "Alıcının bildiği ayıp ve görebileceği ayıp arasındaki fark? (TBK m. 222)"
    arka: "Sözleşme kurulurken alıcının bildiği ayıptan satıcı sorumlu değildir. Yeterli gözden geçirmeyle görülebilecek ayıptan ise ancak bulunmadığını ayrıca üstlenmişse sorumlu olur."
  - on: "Alıcının bildiğini veya bilmesi gerektiğini kim ispat eder?"
    arka: "Satıcı. Gizli ayıp bakımından alıcının ayıpları araştırma yükümlülüğü de yoktur."
  - on: "Adi satışta açık ayıp hangi ölçüyle bildirilir? (TBK m. 223/1)"
    arka: "Alıcı imkân bulunur bulunmaz gözden geçirir ve ayıbı uygun bir süre içinde bildirir; kanun gün sayısı vermez."
  - on: "Gizli ayıp nasıl bildirilir? (TBK m. 223/2)"
    arka: "Olağan gözden geçirmeyle anlaşılamayan ayıp sonradan anlaşılırsa hemen bildirilir; bildirilmezse satılan bu ayıpla birlikte kabul edilmiş sayılır."
  - on: "Gözden geçirme ve bildirim borç mudur?"
    arka: "Hayır, külfettir. İhmalin sonucu kabul edilmiş sayılmadır; satıcı alıcıdan bunu talep edemez."
  - on: "Ağır kusurlu satıcı hangi savunmayı yapamaz? (TBK m. 225/1)"
    arka: "Ayıbın kendisine süresinde bildirilmediğini ileri sürerek kısmen de olsa sorumluluktan kurtulamaz. Meslekten satıcı için bilmesi gereken ayıplarda da aynı hüküm geçerlidir (TBK m. 225/2)."
  - on: "Başka yerden gönderilen malda alıcının yükümlülükleri? (TBK m. 226)"
    arka: "Temsilci yoksa koruma önlemlerini geçici olarak alır, almadan geri gönderemez; durumu gecikmeksizin tespit ettirir, yoksa ispat yükü ona düşer; çabuk bozulan malı mahkeme aracılığıyla sattırabilir, gerekirse sattırmakla yükümlüdür."
  - on: "Ticari satışta ayıp ihbar süreleri? (TTK m. 23/1-c)"
    arka: "Teslimde açıkça belli ayıp: iki gün. Açıkça belli değilse: teslimden sonra sekiz gün içinde inceleme ve ihbar. Diğer (gizli) ayıplar: TBK m. 223/2, yani hemen."
  - on: "İki gün ve sekiz gün tüketici satışında uygulanır mı?"
    arka: "Hayır. Bu süreler tacirler arasındaki satışa özgüdür. TKHK m. 8-12'de ayıp bildirimi için süre öngörülmemiştir."
  - on: "Tüketici satışında altı aylık karine? (TKHK m. 10/1)"
    arka: "Teslimden itibaren altı ay içinde çıkan ayıp teslimde vardı sayılır; ayıplı olmadığını satıcı ispat eder. Malın veya ayıbın niteliğiyle bağdaşmıyorsa uygulanmaz."
  - on: "Tüketici satışında üretici ve ithalatçıya karşı hangi haklar? (TKHK m. 11/2)"
    arka: "Ücretsiz onarım ve ayıpsız misli ile değiştirme; satıcı, üretici ve ithalatçı müteselsilen sorumludur. Dönme ve bedelden indirim satıcıya karşı kullanılır."
  - on: "Açık ve gizli ayıp ayrımında kimin bilgisi ölçüdür?"
    arka: "Uzman bilirkişinin değil, ortalama (vasat) alıcının bilgisi."
