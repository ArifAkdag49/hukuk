      Davacı alıcı, bir şirketten 2013'te 72.000 TL bedelle ve "2 yıl veya 3000 saat" garantiyle bir traktör almış; traktörde şanzıman, fren ve hidrolik sistemi gibi arızalar sürekli yinelenince noter ihtarlarına rağmen sonuç alamamıştır. Hem satıcı şirkete hem de üretici şirkete karşı ayıpsız misliyle değişim, olmazsa bedel iadesi ve kullanamamaktan doğan kâr kaybı için dava açmıştır. İlk derece mahkemesinin davayı hak düşürücü süre yönünden reddeden ilk kararı istinafta kaldırılmış; yeniden yapılan yargılamada ilk derece mahkemesi satıcı yönünden misliyle değişimi kabul etmiş, birkaç masrafın ödenmesine hükmetmiş; üretici yönünden satıcı olmadığı için davayı pasif husumet yokluğundan reddetmiş, istinaf başvurusu da reddedilmiştir. Yargıtay 3. Hukuk Dairesi, TBK'nın ayıba karşı tekeffül hükümlerinde üreticinin sorumluluğuna ilişkin bir düzenleme bulunmadığı için üreticiye karşı verilen red kararında isabetsizlik görmemiştir. Kararda ayrıca dönme beyanının satıcıya ulaşınca hüküm doğuran bozucu yenilik doğuran bir hak olduğu ve dönen alıcının satılanı elde ettiği yararlarla birlikte geri vereceği (TBK m. 229/1) belirtilmiştir. Davacının yoksun kaldığı kâr talebi hakkında hüküm kurulmadığından karar yalnız bu yönden bozulmuştur. Konuya katkısı: TBK'ya tabi satışta seçimlik haklar satıcıya yöneltilir; üreticiye karşı TKHK m. 11/2 benzeri bir yol açık değildir.
