  - id: "1216295500"
    ozet: |
      Davacı şirket, bir büyükşehir belediyesinin ihaleyle sattığı arsayı 2016'da 8.850.000 TL'ye almış; satış tarihinde parselin yapılaşma koşulları konut alanında "Emsal 1,60, Hmax serbest" imiş. Şirket arsayı kısa süre sonra başka bir şirkete devretmiştir. Sonraki yıllarda imar planı değişiklikleri idari yargı kararlarıyla iptal edilmiş, yapı mühürlenip yıkım kararı verilmiş ve taşınmaz davacıya iade edilmiştir. Davacı, taşınmazın hukuki ve ekonomik açıdan ayıplı hâle geldiğini ileri sürerek değer kaybını, olmazsa arsa ve inşaat için ödenen bedelin iadesini istemiştir. İlk derece mahkemesi ve bölge adliye mahkemesi, ihale şartnamesindeki sorumsuzluk kaydını, satış tarihinde taşınmazın ayıplı olmadığını ve imar planlarının tarafların iradesi dışında idari yargı kararlarıyla iptal edildiğini gerekçe göstererek davayı reddetmiştir. Yargıtay 3. Hukuk Dairesi kararı oy çokluğuyla onamıştır. Karşı oy, belediyenin ağır kusurlu olduğunu, TBK m. 221 gereği sorumsuzluk kaydının hükümsüz sayılması gerektiğini ve dönmenin sonuçlarına ilişkin istemlerin (TBK m. 229) kabul edilmesini savunmuştur. Konuya katkısı: TBK m. 227 ve 229'daki hakların kullanılabilmesi için önce satıcının ayıptan sorumlu olması gerekir; karar, satış sonrası idari yargı kararlarıyla ortaya çıkan durumun ve sorumsuzluk kaydının bu bakımdan nasıl değerlendirildiğini gösterir.

sorular:
  - soru: |
      Aşağıdakilerden hangisi TBK m. 227/1'de sayılan seçimlik haklardan biri **değildir**?
    siklar:
      - "Satılanı geri vermeye hazır olduğunu bildirerek sözleşmeden dönme"
      - "Satılanı alıkoyup ayıp oranında satış bedelinde indirim isteme"
      - "Ayıbı üçüncü bir kişiye onartıp masrafını satıcıdan isteme"
      - "İmkân varsa satılanın ayıpsız bir benzeri ile değiştirilmesini isteme"
    dogru: 2
    aciklama: |
      TBK m. 227/1 yalnız dört hak sayar: dönme, ayıp oranında bedel indirimi, bütün masrafları satıcıya ait olmak üzere **satılanın ücretsiz onarılmasını isteme** ve imkân varsa değiştirme. Alıcının kendi başına üçüncü kişiye onartıp masrafı satıcıdan istemesi listede yer almaz; kanundaki onarım hakkı, onarımın satıcıdan istenmesi biçimindedir.
  - soru: |
      Ahmet, ikinci el bir tezgâhı 90.000 TL'ye satın alır. Tezgâhın ayıpsız değeri 120.000 TL, ayıplı hâlinin değeri 80.000 TL'dir. Ahmet satılanı alıkoyarak bedel indirimi seçerse oransal (nispi) yönteme göre indirim tutarı ne olur?
    siklar:
      - "10.000 TL"
      - "30.000 TL"
      - "40.000 TL"
      - "45.000 TL"
    dogru: 1
    aciklama: |
      Kanun "ayıp oranında" indirim der. Ayıplı değerin ayıpsız değere oranı 80.000 ÷ 120.000 = 2/3'tür. Ahmet'in ödemesi gereken bedel 90.000 × 2/3 = 60.000 TL, indirim 30.000 TL'dir. Değer farkının (120.000 − 80.000 = 40.000 TL) indirilmesi, bedel ayıpsız değerden düşük olduğu için doğru sonuç vermez. (TBK m. 227/1)
  - soru: |
      Satıcı, alıcının seçimlik haklarını kullanmasını TBK m. 227/3'e göre hangi şartlarla önleyebilir?
    siklar:
      - "Ayıbı bilmediğini ispat ederek"
      - "Yalnızca satış bedelini faiziyle iade ederek"
      - "Ayıp bildiriminin gecikmeli yapıldığını ileri sürerek"
      - "Aynı malın ayıpsız bir benzerini hemen vererek ve uğradığı zararın tamamını gidererek"
    dogru: 3
    aciklama: |
      TBK m. 227/3'e göre satıcı, aynı malın ayıpsız bir benzerini **hemen** vererek **ve** zararın **tamamını** gidererek seçimlik hakları önleyebilir. Ayıbı bilmemek sorumluluğu kaldırmaz (TBK m. 219/2); bedeli iade etmek ise alıcının seçeceği dönme hakkının karşılığıdır, satıcının tek taraflı önleme yolu değildir.
  - soru: |
      Gül, bir tarım makinesini 250.000 TL'ye alır; ayıp yüzünden makinenin değeri fiilen bedele çok yakın bir oranda düşmüştür. Gül'ün seçimlik hakları bakımından hangisi doğrudur?
    siklar:
      - "Yalnız bedel indirimi isteyebilir"
      - "Yalnız ücretsiz onarım isteyebilir"
      - "Ancak sözleşmeden dönme veya ayıpsız benzeriyle değiştirme isteyebilir"
      - "Hiçbir seçimlik hakkı kullanamaz"
    dogru: 2
    aciklama: |
      Satılanın değerindeki eksiklik satış bedeline çok yakın olduğunda alıcı **ancak** sözleşmeden dönme veya ayıpsız benzeriyle değiştirme haklarından birini kullanabilir (TBK m. 227/5). Bu durumda indirim ve onarım yolu kapanır.
  - soru: |
      Ayşe, 500.000 TL'lik otomobilin kapı contasındaki küçük bir sızıntı yüzünden sözleşmeden dönmüştür. Sızıntı masrafsız ve kolayca onarılabilir; durum dönmeyi haklı göstermemektedir. Hâkim TBK m. 227/4'e göre ne yapabilir?
    siklar:
      - "Satılanın onarılmasına veya satış bedelinin indirilmesine karar verebilir"
      - "Kendiliğinden ayıpsız benzeriyle değişime karar verebilir"
      - "Alıcıyı ayrıca tazminata mahkûm edebilir"
      - "Sözleşmenin yeniden kurulmasına karar verebilir"
    dogru: 0
    aciklama: |
      Alıcı dönme hakkını kullanmış ve durum bunu haklı göstermiyorsa hâkim, satılanın **onarılmasına** veya satış bedelinin **indirilmesine** karar verebilir (TBK m. 227/4). Kanun hâkime yalnız bu iki alternatifi tanır; kendiliğinden ayıpsız benzeriyle değişim bunların arasında sayılmaz.
  - soru: |
      Deniz'in satın aldığı canlı balıklar, satış sırasında mevcut bulaşıcı bir hastalıktan (ayıptan) dolayı ölmüştür. Deniz sözleşmeden dönmek istemektedir. Hangisi doğrudur?
    siklar:
      - "Satılan yok olduğundan Deniz dönemez, yalnız bedel indirimi isteyebilir"
      - "Deniz dönemez; ancak tazminat isteyebilir"
      - "Deniz dönebilir ve elinde ne kalmışsa onu geri verir"
      - "Deniz dönemez, ancak satıcının ayıpsız benzerini vermesini bekleyebilir"
    dogru: 2
    aciklama: |
      Ayıplı devredilen satılanın **ayıptan**, beklenmedik hâlden veya mücbir sebepten yok olması alıcının dönme hakkını engellemez; alıcı elinde ne kalmışsa onu geri vermekle yükümlüdür (TBK m. 228/1). Yalnız bedel indirimine yönelten sebep, alıcıya yüklenebilen yok oluş, devir veya biçim değiştirmedir.
  - soru: |
      Ece, ayıplı bir kumaşı satın alır ve ayıbı fark etmeden kumaşı keserek elbise diker. Daha sonra ayıbı anlayıp sözleşmeden dönmek istemektedir. Ece'nin durumu için hangisi doğrudur?
    siklar:
      - "Ece yalnız değerindeki eksikliğin bedelden indirilmesini isteyebilir"
      - "Ece dönebilir; çünkü ayıbı sonradan öğrenmiştir"
      - "Ece ayıpsız kumaşla değiştirme isteyebilir"
      - "Ece ücretsiz onarım isteyebilir"
    dogru: 0
    aciklama: |
      Alıcı satılanın **biçimini değiştirmişse** ancak değerindeki eksiklik karşılığının satış bedelinden indirilmesini isteyebilir (TBK m. 228/2). Kumaşın kesilerek elbiseye dönüştürülmesi biçim değiştirmedir; bu durumda dönme, değiştirme ve onarım artık gündeme gelmez.
  - soru: |
      Cem, ayıplı bir dizüstü bilgisayarı satın aldıktan sonra üçüncü bir kişiye satıp devretmiştir. Ayıbın varlığı ve bildirimin süresinde yapıldığı sabittir. Cem hangisini isteyebilir?
    siklar:
      - "Sözleşmeden dönme"
      - "Ayıpsız benzeriyle değiştirme"
      - "Ancak değerindeki eksikliğin bedelden indirilmesi"
      - "Ücretsiz onarım"
    dogru: 2
    aciklama: |
      Alıcı satılanı başkasına devretmişse artık satılanı geri veremez; TBK m. 228/2'ye göre ancak değerindeki eksiklik karşılığının satış bedelinden indirilmesini isteyebilir. Dönme, değiştirme ve onarım bu durumda uygun düşmez.
  - soru: |
      Fatma, aldığı soğutucudaki ayıp nedeniyle ayıpsız benzeriyle değiştirme seçmiştir. Soğutucu içindeki ilaç stoku da bozulmuştur. Fatma ayrıca zararını istemek istemektedir. Hangisi doğrudur?
    siklar:
      - "Seçimlik hakkını kullandığı için tazminat isteyemez"
      - "Tazminat ancak dönme seçildiğinde istenebilir"
      - "Genel hükümlere göre tazminat isteme hakkı saklıdır; satıcı kusursuzluğunu ispat etmedikçe zararı giderir"
      - "Tazminat yalnız satıcı ayıbı bilerek gizlemişse istenebilir"
    dogru: 2
    aciklama: |
      TBK m. 227/2'ye göre alıcının genel hükümlere göre tazminat isteme hakkı saklıdır; seçimlik haklara ek olarak istenebilir. Genel hükümde borçlu, kendisine kusur yüklenemeyeceğini ispat etmedikçe zararı giderir (TBK m. 112). Tazminatın yalnız dönmeye veya satıcının bilmesine bağlı olduğu söylenemez.
  - soru: |
      Mehmet, ayıplı bir pres makinesi yüzünden üçüncü bir kişiyle yaptığı üretim sözleşmesini ifa edememiş ve 80.000 TL kâr kaybına uğramıştır. Mehmet sözleşmeden dönmüştür. Satıcı, kendisine hiçbir kusur yüklenemeyeceğini ispat etmiştir. Kâr kaybı bakımından sonuç nedir?
    siklar:
      - "Satıcı kusursuzluğunu ispat ettiği için kâr kaybından sorumlu olmaz"
      - "Satıcı kusursuz olsa bile kâr kaybını öder"
      - "Mehmet kâr kaybını yalnız satıcı ağır kusurluysa isteyebilir"
      - "Dönme seçilmiş olduğundan Mehmet hiçbir zarar isteyemez"
    dogru: 0
    aciklama: |
      Üçüncü kişiyle yapılan sözleşmenin ifa edilememesi yüzünden doğan kâr kaybı, makinenin kendisinden doğan zarar değil, **diğer zarar** niteliğindedir. Diğer zararlar için satıcı kendisine hiçbir kusur yüklenemeyeceğini ispat ederse sorumlu olmaz (TBK m. 229/2).
  - soru: |
      Burak, ayıplı bir otomobilden sözleşmeden dönmüş; satış için noter masrafı ödemiştir. Burak satıcıdan hangi istemlerde bulunabilir?
    siklar:
      - "Yalnız ödediği satış bedelini, faizsiz olarak"
      - "Yalnız satılan için yaptığı giderleri"
      - "Ödediği satış bedelini faiziyle birlikte ve satılan için yaptığı giderleri"
      - "Satış bedelini, ancak giderleri değil"
    dogru: 2
    aciklama: |
      TBK m. 229/1'e göre dönen alıcı satıcıdan ödediği satış bedelinin **faiziyle birlikte** geri verilmesini ve satılan için yaptığı giderlerin ödenmesini isteyebilir. Bu istemler birbirinin yerine değil, birlikte ileri sürülür.
  - soru: |
      Hasan, 12 sandalyeyi bir arada satın almış, üçü ayıplı çıkmıştır. Sandalyeler tek tek ayrılabilmekte, ayırmak ne alıcıya ne satıcıya önemli bir zarar vermektedir. Hasan sözleşmeden dönmek isterse dönme hangi kapsamda kullanılabilir?
    siklar:
      - "Bütün sandalyeler için, çünkü birlikte satılmışlardır"
      - "Yalnız ayıplı çıkan üç sandalye için"
      - "Dönme hakkı kullanılamaz; yalnız indirim istenebilir"
      - "Üç ayıplı sandalye ve en az üç ayıpsız sandalye için"
    dogru: 1
    aciklama: |
      Birlikte satılan birden çok maldan bazıları ayıplı çıkarsa dönme hakkı ancak ayıplı çıkanlar için kullanılır; ayırmak önemli zarar vermeksizin mümkünse tamamını kapsamaz (TBK m. 230/1). Tamamını kapsaması, ayrılamama hâlinde söz konusudur.
  - soru: |
      Elif, bir otomobili ayrı bedel gösterilen yedek lastik ve kriko setiyle birlikte satın almıştır. Motorda ayıp ortaya çıkmış ve Elif otomobilden dönmüştür. Set bakımından hangisi doğrudur?
    siklar:
      - "Asıl şeyden dönmek eklentiyi de kapsar; ayrı bedel yazılması sonucu değiştirmez"
      - "Dönme setleri kapsamaz; ayrı bedel yazıldığı için set Elif'te kalır"
      - "Set için ayrıca dönme beyanı gerekir"
      - "Set ancak satıcı razı olursa iade edilebilir"
    dogru: 0
    aciklama: |
      Satılanın aslı için satıştan dönülmesi, eklentileri ayrı satış bedeli gösterilerek satılmış olsalar bile kapsar (TBK m. 230/2). Ayrı beyan ya da satıcının onayı aranmaz.
  - soru: |
      Nur, bir otomobili yedek lastik ve kriko setiyle birlikte satın almıştır. Yalnız kriko kırık çıkmış, otomobil ayıpsızdır. Nur yalnız krikodan dönerse sonuç ne olur?
    siklar:
      - "Dönme otomobili de kapsar"
      - "Dönme mümkün değildir; yalnız indirim istenebilir"
      - "Dönme için hâkimin ayrıca karar vermesi gerekir"
      - "Dönme yalnız eklentiyi kapsar, otomobil sözleşmesi ayakta kalır"
    dogru: 3
    aciklama: |
      Eklentiler için dönme satılanın aslını kapsamaz (TBK m. 230/2). Nur'un dönmesi yalnız eklenti için sonuç doğurur; otomobil satışı olduğu gibi kalır.
  - soru: |
      Nilay, 1 Mart 2024'te teslim aldığı bir tarım makinesindeki gizli ayıbı 20 Nisan 2026'da fark eder ve hemen satıcıya bildirir. Satıcı ağır kusurlu değildir ve daha uzun süre üstlenmemiştir. Nilay 20 Mayıs 2026'da bedel indirimi davası açarsa satıcı zamanaşımı itirazında bulunduğunda sonuç ne olur?
    siklar:
      - "Dava reddedilir; zamanaşımı 1 Mart 2026'da dolmuştur"
      - "Dava kabul edilir; süre ayıbın öğrenildiği tarihten başlar"
      - "Dava kabul edilir; bildirim yapıldığı için zamanaşımı işlemez"
      - "Dava reddedilir; zamanaşımı 20 Nisan 2028'de dolacaktır"
    dogru: 0
    aciklama: |
      Ayıptan sorumluluğa ilişkin davalar, ayıp daha sonra ortaya çıksa bile, satılanın alıcıya devrinden başlayarak iki yıl geçmekle zamanaşımına uğrar (TBK m. 231/1). Süre 1 Mart 2024'ten işler ve 1 Mart 2026'da dolar. Bildirim yapılmış olması süreyi durdurmaz; süre ayıbın öğrenilmesinden değil devirden başlar.
  - soru: |
      Kemal, 600.000 TL'lik bir hasat makinesinin 250.000 TL'sini vadeye bırakmıştır. Teslimden dokuz ay sonra ortaya çıkan gizli bir ayıbı aynı gün noter ihtarıyla bildirmiş, dava açmamıştır. Teslimden üç yıl sonra satıcı kalan bedeli ister. Kemal ayıbı savunma olarak ileri sürebilir mi?
    siklar:
      - "Hayır; ayıptan doğan her hak iki yıl geçmekle tamamen sona erer"
      - "Hayır; ayıp yalnız dava yoluyla ileri sürülebilir"
      - "Evet; devirden itibaren iki yıl içinde bildirilen ayıptan doğan def'i hakkı, bu sürenin geçmesiyle ortadan kalkmaz"
      - "Evet; ancak yalnız satıcı ağır kusurluysa"
    dogru: 2
    aciklama: |
      Alıcının satılanın kendisine devrinden başlayarak iki yıl içinde bildirdiği ayıptan doğan def'i hakkı, bu sürenin geçmiş olmasıyla ortadan kalkmaz (TBK m. 231/1). Ağır kusur bu hakkın şartı değildir.
  - soru: |
      Mert, bir otomobili satın almış; satıcı motordaki ayıbı bildiği hâlde bile bile gizleyerek devretmiştir. Mert davayı teslimden üç yıl sonra açmaktadır. Satıcı iki yıllık zamanaşımı itirazında bulunursa hangisi doğrudur?
    siklar:
      - "İtiraz kabul edilir; davalar ne olursa olsun iki yılda zamanaşımına uğrar"
      - "Ağır kusurlu satıcı iki yıllık zamanaşımı süresinden yararlanamaz"
      - "İtiraz kabul edilir, ancak Mert tazminat isteyebilir"
      - "İtiraz kabul edilir; süre ayıbın ortaya çıktığı tarihten başlar"
    dogru: 1
    aciklama: |
      Satıcı satılanı ayıplı olarak devretmekte ağır kusurlu ise iki yıllık zamanaşımı süresinden yararlanamaz (TBK m. 231/2). Ayıbı bile bile gizleyen satıcı ağır kusurlu sayılır.
  - soru: |
      Zeynep, bir mağazadan aldığı akıllı telefonda (tüketici işlemi) ayıp bulmuştur. Zeynep ayıpsız benzeriyle değiştirme istemek istemektedir. TKHK m. 11/2'ye göre hangisi doğrudur?
    siklar:
      - "Değiştirme hakkı yalnız satıcıya karşı kullanılabilir"
      - "Üretici ve ithalatçı ayıbın doğduğu tarihi ispat etmeksizin her hâlde sorumludur"
      - "Değiştirme hakkı ancak dönme hakkı kullanıldıktan sonra istenebilir"
      - "Değiştirme (ve ücretsiz onarım) hakkı üretici veya ithalatçıya karşı da kullanılabilir; satıcı, üretici ve ithalatçı müteselsilen sorumludur"
    dogru: 3
    aciklama: |
      TKHK m. 11/2'ye göre ücretsiz onarım veya malın ayıpsız misli ile değiştirilmesi hakları üretici veya ithalatçıya karşı da kullanılabilir ve satıcı, üretici ve ithalatçı müteselsilen sorumludur. Üretici veya ithalatçı, ayıbın malı piyasaya sürmesinden sonra doğduğunu ispat ederse sorumlu tutulmaz. Haklar arasında sıra yoktur.
  - soru: |
      Tüketici olmayan Ali, bir bayiden traktör satın almış ve traktör ayıplı çıkmıştır. Ali, TBK m. 227'deki seçimlik hakları kime karşı kullanabilir?
    siklar:
      - "Satıcıya karşı; üretici sözleşmenin tarafı olmadığından ona karşı TBK'daki ayıp hükümlerine dayanılamaz"
      - "Yalnız üreticiye karşı"
      - "Satıcıya ve üreticiye karşı müteselsilen"
      - "Hem satıcıya hem ithalatçıya karşı müteselsilen"
    dogru: 0
    aciklama: |
      TBK'nın satış hükümleri satıcıyla alıcı arasındaki ilişkiyi düzenler; üreticinin ayıptan sorumluluğuna ilişkin hüküm yoktur. Yargıtay da TBK'ya tabi satışta üreticiye karşı bu hükümlerle dava açılamayacağını kabul etmiştir. TKHK m. 11/2'deki müteselsil sorumluluk tüketici işlemlerine özgüdür.
  - soru: |
      Bir tüketici, yeni inşa edilmiş bir konutu teslim almıştır. TKHK m. 12/1'e göre kanunda veya sözleşmede daha uzun süre belirlenmemişse ayıplı maldan sorumluluk, teslim tarihinden itibaren ne kadar sürede zamanaşımına uğrar?
    siklar:
      - "İki yıl"
      - "Üç yıl"
      - "Beş yıl"
      - "On yıl"
    dogru: 2
    aciklama: |
      TKHK m. 12/1'e göre konut veya tatil amaçlı taşınmaz mallarda ayıplı maldan sorumluluk için zamanaşımı süresi, taşınmazın teslim tarihinden itibaren **beş yıldır**. Diğer mallarda iki yıldır.

olaylar:
  - olay: |
      Ayşe, 3 Mart 2025'te komşusu Mehmet'ten (ikisi de tacir değil, işlem tüketici işlemi de değil) ikinci el bir motosikleti 150.000 TL'ye satın alır; bedelin tamamını öder ve motosikleti aynı gün teslim alır. Motosikletin ayıpsız değeri 200.000 TL'dir. 20 Mart 2025'te şasede gözle görülmeyen bir çatlak ortaya çıkar; bu hâliyle motosikletin değeri 120.000 TL'dir. Ayşe durumu aynı gün noter aracılığıyla Mehmet'e bildirir. Mehmet ayıbı bilmediğini söylemektedir.

      Ayşe motosikleti kullanmaya devam etmek istemekte, ancak bedelden indirim istemektedir. Ayrıca motosikletin arızası yüzünden yedek ulaşım için taksi ve benzeri ödemeler yaptığını ve bunların bedelinin de Mehmet'ten tahsilini istemektedir. Mehmet kusursuz olduğunu ileri sürmektedir. Ayrıca Mehmet, Ayşe'ye ayıpsız bir benzerini vermeyi ve Ayşe'nin uğradığı zararın tamamını karşılamayı önermiştir.

      1. Ayşe'nin hangi seçimlik hakları vardır? Mehmet'in ayıbı bilmemesi sonucu değiştirir mi?
      2. Ayşe bedel indirimi isterse indirim tutarı ne olur?
      3. Ayşe seçimlik hak yanında zararını da isteyebilir mi? Mehmet'in kusursuzluğu hangi sonucu doğurur?
      4. Mehmet, ayıpsız benzerini hemen verip zararın tamamını giderirse Ayşe'nin hakları ne olur?
    olcut:
      - {tespit: "Ayıp nedeniyle alıcının dört seçimlik hakkının sayılması (dönme, bedel indirimi, ücretsiz onarım, değiştirme); seçimlik hakların satıcının ayıbı bilmesine bağlı olmaması", puan: 20, madde: "TBK m. 227"}
      - {tespit: "Satıcının ayıbı bilmese de sorumlu olması", puan: 10, madde: "TBK m. 219"}
      - {tespit: "Bildirimin süresinde yapılmış olması; alıcının satılanı kabul etmiş sayılmaması", puan: 10, madde: "TBK m. 223"}
      - {tespit: "Bedel indirimi için oransal yöntem: 150.000 × 120.000/200.000 = 90.000 TL ödenecek bedel, indirim 60.000 TL", puan: 20, madde: "TBK m. 227/1"}
      - {tespit: "Tazminat hakkının saklı olması ve seçimlik haklara ek olarak istenebilmesi", puan: 15, madde: "TBK m. 227/2"}
      - {tespit: "Tazminatta kusur karinesi; Mehmet kusursuzluğunu ispat ederse tazminat yükümlülüğünden kurtulur, seçimlik hak sorumluluğu devam eder", puan: 10, madde: "TBK m. 112"}
      - {tespit: "Satıcının ayıpsız benzerini hemen verip zararın tamamını gidermesi hâlinde seçimlik hakların kullanılmasının önlenmesi", puan: 15, madde: "TBK m. 227/3"}
    cozum: |
      **Nitelendirme:** Ayşe ile Mehmet arasında taşınır satışı vardır. Taraflar tacir olmadığından ve satış tüketici işlemi sayılmadığından TBK'nın satış hükümleri uygulanır. Motosiklet teslim anında mevcut bir gizli ayıp taşımaktadır.

      **Hukuki sorunlar:** (1) Ayşe'nin seçimlik hakları ve Mehmet'in ayıbı bilmemesinin etkisi; (2) bedel indirimi tutarının hesabı; (3) tazminat; (4) satıcının hakları önleme yetkisi.

      **İlgili hükümler:** TBK m. 219/2, TBK m. 223, TBK m. 227/1-3, TBK m. 112.

      **Değerlendirme:**

      *1. Seçimlik haklar:* Satıcı ayıbı bilmese bile ayıptan sorumludur (TBK m. 219/2); bu nedenle Mehmet'in "bilmiyordum" savunması sorumluluğu kaldırmaz. Ayşe, gizli ayıp ortaya çıktığı gün bildirimi yaptığından TBK m. 223 külfetini yerine getirmiştir; motosikleti kabul etmiş sayılmaz. TBK m. 227/1'e göre Ayşe, satılanı geri vermeye hazır olduğunu bildirerek dönme, satılanı alıkoyup ayıp oranında bedel indirimi, aşırı masraf gerektirmiyorsa ücretsiz onarım veya imkân varsa ayıpsız benzeriyle değiştirme haklarından birini seçebilir. Ayşe motosikleti kullanmaya devam etmek istediğinden bedel indirimini seçer.

      *2. İndirim tutarı:* İndirim ayıp oranında yapılır. Ayıplı değerin ayıpsız değere oranı 120.000 ÷ 200.000 = 3/5'tir. Ayşe'nin ödemesi gereken bedel 150.000 × 3/5 = 90.000 TL'dir; indirim tutarı 150.000 − 90.000 = 60.000 TL olur. Değer farkı olan 80.000 TL (200.000 − 120.000) indirilmez; çünkü Ayşe motosikleti ayıpsız değerinin altında bir bedelle satın almıştır. Değer eksikliği bedele çok yakın olmadığından TBK m. 227/5 devreye girmez.

      *3. Tazminat:* TBK m. 227/2'ye göre genel hükümlere göre tazminat isteme hakkı saklıdır; Ayşe bedel indirimi yanında zararını da isteyebilir. Tazminatta TBK m. 112'ye göre Mehmet kendisine hiçbir kusur yüklenemeyeceğini ispatlarsa tazminat borcundan kurtulur. Kusursuzluğun ispatı yalnız tazminatı etkiler; bedel indirimi gibi seçimlik haklar satıcının kusuruna bağlı olmadığından devam eder.

      *4. Önleme yetkisi:* Mehmet aynı malın ayıpsız bir benzerini hemen verir ve Ayşe'nin uğradığı zararın tamamını giderirse TBK m. 227/3'e göre Ayşe'nin seçimlik haklarını kullanmasını önlemiş olur. İki şart birliktedir; hemen verme ya da zararın tamamının giderilmesinden biri eksikse Ayşe'nin hakları açık kalır.

      **Sonuç:**
      - Ayşe dört seçimlik haktan birini kullanabilir; Mehmet'in ayıbı bilmemesi sorumluluğu kaldırmaz.
      - Bedel indirimi 60.000 TL'dir (ödenecek bedel 90.000 TL).
      - Tazminat hakkı saklıdır; Mehmet kusursuzluğunu ispat ederse tazminat ödemez, ancak seçimlik hak sorumluluğu sürer.
      - Mehmet ayıpsız benzerini hemen verip zararın tamamını giderirse Ayşe'nin seçimlik hakları önlenmiş olur.

  - olay: |
      Mehmet, 10 Ocak 2025'te Ali'den (ikisi de tacir değil, işlem tüketici işlemi de değil) kullanılmış bir otomobili 296.000 TL'ye ve aynı sözleşmede ayrı bedel (4.000 TL) gösterilen yedek lastik ve kriko setini satın alır; toplam 300.000 TL'yi öder ve her ikisini teslim alır. Satış için noter masrafı olarak 5.000 TL öder. Teslimden yirmi gün sonra motor bloğunda çatlak ortaya çıkar; araç güvenle kullanılamamakta ve onarımı aracın değerinin yarısını aşmaktadır. Mehmet ayıbı hemen Ali'ye bildirir, aracı ve seti geri vermeye hazır olduğunu belirterek sözleşmeden döndüğünü açıklar.

      Mehmet, araç çalışmadığı için bir üçüncü kişiyle yaptığı nakliye sözleşmesini ifa edememiş ve 60.000 TL kâr kaybına uğramıştır. Ali, ayıbı bilmediğini ve ayıbın usta bir servis tarafından bile tespit edilemeyeceğini ispat ederek kendisine hiçbir kusur yüklenemeyeceğini kanıtlamıştır. Ali ayrıca "Araç sonuçta yürüyor, hâkim dönmeyi kabul etmez" demektedir.

      1. Mehmet sözleşmeden dönebilir mi? Taraflar birbirine neyi geri verir?
      2. Mehmet Ali'den hangi kalemleri isteyebilir?
      3. 60.000 TL kâr kaybı bakımından Ali sorumlu mudur?
      4. Yalnız yedek lastik ve kriko setinde ayıp çıkmış olsaydı dönme neleri kapsardı?
      5. Ali'nin "hâkim dönmeyi kabul etmez" savunmasını TBK m. 227/4 bakımından değerlendiriniz.
    olcut:
      - {tespit: "Ayıbın ortaya çıkması üzerine alıcının geri vermeye hazır olduğunu bildirerek sözleşmeden dönebilmesi", puan: 15, madde: "TBK m. 227/1"}
      - {tespit: "Dönen alıcının satılanı elde ettiği yararlarla birlikte geri vermesi", puan: 10, madde: "TBK m. 229/1"}
      - {tespit: "Ödenen satış bedelinin faiziyle birlikte geri istenebilmesi", puan: 15, madde: "TBK m. 229/1"}
      - {tespit: "Satılan için yapılan giderlerin (noter masrafı) istenebilmesi", puan: 10, madde: "TBK m. 229/1"}
      - {tespit: "Kâr kaybının diğer zarar niteliği ve satıcının kusursuzluğunu ispat etmesi nedeniyle sorumlu olmaması", puan: 20, madde: "TBK m. 229/2"}
      - {tespit: "Asıl şeyden dönmenin eklentiyi kapsaması; ayrı bedel yazılmasının sonucu değiştirmemesi", puan: 10, madde: "TBK m. 230/2"}
      - {tespit: "Eklenti için dönmenin asıl şeyi kapsamaması", puan: 10, madde: "TBK m. 230/2"}
      - {tespit: "Dönmenin haklı olması nedeniyle hâkimin dönme yerine onarım veya indirime gitmesinin söz konusu olmaması; bu yetkinin yalnız onarım veya indirimle sınırlı olması", puan: 10, madde: "TBK m. 227/4"}
    cozum: |
      **Nitelendirme:** Mehmet ile Ali arasında taşınır satışı vardır; taraflar tacir olmadığı için TBK hükümleri uygulanır. Araçtaki gizli motor ayıbı Mehmet'in seçimlik haklarını doğurmuştur. Yedek lastik ve kriko seti, aracın eklentisi niteliğindedir.

      **Hukuki sorunlar:** (1) Dönmenin şartları ve iade; (2) dönmede istenebilecek kalemler; (3) kâr kaybı; (4) eklenti ve asıl şey ilişkisi; (5) hâkimin dönme yerine başka bir yola gitme yetkisi.

      **İlgili hükümler:** TBK m. 227/1, TBK m. 227/4, TBK m. 229/1-2, TBK m. 230/2.

      **Değerlendirme:**

      *1. Dönme ve iade:* Mehmet ayıbı hemen bildirdiğinden ve satılanı geri vermeye hazır olduğunu açıkladığından TBK m. 227/1'e göre sözleşmeden dönebilir. Dönen alıcı satılanı, ondan elde ettiği yararlarla birlikte satıcıya geri vermekle yükümlüdür (TBK m. 229/1); Mehmet otomobili ve seti iade eder.

      *2. İstenebilecek kalemler:* TBK m. 229/1'e göre Mehmet ödediği satış bedelinin (300.000 TL) faiziyle birlikte geri verilmesini ve satılan için yaptığı giderlerin, yani 5.000 TL noter masrafının ödenmesini isteyebilir. Ayıplı maldan doğan doğrudan zararını da isteyebilir. Bu kalemlerde satıcının kusursuzluğunu ispatı sonucu değiştirmez.

      *3. Kâr kaybı:* Mehmet'in üçüncü kişiyle yaptığı nakliye sözleşmesini ifa edememesinden doğan 60.000 TL kâr kaybı, ayıplı malın kendisinden doğan zarar değildir; TBK m. 229/2'deki **diğer zararlar** kapsamındadır. Satıcı kendisine hiçbir kusur yüklenemeyeceğini ispat etmedikçe bunları da giderir. Ali, ayıbın servis tarafından bile tespit edilemeyeceğini ispat ederek kusursuzluğunu kanıtlamıştır. Bu nedenle 60.000 TL'den sorumlu olmaz. Bu sonuç doğrudan zarar kalemlerini ve bedel iadesini etkilemez.

      *4. Eklenti:* Satılanın aslı için dönülmesi, eklentileri ayrı satış bedeli gösterilerek satılmış olsalar bile kapsar (TBK m. 230/2). Mehmet, 4.000 TL ayrı bedelli seti ayrıca dönme beyanına gerek kalmadan iade eder. Ayıp yalnız sette olsaydı, eklenti için dönme satılanın aslını kapsamayacağından Mehmet yalnız set için dönebilir, otomobil kendisinde kalırdı.

      *5. Hâkimin yetkisi:* Alıcı dönmeyi kullanmış ve durum dönmeyi haklı göstermiyorsa hâkim, satılanın onarılmasına veya bedelin indirilmesine karar verebilir (TBK m. 227/4). Burada motor bloğundaki çatlak aracı güvenle kullanılamaz hâle getirmekte ve onarımı aracın değerinin yarısını aşmaktadır; durum dönmeyi haklı göstermektedir. Bu nedenle TBK m. 227/4 devreye girmez ve Ali'nin savunması yerinde değildir. Dönme haklı olmasaydı bile hâkim bu fıkra uyarınca ancak onarım veya indirime karar verebilir, kendiliğinden ayıpsız benzeriyle değişime hükmedemezdi.

      **Sonuç:**
      - Mehmet dönebilir; otomobil ve set yararlarıyla iade edilir.
      - Mehmet 300.000 TL'yi faiziyle ve 5.000 TL noter masrafını isteyebilir.
      - Ali, kusursuzluğunu ispat ettiği için 60.000 TL kâr kaybından sorumlu değildir.
      - Asıl şeyden dönmek seti kapsar; eklentiden dönmek asıl şeyi kapsamazdı.
      - Dönme haklıdır; hâkim dönme yerine onarım veya indirime gitmez.

  - olay: |
      Hasan, 8 Eylül 2023'te Burak'a (ikisi de tacir değil, işlem tüketici işlemi de değil) ikinci el bir hasat makinesini 600.000 TL'ye satar ve teslim eder. Burak bedelin 350.000 TL'sini peşin öder; kalan 250.000 TL'yi 15 Kasım 2025'te ödeyecektir. 20 Haziran 2024'te makinede gizli bir şanzıman ayıbı ortaya çıkar ve Burak ayıbı 21 Haziran 2024'te noter aracılığıyla Hasan'a bildirir. Burak dava açmaz.

      Hasan, 3 Aralık 2025'te kalan 250.000 TL'nin ödenmesi için dava açar. Burak ayıp savunmasında bulunur. Burak ayrıca bedel indirimi istemiyle dava açmak istemektedir. Hasan, iki yıllık zamanaşımı süresinin dolduğunu ileri sürmektedir.

      Burak'ın avukatı, olay yeniden kurgulanırsa iki ihtimali sormaktadır: (a) Hasan ayıbı bilerek gizlemişse; (b) sözleşmede Hasan'ın ayıplara karşı üç yıl sorumlu olacağı yazılmışsa.

      1. Hasan'ın bedel davasına karşı Burak ayıp savunmasını ileri sürebilir mi?
      2. Burak'ın 3 Aralık 2025'te açacağı bedel indirimi davası bakımından zamanaşımı itirazı sonucu ne olur?
      3. (a) ihtimalinde sonuç ne olur?
      4. (b) ihtimalinde sonuç ne olur?
    olcut:
      - {tespit: "Zamanaşımı süresinin satılanın devrinden (teslim: 8 Eylül 2023) başlayarak iki yıl olması; bu sürenin 8 Eylül 2025'te dolması", puan: 20, madde: "TBK m. 231/1"}
      - {tespit: "Burak'ın ayıbı iki yıl içinde bildirmiş olması ve ayıptan doğan def'i hakkının süre geçmiş olsa da ortadan kalkmaması", puan: 25, madde: "TBK m. 231/1"}
      - {tespit: "Bedel indirimi davasının iki yıllık süre geçtikten sonra açılması nedeniyle zamanaşımına uğraması; bildirimin süreyi durdurmaması", puan: 20, madde: "TBK m. 231/1"}
      - {tespit: "Satıcının ağır kusurlu olması hâlinde iki yıllık zamanaşımı süresinden yararlanamaması", puan: 15, madde: "TBK m. 231/2"}
      - {tespit: "Satıcının daha uzun süre üstlenmesi hâlinde sürenin üç yıl olması; 3 Aralık 2025'te sürenin dolmamış olması", puan: 15, madde: "TBK m. 231/1"}
      - {tespit: "Ağır kusurlu satıcının bildirimin geç yapıldığını ileri sürememesi", puan: 5, madde: "TBK m. 225"}
    cozum: |
      **Nitelendirme:** Taşınır satışı vardır; tarafların tacir olmaması ve işlemin tüketici işlemi sayılmaması nedeniyle TBK uygulanır. Burak'ın ayıp bildirimi, devirden yaklaşık dokuz ay sonra ve iki yıllık süre dolmadan yapılmıştır.

      **Hukuki sorunlar:** (1) Ayıptan sorumluluk davalarının zamanaşımı süresi ve başlangıcı; (2) bedeli ödenmemiş alıcının ayıp def'i; (3) süre geçmiş bedel indirimi davası; (4) ağır kusurun etkisi; (5) satıcının daha uzun süre üstlenmesi.

      **İlgili hükümler:** TBK m. 231/1-2, TBK m. 225, TBK m. 223.

      **Değerlendirme:**

      *1. Def'i:* Ayıptan sorumluluğa ilişkin her türlü dava, satılanın alıcıya devrinden başlayarak iki yıl geçmekle zamanaşımına uğrar (TBK m. 231/1). Teslim 8 Eylül 2023'te yapıldığından süre 8 Eylül 2025'te dolmuştur. Ancak alıcının satılanın kendisine devrinden başlayarak iki yıl içinde bildirdiği ayıptan doğan def'i hakkı, bu sürenin geçmesiyle ortadan kalkmaz. Burak ayıbı 21 Haziran 2024'te, yani iki yıl dolmadan, bildirdiğinden Hasan'ın 3 Aralık 2025'te açtığı bedel davasına karşı ayıp savunmasını ileri sürebilir.

      *2. Bedel indirimi davası:* Burak'ın bedel indirimi için açacağı dava, ayıptan sorumluluğa ilişkin bir davadır ve süre ayıbın öğrenildiği tarihten değil devirden işler. Bildirim yapılmış olması da süreyi durdurmaz. 3 Aralık 2025'te süre dolmuş olduğundan Hasan zamanaşımı itirazında bulunursa Burak'ın bedel indirimi davası reddedilir. Bu, Burak'ın ayıbı savunma olarak ileri sürme imkânını ortadan kaldırmaz; ondan ayrı değerlendirilir.

      *3. Ağır kusur (a):* Satıcı satılanı ayıplı devretmekte ağır kusurlu ise iki yıllık zamanaşımı süresinden yararlanamaz (TBK m. 231/2). Ayıbı bilerek gizleyen Hasan ağır kusurludur; baskın görüşe göre bu durumda genel zamanaşımı süresi olan on yıl (TBK m. 146) uygulanır ve Burak'ın davası zamanaşımına uğramamış olur. Hasan ayrıca ağır kusurlu olduğundan bildirimin gecikmiş olduğunu da ileri süremez (TBK m. 225); olayda bildirim zaten süresindedir.

      *4. Uzun süre üstlenme (b):* Satıcı daha uzun bir süre için üstlenmişse iki yıllık süre uygulanmaz (TBK m. 231/1). Sözleşmede Hasan'ın ayıplara karşı üç yıl sorumlu olacağı yazılmışsa süre 8 Eylül 2026'ya kadar işler; 3 Aralık 2025'te açılan bedel indirimi davası zamanaşımına uğramamıştır.

      **Sonuç:**
      - Burak, süresinde bildirdiği ayıbı Hasan'ın bedel davasına karşı savunma olarak ileri sürebilir.
      - Burak'ın 3 Aralık 2025'teki bedel indirimi davası, iki yıllık süre dolduğundan zamanaşımına uğrar.
      - Hasan ayıbı bilerek gizlemişse iki yıllık süreden yararlanamaz.
      - Hasan üç yıl sorumluluk üstlenmişse dava süresi içindedir.

kartlar:
  - on: "TBK m. 227/1'e göre alıcının dört seçimlik hakkı nedir?"
    arka: "Sözleşmeden dönme, ayıp oranında bedel indirimi, aşırı masraf gerektirmiyorsa ücretsiz onarım ve imkân varsa ayıpsız benzeriyle değiştirme. Alıcı birini kullanır (TBK m. 227/1)."
  - on: "Bedel indirimi nasıl hesaplanır?"
    arka: "Oransaldır: İndirim = bedel × (ayıpsız değer − ayıplı değer) ÷ ayıpsız değer. Değer farkının kendisi indirilmez (TBK m. 227/1)."
  - on: "Alıcı seçimlik hakla birlikte tazminat da isteyebilir mi?"
    arka: "Evet. Genel hükümlere göre tazminat isteme hakkı saklıdır; kusur bakımından TBK m. 112 işler (TBK m. 227/2)."
  - on: "Satıcı seçimlik hakların kullanılmasını nasıl önler?"
    arka: "Aynı malın ayıpsız benzerini hemen vererek ve zararın tamamını gidererek. İki şart birliktedir (TBK m. 227/3)."
  - on: "Alıcı dönmüş ama dönme haklı değilse hâkim ne yapabilir?"
    arka: "Yalnız onarıma veya bedel indirimine karar verebilir. Kendiliğinden değişime hükmedemez (TBK m. 227/4)."
  - on: "Değer eksikliği bedele çok yakınsa alıcının hakkı nedir?"
    arka: "Ancak dönme veya ayıpsız benzeriyle değiştirme isteyebilir; indirim ve onarım kapanır (TBK m. 227/5)."
  - on: "Satılanın ayıptan, beklenmedik hâlden veya mücbir sebepten yok olması dönmeyi engeller mi?"
    arka: "Hayır. Alıcı dönebilir ve elinde ne kalmışsa onu geri verir (TBK m. 228/1)."
  - on: "Hangi hâllerde alıcı yalnız bedel indirimi isteyebilir (TBK m. 228/2)?"
    arka: "Satılan alıcıya yüklenebilen sebeple yok olmuşsa, alıcı onu devretmişse veya biçimini değiştirmişse."
  - on: "Dönen alıcı satıcıya neyi geri verir?"
    arka: "Satılanı, ondan elde ettiği yararlarla birlikte (TBK m. 229/1)."
  - on: "Dönen alıcı satıcıdan neleri isteyebilir?"
    arka: "Bedeli faiziyle, yargılama giderleri ile satılan için yaptığı giderleri ve ayıplı maldan doğan doğrudan zararı (TBK m. 229/1)."
  - on: "Diğer zararlarda satıcı nasıl kurtulur?"
    arka: "Kendisine hiçbir kusur yüklenemeyeceğini ispat ederek (TBK m. 229/2)."
  - on: "Birden çok malda bazıları ayıplı çıkarsa dönme neyi kapsar?"
    arka: "Kural olarak yalnız ayıplı olanları; ayırmak alıcıya veya satıcıya önemli zarar veriyorsa tamamını (TBK m. 230/1)."
  - on: "Asıl şeyden dönmek eklentiyi kapsar mı? Tersi?"
    arka: "Asıl şeyden dönmek eklentiyi kapsar (ayrı bedel olsa da); eklentiden dönmek asıl şeyi kapsamaz (TBK m. 230/2)."
  - on: "Ayıba bağlı davalarda zamanaşımı süresi ve başlangıcı nedir?"
    arka: "Satılanın alıcıya devrinden başlayarak iki yıl; ayıp sonradan ortaya çıksa da süre devirden işler (TBK m. 231/1)."
  - on: "Süresi geçmiş olsa da kalkmayan hak hangisidir?"
    arka: "Satılanın devrinden başlayarak iki yıl içinde bildirilen ayıptan doğan def'i hakkı (TBK m. 231/1)."
  - on: "Ağır kusurlu satıcı için zamanaşımı nasıl işler?"
    arka: "İki yıllık zamanaşımı süresinden yararlanamaz (TBK m. 231/2)."
  - on: "Yapı ayıbı davalarında zamanaşımı süresi nedir?"
    arka: "Mülkiyetin geçmesinden başlayarak beş yıl; satıcının ağır kusuru varsa yirmi yıl (TBK m. 244/3)."
  - on: "TKHK'da onarım ve değiştirme kimlere karşı istenebilir?"
    arka: "Satıcıya, üreticiye ve ithalatçıya karşı; hepsi müteselsil sorumludur (TKHK m. 11/2)."
  - on: "TKHK'da onarım veya değiştirme için azami süre nedir?"
    arka: "Otuz iş günü; konut ve tatil amaçlı taşınmazlarda altmış iş günü. Yönetmelik eki listedeki mallarda onarım, yönetmelikteki azami tamir süresi içinde yapılır (TKHK m. 11/4)."
  - on: "Tüketici satışında ayıplı maldan sorumluluğun zamanaşımı nedir?"
    arka: "Teslimden itibaren iki yıl; konut ve tatil amaçlı taşınmazda beş yıl. Ağır kusur ya da hile varsa zamanaşımı hükümleri uygulanmaz (TKHK m. 12)."
