    tanim: "Niteliği gereği geçici kullanıma ayrılmış taşınmaz (yazlık gibi). Altı ay ve daha kısa kiralanırsa özel hükümler uygulanmaz (TBK m. 339/1)."
  - terim: Kirayla bağlantılı sözleşme
    tanim: "Kiracının yararı olmaksızın, kullanımla ilgisiz bir borç doğuran ve kiranın kurulmasına ya da sürmesine bağlanan sözleşme. Geçersizdir (TBK m. 340)."
  - terim: Güvence (depozito)
    tanim: "Kiracının sözleşme sonunda doğabilecek zararlara karşı verdiği para ya da kıymetli evrak. En çok üç aylık kira bedeli olabilir (TBK m. 342)."
  - terim: Vadeli tasarruf hesabı
    tanim: "Güvence parasının, kiraya verenin onayı olmadan çekilmemek üzere yatırıldığı banka hesabı (TBK m. 342/2)."
  - terim: Muacceliyet kaydı
    tanim: "Bir kira ödenmezse sonraki kiraların da muaccel olacağını öngören kayıt. Geçersizdir (TBK m. 346)."
  - terim: Ceza koşulu
    tanim: "Kira bedelinin zamanında ödenmemesi hâlinde ödenecek cezai bedel. Konut ve çatılı işyerinde geçersizdir (TBK m. 346)."
  - terim: TÜFE oniki aylık ortalama
    tanim: "Tüketici fiyat endeksindeki oniki aylık ortalamalara göre değişim oranı. Yenilenen dönemde kira artışının üst sınırıdır (TBK m. 344)."
  - terim: Yenilenen kira dönemi
    tanim: "İlk kira yılından sonraki kira dönemi. Artış sınırı bu dönemlere uygulanır (TBK m. 344)."
  - terim: Kira tespit davası
    tanim: "Yeni dönem kira bedelinin mahkemece belirlenmesi davası. Her zaman açılabilir; etkisi TBK m. 345'e bağlıdır."
  - terim: Hak ve nesafet
    tanim: "Kira tespitinde hâkimin emsal kirayı ve tarafların durumunu gözeterek belirlediği makul bedel ölçüsü."
  - terim: Emsal kira bedeli
    tanim: "Benzer nitelikteki kiralananların kira bedeli. Beş yıl sonrası belirlemede ölçüttür (TBK m. 344/3)."
kararlar:
  - id: "660674700"
    ozet: |
      Kiraya verenler, 1 Şubat 2011 - 1 Şubat 2016 arası sözleşmeyle aylık 4.500 TL'ye kiraya verdikleri taşınmazın kira bedelinin 17 Şubat 2014'ten itibaren aylık 8.000 TL olarak tespitini istemiş; sonra bilirkişi raporu doğrultusunda ıslah dilekçesiyle talebi brüt 9.200 TL'ye çıkarmıştır. İlk derece mahkemesi brüt 8.750 TL'ye hükmetmiş, Özel Daire, kira tespit davasında ıslah yolunun kapalı olduğunu ve hükmün dava dilekçesindeki 8.000 TL üzerinden kurulması gerektiğini belirterek bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu direnme kararını oybirliğiyle bozmuştur. Gerekçeye göre kira tespit davası kendine özgüdür, kamu düzeniyle ilgilidir, inşai nitelikli kararlara yakındır; hâkim ileriye yönelik bir kira yılının bedelini belirler. Talep bölünemez, fazlaya ilişkin haklar saklı tutulamaz ve ıslahla artırılamaz; ıslahla artırım daha sonraki bir dönemi de kapsar gibi olur. Konuya katkısı: kira tespit davasının niteliğini ve ıslah yasağını gösterir.
  - id: "1092674400"
    ozet: |
      İdare, 2008 tarihli otuz yıllık kira sözleşmesinde 2018'den itibaren uygulanacak artış oranı konusunda kiracıyla anlaşamamış, uyuşmazlık tahkime götürülmüş ve hakem heyeti 25 Kasım 2022'de artışın ÜFE oniki aylık ortalaması oranında yapılması gerektiğini belirterek kiracıya fazla ödenen 1.394.070,24 TL'nin iadesine karar vermiştir. İdare hakem kararının iptalini istemiş, Bölge Adliye Mahkemesi davayı reddetmiştir. Yargıtay 3. Hukuk Dairesi oybirliğiyle bozmuştur. Gerekçeye göre konut ve çatılı işyeri kiralarında TBK m. 344'teki artış sınırı emredicidir: Sözleşmedeki oran 1 Ocak 2019 öncesi için ÜFE, sonrası için TÜFE sınırını aşamaz, aşarsa kanundaki oran uygulanır. Bu kiralarda kira tespiti uyuşmazlıkları tahkime elverişli değildir; adi kira ve ürün kirasında ise artış tarafların iradesine bağlıdır. Bölge Adliye Mahkemesi kira türünü ve niteliğini araştırmadığından karar bozulmuştur. Konuya katkısı: artış sınırının emredici niteliğini ve kira türü belirlemenin önemini gösterir.
sorular:
  - soru: |
      Hakan, Bodrum'daki yazlık villayı Temmuz-Ekim arası dört aylığına turistik kullanım için kiralamıştır. Konut ve çatılı işyeri kiralarına ilişkin hükümler bu kiraya uygulanır mı?
    siklar:
      - "Uygulanır, çünkü her konut kirası bu hükümlere tabidir"
      - "Uygulanmaz, çünkü taşınmaz niteliği gereği geçici kullanıma özgülenmiştir ve süre altı ayı geçmez"
      - "Uygulanmaz, çünkü kira süresi altı aydan kısa olan her kira bu hükümlerin dışındadır"
      - "Uygulanır, çünkü istisna yalnız çatısız taşınmazları kapsar"
    dogru: 1
    aciklama: |
      Konut ve çatılı işyeri hükümleri, niteliği gereği geçici kullanıma özgülenmiş taşınmazların altı ay ve daha kısa süreyle kiralanmasında uygulanmaz (TBK m. 339/1). İki şart birlikte aranır; yalnız kısa süre istisna için yetmez.

  - soru: |
      Ali, dairesini kiraya verirken Veli'nin her ay kendi kardeşinin şirketinden 3.000 TL'lik hizmet satın almasını kiranın sürdürülmesi için şart koşmuştur. Hizmetin dairenin kullanımıyla ilgisi ve Veli'ye yararı yoktur. Veli her iki sözleşmeyi de imzalamıştır. Hukuki durum nedir?
    siklar:
      - "Kirayla bağlantılı hizmet sözleşmesi geçersizdir; kira sözleşmesi geçerli kalır"
      - "Kira sözleşmesi de geçersizdir"
      - "İki sözleşme de geçerlidir, çünkü Veli imzalamıştır"
      - "Hizmet sözleşmesi geçerlidir, ama bedeli yarıya iner"
    dogru: 0
    aciklama: |
      Konut ve çatılı işyeri kiralarında kira ilişkisinin kurulması ya da sürdürülmesi, kiracının yararı olmaksızın, kullanımla doğrudan ilişkisi olmayan bir borca bağlanmışsa kirayla bağlantılı sözleşme geçersizdir (TBK m. 340). Geçersizlik bağlantılı sözleşmeye ilişkindir; kira sözleşmesi kiracıyı koruma amacıyla ayakta kalır.

  - soru: |
      Konut kirasında aylık kira 25.000 TL'dir. Sözleşmede kiracının dört aylık kira karşılığı 100.000 TL güvence vermesi kararlaştırılmıştır. Hangisi doğrudur?
    siklar:
      - "Güvence, üç aylık kira bedeli olan 75.000 TL'yi aşamaz; fazlası geçerli olmaz"
      - "Güvence altı aylık kira bedeline kadar serbestçe kararlaştırılabilir"
      - "Güvence sınırı yalnız kıymetli evrak için vardır, para için sınır yoktur"
      - "Güvence yalnız kiraya verenin hesabında tutulabilir"
    dogru: 0
    aciklama: |
      Güvence üç aylık kira bedelini aşamaz (TBK m. 342/1). Para güvenceyse kiracı tarafından, kiraya verenin onayı olmaksızın çekilmemek üzere vadeli tasarruf hesabına yatırılır (TBK m. 342/2); kiraya verenin hesabında tutulmaz.

  - soru: |
      Konut kirası 31 Mart'ta sona ermiş, kiracı daireyi hasarsız teslim etmiştir. Güvence vadeli tasarruf hesabındadır. Kiraya veren sona ermeyi izleyen üç ay boyunca bankaya hiçbir dava ya da takip bildirimi yapmamıştır. Kiracı bankadan güvenceyi istemektedir. Banka ne yapmalıdır?
    siklar:
      - "Banka, ancak kiraya verenin onayıyla ödeme yapabilir"
      - "Banka kiracının istemi üzerine güvenceyi geri vermekle yükümlüdür"
      - "Banka güvenceyi ancak kesinleşmiş mahkeme kararıyla geri verebilir"
      - "Banka güvenceyi iki yıl sonra geri verir"
    dogru: 1
    aciklama: |
      Kiraya veren, sona ermeyi izleyen üç ay içinde kiracıya karşı kira sözleşmesiyle ilgili dava açtığını ya da icra veya iflas takibine giriştiğini bankaya yazılı olarak bildirmemişse banka, kiracının istemi üzerine güvenceyi geri vermekle yükümlüdür (TBK m. 342/3). Rıza, takip veya mahkeme kararı yolları bildirim yapılan hâllerde işler.

  - soru: |
      Çatılı dükkânın ilk yıl kirası 30.000 TL'dir. Sözleşme, yenilenen dönemde kiranın %90 artırılacağını öngörmektedir. Önceki kira yılında TÜFE oniki aylık ortalamalara göre değişim oranı %50'dir. Yenilenen dönemde geçerli kira bedeli en çok ne kadardır?
    siklar:
      - "57.000 TL"
      - "30.000 TL"
      - "45.000 TL"
      - "36.000 TL"
    dogru: 2
    aciklama: |
      Tarafların yenilenen dönemde uygulanacak bedele ilişkin anlaşması, önceki kira yılının TÜFE oniki aylık ortalamalara göre değişim oranını geçmemek koşuluyla geçerlidir (TBK m. 344/1). Sınır emredicidir. Sözleşmedeki %90 yerine %50 uygulanır: 30.000 x 1,50 = 45.000 TL.

  - soru: |
      Konut kirası, 1 Mart 2023'te yenilenmektedir. Önceki kira yılı bedeli 10.000 TL, önceki kira yılının TÜFE oniki aylık ortalamalara göre değişim oranı %64'tür. Sözleşme %100 artış öngörmektedir. TBK'nın geçici 1. maddesine göre bu dönem için geçerli en yüksek kira bedeli nedir?
    siklar:
      - "20.000 TL"
      - "16.400 TL"
      - "15.000 TL"
      - "12.500 TL"
    dogru: 3
    aciklama: |
      TBK'nın geçici 1. maddesi, konut kiralarında maddenin yürürlüğe girdiği tarih ile 1 Temmuz 2023 (bu tarih dahil) arasında yenilenen dönemlerde artışı önceki kira yılı bedelinin %25'iyle sınırlar; TÜFE oranı %25'in altındaysa o oran geçerlidir. Bu olayda TÜFE %64 olduğundan sınır %25'tir: 10.000 x 1,25 = 12.500 TL. Bu sınır 1 Temmuz 2024'ten sonra yenilenen dönemlere uygulanmaz.

  - soru: |
      Beş yıldan sonra yenilenen bir çatılı işyeri kirasında yeni kira yılının bedelini hâkim hangi ölçütlere göre belirler?
    siklar:
      - "Yalnız taraf anlaşması bağlayıcıdır, hâkim belirleme yapamaz"
      - "Yalnız TÜFE oranına göre; emsal kira dikkate alınmaz"
      - "Yalnız emsal kira bedeline göre; TÜFE dikkate alınmaz"
      - "TÜFE oniki aylık ortalama değişim oranı, kiralananın durumu ve emsal kira bedelleri göz önünde tutularak hakkaniyete uygun biçimde"
    dogru: 3
    aciklama: |
      Beş yıldan uzun süreli veya beş yıldan sonra yenilenen sözleşmelerde ve bundan sonraki her beş yılın sonunda, anlaşma yapılıp yapılmadığına bakılmaksızın, hâkim TÜFE oranı, kiralananın durumu ve emsal kira bedellerini göz önünde tutarak hakkaniyete uygun biçimde yeni bedeli belirler (TBK m. 344/3).

  - soru: |
      Taraflar kira bedelini yabancı para olarak kararlaştırmış (1567 sayılı Kanun hükümleri saklıdır) ve kira ilişkisinin ikinci yılındadır. Kiraya veren bedeli artırmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Bedel her yıl TÜFE oranında artırılabilir"
      - "Beş yıl geçmedikçe bedelde değişiklik yapılamaz; TBK m. 138 saklıdır"
      - "Hâkim altı ayda bir bedeli yeniden belirler"
      - "Yabancı para kiraları TBK m. 344'ün dışındadır ve artış serbesttir"
    dogru: 1
    aciklama: |
      Sözleşmede kira bedeli yabancı para olarak kararlaştırılmışsa beş yıl geçmedikçe kira bedelinde değişiklik yapılamaz; ancak aşırı ifa güçlüğüne ilişkin TBK m. 138 saklıdır. Beş yıl geçtikten sonra yabancı paranın değerindeki değişiklikler de gözetilerek TBK m. 344/3 uygulanır (TBK m. 344/4).

  - soru: |
      Yeni kira dönemi 1 Eylül'de başlayacaktır. Kiraya veren 1 Temmuz'da kiracıya yazılı artış bildirimi göndermiş, kiracı kabul etmeyince 15 Ekim'de kira tespit davası açmıştır. Sözleşmede artış hükmü yoktur. Mahkemece belirlenecek bedel kiracıyı hangi tarihten itibaren bağlar?
    siklar:
      - "Davanın açıldığı 15 Ekim'den itibaren"
      - "Karar tarihinden itibaren"
      - "Yeni dönemin başlangıcı olan 1 Eylül'den itibaren"
      - "Bir sonraki kira döneminin başından itibaren"
    dogru: 2
    aciklama: |
      Kiraya veren yeni dönemin başlangıcından en geç otuz gün önce yazılı artış bildirimi yapmış ve dava izleyen yeni kira dönemi sonuna kadar açılmıştır. Bu hâlde mahkemece belirlenecek bedel yeni kira döneminin başlangıcından itibaren kiracıyı bağlar (TBK m. 345/2).

  - soru: |
      Konut kirası sözleşmesinde "her yenilenen dönemde kira bedeli TÜFE oranında artırılır" hükmü vardır. Kiraya veren hiçbir bildirim yapmadan, yeni dönemin ortasında kira tespit davası açmıştır. Dava yeni kira döneminin sonuna kadar açılmıştır. Mahkemece belirlenen bedel hangi tarihten itibaren geçerlidir?
    siklar:
      - "Davanın açıldığı tarihten itibaren"
      - "Yeni dönemin başlangıcından itibaren; otuz günlük önceden bildirim şartı aranmaz"
      - "Hiçbir tarihten itibaren, çünkü bildirim yapılmamıştır"
      - "Yalnız bir sonraki dönemden itibaren"
    dogru: 1
    aciklama: |
      Sözleşmede yeni kira döneminde bedelin artırılacağına ilişkin bir hüküm varsa, yeni kira döneminin sonuna kadar açılacak davada mahkemece belirlenecek bedel de bu yeni dönemin başlangıcından itibaren geçerli olur (TBK m. 345/3). Otuz günlük bildirim ya da dava şartı aranmaz.

  - soru: |
      İşyeri kira sözleşmesinde "kira bedeli zamanında ödenmezse kalan dönemin kiraları muaccel olur ve kiracı gecikmiş her ay için bir aylık kira tutarında ceza koşulu öder" yazmaktadır. Kiracı iki ay gecikmiştir. Kiraya veren bu hükme dayanabilir mi?
    siklar:
      - "Evet, çünkü ceza koşulu serbestçe kararlaştırılabilir"
      - "Yalnız ceza koşulu geçerlidir, muacceliyet kaydı geçersizdir"
      - "Hayır, çünkü hem muacceliyet kaydı hem ceza koşulu geçersizdir"
      - "Yalnız muacceliyet kaydı geçerlidir"
    dogru: 2
    aciklama: |
      Kiracıya kira bedeli ve yan giderler dışında başka ödeme yükümlülüğü getirilemez; özellikle kira bedelinin zamanında ödenmemesi hâlinde ceza koşulu ödeneceğine veya sonraki kira bedellerinin muaccel olacağına ilişkin anlaşmalar geçersizdir (TBK m. 346). Kayıt iki yönüyle de geçersizdir.

  - soru: |
      Kiraya veren, kira tespit davasında dilekçesinde aylık 8.000 TL'lik bedelin belirlenmesini istemiş; bilirkişi raporu 9.200 TL bulunca ıslah dilekçesiyle talebini 9.200 TL'ye çıkarmak istemiştir. Yargıtay Hukuk Genel Kurulu'nun yaklaşımına göre sonuç nedir?
    siklar:
      - "Islahla artırılamaz; talep bölünemez ve fazlaya ilişkin haklar saklı tutulamaz"
      - "Islah serbesttir, çünkü kanun kira tespit davasında ıslahı yasaklamamıştır"
      - "Islah yalnız bir kez ve karar verilmeden önce yapılabilir"
      - "Islah ancak kiraya veren fazlaya ilişkin hakkını saklı tutmuşsa yapılabilir"
    dogru: 0
    aciklama: |
      Hukuk Genel Kurulu, kira tespit davasının kendine özgü bir dava olduğunu, inşai nitelikli kararlara yakın bulunduğunu ve talebin bölünemeyeceğini belirtir. Fazlaya ilişkin haklar saklı tutulamaz ve dava dilekçesindeki bedel ıslahla artırılamaz.
olaylar:
  - olay: |
      Selim, Bakırköy'deki çatılı dükkânını 1 Eylül 2024'ten başlayarak bir yıl süreyle, aylık 40.000 TL bedelle Aylin Gıda Ltd. Şti.'ne kiralamıştır. Sözleşmede şu hükümler vardır: (i) "Kira bedeli her yenilenen dönemde %70 artırılır." (ii) "Kira zamanında ödenmezse kalan dönemin kiraları muaccel olur ve kiracı her gecikmiş ay için bir aylık kira tutarında ceza koşulu öder." (iii) "Kiracı, kira sözleşmesinin sürdürülmesi için Selim'in kardeşine ait kırtasiyeden her ay 5.000 TL'lik ürün satın alacaktır."

      Taraflar sözleşmeyi bir yıl daha sürdürmüştür. Bir önceki kira yılında TÜFE'nin oniki aylık ortalamalara göre değişim oranının %45 olduğunu varsayınız. Selim, 1 Eylül 2025'ten itibaren aylık 68.000 TL (%70 artış) istemektedir. Aylin ödemeyi iki ay geciktirince Selim (ii) numaralı kayda dayanarak kalan dönemin kiralarını ve ceza koşulunu talep etmiştir. Aylin kırtasiyeden alışveriş yapmayı bırakmış, Selim de "bu yüzden sözleşme sürmez" demiştir. Aylin Gıda Ltd. Şti. tacir olduğundan konut ve çatılı işyeri koruma kurallarının kendisi için uygulanmayacağını da ileri sürmüştür.

      1. 1 Eylül 2025'ten itibaren uygulanacak kira bedeli nedir?
      2. (ii) numaralı kayıt geçerli midir?
      3. (iii) numaralı kaydın akıbeti nedir; kira sözleşmesi etkilenir mi?
      4. Tacir olma savunmasını değerlendiriniz.
    olcut:
      - {tespit: "Çatılı işyeri kirasında yenilenen dönemde anlaşılan bedelin TÜFE oniki aylık ortalama değişim oranını aşamaması; sınırın emredici olması", puan: 20, madde: "TBK m. 344"}
      - {tespit: "Sözleşmedeki %70 yerine %45 uygulanması; yeni dönem kirasının 58.000 TL olması", puan: 10, madde: "TBK m. 344"}
      - {tespit: "Sonraki kiraların muaccel olacağına ilişkin kaydın geçersizliği", puan: 15, madde: "TBK m. 346"}
      - {tespit: "Ceza koşulu kaydının geçersizliği; kiracıya kira ve yan giderler dışında ödeme yükümlülüğü getirilememesi", puan: 15, madde: "TBK m. 346"}
      - {tespit: "Kirayla bağlantılı sözleşmenin geçersizliği ve kira sözleşmesinin geçerli kalması", puan: 25, madde: "TBK m. 340"}
      - {tespit: "Tacir kiracılar bakımından sekiz yıllık ertelemenin dolması; koruyucu hükümlerin uygulanması", puan: 15, madde: "TBK m. 344"}
    cozum: |
      **Nitelendirme:** Üstü örtülü bir dükkân kiralanmıştır; konut ve çatılı işyeri kiralarına ilişkin kurallar uygulanır (TBK m. 339). Sözleşme ilk kira yılından sonra yenilenmiştir ve (i), (ii), (iii) numaralı kayıtların geçerliliği ile yenilenen dönemin kirası tartışılmaktadır.

      **Hukuki sorunlar:** (1) Artış sınırı; (2) muacceliyet ve ceza koşulu; (3) bağlantılı sözleşme; (4) tacir kiracı savunması.

      **İlgili hükümler:** TBK m. 339; TBK m. 340; TBK m. 344; TBK m. 346.

      **Değerlendirme:**

      *1. Kira bedeli:* Tarafların yenilenen dönemde uygulanacak bedele ilişkin anlaşması, önceki kira yılının TÜFE oniki aylık ortalamalara göre değişim oranını geçmemek koşuluyla geçerlidir (TBK m. 344/1). Yargıtay'a göre sınır emredicidir; sözleşmedeki oran aşıyorsa kanundaki oran uygulanır. Sözleşmedeki %70 artış %45'lik sınırı aştığından yeni dönem kirası 40.000 x 1,45 = 58.000 TL olur; Selim 68.000 TL isteyemez.

      *2. Muacceliyet ve ceza koşulu:* Kiracıya kira bedeli ve yan giderler dışında başka ödeme yükümlülüğü getirilemez; kira bedelinin zamanında ödenmemesi hâlinde ceza koşulu ödeneceğine veya sonraki kira bedellerinin muaccel olacağına ilişkin anlaşmalar geçersizdir (TBK m. 346). Selim ne kalan dönemin kiralarını ne de ceza koşulunu isteyebilir. Aylin yalnız gecikmiş kira bedelini ve kanunun tanıdığı sonuçları ödemekle yükümlüdür; sözleşmeyle ek bir yaptırım getirilemez.

      *3. Bağlantılı sözleşme:* Kira sözleşmesinin sürdürülmesi, kiracının yararı olmaksızın, kiralananın kullanımıyla doğrudan ilişkisi olmayan bir borca (kardeşin kırtasiyesinden alışveriş) bağlanmıştır. Kirayla bağlantılı sözleşme geçersizdir (TBK m. 340). Geçersizlik bağlantılı sözleşmeye ilişkindir; Aylin'in alışveriş yapmaması kira sözleşmesinin sona ermesine yol açmaz.

      *4. Tacir savunması:* Kiracısı tacir ya da tüzel kişi olan işyeri kiralarında bu hükümler 6217 sayılı Kanunun geçici 2. maddesiyle sekiz yıl uygulanmamıştı. Süre dolmuş, 2024-2025 tarihli kira bakımından TBK m. 340, 342, 343, 344 ve 346 tacir kiracılar için de uygulanır. Kira 2024'te başladığından erteleme dönemine de rastlamaz. Savunma yerinde değildir.

      **Sonuç:**
      - Yeni dönem kirası 58.000 TL'dir.
      - Muacceliyet kaydı ve ceza koşulu geçersizdir.
      - Kırtasiye alışverişi şartı geçersizdir; kira sözleşmesi geçerli kalır.
      - Tacir olma savunması dinlenmez.
  - olay: |
      Deniz, Kadıköy'deki dairesini 1 Nisan 2025'ten başlayarak bir yıl süreyle, aylık 20.000 TL bedelle konut olarak Burak'a kiralamıştır. Sözleşmeye göre Burak 5 aylık kira karşılığı 100.000 TL güvence verecek; Burak bu parayı, kiraya verenin onayı olmadan çekilmemek üzere vadeli tasarruf hesabına yatırmıştır.

      Taraflar kirayı bir yıl daha sürdürmüştür. Sözleşmede artış hükmü yoktur. Deniz 1 Şubat 2026'da Burak'a yazılı bildirim göndererek 1 Nisan 2026'dan itibaren kirayı 30.000 TL'ye çıkaracağını bildirmiştir. Burak kabul etmemiş, Deniz arabulucuya başvurmuş, anlaşma sağlanamayınca 20 Mayıs 2026'da kira tespit davası açmıştır. Bir önceki kira yılında TÜFE'nin oniki aylık ortalamalara göre değişim oranının %40 olduğunu varsayınız.

      Kira 31 Mart 2027'de sona ermiş, Burak daireyi hasarsız teslim etmiştir. Deniz sona ermeyi izleyen üç ay içinde bankaya hiçbir bildirimde bulunmamış, dava da takip de başlatmamıştır. Burak güvenceyi bankadan istemektedir.

      1. Güvence miktarı yerinde midir?
      2. Mahkeme yeni dönem için en çok hangi tutara hükmedebilir ve belirlenen bedel hangi tarihten itibaren Burak'ı bağlar?
      3. Burak güvenceyi bankadan geri alabilir mi?
    olcut:
      - {tespit: "Güvencenin üç aylık kira bedelini (60.000 TL) aşamaması; aşan kısmın geçerli olmaması", puan: 15, madde: "TBK m. 342"}
      - {tespit: "Para güvencenin vadeli tasarruf hesabına yatırılması ve bankanın ancak kanundaki hâllerde geri vermesi", puan: 10, madde: "TBK m. 342"}
      - {tespit: "Artış anlaşması yokken hâkimin TÜFE oniki aylık ortalama sınırını aşmamak koşuluyla hakkaniyete göre belirlemesi; en çok 28.000 TL, 30.000 TL olamaz", puan: 25, madde: "TBK m. 344"}
      - {tespit: "Sözleşmenin beş yılı doldurmaması nedeniyle emsal kiraya dayalı beş yıllık belirlemenin uygulanmaması", puan: 10, madde: "TBK m. 344"}
      - {tespit: "Yazılı bildirimin otuz gün önceden yapılması ve davanın yeni dönem sonuna kadar açılması nedeniyle bedelin 1 Nisan 2026'dan itibaren bağlaması; arabuluculuğun dava şartı olması", puan: 25, madde: "TBK m. 345"}
      - {tespit: "Üç ay içinde bankaya bildirim yapılmadığından bankanın kiracının istemiyle güvenceyi iade etmesi", puan: 15, madde: "TBK m. 342"}
    cozum: |
      **Nitelendirme:** Konut kirası söz konusudur ve TBK m. 339 vd. uygulanır. Uyuşmazlık, güvence miktarı, yenilenen dönemin kira bedeli ve tespit kararının etkisidir.

      **Hukuki sorunlar:** (1) Güvence sınırı; (2) artış sınırı ve hâkimin yetkisi; (3) kararın başlangıç tarihi; (4) güvencenin bankadan iadesi.

      **İlgili hükümler:** TBK m. 342; TBK m. 344; TBK m. 345; HUAK m. 18/B.

      **Değerlendirme:**

      *1. Güvence:* Güvence üç aylık kira bedelini aşamaz (TBK m. 342/1). Aylık kira 20.000 TL olduğundan sınır 60.000 TL'dir. Kararlaştırılan 100.000 TL'nin aşan kısmı geçerli olmaz. Para güvenceyi Burak kanuna uygun biçimde vadeli tasarruf hesabına yatırmıştır; banka, güvenceyi ancak iki tarafın rızasıyla, icra takibinin kesinleşmesiyle ya da kesinleşmiş mahkeme kararıyla geri verebilir (TBK m. 342/2).

      *2. Yeni dönem kirası:* Artış konusunda anlaşma yoktur. Bu durumda kira bedelini hâkim, önceki kira yılının TÜFE oniki aylık ortalama değişim oranını geçmemek koşuluyla, kiralananın durumunu göz önüne alarak hakkaniyete göre belirler (TBK m. 344/2). TÜFE oranı %40 olduğundan sınır 20.000 x 1,40 = 28.000 TL'dir; Deniz'in istediği 30.000 TL'ye hükmedilemez. Sözleşme beş yılı doldurmadığı için emsal kiralara dayalı beş yıllık belirleme (TBK m. 344/3) uygulanmaz.

      *3. Kararın etkisi:* Dava, yeni dönemin başlangıcından en geç otuz gün önce açılmamıştır (20 Mayıs 2026). Ancak Deniz bu süre içinde, 1 Şubat 2026'da, artışı yazılı bildirmiştir ve dava izleyen yeni kira dönemi sonuna kadar açılmıştır. İki koşul birlikte gerçekleştiğinden mahkemece belirlenecek bedel yeni dönemin başlangıcı olan 1 Nisan 2026'dan itibaren Burak'ı bağlar (TBK m. 345/2). Kira ilişkisinden doğan uyuşmazlıklarda arabulucuya başvurmak dava şartıdır; Deniz'in başvurusu bu bakımdan yeterlidir (HUAK m. 18/B).

      *4. Güvencenin iadesi:* Kiraya veren, sona ermeyi izleyen üç ay içinde kiracıya karşı bir dava ya da takip başlattığını bankaya yazılı bildirmemişse banka, kiracının istemi üzerine güvenceyi geri vermekle yükümlüdür (TBK m. 342/3). Deniz bildirim yapmadığından Burak güvenceyi bankadan alabilir.

      **Sonuç:**
      - Güvence en çok 60.000 TL olabilir; fazlası geçerli olmaz.
      - Mahkeme en çok 28.000 TL'ye hükmedebilir; bedel 1 Nisan 2026'dan itibaren Burak'ı bağlar.
      - Burak, bankadan güvenceyi tek başına geri alabilir.
kartlar:
  - on: "Konut ve çatılı işyeri hükümlerinin dışında kalan kira? (TBK m. 339/1)"
    arka: "Niteliği gereği geçici kullanıma özgülenmiş taşınmazın altı ay ve daha kısa süreli kirası. İki şart birlikte aranır."
  - on: "Kamu kurumlarının kiraları ve eşya? (TBK m. 339)"
    arka: "Kamu kurumlarının bütün kira sözleşmelerine hükümler uygulanır; birlikte kullanımı bırakılan eşya da aynı rejime girer."
  - on: "Kirayla bağlantılı sözleşme? (TBK m. 340)"
    arka: "Kiracının yararı olmadan, kullanımla ilgisiz bir borca bağlanmış sözleşme geçersizdir; kira sözleşmesi geçerli kalır."
  - on: "Kullanma giderlerini kim öder? (TBK m. 341)"
    arka: "Aksi öngörülmemişse ve aksine yerel âdet yoksa kiracı. Ödeyen taraf belge örneklerini istem üzerine verir."
  - on: "Güvence üst sınırı ve nerede tutulur? (TBK m. 342)"
    arka: "En çok üç aylık kira bedeli. Para, kiraya verenin onayı olmadan çekilmemek üzere vadeli tasarruf hesabında; kıymetli evrak bankada depo."
  - on: "Güvence bankadan ne zaman kiracıya iade edilir? (TBK m. 342/3)"
    arka: "Kiraya veren sona ermeyi izleyen üç ay içinde dava ya da takibi bankaya yazılı bildirmemişse kiracının istemiyle."
  - on: "Ceza koşulu ve muacceliyet kaydı? (TBK m. 346)"
    arka: "Kira zamanında ödenmezse ceza koşulu ya da sonraki kiraların muaccel olması kararlaştırılamaz; geçersizdir."
  - on: "Yenilenen dönemde artış sınırı? (TBK m. 344/1)"
    arka: "Önceki kira yılının TÜFE oniki aylık ortalamalara göre değişim oranı. Sınır emredicidir; aşan oran geçerli olmaz."
  - on: "Beş yıldan sonra kira nasıl belirlenir? (TBK m. 344/3)"
    arka: "Hâkim, TÜFE oranı, kiralananın durumu ve emsal kira bedellerini gözeterek hakkaniyete uygun biçimde belirler; her beş yılda yinelenir."
  - on: "Yabancı para kirası? (TBK m. 344/4)"
    arka: "Beş yıl geçmedikçe bedel değiştirilemez; TBK m. 138 (aşırı ifa güçlüğü) saklıdır."
  - on: "Tespit kararı dönem başından ne zaman bağlar? (TBK m. 345)"
    arka: "Dava dönem başından en az otuz gün önce açılırsa ya da kiraya veren o sürede yazılı bildirim yapıp dava dönem sonuna kadar açılırsa. Sözleşmede artış hükmü varsa dönem sonuna kadar açılan dava yeter."
  - on: "Kira tespit davasının niteliği ve yakın tarihli düzenlemeler?"
    arka: "Talep bölünemez, ıslahla artırılamaz (Hukuk Genel Kurulu). Dava öncesi arabuluculuk dava şartıdır (HUAK m. 18/B). Konutlardaki geçici %25 sınırı 1 Temmuz 2024'te sona ermiştir."
