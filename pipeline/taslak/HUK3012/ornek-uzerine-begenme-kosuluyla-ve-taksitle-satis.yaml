  - 📌 Takas hakkından önceden feragat edilemez (TBK m. 257). Kambiyo senedi yoksa alıcı kalan bedeli her zaman bir defada öder; ilave bedel yarısından az olmamak üzere indirilir (TBK m. 258).
  - ⚠️ Peşinatta temerrütte satıcı yalnız peşinatı ister veya döner. Taksitlerde kalan bedeli istemek ya da dönmek için hakkı açıkça saklı tutmak, eşik taksit temerrüdü ve en az on beş günlük süre gerekir; ödenmiş taksitler dönme sınırını belirler (TBK m. 259).
  - 📌 Dönmede iade, kullanım bedeli ve tazminat doğar; peşinat temerrüdünde ceza koşulu peşin satış bedelinin yüzde onunu aşamaz (TBK m. 260). Alıcı yetki ve tahkim sözleşmesi yapamaz (TBK m. 262); tacir veya ticari amaçlı alıcıda yalnız TBK m. 259/2, TBK m. 260/1 ve TBK m. 261 uygulanır (TBK m. 263/4).
  - 📌 Tüketici taksitle satışında yedi gün cayma hakkı ve en az 30 günlük muacceliyet uyarısı vardır; TBK'da süre on beş gündür (TKHK m. 18-19).

doktrin: |
  ### Yedi günlük sürede sözleşmenin durumu
  TBK m. 255/1, sözleşmenin alıcı bakımından yedi gün sonra "hüküm ve sonuçlarını doğuracağını" söyler. Bir görüşe göre sözleşme bu sürede **askıdadır**: Süre geçip alıcı bildirimde bulunmazsa sözleşme hüküm doğurur, geri alma bildirimi ise sözleşmeyi hiç doğmamış hâle getirir. Başka bir görüşe göre durum, TKHK m. 18'deki cayma hakkına benzer; sözleşme kurulmuştur ve alıcı **bozucu yenilik doğuran hakkını** kullanarak onu sona erdirir. Farkın pratik görünümü, yedi gün içinde sözleşmeden doğan sonuçların, özellikle teslim edilmiş malın durumunun nasıl nitelendirileceğidir. Sınavda önce kanunun lafzını yaz, sonra iki görüşü karşılaştır.

  ### Örnek satıcıda veya üçüncü kişide kalırsa
  TBK m. 247 örneğin alıcıya veya üçüncü bir kişiye bırakılmasından söz eder. TBK m. 248 ise "kendisine örnek verilen tarafı" korur ve örneğin alıcının elinde bozulmasını düzenler. Örneğin satıcıda ya da üçüncü kişide kaldığı hâllerde bu ispat kurallarının ne ölçüde uygulanacağı kanun metninden açıkça anlaşılmaz ve tartışılır. Bu durumda olay çözümünü TBK m. 248 lafzına bağla; kesin bir sonuç ilan etme.

sozluk:
  - terim: Örnek üzerine satış
    tanim: "Malın, alıcıya ya da üçüncü kişiye bırakılan örneğe veya tespit edilen bir mala uygun olması üzerinde anlaşılarak yapılan satış (TBK m. 247)."
  - terim: Beğenme koşuluyla satış
    tanim: "Alıcının satılanı deneyerek veya gözden geçirerek beğenmesi koşuluna bağlı satış (TBK m. 249)."
  - terim: Geciktirici koşul
    tanim: "Gerçekleşmesine kadar sözleşmenin sonuçlarını erteleyen koşul. Beğenme koşulu bu niteliktedir; mülkiyet koşul gerçekleşene kadar satıcıda kalır (TBK m. 250/2)."
  - terim: Taksitle satış
    tanim: "Satıcının taşınırı bedel ödenmeden önce teslim ettiği, alıcının bedeli kısım kısım ödediği satış; yazılı şekle bağlıdır (TBK m. 253)."
  - terim: Peşinat
    tanim: "Teslim anında peşin ödenmesi gereken kısım; peşin satış bedelinin en az onda biridir (TBK m. 256/1)."
  - terim: Geri alma hakkı
    tanim: "Taksitle satışta alıcının yedi gün içinde yazılı bildirimle irade açıklamasını geri alabilmesi; önceden feragat edilemez (TBK m. 255)."
  - terim: Cayma parası
    tanim: "Bir tarafın sözleşmeden dönebilmesi için ödemeyi kararlaştırdığı para. Alıcı geri alma hakkını kullanırsa ondan istenemez (TBK m. 255/3)."
  - terim: Muacceliyet
    tanim: "Vadesi gelmemiş taksitlerin de istenebilir hâle gelmesi. Taksitle satışta satıcı bunu yalnız kanundaki şartlar gerçekleşirse isteyebilir (TBK m. 259/2)."
  - terim: Kambiyo senedi
    tanim: "Poliçe, bono ve çek gibi senetler. Taksitler buna bağlanmışsa alıcı erken ödeme hakkından yararlanamaz (TBK m. 258)."
  - terim: Mülkiyeti saklı tutma
    tanim: "Satış bedeli ödenene kadar mülkiyetin satıcıda kalacağına ilişkin kayıt; taksitle satış sözleşmesine yazılabilir (TBK m. 253/3); geçerliliği resmî şekilde yapılıp devralanın yerleşim yeri noterliğindeki özel sicile kaydedilmesine bağlıdır (TMK m. 764)."
  - terim: Dönme
    tanim: "Satıcının alıcının temerrüdü yüzünden sözleşmeyi sona erdirmesi; teslimden sonraysa karşılıklı iade ve kullanım bedeli doğar (TBK m. 260)."
  - terim: Kullanım bedeli
    tanim: "Dönmede satıcının, malın alıcıdaki kullanımı karşılığı hakkaniyete uygun olarak isteyebileceği bedel (TBK m. 260/1)."

kararlar:
  - id: "893405700"
    ozet: |
      Davacı satıcı, İngiltere'den aldığı elektronik sensör prototip test cihazı ve aparatlarını 10.07.2014'te davalı alıcıya teslim etmiştir. Alıcı üç aylık deneme süresi istemiş, sonra fiyat teklifi talep etmiş; teklif 25.12.2014'te verildiği hâlde 08.06.2015'e kadar işlem yapmamış, o tarihli yazıyla malların alt yükleniciden temin edileceğini bildirmiştir. Satıcı 45.922 ABD doları bedel için başlattığı takibe yapılan itirazın iptalini istemiştir. İlk derece mahkemesi satış sözleşmesinin kurulduğunun kanıtlanamadığı gerekçesiyle davayı reddetmiş, bölge adliye mahkemesi istinaf başvurusunu reddetmiştir. Yargıtay 11. Hukuk Dairesi 2020'de kararı bozmuş ve TBK m. 252/1-2 uyarınca alıcının üç aylık deneme süresini geçirdiğini, malları deneme amacını aşacak biçimde kullandığını, bu yüzden beğenme koşulunun gerçekleştiğini ve beğenme koşuluyla satış sözleşmesinin oluştuğunu belirtmiştir. İlk derece mahkemesi bozmaya uyarak davayı kabul etmiş, Daire bu kararı 14.02.2023'te oy birliğiyle onamıştır. Konuya katkısı: Deneme süresinin aşılması ve amacı aşan kullanımla beğenme koşulunun gerçekleşeceğini gösterir.
  - id: "1102997300"
    ozet: |
      Davacı satıcı, 27.03.2018'de noterde düzenleme şeklinde mülkiyeti saklı tutma kaydıyla aracını 32.000 TL bedelle bir alıcıya satmış; 3.000 TL peşin alınmış, bakiye için verilen bonolar ödenmemiştir. Taraflar 15.02.2019'da protokolle peşinatın iadesi ve aracın geri verilmesi konusunda anlaşmış, ancak araç üzerinde alıcının borcu nedeniyle haciz bulunduğu için devir yapılamamıştır. Satıcı hükmen tescil davasını kazanmış, hüküm 16.10.2020'de kesinleşmiş; ardından alıcının alacaklısı olan davalı kurumun 31.07.2019 tarihli haczinin kaldırılmasını istemiştir. Kurum, araç sicil kaydına güvendiğini savunmuştur. İlk derece mahkemesi davayı kabul etmiş, bölge adliye mahkemesi istinaf başvurusunu reddetmiştir. Yargıtay 3. Hukuk Dairesi TMK m. 764 ve TBK m. 259'u ilgili hukuk olarak anmış; mülkiyeti saklı tutma kaydıyla satışta alıcı taksitleri ödemeyip temerrüde düşmüşse mülkiyetin henüz alıcıya geçmediğini, bedel ödenmediği için aracın borçlunun mülkü sayılıp haczedilemeyeceğini belirterek kararı oy birliğiyle onamıştır. Konuya katkısı: Taksitli satışta mülkiyeti saklı tutma kaydının satıcıyı alıcının alacaklılarına karşı koruyabildiğini gösterir; gerekçe kısadır.

sorular:
  - soru: |
      Ayşe Tekstil, Mehmet Ltd. Şti.'ne kumaş satarken örnek bırakmıştır. Örnek, Mehmet'in deposunda sel yüzünden yok olmuştur. Teslim edilen kumaşın örneğe uygun olmadığını ileri süren Mehmet bakımından ispat yükü nasıl dağılır? (TBK m. 248)
    siklar:
      - "Kumaşın örneğe uygun olduğunu Ayşe ispatlamak zorundadır."
      - "Mehmet kusursuz olsa bile kumaşın örneğe uygun olmadığını kendisi ispatlamak zorundadır."
      - "Örnek yok olduğu için satış geçersizdir."
      - "İspat yükü tarafların kusur oranına göre bölünür."
    dogru: 1
    aciklama: |
      TBK m. 248/2'ye göre örnek alıcının elindeyken bozulmuş veya yok olmuşsa, alıcının kusuru olmasa bile, satılanın örneğe uygun olmadığını ispat yükü alıcıya düşer. Örneğin yok olması satışı geçersiz kılmaz ve ispat yükü kusur oranıyla bölünmez.

  - soru: |
      Zeynep, satıcıdan aldığı numune kumaşın bir köşesini yıkama testi için kesmiştir. Satıcı, elindeki parçanın kendi verdiği numune olmadığını ileri sürmektedir. TBK m. 248/1'e göre hangisi doğrudur?
    siklar:
      - "Zeynep, parçanın verilen örnek olduğunu ispatlamak zorundadır."
      - "Biçim değişikliği gözden geçirmenin zorunlu sonucu olduğundan Zeynep'in iddiası doğru sayılır; satıcı aksini ispatlayabilir."
      - "Biçim değiştiği için Zeynep örnekten yararlanamaz."
      - "Satıcının aksini ispat hakkı yoktur."
    dogru: 1
    aciklama: |
      TBK m. 248/1'e göre kendisine örnek verilen taraf, elindeki örneğin verilen örnek olduğunu ispat yükü altında değildir; örneğin biçimi değişmiş olsa bile bu değişiklik gözden geçirmenin zorunlu bir sonucuysa alıcının iddiası doğru sayılır. Karşı tarafın her hâlde aksini ispat hakkı vardır.

  - soru: |
      Galeri sahibi Ayşe, bir tabloyu Burak'a on gün evinde deneyip beğenmesi koşuluyla teslim etmiştir. Burak tabloyu henüz beğenmemiş ya da kabul etmemiştir. Tablonun mülkiyeti kimdedir? (TBK m. 250)
    siklar:
      - "Burak'ta; çünkü zilyetlik ona geçmiştir."
      - "Ayşe'de; mülkiyet beğenme koşulunun gerçekleştiği ana kadar satıcıda kalır."
      - "Tablo mülkiyetsizdir."
      - "Ortaklaşa Ayşe ve Burak'ta."
    dogru: 1
    aciklama: |
      TBK m. 250/2'ye göre satılan alıcının zilyetliğine geçmiş olsa bile, satılanın mülkiyeti beğenme koşulunun gerçekleştiği ana kadar satıcıda kalır. Alıcı ayrıca satılanı hiçbir sebep göstermeksizin geri vermekte serbesttir (TBK m. 250/1).

  - soru: |
      Heykeltıraş Ali, bir heykeli Cem'e beğenme koşuluyla satmış; Cem heykeli Ali'nin atölyesinde inceleyecek ve yedi gün içinde kararını bildirecektir. Cem süre içinde hiçbir açıklama yapmamıştır. TBK m. 251'e göre sonuç nedir?
    siklar:
      - "Beğenme koşulu gerçekleşmiştir; Cem bedeli ödemek zorundadır."
      - "Ali sözleşmeyle bağlılıktan kurtulur."
      - "Sözleşme Cem'in lehine geçerlidir; Ali süreyi uzatmak zorundadır."
      - "Sözleşme kendiliğinden kesin hükümsüz olur."
    dogru: 1
    aciklama: |
      Deneme satıcının yanında yapılacağından TBK m. 251/1 uygulanır: Alıcı, sözleşme veya âdete göre gerekli süre içinde satılanı kabul edip etmediğini açıklamazsa satıcı sözleşmeyle bağlılıktan kurtulur. Alıcıya verilmiş mal için geçerli olan "sessizlik kabuldür" kuralı (TBK m. 252/1) burada işlemez.

  - soru: |
      Satıcı Ayşe, tabloyu Burak'a denenmek üzere evine teslim etmiş ve beş günlük süre vermiştir. Burak süre dolana kadar hiçbir şey bildirmemiş, tabloyu geri de vermemiştir. Ayşe herhangi bir ihtar göndermemiştir. TBK m. 252/1'e göre durum nedir?
    siklar:
      - "Beğenme koşulu gerçekleşmiştir."
      - "Ayşe sözleşmeyle bağlılıktan kurtulmuştur."
      - "Burak süre sonunda otomatik olarak sözleşmeden cayma hakkını kullanmış sayılır."
      - "Sözleşme hâlâ askıdadır; yalnız Ayşe'nin ihtarı sonucu belirler."
    dogru: 0
    aciklama: |
      TBK m. 252/1'e göre satılan denenmeksizin ya da gözden geçirilmeksizin alıcıya verilmişse, sözleşme veya âdete göre gereken süre içinde alıcı satılanı beğenmediğini hemen bildirmez veya onu geri vermezse beğenme koşulu gerçekleşir. Süre sözleşmede belirlendiğinden satıcının ihtarı gerekmez; ihtar yalnız süre yoksa gündeme gelir.

  - soru: |
      Zeynep, üç günlüğüne denemek üzere aldığı abiye elbiseyi akşamki mezuniyet balosunda giymiştir. Ertesi gün elbiseyi hiçbir gerekçe göstermeden iade etmek istemektedir. TBK m. 252/2'ye göre ne söylenebilir?
    siklar:
      - "Zeynep sebepsiz iade hakkını koruyor."
      - "Deneme amacını aşan kullanım nedeniyle beğenme koşulu gerçekleşmiştir."
      - "Ancak Zeynep iade etmeyi önceden bildirmişse koşul gerçekleşmez."
      - "Zeynep yalnız kullanım bedeli ödeyerek iade edebilir."
    dogru: 1
    aciklama: |
      TBK m. 252/2'ye göre alıcının satılanı deneme veya gözden geçirme amacını aşacak biçimde kullanması beğenme koşulunu gerçekleştirir. Balo gibi bir etkinlikte giymek denemeyi aşan kullanımdır; Zeynep artık sebep göstermeden iade edemez (karş. TBK m. 250/1). Kullanım bedeliyle iade seçeneği kanunda yoktur.

  - soru: |
      TBK m. 253'e göre taksitle satış sözleşmesi hangi şekilde yapılmadıkça geçerli olmaz?
    siklar:
      - "Yazılı şekilde"
      - "Resmî şekilde"
      - "Noterde düzenleme şeklinde"
      - "Şekle bağlı değildir"
    dogru: 0
    aciklama: |
      TBK m. 253/2'ye göre taksitle satış sözleşmesi yazılı şekilde yapılmadıkça geçerli olmaz. Resmî şekil aranmaz. Tüketici işlemlerinde de aynı şekil geçerlidir (TKHK m. 17/3).

  - soru: |
      Ahmet, taksitle satış sözleşmesinin imzalı bir nüshasını 3 Mart'ta teslim almıştır. Yedi günlük sürenin son günü olan 10 Mart'ta geri alma bildirimini yazılı olarak postaya vermiştir; bildirim satıcıya 12 Mart'ta ulaşmıştır. TBK m. 255'e göre durum nedir?
    siklar:
      - "Bildirim süresinde yapılmıştır; son günde postaya verilmesi yeterlidir."
      - "Bildirim ancak satıcının eline son gün geçmişse geçerlidir."
      - "Bildirim yalnız noterden yapılabilirdi."
      - "Ahmet'ten cayma parası istenir."
    dogru: 0
    aciklama: |
      TBK m. 255/1'e göre alıcı, yedi gün içinde irade açıklamasını geri aldığını satıcıya yazılı bildirebilir ve bildirimin sürenin son gününde postaya verilmiş olması yeterlidir. Geri alma hakkı kullanılırsa alıcıdan cayma parası istenemez (TBK m. 255/3). Noter şartı yoktur.

  - soru: |
      Peşin satış bedeli 100.000 TL olan bir bilgisayar taksitle satılmıştır. Satıcı, alıcıdan teslim anında yalnız 4.000 TL peşinat alarak malı vermiştir. TBK m. 256'ya göre sonuç nedir?
    siklar:
      - "Sözleşme geçersizdir."
      - "Satıcı, peşinatın ödenmeyen kısmı üzerinde istem hakkını kaybeder."
      - "Satıcı kalan bedeli derhal muaccel kılabilir."
      - "Alıcı malı iade etmek zorundadır."
    dogru: 1
    aciklama: |
      Alıcı peşin satış bedelinin en az onda birini (burada 10.000 TL) en geç teslimde peşin ödemekle yükümlüdür (TBK m. 256/1). Kanunda belirlenen asgari peşinatı tamamen almadan malı alıcıya devreden satıcı, peşinatın ödenmeyen kısmı üzerinde istem hakkını kaybeder (TBK m. 256/3). Sözleşme geçersiz olmaz ve satıcıya malı geri alma veya bedeli muaccel kılma hakkı bu yüzden tanınmaz.

  - soru: |
      Toplam satış bedeli 112.000 TL olan taksitli satışta alıcı 12 taksitin (her biri 9.000 TL) yalnız 4. taksidini ödememiştir. Satıcı kalan bedelin tamamını isteme ve dönme hakkını sözleşmede açıkça saklı tutmuştur. Satıcı kalan bedelin tamamını isteyebilir mi? (TBK m. 259)
    siklar:
      - "Evet; hakkı saklı tuttuğu için isteyebilir."
      - "Hayır; tek taksit temerrüdü dörtte biri oluşturmadığından ve son taksit olmadığından şartlar gerçekleşmemiştir."
      - "Evet; ancak bir ay süre vermek koşuluyla."
      - "Hayır; satıcı hiçbir hâlde kalan bedeli isteyemez."
    dogru: 1
    aciklama: |
      TBK m. 259/2'ye göre kalan bedelin tamamını isteyebilmek için hakkın açıkça saklı tutulması yetmez; alıcı birbirini izleyen en az iki taksidi (satış bedelinin en az onda biri), ya da en az dörtte birini oluşturan bir taksidi, ya da en son taksidi ödemede temerrüde düşmüş olmalıdır. Tek bir 9.000 TL'lik taksit bu eşiklerin hiçbirini karşılamaz. Satıcı yalnız muaccel taksidi isteyebilir. Kanun satıcıya bir ay değil, en az on beş gün süre tanıma yükümlülüğü getirir (TBK m. 259/3).

  - soru: |
      Tüketici işlemi niteliğindeki taksitle satışta satıcının kalan borcun tümünü muaccel kılabilmesi için tüketiciye tanıması gereken en az süre TKHK m. 19/1'e göre kaç gündür?
    siklar:
      - "On beş gün"
      - "Yedi gün"
      - "Otuz gün"
      - "Altmış gün"
    dogru: 2
    aciklama: |
      TKHK m. 19/1'e göre satıcının hakkını kullanabilmesi için tüketiciye en az otuz gün süre vererek muacceliyet uyarısında bulunması zorunludur. TBK m. 259/3'te aynı süre en az on beş gündür. Yedi gün ise taksitle satışta geri alma (TBK m. 255) ve cayma (TKHK m. 18) süresidir.

  - soru: |
      İstanbul'da yerleşik Ali'nin alıcı olduğu taksitle satış sözleşmesine "uyuşmazlıklar yalnız hakem heyetince çözülecektir" şeklinde bir tahkim kaydı konmuştur. Ali tacir değildir ve malı ticari işletmesi ya da meslekî amacı için almamıştır. Bu kayıt hakkında TBK m. 262'ye göre ne söylenebilir?
    siklar:
      - "Taraf iradesi gereği geçerlidir."
      - "Yerleşim yeri Türkiye'de olan alıcı taksitle satıştan doğacak uyuşmazlıklar için tahkim sözleşmesi yapamaz."
      - "Kayıt yalnız satıcı lehine hükümsüzdür."
      - "Kayıt ancak noterde yapılırsa geçerlidir."
    dogru: 1
    aciklama: |
      TBK m. 262'ye göre yerleşim yeri Türkiye'de olan alıcı, taksitle satış sözleşmesinden doğacak uyuşmazlıklar konusunda yerleşim yerindeki mahkemenin yetkisinden önceden feragat edemeyeceği gibi tahkim sözleşmesi de yapamaz. Noter şartı bu yasağı ortadan kaldırmaz. Alıcı tacir sıfatıyla ya da ticari veya meslekî amaçla alsaydı TBK m. 262 uygulanmazdı (TBK m. 263/4).

olaylar:
  - olay: |
      Emekli öğretmen Kemal, yazlığında kullandığı jeneratörü 01.03.2025'te komşusu Ayşe ile yazılı bir sözleşme yaparak taksitle satar. Kemal mal satışını ticari veya meslekî bir faaliyet olarak yapmamaktadır; Ayşe de jeneratörü evinde kullanmak için almaktadır. Peşin satış bedeli 100.000 TL, taksitle ödeme nedeniyle ilave bedelle birlikte toplam satış bedeli 112.000 TL'dir. Sözleşmeye göre Ayşe, teslim anında 4.000 TL peşinat ödeyecek, kalan 108.000 TL'yi 12 eşit taksitle (aylık 9.000 TL) ödeyecektir. Sözleşmede Kemal'in, Ayşe temerrüde düşerse kalan bedelin tamamını isteme ve sözleşmeden dönme haklarını açıkça saklı tuttuğu yazılıdır.

      Kemal malı 10.03.2025'te teslim eder ve yalnız 4.000 TL peşinat alır. Ayşe ilk üç taksiti öder, 4. taksidi ödemez. Kemal, bunun üzerine kalan bedelin tamamını ister ve sözleşmeden dönmek istediğini bildirir. Ayşe sonraki aylarda 5. ve 6. taksitleri de ödemez.

      1. Sözleşme geçerli midir? Kemal, 6.000 TL'lik peşinat farkını isteyebilir mi?
      2. 4. taksit ödenmediğinde Kemal kalan bedelin tamamını isteyebilir veya sözleşmeden dönebilir mi?
      3. 4., 5. ve 6. taksitler ödenmediğinde Kemal ne yapabilir; hangi şartlara uymalıdır? Sözleşmeden dönerse sonuç ne olur?
    olcut:
      - {tespit: "Taksitle satışın tanımı; yazılı sözleşmenin geçerli olması; işlem tüketici işlemi olmadığından ve alıcı ticari amaçla almadığından TBK hükümlerinin bütünüyle uygulanması", puan: 10, madde: "TBK m. 253"}
      - {tespit: "Asgari peşinat peşin satış bedelinin onda biridir; eksik peşinatla teslim eden satıcının ödenmeyen kısım üzerinde istem hakkını kaybetmesi", puan: 25, madde: "TBK m. 256"}
      - {tespit: "Tek taksit temerrüdünde eşiklerin gerçekleşmemesi; kalan bedelin tamamını isteyememe ve dönememe, yalnız muaccel taksidi isteyebilme", puan: 25, madde: "TBK m. 259/2"}
      - {tespit: "Birbirini izleyen üç taksit temerrüdünde eşik ve hakkın saklı tutulması şartlarının gerçekleşmesi", puan: 15, madde: "TBK m. 259/2"}
      - {tespit: "Hakkı kullanmadan önce en az on beş günlük süre tanıma zorunluluğu; dönme sınırının ayrıca kontrolü", puan: 10, madde: "TBK m. 259/3"}
      - {tespit: "Dönmede karşılıklı iade, kullanım bedeli ve tazminat; zamanında ifada elde edeceğinden fazlasını isteyememe", puan: 15, madde: "TBK m. 260/1"}
    cozum: |
      **Nitelendirme:** Kemal taşınır bir malı bedel ödenmeden önce teslim etmeyi, Ayşe bedeli kısım kısım ödemeyi üstlenmiştir; sözleşme taksitle satıştır (TBK m. 253/1). Satıcı ticari veya meslekî amaçla hareket etmediğinden işlem tüketici işlemi değildir ve TKHK m. 17-19 uygulanmaz. Ayşe de tacir değildir ve malı ticari ya da meslekî amaçla almamıştır; TBK m. 263/4'teki sınırlama işlemez, taksitle satış hükümleri bütünüyle uygulanır. Sorunlar peşinat eksikliği ve taksit temerrüdünün sonuçlarıdır.

      **Hukuki sorunlar:** (1) Sözleşmenin geçerliliği ve eksik peşinatın sonucu; (2) tek taksit temerrüdünde satıcının hakları; (3) üç taksit temerrüdünde hakların kullanılma şartları ve dönmenin sonucu.

      **İlgili hükümler:** TBK m. 253, TBK m. 256, TBK m. 259, TBK m. 260/1.

      **Değerlendirme:**

      *1. Geçerlilik ve peşinat:* Taksitle satış sözleşmesi yazılı şekilde yapılmadıkça geçerli olmaz (TBK m. 253/2); sözleşme yazılıdır ve geçerlidir. Alıcı, peşin satış bedelinin en az onda birini en geç teslim anında peşin ödemekle yükümlüdür (TBK m. 256/1). Peşin satış bedeli 100.000 TL olduğundan asgari peşinat 10.000 TL'dir; sözleşmedeki 4.000 TL bu sınırın altındadır. Asgari peşinatı tamamen almadan malı devreden satıcı, peşinatın ödenmeyen kısmı üzerinde istem hakkını kaybeder (TBK m. 256/3). Kemal eksik 6.000 TL'yi artık isteyemez.

      *2. Tek taksit temerrüdü:* Alıcı taksitleri ödemede temerrüde düşerse satıcı muaccel taksitleri veya kalan bedelin tamamını isteyebilir ya da dönebilir. Ancak bunun için hakkın açık biçimde saklı tutulması ve alıcının kararlaştırılan satış bedelinin en az onda birini oluşturan, birbirini izleyen en az iki taksidi ya da en az dörtte birini oluşturan bir taksidi ya da en son taksidi ödemede temerrüde düşmesi gerekir (TBK m. 259/2). Hak saklı tutulmuştur, ama ödenmeyen 4. taksit 9.000 TL'lik tek bir taksittir; satış bedelinin dörtte birine ulaşmaz ve son taksit de değildir, birbirini izleyen iki taksit de yoktur. Kemal bu aşamada kalan bedelin tamamını isteyemez, dönemez; yalnız muaccel 4. taksidi isteyebilir.

      *3. Üç taksit temerrüdü:* 4., 5. ve 6. taksitler birbirini izleyen taksitlerdir. İki taksidin toplamı 18.000 TL'dir ve satış bedelinin onda birini aşar; eşik gerçekleşmiştir, hak da sözleşmede saklı tutulmuştur. Satıcı, kalan bedelin tamamını isteme veya dönme haklarını kullanmadan önce alıcıya en az on beş günlük süre tanımak zorundadır (TBK m. 259/3). Ayrıca dönme dolayısıyla isteyebileceği miktar ödenmiş taksitler tutarına eşit veya daha fazlaysa satıcı dönemez; bu sınır ayrıca hesaplanmalıdır (TBK m. 259/2). Satıcı sözleşmeden dönerse, mal teslim edildiği için her iki taraf aldığını geri verir; satıcı ayrıca hakkaniyete uygun kullanım bedeli ve malın olağandışı kullanımından doğan değer kaybı için tazminat isteyebilir, ama sözleşme zamanında ifa edilseydi elde edeceğinden fazlasını isteyemez (TBK m. 260/1).

      **Sonuç:**
      - Sözleşme geçerlidir; eksik 6.000 TL peşinat artık istenemez.
      - 4. taksit tek başına kalan bedeli muaccel kılmaya ya da dönmeye yetmez; yalnız o taksit istenebilir.
      - 4., 5. ve 6. taksitlerin ödenmemesiyle şartlar oluşur; satıcı en az on beş gün süre vermek ve dönme sınırını kontrol etmek kaydıyla kalan bedeli isteyebilir ya da dönebilir.
      - Dönmede karşılıklı iade, kullanım bedeli ve tazminat doğar; satıcı zamanında ifada elde edeceğinden fazlasını isteyemez.

  - olay: |
      Galeri sahibi Ayşe, koleksiyoner Burak'la üç tablo ve bir heykel için ayrı sözleşmeler yapar. Tüm sözleşmeler malın Burak tarafından deneyip gözden geçirilerek beğenilmesi koşuluna bağlıdır.

      (a) Birinci tablo (400.000 TL), 01.04.2025'te Burak'ın evinde on gün deneyip beğenmesi için teslim edilir. Burak on gün sonunda hiçbir şey söylemez ve tablo evinde kalır; Ayşe ihtar çekmemiştir.
      (b) İkinci tablo (300.000 TL), Burak'a verilir. Burak tabloyu ikinci gün "beğenmedim" diyerek iade eder. Ayşe, "gerekçe göstermediğin için bedeli öde" der.
      (c) Üçüncü tablo (200.000 TL), beş günlük deneme için teslim edilir. Burak üçüncü gün hiçbir çekince koymadan bedelin 100.000 TL'sini havale eder, dördüncü gün tabloyu beğenmeyip iade etmek ister.
      (d) Heykel (150.000 TL) galeride kalır; Burak yedi gün içinde galeride inceleyip kararını bildirecektir. Burak yedi gün içinde hiçbir açıklama yapmaz.

      1. Sözleşmelerin türü nedir? (a)'daki tablonun mülkiyeti kimdedir ve on günün sonunda durum nedir?
      2. (b)'de Ayşe'nin bedel istemi yerinde midir?
      3. (c)'de Burak iade edebilir mi?
      4. (d)'de sessizliğin sonucu nedir?
    olcut:
      - {tespit: "Sözleşmelerin beğenme koşuluyla satış olarak nitelendirilmesi; koşulun geciktirici niteliği", puan: 10, madde: "TBK m. 249"}
      - {tespit: "Zilyetlik geçse de mülkiyetin koşul gerçekleşene kadar satıcıda kalması", puan: 15, madde: "TBK m. 250/2"}
      - {tespit: "Teslim edilmiş malda süre içinde sessizlik: beğenme koşulunun gerçekleşmesi; deneme satıcının yanında olmadığından TBK m. 251'in değil TBK m. 252/1'in uygulanması", puan: 20, madde: "TBK m. 252/1"}
      - {tespit: "Alıcının sebep göstermeksizin geri vermekte serbest olması; Ayşe'nin istemin reddi", puan: 15, madde: "TBK m. 250/1"}
      - {tespit: "Çekincesiz kısmi ödemenin beğenme koşulunu gerçekleştirmesi; Burak'ın iade hakkını yitirmesi", puan: 20, madde: "TBK m. 252/2"}
      - {tespit: "Deneme satıcının yanında yapılıyorsa alıcının sessizliği sonucu satıcının bağlılıktan kurtulması", puan: 20, madde: "TBK m. 251/1"}
    cozum: |
      **Nitelendirme:** Sözleşmeler, alıcının satılanı deneyerek veya gözden geçirerek beğenmesi koşuluyla yapıldığı için beğenme koşuluyla satıştır (TBK m. 249). Dört olayda da asıl sorun, alıcının davranışının (sessizlik, iade, ödeme) beğenme koşulunu nasıl etkilediğidir.

      **Hukuki sorunlar:** (1) Mülkiyet ve koşulun niteliği; (2) alıcının iade serbestisi; (3) sessizliğin sonucu, denemenin nerede yapıldığına göre; (4) çekincesiz ödemenin etkisi.

      **İlgili hükümler:** TBK m. 249, TBK m. 250, TBK m. 251, TBK m. 252.

      **Değerlendirme:**

      *1. (a) Mülkiyet ve sessizlik:* Beğenme koşulu geciktirici niteliktedir. Tablo Burak'ın zilyetliğine geçmiş olsa bile mülkiyeti, beğenme koşulunun gerçekleştiği ana kadar Ayşe'de kalır (TBK m. 250/2). Deneme satıcının yanında yapılmadığı, tablo alıcıya teslim edildiği için TBK m. 251 değil TBK m. 252/1 uygulanır: Satılan alıcıya verilmişse alıcı, sözleşme veya âdete göre gereken süre içinde beğenmediğini hemen bildirmez veya geri vermezse beğenme koşulu gerçekleşir. Süre sözleşmede (on gün) belirlenmiştir; Burak on günün sonunda sustuğu ve tabloyu geri vermediği için ayrıca ihtara gerek kalmadan koşul gerçekleşmiştir. Yargıtay da alıcıya teslim edilmiş malda deneme süresinin geçirilmesini aynı şekilde değerlendirmiştir. Bu andan itibaren satış tam etki doğurur ve tablonun mülkiyeti Burak'a geçer; 400.000 TL bedel istenebilir.

      *2. (b) İade serbestisi:* Alıcı, satılanı kabul etmekte veya hiçbir sebep göstermeksizin geri vermekte serbesttir (TBK m. 250/1). Burak tabloyu ikinci günde iade ettiğine göre beğenme koşulu gerçekleşmemiştir. "Gerekçe göstermedin" savunması kanunda karşılığı olmayan bir gerekçedir; Ayşe bedeli isteyemez.

      *3. (c) Çekincesiz ödeme:* Alıcının herhangi bir çekince belirtmeksizin satış bedelinin tamamını veya bir kısmını ödemesiyle beğenme koşulu gerçekleşmiş olur (TBK m. 252/2). Burak üçüncü gün bedelin 100.000 TL'sini çekince koymadan ödediğinden koşul gerçekleşmiştir; dördüncü günde "beğenmedim" diyerek iade edemez. Ödemenin kısmî olması sonucu değiştirmez.

      *4. (d) Satıcının yanında deneme:* Heykelin galeride, yani satıcının yanında incelenmesi kararlaştırılmıştır. Alıcı sözleşmeye göre gerekli süre içinde kabul edip etmediğini açıklamazsa satıcı sözleşmeyle bağlılıktan kurtulur (TBK m. 251/1). Burak yedi gün içinde hiçbir şey açıklamadığından Ayşe heykel bakımından sözleşmeyle bağlı değildir ve heykeli başkasına satabilir.

      **Sonuç:**
      - Dört sözleşme de beğenme koşuluyla satıştır; zilyetlik geçse bile mülkiyet koşul gerçekleşene kadar satıcıdadır.
      - (a)'da tablo Burak'a teslim edilmiş olduğundan sessizlik beğenme koşulunu gerçekleştirmiştir.
      - (b)'de Burak sebepsiz iade edebilir; Ayşe'nin bedel istemi yerinde değildir.
      - (c)'de çekincesiz kısmi ödeme koşulu gerçekleştirmiştir; Burak iade edemez.
      - (d)'de deneme satıcının yanında olduğundan sessizlik Ayşe'yi bağlılıktan kurtarır.

kartlar:
  - on: "Örnek üzerine satış nedir? (TBK m. 247)"
    arka: "Malın, alıcıya veya üçüncü kişiye bırakılan örneğe ya da tespit edilen bir mala uygun olması üzerinde anlaşılarak yapılan satıştır."
  - on: "Örnek üzerine satışta ispat yükü kimdedir? (TBK m. 248)"
    arka: "Kendisine örnek verilen taraf, elindeki örneğin verilen örnek olduğunu ispatla yükümlü değildir (karşı taraf aksini ispatlayabilir). Örnek alıcıdayken bozulur veya yok olursa kusursuz olsa bile uygunsuzluğu alıcı ispatlar."
  - on: "Beğenme koşuluyla satışta mülkiyet kimde kalır? (TBK m. 250)"
    arka: "Zilyetlik alıcıya geçse bile beğenme koşulunun gerçekleştiği ana kadar satıcıda. Alıcı hiçbir sebep göstermeden malı geri verebilir."
  - on: "Beğenme koşulunda susma: TBK m. 251 ve TBK m. 252 farkı?"
    arka: "Deneme satıcının yanında ise alıcının sessizliği ret (satıcı bağlılıktan kurtulur). Mal denenmeden alıcıya verilmişse sessizlik kabul (beğenme koşulu gerçekleşir)."
  - on: "Beğenme koşulu sessizlik dışında nasıl gerçekleşir? (TBK m. 252/2)"
    arka: "Alıcının çekincesiz ödeme (tamamı veya bir kısmı) yapması ya da malı deneme amacını aşacak biçimde kullanması."
  - on: "Taksitle satışın şekli ve konusu? (TBK m. 253)"
    arka: "Taşınır mal; yazılı şekil olmadıkça geçerli olmaz. Ticari faaliyette on bir unsur yazılır; temerrüt faizi yasal faizin yüzde otuz fazlasını geçemez."
  - on: "Taksitle satışta yedi günlük geri alma hakkı? (TBK m. 255)"
    arka: "Sözleşme nüshanın alınmasından yedi gün sonra hüküm doğurur. Yazılı bildirim yapılır, son gün postaya verilmesi yeter. Önceden feragat edilemez, cayma parası istenemez."
  - on: "Asgari peşinat ve ödeme süresi? (TBK m. 256)"
    arka: "Peşin satış bedelinin en az onda biri en geç teslimde; kalan bedel kuruluştan itibaren üç yıl içinde. Eksik peşinatla teslim eden satıcı ödenmeyen kısım üzerinde istem hakkını kaybeder."
  - on: "Taksitle satışta erken ödeme hakkı? (TBK m. 258)"
    arka: "Taksitler kambiyo senedine bağlanmamışsa alıcı kalanı her zaman bir defada ödeyebilir; ilave bedelin ödenmemiş taksitlere isabet eden kısmı yarısından az olmamak üzere indirilir."
  - on: "Taksit temerrüdünde kalan bedeli istemenin ve dönmenin şartları? (TBK m. 259)"
    arka: "Hakkın açıkça saklı tutulması; bedelin onda birini oluşturan ardışık en az iki taksit ya da dörtte birini oluşturan bir taksit ya da son taksit temerrüdü; en az on beş gün süre. Ödenmiş taksitler dönme sınırını belirler."
  - on: "Dönmenin sonuçları? (TBK m. 260)"
    arka: "Devirden sonra karşılıklı iade, kullanım bedeli ve değer kaybı tazminatı; zamanında ifada elde edeceğinden fazlası istenemez. Peşinat temerrüdünde ceza koşulu peşin satış bedelinin yüzde onunu aşamaz."
  - on: "TBK ve TKHK taksitle satış farkları?"
    arka: "TBK'da muacceliyet için en az 15 gün süre ve yedi günlük geri alma; TKHK'da en az 30 gün uyarı (TKHK m. 19) ve yedi gün cayma (TKHK m. 18). Tacir veya ticari amaçlı alıcıda yalnız TBK m. 259/2, TBK m. 260/1 ve TBK m. 261 uygulanır (TBK m. 263/4)."
