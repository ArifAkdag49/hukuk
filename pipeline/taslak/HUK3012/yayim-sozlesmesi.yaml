ozet: |
  **Bu konu neyi cevaplıyor?** Bir yazar eserini yayınevine verdiğinde hukuken ne olur? Sözleşme hangi şekilde yapılır, haklar yayımcıya hangi ölçüde geçer, yayımcı kaç basım yapabilir, bedel nasıl belirlenir, eser ya da basılan nüshalar yok olursa kim sorumlu olur ve sözleşme nasıl sona erer?

  - **Tanım (TBK m. 487):** Eser sahibi (veya halefi) eseri yayımlanmak üzere yayımcıya bırakmayı, yayımcı onu çoğaltarak yayımlamayı üstlenir. Bedel zorunlu unsur değildir (TBK m. 496/1).
  - **Şekil (TBK m. 488):** Geçerlilik yazılı şekle bağlıdır. Fikir ve sanat eserleri mevzuatı mali haklara dair sözleşmelerde hakların ayrı ayrı gösterilmesini de arar (5846 sayılı Kanun m. 52).
  - **Haklar ve sorumluluk (TBK m. 489):** Haklar sözleşmenin ifasının gerektirdiği ölçüde ve süreyle geçer. Yayımlatan, yayımlatma hakkının ve (eser korunuyorsa) telif hakkının bulunmamasından sorumludur; eserin başkasına bırakıldığını ya da yayımlandığını sözleşmeden önce bildirmek zorundadır.
  - **Tasarruf yasağı (TBK m. 490):** Süre ya da baskı adedinin tükenmesi için alışılmış süre dolmadan yayımlatan yayımcının zararına tasarrufta bulunamaz. Süreli yayınlardaki kısa yazılar her zaman başka yerde yayımlatılabilir; toplama eser bölümleri ve uzun yazılar ise yayımın bitiminden başlayarak üç ay geçmedikçe yeniden yayımlatılamaz.
  - **Basım (TBK m. 491):** Basım sayısı belirtilmemişse yayımcının yalnız bir basım hakkı vardır. Birkaç ya da bütün yeni basımlar için yetki verilmişken baskı tükenir ve yayımcı yeni basımı ihmal ederse yayımlatan uygun süre verir; süre içinde basım yapılmazsa sözleşmeden cayabilir.
  - **Yayımcının borçları (TBK m. 492 ve 495):** Eseri kısaltma, ekleme ve değişiklik yapmadan çoğaltır; tanıtım ve dağıtımı yapar; satış fiyatını eserin satılmasını güçleştirmemek koşuluyla belirler. Eser sahibine iyileştirme, haleflerine güncelleştirme imkânı vermeden yeni basım yapamaz (TBK m. 493). Çeviri hakkı yalnız sözleşmede açıkça belirtilmişse geçer (TBK m. 495).
  - **Bedel (TBK m. 496 ve 497):** Aksi kararlaştırılmadıkça yayımlatan bedel isteyebilir; miktar belli değilse hâkim belirler. Bedel, eserin basımından ve satışa hazır duruma getirilmesinden sonra ödenir; satışa bağlıysa yayımcı satış hesaplarını tutar; yayımlatan teamüle uygun bedelsiz nüsha alır.
  - **Yok olma (TBK m. 498 ve 499):** Eser teslimden sonra beklenmedik hâlle yok olsa bile yayımcı bedeli öder. Basılan nüshalar satıştan önce yok olursa yayımcı ayrıca bedel ödemeksizin kendi gideriyle yeniden basar.
  - **Sona erme (TBK m. 500):** Eser sahibi eseri tamamlamadan ölür veya yeteneğini yitirirse sözleşme kendiliğinden sona erer (hâkim devamına karar verebilir). Yayımcı iflas ederse yayımlatan eseri başkasına verebilir; muaccel olmayan borç için güvence gösterilmişse veremez.
  - **Sipariş üzerine yayım (TBK m. 501):** Yayımcının belirlediği plana göre eser üretenler yalnız kararlaştırılan ücrete hak kazanır ve mali haklar yayımcıya ait olur.

anlatim: |
  ## 0. Konunun haritası

  Yayım sözleşmesi, borçlar hukuku özel hükümlerinde fikir ve sanat eserlerinin yayımlanmasını düzenleyen küçük ama sınavda sevilen bir sözleşmedir. Bu konuda iki şeye dikkat et: (1) Hükümler, hangi tarafın ne zaman, hangi ölçüde sorumlu olduğunu dengeli biçimde dağıtır; (2) sorular genellikle basım sayısı, çeviri hakkı, yok olma ve sipariş üzerine yayımda toplanır.

  | Madde | Konu | Anahtar |
  |---|---|---|
  | TBK m. 487 | Tanım | Yayımlatan, yayımcı |
  | TBK m. 488 | Şekil | Yazılı |
  | TBK m. 489 | Haklar, sorumluluk, bildirim | Amaca göre devir |
  | TBK m. 490 | Tasarruf yasağı | Kısa ve uzun yazı |
  | TBK m. 491 | Basım sayısı | Tek basım |
  | TBK m. 492 ve 493 | Yayımcının borçları, düzeltme | Çoğaltma, tanıtım, iyileştirme |
  | TBK m. 494 ve 495 | Birarada basım, çeviri | Açık belirtme |
  | TBK m. 496 ve 497 | Bedel | Satış hesapları, bedelsiz nüsha |
  | TBK m. 498 ve 499 | Yok olma | Eser, basılan nüsha |
  | TBK m. 500 ve 501 | Sona erme, sipariş | Ölüm, iflas, plan |

  Olay sorusunda sırayla sor: (1) Sözleşme yayım sözleşmesi mi, yazılı mı? (2) Haklar hangi ölçüde geçti? (3) Yayımcı kaç basım yapabilir? (4) Bedel var mı, ne zaman ödenir? (5) Yok olma ya da sona erme hâli var mı?

  ## 1. Tanım ve unsurlar (TBK m. 487)

  **Yayım sözleşmesi**, bir fikir ve sanat eseri sahibinin veya halefinin eseri yayımlanmak üzere yayımcıya bırakmayı, yayımcının da onu çoğaltarak yayımlamayı üstlendiği sözleşmedir (TBK m. 487).
  - **Yayımlatan:** Eser sahibi ya da halefi (mirasçısı, hak devralanı).
  - **Yayımcı:** Eseri çoğaltıp yayımlamayı üstlenen kişi.
  - **Asli edimler:** Eseri bırakmak ve çoğaltarak yayımlamak. Telif bedeli sözleşmenin zorunlu unsuru değildir; aksi kararlaştırılmadıkça yayımlatan bedel isteyebilir (TBK m. 496/1).

  | Özellik | Eser sözleşmesi | Yayım sözleşmesi |
  |---|---|---|
  | Asli edim | Eser meydana getirmek | Eseri çoğaltıp yayımlamak |
  | Bedel | Unsurdur (TBK m. 470) | Zorunlu unsur değildir (TBK m. 496/1) |
  | Şekil | Kural olarak serbest | Yazılı geçerlilik şartı (TBK m. 488) |

  > ⚠️ **Sınavda dikkat:** Yazar kendi parasıyla matbaaya kitap bastırırsa bu yayım değil, matbaayla yapılan **eser sözleşmesidir** (TBK m. 470). Yayım sözleşmesinde yayımcı eseri yayımlama (tanıtma, dağıtma, satma) riskini üstlenir.

  > **Örnek:** Yazar Ayşe, romanını yazılı sözleşmeyle Mavi Yayınevi'ne bırakır; yayınevi romanı basıp piyasaya sunmayı üstlenir. Bu bir yayım sözleşmesidir (TBK m. 487).

  ## 2. Şekil (TBK m. 488)

  Yayım sözleşmesinin geçerliliği **yazılı şekilde yapılmış olmasına** bağlıdır (TBK m. 488). Sözlü anlaşma geçerli bir yayım sözleşmesi doğurmaz.

  Fikir ve sanat eserleri mevzuatıyla bağlantı yalnız şudur: Mali haklara dair sözleşmelerin yazılı olması ve konuları olan hakların **ayrı ayrı gösterilmesi** şarttır (5846 sayılı Kanun m. 52). Bu hükmün TBK m. 488 ile ilişkisi doktrinde tartışılır.

  ## 3. Hakların geçişi ve yayımlatanın sorumluluğu (TBK m. 489)

  ### 3.1 Amaca göre devir (TBK m. 489/1)
  Yayım sözleşmesiyle eser sahibinin hakları, **sözleşmenin ifasının gerektirdiği ölçüde ve süreyle** yayımcıya geçer. Yani yayımcı, yayım amacının gerektirdiğinden fazlasını kazanmaz.

  > **Örnek:** Elif'in yayınevi ile beş yıllık ve bin adetlik bir basım sözleşmesi varsa yayınevi, yalnız bu süre ve bu amaç kadar çoğaltma ve yayma hakkını elde eder. Sözleşme bittiğinde haklar yayımcıda kalmaz.

  ### 3.2 Hak yokluğundan sorumluluk (TBK m. 489/2)
  Yayımlatan, yayımcıya karşı sözleşmenin kurulduğu anda eseri **yayımlatma hakkının bulunmamasından** sorumludur. Eser korunuyorsa **telif hakkının olmamasından** da sorumludur.

  > **Örnek:** Berk, romanının yayım hakkını bir yıl önce başka bir yayınevine devretmiştir. Bunu söylemeden Nil Yayınevi ile sözleşme yaparsa Nil'e karşı sorumlu olur (TBK m. 489/2).

  ### 3.3 Bildirim yükü (TBK m. 489/3)
  Eserin tamamı ya da bir bölümü yayımlanmak üzere **başka bir yayımcıya bırakılmış** veya **yayımlatanın bilgisi altında yayımlanmış** ise yayımlatan, sözleşmenin yapılmasından **önce** bunu karşı tarafa bildirmek zorundadır.

  ## 4. Yayımlatanın tasarruf yasağı (TBK m. 490)

  | Durum | Kural | Madde |
  |---|---|---|
  | Süre ya da alışılmış süre dolmadan | Yayımcının zararına tasarruf yasak | TBK m. 490/1 |
  | Süreli yayında kısa yazı | Her zaman başka yerde yayımlatılabilir | TBK m. 490/2 |
  | Toplama eserdeki bölüm, dergide uzun yazı | Yayımın bitiminden üç ay geçmeden yeniden yayımlatılamaz | TBK m. 490/3 |

  TBK m. 490/1'e göre yayımlatan, kararlaştırılan süre sona ermedikçe ya da süre belirlenmemişse kararlaştırılan baskı adedinin tükenmesi için **alışılmış süre geçmedikçe**, eserin tamamı veya bir bölümü üzerinde yayımcının zararına olacak biçimde tasarrufta bulunamaz.

  > **Örnek:** Gazetede kısa bir köşe yazısı yayımlanan yazar, yazıyı dilediği zaman başka yerde de yayımlatabilir (TBK m. 490/2). Dergide uzun bir makalesi çıkan yazar ise yayımın bitmesinden başlayarak üç ay geçmeden bu makaleyi yeniden yayımlatamaz (TBK m. 490/3).

  > 💡 **Püf nokta:** Kısa yazı için süre beklenmez; uzun yazı ve toplama eser bölümü için "üç ay" beklenir.

  ## 5. Basım sayısı (TBK m. 491)

  Üç kural vardır:
  1. **Tek basım kuralı (TBK m. 491/1):** Sözleşmede basım sayısı belirtilmemişse yayımcının **ancak bir basım** yapma hakkı vardır.
  2. **Süre ya da baskı adedi (TBK m. 491/2):** Taraflar sözleşmenin süresini veya baskı adedini kararlaştırmak zorundadır.
  3. **Yeni basımın ihmali (TBK m. 491/3):** Sözleşmede yayımcıya belirli birkaç basım veya bütün yeni basımları yapma yetkisi verilmiş, baskı adedi tükenmiş ve yayımcı yeni bir basım yapmayı ihmal etmişse yayımlatan yayımcıya **uygun bir süre** verir. Süre içinde basım gerçekleşmezse yayımlatan **sözleşmeden cayabilir**.

  > **Örnek:** Yazar Emre ile yayınevi arasındaki yazılı sözleşmede yayımcıya "bütün yeni basımları yapma" yetkisi verilmiştir. Baskı tükenir ve yayınevi uzun süre yeni basım yapmaz. Emre yayınevine uygun bir süre verir; süre dolunca basım yoksa sözleşmeden cayabilir (TBK m. 491/3).

  Yargıtay'ın incelediği bir olayda, baskı adedi belirlenmemiş sözleşmelerde ödenen ücretin yalnız ilk baskıya ilişkin sayıldığı ve sonraki baskılar için eser sahibinin yeniden ücrete hak kazandığı kabul edilmiştir (kararlar bölümüne bak). Başka bir olayda ise sözleşme baskı tükendiğinde yayıncıya yalnız yeniden yayınlama "hakkı" tanıdığı için, yeni baskı yapılmaması tazminat doğurmamıştır.

  ## 6. Yayımcının borçları (TBK m. 492-495)

  ### 6.1 Çoğaltma, tanıtım ve dağıtım (TBK m. 492)
  Yayımcı, eseri **hiçbir kısaltma, ekleme ve değişiklik yapmaksızın** uygun biçimde çoğaltmakla yükümlüdür. Ayrıca satışın artırılması için gerekli **tanıtım ve dağıtımı** yapmak ve bu konuda her türlü önlemi almak zorundadır (TBK m. 492/1). **Satış fiyatını** yayımcı belirler; ancak eserin satılmasını güçleştirmemelidir (TBK m. 492/2).

  ### 6.2 Düzeltme ve iyileştirme (TBK m. 493)
  Yayımcının menfaatlerini zedelememek ve sorumluluğunu artırmamak koşuluyla:
  - **eser sahibi** eserde düzeltme ve iyileştirme,
  - **halefleri** ise yalnız güncelleştirme yapabilir.

  Düzeltme ve iyileştirme gerektirdiği hâlde sözleşmede öngörülmemiş giderleri **yayımlatan** karşılar (TBK m. 493/1). Yayımcı, eser sahibine iyileştirme, haleflerine güncelleştirme imkânı vermeden yeni bir basım yapamaz ve eseri çoğaltamaz (TBK m. 493/2).

  ### 6.3 Birarada basım ve ayrı yayım (TBK m. 494)
  Hak, verilen biçimle sınırlıdır:
  - Birden çok eseri **ayrı ayrı** yayımlama hakkı, yayımcıya bunların **bir arada** basılması yetkisini vermez (TBK m. 494/1).
  - Bütün eserleri veya bir türünü **birarada** yayımlama hakkı, her birini **ayrı ayrı** basıp yayma hakkı vermez (TBK m. 494/2).

  > **Örnek:** Şair Deniz, beş şiir kitabını ayrı ayrı basma hakkını yayımcıya vermiştir. Yayımcı beşini tek ciltte külliyat olarak basamaz (TBK m. 494/1).

  ### 6.4 Çeviri hakkı (TBK m. 495)
  Çeviri hakkının yayımcıya geçebilmesi, bunun sözleşmede **açıkça belirtilmiş** olmasına bağlıdır (TBK m. 495). Sözleşme çeviri hakkı hakkında susuyorsa hak yayımlatanda kalır.

  > ⚠️ **Sınavda dikkat:** "Her türlü hak" ya da "süre ve yer sınırı olmaksızın" gibi genel ifadeler sınavda çeviri hakkı için yeterli değildir; kanun açık belirtmeyi arar.

  ## 7. Bedel (TBK m. 496 ve 497)

  ### 7.1 Bedelin belirlenmesi (TBK m. 496)
  - Aksi kararlaştırılmadıkça yayımlatan bedel isteyebilir (TBK m. 496/1).
  - Ödenecek miktar belli değilse bedel **hâkim** tarafından belirlenir (TBK m. 496/2).
  - Yayımcının birden fazla basım yapma hakkı varsa, ilk basım için kararlaştırılan bedel ve diğer koşulların sonraki basımlar için de uygulanacağı kabul edilmiş sayılır (TBK m. 496/3).

  ### 7.2 Ödeme zamanı, satış hesapları ve bedelsiz nüsha (TBK m. 497)
  - **Ödeme zamanı:** Eser bütün olarak yayımlanacaksa tamamının; cilt, fasikül, forma gibi bölümler hâlinde yayımlanacaksa her bölümün **basımından ve satışa hazır duruma getirilmesinden sonra** ödenir (TBK m. 497/1).
  - **Satış hesapları:** Bedel satış miktarına bağlanmışsa yayımcı satış hesaplarını tutmak, çıkarmak ve teamüle uygun ispat edici belgeleri hazırlamakla yükümlüdür (TBK m. 497/2).
  - **Bedelsiz nüsha:** Aksi kararlaştırılmadıkça yayımlatan, teamül uyarınca verilmesi gereken miktarda bedelsiz alma hakkına sahiptir (TBK m. 497/3).

  > **Örnek:** Yazar Zeynep ile yayınevi, her satılan kitap için fiyatın yüzde 10'unu telif olarak kararlaştırır. Yayınevi satış hesaplarını tutmak ve Zeynep'e ispat edici belgeler sunmakla yükümlüdür (TBK m. 497/2). Zeynep ayrıca teamüle uygun sayıda yazar nüshasını bedelsiz alabilir (TBK m. 497/3).

  ## 8. Sona erme ve yok olma

  ### 8.1 Eserin yok olması (TBK m. 498)
  Eser yayımcıya **teslimden sonra** beklenmedik hâl sonucu yok olsa bile yayımcı **bedeli ödemekle yükümlüdür** (TBK m. 498/1). Eser sahibinin elinde başka bir örnek varsa onu yayımcıya vermesi gerekir. Başka örnek yoksa ama eser **az bir çabayla** yeniden meydana getirilebilecekse eser sahibi eseri yeniden meydana getirip teslim etmekle yükümlüdür. Her iki durumda da eser sahibi **uygun bir karşılık** isteyebilir (TBK m. 498/2).

  > 💡 **Püf nokta:** Eser sözleşmesinde teslimden önce beklenmedik olayla yok olan eserin ücreti ödenmez (TBK m. 483/1). Yayımda ise **teslimden sonra** yok olsa bile yayımcı bedeli öder; çünkü risk teslimle yayımcıya geçmiştir.

  ### 8.2 Basılanın yok olması (TBK m. 499)
  Tamamlanmış baskının tamamı ya da bir bölümü **satışa sunulmadan önce** beklenmedik hâl sonucu yok olursa yayımcı, yayımlatana **ayrıca bir bedel ödemeksizin**, yok olan miktarı **gideri kendisine ait olmak üzere** yeniden basabilir (TBK m. 499/1). Aşırı masraf gerektirmeksizin yok olanların yerine yenilerini koyabilecekse bunu yapmakla **yükümlüdür** (TBK m. 499/2).

  | | TBK m. 498 | TBK m. 499 |
  |---|---|---|
  | Yok olan | Eserin kendisi (müsvedde, dosya) | Basılan nüshalar |
  | Bedel | Yayımcı yine öder | Ek bedel ödenmez |
  | Ek yük | Eser sahibi yedeğini verir | Yayımcı kendi gideriyle yeniden basar |

  ### 8.3 Kişisel sebeplerle sona erme ve yayımcının iflası (TBK m. 500)
  - **Eser sahibinin ölümü, yetenek kaybı, kusursuz imkânsızlık:** Eser sahibi eseri tamamlamadan ölür, tamamlama yeteneğini yitirir ya da kendi kusuru olmaksızın tamamlaması imkânsızlaşırsa sözleşme **kendiliğinden sona erer.** Sözleşmenin tamamı ya da bir bölümü yerine getirilebilir ve hakkaniyete uygunsa hâkim ilişkinin devamına ve gereken değişikliklere karar verebilir (TBK m. 500/1).
  - **Yayımcının iflası:** Yayımcı iflas ederse yayımlatan eseri başka bir yayımcıya verebilir. Ancak iflas anında muaccel olmamış borcun yerine getirileceği konusunda **güvence** gösterilmişse yayımlatan eseri başkasına veremez (TBK m. 500/2).

  > **Örnek:** Yayımcı Delta iflas eder. Güvence gösterilmemişse yazar eserini başka yayımcıya verebilir. Delta'nın alacaklıları muaccel olmamış telif borcu için güvence sunarsa yazar eseri başkasına veremez (TBK m. 500/2).

  ## 9. Sipariş üzerine yayım (TBK m. 501)

  Bir veya birkaç kişi, **yayımcının belirlediği plana göre** bir eser meydana getirmeyi üstlenirlerse, **sadece sözleşmeyle kararlaştırılan ücrete** hak kazanırlar. Bu durumda sözleşme konusu **mali haklar yayımcıya** ait olur (TBK m. 501).

  > **Örnek:** Yayınevi P, kendi hazırladığı plana göre KPSS Tarih soru bankası yazması için öğretmen Özlem'le yazılı anlaşır ve 80.000 TL öder. Özlem yeni baskılar için ek telif isteyemez; mali haklar yayınevindedir (TBK m. 501).

  Yayımcı mali hakları kullanır ama eser sahibinin **adının belirtilmesi** gibi manevi hakları eser sahibinde kalır (5846 sayılı Kanun m. 15). Mali hakların kullanımı yayımcının eser sahibiyle yaptığı sözleşmeye bağlıdır (5846 sayılı Kanun m. 18). Yargıtay, sipariş üzerine yayımda bile adın belirtilmesi iddiasının ayrıca değerlendirilmesi gerektiğini belirtmiştir.

  ## 10. Denetim şeması

  1. **Sözleşme yayım sözleşmesi mi?** Eser sahibi eseri yayımcıya bıraktı mı, yayımcı çoğaltıp yayımlamayı üstlendi mi? Yoksa matbaayla eser sözleşmesi mi (TBK m. 487 ve TBK m. 470)?
  2. **Yazılı mı?** (TBK m. 488). Mali hakların ayrı ayrı gösterilmesi de var mı (5846 sayılı Kanun m. 52)?
  3. **Hak geçişi ve sorumluluk:** Haklar hangi ölçüde ve süreyle geçti? Yayımlatan hak yokluğundan sorumlu mu, bildirim yaptı mı (TBK m. 489)? Tasarruf yasağı var mı (TBK m. 490)?
  4. **Basım:** Basım sayısı belirtilmiş mi, tek basım kuralı işliyor mu (TBK m. 491)? Düzeltme, birarada basım, çeviri hakkı soruları (TBK m. 493-495).
  5. **Bedel:** Bedel var mı, miktarı, ödeme zamanı, satış hesapları, bedelsiz nüsha (TBK m. 496 ve TBK m. 497).
  6. **Yok olma ve sona erme:** Eser mi, basılan nüsha mı yok oldu (TBK m. 498 ve TBK m. 499)? Ölüm, yetenek kaybı, iflas (TBK m. 500)?
  7. **Sipariş üzerine yayım mı?** Plan yayımcıya mı ait, mali haklar kime geçti, manevi haklar saklı mı (TBK m. 501)?

kritik: |
  - 📌 Yayım sözleşmesi, eser sahibinin veya halefinin eseri yayımlanmak üzere bırakması, yayımcının çoğaltarak yayımlamayı üstlenmesidir; bedel zorunlu unsur değildir (TBK m. 487 ve TBK m. 496/1).
  - 📌 Geçerlilik **yazılı şekle** bağlıdır (TBK m. 488). Mali haklara dair sözleşmelerde hakların ayrı ayrı gösterilmesi de aranır (5846 sayılı Kanun m. 52).
  - 📌 Haklar **sözleşmenin ifasının gerektirdiği ölçüde ve süreyle** yayımcıya geçer (TBK m. 489/1).
  - ⚠️ Yayımlatan hak (ve korunan eserde telif hakkı) yokluğundan sorumludur; eserin başkasına bırakıldığını ya da yayımlandığını sözleşmeden **önce** bildirmek zorundadır (TBK m. 489/2 ve TBK m. 489/3).
  - ⚠️ Süreli yayında **kısa yazı** her zaman başka yerde yayımlatılabilir; toplama eserdeki bölümler ve dergide çıkan **uzun yazılar** için yayımın bitiminden başlayarak **üç ay** beklenir (TBK m. 490/2 ve TBK m. 490/3).
  - 📌 Basım sayısı belirtilmemişse yayımcının **ancak bir basım** hakkı vardır; taraflar süreyi veya baskı adedini kararlaştırmak zorundadır (TBK m. 491/1 ve TBK m. 491/2).
  - 📌 Yayımcı birkaç ya da bütün yeni basımları yapmaya yetkiliyse ve baskı tükenmiş iken yeni basımı ihmal ederse yayımlatan **uygun süre verir**; süre sonunda basım yoksa **sözleşmeden cayabilir** (TBK m. 491/3).
  - 📌 Satış fiyatını **yayımcı** belirler, ama eserin satılmasını güçleştirmemelidir (TBK m. 492/2).
  - ⚠️ **Eser sahibi** düzeltme ve iyileştirme, **halefleri** yalnız güncelleştirme yapabilir; yayımcı bu imkânı vermeden yeni basım yapamaz (TBK m. 493).
  - ⚠️ Ayrı ayrı yayım hakkı birarada basım yetkisi vermez, birarada yayım hakkı ayrı ayrı basım yetkisi vermez (TBK m. 494).
  - ⚠️ **Çeviri hakkı** yalnız sözleşmede **açıkça belirtilmişse** yayımcıya geçer (TBK m. 495).
  - 📌 Aksi kararlaştırılmadıkça yayımlatan bedel isteyebilir; miktarı belli değilse hâkim belirler; birden fazla basım hakkı varsa ilk basımın bedeli ve koşulları sonraki basımlara da uygulanır (TBK m. 496). Bedelsiz nüsha hakkı teamüle göredir (TBK m. 497/3).
  - 📌 Eser **teslimden sonra** beklenmedik hâlle yok olsa bile yayımcı bedeli öder; yedek örnek varsa eser sahibi verir (TBK m. 498). **Basılan nüshalar** satıştan önce yok olursa yayımcı ek bedelsiz, kendi gideriyle yeniden basar (TBK m. 499).
  - 📌 Eser sahibinin ölümü ya da kusursuz imkânsızlığında sözleşme kendiliğinden sona erer; yayımcı iflas ederse yayımlatan eseri başkasına verebilir, ama muaccel olmayan borç için güvence gösterilmişse veremez (TBK m. 500).
  - 📌 Sipariş üzerine yayımda yalnız kararlaştırılan ücret hak edilir ve mali haklar yayımcıya ait olur (TBK m. 501); manevi haklar eser sahibinde kalır (5846 sayılı Kanun m. 15).

doktrin: |
  ### TBK m. 488 ile 5846 sayılı Kanun m. 52 ilişkisi
  Bir görüşe göre TBK m. 488 yazılı şekli yeterli görmüştür; çoğaltma ve yayma hakları TBK m. 489/1 gereği, sözleşmenin ifasının gerektirdiği ölçüde kanunen yayımcıya geçer. Karşı görüşe göre 5846 sayılı Kanun m. 52 özel hükümdür; korunan eserde devredilen mali hakların yazılı metinde ayrı ayrı belirtilmesi geçerlilik şartıdır. Yargıtay iki kuralı birlikte uygular; hakların tek tek sayılıp sayılmadığına bakar.

  ### Süre ve baskı adedi belirlenmemişse sözleşmenin akıbeti
  TBK m. 491/2, süre veya baskı adedinin kararlaştırılmasını zorunlu kılar. Bir görüşe göre ikisi de belirlenmemişse sözleşme emredici hükme aykırı olduğu için geçersizdir. Diğer görüşe göre sözleşme geçersiz sayılmaz; TBK m. 491/1 gereği yayımcının yalnız bir basım hakkı olduğu kabul edilir ve ödenen ücret bu basıma ilişkin sayılır. Uygulamada Yargıtay'ın onadığı kararlarda ikinci yaklaşım görülür: "süre, yer ve sayı bakımından sınırlama olmaksızın" denilmiş olsa bile baskı adedi belirtilmemişse yayımcıya tek basım hakkı tanınır ve sonraki baskılar için eser sahibi yeniden ücrete hak kazanır.

  ### Sipariş üzerine yayım sözleşmesinin niteliği
  - **Yayım sözleşmesinin özel türü:** Amaç fikrî ürünün yayımlanmasıdır; hüküm TBK m. 501'de yayım sözleşmesi içinde düzenlenmiştir.
  - **Gerçekte eser sözleşmesi:** Eser yayımcının planına göre üretildiğinden ve yayımcının yayımlama borcu bulunmadığından ilişki TBK m. 470 anlamında eser sözleşmesidir.
  - **Yargıtay:** TBK m. 501'i sipariş üzerine yayım olarak uygular ve manevi hakların eser sahibinde kaldığını vurgular.

  Sınavda önce kanunun lafzını yaz (TBK m. 501), sonra tartışmayı kısaca ver; olayın çözümünü tartışmaya bağlama.

sozluk:
  - terim: Yayım sözleşmesi
    tanim: "Eser sahibinin eseri yayımlanmak üzere bıraktığı, yayımcının da çoğaltarak yayımlamayı üstlendiği, yazılı şekle bağlı sözleşme (TBK m. 487 ve TBK m. 488)."
  - terim: Yayımlatan
    tanim: "Eserini veya halefi olarak başkasının eserini yayımlanmak üzere yayımcıya bırakan taraf (TBK m. 487)."
  - terim: Yayımcı
    tanim: "Eseri çoğaltarak yayımlamayı üstlenen taraf. Tanıtım ve dağıtım borcu vardır (TBK m. 492)."
  - terim: Halef
    tanim: "Eser sahibinin yerine geçen, örneğin mirasçı ya da hak devralan kişi. Eserde yalnız güncelleştirme yapabilir (TBK m. 493)."
  - terim: Amaca göre devir
    tanim: "Hakların sözleşmenin ifasının gerektirdiği ölçüde ve süreyle yayımcıya geçmesi (TBK m. 489/1)."
  - terim: Baskı adedi ve basım sayısı
    tanim: "Bir basımda çıkarılan nüsha sayısı ve yapılabilecek basım sayısı. Belirtilmemişse yayımcının yalnız bir basım hakkı vardır (TBK m. 491/1)."
  - terim: İyileştirme ve güncelleştirme
    tanim: "Eser sahibinin eserini düzeltip geliştirmesi (iyileştirme); halefin eseri güncel duruma getirmesi (güncelleştirme). Yeni basımdan önce imkân verilmelidir (TBK m. 493)."
  - terim: Çeviri hakkı
    tanim: "Eseri başka dile çevirip yayımlama hakkı. Yayımcıya yalnız sözleşmede açıkça belirtilmişse geçer (TBK m. 495)."
  - terim: Telif bedeli
    tanim: "Yayımlatana ödenen bedel. Zorunlu unsur değildir; aksi kararlaştırılmadıkça istenebilir (TBK m. 496)."
  - terim: Bedelsiz nüsha
    tanim: "Yayımlatanın aksi kararlaştırılmadıkça teamüle göre yayımcıdan karşılıksız alabildiği nüsha (TBK m. 497/3)."
  - terim: Beklenmedik hâl
    tanim: "Tarafların kusuruna dayanmayan yok edici olay. Teslimden sonra eseri yok etse de yayımcı bedeli öder (TBK m. 498/1)."
  - terim: Sipariş üzerine yayım
    tanim: "Yayımcının belirlediği plana göre eser meydana getirilmesi. Yalnız kararlaştırılan ücret hak edilir ve mali haklar yayımcıya geçer (TBK m. 501)."
  - terim: Manevi haklar
    tanim: "Eser sahibinin adının belirtilmesi gibi, mali hakların devrinden etkilenmeyen kişiye bağlı hakları (5846 sayılı Kanun m. 15)."

kararlar:
  - id: "1060111100"
    ozet: |
      Yazar, bir yayınevi ile iki kitabı için beşer yıllık "eser sahibi telif sözleşmesi" imzalamıştır. Bedel, ilk kitapta satılan her kitap başına yüzde 5 telif olarak belirlenmiştir. İlk baskı ve ikinci baskı için telif ödemeleri yapılmıştır. Yazar, yayınevinin kitapların tanıtımını yapmadığını, stoklar tükendiği hâlde yeni baskı yapmadığını ve sözleşmeyi haksız feshettiğini ileri sürerek maddi ve manevi tazminat istemiştir. İlk derece mahkemesi davayı reddetmiş, bölge adliye mahkemesi yeniden hüküm kurarak davayı yine reddetmiştir. Gerekçeye göre sözleşmede yayınevinin tanıtım ve basıma devam yükümlülüğü yoktur, baskı sayısı kararlaştırılmamıştır, baskı tükenirse yayıncı eseri aynı şartlarla yayınlama "hakkına" sahiptir ve dava tarihinden önce bütün ödemeler yapılmıştır. Yargıtay 11. Hukuk Dairesi bu kararı oybirliğiyle onamıştır. Konuya katkısı: yeni basım yapma yetkisinin yayımcıya hak vermesi ile yükümlülük yüklemesi arasındaki farkı gösterir; yazar için kanundaki yol, süre verip cayma hakkıdır (TBK m. 491/3).
  - id: "1058337100"
    ozet: |
      Çizer, bir yazarın çocuk kitabı serisinin resimleri ve kapak tasarımı için yazarla üç "Çizer Sözleşmesi" yapmıştır; yazar da yayınevi ile telif sözleşmeleri imzalamıştır. Çizer, sözleşmelerin henüz yapılmamış eserler üzerinde mali hak devri içerdiği için batıl olduğunu, olmazsa baskı adedi belirlenmediğinden ücretin yalnız ilk baskıya ilişkin olduğunu ve sonraki baskılar için telif ücreti alması gerektiğini ileri sürmüştür. Bölge adliye mahkemesi sözleşmeleri, hakların tek tek sayılması nedeniyle geçerli mali hak devri sözleşmeleri saymıştır. Sözleşmede "süre, yer ve sayı bakımından sınırlama olmaksızın" denmesine rağmen baskı adedi belirlenmediğinden TBK m. 491/1 ve TBK m. 496/3 kıyasen uygulanmış, ödenen ücret ilk baskı için kabul edilmiş ve sonraki baskılar için çizerin telif alacağı bilirkişi hesabıyla belirlenmiştir. Sözlü yargılamaya geçildikten sonra ıslah yapılamayacağı için dilekçedeki tutar hüküm altına alınmıştır. Yargıtay 11. Hukuk Dairesi, bütün taraf temyizlerini reddedip kararı oybirliğiyle onamıştır. Konuya katkısı: baskı adedinin belirtilmemesinin ücret üzerindeki sonucunu gösterir.
  - id: "1058656600"
    ozet: |
      Öğretmen, bir yayınevinin KPSS coğrafya deneme sınavı kitapçıkları için iki arkadaşıyla birlikte soru hazırlamıştır. 2011 tarihli bir taahhütnameye göre bu sorular 2012 ve sonraki yayınlarda kullanılmayacaktır. Öğretmen, soruların sonrasında izinsiz ve adı belirtilmeden kullanıldığını ileri sürerek maddi ve manevi tazminat istemiştir. İlk derece mahkemesi davayı kısmen kabul etmiş, bölge adliye mahkemesi ise yayınevinin kendi planına göre eser sahiplerini bir araya getirdiğini, mali hakların yayınevinde olduğunu ve taahhütnamenin geçerli bir hak devri olmadığını belirterek davayı reddetmiştir. Yargıtay 11. Hukuk Dairesi, kararı oybirliğiyle bozmuştur. Gerekçeye göre öğretmen soruları tek başına hazırlamadığından, sorulardan kendisine ait olanlar ayrıştırılabiliyorsa tek başına dava açabilir (5846 sayılı Kanun m. 10); ayrıştırılamıyorsa diğer katkıcıların muvafakati alınmalıdır. Ayrıca izin verilen baskı sayısının aşılıp aşılmadığı bandrol kayıtlarıyla incelenmeli, adın belirtilmesi hakkı (5846 sayılı Kanun m. 15) iddiası da değerlendirilmelidir. Konuya katkısı: sipariş üzerine yayımda mali haklar yayımcıya geçse de manevi haklar ve ispat sorunları ayrıca incelenir.

sorular:
  - soru: |
      Yayım sözleşmesinde yayımcının asli edimi hangisidir?
    siklar:
      - "Eser sahibine zorunlu olarak bir telif bedeli ödemek"
      - "Eseri çoğaltarak yayımlamak"
      - "Yeni bir eser meydana getirmek"
      - "Eser üzerindeki bütün hakları satın almak"
    dogru: 1
    aciklama: |
      TBK m. 487'ye göre yayım sözleşmesinde eser sahibi eseri yayımlanmak üzere yayımcıya bırakmayı, yayımcı da onu çoğaltarak yayımlamayı üstlenir. Telif bedeli zorunlu unsur değildir; aksi kararlaştırılmadıkça istenebilir (TBK m. 496/1). Yeni eser meydana getirmek eser sözleşmesinin edimidir.

  - soru: |
      Yazar Ayşe, romanını Mavi Yayınevi'ne sözlü bir anlaşmayla bırakmış ve yayınevi romanı basmıştır. Aralarında yazılı bir belge yoktur. Sözleşmenin hukuki durumu nedir?
    siklar:
      - "Yayım sözleşmesi şekle bağlı olmadığından tam geçerlidir."
      - "Yayım sözleşmesinin geçerliliği yazılı şekle bağlı olduğundan geçerli bir yayım sözleşmesi doğmamıştır."
      - "Yalnız noter huzurunda düzenleme şekli yeterli olacağından sözleşme geçersizdir."
      - "Sözleşme ancak yayınevi iki kez basım yaparsa geçerli olur."
    dogru: 1
    aciklama: |
      Yayım sözleşmesinin geçerliliği yazılı şekilde yapılmış olmasına bağlıdır (TBK m. 488). Sözlü anlaşma bu şartı karşılamaz. Noterde düzenleme şekli aranmaz; yazılı şekil yeterlidir.

  - soru: |
      Yazar Burak ile yayınevi arasında yazılı yayım sözleşmesi vardır, ancak sözleşmede telif bedeli hakkında hiçbir hüküm yoktur. Burak ne yapabilir?
    siklar:
      - "Bedel isteyemez; bedel yayım sözleşmesinin zorunlu unsuru olduğundan sözleşme geçersizdir."
      - "Bedel isteyebilir; miktar belli değilse bedeli hâkim belirler."
      - "Yalnız yayınevinin lütfettiği bir bedeli kabul edebilir."
      - "Yalnız eserin satışından sonra bedel isteyebilir, miktarı yayınevi belirler."
    dogru: 1
    aciklama: |
      TBK m. 496/1'e göre sözleşmede aksi kararlaştırılmış olmadıkça yayımlatan bedel ödenmesini isteyebilir. Ödenecek miktar belli değilse bedel hâkim tarafından belirlenir (TBK m. 496/2). Bedel yayım sözleşmesinin zorunlu unsuru değildir.

  - soru: |
      TBK m. 489/1'e göre yayım sözleşmesiyle eser sahibinin hakları yayımcıya hangi ölçüde geçer?
    siklar:
      - "Eser üzerindeki bütün haklar süresiz olarak geçer."
      - "Yalnız çoğaltma hakkı geçer, yayma hakkı geçmez."
      - "Sözleşmenin ifasının gerektirdiği ölçüde ve süreyle geçer."
      - "Hiçbir hak geçmez; yayımcı yalnız izin almış olur."
    dogru: 2
    aciklama: |
      TBK m. 489/1'e göre eser sahibinin hakları, sözleşmenin ifasının gerektirdiği ölçüde ve süreyle yayımcıya geçer. Yayımcı yayım amacının gerektirdiğinden fazlasını kazanmaz.

  - soru: |
      Yazar Berk, romanının yayım hakkını bir yıl önce Alfa Yayınevi'ne devretmiş, bunu söylemeden Nil Yayınevi ile yazılı yayım sözleşmesi yapmıştır. Berk'in Nil Yayınevi'ne karşı durumu nedir?
    siklar:
      - "Sorumlu değildir; yayımcı kendi araştırmasını yapmalıydı."
      - "Sözleşmenin kurulduğu anda eseri yayımlatma hakkının bulunmamasından sorumludur ve önceki durumu sözleşmeden önce bildirmek zorundaydı."
      - "Yalnız ikinci yayımcının kötüniyetli olduğu hâllerde sorumludur."
      - "Sorumluluğu ancak Alfa Yayınevi dava açarsa doğar."
    dogru: 1
    aciklama: |
      Yayımlatan, yayımcıya karşı sözleşmenin kurulduğu anda eseri yayımlatma hakkının bulunmamasından sorumludur (TBK m. 489/2). Eserin başka bir yayımcıya bırakılmış olduğunu sözleşmeden önce bildirmek de zorundadır (TBK m. 489/3).

  - soru: |
      Bir gazetenin köşe yazarı Selim, gazetede yayımlanan kısa köşe yazısını bir yıl sonra bir dergide yeniden yayımlatmak istemektedir. Hukuki durumu nedir?
    siklar:
      - "Yazısını ancak gazetenin yazılı iznini alarak yayımlatabilir."
      - "Yayımın bitmesinden başlayarak üç ay geçmeden yayımlatamaz."
      - "Süreli yayındaki kısa yazıyı yayımlatan her zaman başka yerde de yayımlatabilir."
      - "Yayımlatamaz; yayım hakkı süresiz olarak gazeteye geçmiştir."
    dogru: 2
    aciklama: |
      Süreli yayınlarda yer alan kısa yazılar yayımlatan tarafından her zaman başka yerde de yayımlatılabilir (TBK m. 490/2). Üç aylık bekleme süresi toplama eserin kendisine ait bölümleri ve dergilerde çıkan uzun yazılar için aranır (TBK m. 490/3).

  - soru: |
      Dr. Aylin, bir dergide uzun bir makale yayımlatmıştır. Makalenin yayımı dergide tamamlanmıştır. Aylin makaleyi başka bir yayında yeniden yayımlatmak istemektedir. TBK m. 490/3'e göre ne kadar beklemelidir?
    siklar:
      - "Beklemesi gerekmez."
      - "Yayımın bitmesinden başlayarak üç ay geçmesini."
      - "Yayımın bitmesinden başlayarak bir yıl geçmesini."
      - "Dergi sözleşmesinin sona ermesinden beş yıl geçmesini."
    dogru: 1
    aciklama: |
      Yayımlatan, toplama bir eserin kendisine ait bölümlerini veya dergilerde çıkan uzun yazılarını, yayımın bitmesinden başlayarak üç ay geçmedikçe yeniden yayımlatamaz (TBK m. 490/3).

  - soru: |
      Yazar Elif ile Gül Yayınevi arasındaki yazılı sözleşmede basım sayısı belirtilmemiştir. İlk baskı tükenince yayınevi, Elif'e haber vermeden ikinci basımı yapmıştır. Hangisi doğrudur?
    siklar:
      - "Yayınevinin sınırsız sayıda basım hakkı vardır."
      - "Yayınevinin ancak bir basım yapma hakkı vardır; ikinci basım sözleşme kapsamı dışında kalır."
      - "Sözleşme basım sayısı belirtilmediği için baştan geçersizdir."
      - "İkinci basım, eser sahibine bildirilmek şartıyla serbesttir."
    dogru: 1
    aciklama: |
      Sözleşmede basım sayısı belirtilmemişse yayımcının ancak bir basım yapma hakkı vardır (TBK m. 491/1). İkinci basım bu hakkın dışında kaldığından Elif'in itiraz ve ek ücret hakkı gündeme gelir. Sözleşme geçersiz sayılmaz.

  - soru: |
      Yayımcıya sözleşmede "bütün yeni basımları yapma" yetkisi verilmiştir. Eserin baskısı tükenmiş, yayımcı uzun süredir yeni basım yapmamaktadır. Yayımlatanın izleyeceği yol hangisidir?
    siklar:
      - "Derhal, süre vermeden sözleşmeden cayabilir."
      - "Yayımcıya uygun bir süre verir; süre içinde basım gerçekleşmezse sözleşmeden cayabilir."
      - "Sözleşme baskının tükenmesiyle kendiliğinden sona erer."
      - "Yalnız tazminat isteyebilir, sözleşmeden dönemez."
    dogru: 1
    aciklama: |
      Birkaç ya da bütün yeni basımları yapma yetkisi verilen yayımcı, baskı tükenmişken yeni basımı ihmal ederse yayımlatan yeni basım için yayımcıya uygun bir süre verir. Yayımcı süre içinde basımı gerçekleştirmezse yayımlatan sözleşmeden cayabilir (TBK m. 491/3).

  - soru: |
      TBK m. 492/2'ye göre yayımlanan eserin satış fiyatını kim belirler?
    siklar:
      - "Eser sahibi, tek başına"
      - "Yayımcı; ancak eserin satılmasını güçleştirmemelidir."
      - "Sözleşmeyi onaylayan noter"
      - "Hâkim, her olayda"
    dogru: 1
    aciklama: |
      Satış fiyatını, eserin satılmasını güçleştirmemek koşuluyla yayımcı belirler (TBK m. 492/2).

  - soru: |
      TBK m. 493/1'e göre eserin yeni basımından önce eser sahibi ve halefleri eserde ne yapabilir?
    siklar:
      - "Her ikisi de eserde düzeltme ve iyileştirme yapabilir."
      - "Eser sahibi düzeltme ve iyileştirme, halefleri ise ancak güncelleştirme yapabilir."
      - "Yalnız halefleri eserde değişiklik yapabilir."
      - "Hiçbiri; eserde değişiklik yapmak yayımcıya aittir."
    dogru: 1
    aciklama: |
      Yayımcının menfaatlerini zedelememek ve sorumluluğunu artırmamak koşuluyla eser sahibi eserde düzeltme ve iyileştirme, halefleri ise ancak güncelleştirme yapabilir (TBK m. 493/1). Yayımcı bu imkânı vermeden yeni basım yapamaz (TBK m. 493/2).

  - soru: |
      Şair Deniz, beş şiir kitabını ayrı ayrı basıp yayma hakkını bir yayımcıya vermiştir. Yayımcı bu beş kitabı tek ciltte "bütün şiirler" olarak basmak istemektedir. Hukuki durum nedir?
    siklar:
      - "Ayrı ayrı yayım hakkı, birarada basım yetkisini de içerir."
      - "Ayrı ayrı yayımlama hakkı, yayımcıya bunların bir arada basılması yetkisini vermez."
      - "Birarada basım ancak yayımcı ek bedel öderse serbesttir."
      - "Yayımcı birarada basımı eser sahibine bildirerek yapabilir."
    dogru: 1
    aciklama: |
      Bir eser sahibinin birden çok eserini ayrı ayrı yayımlama hakkı, yayımcıya bunların bir arada basılması yetkisini vermez (TBK m. 494/1). Tersi de geçerlidir: Birarada yayım hakkı, ayrı ayrı basım yetkisi vermez (TBK m. 494/2).

  - soru: |
      Yazar Yelda ile yayınevi arasındaki yazılı yayım sözleşmesi çeviri hakkı hakkında susmaktadır. Yayınevi romanı İngilizceye çevirtip yurt dışında yayımlamıştır. Hukuki durum nedir?
    siklar:
      - "Çeviri hakkı, yayım hakkının doğal parçası olduğundan yayınevine geçmiştir."
      - "Çeviri hakkı sözleşmede açıkça belirtilmediğinden yayımcıya geçmemiştir."
      - "Çeviri hakkı iki yıl sonra yayımcıya geçer."
      - "Çeviri hakkı yalnız halefe ait olur, eser sahibine ait değildir."
    dogru: 1
    aciklama: |
      Çeviri hakkının yayımcıya geçebilmesi, bunun sözleşmede açıkça belirtilmiş olmasına bağlıdır (TBK m. 495). Sözleşme susuyorsa hak yayımlatanda kalır.

  - soru: |
      Yazar Zeynep ile yayınevi, bedelin satılan her kitabın fiyatının yüzde 10'u olmasını kararlaştırmıştır. TBK m. 497'ye göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yayımcı satış hesaplarını tutmak ve teamüle uygun ispat edici belgeleri hazırlamakla yükümlüdür."
      - "Satış hesaplarını tutmak yazarın borcudur."
      - "Satış miktarına bağlı bedel yayım sözleşmesinde yasaktır."
      - "Yazarın bedelsiz nüsha hakkı hiçbir hâlde yoktur."
    dogru: 0
    aciklama: |
      Taraflar bedeli satış miktarına bağlamışlarsa yayımcı, satış hesaplarını tutmak, çıkarmak ve teamüle uygun ispat edici belgeleri hazırlamakla yükümlüdür (TBK m. 497/2). Aksi kararlaştırılmadıkça yayımlatanın teamül uyarınca bedelsiz alma hakkı da vardır (TBK m. 497/3).

  - soru: |
      Tarihçi Tarık, eserini yazılı sözleşmeyle yayımcıya teslim etmiştir. Basımdan önce yayımcının ofisinde, kimsenin kusuru olmaksızın çıkan yangında teslim edilen müsvedde yanmıştır. Tarık'ın bilgisayarında yedek kopya vardır. Hangisi doğrudur?
    siklar:
      - "Eser teslimden önce yok olmuş sayıldığından yayımcı bedeli ödemez."
      - "Yayımcı bedeli ödemekle yükümlüdür; Tarık yedek kopyayı uygun bir karşılık isteyebilerek yayımcıya vermelidir."
      - "Sözleşme kendiliğinden sona erer, kimse kimseden bir şey isteyemez."
      - "Tarık yeni bir eser yazmak zorundadır, ancak bedel isteyemez."
    dogru: 1
    aciklama: |
      Eser yayımcıya teslimden sonra beklenmedik hâl sonucu yok olsa bile yayımcı bedeli ödemekle yükümlüdür (TBK m. 498/1). Eserin başka bir örneği eser sahibindeyse onu yayımcıya vermesi gerekir ve her iki durumda da uygun bir karşılık isteyebilir (TBK m. 498/2). Teslimden önce yok olmada ücret istenemeyen eser sözleşmesindeki kuraldan (TBK m. 483/1) farkı budur.

  - soru: |
      Yayımcı 3.000 adetlik tamamlanmış baskıdan 1.000 adedini depo seli yüzünden satışa sunmadan önce kaybetmiştir (beklenmedik hâl). Yok olanların yerine yenilerini koymak aşırı masraf gerektirmemektedir. Yayımcının durumu nedir?
    siklar:
      - "Yeniden basamaz; basım hakkı bitmiştir."
      - "Yayımlatana ek bedel ödemeksizin, gideri kendisine ait olmak üzere yeniden basabilir ve aşırı masraf gerektirmediği için basmakla yükümlüdür."
      - "Yeniden basmak için yayımlatana ek telif ödemek zorundadır."
      - "Yeniden basım masrafı yayımlatana aittir."
    dogru: 1
    aciklama: |
      Tamamlanmış baskı adedinin bir bölümü satışa sunulmadan önce beklenmedik hâl sonucu yok olursa yayımcı, yayımlatana ayrıca bir bedel ödemeksizin yok olan miktarı gideri kendisine ait olmak üzere yeniden basabilir (TBK m. 499/1). Aşırı masraf gerektirmeksizin yok olanların yerine yenilerini koyabilecekse bunu yapmakla yükümlüdür (TBK m. 499/2).

  - soru: |
      Romancı Ahmet, sözleşmeyi imzaladıktan sonra romanını tamamlamadan ölmüştür. Hukuki sonuç nedir?
    siklar:
      - "Sözleşme mirasçılara geçer ve her hâlde devam eder."
      - "Sözleşme kendiliğinden sona erer; ancak sözleşmenin yerine getirilmesi mümkün ve hakkaniyete uygunsa hâkim devamına karar verebilir."
      - "Sözleşme hâkim kararı olmadan sona ermez."
      - "Yayımcı yeni yazar bulup sözleşmeyi sürdürmek zorundadır."
    dogru: 1
    aciklama: |
      Eser sahibi eseri tamamlamadan ölürse sözleşme kendiliğinden sona erer. Ancak sözleşmenin tamamı veya bir bölümünün yerine getirilmesi mümkün ve hakkaniyete uygun bulunursa hâkim, sözleşme ilişkisinin devamına ve bunun için gereken değişikliklerin yapılmasına karar verebilir (TBK m. 500/1).

  - soru: |
      Yayımcı Delta iflas etmiştir. İflas anında henüz muaccel olmamış telif borcu için güvence gösterilmemiştir. Yazarın durumu nedir?
    siklar:
      - "Eseri başka bir yayımcıya veremez."
      - "Eseri başka bir yayımcıya verebilir."
      - "Sözleşme hâkim kararıyla bile sona erdirilemez."
      - "Yazar eseri ancak iflas masasının izniyle başkasına verebilir."
    dogru: 1
    aciklama: |
      Yayımcı iflas ederse yayımlatan, eseri başka bir yayımcıya verebilir. Ancak iflas anında henüz muaccel olmamış borcun yerine getirileceği konusunda güvence gösterilmişse yayımlatan eseri başka bir yayımcıya veremez (TBK m. 500/2). Burada güvence gösterilmediğinden yazar eseri başkasına verebilir.

  - soru: |
      Yayınevi P, kendi belirlediği plana göre KPSS Tarih soru bankası hazırlaması için öğretmen Özlem'le yazılı anlaşmış ve kararlaştırılan 80.000 TL'yi ödemiştir. Kitap ertesi yıl yeniden basılmıştır. Özlem'in yeni baskı için ek telif isteme hakkı hakkında hangisi doğrudur?
    siklar:
      - "Özlem her yeni baskı için ek telif isteyebilir."
      - "Özlem yalnız sözleşmeyle kararlaştırılan ücrete hak kazanır; mali haklar yayımcıya aittir."
      - "Özlem ek telif isteyebilir; ancak yalnız ikinci baskı için."
      - "Mali haklar Özlem'de kalır, yayınevi yalnız kullanım izni almıştır."
    dogru: 1
    aciklama: |
      Bir veya birkaç kişi yayımcının belirlediği plana göre eser meydana getirmeyi üstlenirse sadece sözleşmeyle kararlaştırılan ücrete hak kazanır; bu durumda sözleşme konusu mali haklar yayımcıya ait olur (TBK m. 501). Adın belirtilmesi gibi manevi haklar ise eser sahibinde kalır (5846 sayılı Kanun m. 15).

  - soru: |
      Yazar Kerem, romanını kendi parasıyla Hızlı Matbaa'ya 500 adet bastırmıştır. Matbaa yalnız basım işini üstlenmiş, kitabın tanıtımını, dağıtımını ve satışını üstlenmemiştir. Taraflar arasındaki sözleşme nasıl nitelendirilir?
    siklar:
      - "Yayım sözleşmesi (TBK m. 487)"
      - "Eser sözleşmesi (TBK m. 470)"
      - "Sipariş üzerine yayım sözleşmesi (TBK m. 501)"
      - "Bağışlama sözleşmesi"
    dogru: 1
    aciklama: |
      Yayım sözleşmesinde yayımcı eseri çoğaltarak yayımlamayı, yani tanıtım ve dağıtım dahil yayımlama işini üstlenir (TBK m. 487 ve TBK m. 492/1). Matbaa yalnız basım işini yapmakta, bedeli yazar ödemektedir; bu, yüklenicinin bir eser meydana getirmeyi, işsahibinin bedel ödemeyi üstlendiği eser sözleşmesidir (TBK m. 470). Yayımcının planı ve mali hakların yayımcıya geçmesi söz konusu olmadığından TBK m. 501 de uygulanmaz.

olaylar:
  - olay: |
      Yazar Yelda, ilk romanı için Mavi Yayınevi ile 10 Ocak 2024'te 100.000 TL telif bedelli yazılı bir yayım sözleşmesi imzalar. Sözleşmede basım sayısı, baskı adedi ve çeviri hakkı konusunda hüküm yoktur. Roman Yelda'ya aittir ve başka hiçbir yayımcıya verilmemiştir. Mavi Yayınevi romanın ilk baskısını yapar ve baskı tükenir.

      Yayınevi, Yelda'ya haber vermeden ve ek ücret ödemeden romanın ikinci baskısını yapar. Yelda'ya, romanı iyileştirme imkânı da tanımamıştır. Ayrıca yayınevi romanı İngilizceye çevirtip yurt dışında yayımlar. Yelda hem ikinci baskıya hem çeviriye itiraz eder. Yayınevi ise "sözleşmede hiçbir sınırlama yok, her baskıyı ve çeviriyi yapabiliriz" savunmasını ileri sürer.

      1. Sözleşmenin nitelendirilmesi ve geçerliliği nedir?
      2. Yayınevinin ikinci baskı yapma hakkı var mıdır? Yelda ek ücret isteyebilir mi?
      3. Yelda'ya iyileştirme imkânı tanınmaması sonuç doğurur mu?
      4. Çeviri hakkı yayınevine geçmiş midir?
    olcut:
      - {tespit: "Sözleşmenin yazılı yapılmış yayım sözleşmesi olması (eser sahibi eseri yayımcıya bırakmış, yayımcı çoğaltarak yayımlamayı üstlenmiş); geçerli olması", puan: 15, madde: "TBK m. 488"}
      - {tespit: "Basım sayısı belirtilmediğinden yayımcının ancak bir basım yapma hakkı bulunması; ikinci basımın bu hakkın dışında kalması", puan: 25, madde: "TBK m. 491"}
      - {tespit: "İlk baskı için ödenen bedelin ilk baskıya ilişkin olması; ikinci baskı için Yelda'nın ek ücret isteyebilmesi (Yargıtay uygulaması); birden fazla basım hakkı olmadığından bedelin sonraki basımlara uygulanacağı karinesinin işlememesi", puan: 15, madde: "TBK m. 496"}
      - {tespit: "Yayımcının eser sahibine iyileştirme imkânı vermeden yeni basım yapamaması", puan: 15, madde: "TBK m. 493"}
      - {tespit: "Çeviri hakkının sözleşmede açıkça belirtilmediğinden yayımcıya geçmemiş olması", puan: 20, madde: "TBK m. 495"}
      - {tespit: "Hakların yalnız sözleşmenin ifasının gerektirdiği ölçüde ve süreyle geçmesi; yayımcının genel 'sınırlama yok' savunmasının kabul edilmemesi", puan: 10, madde: "TBK m. 489"}
    cozum: |
      **Nitelendirme:** Yelda ile Mavi Yayınevi arasındaki sözleşme, eser sahibinin eseri yayımlanmak üzere bıraktığı, yayınevinin de çoğaltarak yayımlamayı üstlendiği **yayım sözleşmesidir** (TBK m. 487). Yazılı yapıldığı için geçerlilik şartı sağlanmıştır (TBK m. 488).

      **Hukuki sorunlar:** (1) Basım hakkının kapsamı; (2) ikinci baskı için bedel; (3) iyileştirme imkânı; (4) çeviri hakkı; (5) hakların geçiş ölçüsü.

      **İlgili hükümler:** TBK m. 487; TBK m. 488; TBK m. 489/1; TBK m. 491/1; TBK m. 493/2; TBK m. 495; TBK m. 496.

      **Değerlendirme:**

      *1. Geçerlilik.* Sözleşme yazılı yapıldığından TBK m. 488 aranan şekil şartını sağlar. Bedel yayım sözleşmesinin zorunlu unsuru değildir; burada ayrıca kararlaştırılmıştır (TBK m. 496/1).

      *2. İkinci baskı.* Sözleşmede basım sayısı belirtilmemişse yayımcının ancak bir basım yapma hakkı vardır (TBK m. 491/1). Mavi Yayınevi bu hakkı ilk baskıyla kullanmıştır. İkinci baskı sözleşmenin verdiği hakkın dışındadır. Yayımcının birden fazla basım hakkı olsaydı ilk basım için kararlaştırılan bedel ve koşulların sonraki basımlara da uygulanacağı kabul edilirdi (TBK m. 496/3); burada böyle bir hak bulunmadığından bu karine işlemez. Yargıtay uygulamasında baskı adedi belirlenmeyen sözleşmelerde ödenen ücret ilk baskıya ilişkin sayılmakta, sonraki baskılar için eser sahibi yeniden ücrete hak kazanmaktadır. Yelda ikinci baskı için ek ücret isteyebilir. Yayınevinin "hiçbir sınırlama yok" savunması, hakların yalnız sözleşmenin ifasının gerektirdiği ölçüde ve süreyle geçtiği ilkesine (TBK m. 489/1) uymaz.

      *3. İyileştirme.* Yayımcı, eser sahibine eserini iyileştirme imkânı vermeden yeni bir basım yapamaz ve eseri çoğaltamaz (TBK m. 493/2). Yelda'ya bu imkân tanınmadığından ikinci baskı bu yönden de sözleşmeye aykırıdır.

      *4. Çeviri.* Çeviri hakkının yayımcıya geçebilmesi, bunun sözleşmede açıkça belirtilmiş olmasına bağlıdır (TBK m. 495). Sözleşme çeviri hakkı hakkında susmaktadır; hak Yelda'da kalmıştır. Yayınevinin romanı çevirtip yayımlaması, kendisine geçmeyen bir hak üzerinde tasarruftur.

      **Sonuç:**
      - Sözleşme geçerli bir yayım sözleşmesidir.
      - Yayınevinin ancak bir basım hakkı vardı; ikinci baskı hakkı aşmaktadır ve Yelda ek ücret isteyebilir.
      - İyileştirme imkânı verilmeden yapılan yeni basım TBK m. 493/2'ye aykırıdır.
      - Çeviri hakkı sözleşmede açıkça belirtilmediği için yayınevine geçmemiştir.

  - olay: |
      Tarihçi Tarık, "Osmanlı'da Şehir" adlı eserini 2025'te yazılı yayım sözleşmesiyle Boğaz Yayınları'na teslim eder. Telif bedeli 120.000 TL'dir ve eser basılıp satışa hazır hâle getirildikten sonra ödenecektir. Tarık, eserin bir yedek kopyasını kendi bilgisayarında tutmaktadır.

      Eser basılmadan, yayınevinin ofisinde kimsenin kusuru olmaksızın çıkan yangında teslim edilen müsvedde yanar. Yayınevi, "eser yok oldu, bedel ödemeyiz" der. Tarık yedek kopyayı yayınevine verir ve kitap 3.000 adet basılır. Satışa sunulmadan önce depoyu su basar ve 1.000 adet kitap kullanılamaz hâle gelir. Yeniden basımın aşırı bir masraf gerektirmediği anlaşılmıştır. Yayınevi, 1.000 adedin yeniden basım masrafının Tarık'a ait olduğunu ve Tarık'ın bu 1.000 adet için ayrıca telif isteyemeyeceğini söyler. Tarık ise yeni basım için yeniden telif ister.

      1. Yayınevinin "bedel ödemeyiz" savunması geçerli midir? Yedek kopya konusunda ne söylenebilir?
      2. Depoda yok olan 1.000 adet kitap açısından tarafların durumu nedir?
      3. Telif bedeli ne zaman ödenmelidir?
    olcut:
      - {tespit: "Eserin yayımcıya teslimden sonra beklenmedik hâl sonucu yok olması; yayımcının yine de bedeli ödemekle yükümlü olması", puan: 25, madde: "TBK m. 498"}
      - {tespit: "Eser sahibinde eserin başka bir örneği bulunduğundan onu yayımcıya vermesi gerekmesi ve uygun karşılık isteyebilmesi", puan: 20, madde: "TBK m. 498"}
      - {tespit: "Satışa sunulmadan önce yok olan baskı için yayımcının ayrıca bedel ödemeksizin, gideri kendisine ait olmak üzere yeniden basabilmesi; Tarık'ın yeniden telif isteyememesi", puan: 25, madde: "TBK m. 499"}
      - {tespit: "Aşırı masraf gerektirmediğinden yayımcının yeniden basmakla yükümlü olması", puan: 10, madde: "TBK m. 499"}
      - {tespit: "Bedelin eserin basımından ve satışa hazır duruma getirilmesinden sonra ödenmesi; yangının bu borcu ortadan kaldırmaması", puan: 10, madde: "TBK m. 497"}
      - {tespit: "Eserin kendisinin yok olması (TBK m. 498) ile basılan nüshaların yok olmasının (TBK m. 499) farklı sonuçlara bağlanması; teslimden önce yok olmada ücret istenemeyen eser sözleşmesi kuralından farkı", puan: 10, madde: "TBK m. 483"}
    cozum: |
      **Nitelendirme:** Tarık ile Boğaz Yayınları arasındaki yazılı sözleşme, eser sahibinin eseri yayımlanmak üzere bıraktığı ve yayımcının çoğaltarak yayımlamayı üstlendiği **yayım sözleşmesidir** (TBK m. 487 ve TBK m. 488). Telif bedeli kararlaştırılmıştır (TBK m. 496/1).

      **Hukuki sorunlar:** (1) Teslim edilen eserin yok olmasının bedele etkisi; (2) yedek örnek; (3) basılan nüshaların yok olması; (4) bedelin ödenme zamanı.

      **İlgili hükümler:** TBK m. 497/1; TBK m. 498/1 ve TBK m. 498/2; TBK m. 499/1 ve TBK m. 499/2; karşılaştırma için TBK m. 483/1.

      **Değerlendirme:**

      *1. Müsveddenin yanması.* Eser yayımcıya teslimden sonra beklenmedik hâl sonucu yok olmuştur. Bu durumda bile yayımcı bedeli ödemekle yükümlüdür (TBK m. 498/1). Teslimden önce beklenmedik olayla yok olan eserde ücret istenemeyen eser sözleşmesi kuralı (TBK m. 483/1) burada işlemez; çünkü risk teslimle yayımcıya geçmiştir. "Bedel ödemeyiz" savunması geçersizdir.

      *2. Yedek kopya.* Eserin başka bir örneği eser sahibinin elinde olduğundan onu yayımcıya vermesi gerekir; Tarık bunu yapmıştır. Her iki durumda da eser sahibi uygun bir karşılık isteyebilir (TBK m. 498/2). Tarık yedeği vermek için makul bir karşılık talep edebilir.

      *3. Depodaki 1.000 adet.* Tamamlanmış baskının bir bölümü satışa sunulmadan önce beklenmedik hâl sonucu yok olmuştur. Yayımcı, yayımlatana ayrıca bir bedel ödemeksizin yok olan miktarı, gideri kendisine ait olmak üzere yeniden basabilir (TBK m. 499/1). Yeniden basım aşırı masraf gerektirmediğinden yayımcı bunu yapmakla yükümlüdür (TBK m. 499/2). Masraf yayımcıya aittir; Tarık bu 1.000 adet için ayrıca telif isteyemez. Yayınevinin "masraf Tarık'a aittir" iddiası kanuna aykırıdır, "Tarık ayrıca telif isteyemez" iddiası ise doğrudur.

      *4. Bedelin zamanı.* Eser bütün olarak yayımlanacağından bedel, eserin basımından ve satışa hazır duruma getirilmesinden sonra ödenir (TBK m. 497/1). Yangın bu borcu ortadan kaldırmaz; yalnız ödeme basım ve hazırlıktan sonraya kalır.

      **Sonuç:**
      - Yayınevi, müsvedde yansa bile bedeli ödemekle yükümlüdür; Tarık yedeği uygun bir karşılıkla verir.
      - Yok olan 1.000 adet yayınevi tarafından kendi giderine yeniden basılır; Tarık ek telif isteyemez.
      - Bedel, kitabın basılıp satışa hazır hâle getirilmesinden sonra ödenir.

  - olay: |
      Marmara Yayınları, KPSS Tarih Soru Bankası hazırlamak üzere konu başlıklarını ve soru sayılarını kendisinin belirlediği bir plan oluşturur. Bu plana göre soru yazmak için öğretmen Özlem ile yazılı bir sözleşme yapar ve kararlaştırılan 80.000 TL'yi öder. Sözleşmede soruların kitapta Özlem'in adıyla yayımlanıp yayımlanmayacağı konusunda hüküm yoktur. Özlem soruları teslim eder.

      Yayınevi kitabı Özlem'in adını yazmadan basar. Ertesi yıl kitabın yeni baskısını yapar. Özlem hem yeni baskı için ek telif hem de adının yazılmaması nedeniyle tazminat ister. Yayınevi, "mali haklar bizdedir, 80.000 TL'yi ödedik, başka hiçbir yükümlülüğümüz yok" savunmasını ileri sürer.

      1. Sözleşmeyi nitelendiriniz.
      2. Özlem yeni baskı için ek telif isteyebilir mi?
      3. Adın yazılmaması konusunda Özlem'in durumunu değerlendiriniz.
    olcut:
      - {tespit: "Yayımcının belirlediği plana göre eser meydana getirilmesi nedeniyle sipariş üzerine yayım sözleşmesi hükümlerinin uygulanması; sözleşmenin yazılı olması", puan: 20, madde: "TBK m. 501"}
      - {tespit: "Özlem'in yalnız sözleşmeyle kararlaştırılan ücrete (80.000 TL) hak kazanması; yeni baskı için ek telif isteyememesi", puan: 25, madde: "TBK m. 501"}
      - {tespit: "Sözleşme konusu mali hakların yayımcıya ait olması; yeni baskı yapma hakkının yayınevinde bulunması", puan: 20, madde: "TBK m. 501"}
      - {tespit: "Adın belirtilmesi hakkının manevi hak olarak eser sahibinde kalması; eserin adsız yayımlanıp yayımlanmayacağına karar yetkisinin eser sahibine ait olması", puan: 25, madde: "5846 sayılı Kanun m. 15"}
      - {tespit: "Yayınevinin mali hakların kendisinde olduğu savunmasının adın belirtilmesi hakkını ortadan kaldırmaması; bu talebin ayrıca değerlendirilmesi gerekmesi", puan: 10, madde: "5846 sayılı Kanun m. 18"}
    cozum: |
      **Nitelendirme:** Yayınevi, kendi belirlediği plana göre bir eser meydana getirilmesini sağlamıştır. Bu, TBK m. 501'de düzenlenen **sipariş üzerine yayım** durumudur. Sözleşme yazılı yapıldığından şekil şartı sağlanmıştır (TBK m. 488).

      **Hukuki sorunlar:** (1) Ücret ve mali haklar; (2) yeni baskı için ek telif; (3) adın belirtilmesi hakkı.

      **İlgili hükümler:** TBK m. 488; TBK m. 501; 5846 sayılı Kanun m. 15 ve 5846 sayılı Kanun m. 18.

      **Değerlendirme:**

      *1. Ücret ve mali haklar.* Bir veya birkaç kişi yayımcının belirlediği plana göre bir eser meydana getirmeyi üstlenirse sadece sözleşmeyle kararlaştırılan ücrete hak kazanır; bu durumda sözleşme konusu mali haklar yayımcıya ait olur (TBK m. 501). Özlem'in hakkı 80.000 TL ile sınırlıdır ve bu tutar ödenmiştir.

      *2. Yeni baskı.* Mali haklar yayınevine ait olduğundan yeni baskı yapma hakkı da yayınevindedir. Özlem yeni baskı için ek telif isteyemez; yayınevinin bu yöndeki savunması yerindedir.

      *3. Adın belirtilmesi.* Mali hakların yayımcıya geçmesi manevi hakları ortadan kaldırmaz. Eseri sahibinin adı veya müstear adı ile ya da adsız olarak umuma arz etme veya yayımlama konusunda karar verme yetkisi münhasıran eser sahibine aittir (5846 sayılı Kanun m. 15/1). Sözleşmede adın belirtilmemesine dair bir hüküm bulunmadığından bu karar yetkisi Özlem'de kalmıştır. Yayınevinin yalnızca mali haklar elinde olduğu için adı yazmama konusunda serbest olduğu savunması bu yönden yeterli değildir. Mali hakları kullanma yetkisi, eser sahibiyle yapılan sözleşmeye bağlıdır (5846 sayılı Kanun m. 18/3). Bu nedenle adın yazılmaması iddiası ayrıca incelenmelidir ve Özlem bu yönde manevi hak talebinde bulunabilir. Yargıtay da sipariş üzerine yayımda adın belirtilmesi iddiasının ayrıca değerlendirilmesi gerektiğini belirtmiştir.

      **Sonuç:**
      - Özlem yalnız 80.000 TL'ye hak kazanır; yeni baskı için ek telif isteyemez.
      - Mali haklar yayınevine aittir, yeni baskı yapma hakkı yayınevindedir.
      - Adın belirtilmesi manevi hakkı Özlem'dedir; adın yazılmaması iddiası ayrıca değerlendirilir ve Özlem bu yönden talepte bulunabilir.

kartlar:
  - on: "Yayım sözleşmesi nedir? (TBK m. 487)"
    arka: "Eser sahibinin (veya halefinin) eseri yayımlanmak üzere yayımcıya bırakmayı, yayımcının da onu çoğaltarak yayımlamayı üstlendiği sözleşme."
  - on: "Yayım sözleşmesinin şekli? (TBK m. 488)"
    arka: "Geçerlilik yazılı şekle bağlıdır. Mali hakların yazılı sözleşmede ayrı ayrı gösterilmesi de aranır (5846 sayılı Kanun m. 52)."
  - on: "Telif bedeli yayım sözleşmesinin zorunlu unsuru mu?"
    arka: "Hayır. Aksi kararlaştırılmadıkça yayımlatan bedel isteyebilir; miktar belli değilse hâkim belirler (TBK m. 496/1-2)."
  - on: "Eser sahibinin hakları yayımcıya hangi ölçüde geçer? (TBK m. 489/1)"
    arka: "Sözleşmenin ifasının gerektirdiği ölçüde ve süreyle (amaca göre devir)."
  - on: "Yayımlatanın sorumluluğu ve bildirim yükü? (TBK m. 489/2-3)"
    arka: "Sözleşme kurulurken yayımlatma hakkının (ve korunan eserde telif hakkının) bulunmamasından sorumlu; eserin başkasına bırakıldığını veya yayımlandığını sözleşmeden önce bildirmek zorunda."
  - on: "Kısa yazı ile uzun yazı farkı? (TBK m. 490)"
    arka: "Süreli yayındaki kısa yazılar her zaman başka yerde yayımlatılabilir. Toplama eser bölümleri ve dergideki uzun yazılar yayımın bitiminden başlayarak üç ay geçmeden yeniden yayımlatılamaz."
  - on: "Basım sayısı belirtilmemişse yayımcının hakkı? (TBK m. 491/1)"
    arka: "Ancak bir basım yapma hakkı vardır."
  - on: "Yeni basımı ihmal eden yayımcıya karşı yayımlatan ne yapar? (TBK m. 491/3)"
    arka: "Birkaç ya da bütün yeni basım yetkisi verilmiş ve baskı tükenmişse yayımcıya uygun süre verir; süre içinde basım olmazsa sözleşmeden cayabilir."
  - on: "Satış fiyatını kim belirler? (TBK m. 492/2)"
    arka: "Yayımcı; eserin satılmasını güçleştirmemek koşuluyla."
  - on: "Düzeltme, iyileştirme, güncelleştirme kimin hakkı? (TBK m. 493)"
    arka: "Eser sahibi düzeltme ve iyileştirme, halefleri yalnız güncelleştirme yapabilir. Yayımcı bu imkânı vermeden yeni basım yapamaz."
  - on: "Birarada basım ve ayrı yayım? (TBK m. 494)"
    arka: "Ayrı ayrı yayım hakkı birarada basım yetkisi vermez; birarada yayım hakkı da ayrı ayrı basım yetkisi vermez."
  - on: "Çeviri hakkı yayımcıya ne zaman geçer? (TBK m. 495)"
    arka: "Yalnız sözleşmede açıkça belirtilmişse."
  - on: "Birden fazla basım hakkında bedel nasıl uygulanır? (TBK m. 496/3)"
    arka: "Yayımcının birden fazla basım hakkı varsa ilk basım için kararlaştırılan bedel ve koşullar sonraki basımlar için de uygulanacağı kabul edilmiş sayılır."
  - on: "Bedel ne zaman ödenir? (TBK m. 497/1)"
    arka: "Eser bütün olarak yayımlanacaksa tamamının; cilt, fasikül, forma gibi bölümlerle yayımlanacaksa her bölümün basımından ve satışa hazır duruma getirilmesinden sonra."
  - on: "Bedel satışa bağlıysa yayımcının borcu? (TBK m. 497/2)"
    arka: "Satış hesaplarını tutmak, çıkarmak ve teamüle uygun ispat edici belgeleri hazırlamak."
  - on: "Eser teslimden sonra yok olursa? (TBK m. 498)"
    arka: "Beklenmedik hâlle yok olsa bile yayımcı bedeli öder. Eser sahibinde başka örnek varsa verir; az çabayla yeniden meydana getirilebilecekse yeniden yazar. Uygun karşılık isteyebilir."
  - on: "Basılan nüshalar satıştan önce yok olursa? (TBK m. 499)"
    arka: "Yayımcı ayrıca bedel ödemeksizin, gideri kendisine ait olmak üzere yeniden basabilir; aşırı masraf gerektirmiyorsa basmakla yükümlüdür."
  - on: "Eser sahibi ölürse ne olur? (TBK m. 500/1)"
    arka: "Eser tamamlanmadan ölür, yeteneğini yitirir veya kusursuz imkânsızlık doğarsa sözleşme kendiliğinden sona erer; mümkün ve hakkaniyete uygunsa hâkim devamına karar verebilir."
  - on: "Yayımcı iflas ederse? (TBK m. 500/2)"
    arka: "Yayımlatan eseri başka yayımcıya verebilir; iflas anında muaccel olmamış borç için güvence gösterilmişse veremez."
  - on: "Sipariş üzerine yayımda sonuç? (TBK m. 501)"
    arka: "Yayımcının planına göre eser meydana getirenler yalnız kararlaştırılan ücrete hak kazanır; mali haklar yayımcıya ait olur. Manevi haklar (ör. adın belirtilmesi) eser sahibinde kalır."
  - on: "Eser sözleşmesi (TBK m. 483) ile yayım (TBK m. 498) arasında yok olma farkı?"
    arka: "Eser sözleşmesinde teslimden önce beklenmedik olayla yok olan eser için yüklenici ücret isteyemez. Yayımda eser teslimden sonra yok olsa bile yayımcı bedeli öder."
