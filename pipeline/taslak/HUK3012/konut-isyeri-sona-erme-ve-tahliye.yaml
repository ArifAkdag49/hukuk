  - id: "1187870600"
    ozet: |
      Kiracı olmayan eşin aile konutu bildirimi yaparak kira sözleşmesinin tarafı olmasından önce, kiracı eşin tek başına verdiği yazılı tahliye taahhüdünün geçerli olup olmadığı konusunda bölge adliye mahkemeleri arasında uyuşmazlık çıkmıştır. Bursa BAM 4. Hukuk Dairesi, Konya BAM 4. Hukuk Dairesi ve Samsun BAM 6. Hukuk Dairesi, bildirimden önce verilen taahhüdün geçerli olduğunu; Bursa BAM 4. Hukuk Dairesinin başka bir kararı ile İzmir BAM 23. Hukuk Dairesi ise takipten önce yapılan bildirimin önceki taahhüdü geçersiz kıldığını kabul etmiştir. Bursa BAM Hukuk Daireleri Başkanlar Kurulu uyuşmazlığın giderilmesini istemiş, Yargıtay 3. Hukuk Dairesi oy birliğiyle şu sonuca varmıştır: Aile konutu bildirimi geleceğe etkilidir; bildirimden önce kiracı eşin tek başına verdiği yazılı tahliye taahhüdü geçerliliğini korur. Gerekçede, bildirimden sonra verilecek taahhüdün iki eşin birlikte imzası ya da diğer eşin açık rızasıyla verilmesi gerektiği de belirtilmiştir. Karar, eş korumasının TBK m. 352/1'deki taahhüt kurumunu geriye dönük bozmadığını gösterir.
  - id: "1217571800"
    ozet: |
      Davacı malik, bir alışveriş merkezindeki bağımsız bölümün, dava dışı alışveriş merkezi adi ortaklığı ile davalı kiracı arasında 27.03.2012 başlangıçlı, 10 yıllık ve hasılat paylaşımlı bir sözleşmeyle kiralandığını; 10 yıllık sürenin 27.03.2022'de dolduğunu ve 2021'de gönderilen ihtarla sözleşmenin uzatılmayacağını bildirdiğini ileri sürerek ürün kirası hükümlerine dayanıp tahliye istemiştir. Büyükçekmece 1. Sulh Hukuk Mahkemesi, taşınmaz işletme ruhsatıyla birlikte kiralanmadığı için sözleşmenin ürün kirası olmadığını, çatılı işyeri kirasına tabi olduğunu ve kiraya verenin adi ortaklık olduğunu belirterek davayı reddetmiştir. İstanbul BAM 54. Hukuk Dairesi, çatılı işyerinde süre bitimine dayanılarak tahliye istenemeyeceğini ve TBK m. 347 şartlarının oluşmadığını belirterek istinafı esastan reddetmiştir. Yargıtay 3. Hukuk Dairesi kararı oy birliğiyle onamıştır. İşletme ruhsatıyla birlikte devredilmeyen çatılı taşınmazda hasılat paylaşımı, sözleşmeyi tek başına ürün kirası yapmaz; kiraya veren ilk sürenin bitimine dayanamaz, ilk sürenin bitiminden itibaren on yıllık uzama süresinin dolması gerekir.
  - id: "1218290300"
    ozet: |
      Gerçek kişi davacı malikler, daha önce ortağı oldukları limited şirket aracılığıyla hurda geri dönüşüm işi yaptıkları taşınmazı 01.01.2020'de davalıya kiralamışlardır. OSB'deki yeni fabrikada şirkete atık geri kazanım lisansı verilmeyince taşınmaza yeniden ihtiyaç duyduklarını ileri sürerek TBK m. 350 uyarınca tahliye davası açmışlardır. Gebze 3. Sulh Hukuk Mahkemesi, gerçek kişilerin ortağı oldukları şirketin ihtiyacı için tahliye isteyemeyeceklerini belirterek davayı reddetmiş, Sakarya BAM 14. Hukuk Dairesi istinafı esastan reddetmiştir. Yargıtay 3. Hukuk Dairesi kararı oy çokluğuyla onamıştır. Çoğunluğa göre gereksinim sahipleri TBK m. 350'de sınırlı olarak sayılmıştır, şirket ortaktan ayrı bir tüzel kişidir ve TBK m. 354 uyarınca dava sebepleri kiracı aleyhine genişletilemez. Karşı oyda, tek ortaklı ya da aile şirketlerinde şirketin ihtiyacı ile ortakların ihtiyacının ayrı sayılamayacağı savunulmuştur. Karar, gereksinim sebebinde kişi sınırlılığını gösterir.

sorular:
  - soru: |
      Belirli süreli bir konut kirasında kiracı, süre bitiminde sözleşmeyi sona erdirmek istiyor. TBK m. 347/1'e göre hangisi doğrudur?
    siklar:
      - "Kiracı süre bitiminden en az otuz gün önce bildirimde bulunmazsa sözleşme belirsiz süreli sözleşmeye dönüşür."
      - "Sözleşme süre sonunda her hâlde kendiliğinden sona erer; kiracının ayrıca bildirimde bulunmasına gerek yoktur."
      - "Kiracı süre bitiminden en az on beş gün önce bildirimde bulunmazsa sözleşme aynı koşullarla bir yıl için uzatılmış sayılır."
      - "Kiracı süre bitiminden en az üç ay önce bildirimde bulunmazsa sözleşme altı ay uzatılmış sayılır."
    dogru: 2
    aciklama: |
      TBK m. 347/1 konut ve çatılı işyerinde belirli süreli sözleşmeyi kiracı yararına uzatır: Kiracı bitimden en az on beş gün önce bildirim yapmazsa sözleşme aynı koşullarla bir yıl uzar. Genel kural olan "süre bitince kendiliğinden sona erme" (TBK m. 327/1) bu kira türünde uygulanmaz. Belirsiz süreliye dönüşme ise açık anlaşma olmadan kira ilişkisinin sürdürülmesinde ortaya çıkan başka bir sonuçtur (TBK m. 327/2).

  - soru: |
      Kemal, konutunu Selin'e bir yıllık süreyle kiralamıştır. Sözleşme ilk süreden sonra her yıl uzayarak on yıl uzamış ve on birinci uzama yılı başlamıştır. Kemal herhangi bir sebep göstermeden sözleşmeyi sona erdirmek istiyor. TBK m. 347/1'e göre nasıl davranmalıdır?
    siklar:
      - "Sözleşme yıllık uzamaya devam ettiği için kiraya verenin sebepsiz sona erdirme hakkı hiçbir zaman doğmaz."
      - "İçinde bulunulan uzama yılının bitiminden en az üç ay önce yazılı bildirimde bulunmalıdır."
      - "Yeni uzama yılı başlamadan en az on beş gün önce bildirimde bulunmalıdır."
      - "Süre bitimine dayanarak uzama yılının sonunda bir ay içinde dava açmalıdır."
    dogru: 1
    aciklama: |
      On yıllık uzama süresi dolduktan sonra kiraya veren, bu süreyi izleyen her uzama yılının bitiminden en az üç ay önce bildirimde bulunmak koşuluyla, sebep göstermeden sözleşmeye son verebilir (TBK m. 347/1). Bildirim yazılı olmalıdır (TBK m. 348). On beş günlük süre kiracıya aittir; kiraya verenin hakkı hiç doğmuyor değildir. Kiraya veren için süre bitimine dayanan ayrı bir dava yolu da yoktur.

  - soru: |
      Bir alışveriş merkezindeki çatılı işyeri, işletme ruhsatı devredilmeden 10 yıllık belirli süreli sözleşmeyle kiralanmış ve kira bedeli olarak ciro payı kararlaştırılmıştır. Kiraya veren, 10 yıllık süre dolunca sözleşmenin sona erdiğini ve uzatılmayacağını bildirerek tahliye istemiştir. Yargıtay'ın yaklaşımına göre sonuç nedir?
    siklar:
      - "Sözleşme ürün kirası olduğundan süre sonunda kendiliğinden sona erer ve tahliye istenebilir."
      - "Ciro payı kararlaştırıldığı için sözleşme adi kira sayılır ve taraflar dilediği an feshedebilir."
      - "Kiraya veren, ilk sürenin bitiminden sonra iki yıl içinde dava açarak tahliye isteyebilir."
      - "Ciro payı sözleşmeyi ürün kirası yapmaz; çatılı işyeri hükümleri uygulanır ve kiraya veren ilk sürenin bitimine dayanarak tahliye isteyemez."
    dogru: 3
    aciklama: |
      Yargıtay'a göre işletme ruhsatıyla birlikte devredilmeyen çatılı taşınmazda hasılat ya da ciro payı kararlaştırılması, sözleşmeyi tek başına ürün kirası yapmaz (TBK m. 357). Sözleşme TBK m. 339 kapsamındaki çatılı işyeri kirasıdır. Bu durumda kiraya veren, sözleşme süresinin bitimine dayanarak sözleşmeyi sona erdiremez; ilk sürenin bitiminden itibaren on yıllık uzama süresinin dolması gerekir (TBK m. 347/1).

  - soru: |
      Hasan, belirsiz süreli bir sözleşmeyle konutunu Aylin'e kiralamıştır; kira ilişkisinin üzerinden dört yıl geçmiştir. Hasan sebep göstermeden genel hükümlere göre fesih bildirimi göndermek, Aylin ise bir an önce çıkmak istemektedir. TBK m. 347/2 bakımından hangisi doğrudur?
    siklar:
      - "Aylin her zaman genel hükümlere göre fesih bildirimiyle sözleşmeyi sona erdirebilir; Hasan ise kiranın başlangıcından on yıl geçmeden bu yolla sona erdiremez."
      - "İkisi de genel hükümlere göre fesih bildirimi yapabilir; kiraya verenin ayrıca beklemesi gerekmez."
      - "Hasan her zaman, Aylin ise yalnızca on yıl geçtikten sonra fesih bildirimi yapabilir."
      - "Belirsiz süreli konut kirasında bildirimle sona erdirme yoktur; yalnızca dava yolu vardır."
    dogru: 0
    aciklama: |
      Belirsiz süreli kira sözleşmelerinde kiracı her zaman, kiraya veren ise kiranın başlangıcından on yıl geçtikten sonra genel hükümlere göre fesih bildirimiyle sözleşmeyi sona erdirebilir (TBK m. 347/2). Kiraya verenin on yıllık beklemesi, kiracı korumasının sonucudur. Fesih yine yasal dönem ve bildirim sürelerine uyularak yapılır (TBK m. 328).

  - soru: |
      Mehmet, konut kirasını sona erdirmek için kiraya vereni telefonla arayıp sözleşmeyi feshettiğini söylemiştir; kiraya veren herhangi bir yanıt vermemiştir. Kiraya veren sonradan fesih bildiriminin geçersiz olduğunu ileri sürmektedir. Hangisi doğrudur?
    siklar:
      - "Fesih bildirimi serbest şekildedir; telefonla yapılan bildirim geçerlidir."
      - "Fesih bildirimi yalnızca noter aracılığıyla yapılırsa geçerlidir; yazılı olması yetmez."
      - "Konut ve çatılı işyeri kiralarında fesih bildiriminin geçerliliği yazılı şekle bağlıdır; telefonla yapılan bildirim geçerli değildir."
      - "Kiraya veren yanıt vermediği için sessizlik kabul sayılır ve fesih geçerli olur."
    dogru: 2
    aciklama: |
      TBK m. 348 konut ve çatılı işyeri kiralarında fesih bildiriminin geçerliliğini yazılı şekle bağlar. Sözlü ya da telefonla yapılan bildirim geçerlilik şartını karşılamaz. Noter aracılığı zorunlu değildir; yazılı olması yeterlidir. Sessizlik de eksik şekli tamamlamaz.

  - soru: |
      Ali, eşi Ayşe ile birlikte oturdukları konutu tek başına kiralamıştır. İş değiştirdiği için Ayşe'ye sormadan kiraya verene yazılı fesih bildirimi göndermiştir; Ayşe fesihe rıza göstermemektedir. TBK m. 349'a göre hangisi doğrudur?
    siklar:
      - "Ali kiracı olduğu için fesih tek başına geçerlidir."
      - "Fesih ancak kiraya veren Ayşe'ye ayrıca bildirimde bulunursa geçerli olur."
      - "Ayşe'nin rızası yalnızca tapuda aile konutu şerhi varsa aranır."
      - "Ali, Ayşe'nin açık rızası olmadıkça sözleşmeyi feshedemez; rıza alınamazsa ya da Ayşe haklı sebep olmaksızın kaçınırsa hâkimden karar isteyebilir."
    dogru: 3
    aciklama: |
      Aile konutu olarak kullanılan taşınmazda kiracı, eşinin açık rızası olmadıkça kira sözleşmesini feshedemez (TBK m. 349/1; TMK m. 194/1). Rıza alınamazsa ya da eş haklı sebep olmaksızın kaçınırsa kiracı hâkimden karar vermesini isteyebilir (TBK m. 349/2). Tapu şerhi malik olmayan eşin tapu kütüğü bakımından hakkıdır; kira feshindeki rıza şartı şerhe bağlı değildir.

  - soru: |
      Aile konutu olarak kullanılan konutta kiracı olmayan eş, kiraya verene bildirimde bulunarak kira sözleşmesinin tarafı olmuştur. Bundan sonra kiraya veren fesih bildirimini ve fesih ihtarına bağlı ödeme süresini nasıl bildirmelidir?
    siklar:
      - "Yalnızca sözleşmeyi imzalayan eşe; diğer eş sözleşmenin dışında kalır."
      - "Kiracıya ve eşine ayrı ayrı bildirmek zorundadır."
      - "Yalnızca bildirimde bulunan eşe, çünkü yeni taraf odur."
      - "Eşlerden birine bildirmesi yeterlidir; müteselsil sorumluluk nedeniyle diğeri de bağlanır."
    dogru: 1
    aciklama: |
      TBK m. 349/3'e göre kiracı olmayan eş bildirimle taraf olduktan sonra kiraya veren, fesih bildirimi ile fesih ihtarına bağlı ödeme süresini kiracıya ve eşine ayrı ayrı bildirmek zorundadır. Eşler müteselsil sorumlu olsa da (TMK m. 194/4) kanun bildirimin iki eşe ayrı ayrı yapılmasını arar; müteselsil sorumluluk bu yükümlülüğü ortadan kaldırmaz.

  - soru: |
      Zeynep, kiracılı dairesinin maliki olarak yakın arkadaşı Elif'in evlenince oturması için daireye ihtiyaç bulunduğunu ileri sürüp TBK m. 350'ye dayanarak tahliye davası açmıştır. Elif, Zeynep'in bakmakla yükümlü olduğu bir kişi değildir. Sonuç ne olmalıdır?
    siklar:
      - "Dava reddedilmelidir; gereksinim yalnız kiraya verenin kendisi, eşi, altsoyu, üstsoyu veya kanun gereği bakmakla yükümlü olduğu kişiler için ileri sürülebilir."
      - "Dava kabul edilmelidir; ihtiyaç gerçek ve samimi ise ihtiyaç sahibinin kim olduğu önemli değildir."
      - "Dava kabul edilmelidir; Elif ile Zeynep arasında yakın bir bağ bulunması yeterlidir."
      - "Dava, Elif ile Zeynep aynı konutta yaşıyorsa kabul edilmelidir."
    dogru: 0
    aciklama: |
      TBK m. 350 gereksinim sahiplerini sınırlı olarak sayar: kiraya verenin kendisi, eşi, altsoyu, üstsoyu ve kanun gereği bakmakla yükümlü olduğu diğer kişiler. Dava sebepleri sınırlıdır ve kiracı aleyhine genişletilemez (TBK m. 354). Yakın bağ ya da aynı konutta yaşama sayılan kişiler arasına girmeyi sağlamaz.

  - soru: |
      TBK m. 350'ye göre belirli süreli bir konut kirasında gereksinim sebebiyle tahliye davası ne zaman açılmalıdır?
    siklar:
      - "Sürenin bitiminden altı ay önce başlayarak sürenin bitimine kadar."
      - "Bir kira yılı içinde istenen herhangi bir zamanda."
      - "Sürenin sonunda başlayarak bir ay içinde."
      - "Sürenin bitiminden başlayarak üç ay içinde."
    dogru: 2
    aciklama: |
      TBK m. 350, belirli süreli sözleşmelerde davanın sürenin sonunda, belirsiz süreli sözleşmelerde genel hükümlere göre belirlenecek tarihten başlayarak bir ay içinde açılmasını ister. Üç aylık süre kiraya verenin on yıllık uzama sonrasındaki bildirim süresidir (TBK m. 347/1); dava süresiyle karıştırılmamalıdır.

  - soru: |
      Hangi durumda kiraya veren TBK m. 350 uyarınca yeniden inşa ve imar sebebiyle sözleşmeyi dava ile sona erdirebilir?
    siklar:
      - "Kiraya veren, kiralananı daha yüksek bedelle başkasına kiralamak istemektedir."
      - "Kiralanan eskidir ve kiraya veren boya-badana ile küçük onarım yapmak istemektedir."
      - "Kiralananın yenilenmesi gerekli olup işler sırasında kullanım yalnızca güçleşecek, imkânsız olmayacaktır."
      - "Kiralananın yeniden inşası için esaslı onarımı gereklidir ve bu işler sırasında kiralananın kullanımı imkânsızdır."
    dogru: 3
    aciklama: |
      TBK m. 350 iki şartı birlikte arar: Yeniden inşa veya imar amacıyla esaslı onarım, genişletme ya da değiştirme gerekli olmalı ve bu işler sırasında kiralananın kullanımı imkânsız olmalıdır. Daha yüksek kira almak ya da küçük onarım yapmak sebep değildir. Kullanımın yalnızca güçleşmesi de yeterli değildir; imkânsızlık aranır.

  - soru: |
      Burak, kiracılı bir daireyi 12 Mart 2026'da satın almış ve daireyi kendisi oturmak için kullanma zorunluluğu doğmuştur. Burak, edinmeden altı ay sonra açacağı bir davayla kira sözleşmesini sona erdirmek istemektedir. TBK m. 351/1'e göre hangi koşulu yerine getirmelidir?
    siklar:
      - "Edinmeden önce kiracıdan yazılı muvafakat almalıdır."
      - "Edinme tarihinden başlayarak bir ay içinde durumu kiracıya yazılı olarak bildirmelidir."
      - "Edinme tarihinden başlayarak altı ay içinde kiracıya sözlü bildirimde bulunmalıdır."
      - "Hiçbir bildirim yapmasına gerek yoktur; altı ay sonra dava açabilir."
    dogru: 1
    aciklama: |
      Yeni malik, gereksinim sebebiyle edinme tarihinden başlayarak bir ay içinde durumu kiracıya yazılı olarak bildirmek koşuluyla sözleşmeyi altı ay sonra açacağı davayla sona erdirebilir (TBK m. 351/1). Bildirim yazılı olmalı ve süresinde yapılmalıdır. Kiracının muvafakati aranmaz.

  - soru: |
      Cem bir dükkânı kiralarken kiraya veren, kiralanan henüz teslim edilmeden ve sözleşme imzalanırken, Cem'e "dükkânı 1 Eylül 2027'de boşaltırım" yazan bir taahhütname imzalatmıştır. TBK m. 352/1 ve Yargıtay uygulaması bakımından bu taahhüt hakkında hangisi doğrudur?
    siklar:
      - "Geçerlidir; yazılı olması ve boşaltma tarihinin belli olması yeterlidir."
      - "Geçerlidir; ancak kiraya veren yalnızca dava yoluyla tahliye isteyebilir."
      - "Geçersizdir; çünkü taahhütname noterde düzenleme şeklinde yapılmamıştır."
      - "Geçersizdir; çünkü TBK m. 352/1 taahhüdün kiralananın teslim edilmesinden sonra verilmiş olmasını arar."
    dogru: 3
    aciklama: |
      TBK m. 352/1 tahliye taahhüdünün kiralananın teslim edilmesinden sonra verilmesini arar. Kira sözleşmesiyle birlikte, teslimden önce alınan taahhüt Yargıtay İçtihadı Birleştirme Kararı uyarınca geçersizdir. Noter şekli aranmaz; yazılı olması yeterlidir. Geçerli taahhütte kiraya veren icra yolunu da kullanabilir.

  - soru: |
      Kiracı Sevgi, kiralananın tesliminden sonra verdiği yazılı taahhütle dairesini 1 Temmuz 2026'da boşaltmayı üstlenmiş ancak boşaltmamıştır. Kiraya veren Orhan 15 Ağustos 2026'da icra takibi başlatmak istemektedir. TBK m. 352/1 bakımından durum nedir?
    siklar:
      - "Orhan'ın hakkı taahhüt tarihinden itibaren bir yıl boyunca devam eder; henüz düşmemiştir."
      - "Süre taahhüdün verildiği tarihten başlar ve altı aydır; Orhan süresi içindedir."
      - "Takip süresi önemli değildir; taahhüt bulunduğu sürece kiracı her zaman tahliye edilebilir."
      - "Orhan, hakkını taahhüt edilen tarihten başlayarak bir ay içinde kullanmalıydı; bu süre geçtiği için bu sebebe dayanamaz."
    dogru: 3
    aciklama: |
      TBK m. 352/1 kiraya verene, taahhüt edilen boşaltma tarihinden başlayarak bir ay içinde icraya başvurma ya da dava açma imkânı verir. Boşaltma tarihi 1 Temmuz 2026 olduğundan bir aylık süre Ağustos başında dolar; 15 Ağustos'taki başvuru süresinde değildir. Süre taahhüdün düzenlendiği tarihten değil, taahhüt edilen boşaltma tarihinden başlar.

  - soru: |
      Kiraya veren Seda ile kiracı Nuri arasında Nuri'nin kiralananı teslimden sonra yazılı taahhütle belirli bir tarihte boşaltmayı üstlenmesinin ardından, aynı iş yeri için noter tasdikli yeni bir kira sözleşmesi imzalanmıştır. Seda eski taahhüde dayanarak Nuri'yi tahliye ettirmek istiyor. Yargıtay'ın yaklaşımına göre sonuç nedir?
    siklar:
      - "Taahhüt bağımsızdır; yeni sözleşmeden etkilenmez ve Seda takip yapabilir."
      - "Taahhüt, yeni sözleşme geçerli olsa bile yalnızca Nuri'nin ikinci bir yazılı onayıyla hükümsüz kalır."
      - "Taahhütten sonra yeni kira sözleşmesi imzalanması önceki taahhüdü hükümsüz bırakır; Seda eski taahhüde dayanamaz."
      - "Yeni sözleşme yalnızca kira bedelini etkiler; taahhüdün geçerliliği korunur."
    dogru: 2
    aciklama: |
      Yargıtay 3. Hukuk Dairesi, tahliye taahhüdünden sonra tarafların yeni bir kira sözleşmesi imzalamasını kira ilişkisinin yenilenmesi sayar ve önceki taahhüdün hükümsüz kaldığını kabul eder. Böylece TBK m. 352/1'deki yazılı boşaltma taahhüdüne dayanılamaz.

  - soru: |
      Kiracı Tolga, bir kira yılı içinde iki farklı ay kirasını ödemediği için kiraya veren Gül tarafından kendisine yazılı olarak iki haklı ihtar gönderilmesine sebep olmuş, ihtarlardan sonra borçlarını ödemiştir. Gül TBK m. 352/2'ye dayanmak istemektedir. Dava ne zaman açılmalıdır?
    siklar:
      - "İhtarların yapıldığı kira yılının bitiminden başlayarak bir ay içinde."
      - "Tolga ödeme yaptığı için dava hakkı doğmamıştır."
      - "İkinci ihtardan hemen sonra, kira yılının bitimi beklenmeden."
      - "Kira yılının bitiminden başlayarak altı ay içinde."
    dogru: 0
    aciklama: |
      TBK m. 352/2'ye göre kiraya veren, bir yıldan uzun süreli kiralarda ihtarların yapıldığı kira yılının bitiminden başlayarak bir ay içinde dava açabilir. Yargıtay uygulamasında ihtardan sonra yapılan ödeme, iki haklı ihtara sebep olunmuş olmasını ortadan kaldırmaz. Kira yılı bitmeden açılan dava erken, altı aylık süre ise kanunda yoktur.

  - soru: |
      Kiraya veren Tuğba, konut kiracısı Ali'nin aynı ilçe sınırları içinde oturmaya elverişli başka bir konutu bulunduğunu, kira sözleşmesi kurulurken bildiği hâlde, sözleşmenin bitiminden sonra TBK m. 352/3'e dayanarak tahliye davası açmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Tuğba, sözleşmenin bitiminden başlayarak bir ay içinde dava açabilir; sözleşme kurulurken bilmesi önemli değildir."
      - "Tuğba bu sebebe dayanamaz; çünkü sözleşme kurulurken kiracının aynı ilçedeki konutunu biliyordu."
      - "Tuğba bu sebebe dayanabilir; konutun farklı bir ilçede olması da yeterlidir."
      - "Tuğba bu sebebe yalnızca sözleşme belirsiz süreliyse dayanabilir."
    dogru: 1
    aciklama: |
      TBK m. 352/3 kiraya verene, kiracının veya birlikte yaşadığı eşinin aynı ilçe veya belde belediye sınırları içinde elverişli bir konutu bulunması durumunda dava hakkı tanır; ancak kiraya veren bunu sözleşmenin kurulması sırasında bilmiyor olmalıdır. Bilerek sözleşme kuran kiraya veren bu sebebe dayanamaz. Farklı ilçedeki konut yetmez.

  - soru: |
      Konut kirası sözleşmesine, kiraya verenin kira artışını kabul etmeyen kiracıyı dava açarak tahliye ettirebileceğine dair bir hüküm konulmuştur. Bu hüküm hakkında hangisi doğrudur?
    siklar:
      - "Geçerlidir; sözleşme serbestisi gereği taraflar tahliye sebeplerini genişletebilir."
      - "Yalnızca noterde düzenleme şeklinde yapılmışsa geçerlidir."
      - "Geçerlidir; ancak kiraya veren bir yıllık kira bedeli kadar tazminat öder."
      - "Geçersizdir; çünkü dava yoluyla sona erdirmeye ilişkin hükümler kiracı aleyhine değiştirilemez ve sebepler kanunda sınırlı olarak sayılmıştır."
    dogru: 3
    aciklama: |
      TBK m. 354, dava yoluyla kira sözleşmesinin sona erdirilmesine ilişkin hükümlerin kiracı aleyhine değiştirilemeyeceğini söyler. Yargıtay da tahliye sebeplerinde sınırlı sayı ilkesini benimser. Kanunda olmayan yeni bir tahliye sebebi eklemek kiracı aleyhinedir ve geçerli değildir.

  - soru: |
      Kadir, oğlunun işyeri ihtiyacına dayanan tahliye davasını kazanmış ve kiracı Nermin mahkeme ilamı üzerine icra yoluyla işyerinden çıkarılmıştır. Kadir bir yıl sonra, haklı bir sebep olmaksızın dükkânı Ömer'e kiralamıştır. Nermin son kira yılında toplam 120.000 TL kira ödemiştir. TBK m. 355'e göre hangisi doğrudur?
    siklar:
      - "Yasak yalnızca iki yıl sürer; bir yıl sonra kiralamak serbesttir."
      - "Kadir yalnızca Nermin'in gerçek zararını ödemekle yükümlüdür; kira bedeli bir alt sınır değildir."
      - "Kadir, Nermin'e son kira yılında ödenmiş olan bir yıllık kira bedelinden, yani 120.000 TL'den az olmamak üzere tazminat ödemekle yükümlüdür."
      - "Kadir'in sorumluluğu yoktur; tazminat ancak Ömer'den istenebilir."
    dogru: 2
    aciklama: |
      Gereksinim amacıyla boşaltılan kiralanan, haklı sebep olmaksızın üç yıl geçmedikçe eski kiracısından başkasına kiralanamaz (TBK m. 355/1). Aykırılıkta kiraya veren, eski kiracısına son kira yılında ödenmiş olan bir yıllık kira bedelinden az olmamak üzere tazminat öder (TBK m. 355/3). Bu tutar alt sınırdır. Tazminat yükümlüsü kiraya verendir, yeni kiracı değildir.

  - soru: |
      Yeniden inşa ve imar amacıyla boşaltılan ve yeniden yapılan taşınmazı, yeni durumu ve yeni kira bedeliyle kiralama konusunda öncelik hakkı olan eski kiracı, bu hakkı ne zaman kullanmalıdır?
    siklar:
      - "İnşaatın tamamlanmasından başlayarak üç yıl içinde."
      - "Kiraya verenin yapacağı yazılı bildirimi izleyen bir ay içinde."
      - "Kiraya verenin yapacağı yazılı bildirimi izleyen üç ay içinde."
      - "Taşınmazı boşalttığı tarihten başlayarak bir yıl içinde."
    dogru: 1
    aciklama: |
      TBK m. 355/2'ye göre eski kiracının yeniden inşa edilen taşınmazı yeni durumu ve yeni kira bedeliyle kiralama konusunda öncelik hakkı vardır. Bu hak, kiraya verenin yapacağı yazılı bildirimi izleyen bir ay içinde kullanılmalıdır. Üç yıl ise yeniden kiralama yasağının süresidir; öncelik hakkı süresiyle karıştırılmamalıdır.

  - soru: |
      HUAK m. 18/B/1-a'ya göre kira uyuşmazlıklarında arabuluculuk bakımından hangisi doğrudur?
    siklar:
      - "Kira ilişkisinden kaynaklanan uyuşmazlıklarda, ilamsız icra yoluyla tahliyeye ilişkin hükümler hariç, dava açılmadan önce arabulucuya başvurulmuş olması dava şartıdır."
      - "Arabuluculuk yalnız kira bedelinin tespiti davalarında dava şartıdır; tahliye davaları kapsam dışıdır."
      - "Arabuluculuk, tahliye taahhüdüne dayanan ilamsız icra takibinde de dava şartıdır."
      - "Arabuluculuk bütün kira uyuşmazlıklarında istisnasız dava şartıdır; ilamsız icra yolu da kapsamdadır."
    dogru: 0
    aciklama: |
      HUAK m. 18/B/1-a, kiralanan taşınmazların ilamsız icra yoluyla tahliyesine ilişkin hükümler hariç olmak üzere kira ilişkisinden kaynaklanan uyuşmazlıklarda arabulucuya başvurulmasını dava şartı yapar. Tahliye davaları kapsamdadır; İİK m. 272 vd. yoluyla yürütülen ilamsız tahliye takibi ise kapsam dışındadır. Arabulucuya başvurulmadan açılan dava, dava şartı yokluğundan usulden reddedilir (HUAK m. 18/A/2).

olaylar:
  - olay: |
      Kemal, İstanbul'daki bir daireyi 1 Eylül 2015'ten itibaren bir yıllık belirli süreli sözleşmeyle Ahmet'e kiralamıştır. Sözleşme her yıl aynı koşullarla uzayarak sürmüştür. Ahmet 2015'ten beri aynı dairede oturmakta, kirayı düzenli ödemekte ve sözleşmeden doğan hiçbir yükümlülüğünü aksatmamaktadır. Kemal, 15 Eylül 2025'te noter aracılığıyla Ahmet'e "sözleşmenin süresinin bittiğini ve sözleşmeyi sona erdirdiğini" bildirmiştir. Ahmet, bu bildirimi kabul etmediğini söyleyerek daireyi boşaltmamıştır.

      Kemal daireyi 10 Kasım 2025'te Yusuf'a satmış ve tapuda devir yapılmıştır. Yusuf, kendi kullanması için daireye ihtiyaç duyduğunu, bunun için kullanma zorunluluğu bulunduğunu belirterek 25 Kasım 2025'te Ahmet'e yazılı bildirim yapmış ve bildirim Ahmet'e aynı gün ulaşmıştır. Yusuf daha sonra 1 Haziran 2026'da arabulucuya başvurmuş, görüşmeler anlaşamamayla sonuçlanmış ve 8 Haziran 2026'da son tutanak düzenlenmiştir. Yusuf, son tutanağı dava dilekçesine ekleyerek 15 Haziran 2026'da sulh hukuk mahkemesinde tahliye davası açmıştır.

      1. Kemal'in 15 Eylül 2025 tarihli bildirimi sözleşmeyi sona erdirmiş midir?
      2. Yusuf'un tahliye davası kanundaki şartlara uygun mudur?
    olcut:
      - {tespit: "Konut kirasında belirli süreli sözleşmenin kiracı bildirmedikçe aynı koşullarla bir yıl uzaması; kiraya verenin süre bitimine dayanarak sözleşmeyi sona erdirememesi", puan: 15, madde: "TBK m. 347"}
      - {tespit: "On yıllık uzama süresinin hesabı: ilk sürenin bitiminden sonra 10 yıl; izleyen uzama yılının bitiminden en az üç ay önce bildirimle sebepsiz sona erdirme; on yıllık uzama süresi dolmadan kiraya verenin sebepsiz sona erdirme hakkının doğmaması ve Kemal'in süre bittiği gerekçesiyle yaptığı bildirimin sonuç doğurmaması", puan: 20, madde: "TBK m. 347"}
      - {tespit: "Yusuf'un kiralananı sonradan edinen kişi olması ve kendisi için kullanma zorunluluğunun gereksinim sebebi olması", puan: 10, madde: "TBK m. 351"}
      - {tespit: "Edinme tarihinden başlayarak bir ay içinde yazılı bildirim koşulunun yerine gelmesi (25 Kasım 2025 bildirimi)", puan: 20, madde: "TBK m. 351"}
      - {tespit: "Dava için bildirimden sonra altı ayın geçmiş olması; 15 Haziran 2026 tarihli davanın bu bakımdan süresinde olması", puan: 15, madde: "TBK m. 351"}
      - {tespit: "Kira uyuşmazlığında arabuluculuğun dava şartı olması; anlaşamama son tutanağının dilekçeye eklenmesi ve tahliye davasının ilamsız icra istisnasına girmemesi", puan: 20, madde: "HUAK m. 18/B"}
    cozum: |
      **Nitelendirme:** Uyuşmazlık, konut kirası olan belirli süreli bir sözleşmede kiraya verenin sona erdirme bildirimi ile, taşınmazı sonradan edinen kişinin gereksinim sebebiyle açtığı tahliye davasına ilişkindir. Konut kirası olduğundan TBK m. 339 ve devamındaki koruyucu hükümler uygulanır.

      **Hukuki sorunlar:** (1) Kiraya veren belirli süreli konut kirasını süre bitimine dayanarak sona erdirebilir mi, on yıllık uzama süresi ne zaman dolar? (2) Yeni malikin gereksinim davasının şartları var mı? (3) Dava şartı arabuluculuk yerine gelmiş mi?

      **İlgili hükümler:** TBK m. 347, TBK m. 348, TBK m. 351; HUAK m. 18/B ve HUAK m. 18/A.

      **Değerlendirme:**

      *1. Kemal'in bildirimi:* Konut ve çatılı işyeri kiralarında belirli süreli sözleşme, kiracı bildirimde bulunmadıkça aynı koşullarla bir yıl uzar ve kiraya veren sözleşme süresinin bitimine dayanarak sözleşmeyi sona erdiremez (TBK m. 347/1). Kemal'in bildiriminin yazılı şekle uygun olması (TBK m. 348) tek başına yeterli değildir; bildirimin sebebi "sürenin bitmesi"dir ve kanun bunu kiraya veren bakımından kabul etmez. Kiraya verenin sebepsiz sona erdirme hakkı ancak on yıllık uzama süresi dolduktan sonra doğar ve izleyen her uzama yılının bitiminden en az üç ay önce bildirimle kullanılır. Bu hesaba göre ilk süre 2016'da bitmiş, on yıllık uzama süresi 2026 Eylül başında dolacaktır; izleyen uzama yılının sonu 2027 Eylül başıdır. Kemal'in 15 Eylül 2025 tarihli bildirimi "süre bitti" gerekçesine dayandığından ve sebepsiz sona erdirme hakkı henüz doğmadığından sözleşmeyi sona erdirmemiştir.

      *2. Yusuf'un davası:* Yusuf kiralananı sonradan edinen kişidir. Kendisi için kullanma zorunluluğu gereksinim sebebidir ve edinen kişi bu sebebe dayanabilir (TBK m. 351/1). Kanun, edinme tarihinden başlayarak bir ay içinde durumun kiracıya yazılı olarak bildirilmesini arar. Yusuf edinme tarihi olan 10 Kasım 2025'ten on beş gün sonra, 25 Kasım 2025'te bildirimi yapıp Ahmet'e ulaştırdığından bu koşul yerine gelmiştir. Kanun ayrıca sözleşmenin altı ay sonra açılacak dava ile sona erdirilebileceğini söyler. Dava 15 Haziran 2026'da açıldığından altı ay, edinme tarihinden de bildirim tarihinden de sayılsa dolmuştur; dava tarihi bakımından bir sorun yoktur. Yusuf'un sözleşme süresinin bitimine dayanması gerekmediği için Kemal'in önceki bildiriminin geçersizliği de davayı engellemez.

      *3. Arabuluculuk:* Kira ilişkisinden doğan uyuşmazlıklarda, ilamsız icra yoluyla tahliye hariç, dava açmadan önce arabulucuya başvurulması dava şartıdır (HUAK m. 18/B/1-a). Yusuf ilamsız icra yerine tahliye davası açtığından bu şart aranır; anlaşamama son tutanağı dilekçeye eklenmiştir (HUAK m. 18/A/2). Dava şartı yerine gelmiştir.

      **Sonuç:**
      - Kemal'in bildirimi sözleşmeyi sona erdirmemiştir; on yıllık uzama süresi dolmadan kiraya veren sebepsiz sona erdiremez.
      - Yusuf'un TBK m. 351/1 uyarınca açtığı gereksinim davası şartlara uygundur; yeni malik olarak bir ay içinde yazılı bildirim yapmış, altı ay geçtikten sonra dava açmış ve arabuluculuk şartını yerine getirmiştir.

  - olay: |
      Murat, eşi Elif ve iki çocuğuyla birlikte oturdukları konutu Selim'den, 1 Mart 2024 başlangıçlı ve iki yıl süreli sözleşmeyle tek başına kiralamıştır. Sözleşmeyi yalnız Murat imzalamıştır. Konut, evliliğin başından beri ailenin yaşadığı ve çocukların okullarına yakın olan evdir. Murat başka bir şehirde iş bulduğu için Elif'e sormadan, 10 Ocak 2026'da Selim'e noter aracılığıyla yazılı fesih bildirimi göndermiştir. Elif, çocukların okulu nedeniyle taşınmak istemediğini söylemekte ve bu fesihe razı olmamaktadır.

      Elif bunun üzerine 20 Ocak 2026'da Selim'e yazılı bildirimde bulunarak konutun aile konutu olarak kullanıldığını ve kira sözleşmesinin tarafı olduğunu bildirmiştir. Şubat 2026 kirası ödenmeyince Selim, konutu kendi ihtiyacı için istemediğini, yalnız kiranın ödenmesini ve ödenmezse fesih yolunu istediğini belirterek, kira bedelinin ödenmemesi nedeniyle fesih ihtarına bağlı ödeme süresi vermek istemektedir.

      1. Murat'ın tek başına yaptığı fesih bildirimi geçerli midir? Murat'ın başvurabileceği bir yol var mıdır?
      2. Elif'in bildiriminin hukuki sonucu nedir?
      3. Selim, Elif'in bildirimi sonrasında fesih bildirimini ve ödeme süresini nasıl yapmalıdır?
    olcut:
      - {tespit: "Konutun aile konutu olarak kullanılması; kiracının eşinin açık rızası olmadıkça sözleşmeyi feshedememesi", puan: 25, madde: "TBK m. 349"}
      - {tespit: "Rıza alınamazsa veya eşin haklı sebep olmaksızın kaçınması hâlinde hâkimden karar istenebilmesi", puan: 15, madde: "TBK m. 349"}
      - {tespit: "Kiracı olmayan eşin kiraya verene bildirimle sözleşmenin tarafı olması", puan: 20, madde: "TMK m. 194"}
      - {tespit: "Bildirimde bulunan eşin diğer eşle müteselsilen sorumlu olması", puan: 10, madde: "TMK m. 194"}
      - {tespit: "Kiraya verenin fesih bildirimi ve fesih ihtarına bağlı ödeme süresini kiracıya ve eşine ayrı ayrı bildirmek zorunda olması", puan: 20, madde: "TBK m. 349"}
      - {tespit: "Fesih bildiriminin geçerliliğinin yazılı şekle bağlı olması; Murat'ın bildiriminin yazılı olması şekil şartını karşılasa da rıza eksikliğini gidermemesi", puan: 10, madde: "TBK m. 348"}
    cozum: |
      **Nitelendirme:** Olayda kiracı tek başına sözleşmeyi imzalamış, ancak konut aile konutu olarak kullanılmaktadır. Sorun, kiracı eşin fesih yetkisinin sınırı ile kiracı olmayan eşin sözleşmeye girmesinin sonuçlarıdır.

      **Hukuki sorunlar:** (1) Aile konutunda kiracının tek başına feshi geçerli mi? (2) Fesih için eşin rızası alınamazsa ne yapılır? (3) Kiracı olmayan eşin bildirimi neyi değiştirir? (4) Kiraya veren bildirimleri nasıl yapmalıdır?

      **İlgili hükümler:** TBK m. 348, TBK m. 349; TMK m. 194.

      **Değerlendirme:**

      *1. Murat'ın feshi:* Fesih bildirimi yazılı şekle bağlıdır (TBK m. 348) ve Murat'ın bildirimi noter aracılığıyla yazılı yapılmıştır; şekil bakımından bir eksiklik yoktur. Ancak aile konutu olarak kullanılmak üzere kiralanan taşınmazlarda kiracı, eşinin açık rızası olmadıkça sözleşmeyi feshedemez (TBK m. 349/1; TMK m. 194/1). Elif fesihe razı olmadığından Murat'ın tek başına yaptığı fesih bu şartı karşılamamaktadır. Murat'ın yolu, rızanın alınamaması ya da Elif'in haklı sebep olmaksızın rıza vermekten kaçınması hâlinde hâkimden bu konuda karar vermesini istemektir (TBK m. 349/2; TMK m. 194/2).

      *2. Elif'in bildirimi:* Kiracı olmayan eş, aile konutu eşlerden biri tarafından kira ile sağlanmışsa kiraya verene yapacağı bildirimle sözleşmenin tarafı hâline gelir ve bildirimde bulunan eş diğeriyle müteselsilen sorumlu olur (TMK m. 194/4). Elif bildirimi yaptığı andan itibaren kira sözleşmesinin tarafıdır.

      *3. Selim'in bildirimleri:* Kiracı olmayan eşin bildirimle sözleşmenin tarafı olması hâlinde kiraya veren, fesih bildirimi ile fesih ihtarına bağlı bir ödeme süresini kiracıya ve eşine ayrı ayrı bildirmek zorundadır (TBK m. 349/3). Selim bu nedenle kira bedelinin ödenmemesi sebebiyle vereceği süreli ihtarı ve olası fesih bildirimini hem Murat'a hem Elif'e ayrı ayrı yapmalıdır; yalnız birine yapılan bildirimle kanunun aradığı ayrı ayrı bildirim yapılmış olmaz. Müteselsil sorumluluk, Selim'in bu bildirim yükümlülüğünü kaldırmaz.

      **Sonuç:**
      - Murat'ın fesih bildirimi Elif'in açık rızası olmadığı için geçerli bir fesih sonucu doğurmaz; Murat hâkimden karar isteyebilir.
      - Elif bildirimle sözleşmenin tarafı olmuş ve Murat'la müteselsil sorumlu hâle gelmiştir.
      - Selim, fesih bildirimini ve ödeme süresini Murat'a ve Elif'e ayrı ayrı yapmak zorundadır.

  - olay: |
      Kerem, Beşiktaş'taki çatılı dükkânını 1 Ocak 2023'ten itibaren bir yıllık sözleşmeyle Tuncay'a kiralamış; sözleşme her yıl uzamıştır. Kira yılı 1 Ocak ile 31 Aralık arasındadır. Tuncay, dükkânın tesliminden iki yıl sonra, 15 Ocak 2025'te Kerem'e "dükkânı 1 Eylül 2025'te boşaltacağım" diye yazılı taahhüt vermiş, ancak boşaltmamıştır. Kerem 20 Ekim 2025'te icra takibi başlatmıştır.

      Bundan bağımsız olarak Tuncay 2025 yılı içinde Mart ve Haziran kiralarını ödememiş; Kerem Nisan ve Temmuz'da, TBK m. 315'e uygun biçimde otuz günlük süre veren iki ayrı yazılı ihtar göndermiş, Tuncay borçlarını ihtarlardan sonra ödemiştir. Kerem arabuluculuk başvurusunda bulunmuş, anlaşamama son tutanağı 12 Ocak 2026'da düzenlenmiş ve Kerem 15 Ocak 2026'da tahliye davası açmıştır. Dava kabul edilmiş, Tuncay mahkeme ilamı üzerine icra yoluyla çıkarılmıştır. Kerem dükkânı bir yıl sonra haklı bir sebep olmaksızın başkasına kiralamıştır.

      1. Kerem, 20 Ekim 2025'te başlattığı takibi tahliye taahhüdüne dayandırabilir mi?
      2. Kerem'in açtığı dava hangi sebebe dayanabilir? Dava süresinde midir?
      3. Kerem'in dükkânı bir yıl sonra başkasına kiralaması TBK m. 355 bakımından sonuç doğurur mu?
    olcut:
      - {tespit: "Tahliye taahhüdünün şartları: teslimden sonra verilmiş, yazılı, belirli tarihli", puan: 15, madde: "TBK m. 352"}
      - {tespit: "Taahhüt edilen tarihten başlayarak bir ay içinde icraya başvurulması şartı; 20 Ekim 2025 tarihli takibin süresinde olmaması", puan: 20, madde: "TBK m. 352"}
      - {tespit: "Bir kira yılı içinde kira bedelinin ödenmemesi nedeniyle yazılı iki haklı ihtar şartı; ihtarlardan sonra yapılan ödemenin bu sebebi ortadan kaldırmaması", puan: 20, madde: "TBK m. 352"}
      - {tespit: "İki haklı ihtara dayanan davanın ihtarların yapıldığı kira yılının bitiminden başlayarak bir ay içinde açılması; 15 Ocak 2026 tarihli davanın süresinde olması", puan: 20, madde: "TBK m. 352"}
      - {tespit: "Kira uyuşmazlığında arabuluculuğun dava şartı olması ve son tutanağın bulunması", puan: 10, madde: "HUAK m. 18/B"}
      - {tespit: "Yeniden kiralama yasağının yalnız gereksinim ve yeniden inşa-imar amaçlı boşaltmalarda uygulanması; iki haklı ihtar tahliyesinde yasak ve tazminatın doğmaması", puan: 15, madde: "TBK m. 355"}
    cozum: |
      **Nitelendirme:** Dükkân çatılı işyeri olduğundan TBK m. 339 kapsamındadır. Olayda kiracıdan kaynaklanan iki ayrı tahliye sebebi (tahliye taahhüdü ve iki haklı ihtar), arabuluculuk şartı ve yeniden kiralama yasağı sorunları vardır.

      **Hukuki sorunlar:** (1) Tahliye taahhüdüne dayalı takip süresinde mi? (2) İki haklı ihtar sebebi gerçekleşmiş mi, dava süresinde mi? (3) Arabuluculuk şartı yerine gelmiş mi? (4) TBK m. 355 yasağı bu tahliyeye uygulanır mı?

      **İlgili hükümler:** TBK m. 339, TBK m. 315, TBK m. 352, TBK m. 355; HUAK m. 18/B ve HUAK m. 18/A.

      **Değerlendirme:**

      *1. Tahliye taahhüdü:* TBK m. 352/1 kiracının kiralananın teslim edilmesinden sonra, belli bir tarihte boşaltmayı yazılı olarak üstlenmesini ve boşaltmamasını arar. Tuncay'ın taahhüdü teslimden iki yıl sonra, yazılı ve 1 Eylül 2025 gibi belirli bir tarihle verilmiştir; şartlar vardır. Ancak kiraya veren, sözleşmeyi taahhüt edilen tarihten başlayarak bir ay içinde icraya başvurmak ya da dava açmak suretiyle sona erdirebilir. Boşaltma tarihi 1 Eylül 2025 olduğundan bir aylık süre Ekim başında dolmuştur; 20 Ekim 2025 tarihli takip süresinde değildir. Kerem bu sebebe dayanamaz.

      *2. İki haklı ihtar:* TBK m. 352/2, bir yıl ve daha uzun süreli kiralarda bir kira yılı içinde kira bedelinin ödenmemesi nedeniyle kiracıya yazılı iki haklı ihtarda bulunulmasına sebep olunmasını arar. Tuncay'a 2025 kira yılı içinde Nisan ve Temmuz'da iki yazılı ihtar gönderilmiştir. Yargıtay uygulamasına göre ihtardan sonra yapılan ödeme, iki haklı ihtara sebep olunmuş olmasını ortadan kaldırmaz. Dava, ihtarların yapıldığı kira yılının bitiminden başlayarak bir ay içinde açılmalıdır. Kira yılı 31 Aralık 2025'te bittiğinden süre Ocak 2026'da işler; 15 Ocak 2026 tarihli dava süresindedir. Kira yılı bitmeden açılan dava erken olurdu.

      *3. Arabuluculuk:* Kira ilişkisinden doğan, ilamsız icra yoluyla tahliye dışındaki uyuşmazlıklarda dava açmadan önce arabulucuya başvurmak dava şartıdır (HUAK m. 18/B/1-a). Son tutanak 12 Ocak 2026'da düzenlenmiş ve dava ondan sonra açılmıştır; dava şartı yerine gelmiştir. Arabulucuya başvuru tarihinden son tutanağa kadar hak düşürücü süre işlemez (HUAK m. 18/A/15).

      *4. Yeniden kiralama:* TBK m. 355/1 yalnız gereksinim amacıyla, TBK m. 355/2 yeniden inşa ve imar amacıyla sağlanan boşaltmalar için üç yıllık yasak getirir. Tuncay iki haklı ihtara dayanan davayla tahliye edildiğinden bu hüküm uygulanmaz. Kerem dükkânı bir yıl sonra başkasına kiralasa da TBK m. 355/3'teki tazminat doğmaz.

      **Sonuç:**
      - Tahliye taahhüdüne dayalı takip bir aylık süre geçtiği için süresinde değildir.
      - İki haklı ihtar sebebi gerçekleşmiş ve dava süresinde açılmıştır; arabuluculuk şartı da yerine gelmiştir.
      - Tahliye gereksinim ya da yeniden inşa-imar nedeniyle olmadığından Kerem'in yeniden kiralaması TBK m. 355 kapsamında tazminat doğurmaz.

kartlar:
  - on: "Belirli süreli konut ve çatılı işyeri kirasında kiracı sözleşmeyi nasıl sona erdirir? (TBK m. 347/1)"
    arka: "Süre bitiminden en az 15 gün önce bildirimde bulunur (yazılı, TBK m. 348). Bulunmazsa sözleşme aynı koşullarla 1 yıl uzar."
  - on: "Kiraya veren belirli süreli konut kirasını süre bitimine dayanarak sona erdirebilir mi?"
    arka: "Hayır (TBK m. 347/1). Yalnızca 10 yıllık uzama süresi sonunda, izleyen her uzama yılının bitiminden en az 3 ay önce bildirimle sebepsiz sona erdirebilir."
  - on: "Bir yıllık sözleşmede kiraya veren sebepsiz sona erdirme hakkını en erken ne zaman kullanır?"
    arka: "1 + 10 + 1 hesabıyla 12. yılın sonunda; bildirim bu yıl bitiminden en az 3 ay önce yazılı yapılır. 10 yıllık sözleşmede en erken 21. yılın sonudur."
  - on: "Belirsiz süreli konut kirasında kim ne zaman fesih bildirimi yapabilir? (TBK m. 347/2)"
    arka: "Kiracı her zaman; kiraya veren kiranın başlangıcından 10 yıl geçtikten sonra. İkisi de genel hükümlere göre (yasal dönem ve bildirim süresi) yapar."
  - on: "Konut ve çatılı işyeri kirasında fesih bildirimi hangi şekilde yapılır? (TBK m. 348)"
    arka: "Yazılı şekil geçerlilik şartıdır. Sözlü ya da telefonla yapılan bildirim geçerli değildir."
  - on: "Aile konutunda kiracı sözleşmeyi tek başına feshedebilir mi? (TBK m. 349)"
    arka: "Hayır; eşinin açık rızası gerekir. Rıza alınamazsa veya eş haklı sebep olmaksızın kaçınırsa hâkimden karar ister."
  - on: "Kiracı olmayan eş aile konutu kirasının tarafı nasıl olur? (TMK m. 194/4)"
    arka: "Kiraya verene yapacağı bildirimle. Bildirimde bulunan eş diğeriyle müteselsilen sorumlu olur. Bildirim geleceğe etkilidir."
  - on: "Eşin bildirimiyle taraf olması hâlinde kiraya verenin yükümlülüğü? (TBK m. 349/3)"
    arka: "Fesih bildirimini ve fesih ihtarına bağlı ödeme süresini kiracıya ve eşine ayrı ayrı bildirmek zorundadır."
  - on: "TBK m. 350'ye göre gereksinim kimler için ileri sürülebilir?"
    arka: "Kiraya verenin kendisi, eşi, altsoyu, üstsoyu ve kanun gereği bakmakla yükümlü olduğu kişiler için. Liste sınırlıdır; yakın arkadaş için dava açılamaz."
  - on: "Yeniden inşa ve imar sebebinin şartları? (TBK m. 350)"
    arka: "Esaslı onarım, genişletme veya değiştirme gerekli olmalı ve işler sırasında kiralananın kullanımı imkânsız olmalıdır."
  - on: "TBK m. 350 davası ne zaman açılır?"
    arka: "Belirli süreli sözleşmede sürenin sonundan, belirsiz süreli sözleşmede genel hükümlere göre belirlenen fesih tarihinden başlayarak 1 ay içinde."
  - on: "Yeni malikin gereksinim davası için şartlar? (TBK m. 351)"
    arka: "Edinme tarihinden başlayarak 1 ay içinde kiracıya yazılı bildirim; sözleşme bu bildirimle 6 ay sonra açılacak davayla sona erdirilir. Ya da sözleşme bitiminden başlayarak 1 ay içinde dava."
  - on: "Yazılı tahliye taahhüdünün şartları ve süresi? (TBK m. 352/1)"
    arka: "Teslimden sonra verilmiş, yazılı ve belirli tarihli olmalıdır. Kiraya veren taahhüt edilen tarihten başlayarak 1 ay içinde icraya başvurur veya dava açar."
  - on: "İki haklı ihtar sebebi nedir? (TBK m. 352/2)"
    arka: "Bir kira yılı içinde kira bedelinin ödenmemesi nedeniyle kiracıya yazılı iki haklı ihtar gönderilmesine sebep olmaktır. Dava, kira yılının bitiminden başlayarak 1 ay içinde açılır."
  - on: "Aynı ilçede konut sebebi ne zaman kullanılır? (TBK m. 352/3)"
    arka: "Kiracının veya eşinin aynı ilçe/belde sınırlarında oturmaya elverişli konutu varsa ve kiraya veren sözleşme kurulurken bilmiyorsa, sözleşme bitiminden başlayarak 1 ay içinde dava açar."
  - on: "TBK m. 353 neyi düzenler?"
    arka: "Kiraya veren dava açma süresi içinde dava açacağını kiracıya yazılı bildirirse dava açma süresi bir kira yılı için uzamış sayılır."
  - on: "Dava yoluyla tahliye sebepleri sözleşmeyle genişletilebilir mi? (TBK m. 354)"
    arka: "Hayır. Dava yoluyla sona erdirmeye ilişkin hükümler kiracı aleyhine değiştirilemez; sebepler sınırlı sayıdadır."
  - on: "Yeniden kiralama yasağı ve sonucu? (TBK m. 355)"
    arka: "Gereksinimle boşaltılan taşınmaz haklı sebep olmadıkça 3 yıl eski kiracıdan başkasına kiralanamaz. İhlalde son kira yılında ödenen bir yıllık kira bedelinden az olmamak üzere tazminat ödenir."
  - on: "Yeniden inşa ve imar sonrası eski kiracının öncelik hakkı?"
    arka: "Yeni durum ve yeni kira bedeliyle kiralamada öncelik hakkı vardır; kiraya verenin yazılı bildirimini izleyen 1 ay içinde kullanılmalıdır (TBK m. 355/2)."
  - on: "Kiracı ölürse sözleşmeyi kimler sürdürebilir? (TBK m. 356)"
    arka: "Ölen kiracının ortakları, bu ortakların aynı meslek ve sanatı yürüten mirasçıları ve birlikte aynı konutta oturanlar, sözleşmeye ve kanuna uydukları sürece taraf olarak."
  - on: "Kira davalarında arabuluculuk dava şartı mıdır? (HUAK m. 18/B)"
    arka: "Evet; ilamsız icra yoluyla tahliye hariç, kira ilişkisinden doğan uyuşmazlıklarda dava açmadan önce arabulucuya başvurmak dava şartıdır."
  - on: "Konut kirası artışına getirilen yüzde yirmi beşlik sınır hâlâ geçerli mi?"
    arka: "Hayır. TBK'nın geçici 1. ve geçici 2. maddeleri 1 Temmuz 2024'te sona ermiştir; artış TBK m. 344'e göre TÜFE ile sınırlıdır."
