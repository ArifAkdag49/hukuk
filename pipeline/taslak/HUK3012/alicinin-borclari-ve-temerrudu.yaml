ozet: |
  **Bu konu neyi cevaplıyor?** Satıcı malı verdi ya da vermeye hazır. Alıcının ne borcu var, bedel belli değilse nasıl bulunur, bedel ne zaman istenir ve alıcı ödemezse satıcı ne yapabilir?

  - **Alıcının iki asli borcu (TBK m. 232/1):** kararlaştırılan **bedeli ödemek** ve kendisine sunulan **satılanı devralmak**. Aksine âdet ya da anlaşma yoksa satılan **hemen** devralınır (TBK m. 232/2). Devralmak için yapılan giderler ve ifa yerinden başka yere taşıma giderleri alıcıya, ölçme ve tartma giderleri satıcıya aittir (TBK m. 211/1).
  - **Bedel belirtilmemişse (TBK m. 233):** alıcı malı alacağını **kesin olarak** bildirmişse satış, **ifa yeri ve zamanındaki ortalama piyasa fiyatı** üzerinden yapılmış sayılır. Bedel ağırlığa göre hesaplanıyorsa **dara indirilir**; ticari teamüller saklıdır.
  - **Muacceliyet ve faiz (TBK m. 234):** aksine sözleşme yoksa bedel, satılan **alıcının zilyetliğine girince** muaccel olur. Üç hâlde ihtar gerekmeden faiz istenebilir: faiz konusunda **teamül** varsa, alıcının maldan **ürün ya da verim elde etme imkânı** varsa, **belirli günün geçmesiyle temerrüt** gerçekleşmişse.
  - **Peşin satışta dönme (TBK m. 235/1-2):** satılan ancak bedel ödendikten sonra ya da ödenme anında devredilecekse alıcının temerrüdünde satıcı **herhangi bir işlem gerekmeksizin** (süre vermeden) satıştan dönebilir; ama dönmek istiyorsa durumu **gecikmeksizin** alıcıya bildirmelidir.
  - **Veresiye satışta dönme (TBK m. 235/3):** zilyetlik bedel ödenmeden devredilmişse satıcının dönüp malı geri alması ancak bu hakkın **sözleşmede açıkça saklı tutulmasına** bağlıdır. Saklanmamışsa süre verse de dönemez; bedeli ve gecikme zararını ister.
  - **Zararın hesabı (TBK m. 236):** borcunu ifa etmeyen alıcı satıcının zararını giderir. **Somut yöntem:** sözleşme bedeli ile malın dürüstlük kurallarına uygun **ikame satışından** elde edilen bedel arasındaki fark (TBK m. 236/2). **Soyut yöntem:** borsada kayıtlı ya da piyasa fiyatı olan mallarda ikame satış gerekmeden sözleşme bedeli ile **belirlenmiş ödeme günündeki fiyat** arasındaki fark (TBK m. 236/3).
  - **Yalnız devralmada temerrüt:** alacaklı temerrüdü hükümleri uygulanır: hasar ve giderler alıcıya ait olmak üzere **tevdi** (TBK m. 107) ya da hâkim izniyle **sattırma** (TBK m. 108); tacirler arasında ayrıca TTK m. 23/1-b.
  - **Sınav hatırlatması:** peşin satışta satıcı susarsa dönmüş sayılmaz; veresiyede teslimden sonra "süre verip dönerim" demek yetmez; ihtarsız faizde fiilen gelir elde etmek aranmaz, **imkân** yeter; ikame satış için açık artırma şartı yoktur.

anlatim: |
  ## 0. Konunun haritası

  Satış sözleşmesinde satıcı, satılanın zilyetlik ve mülkiyetini devretmeyi; alıcı da karşılığında bir bedel ödemeyi üstlenir (TBK m. 207/1). Önceki konularda satıcının borcunu ve sorumluluğunu gördük. Bu konu madalyonun öbür yüzüdür: **alıcı ne borçlanır ve borcunu yerine getirmezse ne olur?** Beş madde beş soruya cevap verir:

  | Madde | Cevapladığı soru |
  |---|---|
  | TBK m. 232 | Alıcının borçları neler? |
  | TBK m. 233 | Bedel belirtilmemişse nasıl bulunur? |
  | TBK m. 234 | Bedel ne zaman muaccel olur, faiz ne zaman istenir? |
  | TBK m. 235 | Alıcı temerrüde düşerse satıcı dönebilir mi? |
  | TBK m. 236 | Satıcının zararı nasıl hesaplanır? |

  Olay sorusunda bu sırayla ilerle: (1) Bedel belli mi, belli değilse nasıl bulunur? (2) Muaccel mi, faiz işler mi? (3) Alıcı temerrüde düştü mü? (4) Satış **peşin** mi, **veresiye** mi? (5) Satıcı dönebilir mi, zararını hangi yöntemle hesaplar?

  > 📌 **Kesin bilgi:** TBK m. 232 ile TBK m. 236 arasındaki hükümlerin resmî metninde değişiklik notu yoktur; yakın tarihli bir kanun değişikliği bu hükümlere dokunmamıştır. Metin güncel hâliyle ezberlenebilir.

  ## 1. Alıcının borçları (TBK m. 232)

  TBK m. 232/1'e göre alıcı, "satış sözleşmesinde kararlaştırılmış olduğu biçimde satış bedelini ödemek ve kendisine sunulan satılanı devralmakla yükümlüdür." İki ayrı borç vardır:

  1. **Bedeli ödeme borcu:** satış sözleşmesinin asli edimidir. Bedelin baştan rakamla belli olması gerekmez; "durum ve koşullara göre belirlenmesi mümkün olan bedel, kararlaştırılmış bedel hükmündedir" (TBK m. 207/3). TBK m. 233 bunun en önemli uygulamasıdır.
  2. **Devralma (kabul) borcu:** satıcı malı gereği gibi sunmuşsa alıcı onu teslim almalıdır. Aksine yerel âdet veya anlaşma yoksa satılan **hemen** devralınır (TBK m. 232/2). Satıcının malı elinde tutup alıcıyı beklemesi için bir sebep yoktur.

  Taraflar aksini kararlaştırmadıkça edimler **aynı anda** ifa edilir (TBK m. 207/2). Yani kural, malın teslimiyle bedelin ödenmesinin birlikte yapılmasıdır. Vade ya da veresiye ancak sözleşmeyle ya da âdetle ortaya çıkar. Bu ayrım TBK m. 235'in kalbidir; aşağıda göreceksin.

  ### 1.1 Giderler
  Giderlerin kime ait olduğu TBK m. 211/1'dedir. Aksine sözleşme veya âdet yoksa:

  | Gider | Kime ait? |
  |---|---|
  | Ölçme ve tartma gibi devir giderleri | Satıcı |
  | Satılanı devralmak üzere yapılan giderler | Alıcı |
  | Satılanın ifa yerinden başka yere taşınması | Alıcı |

  "Gidersiz devir" kararlaştırılmışsa satıcı taşıma giderlerini üstlenmiş sayılır (TBK m. 211/2).

  > **Örnek:** Ali, mermer bloklarını Zeynep'e satar; teslim yeri Ali'nin ocağıdır. Blokları kantarda tartmanın gideri Ali'ye aittir. Zeynep'in tırını göndermesi, yükleme için vinç tutması ve blokları kendi atölyesine taşıması Zeynep'in giderleridir.

  > ⚠️ **Sınavda dikkat:** Alıcının gider yükü "TBK m. 232" altında aranmaz; TBK m. 232 yalnız iki borcu ve devralma zamanını söyler. Giderler için TBK m. 211/1'e git.

  ### 1.2 Devralma borcunun niteliği
  "Alıcı satılanı almak zorunda mıdır, yoksa almak bir **külfet** midir?" Bu tartışma doktrin bölümünde ayrıntılıdır. Sınav için pratik sonuç şu: Alıcı yalnız devralmada temerrüde düşerse (bedeli ödemiş ama malı almıyorsa) satıcı **alacaklı temerrüdü** hükümlerinden yararlanır (bkz. bölüm 8).

  ## 2. Bedel belirtilmemişse (TBK m. 233)

  ### 2.1 Ortalama piyasa fiyatı karinesi
  TBK m. 233/1: Alıcı, satış bedelini belirtmeksizin, malı alacağını **kesin olarak** bildirmişse satış, **ifa yeri ve zamanındaki ortalama piyasa fiyatı** üzerinden yapılmış sayılır. Şartlar:
  1. Alıcı bedeli belirtmemiştir.
  2. Alıcı malı alacağını **kesin** olarak bildirmiştir. "Fiyatı öğreneyim, sonra karar veririm" demek kesin bildirim değildir ve satışı kurmaz.
  3. Satış bu bildirimle kurulur; bedel, **ifa yerindeki ve ifa zamanındaki** ortalama piyasa fiyatıdır.

  Hükmün özelliği şudur: Bedel kararlaştırılmamış gibi görünse de sözleşme geçerlidir; çünkü bedel durum ve koşullara göre belirlenebilir (TBK m. 207/3).

  > **Örnek:** Ayşe Hanım telefonla bir un fabrikasını arar: "On ton un gönderin, kesin alıyorum." Fiyat konuşulmaz. Taraflar teslimin 10 Mart'ta fabrikada yapılacağını belirlemiştir. Bedel, 10 Mart'ta fabrikanın bulunduğu yerdeki ortalama piyasa fiyatıdır; fabrikanın sonradan düzenlediği fatura bedeli değildir.

  > ⚠️ **Sınavda dikkat:** Kanun metni "ifa yeri ve zamanındaki" der. Fiyatın sözleşmenin kurulduğu ya da faturanın düzenlendiği güne göre belirleneceğini söyleyen bir ifade kanun metnine aykırıdır. İfa zamanını olayda **ifanın yapılması gereken gün** olarak oku.

  ### 2.2 Uygulamada: faturaya karşı piyasa fiyatı
  Yargıtay'ın yerleşik uygulamasına göre taraflar arasında yazılı bir fiyat anlaşması yoksa ve mal teslim edilmişse, satıcının tek taraflı faturasındaki bedel kendiliğinden bağlayıcı olmaz; uyuşmazlıkta TBK m. 233/1 gereği ortalama piyasa fiyatı mahkemece araştırılır. Tacirler arasında faturaya sekiz gün içinde itiraz edilmemesinin ayrıca bir önemi vardır (TTK m. 21/2); bu ayrıntı ticaret hukukunun konusudur.

  ### 2.3 Dara indirimi
  Bedel satılanın **ağırlığına** göre hesaplanıyorsa "darası indirilir" (TBK m. 233/2). **Dara**, ambalajın (çuval, sandık, kap) ağırlığıdır; ödenecek bedel **net ağırlık** üzerinden hesaplanır. Bazı ticari mallarda ambalaj ağırlığının belli bir miktar ya da yüzde olarak indirilmesine veya bedelin daralı ağırlık üzerinden belirlenmesine ilişkin **ticari teamüller saklıdır** (TBK m. 233/3).

  > **Örnek:** Mehmet, 5.200 kg brüt ağırlıktaki ürünü ton başına 20.000 TL'den alır; ambalajın ağırlığı 200 kg'dır ve teamül yoktur. Net ağırlık 5.000 kg'dır; bedel 5 x 20.000 = 100.000 TL'dir.

  ## 3. Muacceliyet ve faiz (TBK m. 234)

  ### 3.1 Bedel ne zaman muaccel olur?
  TBK m. 234/1: Aksine sözleşme yoksa satılan **alıcının zilyetliğine girince** satış bedeli **muaccel** olur. **Muacceliyet**, alacaklının borcun ifasını isteyebildiği andır. Kural iki yönlüdür:
  - Sözleşmede **vade** varsa (ör. "bedel teslimden 15 gün sonra ödenir") vadeye uyulur.
  - Vade yoksa teslimle birlikte bedel istenebilir.

  Yargıtay uygulamasında ispat yükü de buna göre dağılır: teslimin yapıldığını satıcı, teslimle muaccel olan bedeli ödediğini alıcı ispatlar. Bedeli ödediğini ileri süren alıcının bunu yasal delille kanıtlaması gerekir; aşağıdaki kararlardan birinde bu nokta belirleyici olmuştur.

  ### 3.2 İhtarsız faiz hâlleri
  Temerrüt için genel kural, muaccel bir borçta alacaklının **ihtarıdır** (TBK m. 117/1). TBK m. 234/2 satışta bunu yumuşatır: Şu üç hâlden biri varsa **ayrıca bir ihtara gerek olmaksızın** satış bedeline faiz istenebilir:

  | Hâl | Anlamı |
  |---|---|
  | Faiz istenebileceği konusunda **teamül** var | Ticari âdet faizi gerektiriyor |
  | Alıcı maldan **ürün veya verim elde etme imkânına** sahip | Meyve bahçesi, kiracılı dükkân gibi |
  | **Belirli günün geçmesiyle** temerrüt gerçekleşti | Kesin vade günü var |

  Üçüncü hâl, TBK m. 117/2'nin satışa yansımasıdır: Borcun ifa edileceği gün birlikte belirlenmişse bu günün geçmesiyle borçlu ihtarsız temerrüde düşer.

  > ⚠️ **Sınavda dikkat:** İkinci hâlde kanun "elde etme **imkânına sahip** olmayı" arar. Alıcı bahçeyi hiç işletmemiş ya da kiraya vermemiş olsa bile imkânı varsa ihtarsız faiz istenebilir. Fiilen gelir elde etmiş olmak şart değildir.

  Temerrüt faizinin oranı sözleşmede kararlaştırılmamışsa faiz borcunun doğduğu tarihte yürürlükteki mevzuata göre belirlenir; sözleşmeyle kararlaştırılacak yıllık temerrüt faizi oranı, bu şekilde belirlenen oranın yüzde yüz fazlasını aşamaz (TBK m. 120/1-2).

  > 📌 **Kesin bilgi:** Satış bedelinin döviz cinsinden ya da dövize endeksli kararlaştırılabilmesi, 32 sayılı Türk Parasının Kıymetini Koruma Hakkında Karar ve ilgili Tebliğ'in düzenlemesine bağlıdır; bu düzenleme zaman zaman değişir. Konuyu çalışırken Karar ve Tebliğ'in güncel metnine ayrıca bak; bu notta kesin bir ayrıntı verilmemiştir.

  ## 4. Alıcının temerrüdü: genel çerçeve

  Alıcının "temerrüdü" iki ayrı durumda karşımıza çıkar. Bunları karıştırmamak gerekir:

  | Temerrüt türü | Alıcının hareketi | Başvuru |
  |---|---|---|
  | Ödemede (borçlu) temerrüdü | Bedeli ödemez | TBK m. 235 ve TBK m. 236 |
  | Devralmada temerrüt | Mal sunulur, alıcı almaz | Alacaklı temerrüdü: TBK m. 106, TBK m. 107 ve TBK m. 108 |

  **Ödemede temerrüdün şartları** genel hükümlerden gelir: Borç muaccel olmalı ve alacaklı ihtarla borçluyu temerrüde düşürmelidir (TBK m. 117/1). Ödeme günü sözleşmeyle belirlenmişse bu günün geçmesiyle ihtarsız temerrüt gerçekleşir (TBK m. 117/2). Temerrüde düşen borçlu, kusursuzluğunu ispat etmedikçe geç ifadan doğan zararı giderir (TBK m. 118).

  Karşılıklı borç yükleyen sözleşmelerde temerrüde düşen tarafa **uygun süre verilmesi** esastır (TBK m. 123). Bazı hâllerde süre vermek gerekmez (TBK m. 124): Süre verilmesinin etkisiz olacağı anlaşılıyorsa, temerrüt sonucunda ifa alacaklı için yararsız kalmışsa ya da sözleşmeden ifanın artık kabul edilmeyeceği anlaşılıyorsa. Süre verilmesine rağmen ifa edilmezse (ya da süre gerekmiyorsa) alacaklı ifayı ve gecikme tazminatını isteyebilir; ya da ifadan vazgeçip borcun ifa edilmemesinden doğan zararı isteyebilir veya sözleşmeden dönebilir (TBK m. 125).

  İşte TBK m. 235 bu genel sistemi **satışa özgü olarak** değiştirir: Peşin satışta süre vermeden dönme imkânı tanır, veresiyede ise genel hükümdeki dönme yolunu daraltır.

  ## 5. Peşin satışta dönme hakkı (TBK m. 235/1 ve 235/2)

  ### 5.1 Şartlar
  TBK m. 235/1: Satılanın ancak bedel ödendikten sonra veya ödenme anında devredilmesi gereken durumlarda alıcı temerrüde düşerse satıcı, "herhangi bir işlem gerekmeksizin" satıştan dönebilir. Bunlara **peşin satış** diyoruz. Kural, edimlerin aynı anda ifa edilmesi olduğundan (TBK m. 207/2) bedelin teslim anında ödenmesi gereken satışlar bu hükmün kapsamındadır.

  Satıcı bu durumda alıcıya **ek süre vermek zorunda değildir.** Genel hükümdeki "uygun süre verme" aşaması (TBK m. 123) atlanır. Mantığı şudur: Satıcı, bedeli almadan malını vermeyecektir; alıcının ödememesi ilişkinin dengesini baştan bozmuştur.

  ### 5.2 Bildirim külfeti
  Dönme hakkını kullanmak isteyen satıcı, durumu **gecikmeksizin** alıcıya bildirmek zorundadır (TBK m. 235/2). Satıcı susar ve hiçbir şey söylemezse **sözleşmeden dönmüş sayılmaz.** Dönme, bildirimle kullanılan bir haktır.

  > **Örnek:** Galerici Ali, otomobili Mehmet'e 10 Nisan'da bedel peşin ödenerek teslim edilmek üzere satar. Mehmet 10 Nisan'da ne parayı getirir ne de aracı alır. Ali ek süre vermeden o gün ya da hemen ertesi gün Mehmet'e "sözleşmeden dönüyorum" diye bildirir. Dönme geçerlidir. Ali hiçbir şey söylemeseydi sözleşmeden dönmüş sayılmazdı.

  ### 5.3 Sonucu
  Dönme beyanıyla taraflar karşılıklı ifa yükümlülüğünden kurtulur ve daha önce ifa ettikleri edimleri geri isteyebilir (TBK m. 125/3'teki genel sonuç). Satıcının dönmenin yanında TBK m. 236'daki farkı da isteyip isteyemeyeceği doktrinde tartışmalıdır (bkz. bölüm 7.5).

  > ⚠️ **Sınavda dikkat (iki susma):** Satıcının temerrüdünde, zilyetliğin devri için belirli süre konulmuş ticari satışta alıcı **susarsa** devir isteminden vazgeçip zararının giderimini istemiş sayılır (TBK m. 212/2). Alıcının temerrüdünde ise satıcı susarsa **dönmüş sayılmaz** (TBK m. 235/2). İki hükmü aynı kefeye koyma.

  ## 6. Veresiye satışta dönme hakkı (TBK m. 235/3)

  ### 6.1 Kural
  Satılanın zilyetliği **bedel ödenmeden alıcıya devredilmişse** (veresiye ya da kredili satış) alıcının temerrüdü sebebiyle satıcının dönme hakkını kullanarak satılanı geri alması, "bu hakkın sözleşmede açıkça saklı tutulmasına bağlıdır" (TBK m. 235/3).

  Yani satıcı malı teslim edip bedeli sonraya bırakmışsa ve sözleşmeye "bedel ödenmezse dönerim" kaydını koymamışsa, alıcı vadede ödemese bile satıcı **süre verse de** dönüp malı geri alamaz. Bu, genel hükümlerden (TBK m. 123, TBK m. 124 ve TBK m. 125) bilinçli bir sapmadır: Satıcı malını riske atmıştır, alıcının zilyetliği korunur.

  Satıcının elinde kalan haklar:
  - Bedelin ödenmesini ve gecikme tazminatını isteme (TBK m. 125/1).
  - Muacceliyet ve temerrüt şartları gerçekleşmişse faiz (TBK m. 234/2).

  > **Örnek:** Çiftçi Ayşe'ye bir biçerdöver 1.200.000 TL'ye satılıp teslim edilir. Bedelin teslimden 15 gün sonra ödeneceği yazılıdır, dönme hakkı saklı tutulmamıştır. Ayşe ödemez. Satıcı noterden 10 gün süre verip döndüğünü bildirse bile biçerdöveri geri isteyemez; yalnız bedelini ve faizini isteyebilir.

  ### 6.2 Dönme hakkını saklı tutmak ile mülkiyeti saklı tutmak aynı şey değildir
  | Kurum | Dayanağı | Şekil |
  |---|---|---|
  | Dönme hakkını saklı tutma | TBK m. 235/3 | Sözleşmede açıkça yazılması yeter |
  | Mülkiyeti saklı tutma | TMK m. 764 | Resmî şekil, noterlikte özel sicile kayıt |

  Taşınır mülkiyeti zilyetliğin devriyle geçer (TMK m. 763/1). Satıcı mülkiyeti saklı tutmak istiyorsa TMK m. 764'e göre resmî şekilde sözleşme yapıp bunu alıcının yerleşim yeri noterliğindeki özel sicile kaydettirmelidir; hayvan satışlarında bu sözleşme yapılamaz. Yargıtay'ın yerleşik yaklaşımına göre dönme hakkının saklı tutulması ise bu şekle ve sicile bağlı değildir; ancak bu saklılık üçüncü kişilere karşı ayni etki doğurmaz, yalnız alıcıya karşı şahsi iade talebi verir.

  ### 6.3 Taşınmaz satışı
  Taşınır satışına ilişkin kurallar kıyas yoluyla taşınmaz satışında da uygulanır (TBK m. 246). Taşınmazı tapuda devredip bedeli tahsil edemeyen satıcının "alıcı ödemedi" diyerek tapu iptali ve tescil istemesi bu yüzden zorlaşır: Dönme hakkı sözleşmede açıkça saklı tutulmamışsa dönerek taşınmazı geri alması beklenemez. Aşağıdaki karar özetlerinden birinde bölge adliye mahkemesi, resmî senette dönme hakkına ilişkin kayıt bulunmadığını belirterek davayı reddetmiştir; Yargıtay tapu iptali ve tescil isteminin reddini yerinde bulmuş, ama ret sebebi olarak hile iddiasının ispatlanamamasını göstermiştir. Bedel istemi ise ayrıca değerlendirilir.

  ### 6.4 Peşin ve veresiye satışın karşılaştırması
  | | Peşin satış | Veresiye satış |
  |---|---|---|
  | Zilyetlik | Bedelden sonra ya da bedelle aynı anda | Bedelden önce devredilmiş |
  | Dönme için ek süre | Gerekmez | Dönme hakkı saklı değilse dönülemez |
  | Dönme şartı | Alıcının temerrüdü ve gecikmeksizin bildirim | Hakkın sözleşmede açıkça saklı tutulması |

  > 💡 **Püf nokta:** Soruda "mal teslim edildi mi?" sorusunu sor. Teslim yoksa TBK m. 235/1-2 (peşin); teslim var, bedel ödenmemiş ve dönme hakkı saklı değilse TBK m. 235/3 (veresiye, dönülemez).

  ### 6.5 Taksitli satışla karıştırma
  TBK m. 235 bu konuda bir **genel** hükümdür. Taksitle satışta alıcının temerrüdü ayrı düzenlenmiştir: peşinat ve taksitlere özel şartlar ve en az on beş günlük süre vardır (TBK m. 259 ve TBK m. 260). Ön ödemeli satışta ise TBK m. 271 uygulanır. Bu hükümler ayrı konuların içeriğidir; burada yalnız "taksit varsa özel kuralı ara" diye hatırla.

  ## 7. Satıcının zararı (TBK m. 236)

  ### 7.1 Genel ilke
  TBK m. 236/1: Borcunu ifa etmeyen alıcı, satıcının bu yüzden uğradığı zararı gidermekle yükümlüdür. İkinci ve üçüncü fıkralar, bedeli ödemede temerrüde düşen alıcı bakımından zararı **iki yöntemle** hesaplatır. İki yöntemde de zarar, sözleşme bedeli ile mal için başka yerden elde edilen ya da elde edilebilecek değer arasındaki farktır.

  ### 7.2 Somut yöntem (TBK m. 236/2)
  Satıcı, malı **başkasına dürüstlük kurallarına uygun olarak** satar. Sözleşme bedeli ile bu **ikame satıştan** elde edilen bedel arasındaki fark zarardır.

  - Eski Borçlar Kanunu döneminde ikame satışın açık artırmayla yapılması aranırdı. Güncel metinde böyle bir şart yoktur; şart, satışın **dürüstlük kurallarına uygun** yapılmasıdır.
  - Satıcı malı makul bir piyasa araştırması yapmadan çok düşük fiyata (örneğin yakınına) satarsa bu satış dürüstlük kuralına uygun olmaz ve aradaki fahiş fark alıcıdan istenemez.

  > **Örnek:** Özel yapım bir makine 600.000 TL'ye satılır; alıcı ödemez. Satıcı makineyi, ilan vererek bulduğu başka bir işletmeye 540.000 TL'ye satar. Zarar 600.000 - 540.000 = 60.000 TL'dir.

  ### 7.3 Soyut yöntem (TBK m. 236/3)
  Satılan **borsada kayıtlı** ya da **piyasa fiyatı bulunan** mallardan ise satıcı, ikame satış yapmaya **gerek kalmaksızın** sözleşme bedeli ile malın **belirlenmiş ödeme günündeki fiyatı** arasındaki farka göre hesaplanan zararı isteyebilir. Fiyat dava günündeki değil, **ödeme günündeki** fiyattır.

  > **Örnek:** Zeynep'e 80 ton buğday ton başına 10.000 TL'den satılmıştır (toplam 800.000 TL). Ödeme günü buğdayın piyasa fiyatı ton başına 9.000 TL'dir (toplam 720.000 TL). Satıcı hiç satış yapmasa da 800.000 - 720.000 = 80.000 TL'lik zararın giderilmesini isteyebilir.

  | Yöntem | Hangi mallarda? | Hesap |
  |---|---|---|
  | Somut (TBK m. 236/2) | Her mal | Sözleşme bedeli - ikame satış bedeli |
  | Soyut (TBK m. 236/3) | Borsada kayıtlı veya piyasa fiyatı olan mal | Sözleşme bedeli - ödeme günü fiyatı |

  ### 7.4 Yargıtay uygulaması
  Hukuk Genel Kurulu'nun bir kararında, alımdan vazgeçen alıcıya karşı satıcı peşinatı "üretim kaybı" zararına mahsup ettiğini ileri sürmüştür. Alıcının verdiği para bağlanma parası olduğundan (TBK m. 177) aksine sözleşme veya yerel âdet olmadıkça esas alacaktan düşülür; sözleşme ortadan kalkınca da geri istenebilir. Genel Kurul, ileri sürülen üretim kaybının TBK m. 236'daki zarar türleri kapsamında değerlendirilemeyeceğini ve ayrıca ispatlanamadığını belirterek alıcının iade istemini kabul eden direnme kararını onamıştır (bkz. karar özetleri).

  > ⚠️ **Sınavda dikkat:** Zararı daima bir **yönteme** bağla: "Somut yöntemle ikame satış farkı" ya da "soyut yöntemle ödeme günü fiyat farkı". Kanunda öngörülmeyen bir zarar kalemini (örneğin ispatlanmamış bir üretim kaybını) bu hükümler kapsamında istemek yetmez; satıcı zararı ispat etmek zorundadır.

  ### 7.5 Dönme ile zarar ilişkisi
  Peşin satışta satıcı TBK m. 235/1'e göre döndükten sonra TBK m. 236'daki farkı da isteyebilir mi? Bu soru doktrinde iki görüşe bölünmüştür (doktrin bölümüne bak). Olay çözümlerinde bu tartışmalı noktaya dayanma; yalnız "zarar hangi yöntemle hesaplanır" sorusuna cevap ver.

  ## 8. Yalnız devralmada temerrüt: alacaklı temerrüdü

  Alıcı bedeli ödediği hâlde sunulan malı hiçbir haklı sebep olmadan almıyorsa temerrüde düşmüş olur (TBK m. 106/1). Bu durumda satıcı:
  - **Tevdi** edebilir: Teslim edeceği şeyi mahkemenin belirleyeceği bir yere bırakarak borcundan kurtulur; **hasar ve giderler alıcıya aittir** (TBK m. 107/1). Ticari mallar hâkim kararı olmadan da bir ardiyeye tevdi edilebilir (TBK m. 107/2).
  - Mal tevdiye elverişli değilse, bozulabilirse ya da bakımı önemli gider gerektiriyorsa, alıcıya önceden ihtar etmek koşuluyla, hâkimin izniyle malı **açık artırma yoluyla sattırıp bedelini tevdi** edebilir (TBK m. 108/1). Borsada kayıtlı mallarda ya da piyasa fiyatı olanlarda açık artırma zorunlu değildir ve hâkim önceden ihtar şartını aramadan izin verebilir (TBK m. 108/2).
  - **Tacirler arasında** ayrıca TTK m. 23/1-b vardır: Alıcı mütemerrit olursa satıcı, malın satışına izin verilmesini mahkemeden isteyebilir. Mahkeme satışın açık artırmayla ya da yetkilendirilen bir kişi aracılığıyla yapılmasına karar verir. Satış giderleri çıkarıldıktan sonra artan para, satıcının takas hakkı saklı kalmak üzere alıcı adına bankaya (banka yoksa notere) bırakılır ve durum hemen alıcıya bildirilir.

  > **Örnek:** Çimento fabrikası, tacir müteahhide sattığı çimentoyu belirlenen gün hazır tutar; müteahhit haklı sebep göstermeden gelip almaz. Fabrika hâkim kararı beklemeden çimentoyu bir ardiyeye tevdi edebilir; ardiye gideri ve malın uğrayacağı hasar müteahhide aittir.

  ## 9. Satıcı temerrüdü ile alıcı temerrüdünün karşılaştırılması

  | | Satıcının temerrüdü | Alıcının temerrüdü |
  |---|---|---|
  | Hüküm | TBK m. 212 ve TBK m. 213 | TBK m. 235 ve TBK m. 236 |
  | Somut hesap | Sözleşme bedeli ile ikame alım bedeli | Sözleşme bedeli ile ikame satış bedeli |
  | Soyut hesap | Belirlenmiş ifa günündeki piyasa fiyatı | Belirlenmiş ödeme günündeki fiyat |
  | Susma | Ticari satışta alıcı susarsa ifadan vazgeçmiş sayılır | Peşin satışta satıcı susarsa dönmüş sayılmaz |

  Simetri açıktır: TBK m. 213'te alıcı bir başkasını satın alır, TBK m. 236'da satıcı malı başkasına satar. Ama susmanın sonucu simetrik değildir.

  ## 10. Denetim şeması

  1. **Sözleşme:** Satış kurulmuş mu? Bedel belirli ya da belirlenebilir mi (TBK m. 207/3)? Belirtilmemişse alıcı kesin bildirimde bulundu mu (TBK m. 233/1)?
  2. **Bedelin miktarı:** Fiyat ifa yeri ve zamanındaki ortalama piyasa fiyatı mı? Ağırlığa göre ise dara düşüldü mü?
  3. **Muacceliyet:** Vade var mı? Yoksa satılan alıcının zilyetliğine girdi mi (TBK m. 234/1)?
  4. **Faiz:** Teamül, verim imkânı ya da belirli günün geçmesi var mı? Yoksa ihtar şart.
  5. **Alıcı temerrüde düştü mü?** Ödemede mi, devralmada mı?
  6. **Peşin mi veresiye mi?** Peşinse bildirimle dön (TBK m. 235/1-2). Veresiyeyse dönme hakkı sözleşmede açıkça saklı mı (TBK m. 235/3)?
  7. **Zarar:** Piyasa fiyatı olan mal mı (soyut, TBK m. 236/3)? Değilse dürüstlük kurallarına uygun ikame satış var mı (somut, TBK m. 236/2)?
  8. **Yalnız devralma sorunu mu?** Tevdi (TBK m. 107), sattırma (TBK m. 108), tacirler arasında TTK m. 23/1-b.

kritik: |
  - 📌 Alıcının iki asli borcu: **bedeli ödemek** ve kendisine sunulan **satılanı devralmak** (TBK m. 232/1). Aksine âdet ya da anlaşma yoksa satılan **hemen** devralınır (TBK m. 232/2).
  - 📌 Giderler TBK m. 211/1'dedir: **ölçme ve tartma satıcıya**; **devralmak üzere yapılan giderler ve ifa yerinden başka yere taşıma alıcıya** aittir. TBK m. 232'de gider hükmü aramayın.
  - 📌 Bedel belirtilmeden **kesin sipariş** verilmişse satış **ifa yeri ve zamanındaki ortalama piyasa fiyatı** üzerinden yapılmış sayılır (TBK m. 233/1). "Kesin" bildirim şarttır.
  - ⚠️ TBK m. 233/1'de fiyat **ifa yeri ve zamanına** göre belirlenir; sözleşmenin kurulduğu ya da fatura düzenlendiği güne göre değil.
  - 📌 Bedel ağırlığa göre hesaplanıyorsa **dara indirilir** (TBK m. 233/2); ambalajla ilgili ticari teamüller saklıdır (TBK m. 233/3).
  - 📌 Aksine sözleşme yoksa bedel, satılan **alıcının zilyetliğine girince muaccel** olur (TBK m. 234/1).
  - 📌 **İhtarsız faiz:** faiz teamülü, alıcının maldan **ürün ya da verim elde etme imkânı**, belirli günün geçmesiyle temerrüt (TBK m. 234/2).
  - ⚠️ Verim hâlinde **fiilen gelir elde etmek aranmaz**; elde etme **imkânı** yeter.
  - 📌 **Peşin satışta** alıcı temerrüde düşerse satıcı herhangi bir işlem (süre verme) gerekmeksizin dönebilir; ama durumu **gecikmeksizin bildirmek zorundadır** (TBK m. 235/1-2).
  - ⚠️ Peşin satışta satıcı **susarsa dönmüş sayılmaz**. Bu, satıcının temerrüdünde ticari satışta alıcının susmasının sonucunun (TBK m. 212/2) tersidir.
  - 📌 **Veresiyede** (zilyetlik bedelden önce devredilmiş) satıcının dönüp malı geri alması **ancak dönme hakkının sözleşmede açıkça saklı tutulmasına** bağlıdır (TBK m. 235/3). Saklı değilse süre verse de dönemez.
  - ⚠️ Dönme hakkını saklı tutmak ile mülkiyeti saklı tutmak farklıdır: ikincisi TMK m. 764'te resmî şekil ve noterlikte özel sicile kayıt ister.
  - 📌 Zarar: **somut** yöntemde sözleşme bedeli ile dürüstlük kurallarına uygun **ikame satış** bedeli farkı (TBK m. 236/2); **soyut** yöntemde borsada kayıtlı ya da piyasa fiyatı olan malda **ödeme günü fiyatı** ile fark (TBK m. 236/3).
  - ⚠️ İkame satış için **açık artırma şartı yoktur**; şart satışın dürüstlük kurallarına uygun yapılmasıdır.
  - 📌 Alıcı yalnız devralmada temerrüde düşerse tevdi (TBK m. 107), hâkim izniyle sattırma (TBK m. 108) ve tacirler arasında TTK m. 23/1-b işler.

doktrin: |
  ### 1. TBK m. 236 ile sözleşmeden dönme ilişkisi
  TBK m. 236, satıcının uğradığı zararı sözleşme bedeli ile ikame satış bedeli ya da piyasa fiyatı arasındaki fark olarak hesaplatır. Bu, borcun gereği gibi ifa edilmiş olsaydı elde edilecek durumu gösterir; yani **müspet zarar** (ifa menfaati) niteliğindedir. Tartışma, bu tazminatın satıcı sözleşmeden **döndüğünde** de istenip istenemeyeceğindedir.

  **Birinci görüş:** Genel hükümlere göre (TBK m. 125/2 ve TBK m. 125/3) satıcı ifadan vazgeçip müspet zararını isteyebilir; sözleşmeden dönerse yalnız sözleşmenin hükümsüz kalmasından doğan (menfi) zararı isteyebilir. TBK m. 236 bu sebeple satıcının sözleşmeden döndüğü hâllere değil, aynen ifadan vazgeçip müspet zarar istediği hâllere uygulanır.

  **İkinci görüş:** Ticari hayatta peşin satışta alıcı temerrüde düşünce satıcı TBK m. 235/1'e göre döner ve hemen ardından malı başkasına satıp farkı ister. TBK m. 236 bu amaçla genel hükümlerden ayrılan **özel bir tazminat düzenidir**; satıcı döndükten sonra da fark hesabına göre zararını isteyebilir.

  Sınavda bu tartışma sorulursa iki görüşü gerekçeleriyle ver, ardından olaydaki hesabı (somut mu soyut mu) yap. Hangi görüşü benimsediğin, zararın hesaplama yöntemini değiştirmez.

  ### 2. Devralma borcunun niteliği (TBK m. 232/1)
  **Külfet görüşü:** Alıcının malı teslim alması kural olarak bir borç değil, **alacaklı külfetidir.** Alıcı almazsa yalnız alacaklı temerrüdü hükümleri (TBK m. 106, TBK m. 107 ve TBK m. 108) uygulanır; borçlu temerrüdü hükümleri ancak satıcının maldan kurtulmakta özel bir yararı varsa devreye girer.

  **Gerçek borç görüşü (baskın görüş):** TBK m. 232/1 alıcının satılanı devralmakla **"yükümlü"** olduğunu açıkça söyler. Bu nedenle devralma satış sözleşmesinde gerçek bir **yan edim yükümlülüğüdür.** Alıcı hem bedeli ödemez hem malı almazsa doğrudan borçlu temerrüdüne düşer; yalnız malı almaz (ama bedeli öderse) satıcı, depolama ve bakım gibi zararları için TBK m. 112'ye dayanabilir.

  İki görüşün pratik farkı, devralmama yüzünden uğranılan zararın hangi hükme göre isteneceğindedir. Her iki görüşte de satıcı tevdi ve sattırma yollarına (TBK m. 107 ve TBK m. 108) başvurabilir; bu nedenle olay sorularında bu yollar tartışmasız cevaptır.

sozluk:
  - terim: Peşin satış
    tanim: "Satılanın ancak bedel ödendikten sonra ya da ödenme anında devredilmesi gereken satış. Alıcının temerrüdünde satıcı ek süre vermeden, bildirimle dönebilir (TBK m. 235/1-2)."
  - terim: Veresiye (kredili) satış
    tanim: "Satılanın zilyetliğinin bedel ödenmeden alıcıya devredildiği satış. Satıcı, dönme hakkını sözleşmede açıkça saklı tutmamışsa alıcının temerrüdünde dönüp malı geri alamaz (TBK m. 235/3)."
  - terim: Muacceliyet
    tanim: "Alacaklının borcun ifasını isteyebildiği an. Aksine sözleşme yoksa satış bedeli, satılan alıcının zilyetliğine girince muaccel olur (TBK m. 234/1)."
  - terim: Ortalama piyasa fiyatı
    tanim: "Bedeli belirtilmeden kesin olarak sipariş edilen malın, ifa yerindeki ve ifa zamanındaki ortalama fiyatı; satış bu fiyat üzerinden yapılmış sayılır (TBK m. 233/1)."
  - terim: Dara
    tanim: "Ambalajın (çuval, sandık, kap) ağırlığı. Bedel ağırlığa göre hesaplanıyorsa dara indirilir, net ağırlık esas alınır (TBK m. 233/2)."
  - terim: Mütemerrit alıcı
    tanim: "Bedeli ödemesi gereken zamanda ödemeyen ve temerrüt şartları gerçekleşmiş olan alıcı. Satıcının dönme ve zarar hakları bu duruma bağlanır (TBK m. 235 ve TBK m. 236)."
  - terim: Dönme hakkının saklı tutulması
    tanim: "Veresiye satışta satıcının, alıcı ödemezse sözleşmeden dönüp malı geri alabilmesi için sözleşmeye açıkça koyduğu kayıt (TBK m. 235/3). Mülkiyeti saklı tutmadan farklıdır."
  - terim: Mülkiyeti saklı tutma
    tanim: "Devredilen malın mülkiyetinin bedel ödenene kadar satıcıda kalması. Resmî şekilde sözleşme ve alıcının yerleşim yeri noterliğindeki özel sicile kayıt ister (TMK m. 764)."
  - terim: İkame satış
    tanim: "Alıcının temerrüdü üzerine satıcının malı dürüstlük kurallarına uygun olarak başkasına satması; elde edilen bedel somut zarar hesabının temelidir (TBK m. 236/2)."
  - terim: Somut zarar hesabı
    tanim: "Sözleşme bedeli ile ikame satıştan elde edilen bedel arasındaki farka göre hesaplanan zarar (TBK m. 236/2)."
  - terim: Soyut zarar hesabı
    tanim: "Borsada kayıtlı ya da piyasa fiyatı olan malda, ikame satış gerekmeden sözleşme bedeli ile belirlenmiş ödeme günündeki fiyat arasındaki farka göre hesaplanan zarar (TBK m. 236/3)."
  - terim: Alacaklı temerrüdü
    tanim: "Edimi gereği gibi önerilen alacaklının haklı sebep olmadan onu kabulden kaçınması (TBK m. 106). Borçlu hasar ve giderler alacaklıya ait olmak üzere tevdi edebilir (TBK m. 107)."
  - terim: Tevdi
    tanim: "Borçlunun teslim edeceği şeyi, hasar ve giderleri alacaklıya ait olmak üzere, hâkimin belirlediği yere (ticari mallarda ardiyeye) bırakarak borcundan kurtulması (TBK m. 107)."
  - terim: Bağlanma parası
    tanim: "Sözleşme yapılırken verilen ve cayma parası olmayıp sözleşmenin yapıldığına kanıt sayılan para. Aksine sözleşme veya yerel âdet olmadıkça esas alacaktan düşülür (TBK m. 177)."

kararlar:
  - id: "770017100"
    ozet: |
      Davacı alıcı şirket, davalı satıcı şirketten 450.000 Euro bedelli ikinci el bir streç film makinesi almak üzere anlaşmış ve 50.000 Euro karşılığı 137.200 TL'yi peşinat olarak havale etmiştir. Alımdan vazgeçtiğini ihtarnameyle bildirip parayı geri istemiş, ilamsız takip başlatmış ve itiraz üzerine itirazın iptali davası açmıştır. Satıcı, makinenin üretimden çekilmesi yüzünden zarara uğradığını ileri sürerek peşinatı zararına mahsup ettiğini savunmuştur. İlk derece mahkemesi davayı reddetmiş; bölge adliye mahkemesi ödenen paranın TBK m. 177 anlamında bağlanma parası olduğunu, satıcının zararını da ispatlayamadığını belirterek davayı kabul etmiştir. Özel Daire, satıcının zarar savunmasının TBK m. 236 çerçevesinde incelenmesi gerektiğini belirterek bozmuş, bölge adliye mahkemesi direnmiş, Hukuk Genel Kurulu direnme kararını oybirliğiyle onamıştır. Gerekçeye göre bağlanma parası, aksine sözleşme veya yerel âdet yoksa esas alacaktan düşülür ve sözleşme ortadan kalkarsa geri istenebilir. TBK m. 236 alıcının ödeme temerrüdünde satıcının zararını somut yöntemle (ikame satıştan elde edilen bedelle fark) ya da soyut yöntemle (piyasa fiyatıyla fark) hesaplatır; direnme kararına göre satıcı makineyi başkasına sattığını ileri sürmemiş, piyasa fiyatı farkına da dayanmamıştır. Genel Kurul, ileri sürülen üretim kaybının bu zarar türleri kapsamında değerlendirilemeyeceğini ve ayrıca ispatlanamadığını belirtmiştir. Konuya katkısı: TBK m. 236'daki iki hesap yönteminin sınırını ve zararın ispat yükünü gösterir.
  - id: "1190443500"
    ozet: |
      Davacı satıcı, malik olduğu üç bağımsız bölümü 17.08.2020'de tapuda davalıya satış yoluyla devretmiş; 1.600.000 TL olan bedelin ödenmediğini ve devrin hileyle yapıldığını ileri sürerek tapu iptali ve tescil, olmadığı takdirde taşınmazların bedelinin tahsilini istemiştir. Davalı, 1.300.000 TL bedelle aldığını, 140.000 TL'yi banka dekontuyla, kalanı elden ödediğini savunmuştur. İlk derece mahkemesi taşınmazların değerini belirleyip tapu iptal ve tescile karar vermiştir. Bölge adliye mahkemesi, hile iddiasının ispatlanamadığını belirtmiş, ayrıca TBK m. 246 yoluyla TBK m. 235 hükmüne dayanarak resmî senette dönme hakkına ilişkin bir kayıt bulunmadığını gerekçelendirip davayı tümden reddetmiştir. Yargıtay 1. Hukuk Dairesi, hile iddiası ispatlanamadığı için tapu iptali ve tescil isteminin reddini yerinde bulmuş; ancak terditli bedel istemi bakımından davalının 140.000 TL dekont dışındaki ödemeyi yasal delille ispatlaması gerektiğini, bu konuda yeterli inceleme yapılmadığını belirterek bölge adliye mahkemesi kararını oybirliğiyle bozmuştur. Konuya katkısı: bedeli ödenmediği ileri sürülen taşınmaz satışında bedel istemi ile tapunun geri alınması isteminin ayrı değerlendirildiğini ve bedeli ödediğini söyleyen alıcının bunu ispat etmesi gerektiğini gösterir. TBK m. 235 gerekçesi kararda bölge adliye mahkemesinin değerlendirmesi olarak yer almaktadır.
  - id: "964476500"
    ozet: |
      Davacı satıcı, bir gençlik kampı için 20 kalem mefruşat ürünü teklif etmiş (KDV dahil 258.118,92 TL), ürünleri 01.08.2017'de kampta görevli bir çalışana imza karşılığı teslim ettiğini, bedelin ödenmediğini ileri sürerek başlattığı takibe yapılan itirazın iptalini istemiştir. Davalı idare, taraf sıfatı bulunmadığını ve onaylanmış bir tutar olmadığını savunmuştur. İlk derece mahkemesi, bilirkişi raporlarına dayanarak teslim edilen ürünlerin fiyatlarının dönem piyasa fiyatlarına uygun olduğunu saptayıp davayı kabul etmiş, bölge adliye mahkemesi istinaf başvurusunu esastan reddetmiştir. Yargıtay 3. Hukuk Dairesi, TBK m. 233/1 ve TBK m. 234/1'i anarak ürünlerin davalının zilyetliğine girdiğinin ispatlandığını ve bilirkişi raporunun yeterli olduğunu belirtmiş, kararı oybirliğiyle onamıştır. Konuya katkısı: teslimin ispatı, zilyetliğe girmeyle bedelin muaccel olması ve uyuşmazlıkta bedelin piyasa fiyatlarına göre araştırılması çizgisini gösterir.

sorular:
  - soru: |
      TBK m. 232/1'e göre alıcının satış sözleşmesinden doğan **iki temel borcu** hangi seçenekte doğru verilmiştir?
    siklar:
      - "Bedeli ödemek ve kendisine sunulan satılanı devralmak"
      - "Bedeli ödemek ve satılanın ayıbını satıcıya ihbar etmek"
      - "Satılanı devralmak ve satıcının tüm giderlerini üstlenmek"
      - "Bedeli ödemek ve satılanı hemen üçüncü kişiye devretmek"
    dogru: 0
    aciklama: |
      TBK m. 232/1 alıcıyı, sözleşmede kararlaştırılmış biçimde satış bedelini ödemek ve kendisine sunulan satılanı devralmakla yükümlü kılar. Ayıp ihbarı bir borç değil, haklarını korumak için yerine getirilmesi gereken bir yüktür; giderlerin paylaşımı ise TBK m. 211/1'de düzenlenir.

  - soru: |
      Aksine yerel âdet ya da anlaşma yoksa, alıcı kendisine sunulan satılanı **ne zaman** devralmak zorundadır?
    siklar:
      - "Sunulduktan sonra on beş gün içinde"
      - "Bedelin muaccel olmasından otuz gün sonra"
      - "Hemen"
      - "Satıcının ihtar çekmesinden sonra"
    dogru: 2
    aciklama: |
      TBK m. 232/2'ye göre aksine yerel âdet veya anlaşma yoksa satılanın hemen devralınması gereklidir. Kanun bir bekleme süresi ya da ihtar şartı öngörmez.

  - soru: |
      Aksine sözleşme veya âdet yoksa aşağıdaki giderlerden hangisi **alıcıya** aittir?
    siklar:
      - "Satılanın ölçülmesi ve tartılması giderleri"
      - "Satılanı devralmak üzere yapılan giderler"
      - "Satıcının kendi deposundan malı hazırlama giderleri"
      - "Satıcının ifa için yaptığı sigorta giderleri"
    dogru: 1
    aciklama: |
      TBK m. 211/1'e göre aksine sözleşme veya âdet yoksa ölçme ve tartma gibi devir giderleri satıcıya; satılanı devralmak üzere yapılan giderler ve satılanın ifa yerinden başka yere taşınması gerektiğinde taşıma giderleri alıcıya aittir. TBK m. 232 giderleri düzenlemez, yalnız borçları ve devralma zamanını söyler.

  - soru: |
      Alıcı, bedeli belirtmeden bir malı **alacağını kesin olarak** bildirmiştir. TBK m. 233/1'e göre satış hangi bedel üzerinden yapılmış sayılır?
    siklar:
      - "Satıcının tek taraflı olarak düzenlediği fatura bedeli"
      - "Sözleşmenin kurulduğu günkü en düşük piyasa fiyatı"
      - "İfa yeri ve zamanındaki ortalama piyasa fiyatı"
      - "Satıcının daha önceki müşterilerine uyguladığı liste fiyatı"
    dogru: 2
    aciklama: |
      TBK m. 233/1 bedeli belirtilmeden kesin sipariş verilen satışın, ifa yeri ve zamanındaki ortalama piyasa fiyatı üzerinden yapılmış sayılacağını söyler. Fatura bedeli tek taraflıdır ve uyuşmazlıkta alıcıyı kendiliğinden bağlamaz. Alıcının bildirimi kesin değilse satış zaten kurulmaz.

  - soru: |
      Zeynep, bir toptancıya telefonla "Yirmi ton nohut gönderin, kesin alıyorum" der; fiyat konuşulmaz. Taraflar teslimin 10 Mart'ta toptancının deposunda yapılmasını kararlaştırır. Nohudun toptancının bulunduğu yerdeki ortalama piyasa fiyatı sipariş günü (3 Mart) ton başına 40.000 TL, 10 Mart'ta ton başına 44.000 TL'dir. Aksine bir teamül yoktur. Zeynep **ton başına** hangi fiyattan ödeme yapmak zorundadır?
    siklar:
      - "40.000 TL, çünkü fiyat sipariş gününe göre belirlenir"
      - "44.000 TL, çünkü TBK m. 233/1 ifa yeri ve zamanındaki ortalama piyasa fiyatını esas alır"
      - "42.000 TL, çünkü iki günün ortalaması alınır"
      - "Fiyat belirtilmediği için sözleşme kurulmamıştır"
    dogru: 1
    aciklama: |
      Zeynep malı alacağını kesin olarak bildirdiği ve bedeli belirtmediği için TBK m. 233/1 uygulanır: Satış, ifa yeri ve zamanındaki ortalama piyasa fiyatı üzerinden yapılmış sayılır. İfa zamanı kararlaştırılan teslim günü olan 10 Mart'tır. Bedelin belirli olmaması sözleşmeyi geçersiz kılmaz; bedel durum ve koşullara göre belirlenebilir (TBK m. 207/3).

  - soru: |
      Ayşe, bir çiftlikten ürünü ağırlığa göre ton başına 20.000 TL üzerinden satın alır. Ürün 5.200 kg brüt ağırlıkta çuvallarla teslim edilir; ambalajın ağırlığı 200 kg'dır. Dara konusunda ticari teamül yoktur. Ayşe'nin ödemesi gereken satış bedeli **kaç TL**'dir?
    siklar:
      - "104.000 TL"
      - "100.000 TL"
      - "96.000 TL"
      - "20.000 TL"
    dogru: 1
    aciklama: |
      TBK m. 233/2'ye göre satış bedeli satılanın ağırlığına göre hesaplanıyorsa darası indirilir. Brüt 5.200 kg'dan ambalaj ağırlığı olan 200 kg düşüldüğünde net ağırlık 5.000 kg, yani 5 tondur. Bedel 5 x 20.000 = 100.000 TL'dir. Dara düşülmeden 104.000 TL ödetmek, teamül bulunmadığı için kanuna aykırıdır.

  - soru: |
      Aksine sözleşme bulunmadığında, satış bedeli ne zaman **muaccel** olur?
    siklar:
      - "Sözleşmenin kurulmasıyla"
      - "Satıcının faturayı düzenlemesiyle"
      - "Satılan alıcının zilyetliğine girince"
      - "Alıcının satılanı ilk kullanmasıyla"
    dogru: 2
    aciklama: |
      TBK m. 234/1: Aksine sözleşme yoksa satılan alıcının zilyetliğine girince satış bedeli muaccel olur. Fatura düzenlenmesi ya da malın kullanılması muacceliyeti belirlemez.

  - soru: |
      Mehmet, Ali'den bir narenciye bahçesini satın alır; bahçe Mehmet'e teslim edilir. Sözleşmede vade ve faiz kararlaştırılmamıştır, Ali ihtar çekmemiştir. Mehmet bahçeyi hiç işletmemiş, ürün de toplamamıştır. Ali satış bedeline faiz isteyebilir mi?
    siklar:
      - "İsteyemez; faiz için Mehmet'in fiilen gelir elde etmiş olması gerekir"
      - "İsteyemez; her hâlde önce ihtar çekilmelidir"
      - "İsteyebilir; yalnız dava tarihinden itibaren"
      - "İsteyebilir; Mehmet maldan ürün elde etme imkânına sahip olduğundan ihtara gerek yoktur"
    dogru: 3
    aciklama: |
      TBK m. 234/2'ye göre alıcı maldan ürün ya da diğer verimler elde etme imkânına sahip ise ayrıca bir ihtara gerek olmaksızın satış bedeline faiz istenebilir. Kanun elde etme imkânını yeterli sayar; alıcının fiilen gelir elde etmiş olması aranmaz. Genel kural olan ihtar şartı (TBK m. 117/1) burada aranmaz.

  - soru: |
      Peşin satışta alıcı ödemede temerrüde düşmüştür. TBK m. 235'e göre sözleşmeden dönmek isteyen satıcı **ne yapmalıdır?**
    siklar:
      - "Önce alıcıya uygun bir süre vermeli ve bu süre geçince dönmelidir"
      - "Hâkimden süre verilmesini istemelidir"
      - "Durumu gecikmeksizin alıcıya bildirmelidir"
      - "Dönme hakkını sözleşmede saklı tutmuş olmalıdır"
    dogru: 2
    aciklama: |
      Peşin satışta alıcı temerrüde düşerse satıcı herhangi bir işlem gerekmeksizin, yani ek süre vermeden satıştan dönebilir (TBK m. 235/1). Bu hakkı kullanmak isteyen satıcı durumu gecikmeksizin alıcıya bildirmek zorundadır (TBK m. 235/2). Süre verme, genel hükümdeki yöntemdir (TBK m. 123). Dönme hakkının sözleşmede saklı tutulması şartı ise veresiye satışa özgüdür.

  - soru: |
      Galerici Ali, otomobilini 10 Nisan'da bedel peşin ödenmek ve araç aynı anda teslim edilmek üzere Mehmet'e satmıştır. Mehmet o gün ne parayı getirir ne de aracı almaya gelir. Ali bir şey söylemeden günler geçirir. Ali'nin bu sessizliği hukuken **ne sonuç doğurur?**
    siklar:
      - "Ali sözleşmeden dönmüş sayılır"
      - "Ali, ifadan vazgeçmiş sayılır ve zararını isteyebilir"
      - "Ali'nin sessizliği tek başına sözleşmeden dönmüş sayılmasını sağlamaz; dönmek istiyorsa bunu gecikmeksizin bildirmelidir"
      - "Sözleşme kendiliğinden sona erer ve taraflar edimlerini geri ister"
    dogru: 2
    aciklama: |
      TBK m. 235/1 satıcıya dönme hakkı verir; TBK m. 235/2 ise bu hakkı kullanmak isteyen satıcının durumu gecikmeksizin bildirmesini ister. Dönme bir bildirimle kullanılır; sessizlik dönme sayılmaz. Ticari satışta satıcının temerrüdünde alıcının susmasına ilişkin kural (TBK m. 212/2) alıcının temerrüdü hâlinde işletilemez.

  - soru: |
      Çiftçi Zeynep'e bir biçerdöver 1.200.000 TL'ye satılıp 1 Mayıs'ta teslim edilmiştir. Bedelin 16 Mayıs'ta ödeneceği yazılıdır; sözleşmede dönme hakkına dair hiçbir kayıt yoktur. Zeynep 16 Mayıs'ta ödemez; satıcı noterden 10 gün süre verip sürenin sonunda sözleşmeden döndüğünü bildirir. Satıcı biçerdöveri geri isteyebilir mi?
    siklar:
      - "İsteyebilir; süre verdiği ve bildirimde bulunduğu için"
      - "İsteyemez; zilyetlik bedel ödenmeden devredildiğinden dönme hakkı ancak sözleşmede açıkça saklı tutulmuşsa kullanılabilir"
      - "İsteyebilir; çünkü alıcı temerrüde düşen her satışta satıcı dönebilir"
      - "İsteyemez; çünkü satış sözleşmesi taşınırlarda hiçbir şekilde sona erdirilemez"
    dogru: 1
    aciklama: |
      Zilyetlik bedel ödenmeden devredildiği için veresiye satış vardır. TBK m. 235/3'e göre satıcının alıcının temerrüdü sebebiyle dönüp satılanı geri alması, bu hakkın sözleşmede açıkça saklı tutulmasına bağlıdır. Böyle bir kayıt olmadığından süre vermek ya da bildirimde bulunmak sonucu değiştirmez. Satıcı bedeli ve gecikme zararını isteyebilir.

  - soru: |
      Satıcının satılanı geri alabilmesi için **dönme hakkını saklı tutma** kaydı ile **mülkiyeti saklı tutma** kaydı hakkında hangisi doğrudur?
    siklar:
      - "İkisi de aynı şeydir ve ikisi de yalnız noterde resmî şekilde yapılabilir"
      - "Dönme hakkını saklı tutma kaydı, mülkiyeti saklı tutma gibi noterlikte özel sicile kaydedilmedikçe geçerli olmaz"
      - "Mülkiyeti saklı tutma kaydı, TMK m. 764'e göre resmî şekil ve yerleşim yeri noterliğinde özel sicile kayıt ister; dönme hakkını saklı tutma ise sözleşmede açıkça yazılmakla yeterlidir"
      - "Mülkiyeti saklı tutma kaydı hayvan satışında da yapılabilir"
    dogru: 2
    aciklama: |
      TMK m. 764'e göre mülkiyeti saklı tutma kaydı, ancak resmî şekilde yapılacak sözleşmenin devralanın yerleşim yeri noterliğinde özel siciline kaydedilmesiyle geçerli olur; hayvan satışlarında yapılamaz. Dönme hakkının saklı tutulması ise TBK m. 235/3'te sözleşmede açıkça saklı tutulmasına bağlanmıştır ve Yargıtay'ın yerleşik yaklaşımına göre bu şekil ve sicil şartına tabi değildir.

  - soru: |
      TBK m. 236/2'ye göre alıcının temerrüdünde satıcı, **somut yöntemle** zararını isteyebilmek için malı başkasına nasıl satmış olmalıdır?
    siklar:
      - "Mutlaka açık artırma yoluyla"
      - "Hâkimin iznini alarak"
      - "Alıcının onayını alarak"
      - "Dürüstlük kurallarına uygun olarak"
    dogru: 3
    aciklama: |
      TBK m. 236/2 sözleşme bedeli ile malın başkasına dürüstlük kurallarına uygun olarak satışından elde edilen bedel arasındaki farka göre hesaplanacak zararın istenebileceğini söyler. Açık artırma, hâkim izni ya da alıcı onayı gibi bir şart yoktur. Dürüstlük kuralına aykırı, örneğin çok düşük fiyata yapılan bir satışta fahiş fark alıcıdan istenemez.

  - soru: |
      Bir satıcı, borsada kayıtlı 80 ton buğdayı ton başına 10.000 TL'den (toplam 800.000 TL) satmıştır. Alıcı ödeme günü bedeli ödemez ve malı almaz. Ödeme günü buğdayın piyasa fiyatı ton başına 9.000 TL'dir (toplam 720.000 TL). Satıcı buğdayı başkasına satmamıştır. TBK m. 236/3'e göre satıcı **kaç TL**'lik zararın giderilmesini isteyebilir?
    siklar:
      - "80.000 TL"
      - "720.000 TL"
      - "800.000 TL"
      - "Hiçbir tutar; çünkü ikame satış yapılmamıştır"
    dogru: 0
    aciklama: |
      Buğday borsada kayıtlı olduğundan satıcı ikame satış yapmaya gerek kalmaksızın, satış bedeli ile malın belirlenmiş ödeme günündeki fiyatı arasındaki farka göre hesaplanacak zararı isteyebilir (TBK m. 236/3). Fark 800.000 - 720.000 = 80.000 TL'dir. İkame satışın yapılmaması bu yöntemde engel değildir.

  - soru: |
      Özel yapım bir makine 600.000 TL'ye satılmış, alıcı bedeli ödemede temerrüde düşmüştür. Makinenin piyasa fiyatı yoktur. Satıcı, dürüstlük kurallarına uygun biçimde ilan vererek makineyi başka bir işletmeye 540.000 TL'ye satmıştır. Satıcı alıcıdan TBK m. 236/2 uyarınca **kaç TL** isteyebilir?
    siklar:
      - "540.000 TL"
      - "600.000 TL"
      - "60.000 TL"
      - "Hiçbir şey; çünkü makine satıldığı için zarar doğmamıştır"
    dogru: 2
    aciklama: |
      Piyasa fiyatı olmayan malda soyut yöntem uygulanamaz; somut yöntem geçerlidir. Zarar, sözleşme bedeli ile dürüstlük kurallarına uygun ikame satıştan elde edilen bedel arasındaki farktır: 600.000 - 540.000 = 60.000 TL (TBK m. 236/2). Satıcı ikame satış bedelini zaten tahsil etmiştir; alıcıdan isteyebileceği tutar farkla sınırlıdır.

  - soru: |
      Bir çimento fabrikası, bir müteahhide sattığı çimentoyu belirlenen günde hazırlamış ve teslime sunmuştur. Müteahhit haklı hiçbir sebep göstermeden çimentoyu almaya gelmez; bedel ödenmiştir. Fabrika çimentonun bozulmasından endişe etmektedir. Aşağıdakilerden hangisi fabrikanın **başvurabileceği tartışmasız yoldur?**
    siklar:
      - "Çimentoyu hâkim kararı olmadan bir ardiyeye tevdi etmek; hasar ve giderler müteahhide aittir"
      - "Çimentoyu hiçbir bildirim yapmadan kendi tüketimine katmak"
      - "Sözleşmeyi kendiliğinden hükümsüz saymak"
      - "Müteahhidin bedeli iki kat ödemesini istemek"
    dogru: 0
    aciklama: |
      Alıcı malı almaktan haklı sebep olmaksızın kaçınınca alacaklı temerrüdüne düşer (TBK m. 106/1). Borçlu, hasar ve giderler alacaklıya ait olmak üzere teslim edeceği şeyi tevdi ederek borcundan kurtulabilir; ticari mallar hâkim kararı olmadan da bir ardiyeye tevdi edilebilir (TBK m. 107). Devralma borcunun niteliği doktrinde tartışmalıdır, ama tevdi yolu her iki görüşte de açıktır.

  - soru: |
      Tacirler arasındaki bir satışta alıcı mütemerrit olmuştur. TTK m. 23/1-b'ye göre satıcı **ne yapabilir?**
    siklar:
      - "Malın satışına izin verilmesini mahkemeden isteyebilir"
