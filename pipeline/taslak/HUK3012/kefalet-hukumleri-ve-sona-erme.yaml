doktrin: |
  ### Kefilin kendi temerrüdü azamî miktarı aşar mı?

  TBK m. 589/1 kefilin "her durumda" azamî miktara kadar sorumlu olduğunu söyler. Bir görüş bu ifadeyi sözlük anlamıyla alır ve kefilin kendi temerrüdünden doğan gecikme faizinin de limitin içinde kaldığını savunur. Baskın görüş ve uygulama ise kefil kendi temerrüdüne düştükten sonra (ihtarın kefile tebliği veya takip tarihi gibi) o temerrüt faizinden, limiti aşsa bile sorumlu olunabileceğini kabul eder. Gerekçe, bu faizin artık kefilin **kendi** borcunun sonucu olması, asıl borçlunun temerrüdüne bağlı olmamasıdır. Bu nedenle sorunun **temerrüdün ne zaman başladığıyla** bağlantısı kurulur. Konu tartışmalıdır; sınavda her iki görüşü ve hangisini seçtiğini gerekçelendir.

  ### On yıllık sürenin niteliği

  TBK m. 598/3 kefaletin on yılın geçmesiyle "kendiliğinden ortadan kalktığını", m. 598/4 ise kefilin ancak on yıllık süre dolana kadar takip edilebileceğini söyler. Süre hak düşürücü niteliktedir: durmaz, kesilmez, hâkim re'sen gözetir. Baskın görüşe göre kefalet süre dolmadan başlatılmış takip veya açılmış dava bakımından korunur; süre dolduktan sonra yapılan takip kefile karşı sonuç doğurmaz.

  ### Halefiyet ve iç ilişki

  Kefil rücuyu iki yoldan kullanabilir: kanuni halefiyete (TBK m. 596/1) veya borçluyla arasındaki iç ilişkiye (vekâlet, vekâletsiz iş görme gibi, TBK m. 596/3). İkisi yan yana durur; hangisinin daha elverişli olduğu (zamanaşımı, ek haklar, rehinler) olayın özelliğine göre seçilir.

sozluk:
  - terim: Azamî miktar
    tanim: "Kefilin sorumlu olabileceği, kefalet sözleşmesinde belirtilen en yüksek tutar. Kefil her durumda bu sınırla bağlıdır (TBK m. 589/1)."
  - terim: Fer'ilik
    tanim: "Kefaletin asıl borca bağlılığı. Asıl borç sona erince kefil de borcundan kurtulur (TBK m. 598/1)."
  - terim: Def'i
    tanim: "Borçlunun borcu ödemekten kaçınmasını sağlayan savunma. Kefil asıl borçlunun def'ilerini ileri sürmeye yetkili ve yükümlüdür (TBK m. 591)."
  - terim: Ceza koşulu
    tanim: "Borca aykırılık hâlinde ödenecek önceden belirlenmiş tazminat. Kefilin buna sorumlu olacağına dair anlaşma kesin hükümsüzdür (TBK m. 589/4)."
  - terim: Kanuni halefiyet
    tanim: "Kefilin, alacaklıya ifa ettiği ölçüde alacaklının haklarına kendiliğinden geçmesi (TBK m. 596/1)."
  - terim: Rücu
    tanim: "Borcu ödeyen kefilin, ödediğini asıl borçludan geri istemesi."
  - terim: Ayni güvence
    tanim: "Kefilin takibin durdurulması için verdiği rehin gibi eşya üzerinde hak doğuran teminat (TBK m. 590/2)."
  - terim: Kesin aciz belgesi
    tanim: "Borçlunun malvarlığının borcu karşılamadığını gösteren icra belgesi. Kefil, takibin durdurulmasını bu belgeye kadar isteyebilir (TBK m. 590/2)."
  - terim: Süreli kefalet
    tanim: "Belirli bir süre için verilen kefalet. Süre bitince kefil borcundan kurtulur (TBK m. 600)."
  - terim: Süresiz kefalet
    tanim: "Süresi belirlenmemiş kefalet. Borç muaccel olunca kefil, alacaklıdan bir ay içinde takibe geçmesini isteyebilir (TBK m. 601)."
  - terim: Hak düşürücü süre
    tanim: "Dolunca hakkı kendiliğinden sona erdiren, durmayan ve kesilmeyen süre. Gerçek kişi kefaletindeki 10 yıl bu niteliktedir (TBK m. 598/3)."

kararlar:
  - id: "734292500"
    ozet: |
      Davacı, davalı şirketin ortağıdır; şirketin banka kredisine müteselsil kefil olmuş ve başka bir malikle birlikte maliki olduğu taşınmaz üzerinde banka lehine ipotek vermiştir. Taşınmaz satılmış, 350.000 TL'lik kredi faiziyle birlikte 357.460,25 TL olarak kapatılmıştır. Davacı ortak ise bu kapanıştan sonra, 21.11.2012'de şirketteki hissesini devretmiştir. Davacı, kendi payına düşen 178.750 TL'yi şirketten rücuen istemiştir. İlk derece mahkemesi hisse devir protokolünü gerekçe yaparak istemi reddetmiş, Yargıtay (Kapatılan) 19. Hukuk Dairesi bozunca da direnmiştir. Hukuk Genel Kurulu, kefalet borcunu ödeyen kefilin kanun gereği alacaklının haklarına halef olduğunu, ortaklıktan ayrılmasının bunu engellemediğini, protokolün şirketi taraf yapmadığını ve rücu etmeme taahhüdü içermediğini belirterek direnme kararını bozmuştur. Karar, 818 sayılı Borçlar Kanunu'nun ilgili hükmünü (bugünkü TBK m. 596) uygular; konuya katkısı kanuni halefiyetin ortaklar arası iç sözleşmelerle kendiliğinden kalkmayacağıdır.
  - id: "1177275500"
    ozet: |
      Banka, iki genel kredi sözleşmesine dayanarak (2018 tarihli) müşterek borçlu müteselsil kefil olan iki kişi hakkında icra takibi başlatmış, itirazların iptalini istemiştir. Hesap kat ihtarı kefillere tebliğ edilememiştir. İlk derece mahkemesi, bir kefil bakımından kefalet metnindeki yazıların onun el ürünü olduğunun saptanamaması (grafoloji raporu) nedeniyle kefaleti geçersiz saymış, davayı reddetmiştir. Diğer kefilin kefaletini geçerli bulmuş, temerrüdün ihtarname tebliğ edilemediği için **takip tarihinde** başladığını kabul ederek davayı kısmen kabul etmiştir. Bölge Adliye Mahkemesi istinaf başvurusunu esastan reddetmiş, Yargıtay 11. Hukuk Dairesi bankanın temyizini reddederek kararı oy birliğiyle onamıştır. Karar, kefil bakımından kefalet metnindeki yazıların kefilin kendi el ürünü olup olmadığının ve temerrüdün hangi tarihte başladığının ayrı ayrı denetlendiğini gösterir.

sorular:
  - soru: |
      Kefil, kefalet sözleşmesinde azamî miktarı 200.000 TL olarak yazmıştır; başka bir kayıt yoktur. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Kefil, azamî miktara kadar sorumludur; asıl borç, zamanında bildirilmiş masraflar ve işlemiş bir yıllık ile işlemekte olan yıla ait akdî faizler bu sınırın içindedir."
      - "Azamî miktar yalnız anaparayı sınırlar; faiz ve masraflar bunun dışında sınırsız istenir."
      - "Kefil, azamî miktardan bağımsız olarak asıl borcun tamamından her durumda sorumludur."
      - "Takip ve dava masrafları, kefile hiç bildirilmemiş olsa bile her zaman sınırın dışında istenir."
    dogru: 0
    aciklama: |
      TBK m. 589/1'e göre kefil her durumda azamî miktara kadar sorumludur. Aksi kararlaştırılmamışsa asıl borç, borçlunun kusur ve temerrüdünün sonuçları, kefile zamanında bildirilmiş takip masrafları ile işlemiş bir yıllık ve işlemekte olan yıla ait akdî faizler bu sınırın içinde yer alır. Yaygın yanılgı, faiz ve masrafları limit dışında saymaktır.
  - soru: |
      Kefilin, asıl borç ilişkisinin hükümsüz hâle gelmesinin sebep olduğu zarardan ve ceza koşulundan sorumlu olacağına dair sözleşme kaydının hukuki sonucu nedir?
    siklar:
      - "Kesin hükümsüzdür."
      - "Kefilin yazılı onayı varsa geçerlidir."
      - "Yalnız tacir kefiller bakımından geçerlidir."
      - "İptal edilebilir; kefil bir yıl içinde iptal hakkını kullanmalıdır."
    dogru: 0
    aciklama: |
      TBK m. 589/4'e göre bu yöndeki anlaşmalar kesin olarak hükümsüzdür. Kefilin kendi imzasıyla kabul etmesi sonucu değiştirmez. Sık yapılan hata, kaydı "açık yazılırsa geçerli olan" sonraki-borç kuralıyla (TBK m. 589/3) karıştırmaktır.
  - soru: |
      Bankada cari kredi hesabı bulunan B'nin borcuna K, 1 Mart 2024'te kefil olmuştur. B'nin 2023'te kullandığı 100.000 TL'lik kredi, kefalet sözleşmesinde "kefaletten önceki borçlar" konusunda hiçbir açık kayıt bulunmadığı hâlde kefile yöneltilmek istenmektedir. K'nın durumu nedir?
    siklar:
      - "K, kefaletten önce doğmuş bu borçtan sorumlu değildir; açıkça kararlaştırılmadıkça yalnız kefaletten sonraki borçlardan sorumlu olur."
      - "K, limit içinde olmak şartıyla kefaletten önceki bütün borçlardan sorumludur."
      - "K, yalnız kefaletten önce doğan borçlardan sorumludur."
      - "K, bu borçtan sorumludur; ancak bunun için sözleşmenin tapu müdürlüğünde onaylanması gerekir."
    dogru: 0
    aciklama: |
      TBK m. 589/3'e göre sözleşmede açıkça kararlaştırılmamışsa kefil, borçlunun yalnız kefalet sözleşmesinin kurulmasından sonraki borçlarından sorumludur. Önceki borçların kefile yüklenmesi için açık kayıt gerekir. Çeldirici, limit içinde olunca önceki borcun da dahil sayılmasıdır.
  - soru: |
      B şirketinin iflasına karar verilmiştir. Bankanın B'ye 1 Ocak 2027 vadeli kredisi iflas sebebiyle şimdiden muaccel olmuştur. Banka, 1 Ekim 2026'da kefil K'ya karşı takip başlatmak istemektedir. Doğru hüküm hangisidir?
    siklar:
      - "Borçlunun iflası sebebiyle asıl borç daha önce muaccel olsa bile, belirlenen vadeden önce kefile karşı takibat yapılamaz."
      - "Borçlunun iflasıyla kefalet borcu da muaccel olur; banka hemen takip yapabilir."
      - "Banka, K'ya karşı takibi ancak B'nin konkordato isteminden sonra yapabilir."
      - "Takip yapılabilir; ancak K'nın ayrıca ödeme emrine itiraz hakkı yoktur."
    dogru: 0
    aciklama: |
      TBK m. 590/1: borçlunun iflası yüzünden asıl borç daha önce muaccel olsa bile belirlenen vadeden önce kefile karşı takibat yapılamaz. İflas vadeyi yalnız borçlu bakımından öne çeker; kefil bakımından çekmez. Yaygın yanılgı, muacceliyetin kefile de sirayet ettiğini düşünmektir.
  - soru: |
      Asıl borcun muaccel olması alacaklının borçluya yapacağı süreli bir bildirime bağlıdır. Kefalet borcu bakımından bu sürenin başlangıcı hangisidir?
    siklar:
      - "Bildirimin kefile yapıldığı tarih."
      - "Bildirimin borçluya yapıldığı tarih."
      - "Kefalet sözleşmesinin kurulduğu tarih."
      - "Borçlunun temerrüde düştüğü tarih."
    dogru: 0
    aciklama: |
      TBK m. 590/3'e göre asıl borcun muacceliyeti önceden süre içeren bildirime bağlıysa kefalet borcu için bu süre, bildirimin kefile yapıldığı tarihte işlemeye başlar. Borçluya yapılan bildirim kefil bakımından süreyi başlatmaz.
  - soru: |
      Asıl borçlu, kefaletten sonra dolan zamanaşımı def'isinden alacaklıya karşı açıkça vazgeçmiştir. Alacaklı kefile başvurduğunda kefil için doğru olan hangisidir?
    siklar:
      - "Kefil, borçlunun vazgeçmesine rağmen zamanaşımı def'isini alacaklıya karşı ileri sürebilir."
      - "Borçlunun vazgeçmesi kefili de bağlar; kefil artık ileri süremez."
      - "Kefil, ancak borçlunun yazılı izniyle def'iyi ileri sürebilir."
      - "Zamanaşımı def'i kefile ait değildir; kefil yalnız kendi kişisel savunmalarını kullanabilir."
    dogru: 0
    aciklama: |
      TBK m. 591/2: asıl borçlu kendisine ait bir def'iden vazgeçmiş olsa bile kefil yine de bu def'iyi alacaklıya karşı ileri sürebilir. Üstelik TBK m. 591/1'e göre kefil asıl borçlunun def'ilerini ileri sürmeye hakkı olduğu gibi zorundadır.
  - soru: |
      Ali, arkadaşı Mehmet'in kumarda kaybettiği 200.000 TL'lik borcun kumar borcu olduğunu bilerek, alacaklı Kemal'e karşı kefil olmuştur. Kemal, Ali'den ödeme istediğinde Ali'nin durumu nedir?
    siklar:
      - "Ali, borcun kumar borcu olduğunu bilse bile asıl borçlunun sahip olduğu def'ileri ileri sürebilir."
      - "Ali, kumar borcu olduğunu bilerek kefil olduğu için hiçbir def'iyi ileri süremez."
      - "Ali, kefaleti yalnız yanılmış olması hâlinde def'i ileri sürebilir."
      - "Kefalet geçerlidir, fakat Ali yalnız faizden sorumlu tutulabilir."
    dogru: 0
    aciklama: |
      TBK m. 591/4: kumar veya bahisten doğan bir borca kefalette kefil, borcun bu niteliğini bilmiş olsa bile asıl borçlunun sahip olduğu def'ileri ileri sürebilir. Bu, yanılma, ehliyetsizlik ve zamanaşımı sakatlığını bilerek kefil olanın def'i ileri sürememesi kuralının (TBK m. 591/1 ve TBK m. 582/2) tersidir.
  - soru: |
      Banka, borcun güvencesi olan ve kefalet sırasında var olan ipoteği, haklı bir sebep olmaksızın ve ağır kusuruyla elinden çıkarmıştır. Kefil K'nın durumu nedir?
    siklar:
      - "K borcundan kurtulur; ödediyse ödediğinin geri verilmesini ve varsa ek zararının giderilmesini isteyebilir."
      - "K'nın sorumluluğu hiç değişmez; ipotek alacaklının kendi işidir."
      - "K yalnız adi kefilse borcundan kurtulur; müteselsil kefil kurtulamaz."
      - "K ancak asıl borçludan güvence isteyebilir, alacaklıya karşı bir hak kazanmaz."
    dogru: 0
    aciklama: |
      TBK m. 592/4'e göre alacaklı haklı sebep olmaksızın yükümlülüklerini yerine getirmez, ağır kusuruyla mevcut belgeleri veya rehinleri ya da sorumlu olduğu diğer güvenceleri elden çıkarırsa kefil borcundan kurtulur ve ödediğinin geri verilmesini ve varsa ek zararının giderilmesini isteyebilir. Hüküm kefalet türüne göre ayırmaz.
  - soru: |
      Kefilin rücu hakkına ilişkin zamanaşımı hangi anda işlemeye başlar?
    siklar:
      - "Kefilin alacaklıya ifada bulunduğu anda."
      - "Kefalet sözleşmesinin kurulduğu anda."
      - "Asıl borcun muaccel olduğu anda."
      - "Alacaklının kefile karşı takip başlattığı anda."
    dogru: 0
    aciklama: |
      TBK m. 596/5: kefilin rücu hakkına ilişkin zamanaşımı, kefilin alacaklıya ifada bulunduğu anda işlemeye başlar. Rücu hakkı ödemeyle doğduğu için zamanaşımı da ödemeyle başlar; kefaletin kurulması veya muacceliyet başlangıç değildir.
  - soru: |
      Kefil Zeynep, asıl borçlu Ali'nin bankaya olan borcunu ödemiş, ancak bunu Ali'ye bildirmemiştir. Ali, ödemeden habersiz olarak aynı borcu bankaya yeniden ödemiştir. Zeynep'in durumu hangisidir?
    siklar:
      - "Zeynep, Ali'ye karşı rücu hakkını kaybeder; ancak bankaya karşı sebepsiz zenginleşme davası hakkı saklıdır."
      - "Zeynep, Ali'ye rücu edebilir; bildirim yalnız bir düzen kuralıdır."
      - "Zeynep, bankaya karşı da herhangi bir dava açamaz."
      - "Zeynep, Ali'ye yalnız faiz için rücu edebilir."
    dogru: 0
    aciklama: |
      TBK m. 597: ödeyen kefil durumu borçluya bildirmek zorundadır. Bildirmezse ve ödemeyi bilmeyen veya bilmesi gerekmeyen borçlu da alacaklıya öderse rücu hakkını kaybeder. Kefilin alacaklıya karşı sebepsiz zenginleşmeden doğan dava hakkı saklıdır. Yaygın yanılgı, bildirimin sonuçsuz bir formalite olduğunu düşünmektir.
  - soru: |
      Gerçek kişi Ayşe, 1 Nisan 2014'te bir bankaya kefil olmuştur; sözleşmede "kefalet süresi 15 yıldır" yazmaktadır. Hiçbir uzatma açıklaması yapılmamıştır. Banka 5 Mayıs 2025'te Ayşe'ye karşı takip başlatmıştır. Sonuç nedir?
    siklar:
      - "Kefalet on yılın geçmesiyle kendiliğinden ortadan kalktığı için Ayşe artık takip edilemez."
      - "Kefalet 15 yıl için geçerlidir; takip yerindedir."
      - "Kefalet on yıl dolunca sona ermez; yalnız Ayşe'nin fesih bildirimiyle sona erer."
      - "On yıllık sınır yalnız tüzel kişi kefiller için uygulanır, bu nedenle takip geçerlidir."
    dogru: 0
    aciklama: |
      TBK m. 598/3'e göre gerçek kişi tarafından verilmiş her türlü kefalet, kurulmasından başlayarak on yılın geçmesiyle kendiliğinden ortadan kalkar. On yıldan uzun süre için verilmiş olsa bile, uzatma ya da yeni kefalet yoksa kefil ancak on yıllık süre dolana kadar takip edilebilir (TBK m. 598/4). Süre 1 Nisan 2024'te dolmuş, takip sonradan yapılmıştır. Çeldirici, sözleşmedeki 15 yıllık yazımın geçerli sayılmasıdır.
  - soru: |
      Çalışanlara süresiz olarak kefil olan bir kişi, kefaleti hangi usulle sona erdirebilir?
    siklar:
      - "Her üç yılda bir, ertesi yılın sonunda geçerli olmak üzere sözleşmeyi feshettiğini bildirebilir."
      - "Her yıl sonunda, hiçbir bildirim süresi olmadan feshedebilir."
      - "Yalnız haklı sebebe dayanarak ve mahkeme kararıyla feshedebilir."
      - "Fesih hakkı yoktur; kefalet ancak 10 yılın dolmasıyla sona erer."
    dogru: 0
    aciklama: |
      TBK m. 602: çalışanlara süresiz kefalette kefil, her üç yılda bir, ertesi yılın sonunda geçerli olmak üzere sözleşmeyi feshettiğini bildirebilir. Yaygın yanılgı, yıllık serbest fesih sanılması veya yalnız 10 yıl kuralına bakılmasıdır.

olaylar:
  - olay: |
      X Ltd. Şti. (B), Güvenli Banka'dan (A) genel kredi kullanmaktadır. Gerçek kişi Ayşe (K), 1 Nisan 2016'da A'ya karşı, kendi el yazısıyla azamî **400.000 TL** limit ve müteselsil kefil sıfatını belirterek kefalet sözleşmesini imzalamıştır. Sözleşmenin matbu bir hükmünde şunlar yazmaktadır: "Kefil, kefaletten önce doğmuş bütün borçlardan ve ayrıca **50.000 TL ceza koşulundan** da sorumludur." Sözleşmede kefalet süresi için "20 yıl" ifadesi yer almaktadır; sonradan hiçbir uzatma açıklaması yapılmamıştır.

      B, 2024 başında faiz ödemelerini durdurmuş ve ödemeler **sekiz ay** boyunca yapılmamıştır; A bu durumu K'ya hiç bildirmemiştir. A, K'ya karşı 12 Mayıs 2025'te toplam **520.000 TL** (anapara, faiz ve masraf) üzerinden icra takibi başlatmıştır.

      1. K'nın azamî sorumluluğu ve kefaletten önceki borçlar bakımından durumu nedir?
      2. 50.000 TL ceza koşulu kaydı geçerli midir?
      3. A'nın K'ya bildirim yapmaması K'nın hukukunu nasıl etkiler?
      4. 20 yıllık süre yazımı ve takip tarihi bakımından K'nın durumu nedir? Süre sonradan nasıl uzatılabilir?
    olcut:
      - {tespit: "Azamî miktar sınırı: K her durumda 400.000 TL'ye kadar sorumludur; 520.000 TL'nin fazlası talep edilemez", puan: 20, madde: "TBK m. 589"}
      - {tespit: "Kefaletten önceki borçlara sorumluluk açıkça kararlaştırıldığı için geçerlidir (limit içinde)", puan: 15, madde: "TBK m. 589"}
      - {tespit: "Ceza koşulundan sorumluluk anlaşması kesin hükümsüzdür", puan: 20, madde: "TBK m. 589"}
      - {tespit: "Altı aylık gecikmenin kefile bildirilmemesi: alacaklı kefilin zararı oranında haklarını kaybeder", puan: 15, madde: "TBK m. 594"}
      - {tespit: "Gerçek kişi kefaleti 10 yılda kendiliğinden biter; 20 yıllık yazım geçersiz, takip 10 yıl dolmadan yapıldığından geçerli", puan: 20, madde: "TBK m. 598"}
      - {tespit: "Uzatma ancak bitişten en erken bir yıl önce, kefalet şekline uygun yazılı açıklamayla, en çok 10 yıl için yapılabilir", puan: 10, madde: "TBK m. 598"}
    cozum: |
      **Nitelendirme:** Olay, gerçek kişi tarafından verilmiş, müteselsil ve limitli bir banka kefaletinin kapsamı, ceza koşulu, alacaklının bildirim yükü ve süre sorunlarını içerir. Kefalet TBK m. 583 şekline uygun yazılmıştır; şekil sorunu yoktur.

      **Hukuki sorunlar:** (1) Kefilin sorumluluk kapsamı ve önceki borçlar. (2) Ceza koşulu anlaşmasının geçerliliği. (3) Alacaklının bildirim yükümlülüğü. (4) 10 yıllık sürenin işleyişi ve uzatma.

      **İlgili hükümler:** TBK m. 589/1: kefil her durumda azamî miktara kadar sorumludur. TBK m. 589/3: açıkça kararlaştırılmışsa kefaletten önceki borçlardan da sorumluluk mümkündür. TBK m. 589/4: ceza koşulundan sorumluluk anlaşmaları kesin hükümsüzdür. TBK m. 594/1 ve TBK m. 594/3: altı aylık gecikmede bildirim yükü, ihlalde zarar miktarınca hak kaybı. TBK m. 598/3-5: gerçek kişi kefaleti on yılda biter, uzatma kuralları.

      **Değerlendirme:** Takip konusu 520.000 TL'nin 400.000 TL'yi aşan kısmı için K sorumlu değildir; limit kefilin el yazısıyla belirttiği tavandır. Kefaletten önceki borçlar sözleşmede açıkça kararlaştırıldığı için bu borçlar limit içinde K'ya yöneltilebilir. 50.000 TL ceza koşulu kaydı ise kesin hükümsüzdür; K bu yüzden tavan içinde dahi ceza koşulundan sorumlu tutulamaz. Sekiz aylık faiz gecikmesi altı ayı aşmıştır; A durumu bildirmeyerek TBK m. 594 yükümünü ihlal etmiştir. Sonuç, K'nın bu yüzden uğradığı zarar miktarınca A'nın K'ya karşı haklarını kaybetmesidir. Zararın ispatı ve kapsamı olayın somut verilerine bağlıdır. Süre bakımından, kefalet 1 Nisan 2016'da kurulduğundan on yıllık süre 1 Nisan 2026'da dolar. 20 yıllık yazım bu sınırı aşamaz. Takip 12 Mayıs 2025'te, yani süre dolmadan başlatıldığından kefil bakımından geçerlidir. Olayda uzatma açıklaması yoktur. Uzatma yapılacaksa bitişten en erken bir yıl önce (1 Nisan 2025'ten itibaren), K'nın kefalet şekline uygun yazılı açıklamasıyla ve en çok on yıllık yeni dönem için yapılabilirdi.

      **Sonuç:** K, 400.000 TL ile sınırlı sorumludur; önceki borçlar limit içinde istenebilir, ceza koşulu istenemez. A bildirim yükümlülüğünü ihlal ettiği ölçüde K'nın zararından sorumlu olur. Kefalet 10 yıl dolunca kendiliğinden sona erer; 20 yıllık yazım geçersizdir.
  - olay: |
      Banka (A), Y Ltd. Şti.'ye (B) 600.000 TL kredi vermiştir. Gerçek kişi Zeynep (K), B'ye kefil olmuştur. A'nın elinde, kefalet sırasında var olan ve B'nin taşınmazı üzerinde kurulu bir ipotek vardır. B'nin mali durumu giderek bozulmuş, borç muaccel olmuştur.

      Kefalet sözleşmesi geçerlidir. K, B'nin mali durumunun kefalet tarihine göre çok kötüleştiğini ve ipotekli taşınmazın değer kaybettiğini görünce B'den güvence verilmesini ve borçtan kurtarılmasını istemiş, B bu talebe cevap vermemiştir. Bunun üzerine K, borcun tamamını A'ya ödemiştir. A, K'ya tahsilat makbuzu vermiş, ancak ipotek belgelerini teslim etmeyi ihmal etmiştir. K, ödemeyi B'ye bildirmemiştir. B, ödemeden habersiz olarak bir hafta sonra aynı borcu A'ya yeniden ödemiş, A bu ikinci ödemeyi kabul etmiştir.

      1. K'nın ödemeden önceki hakları nelerdir?
      2. K ödeme yapınca hangi haklara geçer? İpotek bakımından durum nedir?
      3. A'nın belge ve rehin teslimi yükümü nedir?
      4. K'nın B'ye karşı durumu ve A'ya karşı hakkı nedir?
    olcut:
      - {tespit: "Mali durumun kötüleşmesi hâlinde kefilin borçludan güvence ve muaccel borçta borçtan kurtarılma isteyebilmesi", puan: 15, madde: "TBK m. 595"}
      - {tespit: "Kefil ödediği ölçüde alacaklının haklarına kanunen halef olur", puan: 20, madde: "TBK m. 596"}
      - {tespit: "Kefalet anında var olan ipoteğe halefiyet", puan: 15, madde: "TBK m. 596"}
      - {tespit: "Alacaklının borç senetlerini, bilgileri ve rehinleri kefile teslim etme yükümü", puan: 15, madde: "TBK m. 592"}
      - {tespit: "Ödemeyi bildirmeyen kefil, ödemeyi bilmeyen borçlu yeniden öderse rücu hakkını kaybeder", puan: 20, madde: "TBK m. 597"}
      - {tespit: "Kefilin alacaklıya karşı sebepsiz zenginleşme davası hakkının saklı olması", puan: 15, madde: "TBK m. 597"}
    cozum: |
      **Nitelendirme:** Olay, kefilin ödemeden önceki hakları, ödemeyle halefiyet, alacaklının belge teslim yükümü ve kefilin ödemeyi bildirme yükünü kapsar.

      **Hukuki sorunlar:** (1) Kefilin borçludan güvence ve kurtarılma isteme hakkı. (2) Halefiyet ve rehne etkisi. (3) Alacaklının teslim yükümü. (4) Bildirimin yapılmamasının sonucu.

      **İlgili hükümler:** TBK m. 595/3 borçlunun mali durumunun kötüleşmesi hâlinde güvence ve muaccel borçta borçtan kurtarılma hakkı verir. TBK m. 596/1 ifa ölçüsünde halefiyeti, TBK m. 596/2 kefalet anında var olan rehinlere halefiyeti düzenler. TBK m. 592/3 alacaklıya senet, bilgi ve rehin teslimi yükler. TBK m. 597 ödemeyi bildirmeyen kefilin rücu kaybını ve sebepsiz zenginleşme davasını düzenler.

      **Değerlendirme:** B'nin mali durumunun kötüleşmesi, güvencenin değer kaybetmesi ve borcun muaccel olması sebebiyle K, TBK m. 595/3 kapsamında borçludan güvence ve borçtan kurtarılmayı isteyebilir. B'nin cevapsız kalması K'yı ödemekten alıkoymaz; alacaklı muaccel borçta ödemeyi kabul etmek zorundadır, haklı sebebi olmadan reddederse K kurtulurdu (TBK m. 593/2). K, 600.000 TL'yi ödeyince A'nın haklarına ödeme ölçüsünde kanunen halef olur; alacaklının rızası aranmaz. Kefalet sırasında var olan ipotek K'ya geçer, çünkü TBK m. 596/2 bu tür güvencelere halefiyeti tanır. A, kefile belgeleri, bilgileri ve ipoteğin devri için gereken işlemleri vermekle yükümlüdür; teslimi ihmal etmesi bu yükümün ihlalidir. Asıl sorun bildirimdir: K ödemeyi B'ye bildirmemiş, B de ödemeden habersiz ve bilmesi gerekmeden aynı borcu ikinci kez ödemiştir. TBK m. 597/2 uyarınca K, rücu hakkını kaybeder. Ancak aynı borç iki kez tahsil edildiğinden A haksız zenginleşmiş olur; K'nın A'ya karşı sebepsiz zenginleşmeden doğan dava hakkı saklıdır (TBK m. 597/3).

      Halefiyet ödemeyle kendiliğinden doğmuştur; bildirim yapılmaması bunu değiştirmez. Ancak TBK m. 597/2 özel bir hüküm olarak bildirimsiz ödemenin sonucunu düzenler: ödemeyi bilmeyen borçlu da alacaklıya öderse kefilin rücu hakkı kaybolur.

      **Sonuç:** K, ödeme öncesinde B'den güvence ve kurtarılma isteyebilirdi. Ödemeyle A'nın haklarına ve kefalet anındaki ipoteğe halef olmuştur; A teslim yükümünü yerine getirmelidir. Bildirim yapılmadığı için B'ye rücu hakkını kaybetmiş, buna karşılık A'ya sebepsiz zenginleşme davası açabilir.

kartlar:
  - on: "Kefil hangi tutara kadar sorumludur?"
    arka: "Her durumda sözleşmede belirtilen azamî miktara kadar. Aksi kararlaştırılmamışsa asıl borç, masraflar ve işlemiş bir yıllık ile işlemekte olan yıla ait akdî faiz bu tavanın içindedir (TBK m. 589/1)."
  - on: "Kefil ceza koşulundan sorumlu olabilir mi?"
    arka: "Hayır. Kefilin ceza koşulundan veya asıl borcun hükümsüzlüğünün sebep olduğu zarardan sorumlu olacağına dair anlaşma kesin hükümsüzdür (TBK m. 589/4)."
  - on: "Borçlu iflas edince kefil hemen takip edilir mi?"
    arka: "Hayır. İflas yüzünden asıl borç daha önce muaccel olsa bile belirlenen vadeden önce kefile karşı takip yapılamaz (TBK m. 590/1)."
  - on: "Borcun muacceliyeti ihbara bağlıysa kefil için süre ne zaman başlar?"
    arka: "Bildirimin kefile yapıldığı tarihte (TBK m. 590/3)."
  - on: "Kefil def'i ileri sürmek zorunda mıdır?"
    arka: "Evet; hem hakkı hem zorunluluğu vardır. Borçlu def'iden vazgeçse bile kefil ileri sürebilir (TBK m. 591/1 ve TBK m. 591/2)."
  - on: "Kumar borcuna bilerek kefil olan kişi def'i ileri sürebilir mi?"
    arka: "Evet, bilmesine rağmen ileri sürebilir (TBK m. 591/4)."
  - on: "Alacaklı ağır kusuruyla rehni elden çıkarırsa ne olur?"
    arka: "Haklı sebebi yoksa kefil borcundan kurtulur; ödediğini ve ek zararını geri isteyebilir (TBK m. 592/4)."
  - on: "Alacaklı haklı sebep olmadan kefilin ödemesini kabul etmezse?"
    arka: "Muaccel borçta kefil borcundan kurtulur; birlikte müteselsil kefalette sorumluluk kefilin payı kadar azalır (TBK m. 593/2)."
  - on: "Kefilin rücu zamanaşımı ne zaman başlar?"
    arka: "Kefilin alacaklıya ifada bulunduğu anda (TBK m. 596/5)."
  - on: "Ödemeyi borçluya bildirmeyen kefilin sonucu nedir?"
    arka: "Bilmeyen borçlu da alacaklıya öderse rücu hakkını kaybeder; alacaklıya karşı sebepsiz zenginleşme davası saklıdır (TBK m. 597)."
  - on: "Gerçek kişi kefaleti kaç yılda biter ve nasıl uzatılır?"
    arka: "Kuruluştan 10 yıl sonra kendiliğinden biter. Uzatma, bitişten en erken bir yıl önce, kefaletin şekline uygun yazılı açıklamayla en çok 10 yıl için yapılır (TBK m. 598/3-5)."
  - on: "Çalışanlara süresiz kefalette fesih nasıl olur?"
    arka: "Kefil her üç yılda bir, ertesi yılın sonunda geçerli olmak üzere sözleşmeyi feshettiğini bildirebilir (TBK m. 602)."
