ozet: |
  **Bu konu neyi cevaplıyor?** Kiracı neyi, ne zaman öder; ödemezse kiraya veren sözleşmeyi nasıl sona erdirir; kiracı kiralananı nasıl kullanır, değiştirir, başkasına verir ya da erken bırakırsa ne olur?

  - **Bedel (TBK m. 313-314):** Kiracı kira bedelini öder. Sözleşme ve yerel âdet yoksa kira bedeli ve gerekirse yan giderler **her ayın sonunda ve en geç kira süresinin bitiminde** ödenir.
  - **Temerrüt (TBK m. 315):** Teslimden sonra muaccel kira ya da yan gider ödenmezse kiraya veren **yazılı süre** verip bu sürede ödenmezse sözleşmeyi feshedeceğini bildirir. Süre adi kirada **en az 10 gün**, konut ve çatılı işyerinde **en az 30 gün;** bildirimin yapıldığı tarihi izleyen günden işler. Ürün kirasında 60 gündür (TBK m. 362).
  - **Özen ve saygı (TBK m. 316):** Konut ve çatılı işyerinde önce **en az 30 gün** süreli yazılı ihtar; diğer kirada ihtarsız yazılı bildirimle derhâl fesih. Konut ve çatılı işyerinde kasten ağır zarar, sürenin yararsızlığı ya da çekilmezlik hâlinde de derhâl fesih.
  - **Diğer borçlar:** Olağan temizlik ve bakım giderleri kiracıya aittir (TBK m. 317); kendisinin gidermekle yükümlü olmadığı ayıbı **gecikmeksizin** bildirir (TBK m. 318); onarım çalışmalarına ve kiralananın gezilip görülmesine katlanır (TBK m. 319).
  - **Yenilik ve değişiklik:** Kiraya veren katlanılabilir yenilik yapabilir (TBK m. 320). Kiracı **yazılı rızayla** değişiklik yapabilir; kiraya veren yazılı kararlaştırılmadıkça eski hâli isteyemez, kiracı da yazılı anlaşma yoksa **değer artışının karşılığını isteyemez** (TBK m. 321).
  - **Alt kira ve devir:** Adi kirada alt kira ve kullanım hakkının devri serbesttir; konut ve çatılı işyerinde **yazılı rıza** gerekir (TBK m. 322). Kira ilişkisinin devri her kirada yazılı rızaya bağlıdır; işyerinde kiraya veren **haklı sebep olmadıkça** kaçınamaz, devreden kiracı işyerinde sözleşme bitimine kadar ve **en fazla iki yıl** müteselsil sorumlu kalır (TBK m. 323).
  - **Kullanmama, erken bırakma, takas:** Elverişli bulundurulan kiralananı kullanmayan kiracı da öder (TBK m. 324). Süresinden önce geri veren kiracının borçları **makul süre** devam eder; ödeme gücü olan yeni kiracı bulursa sona erer (TBK m. 325). Takastan önceden feragat edilemez (TBK m. 326).
  - 📌 Kira uyuşmazlıklarında, ilamsız icra yoluyla tahliye hariç, arabuluculuk dava şartıdır (HUAK m. 18/B). Tacir kiracılara uygulanmayan TBK m. 323 ve 325'in 8 yıllık ertelemesi dolmuştur.

anlatim: |
  ## 0. Konunun haritası

  Kiracı sözleşmenin yükümlüsü olarak neleri üstlenir? Bu notta bedel ödemeyi ve temerrüdü, özenle kullanmayı, bildirim ve katlanma borçlarını, değişiklik yapma ile başkasına verme yetkisini, erken bırakmayı işliyoruz.

  | Sorun | Hüküm | Anahtar fikir |
  |---|---|---|
  | Bedel ve zamanı | TBK m. 313-314 | Ay sonu kuralı |
  | Temerrüt | TBK m. 315 | Yazılı süre ve fesih uyarısı |
  | Özen ve saygı | TBK m. 316 | Önce ihtar, istisnaen derhâl fesih |
  | Bakım, bildirim, katlanma | TBK m. 317-319 | Kiracının yan borçları |
  | Yenilik ve değişiklik | TBK m. 320-321 | Yazılı rıza |
  | Alt kira ve devir | TBK m. 322-323 | Rıza ve sorumluluk |
  | Kullanmama, erken bırakma, takas | TBK m. 324-326 | Makul süre |

  ## 1. Kira bedeli ve ödeme zamanı (TBK m. 313-314)

  Kiracı kira bedelini ödemekle yükümlüdür (TBK m. 313). Ödeme zamanı için sıra: önce sözleşme, sonra yerel âdet; ikisi de yoksa kira bedeli ve gerekiyorsa yan giderler **her ayın sonunda ve en geç kira süresinin bitiminde** ödenir (TBK m. 314). Para borcu kural olarak alacaklının yerleşim yerinde ifa edilir (TBK m. 89/1); yani kiracı kiranın kiraya verenin eline geçmesini sağlamalıdır.

  > **Örnek:** Ayşe'nin aylık kira sözleşmesi ödeme günü konusunda sessiz, yerel âdet de yok. Ocak kirası ay başında peşin değil, **31 Ocak'ta** ödenir.

  ## 2. Kiracının temerrüdü (TBK m. 315)

  **Şartlar:** (1) Kiralanan teslim edilmiştir; (2) kira bedeli veya yan gider **muaccel** olmuş ve ödenmemiştir; (3) kiraya veren kiracıya **yazılı** olarak bir süre verip bu sürede ödenmezse sözleşmeyi feshedeceğini bildirmiştir. Yan giderin (ör. site aidatı, ısınma) ödenmemesi de temerrüde yol açar.

  | Kira türü | Verilecek süre |
  |---|---|
  | Adi kira | En az 10 gün (TBK m. 315/2) |
  | Konut ve çatılı işyeri | En az 30 gün (TBK m. 315/2) |
  | Ürün kirası | En az 60 gün (TBK m. 362/2) |

  Süre, kiracıya **yazılı bildirimin yapıldığı tarihi izleyen günden** itibaren işler. Bildirimde ödenmeyen dönem, tutar, verilen süre ve süre içinde ödenmezse fesih ya da tahliye uyarısı bulunmalıdır. Kiracı süre içinde borcunu öderse fesih hakkı doğmaz.

  > **Örnek:** Deniz'in konut kirası Ocak ve Şubat'ta ödenmemiştir. Kiraya veren 3 Mart'ta noter aracılığıyla ihtar çekip ödeme için süre verir. Süre 4 Mart'ta işlemeye başlar. İhtarda yalnız 10 gün verilmişse, konut kirası olduğundan en az 30 gün gerektiği için süre yetersizdir.

  **Sonuç:** Süre sonuçsuz geçerse kiraya veren sözleşmeyi sona erdirip tahliye isteyebilir. İki yol vardır:
  1. **Tahliye davası.** Kira ilişkisinden doğan uyuşmazlıklarda, ilamsız icra yoluyla tahliye hariç, dava açmadan önce arabulucuya başvurmak dava şartıdır (HUAK m. 18/B).
  2. **İlamsız tahliye takibi (İİK m. 269 vd.).** Kiraya veren takip talebinde tahliye de isterse ihtarlı ödeme emri kanundaki ihtarın yerine geçer. Borçlu ödeme emrine yedi gün içinde itiraz edebilir (İİK m. 269/2). İtiraz etmez ve ihtar süresinde borcu ödemezse alacaklı, süre bitiminden itibaren altı ay içinde icra mahkemesinden tahliye ister (İİK m. 269/a).

  Hukuk Genel Kurulu'na göre ödeme emri borçluya usulüne uygun **tebliğ edilmedikçe** ödeme ve itiraz süreleri işlemez ve kiracının temerrüdünden söz edilemez; borçlunun takibi haricen öğrenip itiraz etmesi sonuç doğurmaz.

  > ⚠️ **Sınavda dikkat:** 10 günlük süre yalnız konut ve çatılı işyeri dışındaki adi kiralarda geçerlidir. Konut ve çatılı işyerinde 30 gün altına inilemez. Kısa süreli ihtar geçerli bir temerrüt ihtarı sayılmaz.

  > 📌 **Kesin bilgi:** Tarafların ikisi de tacirse temerrüde düşürmeye ve feshe ilişkin ihtarlar noter, taahhütlü mektup, telgraf ya da kayıtlı elektronik posta yoluyla yapılır (TTK m. 18/3). Aynı kira yılında iki haklı ihtar yoluyla tahliye (TBK m. 352/2) ayrı bir yoldur; konut ve çatılı işyeri tahliye konusunda işlenir.

  ## 3. Özenle kullanma ve komşulara saygı (TBK m. 316)

  Kiracı kiralananı sözleşmeye uygun olarak **özenle** kullanmak ve aynı taşınmazda oturanlara ve komşulara gerekli **saygıyı** göstermekle yükümlüdür. Aykırılıkta sonuçlar kira türüne göre değişir:

  | Kira türü | Kiraya verenin yolu |
  |---|---|
  | Konut ve çatılı işyeri | Önce en az 30 gün süreli yazılı ihtar; giderilmezse fesih |
  | Diğer kiralar | Önceden ihtar olmaksızın yazılı bildirimle derhâl fesih |

  Konut ve çatılı işyerinde şu üç hâlde süre verilmeden **yazılı bildirimle derhâl** fesih mümkündür (TBK m. 316/3): (1) kasten ağır zarar, (2) sürenin yararsız olacağının anlaşılması, (3) davranışın kiraya veren, aynı taşınmazda oturanlar veya komşular bakımından çekilmez olması.

  > **Örnek:** Cem, kiraladığı dükkânın taşıyıcı kolonunu keserek binaya kasten ağır zarar verir. Dükkân çatılı işyeri olsa bile kiraya veren 30 günlük süre vermeden yazılı bildirimle derhâl feshedebilir.

  ## 4. Temizlik, bildirim ve katlanma (TBK m. 317-319)

  - **Temizlik ve bakım (TBK m. 317):** Olağan kullanım için gerekli temizlik ve bakım giderleri kiracıya aittir; yerel âdete de bakılır.
  - **Ayıp bildirimi (TBK m. 318):** Kiracı kendisinin gidermekle yükümlü olmadığı ayıpları kiraya verene **gecikmeksizin** bildirir; aksi hâlde bundan doğan zarardan sorumludur.
  - **Katlanma (TBK m. 319):** Kiracı ayıpların giderilmesine ya da zararların önlenmesine yönelik çalışmalara katlanır; bakım, satış veya sonraki kiralama için zorunlu ölçüde kiralananın kiraya veren ve belirlediği üçüncü kişi tarafından gezilip görülmesine izin verir. Kiraya veren çalışmaları ve gezmeyi uygun süre önce bildirmek ve kiracının yararlarını gözetmek zorundadır. Kiracının kira bedelinin indirilmesine ve zararının giderilmesine ilişkin hakları saklıdır.

  ## 5. Yenilik ve değişiklik (TBK m. 320-321)

  **Kiraya veren (TBK m. 320):** Sözleşmenin feshini gerektirmeyen ve kiracıdan katlanması beklenebilecek yenilik ve değişiklikleri yapabilir; kiracının menfaatini gözetir, kiracının indirim ve tazminat hakları saklıdır.

  **Kiracı (TBK m. 321):**
  1. Kiraya verenin **yazılı rızasıyla** yenilik ve değişiklik yapabilir.
  2. Rıza gösteren kiraya veren, **yazılı olarak kararlaştırılmadıkça**, eski hâle getirilmesini isteyemez.
  3. Kiracı, **aksine yazılı bir anlaşma yoksa**, kiraya verenin rızasıyla yaptığı değişiklikten doğan **değer artışının karşılığını isteyemez.**

  > **Örnek:** Elif, çatılı işyerindeki mağazanın girişini kiraya verenin "yenileyebilirsin" yazılı iznine dayanarak 200.000 TL harcayıp yeniler. İzinde eski hâle getirme ya da değer artışı konusunda hüküm yoksa kira bitince kiraya veren eski hâli isteyemez, Elif de değer artışı için bedel isteyemez.

  > ⚠️ **Sınavda dikkat:** Yazılı rıza değer artışını isteme hakkı doğurmaz. Bunun için değer artışının ödeneceğine dair ayrıca yazılı anlaşma gerekir.

  ## 6. Alt kira ve kira ilişkisinin devri (TBK m. 322-323)

  **Alt kira ve kullanım hakkının devri (TBK m. 322):** Kiracı, kiraya verene zarar verecek bir değişikliğe yol açmamak koşuluyla kiralananı tamamen veya kısmen başkasına kiralayabilir ya da kullanım hakkını devredebilir. **Konut ve çatılı işyerinde** ise kiraya verenin **yazılı rızası** gerekir. Alt kiracı kiralananı kiracıya tanınandan başka biçimde kullanırsa kiracı kiraya verene karşı sorumlu olur; kiraya veren kiracısına karşı haklarını alt kiracıya karşı da kullanabilir.

  **Kira ilişkisinin devri (TBK m. 323):** Kiracı, kiraya verenin yazılı rızasını almadıkça kira ilişkisini devredemez. **İşyeri kiralarında** kiraya veren haklı sebep olmadıkça rıza vermekten kaçınamaz. Rıza varsa devralan kiracının yerine geçer ve devreden kiraya veren karşısında borçlarından kurtulur; ancak **işyeri kiralarında** devreden, sözleşmenin bitimine kadar ve **en fazla iki yıl** devralanla birlikte müteselsilen sorumlu olur.

  | Özellik | Alt kira / kullanım hakkı (TBK m. 322) | Kira ilişkisinin devri (TBK m. 323) |
  |---|---|---|
  | Kiracı | Kiracı olarak kalır, sorumludur | Devralan yerine geçer |
  | Rıza | Adi kirada gerekmez; konut ve çatılı işyerinde yazılı rıza | Her kirada yazılı rıza |
  | Kiraya verenin kaçınması | Kanun sınır koymaz | İşyerinde haklı sebep olmadıkça kaçınamaz |
  | Devreden | Kiracılığı sürer | Kurtulur; işyerinde en fazla 2 yıl müteselsil |

  > **Örnek:** X Ltd. 1 Haziran 2025'te işyeri kiralarını yazılı rızayla Y A.Ş.'ye devreder. X Ltd. devirden itibaren iki yılı aşmamak ve sözleşme bitimini geçmemek üzere Y A.Ş. ile müteselsil sorumludur; konutta devreden kiracı devirle tamamen kurtulurdu.

  > ⚠️ **Sınavda dikkat:** "Haklı sebep olmadıkça rızadan kaçınamaz" kuralı yalnız kira ilişkisinin devri (TBK m. 323) ve yalnız işyerleri içindir. Konut ve çatılı işyerinde alt kira için yazılı rıza gerekir, kanun kiraya vereni rızaya zorlamaz.

  ## 7. Kullanmama, erken bırakma ve takas (TBK m. 324-326)

  - **Kullanmama (TBK m. 324):** Kiralanan kullanıma elverişli bulundurulduğu sürece, kiracı kendisinden kaynaklanan bir sebeple kullanmasa ya da sınırlı kullansa bile kirayı öder. Kiraya verenin yapmaktan kurtulduğu giderler indirilir. Örnek: Hastanede üç ay yatan kiracı daireyi kullanamasa da kirayı öder.
  - **Erken geri verme (TBK m. 325):** Kiracı sözleşme süresine veya fesih dönemine uymadan kiralananı geri verirse borçları kiralananın benzer koşullarla kiraya verilebileceği **makul süre** devam eder. Makul süre dolmadan kiraya verenden kabul etmesi beklenebilecek, ödeme gücü olan ve devralmaya hazır **yeni kiracı** bulursa borçları sona erer. Kiraya veren, yapmaktan kurtulduğu giderleri ve kiralananı başka biçimde kullanmakla elde ettiği ya da kasten elde etmekten kaçındığı yararları kira bedelinden düşer. Makul süre somut olaya göre bilirkişiyle belirlenir.
  - **Takas (TBK m. 326):** Taraflar kira sözleşmesinden doğan alacakları takas etme hakkından **önceden feragat edemez;** "kiracı alacağını kira borcuyla takas edemez" kaydı hükümsüzdür.

  ## 8. Denetim şemaları

  **Temerrüt olayı:** (1) Kiralanan teslim edilmiş mi? (2) Borç muaccel mi? (3) Yazılı süre ve fesih uyarısı var mı? (4) Süre yeterli mi (10 / 30 / 60 gün)? (5) Süre ne zaman başladı? (6) Kiracı süre içinde ödedi mi? (7) Hangi yol: dava (arabuluculuk) mı, ilamsız takip mi?

  **Alt kira / devir olayı:** (1) Kiracı sıfatını koruyor mu, yoksa ilişki mi devrediliyor? (2) Kira türü (konut, çatılı işyeri, diğer)? (3) Yazılı rıza var mı? (4) İşyerinde haklı sebep var mı? (5) Devreden ne kadar sorumlu?

  > 📌 **Kesin bilgi:** Kiracısı tacir ya da tüzel kişi olan işyeri kiralarında TBK m. 323 ve 325 dahil bazı hükümler 1.7.2012'den itibaren 8 yıl uygulanmamıştır (6217 sayılı Kanun'un geçici 2. maddesi); süre dolmuştur. Eski döneme ilişkin tacir kiracı uyuşmazlıklarında Yargıtay bu ertelemeyi göz önüne alır. TBK m. 313-326 metinlerinde 2023 sonrasında değişiklik görünmez.

kritik: |
  - 📌 Kira bedeli ve yan giderler sözleşme ve yerel âdet yoksa **her ayın sonunda ve en geç kira süresinin bitiminde** ödenir (TBK m. 314).
  - 📌 Temerrütte yazılı süre: adi kirada **en az 10 gün**, konut ve çatılı işyerinde **en az 30 gün**, ürün kirasında 60 gün (TBK m. 315/2 ve TBK m. 362/2).
  - ⚠️ Süre, yazılı bildirimin yapıldığı tarihi **izleyen günden** işlemeye başlar (TBK m. 315/2).
  - 📌 Temerrüt yalnız kira bedeli değil **yan gider** için de oluşur (TBK m. 315/1).
  - 📌 Tahliye yolları: dava (arabuluculuk dava şartı, ilamsız icra yoluyla tahliye hariç) ya da ilamsız tahliye takibi (HUAK m. 18/B; İİK m. 269 vd.). Tebliğ edilmeyen ödeme emriyle süreler işlemez.
  - ⚠️ TBK m. 316: konut ve çatılı işyerinde önce **en az 30 gün** süreli yazılı ihtar; diğer kiralarda ihtarsız, yazılı bildirimle derhâl fesih.
  - 📌 Konut ve çatılı işyerinde kasten ağır zarar, sürenin yararsızlığı ve çekilmezlik hâllerinde ihtarsız, yazılı bildirimle derhâl fesih mümkündür (TBK m. 316/3).
  - 📌 Kiracı gidermekle yükümlü olmadığı ayıbı **gecikmeksizin** bildirir; yoksa zarardan sorumludur (TBK m. 318).
  - ⚠️ TBK m. 321: Kiracı **yazılı rızayla** değişiklik yapar; yazılı kararlaştırılmadıkça eski hâl istenemez; aksine yazılı anlaşma yoksa değer artışı istenemez.
  - ⚠️ Alt kira ve kullanım hakkının devri adi kirada serbesttir; konut ve çatılı işyerinde yazılı rıza şarttır (TBK m. 322).
  - 📌 Kira ilişkisinin devri yazılı rızaya bağlıdır; işyerinde kiraya veren haklı sebep olmadıkça kaçınamaz; devreden işyerinde bitime kadar ve **en fazla iki yıl** müteselsil sorumludur (TBK m. 323).
  - 📌 Erken geri veren kiracının borçları **makul süre** devam eder; kabul edilebilir ödeme gücü olan yeni kiracı bulunursa sona erer. Takastan önceden feragat edilemez (TBK m. 325 ve TBK m. 326).

doktrin: |
  ### Kiracının değer artırıcı masrafları ve TBK m. 321/3
  TBK m. 321/3 kiracının, aksine yazılı anlaşma yoksa kiraya verenin rızasıyla yaptığı değişikliklerin değer artışını isteyemeyeceğini söyler. Baskın görüşe göre bu özel hüküm, aynı taleplerin sebepsiz zenginleşme ve vekâletsiz iş görme hükümleriyle yeniden ileri sürülmesini kapatır. Bazı Yargıtay kararlarında ise kiracının kiralanana yaptığı zorunlu ve faydalı masrafların, zenginleşme ölçüsünde, vekâletsiz iş görme hükümleri uyarınca (TBK m. 530) istenebileceği kabul edilmiştir. Özellikle sözleşmenin kiraya verenin kusuruyla ya da beklenmedik biçimde erken sona ermesi hâlinde kiracının amorti edemediği masraflar tartışmalıdır. Sınavda önce TBK m. 321/3'ü yaz, sonra bu tartışmayı belirt.

  ### Kiraya verenin haksız ret hâlinde devrin gerçekleşmesi
  İşyeri kirasında kiraya veren haklı sebep olmadıkça rıza vermekten kaçınamaz (TBK m. 323/1). Haklı sebep yokken rıza verilmezse devrin ne zaman gerçekleşeceği tartışmalıdır: Bir görüşe göre kiracı mahkemeden alacağı kararla rızanın yerine geçmesini sağlar ve devir bu kararla gerçekleşir; başka bir görüşe göre dürüstlük kuralı (TMK m. 2) gereği kiraya veren talep anından itibaren rıza vermiş sayılır. Uygulamada mahkeme kararıyla rızanın yerine geçirilmesi yaygındır. Bu ayrıntıyı kesin kural gibi yazma.

sozluk:
  - terim: Temerrüt
    tanim: "Kiracının muaccel kira bedeli ya da yan gideri zamanında ödememesi; fesih için kiraya verenin yazılı süre vermesi gerekir (TBK m. 315)."
  - terim: Muaccel
    tanim: "Ödeme zamanı gelmiş, istenebilir hâle gelmiş borç; kirada ödeme zamanı TBK m. 314'e göre belirlenir."
  - terim: Fesih ihtarı
    tanim: "Kiraya verenin kiracıya yazılı olarak süre verip bu sürede ödenmezse sözleşmeyi feshedeceğini bildirmesi (TBK m. 315)."
  - terim: Yan gider
    tanim: "Kiralananın kullanımıyla ilgili ısınma, aydınlatma, su, aidat gibi giderler; ödenmemesi de temerrüde yol açar."
  - terim: İlamsız tahliye takibi
    tanim: "Kira alacağı için ihtarlı ödeme emriyle başlatılan ve itirazsızlık hâlinde icra mahkemesinden tahliyeye varan icra yolu (İİK m. 269 vd.)."
  - terim: Alt kira
    tanim: "Kiracının kiracılığını koruyarak kiralananı tamamen ya da kısmen başkasına kiralaması (TBK m. 322)."
  - terim: Kullanım hakkının devri
    tanim: "Kiracının kiralananı kullanma hakkını başkasına bırakması; konut ve çatılı işyerinde kiraya verenin yazılı rızasına bağlıdır (TBK m. 322/2)."
  - terim: Kira ilişkisinin devri
    tanim: "Kiracının kira sözleşmesindeki yerini kiraya verenin yazılı rızasıyla başkasına bırakması; devralan kiracının yerine geçer (TBK m. 323)."
  - terim: Müteselsil sorumluluk
    tanim: "Birden çok borçludan her birinin borcun tamamından sorumlu olması; işyeri kirası devrinde devreden kiracı en fazla iki yıl devralanla birlikte sorumludur (TBK m. 323/3)."
  - terim: Makul süre
    tanim: "Erken geri verilen kiralananın benzer koşullarla yeniden kiraya verilebileceği süre; kiracının borçları bu süre devam eder (TBK m. 325)."
  - terim: Değer artışı
    tanim: "Kiracının kiraya verenin rızasıyla yaptığı değişiklik sonucu kiralananda oluşan artış; yazılı anlaşma yoksa karşılığı istenemez (TBK m. 321/3)."
  - terim: Takas
    tanim: "Karşılıklı alacakların birbirine mahsup edilmesi; kira alacakları bakımından önceden feragat edilemez (TBK m. 326)."

kararlar:
  - id: "920523900"
    ozet: |
      Bir mülk sahibi, 1992 tarihli kira sözleşmesine dayanarak 2017 ve 2018 yıllarının ödenmeyen kirası için bir anonim şirket ve diğer borçlular aleyhine 5 Haziran 2018'de haciz ve tahliye istekli ilamsız takip başlatmıştır. Ödeme emri şirkete tebliğ edilememiş ve iade edilmiştir; şirket takibi kendiliğinden öğrenip vekille 8 Haziran'da itiraz etmiştir. Alacaklı, icra mahkemesinden itirazın kaldırılmasını ve tahliyeyi istemiştir. İlk derece mahkemesi istemi reddetmiş, bölge adliye mahkemesi şirket yönünden itirazın kaldırılmasını kabul etmiş, Yargıtay 12. Hukuk Dairesi bozmuş, bölge adliye mahkemesi direnmiş, Hukuk Genel Kurulu direnme kararını oy çokluğuyla bozmuştur. Genel Kurul, temerrütle fesih için TBK m. 315 ve 362'deki ihtarın gerektiğini, ilamsız tahliye takibinde ihtarlı ödeme emrinin bu ihtarın yerini tuttuğunu, ödeme emri tebliğ edilmediğinden ödeme ve itiraz sürelerinin işlemediğini ve borçlunun takibi haricen öğrenip itiraz etmesinin hukuki sonuç doğurmadığını belirtmiştir. Temerrüt gerçekleşmediğinden itirazın kaldırılması ve tahliye istemi reddedilmelidir. Konuya katkısı: Temerrüt ihtarının usulüne uygun ulaşmasının önemini gösterir.
  - id: "1221292700"
    ozet: |
      Kiraya veren, 2012 başlangıçlı beş yıllık depo kirasında kiracının 3 Kasım 2017'de fesih bildirdiğini ve kiralananı 2 Mayıs 2018'de boşalttığını, sözleşmedeki fesih ihbar düzenine uyulmadığını ileri sürerek makul süre kira bedeli ile hor kullanma tazminatı istemiştir. İlk derece mahkemesi sözleşmedeki üç aylık fesih bildirimi süresini makul süre sayıp her iki kalemi kabul etmiş, bölge adliye mahkemesi makul süreyi aynen bırakmış ancak hor kullanma tazminatını reddetmiştir. Yargıtay 3. Hukuk Dairesi, kiracı tacir olduğundan 6217 sayılı Kanun'un geçici 2. maddesi uyarınca TBK m. 325'in o dönemde uygulanmadığını, ancak eski Borçlar Kanunu döneminin Yargıtay uygulamasında da kiracının haksız erken tahliyesi hâlinde kiraya verenin zararının, kiralananın yeniden kiraya verilebileceği tarihe kadar boş kalma süresine (makul süre) ilişkin kiradan ibaret olduğunu belirtmiştir. Sözleşmedeki üç aylık hükmün sözleşme sonu fesih bildirimine ilişkin olduğunu, makul süreyi tarafların belirlediği anlamına gelmediğini, makul sürenin keşif ve uzman bilirkişi raporuyla saptanması gerektiğini söyleyerek kararı bozmuştur. Konuya katkısı: Makul sürenin sözleşme hükmüyle değil, kiralananın somut özelliklerine göre belirlendiğini gösterir.

sorular:
  - soru: |
      Ayşe'nin kira sözleşmesinde ödeme günü yazılı değildir ve yerel âdet de yoktur. Ocak ayı kirası ne zaman ödenir?
    siklar:
      - "Ocak ayının başında peşin olarak"
      - "Ocak ayının sonunda"
      - "Şubat ayının ilk iş günü"
      - "Kira süresinin başında bir kez, yıllık"
    dogru: 1
    aciklama: |
      Aksine sözleşme ve yerel âdet yoksa kira bedeli ve gerekiyorsa yan giderler her ayın sonunda ve en geç kira süresinin bitiminde ödenir (TBK m. 314). Kira kural olarak ay başında peşin ödenmez.

  - soru: |
      Çatısız boş arsa kirasında kiracı muaccel kirayı ödemedi. Kiraya veren sözleşmeyi feshedeceğini bildirerek yazılı süre verecektir. TBK m. 315'e göre verilecek süre en az kaç gündür?
    siklar:
      - "On gün"
      - "Otuz gün"
      - "Altmış gün"
      - "Yedi gün"
    dogru: 0
    aciklama: |
      Çatısız arsa konut ve çatılı işyeri değil adi kiradır; TBK m. 315/2'ye göre süre en az on gündür. Otuz gün konut ve çatılı işyeri kiraları, altmış gün ürün kirası içindir (TBK m. 362/2).

  - soru: |
      Kiraya veren, ödenmeyen konut kirası için kiracıya noter aracılığıyla ihtar çekmiş ve ödeme için yalnız 10 gün süre vermiştir. Bu ihtar bakımından doğru olan hangisidir?
    siklar:
      - "Geçerlidir; temerrüt ihtarında en az 10 gün yeterlidir"
      - "Yetersizdir; konut kirasında verilecek süre en az otuz gün olmalıdır"
      - "Yetersizdir; süre en az altmış gün olmalıdır"
      - "Geçerlidir; ancak yalnız noter yoluyla yapıldığı için"
    dogru: 1
    aciklama: |
      TBK m. 315/2'ye göre konut ve çatılı işyeri kiralarında verilecek süre en az otuz gündür. On günlük süre yalnız adi kiralarda yeterlidir; altmış gün ürün kirasına özgüdür.

  - soru: |
      Temerrüt ihtarı kiracıya 3 Mart'ta bildirilmiştir. TBK m. 315'teki süre ne zaman işlemeye başlar?
    siklar:
      - "3 Mart'ta, bildirimin yapıldığı gün"
      - "4 Mart'ta, bildirimin yapıldığı tarihi izleyen günde"
      - "Kiracının ihtarı okuduğu gün"
      - "Sözleşmenin sona erdiği tarihte"
    dogru: 1
    aciklama: |
      TBK m. 315/2'ye göre süre, kiracıya yazılı bildirimin yapıldığı tarihi izleyen günden itibaren işlemeye başlar. Süre bildirimin yapıldığı günde başlamaz.

  - soru: |
      Konut kiracısı Zeynep, apartmanda gece geç saatlerde sürekli yüksek sesli etkinlikler yaparak komşuları rahatsız etmektedir. Kasten ağır zarar ya da çekilmezlik niteliğinde bir durum yoktur. Kiraya veren sözleşmeyi nasıl sona erdirebilir?
    siklar:
      - "Önceden ihtar yapmadan, yazılı bildirimle derhâl"
      - "En az otuz gün süre vererek aykırılığın giderilmesini, aksi hâlde sözleşmeyi feshedeceğini yazılı ihtar ederek"
      - "En az on gün süre vererek sözlü ihtar yaparak"
      - "Yalnız mahkeme kararıyla"
    dogru: 1
    aciklama: |
      Konut ve çatılı işyeri kirasında özen ve saygı borcuna aykırılıkta kiraya veren en az otuz gün süre vererek aykırılığın giderilmesi, aksi takdirde sözleşmeyi feshedeceği konusunda yazılı ihtarda bulunur (TBK m. 316/2). Derhâl fesih ancak kasten ağır zarar, sürenin yararsızlığı ya da çekilmezlik hâllerinde mümkündür.

  - soru: |
      Taşınır kirası olarak kiralanan bir iş makinesini kiracı özensiz kullanarak sürekli hasara uğratmaktadır. Konut ve çatılı işyeri kirası söz konusu değildir. Kiraya veren sözleşmeyi nasıl feshedebilir?
    siklar:
      - "Önceden ihtarda bulunmaksızın, yazılı bildirimle sözleşmeyi hemen feshedebilir"
      - "Önce otuz gün süreli ihtar şarttır"
      - "Önce on gün süreli ihtar şarttır"
      - "Fesih ancak hasar bedeli ödenirse mümkündür"
    dogru: 0
    aciklama: |
      Konut ve çatılı işyeri dışındaki kira ilişkilerinde özen borcuna aykırılıkta kiraya veren, kiracıya önceden ihtarda bulunmaksızın yazılı bildirimle sözleşmeyi hemen feshedebilir (TBK m. 316/2). Otuz günlük ihtar şartı konut ve çatılı işyerine özgüdür.

  - soru: |
      Elif, çatılı işyerinde yaptığı girişi yenileme işlemini kiraya verenin yazılı rızasına dayanarak yapmıştır. Yazılı rızada eski hâle getirme ve değer artışı hakkında bir hüküm yoktur. Kira sona erince hangisi doğrudur?
    siklar:
      - "Kiraya veren eski hâle getirilmesini isteyebilir"
      - "Kiraya veren eski hâl isteyemez; Elif de değer artışının karşılığını isteyemez"
      - "Elif değer artışının tamamını isteyebilir"
      - "Elif yalnız yaptığı masrafın yarısını isteyebilir"
    dogru: 1
    aciklama: |
      Rıza gösteren kiraya veren, yazılı olarak kararlaştırılmadıkça eski hâle getirmeyi isteyemez (TBK m. 321/2); kiracı da aksine yazılı anlaşma yoksa değer artışının karşılığını isteyemez (TBK m. 321/3). Yazılı rıza değer artışı hakkı doğurmaz.

  - soru: |
      Kiracı Murat, kiraladığı konutun bir odasını öğrenci Tuna'ya kiralamak istemektedir. Kiraya verenin yazılı rızası yoktur. Murat'ın durumu nedir?
    siklar:
      - "Kiralananı kısmen başkasına kiralayabilir; rıza gerekmez"
      - "Konut kirasında kiraya verenin yazılı rızası olmadıkça kiralananı başkasına kiralayamaz"
      - "Yalnız bir ay önceden bildirim yaparak kiralayabilir"
      - "Rıza gerekmez ama kira bedeli kiraya verene devredilir"
    dogru: 1
    aciklama: |
      Konut ve çatılı işyeri kiralarında kiracı, kiraya verenin yazılı rızası olmadıkça kiralananı başkasına kiralayamaz ve kullanım hakkını devredemez (TBK m. 322/2). Rıza aranmayan hâl, konut ve çatılı işyeri dışındaki adi kiralardır.

  - soru: |
      Aşağıdakilerden hangisi TBK m. 323'e göre doğrudur?
    siklar:
      - "İşyeri kiralarında kiraya veren haklı sebep olmadıkça kira ilişkisinin devrine rıza vermekten kaçınamaz"
      - "Konut kiralarında kiraya veren haklı sebep olmadıkça kira ilişkisinin devrine rıza vermekten kaçınamaz"
      - "Alt kirada her zaman kiraya verenin rızasından kaçınamayacağı kabul edilir"
      - "Kira ilişkisinin devri kiraya verenin rızası olmadan da yapılabilir"
    dogru: 0
    aciklama: |
      Kira ilişkisinin devri yazılı rızaya bağlıdır; işyeri kiralarında kiraya veren haklı sebep olmadıkça bu rızayı vermekten kaçınamaz (TBK m. 323/1). Bu sınırlama konut için öngörülmemiştir ve alt kira (TBK m. 322) için de yoktur.

  - soru: |
      X Ltd., işyeri kira ilişkisini kiraya verenin yazılı rızasıyla 1 Haziran 2025'te Y A.Ş.'ye devretmiştir. Sözleşme 2029'a kadar sürmektedir. Y A.Ş. Temmuz 2027 kirasını ödememiştir. X Ltd.'nin durumu nedir?
    siklar:
      - "Devirle borçlarından tamamen kurtulduğu için sorumlu değildir"
      - "Kira sözleşmesinin bitimine kadar her hâlde sorumludur"
      - "Devirden itibaren en fazla iki yıl devralanla müteselsil sorumlu olduğundan Temmuz 2027 borcundan sorumlu değildir"
      - "Devirden itibaren on yıl sorumludur"
    dogru: 2
    aciklama: |
      İşyeri kiralarında devreden kiracı, sözleşmenin bitimine kadar ve en fazla iki yıl süreyle devralanla birlikte müteselsilen sorumludur (TBK m. 323/3). Devirden iki yıl sonra doğan Temmuz 2027 kirasından X Ltd. sorumlu tutulamaz; sözleşme süresi daha uzun olsa da iki yıl sınırı geçerlidir.

  - soru: |
      Ofis kiracısı Kerem, sözleşme süresi bitmeden ofisi kiraya verene teslim etmiştir. Bilirkişi ofisin benzer koşullarla yeniden kiraya verilebileceği makul süreyi 3 ay olarak belirlemiştir. Kiraya veren hiçbir çaba göstermemiş ve dört ay boş tutmuştur. Kerem'in sorumluluğu hakkında hangisi doğrudur?
    siklar:
      - "Sözleşme bitimine kadar tüm kiralardan sorumludur"
      - "Borçları makul süre olan 3 ay için devam eder"
      - "Geri verme anında tüm borçlarından kurtulur"
      - "Yalnız geri verdiği ayın kirasından sorumludur"
    dogru: 1
    aciklama: |
      Kiracı sözleşme süresine veya fesih dönemine uymaksızın kiralananı geri verirse, kira sözleşmesinden doğan borçları kiralananın benzer koşullarla kiraya verilebileceği makul süre için devam eder (TBK m. 325/1). Makul sürenin ötesindeki boş kalma süresinden kiracı sorumlu tutulmaz.

  - soru: |
      Kiralananı erken geri veren kiracı Selin, makul süre dolmadan, kiraya verenden kabul etmesi beklenebilecek, ödeme gücü bulunan ve kira ilişkisini devralmaya hazır yeni bir kiracı bulup kiraya verene önermiştir. TBK m. 325'e göre sonuç nedir?
    siklar:
      - "Selin'in kira sözleşmesinden doğan borçları sona erer"
      - "Selin makul süre dolana kadar yine de sorumlu kalır"
      - "Kiraya veren yeni kiracıyı dilediği gibi reddedebilir ve Selin'in borcu sürer"
      - "Selin'in borcu yarıya iner"
    dogru: 0
    aciklama: |
      Kiracının makul sürenin geçmesinden önce kiraya verenden kabul etmesi beklenebilecek, ödeme gücüne sahip ve kira ilişkisini devralmaya hazır yeni bir kiracı bulması hâlinde kiracının kira sözleşmesinden doğan borçları sona erer (TBK m. 325/1). Önemli olan, yeni kiracının kiraya verence kabul edilmesi beklenebilecek nitelikte olmasıdır.

olaylar:
  - olay: |
      Konut kiracısı K, aylık 25.000 TL kirayla oturduğu dairenin Ocak ve Şubat kiralarını ödememiştir. Ayrıca sözleşmeye göre ödemekle yükümlü olduğu aylık site aidatını da (yan gider) iki aydır ödememiştir. KV, 10 Mart'ta noter aracılığıyla K'ya ihtarname gönderir; ihtarnamede ödenmeyen dönemler ve tutarlar yazılıdır, K'ya borcu ödemesi için "10 gün" süre verilmiş ve ödenmezse sözleşmenin feshedileceği bildirilmiştir. K hiçbir ödeme yapmaz. KV, ihtarname süresi dolduğu için sözleşmenin feshedildiğini ve tahliyenin istenebileceğini düşünmektedir.

      1. K'nın aidat borcu temerrüt bakımından önemli midir?
      2. KV'nin 10 günlük süre vermesi yeterli midir? Süre ne zaman başlar?
      3. KV hangi yollarla tahliye isteyebilir? Dava yolunda dikkat edilecek ön şart nedir?
    olcut:
      - {tespit: "Temerrüt şartları: teslimden sonra muaccel kira ve yan giderin ödenmemesi; yazılı süre ve fesih uyarısı; yan giderin de kapsama girmesi", puan: 20, madde: "TBK m. 315/1"}
      - {tespit: "Konut kirasında verilecek sürenin en az otuz gün olması; 10 günlük sürenin yetersizliği", puan: 25, madde: "TBK m. 315/2"}
      - {tespit: "Sürenin yazılı bildirimin yapıldığı tarihi izleyen günden işlemeye başlaması", puan: 15, madde: "TBK m. 315/2"}
      - {tespit: "İlamsız tahliye takibi: ihtarlı ödeme emri, yedi gün itiraz, itirazsızlık ve ihtar süresinde ödememe hâlinde altı ay içinde icra mahkemesinden tahliye", puan: 20, madde: "İİK m. 269 ve 269/a"}
      - {tespit: "Dava yolunda arabulucuya başvurunun dava şartı olması; ilamsız icra yoluyla tahliyenin istisna olması", puan: 20, madde: "HUAK m. 18/B"}
    cozum: |
      **Nitelendirme:** Konut kirasında kiracı muaccel kira ve yan gider borcunu ödememiştir. Kiraya veren, temerrüt nedeniyle sözleşmeyi sona erdirmek istemektedir.

      **Hukuki sorunlar:** (1) Yan giderin temerrüde etkisi; (2) ihtar süresinin yeterliliği ve başlangıcı; (3) tahliye yolları ve arabuluculuk.

      **İlgili hükümler:** TBK m. 315; İİK m. 269 ve 269/a; HUAK m. 18/B.

      **Değerlendirme:**

      *1. Yan gider:* Kiracı kiralananın tesliminden sonra muaccel olan kira bedelini veya yan gideri ödemezse kiraya veren yazılı olarak süre verip, bu sürede de ifa edilmezse sözleşmeyi feshedeceğini bildirebilir (TBK m. 315/1). Dolayısıyla aidat gibi yan giderlerin ödenmemesi de temerrüt sebebidir; kira borcunun yanında anılabilir.

      *2. Süre:* Kiracıya verilecek süre en az on gün, konut ve çatılı işyeri kiralarında ise en az otuz gündür (TBK m. 315/2). Kira konut kirasıdır; 10 günlük süre yetersizdir. Bu süreyle gönderilen ihtarname geçerli bir temerrüt ihtarı olarak fesih sonucunu doğurmaz. KV, en az otuz gün süreli yeni bir yazılı ihtar göndermelidir. Süre, kiracıya yazılı bildirimin yapıldığı tarihi izleyen günden itibaren işlemeye başlar; ihtarname 10 Mart'ta yapılmışsa süre 11 Mart'ta başlar. Süre içinde kiracı borcunu öderse fesih hakkı doğmaz.

      *3. Yollar:* KV iki yoldan gidebilir. Birincisi tahliye davasıdır; kira ilişkisinden doğan uyuşmazlıklarda, ilamsız icra yoluyla tahliye hariç, dava açmadan önce arabulucuya başvurmak dava şartıdır (HUAK m. 18/B). İkincisi ilamsız tahliye takibidir: KV takip talebinde tahliye de isterse ihtarlı ödeme emri bu ihtarın yerine geçer; ödeme emrinde yasal ödeme süresi (konutta en az otuz gün) doğru gösterilmelidir. Borçlu yedi gün içinde itiraz edebilir (İİK m. 269/2). İtiraz etmez ve ihtar süresinde ödemezse alacaklı, süre bitiminden itibaren altı ay içinde icra mahkemesinden tahliye ister (İİK m. 269/a). Ödeme emri K'ya usulüne uygun tebliğ edilmedikçe süreler işlemez; Hukuk Genel Kurulu da tebliğsiz ödeme emriyle temerrüt oluşmayacağını kabul eder.

      **Sonuç:**
      - Aidat borcu da temerrüt sebebidir.
      - 10 günlük süre konut kirasında yetersizdir; en az 30 gün gerekir ve süre bildirimi izleyen günden başlar.
      - KV dava (önce arabuluculuk) ya da ilamsız tahliye takibi yoluyla tahliye isteyebilir.

  - olay: |
      X Ltd., KV'ye ait çatılı işyerini 1 Ocak 2024'ten itibaren beş yıllığına kiralamıştır. KV, mağaza girişinin yenilenmesine yazılı olarak izin vermiştir; yazılı izinde eski hâle getirme ya da değer artışının ödenmesi konusunda hüküm yoktur. X Ltd. 200.000 TL harcayarak girişi yenilemiştir.

      X Ltd., kiralananın bir bölümünü KV'nin yazılı izni olmadan Z'ye kiralamak istemektedir. Ardından 1 Haziran 2025'te kira ilişkisini tümüyle M A.Ş.'ye devretmek istediğini KV'ye bildirir; KV hiçbir sebep göstermeden "kimseyle çalışmam" diyerek yazılı rızayı reddeder. Daha sonra KV, rızasını yazılı olarak verir ve devir 1 Haziran 2025'te gerçekleşir. M A.Ş. Eylül 2026 kirasını ve Temmuz 2027 kirasını ödememiştir.

      1. Sözleşme biterken KV girişin eski hâline getirilmesini, X Ltd. de 200.000 TL'lik değer artışının ödenmesini isteyebilir mi?
      2. X Ltd., KV'nin izni olmadan kiralananın bir bölümünü Z'ye kiralayabilir mi?
      3. KV'nin devre ilişkin rızayı sebepsiz reddi hukuka uygun mudur?
      4. X Ltd., M A.Ş.'nin Eylül 2026 ve Temmuz 2027 kiralarından sorumlu tutulabilir mi?
    olcut:
      - {tespit: "Yazılı rıza ile yapılan değişiklikte eski hâle getirme isteminin yazılı kararlaştırılmadıkça mümkün olmaması", puan: 15, madde: "TBK m. 321/2"}
      - {tespit: "Aksine yazılı anlaşma yoksa değer artışının karşılığının istenememesi", puan: 15, madde: "TBK m. 321/3"}
      - {tespit: "Çatılı işyerinde kiracının yazılı rıza olmadan kiralananı başkasına kiralayamaması", puan: 20, madde: "TBK m. 322/2"}
      - {tespit: "İşyeri kira ilişkisinin devrinde kiraya verenin haklı sebep olmadıkça rızadan kaçınamaması", puan: 20, madde: "TBK m. 323/1"}
      - {tespit: "Devirden itibaren en fazla iki yıl devreden kiracının devralanla müteselsilen sorumlu olması; Eylül 2026 kirasından sorumlu, Temmuz 2027 kirasından sorumsuz", puan: 30, madde: "TBK m. 323/3"}
    cozum: |
      **Nitelendirme:** Çatılı işyeri kirasında kiracı, kiraya verenin yazılı rızasıyla yenilik yapmıştır; ayrıca alt kira ve kira ilişkisinin devri istemleri vardır.

      **Hukuki sorunlar:** (1) Yazılı rızayla yapılan değişikliğin sonuçları; (2) alt kiranın rızaya bağlılığı; (3) devre rıza vermekten kaçınma; (4) devredenin sorumluluk süresi.

      **İlgili hükümler:** TBK m. 321, 322, 323.

      **Değerlendirme:**

      *1. Yenilik:* Kiracı, kiraya verenin yazılı rızasıyla yenilik ve değişiklik yapabilir (TBK m. 321/1). Rıza gösteren kiraya veren, yazılı olarak kararlaştırılmadıkça, kiralananın eski durumuyla geri verilmesini isteyemez (TBK m. 321/2). İzinde eski hâl konusunda hüküm olmadığından KV bunu isteyemez. Kiracı da aksine yazılı bir anlaşma yoksa değer artışının karşılığını isteyemez (TBK m. 321/3); yazılı rıza tek başına değer artışı hakkı doğurmaz. X Ltd.'nin 200.000 TL'lik istemi bu nedenle reddedilir. Sebepsiz zenginleşme ve vekâletsiz iş görme yoluyla talep ise doktrinde tartışmalıdır; bu olayın çözümü TBK m. 321/3 lafzına dayanır.

      *2. Alt kira:* Kiracı, konut ve çatılı işyeri kiralarında kiraya verenin yazılı rızası olmadıkça kiralananı başkasına kiralayamaz ve kullanım hakkını devredemez (TBK m. 322/2). Alt kira kısmen de olsa yapılacaksa yazılı rıza gerekir; X Ltd. izin almadan Z'ye kiralayamaz. Kanun, alt kirada kiraya vereni rıza vermeye zorlamaz.

      *3. Devir:* Kira ilişkisinin devri için kiraya verenin yazılı rızası gerekir, ancak işyeri kiralarında kiraya veren haklı sebep olmadıkça bu rızayı vermekten kaçınamaz (TBK m. 323/1). KV'nin hiçbir sebep göstermeden "kimseyle çalışmam" demesi haklı sebep değildir; reddi hukuka uygun değildir. Haksız ret hâlinde devrin tam olarak ne zaman gerçekleşeceği doktrinde tartışmalıdır; olayda KV sonradan rızasını yazılı vermiştir.

      *4. Devredenin sorumluluğu:* Yazılı rızayla devredilen kira ilişkisinde devralan kiracının yerine geçer ve devreden kiraya veren karşısında borçlarından kurtulur (TBK m. 323/2). İşyeri kiralarında ise devreden, kira sözleşmesinin bitimine kadar ve en fazla iki yıl süreyle devralanla birlikte müteselsilen sorumlu olur (TBK m. 323/3). Devir 1 Haziran 2025'te yapılmıştır; Eylül 2026 kirası devirden itibaren iki yıllık süre içindedir ve X Ltd. M A.Ş. ile birlikte sorumludur. Temmuz 2027 kirası ise iki yıllık sürenin dışındadır; sözleşme 2029'a kadar sürse de X Ltd. bundan sorumlu tutulamaz.

      **Sonuç:**
      - KV eski hâl isteyemez, X Ltd. de değer artışı isteyemez.
      - X Ltd., izinsiz alt kira yapamaz.
      - KV'nin sebepsiz reddi haksızdır.
      - X Ltd., Eylül 2026 kirasından M A.Ş. ile müteselsilen sorumludur; Temmuz 2027 kirasından sorumlu değildir.

kartlar:
  - on: "Kira bedeli ne zaman ödenir? (TBK m. 314)"
    arka: "Sözleşme ve yerel âdet yoksa kira ve gerekirse yan giderler her ayın sonunda ve en geç kira süresinin bitiminde. Para borcu alacaklının yerleşim yerinde ifa edilir (TBK m. 89/1)."
  - on: "Temerrüt ihtarında verilecek süre? (TBK m. 315/2)"
    arka: "Adi kirada en az 10 gün; konut ve çatılı işyerinde en az 30 gün; ürün kirasında en az 60 gün (TBK m. 362/2)."
  - on: "Temerrüt ihtar süresi ne zaman başlar?"
    arka: "Yazılı bildirimin yapıldığı tarihi izleyen günden itibaren (TBK m. 315/2)."
  - on: "İlamsız tahliye takibi nasıl işler? (İİK m. 269 vd.)"
    arka: "İhtarlı ödeme emri; borçlu 7 gün içinde itiraz edebilir. İtiraz etmez ve ihtar süresinde ödemezse süre bitiminden itibaren 6 ay içinde icra mahkemesinden tahliye istenir (İİK m. 269/a)."
  - on: "Kira uyuşmazlığında arabuluculuk?"
    arka: "Kira ilişkisinden doğan uyuşmazlıklarda, ilamsız icra yoluyla tahliye hariç, dava şartıdır (HUAK m. 18/B)."
  - on: "TBK m. 316'ya göre konut ve çatılı işyerinde özen borcuna aykırılıkta ne yapılır?"
    arka: "En az 30 gün süreli yazılı ihtar; giderilmezse fesih. Kasten ağır zarar, sürenin yararsızlığı ya da çekilmezlik hâlinde derhâl yazılı fesih. Diğer kirada ihtarsız derhâl fesih."
  - on: "Kiracı ayıpları ne zaman bildirir? (TBK m. 318)"
    arka: "Kendisinin gidermekle yükümlü olmadığı ayıpları gecikmeksizin; aksi hâlde zarardan sorumlu olur."
  - on: "Yazılı rızayla yapılan yenilikte eski hâl ve değer artışı? (TBK m. 321)"
    arka: "Yazılı kararlaştırılmadıkça kiraya veren eski hâli isteyemez; aksine yazılı anlaşma yoksa kiracı değer artışının karşılığını isteyemez."
  - on: "Alt kira için kiraya verenin rızası gerekir mi? (TBK m. 322)"
    arka: "Adi kirada gerekmez; konut ve çatılı işyerinde yazılı rıza şarttır."
  - on: "Kira ilişkisinin devri ve devredenin sorumluluğu? (TBK m. 323)"
    arka: "Yazılı rıza gerekir; işyerinde haklı sebep olmadıkça kaçınılamaz. Devreden kurtulur; işyerinde sözleşme bitimine kadar en fazla 2 yıl müteselsil sorumlu kalır."
  - on: "Erken geri veren kiracının sorumluluğu? (TBK m. 325)"
    arka: "Borçları benzer koşullarla yeniden kiralanabileceği makul süre devam eder; kabul edilebilir, ödeme gücü olan yeni kiracı bulursa sona erir."
  - on: "Takas hakkından önceden feragat? (TBK m. 326)"
    arka: "Kiracı da kiraya veren de kira alacaklarını takas etme hakkından önceden feragat edemez."
