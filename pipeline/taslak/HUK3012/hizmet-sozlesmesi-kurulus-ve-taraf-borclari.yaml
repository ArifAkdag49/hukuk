sorular:
  - soru: |
      Hizmet sözleşmesinin kuruluşuna ilişkin aşağıdaki ifadelerden hangisi doğrudur?
    siklar:
      - "Kanunda aksine hüküm yoksa özel bir şekle bağlı değildir."
      - "Yazılı yapılmadıkça geçersizdir."
      - "Belirsiz süreli sözleşmeler noter onayıyla yapılır."
      - "Yazılı sözleşme olmadığında yalnız emsal ücret hükümleri uygulanır, hizmet sözleşmesi kurulmuş sayılmaz."
    dogru: 0
    aciklama: |
      TBK m. 394/1'e göre hizmet sözleşmesi, kanunda aksine bir hüküm bulunmadıkça özel bir şekle bağlı değildir. Sözlü ya da örtülü sözleşme geçerlidir; yazılı olmaması yalnızca ispatı güçleştirir. Yazılı şekil ya da noter onayı aramak yaygın bir yanılgıdır.
  - soru: |
      Ali, bir işyerinde dört ay çalışmış ve ücretini almıştır. Sonradan hizmet sözleşmesinin geçersiz olduğu anlaşılmıştır. Ali'nin işverene karşı ücret hakkı bakımından hangisi doğrudur?
    siklar:
      - "Sözleşme geçersiz olduğundan Ali ücret isteyemez, yalnızca sebepsiz zenginleşmeye dayanabilir."
      - "Sözleşme ilişki ortadan kaldırılıncaya kadar geçerli bir hizmet sözleşmesinin bütün hüküm ve sonuçlarını doğurur; Ali ücretini isteyebilir."
      - "Sözleşme baştan itibaren yok sayılır; işveren Ali'ye hiçbir ödeme yapmak zorunda değildir."
      - "Ali ancak asgari ücretin yarısını isteyebilir."
    dogru: 1
    aciklama: |
      TBK m. 394/3'e göre geçersizliği sonradan anlaşılan hizmet sözleşmesi, hizmet ilişkisi ortadan kaldırılıncaya kadar geçerli bir sözleşmenin bütün hüküm ve sonuçlarını doğurur. Çalışma bir kez gerçekleştiği için geçmişe etkili geçersizlik uygulanmaz; işçi ücretini ve diğer haklarını sözleşme hükümlerine göre alır.
  - soru: |
      Zeynep, tasarım ajansında çalışırken bu işyerine bildirmeden hafta sonları ücret karşılığı ajansın doğrudan rakibi olan bir firma için çalışmaya başlamıştır. Aralarında yazılı bir rekabet yasağı sözleşmesi yoktur. Hangisi doğrudur?
    siklar:
      - "Yazılı rekabet yasağı sözleşmesi olmadığından Zeynep'in davranışı hukuka uygundur."
      - "Rekabet yasağı yalnızca sözleşme sona erdikten sonra doğar; çalışırken yasak yoktur."
      - "Zeynep sözleşme sürerken sadakat borcu gereği ücret karşılığı üçüncü kişiye hizmette bulunamaz ve işvereniyle rekabete girişemez; bu borç doğrudan kanundan doğar."
      - "Sadakat borcuna aykırılık ancak işveren zarar gördüğünü ispat ederse söz konusu olur."
    dogru: 2
    aciklama: |
      TBK m. 396/3 uyarınca işçi, hizmet ilişkisi devam ettiği sürece sadakat borcuna aykırı olarak ücret karşılığı üçüncü kişiye hizmette bulunamaz ve özellikle kendi işvereni ile rekabete girişemez. Bu yasak için ayrıca sözleşme gerekmez. Yazılı rekabet yasağı sözleşmesi (TBK m. 444) ise sözleşmenin sona ermesinden sonrası içindir. Yaygın yanılgı, iki kavramı birbirine karıştırmaktır.
  - soru: |
      Sözleşmesi sona eren mühendis Mehmet, çalışırken öğrendiği üretim sırlarını yeni işinde kullanmak istemektedir. Aralarında yazılı rekabet yasağı sözleşmesi yoktur. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Sözleşme sona erdiği için sır saklama borcu da tamamen biter."
      - "Sır saklama borcu yalnız yazılı rekabet yasağı sözleşmesi varsa sürer."
      - "Sır saklama borcu süresiz ve koşulsuz olarak devam eder."
      - "Sır saklama borcu, işverenin haklı menfaatinin korunması için gerekli olduğu ölçüde sözleşme sona erdikten sonra da devam eder."
    dogru: 3
    aciklama: |
      TBK m. 396/4'e göre işçi, işverenin haklı menfaatinin korunması için gerekli olduğu ölçüde hizmet ilişkisinin sona ermesinden sonra da sır saklamakla yükümlüdür. Borç, yazılı bir rekabet yasağına bağlı değildir ve süresiz de değildir; kapsamı haklı menfaatle sınırlıdır.
  - soru: |
      Ayşe, rızasıyla bir ayda 10 saat fazla çalışma yapmıştır. Normal saatlik ücreti 200 TL'dir; işçi ve işveren ücret yerine izin kullanma konusunda anlaşmamıştır. TBK m. 402'ye göre işverenin Ayşe'ye fazla çalışma için ödemesi gereken asgari tutar nedir?
    siklar:
      - "2.000 TL"
      - "2.400 TL"
      - "3.000 TL"
      - "4.000 TL"
    dogru: 2
    aciklama: |
      TBK m. 402/1'e göre işveren fazla çalışma için normal çalışma ücretini en az yüzde elli fazlasıyla öder. Saatlik 200 TL'nin yüzde elli fazlası 300 TL'dir; 10 saat için en az 3.000 TL eder. 2.000 TL zam uygulanmamış ücrettir; 4.000 TL yüzde yüz zam anlamına gelir.
  - soru: |
      Işık Ltd. Şti., kasa görevlisi Ali'nin dikkatsizlik sonucu (kasıt olmaksızın) kırdığı 8.000 TL'lik cihazın bedelini Ali'nin rızasını almadan maaşından kesmiştir. Hangisi doğrudur?
    siklar:
      - "Kesinti geçerlidir; işçi kusuruyla verdiği her zarardan sorumludur."
      - "Kesinti ancak haczedilebilir kısım kadar geçerlidir."
      - "Kesinti hukuka aykırıdır; rıza yoksa takas ancak işçinin kasten sebebiyet verdiği, yargı kararıyla sabit zarar için ve haczedilebilir kısım kadar yapılabilir."
      - "Kesinti, zarar miktarı işçinin bir aylık ücretini aşmadıkça geçerlidir."
    dogru: 2
    aciklama: |
      TBK m. 407/2'ye göre işveren, ücret borcunu işçinin rızası olmadıkça kendi alacağıyla takas edemez. İstisna, işçinin kasten sebebiyet verdiği yargı kararıyla sabit bir zarardan doğan alacaklardır. Burada zarar kusurla (kasıtsız) verilmiştir ve yargı kararı yoktur; işçinin TBK m. 400'e göre sorumluluğu ayrı bir dava konusu olur, ancak ücretten kesinti yapılamaz.
  - soru: |
      Mehmet, villada aşçıdır. Villa sahibi iki hafta tatile gidip villayı kapatmış, Mehmet çalışmaya hazır olduğunu bildirmiştir. Mehmet bu sürede başka bir işte çalışmamıştır. Hangisi doğrudur?
    siklar:
      - "Mehmet çalışmadığı için bu süre ücret hak etmez."
      - "İşveren ücreti öder; ancak Mehmet bu süreyi daha sonra telafi çalışmasıyla karşılamak zorundadır."
      - "İşveren, kabulde temerrüde düştüğü için ücreti öder ve Mehmet'ten edimini sonradan yerine getirmesini isteyemez; yalnız tasarruf ettiği giderler ücretten indirilir."
      - "Mehmet yalnızca ücretin yarısını isteyebilir."
    dogru: 2
    aciklama: |
      TBK m. 408'e göre işveren iş görmeyi kusuruyla engellerse ya da edimi kabulde temerrüde düşerse işçiye ücretini öder ve işçiden bu edimi sonradan yerine getirmesini isteyemez. Yalnız işçinin bu engelleme yüzünden yapmaktan kurtulduğu giderler ile başka iş yaparak kazandığı ya da bilerek kazanmaktan kaçındığı yararlar indirilir. Telafi çalışması istenemez.
  - soru: |
      Ali, borcuna karşılık alacaklısına gelecek altı ayda doğacak maaşının dörtte birini devretmiştir. Bu devir bakımından hangisi doğrudur?
    siklar:
      - "Devir, ücretin dörtte biri ile sınırlı olduğu için geçerlidir."
      - "Hâkim onay verirse geçerli olur."
      - "Devir yalnız ilk iki ay için geçerlidir."
      - "Gelecekteki ücret alacaklarının devri geçersizdir."
    dogru: 3
    aciklama: |
      TBK m. 410/2'ye göre gelecekteki ücret alacaklarının devredilmesi veya rehnedilmesi geçersizdir. Dörtte bir sınırı (TBK m. 410/1) doğmuş ücret alacakları için haciz, devir ve rehin sınırıdır; gelecekteki ücret için dörtte birini devretmek bile geçersizdir.
  - soru: |
      Aşağıdakilerden hangisi TBK m. 417'ye göre işverenin işçinin kişiliğinin korunmasına aykırı davranması hâlinde işçinin uğradığı zararlara uygulanacak hükümleri doğru gösterir?
    siklar:
      - "Haksız fiil hükümleri uygulanır; sözleşmeye aykırılık hükümleri uygulanamaz."
      - "Zararın tazmini sözleşmeye aykırılıktan doğan sorumluluk hükümlerine tabidir."
      - "Yalnızca sebepsiz zenginleşme hükümleri uygulanır."
      - "İşverenin sorumluluğu kusursuz sorumluluk esasına dayanır; kusursuzluk kanıtı hiçbir hâlde sorumluluğu kaldırmaz."
    dogru: 1
    aciklama: |
      TBK m. 417/3 uyarınca işverenin bu hükümler dahil, kanuna ve sözleşmeye aykırı davranışı nedeniyle işçinin ölümü, vücut bütünlüğünün zedelenmesi veya kişilik haklarının ihlaline bağlı zararların tazmini sözleşmeye aykırılıktan doğan sorumluluk hükümlerine tabidir. Bu yüzden TBK m. 112'deki kusur karinesi işleyebilir: işveren kusursuzluğunu ispat etmedikçe sorumlu olur.
  - soru: |
      Havayolu şirketi, pilotla yaptığı hizmet sözleşmesine yalnızca pilot aleyhine işleyen bir ceza koşulu koymuştur: pilot sözleşmeyi erken bırakırsa şirkete iki aylık ücreti kadar ceza ödeyecektir. Bu ceza koşulu hakkında hangisi doğrudur?
    siklar:
      - "Geçerlidir; yalnızca hâkim aşırı bulursa indirir."
      - "Sadece işçi aleyhine konulan ceza koşulu geçersizdir."
      - "Geçerlidir; ancak işçi bu cezayı ödeyerek sözleşmeden kurtulur."
      - "Pilot imzaladığı için geçerlidir; sözleşme serbestisi gereği hâkim müdahale edemez."
    dogru: 1
    aciklama: |
      TBK m. 420/1'e göre hizmet sözleşmelerine sadece işçi aleyhine konulan ceza koşulu geçersizdir. Geçersizliği sözleşme özgürlüğü ya da hâkimin indirimi ile telafi edilemez; ceza koşulu baştan hükümsüzdür.
  - soru: |
      Burak'ın hizmet sözleşmesi 1 Mart'ta sona ermiştir. 10 Mart'ta işveren Burak'a alacak türünü ve tutarını belirten yazılı bir ibraname imzalatmış ve alacağın tamamını bankadan ödemiştir. Bu ibraname hakkında hangisi doğrudur?
    siklar:
      - "Geçerlidir; yazılı olması, ödemenin tam ve bankadan yapılması yeterlidir."
      - "Kesin hükümsüzdür; çünkü sözleşmenin sona ermesinden başlayarak en az bir aylık süre geçmemiştir."
      - "İptal edilebilir; Burak bir ay içinde iptal bildirimi yapmazsa geçerli olur."
      - "Geçerlidir; bir aylık süre yalnızca ibranamede gösterilmeyen alacaklar için aranır."
    dogru: 1
    aciklama: |
      TBK m. 420/2'ye göre ibra sözleşmesinin geçerliliği için ibra tarihi itibarıyla sözleşmenin sona ermesinden başlayarak en az bir aylık sürenin geçmiş olması şarttır. Diğer şartlar (yazılı, tür ve miktar, noksansız ve banka aracılığıyla ödeme) gerçekleşse bile bu şart eksikse ibra kesin hükümsüzdür; iptal edilebilirlik söz konusu değildir.
  - soru: |
      X A.Ş., fabrikasının tamamını hukuki bir işlemle Y A.Ş.'ye devretmiştir. Fabrikada çalışan Zeynep'in rızası alınmamıştır. Hangisi doğrudur?
    siklar:
      - "Devir geçersizdir; işçinin yazılı rızası alınmadıkça hizmet sözleşmesi Y A.Ş.'ye geçemez."
      - "İşyeri devrinde devir tarihinde mevcut hizmet sözleşmeleri bütün hak ve borçlarıyla kanun gereği devralana geçer."
      - "Zeynep'in sözleşmesi devirle kendiliğinden sona erer ve kıdem süresi sıfırlanır."
      - "Sözleşme yalnız Zeynep'in sözlü rızasıyla Y A.Ş.'ye geçebilir."
    dogru: 1
    aciklama: |
      TBK m. 428/1'e göre işyerinin tamamı ya da bir bölümü hukuki işlemle başkasına devredildiğinde, devir tarihinde mevcut hizmet sözleşmeleri bütün hak ve borçlarıyla devralana geçer; işçinin hizmet süresine bağlı hakları bakımından devreden yanında işe başladığı tarih esas alınır (TBK m. 428/2). Yazılı rıza şartı, tek bir hizmet sözleşmesinin devrini düzenleyen TBK m. 429 içindir.

olaylar:
  - olay: |
      Nermin, İlker Bey'in villasında bir yıldır tam zamanlı aşçı olarak çalışmaktadır. Yazılı sözleşmede aylık ücret 40.000 TL olarak belirlenmiş, ayrıca "Nermin yemeği zamanında çıkarmazsa her gecikme için İlker Bey'e 5.000 TL ceza öder" kaydı eklenmiştir. İlker Bey İlkbaharda 15 gün için yurt dışına gitmiş, villayı kapatmış ve Nermin'e "bu süre gelme" demiştir; Nermin çalışmaya hazır olduğunu söylemiş ve bu sürede başka işte çalışmamıştır. İlker Bey dönünce o ayki ücretten üç kalem kesmiştir: (a) tatil sürecindeki 15 günün ücretini, (b) Nermin'in dikkatsizlikle (kasıt olmaksızın) kırdığı 8.000 TL'lik porselen tabağın bedelini, (c) bir ay önce yemeğin geç çıkması nedeniyle ceza koşulundan doğduğunu ileri sürdüğü 5.000 TL'yi. Nermin bu kesintilere itiraz etmiştir.

      1. Nermin ile İlker Bey arasındaki sözleşmenin niteliği nedir ve hangi kanun uygulanır?
      2. Ceza koşulu geçerli midir?
      3. 15 günlük ücret kesintisi hukuka uygun mudur?
      4. 8.000 TL ve 5.000 TL kesintileri bakımından işverenin takas hakkı var mıdır?
    olcut:
      - {tespit: "Bağımlı ve ücretli iş görme nedeniyle hizmet sözleşmesi; ev hizmetinde İK m. 4 gereği TBK'nın uygulanması", puan: 20, madde: "TBK m. 393"}
      - {tespit: "Yalnız işçi aleyhine konulan ceza koşulunun geçersizliği", puan: 20, madde: "TBK m. 420"}
      - {tespit: "İşverenin kabulde temerrüdü ve ücretin ödenmesi", puan: 20, madde: "TBK m. 408"}
      - {tespit: "Takasın rıza veya kasten verilmiş, yargı kararıyla sabit zarar şartına bağlı olması", puan: 20, madde: "TBK m. 407"}
      - {tespit: "İşçinin kusurlu zarardan sorumluluğunun ayrı dava konusu olması ve sonucun belirlenmesi", puan: 20, madde: "TBK m. 400"}
    cozum: |
      **Nitelendirme:** Nermin, İlker Bey'in talimatı ve düzeni altında, ücret karşılığı ve süreklilik arz eden biçimde iş görmektedir. Edim bir eser (sonuç) borcu değil bağımlı iş görmedir; dolayısıyla sözleşme hizmet sözleşmesidir (TBK m. 393/1). Aşçı ev işinde çalıştığı için ev hizmeti niteliğindedir; İK m. 4/1'de ev hizmetleri istisna edildiğinden İK uygulanmaz, TBK'nın hizmet sözleşmesi hükümleri doğrudan uygulanır.

      **Hukuki sorunlar:** (1) Tek taraflı ceza koşulunun geçerliliği. (2) Villa kapalıyken işçinin ücret hakkı. (3) İşverenin kendi iddia ettiği alacakları ücretten kesip kesemeyeceği.

      **İlgili hükümler:** TBK m. 393 ve İK m. 4 (nitelendirme ve kapsam); TBK m. 420/1 (ceza koşulu); TBK m. 408 (kabulde temerrüt); TBK m. 407/2 (takas); TBK m. 400 (işçinin sorumluluğu).

      **Değerlendirme:** Ceza koşulu yalnızca Nermin aleyhine, geç çıkan her yemek için işçinin işverene ödeyeceği biçimde düzenlenmiştir; işveren aleyhine karşılıklı bir yaptırım yoktur. TBK m. 420/1'e göre sadece işçi aleyhine konulan ceza koşulu geçersizdir; bu nedenle 5.000 TL talep edilemez.

      İlker Bey villayı kapatıp Nermin'in hazır olan edimini kabul etmemiştir. Bu durum işverenin kabulde temerrüdüdür. TBK m. 408 gereği işveren ücreti ödemekle yükümlüdür ve Nermin'den bu süreyi sonradan telafi etmesini isteyemez. Nermin'in tasarruf ettiği giderler (varsa) ücretten indirilebilir; ancak Nermin başka iş yapmadığından bu sürede kazandığı bir yarar yoktur. 15 günlük ücret kesintisi hukuka aykırıdır.

      Tabağın bedeli bakımından Nermin dikkatsizlikle, yani kusurla zarar vermiştir; TBK m. 400'e göre işçi kusuruyla verdiği zarardan sorumlu olabilir, sorumluluğun belirlenmesinde işin tehlike derecesi, uzmanlık ve eğitim ihtiyacı ve işçinin bilinen nitelikleri gözetilir. Ancak ücretten takas için TBK m. 407/2 daha dar bir ölçüt koyar: işçinin rızası ya da kasten sebebiyet verdiği, yargı kararıyla sabit zarar. Burada rıza yoktur, zarar kasıtla verilmemiş ve yargı kararı da bulunmamaktadır. İlker Bey'in 8.000 TL'yi ücretten kesmesi hukuka aykırıdır; zararını dava yoluyla isteyebilir.

      **Sonuç:** Sözleşme İK m. 4 nedeniyle TBK'ya tabi bir hizmet sözleşmesidir. Ceza koşulu geçersizdir. 15 günlük ücret ödenmelidir. 8.000 TL ve 5.000 TL kesintileri hukuka aykırıdır; İlker Bey kesintileri iade etmelidir, tabak zararı için ayrıca dava açabilir.
  - olay: |
      Burak, X A.Ş.'nin fabrikasında üç yıldır çalışmaktadır. 1 Haziran 2025'te X A.Ş. fabrikanın tamamını hukuki bir işlemle Y A.Ş.'ye devretmiştir; devir tarihinde Burak'ın ödenmemiş 30.000 TL fazla çalışma ücreti alacağı vardır. Burak'ın sözleşmesi 1 Mart 2026'da Y A.Ş. tarafından feshedilmiştir; kıdem ve ihbar tazminatı dahil toplam alacağı (30.000 TL fazla çalışma alacağı dahil) 140.000 TL'dir.

      İhtimal 1: Y A.Ş., 15 Mart 2026'da Burak'a iki belge imzalatmıştır: "ibraname" ve aynı tutarlı "makbuz". Belgelerde alacakların türü ve 100.000 TL miktarı yazılıdır; 100.000 TL Burak'ın banka hesabına yatırılmış, kalan 40.000 TL ödenmemiştir.

      İhtimal 2: Y A.Ş. 15 Mart'ta hiçbir belge imzalatmamış, ancak 10 Nisan 2026'da Burak'a alacağın türünü ve 140.000 TL miktarını açıkça yazan bir ibraname imzalatmış ve 140.000 TL'nin tamamını o gün Burak'ın banka hesabına yatırmıştır.

      1. Devirle Burak'ın sözleşmesi ne olur, 30.000 TL'lik alacaktan kimler sorumludur?
      2. İhtimal 1'de (15 Mart 2026) belgelerin hukuki durumu nedir?
      3. İhtimal 2'deki 10 Nisan 2026 tarihli ibraname geçerli midir?
    olcut:
      - {tespit: "İşyeri devrinde sözleşmenin kanun gereği devralana geçmesi", puan: 15, madde: "TBK m. 428"}
      - {tespit: "Devirden önce doğmuş borçlardan devreden ve devralanın müteselsil sorumluluğu, devredenin sorumluluğunun devir tarihinden itibaren iki yılla sınırlı olması", puan: 20, madde: "TBK m. 428"}
      - {tespit: "İhtimal 1'de 15 Mart ibranamesinin bir aylık süre ve noksansız ödeme şartı nedeniyle kesin hükümsüzlüğü", puan: 25, madde: "TBK m. 420"}
      - {tespit: "Banka aracılığıyla ödenen 100.000 TL için belgelerin makbuz hükmünde olması", puan: 20, madde: "TBK m. 420"}
      - {tespit: "İhtimal 2'de 10 Nisan ibranamesinin dört şartı taşıması nedeniyle geçerliliği", puan: 20, madde: "TBK m. 420"}
    cozum: |
      **Nitelendirme:** Olay, hizmet sözleşmesinin işyeri devri nedeniyle devralana geçmesini (TBK m. 428) ve işçinin ibra sözleşmesinin geçerliliğini (TBK m. 420) birlikte içerir. Fabrikanın tamamı hukuki işlemle devredildiği için sözleşmenin devri değil, işyerinin devri söz konusudur; İK m. 6 da aynı yönde kural koyar.

      **Hukuki sorunlar:** (1) Devir sonrası sözleşme ve sorumluluk. (2) 15 Mart tarihli ibraname ve makbuzun hükmü. (3) 10 Nisan tarihli ibranamenin geçerliliği.

      **İlgili hükümler:** TBK m. 428/1-3 (işyeri devri); İK m. 6; TBK m. 420/2-3 (ibra ve makbuz hükmü).

      **Değerlendirme:** TBK m. 428/1'e göre devir tarihinde işyerinde mevcut hizmet sözleşmeleri bütün hak ve borçlarıyla devralana geçer. Burak'ın sözleşmesi Y A.Ş.'ye geçmiştir; işçinin hizmet süresine bağlı haklarında X A.Ş. yanında işe başladığı tarih esas alınır (TBK m. 428/2). Devirden önce doğmuş ve devir tarihinde ödenmesi gereken 30.000 TL fazla çalışma ücreti bakımından devreden X A.Ş. ve devralan Y A.Ş. müteselsilen sorumludur; X A.Ş.'nin sorumluluğu devir tarihinden itibaren iki yıl ile sınırlıdır (TBK m. 428/3).

      İhtimal 1'de 15 Mart ibranamesinde ibra tarihi, sözleşmenin sona erdiği 1 Mart'tan başlayarak bir aylık süreyi doldurmamıştır; ayrıca ödeme hak tutarına göre noksandır (140.000 TL'ye karşılık 100.000 TL). TBK m. 420/2 bu şartları birlikte aradığından ibraname kesin olarak hükümsüzdür; Burak bu belgeyle alacaklarından vazgeçmiş sayılmaz. Ancak TBK m. 420/3'e göre hakkın gerçek tutarda ödendiğini içermeyen ibra belgeleri, içerdikleri miktarla sınırlı olarak makbuz hükmündedir ve bu hâlde de ödemenin banka aracılığıyla yapılması şarttır. 100.000 TL bankadan ödendiğinden belgeler bu miktar için makbuz hükmündedir; Burak'ın kalan alacağı 40.000 TL olarak devam eder.

      İhtimal 2'deki 10 Nisan ibranamesi sözleşmenin sona ermesinden en az bir ay sonra yapılmış, yazılıdır, alacağın türünü ve miktarını açıkça belirtmekte, ödeme hak tutarına göre noksansız (140.000 TL) ve banka aracılığıyla yapılmıştır. TBK m. 420/2'nin dört şartı gerçekleştiği için ibraname geçerlidir.

      **Sonuç:** Sözleşme Y A.Ş.'ye geçmiştir; 30.000 TL'den X A.Ş. (devir tarihinden itibaren iki yıl) ve Y A.Ş. müteselsilen sorumludur. İhtimal 1'de 15 Mart tarihli ibraname kesin hükümsüzdür, belgeler yalnızca bankadan ödenen 100.000 TL için makbuz hükmündedir. İhtimal 2'deki 10 Nisan tarihli ibraname geçerlidir.

kartlar:
  - on: "Hizmet sözleşmesinin tanımı ve unsurları?"
    arka: "İşçi bağımlı olarak iş görmeyi, işveren zamana veya yapılan işe göre ücret ödemeyi üstlenir (TBK m. 393/1). Unsurlar: iş görme, ücret, zaman, bağımlılık."
  - on: "Hizmet sözleşmesi hangi şekle tabidir?"
    arka: "Kanunda aksi yoksa şekil serbesttir (TBK m. 394/1)."
  - on: "Geçersizliği sonradan anlaşılan hizmet sözleşmesinin sonucu?"
    arka: "İlişki ortadan kaldırılıncaya kadar geçerli sözleşmenin bütün hüküm ve sonuçlarını doğurur (TBK m. 394/3)."
  - on: "Sözleşme sürerken işçi rakip için çalışabilir mi?"
    arka: "Hayır; ücret karşılığı üçüncü kişiye hizmette bulunamaz ve işvereniyle rekabete girişemez. Bu borç doğrudan kanundandır (TBK m. 396/3)."
  - on: "Sır saklama borcu sözleşme bitince söner mi?"
    arka: "Hayır; işverenin haklı menfaati gerektirdiği ölçüde sürer (TBK m. 396/4)."
  - on: "Sözleşmede ücret yoksa ne ödenir?"
    arka: "Asgari ücretten az olmamak üzere emsal ücret (TBK m. 401)."
  - on: "Fazla çalışma ücreti ve alternatifi?"
    arka: "Normal ücretin en az %50 fazlası; işçinin rızasıyla orantılı izin (TBK m. 402)."
  - on: "Ücret ne zaman ödenir?"
    arka: "Aksine âdet yoksa her ayın sonunda (TBK m. 406)."
  - on: "İşveren ücreti hangi hâllerde takas edebilir?"
    arka: "İşçinin rızası varsa; ya da kasten sebebiyet verdiği, yargı kararıyla sabit zarardan doğan alacak için haczedilebilir kısım kadar (TBK m. 407/2)."
  - on: "İşverenin kabulde temerrüdünün ücret sonucu?"
    arka: "Ücret ödenir, edim sonradan istenemez; tasarruf edilen giderler ve başka iş kazançları indirilir (TBK m. 408)."
  - on: "Ücret üzerinde haciz, devir ve rehin sınırı?"
    arka: "Dörtte birinden fazlası haczedilemez, devredilemez, rehnedilemez; gelecekteki ücretin devri ve rehni geçersizdir (TBK m. 410)."
  - on: "İşveren işçinin kişiliğini korumak için neyi yapmalıdır?"
    arka: "Saygı göstermeli, dürüst düzen sağlamalı, psikolojik ve cinsel tacizi önlemeli, İSG önlemlerini almalıdır (TBK m. 417/1-2). Zararlar sözleşmeye aykırılık hükümlerine tabidir (TBK m. 417/3)."
  - on: "Hizmet sözleşmesinde ceza koşulu ne zaman geçersizdir?"
    arka: "Yalnızca işçi aleyhine konulmuşsa (TBK m. 420/1)."
  - on: "İbranın geçerlilik şartları?"
    arka: "Yazılı; fesihten en az bir ay sonra; tür ve miktar belirli; ödeme noksansız ve banka aracılığıyla. Eksikse kesin hükümsüz (TBK m. 420/2)."
  - on: "İşyeri devri ile sözleşme devri farkı?"
    arka: "İşyeri devrinde sözleşmeler kanun gereği devralana geçer, devreden iki yıl müteselsil sorumludur (TBK m. 428). Sözleşme devri işçinin yazılı rızasıyla olur (TBK m. 429)."
