    tanim: "Bakılmayı isteme hakkı olan ve malvarlığını devretmeyi üstlenen taraf (TBK m. 611/1)."
  - terim: Aile topluluğu
    tanim: "Bakım alacaklısının sözleşmeyle katıldığı bakım borçlusunun yaşam birliği (TBK m. 614/1)."
  - terim: Miras sözleşmesi şekli
    tanim: "Resmî vasiyetname şekli: resmî memur ve iki tanık önünde imza (TMK m. 545)."
  - terim: Satıcı gibi yasal ipotek
    tanim: "Bakım alacaklısına devrettiği taşınmaz üzerinde tanınan, mülkiyetin naklini izleyen üç ay içinde tescil edilmesi gereken yasal ipotek (TBK m. 613 ve TMK m. 894)."
  - terim: Denkleştirme
    tanim: "Fesihte ifa edilmiş edimlerin anapara ve faiziyle değerlendirilip alacaklı çıkan tarafa geri verilmesi (TBK m. 616/2)."

kararlar:
  - id: "903249700"
    ozet: |
      Mirasbırakan, ölümünden 27 gün önce (6 Temmuz 2010), kanser hastası olduğu bir dönemde bir bağımsız bölümünü ölünceye kadar bakma sözleşmesiyle evli olduğu eşine devretmiş ve 4 Ağustos 2010'da ölmüştür. Murisin daha önceki bir vasiyetnamesiyle tüm malvarlığını bıraktığı kardeşi (sonra mirasçısı davayı sürdürdü), ehliyetsizlik, şekle ve ahlaka aykırılık ve muris muvazaası iddialarıyla tapu iptali ve tescil istemiştir. İlk derece mahkemesi davayı reddetmiş, Bölge Adliye Mahkemesi kabul etmiş, Yargıtay 1. Hukuk Dairesinin bozmasına direnmiştir. Hukuk Genel Kurulu direnme kararını bozmuştur. Adli Tıp raporuna göre mirasbırakan sözleşme tarihinde ehliyetlidir. Kurula göre ölünceye kadar bakma sözleşmeleri süreklilik gösteren, talihe bağlı sözleşmelerdir; alacaklının sözleşmeden kısa süre sonra ölmesi, tarafların eş olması veya özel bakım ihtiyacının sonradan doğması tek başına geçersizlik, ahlaka aykırılık veya muvazaa göstermez. Dosyada devredilen taşınmazın tüm malvarlığı olmadığı, murisin kardeşleriyle ilişkisinin iyi olduğu ve eşin bakım edimini yerine getirdiği anlaşılmış, mal kaçırma amacı ispatlanamamıştır.
  - id: "1223825500"
    ozet: |
      1921 doğumlu mirasbırakan, 86 yaşındayken (22 Ocak 2007) noterde düzenlenen ölünceye kadar bakma sözleşmesiyle, tüm malvarlığını oluşturan taşınmazı (alt katta üç dükkân, üst katta iki mesken) tek oğluna devretmiştir. Mirasbırakanın beş kızı vardır. Oğul 2017'de taşınmazı bir üçüncü kişiye satmıştır. Mirasbırakan 27 Ağustos 2008'de ölmüştür. Kızı ve torunları tapu iptali ve tescil, olmazsa miras payları oranında tazminat istemiştir. İlk derece mahkemesi ve Bölge Adliye Mahkemesi davayı reddetmiştir. Yargıtay 1. Hukuk Dairesi, tüm malvarlığının tek erkek çocuğa devrinin, mirasbırakanın o dönemde bakıma bu ölçüde ihtiyacı olmaması ve diğer mirasçılara payları verilmesi gibi olgularla birlikte, mal kaçırma amaçlı muvazaa oluşturduğunu kabul etmiştir. Üçüncü kişinin kötüniyeti ispatlanamadığı için TMK m. 1023'teki iyiniyet koruması devreye girer; bu nedenle taşınmazın tapusunun iptali yerine tazminata hükmedilmesi gerektiği sonucuna varılarak karar oy birliğiyle bozulmuştur.

sorular:
  - soru: |
      Kumar ve bahisten doğan bir alacak bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Dava açılamaz ve takip yapılamaz."
      - "Dava açılabilir; yalnız icra yoluyla takip yapılamaz."
      - "Dava açılabilir, ancak ancak alacak miktarı yarıya indirilir."
      - "Yalnız tacirler arasındaki kumar borcu için dava açılabilir."
    dogru: 0
    aciklama: |
      TBK m. 604/1: kumar ve bahisten doğan alacak hakkında dava açılamaz ve takip yapılamaz. Borç eksik borç niteliğindedir. Çeldiriciler, kısmi korumanın veya tacir ayrımının var olduğu yanılgısını temsil eder.
  - soru: |
      Ali, kumarda Mehmet'e kaybettiği 60.000 TL'yi isteyerek ve baskı olmaksızın ödemiş; oyunda hile olmadığı sonradan anlaşılmıştır. Ali, ödemeyi ertesi gün geri istemektedir. Sonuç nedir?
    siklar:
      - "Ali ödemeyi geri alamaz."
      - "Ali ödemeyi her zaman geri alabilir; kumar borcu tam borç değildir."
      - "Ali ödemeyi yalnız yarısı oranında geri alabilir."
      - "Ali ödemeyi, mahkemece belirlenecek makul bir süre içinde geri alabilir."
    dogru: 0
    aciklama: |
      TBK m. 605/2'ye göre kumar ve bahis borcu için isteyerek yapılan ödemeler geri alınamaz. Geri alma yalnız oyunun beklenmedik olay veya diğer tarafın fiiliyle engellenmesi ya da hile hâlinde mümkündür. Olayda bu istisnalar yoktur. Yaygın yanılgı, borcun eksik olması yüzünden ödemenin de geri alınabileceğini sanmaktır.
  - soru: |
      Zeynep, kumarda Kemal'e kaybettiği 100.000 TL'yi ödemiş; sonradan Kemal'in işaretli kâğıtlarla oynadığı anlaşılmıştır. Zeynep'in ödemesi için doğru olan hangisidir?
    siklar:
      - "Diğer taraf kumara hile karıştırdığı için isteyerek yapılan ödeme geri alınabilir."
      - "Ödeme isteyerek yapıldığı için hile olsa bile geri alınamaz."
      - "Ödeme yalnız Zeynep hile olduğunu oyun sırasında fark etmişse geri alınabilir."
      - "Ödemenin geri alınması için önce Kemal'in cezai olarak mahkûm edilmesi şarttır."
    dogru: 0
    aciklama: |
      TBK m. 605/2'ye göre diğer taraf kumara hile karıştırmışsa isteyerek yapılan ödeme geri alınabilir. Hükümde hilenin oyun sırasında fark edilmesi veya cezai mahkûmiyet şartı yoktur.
  - soru: |
      Burak, kumar borcu için Cem lehine bir bono düzenlemiştir. Cem, bonoyu kumar borcu için verildiğini bilmeyen iyiniyetli Deniz'e ciro etmiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Cem bonoya dayanarak takip yapamaz; iyiniyetli hamil Deniz'in kıymetli evrak hukukundan doğan hakları saklıdır."
      - "Bono kumar borcunu tam borca dönüştürdüğü için Cem takip yapabilir."
      - "Ciro ile bono tamamen geçersiz hâle gelir; Deniz de dava açamaz."
      - "Deniz iyiniyetli olsa bile Burak'a karşı hiçbir hak elde edemez."
    dogru: 0
    aciklama: |
      TBK m. 605/1: kumar oynayanın imzaladığı adi borç veya kambiyo senedine dayanarak hiç kimse dava açamaz ve takip yapamaz; ancak kıymetli evrakın iyiniyetli üçüncü kişilere sağladığı haklar saklıdır. Bu yüzden lehtar Cem'e karşı savunma kullanılır, iyiniyetli hamil Deniz'in hakları ise korunur. Senet verilmesi borcu tam borca çevirmez.
  - soru: |
      İzin verilmemiş bir piyango veya şans oyunundan doğan alacak için hangi hüküm uygulanır?
    siklar:
      - "Kumara ilişkin hükümler uygulanır; dava açılamaz ve takip yapılamaz."
      - "Alacak tam borçtur; dava ve takip serbesttir."
      - "Alacak ancak ödeme emri yoluyla istenebilir."
      - "Alacak doğmaz, ancak ödenen bedel her durumda geri alınır."
    dogru: 0
    aciklama: |
      TBK m. 606/1 ve TBK m. 606/2'ye göre kanun veya yetkili makamlarca izin verilmemiş piyango ve diğer şans oyunlarından doğan alacaklar hakkında dava açılamaz ve takip yapılamaz; izin verilmemiş olanlara kumara ilişkin hükümler uygulanır. İzinli oyunlarda ise dava hakkı vardır.
  - soru: |
      Ömür boyu gelir sözleşmesinin geçerliliği için hangi şekil gerekir?
    siklar:
      - "Yazılı şekil."
      - "Resmî vasiyetname şeklinde miras sözleşmesi."
      - "Tapu müdürlüğünde resmî senet."
      - "Hiçbir şekil gerekmez; sözlü anlaşma yeter."
    dogru: 0
    aciklama: |
      TBK m. 608: ömür boyu gelir sözleşmesi yazılı şekilde yapılmadıkça geçerli olmaz. Miras sözleşmesi şekli, ölünceye kadar bakma sözleşmesine özgüdür (TBK m. 612). İkisini karıştırmak sık yapılan hatadır.
  - soru: |
      Zeynep, Ayşe ile yaptığı ömür boyu gelir sözleşmesi uyarınca ömrü boyunca altı ayda bir peşin gelir almaktadır; gelirin süresi Zeynep'in ömrüne bağlanmıştır. Zeynep, peşin ödenen altı aylık dönemin 15. gününde ölmüştür. Ayşe'nin borcu hakkında doğru olan hangisidir?
    siklar:
      - "Ayşe o döneme ait gelirin tamamını borçlanmış sayılır."
      - "Ayşe yalnız Zeynep'in yaşadığı 15 günlük kısmı öder."
      - "Ayşe o dönem için hiçbir şey ödemez; sözleşme ölümle geriye etkili biter."
      - "Ayşe, dönemin gelirinin yarısını öder."
    dogru: 0
    aciklama: |
      TBK m. 609/2'ye göre gelirin süresi ömrüne bağlanmış olan kişi, peşin ödeme öngörülen dönemin sona ermesinden önce ölse bile o döneme ait gelirin tamamı gelir borçlusu tarafından borçlanılmış sayılır. Gelir peşin ödenen bir dönem için doğduğundan oransal bölme yapılmaz.
  - soru: |
      Mehmet, evini yeğeni Zeynep'e devretmek ve karşılığında Zeynep'in kendisine ölünceye kadar bakmasını sağlamak üzere iki taraflı adi yazılı bir sözleşme imzalamıştır. Sözleşme noterde veya resmî memur önünde iki tanıkla yapılmamıştır. Sözleşmenin durumu nedir?
    siklar:
      - "Geçerli olmaz; ölünceye kadar bakma sözleşmesi miras sözleşmesi şeklinde yapılmalıdır."
      - "Geçerlidir; yazılı şekil ölünceye kadar bakma için yeterlidir."
      - "Yalnız taşınmaz devri bölümü geçersizdir; bakım borcu geçerli kalır."
      - "Geçerlidir; ancak yeğen olan taraf ancak tapu devrinden sonra sözleşmeyi kabul etmiş sayılır."
    dogru: 0
    aciklama: |
      TBK m. 612/1: ölünceye kadar bakma sözleşmesi, mirasçı atanmasını içermese bile, miras sözleşmesi şeklinde yapılmadıkça geçerli olmaz. Miras sözleşmesi şekli resmî memur ve iki tanık önünde düzenlemeyi gerektirir (TMK m. 545). Adi yazılı şekil yalnız Devletçe tanınmış bakım kurumu istisnasında yeter (TBK m. 612/2).
  - soru: |
      Ayşe, ölünceye kadar bakma sözleşmesiyle taşınmazını bakım borçlusu Mustafa'ya devretmiştir. Ayşe'nin devir sonrası güvencesi bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Ayşe, satıcı gibi yasal ipotek hakkına sahiptir; bu ipotek mülkiyetin naklini izleyen üç ay içinde tescil edilmiş olmalıdır."
      - "Ayşe'nin hiçbir yasal güvencesi yoktur; ancak sözleşmeyle rehin kurabilir."
      - "Ayşe, devirden sonra beş yıl içinde yasal ipotek tescil ettirebilir."
      - "Ayşe'nin yasal ipotek hakkı vardır; ancak tescil edilmesi gerekmez, kendiliğinden doğar."
    dogru: 0
    aciklama: |
      TBK m. 613: bakım borçlusuna taşınmazını devreden bakım alacaklısı, haklarını güvence altına almak için o taşınmaz üzerinde satıcı gibi yasal ipotek hakkına sahiptir. Satıcılar bakımından yasal ipoteğin mülkiyetin naklini izleyen üç ay içinde tapu kütüğüne tescil edilmiş olması gerekir (TMK m. 894).
  - soru: |
      Ölünceye kadar bakma sözleşmesinde edimler arasında önemli ölçüde oransızlık vardır ve fazla alan taraf kendisine bağışta bulunulma amacı güdüldüğünü ispat edememiştir. Diğer tarafın hakkı nedir?
    siklar:
      - "Altı ay önce bildirimde bulunmak koşuluyla sözleşmeyi her zaman feshedebilir."
      - "Sözleşmeyi hiçbir önel vermeden, aynı gün feshedebilir."
      - "Sözleşme kendiliğinden sona erer."
      - "Yalnız hâkimin kararıyla ve ancak iki yıl sonra fesih mümkündür."
    dogru: 0
    aciklama: |
      TBK m. 616: edimler arasında önemli ölçüde oransızlık bulunur ve fazla alan taraf bağışta bulunulma amacı güdüldüğünü ispat edemezse diğer taraf altı ay önce bildirimde bulunmak koşuluyla sözleşmeyi her zaman feshedebilir. Önelsiz fesih ise TBK m. 617'deki çekilmezlik ve önemli sebep hâllerine aittir.
  - soru: |
      Mehmet, ölünceye kadar bakma sözleşmesi uyarınca bakım borçlusu Zeynep'e evini devretmiş, ancak Zeynep Mehmet'e gıda ve tedavi sağlamamış, ortak yaşam çekilmez hâle gelmiştir. Mehmet önel vermeden fesih davası açmıştır. Hâkimin yetkisi bakımından hangisi doğrudur?
    siklar:
      - "Hâkim, aile topluluğu içinde yaşamalarına son vererek, taraflardan birinin isteğiyle veya kendiliğinden bakım alacaklısına ömür boyu gelir bağlayabilir."
      - "Hâkim yalnız feshi onaylayabilir; ömür boyu gelir bağlayamaz."
      - "Hâkim ömür boyu geliri ancak iki tarafın ortak isteğiyle bağlayabilir."
      - "Hâkim, bakım borçlusunun ölümünden önce sözleşmeyi hiçbir hâlde sona erdiremez."
    dogru: 0
    aciklama: |
      TBK m. 617/2: hâkim, sözleşmenin önel verilmeksizin feshini yerinde bulabileceği gibi, taraflardan birinin istemiyle veya kendiliğinden, aile topluluğu içinde yaşamalarına son vererek bakım alacaklısına ömür boyu gelir bağlayabilir. Hâkimin bu yetkisi için tarafların ortak isteği aranmaz.
  - soru: |
      Bakım borçlusunun ölümü hâlinde ölünceye kadar bakma sözleşmesinde bakım alacaklısı için hangi hüküm uygulanır?
    siklar:
      - "Bakım alacaklısı bir yıl içinde sözleşmenin feshini isteyebilir."
      - "Sözleşme kendiliğinden ve geriye etkili olarak sona erer."
      - "Bakım alacaklısı altı ay içinde fesih isteyebilir."
      - "Bakım alacaklısı, mirasçılardan bakım sürdürmelerini her hâlde isteyebilir; fesih hakkı yoktur."
    dogru: 0
    aciklama: |
      TBK m. 618: bakım borçlusu ölürse bakım alacaklısı bir yıl içinde sözleşmenin feshini isteyebilir. Sözleşme kendiliğinden sona ermez; fesih alacaklının tercihine bağlıdır. Altı ay, TBK m. 616'daki önelli fesih bildirimi süresidir.

olaylar:
  - olay: |
      Ali, arkadaşı Mehmet ile para karşılığı iskambil oynamıştır. Ali bir gecede **300.000 TL** kaybetmiştir. Kaybının **100.000 TL**'sini nakden hemen ödemiştir. Kalan **200.000 TL** için Mehmet lehine bir bono düzenleyip imzalamıştır. Oyun sırasında Ali'nin parası bitince Mehmet, oynamaya devam etmesi için ona **50.000 TL borç para** vermiştir; Ali bunu iade etmemiştir.

      Mehmet bonoyu, kumar borcu için verildiğini bilmeyen iyiniyetli Cemal'e ciro etmiştir. Daha sonra Mehmet'in oyun sırasında işaretli kâğıt kullandığı anlaşılmıştır. Hem Mehmet hem Cemal Ali'den ödeme istemektedir.

      1. Ali'nin kumar borcunun hukuki niteliği nedir? Mehmet'in 50.000 TL ödünç alacağı bakımından durum nedir?
      2. Mehmet bonoya dayanarak Ali'ye karşı takip yapabilir mi?
      3. Cemal'in durumu nedir?
      4. Ali, nakden ödediği 100.000 TL'yi geri isteyebilir mi?
    olcut:
      - {tespit: "Kumar borcu için dava ve takip yapılamaz; borç eksik borçtur", puan: 20, madde: "TBK m. 604"}
      - {tespit: "Kumar için bilerek verilen ödünç paranın da dava ve takibe konu olamaması", puan: 15, madde: "TBK m. 604"}
      - {tespit: "Lehtar Mehmet bonoya dayanarak dava ve takip yapamaz", puan: 20, madde: "TBK m. 605"}
      - {tespit: "İyiniyetli hamil Cemal'in kıymetli evrak hukukundan doğan haklarının saklı olması", puan: 20, madde: "TBK m. 605"}
      - {tespit: "İsteyerek yapılan ödeme kural olarak geri alınmaz; Mehmet hile yaptığı için 100.000 TL geri alınabilir", puan: 25, madde: "TBK m. 605"}
    cozum: |
      **Nitelendirme:** Olay, iskambil oyununa para yatırılarak oynanan bir kumardır. Kumar sebebiyle doğan borç eksik borç niteliğindedir; bununla bağlantılı senet, ödünç ve isteyerek yapılan ödeme sorunları vardır.

      **Hukuki sorunlar:** (1) Kumar borcunun ve kumar için verilen ödüncün dava edilebilirliği. (2) Kumar borcu için verilen bononun lehtar ve iyiniyetli hamil bakımından sonucu. (3) İsteyerek yapılan ödemenin geri alınabilmesi.

      **İlgili hükümler:** TBK m. 604/1: kumardan doğan alacak hakkında dava açılamaz ve takip yapılamaz. TBK m. 604/2: kumar için bilerek verilen avans ve ödünç paralar aynı hükme tabidir. TBK m. 605/1: kumar oynayanın imzaladığı senede dayanarak dava açılamaz ve takip yapılamaz, ancak iyiniyetli üçüncü kişilerin kıymetli evrak hukukundan doğan hakları saklıdır. TBK m. 605/2: isteyerek yapılan ödeme geri alınamaz; ancak diğer taraf kumara hile karıştırmışsa geri alınabilir.

      **Değerlendirme:** Ali'nin Mehmet'e karşı 300.000 TL'lik kumar borcu eksik borçtur; bunun hiçbir parçası dava edilemez veya takip edilemez. Mehmet'in oyun sırasında bilerek verdiği 50.000 TL borç da TBK m. 604/2 nedeniyle aynı akıbettedir; borç sözleşmesi görünümü onu tam borç yapmaz. Mehmet, lehtar olarak bonoya dayanıp 200.000 TL için Ali'ye takip yapamaz, çünkü senet kumar alacağını güçlendirmez (TBK m. 605/1). Bonoyu kumar borcu olduğunu bilmeden ciro yoluyla edinen Cemal ise iyiniyetli hamildir; kıymetli evrak hukukundan doğan hakları saklı olduğundan Ali, kumar savunmasını Cemal'e karşı kullanamaz. Nakden ödenen 100.000 TL isteyerek yapılmıştır ve kural olarak geri alınamaz. Ancak Mehmet oyuna hile karıştırdığından, TBK m. 605/2'nin istisnası uygulanır ve Ali bu ödemeyi geri isteyebilir.

      **Sonuç:** Ali'nin borcu ve ödüncü dava ve takip edilemez; Mehmet bonoyla takip yapamaz. İyiniyetli hamil Cemal'in hakları saklıdır. Hile nedeniyle Ali, isteyerek ödediği 100.000 TL'yi geri alabilir.
  - olay: |
      Mehmet (74, dul), İstanbul'daki dairesini, kendisine ölünceye kadar bakılması karşılığında yeğeni Zeynep'e devretmeyi kararlaştırmıştır. Taraflar önce aralarında **adi yazılı** bir sözleşme imzalamış, ancak tapu devri bu belgeyle yapılamamıştır. Bir ay sonra taraflar sözleşmeyi bir noterde, **iki tanığın** katılımıyla ve miras sözleşmesi şeklinde yeniden düzenlemiş, tapu Zeynep adına tescil edilmiştir. Mehmet, Zeynep'in evine yerleşmiştir.

      Tapu devrinden iki ay sonra Mehmet, güvence için yasal ipotek tescili talebiyle tapu müdürlüğüne başvurmuştur. İki yıl sonra Zeynep, Mehmet'e gıda ve uygun bir oda sağlamamış, hastalığında tedavi ettirmemiş; Mehmet'e sürekli hakaret edilmesi ortak yaşamı çekilmez hâle getirmiştir. Mehmet, bakım alacağını borçlu olduğu Kemal'e devretmek istemiştir. Mehmet bu arada sözleşmeyi önel vermeden feshetmiş ve daireyi geri istemiştir.

      1. İlk imzalanan adi yazılı sözleşme geçerli midir? Sonradan noterde yapılan sözleşmenin şekli bakımından durum nedir?
      2. Mehmet'in yasal ipotek talebi yerinde midir?
      3. Mehmet'in önelsiz fesih hakkı ve sonuçları nelerdir? Hâkim ne yapabilir?
      4. Mehmet bakım alacağını Kemal'e devredebilir mi?
    olcut:
      - {tespit: "Nitelendirme: ölünceye kadar bakma sözleşmesi (bakım ve malvarlığı devri karşılıklı borç)", puan: 10, madde: "TBK m. 611"}
      - {tespit: "Adi yazılı belge geçersiz; miras sözleşmesi şekli (resmî memur ve iki tanık) şarttır; noterdeki sözleşme geçerli", puan: 25, madde: "TBK m. 612"}
      - {tespit: "Taşınmaz devreden alacaklının satıcı gibi yasal ipotek hakkı; üç ay içinde başvurulduğundan yerinde", puan: 15, madde: "TBK m. 613"}
      - {tespit: "Borçlara aykırılık sebebiyle devam çekilmez hâle gelince önelsiz fesih; kusurlu taraf aldığını geri verir ve tazminat öder", puan: 25, madde: "TBK m. 617"}
      - {tespit: "Hâkimin aile topluluğuna son vererek istemle veya kendiliğinden ömür boyu gelir bağlayabilmesi", puan: 15, madde: "TBK m. 617"}
      - {tespit: "Bakım alacaklısı hakkını başkasına devredemez", puan: 10, madde: "TBK m. 619"}
    cozum: |
      **Nitelendirme:** Taraflar arasında bakım borçlusunun bakıp gözetmeyi, bakım alacaklısının taşınmaz devretmeyi üstlendiği, ivazlı bir ölünceye kadar bakma sözleşmesi vardır (TBK m. 611/1).

      **Hukuki sorunlar:** (1) Sözleşmenin şekli. (2) Devir sonrası güvence. (3) Bakım borcuna aykırılık ve fesih. (4) Bakım alacağının devri.

      **İlgili hükümler:** TBK m. 612/1 miras sözleşmesi şeklini arar; bu da resmî vasiyetname şeklinde düzenlemeyi gerektirir (TMK m. 545 ve TMK m. 532). TBK m. 613 satıcı gibi yasal ipotek tanır; tescil mülkiyetin naklini izleyen üç ay içinde yapılmalıdır (TMK m. 894). TBK m. 614/2 bakım borcunun içeriğini (gıda, konut, tedavi) belirler. TBK m. 617 önelsiz feshi ve hâkimin ömür boyu gelir bağlama yetkisini düzenler. TBK m. 619/1 bakım alacağının devrini yasaklar.

      **Değerlendirme:** Önce imzalanan adi yazılı belge, ölünceye kadar bakma sözleşmesi için aranan şekle uymadığından geçerli değildir. Noterde iki tanık huzurunda, miras sözleşmesi şeklinde yapılan sözleşme ise şekil şartını yerine getirir ve geçerlidir. Taşınmaz devreden Mehmet satıcı gibi yasal ipotek hakkına sahiptir; tapu devrinden iki ay sonra yapılan başvuru üç aylık süre içindedir, bu nedenle yerindedir. Zeynep'in gıda ve konut sağlamaması, tedavi ettirmemesi TBK m. 614/2 yükümlerinin ihlalidir; hakaretlerle birlikte devam çekilmez hâle geldiğinden Mehmet TBK m. 617/1 uyarınca sözleşmeyi önel vermeden feshedebilir. Kusurlu Zeynep aldığını (daireyi) geri vermek ve kusursuz Mehmet'in uğradığı zarara karşılık uygun tazminat ödemekle yükümlüdür. İadenin tapu iptal–tescil ile mi şahsi alacak olarak mı isteneceği tartışmalıdır; olayın çözümü bu tartışmaya dayanmaz. Hâkim, feshi yerinde bulabileceği gibi, aile topluluğunda yaşamaya son vererek Mehmet'e, istem olmasa bile ömür boyu gelir bağlayabilir (TBK m. 617/2). Son olarak bakım alacağı kişiye sıkı sıkıya bağlıdır; TBK m. 619/1 uyarınca Mehmet bunu Kemal'e devredemez.

      **Sonuç:** İlk adi belge geçersizdir, noterdeki sözleşme geçerlidir. Yasal ipotek talebi yerindedir. Mehmet sözleşmeyi önelsiz feshedebilir; Zeynep daireyi geri verir ve tazminat öder, hâkim gerekirse ömür boyu gelir bağlayabilir. Bakım alacağı devredilemez.

kartlar:
  - on: "Kumar ve bahis alacağı dava edilebilir mi?"
    arka: "Hayır. Dava açılamaz ve takip yapılamaz; eksik borçtur (TBK m. 604/1)."
  - on: "Kumar için bilerek verilen ödünç para dava edilebilir mi?"
    arka: "Hayır. Bilerek verilen avans ve ödünç paralar da aynı hükme tabidir (TBK m. 604/2)."
  - on: "Kumar borcunu isteyerek ödeyen geri alabilir mi?"
    arka: "Kural olarak hayır. Yalnız beklenmedik olay, karşı tarafın fiili veya hile hâlinde geri alınır (TBK m. 605/2)."
  - on: "Kumar borcu için verilen senet kime karşı geçerlidir?"
    arka: "Lehtara karşı dava ve takip yapılamaz. İyiniyetle edinen üçüncü kişinin kıymetli evrak hukukundan doğan hakları saklıdır (TBK m. 605/1)."
  - on: "İzinsiz piyango ve şans oyunlarına hangi hüküm uygulanır?"
    arka: "Kumara ilişkin hükümler: dava açılamaz ve takip yapılamaz (TBK m. 606)."
  - on: "Ömür boyu gelir sözleşmesinin şekli nedir?"
    arka: "Yazılı şekil (TBK m. 608)."
  - on: "Ömür boyu gelir kural olarak ne zaman ödenir?"
    arka: "Her altı ayda bir ve peşin. Peşin dönemde ömrü ölçü kişi ölse bile dönemin geliri tamamen borçlanılmış sayılır (TBK m. 609)."
  - on: "Ömür boyu gelir alacağı devredilebilir mi?"
    arka: "Evet, sözleşmeyle aksi kararlaştırılmadıkça (TBK m. 610). Ölünceye kadar bakma alacağı ise devredilemez (TBK m. 619/1)."
  - on: "Ölünceye kadar bakma sözleşmesinin şekli nedir?"
    arka: "Miras sözleşmesi şekli (resmî memur ve iki tanık). Devletçe tanınmış bakım kurumu ile yazılı şekil yeter (TBK m. 612)."
  - on: "Taşınmaz devreden bakım alacaklısının güvencesi nedir?"
    arka: "Satıcı gibi yasal ipotek hakkı; mülkiyetin naklini izleyen üç ay içinde tescil gerekir (TBK m. 613 ve TMK m. 894)."
  - on: "Ölünceye kadar bakmada önel verilerek ve önelsiz fesih ne zaman olur?"
    arka: "Önemli oransızlıkta, bağış amacı ispatlanamazsa 6 ay önceden bildirimle (TBK m. 616). Devam çekilmezse önel vermeden (TBK m. 617)."
  - on: "Bakım borçlusu ölürse ne olur?"
    arka: "Bakım alacaklısı bir yıl içinde sözleşmenin feshini isteyebilir (TBK m. 618)."
