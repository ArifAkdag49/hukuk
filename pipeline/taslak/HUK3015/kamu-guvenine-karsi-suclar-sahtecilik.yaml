    tanim: "Kamu görevlisinin görevi gereği düzenlemediği belge; sahtecilikte kullanma unsuru gerekir (TCK m. 207)."
  - terim: Açığa imza
    tanim: "İmzalı ve kısmen veya tamamen boş kâğıt; kötüye kullanımı TCK m. 209'da düzenlenir."
  - terim: Kambiyo senedi
    tanim: "Poliçe, bono, çek gibi emre veya hamile yazılı senetler; TTK şekil şartlarını taşırsa TCK m. 210/1 ile resmî belge hükmünde sayılır."
  - terim: Gerçek içtima
    tanim: "Birden fazla fiil veya suç için ayrı ayrı cezaya hükmedilmesi; TCK m. 212'de sahtecilik ve diğer suç böyle ele alınır."
kararlar:
  - id: "1228350200"
    ozet: |
      Sanığın bir otobüste, el çantasında sahte Türk lirası ve Amerikan doları ele geçirildi; mahkeme eylemi TCK m. 197/1 kapsamında parada sahtecilik saydı. Yargıtay 8. Ceza Dairesi daha önce sanığın birden çok dosyada yargılandığını görerek, mükerrer cezalandırmayı önlemek için suç ve iddianame tarihlerine göre hukukî ve fiilî kesinti bulunup bulunmadığının araştırılmasını istemiş ve hükmü bozmuştu. Bozma sonrası verilen hüküm temyizde incelendi. Daire, paraların aldatma yeteneği taşıdığını kabul etti ve 04.02.2018 ile 15.03.2018 tarihli suçlar arasında fiilî kesinti bulunduğunu, bu nedenle bunların ayrı suçlar olup arada mahsup yapılamayacağını belirtti. Başka dosyadan mahsup edilen cezaların hükme yanlış yazılması ise hesap hatası olarak değerlendirildi. Daire, bu noktaları eleştirerek hükmü onadı. Karar, muhafaza fiilinde kesintinin suç sayısını belirlediğini gösterir.
  - id: "1086638000"
    ozet: |
      Sanık, sahte olduğu kriminal raporla anlaşılan 22.000 liralık bir çeki taşınmaz karşılığında şikâyetçilere vermişti. Ağır Ceza Mahkemesi önce eylemi TCK m. 204/1 ve TCK m. 210 üzerinden resmî belgede sahtecilik saymıştı. Yargıtay (Kapatılan) 15. Ceza Dairesi, kambiyo senedindeki sahteciliğin resmî belgede sahtecilik sayılabilmesi için senedin Türk Ticaret Kanunu'ndaki bütün unsurları taşıması gerektiğini, çekin özel belge niteliğinde bulunduğunu belirterek hükmü bozmuştu. Bozma sonrası mahkeme TCK m. 207/1'e göre özel belgede sahtecilikten mahkûmiyet kurdu. Çek aslı duruşmaya getirtilmiş, hâkim tarafından incelenmiş ve aldatıcı niteliğinin bulunduğu tutanağa geçirilmişti. Yargıtay 11. Ceza Dairesi hükmü oybirliğiyle onadı. Karar, şekil unsurları eksik senet ve aldatma yeteneğinin hâkimce incelenmesi bakımından öğreticidir.
sorular:
  - soru: |
      TCK m. 197/1'e göre sahte para üreten kişiye öngörülen hapis cezası hangisidir?
    siklar:
      - "Bir yıldan üç yıla kadar"
      - "İki yıldan oniki yıla kadar"
      - "Üç aydan bir yıla kadar"
      - "Beş yıldan on yıla kadar"
    dogru: 1
    aciklama: |
      TCK m. 197/1 sahte para üreten, ülkeye sokan, nakleden, muhafaza eden veya tedavüle koyan kişiyi iki yıldan oniki yıla kadar hapis ve onbin güne kadar adlî para cezasıyla cezalandırır. Bir yıldan üç yıla kadar ceza TCK m. 197/2'ye, üç aydan bir yıla kadar ceza TCK m. 197/3'e aittir.
  - soru: |
      Seda, pazarda para üstü olarak aldığı 200 liralık banknotun sahte olduğunu evde fark etmiş, ertesi gün bunu bir büfede harcamıştır. Seda'nın eylemi hangi hükme girer?
    siklar:
      - "TCK m. 197/1: sahte parayı tedavüle koyma"
      - "TCK m. 197/2: sahte parayı bilerek kabul etme"
      - "TCK m. 197/3: sahteliğini bilmeden kabul ettiği parayı bilerek tedavüle koyma"
      - "Eylem suç değildir"
    dogru: 2
    aciklama: |
      TCK m. 197/3, sahteliğini bilmeden kabul ettiği parayı bu niteliğini bilerek tedavüle koyan kişiyi üç aydan bir yıla kadar hapisle cezalandırır. Seda parayı iyiniyetle kabul etmiş, sonradan öğrenip bilerek kullanmıştır. TCK m. 197/2 ise parayı sahte olduğunu bilerek kabul eden kişi içindir.
  - soru: |
      Aşağıdakilerden hangisi TCK m. 198 uyarınca para hükmündedir?
    siklar:
      - "Bilezik ve kolye gibi takı altınları"
      - "Tedavülden kalkmış eski banknotlar"
      - "Milli ziynet altınları"
      - "Özel bir şirketin düzenlediği ödeme sözü"
    dogru: 2
    aciklama: |
      TCK m. 198 devletçe ihraç edilmiş hamiline yazılı bonolar, hisse senetleri, tahviller, kuponlar ve kanunen tedavül eden senet ve evrakla birlikte milli ziynet altınlarını para hükmünde sayar. Takı altınları ve tedavülden kalkmış paralar sayılan değerler arasında yer almaz.
  - soru: |
      Sahte para üretimine katılan Mert, sahte paraları henüz tedavüle koymadan ve resmî makamlar haber almadan önce ortaklarını ve paraların saklandığı yeri merciine bildirmiş, bu bilgi ortakların yakalanmasını ve paraların ele geçirilmesini sağlamıştır. Mert'in durumu nedir?
    siklar:
      - "Cezası dörtte birden yarısına kadar indirilir"
      - "Cezası yarı oranında artırılır"
      - "Hakkında cezaya hükmolunmaz"
      - "Etkin pişmanlık yalnız kıymetli damgada uygulanır"
    dogru: 2
    aciklama: |
      TCK m. 201/1'e göre sahte para üreten kişi, bunları tedavüle koymadan ve resmî makamlar tarafından haber alınmadan önce suç ortaklarını ve yerleri bildirir, bu bilgi ortakların yakalanmasını ve paraların ele geçirilmesini sağlarsa hakkında cezaya hükmolunmaz. Hüküm para ve kıymetli damga için geçerlidir.
  - soru: |
      Cem, başkasının imzasını taklit ederek bir özel belge düzenlemiş, ancak belgeyi hiç kullanmamış, çekmecesinde saklamıştır. Cem'in durumu hangisidir?
    siklar:
      - "TCK m. 207/1'e göre suç tamamlanmıştır, kullanma aranmaz."
      - "TCK m. 207/1'de kullanma da gerektiğinden suç tamamlanmamıştır."
      - "Eylem TCK m. 204/1'den cezalandırılır."
      - "Eylem TCK m. 205'e girer."
    dogru: 1
    aciklama: |
      TCK m. 207/1 özel belgeyi sahte olarak düzenleyen veya değiştiren "ve kullanan" kişiyi cezalandırır; kullanma birleşik bir unsurdur. Yalnızca düzenlenip kullanılmayan özel belgede suç tamamlanmaz. TCK m. 204 ise resmî belge içindir ve hareketler "veya" bağlacıyla sayılmıştır.
  - soru: |
      Nüfus memuru Hasan, görevi gereği düzenlediği resmî tutanağı kendi imzasıyla düzenlemiş, ancak içeriğini gerçeğe aykırı yazmıştır. Hasan'ın eylemi hangi hükme girer?
    siklar:
      - "TCK m. 206: yalan beyan"
      - "TCK m. 204/2: kamu görevlisinin gerçeğe aykırı belge düzenlemesi"
      - "TCK m. 207/1: özel belgede sahtecilik"
      - "TCK m. 208: özel belgeyi bozma"
    dogru: 1
    aciklama: |
      TCK m. 204/2, görevi gereği düzenlemeye yetkili olduğu belgeyi gerçeğe aykırı olarak düzenleyen kamu görevlisini üç yıldan sekiz yıla kadar hapisle cezalandırır; burada fikrî sahtecilik açıkça düzenlenmiştir. TCK m. 206 ise kamu görevlisine yalan beyanda bulunan kişi içindir.
  - soru: |
      TCK m. 204/3'e göre kanun hükmü gereği sahteliği sabit oluncaya kadar geçerli olan resmî belgede sahtecilik yapılırsa ne olur?
    siklar:
      - "Ceza iki katına çıkar"
      - "Ceza yarısı oranında artırılır"
      - "Ceza dörtte bir oranında artırılır"
      - "Ceza yarı oranında indirilir"
    dogru: 1
    aciklama: |
      TCK m. 204/3, resmî belgenin kanun hükmü gereği sahteliği sabit oluncaya kadar geçerli olan belge niteliğinde olması hâlinde verilecek cezanın yarısı oranında artırılacağını söyler. İndirim ise TCK m. 211'deki alacak veya gerçek durum amacına bağlıdır.
  - soru: |
      Tamirci Kaan'a araç tamir bedeli olarak 10.000 lira yazması için imzalı boş senet verilmiş; Kaan 100.000 lira yazmıştır. Kaan'ın durumu hakkında hangisi doğrudur?
    siklar:
      - "TCK m. 209/1 uygulanır, şikâyet üzerine üç aydan bir yıla kadar hapis verilir."
      - "TCK m. 209/2 uygulanır, belgede sahtecilik hükümleri geçerlidir."
      - "TCK m. 205 uygulanır."
      - "Eylem suç değildir, çünkü senet rızayla verilmiştir."
    dogru: 0
    aciklama: |
      TCK m. 209/1, belirli bir tarzda doldurulmak üzere kendisine teslim olunan imzalı boş kâğıdı verilme nedeninden farklı dolduran kişiyi şikâyet üzerine üç aydan bir yıla kadar hapisle cezalandırır. Boş kâğıt rızayla teslim edilmiştir. TCK m. 209/2 ise kâğıdın hukuka aykırı biçimde ele geçirildiği hâlleri kapsar.
  - soru: |
      İşçi Ece, patronunun çekmecesinden imzalı boş bir kâğıdı izinsiz alıp üzerine senet metni yazarak kullanmıştır. Ece'nin durumu hangisidir?
    siklar:
      - "TCK m. 209/1'e göre yalnız şikâyet üzerine cezalandırılır."
      - "Belgede sahtecilik hükümlerine göre cezalandırılır."
      - "TCK m. 211 ile cezası yarı oranında indirilir."
      - "Eylem cezasız kalır."
    dogru: 1
    aciklama: |
      TCK m. 209/2'ye göre imzalı boş kâğıdı hukuka aykırı olarak ele geçirip veya elde bulundurup hukuki sonuç doğuracak şekilde dolduran kişi belgede sahtecilik hükümlerine göre cezalandırılır. Kâğıt Ece'ye teslim edilmediğinden TCK m. 209/1'in şikâyet şartı burada aranmaz.
  - soru: |
      Alacaklı Murat, tarih yazmayı unuttuğu ve borçlunun imzasını taklit ettiği emre yazılı bonoyu icra takibine koymuştur. Yargıtay'ın kambiyo senetleri hakkındaki yaklaşımına göre bu eylem nasıl nitelenir?
    siklar:
      - "TCK m. 210/1 gereği resmî belgede sahtecilik"
      - "Zorunlu şekil unsuru eksik olduğundan özel belgede sahtecilik"
      - "TCK m. 205 kapsamında belgeyi bozma"
      - "Suç oluşmaz, çünkü bono geçersizdir"
    dogru: 1
    aciklama: |
      TCK m. 210/1 emre veya hamile yazılı kambiyo senedini resmî belge hükmüne sokar. Yargıtay'a göre bunun için senedin Türk Ticaret Kanunu'ndaki zorunlu şekil unsurlarını taşıması gerekir; eksik olan senet özel belge niteliğinde kalır ve kullanıldığında TCK m. 207/1 oluşur. Gerçek bir alacak amacıyla işlendiğinden TCK m. 211 indirimi ayrıca değerlendirilir.
  - soru: |
      Gerçek bir hukuki ilişkiye dayanan alacağını ispat amacıyla belgede sahtecilik yapan kişiye TCK m. 211 uyarınca ne olur?
    siklar:
      - "Hiç ceza verilmez"
      - "Verilecek ceza yarısı oranında indirilir"
      - "Verilecek ceza dörtte biri oranında indirilir"
      - "Ceza iki katına çıkarılır"
    dogru: 1
    aciklama: |
      TCK m. 211'e göre bir hukuki ilişkiye dayanan alacağın ispatı veya gerçek bir durumun belgelenmesi amacıyla belgede sahtecilik suçunun işlenmesi hâlinde verilecek ceza yarısı oranında indirilir; tam cezasızlık söz konusu değildir.
  - soru: |
      Veli, sahte bir özel belgeyi kullanarak Kemal'i dolandırmıştır. TCK m. 212'ye göre sonuç hangisidir?
    siklar:
      - "Yalnız dolandırıcılıktan ceza verilir, sahtecilik bunun içinde kalır."
      - "Yalnız sahtecilikten ceza verilir."
      - "Hem sahtecilikten hem dolandırıcılıktan ayrı ayrı cezaya hükmolunur."
      - "Fikrî içtima uygulanır ve en ağır suçun cezası verilir."
    dogru: 2
    aciklama: |
      TCK m. 212, sahte resmî veya özel belgenin bir başka suçun işlenmesi sırasında kullanılması hâlinde hem sahtecilik hem de ilgili suçtan dolayı ayrı ayrı cezaya hükmolunacağını söyler. Dolandırıcılık TCK m. 157 ve devamında düzenlenmiştir.
olaylar:
  - olay: |
      Alacaklı Murat, borçlu Berk'e gerçekten teslim ettiği mallar karşılığında 150.000 lira alacaklıdır. Berk ödemeyince Murat, Berk adına emre yazılı bir bono düzenlemiş, Berk'in imzasını taklit etmiştir. Bonoya düzenleme tarihini yazmayı unutmuştur. Murat bu bonoyu icra takibine koymuş ve takip dosyasına sunmuştur. Yargılama sırasında mahkeme, bono aslını duruşmaya getirtmiş ve imzanın ilk bakışta anlaşılamayacak kadar ustaca taklit edildiğini tutanağa geçirmiştir. Bilirkişi de sahteliği saptamıştır.

      1. Murat'ın eylemi hangi suçu oluşturur, bonoda tarih eksikliğinin etkisi nedir?
      2. Aldatma yeteneğini kim takdir eder?
      3. Alacağın gerçek olmasının cezaya etkisi nedir?
    olcut:
      - {tespit: "Düzenleme tarihi eksik bonoda TTK zorunlu şekil unsurunun bulunmaması nedeniyle TCK m. 210/1'in uygulanmaması", puan: 25, madde: "TCK m. 210/1"}
      - {tespit: "Özel belgede sahtecilik: sahte düzenleme ve icra takibinde kullanma", puan: 25, madde: "TCK m. 207/1"}
      - {tespit: "Özel belgede kullanmanın birleşik unsur olması; düzenleme tek başına yetmez", puan: 10, madde: "TCK m. 207/1"}
      - {tespit: "Aldatma yeteneğinin hâkimce, belge aslı incelenerek takdir edilmesi", puan: 20, madde: "TCK m. 207/1"}
      - {tespit: "Gerçek alacağın ispatı amacıyla cezanın yarı oranında indirilmesi", puan: 20, madde: "TCK m. 211"}
    cozum: |
      **Nitelendirme:** Olay, imza taklidiyle sahte belge düzenlenmesi ve icra takibinde kullanılmasıdır; bono TTK şekil şartlarını taşımadığı için özel belge niteliğindedir.

      **Hukuki sorunlar:** (1) Belgenin resmî belge hükmünde sayılıp sayılmayacağı, (2) sahtekârlığın suç oluşturması için aldatma yeteneği, (3) özel belgede kullanma, (4) alacağın gerçek olmasının etkisi.

      **İlgili hükümler:** Özel belgede sahtecilik suçunun konusu emre veya hamile yazılı kambiyo senedi ise resmî belgede sahtecilik hükümleri uygulanır (TCK m. 210/1). Özel belgeyi sahte olarak düzenleyen ve kullanan kişi bir yıldan üç yıla kadar hapisle cezalandırılır (TCK m. 207/1). Bir hukuki ilişkiye dayanan alacağın ispatı amacıyla sahtecilik yapılırsa ceza yarısı oranında indirilir (TCK m. 211).

      **Değerlendirme:** TCK m. 210/1 kambiyo senedini resmî belge hükmüne sokar. Yargıtay, senedin bu hükümden yararlanabilmesi için Türk Ticaret Kanunu'ndaki zorunlu şekil unsurlarını taşımasını arar. Tarihi bulunmayan bono bu unsuru taşımadığından kambiyo senedi sayılmaz ve özel belge olarak değerlendirilir. Özel belgede suç, sahte düzenlemeye ek olarak belgenin kullanılmasıyla tamamlanır (TCK m. 207/1); Murat bonoyu icra takibine koyarak kullanmıştır. Sahtekârlığın aldatma yeteneği taşıması gerekir; bunu bilirkişi değil mahkeme takdir eder ve belge aslı duruşmaya getirilerek incelenmiştir. İmza ustaca taklit edildiğinden aldatma yeteneği vardır. Murat'ın alacağı gerçektir ve belge bu alacağın ispatı için düzenlenmiştir; bu nedenle TCK m. 211 uyarınca cezası yarı oranında indirilir.

      **Sonuç:** Murat, TCK m. 207/1'e göre özel belgede sahtecilikten sorumludur; TCK m. 210/1 uygulanmaz. Aldatma yeteneği mahkemece takdir edilir ve vardır; ceza TCK m. 211 gereği yarı oranında indirilir.
  - olay: |
      Belediye nüfus müdürlüğünde memur olan Hasan, görevi gereği düzenlemeye yetkili olduğu bir ikametgâh belgesini, yakını Kerem'in hiç oturmadığı adresi yazarak bilerek gerçeğe aykırı düzenlemiş ve Kerem'e vermiştir. Kerem belgeyi henüz hiçbir yerde kullanmamıştır. Başka bir olayda Ali, ikametgâh belgesi düzenleme yetkisi bulunan memur Nur'a, başka bir adreste oturduğunu söyleyerek yalan beyanda bulunmuş; Nur beyanı doğru sanarak belgeyi düzenlemiştir. Ayrıca stajyer Mert, kendisine karşı açılan dosyadaki gerçek bir resmî evrakı gizlice yırtıp atmıştır. Mert kamu görevlisi değildir.

      1. Hasan'ın sorumluluğu nedir, belgenin kullanılmamış olması etkili midir?
      2. Ali'nin sorumluluğu nedir (Nur'un bilgisizliği bu soruda esastır)?
      3. Mert'in sorumluluğu nedir, artırım uygulanır mı?
    olcut:
      - {tespit: "Hasan: kamu görevlisi, görevi gereği düzenlemeye yetkili olduğu belgeyi gerçeğe aykırı düzenlemiştir (fikrî sahtecilik)", puan: 30, madde: "TCK m. 204/2"}
      - {tespit: "Resmî belgede kullanma aranmaz; düzenleme anında suç tamamlanır", puan: 15, madde: "TCK m. 204/2"}
      - {tespit: "Ali: yetkili kamu görevlisine yalan beyan", puan: 25, madde: "TCK m. 206"}
      - {tespit: "Mert: gerçek resmî belgeyi yok etme", puan: 20, madde: "TCK m. 205"}
      - {tespit: "Mert kamu görevlisi olmadığından yarı oranında artırım yok", puan: 10, madde: "TCK m. 205"}
    cozum: |
      **Nitelendirme:** Olayda üç ayrı kişinin üç ayrı eylemi vardır: bir kamu görevlisinin fikrî sahteciliği, bir sivilin yalan beyanı ve gerçek resmî belgenin yok edilmesi.

      **Hukuki sorunlar:** (1) Hasan'ın eylemi sahtecilik mi, (2) kullanma şartı aranır mı, (3) Ali'nin beyanı hangi suça girer, (4) Mert'in eylemi belgeyi sahte düzenleme mi yoksa yok etme mi?

      **İlgili hükümler:** Görevi gereği düzenlemeye yetkili olduğu belgeyi gerçeğe aykırı olarak düzenleyen kamu görevlisi üç yıldan sekiz yıla kadar hapis alır (TCK m. 204/2). Resmî belgeyi düzenleme yetkisine sahip kamu görevlisine yalan beyanda bulunan kişi üç aydan iki yıla kadar hapis veya adlî para cezası alır (TCK m. 206). Gerçek bir resmî belgeyi yok eden kişi iki yıldan beş yıla kadar hapis alır; kamu görevlisi işlerse artırım uygulanır (TCK m. 205).

      **Değerlendirme:** Hasan belgeyi imzalayan ve düzenlemeye yetkili görevlidir; belge ondan çıkmıştır ama içeriği gerçeğe aykırıdır. Bu, kanunun TCK m. 204/2'de "gerçeğe aykırı olarak belge düzenleyen" ifadesiyle düzenlediği fikrî sahteciliktir. Resmî belgede düzenleme, değiştirme ve kullanma seçimlik hareketlerdir; bu nedenle belge Ali'ye verilmiş ve henüz kullanılmamış olsa da suç tamamlanmıştır. Ali ise belgeyi düzenlemeye yetkili memura yalan beyanda bulunmuştur; memur Nur beyanı doğru sanarak belgeyi düzenlediğinden Ali TCK m. 206 kapsamındadır. Mert, sahte belge üretmemiş, gerçek bir belgeyi yok etmiştir; bu nedenle TCK m. 204 değil TCK m. 205 uygulanır. Kamu görevlisi olmadığından yarı oranında artırım yoktur.

      **Sonuç:** Hasan TCK m. 204/2'den; Ali TCK m. 206'dan; Mert TCK m. 205'in artırımsız temel biçiminden sorumludur.
kartlar:
  - on: "TCK m. 197 fıkralarındaki cezalar?"
    arka: "197/1: 2-12 yıl hapis ve 10.000 güne kadar adlî para cezası. 197/2: bilerek kabul, 1-3 yıl. 197/3: bilmeden alıp bilerek tedavüle koyma, 3 ay-1 yıl."
  - on: "TCK m. 198 neyi para hükmüne sokar?"
    arka: "Hamiline yazılı devlet bonoları, hisse senetleri, tahviller, kuponlar, tedavüldeki senet ve evrak ile milli ziynet altınlarını."
  - on: "TCK m. 201'de cezasızlığın şartları?"
    arka: "Tedavüle koymamış olmak, resmî makamlarca haber alınmadan önce ortakları ve yerleri bildirmek, bilginin yakalama ve ele geçirmeyi sağlaması."
  - on: "TCK m. 204 fıkra cezaları?"
    arka: "204/1: sivil, 2-5 yıl. 204/2: kamu görevlisi, 3-8 yıl. 204/3: sahteliği sabit oluncaya kadar geçerli belgede yarı oranında artırım."
  - on: "Fikrî sahtecilik resmî belgede kime uygulanır?"
    arka: "Yalnız kamu görevlisine: görevi gereği düzenlemeye yetkili olduğu belgeyi gerçeğe aykırı düzenlemesi (TCK m. 204/2)."
  - on: "TCK m. 204 ve TCK m. 207 farkı?"
    arka: "Resmî belgede düzenleme, değiştirme veya kullanma seçimlik; özel belgede düzenleme veya değiştirme ve kullanma birleşik unsur."
  - on: "TCK m. 205 ve TCK m. 208 ne cezalandırır?"
    arka: "Gerçek resmî (205: 2-5 yıl) veya özel (208: 1-3 yıl) belgeyi bozma, yok etme, gizleme. TCK m. 205'te kamu görevlisi için yarı oranında artırım."
  - on: "TCK m. 206 nedir?"
    arka: "Resmî belgeyi düzenleme yetkisine sahip kamu görevlisine yalan beyan: 3 ay-2 yıl hapis veya adlî para cezası."
  - on: "TCK m. 209/1 ve 209/2 farkı?"
    arka: "209/1: kendisine teslim edilen imzalı boş kâğıdı farklı doldurma, şikâyetle 3 ay-1 yıl. 209/2: hukuka aykırı ele geçirip doldurma, belgede sahtecilik hükümleri."
  - on: "TCK m. 210/1 hangi belgeleri resmî belge hükmüne sokar?"
    arka: "Emre veya hamile yazılı kambiyo senedi, emtiayı temsil eden belge, hisse senedi, tahvil, vasiyetname. Kambiyo senedinde TTK şekil unsurları tam olmalıdır."
  - on: "TCK m. 211 ne diyor?"
    arka: "Hukuki ilişkiye dayanan alacağın ispatı veya gerçek durumun belgelenmesi amacıyla sahtecilikte ceza yarısı oranında indirilir."
  - on: "TCK m. 212'nin içtima kuralı?"
    arka: "Sahte belgenin başka suç sırasında kullanılmasında hem sahtecilik hem diğer suçtan ayrı ayrı ceza verilir."
