    tanim: "Dikkat ve özen yükümlülüğüne aykırılık dolayısıyla suçun kanuni tanımındaki neticenin öngörülmeyerek gerçekleştirilmesi (TCK m. 22/2)."
  - terim: Bilinçli taksir
    tanim: "Failin öngördüğü neticeyi istememesine rağmen neticenin meydana gelmesi; taksirli suçun cezası üçte birden yarısına kadar artırılır (TCK m. 22/3)."
  - terim: Kemik kırığı (taksirle yaralama)
    tanim: "TCK m. 89/2-b'de cezayı yarı oranında artıran ağır netice; kasten yaralamada TCK m. 87/3'te ayrı fıkradır."
  - terim: Özgü suç
    tanim: "Failin belirli bir niteliğe sahip olmasını arayan suç; işkencede fail kamu görevlisidir (TCK m. 94/1)."
  - terim: Kamu görevlisi
    tanim: "Kamusal faaliyetin yürütülmesine atama veya seçilme yoluyla ya da herhangi bir surette sürekli, süreli veya geçici katılan kişi (TCK m. 6/1-c)."
  - terim: İşkence
    tanim: "Kamu görevlisince bir kişiye karşı insan onuruyla bağdaşmayan, acı çekmesine, algılama veya irade yeteneğinin etkilenmesine veya aşağılanmasına yol açan davranışların gerçekleştirilmesi (TCK m. 94/1)."
  - terim: Eziyet
    tanim: "Bir kimsenin eziyet çekmesine yol açacak davranışların herkesçe gerçekleştirilmesi; TCK m. 96'da düzenlenen suç."
  - terim: Zamanaşımı işlemeyen suç
    tanim: "İşkence suçu; TCK m. 94/6 uyarınca dava zamanaşımı uygulanmaz."
  - terim: Neticesi sebebiyle ağırlaşmış işkence
    tanim: "İşkence fiillerinin sürekli zayıflama, kemik kırılması, ölüm gibi ağır neticelere yol açması (TCK m. 95)."
  - terim: Zor kullanma yetkisinin aşılması
    tanim: "Zor kullanma yetkisine sahip kamu görevlisinin görevi sırasında gereken ölçünün dışında kuvvet kullanması; kasten yaralama hükümleri uygulanır (TCK m. 256)."
kararlar:
  - id: "1230258000"
    ozet: |
      Sanık, gece vakti yerleşim yeri içinde, ışık kontrollü kavşağa geldiğinde kırmızı ışığa rağmen kavşağa girmiş ve aracıyla soldan sağa geçen taksiye çarpmıştı. Taksinin yolcularından birinde hayat fonksiyonlarını ağır (5.) derecede, diğerinde orta (3.) derecede etkileyen kemik kırığı oluşmuştu. İlk derece mahkemesi, tam kusurlu sanığı TCK m. 89/4 ve TCK m. 22/3 uyarınca 4.000 TL adli para cezasına ve 6 ay sürücü belgesinin geri alınmasına mahkûm etmişti.
      Bölge Adliye Mahkemesi, temel cezanın ve sürücü belgesinin geri alınma süresinin orantılılık ilkesine aykırı biçimde az belirlendiği gerekçesiyle ilk derece hükmünü kaldırıp yeniden hüküm kurdu: 1 yıl 8 ay hapis (ertelenmiş) ve 1 yıl sürücü belgesinin geri alınması.
      Yargıtay 12. Ceza Dairesi, temyiz istemlerini esastan reddedip hükmü oy birliğiyle onadı. Karar, kırmızı ışıkta geçerek iki kişiyi kemik kırığıyla yaralayan sürücünün TCK m. 89/4 ve TCK m. 22/3 kapsamında bilinçli taksirle cezalandırılabileceğini gösterir.
  - id: "1218688700"
    ozet: |
      Sanık, eşiyle tartışırken hakaret ve tehdit içerikli sözler söylemiş; eşi çocuklarıyla yatak odasına geçip kapıyı kilitleyince gece saatlerinde içinde kaynar su bulunan kettle ile odaya girerek uyumakta olan eşinin üzerine kaynar su dökmüş ve olaydan sonra üç gün boyunca onu hastaneye götürmemişti. Bölge Adliye Mahkemesi, sanığı eşe karşı eziyetten (TCK m. 96/2-b) 5 yıl hapse mahkûm etti.
      Sanık müdafii suç vasfında yanılgıya düşüldüğünü ve temel cezanın alt sınırdan uzaklaşılarak belirlenmesinin hukuka aykırı olduğunu ileri sürdü.
      Yargıtay 8. Ceza Dairesi, mağdurun bedensel ve ruhsal yönden acı çekmesine neden olan davranışların üç gün boyunca devam etmesi nedeniyle eylemlerin sistematik olup süreklilik arz ettiğini, suç vasfının doğru belirlendiğini ve temel cezanın alt sınırdan uzaklaşılmasının isabetli olduğunu belirterek hükmü onadı. Karar, eziyette süreklilik ve sistematiklik ölçütünü somutlaştırır.
sorular:
  - soru: |
      TCK m. 89/1'e göre taksirle yaralama suçunun güncel cezası aşağıdakilerden hangisidir?
    siklar:
      - "3 aydan 1 yıla kadar hapis veya adli para cezası"
      - "4 aydan 2 yıla kadar hapis veya adli para cezası"
      - "6 aydan 3 yıla kadar hapis"
      - "9 aydan 5 yıla kadar hapis"
    dogru: 1
    aciklama: |
      7571 sayılı Kanunla (24.12.2025) TCK m. 89/1'deki "üç aydan bir yıla" ibaresi "dört aydan iki yıla" olmuştur. İlk şık eski sınırdır; "9 aydan 5 yıla" birden fazla kişinin yaralandığı TCK m. 89/4'ün cezasıdır.
  - soru: |
      Bir trafik kazasında sürücünün taksirli davranışı üç kişinin yaralanmasına neden olmuştur. Uygulanacak ceza aralığı aşağıdakilerden hangisidir?
    siklar:
      - "4 aydan 2 yıla kadar hapis veya adli para cezası"
      - "6 aydan 3 yıla kadar hapis"
      - "9 aydan 5 yıla kadar hapis"
      - "2 yıldan 5 yıla kadar hapis"
    dogru: 2
    aciklama: |
      Fiilin birden fazla kişinin yaralanmasına neden olması hâlinde TCK m. 89/4 uyarınca 9 aydan 5 yıla kadar hapis cezası verilir. 6 ay - 3 yıl aralığı 7571 sayılı Kanun öncesindeki sınırdır.
  - soru: |
      Sürücü Ahmet, kırmızı ışıkta geçmenin kazaya yol açabileceğini öngörmüş, ancak kaza olmayacağını umarak geçmiş ve yayaya çarpıp onun yalnızca basit bir sıyrık yaşamasına yol açmıştır. Mahkeme bilinçli taksiri kabul etmiştir. Şikâyet bakımından hangisi doğrudur?
    siklar:
      - "Bilinçli taksir olduğu için şikâyet aranmaz."
      - "TCK m. 89/1 kapsamında olduğu için bilinçli taksirde de şikâyet aranır."
      - "Fiil taksirle yaralama değil, kasten yaralamadır."
      - "Şikâyet yalnızca mağdur çocuksa aranır."
    dogru: 1
    aciklama: |
      TCK m. 89/5'e göre birinci fıkra kapsamına giren yaralama hariç, bilinçli taksirle işlenen suçta şikâyet aranmaz. Basit sıyrık TCK m. 89/1 kapsamında kaldığından bilinçli taksire rağmen şikâyet aranır. Ayrıca TCK m. 22/3 uyarınca ceza artırılır.
  - soru: |
      Sürücü Burcu, bilinçli taksirle tek bir yayaya çarpmış ve yayanın bacağında kemik kırılması oluşmuştur. Mağdur şikâyetçi değildir. Hangisi doğrudur?
    siklar:
      - "Şikâyet olmadığı için soruşturma yapılamaz."
      - "Fiil TCK m. 89/2-b kapsamındadır ve bilinçli taksir olduğundan şikâyet aranmaz."
      - "Kemik kırığı yalnız kasten yaralamada ağır netice sayılır."
      - "Fiil TCK m. 89/1 kapsamındadır; şikâyet aranır."
    dogru: 1
    aciklama: |
      Kemik kırılması TCK m. 89/2-b'de sayılan ağır netice olduğundan fiil birinci fıkra kapsamının dışına çıkar; suç bilinçli taksirle işlendiği için TCK m. 89/5 uyarınca şikâyet aranmaz. Kasten yaralamadaki kemik kırığı ise TCK m. 87/3'tedir.
  - soru: |
      Taksirle yaralamada mağdurun vücudunda kemik kırılmasının sonucu aşağıdakilerden hangisidir?
    siklar:
      - "TCK m. 89/1'e göre belirlenen ceza yarı oranında artırılır."
      - "Ceza bir kat artırılır."
      - "Ceza yarısına kadar artırılır; hâkim takdir eder."
      - "Cezada artırım yapılmaz."
    dogru: 0
    aciklama: |
      Kemik kırılması TCK m. 89/2-b'de sayılmıştır ve birinci fıkraya göre belirlenen ceza yarısı oranında artırılır. Hâkimin etkiye göre "yarısına kadar" takdir yetkisi kasten yaralamadaki TCK m. 87/3'e özgüdür.
  - soru: |
      Taksirle yaralama sonucunda mağdurun duyularından birinin işlevi tamamen yitirilmiştir. TCK m. 89/1'e göre belirlenen ceza ne kadar artırılır?
    siklar:
      - "Yarısı oranında"
      - "Üçte biri oranında"
      - "Bir kat"
      - "İki kat"
    dogru: 2
    aciklama: |
      Duyu veya organ işlevinin yitirilmesi TCK m. 89/3-b'dedir ve ceza bir kat artırılır. Sürekli zayıflama ise TCK m. 89/2-a'dadır ve yarı oranında artırım gerektirir.
  - soru: |
      İşkence suçunun failine ilişkin aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Herkes işkence suçunun faili olabilir."
      - "Fail yalnızca kamu görevlisi olabilir; suç özgü suçtur."
      - "Fail yalnızca polis memuru olabilir."
      - "Fail yalnızca askerî personel olabilir."
    dogru: 1
    aciklama: |
      TCK m. 94/1 işkenceyi gerçekleştiren "kamu görevlisi"ni cezalandırır. Kamu görevlisi kavramı TCK m. 6/1-c'de geniş tanımlanmıştır; yalnız polis ya da asker ile sınırlı değildir.
  - soru: |
      Polis memuru Veli, gözaltındaki şüpheliye ikrar almak için gece boyunca soğuk su sıkıp falakaya yatırır. Bu işlemlere Veli'nin sivil arkadaşı Cengiz de katılır. Cengiz'in durumu hakkında hangisi doğrudur?
    siklar:
      - "Cengiz kamu görevlisi olmadığı için cezalandırılamaz."
      - "Cengiz yalnızca yardım eden sıfatıyla cezalandırılır."
      - "TCK m. 94/4 uyarınca Cengiz de kamu görevlisi gibi cezalandırılır."
      - "Cengiz yalnız kasten yaralamadan sorumlu olur."
    dogru: 2
    aciklama: |
      TCK m. 94/4, işkence suçunun işlenişine iştirak eden diğer kişilerin de kamu görevlisi gibi cezalandırılacağını söyler. Bu, TCK m. 40/2'deki genel kuraldan ayrılan özel hükümdür.
  - soru: |
      İşkence suçu ile eziyet suçu bakımından zamanaşımına ilişkin hangisi doğrudur?
    siklar:
      - "Her iki suçta da zamanaşımı işlemez."
      - "İşkencede zamanaşımı işlemez; eziyette genel zamanaşımı süreleri işler."
      - "Eziyette zamanaşımı işlemez; işkencede genel süreler işler."
      - "İkisinde de TCK m. 66'daki süreler değişmeden uygulanır."
    dogru: 1
    aciklama: |
      TCK m. 94/6 işkence suçundan dolayı zamanaşımı işlemeyeceğini söyler. Eziyet suçunda böyle bir hüküm yoktur; TCK m. 66'daki dava zamanaşımı süreleri uygulanır.
  - soru: |
      İşkencenin ihmali davranışla işlenmesi hâlinde ceza bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Ceza üçte ikisine kadar indirilebilir."
      - "Ceza yarısına kadar indirilebilir."
      - "Bu nedenle cezada indirim yapılmaz."
      - "İhmal yoluyla işkence işlenemez."
    dogru: 2
    aciklama: |
      TCK m. 94/5, işkencenin ihmali davranışla işlenmesinde verilecek cezada bu nedenle indirim yapılmayacağını belirtir. Kasten yaralamada TCK m. 88 ise indirim imkânı tanır.
  - soru: |
      TCK m. 96/1'e göre suçun kadına karşı işlenmesi hâlinde eziyet cezasının alt sınırı aşağıdakilerden hangisinden az olamaz?
    siklar:
      - "2 yıl"
      - "2 yıl 6 ay"
      - "3 yıl"
      - "5 yıl"
    dogru: 1
    aciklama: |
      7406 sayılı Kanunla (2022) eklenen cümle uyarınca eziyetin kadına karşı işlenmesinde alt sınır iki yıl altı aydan az olamaz. Beş yıl alt sınırı işkencede kadına karşı işlenmeye ilişkin TCK m. 94/1'de geçer.
  - soru: |
      Kemal, boşandığı eşi Elif'e uzun süre boyunca sistematik biçimde acı ve aşağılanma çektirecek davranışlarda bulunmuştur. Kemal'in cezası hangi aralıkta belirlenir?
    siklar:
      - "2 yıldan 5 yıla"
      - "3 yıldan 8 yıla"
      - "3 yıldan 12 yıla"
      - "8 yıldan 15 yıla"
    dogru: 1
    aciklama: |
      Kemal kamu görevlisi olmadığı için işkence değil eziyet söz konusudur. Boşandığı eşe karşı işlenmesi 7331 sayılı Kanunla TCK m. 96/2-b'ye eklenmiştir ve ceza 3 yıldan 8 yıla kadardır.
olaylar:
  - olay: |
      S, 10.1.2026 tarihinde yerleşim yeri içinde araç kullanırken kırmızı ışıkta geçmenin bir kazaya yol açabileceğini öngörmesine rağmen kaza olmayacağını umarak kavşağa girer. Yaya geçidindeki M1 ve M2'ye çarpar; her ikisinin kolunda kemik kırılması oluşur. Mahkeme, S'nin neticeyi öngörüp istemediğini tespit eder. Kovuşturmada M1 ve M2 şikâyetlerinden vazgeçerler.

      1. S'nin fiili hangi suçu ve hangi fıkrayı oluşturur?
      2. Taksir türü ve şikâyetten vazgeçmenin etkisi nedir?
      3. Uygulanacak ceza aralığı ve bilinçli taksirin ceza üzerindeki etkisi nedir?
    olcut:
      - {tespit: "Fiilin taksirle yaralama olduğu ve birden fazla kişinin yaralanması nedeniyle TCK m. 89/4 kapsamına girdiği", puan: 20, madde: "TCK m. 89/4"}
      - {tespit: "Kemik kırılmasının TCK m. 89/2-b'deki ağır netice olduğu", puan: 15, madde: "TCK m. 89/2"}
      - {tespit: "Failin neticeyi öngörüp istememesi nedeniyle bilinçli taksir bulunduğu", puan: 20, madde: "TCK m. 22/3"}
      - {tespit: "Bilinçli taksir ve TCK m. 89/1 dışı yaralama bulunduğundan şikâyet aranmadığı; vazgeçmenin davayı düşürmediği", puan: 25, madde: "TCK m. 89/5"}
      - {tespit: "Ceza aralığının 9 aydan 5 yıla olduğu ve bilinçli taksirde cezanın üçte birden yarısına kadar artırıldığı", puan: 20, madde: "TCK m. 89/4"}
    cozum: |
      **Nitelendirme:** S, kırmızı ışıkta geçerek dikkat ve özen yükümlülüğüne aykırı davranmış, iki kişinin kemiklerinin kırılmasına neden olmuştur. Fiil taksirle yaralamadır (TCK m. 89).

      **Hukuki sorunlar:** (1) Hangi fıkra uygulanır? (2) Taksir türü ve şikâyet. (3) Ceza.

      **İlgili hükümler:** TCK m. 89/2-b (kemik kırılması), TCK m. 89/4 (birden fazla kişi), TCK m. 89/5 (şikâyet), TCK m. 22/3 (bilinçli taksir).

      **Değerlendirme:** Olayda S'nin neticeyi öngördüğü ancak istemediği açıkça tespit edildiğinden taksir bilinçlidir (TCK m. 22/3). Birden fazla kişinin yaralanması nedeniyle TCK m. 89/4 uygulanır; bu fıkra 9 aydan 5 yıla kadar hapis öngörür. Şikâyet bakımından TCK m. 89/5 şöyle işler: birinci fıkra kapsamına giren yaralama hariç, bilinçli taksirle işlenen suçta şikâyet aranmaz. Burada her iki mağdurda da kemik kırılması vardır; bu, TCK m. 89/2-b'de sayılan ağır neticedir ve fiilleri birinci fıkra kapsamının dışına çıkarır. Dolayısıyla M1 ve M2'nin vazgeçmesi kamu davasını düşürmez, soruşturma ve kovuşturma resen sürer. Suç tarihi 10.1.2026 olduğundan, TCK m. 89/4'ün 7571 sayılı Kanunla (24.12.2025) değişen güncel sınırları esas alınır; 24.12.2025 öncesi fiillerde lehe kanun ilkesi (TCK m. 7) gündeme gelirdi. Bilinçli taksir nedeniyle TCK m. 22/3 gereği, taksirli suça ilişkin ceza üçte birden yarısına kadar artırılır. Kesin ceza miktarı hâkimin takdirindedir ve kusurun ağırlığına göre belirlenir; sınavda aralığı ve artırım oranını göstermek yeterlidir.

      **Sonuç:** S, TCK m. 89/4 ve TCK m. 22/3 uyarınca cezalandırılır; 9 ay - 5 yıl aralığı esas alınır ve bilinçli taksir için üçte birden yarısına kadar artırım yapılır. Şikâyetten vazgeçme etkisizdir.
  - olay: |
      Polis memuru P, gözaltındaki Z'den ikrar almak amacıyla iki gece boyunca ona soğuk su sıkar, falakaya yatırır ve aşağılayıcı sözler söyler. P'nin çağrısı üzerine sivil arkadaşı A da odaya girip Z'yi tutar ve ona vurur. Z'nin ayağında kemik kırılması oluşur; adli tıp raporuna göre kırık hayat fonksiyonlarını orta derecede etkilemiştir. Aradan 20 yıl geçtikten sonra dosya savcılığa gelir.

      1. P'nin fiili hangi suçu oluşturur?
      2. A'nın sorumluluğu nedir?
      3. Kemik kırılmasının hukuki sonucu ve zamanaşımı bakımından durum nedir?
    olcut:
      - {tespit: "P'nin kamu görevlisi olup insan onuruyla bağdaşmayan davranışlarla acı çektirmesi nedeniyle işkence suçunu işlediği", puan: 20, madde: "TCK m. 94/1"}
      - {tespit: "Kamu görevlisi tanımının P'yi kapsadığı", puan: 10, madde: "TCK m. 6/1-c"}
      - {tespit: "A'nın TCK m. 94/4 uyarınca kamu görevlisi gibi cezalandırılacağı", puan: 25, madde: "TCK m. 94/4"}
      - {tespit: "Kemik kırılması nedeniyle neticesi sebebiyle ağırlaşmış işkence hükmünün (8-15 yıl) uygulanacağı", puan: 20, madde: "TCK m. 95/3"}
      - {tespit: "İşkence suçunda zamanaşımının işlemediği", puan: 15, madde: "TCK m. 94/6"}
      - {tespit: "Olayın zor kullanma sınırının aşılması (TCK m. 256) olmadığı", puan: 10, madde: "TCK m. 256"}
    cozum: |
      **Nitelendirme:** P kamu görevlisidir (TCK m. 6/1-c). Gözaltındaki kişiye ikrar almak için uyguladığı soğuk su, falaka ve aşağılama, insan onuruyla bağdaşmayan ve bedensel ve ruhsal acı doğuran davranışlardır. Fiil işkencedir.

      **Hukuki sorunlar:** (1) Fiilin işkence mi, zor kullanma sınırının aşılması mı yoksa kasten yaralama mı olduğu. (2) Sivil A'nın sorumluluğu. (3) Ağır netice ve zamanaşımı.

      **İlgili hükümler:** TCK m. 94/1, TCK m. 94/4, TCK m. 94/6, TCK m. 95/3, TCK m. 256, TCK m. 6/1-c.

      **Değerlendirme:** TCK m. 256 görevini yaparken zor kullanma yetkisinin gerektirdiği ölçünün dışında kuvvet kullanan görevliyi kasten yaralama hükümlerine tabi tutar. Burada ise gözaltında bulunan ve direnmeyen kişiye ikrar almak amacıyla bilinçli ve ısrarlı bir biçimde acı çektirilmiştir; bu davranışlar zor kullanma yetkisinin kapsamında değildir, işkencedir (TCK m. 94/1). A kamu görevlisi olmasa da TCK m. 94/4 uyarınca işkence suçuna iştirak ettiğinden kamu görevlisi gibi cezalandırılır; genel kuralda (TCK m. 40/2) yardım eden veya azmettiren sayılacağı hâlde özel hüküm bu sonucu değiştirir. Z'nin ayağında oluşan kemik kırılması, işkence fiillerinin kemik kırılmasına neden olması hâlini düzenleyen TCK m. 95/3'e girer ve kırığın hayat fonksiyonlarındaki etkisine göre 8 yıldan 15 yıla kadar hapis cezası verilir. TCK m. 94/6 uyarınca işkence suçundan dolayı zamanaşımı işlemez; bu nedenle aradan 20 yıl geçmesi kovuşturmaya engel değildir. Genel dava zamanaşımı süreleri (TCK m. 66) işkencede uygulanmaz.

      **Sonuç:** P ve A, TCK m. 94/1, 94/4 ve 95/3 uyarınca işkenceden sorumludur; ceza 8-15 yıl hapistir. Zamanaşımı işlemediğinden dava açılabilir.
kartlar:
  - on: "TCK m. 89/1'in güncel cezası nedir?"
    arka: "4 aydan 2 yıla kadar hapis veya adli para cezası (7571 sayılı Kanunla yükseltildi; eski: 3 ay - 1 yıl) (TCK m. 89/1)."
  - on: "Birden fazla kişinin taksirle yaralanması hâlinde ceza nedir?"
    arka: "9 aydan 5 yıla kadar hapis (eski: 6 ay - 3 yıl) (TCK m. 89/4)."
  - on: "Taksirle yaralamada kemik kırığı nerede ve nasıl cezalandırılır?"
    arka: "TCK m. 89/2-b'de; ceza yarısı oranında artırılır. Kasten yaralamada kemik kırığı TCK m. 87/3'tedir."
  - on: "Taksirle yaralamada hangi ağır neticelerde ceza bir kat artırılır?"
    arka: "İyileşmez hastalık veya bitkisel hayat, duyu/organ işlevinin yitimi, konuşma/çocuk yapma yeteneğinin kaybı, yüzün sürekli değişikliği, çocuğun düşmesi (TCK m. 89/3)."
  - on: "Taksirle yaralamada şikâyet kuralı nedir?"
    arka: "Şikâyete bağlıdır; TCK m. 89/1 hariç, bilinçli taksirle işlenirse şikâyet aranmaz (TCK m. 89/5)."
  - on: "Bilinçli taksirin ceza üzerindeki etkisi nedir?"
    arka: "Taksirli suça ilişkin ceza üçte birden yarısına kadar artırılır (TCK m. 22/3)."
  - on: "İşkence suçunun faili kimdir ve temel cezası nedir?"
    arka: "Kamu görevlisi (özgü suç); 3 yıldan 12 yıla hapis, kadına karşı alt sınır 5 yıl (TCK m. 94/1)."
  - on: "İşkencenin nitelikli hâlleri ve cezaları nedir?"
    arka: "Çocuğa, savunamayan kişiye, gebe kadına veya görevi dolayısıyla avukata/kamu görevlisine karşı 8-15 yıl; cinsel taciz şeklinde 10-15 yıl (TCK m. 94/2 ve TCK m. 94/3)."
  - on: "İşkencede iştirak, ihmal ve zamanaşımı kuralı nedir?"
    arka: "İştirak edenler kamu görevlisi gibi cezalandırılır; ihmalde indirim yapılmaz; zamanaşımı işlemez (TCK m. 94/4, 94/5, 94/6)."
  - on: "Neticesi sebebiyle ağırlaşmış işkencede kemik kırığı ve ölümün cezası nedir?"
    arka: "Kemik kırılması: 8-15 yıl; ölüm: ağırlaştırılmış müebbet hapis (TCK m. 95/3 ve TCK m. 95/4)."
  - on: "Eziyet suçunun cezası ve nitelikli hâli nedir?"
    arka: "2-5 yıl, kadına karşı alt sınır 2 yıl 6 ay; çocuğa, savunamayan kişiye, gebe kadına, üstsoy/altsoy/babalık/analığa veya eşe/boşandığı eşe karşı 3-8 yıl (TCK m. 96/1 ve TCK m. 96/2)."
  - on: "İşkence, eziyet ve zor kullanma sınırının aşılması nasıl ayrılır?"
    arka: "İşkence kamu görevlisince, eziyet herkesçe işlenir; görev sırasında gereken ölçünün dışında kuvvet kullanımında kasten yaralama hükümleri uygulanır (TCK m. 94, TCK m. 96, TCK m. 256)."
