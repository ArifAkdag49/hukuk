doktrin: |
  ### Kötü muamelenin sınırı
  TCK m. 232 ile kasten yaralama (TCK m. 86) ve eziyet (TCK m. 96) arasındaki ayrım tartışmalıdır. Genel kabul, yaralama veya eziyet boyutuna ulaşmayan, merhamet ve şefkatle bağdaşmayan muamelenin kötü muamele olduğu yönündedir. Ancak fiilin süreklilik, şiddet ve mağdurda yarattığı acı bakımından nereden itibaren eziyete geçtiği her olayda ayrı değerlendirilir; kesin bir sayısal sınır yoktur.

  ### Tefecilikte tek ödünç verme
  TCK m. 241'in lafzı "meslek edinme" veya "birden fazla kişiye verme" şartı koymaz; bu yüzden tek bir ödünç vermenin de suçu oluşturup oluşturmayacağı doktrinde tartışılmıştır. Bir görüşe göre tek fiil ölçüsüz olduğundan en azından süreklilik veya birden fazla kişiye ödünç verme iradesi aranmalıdır; diğer görüşe göre kazanç amacıyla ödünç para vermek madde metni gereği yeterlidir. Farklı kişilere değişik zamanlarda ödünç verilmesi hâlinde zincirleme suç hükümlerinin (TCK m. 43/1) uygulanıp uygulanmayacağı da, mağduru belli bir kişi olmayan suçlar için getirilen cümle çerçevesinde tartışılır. Bu nedenle bu noktalar sınavda kesin kural gibi değil, tartışmalı konu olarak anlatılmalıdır.

  ### TCK m. 233/4'ün uygulaması
  Yeni eklenen TCK m. 233/4'te ana-babanın yükümlülük ihlali ile çocuğun işlediği ağır suç arasındaki "bu fiiller nedeniyle" bağının nasıl ispatlanacağı konusunda henüz yerleşik bir içtihat yoktur; uygulamanın bu bağı nasıl kuracağı izlenmelidir.
sozluk:
  - terim: Özgü suç
    tanim: "Yalnızca belirli sıfatı taşıyan kişilerce işlenebilen suç; TCK m. 234/1'de fail velayeti alınmış ana-baba veya üçüncü derece dâhil kan hısmıdır."
  - terim: Kötü muamele
    tanim: "Aynı konutta yaşanan kişiye karşı yaralama veya eziyet boyutuna ulaşmayan, merhamet ve şefkatle bağdaşmayan davranış (TCK m. 232)."
  - terim: Disiplin yetkisini kötüye kullanma
    tanim: "Terbiye hakkından doğan yetkinin sınırın ötesinde kullanılması (TCK m. 232/2)."
  - terim: Çaresiz durumda terk
    tanim: "Hamile eşin veya birlikte yaşanan hamile kadının yardımsız bırakılması (TCK m. 233/2)."
  - terim: Üçüncü derece dâhil kan hısmı
    tanim: "Kardeş ve büyükana-büyükbaba (2. derece) ile amca, dayı, hala, teyze ve yeğen (3. derece) gibi akrabalar; TCK m. 234/1'de fail olabilirler."
  - terim: İhaleye fesat karıştırma
    tanim: "Kamu ihalelerinde hile, gizli bilgi sızdırma, cebir-tehdit veya fiyat anlaşmasıyla ihalenin dürüstlüğünü bozma (TCK m. 235)."
  - terim: Edimin ifasına fesat karıştırma
    tanim: "Sözleşmeden sonra kamuya karşı taahhüt edilen edimin hileli ifası veya hileli kabulü (TCK m. 236)."
  - terim: Hileli davranış
    tanim: "TCK m. 235/2-a ve TCK m. 236/2'de fesat sayılan hâllerin ortak unsuru; aldatmaya yönelik davranış."
  - terim: Tefecilik
    tanim: "Kazanç elde etmek amacıyla başkasına ödünç para verme (TCK m. 241)."
  - terim: Zincirleme suç
    tanim: "Bir suç işleme kararının icrası kapsamında değişik zamanlarda aynı suçun birden fazla işlenmesi; tek ceza, dörtte birden dörtte üçe kadar artırılarak verilir (TCK m. 43/1)."
kararlar:
  - id: "1229865600"
    ozet: |
      Kamu görevlilerinin ve diğer sanıkların yargılandığı davada ilk derece mahkemesi ihaleye fesat karıştırma dahil birçok suçtan mahkûmiyet kurmuş, Bölge Adliye Mahkemesi mahkûmiyetleri kaldırıp beraat kararı vermişti. Yargıtay 5. Ceza Dairesi, Hazinenin nitelikli dolandırıcılık ve resmî belgede sahtecilik suçlarından doğrudan zarar görmediğinden katılma ve temyiz hakkı olmadığını, ihaleye fesat karıştırma suçundan ise zarar gören sıfatıyla temyiz hakkı bulunduğunu belirtmiştir. Doğrudan temin yöntemiyle yapılan hizmet alımlarında sahte imzalı teklif belgesi alınması eylemini, sübut hâlinde TCK m. 207/1'deki özel belgede sahtecilik olarak; 2007 yılındaki ihalelerde kamu zararı doğmaması nedeniyle eylemi TCK m. 235/3-b kapsamındaki ihaleye fesat karıştırma olarak nitelendirmiş; bu suçlar bakımından dava zamanaşımının dolduğunu belirterek beraat hükümlerini bozmuş ve kamu davalarının düşmesine karar vermiştir.
  - id: "1224407000"
    ozet: |
      Sanıklar, şikâyetçiye faizle borç verdikleri ve teminat olarak şikâyetçinin annesine ait taşınmazın tapusunu aldıkları iddiasıyla yargılanmış; ilk derece mahkemesi beraat, Bölge Adliye Mahkemesi duruşmalı inceleme sonunda TCK m. 241/1 uyarınca mahkûmiyet kararı vermişti. Yargıtay 5. Ceza Dairesi, tefecilik suçunun kazanç elde etmek amacıyla başkasına ödünç para verilmesini gerektirdiğini belirtmiş; borç tutarı, faiz ödemeleri ve banka kayıtları, tapu ve satış sözleşmesi belgeleri, kolluk araştırması, vergi inceleme raporu ve icra takip dosyaları gibi araştırmalar yapılmadan karar verilmesini eksik inceleme sayarak hükmü oy birliğiyle bozmuştur. Karar, mahkûmiyetin her türlü şüpheden uzak delile dayanması gerektiğini gösterir.
  - id: "1229604300"
    ozet: |
      Aynı konutta birlikte yaşadığı kişiye karşı kötü muamele (TCK m. 232/1) nedeniyle yargılanan sanık hakkında ilk derece mahkemesi beraat kararı vermiş, Bölge Adliye Mahkemesi duruşmalı incelemede bu kararı kaldırarak adlî para cezasına mahkûmiyet kurmuştur. Yargıtay 4. Ceza Dairesi, kötü muamele eyleminin zorunlu öğelerinin duruşma sonucunda saptandığını, eylemin doğru nitelendirildiğini belirtmiştir. Adlî para cezasının paraya çevrilmesinde eksik ceza tayin edilmiş olmakla birlikte, aleyhe temyiz bulunmadığı için bunun bozma nedeni yapılamayacağını kabul ederek hükmü oy birliğiyle onamıştır.
sorular:
  - soru: |
      TCK m. 230/4'e göre birden çok evlilik suçunda zamanaşımı ne zaman işlemeye başlar?
    siklar:
      - "Evlilik işleminin yapıldığı tarihte"
      - "Evlenmenin iptali kararının kesinleştiği tarihte"
      - "Mağdurun fiili öğrendiği tarihte"
      - "Evliliğin sona erdiği tarihte"
    dogru: 1
    aciklama: |
      TCK m. 230/4, zamanaşımının evlenmenin iptali kararının kesinleştiği tarihten itibaren işlemeye başlayacağını söyler. Fiilin işlendiği gün veya öğrenme anı ölçüt değildir.
  - soru: |
      Gerçek kimliğini saklayarak bir başkasıyla evlenme işlemi yaptıran kişiye TCK m. 230/3'e göre hangi ceza verilir?
    siklar:
      - "Altı aydan iki yıla kadar hapis"
      - "Üç aydan bir yıla kadar hapis"
      - "Bir yıldan üç yıla kadar hapis"
      - "Bir yıla kadar hapis"
    dogru: 1
    aciklama: |
      TCK m. 230/3, gerçek kimliği saklayarak evlenme işlemi yaptırana üç aydan bir yıla kadar hapis öngörür. Altı aydan iki yıla kadar olan ceza TCK m. 230/1-2'ye aittir.
  - soru: |
      Olay: Mehmet, ayrı bir evde yaşayan kardeşine karşı şiddet içermeyen küçük düşürücü davranışlarda bulunmuştur. Mehmet ile kardeşi aynı konutta yaşamamaktadır. Bu durumda TCK m. 232/1 uygulanır mı?
    siklar:
      - "Uygulanır; akrabalık yeterlidir."
      - "Uygulanmaz; TCK m. 232/1 aynı konutta birlikte yaşanan kişilere karşı işlenen kötü muameleyi cezalandırır."
      - "Uygulanır; ancak ceza yarı oranında indirilir."
      - "Yalnızca şikâyet üzerine uygulanır."
    dogru: 1
    aciklama: |
      TCK m. 232/1'in unsuru "aynı konutta birlikte yaşadığı kişilerden birine karşı" kötü muamelede bulunmaktır. Akrabalık tek başına yeterli değildir; ortak konut aranır.
  - soru: |
      Güncel metne göre TCK m. 233/1'de düzenlenen bakım, eğitim veya destek olma yükümlülüğünü yerine getirmeme suçu için hangisi doğrudur?
    siklar:
      - "Re'sen soruşturulur, cezası bir yıla kadar hapistir."
      - "Şikâyet üzerine soruşturulur, cezası üç aydan iki yıla kadar hapistir."
      - "Şikâyet üzerine soruşturulur, cezası bir yıldan üç yıla kadar hapistir."
      - "Re'sen soruşturulur, cezası altı aydan iki yıla kadar hapistir."
