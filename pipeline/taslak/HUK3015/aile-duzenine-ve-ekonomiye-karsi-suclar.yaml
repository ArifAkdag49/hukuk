    aciklama: |
      TCK m. 233/1 "şikayet üzerine, üç aydan iki yıla kadar hapis" öngörür. Eski metindeki "bir yıla kadar" ibaresi 7593 sayılı Kanunla değişmiştir.
  - soru: |
      Olay: Ali, hamile olduğunu bildiği ve kendisiyle sürekli birlikte yaşayan, evli olmadığı kadını gebeliğinin ileri döneminde çaresiz durumda terk etmiştir. Ali'nin cezası hangi hükme göre belirlenir?
    siklar:
      - "TCK m. 233/1; altı aydan iki yıla kadar hapis"
      - "TCK m. 233/2; altı aydan iki yıla kadar hapis"
      - "TCK m. 233/3; bir yıldan üç yıla kadar hapis"
      - "TCK m. 232/1; iki aydan bir yıla kadar hapis"
    dogru: 1
    aciklama: |
      TCK m. 233/2, hamile olduğunu bildiği eşini veya sürekli birlikte yaşadığı ve kendisinden gebe kalmış bulunduğunu bildiği evli olmayan kadını çaresiz durumda terk edene altı aydan iki yıla kadar hapis verir.
  - soru: |
