olaylar:
  - olay: |
      Ev sahibi Emre, kiracısı Deniz'in yatak odasına gizli bir kamera yerleştirir ve Deniz'in çıplak görüntülerini kaydeder. Deniz'e gönderdiği mesajda "50.000 TL vermezsen görüntülerini internette yayarım" yazar. Deniz parayı ödemeyince Emre, aynı görüntüleri ve Deniz'in kişisel kullanımındaki cep telefonu numarasını tek bir paylaşımla herkese açık sosyal medya hesabından yayımlar. Deniz durumu öğrenince şikâyetçi olur.

      1. Emre'nin kameraya ilişkin fiilini değerlendiriniz.
      2. Para isteyerek yayma tehdidinde bulunmasını değerlendiriniz.
      3. Görüntüleri ve telefon numarasını yayımlaması bakımından Emre'nin sorumluluğunu belirleyiniz.
      4. Soruşturma koşulu bakımından hangi kural uygulanır?
    olcut:
      - {tespit: "Yatak odasında gizli kamerayla görüntü alınması özel hayatın gizliliğini kayıt suretiyle ihlaldir; ceza bir kat artırılır", puan: 25, madde: "TCK m. 134/1"}
      - {tespit: "Şeref ve saygınlığa zarar verecek hususların açıklanacağı tehdidiyle yarar sağlama amacı şantajdır", puan: 20, madde: "TCK m. 107/2"}
      - {tespit: "Görüntülerin yayımlanması özel hayata ilişkin görüntülerin ifşasıdır", puan: 20, madde: "TCK m. 134/2"}
      - {tespit: "Telefon numarasının da aynı fiille yayılması TCK m. 136/1'i doğurur; tek fiil olduğundan fikri içtima ile ağır ceza olan TCK m. 134/2'den hüküm kurulur", puan: 25, madde: "TCK m. 44"}
      - {tespit: "TCK m. 134 suçları şikâyete bağlıdır; Deniz'in şikâyeti vardır", puan: 10, madde: "TCK m. 139"}
    cozum: |
      **Nitelendirme:** Olayda özel yaşam alanının kayıtla ihlali, şantaj ve özel hayata ilişkin görüntüyle kişisel verinin birlikte yayımlanması vardır.

      **Hukuki sorunlar:** (1) Gizli kameranın hangi suçu oluşturduğu; (2) para istemenin şantaj olup olmadığı; (3) tek paylaşımla iki farklı suçun oluşması hâlinde içtima; (4) kovuşturma koşulu.

      **İlgili hükümler ve değerlendirme:**

      1. *Gizli kamera.* Yatak odası, kişinin özel hayatının gizli alanıdır. Emre kişilerin özel hayatının gizliliğini ihlal etmiş (TCK m. 134/1 c. 1) ve bunu görüntülerin kayda alınması suretiyle yaptığı için ceza bir kat artırılır (TCK m. 134/1 c. 2). Olayda iletişim aracı kullanılan bir haberleşme olmadığı için TCK m. 132 değil, TCK m. 134 uygulanır.

      2. *Şantaj.* Emre kendisine yarar sağlamak maksadıyla Deniz'in şeref veya saygınlığına zarar verecek nitelikteki hususların açıklanacağı tehdidinde bulunmuştur. Bu hâl TCK m. 107/2 uyarınca TCK m. 107/1'deki cezayı gerektirir ve ayrı bir suçtur.

      3. *Yayma.* Yatak odası görüntüleri özel hayata ilişkin görüntülerdir; hukuka aykırı olarak ifşa edilmeleri TCK m. 134/2'yi oluşturur. Cep telefonu numarası ise özel hayatın gizli alanına girmeyen bir kişisel veridir; hukuka aykırı biçimde yayılması TCK m. 136/1'e uyar. Her iki sonuç tek bir paylaşımla, yani tek fiille doğmuştur. TCK m. 44 uyarınca bu durumda en ağır cezayı gerektiren suçtan cezalandırılır; TCK m. 134/2 (2-5 yıl) TCK m. 136/1'e (2-4 yıl) göre daha ağır cezayı gerektirdiğinden hüküm bu hükümden kurulur. Yargıtay da aynı yönde karar vermektedir. Kameraya yerleştirme ve kayıt (TCK m. 134/1) ile sonraki yayma farklı zamanlarda yapılan ayrı hareketlerdir.

      4. *Kovuşturma.* TCK m. 134 suçları şikâyete bağlıdır (TCK m. 139). Deniz şikâyet ettiğinden kovuşturma yapılabilir. TCK m. 136 suçu ise tek başına şikâyete bağlı olmasa da fikri içtima ile TCK m. 134/2'den hüküm kurulduğundan şikâyet koşulu esas hüküm bakımından aranır.

      **Sonuç:** Emre TCK m. 134/1 (kayıt suretiyle ihlal), TCK m. 107/2 (şantaj) ve tek paylaşımla yayma nedeniyle TCK m. 44 uyarınca TCK m. 134/2 kapsamında sorumludur.
  - olay: |
      İşveren İlker, çalışanları Ceren ve Murat'ın dinlenme odasındaki yüz yüze konuşmalarını öğrenmek için masanın altına gizli ses kayıt cihazı yerleştirir ve konuşmaları kaydeder. Daha sonra bu kayıtlardan bazılarını 80 kişilik şirket WhatsApp grubunda paylaşır. Başka bir gün İlker, Ceren'i odasına çağırarak "istifa dilekçeni imzalamazsan seni öldürürüm" diye bağırır. Ceren o anda başka türlü delil elde etme imkânı bulamayınca telefonunun ses kaydını açıp tehdidi kaydeder ve derhal Cumhuriyet Başsavcılığına teslim eder.

      1. İlker'in dinlenme odasındaki kaydı bakımından sorumluluğunu belirleyiniz.
      2. Kayıtların WhatsApp grubunda paylaşılması bakımından durumu değerlendiriniz.
      3. Ceren'in yaptığı kaydın hukuki durumunu açıklayınız.
    olcut:
      - {tespit: "Yüz yüze, aleni olmayan konuşmanın İlker tarafı olmadığı hâlde cihazla kaydı; haberleşme değil konuşma olduğundan TCK m. 133 uygulanır", puan: 30, madde: "TCK m. 133/1"}
      - {tespit: "Kaydedilen konuşmaların 80 kişilik grupta paylaşılması hukuka aykırı ifşadır; hapis ve adlî para cezası birlikte öngörülmüştür", puan: 25, madde: "TCK m. 133/3"}
      - {tespit: "Ceren'in kaydı ani gelişen suçta delil muhafazası amacıyla yapılıp yalnız adlî makamlara sunulduğundan hukuka uygundur", puan: 25, madde: "TCK m. 133"}
      - {tespit: "İlker'in planlı gizli kaydının hukuka uygun elde edilmiş delil sayılmaması", puan: 10, madde: "CMK m. 217/2"}
      - {tespit: "TCK m. 133 suçlarının şikâyete bağlı olması", puan: 10, madde: "TCK m. 139"}
    cozum: |
      **Nitelendirme:** Olayda iki ayrı kayıt vardır: işverenin planlı gizli kaydı ve çalışanın tehdit üzerine aldığı kayıt.

      **Hukuki sorunlar:** (1) TCK m. 132 ile TCK m. 133 ayrımı ve işverenin sorumluluğu; (2) ifşa; (3) çalışanın kaydının hukuka uygunluğu; (4) kovuşturma koşulu.

      **İlgili hükümler ve değerlendirme:**

      1. *İşverenin kaydı.* Dinlenme odasındaki konuşma iletişim aracı kullanılmadan, yüz yüze yapılmıştır; bu nedenle haberleşme (TCK m. 132) değil, konuşmadır (TCK m. 133). İlker konuşmanın tarafı değildir ve taraflardan hiçbirinin rızası yoktur. Aleni olmayan konuşmaları ses alma cihazıyla kaydetmek TCK m. 133/1 kapsamında 2-5 yıl hapisle cezalandırılır. Söyleşiye katılan taraf için öngörülen TCK m. 133/2 İlker için söz konusu değildir.

      2. *İfşa.* Kayıtların 80 kişilik grupta paylaşılması, kaydedilen konuşmalardan elde edilen verilerin hukuka aykırı olarak ifşasıdır. TCK m. 133/3 uyarınca 2-5 yıl hapis ve 4000 güne kadar adlî para cezası öngörülmüştür. Burada hapis ve adlî para cezası birlikte verilir.

      3. *Ceren'in kaydı.* Ceren, kendisine karşı işlenmekte olan ve ani gelişen bir suçu (tehdit) kaybolma ihtimali olan delili korumak için kaydetmiş, başka delil elde etme imkânı bulmamış ve kaydı yalnız savcılığa sunmuştur. Yargıtay 12. Ceza Dairesi'nin ölçütüne göre bu hukuka uygundur; TCK m. 133 suçu oluşmaz. İlker'in planlı kaydı ise bu koruma kapsamında değildir ve hukuka uygun elde edilmiş delil sayılmaz (CMK m. 217/2).

      4. *Kovuşturma.* TCK m. 133 suçları şikâyete bağlıdır (TCK m. 139). Ceren ve Murat şikâyetçi olmazsa soruşturma yapılamaz.

      **Sonuç:** İlker TCK m. 133/1 ve TCK m. 133/3'ten sorumlu olur; Ceren'in kaydı hukuka uygundur.
kartlar:
  - on: "TCK m. 132 ile TCK m. 133 arasındaki temel ayrım nedir?"
    arka: "TCK m. 132 araçlı iletişimi (haberleşme), TCK m. 133 araçsız, yüz yüze aleni olmayan konuşmayı korur."
  - on: "TCK m. 132/1 ceza ve artırım?"
    arka: "1-3 yıl hapis; haberleşme içeriklerinin kaydı suretiyle ihlalde ceza bir kat artırılır."
  - on: "Haberleşmenin tarafı hangi hâlde TCK m. 132/3'ten sorumlu olur?"
    arka: "Kendisiyle yapılan haberleşmenin içeriğini diğer tarafın rızası olmaksızın hukuka aykırı olarak alenen ifşa ederse; ceza 1-3 yıl hapis."
  - on: "TCK m. 133/1'in şartı ve cezası?"
    arka: "Aleni olmayan konuşmayı taraflardan birinin rızası olmadan bir aletle dinlemek veya ses alma cihazıyla kaydetmek: 2-5 yıl hapis."
  - on: "TCK m. 133/2 ile TCK m. 133/3 yaptırımları?"
    arka: "TCK m. 133/2: 6 ay-2 yıl hapis veya adlî para cezası. TCK m. 133/3: 2-5 yıl hapis ve 4000 güne kadar adlî para cezası."
  - on: "TCK m. 134/1 ve 134/2'nin cezaları?"
    arka: "134/1: 1-3 yıl, görüntü/ses kaydıyla ihlalde bir kat artırım. 134/2 (ifşa): 2-5 yıl hapis."
  - on: "TCK m. 135 hangi hâlde artırılır?"
    arka: "Siyasi, felsefi, dini görüş, ırki köken, ahlaki eğilim, cinsel yaşam, sağlık veya sendikal bağlantı verilerinde yarı oranında (TCK m. 135/2)."
  - on: "TCK m. 136/1'in seçimlik hareketleri ve cezası?"
    arka: "Kişisel verileri hukuka aykırı olarak verme, yayma veya ele geçirme: 2-4 yıl hapis."
  - on: "TCK m. 137 artırımı kime ve ne kadar?"
    arka: "Kamu görevlisince yetki kötüye kullanılarak ya da meslek ve sanat kolaylığıyla işlenirse yarı oranında artırım."
  - on: "TCK m. 139'a göre hangi suçlar şikâyete bağlı değildir?"
    arka: "Kişisel verilerin kaydedilmesi (135), verileri verme/ele geçirme (136) ve yok etmeme (138); diğerleri şikâyete bağlıdır."
  - on: "Gizli kayıt ne zaman hukuka uygun olabilir?"
    arka: "Kendisine karşı ani gelişen bir suçta, kaybolma ihtimali olan delili muhafaza amacıyla yapılıp yalnız adlî makamlara sunulursa; planlı kayıtta uygun değildir."
  - on: "Aynı paylaşımda özel hayat görüntüsü ve telefon numarası yer alırsa hangi hüküm uygulanır?"
    arka: "Tek fiil, birden fazla suç: TCK m. 44 uyarınca ağır cezalı TCK m. 134/2'den hüküm kurulur."
