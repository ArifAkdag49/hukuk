    ozet: |
      Sanıklardan biri, aralarında ailevi anlaşmazlık ve kuşku bulunan mağduru telefonla arayıp özel yaşamına ilişkin sorular sormuş; mağdurun bilgisi dışında görüşmeyi yanındaki diğer sanığa dinletmiş, o da görüşmeyi cep telefonuyla kaydetmişti. Yerel mahkeme her iki sanığı beraat ettirdi. Yargıtay 12. Ceza Dairesi oy çokluğuyla bozdu. Daire, konuşmada araç bulunmazken haberleşmede iletişimin elverişli bir araçla kurulduğunu, olayda telefon görüşmesi bulunduğundan TCK m. 133'ün uygulanamayacağını belirtti. Mağdurla görüşen sanık, haberleşmenin tarafı olduğundan içeriği alenen ifşa etmeyip yalnız bir kişiye dinlettiği için TCK m. 132/3 oluşmaz; çoğunluk eylemi TCK m. 134/2 kapsamında saydı, karşı oy ise kaydedilmemiş bir sesin ifşa edilemeyeceğini ileri sürdü. Görüşmeyi dinleyip kaydeden diğer sanığın eylemi ise TCK m. 132/1'in iki cümlesi kapsamındaydı. Daire ayrıca beraatin gerekçesi olabilecek delil kaydı savunması bakımından, ortada ani gelişen bir suç bulunmadığını, kaydın önceden hazırlıklı ve planlı olarak yeni delil elde etmek için yapıldığını vurguladı.
