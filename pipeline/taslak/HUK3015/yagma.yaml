      - "Yağma (TCK m. 148/3 cebir karinesi)"
      - "Basit hırsızlık (TCK m. 141/1)"
      - "Güveni kötüye kullanma (TCK m. 155)"
      - "Şantaj (TCK m. 107)"
    dogru: 0
    aciklama: |
      TCK m. 148/3'e göre mağdurun herhangi bir vasıta ile kendisini bilmeyecek ve savunamayacak hâle getirilmesi yağmada cebir sayılır. Uyku ilacı bu vasıtalardandır. Mağdur kendiliğinden uyumuş olsaydı TCK m. 142/2-a'daki nitelikli hırsızlık söz konusu olurdu.
  - soru: |
      Zeynep, yaşlı bir kadının çantasını çekmiş, kadın bırakmayınca onu iterek yere düşürüp çantayı almıştır. Eylem hangi suçtur?
