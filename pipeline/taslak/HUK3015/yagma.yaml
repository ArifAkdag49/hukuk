  - soru: |
      Ev sahibi Ali, kiracısı Mehmet'in 8.000 TL'lik vadesi geçmiş kira borcunu tahsil etmek için Mehmet'i tehdit ederek 8.000 TL almıştır. Aşağıdakilerden hangisi doğrudur?
