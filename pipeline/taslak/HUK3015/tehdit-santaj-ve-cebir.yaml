    tanim: "Hakkın kullanılmasını ya da şeref ve saygınlığa zarar verecek hususların açıklanmasını araç yaparak yarar sağlama veya zorlama (TCK m. 107)."
  - terim: Cebir
    tanim: "Bir davranışı yaptırmak için kişiye karşı kullanılan fiziki güç; cezası kasten yaralamanın 1/3 ila 1/2 artırımıdır (TCK m. 108)."
  - terim: Bileşik suç
    tanim: "Biri diğerinin unsuru veya ağırlaştırıcı nedeni olduğu için tek fiil sayılan suç; içtima hükümleri uygulanmaz (TCK m. 42)."
  - terim: Yağma
    tanim: "Hayat, vücut, cinsel dokunulmazlık veya büyük malvarlığı zararı tehdidiyle ya da cebirle malın teslimine zorlama (TCK m. 148)."
  - terim: Hakkın kullanılması
    tanim: "Hakkını kullanana ceza verilmemesini sağlayan hukuka uygunluk nedeni (TCK m. 26/1)."
  - terim: Zincirleme suç
    tanim: "Aynı suçun bir suç işleme kararının icrası kapsamında değişik zamanlarda aynı kişiye karşı birden fazla ya da birden fazla kişiye karşı tek fiille işlenmesi; tek ceza dörtte birinden dörtte üçüne kadar artırılır (TCK m. 43)."
  - terim: Uzlaştırma
    tanim: "Şüpheli veya sanık ile mağdur arasında soruşturmada (CMK m. 253) ya da kovuşturmada (CMK m. 254) yapılan uzlaşma girişimi; TCK m. 106/1 bu kapsamdadır."
kararlar:
  - id: "1230685300"
    ozet: |
      Sanık hakkında bir katılana yönelik hakaret, silahla tehdit ve basit kasten yaralama, ikinci bir katılana yönelik ise tehdit suçlarından dava açılmıştır. İzmir 52. Asliye Ceza Mahkemesi, birinci katılana yönelik silahla tehditten beraat, basit kasten yaralamadan 3.000 TL adlî para cezası kararı vermiş; para cezası kesin nitelikte olduğundan, beraat hükmü de istinaf edilmediğinden kesinleşmiştir. Adalet Bakanlığının istemi üzerine kanun yararına bozma incelemesi yapan Yargıtay 1. Ceza Dairesi, basit yaralamanın şikâyete bağlı ve uzlaştırma kapsamında olduğunu, silahla tehdit suçunun ise uzlaştırmaya engel olduğunu belirtmiştir. Silahla tehditten beraat edildiği için CMK m. 253/3'teki engel ortadan kalktığından dosyanın yaralama yönünden CMK m. 254 uyarınca uzlaştırma bürosuna gönderilmesi gerektiğini kabul ederek bu kısmı oy birliğiyle kanun yararına bozmuştur. İkinci katılana yönelik tehditten verilen beraat hükmünde ise hüküm fıkrasına "tehdit" yerine "hakaret" yazılmasını mahallinde düzeltilebilecek maddi hata sayarak bozma istemini reddetmiştir. Karar, TCK m. 106/2'nin uzlaştırmayı engellemesi ve beraat hâlinde bu engelin kalkması bakımından öğreticidir.
  - id: "1201686100"
    ozet: |
      Yargıtay 4. Ceza Dairesi, insan ticareti, fuhuş, suç örgütü ve kişiyi hürriyetinden yoksun kılma gibi suçlardan verilen mahkûmiyetleri temyizen incelemiştir. Sanıklardan biri, kendisinin de cebir ve şiddet altında olduğunu ileri sürmüştür. Daire, TCK m. 28'i açıklarken cebir kavramının TCK m. 108'in gerekçesine göre kasten yaralamadan farkını anlatmıştır: cebirde kişi fiziki güçle belirli bir davranışa zorlanır. Failin sorumsuz sayılabilmesi için maruz kaldığı cebir veya tehdidin karşı koyamayacağı ve kurtulamayacağı ağırlıkta olması gerektiğini vurgulamıştır. Sanığın karşı koyamayacağı cebir ve şiddet sonucu suç işleyip işlemediğinin ve TCK m. 28 kapsamında kalıp kalmadığının değerlendirilmediğini, hükmün eksik inceleme ve yetersiz gerekçeyle kurulduğunu belirterek (diğer bozma nedenleriyle birlikte) hükümleri bozmuştur. Karar, TCK m. 108'deki cebir kavramını ve TCK m. 28 ile ilişkisini anlamak için faydalıdır.
sorular:
  - soru: |
      Kadına karşı işlenen, hayata yönelik saldırı tehdidinde (TCK m. 106/1) ceza bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Cezanın alt sınırı dokuz aydan az olamaz"
      - "Cezanın alt sınırı iki yıldan az olamaz"
      - "Suç yalnız şikâyet üzerine kovuşturulur"
      - "Ceza adlî para cezasına çevrilmelidir"
    dogru: 0
    aciklama: |
      TCK m. 106/1'e 2022'de eklenen cümleye göre bu suçun kadına karşı işlenmesi hâlinde cezanın alt sınırı dokuz aydan az olamaz. Temel ceza altı aydan iki yıla kadardır. Hayata yönelik tehdit resen takip edilir.
  - soru: |
      Ali, komşusu Veli'ye "bahçeni yıkıp malvarlığını mahvederim" diyerek büyük bir zarar vereceğini bildirir. Ali'nin fiili hangi hükme uyar ve nasıl takip edilir?
    siklar:
      - "TCK m. 106/1'in son cümlesi; mağdurun şikâyeti üzerine iki aydan altı aya hapis veya adlî para cezası"
      - "TCK m. 106/2; resen, iki yıldan yedi yıla hapis"
      - "TCK m. 107/1 şantaj; resen, bir yıldan üç yıla hapis"
      - "Fiil suç oluşturmaz"
    dogru: 0
    aciklama: |
      Malvarlığı itibarıyla büyük zarar bildirmek TCK m. 106/1'in son cümlesinde düzenlenir ve mağdurun şikâyeti üzerine iki aydan altı aya kadar hapis veya adlî para cezası öngörülür. Hiçbir nitelikli hâl ve yarar sağlama amacı yoktur; bu nedenle TCK m. 106/2 veya TCK m. 107 uygulanmaz.
  - soru: |
      Güncel metne göre nitelikli tehdidin (TCK m. 106/2) cezası nedir?
    siklar:
      - "Altı aydan iki yıla kadar hapis"
      - "İki yıldan beş yıla kadar hapis"
      - "İki yıldan yedi yıla kadar hapis"
      - "Beş yıldan on yıla kadar hapis"
    dogru: 2
    aciklama: |
      4.6.2025 tarihli 7550 sayılı Kanunla TCK m. 106/2'deki "beş yıla" ibaresi "yedi yıla" olarak değiştirilmiştir; güncel ceza iki yıldan yedi yıla kadar hapistir. İki yıldan beş yıla kadar ceza eski metindir.
  - soru: |
      Aşağıdakilerden hangisi TCK m. 106/2'de sayılan nitelikli tehdit hâllerinden biri değildir?
    siklar:
      - "Birden fazla kişi tarafından birlikte işlenmesi"
      - "Kişinin kendisini tanınmayacak hâle koyarak işlemesi"
      - "Kamu görevinin sağladığı nüfuzun kötüye kullanılması"
      - "Var olan veya var sayılan suç örgütlerinin korkutucu gücünden yararlanılması"
    dogru: 2
    aciklama: |
      TCK m. 106/2 dört hâli sayar: silahla, tanınmayacak hâle girerek/imzasız mektupla/özel işaretlerle, birden fazla kişi tarafından birlikte ve suç örgütlerinin korkutucu gücünden yararlanarak. Kamu görevinin nüfuzunu kötüye kullanma bunlar arasında yer almaz.
  - soru: |
      Hasan, Mehmet'e "100.000 TL vermezsen seni öldürürüm" der. Mehmet korkarak parayı teslim eder. Hasan'ın fiili hangi suçtur?
    siklar:
      - "TCK m. 107/1 şantaj"
      - "Yalnızca TCK m. 106/1 tehdit"
      - "TCK m. 148 yağma"
      - "TCK m. 108 cebir"
    dogru: 2
    aciklama: |
      Hayata yönelik saldırı bildirerek bir malın teslimine zorlama TCK m. 148/1'deki yağmadır. Şantaj, tehdit konusu şeref ve saygınlığa zarar verecek hususların açıklanması veya hakkın haksız çıkar için araç yapılması olduğunda söz konusudur. Burada cebir kullanılmamış, mal teslim edilmiştir.
  - soru: |
      Selin, eski sevgilisine "bana 50.000 TL vermezsen özel görüntülerini ailene gönderirim" diye yazar. Selin'in fiili hangi suçu oluşturur?
    siklar:
      - "TCK m. 148 yağma"
      - "TCK m. 107/2 şantaj"
      - "TCK m. 106/2 nitelikli tehdit"
      - "TCK m. 108 cebir"
    dogru: 1
    aciklama: |
      Yarar sağlamak maksadıyla bir kişinin şeref veya saygınlığına zarar verecek hususların açıklanacağı tehdidi TCK m. 107/2'de şantaj olarak düzenlenmiştir. Tehdit konusu hayata veya vücuda yönelik bir saldırı olmadığından yağma oluşmaz. Fiilde silah veya cebir de yoktur.
  - soru: |
      TCK m. 107'deki şantaj suçunun cezası hangisidir?
    siklar:
      - "Altı aydan iki yıla kadar hapis"
      - "Bir yıldan üç yıla kadar hapis ve beşbin güne kadar adlî para cezası"
      - "İki yıldan yedi yıla kadar hapis"
      - "Bir yıldan üç yıla kadar hapis veya adlî para cezası"
    dogru: 1
    aciklama: |
      TCK m. 107/1 hapis ve adlî para cezasını birlikte öngörür: bir yıldan üç yıla kadar hapis ve beşbin güne kadar adlî para cezası. TCK m. 107/2 de birinci fıkraya göre cezaya bağlanır. "Veya" ile seçimlik ceza öngörülmemiştir.
  - soru: |
      Nihat, gerçekten borçlu olan Orhan'a "borcunu ödemezsen seni icraya veririm" der. Nihat'ın sorumluluğu bakımından doğru olan hangisidir?
    siklar:
      - "TCK m. 107/1'den şantaj suçu işlemiştir"
      - "TCK m. 106/1'den tehdit suçu işlemiştir"
      - "Hakkını kullandığından ceza verilmez"
      - "TCK m. 148'den yağmaya teşebbüs suçu işlemiştir"
    dogru: 2
    aciklama: |
      Gerçek bir alacağı için icra takibi yapacağını bildirmek hakkın kullanılmasıdır ve hakkını kullanana ceza verilmez (TCK m. 26/1). Şantaj için hakkın haksız bir çıkar ya da kanuna aykırı bir şey için araç yapılması gerekir. Böyle bir amaç yoktur.
  - soru: |
      Kemal, sözleşmeye dayalı gerçek alacağını tahsil için borçlu Rıza'ya silahını gösterip "yarın ödemezsen vururum" der. Rıza korkup parayı verir. Kemal'in sorumluluğu bakımından hangisi doğrudur?
    siklar:
      - "Yağma suçundan sorumludur, çünkü mal teslim edilmiştir"
      - "Yağma değil, TCK m. 150/1 uyarınca tehdit hükümleri uygulanır"
      - "Hukuki alacak bulunduğundan hiçbir suç oluşmaz"
      - "Yalnızca TCK m. 107/1 şantajı oluşur"
    dogru: 1
    aciklama: |
      TCK m. 150/1'e göre bir hukuki ilişkiye dayanan alacağı tahsil amacıyla tehdit veya cebir kullanıldığında yağma değil, tehdit veya kasten yaralama hükümleri uygulanır. Alacağın varlığı fiili suç olmaktan çıkarmaz; silah gösterilmesi nedeniyle nitelikli tehdit gündeme gelir (TCK m. 106/2).
  - soru: |
      TCK m. 108 uyarınca cebir suçunda ceza nasıl belirlenir?
    siklar:
      - "Kasten yaralama cezası üçte birinden yarısına kadar artırılır"
      - "Kasten yaralama cezası iki kat artırılır"
      - "Tehdit cezası yarı oranında artırılır"
      - "Sabit olarak iki yıldan beş yıla kadar hapis verilir"
    dogru: 0
    aciklama: |
      TCK m. 108/1, cebir kullanılması hâlinde kasten yaralama suçundan verilecek cezanın üçte birinden yarısına kadar artırılacağını söyler. Bu nedenle TCK m. 86'daki ceza değişiklikleri cebrin cezasını da etkiler.
  - soru: |
      Mert, borcunu ödemeyen Selim'i korkutmak amacıyla arabasının camını kırar ve yaptığı tehdidi bildirir. Mert'in sorumluluğu bakımından hangisi doğrudur?
    siklar:
      - "Yalnızca tehdit suçundan ceza alır, mala zarar verme tehdit içinde erir"
      - "Tehdit amacıyla malvarlığına zarar verdiği için ayrıca o suçtan da ceza verilir"
      - "Yalnızca mala zarar verme suçundan ceza alır"
      - "Bileşik suç kurulur ve tek ceza verilir"
    dogru: 1
    aciklama: |
      TCK m. 106/3'e göre tehdit amacıyla kasten öldürme, kasten yaralama veya malvarlığına zarar verme suçunun işlenmesi hâlinde ayrıca bu suçlardan dolayı ceza verilir. Mala zarar verme suçunun kovuşturulması ise TCK m. 151/1 uyarınca mağdurun şikâyetine bağlıdır.
  - soru: |
      Bir sanık hakkında aynı mağdura karşı silahla tehdit (TCK m. 106/2) ve basit kasten yaralama suçlarından dava açılmış, yargılamada silahla tehditten beraat kararı verilmiştir. Yargıtay 1. Ceza Dairesinin yaklaşımına göre basit kasten yaralama yönünden ne yapılmalıdır?
    siklar:
      - "Uzlaştırma yapılmaksızın mahkûmiyet kurulmalıdır"
      - "Silahla tehdit uzlaştırmaya engel olmaktan çıktığı için dosya uzlaştırma bürosuna gönderilmelidir"
      - "Basit yaralama da resen beraat ettirilmelidir"
      - "Basit yaralama suçu şikâyet olsa bile hiçbir hâlde uzlaştırmaya tabi değildir"
    dogru: 1
    aciklama: |
      Basit yaralama (TCK m. 86/2) şikâyete bağlı ve uzlaştırma kapsamındadır. Uzlaştırma kapsamındaki suçun kapsama girmeyen başka bir suçla birlikte aynı mağdura karşı işlenmesi uzlaşmayı engeller (CMK m. 253/3). Silahla tehditten beraat edilince bu engel kalkar ve yaralama yönünden uzlaştırma işlemleri yapılmalıdır; kovuşturma evresinde dosya uzlaştırma bürosuna CMK m. 254 uyarınca gönderilir.
olaylar:
  - olay: |
      Müteahhit Murat (45), kendisinden daire satın alan Kenan'dan (40) sözleşmeden kalan 400.000 TL bakiye bedeli alamamıştır. Murat, arkadaşı Aydın'ı da yanına alarak Kenan'ın işyerine gider. Aydın kapıda durup kimsenin girip çıkmasına izin vermez. Murat belindeki silahı çıkarıp masaya koyar ve "yarına kadar borcunu ödemezsen seni bacaklarından vururum" der. Kenan'ı daha da korkutmak için silahın kabzasıyla masadaki dizüstü bilgisayarı kırar. Kenan polise başvurur.

      1. Murat'ın fiili yağma mıdır, yoksa başka bir suç mudur?
      2. Fiilde hangi nitelikli tehdit hâlleri oluşmuştur ve ceza aralığı nedir?
      3. Bilgisayarın kırılması bakımından ayrıca sorumluluk doğar mı?
      4. Kovuşturma biçimi ve uzlaştırma bakımından durum nedir?
    olcut:
      - {tespit: "Sözleşmeye dayanan alacağın tahsili amacı nedeniyle yağma yerine tehdit hükümlerinin uygulanması", puan: 25, madde: "TCK m. 150/1"}
      - {tespit: "Silahın gösterilmesi ve masaya konması nedeniyle silahla nitelikli tehdit", puan: 20, madde: "TCK m. 106/2"}
      - {tespit: "Aydın'ın katılımıyla birden fazla kişi tarafından birlikte işleme ve 2 yıldan 7 yıla ceza aralığı", puan: 15, madde: "TCK m. 106/2"}
      - {tespit: "Tehdit amacıyla malvarlığına zarar verme nedeniyle ayrıca mala zarar verme cezası", puan: 25, madde: "TCK m. 106/3"}
      - {tespit: "Mala zarar verme suçunun şikâyete bağlılığı", puan: 5, madde: "TCK m. 151/1"}
      - {tespit: "Nitelikli tehdidin resen takibi ve uzlaştırma kapsamında olmaması", puan: 10, madde: "CMK m. 253"}
    cozum: |
      **Nitelendirme:** Murat, Kenan'a silahla gelecek bir saldırı bildirmiştir. Amacı sözleşmeden doğan gerçek alacağını tahsil etmektir. Yani fiil yağma değil, alacak tahsili amacıyla işlenmiş tehdittir. Bilgisayarın kırılması ayrı bir malvarlığına zarar verme fiilidir.

      **Hukuki sorunlar:** (1) Yağma mı, tehdit mi? (2) Nitelikli tehdit hâlleri nelerdir? (3) Mala zarar verme ayrıca cezalandırılır mı? (4) Kovuşturma ve uzlaştırma.

      **İlgili hükümler:** TCK m. 148/1 mal teslimine zorlamayı yağma sayar. TCK m. 150/1 ise bir hukuki ilişkiye dayanan alacağı tahsil amacıyla tehdit veya cebir kullanılması hâlinde yalnız tehdit ya da kasten yaralama hükümlerinin uygulanacağını belirtir. TCK m. 106/2'ye göre tehdit silahla veya birden fazla kişi tarafından birlikte işlenirse iki yıldan yedi yıla kadar hapis verilir. TCK m. 106/3 tehdit amacıyla malvarlığına zarar verilmesini ayrıca cezalandırır. CMK m. 253 uzlaştırma kapsamını düzenler.

      **Değerlendirme:** Kenan'ın borcu bir satış sözleşmesinden doğduğu için alacak gerçek bir hukuki ilişkiye dayanır. Murat'ın borcu ödetmek için tehdit etmesi, yağma değil TCK m. 150/1 uyarınca tehdit hükümlerine tabidir. Fiil nitelikli tehdittir: silah gösterilip masaya konmuştur (TCK m. 106/2-a). Aydın'ın da kapıyı tutarak fiile katılması, tehdidin birden fazla kişi tarafından birlikte işlenmesi anlamına gelir (TCK m. 106/2-c). Nitelikli hâllerin birden fazla bulunması, hâkimin temel cezayı alt sınırdan uzaklaşarak belirlemesinde dikkate alınabilir; her iki hâl de aynı ceza aralığını (2-7 yıl) kullanır.

      Bilgisayarın kırılması tehdit amacıyla malvarlığına zarar vermedir. TCK m. 106/3 uyarınca Murat ayrıca mala zarar verme suçundan (TCK m. 151/1) da cezalandırılır; bu suçun kovuşturulması mağdurun şikâyetine bağlıdır. Kenan polise başvurduğundan şikâyet koşulu genellikle sağlanmış olur, ancak şikâyetin zarar verme fiilini de kapsayıp kapsamadığına bakılmalıdır.

      Nitelikli tehdit TCK m. 106/2 kapsamında olup resen soruşturulur. CMK m. 253/1-b yalnız TCK m. 106'nın birinci fıkrasını uzlaştırmaya alır; nitelikli tehdit uzlaştırma kapsamında değildir. Uzlaştırma kapsamındaki bir suç kapsama girmeyen suçla birlikte işlenmişse uzlaşma uygulanmayacağından (CMK m. 253/3) mala zarar verme bakımından da uzlaştırma yoluna gidilmez.

      **Sonuç:** Murat yağmadan değil, TCK m. 150/1 sevkiyle silahla ve birlikte işlenen nitelikli tehditten (TCK m. 106/2) ve ayrıca mala zarar vermeden sorumludur. Aydın da birlikte işlemeden dolayı tehdit suçunun faili olarak değerlendirilir. Suç resen kovuşturulur ve uzlaştırma uygulanmaz.
  - olay: |
      İş adamı Taner (35), rakip firma sahibi Zeki'ye şu mesajı gönderir: "Sahte fatura düzenlediğini gösteren belgelerim var. Basına vermemi istemiyorsan 200.000 TL öde." Zeki parayı vermez ve polise gider.

      Taner, ayrıca gerçekten kendisine 20.000 TL borcu olan komşusu Selçuk'a "borcunu ödemezsen seni icraya veririm" der.

      Üçüncü olarak Taner, Ufuk'a "bana 30.000 TL vermezsen çocuğunu öldürürüm" der. Ufuk korkarak parayı teslim eder.

      1. Taner'in Zeki'ye mesajı hangi suçu oluşturur?
      2. Selçuk'a söylenen sözler suç mudur?
      3. Ufuk'a karşı fiil hangi suçtur ve neden Zeki'ye karşı fiilden farklıdır?
      4. Zeki'nin parayı vermemesi sorumluluğu etkiler mi?
    olcut:
      - {tespit: "Zeki'ye yönelik mesajda şeref ve saygınlığa zarar verecek hususların açıklanacağı tehdidiyle yarar sağlama amacı nedeniyle şantaj", puan: 25, madde: "TCK m. 107/2"}
      - {tespit: "Şantajın cezası ve hapis ile adlî para cezasının birlikte verilmesi", puan: 10, madde: "TCK m. 107/1"}
      - {tespit: "Gerçek alacak nedeniyle icraya verme beyanının hakkın kullanılması olması", puan: 20, madde: "TCK m. 26/1"}
      - {tespit: "Ufuk'a karşı yakının hayatına yönelik saldırı tehdidiyle mal teslimi nedeniyle yağma", puan: 25, madde: "TCK m. 148/1"}
      - {tespit: "Kötülüğün niteliği (hayat ve vücut tehdidi) bakımından yağma ile şantaj ayrımı", puan: 10, madde: "TCK m. 106/1"}
      - {tespit: "Şantaj için şikâyet aranmaması, resen soruşturma", puan: 10, madde: "TCK m. 107/2"}
    cozum: |
      **Nitelendirme:** Üç ayrı mağdura karşı üç ayrı fiil vardır. Zeki'ye karşı fiil, şeref ve saygınlığa zarar verecek hususun açıklanmasına bağlı yarar talebidir. Selçuk'a karşı fiil, gerçek bir alacak nedeniyle başvuru yoluna gitme bildirimidir. Ufuk'a karşı fiil ise yakının hayatına yönelik tehdit ile mal teslimidir.

      **Hukuki sorunlar:** (1) Şeref ve saygınlığa yönelik tehdit hangi suçtur? (2) Hak kullanımı bildirimi suç oluşturur mu? (3) Yakının hayatına tehdit ve mal talebi hangi suçtur? (4) Mağdurun ödememesi sonucu değiştirir mi?

      **İlgili hükümler:** TCK m. 107/2'ye göre kendisine veya başkasına yarar sağlamak maksadıyla bir kişinin şeref veya saygınlığına zarar verecek nitelikteki hususların açıklanacağı veya isnat edileceği tehdidinde bulunulması hâlinde şantaj cezası verilir; ceza bir yıldan üç yıla hapis ve beşbin güne kadar adlî para cezasıdır (TCK m. 107/1). TCK m. 26/1 hakkını kullanana ceza verilmeyeceğini söyler. TCK m. 148/1, kişinin veya yakınının hayatına yönelik saldırı bildirerek bir malın teslimine mecbur kılmayı yağma sayar.

      **Değerlendirme:** Taner, Zeki'ye sahte fatura belgelerini basına vermekle tehdit etmiş ve karşılığında para istemiştir. Açıklanacak husus Zeki'nin şeref ve saygınlığına zarar verecek niteliktedir, Taner'in amacı kendisine yarar sağlamaktır. Tehdit hayat veya vücuda yönelik olmadığından yağma değil, TCK m. 107/2 şantajı oluşur. Açıklanacak hususun doğru olup olmaması suçun varlığını değiştirmez. Zeki'nin parayı vermemesi bu değerlendirmeyi etkilemez: şantajda mağdurun yararı sağlaması suçun oluşması için aranan bir şart değildir. Taner'in bildirimi mağdura ulaşmıştır.

      Selçuk'a karşı Taner'in sözleri gerçek bir alacağa dayanan hak kullanımının duyurusudur. Taner'in amacı haksız çıkar sağlamak veya kanuna aykırı bir şeye zorlamak değildir; sadece hakkını yasal yoldan arayacağını bildirmektedir. Bu nedenle TCK m. 26/1 uyarınca suç oluşmaz; şantaj ya da tehdit söz konusu değildir.

      Ufuk'a karşı Taner, yakınının hayatına yönelik bir saldırı bildirmiş ve karşılığında mal (para) talep etmiştir. Ufuk korkarak parayı teslim etmiştir. Bu fiil TCK m. 148/1'deki yağmadır. Zeki'ye karşı fiilden farkı kötülüğün niteliğidir: hayat ve vücut bütünlüğüne yönelik saldırı bildirimi yağmayı, şeref ve saygınlığa zarar verecek hususların açıklanması şantajı oluşturur. Taner'in Ufuk'a karşı alacağının bulunmadığı varsayıldığından TCK m. 150/1 uygulanmaz.

      **Sonuç:** Taner, Zeki'ye karşı TCK m. 107/2 şantajdan (bir yıldan üç yıla hapis ve beşbin güne kadar adlî para cezası), Ufuk'a karşı TCK m. 148/1 yağmadan sorumludur. Selçuk'a söylenen sözler hakkın kullanılması olduğundan suç oluşturmaz.
kartlar:
  - on: "TCK m. 106/1'in temel şeklinin cezası nedir?"
    arka: "Kişinin veya yakınının hayatına, vücut ya da cinsel dokunulmazlığına saldırı tehdidi: 6 aydan 2 yıla hapis. Kadına karşı alt sınır 9 aydan az olamaz."
  - on: "Malvarlığı veya sair kötülük tehdidinin cezası ve takibi?"
    arka: "Mağdurun şikâyeti üzerine 2 aydan 6 aya hapis veya adlî para cezası (TCK m. 106/1)."
  - on: "Nitelikli tehdit hâlleri ve cezası?"
    arka: "Silahla; tanınmayacak hâlde/imzasız mektupla/özel işaretle; birden fazla kişiyle; suç örgütü gücüyle. 2 yıldan 7 yıla hapis (TCK m. 106/2)."
  - on: "📌 7550 sayılı Kanun TCK m. 106'da neyi değiştirdi?"
    arka: "Malvarlığı tehdidine 'iki aydan' alt sınırı ekledi; nitelikli tehditte üst sınırı 5 yıldan 7 yıla çıkardı."
  - on: "TCK m. 106/3 ne söyler?"
    arka: "Tehdit amacıyla kasten öldürme, kasten yaralama veya malvarlığına zarar verme işlenirse ayrıca bu suçlardan ceza verilir."
  - on: "Şantajın iki biçimi nedir?"
    arka: "TCK m. 107/1: hakkı olan veya yükümlü olduğu şeyi yapma bildirimiyle zorlama; TCK m. 107/2: yarar amacıyla şeref ve saygınlığa zarar verecek hususları açıklama tehdidi."
  - on: "Şantajın cezası nedir?"
    arka: "Bir yıldan üç yıla kadar hapis ve beşbin güne kadar adlî para cezası (TCK m. 107/1)."
  - on: "'Seni icraya veririm' demek suç mudur?"
    arka: "Gerçek bir alacak için ise hakkın kullanılmasıdır, suç değildir (TCK m. 26/1). Haksız çıkar için araç yapılırsa şantaj olabilir."
  - on: "Cebirde ceza nasıl belirlenir?"
    arka: "Kasten yaralama suçundan verilecek ceza üçte birinden yarısına kadar artırılır (TCK m. 108)."
  - on: "Yağma ile şantajı ayıran nedir?"
    arka: "Hayat, vücut, cinsel dokunulmazlık veya büyük malvarlığı zararı tehdidiyle mal teslimi yağma (TCK m. 148); şeref ve saygınlığa zarar tehdidiyle yarar sağlama şantaj (TCK m. 107/2)."
  - on: "Alacağı tahsil için tehdit veya cebir kullanana hangi hüküm uygulanır?"
    arka: "Gerçek bir hukuki ilişkiye dayanan alacakta yağma değil, tehdit veya kasten yaralama hükümleri uygulanır (TCK m. 150/1)."
  - on: "Tehditte uzlaştırma kapsamı nedir?"
    arka: "Yalnız TCK m. 106'nın birinci fıkrası uzlaştırma kapsamındadır (CMK m. 253/1-b); nitelikli tehdit (TCK m. 106/2) kapsamda değildir."
