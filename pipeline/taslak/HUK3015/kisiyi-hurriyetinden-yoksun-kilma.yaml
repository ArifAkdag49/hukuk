    ozet: |
      Sanıklar para istemek amacıyla iki katılanı yaklaşık iki üç saat alıkoymuş; katılanlardan biri alıkonulduğu sırada darbedilmiştir. Bölge adliye mahkemesi iki katılana karşı ayrı ayrı kişiyi hürriyetinden yoksun kılma hükmü kurmuş ve her ikisi bakımından TCK m. 110 uyarınca indirim yapmıştır. Yargıtay 6. Ceza Dairesi, sağlık raporuna göre darbedilen katılanın basit tıbbi müdahaleyle giderilebilecek şekilde yaralandığını belirtmiş ve bu katılana yönelik eylemde TCK m. 110 uygulanmasını hukuka aykırı bulmuştur. Böylece "mağdurun şahsına zararı dokunmaksızın" şartının basit yaralanmayla bile bozulacağı kabul edilmiş, ilgili hüküm bozulmuştur. Diğer katılana yönelik hürriyet hükmü ise onanmıştır.
  - id: "1229999400"
    ozet: |
      Suça sürüklenen çocuk, 15 yaşından küçük mağdurları fotoğraflarını ailelerine göstermekle tehdit ederek ya da oyunda değerli bir şey vereceğini söyleyerek cami tuvaletine götürmüş ve cinsel amaçla alıkoymuştur. Bölge adliye mahkemesi, bozma sonrası, her mağdur için ayrı ayrı TCK m. 109/2, 109/3-f ve 109/5 uyarınca hüküm kurmuştur. Yargıtay 8. Ceza Dairesi eylemlerin cinsel amaçlı kişiyi hürriyetinden yoksun kılma suçunu oluşturduğuna ilişkin kabulü isabetli bulmuş; ancak hükmün açıklanmasının geri bırakılması kararının açıklanması sonrası cezada kazanılmış hak uygulanmasını hukuka aykırı sayarak bölge adliye mahkemesinin kararını bozmuştur. Karar, hile, tehdit, çocuk mağdur ve cinsel amacın aynı olayda birlikte TCK m. 109'un fıkralarını nasıl devreye soktuğunu gösterir.
sorular:
  - soru: |
      TCK m. 109/1'deki temel şekil için kanunun öngördüğü hapis cezası aşağıdakilerden hangisidir?
    siklar:
      - "Altı aydan iki yıla kadar"
      - "Bir yıldan beş yıla kadar"
      - "İki yıldan yedi yıla kadar"
      - "Üç yıldan on yıla kadar"
    dogru: 1
    aciklama: |
      Kanun temel şekil için bir yıldan beş yıla kadar hapis öngörür (TCK m. 109/1). İki yıldan yedi yıla kadar olan ceza cebir, tehdit veya hile kullanılan şekle aittir (TCK m. 109/2).
  - soru: |
      Aşağıdakilerden hangisi TCK m. 109/3'teki nitelikli hâllerden biri **değildir**?
    siklar:
      - "Silahla işlenmesi"
      - "Boşandığı eşe karşı işlenmesi"
      - "Suçun gece vakti işlenmesi"
      - "Birden fazla kişi tarafından birlikte işlenmesi"
    dogru: 2
    aciklama: |
      TCK m. 109/3'te silahla, birden fazla kişiyle birlikte, kamu görevi nedeniyle, kamu görevinin nüfuzunun kötüye kullanılmasıyla, üstsoy, altsoy veya eşe ya da boşandığı eşe karşı ve çocuk veya savunmasız kişiye karşı işlenmesi sayılmıştır. Gece vakti bu maddede nitelikli hâl değildir.
  - soru: |
      Ali, kendisini hürriyetinden yoksun kılan Mehmet'in odasından kaçmak için kapıyı iterek açıyor. Alıkoyma halen sürmektedir. Ali'nin bu davranışının hukuki dayanağı aşağıdakilerden hangisi olabilir?
    siklar:
      - "Zorunluluk hâli yoktur; her durumda cezalandırılır"
      - "Haksız saldırı sürdüğü için meşru savunma (TCK m. 25/1)"
      - "Mağdurun hukuka aykırı bir rızası vardır"
      - "Haksız tahrik hükümleri (TCK m. 29)"
    dogru: 1
    aciklama: |
      Kişiyi hürriyetinden yoksun kılma kesintisiz suç olduğundan haksız saldırı alıkoyma sürdüğü müddetçe devam eder. Mağdur bu süre içinde TCK m. 25/1'e göre meşru savunma hakkını kullanabilir.
  - soru: |
      Zeynep, 1 Mart günü kaçırılıp bir evde tutulmuş, 20 Mart günü kendi çabasıyla kaçarak kurtulmuştur. TCK m. 109 suçunda dava zamanaşımı hangi günden itibaren işlemeye başlar?
    siklar:
      - "1 Mart, yani alıkoyma fiilinin başladığı gün"
      - "20 Mart, yani kesintinin gerçekleştiği gün"
      - "Soruşturmanın başladığı gün"
      - "Şikâyet tarihi"
    dogru: 1
    aciklama: |
      Kesintisiz suçlarda zamanaşımı kesintinin gerçekleştiği günden işlemeye başlar (TCK m. 66/6). Zeynep'in kurtulduğu gün 20 Mart'tır.
  - soru: |
      Kemal, tanıdığı Selim'in Aylin'i bir evde alıkoyduğunu öğrenir ve alıkoyma sürerken Aylin'in kaçmaması için kapıda nöbet tutar. Kemal'in hukuki durumu hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Suç tamamlandığı için Kemal'in sorumluluğu doğmaz"
      - "Temadi sürdüğü için Kemal suça müşterek fail olarak katılmış sayılır"
      - "Kemal ancak suçu bildirmeme suçundan sorumlu olur"
      - "Kemal'in sorumluluğu Aylin'in şikâyetine bağlıdır"
    dogru: 1
    aciklama: |
      Kesintisiz suç sürdüğü için sonradan katılma mümkündür. Suçun icrasına birlikte katılan kişi müşterek fail sayılır (TCK m. 37/1). Suç şikâyete bağlı değildir.
  - soru: |
      Hasan, annesinin evinde yaşayan kızı Pınar'ı (17 yaşında) odaya kilitleyip üç gün alıkoyuyor ve odadan çıkmasına izin vermiyor. Pınar çocuk olduğu için aşağıdakilerden hangisi uygulanır?
    siklar:
      - "Yalnız TCK m. 109/1 uygulanır; çocuk olması önemsizdir"
      - "TCK m. 109/3-f uyarınca ceza bir kat artırılır"
      - "TCK m. 109/4 uyarınca adli para cezası verilir"
      - "Fiil suç olmaz, çünkü Hasan velidir"
    dogru: 1
    aciklama: |
      TCK m. 6/1-b'ye göre çocuk 18 yaşını doldurmamış kişidir. Çocuğa karşı işlenmesi TCK m. 109/3-f'ye göre nitelikli hâldir ve ceza bir kat artırılır. Pınar Hasan'ın altsoyu olduğu için TCK m. 109/3-e de gerçekleşir; ancak artırım yine bir kattır. Üstelik odaya kilitleme hukuka uygun bir terbiye hakkı değildir; kanun hükmü veya hak kullanımı yoktur.
  - soru: |
      Aşağıdakilerden hangisi TCK m. 110'daki etkin pişmanlık için aranan şartlardan biridir?
    siklar:
      - "Mağdurun serbest bırakılmasını kolluğun sağlamış olması"
      - "Soruşturmaya başlanmadan önce serbest bırakma"
      - "Mağdurun şikâyetten vazgeçmesi"
      - "Failin mağdura tazminat ödemesi"
    dogru: 1
    aciklama: |
      TCK m. 110/1'e göre fail soruşturmaya başlanmadan önce, mağdurun şahsına zararı dokunmaksızın, onu kendiliğinden güvenli bir yerde serbest bırakmalıdır. Kolluğun sağladığı kurtarma kendiliğinden bırakma değildir; şikâyet ve tazminat aranan şart değildir.
  - soru: |
      Mehmet, Ayşe'yi kendi evinde iki gün tutar. Üçüncü gün kimse bir şey öğrenmeden Ayşe'yi güvenli bir caddede bırakır. Alıkoyma sırasında Ayşe'yi bir kez tokatlamış ve sağlık raporunda basit tıbbi müdahaleyle giderilebilir yaralanma saptanmıştır. Mehmet hakkında TCK m. 110 bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "TCK m. 110 uygulanır, çünkü soruşturma başlamamıştır"
      - "TCK m. 110 uygulanmaz, çünkü mağdurun şahsına zarar verilmiştir"
      - "TCK m. 110 uygulanır, çünkü bırakılan yer güvenlidir"
      - "TCK m. 110 yerine TCK m. 62 zorunlu uygulanır"
    dogru: 1
    aciklama: |
      TCK m. 110, mağdurun şahsına zararı dokunmaksızın serbest bırakmayı arar. Yargıtay, basit tıbbi müdahaleyle giderilebilir bir yaralanmanın bile bu şartı ortadan kaldırdığını kabul eder. Diğer şartlar gerçekleşse de indirim yapılamaz.
  - soru: |
      Fail, mağduru araçta alıkoyarken mağdurun duyularından birinin işlevinin sürekli zayıflamasına neden olacak biçimde yaralamıştır. Bu durumda TCK m. 109/6 bakımından hangisi doğrudur?
    siklar:
      - "Yaralama cebir unsuru içinde erir; ayrıca ceza verilmez"
      - "Ayrıca kasten yaralamaya ilişkin hükümler uygulanır"
      - "Yalnız TCK m. 110 uygulanır"
      - "Fiil TCK m. 109/4 kapsamında adli para cezası gerektirir"
    dogru: 1
    aciklama: |
      Duyuların işlevinin sürekli zayıflaması TCK m. 87/1-a'da sayılan ağırlaşmış yaralama hâlidir. TCK m. 109/6'ya göre bu hâllerin gerçekleşmesinde ayrıca kasten yaralama hükümleri uygulanır.
  - soru: |
      Mehmet, iş görüşmesine gitmekte olan Ali'yi eski bir alacak nedeniyle odaya kilitliyor. Ali görüşmeyi kaçırdığı için önemli bir sözleşmeyi kaybediyor. Aşağıdakilerden hangisi TCK m. 109/4 bakımından doğrudur?
    siklar:
      - "Ayrıca bin güne kadar adli para cezası verilir"
      - "Ceza yarı oranında artırılır"
      - "Fiil yalnız hukuk davasının konusudur"
      - "Ceza bir kat artırılır"
    dogru: 0
    aciklama: |
      Suçun mağdurun ekonomik bakımdan önemli bir kaybına neden olması hâlinde ayrıca bin güne kadar adli para cezasına hükmolunur (TCK m. 109/4). Yarı oranında artırım cinsel amaç içindir (TCK m. 109/5); bir kat artırım TCK m. 109/3 içindir.
  - soru: |
      TCK m. 109 suçunun uzlaştırma ve kovuşturma bakımından durumu aşağıdakilerden hangisidir?
    siklar:
      - "Şikâyete bağlıdır ve uzlaştırma kapsamındadır"
      - "Re'sen soruşturulur ve CMK m. 253/1'deki uzlaştırma listesinde yer almaz"
      - "Yalnız mağdurun şikâyetiyle kovuşturulur"
      - "Nitelikli hâlleri uzlaştırmaya tabidir"
    dogru: 1
    aciklama: |
      TCK m. 109 şikâyete bağlı değildir ve CMK m. 253/1'deki liste içinde sayılmamıştır. Bu nedenle uzlaştırma kapsamına girmez.
  - soru: |
      Hasan, Ayşe'yi tehditle bağ evinde alıkoymuştur. Polis, Ayşe'nin yakınlarının başvurusu üzerine evi kuşatır; Hasan bunun üzerine Ayşe'yi serbest bırakır. TCK m. 110 hakkında hangisi doğrudur?
    siklar:
      - "Uygulanır, çünkü sonuçta mağdur serbest kalmıştır"
      - "Uygulanmaz, çünkü serbest bırakma kendiliğinden değildir"
      - "Uygulanır, çünkü Ayşe'ye zarar verilmemiştir"
      - "Uygulanmaz, çünkü tehdit varsa TCK m. 110 hiç uygulanamaz"
    dogru: 1
    aciklama: |
      TCK m. 110 serbest bırakmanın kendiliğinden olmasını arar. Kolluk müdahalesi nedeniyle çaresiz kalarak bırakmak kendiliğinden değildir. Cebir veya tehdit kullanılmış olması tek başına TCK m. 110'u dışlamaz.
olaylar:
  - olay: |
      Kemal, boşandığı eşi Seda ile barışmak istemektedir. Bir cumartesi, "sadece konuşalım" diyerek Seda'yı arabasına alır. Seda arabadan inmek isteyince Kemal kapıları kilitler, "bu gece buradan inemezsin" der ve Seda'nın telefonunu elinden alır. Ardından Seda'yı şehir dışındaki yayla evine götürür. Kemal'i bekleyen arkadaşı Orhan, Seda'nın zorla getirildiğini öğrenmesine rağmen yayla evinin kapısının önünde Seda kaçmasın diye iki gece nöbet tutar. Seda'ya fiziki hiçbir zarar verilmemiştir. Üçüncü gün öğleden sonra, kimse Seda'yı aramamış ve polise bir başvuru yapılmamışken, Kemal pişman olarak Seda'yı şehir merkezindeki evinin önüne kendisi bırakır.

      1. Kemal'in sorumluluğunu nitelikli hâller dahil değerlendiriniz.
      2. Orhan'ın hukuki durumunu açıklayınız.
      3. TCK m. 110 uygulanır mı?
    olcut:
      - {tespit: "Seçimlik hareket ve hukuka aykırılık: Seda'nın hareket hürriyeti engellenmiş, hukuka uygunluk nedeni yok", puan: 15, madde: "TCK m. 109/1"}
      - {tespit: "Hile kullanıldığı için temel ceza TCK m. 109/2 üzerinden belirlenir", puan: 20, madde: "TCK m. 109/2"}
      - {tespit: "Boşandığı eşe karşı işlenmesi nedeniyle bir kat artırım; Orhan'ın katılmasıyla birden fazla kişi nitelikli hâli de tartışılır", puan: 20, madde: "TCK m. 109/3"}
      - {tespit: "Kesintisiz suç: Orhan temadi sürerken katıldığı için müşterek fail olarak sorumlu", puan: 20, madde: "TCK m. 37"}
      - {tespit: "Etkin pişmanlık şartları: soruşturma öncesi, zararsız, kendiliğinden, güvenli yerde serbest bırakma", puan: 25, madde: "TCK m. 110"}
    cozum: |
      **Nitelendirme:** Olay, kişiyi hürriyetinden yoksun kılma suçunun (TCK m. 109) hileyle işlenen, boşandığı eşe karşı nitelikli şeklidir. Suç kesintisiz suçtur; Seda'nın serbest kaldığı üçüncü gün sona ermiştir.

      **Hukuki sorunlar:** (1) Kemal'in fiilinin hangi fıkralara girdiği ve cezanın nasıl belirleneceği. (2) Sonradan katılan Orhan'ın sorumluluğu. (3) Kemal'in serbest bırakmasının TCK m. 110 kapsamına girip girmediği.

      **İlgili hükümler:** TCK m. 109/1, 109/2, 109/3-b ve 109/3-e; TCK m. 37; TCK m. 110.

      **Değerlendirme:** Kemal, Seda'yı "sadece konuşalım" diyerek araca almıştır; bu bir hiledir. Seda inmek istediğinde kapıları kilitlemiş ve telefonunu zorla elinden almıştır. Hile tek başına TCK m. 109/2'yi uygulatmaya yeter. TCK m. 109/2'ye göre fiili işlemek için veya işlediği sırada hile, tehdit ya da cebir kullanıldığından temel ceza iki yıldan yedi yıla kadar hapis olarak belirlenir. Seda'nın hukuka uygun bir rızası yoktur; Kemal'in kanun hükmünü yerine getirme gibi bir dayanağı da yoktur.

      Seda, Kemal'in boşandığı eşidir. TCK m. 109/3-e'de 7331 sayılı Kanunla eklenen "boşandığı eşe" ibaresi sayesinde bu hâl nitelikli sayılır ve ceza bir kat artırılır. Orhan'ın alıkoymaya katılmasıyla birden fazla kişi tarafından birlikte işlenme hâli (TCK m. 109/3-b) de gündeme gelir. Birden fazla bent gerçekleşse de artırım bir kat olarak uygulanır; hâkim ayrıca temel cezayı belirlerken bunları göz önünde tutabilir (TCK m. 61).

      Orhan, Seda alıkonulurken ve alıkoyma sürerken kapıda nöbet tutmuştur. Kişiyi hürriyetinden yoksun kılma kesintisiz suç olduğundan suç tamamlandıktan sonra da temadi devam ettikçe suça katılmak mümkündür. Orhan alıkoymanın devamına icra hareketiyle katıldığı için TCK m. 37/1 kapsamında müşterek fail olarak sorumlu olur. Sadece sonradan saklanacak yer sağlasaydı yardım eden olarak (TCK m. 39) sorumlu tutulabilirdi.

      TCK m. 110 bakımından: Kemal, soruşturma başlamadan önce (kimse polise başvurmamıştır), Seda'nın şahsına zarar vermeden (fiziki hiçbir zarar yoktur), kendiliğinden (kimsenin müdahalesi yoktur) ve güvenli bir yerde (evinin önü) serbest bırakmıştır. Dört şart birlikte gerçekleştiğinden cezanın üçte ikisine kadarı indirilir. İndirimin oranı hâkimin takdirindedir. Orhan'ın durumu bu hükmün kendisi bakımından ayrı değerlendirilir; Orhan serbest bırakmayı kendisi yapmadığı için sorumluluğu soruda ele alınmamıştır.

      **Sonuç:** Kemal TCK m. 109/2, 109/3-b ve 109/3-e'den sorumludur. Cezası bir kat artırıldıktan sonra TCK m. 110 gereği üçte ikisine kadar indirilebilir. Orhan müşterek fail olarak TCK m. 109'dan sorumludur.
  - olay: |
      Mehmet, kendisine borçlu olan Ali'yi bir sabah eski depoya çağırır. Depoda tabancasını göstererek "parayı getirmeden çıkamazsın" der ve kapıyı kilitler. Ali kaçmaya çalışınca Mehmet suratına bir yumruk atar; yapılan muayenede burun kanaması ve basit tıbbi müdahaleyle giderilebilir yaralanma saptanır. Ali, alıkonulduğu sırada, aynı gün öğleden sonra yapılacak önemli bir ihale imzasını kaçırır ve büyük bir mali kayba uğrar. Altı saat sonra, hâlâ kimse bir şey öğrenmemişken, Mehmet pişman olup Ali'yi kendisi ana caddeye götürüp bırakır.

      1. Mehmet'in sorumluluğunu fıkra ve bentlerle gösteriniz.
      2. Yumruk nedeniyle ayrıca kasten yaralamadan ceza verilir mi?
      3. TCK m. 110 uygulanır mı?
      4. Uzlaştırma ve kovuşturma bakımından durum nedir?
    olcut:
      - {tespit: "Tehdit ve cebirle alıkoyma: temel ceza TCK m. 109/2", puan: 20, madde: "TCK m. 109/2"}
      - {tespit: "Silahla işlenmesi nedeniyle bir kat artırım", puan: 15, madde: "TCK m. 109/3"}
      - {tespit: "Önemli ekonomik kayıp nedeniyle ayrıca adli para cezası", puan: 15, madde: "TCK m. 109/4"}
      - {tespit: "Yaralama TCK m. 87 düzeyine ulaşmadığı için ayrı kasten yaralama hükmü kurulmaz", puan: 15, madde: "TCK m. 109/6"}
      - {tespit: "Basit tıbbi müdahaleyle giderilebilir yaralanma 'şahsına zararı dokunmaksızın' şartını bozduğundan TCK m. 110 uygulanmaz", puan: 25, madde: "TCK m. 110"}
      - {tespit: "Suç re'sen soruşturulur ve CMK m. 253/1 listesinde yer almaz", puan: 10, madde: "CMK m. 253"}
    cozum: |
      **Nitelendirme:** Mehmet Ali'yi silah göstererek ve kapıyı kilitleyerek alıkoymuş, onu darp etmiş ve Ali ekonomik bir kayba uğramıştır. Olay, TCK m. 109'un tehditle ve silahla işlenen, ekonomik kayba yol açan şeklidir.

      **Hukuki sorunlar:** (1) Temel ceza ve nitelikli hâller. (2) Ekonomik kayıp. (3) Yumruk nedeniyle kasten yaralamanın ayrıca cezalandırılıp cezalandırılmayacağı. (4) TCK m. 110'un uygulanması. (5) Uzlaştırma.

      **İlgili hükümler:** TCK m. 109/2, 109/3-a, 109/4, 109/6; TCK m. 86, 87 ve 42; TCK m. 110; CMK m. 253.

      **Değerlendirme:** Mehmet, Ali'nin depodan çıkmasını silahla tehdit ederek ve kapıyı kilitleyerek engellemiştir. Hukuka uygunluk nedeni yoktur; alacağını tahsil etmek için kanun hükmü veya hak kullanımı bu yöntemi meşru kılmaz. Tehdit ve cebir kullanıldığından temel ceza TCK m. 109/2 üzerinden iki yıldan yedi yıla kadar hapis olarak belirlenir. Fiil silahla işlendiği için TCK m. 109/3-a gereğince ceza bir kat artırılır.

      Ali ihale imzasını kaçırıp büyük mali kayba uğradığına göre TCK m. 109/4 gereği ayrıca bin güne kadar adli para cezası verilir. Bu ek yaptırımın uygulanması için kaybın "ekonomik bakımdan önemli" olması gerekir; olayda bu açıktır.

      Yumruk nedeniyle oluşan yaralanma basit tıbbi müdahaleyle giderilebilir niteliktedir. TCK m. 109/6 yalnız kasten yaralamanın **neticesi sebebiyle ağırlaşmış hâllerinin** (TCK m. 87) gerçekleşmesinde ayrıca kasten yaralama hükümlerini uygulamayı öngörür. Burada böyle bir ağırlaşma yoktur; darp, TCK m. 109/2'deki cebir unsurunun içinde kalır. Bu yaklaşım TCK m. 42'deki bileşik suç mantığına da uygundur. Bu nedenle Mehmet'e ayrıca TCK m. 86'dan ceza verilmez.

      TCK m. 110 yönünden: Mehmet Ali'yi soruşturma başlamadan, kendiliğinden ve güvenli bir yer olan ana caddede serbest bırakmıştır. Ancak şartlardan biri, mağdurun şahsına zarar vermemektir. Ali darp edilmiş ve rapor bulgusu saptanmıştır. Yargıtay, basit tıbbi müdahaleyle giderilebilir bir yaralanmayı bile bu şartı bozan bir zarar saymaktadır. Bu nedenle TCK m. 110 indirimi uygulanmaz. Mehmet'in pişmanlığı yalnızca TCK m. 62 kapsamında takdiri indirim nedeni olarak değerlendirilebilir.

      TCK m. 109 şikâyete bağlı değildir ve CMK m. 253/1'deki uzlaştırma listesinde yer almaz; bu nedenle re'sen soruşturulur ve uzlaştırma yapılmaz.

      **Sonuç:** Mehmet TCK m. 109/2, 109/3-a ve 109/4'ten sorumludur. Ayrı bir kasten yaralama hükmü kurulmaz. TCK m. 110 uygulanmaz. Suç re'sen kovuşturulur ve uzlaştırmaya tabi değildir.
kartlar:
  - on: "TCK m. 109/1 temel şekil cezası"
    arka: "Bir yıldan beş yıla kadar hapis. Fiil: hukuka aykırı olarak bir kimseyi bir yere gitmek veya bir yerde kalmak hürriyetinden yoksun bırakmak (TCK m. 109/1)."
  - on: "TCK m. 109/2 hangi hâlde uygulanır?"
    arka: "Fiili işlemek için veya işlediği sırada cebir, tehdit ya da hile kullanılırsa; ceza iki yıldan yedi yıla kadar hapistir."
  - on: "TCK m. 109/3'ün nitelikli hâlleri"
    arka: "Silahla; birden fazla kişiyle birlikte; kamu görevi nedeniyle; kamu görevinin nüfuzunun kötüye kullanılmasıyla; üstsoy, altsoy, eş veya boşandığı eşe karşı; çocuğa veya savunmasız kişiye karşı. Ceza bir kat artırılır."
  - on: "📌 TCK m. 109/3-e'de son değişiklik"
    arka: "7331 sayılı Kanunla (8.7.2021) 'eşe' ibaresinden sonra 'ya da boşandığı eşe' eklendi."
  - on: "TCK m. 109/4 neyi düzenler?"
    arka: "Suç mağdurun ekonomik bakımdan önemli bir kaybına neden olursa ayrıca bin güne kadar adli para cezası verilir."
  - on: "TCK m. 109/5 cinsel amaç"
    arka: "Suç cinsel amaçla işlenirse cezalar yarı oranında artırılır."
  - on: "TCK m. 109/6 neyi söyler?"
    arka: "Kasten yaralamanın neticesi sebebiyle ağırlaşmış hâlleri (TCK m. 87) gerçekleşirse ayrıca kasten yaralama hükümleri uygulanır."
  - on: "Kişiyi hürriyetinden yoksun kılma ne tür suçtur?"
    arka: "Kesintisiz (mütemadi) suç. Zamanaşımı kesintinin gerçekleştiği günden başlar (TCK m. 66/6); temadi sürerken suça katılmak ve meşru savunma mümkündür."
  - on: "Alıkonulan kişi hangi hukuki hakkı kullanabilir?"
    arka: "Haksız saldırı sürdüğü için meşru savunma hakkını (TCK m. 25/1)."
  - on: "TCK m. 110'un şartları"
    arka: "Soruşturmaya başlanmadan önce, mağdurun şahsına zararı dokunmaksızın, kendiliğinden, güvenli bir yerde serbest bırakma. Ceza üçte ikisine kadar indirilir."
  - on: "Basit tıbbi müdahaleyle giderilebilir yaralanma TCK m. 110'u etkiler mi?"
    arka: "Evet, 'mağdurun şahsına zararı dokunmaksızın' şartı bozulduğundan indirim uygulanmaz (Yargıtay uygulaması)."
  - on: "TCK m. 109 şikâyete bağlı mı, uzlaştırma kapsamında mı?"
    arka: "Hayır, re'sen soruşturulur; CMK m. 253/1'deki uzlaştırma listesinde yer almaz."
