ozet: |
  Bu konu, rüşvet ve zimmet gibi "büyük" görev suçlarının dışında kalan ama sınavda hep birlikte sorulan kamu idaresi suçlarını toplar.

  - **Nüfuz ticareti (TCK m. 255):** Kamu görevlisi üzerinde nüfuzu olduğunu söyleyip **haksız bir işin** gördürülmesi için menfaat alan kişi 2-5 yıl hapis ve beşbin güne kadar adli para cezası alır. Herkes fail olabilir; fail kamu görevlisiyse hapis cezası yarı oranında artırılır. İşini gördürmek için menfaat veren kişi 1-3 yıl hapisle cezalandırılır. Anlaşma yapılınca suç tamamlanır (TCK m. 255/2). Bu suçta etkin pişmanlık hükmü yoktur.
  - **Zor kullanma yetkisinin aşılması (TCK m. 256):** Ölçüsüz kuvvet kullanan yetkili görevli hakkında kasten yaralamaya ilişkin hükümler uygulanır; kendi cezası yoktur, yollama normudur.
  - **Görevi kötüye kullanma (TCK m. 257):** Başka bir suç olarak tanımlanmayan hâllerde, görevin gereklerine aykırı hareket (6 ay-2 yıl) veya ihmal ve gecikme (3 ay-1 yıl). Kişilerin mağduriyeti, kamunun zararı veya haksız menfaat sağlanması şarttır. Tamamlayıcı (ikincil) normdur.
  - **Göreve ilişkin sırrın açıklanması (TCK m. 258):** Gizli kalması gereken belge, karar ve emirleri açıklayan kamu görevlisine 1-4 yıl hapis; sıfat sona erdikten sonra işleyen de aynı cezayı alır.
  - **Kamu görevlisinin ticareti (TCK m. 259):** Görevin nüfuzuyla mal veya hizmet satmaya çalışana altı aya kadar hapis veya adli para cezası.
  - **Kamu görevinin terki veya yapılmaması (TCK m. 260):** Hukuka aykırı ve **toplu** biçimde görevi bırakan, gelmeyen veya yavaşlatan her görevliye 3 ay-1 yıl hapis. Görevli sayısı **üçten fazla değilse** cezaya hükmolunmaz. Hizmeti aksatmayan, kısa süreli ve mesleki-sosyal haklara ilişkin iş bırakmalarda indirim yapılabilir ya da ceza verilmeyebilir.
  - **Görevi yaptırmamak için direnme (TCK m. 265):** Kamu görevlisine görevini engellemek amacıyla cebir veya tehdit kullanana 6 ay-3 yıl; yargı görevi yapan kişilere karşı 2-4 yıl. Birlikte veya yüzü gizli işlenirse üçte bir, silahla ya da örgüt gücüyle işlenirse yarı oranında artırım. Neticesi sebebiyle ağırlaşmış yaralama olursa ayrıca kasten yaralama hükümleri uygulanır.
  - **Ayrım:** Menfaat işi yapacak görevliye gidiyorsa rüşvet (TCK m. 252); nüfuzu olduğunu söyleyen kişiye ve haksız iş için gidiyorsa nüfuz ticareti; iş haklıysa ve nüfuz yalansa dolandırıcılık (TCK m. 158/2).
  - 📌 TCK m. 255-260 ve TCK m. 265 maddelerinde 2021 sonrası bir değişiklik yoktur; TCK m. 257'deki cezalar 2010'da (6086), TCK m. 255 ise 2012'de (6352) son biçimini almıştır.
anlatim: |
  ## 1. Bu suçların ortak mantığı

  TCK'nın Dördüncü Kısım Birinci Bölümü kamu idaresinin güvenilirliğini ve işleyişini korur. Bu notta ele alınan suçların çoğu **özgü suçtur**: fail, TCK m. 6/1-c anlamında kamu görevlisi olmalıdır. Kamu görevlisi, kamusal faaliyetin yürütülmesine atama veya seçilme yoluyla ya da herhangi bir surette sürekli, süreli veya geçici olarak katılan kişidir. Örneğin emekli olup kendi özel muayenehanesini işleten bir hekim ya da kamusal faaliyete katılmayan bir esnaf bu sıfata sahip değildir.

  İki suç bunun dışındadır. **Nüfuz ticaretinde (TCK m. 255)** herkes fail olabilir; **görevi yaptırmamak için direnmede (TCK m. 265)** ise kamu görevlisi fail değil, mağdurdur.

  ## 2. Nüfuz ticareti (TCK m. 255)

  Nüfuz ticareti, kamu görevlisi üzerinde nüfuzu olduğunu öne süren kişinin, **haksız bir işin** gördürülmesi amacıyla girişimde bulunması karşılığında menfaat sağlamasıdır. Kanun metni "nüfuz sahibi olduğundan bahisle" der; bu ifadeden yola çıkan görüşe göre nüfuzun ileri sürülmesi yeterlidir. Ancak Yargıtay, failin kamu görevlisi üzerinde nüfuzunun bulunmasını ve işi yapacak görevlinin belli olmasını da arar (tartışma doktrin bölümünde). Sınavda en güvenli yol, nüfuzun gerçek olup olmadığını olaydan tespit edip gerekçeye yazmaktır.

  **Cezalar (TCK m. 255/1):**

  | Kim? | Ceza |
  |---|---|
  | Nüfuz satıp menfaat sağlayan | 2-5 yıl hapis ve beşbin güne kadar adli para cezası |
  | Fail kamu görevlisiyse | Hapis cezası yarı oranında artırılır |
  | İşini gördürmek için menfaat veren | 1-3 yıl hapis |

  Dikkat edilecek unsurlar:

  - **İş haksız olmalıdır.** Gördürülmek istenen işin hukuka aykırı olduğu bilinmelidir. Örneğin imar mevzuatına aykırı bir binaya ruhsat çıkarılması haksız iştir.
  - **Menfaat girişim için verilir.** Menfaat, işi yapacak görevliye değil, nüfuzu olduğunu söyleyen kişiye (veya onun göstereceği bir başkasına) gider.
  - **Anlaşma yeterlidir.** Menfaat temini konusunda anlaşmaya varılması hâlinde suç tamamlanmış gibi cezaya hükmolunur (TCK m. 255/2). Paranın fiilen ödenmesi gerekmez.
  - **Teklif veya talep kabul edilmezse** ceza yarı oranında indirilir (TCK m. 255/3).
  - **Aracı ve dolaylı yararlanan** müşterek fail olarak aynı cezayı alır (TCK m. 255/4-5).
  - **Girişimin kendisi ayrı suçsa** (örneğin görevliye rüşvet verilmesi) kişi ayrıca o suçtan da cezalandırılır (TCK m. 255/6).

  > **Örnek:** Gerçekten belediye başkanının yakın arkadaşı olan Cem, bu yakınlığını öne sürerek Mehmet'e "ruhsatı çıkarırım" der. Mehmet'in binası ruhsata elverişli değildir ve bunu bilmektedir. Mehmet 300.000 TL vermeyi kabul eder. Cem 2-5 yıl hapis ve adli para cezasıyla, Mehmet ise 1-3 yıl hapisle cezalandırılır. Anlaşma yapıldığı için paranın ödenmemiş olması sonucu değiştirmez.

  > ⚠️ **Sınavda dikkat:** Etkin pişmanlık hükmü TCK m. 254'te **rüşvet** için düzenlenmiştir. Nüfuz ticareti suçuna ilişkin böyle bir hüküm yoktur.

  **Üç suçu birbirinden ayırma:**

  - Menfaat **işi yapacak yetkili görevliye** (veya göstereceği kişiye) görevinin ifasıyla ilgili bir iş için gidiyorsa: **rüşvet** (TCK m. 252).
  - Menfaat, **nüfuzu olduğunu söyleyen kişiye** ve **haksız iş** için gidiyorsa: **nüfuz ticareti**; veren de cezalandırılır.
  - Kişinin işi **haklıdır** ve nüfuz yalandır, kişi aldatılmıştır: **dolandırıcılık**. TCK m. 158/2, kamu görevlileriyle ilişkisi olduğundan, onlar nezdinde hatırı sayıldığından bahisle ve belli bir işin gördürüleceği vaadiyle aldatarak menfaat temin edeni TCK m. 158/1 hükmüne göre cezalandırır. Burada iş sahibi fail değil, mağdurdur. Dolandırıcılığın genel tanımı TCK m. 157'dedir.

  ## 3. Zor kullanma yetkisine ilişkin sınırın aşılması (TCK m. 256)

  Zor kullanma yetkisine sahip kamu görevlisi (polis, jandarma, infaz görevlisi gibi), görevini yaptığı sırada kişilere karşı **görevinin gerektirdiği ölçünün dışında kuvvet** kullanırsa **kasten yaralama suçuna ilişkin hükümler** uygulanır. Madde kendi cezasını göstermez; TCK m. 86 ve TCK m. 87 gibi hükümlere yollama yapar.

  > **Örnek:** Gözaltındaki Ali direnmediği hâlde polis memuru Kemal onu tekmeler ve Ali'nin burnu kırılır. Kemal hakkında TCK m. 256 yollamasıyla kasten yaralama hükümleri uygulanır. Kuvvetin ölçülü kısmı ise zaten hukuka uygundur.

  ## 4. Görevi kötüye kullanma (TCK m. 257)

  TCK m. 257, "kanunda ayrıca suç olarak tanımlanan haller dışında" uygulanır. Yani **tamamlayıcı (ikincil) normdur**: görevli hakkında rüşvet, zimmet, irtikap ya da başka özel bir suç oluşuyorsa TCK m. 257'ye geçilmez.

  İki şekli vardır:

  - **İcrai şekil (TCK m. 257/1):** Görevinin gereklerine aykırı hareket etmek. Ceza 6 ay-2 yıl hapistir.
  - **İhmali şekil (TCK m. 257/2):** Görevinin gereklerini yapmakta ihmal veya gecikme göstermek. Ceza 3 ay-1 yıl hapistir.

  Her iki şekilde de davranışın sonucunda şu üç durumdan biri gerçekleşmelidir: **kişilerin mağduriyeti**, **kamunun zararı** veya **kişilere haksız menfaat sağlanması**. Yargıtay, bu sonuçlardan hangisinin nasıl doğduğunun somut olarak gösterilmesini ister. Soyut bir usulsüzlük disiplin hukukunun konusudur, ceza hukukunun değil.

  > **Örnek:** Tapu memuru Kemal, eksiksiz belgeyle gelen Ayşe'nin işlemini hiçbir gerekçe olmadan beş ay bekletir; Ayşe satış fırsatını kaçırır. Kemal TCK m. 257/2 uyarınca cezalandırılır. Aynı gecikme hiçbir mağduriyet doğurmasaydı suç oluşmazdı.

  **Sınır çizgileri:**

  - Fail **kamu görevlisi** olmalıdır. Emekli olup kendi özel muayenehanesinde çalışan hekim, mevzuata aykırı davransa bile TCK m. 257'den cezalandırılamaz.
  - Görevli menfaat karşılığı davranıyorsa suç **rüşvettir** (TCK m. 252); TCK m. 257 devreye girmez.
  - Haksız bir işin gördürüleceği vaadi ve anlaşma yoksa, görevlinin usulsüz yardım parası alması nüfuz ticareti veya rüşvet değil, TCK m. 257/1 sayılabilir.

  ## 5. Göreve ilişkin sırrın açıklanması (TCK m. 258) ve kamu görevlisinin ticareti (TCK m. 259)

  **TCK m. 258/1:** Görevi nedeniyle kendisine verilen ya da aynı nedenle öğrendiği, **gizli kalması gereken** belge, karar, emir ve tebligatı açıklayan, yayınlayan veya başkalarının bilgi edinmesini kolaylaştıran kamu görevlisi 1-4 yıl hapis alır. **TCK m. 258/2** uyarınca kamu görevlisi sıfatı sona erdikten sonra aynı fiili işleyen de aynı cezayı alır.

  > **Örnek:** Belediye müdürü Hasan, görevdeyken öğrendiği ve gizlilik kaydı taşıyan, henüz açıklanmamış imar planı değişikliği taslağını emekli olduktan sonra bir arsa yatırımcısına anlatır. Sıfatı sona ermiş olsa da TCK m. 258/2 gereği 1-4 yıl hapisle cezalandırılır.

  **TCK m. 259:** Yürüttüğü görevin sağladığı nüfuzdan yararlanarak bir başkasına mal veya hizmet satmaya çalışan kamu görevlisi, altı aya kadar hapis veya adli para cezası alır. Bu suçta görevlinin kendi nüfuzunu kullanması esastır; nüfuz ticaretindeki gibi "üçüncü kişi üzerinde nüfuz" söz konusu değildir.

  ## 6. Kamu görevinin terki veya yapılmaması (TCK m. 260)

  Hukuka aykırı ve **toplu biçimde** görevlerini terk eden, göreve gelmeyen, görevini geçici de olsa kısmen veya tamamen yapmayan ya da yavaşlatan kamu görevlilerinin **her biri** 3 ay-1 yıl hapisle cezalandırılır (TCK m. 260/1).

  > 📌 **Kesin bilgi:** Kamu görevlisi sayısı **üçten fazla olmazsa** cezaya hükmolunmaz. Yani en az dört görevli gerekir.

  TCK m. 260/2'ye göre mesleki ve sosyal haklarla ilgili, hizmeti aksatmayacak biçimde, geçici ve kısa süreli iş bırakma veya yavaşlatmalarda cezada **indirim yapılabilir, ceza da verilmeyebilir**. Bu, hâkime takdir yetkisi veren bir düzenlemedir; ceza verilmemesi zorunlu değildir.

  > **Örnek:** Bir vergi dairesinde üç memur hukuka aykırı biçimde ve anlaşarak sabah işe gelmez. Sayı üçten fazla olmadığından TCK m. 260/1 uyarınca cezaya hükmolunmaz. Dördüncü bir memur da katılırsa her biri cezalandırılır.

  ## 7. Görevi yaptırmamak için direnme (TCK m. 265)

  Kamu görevlisine karşı **görevini yapmasını engellemek amacıyla cebir veya tehdit** kullanan kişi 6 ay-3 yıl hapis alır (TCK m. 265/1). Suç, amaç bakımından özel kastlıdır: cebir veya tehdit görevi engelleme amacıyla kullanılmalıdır.

  **Nitelikli hâller:**

  - **Yargı görevi yapan kişilere karşı** (TCK m. 265/2): 2-4 yıl hapis. TCK m. 6/1-d'ye göre bunlar yüksek mahkemeler, adli ve idari mahkemeler üye ve hâkimleri, Cumhuriyet savcısı ve avukatlardır. İcra memuru, polis veya zabıta bu gruba girmez.
  - **Kendini tanınmayacak hâle koyma veya birden fazla kişiyle birlikte işleme** (TCK m. 265/3): ceza üçte bir artırılır.
  - **Silahla ya da suç örgütünün korkutucu gücünden yararlanarak** (TCK m. 265/4): ceza yarı oranında artırılır. Silah kavramı TCK m. 6/1-f'ye göre geniştir; fiilen saldırıda kullanılmaya elverişli demir sopa da silahtır.
  - **Neticesi sebebiyle ağırlaşmış yaralama** (TCK m. 265/5): ayrıca kasten yaralama hükümleri uygulanır. Örneğin direnirken görevlinin kolu kırılırsa (TCK m. 87/3) hem direnmeden hem kasten yaralamadan sorumluluk doğar.

  > **Örnek:** Borçlu Ali ve kardeşi Veli, haciz için gelen icra memurunu birlikte tehdit eder ve haczi engeller. İcra memuru yargı görevi yapan sayılmadığından TCK m. 265/2 uygulanmaz; birlikte işlendiği için TCK m. 265/3 uyarınca üçte bir artırım yapılır.

  > ⚠️ **Sınavda dikkat:** Hâkim, savcı ve avukat "yargı görevi yapan" sayılır; icra memuru, polis, zabıta, bilirkişi sayılmaz. Silah ve örgüt artırımı yarı oranında, birlikte işleme ve yüz gizleme artırımı üçte bir oranındadır.

  Kamu görevlisi **hukuka aykırı** bir işlem yapıyorsa tablo değişir. Yetkisiz ve açıkça hukuka aykırı bir fiile karşı koyan kişi TCK m. 25/1 uyarınca meşru savunma kapsamında olabilir. Fakat işlem yetki içinde ve şekli açıdan geçerliyse, sadece içeriği tartışmalı diye cebirle direnme hakkı doğmaz; itiraz yolları idari ve yargısal başvurulardır.

  ## 8. Denetim şeması

  1. Fail kim? Kamu görevlisi mi (TCK m. 6/1-c)? Nüfuz ticareti ve direnme dışında bu şart aranır.
  2. Menfaat var mı? İşi yapacak görevliye mi gidiyor (rüşvet), nüfuz satana mı (nüfuz ticareti)?
  3. İş haksız mı, haklı mı? Haklıysa ve aldatma varsa dolandırıcılığı düşün.
  4. Başka bir özel suç oluşuyor mu? Oluşuyorsa TCK m. 257'ye geçme.
  5. TCK m. 257 için: davranış (icrai/ihmali) + üç sonuçtan biri.
  6. Toplu bırakma varsa sayıyı say (dörtten az mı?), TCK m. 260/2'yi tartış.
  7. Direnmede mağdurun sıfatı (yargı görevi yapan mı?), nitelikli hâller ve yaralama sonucu.
kritik: |
  - 📌 TCK m. 255/1: nüfuz satana 2-5 yıl hapis ve beşbin güne kadar adli para cezası; fail kamu görevlisiyse hapis yarı oranında artırılır; menfaat veren 1-3 yıl hapis.
  - 📌 Nüfuz ticaretinde gördürülmek istenen iş **haksız** olmalıdır; iş haklıysa ve nüfuz yalansa suç dolandırıcılıktır (TCK m. 158/2) ve iş sahibi mağdurdur.
  - ⚠️ Nüfuz ticaretinde anlaşma yeterlidir (TCK m. 255/2); menfaatin fiilen verilmesi şart değildir. Teklif veya talep kabul edilmezse ceza yarı oranında indirilir (TCK m. 255/3).
  - ⚠️ Etkin pişmanlık hükmü (TCK m. 254) rüşvete özgüdür; nüfuz ticaretinde böyle bir hüküm yoktur.
  - 📌 Tek bir nüfuz ticareti anlaşması varsa, menfaat birkaç taksitte alınsa bile zincirleme suç (TCK m. 43/1) uygulanmaz.
  - 📌 TCK m. 256 bağımsız bir ceza içermez; ölçüsüz kuvvet kullanana kasten yaralama hükümleri uygulanır.
  - 📌 TCK m. 257/1 icrai (6 ay-2 yıl), TCK m. 257/2 ihmali (3 ay-1 yıl) şekildir; ikisinde de kişilerin mağduriyeti, kamunun zararı veya haksız menfaatten biri aranır.
  - ⚠️ TCK m. 257 ikincil normdur: rüşvet, zimmet veya başka özel suç oluşuyorsa uygulanmaz; fail kamu görevlisi değilse hiç uygulanmaz.
  - 📌 TCK m. 258: gizli belge, karar ve emirleri açıklamaya 1-4 yıl hapis; sıfat sona erdikten sonra işleyen de aynı cezayı alır (TCK m. 258/2).
  - ⚠️ TCK m. 260: görevli sayısı üçten fazla olmazsa ceza verilmez; en az dört kişi gerekir. Mesleki-sosyal hak amaçlı kısa ve hizmeti aksatmayan iş bırakmada indirim yapılabilir ya da ceza verilmeyebilir.
  - 📌 TCK m. 265: temel ceza 6 ay-3 yıl; yargı görevi yapan kişiye karşı 2-4 yıl; birlikte veya yüzü gizli 1/3 artırım; silah veya örgüt gücü yarı artırım.
  - ⚠️ İcra memuru, polis ve zabıta "yargı görevi yapan" sayılmaz; hâkim, savcı ve avukat sayılır (TCK m. 6/1-d).
  - 📌 Direnme sırasında neticesi sebebiyle ağırlaşmış yaralama doğarsa (örneğin kemik kırılması, TCK m. 87/3) ayrıca kasten yaralama hükümleri uygulanır (TCK m. 265/5).
doktrin: |
  ### TCK m. 257'deki sonuçların hukuki niteliği

  Görevi kötüye kullanmada "kişilerin mağduriyeti, kamunun zararı veya haksız menfaat" sonuçlarının ne olduğu tartışmalıdır. Bir görüşe göre bunlar **objektif cezalandırılabilme şartıdır**: failin kastının bu sonuçları da kapsaması gerekmez, görevin gereklerine aykırı davranma kastı yeterlidir. Bu görüşün pratik sonucu, teşebbüsün mümkün olmamasıdır; sonuç gerçekleşmediyse suç da cezalandırılamaz. Karşı görüş ise bunları suçun maddi unsuru olan **netice** sayar; bu hâlde kastın neticeyi de kapsaması ve teşebbüsün mümkün olması gerekir. Yargıtay'ın kararlarında sonucun somut delillerle gösterilmesi ısrarla aranır. Sınavda iki görüşü ve yargının tavrını yazıp bir sonuca varmak yeterlidir.

  ### Hukuka aykırı görev işlemine karşı direnme

  TCK m. 265 "kamu görevlisine karşı görevini yapmasını engellemek" der. Görevli yetkisiz biçimde, örneğin kararsız bir konuta girmeye çalışıyorsa, yaptığı iş "görev" sayılmaz ve karşı koyan kişi meşru savunmadan (TCK m. 25/1) yararlanabilir. Buna karşılık işlem şekli olarak yetkili makamca yapılmış ve sadece içeriği bakımından yargı yolunda iptal edilebilecek nitelikteyse, cebirle direnme hakkı doğmaz. Sınırın nerede çekileceği olayın ayrıntısına bağlıdır; bu yüzden olay sorusunda "işlem açıkça yetkisiz mi, yoksa sadece hatalı mı?" ayrımını gerekçeye mutlaka yaz.

  ### Nüfuzun gerçekliği

  TCK m. 255 "nüfuz sahibi olduğundan bahisle" der. Bir görüşe göre bu ifade nedeniyle failin nüfuzunun gerçekten bulunması gerekmez; ileri sürmesi yeter. Buna karşılık Yargıtay, suçun unsurları arasında failin kamu görevlisi üzerinde nüfuzunun bulunmasını ve işi yapacak kamu görevlisinin belli olmasını da sayar. Nüfuzun hiç olmadığı ve iş sahibinin de haksız bir iş peşinde olmadığı hâlde aldatma varsa, dolandırıcılık gündeme gelir; haksız iş peşindeki kişi için ise nüfuz ticareti bakımından sorumluluk tartışılır.
sozluk:
  - terim: Nüfuz ticareti
    tanim: "Kamu görevlisi üzerinde nüfuzu olduğunu ileri sürerek haksız bir işin gördürülmesi için menfaat sağlama veya buna ilişkin anlaşma (TCK m. 255)."
  - terim: Haksız iş
    tanim: "Hukuka aykırı olduğu bilinen, kanunen yapılmaması gereken işlem; nüfuz ticaretinin zorunlu unsuru."
  - terim: Özgü suç
    tanim: "Yalnız belli sıfatı taşıyan kişinin (burada kamu görevlisinin) fail olabildiği suç."
  - terim: Tamamlayıcı (ikincil) norm
    tanim: "Başka bir hüküm uygulanmıyorsa devreye giren norm; TCK m. 257 'kanunda ayrıca suç olarak tanımlanan haller dışında' uygulanır."
  - terim: Zor kullanma yetkisi
    tanim: "Polis, jandarma gibi görevlilerin görevleri gereği ölçülü kuvvet kullanabilmesi yetkisi."
  - terim: Yargı görevi yapan
    tanim: "TCK m. 6/1-d'ye göre yüksek mahkemeler, adli ve idari mahkemeler üye ve hâkimleri, Cumhuriyet savcısı ve avukatlar."
  - terim: Toplu biçimde
    tanim: "TCK m. 260 bakımından görevlilerin ortak bir iradeyle birlikte hareket etmesi; ayrıca cezaya hükmedilebilmesi için sayılarının üçten fazla olması gerekir."
  - terim: Cebir ve tehdit
    tanim: "Direnme suçunun hareketleri; kişiye karşı fiziksel güç kullanma veya ona bir kötülük yapılacağını bildirme."
  - terim: Müşterek fail
    tanim: "Suçu başkalarıyla birlikte işleyen fail; TCK m. 255/4-5, nüfuz ticaretine aracılık edeni ve dolaylı menfaati kabul eden yetkiliyi bu sıfatla birinci fıkradaki cezayla cezalandırır."
  - terim: Silah
    tanim: "TCK m. 6/1-f'ye göre ateşli silahlar, patlayıcılar, saldırı ve savunma için yapılmış kesici, delici veya bereleyici aletler, fiilen saldırı ve savunmada kullanılmaya elverişli diğer şeyler ile yakıcı, zehirleyici gibi tehlikeli maddeler."
kararlar:
  - id: "1182970400"
    ozet: |
      İlçe jandarma komutanı olan sanık, araçlarına trafik cezası kesilen katılandan çocuk okuttukları ve karakolun masrafları olduğu gerekçesiyle birden fazla kez para almıştır. Bandırma Ağır Ceza Mahkemesi sanığı zincirleme nüfuz ticaretinden 6 yıl 9 ay hapis ve adli para cezasıyla mahkûm etmiş, istinaf başvuruları reddedilmiştir. Yargıtay 5. Ceza Dairesi hükmü bozmuştur. Daireye göre nüfuz ticareti için gördürülecek işin haksız olması, failin kamu görevlisi üzerinde nüfuzunun bulunması, işi yapacak görevlinin belli olması, haksız işin gördürüleceği vaadi ve taraflar arasında anlaşma gerekir. Trafik timi komutanlarına bir telkin yapılmadığı ve haksız iş vaadine ya da rüşvet anlaşmasına dair somut delil bulunmadığı için eylem TCK m. 257/1 anlamında icrai görevi kötüye kullanma sayılmıştır. Daire ayrıca "kabule göre de" diyerek, nüfuz ticareti anlaşması tek olduğundan zincirleme suç hükümlerinin uygulanamayacağını belirtmiştir.
  - id: "1201278600"
    ozet: |
      Ruhsat başvurusu, binada yangın merdiveni ve acil çıkış kapısı bulunmaması ve çatı katının kaçak olması nedeniyle reddedilen işyeri sahibi, belediye görevlileri üzerinde nüfuzu olduğunu söyleyen kişilere iddiaya göre ruhsat karşılığı 200.000 dolar ödemiştir (paranın tamamının bu iş için verilmediği, taraflar arasında ayrıca bir otel alımı işi bulunduğu da anlaşılmıştır); usule aykırı olarak işyerine geçici de olsa ruhsat verilmiştir. Ağır Ceza Mahkemesi sanıkları kamu kurumlarının araç olarak kullanılmasıyla dolandırıcılıktan beraat ettirmiştir. Yargıtay 11. Ceza Dairesi oy birliğiyle bozmuştur. Daireye göre iş sahibi binasının ruhsata elverişli olmadığını bilmekte, sorunu hukuka aykırı yollardan çözmek için bilerek menfaat vermektedir; bu nedenle kandırılmış (dolandırılmış) sayılamaz. Mahkemece sanıklar, belediye görevlileri ve iş sahibi bakımından nüfuz ticareti (TCK m. 255) ve rüşvet (TCK m. 252) suçlarının tartışılması gerekirdi. Karar, haksız iş peşindeki kişinin dolandırıcılık mağduru değil, nüfuz ticaretinin tarafı olabileceğini gösterir.
sorular:
  - soru: |
      Mehmet, binasının imar mevzuatına aykırı olduğunu ve ruhsat alamayacağını bildiği hâlde, belediye başkanının gerçekten yakın arkadaşı olan ve bu yakınlığını öne süren Cem'e ruhsatı çıkarması için 100.000 TL vermeyi kabul etmiştir. Cem herhangi bir girişimde bulunmamıştır. Mehmet'in durumu hangisidir?
    siklar:
      - "Dolandırıcılığın mağdurudur; sorumluluğu yoktur"
      - "Rüşvet vermekten 4-12 yıl hapisle cezalandırılır"
      - "İşinin gördürülmesi karşılığında menfaat sağlayan olarak 1-3 yıl hapisle cezalandırılır"
      - "Görevi kötüye kullanmaya iştirakten cezalandırılır"
    dogru: 2
    aciklama: |
      Menfaat işi yapacak görevliye değil, nüfuzu olduğunu söyleyen kişiye ve haksız bir iş için verilmektedir; bu nedenle olay nüfuz ticaretidir. TCK m. 255/1'in son cümlesine göre işini gördürmek karşılığında menfaat sağlayan kişi 1-3 yıl hapisle cezalandırılır. Anlaşma yeterli olduğundan Cem'in hiçbir girişimde bulunmaması sonucu değiştirmez (TCK m. 255/2). İş haksız olduğu için Mehmet dolandırıcılığın mağduru değildir; menfaat görevliye gitmediği için rüşvet de yoktur (TCK m. 252).
  - soru: |
      Zeynep, kanunen hak ettiği emeklilik aylığının bağlanması için Hasan'a başvurur. Hasan, "Kurumdaki herkes beni tanır, hatırım büyük, bu işi hallederim" diyerek 20.000 TL alır. Gerçekte Hasan'ın kurumda hiç tanıdığı yoktur. Hasan'ın eylemi nedir?
    siklar:
      - "Nüfuz ticareti; Zeynep de cezalandırılır"
      - "Rüşvet"
      - "TCK m. 158/2 kapsamında nitelikli dolandırıcılık hükmüne tabi eylem"
      - "Görevi kötüye kullanma"
    dogru: 2
    aciklama: |
      Zeynep'in işi haklıdır ve Hasan'ın söylediği nüfuz yalandır; Zeynep aldatılmıştır. TCK m. 158/2, kamu görevlileriyle ilişkisinin olduğundan, onlar nezdinde hatırı sayıldığından bahisle ve belli bir işin gördürüleceği vaadiyle aldatarak başkasından menfaat temin edeni TCK m. 158/1 hükmüne göre cezalandırır. Nüfuz ticaretinde gördürülecek iş haksızdır; burada iş haklı olduğundan Zeynep fail değil mağdurdur. Hasan kamu görevlisi olmadığı için TCK m. 257 de uygulanmaz.
  - soru: |
      Nüfuz ticareti suçunu işleyen kişinin kamu görevlisi olması hâlinde TCK m. 255/1 uyarınca hangi sonuç doğar?
    siklar:
      - "Verilecek hapis cezası üçte bir oranında artırılır"
      - "Verilecek hapis cezası yarı oranında artırılır"
      - "Verilecek ceza bir kat artırılır"
      - "Ceza artırılmaz; sıfat yalnızca disiplin sorumluluğu doğurur"
    dogru: 1
    aciklama: |
      TCK m. 255/1'in ikinci cümlesi açıkça "Kişinin kamu görevlisi olması halinde, verilecek hapis cezası yarı oranında artırılır" der. Üçte bir artırım TCK m. 265/3'tedir; bir kat artırım bu maddede yoktur. Nüfuz ticaretinde herkes fail olabilir, ancak failin kamu görevlisi olması cezayı ağırlaştırır.
  - soru: |
      Nüfuz ticaretine ilişkin aşağıdaki ifadelerden hangisi doğrudur?
    siklar:
      - "Menfaat fiilen verilmedikçe suç tamamlanmış sayılmaz"
      - "Talep edilen menfaat kabul edilmezse ceza yarı oranında artırılır"
      - "Menfaat temini konusunda anlaşmaya varılması hâlinde dahi suç tamamlanmış gibi cezaya hükmolunur"
      - "Etkin pişmanlık hükmü TCK m. 254 uyarınca bu suça da uygulanır"
    dogru: 2
    aciklama: |
      TCK m. 255/2'ye göre menfaat temini konusunda anlaşmaya varılması hâlinde dahi suç tamamlanmış gibi cezaya hükmolunur. Teklif veya talebin kabul edilmemesi hâlinde ceza artırılmaz, yarı oranında indirilir (TCK m. 255/3). TCK m. 254 başlığı etkin pişmanlıktır ve rüşvet suçuna ilişkindir; nüfuz ticareti için ayrı bir etkin pişmanlık hükmü bulunmaz.
  - soru: |
      Gözaltındaki şüpheli Ali hiç direnmediği hâlde polis memuru Kemal, Ali'yi tekmeleyerek yaralamıştır. Kemal hakkında hangi hüküm uygulanır?
    siklar:
      - "TCK m. 256 uyarınca kasten yaralama suçuna ilişkin hükümler"
      - "TCK m. 257/1 uyarınca 6 ay-2 yıl hapis; yaralama ayrıca aranmaz"
      - "TCK m. 265 uyarınca görevi yaptırmamak için direnme"
      - "Ceza verilmez; zor kullanma yetkisi bulunduğundan hukuka uygundur"
    dogru: 0
    aciklama: |
      Zor kullanma yetkisi olan görevlinin görevini yaparken görevin gerektirdiği ölçünün dışında kuvvet kullanması hâlinde TCK m. 256 gereği kasten yaralama suçuna ilişkin hükümler uygulanır (TCK m. 86 ve TCK m. 87). Yetki yalnız ölçülü kuvveti kapsar; direnmeyen kişiye şiddet ölçünün dışındadır. TCK m. 265'te kamu görevlisi mağdurdur, fail değildir. Ayrıca özel hüküm bulunduğundan TCK m. 257 uygulanmaz.
  - soru: |
      Tapu memuru Kemal, eksiksiz belgeyle başvuran Ayşe'nin işlemini hiçbir gerekçe olmaksızın beş ay bekletmiş, Ayşe bu yüzden satış fırsatını kaçırmıştır. Kemal'in sorumluluğu nedir?
    siklar:
      - "TCK m. 257/1 uyarınca 6 ay-2 yıl hapis"
      - "TCK m. 257/2 uyarınca 3 ay-1 yıl hapis"
      - "TCK m. 260 uyarınca 3 ay-1 yıl hapis"
      - "Yalnız disiplin sorumluluğu; ceza sorumluluğu doğmaz"
    dogru: 1
    aciklama: |
      Görevin gereklerini yapmakta ihmal veya gecikme gösterilmiştir ve kişi mağdur olmuştur; bu, TCK m. 257/2'nin ihmali şeklidir ve cezası 3 ay-1 yıl hapistir. İcrai davranışta ceza 6 ay-2 yıl hapistir (TCK m. 257/1). TCK m. 260 toplu biçimde görevin terkini düzenler; tek kişinin gecikmesi buna girmez. Mağduriyet doğduğu için yalnız disiplin sorumluluğundan söz edilemez.
  - soru: |
      TCK m. 257'de yer alan görevi kötüye kullanma suçu bakımından aşağıdakilerden hangisi kanunda sayılan alternatif sonuçlardan biri DEĞİLDİR?
    siklar:
      - "Kişilerin mağduriyeti"
      - "Kamunun zararı"
      - "Kişilere haksız bir menfaat sağlanması"
      - "Kamu düzeninin bozulması"
    dogru: 3
    aciklama: |
      TCK m. 257/1 ve TCK m. 257/2 sonuç olarak kişilerin mağduriyetini, kamunun zararını veya kişilere haksız menfaat sağlanmasını sayar. "Kamu düzeninin bozulması" bu üç sonuç arasında yer almaz. Bu sonuçlardan hiçbiri doğmamışsa görevin gereklerine aykırı davranış ceza hukuku bakımından suç oluşturmaz.
  - soru: |
      Devlet hastanesinden emekli olduktan sonra kendi özel muayenehanesini açan hekim Selin, muayenehanesinde mevzuata aykırı biçimde reşit olmayan bir hastaya işlem yapmıştır. Savcılık Selin hakkında görevi kötüye kullanmadan dava açmıştır. Selin bakımından doğru sonuç hangisidir?
    siklar:
      - "TCK m. 257/1 uygulanır; hekim görev yaptığı için kamu görevlisidir"
      - "TCK m. 257/2 uygulanır; çünkü ihmali davranış söz konusudur"
      - "TCK m. 257 uygulanamaz; özel muayenehanesinde çalışan hekim TCK m. 6/1-c anlamında kamu görevlisi değildir"
      - "TCK m. 258 uygulanır; hekim sır saklama yükümlüsüdür"
    dogru: 2
    aciklama: |
      TCK m. 257 özgü suçtur ve fail kamu görevlisi olmalıdır. TCK m. 6/1-c'ye göre kamu görevlisi, kamusal faaliyetin yürütülmesine atama veya seçilme yoluyla ya da herhangi bir surette katılan kişidir; emekli olup kendi muayenehanesinde çalışan hekim kamusal bir faaliyete katılmadığından bu sıfata sahip değildir. Emeklilikten önceki kamu görevi, sonraki muayenehane faaliyetine bu sıfatı taşımaz. TCK m. 258 de kamu görevlisine özgüdür ve yalnız gizli belge, karar ve emirlere ilişkindir.
  - soru: |
      Belediye müdürü Hasan, görevdeyken öğrendiği ve gizlilik kaydı taşıyan, henüz açıklanmamış imar planı değişikliği taslağını emekli olduktan sonra bir arsa yatırımcısına anlatmıştır. Hasan'ın durumu hangisidir?
    siklar:
      - "Ceza verilmez; sıfat sona erdiği için kamu görevlisi değildir"
      - "TCK m. 258/2 uyarınca 1-4 yıl hapisle cezalandırılır"
      - "TCK m. 259 uyarınca altı aya kadar hapisle cezalandırılır"
      - "TCK m. 257/1 uyarınca 6 ay-2 yıl hapisle cezalandırılır"
    dogru: 1
    aciklama: |
      TCK m. 258/2'ye göre kamu görevlisi sıfatı sona erdikten sonra birinci fıkradaki fiilleri işleyen kimseye de aynı ceza (1-4 yıl hapis) verilir. Bu nedenle sıfatın bitmesi cezasızlık sebebi değildir. TCK m. 259 görevin nüfuzuyla mal veya hizmet satmaya çalışmayı düzenler ve burada uygulanmaz.
  - soru: |
      Bir belediyenin zabıta müdürlüğünde çalışan üç memur, hukuka aykırı biçimde ve toplu olarak anlaşarak üç gün işe gelmemiştir. Bu memurların durumu hangisidir?
    siklar:
      - "Her biri TCK m. 260/1 uyarınca 3 ay-1 yıl hapisle cezalandırılır"
      - "Kamu görevlisi sayısı üçten fazla olmadığı için cezaya hükmolunmaz"
      - "TCK m. 257/2 uyarınca 3 ay-1 yıl hapisle cezalandırılırlar"
      - "TCK m. 260/2 uyarınca cezaları mutlaka kaldırılır"
    dogru: 1
    aciklama: |
      TCK m. 260/1'in son cümlesine göre kamu görevlisi sayısının üçten fazla olmaması hâlinde cezaya hükmolunmaz; yani cezaya hükmedilebilmesi için en az dört görevli gerekir. Üç memur bulunduğundan ceza verilmez. TCK m. 260/2 hâkime indirim veya ceza vermeme konusunda takdir verir; zorunlu bir kaldırma getirmez ve olayda zaten aranmaz.
  - soru: |
      Borçlu Ali ve kardeşi Veli, haciz için gelen icra memurunu birlikte tehdit ederek haczi engellemişlerdir. Silah kullanılmamıştır. Hangi sonuç doğrudur?
    siklar:
      - "TCK m. 265/2 uygulanır; icra memuru yargı görevi yapan sayılır"
      - "TCK m. 265/1'deki ceza, birlikte işlendiği için üçte bir oranında artırılır"
      - "TCK m. 265/1'deki ceza yarı oranında artırılır"
      - "Artırım yapılmaz; tehdit direnme suçunun içinde erir"
    dogru: 1
    aciklama: |
      Kamu görevlisi icra memuruna karşı görevini engellemek amacıyla tehdit kullanılmıştır (TCK m. 265/1). Suç birden fazla kişi tarafından birlikte işlendiğinden ceza TCK m. 265/3 uyarınca üçte bir oranında artırılır. İcra memuru, TCK m. 6/1-d'deki sayımda yer almadığından yargı görevi yapan kişi değildir ve TCK m. 265/2 uygulanmaz. Yarı oranındaki artırım silah veya örgüt gücü için öngörülmüştür (TCK m. 265/4).
  - soru: |
      Fail Selim, haczi engellemek amacıyla icra memuruna karşı cebir kullanmış ve memurun kolu kırılmıştır. Hangi sonuç doğru?
    siklar:
      - "Yalnızca görevi yaptırmamak için direnme suçundan cezalandırılır; yaralama direnmenin içinde erir"
      - "Yalnızca kasten yaralama suçundan cezalandırılır; direnme aranmaz"
      - "TCK m. 265'ten ve ayrıca kasten yaralama hükümleri uyarınca cezalandırılır"
      - "TCK m. 256 uygulanır; çünkü olay görevli sıfatıyla işlenmiştir"
    dogru: 2
    aciklama: |
      Kemik kırılması TCK m. 87/3 kapsamında neticesi sebebiyle ağırlaşmış yaralamadır. TCK m. 265/5, direnme sırasında kasten yaralamanın neticesi sebebiyle ağırlaşmış hâllerinin gerçekleşmesi durumunda ayrıca kasten yaralama hükümlerinin uygulanacağını söyler. Bu yüzden hem direnme hem yaralama hükümleri bir arada uygulanır. TCK m. 256 yalnız zor kullanma yetkisine sahip kamu görevlisinin fail olduğu hâllere ilişkindir.
olaylar:
  - olay: |
      İbrahim, otelinde yangın merdiveni bulunmadığı ve çatı katının kaçak olması nedeniyle belediyeden işletme ruhsatı alamamıştır. Bunu bilen İbrahim, vergi dairesinde memur olan Selim'e başvurur. Selim, "Belediye başkanıyla çocukluk arkadaşıyım, bu kaçak binaya ruhsatı çıkarırım, bana 400.000 TL verirsin" der. Selim gerçekten de belediye başkanının çocukluk arkadaşıdır. İbrahim kabul eder ve avans olarak 100.000 TL öder. Selim belediyeye hiç gitmemiştir.

      Aynı belediyenin ruhsat servisinde çalışan memur Tuba, eksiksiz belgelerle başvuran Ayten'in dosyasını hiçbir gerekçe olmaksızın beş ay bekletmiş, Ayten bu yüzden işyerini açamayarak zarara uğramıştır. Tuba ayrıca, görevi nedeniyle öğrendiği ve gizlilik kaydı taşıyan, henüz açıklanmamış imar planı değişikliği taslağını bir arsa yatırımcısına anlatmıştır.

      1. Selim ve İbrahim'in ceza sorumluluğunu değerlendiriniz.
      2. Selim'in ayrıca kamu görevlisi olmasının sonucu nedir?
      3. Tuba'nın ceza sorumluluğunu değerlendiriniz.
    olcut:
      - {tespit: "Gördürülmek istenen işin haksız olması ve nüfuz iddiası: olay nüfuz ticaretidir, rüşvet veya dolandırıcılık değildir", puan: 20, madde: "TCK m. 255/1"}
      - {tespit: "Menfaat temini için anlaşma yapıldığından suç tamamlanmıştır; Selim'in girişimde bulunmaması ve paranın bir kısmının ödenmesi sonucu değiştirmez", puan: 15, madde: "TCK m. 255/2"}
      - {tespit: "Selim'in kamu görevlisi olması nedeniyle hapis cezasının yarı oranında artırılması", puan: 15, madde: "TCK m. 255/1"}
      - {tespit: "İbrahim'in işinin gördürülmesi karşılığında menfaat sağlayan olarak 1-3 yıl hapisle cezalandırılması; haksız iş peşinde olduğundan dolandırıcılığın mağduru sayılmaması", puan: 15, madde: "TCK m. 255/1"}
      - {tespit: "Tuba'nın ihmal ve gecikmesi: kişilerin mağduriyeti doğduğundan ihmali görevi kötüye kullanma, 3 ay-1 yıl hapis", puan: 20, madde: "TCK m. 257/2"}
      - {tespit: "Tuba'nın gizli imar planı değişikliği taslağını açıklaması: göreve ilişkin sırrın açıklanması, 1-4 yıl hapis", puan: 15, madde: "TCK m. 258/1"}
    cozum: |
      **Nitelendirme:** Olay iki ayrı görevli ve iki ayrı suç grubundan oluşur. Selim ve İbrahim bakımından nüfuz ticareti, Tuba bakımından görevi kötüye kullanma ve göreve ilişkin sırrın açıklanması gündeme gelir.

      **Hukuki sorunlar:** (1) Selim'e verilen menfaat rüşvet midir, nüfuz ticareti midir, yoksa dolandırıcılık mıdır? (2) Fiilen hiçbir girişim yapılmaması suçun tamamlanmasını engeller mi? (3) Selim'in kamu görevlisi olması ve İbrahim'in sorumluluğu. (4) Tuba'nın iki davranışının hangi suçları oluşturduğu.

      **İlgili hükümler:** Menfaat, işi yapacak belediye görevlisine değil, onun üzerinde nüfuzu olduğunu söyleyen Selim'e verilmiştir; bu nedenle TCK m. 252 değil TCK m. 255 uygulanır. Gördürülmek istenen iş, binanın ruhsata elverişli olmaması nedeniyle haksızdır. TCK m. 255/1 nüfuz satana 2-5 yıl hapis ve beşbin güne kadar adli para cezası, işini gördürmek için menfaat sağlayana ise 1-3 yıl hapis öngörür. TCK m. 255/2'ye göre anlaşma ile suç tamamlanır. Tuba'nın gecikmesi TCK m. 257/2'de, açıklaması ise TCK m. 258/1'de düzenlenmiştir.

      **Değerlendirme:** Selim, kamu görevlisi olduğunu ileri sürerek değil, belediye başkanı üzerinde gerçekten var olan nüfuzunu ileri sürerek haksız işin gördürüleceğini vaat etmiş; işi yapacak görevli (belediye başkanı) de bellidir. Selim menfaat konusunda İbrahim'le anlaşmıştır. Suç anlaşma anında tamamlandığından Selim'in belediyeye hiç gitmemesi veya ödemenin kısmen yapılmış olması sonucu etkilemez. Selim kamu görevlisi olduğu için TCK m. 255/1'in ikinci cümlesi gereği verilecek hapis cezası yarı oranında artırılır. İbrahim, binasının ruhsata uygun olmadığını bildiğinden haksız bir iş peşindedir; aldatılmış bir mağdur değildir ve TCK m. 255/1'in son cümlesi uyarınca 1-3 yıl hapisle cezalandırılır. Bu suçta etkin pişmanlık hükmü bulunmadığından İbrahim'in sonradan pişman olması cezayı kaldırmaz. Eğer İbrahim'in işi haklı olsaydı ve Selim'in nüfuzu da yalan olsaydı, eylem TCK m. 158/2 kapsamındaki dolandırıcılık olurdu.

      Tuba, ruhsat servisinde çalışan kamu görevlisidir (TCK m. 6/1-c). Eksiksiz başvuruyu gerekçesiz bekletmesi görevin gereklerini yapmakta ihmal veya gecikmedir; Ayten'in zarar görmesi mağduriyet sonucunu doğurmuştur. Başka özel suç oluşmadığından TCK m. 257/2 uygulanır ve 3 ay-1 yıl hapis verilir. Gizlilik kaydı taşıyan imar planı değişikliği taslağını açıklaması ise TCK m. 258/1'deki suçu oluşturur ve 1-4 yıl hapis gerektirir. İki fiil ayrı davranışlar olduğundan ayrı suçlar sayılır.

      **Sonuç:** Selim TCK m. 255/1 gereği 2-5 yıl hapis ve beşbin güne kadar adli para cezası üzerinden, kamu görevlisi olduğu için yarı artırımla; İbrahim 1-3 yıl hapisle; Tuba ise TCK m. 257/2 ve TCK m. 258/1'den ayrı ayrı cezalandırılır.
  - olay: |
      Borçlu Ali'nin dükkânında icra memuru Murat, alacaklının talebiyle haciz işlemi yapmaya gelir. Ali'nin kardeşi Veli de oradadır. Ali, "Bu dükkâna dokunduran olursa yaşamasın" diyerek, Veli ile birlikte Murat'ı tehdit eder ve haciz tutanağı düzenlenmesini engellemeye çalışır. Murat geri adım atmayınca Ali, Veli'yle önceden konuşmadıkları ve Veli'nin beklemediği bir anda yerdeki demir sopayı alır ve Murat'ın koluna vurur. Murat'ın kolundaki kemik kırılır. Ali sonradan "haciz haksızdı, direnmek benim hakkımdı" demektedir. Haciz işlemi geçerli bir icra takibine dayanmaktadır.

      1. Ali ve Veli'nin sorumluluğunu, nitelikli hâller bakımından değerlendiriniz.
      2. Murat'ın yaralanması bakımından sonucu tartışınız.
      3. Ali'nin "direnme hakkı" savunmasını değerlendiriniz.
    olcut:
      - {tespit: "Kamu görevlisine karşı görevini engellemek amacıyla cebir ve tehdit: görevi yaptırmamak için direnme (temel şekil)", puan: 20, madde: "TCK m. 265/1"}
      - {tespit: "İcra memuru yargı görevi yapan kişi sayılmadığından 2-4 yıllık ağırlaştırılmış cezaya geçilmez", puan: 15, madde: "TCK m. 6/1-d"}
      - {tespit: "Ali ve Veli birlikte hareket ettiğinden üçte bir oranında artırım", puan: 15, madde: "TCK m. 265/3"}
      - {tespit: "Demir sopanın silah sayılması ve Ali bakımından silahla işlenme nedeniyle yarı oranında artırım; kastı sopanın kullanılmasını kapsamayan Veli'ye bu artırımın uygulanmaması", puan: 20, madde: "TCK m. 265/4"}
      - {tespit: "Kemik kırılması neticesi sebebiyle ağırlaşmış yaralamadır; ayrıca kasten yaralama hükümleri uygulanır", puan: 20, madde: "TCK m. 265/5"}
      - {tespit: "Haciz yetki içinde ve geçerli olduğundan meşru savunma ve direnme hakkı savunmasının kabul edilmemesi", puan: 10, madde: "TCK m. 25/1"}
    cozum: |
      **Nitelendirme:** Olayda kamu görevlisi icra memuruna karşı görevini engellemek amacıyla cebir ve tehdit kullanılmıştır. Temel suç görevi yaptırmamak için direnme olup nitelikli hâller ve yaralama sonucu ayrıca tartışılmalıdır.

      **Hukuki sorunlar:** (1) Murat mağdur sıfatı ve suçun temel şekli. (2) Murat'ın yargı görevi yapan olup olmadığı. (3) Birlikte işleme ve silah artırımları. (4) Kemik kırılmasının sonucu. (5) Ali'nin hukuka uygunluk savunması.

      **İlgili hükümler:** TCK m. 265/1 temel cezayı (6 ay-3 yıl), TCK m. 265/2 yargı görevi yapan kişilere karşı 2-4 yıl cezayı, TCK m. 265/3 birlikte işlemede üçte bir artırımı, TCK m. 265/4 silahla işlemede yarı artırımı, TCK m. 265/5 ağırlaşmış yaralamada ayrıca kasten yaralama hükümlerini düzenler. Silah tanımı TCK m. 6/1-f'dedir; kemik kırılması ise TCK m. 87/3'tedir.

      **Değerlendirme:** Murat TCK m. 6/1-c anlamında kamu görevlisidir ve haciz, görevinin bir parçasıdır. Ali ve Veli, haczi engelleme amacıyla tehdit ve cebir kullandıklarından TCK m. 265/1'in temel şeklini işlemişlerdir. TCK m. 6/1-d yargı görevi yapan kişiyi yüksek mahkemeler, adli ve idari mahkemeler üye ve hâkimleri, Cumhuriyet savcısı ve avukatlar olarak sayar; icra memuru bu sayımda yer almadığından TCK m. 265/2'deki daha ağır ceza uygulanamaz. Suç iki kişi tarafından birlikte işlendiği için TCK m. 265/3 uyarınca ceza üçte bir artırılır. Demir sopa, fiilen saldırıda kullanılmaya elverişli olduğundan TCK m. 6/1-f kapsamında silahtır ve Ali bakımından TCK m. 265/4 uyarınca ayrıca yarı oranında artırım yapılır. Sopanın kullanılması Veli'yle ortak kararın dışında kalan ve Veli'nin beklemediği bir davranış olduğundan, Veli'nin kastı bu nitelikli hâli kapsamaz; Veli bakımından silah artırımı uygulanmaz. Bu artırımların hangi sırayla ve hangi tabana göre hesaplanacağı ayrı bir tartışma konusudur; bu notta hesap yapılmaz. Kemik kırılması TCK m. 87/3 kapsamındaki neticesi sebebiyle ağırlaşmış yaralamadır; TCK m. 265/5 gereği Ali hakkında ayrıca kasten yaralama hükümleri uygulanır. Yaralamayı ortak kararın dışına çıkarak yalnız Ali gerçekleştirdiğinden Veli yaralamadan sorumlu tutulmaz; Veli'nin tehdidi birlikte işlenen direnmeyi oluşturur. Haciz geçerli bir icra takibine dayandığı ve görevli yetkisi dahilinde hareket ettiği için Ali'nin haksız bir saldırıya karşı koyduğu söylenemez; TCK m. 25/1'in şartları bulunmadığından meşru savunma kabul edilemez ve haczin esasına yönelik itirazlar cebirle değil hukuki yollarla ileri sürülmelidir.

      **Sonuç:** Ali ve Veli, TCK m. 265/1 uyarınca görevi yaptırmamak için direnmeden cezalandırılır; TCK m. 265/2 uygulanmaz. İkisinin cezası TCK m. 265/3 nedeniyle artırılır; TCK m. 265/4'teki silah artırımı yalnız Ali'ye uygulanır. Ali hakkında ayrıca TCK m. 265/5 gereği kasten yaralama hükümleri (TCK m. 87/3 ağırlaşmış hâliyle) uygulanır. Meşru savunma savunması reddedilir.
kartlar:
  - on: "Nüfuz ticaretinin cezası ve kimlerin fail olabildiği (TCK m. 255/1)?"
    arka: "Nüfuz satana 2-5 yıl hapis ve beşbin güne kadar adli para cezası; herkes fail olabilir, fail kamu görevlisiyse hapis yarı oranında artırılır. İşini gördürmek için menfaat verene 1-3 yıl hapis."
  - on: "Nüfuz ticareti ile rüşvet nasıl ayrılır?"
    arka: "Menfaat işi yapacak görevliye gidiyorsa rüşvet (TCK m. 252). Nüfuzu olduğunu söyleyen kişiye ve haksız iş için gidiyorsa nüfuz ticareti (TCK m. 255)."
  - on: "İş haklıysa ve nüfuz yalansa?"
    arka: "Dolandırıcılık: TCK m. 158/2 uyarınca TCK m. 158/1 hükmüne göre cezalandırılır; iş sahibi mağdurdur."
  - on: "Nüfuz ticaretinde anlaşma ve kabul edilmeyen teklif?"
    arka: "Anlaşma yapılınca suç tamamlanmış gibi cezalandırılır (TCK m. 255/2). Teklif veya talep kabul edilmezse ceza yarı oranında indirilir (TCK m. 255/3)."
  - on: "Nüfuz ticaretinde etkin pişmanlık var mı?"
    arka: "Yok. TCK m. 254'teki etkin pişmanlık rüşvete özgüdür."
  - on: "TCK m. 256 neyi düzenler?"
    arka: "Zor kullanma yetkisine sahip görevlinin ölçünün dışında kuvvet kullanması; kasten yaralamaya ilişkin hükümler uygulanır. Kendi cezası yoktur."
  - on: "TCK m. 257'nin iki şekli ve cezaları?"
    arka: "İcrai (görevin gereklerine aykırı hareket) 6 ay-2 yıl; ihmali (ihmal veya gecikme) 3 ay-1 yıl hapis. İkisinde de mağduriyet, kamu zararı veya haksız menfaat aranır."
  - on: "TCK m. 257 neden tamamlayıcı normdur?"
    arka: "Kanunda ayrıca suç olarak tanımlanan haller dışında uygulanır; rüşvet, zimmet gibi özel suç oluşuyorsa uygulanmaz."
  - on: "Göreve ilişkin sırrın açıklanması cezası ve sıfat sona ermesi?"
    arka: "1-4 yıl hapis (TCK m. 258/1). Kamu görevlisi sıfatı sona erdikten sonra fiili işleyen de aynı cezayı alır (TCK m. 258/2)."
  - on: "TCK m. 260'ta kaç kişi gerekir?"
    arka: "Görevli sayısı üçten fazla olmazsa ceza verilmez; en az dört kişi gerekir. Ceza 3 ay-1 yıl hapistir."
  - on: "TCK m. 265'te cezalar ve artırımlar?"
    arka: "Temel 6 ay-3 yıl; yargı görevi yapan kişiye karşı 2-4 yıl. Birlikte veya yüzü gizli: 1/3 artırım. Silah veya örgüt gücü: yarı artırım."
  - on: "Direnirken görevlinin kemiği kırılırsa?"
    arka: "Neticesi sebebiyle ağırlaşmış yaralama (TCK m. 87/3) gerçekleştiğinden TCK m. 265/5 gereği ayrıca kasten yaralama hükümleri de uygulanır."
