    arka: "1 yıldan 5 yıla kadar hapis (7571 sayılı Kanun öncesi 6 ay-3 yıl)."
  - on: "Ses ve gaz fişeği atabilen silahla ateş cezası?"
    arka: "TCK m. 170/1 ikinci cümle: 6 aydan 3 yıla kadar hapis."
  - on: "TCK m. 170/2 ne söyler?"
    arka: "Kişilerin toplu olarak bulundukları yerlerde işlenirse ceza yarı oranında artırılır (7571 sayılı Kanunla eklendi)."
  - on: "TCK m. 170/3 (eski f.2)?"
    arka: "Yangın, bina çökmesi, toprak kayması, çığ, sel veya taşkın tehlikesine neden olma: 3 ay-1 yıl hapis veya adli para."
  - on: "TCK m. 171 kapsamı?"
    arka: "Taksirle yangına, bina çökmesine, toprak kaymasına, çığ düşmesine, sel veya taşkına neden olma; fiil tehlikeli olmalı; 3 ay-1 yıl hapis. Silahla ateş yok."
  - on: "Taksirle orman yangını ve TCK m. 171?"
    arka: "Birlikte uygulanmaz; TCK m. 44 fikrî içtima, en ağır cezayı gerektiren suçtan hüküm kurulur (6831 sayılı Kanun m. 110)."
  - on: "TCK m. 179/1 cezası?"
    arka: "İşaret, yol, teknik sistem müdahalesiyle tehlike: 1 yıldan 6 yıla kadar hapis."
  - on: "TCK m. 179/2 ve değişikliği?"
    arka: "Tehlikeli sevk ve idare: 4 aydan 2 yıla kadar hapis (7550 sayılı Kanunla alt sınır 3 aydan 4 aya)."
  - on: "TCK m. 179/3 cezası?"
    arka: "Alkol, uyuşturucu veya başka nedenle emniyetli araç kullanamayacak hâlde araç kullanma: 6 aydan 2 yıla kadar hapis."
  - on: "KTK m. 48/6 ne söyler?"
    arka: "1,00 promilin üzerinde alkollü sürücü hakkında ayrıca TCK m. 179/3 uygulanır."
  - on: "TCK m. 180 kapsamı?"
    arka: "Yalnız deniz, hava, demiryolu ulaşımında taksirle tehlike; 3 ay-3 yıl hapis. Kara ulaşımı kapsam dışı."
  - on: "Alkollü kazada şikâyetten vazgeçme?"
    arka: "Basit taksirle yaralama (TCK m. 89/1) şikâyete bağlı: düşer. TCK m. 179/3 şikâyete bağlı değil: ayakta kalır."
