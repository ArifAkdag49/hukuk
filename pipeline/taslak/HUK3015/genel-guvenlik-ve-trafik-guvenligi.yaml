kararlar:
  - id: "1231681700"
    ozet: |
      Sanık 03.07.2018 tarihinde 2,25 promil alkollü olarak araç kullanırken yakalanmıştır. İlk derece mahkemesi, sanığın kasten hareket etmediği değerlendirmesiyle beraat kararı vermiş, Bölge Adliye Mahkemesi savcının istinaf talebini kabul ederek bu hükmü kaldırmış ve sanığı TCK m. 179/3 delaletiyle TCK m. 179/2 uyarınca mahkûm etmiştir (hükmün açıklanmasının geri bırakılması ve sonradan denetim süresinde işlenen kasıtlı suç nedeniyle açıklanması söz konusu olmuştur). Sanık müdafii, sanığın eşi rahatsızlandığı için araç kullandığını ve suç kastı bulunmadığını ileri sürerek temyiz etmiştir. Yargıtay 12. Ceza Dairesi, temyiz sebeplerini yerinde görmeyerek oybirliğiyle temyiz isteminin esastan reddine ve hükmün onanmasına karar vermiştir. Karar, 2,25 promil alkollü sürüşte beraatin kaldırılıp mahkûmiyetin onandığı bir örnektir.
  - id: "1217379000"
    ozet: |
      Sanık hakkında tek bir eylem nedeniyle hem 6831 sayılı Kanun m. 110/2 (ormanlarda izin verilmeyen yerde ateş yakma, ormana yakın yerde anız yakma gibi yasaklanmış fiiller) hem de TCK m. 171/1-a uyarınca ayrı ayrı mahkûmiyet kurulmuştur. Yargıtay 7. Ceza Dairesi, sanığın eyleminin TCK m. 44 uyarınca 6831 sayılı Kanun m. 110/2'deki suç kapsamında kaldığını belirtmiştir. Ancak sanık hakkında mahkûmiyet hükmünün kurulduğu 12.05.2016 tarihinden temyiz inceleme tarihine kadar TCK m. 66/1-e'deki 8 yıllık olağan dava zamanaşımı süresi dolduğundan hükümleri bozmuş ve kamu davalarının CMK m. 223/8 uyarınca zamanaşımı nedeniyle düşmesine karar vermiştir. Karar, tek fiille Orman Kanunundaki bir suç ve TCK m. 171 birlikte oluştuğunda TCK m. 44'ün işleyişini gösterir; ayrıca iki ayrı mahkûmiyetin kurulamayacağını da ortaya koyar.
