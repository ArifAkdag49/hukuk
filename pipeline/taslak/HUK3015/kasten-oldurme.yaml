ozet: |
  - **Korunan değer:** yaşam hakkı. Kasten öldürme TCK m. 81 (temel şekil), TCK m. 82 (nitelikli hâller) ve TCK m. 83 (ihmali davranışla öldürme) maddelerinde düzenlenir. Görevli mahkeme ağır ceza mahkemesidir.
  - **Temel şekil (TCK m. 81/1):** bir insanı kasten öldüren **müebbet hapis** cezası alır. Fail ve mağdur herkes olabilir; konu, sağ doğmuş ve yaşayan insandır. Cesede yönelik fiilde konu yokluğu vardır.
  - **Nitelikli hâller (TCK m. 82/1):** on bir bent (a-k); ceza **ağırlaştırılmış müebbet hapis**. Bentler: tasarlama, canavarca his veya eziyet, genel tehlike yaratan araçlar, yakın akraba (boşandığı eş dahil), çocuk veya kendini savunamayan kişi, kadına karşı, kamu görevi nedeniyle, suçla bağlantılı saikler (gizleme, kolaylaştırma, yakalanmama, suçu işleyememekten infial), kan gütme, töre.
  - 📌 **Değişiklikler:** TCK m. 82/1-d bendine "boşandığı eş" (7331 sayılı Kanun), TCK m. 82/1-f bendi "Kadına karşı" (7406 sayılı Kanun).
  - **Birden fazla bent** gerçekleşse de tek bir ağırlaştırılmış müebbet söz konusudur.
  - **İhmali davranışla öldürme (TCK m. 83):** ihmal ancak icrai davranışa **eşdeğer** ise; eşdeğerlik için ya kanun veya sözleşmeden doğan yükümlülük (m. 83/2-a) ya da önceki tehlikeli davranış (m. 83/2-b) gerekir. Hâkim ağırlaştırılmış müebbet yerine 20-25 yıl, müebbet yerine 15-20 yıl, diğer hâllerde 10-15 yıl verebilir ya da indirim yapmayabilir (TCK m. 83/3).
  - **Kast türleri:** doğrudan kast (TCK m. 21/1) ve olası kast (TCK m. 21/2). Olası kastta temel ceza: müebbet gerektiren suçta 20-25 yıl hapis.
  - **Haksız tahrik (TCK m. 29):** ağırlaştırılmış müebbet yerine 18-24 yıl, müebbet yerine 12-18 yıl hapis.
  - **Teşebbüs (TCK m. 35/2):** ağırlaştırılmış müebbet yerine 14-21 yıl, müebbet yerine 10-18 yıl. Kasten öldürmede zincirleme suç hükümleri uygulanmaz (TCK m. 43/3).
  - **Öldürme kastı** darbe sayısı ve şiddeti, hedeflenen vücut bölgesi, aletin elverişliliği, failin eylemini neden bıraktığı gibi olgulardan çıkarılır; şüpheden sanık yararlanır.
anlatim: |
  ## 1. Kasten öldürme neyi korur, kime karşı işlenir?

  **Kasten öldürme** suçunun hukuki konusu yaşam hakkıdır. TCK m. 81 temel şekli düzenler: "Bir insanı kasten öldüren kişi, müebbet hapis cezası ile cezalandırılır." Fail de mağdur da herkes olabilir. Mağdurun **rızası** sonucu değiştirmez: TCK m. 26/2 yalnızca kişinin "üzerinde mutlak surette tasarruf edebileceği" haklar için rızayı hukuka uygunluk sebebi sayar, yaşam bu türden bir hak değildir. Bu yüzden "öldür beni" diyen kişiyi öldürmek de kasten öldürmedir.

  Suçun konusu **sağ doğmuş, yaşayan insandır**. Doğum eylemi başladıktan sonra çocuğa yönelen öldürme fiilleri bu suç kapsamında değerlendirilir; hayatı sona ermiş (beyin ölümü gerçekleşmiş) kişiye yönelen fiil ise konu yokluğu yüzünden öldürme suçunu oluşturmaz. Kendi yaşamına son vermek suç değildir; başkasının intihara yönlendirilmesi ayrı bir suçtur (sonraki konu).

  Suç **serbest hareketli ve neticeli** bir suçtur: ölüme elverişli her icrai hareketle (ateş etme, bıçaklama, zehirleme, boğma) işlenebilir. Hareket ile ölüm arasında nedensellik bağı ve objektif isnat gerekir.

  > **Örnek:** Ali, Mehmet'in göğsüne yakın mesafeden ateş eder; Mehmet hastanede ölür. Hareket, ölüm ve nedensellik vardır; Ali kastla hareket ettiyse TCK m. 81 uygulanır.

  ## 2. Manevi unsur: kast ve öldürme kastının tespiti

  TCK m. 21/1 kastı "unsurların bilerek ve istenerek gerçekleştirilmesi" diye tanımlar. **Olası kast** ise failin ölümün gerçekleşebileceğini öngörmesine rağmen fiili işlemesidir (TCK m. 21/2). Burada kanun cezayı da belirler: müebbet hapis gerektiren suçlarda 20-25 yıl hapis, ağırlaştırılmış müebbet gerektiren suçlarda ise müebbet hapis.

  Asıl sınav sorusu şudur: failin kastı **öldürmeye mi, yaralamaya mı** yönelikti? Bunu anlatan doğrudan bir itiraf yoksa kast, dış olgulardan çıkarılır. Yargıtay uygulamasında şunlara bakılır:

  - fail ile mağdur arasında önceden bir husumet olup olmadığı,
  - kullanılan aletin öldürmeye elverişliliği,
  - darbe sayısı ve şiddeti,
  - hedef alınan vücut bölgesi (baş, boyun, göğüs, karın gibi hayati bölgeler),
  - failin eylemini kendi isteğiyle mi yoksa dış bir engel yüzünden mi bıraktığı,
  - olaydan sonraki davranışları (yardım çağırması, hastaneye götürmesi gibi).

  Öldürme kastı **her türlü şüpheden uzak, kesin delillerle** gösterilemiyorsa fiil kasten öldürme olarak kabul edilemez; bu durumda yaralama suçları (TCK m. 87/4: kasten yaralama sonucu ölüm) gündeme gelir.

  > ⚠️ **Sınavda dikkat:** "Hayati tehlike geçirdi" ya da "mağdur öldü" olgusu tek başına öldürme kastını kanıtlamaz. Kastı ayrı ayrı olgularla gerekçelendirin.

  ## 3. Nitelikli hâller (TCK m. 82/1)

  Kasten öldürmenin aşağıdaki hâllerden biriyle işlenmesi hâlinde ceza **ağırlaştırılmış müebbet hapistir**. Bentleri üç gruba ayırarak çalışmak kolaylık sağlar.

  ### a) İşleniş biçimi ve araçla ilgili bentler

  - **Tasarlayarak (a):** fail öldürme kararını önceden vermiş, karar ile icra arasında makul bir süre geçmiş, bu sürede ruhen sakinleşebilecekken kararında ısrar edip fiili planlı biçimde işlemiştir. Kararın ne zaman verildiği kesin olarak saptanamıyorsa şüphe sanık lehine yorumlanır ve tasarlama kabul edilmez.
  - **Canavarca hisle veya eziyet çektirerek (b):** canavarca histe fail öldürmenin ötesinde, acımasız ve sadistçe bir dürtüyle hareket eder. Eziyet çektirerek öldürmede ise ölümü meydana getirmek için zorunlu olmayan, ölüme takaddüm eden ve mağdura yoğun acı veren vahşice hareketler vardır.
  - **Yangın, su baskını, tahrip, batırma veya bombalama ya da nükleer, biyolojik veya kimyasal silah kullanarak (c).**

  ### b) Mağdurun sıfatı ve fail-mağdur ilişkisiyle ilgili bentler

  - **Üstsoy veya altsoydan birine ya da eş, boşandığı eş veya kardeşe karşı (d).** Sayılanlar sınırlıdır; kayıt dışı birlikte yaşanan kişi bu bentte sayılmaz.
  - **Çocuğa ya da beden veya ruh bakımından kendisini savunamayacak durumda bulunan kişiye karşı (e).** Çocuk, 18 yaşını doldurmamış kişidir (TCK m. 6/1-b). Yaşlılık, hastalık, engellilik gibi sebeplerle savunmasız kişi de bu bentte yer alır.
  - **Kadına karşı (f).** Mağdurun kadın olması yeter; gebelik aranmaz.
  - **Kişinin yerine getirdiği kamu görevi nedeniyle (g).** Öldürmenin görev sırasında olması şart değildir, ancak görevden kaynaklanmalıdır.

  ### c) Saike (amaca) dayanan bentler

  - **Bir suçu gizlemek, delillerini ortadan kaldırmak veya işlenmesini kolaylaştırmak ya da yakalanmamak amacıyla (h).** Gizlenmek istenen ya da kolaylaştırılmak istenen suç da işlenmişse ayrıca cezalandırılması gündeme gelir.
  - **Bir suçu işleyememekten dolayı duyduğu infialle (i).**
  - **Kan gütme saikiyle (j)** ve **töre saikiyle (k).**

  > 📌 **Kesin bilgi:** Hangi bentten ve kaç bentten olursa olsun nitelikli kasten öldürmenin cezası tek ve aynıdır: ağırlaştırılmış müebbet hapis. Birden fazla bentin gerçekleşmesi yaptırımı artırmaz; ağırlaştırılmış müebbetin alt ve üst sınırı olmadığından TCK m. 61'e göre bir temel ceza aralığı da belirlenmez. Bentlerin hepsi yalnızca fiili tam nitelendirmek ve haksızlığın ağırlığını göstermek için yazılır.

  ### 📌 Yakın tarihli değişiklikler

  | Hüküm | Önce | Sonra |
  |---|---|---|
  | TCK m. 82/1-d | "eş veya kardeşe karşı" | "eş, boşandığı eş veya kardeşe karşı" (7331 sayılı Kanunla) |
  | TCK m. 82/1-f | "Gebe olduğu bilinen kadına karşı" | "Kadına karşı" (7406 sayılı Kanunla) |

  Ceza (ağırlaştırılmış müebbet) değişmemiş, yalnızca bentlerin kapsamı genişlemiştir. Öğrenci eski kitaplardan çalışıyorsa bu iki bent özellikle güncellenmelidir.

  > **Örnek:** Ayşe ile Kemal mahkeme kararıyla boşanmıştır. Kemal, eski eşini kıskançlık yüzünden öldürürse hem "boşandığı eş" (d) hem "kadına karşı" (f) bentleri gerçekleşir. Ceza yine tek bir ağırlaştırılmış müebbettir.

  ## 4. İhmali davranışla kasten öldürme (TCK m. 83)

  Ölüm bazen bir şeyi **yapmamakla** da gerçekleşir. Ancak herkes her ölümden sorumlu tutulamaz. TCK m. 83/1'e göre ölümden sorumlu tutulabilmek için ihmalin icrai davranışa **eşdeğer** olması gerekir. Eşdeğerlik için TCK m. 83/2 iki yol açar:

  1. Kişinin belli bir icrai davranışta bulunmak hususunda **kanuni düzenlemelerden veya sözleşmeden** doğan bir yükümlülüğü vardır (m. 83/2-a). Örnek: bebeğine bakmayan anne, sözleşmeyle görev yapan cankurtaran.
  2. Kişinin **önceden gerçekleştirdiği davranış** başkalarının hayatı bakımından tehlikeli bir durum oluşturmuştur (m. 83/2-b). Örnek: şaka olsun diye yüzme bilmeyen çocuğu havuza iten, sonra boğulmakta olduğunu görünce onu sudan çıkarmayan kişi.

  Bu kişilere öğretide **garantör** denir. Garantör olmayan kimsenin yardım etmemesi ise TCK m. 98 kapsamında değerlendirilir; yardım yükümlülüğünün yerine getirilmemesi dolayısıyla kişinin ölmesi hâlinde 1-3 yıl hapis öngörülür (TCK m. 98/2).

  **Ceza (TCK m. 83/3):** Hâkim ağırlaştırılmış müebbet hapis yerine 20-25 yıl, müebbet yerine 15-20 yıl, diğer hâllerde 10-15 yıl hapse hükmedebilir; bunun yanında cezada indirim de yapılmayabilir. Yargıtay'ın bir kararında belirttiği sıra şöyledir: önce bir icrai davranışla işlenseydi uygulanacak temel ceza (örneğin failin kendi çocuğuna karşı işlenmişse TCK m. 82/1-d ve e) belirlenir, sonra TCK m. 83/3 uygulanır.

  > ⚠️ **Sınavda dikkat:** İhmal için kast da aranır. Ölümü istemeden, ihmal sonucu ortaya çıkan ölüm taksirle öldürmedir (sonraki konu). Ayrıca failin icrai bir darpla çocuğunu öldürdüğü, öldürme kastının kanıtlanamadığı olayda TCK m. 83 değil, kasten yaralama sonucu ölüm (TCK m. 87/4) gündeme gelir.

  ## 5. Haksız tahrik, teşebbüs ve diğer ilişkiler

  **Haksız tahrik (TCK m. 29):** Haksız bir fiilin meydana getirdiği hiddet veya şiddetli elemin etkisiyle öldürmede ağırlaştırılmış müebbet yerine 18-24 yıl, müebbet yerine 12-18 yıl hapis verilir. Mağdurdan faile yönelen hiçbir haksız söz veya davranış yoksa tahrik indirimi uygulanmaz. İlk haksız hareketin kimden geldiği karşılıklı kavgada belirlenemezse şüphe sanık yararına yorumlanır ve asgari oranda indirim gündeme gelir.

  **Teşebbüs (TCK m. 35/2):** Fail öldürmeye elverişli hareketlerle başlayıp elinde olmayan nedenlerle ölüm gerçekleşmezse teşebbüsten sorumlu olur. Ağırlaştırılmış müebbet yerine 14-21 yıl, müebbet yerine 10-18 yıl hapis verilir. 📌 Bu aralıklar 7550 sayılı Kanunla (4.6.2025) hem alt hem üst sınırda yükseltilmiştir; önceki metinde ağırlaştırılmış müebbet yerine 13-20 yıl, müebbet yerine 9-15 yıl vardı.

  **Zincirleme suç:** TCK m. 43/3'e göre kasten öldürmede zincirleme suç hükümleri uygulanmaz. Fail aynı kişiyi iki ayrı tarihte öldürmeye çalışırsa ya da iki kişiyi öldürürse her biri ayrı suç sayılır.

  **Kasten yaralama ile ayrım:** Eylem ölümle sonuçlanmasına rağmen öldürme kastı kanıtlanamıyorsa TCK m. 87/4 (kasten yaralama sonucu ölüm) uygulanır. Bu ayrım uygulamada en çok tartışılan sınırdır.

  ## 6. Olay çözerken sık düşülen hatalar

  **Hata 1: "Silah kullandı, o hâlde nitelikli."** Silah kullanmak TCK m. 82/1 bentlerinden biri değildir. Nitelikli hâl ancak bentlerde yazılı sebeplerle kurulur: tasarlama, mağdurun sıfatı, saik gibi. Ateşli silahla işlenen basit bir kasten öldürme TCK m. 81 kapsamında kalabilir.

  **Hata 2: Bentleri toplayıp ceza artırmak.** Ceza zaten ağırlaştırılmış müebbettir; "iki bent var, ceza iki katı" demek yanlıştır. Bentlerin sayısı cezanın türünü değiştirmez, yalnızca olayı tam nitelendirmek için gösterilir.

  **Hata 3: Eski metne göre cevap vermek.** Eski bir kitapta TCK m. 82/1-d bendinde "boşandığı eş" yoktur, TCK m. 82/1-f bendi ise gebe kadınla sınırlıdır. Güncel metne göre boşandığı eşin öldürülmesi ve herhangi bir kadının öldürülmesi nitelikli hâldir.

  **Hata 4: Her ölümü öldürme saymak.** Ölüm gerçekleşti diye öldürme kastı kabul edilmez. Failin kullandığı alet, hedeflediği bölge, darbe sayısı ve olay sonrası davranışı birlikte tartılır. Kast kesin olarak gösterilemiyorsa yaralama suçları (özellikle TCK m. 87/4) düşünülür. Çocuğunu öfkeyle darp eden ve sonra hastaneye götüren ebeveynin olayı bunun tipik örneğidir.

  **Hata 5: İhmali öldürmeyi her yardım etmemeye genişletmek.** Yolda boğulan birine yardım etmeyen yoldan geçen kişi garantör değildir; TCK m. 98 yardım yükümlülüğü gündeme gelir. Ancak o kişi boğulmayı kendi davranışıyla yaratmışsa (TCK m. 83/2-b) ya da görev sözleşmesi varsa (TCK m. 83/2-a) TCK m. 83 uygulanır.

  > **Örnek:** Zeynep, kuyunun başında komşu çocuğuyla oynarken dikkatsizce çarparak onu kuyuya düşürür, sonra çocuğun bağırışlarına rağmen onun ölmesini isteyerek yardım çağırmaz. Zeynep'in önceki davranışı çocuğun hayatını tehlikeye sokmuştur; garantördür. Yoldan geçen Hasan'ın aynı çocuğa yardım etmemesi ise yalnızca TCK m. 98 kapsamında değerlendirilebilir.

  ## 7. Denetim şeması

  1. Mağdur sağ doğmuş yaşayan insan mı? (Ceset: konu yok.)
  2. Hareket ve ölüm; nedensellik bağı var mı?
  3. Kast: doğrudan kast mı, olası kast mı (TCK m. 21)? Öldürme kastı mı, yaralama kastı mı?
  4. İcrai mi, ihmali mi? İhmaldeyse garantörlük (TCK m. 83/2-a veya b) var mı?
  5. Hukuka uygunluk sebebi var mı? (Rıza yaşam hakkında geçersizdir.)
  6. Nitelikli hâl: TCK m. 82/1'in a-k bentlerini tek tek tara.
  7. Haksız tahrik (TCK m. 29), teşebbüs (TCK m. 35), olası kast indirimi (TCK m. 21/2) gibi indirim sebepleri.
  8. Yaptırım ve içtima: zincirleme suç yok (TCK m. 43/3).
kritik: |
  - 📌 TCK m. 81 temel şekli **müebbet hapis**, TCK m. 82 nitelikli hâlleri **ağırlaştırılmış müebbet hapis** ile cezalandırır.
  - 📌 TCK m. 82/1'de **on bir bent** (a-k) vardır; birden fazla bent gerçekleşse de ceza tek bir ağırlaştırılmış müebbettir.
  - ⚠️ TCK m. 82/1-d: üstsoy, altsoy, eş, **boşandığı eş**, kardeş. Bu kapsam sınırlıdır; nişanlı, sevgili, amca-yeğen bu bentte yoktur.
  - ⚠️ TCK m. 82/1-f artık yalnızca "Kadına karşı"dır; gebelik şartı kaldırılmıştır (7406 sayılı Kanun).
  - 💡 "Tasarlama" için önceden verilmiş karar, makul zaman ve ısrar gerekir; kararın ne zaman verildiği belirsizse şüphe sanık yararınadır.
  - ⚠️ "Canavarca his" ile "eziyet çektirme" aynı bent içindedir (TCK m. 82/1-b); eziyet, ölüm için zorunlu olmayan vahşice hareketlerdir.
  - 📌 TCK m. 82/1-g kamu görevinin **görev nedeniyle** öldürülmeyi gerektirir; olayın görev sırasında geçmesi şart değildir.
  - ⚠️ Yaşam hakkında **rıza** hukuka uygunluk sebebi değildir (TCK m. 26/2); isteğe bağlı ölüm de kasten öldürmedir.
  - 📌 İhmali öldürmede iki garantörlük kaynağı: kanun/sözleşme (TCK m. 83/2-a) ve önceki tehlikeli davranış (TCK m. 83/2-b).
  - 📌 TCK m. 83/3: ağırlaştırılmış müebbet yerine **20-25**, müebbet yerine **15-20**, diğer hâllerde **10-15 yıl**; indirim yapılmayabilir.
  - ⚠️ Yardım etmeyen garantör olmayan kişi TCK m. 98'e girer (ölüm hâlinde 1-3 yıl); garantör ise TCK m. 83'e.
  - 📌 Olası kastta (TCK m. 21/2) müebbet gerektiren suçta 20-25 yıl hapis; haksız tahrikte (TCK m. 29) 18-24 / 12-18 yıl.
  - 📌 Kasten öldürmede zincirleme suç uygulanmaz (TCK m. 43/3).
doktrin: |
  ### Tasarlamanın özü: soğukkanlılık mı, planlama mı?
  Öğretide tasarlama için iki ana anlayış vardır. **Soğukkanlılık anlayışı** tasarlamanın özünü failin karar ile icra arasında ruhen sakinleşebilmiş olmasında görür; bu nedenle haksız tahrikin yarattığı hiddet ya da elemle bağdaşmadığını savunur. **Planlama anlayışı** ise ağırlığı suçun önceden hazırlanmasına ve planlanmasına verir. Uygulama genellikle iki ölçütü birlikte arar: karar, makul zaman ve kararda ısrar. Tasarlama ile haksız tahrikin birlikte uygulanıp uygulanamayacağı ise tartışmalıdır; sınavda gerekçenizi açık yazın ve bu noktayı sonucun tek dayanağı yapmayın.

  ### Olası kastla işlenen suça teşebbüs
  Olası kastla işlenmiş bir suça teşebbüsün mümkün olup olmadığı tartışmalıdır. Bir görüş, olası kastta failin neticeyi "göze aldığını", dolayısıyla icra hareketlerinin neticeye yönelmiş sayılabileceğini; karşı görüş ise teşebbüsün neticeyi kesin biçimde istemeyi gerektirdiğini savunur. Bu tartışma olay çözümlerinde sonuca bağlanmadan işlenmelidir.

  ### "Kadına karşı" bendinin kapsamı
  TCK m. 82/1-f bendi artık mağdurun kadın olmasını yeterli sayar. Doktrinde bu genişlemenin, cinsiyet ayrımcılığıyla ilgisi olmayan olaylarda da ağır yaptırım getirmesi eleştirilmektedir. Uygulama bendin metnine bağlı kalmakta ve mağdurun kadın olduğu kasten öldürmelerde uygulamaktadır.

  ### İhmali öldürmede garantörlük
  TCK m. 83/2 iki kaynak sayar. Doktrinde "sözleşme" kavramının geçerli bir sözleşmeden mi yoksa fiilen üstlenilmiş bir görevden mi doğacağı, "önceki tehlikeli davranış"ın hukuka aykırı olmasının gerekip gerekmediği tartışılır.
sozluk:
  - terim: Kasten öldürme
    tanim: "Bir insanın bilerek ve isteyerek (veya olası kastla) öldürülmesi; temel şekli TCK m. 81'de düzenlenir."
  - terim: Nitelikli hâl
    tanim: "Temel suça göre cezayı ağırlaştıran, TCK m. 82/1'de a-k bentleriyle sayılan işleniş biçimi, mağdur sıfatı veya saik."
  - terim: Tasarlama
    tanim: "Öldürme kararının önceden verilip makul zaman geçtikten sonra, kararda ısrar edilerek planlı biçimde uygulanması."
  - terim: Canavarca his
    tanim: "Failin öldürmeyi sadistçe bir dürtüyle, acımasızca gerçekleştirmesi."
  - terim: Eziyet çektirerek öldürme
    tanim: "Ölüm için zorunlu olmayan, ölüme takaddüm eden ve mağdura yoğun acı veren vahşice hareketlerle öldürme."
  - terim: Garantör
    tanim: "Kanun, sözleşme veya önceki tehlikeli davranış nedeniyle ölümü önleme yükümlülüğü bulunan kişi (TCK m. 83/2)."
  - terim: Eşdeğerlik
    tanim: "İhmalin, sonuç bakımından icrai davranışa denk sayılabilmesi (TCK m. 83/1)."
  - terim: Olası kast
    tanim: "Failin neticenin gerçekleşebileceğini öngörmesine rağmen fiili işlemesi (TCK m. 21/2)."
  - terim: Haksız tahrik
    tanim: "Haksız bir fiilin yarattığı hiddet veya şiddetli elemin etkisiyle suç işlenmesi; cezada indirim sebebi (TCK m. 29)."
  - terim: Konu yokluğu
    tanim: "Fiilin yöneldiği varlığın (ör. ceset) suçun konusu sayılmaması nedeniyle suçun oluşmaması."
  - terim: Kan gütme
    tanim: "Geçmişte işlenen bir öldürmenin öcünü almak için karşı taraftan birini öldürme saikiyle hareket etme (TCK m. 82/1-j)."
kararlar:
  - id: "1223755500"
    ozet: |
      Ankara'da sanık, tuvalet alışkanlığı kazandırmaya çalıştığı 2-3 yaşındaki kızını, tuvaletini halıya yaptığı için öfkeyle eliyle darp etmiş; çocuk başını duvara çarpıp bayılmış, sabaha kadar yatağında bırakılmış, sonra hastaneye götürülmüş ve birkaç gün sonra beyin kanaması ve doku harabiyetiyle ölmüştür. Ağır ceza mahkemesi sanığı kasten öldürmenin ihmali davranışla işlenmesinden (TCK m. 83/2-a-b ve m. 83/3) 25 yıl hapse mahkûm etmiş, bölge adliye mahkemesi istinafı esastan reddetmiştir. Yargıtay 1. Ceza Dairesi hükmü bozmuştur. Birinci gerekçe: darp, öfkeyle yapılan bir anlık icrai harekettir; öldürme kastı her türlü şüpheden uzak delillerle ortaya konmadığından beden bakımından kendini savunamayan çocuğa karşı kasten yaralama sonucu ölüme neden olma (TCK m. 87/4) düşünülmeli, TCK m. 83 uygulanmamalıydı. İkinci gerekçe: yine de TCK m. 83 uygulanacaksaydı, önce temel ceza TCK m. 82/1-d-e uyarınca belirlenmeli, sonra TCK m. 83/3 uyarınca 20 yıldan 25 yıla kadar hapse inilmeliydi. Karar, TCK m. 83'ün icrai bir darpla çocuğu öldürme olaylarında kolayca uygulanamayacağını, ayrımın kast üzerinden yapıldığını ve m. 83/3'ün uygulama sırasını gösterir.
  - id: "1220766100"
    ozet: |
      Ağrı'da sanık, maktulü öldürmekten ağır ceza mahkemesince TCK m. 81/1 uyarınca müebbet hapse mahkûm edilmiş; diğer sanıklar ve suça sürüklenen çocuk beraat etmiştir. Katılan vekili suçun tasarlanarak ve eziyet çektirerek işlendiğini, sanık müdafii ise haksız tahrik uygulanması gerektiğini ileri sürerek temyiz etmiştir. Yargıtay 1. Ceza Dairesi, bölge adliye mahkemesinin istinafı esastan reddeden kararını oy birliğiyle onamıştır. Daire, sanığın öldürme kararını ne zaman aldığının ve belli bir hazırlıkla hareket edip etmediğinin kesin olarak saptanamadığını, şüphenin sanık aleyhine yorumlanamayacağını, dolayısıyla tasarlama koşullarının bulunmadığını söylemiştir. Eziyet çektirerek öldürmeyi, öldürme kastının yanında işkence ya da eziyet çektirme kastını içeren, ölümü meydana getirmek için zorunlu olmayan ve ölüme takaddüm eden vahşice hareketler diye tanımlamış; somut olayda bunu kabul etmeye yeterli kesin kanıt bulmamıştır. Maktulden sanığa yönelen haksız bir söz veya davranış da bulunmadığından haksız tahrik koşulları gerçekleşmemiştir.
sorular:
  - soru: |
      Aşağıdakilerden hangisi TCK m. 81 uyarınca kasten öldürme suçunun temel şeklinin cezasıdır?
    siklar:
      - "Ağırlaştırılmış müebbet hapis"
      - "Müebbet hapis"
      - "20 yıldan 25 yıla kadar hapis"
      - "15 yıldan 20 yıla kadar hapis"
    dogru: 1
    aciklama: |
      Temel şekil müebbet hapistir (TCK m. 81/1). Ağırlaştırılmış müebbet nitelikli hâllere (TCK m. 82), 20-25 yıl ise olası kast ya da ihmali öldürme gibi özel hükümlere aittir.
  - soru: |
      Aşağıdakilerden hangisi TCK m. 82/1'de sayılan nitelikli hâller arasında yer almaz?
    siklar:
      - "Kan gütme saikiyle"
      - "Kadına karşı"
      - "Dini nikâhla birlikte yaşadığı kişiye karşı"
      - "Çocuğa karşı"
    dogru: 2
    aciklama: |
      TCK m. 82/1-d üstsoy, altsoy, eş, boşandığı eş ve kardeşi sayar; dini nikâhlı birlikte yaşanan kişi sayılmamıştır. Diğer üçü sırasıyla m. 82/1-j, f ve e bentleridir.
  - soru: |
      Cankurtaran sözleşmeyle görevli olduğu havuzda, boğulan çocuğu fark edip müdahale etmeyerek ölümüne izin vermiştir. Bu olayda failin sorumluluğu hangi hükme dayanır?
    siklar:
      - "TCK m. 98 (yardım yükümlülüğünün yerine getirilmemesi)"
      - "TCK m. 83/2-a (sözleşmeden doğan yükümlülük) ve TCK m. 83/3"
      - "TCK m. 29 (haksız tahrik)"
      - "Fail garantör olmadığı için sorumluluğu yoktur"
    dogru: 1
    aciklama: |
      Cankurtaran sözleşme gereği ölümü önleme yükümlülüğü altındadır; bu garantörlük TCK m. 83/2-a kapsamına girer. Garantör olmayan kimsenin yardım etmemesi TCK m. 98'in alanındadır.
  - soru: |
      Ayşe, kesinleşmiş mahkeme kararıyla boşandığı eşi Kemal'i, öldürmeye üç gün önceden karar verip pusuda bekleyerek öldürmüştür. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yalnızca TCK m. 81 uygulanır; boşanan eş kapsam dışındadır."
      - "Fail kadın olduğu için TCK m. 82/1-d uygulanmaz."
      - "TCK m. 82/1-a ve m. 82/1-d bentleri birlikte gerçekleşir; ceza ağırlaştırılmış müebbet hapistir."
      - "Her bent için ayrı bir ağırlaştırılmış müebbet verilir."
    dogru: 2
    aciklama: |
      TCK m. 82/1-d "boşandığı eş"i de kapsar; fail kadın ya da erkek olabilir. Önceden verilen karar ve pusu tasarlamayı gösterir (m. 82/1-a). Birden fazla bent gerçekleşse de tek bir ağırlaştırılmış müebbet hükmolunur.
  - soru: |
      Hangisi kasten öldürmenin ihmali davranışla işlenmesinde (TCK m. 83/2) eşdeğerliğin kaynağı değildir?
    siklar:
      - "Kanuni düzenlemeden doğan yükümlülük"
      - "Sözleşmeden doğan yükümlülük"
      - "Önceden gerçekleştirilen davranışın başkalarının hayatı bakımından tehlikeli bir durum oluşturması"
      - "Failin mağdurla arkadaş olması"
    dogru: 3
    aciklama: |
      TCK m. 83/2 yalnızca kanun veya sözleşmeden doğan yükümlülüğü ve önceki tehlikeli davranışı sayar. Arkadaşlık tek başına garantörlük doğurmaz.
  - soru: |
      İhmali davranışla kasten öldürmede, ağırlaştırılmış müebbet hapis gerektiren hâlde hâkim TCK m. 83/3 uyarınca hangi cezaya hükmedebilir?
    siklar:
      - "10-15 yıl hapis"
      - "15-20 yıl hapis"
      - "20-25 yıl hapis"
      - "Müebbet hapis"
    dogru: 2
    aciklama: |
      TCK m. 83/3: ağırlaştırılmış müebbet yerine 20-25 yıl, müebbet yerine 15-20 yıl, diğer hâllerde 10-15 yıl. Hâkim indirim de yapmayabilir.
  - soru: |
      Mehmet, kendisine hakaret eden Ali'yi öfke içinde tabancayla vurup öldürmüştür; Ali'nin hakareti dışında başka bir olay yoktur ve Mehmet öldürme kararını olay anında vermiştir. Hangi sonuç doğrudur?
    siklar:
      - "TCK m. 82/1-a uygulanır, çünkü Mehmet silah kullanmıştır."
      - "Tasarlama yoktur; silah kullanmak nitelikli hâl değildir ve TCK m. 81 temel şekli oluşur."
      - "Karar olay anında verildiği için kasten öldürme değil, kasten yaralama sonucu ölüm oluşur."
      - "Fiil taksirle öldürmedir."
    dogru: 1
    aciklama: |
      Karar olay anında verildiğinden tasarlama yoktur; silah kullanmak nitelikli hâl değildir. Öldürme kastı açık olduğundan TCK m. 81 uygulanır. Hakaretin tahrik sayılıp sayılmayacağı ayrıca TCK m. 29 çerçevesinde incelenir; soru yalnızca nitelendirmeyi sorar.
  - soru: |
      Hangisi TCK m. 82/1-f bendinde 7406 sayılı Kanunla yapılan değişikliği doğru ifade eder?
    siklar:
      - "Bende \"boşandığı eş\" eklenmiştir."
      - "\"Gebe olduğu bilinen kadına karşı\" yerine \"Kadına karşı\" denmiştir."
      - "Kadına karşı öldürme müebbet hapse indirilmiştir."
      - "Bent kaldırılmıştır."
    dogru: 1
    aciklama: |
      7406 sayılı Kanunun ikinci maddesiyle TCK m. 82/1-f bendi "Kadına karşı" biçiminde değiştirilmiştir. "Boşandığı eş" eklemesi m. 82/1-d bendinde ve 7331 sayılı Kanunladır.
  - soru: |
      Sanık, silahla mağdurun bacağına ateş etmiş, mağdur hastanede kan kaybından ölmüştür. Mahkeme sanığın öldürme kastını her türlü şüpheden uzak delille saptayamamıştır. Hangi suç düşünülür?
    siklar:
      - "Kasten öldürme (TCK m. 81)"
      - "Kasten yaralama sonucu ölüm (TCK m. 87/4)"
      - "Haksız tahrik"
      - "TCK m. 83 ihmali öldürme"
    dogru: 1
    aciklama: |
      Öldürme kastı kanıtlanamıyorsa fiil kasten yaralama olarak kalır ve ölüm neticesi bakımından TCK m. 87/4 uygulanır. Hedef alınan bölge (bacak), aletin kullanım şekli ve darbe sayısı kast tespitinde belirleyicidir.
  - soru: |
      Hangisi tasarlayarak öldürmenin (TCK m. 82/1-a) uygulanması bakımından doğrudur?
    siklar:
      - "Fail öldürme kararını fiilin işlendiği anda vermişse bile tasarlama vardır."
      - "Kararın ne zaman verildiği kesin olarak saptanamıyorsa şüphe sanık aleyhine yorumlanır ve tasarlama kabul edilir."
      - "Kararın ne zaman verildiği saptanamıyorsa şüphe sanık yararına yorumlanır ve tasarlama kabul edilmez."
      - "Tasarlama için failin silah taşıması yeterlidir."
    dogru: 2
    aciklama: |
      Tasarlama; karar, makul zaman ve kararda ısrar gerektirir. Kararın ne zaman verildiği belirlenemiyorsa şüpheden sanık yararlanır ilkesi gereği m. 82/1-a uygulanmaz.
  - soru: |
      Kasten öldürmede, aynı kişiye karşı farklı zamanlarda aynı suç işleme kararının icrası kapsamında birden çok kez öldürme girişimi yapılmıştır. Hangisi doğrudur?
    siklar:
      - "Zincirleme suç hükümleri uygulanır ve tek ceza artırılır."
      - "Zincirleme suç hükümleri kasten öldürmede uygulanmaz (TCK m. 43/3)."
      - "Yalnızca ilk girişim cezalandırılır."
      - "Bütün girişimler tek bir nitelikli hâl sayılır."
    dogru: 1
    aciklama: |
      TCK m. 43/3, kasten öldürme ve kasten yaralamada zincirleme suç hükümlerinin uygulanmayacağını söyler.
  - soru: |
      Hangisi kasten öldürme ile 18 yaşını doldurmamış kişilere ilişkin bentte doğrudur?
    siklar:
      - "TCK m. 82/1-e çocuğa karşı işlenen öldürmede ağırlaştırılmış müebbet öngörür; çocuk 18 yaşını doldurmamış kişidir."
      - "Çocuk 15 yaşını doldurmamış kişidir."
      - "Çocuğa karşı öldürme TCK m. 81 temel şekliyle cezalandırılır."
      - "Çocuğa karşı öldürmede haksız tahrik hiçbir koşulda yoktur."
    dogru: 0
    aciklama: |
      TCK m. 82/1-e çocuğa ya da kendisini savunamayacak durumdaki kişiye karşı işlenen öldürmeyi nitelikli sayar. Çocuk, TCK m. 6/1-b uyarınca henüz 18 yaşını doldurmamış kişidir.
olaylar:
  - olay: |
      Nurcan'dan kesinleşmiş mahkeme kararıyla boşanan Hakan, Nurcan'ın başkasıyla nişanlandığını öğrenince onu öldürmeye karar verir. Üç gün boyunca Nurcan'ın iş çıkışını izler, silahını hazırlar ve dördüncü gün Nurcan'ı iş yerinin önünde bekler. Nurcan çıktığında Hakan yakın mesafeden dört el ateş eder; Nurcan olay yerinde ölür. Hakan olay yerinden kaçarken yolda yakalamaya çalışan trafik polisi Cem'i görür; yakalanmamak için Cem'e de ateş eder ve Cem hayatını kaybeder. Mağdurların Hakan'a karşı daha önce hiçbir haksız söz veya davranışı olmamıştır.
      1. Hakan'ın Nurcan'a yönelik eyleminin hukuki nitelendirmesi ve cezası nedir?
      2. Hakan'ın Cem'e yönelik eyleminin hukuki nitelendirmesi nedir?
      3. İki ölüm bakımından zincirleme suç hükümleri uygulanabilir mi?
    olcut:
      - {tespit: "Nurcan'a yönelik eylemde kasten öldürme ve tasarlama (karar, zaman, ısrar) tespiti", puan: 20, madde: "TCK m. 82"}
      - {tespit: "Boşandığı eşe karşı ve kadına karşı bentlerinin gerçekleşmesi (d ve f)", puan: 20, madde: "TCK m. 82"}
      - {tespit: "Birden fazla bentte tek ağırlaştırılmış müebbet hapis; haksız fiil bulunmadığından haksız tahrik yok", puan: 15, madde: "TCK m. 29"}
      - {tespit: "Cem'e yönelik eylemde kamu görevi nedeniyle ve yakalanmamak amacıyla bentleri (g ve h)", puan: 25, madde: "TCK m. 82"}
      - {tespit: "Kasten öldürmede zincirleme suç hükümlerinin uygulanmaması", puan: 20, madde: "TCK m. 43"}
    cozum: |
      **Nitelendirme:** Olay iki ayrı kasten öldürme fiilidir. Her ikisinde de mağdurlar sağ doğmuş yaşayan insanlardır, hareket (ateş etme) ile ölüm arasında nedensellik vardır ve Hakan doğrudan kastla hareket etmiştir. Temel suç TCK m. 81'dir; nitelikli hâller TCK m. 82/1 çerçevesinde incelenir.

      **Nurcan bakımından:** Hakan öldürme kararını üç gün önce vermiş, bu sürede izleme ve hazırlık yapmış, dördüncü gün kararını uygulamıştır. Karar, makul bir zaman ve kararda ısrar bulunduğundan tasarlama oluşmuştur (TCK m. 82/1-a). Nurcan, kesinleşmiş kararla boşandığı eştir; bu nedenle TCK m. 82/1-d ("boşandığı eş") gerçekleşmiştir. Nurcan kadın olduğundan TCK m. 82/1-f de gerçekleşmiştir. Birden fazla bent gerçekleşmesi cezayı artırmaz; Hakan tek bir ağırlaştırılmış müebbet hapisle cezalandırılır. Mağdurdan faile yönelen haksız bir fiil bulunmadığından TCK m. 29 uygulanmaz; eski eşin başkasıyla nişanlanması Hakan'a haksız tahrik hakkı doğurmaz. Bu sonuç olayın verilerine göre açıktır.

      **Cem bakımından:** Cem'i yakalamaya çalışan polis memuru, kamu görevi yapmaktadır (TCK m. 6/1-c). Hakan'ın Cem'i öldürmesi, Cem'in yaptığı bu görevden kaynaklandığı için TCK m. 82/1-g bendini gerçekleştirir. Ayrıca Hakan, daha önce işlediği suç nedeniyle yakalanmamak amacıyla hareket ettiğinden TCK m. 82/1-h bendi de gerçekleşmiştir. Bu ikinci eylem için de ağırlaştırılmış müebbet hapis verilir.

      **İçtima:** Her iki ölüm bakımından da TCK m. 43/3 gereği zincirleme suç hükümleri uygulanmaz. Hakan iki ayrı kasten öldürme suçundan ayrı ayrı sorumlu tutulur.

      **Sonuç:** Hakan, Nurcan'ı TCK m. 82/1-a, d ve f bentlerinden; Cem'i TCK m. 82/1-g ve h bentlerinden öldürmüştür. Her fiil için ağırlaştırılmış müebbet hapis söz konusudur ve zincirleme suç artırımı yapılmaz.
  - olay: |
      Belediye ile yaptığı yazılı sözleşme gereği yaz boyunca halk plajında cankurtaran olarak görev yapan Selim, sahilde yüzmekte olan 30 yaşındaki bir erkeğin boğulmaya başladığını fark eder. Selim, adamla eski bir alacak meselesi yüzünden husumeti olduğu için onun ölmesini isteyerek müdahale etmeyi reddeder ve kenarda bekler. Yüzücü birkaç dakika içinde boğularak ölür. Aynı gün, başka bir yerde, Burak yüzme bilmeyen 5 yaşındaki komşu çocuğu Ece'yi şaka olsun diye, hemen çıkaracağını düşünerek havuza iter. Ece'nin çırpındığını görünce, boğulacağını bildiği hâlde komşusuyla arasındaki kavga yüzünden onun ölmesini isteyerek çocuğu kurtarmaz ve uzaklaşır. Ece boğularak ölür.
      1. Selim'in sorumluluğu nedir ve hangi garantörlük kaynağına dayanır?
      2. Burak'ın sorumluluğu nedir ve hangi garantörlük kaynağına dayanır?
      3. Hâkim, bu olaylarda ceza belirlerken hangi hükümden yararlanabilir?
    olcut:
      - {tespit: "Selim'in cankurtaran olarak sözleşmeden doğan yükümlülüğü ve ihmali öldürme", puan: 25, madde: "TCK m. 83"}
      - {tespit: "Selim'in kastı: müdahale etmeyi bilerek reddetmesi, taksir değil", puan: 15, madde: "TCK m. 21"}
      - {tespit: "Burak'ın önceki tehlikeli davranışı (itme) nedeniyle garantörlüğü", puan: 25, madde: "TCK m. 83"}
      - {tespit: "Ece'nin çocuk olması nedeniyle temel cezanın nitelikli hâlden belirlenmesi", puan: 20, madde: "TCK m. 82"}
      - {tespit: "Hâkimin TCK m. 83/3 uyarınca ihmali öldürmede ceza belirleyebilmesi ve indirim yapmayabilmesi", puan: 15, madde: "TCK m. 83"}
    cozum: |
      **Nitelendirme:** Her iki olayda da ölüm bir icrai ateşten değil, ölümü önleme yükümlülüğünün kasten yerine getirilmemesinden doğmuştur. Bu nedenle kasten öldürmenin ihmali davranışla işlenmesi (TCK m. 83) incelenir. TCK m. 83/1 uyarınca ihmalin icrai davranışa eşdeğer olması gerekir; eşdeğerlik TCK m. 83/2'deki iki kaynaktan birine dayanmalıdır.

      **Selim bakımından:** Selim belediye ile yaptığı yazılı sözleşme nedeniyle plajdaki insanların boğulmasını önleme yükümlülüğü altındadır. Bu, TCK m. 83/2-a'daki "sözleşmeden kaynaklanan yükümlülük"tür. Selim, yüzücünün boğulmakta olduğunu fark etmiş ve husumeti yüzünden müdahale etmemeyi bilerek tercih etmiştir; yani ölümü bilerek ve isteyerek gerçekleştirmiştir (doğrudan kast, TCK m. 21/1). Eşdeğerlik ve kast birlikte gerçekleştiğinden Selim TCK m. 83 kapsamında kasten öldürmeden sorumludur. Mağdur yetişkin ve sağlıklı bir kişi olduğundan nitelikli hâl yoktur; icrai bir davranışla işlenseydi temel ceza müebbet olacaktı (TCK m. 81).

      **Burak bakımından:** Burak, Ece'yi itme anında öldürme kastı taşımamıştır; ancak yüzme bilmeyen çocuğu havuza iterek onun hayatı bakımından tehlikeli bir durum yaratmıştır. Bu önceki davranış TCK m. 83/2-b kapsamındadır. Burak, çocuğun boğulacağını bilerek ve isteyerek kurtarma girişiminde bulunmamıştır; kast ihmal anında vardır. Ece 5 yaşında bir çocuk olduğundan, aynı fiil icrai olarak işlenseydi TCK m. 82/1-e uygulanacaktı. Bu nedenle ihmali öldürmede önce bu bent çerçevesinde ağırlaştırılmış müebbet temel ceza olarak belirlenir.

      **Ceza:** TCK m. 83/3'e göre hâkim, ağırlaştırılmış müebbet yerine 20-25 yıl, müebbet yerine 15-20 yıl, diğer hâllerde 10-15 yıl hapis cezasına hükmedebilir; cezada indirim de yapmayabilir. Hâkim indirim yaparsa Burak için 20 yıldan 25 yıla kadar, Selim için 15 yıldan 20 yıla kadar hapis gündeme gelir; indirim yapmazsa Burak ağırlaştırılmış müebbet, Selim müebbet hapis alır.

      **Sonuç:** Selim sözleşmeden doğan yükümlülüğü (TCK m. 83/2-a) nedeniyle, Burak önceki tehlikeli davranışı (TCK m. 83/2-b) nedeniyle ihmali davranışla kasten öldürmeden sorumludur; cezalar TCK m. 83/3 çerçevesinde belirlenir.
kartlar:
  - on: "TCK m. 81'in cezası nedir?"
    arka: "Müebbet hapis. Nitelikli hâller (TCK m. 82) ağırlaştırılmış müebbet hapistir."
  - on: "TCK m. 82/1'de kaç nitelikli hâl bendi vardır?"
    arka: "On bir bent (a-k). Hangi bent gerçekleşirse gerçekleşsin ceza tek bir ağırlaştırılmış müebbettir."
  - on: "TCK m. 82/1-d bendi kimleri kapsar?"
    arka: "Üstsoy, altsoy, eş, boşandığı eş ve kardeş. Boşandığı eş ibaresi 7331 sayılı Kanunla eklenmiştir."
  - on: "TCK m. 82/1-f bendi nasıl değişmiştir?"
    arka: "\"Gebe olduğu bilinen kadına karşı\" ifadesi 7406 sayılı Kanunla \"Kadına karşı\" olmuştur."
  - on: "Tasarlamanın temel unsurları nelerdir?"
    arka: "Önceden verilmiş öldürme kararı, karar ile icra arasında makul zaman ve kararda ısrar. Kararın zamanı belirsizse şüphe sanık yararınadır."
  - on: "Eziyet çektirerek öldürme nedir?"
    arka: "Ölüm için zorunlu olmayan, ölüme takaddüm eden ve mağdura yoğun acı veren vahşice hareketler (TCK m. 82/1-b)."
  - on: "İhmali öldürmede eşdeğerlik hangi iki kaynaktan doğar?"
    arka: "Kanun veya sözleşmeden doğan yükümlülük (TCK m. 83/2-a) ve önceki tehlikeli davranış (TCK m. 83/2-b)."
  - on: "TCK m. 83/3'e göre ceza nasıl belirlenir?"
    arka: "Ağırlaştırılmış müebbet yerine 20-25, müebbet yerine 15-20, diğer hâllerde 10-15 yıl hapis; indirim yapılmayabilir."
  - on: "Garantör olmayan kişinin yardım etmemesi hangi hükme girer?"
    arka: "TCK m. 98; ölüm hâlinde (m. 98/2) 1-3 yıl hapis."
  - on: "Olası kastta (TCK m. 21/2) müebbet gerektiren suçta ceza nedir?"
    arka: "20-25 yıl hapis. Ağırlaştırılmış müebbet gerektiren suçta müebbet hapis verilir."
  - on: "Haksız tahrikte kasten öldürmenin cezası nasıl değişir?"
    arka: "Ağırlaştırılmış müebbet yerine 18-24 yıl, müebbet yerine 12-18 yıl hapis (TCK m. 29)."
  - on: "Kasten öldürmede zincirleme suç uygulanır mı?"
    arka: "Hayır. TCK m. 43/3 kasten öldürmede zincirleme suç hükümlerini uygulamaz."
