  - soru: |
      Aşağıdakilerden hangisi kasten yaralamada kemik kırığı veya çıkığı bakımından doğrudur?
    siklar:
      - "Ceza iki kat artırılır."
      - "Kırığın hayat fonksiyonlarındaki etkisine göre ceza yarısına kadar artırılır."
