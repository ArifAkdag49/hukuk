  - soru: |
      Emre, Kerem'e saldırır; Kerem'in gözünde kısmen işlev kaybı oluşur, ama göz hâlâ görmektedir. Raporda sürekli zayıflama tespit edilmiştir. Hangi hüküm uygulanır?
    siklar:
      - "TCK m. 87/2-b; ceza iki kat artırılır."
      - "TCK m. 87/1-a; ceza bir kat artırılır."
      - "TCK m. 87/3; ceza yarısına kadar artırılır."
      - "Yalnız TCK m. 86/1; ağır netice aranmaz."
