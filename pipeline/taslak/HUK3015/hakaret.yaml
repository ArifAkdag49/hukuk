olaylar:
  - olay: |
      Ahmet ile Burak, ortak çalıştıkları atölyenin hesapları yüzünden tartışmaktadır. 3 Mart günü atölyede Ahmet, Burak'ın yüzüne karşı "alçak, namussuz herif" diye bağırır. Aynı akşam Ahmet kahvehanede Burak'ın yokluğunda dört kişiye "Burak, eski ortağı Selim'i sahte senetle dolandırdı" der. Burak'ın bu dolandırıcılık nedeniyle hakkında kesinleşmiş bir mahkûmiyet kararı vardır.

      Ertesi gün Ahmet'in sözlerini öğrenen Burak, Ahmet'i atölyenin önünde yumrukla yaralar; yaralanma basit bir tıbbi müdahaleyle giderilebilecek kadar hafiftir. Yumruk yiyen Ahmet, Burak'a "şerefsiz, seni gidi hayvan" diye bağırır. Burak, 3 Mart'taki hakareti aynı gün öğrenmiş olmasına rağmen 8 ay sonra şikâyette bulunur.

      1. Ahmet'in atölyedeki sözleri ve kahvehanedeki sözleri bakımından sorumluluğunu değerlendiriniz.
      2. Yumruk sonrasındaki sözler bakımından Ahmet'in durumu nedir?
      3. Burak'ın şikâyeti bakımından ne söylenebilir?
    olcut:
      - {tespit: "Atölyedeki sözlerin huzurda sövme olarak TCK m. 125/1 kapsamında nitelendirilmesi", puan: 20, madde: "TCK m. 125/1"}
      - {tespit: "Kahvehanedeki sözlerin gıyapta hakaret, dört kişiyle ihtilat unsurunun gerçekleşmesi ve somut fiil isnadı", puan: 20, madde: "TCK m. 125/1"}
      - {tespit: "Mağdur hakkında kesinleşmiş mahkûmiyet bulunduğundan isnadın ispatlanmış sayılması ve ceza verilmemesi", puan: 20, madde: "TCK m. 127"}
      - {tespit: "Yumruk sonrası sözlerde kasten yaralamaya tepki nedeniyle ceza verilmemesi", puan: 20, madde: "TCK m. 129/2"}
      - {tespit: "Şikâyet süresinin 6 ay olması ve sövme için sürenin geçmiş bulunması", puan: 20, madde: "TCK m. 73/1"}
    cozum: |
      **Nitelendirme:** Olayda iki farklı hakaret fiili, bir kasten yaralama ve bir şikâyet süresi sorunu vardır.

      **Hukuki sorunlar:** (1) Atölyede ve kahvehanede işlenen fiillerin nitelendirilmesi; (2) isnadın ispatı; (3) kasten yaralamaya tepkinin sonucu; (4) şikâyet süresi.

      **İlgili hükümler ve değerlendirme:**

      1. *Atölyedeki söz.* "Alçak, namussuz herif" belirli bir olaya dayanmayan soyut aşağılamadır, yani sövmedir. Burak'ın yüzüne karşı söylendiğinden huzurda hakaret oluşur ve ihtilat aranmaz (TCK m. 125/1). Temel ceza üç aydan iki yıla kadar hapis veya adlî para cezasıdır.

      2. *Kahvehanedeki söz.* "Sahte senetle dolandırdı" somut bir fiil isnadıdır. Burak yokken söylendiğinden gıyapta hakaret söz konusudur ve dört kişiyle ihtilat, kanunun aradığı en az üç kişi şartını karşılar (TCK m. 125/1 son cümle). Ancak isnat edilen dolandırıcılık suç oluşturan bir fiildir ve Burak hakkında bu suç nedeniyle kesinleşmiş mahkûmiyet bulunmaktadır. Bu hâlde isnat ispatlanmış sayılır ve ceza verilmez (TCK m. 127/1). Ahmet bu fiilden söz ederek ayrıca aşağılayıcı sözler söylemiş olsaydı TCK m. 127/2 uygulanırdı; olayda böyle bir ifade yoktur. Soyut sövmede (atölyedeki söz) ispat hakkı bulunmadığından TCK m. 127 o fiile uygulanmaz.

      3. *Yumruk sonrası söz.* Burak'ın yumruk atması, basit tıbbi müdahaleyle giderilebilir kasten yaralamadır (TCK m. 86/2). Ahmet'in bunun üzerine söylediği sözler hakaret suçunu oluştursa da kasten yaralama suçuna tepki olarak işlenmiştir; bu durumda kişiye ceza verilmez (TCK m. 129/2). Bu bir takdir değil, kesin cezasızlık hâlidir; genel tahrik hükmü (TCK m. 29) hakaret bakımından uygulanmaz.

      4. *Şikâyet.* Hakaret şikâyete bağlıdır (TCK m. 131/1). Şikâyet süresi altı aydır ve fiili ve faili öğrenmeden başlar (TCK m. 73/1-2). Burak sövmeyi aynı gün öğrendiğinden altı aylık süre dolmuştur; 8 ay sonra yapılan şikâyet süresinde değildir ve soruşturma ya da kovuşturma yapılamaz.

      **Sonuç:** Atölyedeki sövme TCK m. 125/1 kapsamındadır ancak şikâyet süresi geçtiği için cezalandırılamaz. Kahvehanedeki isnat ihtilat bakımından tipik olsa da TCK m. 127/1 gereği ispatlanmış sayıldığından ceza verilmez. Yumruktan sonraki sözler için TCK m. 129/2 uyarınca ceza verilmez.
  - olay: |
      Kemal, belediyede zabıta memuru olan Hasan'ın işyerinde yaptığı ruhsat denetimi sonunda kendisine idari para cezası kesmesi üzerine, kalabalık bir çarşı meydanında Hasan'ın yüzüne karşı "rüşvetçi, pislik adam" diye bağırır; çevredeki yaklaşık otuz kişi bunu duyar.

      Kemal daha sonra cezaya karşı idare mahkemesinde dava açar. Dilekçesinde, Hasan'ın denetim sırasında kendisinden belirli bir tarihte ve belirli bir miktar olmak üzere haksız para istediğini, bunu banka dekontları ve tanık beyanlarıyla ispatlayabileceğini yazar. Aynı dilekçede, davayla hiçbir ilgisi bulunmayan Hasan'ın komşusu Selin hakkında da "hafif meşrep bir kadın" diye yazar.

      1. Kemal'in çarşıdaki sözleri bakımından hangi suç ve hangi nitelikli hâller gündeme gelir? Kovuşturma koşulu ve uzlaştırma-önödeme bakımından durum nedir?
      2. Dilekçedeki Hasan ve Selin ile ilgili ifadeler bakımından Kemal'in durumunu değerlendiriniz.
    olcut:
      - {tespit: "Kamu görevlisine görevinden dolayı hakaret; alt sınırın bir yıldan az olmaması", puan: 20, madde: "TCK m. 125/3"}
      - {tespit: "Kalabalık önünde söylenen sözlerde aleniyet nedeniyle altıda bir artırım", puan: 15, madde: "TCK m. 125/4"}
      - {tespit: "Görevinden dolayı hakaretin şikâyete bağlı olmaması; uzlaştırmanın yokluğu ve önödemenin uygulanmaması", puan: 20, madde: "TCK m. 131/1"}
      - {tespit: "Hasan hakkındaki isnadın gerçek-somut vakıaya dayanması ve uyuşmazlıkla bağlantılı olması nedeniyle ceza verilmemesi", puan: 25, madde: "TCK m. 128"}
      - {tespit: "Selin hakkındaki ilgisiz ifadelerin TCK m. 128 korumasının dışında kalması ve dilekçede aleniyet artırımının uygulanmaması", puan: 20, madde: "TCK m. 128"}
    cozum: |
      **Nitelendirme:** Olayda biri sokakta, diğeri resmî makama sunulan dilekçede olmak üzere iki ayrı bağlamda hakaret sorunu vardır.

      **Hukuki sorunlar:** (1) Çarşıdaki sözlerin hangi nitelikli hâlleri oluşturduğu ve kovuşturma rejimi; (2) dilekçedeki isnatlar bakımından TCK m. 128 korumasının kapsamı.

      **İlgili hükümler ve değerlendirme:**

      1. *Çarşıdaki sözler.* "Rüşvetçi" bir fiil isnadı, "pislik adam" sövmedir; her iki hareket de Hasan'ın yüzüne karşı yapıldığından huzurda hakarettir (TCK m. 125/1). Sözler Hasan'ın görevi (ruhsat denetimi ve idari para cezası) nedeniyle söylendiğinden hakaret **kamu görevlisine görevinden dolayı** işlenmiştir ve cezanın alt sınırı bir yıldan az olamaz (TCK m. 125/3-a; kamu görevlisi tanımı için TCK m. 6/1-c). Sözler kalabalık bir meydanda sayısı belirsiz kişilerce duyulabildiğinden **alenen** işlenmiştir ve ceza altıda biri oranında artırılır (TCK m. 125/4).

      Kamu görevlisine karşı görevinden dolayı işlenen hakaret şikâyet şartının dışındadır (TCK m. 131/1); soruşturma re'sen yürütülür. Hakaret suçunda uzlaştırma yoktur (CMK m. 253/3) ve TCK m. 125/3-a hâli önödeme kapsamında da değildir (TCK m. 75/6).

      2. *Dilekçedeki ifadeler.* İdare mahkemesine sunulan dilekçe, yargı mercii nezdindeki yazılı iddia ve savunmadır. Hasan'a ilişkin isnat tarih ve miktarla somutlaştırılmış, delillere dayandırılmış ve davanın konusu olan ceza işlemiyle bağlantılıdır. Bu nedenle TCK m. 128 kapsamında kalır ve ceza verilmez. Selin hakkındaki ifade ise uyuşmazlıkla bağlantılı değildir; bağlantı koşulu gerçekleşmediğinden TCK m. 128 koruması dışındadır ve hakaret açısından TCK m. 125 üzerinden değerlendirilir (şikâyete bağlıdır). Resmî makama sunulan dilekçe belirsiz sayıda kişinin algılayabileceği bir ortam olmadığından, bu ifade bakımından aleniyet artırımı uygulanmaz.

      **Sonuç:** Çarşıdaki sözler nedeniyle Kemal, TCK m. 125/1, 125/3-a ve 125/4 kapsamında re'sen kovuşturulur. Dilekçedeki Hasan'a ilişkin isnatlar TCK m. 128 nedeniyle cezasızdır; Selin'e ilişkin ifade korunmaz ve Selin'in şikâyetine bağlı olarak değerlendirilir.
kartlar:
  - on: "TCK m. 125/1 temel hakaretin yaptırımı nedir?"
    arka: "Üç aydan iki yıla kadar hapis veya adlî para cezası (seçenekli)."
  - on: "Gıyapta hakaret için kaç kişiyle ihtilat aranır?"
    arka: "Fiilin en az üç kişiyle ihtilat ederek işlenmesi gerekir (TCK m. 125/1 son cümle)."
  - on: "İletiyle hakaret (TCK m. 125/2) için ihtilat aranır mı?"
    arka: "Hayır. Fiil mağduru muhatap alan sesli, yazılı veya görüntülü iletiyle işlenirse temel cezaya hükmolunur."
  - on: "TCK m. 125/3'teki nitelikli hâllerde ceza nasıl değişir?"
    arka: "Cezanın alt sınırı bir yıldan az olamaz: kamu görevlisi-görev, inanç ve düşünce, kutsal değerler."
  - on: "Alenen işlenen hakarette artırım oranı nedir?"
    arka: "Altıda biri oranında artırılır (TCK m. 125/4)."
  - on: "TCK m. 127'ye göre isnat hangi hâlde ispatlanmış sayılır?"
    arka: "Hakaret edilen hakkında o suç nedeniyle kesinleşmiş mahkûmiyet verilmişse. Diğer hâllerde kamu yararı ya da şikâyetçinin razı olması gerekir."
  - on: "TCK m. 128 hangi şartlarla ceza vermeyi engeller?"
    arka: "Yargı veya idari makamlar önündeki iddia ve savunmada isnatlar gerçek ve somut vakıalara dayanmalı ve uyuşmazlıkla bağlantılı olmalıdır."
  - on: "Kasten yaralamaya tepki olarak yapılan hakaretin sonucu nedir?"
    arka: "Kişiye ceza verilmez (TCK m. 129/2)."
  - on: "Hakaret suçunda haksız fiile tepki için hangi hüküm uygulanır?"
    arka: "TCK m. 129/1: ceza üçte birine kadar indirilir veya vazgeçilir; genel tahrik (TCK m. 29) değil."
  - on: "Hakaret şikâyeti süresi ve üst sınırı?"
    arka: "6 ay; fiilin gerçekleştiği tarihten itibaren en fazla 2 yıl (TCK m. 73/2)."
  - on: "Hatıraya hakaret (TCK m. 130) için kimler şikâyet edebilir?"
    arka: "Ölenin ikinci dereceye kadar üstsoy ve altsoyu, eşi ve kardeşleri (TCK m. 131/2)."
  - on: "Hakaret suçunda uzlaştırma ve önödeme durumu nedir?"
    arka: "Uzlaştırma yok (CMK m. 253/3); TCK m. 125/3-a hariç önödemeye tabi (TCK m. 75/6)."
