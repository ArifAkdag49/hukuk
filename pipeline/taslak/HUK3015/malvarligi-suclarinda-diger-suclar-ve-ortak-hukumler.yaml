      - "Ceza 3 yıldan 8 yıla kadar hapistir ve ağır ceza mahkemesi görevlidir."
      - "Ceza 2 aydan 1 yıla kadar hapistir ve asliye ceza mahkemesi görevlidir."
      - "Taksirle de işlenebilen bir suçtur."
      - "İflas kararı verilmeden de fail cezalandırılır."
    dogru: 0
    aciklama: |
      TCK m. 161 3 yıldan 8 yıla kadar hapis öngörür; 5235 sayılı Kanun m. 12 hileli iflası ağır ceza mahkemesinin görevine sokar. 2 ay-1 yıl TCK m. 162 (taksirli iflas) cezasıdır. Hileli iflas kasten işlenir ve iflas kararı olmadan cezalandırma yapılamaz.
  - soru: |
      Baskın görüş ve Yargıtay uygulamasına göre TCK m. 161 ve TCK m. 162'deki "iflasa karar verilmiş olması" ibaresi hukuki nitelik bakımından neyi ifade eder?
    siklar:
      - "Objektif cezalandırılabilme şartını"
      - "Suçun maddi unsuru olan neticeyi"
      - "Şikâyet şartını"
      - "Etkin pişmanlık sebebini"
    dogru: 0
    aciklama: |
      İflas kararı, failin kastı veya taksirinin kapsamına girmesi gerekmeyen objektif cezalandırılabilme şartı olarak kabul edilir (baskın görüş ve uygulama). Şikâyet ya da etkin pişmanlıkla ilgisi yoktur.
  - soru: |
      Tacir Ayşe, kayıt tutmadan ve ölçüsüz borçlanarak işletmesini batırmış, ticaret mahkemesi iflasına karar vermiştir. Ayşe'nin hileli bir tasarrufu yoktur. Ayşe hakkında hangi hüküm gündeme gelir?
