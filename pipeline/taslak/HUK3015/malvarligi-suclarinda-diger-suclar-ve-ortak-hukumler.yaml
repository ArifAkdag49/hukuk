  - soru: |
      Bir araba çalmaya zaten karar vermiş olan Deniz'e arkadaşı Cem, "çaldıktan sonra arabayı senden ben satın alırım" diye söz vermiştir. Deniz arabayı çalmış ve Cem satın almıştır. Cem hakkında doğru olan hangisidir?
