doktrin: |
  ### Bulundurmanın amacı: kullanma mı, ticaret mi?

  Uygulamada en çok tartışılan konu, ele geçen maddenin **miktarının** tek başına ticaret kastını gösterip göstermediğidir. Bir yaklaşım, yüksek miktarı kural olarak satma amacının güçlü bir göstergesi sayar; ancak miktar ancak diğer ölçütlerle birlikte anlam taşır. Karşı yaklaşım ise ceza muhakemesinin temel ilkesi olan **şüpheden sanık yararlanır** ilkesine dayanır: satma, devretme ya da tedarik davranışına dair somut bir delil bulunmuyorsa, yalnızca miktara bakarak ağır cezalı TCK m. 188/3'ten mahkûmiyet kurulamaz. Ceza Genel Kurulu, kullanıcı olduğu raporla saptanan sanıkların kendi kullanımları için aldıkları kabul edilen yüksek miktarda esrar olayında bu ikinci yaklaşımı benimsemiştir; ancak kurulda karşı oy da vardır, bu nedenle konu uygulamada hâlâ gerilim taşır.

  ### Hukuka aykırı arama ve delil

  Somut suç şüphesi doğmadan önleme araması kararına dayanılarak ya da kanuna uygun adli arama kararı olmadan yapılan aramada bulunan maddenin delil olarak kullanılıp kullanılamayacağı sık tartışılır. Bir görüşe göre arama hukuka aykırıdır ve bu yoldan elde edilen delil hükme esas alınamaz; diğer görüşe göre arama kararı koşulları sonradan oluşan şüpheyle ve olayın özelliklerine göre değerlendirilmeli, her olay ayrı incelenmelidir. Bu noktanın sınav sorusunun tek doğru cevabına dayanmaması gerekir; bilinmesi yeterlidir.

  ### Kullanmanın cezalandırılması

  Bir kısım yazar, kişinin yalnızca kendi sağlığına zarar vermesinin cezalandırılmasının ceza hukukunun son çare olma niteliğiyle bağdaşıp bağdaşmadığını sorgular. Kanun koyucu bu eleştiriyi, cezanın infazı yerine **tedavi ve denetim** odaklı zorunlu erteleme rejimiyle yumuşatmayı tercih etmiştir. Bu nedenle TCK m. 191'in asıl amacının cezalandırmadan çok bağımlıyı sağlıklı yaşama döndürmek olduğu söylenir.
sozluk:
  - terim: Soyut tehlike suçu
    tanim: "Zarar ya da somut tehlike aranmadan, fiilin tipe uygun işlenmesiyle tamamlanan suç; uyuşturucu suçlarında korunan değer kamu sağlığıdır."
  - terim: Seçimlik hareket
    tanim: "Tipte sayılan hareketlerden birinin yapılmasıyla suçun tamamlandığı, birden fazla yapılsa da tek suç oluşturduğu düzenleme biçimi (TCK m. 188/3)."
  - terim: İmal
    tanim: "Hammaddeden uyuşturucu elde etmek ya da bir maddeyi başka bir türeve dönüştürmek (TCK m. 188/1)."
  - terim: Ticaret amacı
    tanim: "Bulundurulan maddenin kullanma dışında bir amaçla, satılmak ya da başkalarına verilmek için bulundurulması; TCK m. 188/3'ü TCK m. 191'den ayırır."
  - terim: Kamu davasının açılmasının ertelenmesi
    tanim: "Savcının, şartlar varsa dava açmayıp 5 yıl denetim süresi tanıdığı kurum; TCK m. 191'de CMK m. 171'deki şartlar aranmaksızın zorunludur."
  - terim: Denetimli serbestlik
    tanim: "Erteleme süresinde en az 1 yıl uygulanan, tedavi ve yükümlülükleri içerebilen tedbir (TCK m. 191/3)."
  - terim: Hükmün açıklanmasının geri bırakılması
    tanim: "Mahkemenin hükmü açıklamayıp denetim süresi tanıdığı kurum (CMK m. 231); vasıf TCK m. 191'e dönerse uygulanır."
  - terim: İhlal nedeni
    tanim: "Erteleme süresinde yükümlülüğe uymama, yeniden bulundurma veya kullanma; ilk suçtan dava açılmasına yol açar (TCK m. 191/4-5)."
  - terim: Kolaylaştırma
    tanim: "Kullanımı mümkün kılan yer, malzeme sağlama, yakalanmayı zorlaştırma ya da bilgi verme (TCK m. 190/1)."
  - terim: Alenen özendirme
    tanim: "Uyuşturucu kullanımını açıkça teşvik etme veya bu nitelikte yayın yapma (TCK m. 190/2)."
  - terim: Etkin pişmanlık
    tanim: "Failin gönüllü davranışının cezasızlık ya da indirim sağladığı kurum; TCK m. 192 haber alınma anına göre ayrım yapar."
kararlar:
  - id: "1229410000"
    ozet: |
      Sanıkların kullandığı kiralık aracın arka tamponunda, her biri streç filme sarılı yedi parça halinde, net 1134 gram esrar bulunmuştu. Yerel mahkeme eylemi uyuşturucu ticareti olarak görmüş ve TCK m. 188/3'ten mahkûm etmiş, bölge adliye mahkemesi istinaf başvurularını esastan reddetmişti. Yargıtay 10. Ceza Dairesi oy çokluğuyla eylemin kullanmak için bulundurma olduğunu belirterek hükmü bozmuş, Yargıtay Cumhuriyet Başsavcılığı karşı oy gerekçesiyle bu karara itiraz etmişti. Ceza Genel Kurulu, sanıkların kullandıklarının kan ve idrar örneklerinde esrarın etken maddesinin saptanmasıyla doğrulandığını, olayın bir ihbara değil rutin yol kontrolüne dayandığını, satma veya devretme yönünde bir davranış bulunmadığını ve miktarın sanık sayısı dikkate alındığında kullanma sınırında kaldığını belirtti. Kurul, bulundurmanın amacını belirlemek için failin satma-devretme davranışı, maddenin bulunduğu yer ve biçimi, çeşidi ve miktarı, kullanıcılığın tıbbi raporla saptanması ile ekonomik ve sosyal durumu gibi ölçütleri sıraladı; şüphe giderilemediği için lehe yorumla eylemi TCK m. 191 kapsamında kabul ederek itirazı oy çokluğuyla reddetti; on iki üye karşı oy kullandı.
  - id: "1229624500"
    ozet: |
      Sinop Cumhuriyet Başsavcılığı, hakkında kullanmak için uyuşturucu bulundurma suçundan 5 yıl kamu davasının açılmasının ertelenmesi kararı vermişti. Şüpheli erteleme süresi içinde yeniden aynı nitelikte suç işlediği için hakkında kamu davası açıldı. Sinop 1. Asliye Ceza Mahkemesi, denetim sürecinin usulüne uygun başlamadığı gerekçesiyle kamu davasının durmasına karar verdi. Adalet Bakanlığının istemiyle gelen dosyada Yargıtay 10. Ceza Dairesi, ertelenme kararının usulüne uygun tebliğ edilip kesinleştiğini, süre içinde TCK m. 191/4-b ve c bentlerindeki fiillerin yeniden işlendiğini ve bu nedenle yargılamaya devam edilerek esas hakkında karar verilmesi gerektiğini belirtti. Daire durma kararını oybirliğiyle kanun yararına bozdu. Karar, erteleme süresindeki yeni eylemin kamu davasını açtıran bir ihlal olduğunu, bu aşamada denetimli serbestliğe uyulup uyulmamasının belirleyici olmadığını gösterir.
sorular:
  - soru: |
      Ruhsatsız olarak uyuşturucu madde imal, ithal veya ihraç eden kişiye TCK m. 188/1'e göre verilecek hapis cezası hangisidir?
    siklar:
      - "On yıldan az olmamak üzere hapis"
      - "Yirmi yıldan otuz yıla kadar hapis"
      - "Beş yıldan on yıla kadar hapis"
      - "Sekiz yıldan az olmamak üzere hapis"
    dogru: 1
    aciklama: |
      TCK m. 188/1 imal, ithal ve ihracı yirmi yıldan otuz yıla kadar hapis ve ikibin günden yirmibin güne kadar adlî para cezasıyla cezalandırır. On yıldan az olmamak üzere hapis TCK m. 188/3'teki ülke içi ticaret içindir; beş yıldan on yıla kadar ceza TCK m. 190'a, sekiz yıldan az olmamak üzere hapis TCK m. 188/7'deki öncül maddelere aittir.
  - soru: |
      Ali, 17 yaşındaki Burak'a ruhsatsız olarak bir miktar uyuşturucu satmıştır. Ali'ye TCK m. 188/3 uyarınca verilecek hapis cezası bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Hapis cezası on beş yıldan az olamaz."
      - "Hapis cezası yirmi yıldan az olamaz."
      - "Ceza yalnızca yarı oranında artırılır, alt sınır değişmez."
      - "Çocuğa satış ayrı bir hüküm gerektirmez, temel ceza uygulanır."
    dogru: 0
    aciklama: |
      TCK m. 188/3'ün son cümlesine göre uyuşturucu verilen veya satılan kişinin çocuk olması hâlinde veren veya satan kişiye verilecek hapis cezası on beş yıldan az olamaz. Burak 18 yaşından küçük olduğu için çocuktur. Bu bir alt sınır belirlemesidir, artırım oranı değildir.
  - soru: |
      Aşağıdaki maddelerden hangisi TCK m. 188/4-a'da sayılan ve cezanın yarı oranında artırılmasını gerektiren maddelerden biridir?
    siklar:
      - "Esrar"
      - "Sentetik katinon ve türevleri"
      - "Reçetesiz satılan hafif bir ağrı kesici"
      - "Kenevir tohumu"
    dogru: 1
    aciklama: |
      TCK m. 188/4-a eroin, kokain, morfin, bazmorfin, sentetik kannabinoid ve türevleri, sentetik katinon ve türevleri, sentetik opioid ve türevleri veya amfetamin ve türevlerini sayar. Sentetik katinon ve türevleri 7445 sayılı Kanunla listeye eklenmiştir. Esrar listede yer almaz.
  - soru: |
      TCK m. 188/4-b'ye göre artırımın uygulanması için fiil hangi yerde işlenmiş olmalıdır?
    siklar:
      - "Okul çevre duvarının içinde, yalnızca kapalı özel bir konutta"
      - "Okul, yurt, hastane, kışla veya ibadethane sınırlarına iki yüz metreden yakın mesafedeki umumi veya umuma açık yerde"
      - "Okul ve yurt sınırlarına bir kilometre mesafe içindeki herhangi bir yerde"
      - "Yalnızca hastane ve ibadethane içinde"
    dogru: 1
    aciklama: |
      TCK m. 188/4-b'ye göre üçüncü fıkradaki fiillerin bu tesislerin sınırlarına iki yüz metreden yakın mesafe içindeki umumi veya umuma açık yerlerde işlenmesi hâlinde ceza yarı oranında artırılır. Bu hüküm özel bir konutun kapalı alanını kapsamaz.
  - soru: |
      Dükkân sahibi Cem, müşterilerin kendi dükkânının arka odasında madde kullanmasına izin verip kapıya nöbetçi koymuştur. Cem'in eylemi hangi suçu oluşturur?
    siklar:
      - "TCK m. 190/1 uyarınca kullanılmasını kolaylaştırma"
      - "TCK m. 188/3 uyarınca uyuşturucu ticareti"
      - "TCK m. 191/1 uyarınca kullanmak için bulundurma"
      - "Eylem suç değildir, çünkü Cem maddeyi bizzat kullanmamıştır"
    dogru: 0
    aciklama: |
      TCK m. 190/1, kullanmayı kolaylaştırmak için özel yer, donanım veya malzeme sağlamayı ve kullananların yakalanmalarını zorlaştıracak önlemler almayı suç sayar. Cem eylemleriyle bu iki hareketi gerçekleştirmiştir; ceza beş yıldan on yıla kadar hapis ve adlî para cezasıdır.
  - soru: |
      Yalnızca kendi kullanımı için satın alan kişiye TCK m. 191/1'e göre öngörülen hapis cezası hangisidir?
    siklar:
      - "Bir yıldan üç yıla kadar"
      - "İki yıldan beş yıla kadar"
      - "Beş yıldan on yıla kadar"
      - "On yıldan az olmamak üzere"
    dogru: 1
    aciklama: |
      TCK m. 191/1, kullanmak için uyuşturucu veya uyarıcı madde satın alan, kabul eden, bulunduran ya da kullanan kişiyi iki yıldan beş yıla kadar hapis cezasıyla cezalandırır.
  - soru: |
      TCK m. 191/2-3'e göre kullanmak için bulundurma suçundan başlatılan soruşturmada hangisi doğrudur?
    siklar:
      - "Savcı CMK m. 171 şartlarını arar ve takdir yetkisini kullanır."
      - "CMK m. 171 şartları aranmaksızın beş yıl süreyle kamu davasının açılmasının ertelenmesine karar verilir."
      - "Dava derhal açılır; erteleme yalnızca mahkemece verilebilir."
      - "Erteleme süresi iki yıldır."
    dogru: 1
    aciklama: |
      TCK m. 191/2 şüpheli hakkında CMK m. 171'deki şartlar aranmaksızın beş yıl süreyle erteleme kararı verileceğini söyler; erteleme zorunludur, takdir değildir. Erteleme süresi beş yıldır.
  - soru: |
      Erteleme süresi içinde şüphelinin denetimli serbestlik uygulamasına ilişkin aşağıdakilerden hangisi TCK m. 191/3'e uygundur?
    siklar:
      - "En az bir yıl uygulanır, altışar aylık sürelerle en fazla iki yıl daha uzatılabilir."
      - "En az iki yıl uygulanır, üçer aylık sürelerle bir yıl daha uzatılabilir."
      - "Yalnızca mahkeme kararıyla ve en çok altı ay uygulanır."
      - "Süre sınırı yoktur, savcı dilediği kadar uzatabilir."
    dogru: 0
    aciklama: |
      TCK m. 191/3: erteleme süresi zarfında asgari bir yıl süreyle denetimli serbestlik uygulanır; süre altışar aylık sürelerle en fazla iki yıl daha uzatılabilir. Üçer aylık ve bir yıllık sistem 7445 sayılı Kanun öncesinin düzenlemesidir.
  - soru: |
      Kemal hakkında kullanmak için esrar bulundurma nedeniyle 5 yıl dava ertelenmiştir. İkinci yılda yeniden kullanmak için esrarla yakalanmıştır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İkinci eylem için ayrı bir soruşturma ve kamu davası açılır."
      - "İkinci eylem ihlal nedeni sayılır, ayrı soruşturma ve kovuşturma konusu yapılmaz; ilk suçtan dava açılır."
      - "İkinci eylem için yeniden erteleme kararı verilir ve süre baştan başlar."
      - "İkinci eylem hiçbir sonuç doğurmaz."
    dogru: 1
    aciklama: |
      TCK m. 191/4-5'e göre erteleme süresinde yeniden bulundurma veya kullanma ihlal nedeni sayılır, ayrı bir soruşturma ve kovuşturma konusu yapılmaz; ihlal sonucunda dava açılır. Böylece ilk suç yargılanır. Yeniden erteleme yasağı ise TCK m. 191/6'ya göre davanın açılmasından sonraki yeni suç iddiaları için söz konusudur.
  - soru: |
      Ağır Ceza Mahkemesinde TCK m. 188/3'ten yargılanan Zeynep hakkında kovuşturma sonunda eylemin münhasıran kullanmak için bulundurma olduğu anlaşılmıştır. TCK m. 191/8'e göre hangi karar verilir?
    siklar:
      - "Beraat"
      - "Hükmün açıklanmasının geri bırakılması"
      - "Davanın savcılığa iadesi ve kamu davasının açılmasının ertelenmesi"
      - "Doğrudan TCK m. 191/1'e göre hapis cezası"
    dogru: 1
    aciklama: |
      TCK m. 191/8, TCK m. 188 veya TCK m. 190'dan yapılan kovuşturma evresinde suçun münhasıran TCK m. 191 kapsamına girdiğinin anlaşılması hâlinde sanık hakkında hükmün açıklanmasının geri bırakılması kararı verileceğini söyler. Yeniden erteleme yolu bu aşamada kullanılmaz.
  - soru: |
      Mehmet, uyuşturucu ticaretine iştirak etmiştir. Resmî makamlar olaydan haberdar olduktan sonra gönüllü olarak suç ortaklarının yakalanmasına somut yardımda bulunmuştur. Mehmet'in durumuna hangi hüküm uygulanır?
    siklar:
      - "Cezaya hükmolunmaz (TCK m. 192/1)"
      - "Ceza dörtte birden yarısına kadar indirilir (TCK m. 192/3)"
      - "Ceza yarı oranında artırılır"
      - "Etkin pişmanlık hükmü uygulanmaz"
    dogru: 1
    aciklama: |
      Haber alındıktan sonra gönüllü hizmet ve yardımda bulunan kişiye TCK m. 192/3 uyarınca yardımın niteliğine göre dörtte birden yarısına kadar indirim yapılır. Cezasızlık (TCK m. 192/1) ancak resmî makamlar tarafından haber alınmadan önce ihbar edilirse mümkündür.
  - soru: |
      Eroin bağımlısı Bora, hakkında hiçbir soruşturma yokken devlet hastanesine başvurarak tedavisini istemiştir. TCK m. 192/4 bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Cezaya hükmolunmaz; sağlık mesleği mensuplarının TCK m. 280 uyarınca suçu bildirme yükümlülüğü doğmaz."
      - "Ceza dörtte birden yarısına kadar indirilir."
      - "Hekim suçu bildirmek zorundadır, aksi hâlde TCK m. 280'den sorumlu olur."
      - "Ancak hapis cezası ertelenebilir."
    dogru: 0
    aciklama: |
      TCK m. 192/4'e göre soruşturma başlatılmadan önce resmî makamlara veya sağlık kuruluşlarına başvurarak tedavi isteyen kişi hakkında cezaya hükmolunmaz; bu durumda kamu görevlileri ile sağlık mesleği mensuplarının TCK m. 279 ve TCK m. 280 uyarınca suçu bildirme yükümlülüğü doğmaz.
olaylar:
  - olay: |
      Ahmet, bir ortaokulun bahçe duvarına 80 metre uzaklıktaki sokakta, 16 yaşındaki lise öğrencisi Çağan'a 2 gram metamfetamin satarken polislerce suçüstü yakalanmıştır. Ahmet, karakoldaki ifadesinde polisin henüz bilmediği toptancı Tolga'nın kimliğini ve deposunu bildirmiş; bu bilgiler sayesinde Tolga'nın deposunda 5 kg metamfetamin ele geçirilmiştir. Ahmet maddeyi kendi kullanımı için bulundurduğunu savunmaktadır; ancak Çağan'a verdiği gerçeği kabul etmektedir.

      1. Ahmet'in eylemi hangi suçu oluşturur, TCK m. 191'e dair savunması kabul edilebilir mi?
      2. Hangi nitelikli hâller gerçekleşmiştir?
      3. Ahmet'in sonradan verdiği bilginin cezaya etkisi nedir?
    olcut:
      - {tespit: "Satma eyleminin ticaret suçu (TCK m. 188/3) olarak nitelendirilmesi; kullanma savunmasının geçersizliği", puan: 20, madde: "TCK m. 188/3"}
      - {tespit: "Çocuğa satış: hapis alt sınırının on beş yıl olması", puan: 20, madde: "TCK m. 188/3"}
      - {tespit: "Metamfetamin amfetamin türevi olduğundan madde türü nedeniyle artırım", puan: 15, madde: "TCK m. 188/4"}
      - {tespit: "Okula 80 metre mesafedeki umumi yer: yer nedeniyle artırım", puan: 15, madde: "TCK m. 188/4"}
      - {tespit: "Haber alındıktan sonra gönüllü yardım: dörtte birden yarısına kadar indirim", puan: 20, madde: "TCK m. 192/3"}
      - {tespit: "Cezasızlık hükmünün (haber alınmadan önce) uygulanamaması", puan: 10, madde: "TCK m. 192/1"}
    cozum: |
      **Nitelendirme:** Olay, ülke içinde ruhsatsız madde satma suçudur. Ahmet'in kullanma amacı savunması, satma eylemi karşısında etkisizdir; çünkü TCK m. 191 yalnızca kullanmak için satın alma, kabul etme ve bulundurma ile kullanmayı cezalandırır, başkasına satmayı değil.

      **Hukuki sorunlar:** (1) Temel suçun belirlenmesi, (2) çocuğa satışın sonucu, (3) madde türü ve yer artırımları, (4) etkin pişmanlığın hangi fıkradan uygulanacağı.

      **İlgili hükümler:** Ruhsatsız olarak ülke içinde satan kişi, on yıldan az olmamak üzere hapis ve adlî para cezasıyla cezalandırılır (TCK m. 188/3). Madde verilen veya satılan kişi çocuksa hapis cezası on beş yıldan az olamaz (TCK m. 188/3). Eroin, kokain, morfin, bazmorfin, sentetik kannabinoid, sentetik katinon, sentetik opioid ve amfetamin türevleri bakımından ceza yarı oranında artırılır (TCK m. 188/4-a); okul gibi tesislerin sınırlarına iki yüz metreden yakın mesafedeki umumi yerlerde işlenirse yine yarı oranında artırılır (TCK m. 188/4-b). Haber alındıktan sonra gönüllü yardım ise TCK m. 192/3 kapsamında dörtte birden yarısına kadar indirim sağlar.

      **Değerlendirme:** Çağan 16 yaşında olduğundan çocuktur; bu nedenle hapis cezasının alt sınırı on beş yıldır. Metamfetamin amfetamin türevi olduğu için TCK m. 188/4-a koşulu gerçekleşmiştir. 80 metre iki yüz metreden yakındır ve sokak umumi yerdir; TCK m. 188/4-b de gerçekleşmiştir. Bu bentler aynı fıkrada yer alır; ceza hesabında bunların nasıl birleşeceği konusunda ayrıca tartışma yapılabilir, ancak her ikisinin koşulunun varlığı tespit edilmelidir. Ahmet, Tolga'yı yakalandıktan ve olay resmî makamlarca öğrenildikten sonra bildirmiştir; bu nedenle TCK m. 192/1 ya da 192/2'deki cezasızlık söz konusu değildir. Bilgi suçun ortaya çıkmasına ve diğer suç ortağının yakalanmasına fiilen katkı sağladığından TCK m. 192/3 uyarınca yardımın niteliğine göre dörtte birden yarısına kadar indirim yapılır.

      **Sonuç:** Ahmet, TCK m. 188/3'ten cezalandırılır; çocuğa satış nedeniyle hapis alt sınırı on beş yıldır; madde türü ve yer artırımının koşulları gerçekleşmiştir ve TCK m. 192/3 uyarınca indirim yapılır.
  - olay: |
      Kemal, 10.5.2024'te kullanmak için 3 gram esrar bulundururken yakalanmış, hakkında 5 yıl kamu davasının açılmasının ertelenmesine karar verilmiş ve denetimli serbestlik uygulanmaya başlanmıştır. Kemal'in arkadaşı Ece, arkadaşlarının madde kullanabilmesi için sahibi olduğu atölyenin arka odasını bu amaçla tahsis etmiş ve polis gelirse haber vermesi için kapıya nöbetçi bırakmıştır. Kemal, 15.11.2025'te tekrar kullanmak için 2 gram esrarla yakalanmıştır.

      1. Kemal'e ilişkin ilk kararın hukuki niteliği ve süresi nedir?
      2. Kemal'in ikinci yakalanması hangi sonucu doğurur?
      3. Ece'nin sorumluluğu nedir?
    olcut:
      - {tespit: "İlk eylemin kullanmak için bulundurma olması; 2-5 yıl hapis", puan: 15, madde: "TCK m. 191/1"}
      - {tespit: "CMK m. 171 şartları aranmaksızın 5 yıl zorunlu erteleme; en az 1 yıl denetimli serbestlik", puan: 20, madde: "TCK m. 191/2"}
      - {tespit: "İkinci eylemin ihlal nedeni sayılması; ayrı soruşturma ve kovuşturma yapılmaması", puan: 25, madde: "TCK m. 191/5"}
      - {tespit: "İhlal sonucu ertelenen ilk suçtan kamu davası açılması", puan: 15, madde: "TCK m. 191/4"}
      - {tespit: "Ece'nin özel yer sağlama ve yakalanmayı zorlaştırma eylemleri", puan: 25, madde: "TCK m. 190/1"}
    cozum: |
      **Nitelendirme:** Kemal bakımından olay, kullanmak için bulundurma suçu ve bu suç dolayısıyla uygulanan zorunlu erteleme rejimidir. Ece bakımından ise ayrı bir suç olan kullanılmasını kolaylaştırma söz konusudur.

      **Hukuki sorunlar:** (1) Kemal'in ilk eyleminin ve ertelemenin niteliği, (2) erteleme süresindeki ikinci eylemin sonucu, (3) Ece'nin eyleminin ayrı bir suç olup olmadığı.

      **İlgili hükümler:** Kullanmak için madde bulunduran kişi iki yıldan beş yıla kadar hapis cezası ile cezalandırılır (TCK m. 191/1). Soruşturmada şüpheli hakkında CMK m. 171'deki şartlar aranmaksızın beş yıl süreyle kamu davasının açılmasının ertelenmesine karar verilir (TCK m. 191/2); en az bir yıl denetimli serbestlik uygulanır ve yılda en az iki defa test için sevk kararı verilir (TCK m. 191/3). Erteleme süresinde tekrar kullanmak için bulundurma veya kullanma hâlinde kamu davası açılır (TCK m. 191/4), ancak bu eylem ihlal nedeni sayılır ve ayrı soruşturma ve kovuşturma konusu yapılmaz (TCK m. 191/5). Özel yer sağlayan ve yakalanmayı zorlaştıracak önlem alan kişi beş yıldan on yıla kadar hapis cezası alır (TCK m. 190/1).

      **Değerlendirme:** Kemal'in ilk yakalanmasında dava ertelenmiştir; bu karar bir takdir değil, kanunun emrettiği sonuçtur. 15.11.2025'teki ikinci yakalanma beş yıllık süre içinde gerçekleştiğinden bir ihlal nedenidir. İkinci eylem için yeni bir dava açılmaz; ihlal nedeniyle ertelenen ilk suçtan kamu davası açılır. TCK m. 191/6'daki yasak ise ancak dava açıldıktan sonra yeniden suç işlenmesi hâlinde gündeme gelir; bu olayda henüz o aşamaya gelinmemiştir. Ece, kullanıcı olmasa bile arka odayı tahsis ederek TCK m. 190/1-a'yı, kapıya nöbetçi bırakarak TCK m. 190/1-b'yi gerçekleştirmiştir. Madde TCK m. 191'in dışında, bağımsız bir suçtur.

      **Sonuç:** Kemal hakkında ikinci eylemden ayrı dava açılmaz; ihlal nedeniyle ilk suçtan kamu davası açılır. Ece, TCK m. 190/1 uyarınca beş yıldan on yıla kadar hapis ve adlî para cezasıyla cezalandırılır.
kartlar:
  - on: "TCK m. 188/1 cezası nedir?"
    arka: "Ruhsatsız imal, ithal, ihraç: 20-30 yıl hapis ve 2.000-20.000 gün adlî para cezası."
  - on: "TCK m. 188/3 cezası ve çocuğa satışta alt sınır?"
    arka: "En az 10 yıl hapis ve 1.000-20.000 gün adlî para cezası; madde çocuğa verilmiş veya satılmışsa hapis alt sınırı 15 yıl."
  - on: "TCK m. 188/4-a hangi maddeleri sayar?"
    arka: "Eroin, kokain, morfin, bazmorfin, sentetik kannabinoid, sentetik katinon, sentetik opioid, amfetamin ve türevleri; yarı oranında artırım. Esrar listede yoktur."
  - on: "TCK m. 188/4-b hangi yerlerde artırım yapar?"
    arka: "Okul, yurt, hastane, kışla, ibadethane sınırlarına 200 metreden yakın umumi veya umuma açık yerlerde; yarı oranında."
  - on: "TCK m. 188/5 artırım oranları?"
    arka: "Üç veya daha fazla kişi: yarı oranında. Örgüt faaliyeti: bir kat."
  - on: "TCK m. 190 cezası ve tipleri?"
    arka: "5-10 yıl hapis ve 1.000-10.000 gün adlî para cezası. Kolaylaştırma (190/1: yer-donanım, yakalanmayı zorlaştırma, bilgi) ve alenen özendirme (190/2)."
  - on: "TCK m. 191/1 cezası?"
    arka: "Kullanmak için satın alma, kabul etme, bulundurma ya da kullanma: 2-5 yıl hapis."
  - on: "TCK m. 191/2 ertelemesi nasıl bir rejimdir?"
    arka: "CMK m. 171 şartları aranmaksızın 5 yıl dava ertelenir; zorunludur, kolluğa da bildirilir."
  - on: "TCK m. 191/3 denetimli serbestlik kuralı?"
    arka: "En az 1 yıl; altışar aylık sürelerle en çok 2 yıl uzatma; yılda en az 2 defa ilgili kuruma sevk (7445 sayılı Kanun)."
  - on: "Erteleme süresinde tekrar kullanma?"
    arka: "TCK m. 191/5: ihlal nedeni sayılır, ayrı soruşturma ve kovuşturma yapılmaz; ertelenen ilk suçtan dava açılır (TCK m. 191/4)."
  - on: "Kovuşturmada suç münhasıran TCK m. 191 çıkarsa ne olur?"
    arka: "TCK m. 191/8: hükmün açıklanmasının geri bırakılması."
  - on: "TCK m. 192 fıkraları kısaca?"
    arka: "192/1-2: haber alınmadan önce ihbar, cezasızlık. 192/3: haber alındıktan sonra yardım, 1/4-1/2 indirim. 192/4: soruşturmadan önce tedavi başvurusu, cezasızlık."
