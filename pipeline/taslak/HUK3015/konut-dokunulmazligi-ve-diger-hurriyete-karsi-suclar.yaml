kararlar:
  - id: "1207878300"
    ozet: |
      Sanık, gece vakti işlenen nitelikli hırsızlık ve konut dokunulmazlığının ihlali suçlarından ayrı ayrı cezalandırılmış; konut ihlali için TCK m. 116/1-4 ve TCK m. 62 uyarınca 10 ay hapis verilmiştir. Süreçte zorunlu müdafi eksikliği ve bölge adliye mahkemesinin bozma yetkisi tartışılmıştır. Yargıtay 2. Ceza Dairesinin bozma kararına Yargıtay Cumhuriyet Başsavcılığı itiraz etmiştir. Yargıtay Ceza Genel Kurulu itirazı kabul etmiş; bölge adliye mahkemesinin zorunlu müdafi eksikliği nedeniyle bozma kararı vermesini yerinde bulmuş ve konut dokunulmazlığının ihlali suçundan kurulan 10 aylık hükmün, istinaf başvurusunun esastan reddi nedeniyle miktar itibarıyla kesin olduğunu, özel dairece temyizen incelenemeyeceğini belirtmiştir. Karar oy çokluğuyla verilmiş, üç üye karşı oy kullanmıştır. Karar içtimaı tartışmaz, kanun yolu sınırlarını gösterir; ancak uygulamada hırsızlık amacıyla gece konuta giren sanık hakkında konut ihlalinden ayrı hüküm kurulduğunu da gösterir.
  - id: "1231010300"
    ozet: |
      Sanık, katılanı beden hareketleriyle dışarı çağırmış ve öncesinde ısrarla telefonla arayıp mesaj göndermiştir; bedensel temas veya cinsel içerikli söz yoktur. İlk derece mahkemesi önce cinsel taciz (TCK m. 105/1) nedeniyle adli para cezası vermiştir. Kanun yararına bozma istemi üzerine Yargıtay 9. Ceza Dairesi, bedensel temas veya söz ile taciz bulunmayan bu eylemin kişilerin huzur ve sükununu bozma (TCK m. 123/1) suçunu oluşturduğu gerekçesiyle hükmü bozmuş ve hüküm yeniden bu suçtan kurulmuştur. Yargıtay 12. Ceza Dairesi temyiz incelemesinde yalnızca adli para cezasının taksit hükmünü düzelterek hükmü oy birliğiyle onamıştır. Karar, cinsel içerikli söz veya davranış bulunmayan ısrarlı arama, mesaj ve çağırmaların TCK m. 105 yerine TCK m. 123 kapsamında değerlendirildiğini gösterir.
sorular:
  - soru: |
      TCK m. 116/1'e göre konut dokunulmazlığının ihlali suçunun temel şekli için öngörülen ceza ve kovuşturma koşulu aşağıdakilerden hangisidir?
    siklar:
      - "Üç aydan bir yıla hapis; re'sen kovuşturma"
      - "Altı aydan iki yıla hapis; mağdurun şikâyeti"
      - "Bir yıldan üç yıla hapis; re'sen kovuşturma"
      - "Altı aydan bir yıla hapis veya adli para; şikâyet"
    dogru: 1
    aciklama: |
      TCK m. 116/1: rızaya aykırı giren veya rıza ile girip çıkmayan kişi, mağdurun şikâyeti üzerine, altı aydan iki yıla kadar hapisle cezalandırılır. Bir yıldan üç yıla hapis TCK m. 116/4 içindir.
  - soru: |
      Aşağıdakilerden hangisi TCK m. 6/1-e'ye göre "gece vakti"nin tanımıdır?
    siklar:
      - "Saat 22.00 ile 06.00 arası"
      - "Güneşin batmasından bir saat sonra başlayan, doğmasından bir saat evvele kadar devam eden süre"
      - "Güneşin batmasından doğmasına kadar olan süre"
      - "Güneşin batmasından iki saat sonra başlayan süre"
    dogru: 1
    aciklama: |
      TCK m. 6/1-e gece vaktini güneşin batmasından bir saat sonra başlayıp doğmasından bir saat evvele kadar devam eden zaman süresi olarak tanımlar. Sabit saat aralığı yoktur.
  - soru: |
      Ev sahibi Mehmet, kiracısı Ali'nin oturduğu daireye Ali evde yokken yedek anahtarla girmiştir. Mehmet'in durumu hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Daire onun mülkü olduğu için suç oluşmaz"
      - "Konut dokunulmazlığını ihlal eder, çünkü konut zilyetliği ve fiili kullanımı korur"
      - "Yalnızca hukuk davası açılabilir"
      - "Kira sözleşmesi bittikten sonra bile suç oluşmaz"
    dogru: 1
    aciklama: |
      Konut dokunulmazlığı mülkiyeti değil kişinin fiili kullanımını ve huzurunu korur. Kiracının konutuna rızası dışında giren ev sahibi TCK m. 116/1'den sorumlu olur.
  - soru: |
      Zeynep ile Ayşe aynı evi paylaşmaktadır. Ayşe, Zeynep'in haberi olmadan, evdeki değerli eşyaları çalmak niyetindeki Orhan'ı "ben izin veriyorum" diyerek eve alır. Orhan'ın TCK m. 116 bakımından durumu nedir?
    siklar:
      - "Ayşe'nin rızası bulunduğundan hiçbir şekilde suç oluşmaz"
      - "Rıza meşru bir amaca yönelik olmadığından TCK m. 116/3 uygulanmaz ve Orhan sorumlu olur"
      - "Yalnızca Ayşe sorumlu olur"
      - "Orhan yalnızca hırsızlıktan sorumlu olur; konut ihlali aranmaz"
    dogru: 1
    aciklama: |
      Ortak kullanılan konutta bir kişinin rızası yeterlidir ancak rızanın meşru bir amaca yönelik olması gerekir (TCK m. 116/3). Hırsızlık amacıyla verilen rıza meşru değildir; ayrıca hırsızlık amacıyla işlenen konut ihlalinde şikâyet de aranmaz (TCK m. 142/4).
  - soru: |
      Mehmet, hırsızlık yapmak niyetiyle öğle saatinde herkesin serbestçe girip çıktığı bir marketin müşteri bölümüne girip eşya çalıyor. Mehmet'in TCK m. 116/2 bakımından durumu nedir?
    siklar:
      - "TCK m. 116/2 oluşur, çünkü rıza yoktur"
      - "TCK m. 116/2 oluşmaz, çünkü market açık rızaya gerek olmadan girilmesi mutat olan yerdir"
      - "Mutlaka TCK m. 116/4 oluşur"
      - "Yalnız TCK m. 119 uygulanır"
    dogru: 1
    aciklama: |
      TCK m. 116/2, açık bir rızaya gerek duyulmaksızın girilmesi mutat olan yerler dışında kalan işyerlerini korur. Çalışma saatinde müşterilere açık market bu kapsamın dışındadır; hırsızlık ayrıca değerlendirilir.
  - soru: |
      Fail, konut dokunulmazlığının ihlali suçunu silahla ve iki arkadaşıyla birlikte işlemiştir. Cezanın belirlenmesinde aşağıdakilerden hangisi doğrudur?
    siklar:
      - "TCK m. 119/1 uyarınca ceza bir kat artırılır"
      - "TCK m. 119/1 uyarınca ceza yarı oranında artırılır"
      - "Nitelikli hâl uygulanmaz"
      - "Ceza üçte bir oranında artırılır"
    dogru: 0
    aciklama: |
      TCK m. 119/1'e göre konut dokunulmazlığının ihlali silahla veya birden fazla kişi tarafından birlikte işlenirse verilecek ceza bir kat artırılır. Bu iki hâl birlikte olsa da artırım bir kattır.
  - soru: |
      Ahmet hırsızlık amacıyla gündüz vakti Selin'in evine girer. Selin şikâyetçi olmak istememektedir. Konut ihlali bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Şikâyet olmadığı için hiçbir işlem yapılmaz"
      - "Hırsızlık amacıyla işlendiğinden TCK m. 142/4 gereği şikâyet aranmaz"
      - "Uzlaştırma zorunludur"
      - "Yalnız TCK m. 116/4 uygulanır"
    dogru: 1
    aciklama: |
      TCK m. 142/4'e göre hırsızlık suçunun işlenmesi amacıyla konut dokunulmazlığının ihlali işlenmişse bu suç için soruşturma ve kovuşturmada şikâyet aranmaz.
  - soru: |
      Aşağıdakilerden hangisi TCK m. 123 (huzur ve sükunu bozma) ile TCK m. 123/A (ısrarlı takip) arasındaki farktır?
    siklar:
      - "TCK m. 123 şikâyete bağlı değildir, TCK m. 123/A şikâyete bağlıdır"
      - "TCK m. 123'te sırf huzur bozma özel kastı aranır, TCK m. 123/A ciddi huzursuzluk veya güvenlik endişesi neticesiyle tamamlanır"
      - "TCK m. 123/A yalnızca telefonla işlenir"
      - "İkisi aynı suçtur"
    dogru: 1
    aciklama: |
      TCK m. 123 sırf huzur ve sükûnunu bozmak maksadıyla ısrarlı davranışı arar. TCK m. 123/A ise fiziken takip veya temas kurmaya çalışma yoluyla mağdurda ciddi huzursuzluk veya güvenlik endişesi oluşmasını arar. İkisi de şikâyete bağlıdır.
  - soru: |
      Hakkında 6284 sayılı Kanun uyarınca konuta ve iş yerine yaklaşmama tedbiri verilmiş olan Ahmet, iki ay boyunca Selin'i her gün işyeri çıkışında fiziken takip etmiş ve mesaj yağdırmış, Selin korkuyla işinden ayrılmıştır. Ahmet'in cezası hangi aralıktadır?
    siklar:
      - "Altı aydan iki yıla"
      - "Bir yıldan üç yıla"
      - "Üç aydan bir yıla"
      - "İki yıldan beş yıla"
    dogru: 1
    aciklama: |
      Failin hakkında yaklaşmama tedbiri bulunması ve mağdurun işini bırakmasına neden olması, TCK m. 123/A-2'deki nitelikli hâllerdir. Nitelikli ısrarlı takipte ceza bir yıldan üç yıla hapistir.
  - soru: |
      Ahmet'in TCK m. 123/A kapsamındaki ısrarlı takip suçu için uzlaştırma bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Şikâyete bağlı olduğundan uzlaştırmaya tabidir"
      - "Şikâyete bağlı olmasına rağmen CMK m. 253/3 uyarınca uzlaştırma yoluna gidilemez"
      - "Yalnız nitelikli hâli uzlaştırma dışıdır"
      - "Mağdurun çocuk olması halinde uzlaştırma zorunludur"
    dogru: 1
    aciklama: |
      CMK m. 253/3'e göre şikâyete bağlı olsa bile ısrarlı takip suçunda uzlaştırma yoluna gidilemez (TCK m. 123/A).
  - soru: |
      Hastane girişini zorla kapatarak hastaların sağlık hizmetinden yararlanmasını engelleyen kişi için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "TCK m. 113/2 uyarınca ceza altıda biri oranına kadar artırılır"
      - "TCK m. 113 uygulanmaz"
      - "Ceza iki katına çıkar"
      - "Fiil yalnız idari yaptırım gerektirir"
    dogru: 0
    aciklama: |
      Kamu hizmetlerinden yararlanma hakkının engellenmesinde suçun konusu sağlık hizmeti olursa ceza altıda biri oranına kadar artırılır (TCK m. 113/2; 7406 sayılı Kanunla eklendi).
  - soru: |
      Aşağıdakilerden hangisi TCK m. 117/2'deki suçun öğesidir?
    siklar:
      - "Mağdurun çaresizliğinin, kimsesizliğinin ve bağlılığının sömürülmesi"
      - "Mağdurun sendikaya üye olmaya zorlanması"
      - "Mağdurun dilekçesinin kabul edilmemesi"
      - "Mağdurun oy kullanmasının engellenmesi"
    dogru: 0
    aciklama: |
      TCK m. 117/2: çaresizliği, kimsesizliği ve bağlılığı sömürerek ücretsiz ya da orantısız düşük ücretle çalıştırma veya insan onuruyla bağdaşmayan çalışma ve konaklama koşullarına tabi kılma. Sendikal zorlama TCK m. 118, dilekçe TCK m. 121 konusudur.
olaylar:
  - olay: |
      Ahmet, boşandığı eşi Selin ile yeniden barışmak istemektedir. Aile mahkemesi, Selin'in başvurusu üzerine Ahmet hakkında 6284 sayılı Kanun uyarınca Selin'in konutuna ve iş yerine yaklaşmama tedbiri vermiştir. Buna rağmen Ahmet üç hafta boyunca her akşam iş çıkışında Selin'i arabasıyla takip eder ve günde otuz kırk kez "Sensiz yaşayamam" mesajları gönderir. Güvenliğinden ciddi endişe duyan Selin işinden istifa eder ve başka bir mahalleye taşınır. Bir gece saat 01.30'da Ahmet, Selin'in yeni taşındığı müstakil evin etrafı duvarla çevrili bahçesine duvardan atlayarak girer ve pencereyi tıklatır.

      1. Ahmet'in ısrarlı takip bakımından sorumluluğunu nitelikli hâller dahil değerlendiriniz.
      2. Bahçeye girme eylemini değerlendiriniz.
      3. Şikâyet ve uzlaştırma bakımından durumu açıklayınız.
    olcut:
      - {tespit: "Israrlı fiziken takip ve iletişimle temas kurma; Selin'de güvenlik endişesi oluşması (netice)", puan: 20, madde: "TCK m. 123/A"}
      - {tespit: "Nitelikli hâller: boşandığı eşe karşı, mağdurun işini bırakması ve konut değiştirmesi, yaklaşmama tedbiri bulunan fail", puan: 20, madde: "TCK m. 123/A"}
      - {tespit: "Müstakil evin çevrili bahçesi eklenti niteliğindedir; rızaya aykırı giriş", puan: 15, madde: "TCK m. 116"}
      - {tespit: "01.30 gece vaktidir; nitelikli konut ihlali (1-3 yıl)", puan: 20, madde: "TCK m. 6"}
      - {tespit: "Israrlı takip şikâyete bağlıdır ve uzlaştırma kapsamı dışındadır", puan: 15, madde: "CMK m. 253"}
      - {tespit: "Uzlaştırma kapsamındaki suç ile kapsam dışı suç aynı mağdura karşı işlenmişse uzlaşma uygulanmaz; ısrarlı takip önödeme kapsamında olmadığından son cümledeki istisna da işlemez", puan: 10, madde: "CMK m. 253"}
    cozum: |
      **Nitelendirme:** Olayda iki ayrı suç tartışılır: ısrarlı takip (TCK m. 123/A) ve gece vakti konut dokunulmazlığının ihlali (TCK m. 116/1 ve 116/4).

      **Hukuki sorunlar:** (1) Ahmet'in ısrarlı takibi suçun hangi şekline girer? (2) Çevrili bahçe konutun eklentisi midir, gece vakti nitelikli hâl uygulanır mı? (3) Şikâyet ve uzlaştırma.

      **İlgili hükümler:** TCK m. 123/A-1, 123/A-2, 123/A-3; TCK m. 116/1, 116/4; TCK m. 6/1-e; CMK m. 253/1 ve 253/3.

      **Değerlendirme:** Ahmet, ısrarlı biçimde Selin'i fiziken takip etmiş ve haberleşme araçlarıyla temas kurmaya çalışmıştır. Bunun sonucunda Selin'de güvenliği bakımından ciddi endişe oluşmuştur; TCK m. 123/A-1'deki netice gerçekleşmiştir. Suç üç nitelikli hâlle birlikte işlenmiştir: Selin Ahmet'in boşandığı eşidir (a bendi), Selin işini bırakmış ve konutunu değiştirmiştir (b bendi) ve Ahmet hakkında yaklaşmama tedbiri bulunmaktadır (c bendi). Bu nedenle TCK m. 123/A-2 uyarınca bir yıldan üç yıla kadar hapis cezası söz konusudur. Nitelikli hâllerin birden fazla bulunması, hâkimin temel cezayı belirlerken (TCK m. 61) alt sınırdan uzaklaşma gerekçesi olabilir.

      Duvarla çevrili müstakil ev bahçesi, konutun kullanım amacını tamamlayan ve dış dünyadan ayrılmış bir yerdir; eklenti niteliğindedir. Ahmet'in bu yere Selin'in rızasına aykırı girmesi TCK m. 116/1'i oluşturur. Giriş saat 01.30'da yapıldığından fiil, güneşin batmasından bir saat sonra başlayıp doğmasından bir saat evvele kadar süren gece vakti içindedir (TCK m. 6/1-e). Bu nedenle TCK m. 116/4 uygulanır ve ceza bir yıldan üç yıla hapistir. Bu nitelikli şekil için şikâyet şartı yazılı değildir.

      Israrlı takip suçu şikâyete bağlıdır (TCK m. 123/A-3) ve CMK m. 253/3 gereğince uzlaştırma yoluna gidilemez. Konut dokunulmazlığının ihlali CMK m. 253/1-b listesinde sayılmış olsa da, uzlaştırma kapsamına giren suçun kapsam dışı bir suçla aynı mağdura karşı birlikte işlenmesi hâlinde uzlaşma hükümleri uygulanmaz (CMK m. 253/3). Aynı fıkranın son cümlesindeki istisna yalnız kapsam dışı suç önödeme kapsamındaysa işler; altı aydan fazla hapis gerektiren ısrarlı takip önödeme kapsamında değildir (TCK m. 75/1). Selin her iki suçun da mağdurudur; bu nedenle uzlaştırma yoluna gidilmez.

      **Sonuç:** Ahmet nitelikli ısrarlı takipten (TCK m. 123/A-2) ve gece vakti konut dokunulmazlığının ihlalinden (TCK m. 116/1, 116/4) ayrı ayrı sorumludur. Uzlaştırma uygulanmaz; ısrarlı takip için şikâyet gerekir.
  - olay: |
      Hasan, rakip olarak gördüğü diş hekimi Murat'ın muayenehanesine, iki arkadaşı Kemal ve Orhan ile birlikte gündüz saatlerinde randevusuz gider. Sekreter "randevusuz giremezsiniz" dediği hâlde üçü içeri girer. Hasan, Murat'a "bugün hasta alırsan seni bir daha çalışamaz hâle getiririm" der. Korkan Murat o gün muayenehaneyi kapatır ve bekleyen hastaları gönderir. Ertesi gün Murat, üçünden de şikâyetçi olur.

      1. Muayenehaneye girme fiilini değerlendiriniz.
      2. Murat'ın çalışmasının engellenmesini değerlendiriniz.
      3. Üç kişinin birlikte hareket etmesinin cezaya etkisi nedir?
    olcut:
      - {tespit: "Muayenehane açık rıza gerekmeden girilmesi mutat olmayan işyeridir; rızaya aykırı giriş TCK m. 116/2'yi oluşturur", puan: 25, madde: "TCK m. 116"}
      - {tespit: "Tehdit sonucu çalışma hürriyetinin ihlali", puan: 25, madde: "TCK m. 117"}
      - {tespit: "Gündüz ve cebir/tehdit olmadan girildiği için TCK m. 116/4 uygulanmaz", puan: 15, madde: "TCK m. 116"}
      - {tespit: "Birden fazla kişi tarafından birlikte işlenmesi nedeniyle ceza bir kat artırılır", puan: 25, madde: "TCK m. 119"}
      - {tespit: "TCK m. 116/2 ve TCK m. 117/1 metinde şikâyete bağlıdır; Yargıtay TCK m. 119/1 nitelikli hâlinde re'sen kovuşturmayı kabul eder; Murat şikâyetçi olduğundan kovuşturma şartı her durumda gerçekleşmiştir", puan: 10, madde: "TCK m. 117"}
    cozum: |
      **Nitelendirme:** Olayda bir işyerine rızaya aykırı giriş (TCK m. 116/2) ve tehditle iş ve çalışma hürriyetinin ihlali (TCK m. 117/1) söz konusudur; her ikisi de birden fazla kişiyle işlendiğinden TCK m. 119/1-c tartışılır.

      **Hukuki sorunlar:** (1) Muayenehane TCK m. 116/2 kapsamında mıdır? (2) Tehdit TCK m. 117/1'i oluşturur mu? (3) TCK m. 119/1'in etkisi.

      **İlgili hükümler:** TCK m. 116/1, 116/2, 116/4; TCK m. 117/1; TCK m. 119/1-c.

      **Değerlendirme:** TCK m. 116/2, birinci fıkra kapsamındaki fiillerin açık bir rızaya gerek duyulmaksızın girilmesi mutat olan yerler dışında kalan işyerlerinde işlenmesi hâlinde uygulanır. Diş hekimi muayenehanesine herkes rıza almadan girmez; randevu veya izinle girilir. Sekreter girilemeyeceğini açıkça söylediği hâlde içeri girmek rızaya aykırıdır. Dolayısıyla Hasan, Kemal ve Orhan TCK m. 116/2'yi işlemiştir. Giriş gündüz yapıldığı ve girişte cebir ya da tehdit kullanılmadığı için TCK m. 116/4 uygulanmaz; girişten sonra söylenen tehdit giriş fiilinin işlenme şekli değil, ayrı bir fiildir.

      Hasan'ın "seni çalışamaz hâle getiririm" demesi tehdittir. TCK m. 117/1, cebir veya tehdit kullanarak iş ve çalışma hürriyetini ihlal etmeyi cezalandırır. Murat korkarak muayenehaneyi kapatıp hastalarını göndermiş, yani çalışma hürriyeti fiilen engellenmiştir. Hasan TCK m. 117/1'den sorumludur.

      Fiiller birden fazla kişi tarafından birlikte işlenmiştir. TCK m. 119/1-c, konut dokunulmazlığının ihlali ile iş ve çalışma hürriyetinin ihlali suçları için bu hâli nitelikli sayar ve cezayı bir kat artırır. Üç kişi girişe birlikte katılmıştır; bu nedenle TCK m. 116/2 yönünden herkes için artırım düşünülür. Tehdidi yalnız Hasan söylediği için TCK m. 117/1 yönünden esas sorumlu Hasan'dır; Kemal ve Orhan'ın bu fiile katılımı olayda belirtilmediğinden onlar hakkında yalnız TCK m. 116/2 değerlendirilir.

      TCK m. 116/2 ve TCK m. 117/1 metinlerinde şikâyet şartı vardır. Yargıtay uygulamasında ise konut veya işyeri dokunulmazlığının ihlali TCK m. 119/1'deki nitelikli hâllerden biriyle işlendiğinde suçun re'sen kovuşturulacağı kabul edilir. Olayda Murat süresinde şikâyetçi olduğundan, hangi görüş benimsenirse benimsensin kovuşturma şartı gerçekleşmiştir; yalnız Hasan'ın işlediği TCK m. 117/1 suçu bakımından birlikte işlenme hâli kurulmadığından bu suç şikâyete bağlı kalır.

      **Sonuç:** Hasan, Kemal ve Orhan TCK m. 116/2'den, Hasan ayrıca TCK m. 117/1'den sorumludur. Birlikte işlenme hâli TCK m. 116/2 yönünden TCK m. 119/1-c uyarınca cezanın bir kat artırılmasını gerektirir. Murat'ın şikâyeti bulunduğundan kovuşturma yapılabilir.
