  - terim: Ortak kullanım
    tanim: "Konutun veya işyerinin birden fazla kişi tarafından birlikte kullanılması."
  - terim: Meşru amaç
    tanim: "Ortak kullanımda verilen rızanın geçerli olması için aranan, hukukun kabul ettiği amaç."
  - terim: Israr
    tanim: "Davranışın istenmediği bildirilmesine rağmen veya makul sıklıkla tekrarlanması."
  - terim: Netice suçu
    tanim: "Tamamlanması için kanunda yazılı sonucun gerçekleşmesi gereken suç; ısrarlı takipte ciddi huzursuzluk veya güvenlik endişesi."
  - terim: Yaklaşmama tedbiri
    tanim: "6284 sayılı Kanun m. 5/1-c uyarınca hâkimin (gecikmesinde sakınca varsa kolluk amirinin) şiddet uygulayan hakkında verdiği, korunan kişinin konutuna, okuluna ve iş yerine yaklaşmasını yasaklayan önleyici tedbir."
  - terim: Uzlaştırma
