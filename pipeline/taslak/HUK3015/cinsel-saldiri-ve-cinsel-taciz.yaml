ozet: |
  - **Korunan değer:** Kişinin cinsel özgürlüğü ve vücut dokunulmazlığı. Cinsel saldırı (TCK m. 102) ve cinsel taciz (TCK m. 105) yetişkin mağdur bakımından temel tiplerdir; çocuklar bakımından TCK m. 103 ve TCK m. 104 devreye girer.
  - **Temel ölçüt:** Rızaya aykırı cinsel davranış **vücuda temas** içeriyorsa cinsel saldırı; temas olmadan söz, yazı, mesaj, teşhir gibi yollarla cinsel amaçlı rahatsız etme ise cinsel taciz.
  - **Cinsel saldırının basamakları:** Temel şekil 5-10 yıl hapis ve mağdurun şikâyetine bağlıdır; sarkıntılık düzeyinde kalırsa 2-5 yıl hapistir (TCK m. 102/1). Vücuda organ veya sair cisim sokulursa ceza 12 yıldan az olamaz (TCK m. 102/2).
  - **Eşe karşı:** Organ veya cisim sokulmasında mağdur eşse soruşturma ve kovuşturma şikâyete bağlıdır (TCK m. 102/2).
  - **Nitelikli hâller (TCK m. 102/3):** Savunmasız kişiye karşı, kamu görevi/vesayet/hizmet ilişkisinin nüfuzunun kötüye kullanılması, kan ve kayın hısımlığı (üçüncü derece dâhil) ile üvey/evlat edinen ilişkisi, silahla veya birden fazla kişiyle, toplu yaşam ortamının kolaylığı. Ceza yarı oranında artırılır.
  - **Ağır sonuçlar:** Cebir ve şiddet kasten yaralamanın ağır sonuçlarına yol açarsa ayrıca yaralama hükümleri (TCK m. 102/4); bitkisel hayat veya ölümde ağırlaştırılmış müebbet hapis (TCK m. 102/5).
  - **Cinsel taciz (TCK m. 105/1):** 3 aydan 2 yıla kadar hapis veya adli para cezası; çocuğa karşı 6 aydan 3 yıla kadar hapis. Temel şekil şikâyete bağlıdır.
  - **Nitelikli taciz (TCK m. 105/2):** Kamu görevi, hizmet veya aile ilişkisi; vasi-eğitici-bakıcı gibi kişiler; aynı işyeri; posta/elektronik haberleşme; teşhir. Ceza yarı oranında artırılır. Mağdur işi, okulu veya ailesini bırakmak zorunda kalırsa ceza 1 yıldan az olamaz.
  - **Uzlaştırma:** Cinsel dokunulmazlığa karşı suçlarda, şikâyete bağlı olsa bile, uzlaştırma yoluna gidilemez (CMK m. 253/3).
  - **Şikâyet süresi:** Şikâyete bağlı suçlarda altı ay (TCK m. 73).
  - **Teşebbüs:** Organ veya cisim sokmaya yönelik kast ve elverişli hareketler ispatlanamazsa fiil tamamlanmış temel cinsel saldırı olarak kalabilir; şüpheden sanık yararlanır.
anlatim: |
  ## 1. Genel çerçeve

  Cinsel dokunulmazlığa karşı suçlar bölümü, bireyin kendi cinselliği üzerinde özgürce karar verme hakkını korur. Yetişkin mağdur bakımından iki ana suç vardır: **cinsel saldırı** (TCK m. 102) ve **cinsel taciz** (TCK m. 105). Mağdur çocuksa temaslı davranışlar TCK m. 103 ve TCK m. 104'ün konusudur; bu konuyu ayrı bir notta bulursun, burada yalnız sınırlarını göstereceğim.

  Önce ayrımı oturt: **cinsel saldırıda vücut dokunulmazlığı ihlal edilir**, yani cinsel nitelikli bir fiziksel temas vardır. **Cinsel tacizde** fiziksel temas yoktur; hedef, kişinin cinsel bakımdan rahatsız edilmesidir.

  ## 2. Cinsel saldırının temel şekli ve sarkıntılık (TCK m. 102/1)

  Cinsel davranışlarla bir kimsenin vücut dokunulmazlığını ihlal eden kişi, mağdurun şikâyeti üzerine 5-10 yıl hapis alır. Cinsel davranışın **sarkıntılık düzeyinde kalması** hâlinde ceza 2-5 yıl hapistir (TCK m. 102/1).

  Kanun sarkıntılığı tanımlamaz; bunu uygulama somut olaya bakarak ayırır. Kabaca, sarkıntılık daha hafif bir müdahale, temel şekil ise daha yoğun bir müdahaledir. Sınır, olayın özelliklerine göre belirlenir ve bu nedenle sınav olaylarında sınırı tartışmalı bırakacak olgulara dayanma; olay genellikle bir tarafı açıkça gösterir.

  Fail ve mağdur her yetişkin olabilir; cinsiyet, medeni hâl önem taşımaz. Mağdurun rızası bu suçta fiili hukuka uygun hâle getirebilir; çünkü korunan değer, kişinin tasarruf edebildiği cinsel özgürlüktür.

  > **Örnek:** Ali, iş arkadaşı Ayşe'nin kolundan tutup kendine doğru çeker. Tam bu sırada kapı zili çalar ve Ali kaçar. Yargıtay'ın bir kararında benzer bir olay, sarkıntılık düzeyindeki cinsel saldırı (TCK m. 102/1 ikinci cümle) olarak nitelendirilmiştir; üst sınır 5 yıl olduğundan dava zamanaşımı 8 yıl sayılmıştır (TCK m. 66/1-e).

  ## 3. Vücuda organ veya sair cisim sokulması (TCK m. 102/2)

  Fiilin vücuda organ ya da sair bir cisim sokulması suretiyle gerçekleştirilmesi hâlinde ceza **12 yıldan az olamaz**. Madde, bu hâlin eşe karşı işlenmesinde soruşturma ve kovuşturmayı **mağdurun şikâyetine bağlar**. Dolayısıyla şikâyet rejimi şöyledir:

  | Fiil | Şikâyet rejimi |
  |---|---|
  | Temel şekil ve sarkıntılık (m. 102/1) | Şikâyete bağlı |
  | Organ/cisim sokulması (m. 102/2) | Kural olarak re'sen |
  | Aynı fiil eşe karşı (m. 102/2) | Şikâyete bağlı |

  Şikâyet süresi, şikâyet hakkı olanın fiili ve failin kim olduğunu öğrendiği günden itibaren altı aydır (TCK m. 73/1-2).

  > ⚠️ **Sınavda dikkat:** "Cinsel saldırı her zaman şikâyete bağlıdır" yanlıştır. Şikâyet TCK m. 102/1 için aranır; organ/cisim sokulmasında (TCK m. 102/2) eşe karşı işlenmesi dışında aranmaz.

  ## 4. Nitelikli hâller (TCK m. 102/3)

  Suç aşağıdaki hâllerden biriyle işlenirse, yukarıdaki fıkralara göre verilen cezalar yarı oranında artırılır:

  1. Beden veya ruh bakımından kendini savunamayacak durumdaki kişiye karşı (a).
  2. Kamu görevinin, vesayet veya hizmet ilişkisinin sağladığı nüfuz kötüye kullanılarak (b).
  3. Üçüncü derece dâhil kan veya kayın hısımlığı bulunan kişiye karşı ya da üvey baba, üvey ana, üvey kardeş, evlat edinen veya evlatlık tarafından (c).
  4. Silahla veya birden fazla kişi tarafından birlikte (d). Silah, TCK m. 6/1-f'de tanımlanan anlamdadır.
  5. İnsanların toplu olarak bir arada yaşama zorunluluğunda bulunduğu ortamların sağladığı kolaylıktan faydalanarak (e).

  > **Örnek:** Müdür Kemal, "işten çıkarırım" diyerek sekreteri Zeynep'e karşı organ sokma suretiyle cinsel saldırıda bulunur. Hizmet ilişkisinin sağladığı nüfuz kötüye kullanıldığından TCK m. 102/3-b uygulanır ve TCK m. 102/2'deki ceza yarı oranında artırılır.

  ## 5. Ağır sonuçlar ve içtima

  **Kasten yaralama.** Cinsel saldırı için başvurulan cebir ve şiddet kasten yaralamanın ağır sonuçlarına yol açarsa ayrıca kasten yaralama hükümleri uygulanır (TCK m. 102/4). Ağır sonuçlar TCK m. 87'de sayılır. Hafif yaralama kural olarak ayrı suç olarak cezalandırılmaz; bu, bileşik suç mantığıdır (TCK m. 42): biri diğerinin unsuru olduğu için tek fiil sayılan suçta içtima hükümleri uygulanmaz.

  **Ölüm ve bitkisel hayat.** Suç sonucu mağdur bitkisel hayata girer veya ölürse ağırlaştırılmış müebbet hapis verilir (TCK m. 102/5).

  **Hürriyetten yoksun kılma.** Mağdur cinsel amaçla alıkonulduysa TCK m. 109'un ilgili fıkraları gündeme gelir. TCK m. 109/2 hürriyetten yoksun kılmada cebir, tehdit veya hile kullanılmasını, TCK m. 109/5 ise suçun cinsel amaçla işlenmesinde cezanın yarı oranında artırılmasını düzenler. Bir Yargıtay Ceza Genel Kurulu kararında, aracından indirmediği kişiye karşı hem nitelikli cinsel saldırı hem hürriyetinden yoksun kılma suçlarının sübut bulduğu sonucuna varılmıştır.

  **Zincirleme suç.** Aynı mağdura karşı, tek bir suç işleme kararı kapsamında değişik zamanlarda aynı suçun birden fazla işlenmesi hâlinde bir ceza verilir ve ceza dörtte birinden dörtte üçüne kadar artırılır (TCK m. 43/1). TCK m. 43/3 yalnız kasten öldürme, kasten yaralama, işkence ve yağma için bu kuralı dışlar; cinsel saldırı ve cinsel taciz bu listede yer almaz.

  ## 6. Teşebbüs ve gönüllü vazgeçme

  Cinsel saldırının nitelikli şekli (organ/cisim sokma) teşebbüse elverişlidir. Fail, işlemeyi kastettiği suçu elverişli hareketlerle doğrudan doğruya icraya başlayıp elinde olmayan nedenlerle tamamlayamazsa teşebbüsten sorumlu tutulur (TCK m. 35). Ancak Yargıtay Ceza Genel Kurulu, bir kararında, organ/cisim sokma kastının ve bu sonuca elverişli, dış dünyaya yansıyan icra hareketlerinin **şüpheye yer bırakmayacak biçimde** kanıtlanmasını arar. Sanığın öpmeye çalışması, vücuda dokunması, kıyafet çıkarma iddiası ve tehdit içeren sözleri cinsel temas boyutunda kalmış, organ sokmaya yönelik icra başlangıcı ispatlanamamış; şüpheden sanık yararlanarak fiil TCK m. 102/1'deki cinsel saldırı sayılmıştır.

  **Gönüllü vazgeçme** (TCK m. 36) bir başka ayrımdır: Fail icra hareketlerinden gönüllü vazgeçerse teşebbüsten cezalandırılmaz; ama tamamlanmış kısım başlı başına suç oluşturuyorsa yalnız o suçun cezasını alır. Yani fail, organ sokmadan gönüllü vazgeçmiş olsa bile daha önce gerçekleşmiş cinsel temas TCK m. 102/1 olarak cezalandırılır.

  > 💡 **Püf nokta:** Teşebbüs sorusunda iki şeye bak: (1) failin kastı organ/cisim sokmaya mı yönelikti, yalnız cinsel temasa mı? (2) Fail kendi iradesiyle mi vazgeçti, yoksa elinde olmayan bir engel mi çıktı?

  ## 7. Cinsel taciz (TCK m. 105)

  Bir kimseyi **cinsel amaçlı olarak** taciz eden kişi, mağdurun şikâyeti üzerine 3 aydan 2 yıla kadar hapis veya adli para cezası alır. Fiil çocuğa karşı işlenirse 6 aydan 3 yıla kadar hapis verilir (TCK m. 105/1). Tipik hareketler cinsel içerikli söz, mesaj, teklif ve bakışlardır; fiziksel temas yoktur. Temas varsa fiil artık TCK m. 102'ye (çocuk mağdurda TCK m. 103'e) kayar.

  **Nitelikli hâller (TCK m. 105/2).** Suç şu yollarla işlenirse ceza yarı oranında artırılır: kamu görevinin veya hizmet ilişkisinin ya da aile içi ilişkinin sağladığı kolaylık; vasi, eğitici, öğretici, bakıcı, koruyucu aile, sağlık hizmeti veren veya koruma-bakım-gözetim yükümlüsü kişiler tarafından işlenmesi; aynı işyerinde çalışmanın kolaylığı; posta veya elektronik haberleşme araçlarının kolaylığı; teşhir. Bu fiil nedeniyle mağdur **işi bırakmak, okuldan veya ailesinden ayrılmak zorunda kalmışsa** ceza bir yıldan az olamaz.

  > **Örnek:** Müdür Murat, sekreteri Selin'e bir ay boyunca farklı günlerde WhatsApp'tan cinsel içerikli mesajlar gönderir; Selin işten ayrılır. Fiil cinsel tacizdir; elektronik haberleşme aracı ve aynı işyerinde çalışma nitelikli hâl oluşturur, işi bırakma nedeniyle ceza bir yıldan az olamaz (TCK m. 105/2). Farklı zamanlarda aynı mağdura yönelik tekrar, zincirleme suç kuralını da gündeme getirir (TCK m. 43/1).

  ## 8. Komşu suçlarla ayrım

  | Karıştırılan | Ayırıcı nokta |
  |---|---|
  | TCK m. 102 / TCK m. 105 | Vücuda temas var mı? |
  | TCK m. 105 / TCK m. 123/A | Cinsel amaç var mı? m. 123/A ısrarlı takibi düzenler ve cinsel amacı aramaz |
  | TCK m. 105/2-e / TCK m. 225 | Teşhir belirli bir kişiye yöneltildi mi? Hedefsiz, alenen teşhir m. 225'tir |

  TCK m. 225'e göre alenen cinsel ilişkide bulunan veya teşhircilik yapan kişi 6 aydan 1 yıla kadar hapis alır. Bir kişiyi hedef almayan teşhir bu hükümde kalır.

  > ⚠️ **Sınavda dikkat:** TCK m. 123/A (ısrarlı takip) şikâyete bağlıdır ve uzlaştırma kapsamı dışındadır; tıpkı cinsel dokunulmazlığa karşı suçlar gibi (CMK m. 253/3). Ama iki suç aynı değildir: m. 123/A cinsel amaç aramaz.

  ## 9. Yargılama ve uzlaştırma

  Şikâyete bağlı olsa bile cinsel dokunulmazlığa karşı suçlarda uzlaştırma yoluna gidilemez (CMK m. 253/3). Şikâyet süresi altı aydır (TCK m. 73/1). Şikâyetten vazgeçme, kanunda aksi yazılı olmadıkça kovuşturmanın yapılabildiği şikâyete bağlı suçlarda davayı düşürür (TCK m. 73/4).

  Bu suçlarda delil kural olarak mağdur beyanı, adli rapor ve olay sonrası davranışlardır. Yargıtay Ceza Genel Kurulu, görgü tanığı bulunmayan bir olayda mağdurun istikrarlı ve tutarlı beyanları, olayın hemen ardından başvurusu, rapordaki bulgular ve sanığın çelişkili savunmalarının birlikte vicdani kanaat için yeterli olabileceğini kabul etmiştir; kararda oy çokluğu vardır, dolayısıyla delil değerlendirmesi özellikle takdire bağlı bir alandır.

  ## 10. Denetim şeması

  1. Mağdur yetişkin mi? (Çocuksa TCK m. 103 ve TCK m. 104 değerlendirilir.)
  2. Fiil cinsel nitelikli mi ve vücuda temas var mı? Yoksa TCK m. 105.
  3. Temel şekil mi, sarkıntılık mı, organ/cisim sokma mı?
  4. Nitelikli hâl (TCK m. 102/3 veya TCK m. 105/2) var mı?
  5. Ağır sonuç (TCK m. 102/4-5, TCK m. 87)?
  6. Teşebbüs/gönüllü vazgeçme (TCK m. 35, TCK m. 36).
  7. Şikâyet rejimi, uzlaştırma yasağı, zamanaşımı.
  8. İçtima: bileşik suç, zincirleme suç, hürriyetten yoksun kılma.
kritik: |
  - 📌 TCK m. 102/1: temel şekil 5-10 yıl hapis (şikâyete bağlı); sarkıntılık düzeyinde kalırsa 2-5 yıl.
  - 📌 TCK m. 102/2: vücuda organ veya sair cisim sokulması, 12 yıldan az olmamak üzere hapis.
  - 📌 Eşe karşı organ/cisim sokulmasında soruşturma ve kovuşturma şikâyete bağlıdır (TCK m. 102/2).
  - ⚠️ "Cinsel saldırı hep şikâyete bağlıdır" yanlıştır; organ/cisim sokulması (eşe karşı hariç) re'sen soruşturulur.
  - 📌 TCK m. 102/3'teki beş nitelikli hâl cezayı yarı oranında artırır: savunmasızlık, nüfuz, hısımlık, silah/birden fazla kişi, toplu yaşam ortamı.
  - 📌 Cinsel saldırı için başvurulan cebir ve şiddet kasten yaralamanın ağır sonuçlarına yol açarsa ayrıca yaralama hükümleri uygulanır (TCK m. 102/4).
  - 📌 Suç sonucu bitkisel hayat veya ölümde ağırlaştırılmış müebbet hapis (TCK m. 102/5).
  - 📌 Saldırı ile taciz farkı: vücuda temas var mı? Temas yoksa TCK m. 105.
  - 📌 TCK m. 105/1: 3 ay-2 yıl hapis veya adli para cezası; çocuğa karşı 6 ay-3 yıl hapis; şikâyete bağlı.
  - 📌 TCK m. 105/2: nitelikli taciz yarı oranında artırılır; mağdur işi, okulu veya ailesini bırakmak zorunda kalırsa ceza 1 yıldan az olamaz.
  - ⚠️ WhatsApp, SMS ve benzeri araçlarla taciz TCK m. 105/2-d'dir; hedefsiz alenen teşhir ise TCK m. 225'tir.
  - 📌 Cinsel dokunulmazlığa karşı suçlarda uzlaştırma yoktur (CMK m. 253/3).
  - ⚠️ TCK m. 43/3 cinsel saldırı ve cinsel tacizi zincirleme suç kuralından dışlamaz; aynı mağdura değişik zamanlarda tekrar hâlinde TCK m. 43/1 uygulanır.
doktrin: |
  ### Cinsel amaç ve özel kast

  Doktrinde, cinsel saldırı ve cinsel tacizde failin "cinsel" bir amaçla hareket etmesinin gerekip gerekmediği tartışılır. Baskın görüşe göre cinsel bir yönelim aranır; ancak bu yönelimin illa haz alma olması gerekmez, kişinin cinsel özgürlüğünü hedef alan bir tutum yeterlidir. Uygulamada bu konu, olayın bağlamı ve failin davranışlarından çıkarılır. TCK m. 105'te cinsel amaç madde metninde açıkça yazılıdır; bu nedenle tacizde amaç somut olayın bağlamından araştırılır.

  ### Eşler arasında temel cinsel saldırı

  TCK m. 102/2 yalnız organ/cisim sokulması bakımından eşe karşı şikâyet şartını getirmiştir. Bu düzenlemeden hareketle bir görüş, eşe karşı temel şeklin (TCK m. 102/1) oluşmayacağını savunur. Karşı görüş, evliliğin cinsel özgürlüğü ortadan kaldırmadığını, TCK m. 102/1'in zaten şikâyete bağlı olduğunu ve eşin de mağdur olabileceğini ileri sürer. Sınav olayında bu noktayı çözümün tek dayanağı yapma; tartışmayı belirtmek yeterlidir.

  ### Nitelikli tacizde şikâyet rejimi

  TCK m. 105/1 açıkça şikâyete bağlıdır; TCK m. 105/2 ise yalnız cezayı artırır. Nitelikli hâllerin re'sen mi yoksa yine şikâyetle mi kovuşturulacağı tartışmalıdır. Bu yüzden bu notta nitelikli tacizin şikâyet rejimini kesin bilgi olarak vermiyoruz; sınavda soru böyle bir ayrıntıya bağlıysa madde metnini ve hocanın aktardığı güncel uygulamayı esas al.

  ### Sarkıntılık sınırı

  Hangi bedensel temasın sarkıntılık, hangisinin temel şekil sayılacağı kanunda sayısal bir ölçüte bağlanmamıştır. Süre, yoğunluk, temasın yeri ve devamlılığı birlikte değerlendirilir; Yargıtay uygulaması da somut olaya göre şekillenir.
