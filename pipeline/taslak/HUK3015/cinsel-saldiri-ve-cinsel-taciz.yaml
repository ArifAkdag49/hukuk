  - terim: Bileşik suç
    tanim: "Biri diğerinin unsuru olduğu için tek fiil sayılan suç; içtima hükümleri uygulanmaz (TCK m. 42)."
  - terim: Zincirleme suç
    tanim: "Tek suç işleme kararı kapsamında aynı mağdura karşı değişik zamanlarda aynı suçun işlenmesi; bir ceza artırılarak verilir (TCK m. 43/1)."
  - terim: Gönüllü vazgeçme
    tanim: "Failin icra hareketlerinden kendi iradesiyle dönmesi; teşebbüsten cezalandırılmaz, tamamlanan kısım suçsa o suçtan sorumlu olur (TCK m. 36)."
  - terim: Uzlaştırma yasağı
    tanim: "Cinsel dokunulmazlığa karşı suçlarda şikâyete bağlı olsa bile uzlaştırmaya gidilememesi (CMK m. 253/3)."
kararlar:
  - id: "1231429400"
    ozet: |
      Yerel mahkeme, sanığı nitelikli cinsel saldırıya teşebbüsten (6545 sayılı Kanundan önceki TCK m. 102/2 ve TCK m. 35/2 uyarınca) 1 yıl 8 ay hapis cezasıyla cezalandırmıştı. Yargıtay 9. Ceza Dairesi, eylemin TCK m. 102/1'deki cinsel saldırı olduğu gerekçesiyle hükmü bozdu; Yargıtay Cumhuriyet Başsavcılığı bu bozmaya itiraz etti. Olayda sanığın, katılanı tehdit edip yakındaki bir yere götürdüğü, öpmeye ve kıyafetlerini çıkarmaya çalıştığı, vücuduna dokunduğu ve direnen katılanı darp ettiği ileri sürülmüştü. Ceza Genel Kurulu, nitelikli cinsel saldırıya teşebbüsün kabulü için kastın organ veya sair cisim sokmaya yönelik olduğunun ve elverişli icra hareketlerinin şüpheye yer bırakmayacak biçimde ispatlanması gerektiğini belirtti. Dosyada bu icra başlangıcı kesin delillerle kanıtlanamadığından şüphenin sanık lehine yorumlanmasıyla fiilin TCK m. 102/1'deki cinsel saldırı olduğunu kabul etti ve itirazı oy birliğiyle reddetti. Karar, teşebbüs ile temel şekil ayrımında ispat standardını gösterir.
  - id: "1226346000"
    ozet: |
      Sanık, katılanın kollarından tutup kendine doğru çektiği sırada katılanın babasının kapı ziline basması üzerine olay yerinden ayrılmıştı. Yargılamada ilk derece mahkemesi, bozma sonrasında fiili sarkıntılık suretiyle cinsel saldırı olarak nitelendirip mahkûmiyet kararı verdi. Yargıtay 9. Ceza Dairesi, TCK m. 102/1'in ikinci cümlesine göre cezanın türüne ve üst sınırına bakıldığında TCK m. 66/1-e uyarınca 8 yıllık olağan dava zamanaşımının uygulanacağını belirtti. Bozma öncesi hüküm ile bozma sonrası hüküm arasında bu süre dolduğu için TCK m. 67/2-d uyarınca kesen sebepler dikkate alınsa bile zamanaşımının gerçekleştiğini kabul etti ve hükmü bozup davanın zamanaşımı nedeniyle düşmesine karar verdi. Karar, sarkıntılık düzeyindeki cinsel saldırının cezasının sınırının zamanaşımı hesabında belirleyici olduğunu gösterir.
sorular:
  - soru: |
      TCK m. 102/1'e göre sarkıntılık düzeyinde kalan cinsel saldırının cezası aşağıdakilerden hangisidir?
    siklar:
      - "5-10 yıl hapis"
      - "2-5 yıl hapis"
      - "3 ay-2 yıl hapis"
      - "12 yıldan az olmamak üzere hapis"
    dogru: 1
    aciklama: |
      TCK m. 102/1'in ikinci cümlesi, cinsel davranışın sarkıntılık düzeyinde kalması hâlinde 2-5 yıl hapis öngörür. 5-10 yıl temel şekildir; 12 yıldan az olmamak üzere hapis organ/cisim sokulması içindir (TCK m. 102/2).
  - soru: |
      Aşağıdakilerden hangisi cinsel saldırı (TCK m. 102) ile cinsel taciz (TCK m. 105) arasındaki temel ayırıcı ölçüttür?
    siklar:
      - "Mağdurun yaşı."
      - "Fiilin vücuda temas içermesi."
      - "Failin kamu görevlisi olması."
      - "Olayın gece işlenmesi."
    dogru: 1
    aciklama: |
      Cinsel saldırıda vücut dokunulmazlığı ihlal edilir, yani cinsel nitelikli fiziksel temas vardır. Cinsel tacizde ise temas olmadan, cinsel amaçlı rahatsız etme söz konusudur.
  - soru: |
      Aşağıdakilerden hangisi TCK m. 102/3'teki nitelikli hâllerden biri değildir?
    siklar:
      - "Silahla işlenmesi."
      - "Üçüncü derece dâhil kan hısımına karşı işlenmesi."
      - "Aynı işyerinde çalışmanın sağladığı kolaylıktan faydalanılması."
      - "İnsanların toplu yaşadığı ortamın sağladığı kolaylıktan faydalanılması."
    dogru: 2
    aciklama: |
      "Aynı işyerinde çalışmanın kolaylığı" cinsel tacizin nitelikli hâlidir (TCK m. 105/2-c). TCK m. 102/3'te savunmasızlık, nüfuz, hısımlık, silah/birden fazla kişi ve toplu yaşam ortamı sayılır.
  - soru: |
      Eşine karşı rızası dışında organ sokma suretiyle cinsel saldırıda bulunan Hasan için soruşturma ve kovuşturma bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Fiil hiçbir şekilde suç oluşturmaz."
      - "Soruşturma ve kovuşturma mağdurun şikâyetine bağlıdır."
      - "Her hâlde re'sen soruşturulur."
      - "Uzlaştırmaya tabidir."
    dogru: 1
    aciklama: |
      TCK m. 102/2'nin ikinci cümlesine göre organ/cisim sokulmasının eşe karşı işlenmesi hâlinde soruşturma ve kovuşturma mağdurun şikâyetine bağlıdır. Şikâyete bağlı olsa bile cinsel dokunulmazlığa karşı suçlarda uzlaştırma yapılamaz (CMK m. 253/3).
  - soru: |
      Cinsel saldırı sonucunda mağdurun ölmesi hâlinde TCK m. 102/5'e göre hangi ceza verilir?
    siklar:
      - "12 yıldan az olmamak üzere hapis"
      - "Ağırlaştırılmış müebbet hapis"
      - "Müebbet hapis"
      - "20-25 yıl hapis"
    dogru: 1
    aciklama: |
      TCK m. 102/5, suç sonucu mağdurun bitkisel hayata girmesi veya ölümü hâlinde ağırlaştırılmış müebbet hapis cezası öngörür.
  - soru: |
      Çocuğa karşı işlenen (temassız) cinsel taciz için TCK m. 105/1'deki ceza aşağıdakilerden hangisidir?
    siklar:
      - "3 aydan 2 yıla kadar hapis veya adli para cezası"
      - "6 aydan 3 yıla kadar hapis"
      - "2-5 yıl hapis"
      - "1 yıldan az olmamak üzere hapis"
    dogru: 1
    aciklama: |
      TCK m. 105/1'e göre taciz fiilin çocuğa karşı işlenmesi hâlinde 6 aydan 3 yıla kadar hapisle cezalandırılır. Temel şekil 3 ay-2 yıl hapis veya adli para cezasıdır.
  - soru: |
      Müdür Mert, sekreter Elif'e bir ay boyunca WhatsApp'tan cinsel içerikli mesajlar göndermiş, Elif de bu yüzden işten ayrılmak zorunda kalmıştır. Mert'in durumu bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Fiil TCK m. 102/1'deki cinsel saldırıdır."
      - "Fiil yalnız hakarettir."
      - "Fiil nitelikli cinsel tacizdir; ceza bir yıldan az olamaz."
      - "Elif işten ayrıldığı için fiil suç olmaktan çıkar."
    dogru: 2
    aciklama: |
      Fiziksel temas yoktur, bu nedenle TCK m. 105 uygulanır. Elektronik haberleşme araçlarının ve aynı işyerinde çalışmanın kolaylığı nitelikli hâl oluşturur; mağdur işi bırakmak zorunda kaldığı için ceza bir yıldan az olamaz (TCK m. 105/2).
  - soru: |
      Sanık, katılanı ıssız bir yere götürüp tehdit etmiş; öpmeye, vücuduna dokunmaya çalışmış, ancak organ sokmaya yönelik kast ve icra hareketleri kesin delillerle ispatlanamamıştır. Ceza Genel Kurulu'nun yaklaşımına göre fiil nasıl nitelendirilir?
    siklar:
      - "Nitelikli cinsel saldırıya teşebbüs (TCK m. 102/2 ve TCK m. 35)."
      - "Cinsel taciz (TCK m. 105)."
      - "Cinsel saldırı (TCK m. 102/1)."
      - "Fiil suç değildir."
    dogru: 2
    aciklama: |
      Organ/cisim sokma kastı ve buna yönelik elverişli icra hareketleri şüpheye yer bırakmayacak biçimde ispatlanamadıysa, şüpheden sanık yararlanır ve cinsel temas boyutundaki fiil TCK m. 102/1'deki cinsel saldırı sayılır.
  - soru: |
      Ahmet, Ayşe'yi rızasına aykırı olarak kucaklayıp vücudunu okşar; sonra organ sokma niyetiyle hareket edip kendi iradesiyle vazgeçerek onu bırakır. Ahmet'in sorumluluğu bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Gönüllü vazgeçme nedeniyle hiçbir cezaya çarptırılmaz."
      - "Teşebbüs hükümlerine göre nitelikli cinsel saldırıdan cezalandırılır."
      - "TCK m. 36 gereği teşebbüsten cezalandırılmaz; tamamlanan temel cinsel saldırıdan cezalandırılır."
      - "Fiil yalnız cinsel taciz sayılır."
    dogru: 2
    aciklama: |
      TCK m. 36'ya göre gönüllü vazgeçen fail teşebbüsten cezalandırılmaz; ama tamam olan kısım başlı başına bir suç oluşturuyorsa yalnız o suça ait ceza uygulanır. Rızaya aykırı okşama temas içerdiğinden TCK m. 102/1 oluşur. Vazgeçmenin gönüllü olduğu varsayılmıştır.
  - soru: |
      Cinsel dokunulmazlığa karşı suçlarda uzlaştırma bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Şikâyete bağlı oldukları için uzlaştırmaya tabidirler."
      - "Şikâyete bağlı olsa bile uzlaştırma yoluna gidilemez."
      - "Yalnız TCK m. 105 uzlaştırmaya tabidir."
      - "Yalnız sarkıntılık uzlaştırmaya tabidir."
    dogru: 1
    aciklama: |
      CMK m. 253/3'e göre soruşturulması ve kovuşturulması şikâyete bağlı olsa bile cinsel dokunulmazlığa karşı suçlarda uzlaştırma yoluna gidilemez.
  - soru: |
      Bir kişi, belirli bir mağdur gözetmeksizin kalabalık bir parkta cinsel organını gösterir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "TCK m. 105/2-e uygulanır."
      - "TCK m. 102/2 uygulanır."
      - "TCK m. 225'teki hayasızca hareketler suçu gündeme gelir."
      - "Fiil hiçbir suç oluşturmaz."
    dogru: 2
    aciklama: |
      TCK m. 225, alenen cinsel ilişkide bulunan veya teşhircilik yapan kişiyi cezalandırır. TCK m. 105/2-e belirli bir kişiyi hedefleyen teşhir suretiyle taciz içindir; burada belirli mağdur yoktur.
  - soru: |
      Zeynep'e değişik günlerde, tek bir suç işleme kararı kapsamında sözlü cinsel taciz eden Orhan hakkında hangi hüküm uygulanır?
    siklar:
      - "TCK m. 43/3 nedeniyle zincirleme suç uygulanamaz."
      - "Her bir fiil için ayrı ayrı ceza verilir ve toplanır."
      - "Bir ceza verilir ve zincirleme suç gereği TCK m. 43/1'e göre artırılır."
      - "Yalnız ilk fiil cezalandırılır."
    dogru: 2
    aciklama: |
      TCK m. 43/1'e göre aynı mağdura karşı, bir suç işleme kararı kapsamında değişik zamanlarda aynı suçun birden fazla işlenmesi hâlinde bir ceza verilir ve dörtte birinden dörtte üçüne kadar artırılır. TCK m. 43/3 yalnız kasten öldürme, kasten yaralama, işkence ve yağma suçlarında bu kuralı dışlar.
olaylar:
  - olay: |
      Şirket müdürü Kemal, yaklaşık iki yıldır yanında çalışan sekreteri Zeynep'i bir akşam fazla mesai bahanesiyle ofiste tutar. Başka kimse kalmayınca "Bana uymazsan seni işten çıkarırım" diyerek Zeynep'i zorla yere yatırır ve rızası olmadan vücuduna parmağını sokar. Zeynep ağlayıp çığlık atınca Kemal onu bırakır. Zeynep ertesi gün durumu savcılığa bildirir; Kemal'in Zeynep'in eşi olmadığı, aralarında hiçbir akrabalık bulunmadığı anlaşılır. Kemal'in silah kullanmadığı, tek başına hareket ettiği sabittir.

      1. Kemal'in sorumluluğunu ve fiilin niteliğini tartışınız.
      2. Nitelikli hâlin uygulanıp uygulanmayacağını ve cezanın alt sınırını belirtiniz.
      3. Soruşturmanın şikâyete bağlı olup olmadığını ve uzlaştırmayı değerlendiriniz.
    olcut:
      - {tespit: "Rızaya aykırı, vücuda parmak sokulması suretiyle cinsel davranışın TCK m. 102/2 kapsamında nitelikli cinsel saldırı olduğu", puan: 25, madde: "TCK m. 102/2"}
      - {tespit: "Cinsel temas bulunduğundan fiilin cinsel taciz (TCK m. 105) değil cinsel saldırı olduğu", puan: 15, madde: "TCK m. 105"}
      - {tespit: "İşten çıkarma tehdidiyle hizmet ilişkisinin sağladığı nüfuzun kötüye kullanıldığı; TCK m. 102/3-b uygulanacağı", puan: 25, madde: "TCK m. 102/3"}
      - {tespit: "Temel ceza 12 yıldan az olmamak üzere hapistir; nitelikli hâl nedeniyle yarı oranında artırılacağı", puan: 15, madde: "TCK m. 102/2"}
      - {tespit: "Mağdur eş olmadığından organ/cisim sokulmasında şikâyet aranmaz, soruşturmanın re'sen yapılacağı", puan: 10, madde: "TCK m. 102/2"}
      - {tespit: "Cinsel dokunulmazlığa karşı suçlarda uzlaştırmanın mümkün olmadığı", puan: 10, madde: "CMK m. 253/3"}
    cozum: |
      **Nitelendirme:** Failin, hizmet ilişkisinden doğan gücünü kullanarak mağdurun rızası dışında vücuduna sair cisim ya da organ sokması, nitelikli cinsel saldırı olayıdır. Burada Kemal'in parmağını sokması "organ" kapsamındadır.

      **Hukuki sorunlar:** (1) Fiil cinsel saldırı mı cinsel taciz mi? (2) Hangi fıkra uygulanır ve nitelikli hâl var mı? (3) Şikâyet ve uzlaştırma rejimi nedir?

      **İlgili hükümler:** TCK m. 102/1 temel şekli ve sarkıntılığı, TCK m. 102/2 vücuda organ veya sair cisim sokulmasını 12 yıldan az olmamak üzere hapisle düzenler ve bu hâlin eşe karşı işlenmesini şikâyete bağlar. TCK m. 102/3-b, kamu görevinin, vesayet veya hizmet ilişkisinin sağladığı nüfuzun kötüye kullanılmasını yarı oranında artırım nedeni sayar. TCK m. 105 temassız tacizi düzenler. CMK m. 253/3, cinsel dokunulmazlığa karşı suçlarda uzlaştırmayı yasaklar.

      **Değerlendirme:** Olayda fiziksel temas vardır; bu yüzden fiil cinsel taciz değil cinsel saldırıdır. Vücuda organ sokulduğundan temel şekil (TCK m. 102/1) değil, TCK m. 102/2 uygulanır; alt sınır 12 yıldır. Kemal'in "işten çıkarırım" demesi ve zorla yere yatırması, zaten süregelen iş ilişkisinin sağladığı nüfuzun kötüye kullanılmasıdır; bu nedenle TCK m. 102/3-b'deki nitelikli hâl gerçekleşmiştir ve TCK m. 102/2'deki ceza yarı oranında artırılır. Silah kullanılmaması ve Kemal'in tek başına hareket etmesi, d bendinin olaya uygulanmayacağını gösterir. Zeynep Kemal'in eşi olmadığından TCK m. 102/2'nin eşe karşı işlenmeye ilişkin şikâyet kuralı uygulanmaz; soruşturma ve kovuşturma re'sen yapılır. Cinsel dokunulmazlığa karşı suç olduğundan uzlaştırma yoluna gidilemez (CMK m. 253/3).

      **Sonuç:** Kemal, nitelikli (TCK m. 102/3-b) cinsel saldırı suçundan, TCK m. 102/2'deki ceza yarı oranında artırılarak cezalandırılır; soruşturma re'sen yürütülür ve uzlaştırma uygulanmaz.
  - olay: |
      Şirket müdürü Murat, sekreteri Selin'e iki ay boyunca, farklı günlerde WhatsApp üzerinden cinsel içerikli mesajlar gönderir. Bir gün odasında Selin'e fiziksel temasta bulunmadan açıkça cinsel ilişki teklif eder. Selin reddeder; Murat'ın davranışları sürdüğü için istifa etmek zorunda kalır. Selin, olaydan sonra Murat hakkında şikâyetçi olur. Aynı dönemde Selin'i cinsel bir amaç gütmeksizin, yalnızca sinir bozmak için sürekli arayan ve takip eden eski çalışma arkadaşı Orhan da vardır.

      1. Murat'ın sorumluluğunu tartışınız.
      2. Murat'a uygulanacak cezanın alt sınırına ve artırım nedenlerine değininiz.
      3. Orhan'ın davranışının hangi suçla ilişkilendirilebileceğini belirtiniz.
    olcut:
      - {tespit: "Fiziksel temas olmadığından, cinsel amaçlı davranışların cinsel taciz olduğu", puan: 20, madde: "TCK m. 105/1"}
      - {tespit: "Elektronik haberleşme aracının kullanılması ve aynı işyerinde çalışmanın nitelikli hâl oluşturduğu", puan: 20, madde: "TCK m. 105/2"}
      - {tespit: "Selin'in işi bırakmak zorunda kalması nedeniyle cezanın bir yıldan az olamayacağı", puan: 20, madde: "TCK m. 105/2"}
      - {tespit: "Aynı mağdura karşı değişik zamanlarda tekrarın zincirleme suç hükmünü (TCK m. 43/1) gündeme getirdiği ve TCK m. 43/3'ün bu suçu dışlamadığı", puan: 15, madde: "TCK m. 43"}
      - {tespit: "Cinsel amaç bulunmadığından Orhan'ın davranışının cinsel taciz değil ısrarlı takip kapsamında değerlendirilebileceği", puan: 15, madde: "TCK m. 123/A"}
      - {tespit: "Cinsel dokunulmazlığa karşı suçlarda ve ısrarlı takipte uzlaştırmanın mümkün olmadığı", puan: 10, madde: "CMK m. 253/3"}
    cozum: |
      **Nitelendirme:** Murat'ın davranışları vücuda temas içermeyen, cinsel amaçlı rahatsız etme hareketleridir; cinsel taciz suçuna girer. Orhan'ın davranışı ise cinsel amaç taşımadığından başka bir suç tipiyle ilişkilendirilir.

      **Hukuki sorunlar:** (1) Hangi suç oluşur? (2) Nitelikli hâller ve cezanın alt sınırı nedir? (3) Tekrarlayan fiiller nasıl cezalandırılır? (4) Orhan'ın durumu nedir?

      **İlgili hükümler:** TCK m. 105/1, bir kimseyi cinsel amaçlı olarak taciz edeni mağdurun şikâyeti üzerine 3 aydan 2 yıla kadar hapis veya adli para cezasıyla cezalandırır. TCK m. 105/2, posta veya elektronik haberleşme araçlarının ve aynı işyerinde çalışmanın kolaylığını nitelikli hâl sayar ve cezayı yarı oranında artırır; mağdur işi bırakmak zorunda kalırsa ceza bir yıldan az olamaz. TCK m. 43/1 zincirleme suçu düzenler. TCK m. 123/A ısrarlı takibi cezalandırır. CMK m. 253/3 uzlaştırmayı yasaklar.

      **Değerlendirme:** Murat, cinsel içerikli mesajlar göndermiş ve cinsel ilişki teklif etmiştir; fiziksel temas olmadığından cinsel saldırı değil cinsel taciz söz konusudur. WhatsApp mesajları elektronik haberleşme araçlarının sağladığı kolaylıktan yararlanmayı, Selin ile aynı işyerinde çalışma ise ikinci bir nitelikli hâli oluşturur. Bu nedenle TCK m. 105/2 uyarınca ceza yarı oranında artırılır. Selin istifa etmek zorunda kaldığı için sonuç cezası bir yıldan az olamaz. Mesajların farklı zamanlarda aynı mağdura gönderilmesi, tek bir suç işleme kararı kapsamında kalıyorsa TCK m. 43/1 uyarınca zincirleme suç hükmü uygulanır; TCK m. 43/3 bu suçu dışlayan listede yer almaz. Orhan'ın davranışı cinsel amaç içermediği için TCK m. 105 kapsamına girmez; ısrarlı bir şekilde takip etmek veya iletişim araçlarıyla temas kurmaya çalışmak suretiyle Selin'de ciddi huzursuzluk ya da güvenlik endişesi doğurmuşsa TCK m. 123/A gündeme gelir. Her iki suç tipinde de uzlaştırma yoluna gidilemez (CMK m. 253/3).

      **Sonuç:** Murat cinsel taciz suçundan, TCK m. 105/2 uyarınca artırılmış ve bir yıldan az olmamak üzere cezalandırılır; zincirleme suç hükmü de uygulanabilir. Orhan'ın davranışı cinsel taciz değil, koşulları varsa ısrarlı takip olarak değerlendirilir.
kartlar:
  - on: "Cinsel saldırı ile cinsel taciz arasındaki temel ayrım?"
    arka: "Cinsel saldırıda vücuda temas (vücut dokunulmazlığı ihlali) vardır; cinsel tacizde temas yoktur, cinsel amaçlı rahatsız etme söz konusudur."
  - on: "TCK m. 102/1'de temel şekil ve sarkıntılık cezaları?"
    arka: "Temel şekil 5-10 yıl hapis (şikâyete bağlı); sarkıntılık düzeyinde 2-5 yıl hapis."
  - on: "TCK m. 102/2'nin cezası?"
    arka: "Vücuda organ veya sair cisim sokulması: 12 yıldan az olmamak üzere hapis. Eşe karşı işlenirse şikâyete bağlı."
  - on: "TCK m. 102/3'ün nitelikli hâlleri?"
    arka: "Savunmasız kişi, nüfuz kötüye kullanma, hısımlık, silah veya birden fazla kişi, toplu yaşam ortamı. Ceza yarı oranında artar."
  - on: "TCK m. 102/5'in sonucu?"
    arka: "Mağdurun bitkisel hayata girmesi veya ölümü: ağırlaştırılmış müebbet hapis."
  - on: "TCK m. 102/4 neyi söyler?"
    arka: "Cebir ve şiddet kasten yaralamanın ağır sonuçlarına neden olursa ayrıca kasten yaralama hükümleri uygulanır."
  - on: "TCK m. 105/1'in cezası?"
    arka: "3 ay-2 yıl hapis veya adli para cezası; çocuğa karşı 6 ay-3 yıl hapis. Şikâyete bağlı."
  - on: "TCK m. 105/2'nin nitelikli hâlleri?"
    arka: "Kamu görevi/hizmet/aile; vasi-eğitici-bakıcı; aynı işyeri; posta veya elektronik haberleşme; teşhir. Ceza yarı oranında artar."
  - on: "Taciz nedeniyle mağdur işi bırakmışsa?"
    arka: "TCK m. 105/2 gereği verilecek ceza bir yıldan az olamaz."
  - on: "Cinsel dokunulmazlığa karşı suçlarda uzlaştırma?"
    arka: "Şikâyete bağlı olsa bile yapılamaz (CMK m. 253/3)."
  - on: "Hedefsiz alenen teşhir hangi maddede?"
    arka: "TCK m. 225 (hayasızca hareketler); belirli kişiye yönelik teşhir TCK m. 105/2-e'dir."
  - on: "Organ sokma kastı ispatlanamayan temaslı fiil nasıl nitelendirilir?"
    arka: "Şüpheden sanık yararlanır; fiil TCK m. 102/1'deki cinsel saldırı sayılabilir. Teşebbüs için kast ve elverişli icra hareketi şüpheye yer bırakmayacak biçimde kanıtlanmalıdır."
