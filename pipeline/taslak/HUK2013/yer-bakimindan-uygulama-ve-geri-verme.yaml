      - "İşkence kataloğunda olsa da yargılama için hiçbir talep aranmaz."
      - "Fail yabancı olduğu için Türk kanunu uygulanamaz."
      - "Yalnızca Türk vatandaşı mağdur olduğunda Türk kanunu uygulanır."
    dogru: 0
    aciklama: |
      İşkence (TCK m. 94 ve TCK m. 95), TCK m. 13/1-c'dedir. Talebin aranmadığı bölümler dördüncü kısım 3-7. bölümlerdir (TCK m. 13/2); işkence bunların dışında olduğundan Bakan talebi aranır. Yanılgı: tüm katalog suçlarda talep aranmadığını sanmak.
  - soru: |
      Yabancı bir casus yurt dışında Devlet sırlarına karşı casusluk fiilini işlemiş (TCK m. 328), orada beraat etmiştir. Türkiye'de ne olur?
    siklar:
      - "Adalet Bakanının talebi üzerine Türkiye'de yargılama yapılabilir (TCK m. 13/3)."
      - "Yabancı ülkede beraat ettiği için Türkiye'de kesinlikle yargılanamaz."
      - "Yabancı olduğu için yalnızca TCK m. 12/3 ile yargılanabilir."
      - "Yargılama için Adalet Bakanının talebi değil, mağdurun şikâyeti gerekir."
    dogru: 0
    aciklama: |
      TCK m. 13/1-b'deki suçlarda yabancı ülkede mahkûmiyet ya da beraat kararı verilmiş olsa bile Adalet Bakanının talebiyle Türkiye'de yargılama yapılır (TCK m. 13/3). Katalog suçta TCK m. 12'nin eşikleri aranmaz.
  - soru: |
      TCK m. 14 hangi hâllerde uygulanır?
    siklar:
      - "TCK m. 11 ve TCK m. 12 hâllerinde, hapis ile adli para cezasından birinin seçimlik olduğu suçlarda soruşturma açılmaz."
      - "TCK m. 8 hâllerinde, seçimlik cezası olan tüm suçlarda soruşturma açılmaz."
      - "TCK m. 13'teki katalog suçların tamamında soruşturma açılmaz."
      - "Yalnız yabancı hüküm bulunan hâllerde soruşturma açılmaz."
    dogru: 0
    aciklama: |
      TCK m. 14 metni yalnızca TCK m. 11 ve TCK m. 12 hâllerini sayar; TCK m. 8, TCK m. 9, TCK m. 10 ve TCK m. 13 hâllerinde uygulanmaz.
  - soru: |
      Bir yabancı devlet, kesinleşmiş hükümle 3 ay hapse mahkûm ettiği kişinin Türkiye'den iadesini istemektedir (tek suç). 6706 sayılı Kanun m. 10 bakımından hangisi doğrudur?
    siklar:
      - "Kesinleşmiş mahkûmiyette en az dört ay hürriyeti bağlayıcı ceza aranır; üç ay yeterli değildir."
      - "Kesinleşmiş mahkûmiyette en az bir yıl hapis aranır."
      - "Eşik aranmaz; mahkûmiyet yeterlidir."
      - "Aşağı sınırı bir yıl olan suç aranır."
    dogru: 0
    aciklama: |
      6706 sayılı Kanun m. 10/2: kesinleşmiş mahkûmiyette hükmolunan ceza en az dört ay hürriyeti bağlayıcı olmalıdır. Soruşturma ve kovuşturma aşamasında ise üst sınırı bir yıl veya daha fazla ceza aranır. "Aşağı sınır" TCK m. 11-12'nin ölçüsüdür.
  - soru: |
      Yabancı bir ülke, 17 yaşındaki bir yabancının iadesini istemektedir. Kişi on yıldır Türkiye'de yaşamakta ve evlidir. 6706 sayılı Kanun m. 11 bakımından hangisi doğrudur?
    siklar:
      - "Bu durumlar kendiliğinden ret sebebi değildir; iade kişiyi ya da ailesini fiilin ağırlığı ile orantısız mağdur edecekse kabul edilmeyebilir."
      - "On sekiz yaşından küçük olduğu için iade kesinlikle kabul edilmez."
      - "Evli olması iadeyi kesinlikle engeller."
      - "Türkiye'de uzun süredir bulunduğu için iade zorunlu olarak reddedilir."
    dogru: 0
    aciklama: |
      6706 sayılı Kanun m. 11/4 takdirî redde ilişkindir: kişisel hâller kendiliğinden ret sebebi değildir, orantısızlık değerlendirmesi gerekir. Zorunlu ret sebepleri 6706 sayılı Kanun m. 11/1'de sayılmıştır (vatandaşlık, siyasî suç vb.).
olaylar:
  - olay: |
      Türk vatandaşı Ali, 2025 yılında Berlin'de üç fiil işler: (a) bir dükkândan telefon çalar; (b) komşusu Hans'ı "seni öldürürüm" diye tehdit eder (TCK m. 106/1, ilk cümle); (c) ev sahibi Ahmet'i "eşyalarını yakarım" diye malvarlığına yönelik tehdit eder (TCK m. 106/1, son cümle; iki aydan altı aya kadar hapis veya adli para cezası). Almanya'da hakkında hüküm verilmeden Ali Türkiye'ye döner ve 10 Mart 2026'da İstanbul'a girer. Savcılık Ali hakkında soruşturma yapmak ister. Bu arada Almanya, Ali'nin iadesini talep eder.
      1. (a), (b) ve (c) fiilleri bakımından Türk kanunlarının uygulanması hangi hükümlere göre ve hangi şartlarla mümkündür?
      2. Almanya'nın iade talebi kabul edilebilir mi?
      3. Ali Almanya'da hırsızlıktan mahkûm edilip dönmüş olsaydı (a) fiili bakımından sonuç ne olurdu?
    olcut:
      - {tespit: "Fiillerin yabancı ülkede işlendiği, Ali'nin vatandaş olduğu ve TCK m. 11'in uygulanacağının belirlenmesi", puan: 15, madde: "TCK m. 11"}
      - {tespit: "Hırsızlıkta aşağı sınırın bir yıl olması nedeniyle TCK m. 11/1'in uygulanması; Bakan istemi ve şikâyetin aranmaması", puan: 20, madde: "TCK m. 11"}
      - {tespit: "Hans'a tehditte aşağı sınırın altı ay olması nedeniyle şikâyet şartı ve sürenin Türkiye'ye giriş tarihinden itibaren altı ay olması", puan: 20, madde: "TCK m. 11"}
      - {tespit: "Malvarlığı tehdidinde hapis ile adli para cezasının seçimlik olması nedeniyle soruşturma açılamaması", puan: 15, madde: "TCK m. 14"}
      - {tespit: "Türk vatandaşının iade edilememesi", puan: 20, madde: "AY m. 38"}
      - {tespit: "Almanya'da hüküm verilmişse TCK m. 11/1'deki hüküm verilmemiş olma şartının gerçekleşmemesi", puan: 10, madde: "TCK m. 11"}
    cozum: |
      **Nitelendirme:** Üç fiil de Türkiye dışında (Almanya'da) işlenmiş, failin ise fiil sırasında Türk vatandaşı olduğu anlaşılmaktadır. Suç Türkiye'de işlenmiş sayılmadığından (TCK m. 8) vatandaşın yabancı ülkede işlediği suçlara ilişkin TCK m. 11 değerlendirilir; fiiller TCK m. 13 kataloğunda değildir. Vatandaşlık, fiilin işlendiği ana göre belirlenir (TCK m. 6/1-a).

      **Hukuki sorunlar:** (1) TCK m. 11/1'in şartları; (2) şikâyetin gerekip gerekmediği ve süresi; (3) seçimlik cezalarda TCK m. 14; (4) iade yasağı.

      **Değerlendirme:** (a) Hırsızlığın aşağı sınırı bir yıldır (TCK m. 141/1). TCK m. 11/1'in şartlarının tamamı vardır: vatandaş, katalog dışı, aşağı sınırı bir yıldan az olmayan suç, fail Türkiye'de, yabancı ülkede hüküm yok. Adalet Bakanı istemi aranmaz; metinde şikâyet şartı da yoktur. (b) "Seni öldürürüm" tehdidinin aşağı sınırı altı aydır (TCK m. 106/1). Aşağı sınır bir yıldan az olduğu için TCK m. 11/2 gereği yargılama Hans'ın veya Alman hükûmetinin şikâyetine bağlıdır; şikâyet Ali'nin Türkiye'ye girdiği 10 Mart 2026'dan itibaren altı ay içinde yapılmalıdır. (c) Malvarlığına yönelik tehditte hapis ve adli para cezasından biri seçimliktir; TCK m. 14 gereği TCK m. 11 hâlinde soruşturma veya kovuşturma açılmaz.

      İade bakımından AY m. 38 son fıkrası ve 6706 sayılı Kanun m. 11/1-a uyarınca Türk vatandaşı suç sebebiyle yabancı bir ülkeye verilemez (Uluslararası Ceza Divanı yükümlülükleri hariç, olayda böyle bir durum yoktur). Almanya'nın talebi kabul edilmez; Ali'nin Türkiye'de yargılanması TCK m. 11 yoluyla yapılır.

      Ali Almanya'da hırsızlıktan mahkûm olup dönseydi, TCK m. 11/1'deki "yabancı ülkede hüküm verilmemiş olması" şartı gerçekleşmediğinden Türkiye'de TCK m. 11 yoluyla yargılanamazdı.

      **Sonuç:** (a) Türk kanunlarıyla yargılanır, istem ve şikâyet aranmaz; (b) şikâyet üzerine, 10 Mart 2026'dan itibaren altı ay içinde yargılanır; (c) soruşturma açılmaz; Almanya'nın iade talebi kabul edilmez; Almanya'da hüküm verilmişse (a) fiili bakımından da TCK m. 11 uygulanamaz.
  - olay: |
      Yunan vatandaşı Nikos İstanbul'da Mehmet'i kasten yaralar (TCK m. 86/1) ve Atina'ya kaçar. Yunanistan'da yargılanır, mahkûm olur ve 8 ay cezaevinde kalır. Nikos daha sonra Türkiye'ye gelmek üzere bir Türk yolcu gemisine biner; gemi açık denizdeyken başka bir yolcunun cüzdanını çalar (TCK m. 141/1). Türkiye'ye çıkışında yakalanır. Yunanistan ise Nikos'un yaralama fiili nedeniyle kendisine iadesini ister.
      1. Nikos'un yaralama fiili bakımından Türk kanunları uygulanır mı, Yunanistan'daki mahkûmiyetin etkisi nedir?
      2. Yunanistan'da geçirilen sürenin sonucu nedir?
      3. Gemideki hırsızlık fiiline hangi hüküm uygulanır?
      4. Yunanistan'ın iade talebi kabul edilir mi?
    olcut:
      - {tespit: "Yaralamanın İstanbul'da işlenmesi nedeniyle suçun Türkiye'de işlenmiş sayılması ve Türk kanunlarının uygulanması", puan: 20, madde: "TCK m. 8"}
      - {tespit: "Yabancı hükme rağmen Türkiye'de yeniden yargılama yapılması; Bakan istemi aranmaması", puan: 20, madde: "TCK m. 9"}
      - {tespit: "Yunanistan'da cezaevinde geçen 8 ayın Türkiye'de verilecek cezadan mahsup edilmesi", puan: 15, madde: "TCK m. 16"}
      - {tespit: "Açık denizde Türk deniz aracında işlenen hırsızlığın Türkiye'de işlenmiş sayılması; TCK m. 12 ve m. 19 şartlarının aranmaması", puan: 20, madde: "TCK m. 8"}
      - {tespit: "Fiilin Türkiye'nin yargılama yetkisine girmesi nedeniyle iade talebinin kabul edilmemesi", puan: 25, madde: "6706 sayılı Kanun m. 11"}
    cozum: |
      **Nitelendirme:** Olayda iki ayrı fiil vardır: İstanbul'daki yaralama ve gemideki hırsızlık. Her ikisi de Türkiye'de işlenmiş sayıldığından Nikos'un yabancı olması sonucu değiştirmez; asıl sorun yabancı hüküm ve iadedir.

      **Hukuki sorunlar:** (1) Suçun yeri; (2) yabancı hükmün etkisi; (3) yabancı ülkedeki sürenin hesabı; (4) gemideki suçun yeri; (5) iade talebinin ret sebepleri.

      **İlgili hükümler:** TCK m. 8/1, TCK m. 8/2-b, TCK m. 9, TCK m. 16; 6706 sayılı Kanun m. 11/1-c.

      **Değerlendirme:** Yaralama İstanbul'da işlendiğinden TCK m. 8/1 gereği suç Türkiye'de işlenmiştir ve Türk kanunları uygulanır. TCK m. 9'a göre Türkiye'de işlediği suçtan yabancı ülkede hakkında hüküm verilmiş olan kişi Türkiye'de yeniden yargılanır; Adalet Bakanı istemi ya da şikâyet gerekmez. Yunan mahkûmiyeti Türk yargılamasını engellemez, ancak Yunanistan'da cezaevinde geçen sekiz ay, aynı suçtan Türkiye'de verilecek cezadan mahsup edilir (TCK m. 16). Bu çözüm "aynı fiilden iki kez yargılama olmaz" düşüncesine değil, TCK m. 9'un açık hükmüne dayanır.

      Açık denizde Türk yolcu gemisinde işlenen hırsızlık, Türk deniz aracında açık denizde işlendiği için Türkiye'de işlenmiş sayılır (TCK m. 8/2-b). Bu nedenle bu fiil bakımından TCK m. 11-12 şartları ve TCK m. 19'daki suç yeri sınırlaması aranmaz.

      İade bakımından: yaralama Türkiye'nin yargılama yetkisine giren bir suçtur ve Türkiye'de yargılanacaktır; 6706 sayılı Kanun m. 11/1-c uyarınca talep kabul edilmez. Ayrıca Türkiye'de bu fiil nedeniyle hüküm verilmişse aynı fiilden daha önce Türkiye'de beraat veya mahkûmiyet kararı verilmesi ret sebebidir (6706 sayılı Kanun m. 11/1-ç).

      **Sonuç:** Nikos her iki fiilden Türk kanunlarına göre Türkiye'de yargılanır; Yunanistan'da geçen süre mahsup edilir; iade talebi kabul edilmez.
kartlar:
  - on: "Suç hangi hâllerde Türkiye'de işlenmiş sayılır (TCK m. 8/1)?"
    arka: "Fiil kısmen veya tamamen Türkiye'de işlenmişse ya da netice Türkiye'de gerçekleşmişse."
  - on: "TCK m. 8/2-b ile TCK m. 8/2-c farkı nedir?"
    arka: "(b) sivil Türk deniz ve hava araçları için yalnız açık deniz ve üstündeki hava sahasını kapsar; (c) Türk savaş araçlarında yer sınırı yoktur."
  - on: "TCK m. 9 non bis in idem midir?"
    arka: "Hayır. Türkiye'de işlenen suçtan yabancı ülkede hüküm verilmiş olsa da kişi Türkiye'de yeniden yargılanır; Bakan istemi aranmaz. Denge TCK m. 16 mahsubuyla kurulur."
  - on: "TCK m. 10 hangi suçlara ilişkindir?"
    arka: "Yabancı ülkede Türkiye namına memuriyet veya görev üstlenen kimsenin bundan dolayı işlediği suçlara; orada mahkûm olsa bile Türkiye'de yeniden yargılanır."
  - on: "TCK m. 11/1 şartları nelerdir?"
    arka: "Vatandaş, TCK m. 13 dışı suç, aşağı sınırı bir yıldan az olmayan hapis, yabancı ülkede işlenmiş, fail Türkiye'de, yabancı hüküm yok ve kovuşturulabilirlik var."
  - on: "TCK m. 11/2'deki şikâyet süresi ve başlangıcı?"
    arka: "Aşağı sınırı bir yıldan az suçlarda zarar görenin ya da yabancı hükûmetin şikâyeti gerekir; süre vatandaşın Türkiye'ye girdiği tarihten itibaren altı aydır."
  - on: "TCK m. 12'nin üç fıkrasını karşılaştır."
    arka: "12/1 Türkiye'nin zararına, Bakan istemi. 12/2 Türk vatandaşı ya da Türk özel hukuk tüzel kişisi zararına, zarar görenin şikâyeti. 12/3 yabancı mağdur, aşağı sınır üç yıl, Bakan istemi, geri verme koşulu."
  - on: "TCK m. 13/2 talebi nerede aramaz?"
    arka: "İkinci kitap dördüncü kısım 3-7. bölümlerde (Devletin egemenlik alametlerinden Devlet sırlarına kadar). Diğer katalog suçlarda Bakan talebi aranır."
  - on: "TCK m. 13/3 ne söyler?"
    arka: "(a) ve (b) bentlerindeki suçlarda yabancı ülkede mahkûmiyet ya da beraat verilmiş olsa bile Bakan talebiyle Türkiye'de yargılama yapılır."
  - on: "TCK m. 14 hangi maddeler için geçerli?"
    arka: "Yalnız TCK m. 11 ve TCK m. 12: hapis ile adli para cezasından biri seçimlikse soruşturma veya kovuşturma açılmaz."
  - on: "TCK m. 16 ile TCK m. 19 farkı?"
    arka: "TCK m. 16 yabancı ülkedeki gözaltı, gözlem, tutukluluk ve hükümlülük süresini mahsup eder. TCK m. 19 Türk cezasını suç yeri kanunundaki üst sınırla sınırlar; Türkiye'nin güvenliğine karşı ve Türk vatandaşı zararına suçlarda uygulanmaz."
  - on: "Geri verme kuralı bugün nerede?"
    arka: "2016'da 6706 sayılı Kanun m. 36 ile TCK m. 18 kaldırıldı; şartlar 6706 sayılı Kanun m. 10, ret sebepleri 6706 sayılı Kanun m. 11'dedir."
  - on: "İade için ceza eşikleri neler (6706 sayılı Kanun m. 10)?"
    arka: "Soruşturma ve kovuşturmada üst sınırı bir yıl veya daha fazla hürriyeti bağlayıcı ceza; kesinleşmiş hükümde en az dört ay. Eşik iki devlet hukukuna göre aranır."
  - on: "Türk vatandaşı iade edilir mi, iade kararını kim yerine getirir?"
    arka: "Hayır; Uluslararası Ceza Divanı yükümlülükleri hariç (AY m. 38, 6706 sayılı Kanun m. 11/1-a). Kabul edilebilirlik kararı yetmez, yerine getirme Adalet Bakanının teklifi ve Cumhurbaşkanının onayına bağlıdır (6706 sayılı Kanun m. 19/1)."
