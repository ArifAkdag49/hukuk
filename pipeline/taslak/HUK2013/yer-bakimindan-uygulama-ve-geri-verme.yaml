      - "Suç Türkiye'de işlenmiş sayılır ve Türk kanunları uygulanır (TCK m. 8/2-b)."
      - "Suç yabancı ülkede işlenmiş sayıldığından yalnız TCK m. 11 ve TCK m. 12 şartları varsa Türk kanunları uygulanır."
      - "Uçak Türkiye'ye inene kadar Türk kanunları uygulanamaz."
