    tanim: "Fail yararına cezayı hafifletecek takdiri nedenler varsa uygulanan, altıda birine kadar indirim (TCK m. 62)."
  - terim: Tekerrür
    tanim: "Kesinleşmiş bir hükümden sonra yeni suç işlenmesi; 5237 sayılı TCK'da cezayı artırmaz, infaz rejimini ağırlaştırır (TCK m. 58)."
  - terim: Mükerrirlere özgü infaz rejimi
