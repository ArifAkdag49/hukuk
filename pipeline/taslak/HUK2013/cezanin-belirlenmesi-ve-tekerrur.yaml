    tanim: "Hapiste günü, adli para cezasında lirayı aşan kesir; hesaba katılmaz ve infaz edilmez (TCK m. 61/6)."
kararlar:
  - id: "76361300"
    ozet: |
      Mersin'de parkta çiçek satan sanıkta kolluk kontrolünde vazonun içinde, kurusıkıdan dönüştürülmüş, basit müdahaleyle ateşlenebilir hâle gelebilecek tek bir tabanca bulundu. Sanığın adli sicilinde 2004'te infaz edilmiş bir hırsızlık para cezası vardı. Asliye ceza mahkemesi, temel cezayı alt sınırdan uzaklaşarak belirledi; gerekçesi "çok sayıda sabıkalı olmasına rağmen suç işlemekteki kararlı tutumu, olaydan önceki ve sonraki davranışları" idi. Daire orantılılık gözetilmeden ve somut gerekçe gösterilmeden ceza belirlendiği için bozdu; mahkeme direndi. Ceza Genel Kurulu oyçokluğuyla direnme hükmünü bozdu. İlke: Alt sınırdan uzaklaşma TCK m. 61/1 ölçütlerine dayanan, dosyaya uygun ve yeterli gerekçe ister ve TCK m. 3/1'deki orantılılıkla bağdaşmalıdır. Adli sicildeki geçmiş mahkûmiyetler bu ölçütler arasında olmadığından alt sınırdan uzaklaşma gerekçesi yapılamaz; şartları varsa tekerrürde dikkate alınır. Tek silah ele geçtiği ve kullanılışı bakımından özellik göstermediği olayda temel ceza alt sınırdan belirlenir. Yedi üye direnmenin isabetli olduğu görüşüyle karşı oy kullandı.
  - id: "1230601600"
    ozet: |
      Sanık, mağdurenin teyzesinin eşiydi ve olay tarihinde 38 yaşındaydı; 7 yaşındaki mağdureye zincirleme sarkıntılık suretiyle basit cinsel istismarda bulunmuştu. Bölge adliye mahkemesi mahkûmiyet verdi; TCK m. 62'yi "sanığın nedamet duymaması ve lehine uygulanabilecek takdiri bir indirim nedeni bulunmaması" gerekçesiyle uygulamadı. Yargıtay Dairesi, adli sicil kaydı olmayan sanıkta soyut ve yetersiz gerekçeyle TCK m. 62'nin uygulanmamasını bozdu; bölge adliye mahkemesi direndi. Ceza Genel Kurulu direnme gerekçesini isabetli buldu ve hükmü onadı; ilk müzakerede çoğunluk sağlanamamış, ikinci müzakerede oyçokluğuyla karar verilmiştir. Genel Kurul, 7406 sayılı Kanunla eklenen cümleyi aktardı; takdirin yargılama hâkimine ait olduğunu, açık hukuka aykırılık veya keyfîlik yoksa müdahale edilmeyeceğini, gerekçenin soyut olmayıp somut olaya özgülenmesi gerektiğini belirtti. "Pişmanlık göstermeme" gerekçesini TCK m. 62/2'de karşılığı bulunduğu için yeterli saydı. Dört üye karşı oy kullandı.
  - id: "905302600"
    ozet: |
      Sanık 18.4.2012'de katılanın üzerinden 3.700 TL çekip aldı; nitelikli hırsızlıktan 6 yıl hapis aldı ve hakkında ikinci kez tekerrür hükümleri uygulandı. Birinci tekerrüre esas ilam, 2007'de işlenen hırsızlık teşebbüsüydü; o ilamda tekerrüre esas alınan daha eski mahkûmiyet ise 765 sayılı TCK döneminde, 15.1.2002'de işlenmiş hırsızlıktan 2 ay 20 gün hapisti (2005'te kesinleşmiş, 2006'da infaz edilmişti). Yargıtay Cumhuriyet Başsavcılığı, ikinci kez tekerrür için her iki suçun da 8.7.2005'ten sonra işlenmesi gerektiğini ileri sürerek itiraz etti. Ceza Genel Kurulu itirazı oybirliğiyle reddetti. İlke: 5237 sayılı TCK'da tekerrür, 765 sayılı TCK'daki gibi cezayı artırma nedeni değil, koşullu salıverilmeyi etkileyen bir infaz rejimidir. Mükerrir sayılmak için önceki hükmün kesinleşmesinden sonra yeni suçun işlenmesi yeterlidir; ilk suçun 1 Haziran 2005'ten önce veya sonra işlenmesinin önemi yoktur. Dikkat: Kararın aktardığı "ikinci defa tekerrürde koşullu salıverilmez" kuralı 7550 sayılı Kanunla 2025'te değişmiştir; bu kısım güncel hukuk değildir.
sorular:
  - soru: |
      Aşağıdakilerden hangisi TCK m. 61/1'de sayılan temel ceza ölçütlerinden biridir?
    siklar:
      - "Failin adli sicil kaydındaki geçmiş mahkûmiyetleri"
      - "Suçun işlendiği zaman ve yer"
      - "Failin ekonomik durumu"
      - "Failin duruşmadaki tutumu"
    dogru: 1
    aciklama: |
      TCK m. 61/1 yedi ölçüt sayar: işleniş biçimi, araçlar, zaman ve yer, konunun önem ve değeri, zarar veya tehlikenin ağırlığı, kast veya taksire dayalı kusurun ağırlığı, amaç ve saik. Geçmiş mahkûmiyet, ekonomik durum ve duruşmadaki tutum bu ölçütler arasında yoktur.
  - soru: |
      TCK m. 61/5'e göre sonuç cezanın belirlenmesinde aşağıdaki nedenlerden hangisi **en son** uygulanır?
    siklar:
      - "Haksız tahrik"
      - "Teşebbüs"
      - "Yaş küçüklüğü"
      - "Takdiri indirim"
    dogru: 3
    aciklama: |
      TCK m. 61/5'e göre sıra teşebbüs, iştirak, zincirleme suç, haksız tahrik, yaş küçüklüğü, akıl hastalığı, şahsi indirim sebepleri ve en sonda takdiri indirim nedenleridir. Takdiri indirim hep son halkadır.
  - soru: |
      TCK m. 62/1'e göre takdiri indirim nedeni varsa müebbet hapis cezası yerine ne verilir?
    siklar:
      - "Yirmi yıl hapis"
      - "Yirmibeş yıl hapis"
      - "Otuz yıl hapis"
      - "Altıda biri oranında indirilmiş müebbet"
    dogru: 1
    aciklama: |
      TCK m. 62/1: ağırlaştırılmış müebbet yerine müebbet, müebbet yerine yirmibeş yıl hapis verilir; diğer cezaların altıda birine kadarı indirilir. Yirmi yıl, olası kastta müebbet gerektiren suç için TCK m. 21/2'deki yirmi-yirmibeş yıl aralığının alt sınırıdır; takdiri indirimle karıştırılmamalı.
  - soru: |
      Ali'nin işlediği hırsızlığa teşebbüs suçunda mahkeme temel cezayı 6 yıl hapis olarak belirliyor, teşebbüs nedeniyle dörtte bir oranında indirim yapıyor ve ayrıca altıda bir takdiri indirim uyguluyor. İndirimlerin TCK m. 61/5'teki sırayla ve ay 30 gün sayılarak uygulandığı kabul edilirse sonuç ceza nedir?
    siklar:
      - "3 yıl 6 ay"
      - "3 yıl 9 ay"
      - "4 yıl 6 ay"
      - "4 yıl 3 ay"
    dogru: 1
    aciklama: |
      6 yıl = 72 ay. Önce teşebbüs: 72 x 3/4 = 54 ay. Sonra takdiri indirim: 54 x 5/6 = 45 ay = 3 yıl 9 ay. Oranları toplayıp (1/4 + 1/6) tek indirim yapmak 3 yıl 6 ay verir ve yanlıştır; her indirim bir önceki adımın sonucu üzerinden yapılır (TCK m. 61/5).
  - soru: |
      Hasan, 2015'te işlediği suçtan 7 yıl hapis cezası aldı; hüküm kesinleşti ve ceza 1.1.2018'de tamamen infaz edildi. Hasan 1.6.2022'de kasıtlı yeni bir suç işlerse TCK m. 58'e göre durum nedir?
    siklar:
      - "Tekerrür hükümleri uygulanmaz, çünkü 3 yıl geçmiştir"
      - "Tekerrür hükümleri uygulanır, çünkü 5 yıllık süre dolmamıştır"
      - "Tekerrür hükümleri uygulanmaz, çünkü ceza zaten infaz edilmiştir"
      - "Tekerrür hükümleri uygulanır, çünkü süre kesinleşmeden başlar"
    dogru: 1
    aciklama: |
      Önceki ceza 5 yıldan fazla hapistir; bu durumda süre cezanın infaz edildiği tarihten itibaren 5 yıldır (TCK m. 58/2-a). 1.1.2018 + 5 yıl = 1.1.2023; yeni suç bundan önce işlendiği için tekerrür uygulanır. Cezanın infaz edilmiş olması tekerrürü engellemez (TCK m. 58/1); 3 yıllık süre 5 yıl veya daha az hapis ve adli para içindir.
  - soru: |
      Aşağıdaki suçlardan hangisi bakımından yabancı ülke mahkemesinden verilmiş kesin hüküm tekerrüre esas olabilir?
    siklar:
      - "Hırsızlık"
      - "Dolandırıcılık"
      - "Hakaret"
      - "Güveni kötüye kullanma"
    dogru: 1
    aciklama: |
      TCK m. 58/4: yabancı ülke mahkemelerinden verilen hükümler, kasten öldürme, kasten yaralama, yağma, dolandırıcılık, uyuşturucu veya uyarıcı madde imal ve ticareti ile parada veya kıymetli damgada sahtecilik suçları hariç tekerrüre esas olmaz. Hırsızlık bu listede yoktur.
  - soru: |
      Mükerrir Zeynep için, kanunda seçimlik olarak hapis veya adli para cezası öngörülen bir suçta hâkim hapse hükmetmiştir. Bu hapis cezası bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Adli para cezasına çevrilebilir, çünkü seçimlik ceza vardır"
      - "Adli para cezasına çevrilemez"
      - "Yalnız ertelenebilir, çevrilemez ve infaz edilemez"
      - "Mükerrir olduğu için ceza bir kat artırılır"
    dogru: 1
    aciklama: |
      Tekerrür hâlinde seçimlik cezalı suçta hapis cezasına hükmolunur (TCK m. 58/3); suç tanımında seçenek olarak öngörülen hapse hükmedilmişse bu ceza artık adli para cezasına çevrilmez (TCK m. 50/2). Tekerrür cezayı artırmaz, infaz rejimini etkiler. Hapsin ertelenebilmesi ayrı şartlara bağlıdır (TCK m. 51/1).
  - soru: |
      5275 sayılı Kanun m. 108/3'ün 7550 sayılı Kanunla (2025) değişen hâline göre, ikinci defa tekerrür hükümleri uygulanan hükümlünün süreli hapis cezasında koşullu salıverilme bakımından durum nedir?
    siklar:
      - "Koşullu salıverilmez"
      - "Koşullu salıverilme oranı üçte ikidir"
      - "Koşullu salıverilme oranı dörtte üçtür"
      - "Koşullu salıverilme oranı yarıdır"
    dogru: 2
    aciklama: |
      5275 sayılı Kanun m. 108/3'e göre ikinci defa tekerrürde birinci fıkradaki koşullu salıverilme süreleri uygulanır; ancak süreli hapis cezalarında oran dörtte üçtür. "Koşullu salıverilmez" eski kuraldır. Üçte iki, birinci tekerrürde süreli hapis için geçerli orandır (5275 sayılı Kanun m. 108/1-d).
  - soru: |
      Ayşe'ye 12.000 TL adli para cezası verilmiştir. Ayşe, bu suç nedeniyle hüküm kesinleşmeden önce 20 gün tutuklu kalmıştır. TCK m. 63'ün güncel metnine göre mahsup sonrası ödenecek miktar nedir?
    siklar:
      - "10.000 TL"
      - "2.000 TL"
      - "0 TL, ceza tamamen karşılanır"
      - "4.000 TL"
    dogru: 1
    aciklama: |
      TCK m. 63'te adli para cezasında bir gün 500 TL sayılır (7499 sayılı Kanunla 100 TL'den çıkarıldı). 20 x 500 = 10.000 TL mahsup edilir; 12.000 - 10.000 = 2.000 TL kalır. 10.000 TL, eski 100 TL rakamıyla yapılan hesabın sonucudur (20 x 100 = 2.000 mahsup, geriye 10.000).
  - soru: |
      Mahkeme, Mehmet'in silah bulundurma suçunda temel cezayı alt sınırın üzerinde belirlerken hükümde yalnız "sanığın sabıkalı olması" gerekçesini göstermiştir. Bu uygulama bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Doğrudur, çünkü TCK m. 61/1 sayılan ölçütlerle sınırlı değildir"
      - "Doğrudur, çünkü sabıka tekerrür gibi cezayı artırır"
      - "Hatalıdır, çünkü geçmiş mahkûmiyet TCK m. 61/1 ölçütleri arasında olmadığından alt sınırdan uzaklaşma gerekçesi yapılamaz"
      - "Hatalıdır, çünkü sabıkalı sanığa her durumda takdiri indirim uygulanması gerekir"
    dogru: 2
    aciklama: |
      Ceza Genel Kurulu'na göre adli sicildeki geçmiş mahkûmiyetler, şartları varsa tekerrürde dikkate alınır; TCK m. 61/1 ölçütleri arasında olmadığından temel cezayı alt sınırdan uzaklaştırma gerekçesi yapılamaz ve bu gerekçe TCK m. 3/1'deki orantılılıkla da bağdaşmaz. Tekerrür ise cezayı artırmaz, infaz rejimini etkiler. Sabıkalı sanığa takdiri indirim zorunlu değildir.
  - soru: |
      Süreli hapis gerektiren bir suçta, TCK m. 61 hükümlerine göre yapılan artırımlar sonucunda hesaplanan ceza 34 yıl çıkmaktadır. Mahkeme sonuç cezayı nasıl belirler?
    siklar:
      - "34 yıl hapis"
      - "Ağırlaştırılmış müebbet hapis"
      - "30 yıl hapis"
      - "32 yıl hapis"
    dogru: 2
    aciklama: |
      Süreli hapis cezasını gerektiren bir suçtan dolayı TCK m. 61 hükümlerine göre belirlenen sonuç ceza otuz yıldan fazla olamaz (TCK m. 61/7). Bu yüzden hesaplanan 34 yıl 30 yıla iner. Süreli hapis yerine müebbet vermek TCK m. 61/10'a aykırıdır (kanunda açıkça yazılmadıkça ceza değiştirilemez).
  - soru: |
      Sanık Ali'nin duruşmadaki tutumu ve savunmasının TCK m. 62 bakımından değerlendirilmesinde, 7406 sayılı Kanunla eklenen cümleye göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Mahkemeyi etkilemeye yönelik şeklî tutum ve davranışlar takdiri indirim nedeni olarak dikkate alınmaz"
      - "Duruşmadaki her türlü saygılı davranış zorunlu indirim sebebidir"
      - "Takdiri indirim nedenleri kararda gösterilmek zorunda değildir"
      - "Yargılama sürecindeki her davranış, pişmanlık göstermese de indirim nedenidir"
    dogru: 0
    aciklama: |
      TCK m. 62/2'ye 7406 sayılı Kanunla eklenen cümle, failin duruşmadaki mahkemeyi etkilemeye yönelik şeklî tutum ve davranışlarının takdiri indirim nedeni olarak dikkate alınmayacağını söyler. Metin ayrıca yargılama sürecindeki "pişmanlığını gösteren" davranışları arar ve nedenlerin kararda gerekçeleriyle gösterilmesini ister.
olaylar:
  - olay: |
      Ali, tartıştığı Mehmet'i bıçakla bacağından yaralar. Yaralanma basit tıbbi müdahaleyle giderilemeyecek niteliktedir; bıçağın kullanılması dışında başka nitelikli hâl yoktur. Mahkeme, suçun işleniş biçimini gerekçe göstererek temel cezayı 2 yıl hapis olarak belirler. Mehmet'in Ali'ye yönelik haksız fiilini kabul ederek haksız tahrik indirimi uygular (dörtte bir oranında). Ali, duruşmada Mehmet'in tedavi masraflarını ödemiş ve bunu belgelemiştir; mahkeme bunu pişmanlığını gösteren davranış sayarak takdiri indirim uygular (altıda bir oranında, tam oranda).

      Mahkeme ayrıca, Ali'nin geçmişte bir hırsızlıktan mahkûm olmasını da gerekçe göstererek temel cezayı alt sınırdan uzaklaştırdığını kararda yazmıştır; yani 2 yıllık temel ceza kısmen bu gerekçeye dayanmaktadır.

      1. Ali'nin cezasının hesabını TCK m. 61 kurallarına göre yapınız.
      2. Mahkemenin temel cezada yaptığı gerekçeyi değerlendiriniz.
      3. Sonuç cezanın ertelenip ertelenemeyeceğine ilişkin hangi sınır göz önüne alınır?
    olcut:
      - {tespit: "Temel ceza TCK m. 86/1 aralığı (1 yıl 6 ay - 3 yıl) içinde, TCK m. 61/1 ölçütüne (işleniş biçimi) dayalı belirlenmiştir", puan: 15, madde: "TCK m. 61/1"}
      - {tespit: "Bıçak silah deyimine girer (TCK m. 6/1-f); silahla işlenmesi nedeniyle ceza yarı oranında artırılır (2 yıl -> 3 yıl) ve önce nitelikli hâl uygulanır", puan: 20, madde: "TCK m. 86/3"}
      - {tespit: "Haksız tahrik indirimi TCK m. 61/5 sırasında takdiri indirimden önce uygulanır: 36 ay -> 27 ay", puan: 20, madde: "TCK m. 61/5"}
      - {tespit: "Takdiri indirim sırada sonda, altıda bire kadar: 27 ay x 5/6 = 22,5 ay = 1 yıl 10 ay 15 gün (ay 30 gün)", puan: 20, madde: "TCK m. 62/1"}
      - {tespit: "Geçmiş mahkûmiyet TCK m. 61/1 ölçütü olmadığından alt sınırdan uzaklaşma gerekçesi yapılamaz; gerekçe orantılılıkla bağdaşmaz", puan: 15, madde: "TCK m. 3/1"}
      - {tespit: "Sonuç ceza iki yılı aşmadığından erteleme sınırı (TCK m. 51/1) ve HAGB sınırı içindedir; diğer şartlar ayrıca incelenir", puan: 10, madde: "TCK m. 51/1"}
    cozum: |
      **Nitelendirme:** Olay, kasten yaralama suçunda (TCK m. 86/1) cezanın belirlenmesine ilişkindir. Önce temel ceza, sonra nitelikli hâl, haksız tahrik ve takdiri indirim hesabı yapılacak; mahkemenin gerekçesi de denetlenecektir.

      **Hukuki sorunlar:** (1) Cezanın hesap sırası. (2) Geçmiş mahkûmiyetin temel cezada gerekçe olup olamayacağı. (3) Sonuç cezanın seçenek kurumların sınırında kalıp kalmadığı.

      **İlgili hükümler:** Temel ceza TCK m. 61/1 ölçütleriyle kanundaki aralıkta belirlenir. TCK m. 86/3-e uyarınca silahla yaralamada ceza yarı oranında artırılır; TCK m. 6/1-f uyarınca silah deyimi kesici, delici veya bereleyici aletleri de kapsar. TCK m. 61/4 ve TCK m. 61/5 sırası ve TCK m. 29 ile TCK m. 62 oranları hesapta kullanılır.

      **Değerlendirme:** Temel ceza TCK m. 86/1'in alt sınırı (1 yıl 6 ay) ile üst sınırı (3 yıl) arasında olduğu için biçimsel olarak uygundur; işleniş biçimine dayanması da TCK m. 61/1-a'ya uygundur. Bıçakla işlenme nitelikli hâldir: 2 yıl yarı oranında artırılır ve 3 yıl (36 ay) olur. Haksız tahrikte dörtte bir indirim yapılır: 36 x 3/4 = 27 ay. Takdiri indirim sonda uygulanır ve altıda bire kadardır; tam altıda bir uygulanmış olduğundan 27 x 5/6 = 22,5 ay, yani 22 ay 15 gün = 1 yıl 10 ay 15 gün çıkar. Hesapta ay 30 gün sayılır (TCK m. 61/6). Oranlar toplanmaz; her indirim önceki adımın sonucu üzerinden yapılır. Mahkemenin, geçmiş hırsızlık mahkûmiyetini temel cezada alt sınırdan uzaklaşma gerekçesi yapması hatalıdır: Ceza Genel Kurulu'na göre sabıka TCK m. 61/1 ölçütleri arasında olmadığı için bu gerekçe kullanılamaz, şartları varsa tekerrürde dikkate alınır ve gerekçe TCK m. 3/1'deki orantılılıkla da bağdaşmaz. Bu nedenle hüküm bu yönüyle bozma sebebidir; temel ceza yalnız TCK m. 61/1 ölçütleriyle gerekçelendirilmelidir. Sonuç ceza iki yılı aşmadığından TCK m. 51/1'deki erteleme sınırı ve CMK m. 231/5'teki HAGB sınırı bakımından uygundur; ancak diğer şartlar (örneğin önceki mahkûmiyet ve pişmanlık) ayrıca incelenir.

      **Sonuç:** Hesaplanan sonuç ceza 1 yıl 10 ay 15 gündür. Temel cezadaki sabıka gerekçesi hukuka aykırıdır; hükmün bu nedenle temel ceza yönünden yeniden gerekçelendirilmesi gerekir. Sonuç ceza iki yıl sınırını aşmadığı için erteleme ve HAGB şartları ayrıca incelenebilir.
  - olay: |
      Zeynep'in geçmişi şöyledir: (i) 2018'de kasten yaralamadan 1 yıl hapis cezası aldı; hüküm 1.3.2019'da kesinleşti ve ceza 1.3.2020'de tamamen infaz edildi. (ii) 2019'da taksirle yaralamadan adli para cezası aldı. Zeynep 1.6.2022'de dolandırıcılık suçu işledi. Bu suç nedeniyle 2 gün gözaltında, 28 gün tutuklu kaldı ve sonunda 2 yıl hapis cezasına mahkûm edildi. Mahkeme hükümde tekerrür hükümlerinin uygulanmadığını belirtmiştir.

      1. Zeynep hakkında hangi önceki mahkûmiyet tekerrüre esas olur? Gerekçeleriyle belirtiniz.
      2. Tekerrür uygulanırsa sonuçları nelerdir?
      3. Mahkûmiyet hükmündeki mahsup nasıl yapılır?
      4. Dolandırıcılık yerine kanunda seçimlik olarak hapis veya adli para cezası öngörülen bir suç söz konusu olsaydı hâkim hangi cezaya hükmederdi?
    olcut:
      - {tespit: "Önceki hüküm kesinleştikten sonra yeni suç işlenmiştir; ceza 5 yıldan az olduğundan süre infazdan itibaren 3 yıldır (1.3.2023) ve dolmamıştır; kasıtlı-kasıtlı olduğu için tekerrür uygulanır", puan: 25, madde: "TCK m. 58/2"}
      - {tespit: "Taksirli yaralamadan alınan adli para cezası kasıtlı yeni suça karşı tekerrüre esas olmaz", puan: 15, madde: "TCK m. 58/4"}
      - {tespit: "Tekerrürde ceza mükerrirlere özgü infaz rejimine göre çektirilir, infazdan sonra denetimli serbestlik uygulanır; bunlar hükümde belirtilir", puan: 20, madde: "TCK m. 58/6"}
      - {tespit: "Süreli hapiste mükerrir iyi hâlli olmak şartıyla cezasının üçte ikisini infaz kurumunda çektikten sonra koşullu salıverilebilir", puan: 15, madde: "5275 sayılı Kanun m. 108/1"}
      - {tespit: "30 günlük gözaltı ve tutukluluk şahsi hürriyeti sınırlayan hâllerdir; hükmolunan hapis cezasından 30 gün indirilir", puan: 15, madde: "TCK m. 63"}
      - {tespit: "Seçimlik cezalı suçta mükerrire hapis cezasına hükmolunur ve bu hapis adli para cezasına çevrilemez", puan: 10, madde: "TCK m. 58/3"}
    cozum: |
      **Nitelendirme:** Olay, tekerrürün şartlarının ve sonuçlarının, ayrıca mahsubun incelenmesine ilişkindir. Zeynep'in iki önceki mahkûmiyeti ayrı ayrı değerlendirilecektir.

      **Hukuki sorunlar:** (1) Hangi mahkûmiyet tekerrüre esas olur? (2) Süre dolmuş mu? (3) Tekerrürün sonuçları ve mahkeme hükmünün durumu nedir? (4) Mahsup nasıl yapılır?

      **İlgili hükümler:** Önceden işlenen suçtan dolayı verilen hüküm kesinleştikten sonra yeni suç işlenmesi hâlinde tekerrür hükümleri uygulanır; cezanın infaz edilmiş olması gerekmez (TCK m. 58/1). Beş yıl veya daha az hapis ya da adli para cezasında infazdan itibaren üç yıl geçtikten sonra işlenen suçta tekerrür uygulanmaz (TCK m. 58/2-b). Kasıtlı suçlarla taksirli suçlar arasında tekerrür uygulanmaz (TCK m. 58/4). Sonuçlar TCK m. 58/3, 58/6 ve 58/7 ile 5275 sayılı Kanun m. 108'dedir. Mahsup için TCK m. 63.

      **Değerlendirme:** (i) kasten yaralama hükmü 1.3.2019'da kesinleşmiş, yeni suç 1.6.2022'de işlenmiştir; yani kesinleşmeden sonradır. Ceza 1 yıl hapis olup beş yıldan azdır; üç yıllık süre infaz tarihi olan 1.3.2020'den başlar ve 1.3.2023'te dolar. Yeni suç bu süre dolmadan işlendiği için tekerrür uygulanır. Kasten yaralama ile dolandırıcılık farklı suç tipleridir ama ikisi de kasıtlıdır; aynı tür suç şartı yoktur. (ii) taksirli suç mahkûmiyeti kasıtlı dolandırıcılığa karşı tekerrüre esas olmaz. Bu nedenle mahkemenin "tekerrür uygulanmadı" demesi hatalıdır; hüküm bu yönüyle düzeltilmelidir. Tekerrür uygulanınca ceza mükerrirlere özgü infaz rejimine göre çektirilir, infazdan sonra denetimli serbestlik uygulanır ve bunlar hükümde belirtilir. Süreli hapiste iyi hâlli olmak şartıyla koşullu salıverilme için cezanın üçte ikisi gerekir. Mahsupta 2 günlük gözaltı ve 28 günlük tutukluluk toplam 30 gün olup hükmolunan hapisten düşülür; hüküm kesinleşmeden önce gerçekleşen bütün hürriyeti sınırlayıcı hâller bu kapsamdadır. Kanunda seçimlik hapis ve adli para öngörülseydi, tekerrür nedeniyle hapis cezasına hükmedilir ve bu ceza adli para cezasına çevrilemezdi.

      **Sonuç:** Yalnız (i) numaralı mahkûmiyet tekerrüre esas olur; (ii) olmaz. Tekerrür hükümleri uygulanmalı, mükerrirlere özgü infaz rejimi ve infaz sonrası denetimli serbestlik hükümde belirtilmelidir. Mahkûm olunan 2 yıl hapisten 30 gün mahsup edilir.
kartlar:
  - on: "TCK m. 61/1'deki temel ceza ölçütleri nelerdir?"
    arka: "Yedi ölçüt: işleniş biçimi, araçlar, zaman ve yer, konunun önem ve değeri, zarar veya tehlikenin ağırlığı, kast veya taksire dayalı kusurun ağırlığı, amaç ve saik (TCK m. 61/1). Geçmiş mahkûmiyet bu ölçütlerden değildir."
  - on: "Geçmiş mahkûmiyet temel cezayı alt sınırdan uzaklaştırmak için gerekçe olabilir mi?"
    arka: "Hayır. Ceza Genel Kurulu'na göre sabıka TCK m. 61/1 ölçütleri arasında olmadığı için alt sınırdan uzaklaşma gerekçesi yapılamaz; şartları varsa tekerrürde dikkate alınır."
  - on: "TCK m. 61/5'teki indirim ve artırım sırası nedir?"
    arka: "Teşebbüs, iştirak, zincirleme suç, haksız tahrik, yaş küçüklüğü, akıl hastalığı, şahsi indirim sebepleri, takdiri indirim. Takdiri indirim en sonda uygulanır."
  - on: "Birden fazla nitelikli hâlde hangi sıra izlenir?"
    arka: "Temel cezada önce artırma, sonra indirme yapılır (TCK m. 61/4)."
  - on: "Ceza hesabında bir ay kaç gündür? Artakalan ne olur?"
    arka: "Bir ay otuz gündür; hapiste günün, adli para cezasında liranın artakalanı hesaba katılmaz ve infaz edilmez (TCK m. 61/6)."
  - on: "Süreli hapiste sonuç ceza en çok kaç yıl olabilir?"
    arka: "Otuz yıl (TCK m. 61/7)."
  - on: "TCK m. 62/1'e göre takdiri indirim nasıl uygulanır?"
    arka: "Ağırlaştırılmış müebbet yerine müebbet, müebbet yerine 25 yıl hapis; diğer cezaların altıda birine kadarı indirilir."
  - on: "7406 sayılı Kanun (2022) TCK m. 62/2'de neyi değiştirdi?"
    arka: "Yargılamadaki davranış yerine pişmanlığı gösteren davranış arandı, 'gibi hususlar' çıktı, gerekçe zorunluluğu açıklandı ve duruşmada mahkemeyi etkilemeye yönelik şeklî tutum ve davranışların dikkate alınmayacağı eklendi."
  - on: "Tekerrür süresi hangi tarihten başlar ve kaç yıldır?"
    arka: "İnfazın gerçekleştiği tarihten başlar. 5 yıldan fazla hapiste 5 yıl, 5 yıl veya daha az hapis ya da adli para cezasında 3 yıl (TCK m. 58/2)."
  - on: "5237 sayılı TCK'da tekerrürün sonucu nedir?"
    arka: "Cezayı artırmaz; mükerrirlere özgü infaz rejimi ve infazdan sonra denetimli serbestlik uygulanır, seçimlik cezada hapis seçilir (TCK m. 58/3 ve m. 58/6). Süreli hapiste koşullu salıverilme oranı üçte ikidir (5275 sayılı Kanun m. 108/1-d)."
  - on: "İkinci defa tekerrürde 2025'ten sonra koşullu salıverilme var mı?"
    arka: "Evet. 7550 sayılı Kanunla (4.6.2025) 5275 sayılı Kanun m. 108/3 değişti; süreli hapiste oran dörtte üçtür. Eski kural olan 'koşullu salıverilmez' güncel değildir."
  - on: "Adli para cezasında mahsupta bir gün kaç TL sayılır?"
    arka: "500 TL (TCK m. 63; 7499 sayılı Kanunla 100 TL'den çıkarıldı). Yabancı ülkedeki gözaltı, tutukluluk veya hükümlülük süresi de mahsup edilir (TCK m. 16)."
