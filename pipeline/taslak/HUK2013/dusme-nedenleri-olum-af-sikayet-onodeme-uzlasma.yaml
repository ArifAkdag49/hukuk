  - **Düşme nedenleri:** Dava ya da ceza, zamanaşımı dışında şu hâllerde ortadan kalkar: ölüm (TCK m. 64), af (TCK m. 65), şikâyetten vazgeçme (TCK m. 73/4), önödeme (TCK m. 75) ve uzlaşma (CMK m. 253, CMK m. 254). Zamanaşımı Konu 22'de.
  - **Ölüm (TCK m. 64):** Sanığın ölümü kamu davasını düşürür; hükümlünün ölümü hapis cezasını ve henüz infaz edilmemiş adli para cezasını ortadan kaldırır. İstisna: niteliği gereği müsadereye tabi şeyler ve ölümden önce kesinleşmiş müsadere ile yargılama gideri hükmü.
  - **Af (TCK m. 65):** Genel af davayı düşürür, cezayı bütün sonuçlarıyla kaldırır. Özel af yalnız infaza ilişkindir; hak yoksunlukları sürer. Karar yetkisi TBMM'de, üye tamsayısının beşte üç çoğunluğundadır (AY m. 87). Cumhurbaşkanının hastalık, sakatlık ve kocama sebebiyle cezayı hafifletme veya kaldırma yetkisi ayrıdır (AY m. 104).
  - **Düşmenin etkisi (TCK m. 74):** Af ve vazgeçme, müsadere edilen şeylerin veya ödenmiş adli para cezasının geri alınmasını gerektirmez; kamu davasının düşmesi hukuk davasını etkilemez; genel afta yargılama giderleri de istenemez.
  - **Şikâyet (TCK m. 73):** Süre altı aydır ve fiil ile failin öğrenildiği günden işler. 📌 Şikâyete bağlı hakarette ayrıca fiilden itibaren iki yıllık mutlak üst sınır vardır. Vazgeçme kesinleşmeden önce davayı düşürür; iştirakte hepsini kapsar, kabul etmeyeni etkilemez.
  - **Önödeme (TCK m. 75):** Yalnız adli para cezası gerektiren veya hapsin üst sınırı altı ayı aşmayan suçlarda, uzlaşma kapsamı dışında uygulanır. 📌 Hapsin alt sınırının her günü için 100 TL hesaplanır; savcının tebliğinden itibaren on gün içinde ödenir; talep hâlinde üç taksit mümkündür.
  - **Uzlaştırma (CMK m. 253):** Şikâyete bağlı suçlar ve sayılı suçlar kapsamdadır. 📌 Hakaret, ısrarlı takip ve cinsel dokunulmazlığa karşı suçlar şikâyete bağlı olsa da dışarıdadır. Teklife cevap süresi 📌 yedi gündür; susan reddetmiş sayılır.
  - **Sonuç:** Soruşturmada edim hemen yerine getirilirse kovuşturmaya yer olmadığı; ertelenirse kamu davasının açılmasının ertelenmesi kararı verilir. Kovuşturmada def'aten ifa davanın düşmesi, ertelenmiş ifa durma kararı doğurur (CMK m. 254/2). Birden çok failde yalnız uzlaşan yararlanır (CMK m. 255).
  - **Usul:** Düşme nedeni varsa davanın düşmesine, şart henüz gerçekleşmemişse durma kararı verilir (CMK m. 223/8).
anlatim: |
  ## 1. Düşme nedenleri haritası

  **Düşme**, cezalandırma yetkisinin bir nedenle ortadan kalkmasıdır. Dava düşerse mahkûmiyet kararı verilemez; ceza düşerse hüküm kesinleşmiş olsa bile infaz edilemez. Bu konuda zamanaşımı dışındaki nedenleri işliyoruz: ölüm, af, şikâyetten vazgeçme, önödeme ve uzlaştırma. Zamanaşımı Konu 22'dedir; burada yalnız bağlantı noktalarına değineceğiz.

  > 💡 **Püf nokta:** Her düşme nedenini üç soruyla çöz: Hangi aşamada gerçekleşti (kesinleşmeden önce mi sonra mı)? Neyi düşürüyor (dava mı, ceza mı)? Hukuk davasını ve müsadereyi etkiliyor mu?

  ## 2. Ölüm (TCK m. 64)

  Ceza sorumluluğu şahsîdir; ölenin cezası mirasçısına yüklenemez. Kanun ölümü hükmün kesinleşmesine göre ikiye ayırır.

  - **Sanığın ölümü (TCK m. 64/1):** Kamu davasının düşürülmesine karar verilir. Henüz mahkûmiyet kesinleşmemiştir.
  - **Hükümlünün ölümü (TCK m. 64/2):** Hapis cezasını ve henüz infaz edilmemiş adli para cezasını ortadan kaldırır.

  İki istisna vardır ve ikisi birbirine karıştırılır:

  1. Sanık ölse bile **niteliği itibarıyla müsadereye tabi eşya ve maddi menfaatler** hakkında davaya devam edilerek müsadere kararı verilebilir (TCK m. 64/1). Yasak eşya buna örnektir.
  2. Hükümlü öldükten sonra, **ölümden önce kesinleşmiş** müsadere ve yargılama giderine ilişkin hüküm infaz olunur (TCK m. 64/2).

  > **Örnek:** Hasan, kesinleşmiş 5.000 TL adli para cezasını ödemeden ölüyor. Ödenmemiş adli para cezası ortadan kalkar. Ama aynı hükümde yer alan ve ölümden önce kesinleşen yargılama gideri hükmü infaz edilir; mirasçıdan değil, terekeden tahsil edilir.

  > ⚠️ **Sınavda dikkat:** "Sanığın ölümü = dava düşer", "hükümlünün ölümü = ceza düşer". Müsadere istisnası iki fıkrada farklı kurulmuştur: birincide "niteliği itibarıyla müsadereye tabi" şeyler, ikincide "ölümden önce kesinleşmiş" hüküm.

  ## 3. Af (TCK m. 65)

  Af, devletin cezalandırma yetkisinden vazgeçmesidir. Yetki TBMM'dedir: üye tamsayısının beşte üç çoğunluğunun kararıyla genel ve özel af ilan edilir (AY m. 87). Af kanunla yapıldığı için bu çoğunluk aranır.

  | | Genel af | Özel af |
  |---|---|---|
  | Konusu | Dava ve ceza | Yalnız cezanın infazı |
  | Sonucu | Dava düşer, ceza bütün neticeleriyle kalkar (TCK m. 65/1) | İnfaz sona erer, kısalır veya adli para cezasına çevrilir (TCK m. 65/2) |
  | Hak yoksunlukları | Kalkar | Devam eder (TCK m. 65/3) |

  Özel af mahkûmiyeti ortadan kaldırmaz. Bu yüzden cezaya bağlı veya hükümde belirtilen hak yoksunlukları (örneğin kamu hizmetinden yasaklılık) özel affa rağmen sürer.

  Cumhurbaşkanının sürekli hastalık, sakatlık ve kocama sebebiyle kişilerin cezalarını hafifletme veya kaldırma yetkisi (AY m. 104) ayrıca vardır. Öğretide "Cumhurbaşkanı affı" denir; TBMM'nin af kanunundan ayrı bir yetkidir.

  ## 4. Düşmenin etkisi (TCK m. 74)

  Düşme, her şeyi geriye silmez. TCK m. 74 sınırları çizer:

  - Genel af, özel af ve şikâyetten vazgeçme, **müsadere edilen şeylerin veya ödenmiş adli para cezasının geri alınmasını gerektirmez** (TCK m. 74/1).
  - Kamu davasının düşmesi, malların geri alınması ve zararın tazmini için açılan **şahsi hak davasını etkilemez** (TCK m. 74/2).
  - Cezanın düşmesi şahsi haklar, tazminat ve yargılama giderlerine ilişkin hükümleri etkilemez; ancak **genel afta yargılama giderleri de istenemez** (TCK m. 74/3).

  > **Örnek:** Genel af çıkıyor. Ali daha önce 3.000 TL adli para cezasını ödemişti; para geri verilmez. Hüküm gereği henüz ödenmemiş yargılama giderleri ise genel af nedeniyle istenemez.

  ## 5. Şikâyete bağlı suçlarda şikâyet ve vazgeçme (TCK m. 73)

  **Şikâyete bağlı suç**, soruşturma ve kovuşturmanın mağdurun şikâyetine bağlı olduğu suçtur. Şikâyet bir kovuşturma şartıdır; yoksa yargılama yapılamaz.

  ### 5.1. Süre

  - Yetkili kimse **altı ay** içinde şikâyette bulunmazsa soruşturma ve kovuşturma yapılamaz (TCK m. 73/1).
  - Süre, zamanaşımı süresini geçmemek koşuluyla, şikâyet hakkı olan kişinin **fiili ve failin kim olduğunu bildiği veya öğrendiği günden** başlar (TCK m. 73/2).
  - 📌 Şikâyete bağlı **hakaret** suçunda, 7531 sayılı Kanunla eklenen cümleye göre şikâyet süresi her ne suretle olursa olsun **fiilin gerçekleştiği tarihten itibaren iki yılı** geçemez (TCK m. 73/2).
  - Şikâyet hakkı olan birkaç kişiden biri süreyi geçirirse diğerlerinin hakkı düşmez (TCK m. 73/3).

  Şikâyet Cumhuriyet başsavcılığına veya kolluğa, yazılı ya da tutanağa geçirilmek üzere sözlü olarak yapılabilir (CMK m. 158).

  > ⚠️ **Sınavda dikkat:** Altı ay "öğrenme"den işler; iki yıl ise yalnız hakarette ve "fiilden" işler. Hakaret kamu görevlisine görevinden dolayı işlenmişse zaten şikâyete bağlı değildir (TCK m. 131/1).

  ### 5.2. Vazgeçme ve sonuçları

  Vazgeçmeyi zamanına göre ayır:

  1. **Hüküm kesinleşmeden önce** (temyiz aşaması dahil): vazgeçme **davayı düşürür** (TCK m. 73/4).
  2. **Kesinleşmeden sonra:** vazgeçme cezanın infazına engel olmaz (TCK m. 73/4).

  Vazgeçmenin başka sonuçları:

  - **İştirak:** Suç ortaklarından biri hakkındaki vazgeçme diğerlerini de kapsar (TCK m. 73/5). Ama vazgeçme, **onu kabul etmeyen sanığı etkilemez** (TCK m. 73/6).
  - **Şahsi haklar:** Mağdur vazgeçtiği sırada şahsi haklarından da vazgeçtiğini **ayrıca açıklamışsa** hukuk mahkemesinde dava açamaz (TCK m. 73/7). Açıklamamışsa tazminat davası açabilir (TCK m. 74/2).
  - **Kovuşturma evresinde fark edilen şikâyet şartı:** Soruşturmada şikâyete bağlı sanılmayan suçun kovuşturmaya geçildikten sonra şikâyete bağlı olduğu anlaşılırsa, mağdur açıkça vazgeçmedikçe yargılamaya devam olunur (CMK m. 158/7).

  Yargıtay'ın yerleşik uygulamasına göre vazgeçme belirli bir şekle bağlı değildir: savcılık, mahkeme, kolluk veya noter önünde ya da yazıyla yapılabilir. Önemli olan iradenin şüpheye yer bırakmayacak biçimde açıklanması ve beyanın zarar görene ait olduğunun ispatıdır. Duruşmaya gelmemek ise vazgeçme sayılmaz.

  > **Örnek:** Ali ve Mehmet, Zeynep'in arabasını birlikte hasarlıyor (suçun şikâyete bağlı olduğunu varsayalım). Zeynep yalnız Ali'yi affediyor. Vazgeçme iştirak nedeniyle Mehmet'i de kapsar. Mehmet vazgeçmeyi kabul etmezse onun hakkında yargılama sürer (TCK m. 73/5, TCK m. 73/6).

  ## 6. Önödeme (TCK m. 75)

  **Önödeme**, failin savcının teklif ettiği parayı ödemesiyle kamu davasının açılmamasını sağlayan kurumdur. Dava açılmışsa da ödeme davayı düşürür (TCK m. 75/2).

  ### 6.1. Kapsam

  - **Uzlaşma kapsamındaki suçlar hariç** olmak üzere, (a) yalnız adli para cezasını gerektiren veya (b) kanunda öngörülen hapsin **yukarı sınırı altı ayı aşmayan** suçlar (TCK m. 75/1).
  - Üst sınır şartına bakılmaksızın sayılı suçlar da kapsamdadır (TCK m. 75/6): yardım veya bildirim yükümlülüğünün yerine getirilmemesi (TCK m. 98/1), genel güvenliğin taksirle tehlikeye sokulması (TCK m. 171), çevrenin taksirle kirletilmesi, özel işaret ve kıyafetleri usulsüz kullanma, suçu bildirmeme (TCK m. 278/1-2), ayrıca bazı özel kanun suçları. 📌 Hakaret de bu listeye 2024'te eklenmiştir; bugünkü metinde kamu görevlisine görevinden dolayı işlenen hakaret (TCK m. 125/3-a) hariçtir.
  - Aynı fıkra kapsamındaki suçlar beş yıl içinde tekrar işlenirse aynı suçtan önödeme uygulanmaz (TCK m. 75/6).

  ### 6.2. Miktar ve usul

  1. Adli para cezası maktu ise o miktar, değilse alt sınırı.
  2. Hapis cezasında alt sınırın karşılığı olarak **her gün için 100 TL** üzerinden hesaplanan miktar. Hapis alt sınırı ay ise bir ay otuz gün sayılır (TCK m. 61/6).
  3. Hapis ve adli para birlikte öngörülmüşse ikisinin toplamı (TCK m. 75/1-c).
  4. Soruşturma giderleri eklenir ve savcılığın **tebliğinden itibaren on gün** içinde ödenir.
  5. Fail on gün içinde talep ederse miktar **birer ay arayla üç eşit taksitte** ödenir; taksit süresinde ödenmezse önödeme hükümsüz kalır ve soruşturma sürer.
  6. Önödemeyle sonuçlanan karardan sonra **beş yıl içinde** önödemeye tabi yeni suç işlenirse teklif edilecek miktar yarı oranında artırılır (taksirli suçlar hariç).

  Önödeme yapılmadan dava açılmışsa veya fiilin niteliği değişerek madde kapsamına giren bir suça dönüşmüşse de önödeme uygulanır (TCK m. 75/3). Önödeme, kişisel hakkın istenmesine, malın geri alınmasına ve müsadereye ilişkin hükümleri etkilemez (TCK m. 75/5).

  > 📌 **Kesin bilgi (eski ve yeni):**
  >
  > | Konu | Eski | Güncel |
  > |---|---|---|
  > | Hapis üst sınırı | 3 ay | 6 ay (2016) |
  > | Gün karşılığı | 20, sonra 30 TL | 100 TL (2024) |
  > | Taksit | yok | 3 eşit taksit (2019) |
  > | Hakaret | önödeme dışı | önödeme kapsamında; 125/3-a hariç |

  > **Örnek:** Burak taksirle genel güvenliği tehlikeye sokuyor (TCK m. 171/1, hapis üç aydan bir yıla kadar). Üst sınır bir yıl olsa da TCK m. 75/6 gereği önödeme mümkündür. Alt sınır üç ay, yani 90 gündür; 90 x 100 = 9.000 TL ve soruşturma giderleri istenir. Taksit talep ederse 3.000 TL'lik üç taksitte ödeyebilir.

  > ⚠️ **Sınavda dikkat:** Seçimlik cezalı suçlarda (örneğin TCK m. 98/1: hapis veya adli para) miktarın nasıl hesaplanacağı konusunda TCK m. 75/4 adli para cezasının esas alınacağını söyler; sınavda bu tür suçlarda kesin rakam beklenmez, kural bilgisi aranır.

  ## 7. Uzlaştırma (CMK m. 253-255)

  **Uzlaştırma**, şüpheli ile mağdur veya suçtan zarar gören arasında, uzlaştırmacı aracılığıyla edimin kararlaştırılması girişimidir.

  ### 7.1. Hangi suçlarda?

  - Soruşturulması ve kovuşturulması **şikâyete bağlı** suçlar (CMK m. 253/1-a).
  - Şikâyete bağlı olup olmadığına bakılmaksızın sayılan suçlar (CMK m. 253/1-b): kasten yaralama (üçüncü fıkra hariç, TCK m. 86; TCK m. 88), taksirle yaralama (TCK m. 89), tehdit (TCK m. 106/1), konut dokunulmazlığının ihlali, iş ve çalışma hürriyetinin ihlali, hırsızlık (TCK m. 141), güveni kötüye kullanma (üçüncü fıkra hariç, TCK m. 155), dolandırıcılık, suç eşyasının satın alınması veya kabul edilmesi, çocuğun kaçırılması ve alıkonulması, ticari sır niteliğindeki bilgilerin açıklanması (dördüncü fıkra hariç).
  - 📌 Adli süreçteki çocuklar bakımından, mağdurun veya suçtan zarar görenin gerçek ya da özel hukuk tüzel kişisi olması koşuluyla, üst sınırı üç yılı geçmeyen hapis veya adli para cezasını gerektiren suçlar (CMK m. 253/1-c). 2026 tarihli 7593 sayılı Kanunla terim "suça sürüklenen çocuk"tan "adli süreçteki çocuk"a çevrilmiştir.

  **Kapsam dışı:** Şikâyete bağlı olsa bile cinsel dokunulmazlığa karşı suçlar, ısrarlı takip ve 📌 **hakaret** (TCK m. 125) uzlaştırmaya tabi değildir (CMK m. 253/3). Kapsama giren suç kapsam dışı bir suçla aynı mağdura karşı birlikte işlenmişse uzlaşma hükümleri uygulanmaz. 📌 Yalnız kapsam dışı suç önödeme kapsamındaysa, uzlaştırma kapsamındaki suç için uzlaşma hükümleri uygulanır.

  > ⚠️ **Sınavda dikkat:** Eski kitaplarda hakaret uzlaştırma kapsamında anlatılır; bu bilgi artık geçersizdir. Bugün hakaret uzlaştırma dışıdır, önödeme kapsamındadır.

  > ⚠️ **Sınavda dikkat:** Taksirle yaralamada bilinçli taksir hâlinde şikâyet aranmaz (TCK m. 89/5); buna rağmen suç, CMK m. 253/1-b uyarınca uzlaştırma kapsamındadır.

  ### 7.2. Usul

  1. Suç uzlaşmaya tabi ve kamu davası açılması için yeterli şüphe varsa dosya uzlaştırma bürosuna gönderilir; uzlaştırmacı şüpheliye ve mağdura teklifte bulunur (CMK m. 253/4). Reşit olmayanlarda teklif kanuni temsilciye yapılır.
  2. 📌 Teklif edilen kişi **yedi gün** içinde kararını bildirmezse teklifi reddetmiş sayılır (eski süre üç gündü).
  3. Birden çok mağdur varsa hepsinin kabul etmesi gerekir (CMK m. 253/7).
  4. Uzlaştırmacı işlemleri belge örneklerinin verilmesinden itibaren otuz gün içinde sonuçlandırır; büro süreyi her defasında yirmi günü geçmemek üzere en fazla iki kez uzatabilir (CMK m. 253/12).
  5. Müzakere açıklamaları hiçbir yargılamada delil olarak kullanılamaz (CMK m. 253/20). Uzlaşma sonuçsuz kalırsa tekrar uzlaştırmaya gidilemez (CMK m. 253/18).
  6. Teklif reddedilse de taraflar iddianamenin düzenlendiği tarihe kadar uzlaştıklarını gösteren belgeyle savcıya başvurabilir (CMK m. 253/16).

  Yargıtay Ceza Genel Kurulu uygulamasında teklif aşaması, müzakere aşaması ve rapor ayrılır: teklif reddedilir veya taraflardan birine ulaşılamazsa girişim teklif aşamasında olumsuz sonuçlanır; rapor ancak müzakereye geçildikten sonra düzenlenir.

  ### 7.3. Sonuçlar

  | Aşama | Edim hemen ifa | Edim ertelenir/taksitlenir |
  |---|---|---|
  | Soruşturma (CMK m. 253/19) | Kovuşturmaya yer olmadığı | Kamu davasının açılmasının ertelenmesi |
  | Kovuşturma (CMK m. 254/2) | Davanın düşmesi | 📌 Durma kararı |

  Erteleme veya durma süresince zamanaşımı işlemez. Uzlaşmanın gerekleri yerine getirilmezse soruşturmada kamu davası açılır, kovuşturmada yargılamaya kaldığı yerden devam olunur. 7531 sayılı Kanundan önce kovuşturmada edimin ertelenmesi hâlinde hükmün açıklanmasının geri bırakılması (Konu 18) kararı verilirdi; bugün durma kararı verilir.

  Uzlaşma sağlanınca, uzlaşma anında tespit edilemeyen veya sonradan ortaya çıkan zararlar hariç, tazminat davası açılamaz; açılmış dava feragat sayılır (CMK m. 253/19). Mutlak yasak önce Anayasa Mahkemesi kararıyla iptal edilmiş, sonra bu istisnalı biçimde yeniden düzenlenmiştir. Uzlaştırmacı ücreti uzlaşma gerçekleşirse Hazine tarafından karşılanır (CMK m. 253/22).

  ### 7.4. Birden çok fail

  Aralarında iştirak olsun olmasın birden çok kişi tarafından işlenen suçlarda **yalnız uzlaşan kişi** uzlaşmadan yararlanır (CMK m. 255).

  > ⚠️ **Sınavda dikkat (en sık sorulan karşılaştırma):** Şikâyetten vazgeçme iştirakteki **herkese** sirayet eder (TCK m. 73/5); uzlaşmadan **yalnız uzlaşan** yararlanır (CMK m. 255).

  ## 8. Usuldeki karşılığı ve komşu kurumlar

  - Kanunda öngörülen düşme nedeni varsa **davanın düşmesine** karar verilir. Kovuşturma şartının gerçekleşmeyeceği anlaşılırsa da düşme kararı verilir. Şart henüz gerçekleşmemişse (örneğin şikâyet süresi işliyorsa) gerçekleşmesini beklemek üzere **durma kararı** verilir; karara itiraz edilebilir (CMK m. 223/8).
  - Derhal beraat kararı verilebilecek hâllerde düşme, durma veya ceza verilmesine yer olmadığı kararı verilemez (CMK m. 223/9).
  - Etkin pişmanlık ve şahsi cezasızlık nedenleri düşme nedeni değildir; "ceza verilmesine yer olmadığı" kararı doğurur.
  - Adli para cezası (Konu 17) ve hükmün açıklanmasının geri bırakılması (Konu 18) önödeme ve uzlaşmadan farklı kurumlardır: önödemede dava hiç açılmaz, HAGB'de ise mahkûmiyet hükmü kurulur ama açıklanmaz.

  ## 9. Denetim şeması

  1. Olayda ölüm, af, vazgeçme, önödeme veya uzlaşma var mı? Aşaması nedir (soruşturma, kovuşturma, kesinleşme sonrası)?
  2. Ölümse: sanık mı hükümlü mü? Müsadere veya yargılama gideri var mı?
  3. Vazgeçmeyse: suç şikâyete bağlı mı, hüküm kesinleşti mi, iştirak var mı, sanık kabul etti mi?
  4. Önödeme mi uzlaştırma mı? Önce uzlaşma kapsamına bak, değilse önödeme şartlarını ara.
  5. Sonuç: dava mı, ceza mı düştü? Tazminat, müsadere ve yargılama giderinin akıbetini unutma.
kritik: |
  - 📌 Sanığın ölümü kamu davasını, hükümlünün ölümü hapis ve infaz edilmemiş adli para cezasını düşürür (TCK m. 64).
  - ⚠️ Ölümde müsadere istisnası iki türlüdür: niteliği gereği müsadereye tabi şeylerde davaya devam edilir (TCK m. 64/1); ölümden önce kesinleşmiş müsadere ve yargılama gideri hükmü infaz olunur (TCK m. 64/2).
  - 📌 Genel af davayı ve cezayı bütün sonuçlarıyla kaldırır; özel af yalnız infazı etkiler ve hak yoksunlukları sürer (TCK m. 65).
  - 📌 Af kararı TBMM üye tamsayısının beşte üç çoğunluğuyla verilir (AY m. 87); Cumhurbaşkanının hastalık, sakatlık ve kocama sebebiyle cezayı hafifletme yetkisi ayrıdır (AY m. 104).
  - ⚠️ Af ve vazgeçme ödenmiş adli para cezasının ve müsadere edilen şeylerin geri alınmasını gerektirmez; genel afta yargılama giderleri de istenemez (TCK m. 74).
  - 📌 Şikâyet süresi altı aydır; fiil ve failin öğrenildiği günden işler ve zamanaşımını aşamaz (TCK m. 73/1-2).
  - 📌 Şikâyete bağlı hakarette ek olarak fiilden itibaren iki yıllık mutlak üst sınır vardır (TCK m. 73/2).
  - ⚠️ Vazgeçme kesinleşmeden önce davayı düşürür; kesinleşmeden sonra infazı durdurmaz (TCK m. 73/4).
  - ⚠️ Vazgeçme iştirakteki herkese sirayet eder, ama kabul etmeyen sanığı etkilemez (TCK m. 73/5-6). Uzlaşmada ise yalnız uzlaşan yararlanır (CMK m. 255).
  - 📌 Önödeme: hapsin üst sınırı altı ayı aşmayan veya yalnız adli para gerektiren suçlar; alt sınırın her günü için 100 TL; tebliğden itibaren on gün; talep hâlinde üç taksit (TCK m. 75/1).
  - ⚠️ Uzlaşma kapsamındaki suçta önödeme uygulanmaz; hakaret artık uzlaştırma dışıdır, önödeme kapsamındadır (kamu görevlisine görevinden dolayı hakaret hariç).
  - 📌 Uzlaşma teklifine cevap süresi yedi gündür (eski süre üç gün); susan reddetmiş sayılır (CMK m. 253/4).
  - 📌 Kovuşturmada edim ertelenir veya taksitlenirse durma kararı verilir ve zamanaşımı işlemez (CMK m. 254/2); soruşturmada ise kamu davasının açılması ertelenir (CMK m. 253/19).
  - ⚠️ Şikâyetin gerçekleşmeyeceği anlaşılırsa düşme, henüz gerçekleşmemişse durma kararı verilir (CMK m. 223/8).
doktrin: |
  ### Şikâyetten vazgeçmenin şekli
  Bir görüşe göre vazgeçme de şikâyet gibi CMK m. 158'de sayılan makamlara (savcılık, kolluk, mahkeme) yapılmalıdır; noterde düzenlenen ibraname yeterli değildir. Gerekçe, vazgeçmenin de bir usul işlemi olması ve mercilere yapılmasının iradenin gerçekliğini güvenceye almasıdır. Karşı görüşe göre vazgeçme şekle bağlı değildir; iradenin şüpheye yer bırakmayacak biçimde açıklanması ve zarar görene ait olduğunun ispatı yeterlidir. Yargıtay Ceza Genel Kurulu bu ikinci görüşü benimsemektedir, ancak karar oy çokluğuyla alınmıştır.

  ### Küçük adına vazgeçme
  Veli, kanuni temsilci sıfatıyla küçüğün şikâyetinden vazgeçebilir mi? Bir görüşe göre kanuni temsilcinin beyanı geçerlidir. Çoğunluk görüşüne göre ise küçüğe vekil atanmışsa ve vekille kanuni temsilci birbirinden haberdar edilmemişse, küçük aleyhine sonuç doğuran vazgeçme beyanına itibar edilemez. Burada küçüğün menfaati ile temsilcinin menfaati çatışabilmektedir.

  ### Telefonla yapılan görüşme teklif sayılır mı?
  Uzlaşma teklifi esas olarak yüz yüze yapılır, formun imzalanmasıyla teklif aşaması tamamlanır. Bir görüşe göre telefonla çağrı teklif sayılmaz; teklif açıklanıp form imzalatılmadan ret iradesine hukuki değer verilemez. Ceza Genel Kurulu çoğunluğu ise somut olayda mağdurun açıkça uzlaşmayı kabul etmeyeceğini bildirmesini girişimin teklif aşamasında olumsuz sonuçlanması saymıştır. Bu ayrım sınavda yalnız tartışma olarak anlatılmalı, olay çözümünün tek dayanağı yapılmamalıdır.
sozluk:
  - terim: Düşme
    tanim: "Dava veya cezanın, kanunda sayılan bir nedenle ortadan kalkması; ölüm, af, vazgeçme, önödeme, uzlaşma ve zamanaşımı bunlardandır."
  - terim: Genel af
    tanim: "Kanunla yapılan, kamu davasını düşüren ve cezayı bütün sonuçlarıyla kaldıran af (TCK m. 65/1)."
  - terim: Özel af
    tanim: "Yalnız cezanın infazını sona erdiren, kısaltan veya adli para cezasına çeviren af; hak yoksunlukları devam eder (TCK m. 65/2-3)."
  - terim: Şikâyete bağlı suç
    tanim: "Soruşturulması ve kovuşturulması mağdurun şikâyetine bağlı olan suç; şikâyet süresi altı aydır (TCK m. 73/1)."
  - terim: Şikâyetten vazgeçme
    tanim: "Suçtan zarar görenin şikâyetini geri alması; kesinleşmeden önce davayı düşürür, sonra infazı durdurmaz (TCK m. 73/4)."
  - terim: Önödeme
    tanim: "Failin savcının teklif ettiği parayı ödemesiyle kamu davasının açılmamasını veya düşmesini sağlayan kurum (TCK m. 75)."
  - terim: Uzlaştırma
    tanim: "Şüpheli ile mağdur arasında uzlaştırmacı aracılığıyla edim belirlenmesi girişimi (CMK m. 253)."
  - terim: Uzlaştırmacı
    tanim: "Uzlaştırma bürosu tarafından görevlendirilen, teklifi yapan ve müzakereyi yürüten kişi; 7531 sayılı Kanundan sonra hukuk fakültesi mezunları arasından görevlendirilir."
  - terim: Def'aten ifa
    tanim: "Uzlaşma edimini hemen, tek seferde yerine getirmek."
  - terim: Durma kararı
    tanim: "Kovuşturmada edimin ertelenmesi hâlinde verilen, süresince zamanaşımının işlemediği karar (CMK m. 254/2)."
  - terim: Kovuşturma şartı
    tanim: "Kovuşturmanın yapılabilmesi için aranan şart; şikâyet buna örnektir (CMK m. 223/8)."
kararlar:
  - id: "83999700"
    ozet: |
      Sanık yağışlı havada araç kullanırken yol kenarındaki anneye çarpıyor; annede kemik kırığı, kucağındaki iki yaşındaki çocukta basit tıbbi müdahaleyle giderilebilir yaralanma oluşuyor. Anne soruşturmada şikâyetçi oluyor, sonra 11.500 lira aldığını ve şikâyeti olmadığını belirten bir ibranameyi ve noterde düzenlenen ibranameyi imzalıyor; duruşmada ise vazgeçmediğini söylüyor. Yerel mahkeme davanın şikâyet yokluğu nedeniyle düşmesine, Daire oy çokluğuyla onamaya karar veriyor. Ceza Genel Kurulu, itirazı değişik gerekçeyle kabul edip çocuk yönünden hükmü bozuyor. İlke: şikâyetten vazgeçme şekle bağlı değildir ve noter önünde de yapılabilir; bu nedenle anne yönünden vazgeçme geçerlidir. Ancak küçüğe vekil atanıp kanuni temsilciyle vekil birbirinden haberdar edilmeden, küçük aleyhine sonuç doğuran vazgeçme beyanına itibar edilemez.
  - id: "1128551300"
    ozet: |
      Sanıklar internetten araç satış ilanı verip katılandan kapora alıyor, sonra kardeş olan diğer sanık araç sahibi gibi çıkıp katılanı çalmakla suçluyor; sanıkların babası zarara karşılık nakit ve senet veriyor. Mahkûmiyet sonradan dolandırıcılık uzlaştırma kapsamına alındığı için bozuluyor. Uzlaştırmacı katılanla telefonda görüşüyor; katılan senet ödenmediği için uzlaşmayı kabul etmeyeceğini söylüyor. Ceza Genel Kurulu itirazı oy çokluğuyla reddediyor (Başkan ve beş üye karşı oyda). İlke: teklif esas olarak yüz yüze veya açıklamalı tebligat, istinabe, SEGBİS gibi yollarla yapılır; taraflardan birine ulaşılamaması veya teklifin reddi hâlinde girişim teklif aşamasında olumsuz sonuçlanır ve tutanakla belgelenir. Rapor ancak müzakere aşamasında düzenlenir.
  - id: "1227639200"
    ozet: |
      Avukat olan sanık, mağdurenin emeklilik işlemleri için oğlu aracılığıyla 7.000 TL alıyor, parayı kuruma yatırmıyor ve iade etmiyor. Fiil hizmet nedeniyle güveni kötüye kullanma olarak nitelendiriliyor ve sonradan uzlaştırma kapsamına alınınca dosya uzlaştırma için bozuluyor. Kovuşturmada uzlaştırmacı sanığa ve şikâyetçi oğula teklif yapıyor, ikisi de kabul etmiyor. Başsavcılığın itirazı, muhatap alınanın gerçek mağdure değil oğul olduğu gerekçesiyle ileri sürülüyor; Ceza Genel Kurulu itirazı oy birliğiyle reddediyor. İlke: teklif usulüne uygun biçimde önce sanığa yapılmış ve sanık reddetmişse diğer tarafa ayrıca teklif yapılmaz; girişim teklif aşamasında akim kalır. Yine de taraflar hüküm verilinceye kadar kendi aralarında uzlaşıp belge sunabilir.
sorular:
  - soru: |
      Hüküm kesinleşmeden önce sanığın ölümü hâlinde aşağıdakilerden hangisi gerçekleşir?
    siklar:
      - "Hapis cezası ortadan kalkar."
      - "Kamu davasının düşürülmesine karar verilir."
      - "Sanık hakkında beraat kararı verilir."
      - "Ceza verilmesine yer olmadığına karar verilir."
    dogru: 1
    aciklama: |
      Sanığın ölümü hâlinde kamu davasının düşürülmesine karar verilir; hapsin ortadan kalkması hükümlünün ölümüne ilişkindir ve beraat ya da ceza verilmesine yer olmadığı kararı ölümün sonucu değildir (TCK m. 64/1).
  - soru: |
      Hasan, hakkındaki kesinleşmiş hükümle verilen 5.000 TL adli para cezasının hiçbirini ödemeden ve yargılama gideri hükmü ölümden önce kesinleşmiş olarak ölüyor. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Adli para cezası ve yargılama giderine ilişkin hüküm birlikte ortadan kalkar."
      - "Adli para cezası infaz edilir, yargılama gideri düşer."
      - "Adli para cezası ortadan kalkar, ölümden önce kesinleşmiş yargılama gideri hükmü infaz olunur."
      - "Kamu davasının düşmesine karar verilir."
    dogru: 2
    aciklama: |
      Hükümlünün ölümü, henüz infaz edilmemiş adli para cezasını ortadan kaldırır; ancak müsadereye ve yargılama giderlerine ilişkin olup ölümden önce kesinleşmiş hüküm infaz olunur. Hüküm kesinleşmiş olduğundan düşen şey dava değil cezadır (TCK m. 64/2).
  - soru: |
      Özel affa ilişkin aşağıdaki ifadelerden hangisi doğrudur?
    siklar:
      - "Kamu davasını düşürür ve hükmü bütün sonuçlarıyla kaldırır."
      - "Cezaya bağlı veya hükümde belirtilen hak yoksunlukları özel affa rağmen devam eder."
      - "Yalnız TBMM üye tamsayısının salt çoğunluğuyla ilan edilebilir."
      - "Hapis cezasını adli para cezasına çeviremez."
    dogru: 1
    aciklama: |
      Özel af yalnız infaza ilişkindir; hak yoksunlukları devam eder. Davayı düşürüp bütün sonuçları kaldıran genel aftır. Af için aranan çoğunluk üye tamsayısının beşte üçüdür ve özel af hapsin adli para cezasına çevrilmesini de sağlayabilir (TCK m. 65/2-3, AY m. 87).
  - soru: |
      Genel af çıkıyor. Ali daha önce 3.000 TL adli para cezasını ödemiş, ancak hükümdeki yargılama giderini henüz ödememiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Ödenen adli para cezası geri alınabilir, yargılama gideri de istenemez."
      - "Ödenen adli para cezası geri alınamaz, yargılama gideri de istenemez."
      - "Ödenen adli para cezası geri alınamaz, yargılama gideri ise istenebilir."
      - "Ödenen adli para cezası geri alınabilir, yargılama gideri istenebilir."
    dogru: 1
    aciklama: |
      Af, ödenmiş adli para cezasının geri alınmasını gerektirmez; genel af hâlinde ise yargılama giderleri de istenemez (TCK m. 74/1, TCK m. 74/3).
  - soru: |
      Şikâyete bağlı hakaret suçuna ilişkin aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Şikâyet süresi öğrenmeden başlayarak altı aydır ve ayrıca fiilden itibaren iki yılı geçemez."
      - "Şikâyet süresi yalnız fiilden itibaren altı aydır."
      - "Şikâyet süresi fiilden itibaren iki yıldır ve öğrenme günü önemsizdir."
      - "Şikâyet süresi sınırsızdır, yalnız zamanaşımı ile sınırlıdır."
    dogru: 0
    aciklama: |
      Şikâyet süresi altı aydır ve fiil ile failin öğrenildiği günden işler; hakaret suçunda ayrıca her ne suretle olursa olsun fiilin gerçekleştiği tarihten itibaren iki yılı geçemez (TCK m. 73/1-2).
  - soru: |
      Ali ve Mehmet birlikte Zeynep'in eşyasına zarar veriyor (şikâyete bağlı suç olduğunu varsayın). Yargılama sürerken Zeynep yalnız Ali hakkındaki şikâyetinden vazgeçiyor; Mehmet vazgeçmeyi kabul etmediğini bildiriyor. Sonuç nedir?
    siklar:
      - "Vazgeçme yalnız Ali'yi kapsar."
      - "Vazgeçme Ali ve Mehmet'i kapsar; Mehmet'in kabul etmemesi sonucu değiştirmez."
      - "Vazgeçme kabul etmeyen Mehmet'i etkilemez, Mehmet hakkında yargılama sürer."
      - "Vazgeçme geçersizdir, çünkü iştirak hâlinde bölünemez."
    dogru: 2
    aciklama: |
      İştirakte vazgeçme diğer sanıkları da kapsar; ancak vazgeçme, onu kabul etmeyen sanığı etkilemez. Bu nedenle Mehmet hakkında yargılama sürer (TCK m. 73/5, TCK m. 73/6).
  - soru: |
      Hükmün kesinleşmesinden sonra suçtan zarar görenin şikâyetten vazgeçmesinin sonucu aşağıdakilerden hangisidir?
    siklar:
      - "Dava düşer."
      - "Hüküm kendiliğinden ortadan kalkar."
      - "Cezanın infazına engel olmaz."
      - "Yargılama giderleri ortadan kalkar."
    dogru: 2
    aciklama: |
      Kesinleşmeden önceki vazgeçme davayı düşürür; hükmün kesinleşmesinden sonraki vazgeçme cezanın infazına engel olmaz (TCK m. 73/4).
  - soru: |
      Önödemeye ilişkin aşağıdaki ifadelerden hangisi güncel hükme uygundur?
    siklar:
      - "Hapis cezasının alt sınırının karşılığı olarak her gün için 100 TL hesaplanır."
      - "Hapis cezasının üst sınırı üç ayı aşmayan suçlarda uygulanır."
      - "Uzlaşma kapsamındaki suçlarda da uygulanır."
      - "Ödeme için savcının tebliğinden itibaren otuz gün süre tanınır."
    dogru: 0
    aciklama: |
      Güncel metinde gün karşılığı 100 TL, hapis üst sınırı altı aydır; uzlaşma kapsamındaki suçlar hariç tutulur ve ödeme süresi tebliğden itibaren on gündür (TCK m. 75/1).
  - soru: |
      Burak, TCK m. 171 kapsamındaki bir suç nedeniyle savcılığın önödeme teklifini kabul etmiş ve on gün içinde talep ettiği üç eşit taksit kararı verilmiştir. Burak birinci taksiti ödedikten sonra ikinci taksiti süresinde ödemiyor. Sonuç nedir?
    siklar:
      - "Önödeme hükümsüz kalır ve soruşturmaya devam edilir."
      - "Kalan taksitler faizle tahsil edilir, soruşturma sona erer."
      - "Kovuşturmaya yer olmadığına karar verilir."
      - "Önödeme geçerli kalır ve hapis cezası yarıya indirilir."
    dogru: 0
    aciklama: |
      Taksitlerin süresinde ödenmemesi hâlinde önödeme hükümsüz kalır ve soruşturmaya devam edilir (TCK m. 75/1).
  - soru: |
      Aşağıdaki suçlardan hangisi şikâyete bağlı olsa bile uzlaştırma kapsamında değildir?
    siklar:
      - "Hırsızlık (TCK m. 141)"
      - "Tehdit (TCK m. 106/1)"
      - "Hakaret (TCK m. 125)"
      - "Taksirle yaralama (TCK m. 89)"
    dogru: 2
    aciklama: |
      Hakaret, ısrarlı takip ve cinsel dokunulmazlığa karşı suçlar şikâyete bağlı olsa bile uzlaştırma dışındadır. Diğer suçlar CMK m. 253/1-b'de sayılıdır (CMK m. 253/3).
  - soru: |
      Dava açıldıktan sonra mahkeme önünde uzlaşma sağlanıyor; sanık edimini üç taksitte ödemeyi taahhüt ediyor. Mahkeme hangi kararı verir?
    siklar:
      - "Davanın düşmesine karar verir."
      - "Durma kararı verir; durma süresince zamanaşımı işlemez."
      - "Kovuşturmaya yer olmadığına karar verir."
      - "Hükmün açıklanmasının geri bırakılmasına karar verir."
    dogru: 1
    aciklama: |
      Kovuşturmada edimin ileri tarihe bırakılması, taksite bağlanması veya süreklilik arz etmesi hâlinde durma kararı verilir. Def'aten ifa hâlinde ise davanın düşmesine karar verilirdi. Hükmün açıklanmasının geri bırakılması eski düzenlemedeydi (CMK m. 254/2).
  - soru: |
      Can ve Emre birlikte Ayşe'yi dolandırıyor. Ayşe yalnız Can ile uzlaşıyor ve Can edimi hemen yerine getiriyor. Emre uzlaşma teklifine yedi gün içinde cevap vermiyor. Hangisi doğrudur?
    siklar:
      - "Uzlaşma iştirak nedeniyle Emre'yi de kapsar."
      - "Emre teklifi kabul etmiş sayılır."
      - "Emre teklifi reddetmiş sayılır ve uzlaşmadan yararlanamaz."
      - "Emre için yeniden uzlaştırma yapılması zorunludur."
    dogru: 2
    aciklama: |
      Teklife yedi gün içinde cevap vermeyen teklifi reddetmiş sayılır ve birden çok failli suçta yalnız uzlaşan kişi uzlaşmadan yararlanır. Şikâyetten vazgeçmedeki iştirak kuralı uzlaşmada uygulanmaz (CMK m. 253/4, CMK m. 255).
olaylar:
  - olay: |
      Ali ve Mehmet, 5 Mart günü akşam saatlerinde Zeynep'in park halindeki arabasının camlarını birlikte kırıyor. Zeynep failleri 10 Mart günü öğreniyor ve 1 Ağustos günü Cumhuriyet başsavcılığına şikâyette bulunuyor. İddianame kabul edilip yargılamaya başlanıyor. Duruşmada Zeynep yalnız Ali'den şikâyetini geri aldığını açıklıyor; Mehmet vazgeçmeyi kabul etmediğini beyan ediyor. Zeynep, vazgeçerken şahsi haklarından da vazgeçip vazgeçmediğine dair bir açıklama yapmıyor. Olayda suçun soruşturulmasının ve kovuşturulmasının şikâyete bağlı olduğunu varsayınız.

      1. Zeynep şikâyet süresini kaçırmış mıdır?
      2. Ali hakkındaki vazgeçmenin Mehmet bakımından etkisi nedir?
      3. Zeynep, zararı için hukuk mahkemesinde dava açabilir mi?
    olcut:
      - {tespit: "Şikâyet süresinin altı ay olduğu ve fiil ile failin öğrenildiği günden başladığının belirlenmesi; 1 Ağustos'un süre içinde olması", puan: 25, madde: "TCK m. 73/2"}
      - {tespit: "Vazgeçmenin kesinleşmeden önce davayı düşürdüğü; iştirak hâlinde diğer sanığı da kapsadığı", puan: 25, madde: "TCK m. 73/5"}
      - {tespit: "Vazgeçmenin onu kabul etmeyen sanığı etkilemediği; Mehmet hakkında yargılamanın sürdüğü", puan: 25, madde: "TCK m. 73/6"}
      - {tespit: "Şahsi haklardan ayrıca vazgeçilmediği için hukuk davasının açılabileceği; kamu davasının düşmesinin hukuk davasını etkilememesi", puan: 25, madde: "TCK m. 73/7"}
    cozum: |
      **Nitelendirme:** Olay, şikâyete bağlı varsayılan bir suçta iştirak hâlinde işleyen failler arasında şikâyetten vazgeçmenin kısmi kabulünü ve şahsi hak davasına etkisini konu alıyor. Tartışmalı bir yön yoktur; dört sorun kanun metninden doğrudan çözülür.

      **Hukuki sorunlar:** (1) Şikâyet süresinin kaçırılıp kaçırılmadığı. (2) İştirakte vazgeçmenin kapsamı ve kabul etmeyen sanığın durumu. (3) Şahsi haklardan ayrıca vazgeçilmediği hâlde hukuk davası açılabilir mi.

      **İlgili hükümler:** Yetkili kimse altı ay içinde şikâyette bulunmazsa soruşturma ve kovuşturma yapılamaz; süre, fiil ve failin öğrenildiği günden başlar (TCK m. 73/1-2). Vazgeçme kesinleşmeden önce davayı düşürür (TCK m. 73/4). İştirakte biri hakkındaki vazgeçme diğerlerini kapsar (TCK m. 73/5), ancak kabul etmeyen sanığı etkilemez (TCK m. 73/6). Vazgeçerken şahsi haklardan da ayrıca vazgeçildiği açıklanmışsa hukuk davası açılamaz (TCK m. 73/7); kamu davasının düşmesi şahsi hak davasını etkilemez (TCK m. 74/2).

      **Değerlendirme:** Zeynep failleri 10 Mart'ta öğrenmiştir. Altı aylık süre bu günden başlar; 1 Ağustos'taki şikâyet süre içindedir. Zeynep Ali'den vazgeçtiğinde bu beyan iştirak ilişkisi nedeniyle Mehmet'i de kapsayacak gibi görünür. Ancak kanun vazgeçmenin kabul etmeyen sanığı etkilemeyeceğini ayrıca düzenlediğinden, Mehmet vazgeçmeyi kabul etmediği için onun hakkındaki kamu davası sürer. Ali bakımından ise vazgeçme kabul edildiği için dava düşer. Zeynep, vazgeçerken şahsi haklarından da vazgeçtiğini ayrıca açıklamadığı için, Ali'ye karşı da hukuk mahkemesinde tazminat davası açma hakkını korur.

      **Sonuç:** Şikâyet süresi içindedir. Ali hakkındaki dava vazgeçme nedeniyle düşer; Mehmet vazgeçmeyi kabul etmediğinden onun hakkındaki yargılama sürer. Zeynep ayrıca şahsi haklarından vazgeçmediği için hukuk mahkemesinde dava açabilir.
  - olay: |
      Burak, bir işyerinde dikkatsizlik nedeniyle yangına yol açıyor. Fiil, başkalarının malvarlığı bakımından tehlikeli olup genel güvenliğin taksirle tehlikeye sokulması suçunu oluşturmaktadır (TCK m. 171/1: üç aydan bir yıla kadar hapis). Cumhuriyet savcılığı Burak'a önödeme teklifini tebliğ ediyor.

      1. Suçun hapis cezasının üst sınırı bir yıl olduğuna göre önödeme uygulanabilir mi?
      2. Önödeme miktarı nasıl belirlenir?
      3. Burak miktarı taksitle ödeyebilir mi ve bir taksiti ödemezse ne olur?
      4. Burak üç yıl sonra aynı suçu yeniden işlerse önödeme uygulanır mı?
    olcut:
      - {tespit: "Üst sınır altı ayı aşsa da TCK m. 171'in sayılı suçlar arasında olması nedeniyle önödemenin uygulanması", puan: 20, madde: "TCK m. 75/6"}
      - {tespit: "Miktarın hapis alt sınırının her günü için 100 TL ve soruşturma giderleriyle hesaplanması; bir ayın otuz gün sayılması", puan: 20, madde: "TCK m. 75/1"}
      - {tespit: "On gün içinde talep hâlinde birer ay arayla üç eşit taksit", puan: 20, madde: "TCK m. 75/1"}
      - {tespit: "Taksitin süresinde ödenmemesi hâlinde önödemenin hükümsüz kalması ve soruşturmaya devam edilmesi", puan: 20, madde: "TCK m. 75/1"}
      - {tespit: "Sayılı suçların beş yıl içinde tekrarında aynı suçtan önödeme uygulanmaması", puan: 20, madde: "TCK m. 75/6"}
    cozum: |
      **Nitelendirme:** Olay, önödeme kurumunun kapsamı, miktarı, taksitle ödenmesi ve tekrar hâlini ele alıyor. Suç, TCK m. 75/6'da üst sınır şartına bakılmaksızın önödeme uygulanacak suçlar arasında sayılan genel güvenliğin taksirle tehlikeye sokulması suçudur.

      **Hukuki sorunlar:** (1) Üst sınır bir yıl olduğu hâlde önödeme mümkün mü? (2) Miktar nasıl bulunur? (3) Taksit ve taksitin ödenmemesinin sonucu. (4) Aynı suçun yeniden işlenmesi.

      **İlgili hükümler:** Önödeme, uzlaşma kapsamındaki suçlar hariç, yalnız adli para cezası gerektiren veya hapsin üst sınırı altı ayı aşmayan suçlarda uygulanır (TCK m. 75/1). TCK m. 75/6 ise TCK m. 171 gibi sayılı suçlarda üst sınır şartı aranmaksızın önödemeyi öngörür ve bu suçların beş yıl içinde tekrarında aynı suçtan önödeme uygulanmayacağını söyler. Miktar, hapsin aşağı sınırının her günü için yüz Türk Lirası üzerinden bulunur ve soruşturma giderleri eklenir; bir ay otuz gündür (TCK m. 61/6).

      **Değerlendirme:** Üst sınır bir yıl olsa da suç TCK m. 75/6'da sayıldığı için önödeme mümkündür. Hapis alt sınırı üç aydır; üç ay otuzar günden 90 gün sayılır ve 90 x 100 = 9.000 TL bulunur, buna soruşturma giderleri eklenir. Burak savcılığın tebliğinden itibaren on gün içinde ödeme yapabilir. Taksit isterse on gün içinde talep etmesi gerekir; savcı kabul ederse miktar birer ay arayla üç eşit taksitte (3.000'er TL) ödenir. İkinci taksiti süresinde ödemezse önödeme hükümsüz kalır ve soruşturmaya devam edilir. Üç yıl sonra aynı suç işlenirse, bu fıkra kapsamındaki suçların beş yıl içinde tekrarı söz konusu olduğundan aynı suçtan önödeme uygulanmaz.

      **Sonuç:** Önödeme uygulanabilir; yaklaşık 9.000 TL ve soruşturma giderleri istenir. Talep hâlinde üç taksitte ödenebilir; taksit ödenmezse soruşturma sürer. Üç yıl sonra aynı suçun tekrarında önödeme uygulanmaz.
kartlar:
  - on: "Sanığın ölümü ile hükümlünün ölümünün sonucu nedir?"
    arka: "Sanığın ölümünde kamu davası düşer; hükümlünün ölümü hapis ve infaz edilmemiş adli para cezasını ortadan kaldırır (TCK m. 64)."
  - on: "Ölümde müsadere istisnaları nelerdir?"
    arka: "Niteliği gereği müsadereye tabi şeylerde davaya devam edilir; ölümden önce kesinleşmiş müsadere ve yargılama gideri hükmü infaz olunur (TCK m. 64)."
  - on: "Genel af ile özel af arasındaki fark nedir?"
    arka: "Genel af davayı düşürür ve cezayı bütün sonuçlarıyla kaldırır; özel af yalnız infaza ilişkindir ve hak yoksunlukları sürer (TCK m. 65)."
  - on: "Af hangi çoğunlukla ilan edilir?"
    arka: "TBMM üye tamsayısının beşte üç çoğunluğuyla (AY m. 87). Cumhurbaşkanının hastalık, sakatlık ve kocama sebebiyle cezayı hafifletme yetkisi ayrıdır (AY m. 104)."
  - on: "Genel af çıkarsa ödenmiş adli para cezası ve yargılama gideri ne olur?"
    arka: "Ödenmiş adli para cezası geri alınmaz; genel afta yargılama giderleri de istenemez (TCK m. 74)."
  - on: "Şikâyet süresi ne zaman başlar ve ne kadardır?"
    arka: "Altı ay; fiil ve failin öğrenildiği günden başlar, zamanaşımını aşamaz. Hakarette ayrıca fiilden itibaren iki yıl üst sınır vardır (TCK m. 73/1-2)."
  - on: "Vazgeçme kesinleşmeden önce ve sonra ne sonuç doğurur?"
    arka: "Kesinleşmeden önce davayı düşürür; kesinleşmeden sonra cezanın infazına engel olmaz (TCK m. 73/4)."
  - on: "İştirakte vazgeçme kimleri kapsar?"
    arka: "Diğer sanıkları da kapsar, ama onu kabul etmeyen sanığı etkilemez (TCK m. 73/5-6). Uzlaşmada ise yalnız uzlaşan yararlanır (CMK m. 255)."
  - on: "Önödemenin temel şartları ve rakamları nelerdir?"
    arka: "Hapsin üst sınırı altı ayı aşmayan veya yalnız adli para gerektiren suç; alt sınırın günü 100 TL; tebliğden itibaren on gün; talep hâlinde üç taksit (TCK m. 75/1)."
  - on: "Hakaret hangi kuruma tabidir?"
    arka: "Uzlaştırma dışıdır (CMK m. 253/3); önödeme kapsamındadır, kamu görevlisine görevinden dolayı hakaret hariç (TCK m. 75/6)."
  - on: "Uzlaşma teklifine cevap süresi ve sessizliğin sonucu nedir?"
    arka: "Yedi gün; süre içinde kararını bildirmeyen teklifi reddetmiş sayılır (CMK m. 253/4)."
  - on: "Kovuşturmada uzlaşma edimi taksite bağlanırsa mahkeme ne karar verir?"
    arka: "Durma kararı verir ve durma süresince zamanaşımı işlemez; def'aten ifada dava düşer (CMK m. 254/2)."
