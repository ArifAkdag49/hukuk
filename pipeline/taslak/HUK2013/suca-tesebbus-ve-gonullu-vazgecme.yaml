  - ⚠️ **Eksik/tam teşebbüs** ayrımı 765'te vardı, 5237'de ayrı ceza oranlarıyla yoktur. Olası kast oranlarıyla (TCK m. 21/2) karıştırma.
  - 📌 **Gönüllü vazgeçmenin sonucu cezasızlıktır** (indirim değil); tamam olan kısım suçsa yalnız o suçun cezası verilir (TCK m. 36).
  - ⚠️ **Gönüllülük:** devam imkânı ve kanaati varken durmak gönüllüdür; dış etken (mağdurun bağırması, tanığın kapıyı çalması, polis) varsa gönüllü değildir.
  - ⚠️ **İcra bittikten sonra** yalnız uzaklaşmak yetmez; neticeyi önlemeye yönelik ciddi, aktif çaba (ör. ambulans çağırma) gerekir.
  - ⚠️ **Gönüllü vazgeçme / etkin pişmanlık:** ölçüt suçun tamamlanıp tamamlanmadığıdır. Malı geri vermek (tamamlanmış hırsızlık) etkin pişmanlıktır (TCK m. 168).
  - 💡 **TCK Birinci Kitabında genel etkin pişmanlık maddesi yoktur;** özel hükümlerdedir. Kovuşturma iddianamenin kabulüyle başlar (CMK m. 2/1-f).
doktrin: |
  ### İcra başlangıcının sınırı
  Hazırlık ile icra arasındaki çizgi her suçta aynı netlikte değildir. Bir görüşe göre yalnız suç tanımındaki tipik hareketin kendisine ya da ona doğrudan bitişik harekete başlanınca icra başlar. Örneğin hırsızlıkta kilit kırmak, malı almaya yönelik hareket değil, hazırlıktır. Karşı görüşe göre korunan alana doğrudan müdahale eden ve nitelikli hâli oluşturan hareketler de icradır. Yargıtay Ceza Genel Kurulu bir kararında ikinci görüşü oy çokluğuyla benimsemiştir. Konu tartışmalıdır; sınavda bu sınırın tam üzerinde kalan olaylarda iki görüşü de yazmak güvenlidir. Bina içinde eşya arama, kurcalama gibi hareketler iki görüşe göre de icradır.

  ### Elverişsiz teşebbüs ve işlenemez suç
  TCK elverişsizlik konusunda açık düzenleme yapmaz; yalnız "elverişli hareketler" der. Bir görüşe göre araç veya konu bakımından **mutlak** elverişsizlikte (büyüyle öldürme, şekerle zehirleme) teşebbüs yoktur; **nispi** elverişsizlikte (dozu yetersiz zehir, menzil dışı atış) teşebbüs vardır; elverişlilik olay anına göre (ex ante) değerlendirilir. Diğer görüş somut tehlike ya da failin planı ölçütünü esas alır; konunun yokluğu (ölmüş kişiye ateş) hâlinde ise **işlenemez suç** vardır ve ceza verilmez. Terimler ve sınırlar kitaptan kitaba değişir; Yargıtay'ın bu konuda yerleşik bir ilke kararı bu notta doğrulanmış değildir.

  ### Teşebbüsün mümkün olduğu suç türleri
  Taksirli suçlarda teşebbüs kesinlikle yoktur. Olası kastla teşebbüs bakımından kanunun kast türünü ayırmaması karşı görüşün dayanağıdır; Yargıtay ise olası kastın netice ile belirlendiğini söyleyerek teşebbüsü kabul etmez. Saf ihmali suçlar, sırf hareket suçları ve netice sebebiyle ağırlaşmış suçların ağır neticesi bakımından teşebbüs öğretide tartışmalıdır (TCK m. 23 ağır netice bakımından en az taksir arar); görüşler suç tipine göre değişir.

  ### Gönüllülüğün ölçütü ve saik
  Bir görüşe göre vazgeçmenin pişmanlık gibi ahlaken değerli bir saikle yapılması gerekir. Diğer görüşe göre saikin niteliği önemsizdir; korku, utanç ya da yakalanma kaygısı da gönüllülüğü kaldırmaz, yeter ki dış bir engel bulunmasın. Yargıtay'ın ölçütü ise imkân ve kanaat varken durmanın gönüllü sayılmasıdır. Fail neticeye artık ulaşamayacağını düşündüğü için duruyorsa (ör. kasada para olmadığını görünce) vazgeçmenin gönüllü sayılmayacağı öğretide kabul görür; buna **başarısız kalmış teşebbüs** denir. "Tamamlanmış/tamamlanmamış teşebbüs" terimleri de öğretiye aittir.

  ### Başkasının da yardım çağırdığı hâlde failin çabası
  İcra bittikten sonra failin ambulans çağırması gibi bir çabası varken aynı anda başka birinin de yardım çağırmış olması tartışma doğurmuştur. Somut olayda failin bunu bilmesinin beklenemediği bir durumda Yargıtay Ceza Genel Kurulu gönüllü vazgeçmeyi kabul etmiştir. Konu somut olaya çok bağlıdır; bu nedenle genel kural olarak yazılmamalıdır.
sozluk:
  - terim: Suç yolu (iter criminis)
    tanim: "Düşünce, hazırlık, icra ve tamamlanma aşamalarından oluşan, suçun ortaya çıkış süreci."
  - terim: Hazırlık hareketi
    tanim: "Suçun işlenmesini kolaylaştıran ama suç tipindeki fiile başlanmasını oluşturmayan davranış (alet temini, yer gözetleme). Kural olarak cezasızdır."
  - terim: İcra başlangıcı
    tanim: "Failin elverişli hareketlerle suç tipindeki fiile doğrudan doğruya başlaması. Teşebbüsün başladığı andır (TCK m. 35/1)."
  - terim: Teşebbüs
    tanim: "Kişinin işlemeyi kastettiği suçu elverişli hareketlerle doğrudan doğruya icraya başlayıp da elinde olmayan nedenlerle tamamlayamamasıdır."
  - terim: Elverişli hareket
    tanim: "Neticeyi meydana getirmeye objektif olarak yatkın hareket. Elverişlilik, araç ve suçun konusu dâhil bütün fiil bakımından aranır."
  - terim: Elverişsiz teşebbüs / işlenemez suç
    tanim: "Araç veya konu bakımından neticeyi meydana getiremeyecek girişim. Terimler ve hukuki sonucu öğretide tartışmalıdır."
  - terim: Eksik / tam teşebbüs
    tanim: "765 sayılı eski TCK'daki icra hareketlerinin bitip bitmemesine dayalı ayrım. 5237 sayılı TCK'da farklı ceza oranları yoktur."
  - terim: Gönüllü vazgeçme
    tanim: "Failin icra hareketlerinden kendiliğinden vazgeçmesi ya da kendi çabasıyla suçun tamamlanmasını veya neticeyi önlemesi. Teşebbüsten cezasızlık sağlar (TCK m. 36)."
  - terim: Tamam olan kısım
    tanim: "Vazgeçilene kadar gerçekleşmiş ve başlı başına suç oluşturan eylem. Fail yalnız bu suçun cezasıyla cezalandırılır."
  - terim: Etkin pişmanlık
    tanim: "Suç tamamlandıktan sonra gösterilen pişmanlık. Özel hükümlerde düzenlenir ve indirim ya da cezasızlık sağlar."
  - terim: Başarısız kalmış teşebbüs
    tanim: "Failin neticeye artık ulaşamayacağını düşündüğü için durması. Öğretide vazgeçmenin gönüllü sayılmayacağı kabul edilir."
kararlar:
  - id: "1039005400"
    ozet: |
      56 yaşındaki sanık, kızının kayınvalidesi olan 74 yaşındaki katılanın evine girer; mutfakta arkadan sarılıp cinsel ilişki istediğini söyler, onu zorla yatak odasına götürür, yatağa atmaya ve bluzunu çıkarmaya çalışır, bacaklarını elleyip şalvarını indirir. Katılan direnip bağırır; sesi duyan sanığın kızı kapıyı ısrarla çalınca sanık katılanı bırakıp kapıyı açar. Bilecik Ağır Ceza Mahkemesi nitelikli cinsel saldırıya teşebbüsten mahkûmiyet kurmuş, 9. Ceza Dairesi sanığın kendiliğinden bıraktığını ve eylemin cinsel saldırı olduğunu belirterek bozmuştur. Başsavcılığın itirazı üzerine Ceza Genel Kurulu, teşebbüsün üç şartını ve gönüllü vazgeçmenin şartlarını sayar. Dışa yansıyan hareketler vücuda organ veya cisim sokmaya yönelmediği için kast basit cinsel saldırıya yöneliktir ve bu suç tamamlanmıştır. Sanık, katılanın bağırması ve kapının ısrarla çalınması üzerine durduğundan gönüllü vazgeçme de uygulanamaz. İtiraz oy çokluğuyla reddedilmiştir. Karardan çıkan ilkeler: dış etken üzerine durmak gönüllü değildir; hangi suça teşebbüs edildiğinin nitelendirilmesi, gönüllü vazgeçme tartışmasından önce gelir; şüphe sanık lehinedir.
  - id: "1229387400"
    ozet: |
      Sanık, velayet anlaşmazlığı yaşadığı boşandığı eşinin evine gider, kapı açılınca tabancayla girip silahı doğrultur; mağdur kaçarken ateşlenen tek mermi karnına isabet eder (yaşamı tehlikeye sokan yaralanma). Sanık kaçar, aracına biner ve 112'yi arayıp olayı ve adresi bildirerek ambulans ister; evdeki tanık da iki dakika önce 112'yi aramıştır. Mağdur tedaviyle kurtulur. İlk derece mahkemesi nitelikli kasten öldürmeye teşebbüsten mahkûmiyet kurmuş; Bölge Adliye Mahkemesi ise gönüllü vazgeçmeyi kabul ederek hükmü kaldırmış ve neticesi sebebiyle ağırlaşmış kasten yaralamadan mahkûmiyet kurmuştur. Ceza Genel Kurulu, sanığın 112'yi arayıp olayı ve adresi açıkça bildirmesini aktif bir davranış sayar; evden ayrıldığı için tanığın aramasını bilmesi beklenemez. Bu durumda teşebbüsten cezalandırılamaz, tamam olan kısım itibarıyla neticesi sebebiyle ağırlaşmış kasten yaralamadan cezalandırılması isabetlidir. Başsavcılığın itirazı oybirliğiyle reddedilmiştir. İlke: icra bittikten sonraki gönüllü vazgeçmede failin neticeyi önlemeye yönelik aktif davranışı (ambulans çağırma) yeterli olabilir; tamam olan kısım ayrıca cezalandırılır. Sonuç somut olaya sıkı biçimde bağlıdır.
sorular:
  - soru: |
      TCK m. 35/1'e göre teşebbüsten sorumluluk için aşağıdakilerden hangisi aranır?
    siklar:
      - "Failin pişmanlık duyması"
      - "Suçun failin elinde olmayan nedenlerle tamamlanamamış olması"
      - "Mağdurun bir zarara uğramış olması"
      - "Hazırlık hareketlerinin tamamlanmış olması"
    dogru: 1
    aciklama: |
      Kanun, işlemeyi kastettiği suçu elverişli hareketlerle doğrudan doğruya icraya başlayıp da "elinde olmayan nedenlerle" tamamlayamayan kişiyi sorumlu tutar. Pişmanlık teşebbüsün şartı değildir; mağdurun zarar görmesi de aranmaz (zarar yalnız cezanın belirlenmesinde etkilidir). Hazırlık hareketleri kural olarak cezasızdır; icraya başlama gerekir (TCK m. 35/1).
  - soru: |
      Ayşe, komşusu Zeynep'i öldürmek için bir eczaneden zehir satın alır ve çantasında taşır. Ertesi gün zehri kullanmaktan vazgeçer. Ayşe'nin durumu hakkında hangisi doğrudur?
    siklar:
      - "Öldürmeye teşebbüsten cezalandırılır, çünkü kastı ortaya çıkmıştır"
      - "Öldürmeye teşebbüsten cezalandırılır ancak gönüllü vazgeçme nedeniyle indirim yapılır"
      - "Zehir satın almak hazırlık hareketidir; icraya başlanmadığı için öldürmeye teşebbüsten cezalandırılmaz"
      - "Etkin pişmanlık hükümleri uygulanır"
    dogru: 2
    aciklama: |
      Silah ya da zehir satın almak hazırlıktır; icra, suç tipindeki fiile doğrudan başlamakla (örneğin zehri yemeğe karıştırmakla) başlar. Kast tek başına cezalandırma için yetmez. Teşebbüs olmadığından gönüllü vazgeçme de etkin pişmanlık da tartışılmaz (TCK m. 35/1, TCK m. 36).
  - soru: |
      Ağırlaştırılmış müebbet hapis cezasını gerektiren bir suça teşebbüs hâlinde, TCK m. 35/2'nin güncel metnine göre fail kaç yıl hapis cezası ile cezalandırılır?
    siklar:
      - "13 yıldan 20 yıla kadar"
      - "10 yıldan 18 yıla kadar"
      - "14 yıldan 21 yıla kadar"
      - "9 yıldan 15 yıla kadar"
    dogru: 2
    aciklama: |
      4/6/2025 tarihli 7550 sayılı Kanunla aralık, ağırlaştırılmış müebbet için 14-21 yıla yükseltilmiştir. 13-20 ve 9-15 yıl eski metindeki aralıklardır; 10-18 yıl ise müebbet hapis gerektiren suça teşebbüste uygulanır (TCK m. 35/2).
  - soru: |
      Murat, 12/3/2026 tarihinde Hasan'ı öldürmek amacıyla ateş eder; mermi Hasan'ı ıskalar ve Murat ikinci kez ateş etmeden polis tarafından yakalanır. Fail, kasten öldürmenin temel hâlinden (TCK m. 81/1, müebbet hapis) sorumlu tutulacaktır. Teşebbüs nedeniyle uygulanacak ceza aralığı hangisidir?
    siklar:
      - "9 yıldan 15 yıla kadar hapis"
      - "Cezanın dörtte birinden dörtte üçüne kadarı indirilir"
      - "14 yıldan 21 yıla kadar hapis"
      - "10 yıldan 18 yıla kadar hapis"
    dogru: 3
    aciklama: |
      Müebbet hapis gerektiren suça teşebbüste güncel aralık 10-18 yıldır. Olay 7550 sayılı Kanundan sonra işlendiği için eski 9-15 yıl uygulanmaz. 14-21 yıl ağırlaştırılmış müebbet gerektiren suçlar içindir; 1/4-3/4 indirim ise diğer hâller içindir (TCK m. 35/2).
  - soru: |
      Temel cezası 4 yıl hapis olarak belirlenen bir suça teşebbüs edilmiştir. Ceza müebbet ya da ağırlaştırılmış müebbet olmadığına göre TCK m. 35/2 uyarınca sonuç ceza hangi aralıkta kalır?
    siklar:
      - "2 yıl ile 3 yıl arasında"
      - "1 yıl ile 3 yıl arasında"
      - "1 yıl ile 2 yıl arasında"
      - "3 yıl ile 4 yıl arasında"
    dogru: 1
    aciklama: |
      "Cezanın dörtte birinden dörtte üçüne kadarı indirilir." En az indirimle (1/4) 4 yıldan 1 yıl düşer ve 3 yıl, en çok indirimle (3/4) 3 yıl düşer ve 1 yıl kalır. İndirilen kısım 1/4-3/4'tür; kalan kısım değil (TCK m. 35/2).
  - soru: |
      Yargıtay Ceza Genel Kurulu'nun benimsediği görüşe göre olası kastla işlenen suça teşebbüs konusunda hangisi doğrudur?
    siklar:
      - "Kanun kast türünü ayırmadığı için olası kastla teşebbüs mümkündür"
      - "Olası kast netice ile belirlendiğinden olası kastla işlenen suça teşebbüs mümkün değildir"
      - "Olası kastla teşebbüs mümkündür ancak ceza 1/4-3/4 yerine 1/3-1/2 oranında indirilir"
      - "Olası kastla teşebbüs yalnız ağırlaştırılmış müebbet gerektiren suçlarda mümkündür"
    dogru: 1
    aciklama: |
      Yargıtay, olası kastın netice ile belirlenmesi nedeniyle olası kastla işlenen suçlara teşebbüsü kabul etmez; kanunun kast türünü ayırmaması karşı görüşün dayanağıdır, ancak bu görüş Yargıtay'ca benimsenmemiştir. Olası kastın cezası TCK m. 21/2'de, teşebbüsün cezası TCK m. 35/2'de ayrı düzenlenmiştir ve birlikte uygulanmaz.
  - soru: |
      Kasım, komşusu Veli'yi öldürmek için tabancayla nişan alıp ateş eder; mermi Veli'yi ıskalar. Kasım ikinci kez ateş edebilecek durumdadır, ancak "yeter, vazgeçtim" diyerek silahını indirir ve uzaklaşır. Hiç kimse yaralanmamıştır. Hangisi doğrudur?
    siklar:
      - "Kasım öldürmeye teşebbüsten cezalandırılır; ceza 1/4-3/4 oranında indirilir"
      - "Kasım gönüllü vazgeçtiği için öldürmeye teşebbüsten cezalandırılmaz"
      - "Kasım etkin pişmanlık hükümlerinden yararlanır"
      - "Kasım tam teşebbüsten sorumludur"
    dogru: 1
    aciklama: |
      Kasım, devam imkânı ve kanaati varken kendi iradesiyle durmuştur; dış bir engel yoktur. Bu, icra hareketlerinden gönüllü vazgeçmedir ve teşebbüsten cezasızlık doğurur (TCK m. 36). Etkin pişmanlık suç tamamlandıktan sonrasına ait olduğundan burada söz konusu değildir; tam/eksik teşebbüs ayrımı da 5237'de yoktur.
  - soru: |
      TCK m. 36'ya göre gönüllü vazgeçmenin sonucu hangisidir?
    siklar:
      - "Teşebbüs cezasında 1/4-3/4 oranında indirim yapılır"
      - "Teşebbüsten dolayı ceza verilmez; tamam olan kısım başlı başına suçsa yalnız o suçun cezası verilir"
      - "Fail hiçbir suçtan sorumlu tutulmaz"
      - "Teşebbüs cezası yarı oranında indirilir ve ertelenir"
    dogru: 1
    aciklama: |
      Gönüllü vazgeçme indirim değil cezasızlık sebebidir; ancak o ana kadar gerçekleşen kısım başlı başına suç oluşturuyorsa fail yalnız o suça ait cezayla cezalandırılır. "Hiçbir suçtan sorumlu olmaz" şıkkı tamam olan kısmı yok sayar (TCK m. 36).
  - soru: |
      Sevim, eşi Tolga'yı öldürmek için yemeğine zehir karıştırır; Tolga yemeği yer. Sevim, Tolga'nın kötüleştiğini görünce hiçbir şey yapmadan evden çıkıp sinemaya gider. Komşuların çağırdığı ambulans sayesinde Tolga kurtulur. Sevim bakımından hangisi doğrudur?
    siklar:
      - "İcra bittikten sonra yalnızca uzaklaşmak yeter, bu nedenle gönüllü vazgeçme vardır"
      - "Neticenin gerçekleşmemesi başlı başına gönüllü vazgeçmedir"
      - "Sevim neticeyi önlemeye yönelik ciddi ve aktif bir çaba göstermediğinden gönüllü vazgeçme yoktur"
      - "Etkin pişmanlık hükümlerinden yararlanır"
    dogru: 2
    aciklama: |
      İcra bittikten sonra gönüllü vazgeçme için failin kendi çabasıyla neticeyi önlemesi gerekir; yalnız uzaklaşmak ya da başkasının neticeyi önlemesi yetmez. Neticenin gerçekleşmemesi dış nedenle ise teşebbüs vardır. Etkin pişmanlık ise suç tamamlandıktan sonrasına ait özel bir kurumdur (TCK m. 36).
  - soru: |
      Burak, bir kişiyi dolandırarak 50.000 TL alır. Hakkında dava açılıp iddianame kabul edildikten sonra, ama hüküm verilmeden önce bu parayı mağdura tamamen iade eder. Burak'ın durumu hakkında hangisi doğrudur?
    siklar:
      - "Gönüllü vazgeçme nedeniyle dolandırıcılıktan cezalandırılmaz"
      - "TCK m. 168/1 uyarınca cezanın üçte ikisine kadarı indirilir"
      - "TCK m. 168/2 uyarınca etkin pişmanlık hükümleri uygulanır ve cezanın yarısına kadarı indirilir"
      - "Dolandırıcılık tamamlandığı için hiçbir indirim yapılmaz"
    dogru: 2
    aciklama: |
      Dolandırıcılık tamamlanmıştır; gönüllü vazgeçme değil etkin pişmanlık söz konusudur. İddianamenin kabulüyle kovuşturma başladığından (CMK m. 2/1-f), zararın hükümden önce tamamen giderilmesi hâlinde cezanın yarısına kadarı indirilir (TCK m. 168/2). Üçte ikiye kadar indirim kovuşturma başlamadan önceki pişmanlık içindir (TCK m. 168/1).
  - soru: |
      Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "TCK Birinci Kitabında bütün suçlar için geçerli genel bir etkin pişmanlık maddesi vardır"
      - "Etkin pişmanlık hükümleri yalnızca ilgili suçun özel hükümlerinde düzenlenir ve genel bir madde yoktur"
      - "Etkin pişmanlık ile gönüllü vazgeçme aynı kurumun iki adıdır"
      - "Etkin pişmanlık yalnızca teşebbüs aşamasında uygulanır"
    dogru: 1
    aciklama: |
      Gönüllü vazgeçme TCK m. 36'da genel hüküm olarak düzenlenmiştir; etkin pişmanlık ise ilgili suçların yanında özel hükümlerde yer alır (ör. TCK m. 110, TCK m. 168, TCK m. 254). Gönüllü vazgeçme suç tamamlanmadan, etkin pişmanlık tamamlandıktan sonra söz konusudur.
  - soru: |
      Ahmet, 10/3/2025 tarihinde (7550 sayılı Kanunun yürürlüğünden önce) Mehmet'i kasten öldürmeye teşebbüs eder; suç müebbet hapis cezasını gerektirmektedir. Ahmet hakkında 2026 yılında yargılama yapılmaktadır. Uygulanacak teşebbüs aralığı hangisidir?
    siklar:
      - "10-18 yıl hapis, çünkü yargılama güncel kanuna göre yapılır"
      - "9-15 yıl hapis, çünkü suçun işlendiği zamandaki kanun lehinedir"
      - "14-21 yıl hapis"
      - "Cezanın 1/4-3/4'ü indirilir"
    dogru: 1
    aciklama: |
      7550 sayılı Kanun teşebbüs aralıklarını artırarak failin aleyhine değişiklik yapmıştır. Suç değişiklikten önce işlendiği için, failin lehine olan eski kanun uygulanır; eski aralık müebbet için 9-15 yıldır (TCK m. 7/2, TCK m. 35/2).
olaylar:
  - olay: |
      Kemal, bir alacak kavgası yüzünden Hasan'ı öldürmeye karar verir ve bir hafta önce bir tabanca satın alır. 15 Mart 2026'da Hasan'ı sokakta görünce yaklaşık iki metreden nişan alıp ateş eder; mermi Hasan'ın omzunu sıyırır ve basit bir tıbbi müdahaleyle giderilebilecek bir yara açar. Kemal ikinci atış için tetiğe bastığında tabanca tutukluk yapar. O sırada olay yerine gelen polis ekibi Kemal'i yakalar. Kemal "Yeniden doldurup vurabilirdim ama zaten vazgeçmiştim" diye savunma yapar.

      1. Silah satın alma hareketi bakımından Kemal'in durumu nedir?
      2. Hangi aşamada icraya başlanmıştır?
      3. Gönüllü vazgeçme var mıdır?
      4. Kemal'in öldürmeye teşebbüsü bakımından uygulanacak ceza aralığı nedir?
    olcut:
      - {tespit: "Silah satın almanın hazırlık hareketi olması, teşebbüs kapsamında cezalandırılmaması", puan: 15, madde: "TCK m. 35/1"}
      - {tespit: "Nişan alıp ateş etmekle doğrudan doğruya icraya başlanması", puan: 20, madde: "TCK m. 35/1"}
      - {tespit: "Tutukluk ve polisin gelmesinin failin elinde olmayan dış nedenler olması", puan: 20, madde: "TCK m. 35/1"}
      - {tespit: "Gönüllü vazgeçmenin bulunmaması, savunmanın dış engel karşısında geçersizliği", puan: 20, madde: "TCK m. 36"}
      - {tespit: "Temel suçun müebbet hapis (TCK m. 81/1) olması ve teşebbüste güncel 10-18 yıl aralığının uygulanması", puan: 25, madde: "TCK m. 35/2"}
    cozum: |
      **Nitelendirme:** Kemal, belirli bir kişiyi öldürmeyi kastetmiş, ateş etmiş ve sonuç gerçekleşmemiştir. Olay, kasten öldürmeye (TCK m. 81/1) teşebbüs ve gönüllü vazgeçme sınırı sorunudur.

      **Hukuki sorunlar:** (1) Silah almak hazırlık mıdır, icra mıdır? (2) Hangi anda icraya başlanmıştır? (3) Kemal'in "vazgeçmiştim" savunması gönüllü vazgeçme sayılır mı? (4) Teşebbüste hangi ceza aralığı uygulanır?

      **İlgili hükümler:** TCK m. 35/1 teşebbüsü, TCK m. 36 gönüllü vazgeçmeyi, TCK m. 35/2 teşebbüs cezasını düzenler. TCK m. 81/1 kasten öldürme suçunun cezasını müebbet hapis olarak belirler.

      **Değerlendirme:** Silah satın almak, suç tipindeki fiile doğrudan yönelen bir hareket değildir; hazırlık hareketidir ve kural olarak cezasızdır. Silahı doğrultup nişan alıp ateş etmek ise öldürme fiiline doğrudan başlamaktır. Bu andan itibaren icraya başlanmıştır (TCK m. 35/1). Hareket elverişlidir: iki metreden ateş edilen tabanca öldürmeye elverişlidir ve Hasan'ın omzunun sıyrılması bunu gösterir.

      Suç tamamlanamamıştır ve bunun nedeni Kemal'in iradesi değil, tabancanın tutukluk yapması ve polisin gelmesidir. Bunlar failin elinde olmayan nedenlerdir. Kemal "yeniden doldurup vurabilirdim ama vazgeçmiştim" dese de, ikinci atış için tetiğe bastığını ve silahın tutukluk yapmasıyla durduğunu hesaba katmak gerekir; fail kendi iradesiyle durmamış, polis gelince yakalanmıştır. Gönüllü vazgeçmede fail imkân ve kanaat sahibiyken kendi iradesiyle durur (TCK m. 36); burada böyle bir durma yoktur. Savunma, dış engel karşısında gönüllü vazgeçmeyi göstermez.

      Ceza bakımından: öldürmenin temel hâli müebbet hapis gerektirdiğinden (TCK m. 81/1), teşebbüste TCK m. 35/2'ye göre müebbet hapis yerine on yıldan onsekiz yıla kadar hapis cezası uygulanır. Suç 2026'da işlendiği için 4/6/2025'te yürürlüğe giren 7550 sayılı Kanundaki güncel aralık esas alınır (eski 9-15 yıl değil). Somut ceza bu aralıkta "meydana gelen zarar veya tehlikenin ağırlığına göre" belirlenir.

      **Sonuç:** Kemal'in silah satın alması hazırlıktır; nişan alıp ateş etmesiyle icraya başlamıştır. Gönüllü vazgeçme yoktur. Kemal kasten öldürmeye teşebbüsten 10-18 yıl hapis aralığında cezalandırılır.
  - olay: |
      Selin, eşi Tolga'yı öldürmek için yemeğine fare zehiri karıştırır; Tolga yemeği yer. Yarım saat sonra Tolga kıvranırken Selin pişman olur. Evde başka kimse yokken 112'yi arayıp zehirlenmeyi ve adresi bildirir, ambulansla Tolga'yı hastaneye götürür. Tolga'nın hayatı tıbbi müdahaleyle kurtulur; adli raporda yaşamını tehlikeye sokan bir durum bulunduğu tespit edilir. Ayrıca Selin'in kardeşi Can, aynı hafta bir mağazadan telefon çalmış; soruşturma sırasında, iddianame kabul edilmeden önce telefonu mağazaya aynen iade etmiştir.

      1. Selin'in eylemi hangi aşamadadır?
      2. Selin gönüllü vazgeçme hükümlerinden yararlanır mı?
      3. Yararlanırsa hangi suçtan sorumlu olur?
      4. Gönüllü vazgeçme olmasaydı teşebbüs cezası ne olurdu?
      5. Can'ın durumu nasıl değerlendirilir?
    olcut:
      - {tespit: "İcra hareketlerinin bitmiş, netice (ölüm) gerçekleşmemiş olması", puan: 15, madde: "TCK m. 35/1"}
      - {tespit: "İcra bittikten sonra kendi çabasıyla neticeyi önlemekle gönüllü vazgeçmenin bulunması", puan: 25, madde: "TCK m. 36"}
      - {tespit: "Tamam olan kısmın (kasten yaralama, yaşamı tehlikeye sokma) cezalandırılması", puan: 20, madde: "TCK m. 87/1-d"}
      - {tespit: "Eşe karşı işlendiğinden TCK m. 86/3-a'nın uygulanması", puan: 10, madde: "TCK m. 86/3"}
      - {tespit: "Gönüllü vazgeçme olmasaydı eşe karşı öldürmeye teşebbüs: ağırlaştırılmış müebbet yerine 14-21 yıl", puan: 15, madde: "TCK m. 35/2"}
      - {tespit: "Can'da gönüllü vazgeçme değil etkin pişmanlık; kovuşturma başlamadan tam iade ile üçte ikiye kadar indirim", puan: 15, madde: "TCK m. 168/1"}
    cozum: |
      **Nitelendirme:** Selin zehir vererek eşini öldürmeye girişmiş, ancak sonuç gerçekleşmemiştir. Kasten öldürmeye teşebbüs ve icra bittikten sonra gönüllü vazgeçme sorunu vardır. Can bakımından ise tamamlanmış bir suç ve etkin pişmanlık söz konusudur.

      **Hukuki sorunlar:** (1) Selin'in eylemi hangi aşamadadır? (2) İcra bittikten sonra gönüllü vazgeçmenin şartları gerçekleşmiş midir? (3) Tamam olan kısım için hangi suç oluşur? (4) Can'ın pişmanlığı hangi kuruma girer?

      **İlgili hükümler:** TCK m. 35/1 teşebbüsü, TCK m. 36 gönüllü vazgeçmeyi, TCK m. 82/1-d üstsoy, altsoy, eş gibi yakınlara karşı kasten öldürmenin ağırlaştırılmış müebbet cezasını, TCK m. 86 ve TCK m. 87/1-d yaralama suçlarını, TCK m. 168/1 etkin pişmanlığı düzenler.

      **Değerlendirme:** Selin zehri yemeğe karıştırıp Tolga'ya yedirmekle öldürme fiilini bitirmiştir; ölüm neticesi gerçekleşmediği için suç tamamlanmamıştır. İcra bittiğinden "durmak" yetmez; neticeyi önlemeye yönelik aktif çaba gerekir. Selin, evde başka kimse yokken kendisi 112'yi aramış, zehirlenmeyi ve adresi bildirmiş ve Tolga'yı hastaneye götürmüştür. Bu, ciddi ve aktif bir çabadır; neticenin gerçekleşmemesi de bu çabaya bağlıdır. Dolayısıyla TCK m. 36'daki gönüllü vazgeçme gerçekleşmiştir ve Selin öldürmeye teşebbüsten cezalandırılmaz.

      Gönüllü vazgeçme ancak teşebbüsü ortadan kaldırır; tamam olan kısım esasen bir suç oluşturuyorsa fail o suçun cezasıyla cezalandırılır. Tolga'nın zehirlenmesiyle kasten yaralama tamamlanmıştır. Eşe karşı işlendiği için TCK m. 86/3-a uygulanır; yaşamı tehlikeye sokan bir duruma neden olduğundan TCK m. 87/1-d de gündeme gelir (neticesi sebebiyle ağırlaşmış yaralama).

      Gönüllü vazgeçme olmasaydı, eşe karşı kasten öldürme TCK m. 82/1-d uyarınca ağırlaştırılmış müebbet gerektireceğinden, teşebbüste TCK m. 35/2 gereği 14-21 yıl hapis aralığı uygulanırdı.

      Can'ın telefonu çalması hırsızlıktır ve iade ile birlikte suç tamamlanmıştır; bu nedenle gönüllü vazgeçme değil, etkin pişmanlık konuşulur. İddianame kabul edilmediğinden (CMK m. 2/1-f) kovuşturma başlamamıştır; Can zararı aynen geri vererek tamamen gidermiştir. TCK m. 168/1 uyarınca verilecek cezanın üçte ikisine kadarı indirilir.

      **Sonuç:** Selin gönüllü vazgeçmiştir; öldürmeye teşebbüsten cezalandırılmaz, ancak tamam olan kısımdan, yani neticesi sebebiyle ağırlaşmış kasten yaralamadan sorumludur. Can hırsızlık suçundan sorumludur ancak TCK m. 168/1 etkin pişmanlık indiriminden yararlanır.
kartlar:
  - on: "Suç yolunun aşamaları nelerdir?"
    arka: "Düşünce, hazırlık hareketleri, icra hareketleri, tamamlanma. Düşünce ve kural olarak hazırlık cezasızdır; teşebbüs icraya başlamayla doğar (TCK m. 35/1)."
  - on: "Teşebbüsün üç şartı nedir?"
    arka: "Kasıtlı suç işleme kararı; elverişli hareketlerle doğrudan doğruya icraya başlama; suçun failin elinde olmayan nedenlerle tamamlanamaması (TCK m. 35/1)."
  - on: "5237 sayılı TCK'nın icra başlangıcı ölçütü nedir?"
    arka: "\"Doğrudan doğruya icraya başlama\"; tasarıdaki \"kastı şüpheye yer bırakmayacak\" sübjektif ölçüt metinden çıkarılmıştır. Hareket suç tipiyle yakınlık ve bağlantı taşımalıdır."
  - on: "Elverişlilik neye göre aranır?"
    arka: "Yalnız araç bakımından değil, suçun konusu dâhil bütün fiil bakımından aranır (madde gerekçesi)."
  - on: "Eksik/tam teşebbüs ayrımı 5237'de var mı?"
    arka: "Yok. Bu ayrım 765 sayılı eski TCK'ya aittir; 5237'de teşebbüs tek biçimde düzenlenir (TCK m. 35)."
  - on: "Teşebbüs cezası güncel aralıklar?"
    arka: "Ağırlaştırılmış müebbet yerine 14-21 yıl, müebbet yerine 10-18 yıl, diğer hâllerde cezanın 1/4-3/4'ü indirilir (TCK m. 35/2)."
  - on: "7550 sayılı Kanunla teşebbüs aralığı nasıl değişti?"
    arka: "4/6/2025: 13-20 yıl → 14-21 yıl; 9-15 yıl → 10-18 yıl. Önce işlenen suçlara lehe olduğundan eski aralık uygulanır (TCK m. 7/2)."
  - on: "Teşebbüs indirimi hesapta kaçıncı sırada yapılır?"
    arka: "Temel ceza ve nitelikli hâllerden sonra, indirim sebepleri arasında ilk sırada (TCK m. 61/5)."
  - on: "Taksirli suça ve olası kastla işlenen suça teşebbüs olur mu?"
    arka: "Taksirli suça teşebbüs olmaz (TCK m. 35/1 \"işlemeyi kastettiği\"). Yargıtay olası kastla teşebbüsü de kabul etmez."
  - on: "Gönüllü vazgeçmenin iki görünüşü nedir?"
    arka: "İcra hareketlerinden vazgeçme (icra bitmeden durmak yeter) ve icra bittikten sonra kendi çabasıyla suçun tamamlanmasını veya neticeyi önleme (TCK m. 36)."
  - on: "Gönüllü vazgeçmenin sonucu nedir?"
    arka: "Teşebbüsten cezasızlık (indirim değil); tamam olan kısım esasen suçsa yalnız o suçun cezası verilir (TCK m. 36)."
  - on: "Gönüllülük nasıl ayırt edilir?"
    arka: "Devam imkânı ve kanaati varken kendi iradesiyle durmak gönüllüdür; mağdurun bağırması, polisin gelmesi gibi dış etkenle durmak gönüllü değildir."
  - on: "Gönüllü vazgeçme ile etkin pişmanlık farkı?"
    arka: "Gönüllü vazgeçme suç tamamlanmadan, etkin pişmanlık tamamlandıktan sonradır. Birincisi genel hüküm (TCK m. 36), ikincisi özel hükümlerde (ör. TCK m. 168) düzenlenir."
