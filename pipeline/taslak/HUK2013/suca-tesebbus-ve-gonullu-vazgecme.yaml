  - ⚠️ **Hazırlık hareketi** (silah/zehir alma, yer gözetleme) kural olarak cezasızdır; silahı doğrultup nişan almak icradır.
  - ⚠️ **Taksirli suçlara teşebbüs olmaz;** Yargıtay'a göre olası kastla da teşebbüs mümkün değildir. Kast tek başına yetmez, icra hareketi aranır.
  - 📌 **Teşebbüs cezası (TCK m. 35/2):** ağırlaştırılmış müebbet yerine **14-21 yıl**, müebbet yerine **10-18 yıl**, diğer hâllerde cezanın **1/4-3/4'ü indirilir**. Ölçüt: zarar veya tehlikenin ağırlığı.
