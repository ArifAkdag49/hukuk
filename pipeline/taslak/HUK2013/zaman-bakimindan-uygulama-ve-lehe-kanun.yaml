ozet: |
  - **Temel kural (TCK m. 7/1 c.1; AY m. 38/1):** İşlendiği zaman suç sayılmayan fiilden ceza da güvenlik tedbiri de verilemez; kimseye suç tarihindeki cezadan daha ağır ceza verilemez. Bu güvence olağanüstü hâlde bile korunur (AY m. 15/2).
  - **Sonradan suç olmaktan çıkarma (TCK m. 7/1 c.2-3):** Fiil sonradan suç olmaktan çıkmışsa kimse cezalandırılamaz; hüküm kesinleşmiş olsa da infaz ve kanuni neticeler kendiliğinden kalkar.
  - **Lehe kanun (TCK m. 7/2):** Suç tarihindeki kanunla sonradan yürürlüğe giren kanunlar farklıysa failin lehine olan uygulanır ve infaz olunur. Aleyhe değişiklik geriye yürümez.
  - **Karşılaştırma yöntemi (5252 sayılı Kanun m. 9/3):** Lehe olan, önceki ve sonraki kanunların ilgili bütün hükümleri somut olaya ayrı ayrı uygulanıp çıkan sonuçlar karşılaştırılarak bulunur. Karma uygulama yapılamaz; iki sonuç aynıysa suç tarihindeki kanun uygulanır.
  - **Kesinleşmiş hüküm (5275 sayılı Kanun m. 98/1-a):** Lehe kanun değerlendirmesi için hükmü veren mahkemeye başvurulur; başvuru infazı kendiliğinden durdurmaz (5275 sayılı Kanun m. 98/2). Bu yargılamada dava zamanaşımı hükümleri uygulanmaz (5252 sayılı Kanun m. 9/4).
  - **İnfaz rejimi (TCK m. 7/3):** İnfaz rejimine ilişkin hükümler derhal uygulanır; hapis cezasının ertelenmesi (TCK m. 51), koşullu salıverilme (5275 sayılı Kanun m. 107) ve tekerrür (TCK m. 58) bunun dışındadır. Bunlarda lehe kanun kuralı işler.
  - **Geçici veya süreli kanun (TCK m. 7/4):** Yürürlükte bulundukları sürede işlenen suçlara, süre dolduktan sonra da uygulanmaya devam eder.
  - **Güncel örnekler:** TCK m. 52/2 (günlük 20-100 TL iken 100-500 TL, 1/6/2024), TCK m. 35/2, TCK m. 86 ve TCK m. 87 (4/6/2025, 7550 sayılı Kanun) ve TCK m. 31 (7593 sayılı Kanun) aleyhe değişikliklerdir; önceki suçlara uygulanmaz. 5275 sayılı Kanun m. 110'daki sınırların yükseltilmesi ise infaz rejimi hükmüdür ve lehedir.
  - **Tuzak:** "İnfaz hükümleri her zaman derhal uygulanır" demek yanlıştır; üç istisna vardır.
anlatim: |
  ## 1. Ana fikir: suç tarihi belirleyicidir

  Ceza hukukunda "hangi kanun?" sorusunun cevabı kural olarak **fiilin işlendiği tarihte yürürlükte olan kanundur**. Bu, kanunilik ilkesinin zaman boyutudur: insan, davranışının sonucunu davranırken bilebilmelidir. Sonradan çıkan ağır bir kanunla geriye dönük cezalandırılsaydı, kanunun önceden bilinebilirliği anlamsız kalırdı.

  Düzenleme üç katmanlıdır:

  - **Anayasa (AY m. 38/1):** Kimse, işlendiği zaman yürürlükte bulunan kanunun suç saymadığı fiilden cezalandırılamaz; kimseye suçu işlediği zaman kanunda o suç için konulmuş cezadan daha ağır ceza verilemez. AY m. 38/2 bu yasağı suç ve ceza zamanaşımı ile ceza mahkûmiyetinin sonuçları için de geçerli kılar.
  - **Olağanüstü hâl (AY m. 15/2):** Savaş, seferberlik ve olağanüstü hâllerde bile suç ve cezalar geçmişe yürütülemez. Yani bu ilke, askıya alınamayan çekirdek güvencelerdendir.
  - **Kanun (TCK m. 7):** Dört fıkra; geriye yürümezlik ve sonradan suç olmaktan çıkarma (m. 7/1), lehe kanun (m. 7/2), infaz rejimi (m. 7/3) ve geçici kanunlar (m. 7/4).

  > ⚠️ **Sınavda dikkat:** AY m. 38/1 yalnız **aleyhe** geriye yürümeyi yasaklar. Lehe kanunun geriye yürümesini Anayasa açıkça söylemez; bunu TCK m. 7/2 düzenler. Anayasa Mahkemesi de kanunilik ilkesinin lehe düzenlemelerin geriye uygulanmasını sağladığını belirtir.

  ## 2. Geriye yürümezlik (TCK m. 7/1 c.1)

  TCK m. 7/1'in ilk cümlesine göre işlendiği zaman yürürlükte bulunan kanuna göre suç sayılmayan fiilden dolayı kimseye ceza verilemez ve güvenlik tedbiri uygulanamaz. "Güvenlik tedbiri" ibaresi önemlidir: koruma yalnız hapis ve adli para cezasını değil, müsadere gibi tedbirleri de kapsar.

  > **Örnek:** Ali, 2022'de bir davranışta bulundu; o tarihte bu davranış suç değildi. 2024'te bir kanun bu davranışı suç hâline getirdi. Ali cezalandırılamaz; ona güvenlik tedbiri de uygulanamaz.

  Aynı mantık ağırlaştırma için de geçerlidir. Suç tarihinde öngörülen ceza 2-5 yıl, sonradan çıkan kanunda 4-7 yıl ise, geçmişte işlenmiş suça 4-7 yıllık aralık uygulanamaz.

  ## 3. Sonradan suç olmaktan çıkarma (TCK m. 7/1 c.2-3)

  İşlendikten sonra yürürlüğe giren kanuna göre suç sayılmayan fiilden dolayı da kimse cezalandırılamaz ve hakkında güvenlik tedbiri uygulanamaz (TCK m. 7/1 c.2). Böyle bir ceza veya güvenlik tedbiri hükmolunmuşsa **infazı ve kanuni neticeleri kendiliğinden kalkar** (TCK m. 7/1 c.3).

  "Kendiliğinden" kelimesi sınavlık: hükümlünün başvurması ya da mahkemenin ayrıca karar vermesi gerekmez. Mahkûmiyetin hukuki sonuçları (örneğin hak yoksunlukları) da ortadan kalkar.

  > **Örnek:** Bir fiil 2026'da suç olmaktan çıkarıldı. Bu fiilden 2025'te kesinleşen mahkûmiyetin infazı ve kanuni sonuçları, hükümlü bir şey yapmasa da kendiliğinden kalkar.

  > ⚠️ **Sınavda dikkat:** Suç olmaktan çıkarma ile **cezanın hafiflemesi** aynı şey değildir. Fiil suç olmaktan çıkmışsa sonuç "kendiliğinden kalkma"dır; ceza yalnızca hafiflemişse TCK m. 7/2'ye göre lehe kanun değerlendirmesi yapılır.

  ## 4. Lehe kanun (TCK m. 7/2)

  TCK m. 7/2: suçun işlendiği zaman yürürlükte bulunan kanun ile sonradan yürürlüğe giren kanunların hükümleri farklıysa failin lehine olan kanun uygulanır ve infaz olunur.

  Üç noktaya dikkat:

  1. **"Uygulanır ve infaz olunur":** Lehe kanun yalnız yargılama aşamasında değil, hüküm kesinleştikten sonra da önem taşır. "Hüküm kesinleşti, artık lehe kanun uygulanmaz" demek yanlıştır.
  2. **"Kanunların":** Metin çoğul konuşur. Öğretide baskın görüşe göre suç ile hüküm arasında yürürlüğe girip kalkan **ara kanun** da karşılaştırmaya girer. Bu pakette ara kanun için bir Yargıtay kararı okunmadığından, bu noktayı öğretideki baskın görüş olarak bil.
  3. **Fiilin işlendiği an:** Esas alınan, hükmün kurulduğu an değil suç tarihidir.

  > **Örnek:** Zeynep 2023'te bir suç işledi. 2024'te lehe bir ara kanun çıktı, 2025'te aleyhe yeni kanunla kaldırıldı; hüküm 2026'da verilecek. Üç metin de karşılaştırılır ve en lehe olan uygulanır.

  ## 5. Hangisi lehe? Karşılaştırma yöntemi

  5252 sayılı Kanun m. 9/3'e göre lehe olan hüküm, önceki ve sonraki kanunların **ilgili bütün hükümleri olaya uygulanarak**, ortaya çıkan sonuçların birbirleriyle karşılaştırılması suretiyle belirlenir. Bu yüzden:

  - **Soyut karşılaştırma yetmez.** Yalnız alt ya da üst sınıra bakmak yanıltır. Artırım, indirim, paraya çevirme, erteleme gibi bütün hükümler her kanunla ayrı ayrı uygulanır.
  - **Karma uygulama yasaktır.** Eski kanunun temel cezası ile yeni kanunun indirimi birleştirilemez. Ceza Genel Kurulu bunu, kanunların "hiçbir hükmü karıştırılmadan bir bütün halinde" uygulanması diye ifade eder.
  - **Sonuç aynıysa** sonraki kanun uygulanmaz; suç tarihindeki kanun uygulanır.
  - Mahkeme bir kurumu (takdiri indirim, seçenek yaptırım, erteleme) iki kanun bakımından da uygulamama iradesini açıkça ortaya koymuşsa, o kurum için ayrıca karşılaştırma yapılmaz.

  > **Örnek:** Yeni kanun cezanın alt sınırını yükseltmiş ama erteleme imkânı tanımış olabilir. Soyut sınırlara bakan kişi "eski lehe" der; somut olayda her iki kanun bütünüyle uygulanınca yeni kanun lehe çıkabilir. Karar, uygulama sonuçlarına göre verilir.

  > 💡 **Püf nokta:** Lehe kanun sorusunda iki ayrı hesap yap: "Eski kanunla somut ceza kaç?" ve "Yeni kanunla somut ceza kaç?" Sonra küçük olanı seç. İkisini karıştıran hesap hep yanlıştır.

  ## 6. Kesinleşmiş hükümler: uyarlama yargılaması

  Hüküm kesinleştikten sonra yeni lehe kanun çıkarsa, 5275 sayılı Kanun m. 98/1-a uyarınca değerlendirme **hükmü veren mahkemeden** istenir. Cezanın hesabındaki duraksamalar ise infaz hâkimliğine götürülür (5275 sayılı Kanun m. 98/1-b). Başvuru cezanın infazını kendiliğinden ertelemez; mahkeme olayın özelliğine göre erteleme ya da durdurmaya karar verebilir (5275 sayılı Kanun m. 98/2).

  Kesin hükümle sonuçlanmış davalarda lehe hükmün belirlenmesi ve uygulanması amacıyla yapılan yargılamada **dava zamanaşımına ilişkin hükümler uygulanmaz** (5252 sayılı Kanun m. 9/4).

  ## 7. İnfaz rejimi: derhal uygulama ve üç istisna (TCK m. 7/3)

  TCK m. 7/3: hapis cezasının ertelenmesi, koşullu salıverilme ve tekerrürle ilgili olanlar hariç; infaz rejimine ilişkin hükümler **derhal uygulanır**.

  | Kategori | Kural | Örnek |
  |---|---|---|
  | İnfaz rejimi hükümleri | Derhal uygulanır | Konutta, hafta sonu infaz (5275 sayılı Kanun m. 110) |
  | Erteleme | Lehe kanun kuralı | TCK m. 51 |
  | Koşullu salıverilme | Lehe kanun kuralı | 5275 sayılı Kanun m. 107 |
  | Tekerrür | Lehe kanun kuralı | TCK m. 58 ve 5275 sayılı Kanun m. 108 |

  Anayasa Mahkemesi, koşullu salıverilme kurallarının cezanın ne kadar çekileceğini belirlediğini, bu nedenle maddi ceza hukukuna ilişkin olduğunu ve AY m. 38 çerçevesinde değerlendirildiğini söyler. Yargıtay da koşullu salıverilme değişikliklerini TCK m. 7/2 karşılaştırmasına tabi tutar ve infazda da "çapraz ve karma" uygulamayı kabul etmez: kurumda geçirilecek süre bir düzenlemeye, denetim süresi başka bir düzenlemeye göre belirlenemez.

  > **Örnek (derhal uygulama):** 66 yaşındaki Hasan 2023'te işlediği suçtan 2 yıl 6 ay hapse mahkûm oldu, infaz sürüyor. 5275 sayılı Kanun m. 110/2'ye göre 65 yaşını bitirmişlerde konutta infaz sınırı toplam üç yıldır (önce bir yıl). Bu, infaz rejimi hükmü olduğundan derhal uygulanır; Hasan başvurabilir. Karar infaza başlandıktan sonra da verilebilir (5275 sayılı Kanun m. 110/6). Konutta infaz kesin hak değil, infaz hâkiminin vereceği bir karardır.

  > **Örnek (istisna):** İkinci defa tekerrür hükümleri uygulanan Kemal. Eski 5275 sayılı Kanun m. 108/3'e göre koşullu salıverilemezdi; yeni metne göre süreli hapis cezalarında dörtte üç oranıyla koşullu salıverilebilir. Tekerrür TCK m. 7/3'te istisna olduğundan lehe kanun kuralı işler ve yeni metin lehedir.

  > ⚠️ **Sınavda dikkat:** Kanun koyucu bazen aleyhe infaz değişikliklerini geçiş hükmüyle suç tarihine bağlar. Örneğin 7550 sayılı Kanunla 5275 sayılı Kanun m. 105/A'ya eklenen "koşullu salıverilme için gereken sürenin en az onda biri kurumda geçirilmiş olmalı" şartı, 5275 sayılı Kanunun geçici 11. maddesi uyarınca yürürlük tarihinden önce işlenen suçlara uygulanmaz.

  ## 8. Geçici veya süreli kanunlar (TCK m. 7/4)

  Geçici veya süreli kanunların, yürürlükte bulundukları süre içinde işlenmiş suçlar hakkında uygulanmasına devam edilir. Aksi hâlde, süresi dolacak kanuna uymak için bir neden kalmazdı.

  > **Örnek:** Salgın döneminde çıkarılan geçici bir kanunla suç hâline getirilen fiil, kanun yürürlükteyken işlendiyse kanunun süresi dolsa bile cezalandırılır.

  ## 9. 2024-2026 değişikliklerinden lehe kanun örnekleri

  📌 TCK m. 7'nin kendisi 2005'ten beri değişmedi; aşağıdakiler karşılaştırma malzemesidir:

  | Hüküm | Eski | Yeni |
  |---|---|---|
  | TCK m. 52/2 (1/6/2024) | Günlük 20-100 TL | Günlük 100-500 TL |
  | TCK m. 35/2 (4/6/2025) | Müebbet yerine 9-15 yıl | 10-18 yıl |
  | TCK m. 86/1 (4/6/2025) | 1-3 yıl | 1 yıl 6 ay-3 yıl |
  | TCK m. 87/1 (4/6/2025) | Alt sınırlar 3 ve 5 yıl | 4 ve 6 yıl |

  Bunların hepsi aleyhedir; önceki suçlara uygulanmaz. TCK m. 31'deki küçüklere ilişkin aralıklar da 7593 sayılı Kanunla yükseltilmiştir (değişiklik tablolarına göre yürürlük 18/8/2026); önceki suçlarda eski aralıklar lehedir. İnfazda 5275 sayılı Kanun m. 110'daki sınırların yükseltilmesi ise lehedir ve derhal uygulanır.

  > ⚠️ **Sınavda dikkat:** Eski kitaplardaki rakamlar artık eski hâldir, ama değişiklikten önce işlenen suçlarda tam da o rakamlar uygulanır. Hem eski hem yeni hâli bilmelisin.

  ## 10. Denetim şeması

  1. Fiilin işlendiği tarihi belirle.
  2. O tarihte fiil suç muydu? Değilse ceza ve güvenlik tedbiri yok (TCK m. 7/1).
  3. Fiil sonradan suç olmaktan mı çıktı? Evetse mahkûmiyet olsa bile infaz ve sonuçlar kendiliğinden kalkar.
  4. Suç tarihinden sonra farklı kanun var mı (ara kanun dahil)? Varsa her kanunu somut olaya bütünüyle uygula, sonuçları karşılaştır (5252 sayılı Kanun m. 9/3).
  5. Konu erteleme, koşullu salıverilme ya da tekerrürse lehe kanun kuralı; diğer infaz hükümlerinde derhal uygulama (TCK m. 7/3).
  6. Geçici kanun söz konusuysa TCK m. 7/4'ü ve geçiş hükümlerini kontrol et.
  7. Hüküm kesinleşmişse hükmü veren mahkemeye başvuru (5275 sayılı Kanun m. 98/1-a).
kritik: |
  - 📌 Kural: suç tarihindeki kanun. Aleyhe değişiklik geriye yürümez (AY m. 38/1, TCK m. 7/1 c.1).
  - 📌 Suç sayılmayan fiilden hem ceza hem **güvenlik tedbiri** verilemez (TCK m. 7/1).
  - 📌 Sonradan suç olmaktan çıkarma: kesinleşmiş hükmün infazı ve kanuni neticeleri **kendiliğinden** kalkar (TCK m. 7/1 c.3).
  - 📌 Lehe kanun "uygulanır ve infaz olunur" (TCK m. 7/2); hüküm kesinleşmiş olsa da uyarlama yargılaması yapılır.
  - ⚠️ AY m. 38 lehe kanunu açıkça düzenlemez; lehe kanun kuralı TCK m. 7/2'dedir.
  - 📌 Karşılaştırma somuttur: iki kanunun bütün hükümleri olaya ayrı ayrı uygulanır (5252 sayılı Kanun m. 9/3).
  - ⚠️ Karma uygulama yasaktır; infazda da kurum süresi ile denetim süresi aynı düzenlemeye göre belirlenir.
  - 📌 İki kanuna göre sonuç aynıysa suç tarihindeki kanun uygulanır.
  - 📌 Kesinleşmiş hükümde başvuru mercii hükmü veren mahkemedir; başvuru infazı kendiliğinden ertelemez (5275 sayılı Kanun m. 98/1-a, 98/2).
  - 📌 Kesin hükümden sonraki lehe kanun yargılamasında dava zamanaşımı uygulanmaz (5252 sayılı Kanun m. 9/4).
  - ⚠️ İnfaz hükümleri derhal uygulanır ama üç istisna vardır: erteleme, koşullu salıverilme, tekerrür (TCK m. 7/3).
  - 📌 Geçici veya süreli kanun, yürürlükte olduğu sürede işlenen suçlara sonradan da uygulanır (TCK m. 7/4).
  - ⚠️ Esas alınan an suç tarihidir; karar tarihi değil. 2023'te işlenip 2024'ün ikinci yarısında hükme bağlanan suçta TCK m. 52/2'nin yeni tutarı uygulanmaz.
doktrin: |
  ### İnfaz kuralları ne zaman "ceza" sayılır?

  TCK m. 7/3 infaz rejimini kural olarak derhal uygulanır kılar. Bir görüşe göre infaz kuralları cezanın kendisi değildir; bu nedenle aleyhe olsalar bile derhal uygulanabilir. Karşı görüşe göre cezanın fiilen çekilecek süresini uzatan ya da niteliğini ağırlaştıran bir infaz kuralı, adı infaz olsa da maddi anlamda cezadır ve aleyhe ise geriye yürümez. Anayasa Mahkemesi koşullu salıverilmenin cezanın ne kadar çekileceğini belirlediğini söyleyerek bu ikinci yaklaşıma yakın durur. Uluslararası insan hakları içtihadında "ceza" kavramının özerk yorumlandığı da bu tartışmada anılır.

  ### Denetimli serbestlik ve açık kuruma ayrılma

  5275 sayılı Kanun m. 105/A'daki denetimli serbestlik, TCK m. 7/3'teki istisnaya girer mi? Bir görüşe göre bu kurumlar kurumda kalınan süreyi doğrudan belirler ve koşullu salıverilmenin uzantısıdır; aleyhe değişiklik geriye yürümez. Karşı görüşe göre m. 7/3 yalnız üç kurumu sayar, istisna dar yorumlanmalıdır ve diğer her şey derhal uygulanır. Kanun koyucu, 2020 ve 2025 düzenlemelerinde sonucu suç tarihine bağlayan geçiş hükümleri koyarak somut değişiklikler için tartışmayı çözmüştür; ilke tartışması sürmektedir.

  ### Geçici kanun ve sonraki lehe kanun

  TCK m. 7/4, m. 7/2'nin istisnası mıdır? Bir görüşe göre evet: süre dolsa bile o dönemdeki suça geçici kanun uygulanır. Karşı görüş, kanun koyucu süre dolmadan fiili kalıcı olarak suç olmaktan çıkarırsa lehe kanunun uygulanması gerektiğini savunur. Sınavda yalnız metnin açık hâlini kullanmak güvenlidir.

  ### Ara kanun ve karma kurumlar

  Öğretide baskın görüş, ara kanunun da karşılaştırmaya girdiği yönündedir. Hükmün açıklanmasının geri bırakılması, uzlaştırma ve şikâyete bağlılık gibi usul ile maddi hukuk özelliği taşıyan kurumlarda lehe kanunun uygulanması ise uygulamada lehe kanun gibi değerlendirildiği kabul edilen, ama ayrıntıları tartışmalı bir alandır.
sozluk:
  - terim: Geriye yürümezlik
    tanim: "Suç ve cezaların, yürürlüğe girmeden önce işlenmiş fiillere uygulanamaması; AY m. 38/1 ve TCK m. 7/1."
  - terim: Lehe kanun
    tanim: "Suç tarihindeki kanun ile sonraki kanunlar arasında failin durumunu daha iyi kılan kanun; TCK m. 7/2."
  - terim: Karma uygulama
    tanim: "Eski ve yeni kanunların hükümlerinin birbiriyle karıştırılarak tek bir sonuç çıkarılması; yasaktır."
  - terim: Ara kanun
    tanim: "Suç tarihinden sonra yürürlüğe girip hükümden önce yürürlükten kalkan kanun; öğretide baskın görüşe göre karşılaştırmaya girer."
  - terim: Uyarlama yargılaması
    tanim: "Kesinleşmiş hükümde sonradan çıkan lehe kanunun uygulanması için hükmü veren mahkemede yapılan inceleme; 5275 sayılı Kanun m. 98/1-a."
  - terim: İnfaz rejimi
    tanim: "Cezanın çektirilme biçimine ve koşullarına ilişkin kurallar bütünü; kural olarak derhal uygulanır (TCK m. 7/3)."
  - terim: Koşullu salıverilme
    tanim: "Hükümlünün cezasının belirli bölümünü kurumda geçirip iyi hâli ile kalan kısmı denetim altında dışarıda geçirmesi; TCK m. 7/3 istisnasıdır."
  - terim: Tekerrür
    tanim: "Önceki hüküm kesinleştikten sonra yeni suç işlenmesi (TCK m. 58); TCK m. 7/3 istisnasıdır."
  - terim: Geçici (süreli) kanun
    tanim: "Yürürlük süresi baştan sınırlı kanun; süre içinde işlenen suçlara sonradan da uygulanır (TCK m. 7/4)."
  - terim: Güvenlik tedbiri
    tanim: "Cezadan ayrı yaptırım; zaman bakımından uygulamada ceza ile aynı korumadan yararlanır (TCK m. 7/1)."
  - terim: Derhal uygulama
    tanim: "Yeni kuralın suç tarihine bakılmaksızın yürürlüğe girdiği andan itibaren uygulanması."
kararlar:
  - id: "77210900"
    ozet: |
      Sanığın üzerinde 05.04.2005'te ruhsatsız iki tabanca bulundu; ilk derece mahkemesi 2006'da bir yıl hapis ve adli para cezası verdi, takdiri indirim, paraya çevirme ve ertelemeyi uygulamadı, gerekçede lehe kanun değerlendirmesi yapmadı. Özel Daire lehe kanun karşılaştırması yapılmadığı için bozdu; yerel mahkeme uygulamadığı maddeleri karşılaştırmaya gerek olmadığını söyleyerek direndi. Ceza Genel Kurulu, lehe kanunun sabit maddi olaya önceki ve sonraki kanunların hiçbir hükmü karıştırılmadan bütün hâlinde uygulanıp sonuçların karşılaştırılmasıyla bulunacağını belirtti. Ancak mahkeme bir kurumu iki kanun bakımından da uygulamama iradesini açıkça ortaya koymuşsa o kurum için ayrıca karşılaştırma yapılamaz; direnme hükmü oyçokluğuyla onandı. Karar, karma uygulama yasağını ve somut karşılaştırma yöntemini gösterir.
  - id: "981997600"
    ozet: |
      Yağma suçundan hapse mahkûm hükümlü 11.11.2015'te koşullu salıverildi; denetim süresinde 2017 ve 2018'de kasıtlı suçlar işledi ve 17.08.2020'de koşullu salıverilme geri alındı. İnfaz hâkimliği, 7242 sayılı Kanundaki lehe düzenlemeyle koşullu salıverilme tarihini öne çekip denetim süresini daha erken bitirdi ve suçların denetim süresi dışında kaldığını kabul ederek geri almayı kaldırdı. Adalet Bakanlığının istemiyle Yargıtay 1. Ceza Dairesi kararı kanun yararına bozdu. Daire, lehe düzenleme nedeniyle kurumda geçirilecek sürenin ve buna göre denetim süresinin yeniden belirlenmesi gerektiğini, ancak daha önceki koşullu salıverilme tarihinin değiştirilemeyeceğini belirtti. Geri alma konusunda 7242 öncesi ve sonrası 5275 sayılı Kanun m. 107'den hangisinin lehe olduğunun denetime elverişli biçimde gösterilmesi gerektiğini de vurguladı. Karar, infazda çapraz ve karma uygulamanın mümkün olmadığını gösterir.
  - id: "1202004500"
    ozet: |
      Sanık 07.05.2023'te işlediği bilişim sistemleriyle dolandırıcılıktan Konya 7. Ağır Ceza Mahkemesince 4 yıl 2 ay hapis ve 343 gün üzerinden günlüğü 100 TL'den hesaplanan 34.300 TL adli para cezasına mahkûm edildi; hüküm istinaf edilmeden kesinleşti. Adalet Bakanlığının istemiyle Yargıtay 11. Ceza Dairesi, günlük karşılığı artıran TCK m. 52/2 değişikliğinin 01.06.2024'te yürürlüğe girdiğini ve sanık lehine hüküm içermediğini belirtti. Bu nedenle bir gün karşılığının suç tarihindeki 20-100 TL aralığında takdir edilmesi gerekirdi. Dairenin ayrıca, temel gün sayısının haksız menfaatin iki katından az olmamasına ilişkin bir hata tespit ettiği de kararda yer alır. Karar, aleyhe sonuç doğurmamak ve yeniden yargılama yapılmamak üzere oybirliğiyle kanun yararına bozuldu. Ceza miktarını artıran değişikliklerin önceki suçlara uygulanmayacağını gösterir.
sorular:
  - soru: |
      Bir fiil, işlendikten sonra yürürlüğe giren kanunla suç olmaktan çıkarılmıştır. Fiilden dolayı verilen mahkûmiyet hükmü ise önceden kesinleşmiştir. Sonuç aşağıdakilerden hangisidir?
    siklar:
      - "Hükümlü, kesinleşmiş hükmün kaldırılması için yeniden yargılama talep etmek zorundadır."
      - "Cezanın infazı ve kanuni neticeleri kendiliğinden kalkar."
      - "Yalnızca henüz çekilmemiş ceza kısmı kalkar, kanuni neticeler devam eder."
      - "Kesinleşmiş hüküm bakımından sonraki kanun uygulanmaz."
    dogru: 1
    aciklama: |
      TCK m. 7/1 c.3'e göre böyle bir ceza veya güvenlik tedbiri hükmolunmuşsa infazı ve kanuni neticeleri kendiliğinden kalkar. Başvuru ya da ayrıca karar gerekmez; hükmün kesinleşmiş olması sonucu değiştirmez.
  - soru: |
      Aşağıdakilerden hangisi suç ve cezaların zaman bakımından uygulanmasına ilişkin doğru bir ifadedir?
    siklar:
      - "AY m. 38/1 lehe kanunun geriye yürümesini açıkça düzenler."
      - "Savaş ve olağanüstü hâllerde suç ve cezalar geçmişe yürütülebilir."
      - "AY m. 38/1 aleyhe geriye yürümeyi yasaklar; lehe kanunun geriye yürümesi TCK m. 7/2'de düzenlenmiştir."
      - "Geriye yürümezlik yalnız hapis cezası için geçerlidir, güvenlik tedbirleri kapsam dışıdır."
    dogru: 2
    aciklama: |
      AY m. 38/1 suç tarihinden sonraki ağır cezayı yasaklar; lehe kanunun geriye yürümesi TCK m. 7/2'ye dayanır. Savaş, seferberlik ve olağanüstü hâllerde bile suç ve cezalar geçmişe yürütülemez (AY m. 15/2), ayrıca TCK m. 7/1 güvenlik tedbirlerini de koruma kapsamına alır.
  - soru: |
      5252 sayılı Kanun m. 9/3'e göre lehe olan kanun nasıl belirlenir?
    siklar:
      - "Kanunlardaki ceza aralıklarının alt sınırları soyut olarak kıyaslanır."
      - "Her kanunun yalnız faile en uygun maddeleri seçilerek birleştirilir."
      - "Önceki ve sonraki kanunların ilgili bütün hükümleri olaya uygulanır ve ortaya çıkan sonuçlar karşılaştırılır."
      - "Hüküm tarihinde yürürlükte olan kanun her hâlde lehe sayılır."
    dogru: 2
    aciklama: |
      Karşılaştırma soyut değil somuttur: ilgili bütün hükümler her kanunla ayrı ayrı olaya uygulanır, sonuçlar karşılaştırılır (5252 sayılı Kanun m. 9/3). Seçilen kanun bütünüyle uygulanır; kanunların lehe hükümlerini birleştirmek karma uygulamadır ve yasaktır.
  - soru: |
      Ali'nin suçu 2025 başında işlenmiş, hüküm 2026'da kurulacaktır. Hâkim, eski kanunun temel ceza aralığını, yeni kanunun ise daha geniş bir indirim imkânını beğenip ikisini birleştirerek hüküm kurmak istemektedir. Bu yaklaşım için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Lehe kanun ilkesi gereği faile en elverişli hükümlerin birleştirilmesi zorunludur."
      - "Kanunlar karıştırılamaz; her kanun somut olaya bütünüyle uygulanıp sonuçlar karşılaştırılmalıdır."
      - "Karar tarihindeki kanun otomatik olarak uygulanır, karşılaştırma gerekmez."
      - "Yalnızca temel ceza için karşılaştırma yapılır, indirim hükümleri her zaman yeni kanundan alınır."
    dogru: 1
    aciklama: |
      Karma uygulama yapılamaz; lehe kanun ilgili bütün hükümlerin somut olaya uygulanması ve sonuçların karşılaştırılmasıyla belirlenir (5252 sayılı Kanun m. 9/3). Esas alınan an da karar tarihi değil suç tarihidir (TCK m. 7/2).
  - soru: |
      TCK m. 7/3'e göre aşağıdakilerden hangisi infaz rejimine ilişkin hükümlerin derhal uygulanması kuralının dışında (istisna) değildir?
    siklar:
      - "Hapis cezasının ertelenmesi"
      - "Koşullu salıverilme"
      - "Tekerrür"
      - "Konutta infaz gibi özel infaz usulleri"
    dogru: 3
    aciklama: |
      TCK m. 7/3, hapis cezasının ertelenmesi, koşullu salıverilme ve tekerrürle ilgili olanları derhal uygulama kuralından ayırır. Konutta ve hafta sonu infaz gibi özel infaz usulleri (5275 sayılı Kanun m. 110) bu üç kurum dışında kaldığından derhal uygulanır.
  - soru: |
      Zeynep, 15.03.2024'te adli para cezasıyla cezalandırılacak bir suç işlemiş, dosya 20.09.2024'te karara bağlanmıştır. TCK m. 52/2'de bir gün karşılığı tutarı 1/6/2024'te "yirmi ile yüz Türk Lirası" aralığından "yüz ile beşyüz Türk Lirası" aralığına çıkarılmıştır. Hâkimin bir gün karşılığını hangi aralıkta takdir etmesi gerekir?
    siklar:
      - "100-500 TL; çünkü hüküm yeni kanun döneminde kurulmuştur."
      - "20-100 TL; çünkü aleyhe değişiklik suç tarihinden sonra yürürlüğe girmiştir."
      - "Karar tarihine en yakın aralık, yani 100-500 TL, sanığa sorularak seçilir."
      - "Aralığı seçmek hâkimin takdirindedir; kanun zamanı önemsizdir."
    dogru: 1
    aciklama: |
      Esas alınan an suç tarihidir. 1/6/2024'te yürürlüğe giren artırım aleyhe olduğundan 15.03.2024'te işlenmiş suça uygulanmaz; suç tarihindeki 20-100 TL aralığı geçerlidir (TCK m. 52/2; TCK m. 7/2).
  - soru: |
      Süresi baştan sınırlı bir kanunla suç sayılan fiili Mehmet, kanun yürürlükteyken işlemiştir. Kanunun süresi dolduktan sonra Mehmet hakkında dava açılmıştır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Kanunun süresi dolduğu için Mehmet cezalandırılamaz."
      - "Süresi dolan kanun bir ara kanundur; lehe kanun gereği ceza verilemez."
      - "Geçici kanun, yürürlükte bulunduğu sürede işlenen suça uygulanmaya devam eder."
      - "Mehmet'e yalnız güvenlik tedbiri uygulanabilir."
    dogru: 2
    aciklama: |
      TCK m. 7/4'e göre geçici veya süreli kanunların, yürürlükte bulundukları süre içinde işlenmiş suçlar hakkında uygulanmasına devam edilir.
  - soru: |
      Hüküm kesinleştikten sonra yürürlüğe giren bir kanunun lehe olduğu ileri sürülmektedir. Bu değerlendirmeyi hangi merciden istemek gerekir ve başvurunun infaza etkisi nedir?
    siklar:
      - "Hükmü veren mahkemeden; başvuru kendiliğinden infazı ertelemez."
      - "Yargıtay Ceza Genel Kurulundan; başvuru infazı kendiliğinden durdurur."
      - "İnfaz savcılığından; başvuru infazı kendiliğinden durdurur."
      - "Hiçbir mercie; kesinleşmiş hükümde lehe kanun uygulanmaz."
    dogru: 0
    aciklama: |
      Sonradan yürürlüğe giren kanun hükmünün TCK m. 7 kapsamında değerlendirilmesi gerekirse hükmü veren mahkemeden karar istenir (5275 sayılı Kanun m. 98/1-a). Başvuru cezanın infazını ertelemez; mahkeme olayın özelliğine göre erteleme ya da durdurmaya karar verebilir (5275 sayılı Kanun m. 98/2).
  - soru: |
      Ayşe'nin kesinleşmiş mahkûmiyeti için lehe kanun uyarlaması yapılırken suçun dava zamanaşımı süresinin dolduğu ileri sürülmüştür. Bu itiraz bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Dava zamanaşımı dolmuşsa uyarlama yapılamaz."
      - "Uyarlama yargılamasında dava zamanaşımına ilişkin hükümler uygulanmaz."
      - "Dava zamanaşımı yalnız para cezalarında dikkate alınır."
      - "Zamanaşımı itirazı ancak Yargıtay tarafından incelenebilir."
    dogru: 1
    aciklama: |
      5252 sayılı Kanun m. 9/4'e göre kesin hükümle sonuçlanmış davalarda, sonradan yürürlüğe giren kanunla ilgili olarak lehe hükmün belirlenmesi ve uygulanması amacıyla yapılan yargılama bakımından dava zamanaşımına ilişkin hükümler uygulanmaz.
  - soru: |
      Burak, 2024'te işlediği bir suçtan hüküm giymiş ve açık kurumda cezasını çekmektedir. 7550 sayılı Kanunla 5275 sayılı Kanun m. 105/A-1'e, koşullu salıverilmeye kadar kurumda geçirilmesi gereken sürenin en az onda birinin kurumda geçirilmesi şartı eklenmiştir. Burak bakımından sonuç nedir?
    siklar:
      - "Yeni şart derhal uygulanır; çünkü denetimli serbestlik bir infaz rejimidir."
      - "Yeni şart, 5275 sayılı Kanunun geçici 11. maddesi uyarınca yürürlükten önce işlenen suçlara uygulanmaz."
      - "Yeni şart yalnız çocuk hükümlülere uygulanır."
      - "Yeni şart yalnız adli para cezalarında aranır."
    dogru: 1
    aciklama: |
      5275 sayılı Kanunun geçici 11. maddesinin 1. fıkrası, 105/A'nın birinci fıkrasında yapılan düzenlemenin maddenin yürürlüğe girdiği tarihten önce işlenen suçlar bakımından uygulanmayacağını söyler. Burak'ın suçu bu tarihten önce işlendiğinden yeni şart aranmaz.
  - soru: |
      Hasan, 10.01.2025'te silahla kasten yaralama (basit tıbbi müdahaleyle giderilemeyen yaralama) işlemiştir. TCK m. 86/1'in alt sınırı 4/6/2025'ten itibaren 1 yıl 6 ay olmuştur (önce 1 yıl). Başka hiçbir hüküm bakımından fark olmadığına göre hangi alt sınır uygulanır?
    siklar:
      - "1 yıl 6 ay; yeni kanun yürürlükte olduğu için."
      - "1 yıl; çünkü yeni alt sınır aleyhedir ve suç tarihinden sonra yürürlüğe girmiştir."
      - "Her iki alt sınırın ortalaması."
      - "Alt sınır yoktur; hâkim serbestçe belirler."
    dogru: 1
    aciklama: |
      7550 sayılı Kanunla TCK m. 86/1'in alt sınırının yükseltilmesi aleyhedir; suç bu değişiklikten önce işlendiğinden eski alt sınır (1 yıl) uygulanır (TCK m. 86; TCK m. 7/2).
  - soru: |
      Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Olağanüstü hâl ilan edilmişse aleyhe geriye yürüme geçici olarak mümkündür."
      - "AY m. 15/2'ye göre savaş, seferberlik ve olağanüstü hâllerde bile suç ve cezalar geçmişe yürütülemez."
      - "AY m. 38/1'deki güvence zamanaşımı ve mahkûmiyetin sonuçlarını kapsamaz."
      - "İdarenin düzenleyici işlemleriyle de suç ve ceza konulabilir."
    dogru: 1
    aciklama: |
      AY m. 15/2, olağanüstü dönemlerde de suç ve cezaların geçmişe yürütülemeyeceğini güvence altına alır. AY m. 38/2 aynı güvenceyi suç ve ceza zamanaşımı ile ceza mahkûmiyetinin sonuçlarına da uygular; idarenin düzenleyici işlemleriyle suç ve ceza konulamaz (TCK m. 2/2).
olaylar:
  - olay: |
      Ali, 10.03.2025'te kavgada Mehmet'in koluna bıçakla vurdu. Yaralanma basit tıbbi müdahaleyle giderilebilecek düzeyde değildir ve başka nitelikli hâl yoktur (TCK m. 86/1). Dosya 15.10.2025'te karara bağlanacaktır. Hâkim, temel cezayı alt sınırdan belirleyecek, silahla işlendiği için TCK m. 86/3-e uyarınca yarı oranında artıracak, ardından takdiri indirim olarak 1/6 oranında indirim yapacaktır. 4/6/2025'te yürürlüğe giren 7550 sayılı Kanunla TCK m. 86/1'in alt sınırı bir yıldan bir yıl altı aya çıkarılmıştır; üst sınır üç yıl olarak kalmıştır. Başka hiçbir hüküm bakımından fark yoktur.

      Hâkim, "karar tarihinde yeni kanun yürürlükte, onu uygularım" demektedir. Ali'nin avukatı ise "eski alt sınır uygulanmalı" diye itiraz etmektedir.

      1. Hangi kanun uygulanır, neden?
      2. Her iki kanuna göre somut cezayı hesaplayınız.
      3. Hâkim, eski alt sınırı yeni kanunun indirim oranıyla birleştirebilir mi?
    olcut:
      - {tespit: "Esas alınan anın suç tarihi olduğu; aleyhe değişikliğin geriye yürümediği ve lehe kanunun uygulanacağı", puan: 20, madde: "TCK m. 7/2"}
      - {tespit: "Lehe kanun belirlenirken iki kanunun bütün hükümlerinin somut olaya ayrı ayrı uygulanması", puan: 20, madde: "5252 sayılı Kanun m. 9/3"}
      - {tespit: "Eski kanunla hesap: 1 yıl, yarı oranında artırımla 1 yıl 6 ay, 1/6 indirimle 1 yıl 3 ay", puan: 20, madde: "TCK m. 86/3"}
      - {tespit: "Yeni kanunla hesap: 1 yıl 6 ay, artırımla 2 yıl 3 ay, indirimle 1 yıl 10 ay 15 gün", puan: 15, madde: "TCK m. 86/1"}
      - {tespit: "Eski kanunun lehe olduğu ve bütünüyle uygulanacağı", puan: 15, madde: "TCK m. 7/2"}
      - {tespit: "Karma uygulama yasağı: eski ve yeni kanunun hükümlerinin birleştirilemeyeceği", puan: 10, madde: "5252 sayılı Kanun m. 9/3"}
    cozum: |
      **Nitelendirme:** Olay, ceza kanununun zaman bakımından uygulanmasına ilişkindir. Suç 4/6/2025'ten önce işlenmiş, hüküm ise değişiklikten sonra kurulacaktır; sonradan yürürlüğe giren kanun (7550 sayılı Kanun) aleyhe değişiklik getirmiştir.

      **Hukuki sorunlar:** (1) Suç tarihindeki mi, karar tarihindeki mi kanun uygulanacak? (2) Lehe olan nasıl belirlenir? (3) Kanunlar karıştırılabilir mi?

      **İlgili hükümler:** AY m. 38/1 ve TCK m. 7/1, kimseye suçu işlediği zaman kanunda o suç için konulmuş cezadan daha ağır ceza verilemeyeceğini söyler. TCK m. 7/2'ye göre suç tarihindeki kanun ile sonraki kanunların hükümleri farklıysa failin lehine olan kanun uygulanır ve infaz olunur. Lehe olan, 5252 sayılı Kanun m. 9/3 uyarınca ilgili bütün hükümlerin olaya uygulanması ve sonuçların karşılaştırılmasıyla belirlenir.

      **Değerlendirme:** Esas alınan an, hükmün kurulduğu an değil fiilin işlendiği andır; hâkimin "karar tarihindeki kanunu uygularım" yaklaşımı yanlıştır. Karşılaştırma soyut değil somut yapılır. Eski kanunla: alt sınır 1 yıl; TCK m. 86/3-e uyarınca yarı oranında artırımla 1 yıl 6 ay; 1/6 indirimle 1 yıl 3 ay. Yeni kanunla: alt sınır 1 yıl 6 ay; yarı artırımla 2 yıl 3 ay; 1/6 indirimle 1 yıl 10 ay 15 gün. İkinci sonuç daha ağırdır. Ceza Genel Kurulu içtihadında da vurgulandığı gibi bu aşamada iki kanunun hükümleri karıştırılamaz; örneğin eski alt sınır ile yeni kanunun başka bir hükmü birleştirilerek üçüncü bir sonuç yaratılamaz. Bu olayda ayrıca iki kanunun başka hükümleri arasında fark bulunmadığı kabul edilmiştir.

      **Sonuç:** Ali bakımından eski kanun lehedir ve bütünüyle uygulanır; sonuç ceza 1 yıl 3 aydır. Avukatın itirazı yerindedir, hâkimin yaklaşımı yerinde değildir.
  - olay: |
      Zeynep, 01.04.2024'te adli para cezasıyla cezalandırılan bir suç işlemiştir. Hâkim, 100 gün adli para cezasına hükmedecek ve bir gün karşılığını kanuni alt sınırdan belirleyecektir. Karar 10.09.2024'te verilecektir. TCK m. 52/2'deki bir gün karşılığı aralığı 7499 sayılı Kanunla "yirmi ile yüz Türk Lirası"ndan "yüz ile beşyüz Türk Lirası"na yükseltilmiş, değişiklik 01.06.2024'te yürürlüğe girmiştir.

      Ayşe ise 20.05.2025'te müebbet hapis gerektiren kasten öldürmeye teşebbüs etmiş, hükmü 2026'da verilecektir. 4/6/2025'te yürürlüğe giren 7550 sayılı Kanunla TCK m. 35/2'de müebbet yerine hükmolunacak hapis aralığı 9-15 yıldan 10-18 yıla çıkarılmıştır. Hâkim, tüm ayrıntılar bakımından aynı olduğu varsayılan dosyada cezayı alt sınırdan belirleyecektir.

      1. Zeynep'in adli para cezası kaç liradır?
      2. Ayşe bakımından hangi hapis alt sınırı uygulanır?
      3. Her iki sonuç bakımından hangi ilke geçerlidir?
    olcut:
      - {tespit: "Zeynep bakımından esas alınan anın suç tarihi olması; 1/6/2024 değişikliğinin aleyhe olup uygulanmaması", puan: 20, madde: "TCK m. 7/2"}
      - {tespit: "Suç tarihindeki bir gün karşılığı alt sınırı 20 TL; 100 gün x 20 TL = 2.000 TL", puan: 20, madde: "TCK m. 52/2"}
      - {tespit: "Ayşe'nin suçunun 4/6/2025'ten önce işlendiği; yeni aralığın aleyhe olduğu", puan: 20, madde: "TCK m. 35/2"}
      - {tespit: "Ayşe bakımından eski aralık (9-15 yıl) uygulanır; alt sınırdan 9 yıl", puan: 20, madde: "TCK m. 7/2"}
      - {tespit: "Aleyhe değişikliğin geriye yürümezliği ilkesi (AY m. 38/1)", puan: 20, madde: "AY m. 38/1"}
    cozum: |
      **Nitelendirme:** İki alt olay da zaman bakımından uygulamaya ilişkindir; her ikisinde de suç tarihinden sonra yürürlüğe giren kanun aleyhe sonuç doğurmaktadır.

      **Hukuki sorunlar:** Suç tarihindeki mi, karar tarihindeki mi hüküm uygulanacak? Aleyhe değişiklik geriye yürür mü?

      **İlgili hükümler:** AY m. 38/1'e göre kimseye suçu işlediği zaman kanunda o suç için konulmuş cezadan daha ağır ceza verilemez. TCK m. 7/2'ye göre suç tarihindeki kanun ile sonradan yürürlüğe giren kanunlardan failin lehine olan uygulanır ve infaz olunur. Adli para cezasında bir gün karşılığı TCK m. 52/2'de, teşebbüste ağırlaştırılmış müebbet veya müebbet yerine hükmolunacak hapis aralığı TCK m. 35/2'de düzenlenmiştir.

      **Değerlendirme:** Zeynep'in suçu 01.04.2024'te, yani 1/6/2024'ten önce işlenmiştir. Karar tarihi (10.09.2024) yeni aralığın yürürlük döneminde olsa da esas alınan an suç tarihidir. Yeni aralık aleyhe olduğundan uygulanamaz; bir gün karşılığı suç tarihindeki 20-100 TL aralığında takdir edilir. Alt sınırdan belirlendiğinde 100 x 20 = 2.000 TL tutar çıkar. Yeni metinle 100 x 100 = 10.000 TL olurdu. Yargıtay'ın kanun yararına bozma kararlarında da suç tarihinden sonra artırılan günlük tutarın uygulanmasının hukuka aykırı olduğu kabul edilmiştir.

      Ayşe'nin suçu 20.05.2025'te, 4/6/2025'ten önce işlenmiştir. Eski TCK m. 35/2 aralığı 9-15 yıl, yeni aralık 10-18 yıldır. Alt sınırdan eski kanunla 9, yeni kanunla 10 yıl çıkar. Yeni kanun aleyhedir ve geriye yürümez. Not: gerçek bir dosyada karşılaştırma yalnız alt sınırla değil, olaydaki bütün hükümlerle yapılırdı (5252 sayılı Kanun m. 9/3); bu olayda diğer hükümlerin aynı olduğu varsayılmıştır.

      **Sonuç:** Zeynep 2.000 TL adli para cezası alır; Ayşe için 9 yıl hapis alt sınırı uygulanır. İki olayda da suç tarihindeki kanun lehedir ve uygulanır.
kartlar:
  - on: "TCK m. 7/1 c.1 ne diyor?"
    arka: "İşlendiği zaman suç sayılmayan fiilden dolayı ceza verilemez ve güvenlik tedbiri uygulanamaz."
  - on: "Sonradan suç olmaktan çıkarılan fiilde kesinleşmiş mahkûmiyetin akıbeti nedir?"
    arka: "İnfazı ve kanuni neticeleri kendiliğinden kalkar (TCK m. 7/1 c.3)."
  - on: "Lehe kanun ilkesinin dayanağı hangi maddedir?"
    arka: "TCK m. 7/2: suç tarihindeki kanun ile sonraki kanunlardan failin lehine olan uygulanır ve infaz olunur."
  - on: "AY m. 38/1 lehe kanunu açıkça düzenler mi?"
    arka: "Hayır. Aleyhe geriye yürümeyi yasaklar; lehe kanunun geriye yürümesi TCK m. 7/2'dedir."
  - on: "Lehe olan kanun nasıl belirlenir?"
    arka: "İlgili bütün hükümler somut olaya her kanunla ayrı ayrı uygulanır, sonuçlar karşılaştırılır (5252 sayılı Kanun m. 9/3)."
  - on: "Karma uygulama nedir, mümkün müdür?"
    arka: "Eski ve yeni kanunların hükümlerini birleştirmektir; yasaktır. İnfazda da kurum süresi ve denetim süresi aynı düzenlemeye göre belirlenir."
  - on: "İki kanuna göre sonuç aynıysa hangi kanun uygulanır?"
    arka: "Suç tarihindeki kanun; sonraki kanun uygulanmaz."
  - on: "TCK m. 7/3'te derhal uygulama kuralının üç istisnası?"
    arka: "Hapis cezasının ertelenmesi, koşullu salıverilme ve tekerrür; bunlarda lehe kanun kuralı işler."
  - on: "Kesinleşmiş hükümde lehe kanun için kime başvurulur?"
    arka: "Hükmü veren mahkemeye (5275 sayılı Kanun m. 98/1-a). Başvuru infazı kendiliğinden ertelemez (5275 sayılı Kanun m. 98/2)."
  - on: "Kesin hükümden sonraki lehe kanun yargılamasında dava zamanaşımı uygulanır mı?"
    arka: "Hayır (5252 sayılı Kanun m. 9/4)."
  - on: "Geçici kanunun süresi dolarsa o dönemdeki suç ne olur?"
    arka: "Yürürlükte bulunduğu süre içinde işlenen suçlara uygulanmaya devam edilir (TCK m. 7/4)."
  - on: "TCK m. 52/2'de bir gün karşılığı tutarı nasıl değişti?"
    arka: "1/6/2024'ten itibaren 100-500 TL (önce 20-100 TL). Önceki suçlara eski aralık uygulanır."
