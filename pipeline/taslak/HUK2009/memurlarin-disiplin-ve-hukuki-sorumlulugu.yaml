doktrin: |
  ### Yeniden ceza verme ve geçiş sorunu

  Disiplin cezası yargı kararıyla iptal edildiğinde idarenin aynı fiil için yeniden ceza verip veremeyeceği ve iki yıllık sürenin bu hâlde işleyip işlemediği uzun süre belirsizdi. Bir görüşe göre iki yıl "nihayet" süredir, iptalden sonra da aşılamaz. Karşı görüşe göre iptal üzerine yeniden ceza verilirken iki yıl işletilemez, aksi hâlde iptal kararı etkisiz kalır. 7573 sayılı Kanun bu belirsizliği giderdi. Kanundan önce iptal edilmiş ama yeniden tesis edilmemiş cezalara yeni altı aylık sürenin uygulanıp uygulanmayacağı ise tartışmalıdır: bir görüşe göre usul kuralı olarak hemen uygulanır, diğerine göre memur aleyhine olduğundan geriye yürütülemez. Sınavda bu nokta cevaplı soru olmaz.

  ### Rücuda "genel hükümler"

  DMK m. 13 rücuda "genel hükümlere" atıf yapar. Rücu davasında hangi zamanaşımının ve hangi kusur derecesinin uygulanacağı tartışmalıdır: bir görüş haksız fiil zamanaşımını esas alır, diğeri sebepsiz zenginleşme ya da genel zamanaşımını. Hafif kusurda rücunun sınırlanıp sınırlanmayacağı da tartışılır. Kesin bir süre ezberlenmemelidir.

  ### Hizmet kusuru ve kişisel kusur ayrımının yeri

  Klasik idare hukuku öğretisi, hizmetten ayrılabilen kişisel kusurda görevliye doğrudan dava açılabileceğini savunur. Yargıtay'ın 2012'den sonraki yerleşik uygulamasında ise görevle bağlantılı her kusurda dava idareye açılır ve ayrım rücu aşamasına kalır. Ayrıntısı hizmet kusuru konusundadır.

  ### Savunmanın zamanı

  Uygulama, savunmanın cezadan önceki bir aşamada alınmasını yeterli görür; soruşturma raporundan sonra alınan savunma tek başına ihlal sayılmaz. Karşı görüşe göre soruşturmacı kanaatini oluşturduktan sonra savunma istemek savunmayı önemsizleştirir.
sozluk:
  - terim: Disiplin amiri
    tanim: "Uyarma, kınama ve aylıktan kesme cezalarını vermeye yetkili, kurumun özel yönetmeliğinde belirlenen amir (DMK m. 124, 126)."
  - terim: Uyarma
    tanim: "Memura daha dikkatli olması gerektiğinin yazıyla bildirilmesi; en hafif disiplin cezası (DMK m. 125)."
  - terim: Kınama
    tanim: "Memura kusurlu olduğunun yazıyla bildirilmesi (DMK m. 125)."
  - terim: Aylıktan kesme
    tanim: "Brüt aylıktan 1/30 ile 1/8 arasında yapılan kesinti (DMK m. 125)."
  - terim: Kademe ilerlemesinin durdurulması
    tanim: "Memurun bulunduğu kademede ilerlemesinin 1 - 3 yıl durdurulması (DMK m. 125)."
  - terim: Tekerrür
    tanim: "Silinme süresi içinde aynı fiilin tekrarı; bir derece ağır ceza uygulanır (DMK m. 125)."
  - terim: Disiplin kurulu
    tanim: "Kademe durdurmada karar veren, ayrı bir ceza tayin edemeyen, cezayı kabul veya reddeden kurul (DMK m. 126, 134)."
  - terim: Disiplin zamanaşımı
    tanim: "Öğrenmeden itibaren bir ay (memurluktan çıkarmada altı ay) ve işlenmeden itibaren nihayet iki yıl içinde ceza verilememesi sonucu yetkinin düşmesi (DMK m. 127)."
  - terim: Özlük dosyası
    tanim: "Disiplin cezalarının işlendiği, eski adıyla sicil dosyası; cezalar süre sonra buradan silinebilir (DMK m. 133)."
  - terim: Rücu
    tanim: "Tazminatı ödeyen idarenin, sorumlu memura genel hükümlere göre geri başvurması (AY m. 129/5, DMK m. 13)."
  - terim: Görevden uzaklaştırma
    tanim: "Soruşturmanın herhangi bir aşamasında alınabilen ihtiyati tedbir; disiplin cezası değildir (DMK m. 137)."
kararlar:
  - id: "15b35418-ce8c-4fa1-a6f7-4732efc2f10a"
    ozet: |
      Cumhuriyet başsavcılığında zabıt kâtibi olan başvurucu hakkında mal bildirimi yükümlülüğüne aykırılık iddiasıyla hem ceza soruşturması hem idari soruşturma başlatıldı. Ceza mahkemesi, mevzuatın aradığı yazılı ihtar yapılmadığı için beraat kararı verdi. Buna rağmen Adalet Bakanlığı, DMK m. 125 uyarınca bir yıl kademe ilerlemesinin durdurulması cezası verdi. Başvurucu itirazında zamanaşımı sürelerinin dolduğunu da ileri sürdü. İdare mahkemesi ve bölge idare mahkemesi, zamanaşımı iddiasını hiç değerlendirmeden davayı reddetti. AYM, zamanaşımı iddiasının cezayı tamamen ortadan kaldırabilecek esaslı bir iddia olduğunu, bu nedenle karşılanması gerektiğini belirterek gerekçeli karar hakkının ihlal edildiğine hükmetti; ihtar iddiası ise sonuca etkili bulunmadı. Beraatin disiplin sorumluluğuna engel olmadığı ve DMK m. 127'deki iki sürenin ayrı ayrı denetlendiği ilkesi bu karardan çıkarılır.
  - id: "c0763f93-7165-cea1-6065-084ad25876b1"
    ozet: |
      Başvurucu kolunu cama çarparak yaraladı; devlet hastanesi acil servisindeki müdahale sonrası kolu sakat kaldı. Görevli doktorlar hakkında görevi kötüye kullanma suçundan ceza davası açıldı; biri beraat etti, diğeri hakkında hükmün açıklanmasının geri bırakılmasına karar verildi. Başvurucu doktorlara karşı asliye hukuk mahkemesinde maddi ve manevi tazminat davası açtı. Mahkeme, kamu görevlisi sıfatı taşıyan doktorlara husumet yöneltilemeyeceği, davanın idareye karşı idari yargıda açılması gerektiği gerekçesiyle davayı husumetten reddetti; Yargıtay onadı. AYM, Yargıtay Hukuk Genel Kurulunun 2012'de içtihat değiştirerek görev sırasında ve görev bağlantısıyla işlenen eylemlerde davanın idareye açılması gerektiği sonucuna vardığını aktardı. İçtihat değişikliğinin tek başına hukuki güvenlik ilkesini ihlal etmediğini belirtti; yalnız makul sürede yargılanma hakkının ihlal edildiğine karar verdi. Görevle ilgisiz eylemlerde ise görevlinin kişisel sorumlu olduğu ve davanın doğrudan ona açılacağı vurgulandı.
sorular:
  - soru: |
      Memurlara savunma hakkı tanınmadıkça disiplin cezası verilemeyeceğini ve disiplin kararlarının yargı denetimi dışında bırakılamayacağını düzenleyen Anayasa hükmü hangisidir?
    siklar:
      - "AY m. 128"
      - "AY m. 129"
      - "AY m. 40"
      - "AY m. 70"
    dogru: 1
    aciklama: |
      AY m. 129/2 savunma hakkı tanınmadıkça memurlara disiplin cezası verilemeyeceğini, AY m. 129/3 ise disiplin kararlarının yargı denetimi dışında bırakılamayacağını söyler. AY m. 128 memurluğun genel ilkelerini, AY m. 40 temel hakların korunmasını, AY m. 70 kamu hizmetine girme hakkını düzenler.
  - soru: |
      Memur S. hakkında yürütülen soruşturmada kendisine savunma için üç günlük süre verilmiş, S. bu süre içinde savunma vermemiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "S. savunma hakkından vazgeçmiş sayılır ve ceza verilebilir."
      - "Savunma alınmadan ceza verilemez; verilen süre 7 günden az olamayacağından S. vazgeçmiş sayılamaz."
      - "Savunma süresi için kanunda alt sınır yoktur; idare süreyi dilediği gibi belirler."
      - "Savunma yalnızca memurluktan çıkarma cezasında alınır."
    dogru: 1
    aciklama: |
      DMK m. 130'a göre savunması alınmadan disiplin cezası verilemez; savunma hakkından vazgeçmiş sayılmak için süre 7 günden az olmamak üzere verilmelidir. Savunma zorunluluğu yalnız memurluktan çıkarmaya özgü değildir (AY m. 129/2).
  - soru: |
      DMK m. 125'e göre aylıktan kesme cezası hangi biçimde uygulanır?
    siklar:
      - "Brüt aylıktan 1/30 ile 1/8 arasında kesinti yapılır."
      - "Net aylığın yarısı bir yıl kesilir."
      - "Bulunduğu kademede ilerleme 1 - 3 yıl durdurulur."
      - "Brüt aylığın ¼ ile ½'si kesilir."
    dogru: 0
    aciklama: |
      Aylıktan kesme, memurun brüt aylığından 1/30 - 1/8 arasında kesinti yapılmasıdır (DMK m. 125). Kademe ilerlemesinin 1-3 yıl durdurulması ise ayrı bir cezadır; ¼-½ kesinti yalnızca son kademelerdeki memurlar için kademe durdurma yerine uygulanan özel bir kuraldır.
  - soru: |
      Bir kurumda memur A, iş sahibine hakaret etmiş ve kademe ilerlemesinin durdurulması cezasını gerektiren bir fiil işlemiştir. Disiplin amiri, soruşturmayı tamamladıktan sonra kendisi bu cezayı vermiştir. Bu işlem hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İşlem hukuka uygundur; her ceza disiplin amirince verilir."
      - "İşlem hukuka aykırıdır; kademe durdurma disiplin kurulu kararı alındıktan sonra atamaya yetkili amirce verilir."
      - "İşlem hukuka aykırıdır; bu ceza yalnızca yüksek disiplin kurulunca doğrudan verilir."
      - "İşlem hukuka uygundur; yalnız memurluktan çıkarma için kurul kararı aranır."
    dogru: 1
    aciklama: |
      DMK m. 126'ya göre uyarma, kınama ve aylıktan kesmeyi disiplin amirleri verir. Kademe ilerlemesinin durdurulması, memurun bağlı olduğu kurumdaki disiplin kurulunun kararı alındıktan sonra atamaya yetkili amirce verilir. Yüksek disiplin kurulu memurluktan çıkarmada karar organıdır.
  - soru: |
      Memur M., 3/3/2027 günü özürsüz olarak göreve gelmemiştir. Disiplin amiri bunu 4/3/2027'de öğrenmiş, disiplin soruşturmasını 20/4/2027'de başlatmıştır. Amir aylıktan kesme cezası vermek istemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Ceza verilebilir; ceza verme süresi iki yıldır ve dolmamıştır."
      - "Ceza verilemez; öğrenmeden itibaren bir ay içinde soruşturma başlatılmadığı için yetki zamanaşımına uğramıştır."
      - "Ceza verilemez; memurluktan çıkarmada süre altı ay olduğundan altı aya kadar beklenebilir."
      - "Ceza verilebilir; soruşturmanın başlama süresi fiilin işlendiği tarihten itibaren altı aydır."
    dogru: 1
    aciklama: |
      Bir gün özürsüz göreve gelmemek aylıktan kesme gerektirir (DMK m. 125/C-b). DMK m. 127/1-a'ya göre aylıktan kesme cezasında öğrenmeden itibaren bir ay içinde disiplin soruşturmasına başlanmazsa ceza verme yetkisi zamanaşımına uğrar. İki yıllık süre ikinci bir sınırdır; birinci süre dolduğundan ceza verilemez.
  - soru: |
      DMK m. 127/2'deki disiplin cezası verme zamanaşımı ile ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İki yıllık süre 7573 sayılı Kanunla (2026) ilk kez getirilmiştir ve öğrenme tarihinden başlar."
      - "Süre fiilin işlendiği tarihten başlar; nihayet iki yıldır ve 2026 değişikliğinin yeniliği iptal edilen cezanın yeniden verilmesine süre getirmesidir."
      - "Süre fiilin öğrenildiği tarihten başlar ve bir yıldır."
      - "Yargı kararıyla iptal edilen cezanın yeniden verilmesi hiçbir şekilde mümkün değildir."
    dogru: 1
    aciklama: |
      DMK m. 127/2'ye göre fiilin işlendiği tarihten itibaren nihayet iki yıl içinde ceza verilmezse ceza verme yetkisi zamanaşımına uğrar; bu süre eski metinde de vardı. 7573 sayılı Kanunla fıkra değiştirilerek iptal edilen cezanın kalan süre içinde, süre dolmuşsa ya da altı aydan az kalmışsa en geç altı ay içinde, karar gerekçesi dikkate alınarak yeniden verilebilmesi öngörüldü.
  - soru: |
      Memur K.'ya verilen kınama cezası, Ekim 2026'da idare mahkemesince iptal edilmiş ve karar idareye 1 Kasım 2026'da ulaşmıştır. Ceza verme zamanaşımı süresinin dolmuş olduğu anlaşılmaktadır. DMK m. 127/2'nin güncel metnine göre idare ne yapabilir?
    siklar:
      - "Hiçbir yeni ceza veremez; süre dolmuştur."
      - "Kararın idareye ulaştığı tarihten itibaren en geç altı ay içinde, karar gerekçesi dikkate alınarak yeniden disiplin cezası tesis edebilir."
      - "Kararın idareye ulaştığı tarihten itibaren iki yıl içinde yeniden ceza tesis edebilir."
      - "Karar gerekçesine bakmaksızın dilediği cezayı süresiz olarak verebilir."
    dogru: 1
    aciklama: |
      DMK m. 127/2'ye göre disiplin cezasının yargı kararıyla iptali hâlinde zamanaşımı süresi dolmuşsa ya da altı aydan daha az süre kalmışsa en geç altı ay içinde, karar gerekçesi dikkate alınarak yeniden ceza tesis edilebilir. İki yıl, bu yeniden tesis süresi değildir.
  - soru: |
      Mal bildiriminde bulunmayan memur P. hakkında ceza mahkemesi beraat kararı vermiştir. İdare aynı fiil nedeniyle P.'ye kademe ilerlemesinin durdurulması cezası vermek istemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Beraat kararı kesinleştiği için disiplin cezası verilemez."
      - "Ceza kovuşturmasının sonucu beklenmelidir; disiplin kovuşturması bekletilir."
      - "Memurun mahkûm olması veya olmaması disiplin cezasının uygulanmasına engel olamaz; ceza verilebilir."
      - "Disiplin cezası ancak mahkûmiyet hâlinde verilebilir."
    dogru: 2
    aciklama: |
      DMK m. 131'e göre ceza kovuşturması disiplin kovuşturmasını geciktiremez; memurun ceza kanununa göre mahkûm olması veya olmaması da disiplin cezasının uygulanmasına engel değildir. Belirlenen durum ve sürelerde mal bildiriminde bulunmamak kademe durdurmayı gerektiren fiildir (DMK m. 125/D-j).
  - soru: |
      Memura verilen uyarma cezasına karşı itiraz süresi ve mercii bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Tebliğden itibaren 30 gün içinde disiplin amirine"
      - "Tebliğden itibaren 7 gün içinde yüksek disiplin kuruluna"
      - "Tebliğden itibaren 7 gün içinde disiplin kuruluna"
      - "Fiilin öğrenilmesinden itibaren bir ay içinde idare mahkemesine"
    dogru: 2
    aciklama: |
      DMK m. 135'e göre uyarma, kınama ve aylıktan kesme cezalarına karşı disiplin kuruluna, kademe ilerlemesinin durdurulmasına karşı yüksek disiplin kuruluna itiraz edilir; süre tebliğden itibaren yedi gündür. İtiraz mercii otuz gün içinde karar verir. Her hâlde idari yargıya da başvurulabilir.
  - soru: |
      Memurluktan çıkarma dışındaki disiplin cezalarının özlük dosyasından silinmesi bakımından DMK m. 133'e göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Tüm cezalar 5 yıl sonra kendiliğinden silinir."
      - "Uyarma ve kınama uygulamadan 5 yıl, diğerleri 10 yıl sonra, memurun başvurusu ve davranışlarının isteğini haklı kılması hâlinde silinebilir."
      - "Uyarma 1 yıl, kınama 2 yıl sonra kendiliğinden silinir."
      - "Silinme yalnızca mahkeme kararıyla mümkündür."
    dogru: 1
    aciklama: |
      DMK m. 133'e göre memurluktan çıkarma dışındaki ceza alan memur, uyarma ve kınama için uygulamadan 5, diğer cezalar için 10 yıl sonra atamaya yetkili amire başvurabilir. Süre içindeki davranışlar isteğini haklı kılmalıdır; silinme kendiliğinden olmaz.
  - soru: |
      Belediye zabıta memuru Z., görevi sırasında kusurlu biçimde bir esnafın tezgâhını devirmiş, mallar zarar görmüştür. Esnaf tazminat istemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Dava yalnızca Z.'ye karşı açılabilir; belediye sorumlu tutulamaz."
      - "Esnaf Z.'ye değil belediyeye dava açar; belediye ödemesi hâlinde genel hükümlere göre Z.'ye rücu edebilir."
      - "Esnaf hem Z.'ye hem belediyeye aynı davada zorunlu olarak dava açmalıdır."
      - "Belediye hiçbir hâlde Z.'ye rücu edemez."
    dogru: 1
    aciklama: |
      AY m. 129/5 ve DMK m. 13'e göre kişiler, kamu hukukuna tabi görevlerle ilgili zararlar için personel aleyhine değil ilgili kurum aleyhine dava açar. Kurumun genel hükümlere göre sorumlu personele rücu hakkı saklıdır.
  - soru: |
      DMK m. 12 ile DMK m. 13 arasındaki fark bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "DMK m. 12 üçüncü kişiye verilen zararı, DMK m. 13 idareye verilen zararı düzenler."
      - "DMK m. 12 memurun idareye verdiği zararı, DMK m. 13 üçüncü kişilerin uğradığı zararı ve idarenin rücu hakkını düzenler."
      - "Her iki madde de yalnızca disiplin cezalarını düzenler."
      - "DMK m. 13'e göre rücu hakkı mağdura aittir."
    dogru: 1
    aciklama: |
      DMK m. 12, memurun kasıt, kusur, ihmal veya tedbirsizliğiyle idareyi uğrattığı zararın rayiç bedeli üzerinden memurca ödenmesini düzenler. DMK m. 13 ise kişilerin görevle ilgili zararları için idareye dava açacağını ve idarenin sorumlu personele rücu hakkının saklı olduğunu söyler. Rücu hakkı mağdurun değil idarenin hakkıdır.
olaylar:
  - olay: |
      Memur S., belediyenin imar müdürlüğünde çalışmaktadır. Amiri, S.'nin bir iş sahibine hakaret ettiğini öğrenmiş ve soruşturma açmıştır. Soruşturmacı S.'ye savunma vermesi için 3 gün süre tanımış, S. bu süre içinde savunma vermemiştir. Bunun üzerine amir, S.'ye kademe ilerlemesinin durdurulması cezasını disiplin kuruluna götürmeden kendisi vermiştir. Ceza S.'ye tebliğ edilmiştir. S., cezanın hukuka aykırı olduğunu düşünmekte ve ne yapabileceğini sormaktadır.

      1. S.'nin fiili hangi disiplin cezasını gerektirir?
      2. Verilen savunma süresi ve S.'nin savunma vermemesi karşısında ceza verilebilir mi?
      3. Amirin bu cezayı kendisinin vermesi hukuka uygun mudur?
      4. S. cezaya karşı itiraz edecekse süre, merci ve ardından hangi yol söz konusudur?
    olcut:
      - {tespit: "İş sahibine hakaretin kademe ilerlemesinin durdurulmasını gerektirdiğinin saptanması", puan: 15, madde: "DMK m. 125"}
      - {tespit: "Savunma alınmadan disiplin cezası verilemeyeceği (Anayasal güvence)", puan: 15, madde: "AY m. 129"}
      - {tespit: "Savunma süresinin 7 günden az olamayacağı; 3 günlük süre nedeniyle S.'nin vazgeçmiş sayılamayacağı", puan: 20, madde: "DMK m. 130"}
      - {tespit: "Kademe durdurmanın disiplin kurulu kararından sonra atamaya yetkili amirce verilmesi gerektiği; amirin tek başına veremeyeceği", puan: 20, madde: "DMK m. 126"}
      - {tespit: "İtirazın tebliğden itibaren 7 gün içinde yüksek disiplin kuruluna yapılacağı ve kurumun 30 gün içinde karar vereceği", puan: 20, madde: "DMK m. 135"}
      - {tespit: "Ayrıca idari yargı yolunun açık olması", puan: 10, madde: "DMK m. 135"}
    cozum: |
      **Nitelendirme:** Olay, bir belediye memuruna kademe ilerlemesinin durdurulması cezası verilmesinde yetki ve savunma usulünün hukuka uygunluğuna ilişkindir. Memur DMK kapsamında olduğundan disiplin hükümleri uygulanır.

      **Hukuki sorunlar:** (1) Fiilin hangi cezayı gerektirdiği, (2) savunma süresinin yeterliliği ve savunma hakkının sonucu, (3) cezayı vermeye yetkili merci, (4) itiraz ve yargı yolu.

      **İlgili hükümler:** DMK m. 125/D-l, amirine, maiyetindekilere, iş arkadaşlarına veya iş sahiplerine hakarette bulunmak veya bunları tehdit etmeyi kademe ilerlemesinin durdurulmasını gerektiren fiil sayar. AY m. 129/2 ve DMK m. 130'a göre savunma alınmadan ceza verilemez; soruşturmayı yapanın verdiği süre 7 günden az olmamalıdır, ancak böyle bir sürede savunma yapılmazsa memur vazgeçmiş sayılır. DMK m. 126'ya göre kademe durdurma, disiplin kurulu kararı alındıktan sonra atamaya yetkili amirce verilir. DMK m. 135'e göre kademe durdurmaya karşı yüksek disiplin kuruluna, tebliğden itibaren 7 gün içinde itiraz edilir; merci otuz gün içinde karar verir; idari yargı yolu da açıktır.

      **Değerlendirme:** Hakaret fiili DMK m. 125/D-l kapsamındadır ve doğru ceza kademe durdurmadır. Ancak S.'ye tanınan 3 günlük savunma süresi, DMK m. 130/2'deki 7 günden az olmamak şartına aykırıdır. Bu nedenle S. savunma hakkından vazgeçmiş sayılamaz; savunması hukuka uygun biçimde alınmadığından ceza AY m. 129/2 ve DMK m. 130/1 nedeniyle sakattır. Ayrıca yetki bakımından amir, kademe durdurmayı disiplin kuruluna götürmeden tek başına veremez; yetki ve şekil sakatlığı vardır. Usulüne uygun verilmiş olsaydı S. tebliğden itibaren 7 gün içinde yüksek disiplin kuruluna itiraz edebilirdi; ayrıca idari yargıda dava yolu da mevcuttur.

      **Sonuç:** Fiil kademe durdurma gerektirir, ancak ceza hem savunma süresi hem yetki bakımından hukuka aykırıdır. S., cezaya karşı tebliğden itibaren 7 gün içinde yüksek disiplin kuruluna itiraz edebilir ve idari yargıya başvurabilir.
  - olay: |
      Belediyede memur olan M., 3/3/2027 günü özürsüz olarak göreve gelmemiştir. Disiplin amiri bunu 4/3/2027'de öğrenmiş ve soruşturmayı 20/4/2027'de başlatmıştır. Amir, M.'ye aylıktan kesme cezası vermek istemektedir.

      Aynı belediyenin zabıta memuru Z., görevi sırasında kusurlu biçimde bir esnafın tezgâhını devirmiş, esnafın malları zarar görmüştür. Esnaf, Z. aleyhine asliye hukuk mahkemesinde dava açmayı düşünmektedir. Z. hakkında ceza mahkemesinde ayrı bir yargılama da yürümektedir.

      1. M.'ye aylıktan kesme cezası verilebilir mi?
      2. Soruşturma 15/3/2027'de başlatılmış olsaydı ceza için hangi süre sınırları işlerdi?
      3. Esnaf kime karşı dava açmalıdır?
      4. Tazminat ödenirse belediye Z. bakımından ne yapabilir; ceza yargılaması disiplin sorumluluğunu etkiler mi?
    olcut:
      - {tespit: "Bir günlük özürsüz devamsızlığın aylıktan kesme gerektirdiği ve öğrenmeden itibaren bir ay içinde soruşturma başlatılmadığı için yetkinin zamanaşımına uğradığı", puan: 25, madde: "DMK m. 127"}
      - {tespit: "Soruşturma zamanında başlasa da ceza verme yetkisinin fiilden itibaren nihayet iki yıl ve soruşturma bitiminden itibaren 15 gün sınırlarına tabi olduğu", puan: 20, madde: "DMK m. 128"}
      - {tespit: "Esnafın Z.'ye değil, belediyeye (idareye) dava açması gerektiği", puan: 20, madde: "AY m. 129"}
      - {tespit: "Belediyenin ödediği tazminat için genel hükümlere göre Z.'ye rücu hakkının saklı olduğu", puan: 20, madde: "DMK m. 13"}
      - {tespit: "Ceza yargılamasının sonucunun disiplin sorumluluğuna engel olmadığı, sorumlulukların birbirinden bağımsız olduğu", puan: 15, madde: "DMK m. 131"}
    cozum: |
      **Nitelendirme:** Olay iki bölümlüdür. İlkinde memur M.'nin disiplin zamanaşımı, ikincisinde zabıta memuru Z.'nin verdiği zarardan doğan hukuki sorumluluk ve rücu sorulmaktadır.

      **Hukuki sorunlar:** (1) DMK m. 127'ye göre ceza verme yetkisinin zamanaşımına uğrayıp uğramadığı, (2) zamanında başlayan soruşturmada işleyecek süreler, (3) üçüncü kişinin zararı için doğru davalı, (4) rücu ve disiplin sorumluluğunun bağımsızlığı.

      **İlgili hükümler:** DMK m. 125/C-b özürsüz bir veya iki gün göreve gelmemeyi aylıktan kesme gerektiren fiil sayar. DMK m. 127/1-a'ya göre fiilin işlendiğinin öğrenildiği tarihten itibaren bir ay içinde disiplin soruşturmasına başlanmazsa ceza verme yetkisi zamanaşımına uğrar. DMK m. 127/2'ye göre fiilin işlendiği tarihten itibaren nihayet iki yıl içinde ceza verilmezse yetki zamanaşımına uğrar. DMK m. 128/1'e göre disiplin amiri aylıktan kesme cezasını soruşturmanın tamamlandığı günden itibaren 15 gün içinde vermek zorundadır. AY m. 129/5 ve DMK m. 13/1'e göre kişiler görevle ilgili zararlar için personel aleyhine değil ilgili kurum aleyhine dava açar; kurumun genel hükümlere göre sorumlu personele rücu hakkı saklıdır. DMK m. 131'e göre memurun ceza kanununa göre mahkûm olması veya olmaması disiplin cezasının uygulanmasına engel değildir.

      **Değerlendirme:** M.'nin bir günlük özürsüz devamsızlığı aylıktan kesmeyi gerektirir. Amir fiili 4/3/2027'de öğrenmiştir; öğrenmeden itibaren bir ay içinde soruşturma başlamamıştır (20/4/2027). Bu nedenle ceza verme yetkisi DMK m. 127/1-a gereğince zamanaşımına uğramıştır. Soruşturma 15/3/2027'de başlasaydı, ceza hem soruşturmanın bitiminden itibaren 15 gün içinde (DMK m. 128/1) hem de fiilin işlendiği tarihten itibaren iki yıllık nihayet süre içinde (DMK m. 127/2) verilmek zorunda olurdu. Z. bakımından esnaf, Z.'ye karşı adli yargıda değil, belediyeye karşı dava açmalıdır. Belediye tazminatı öderse genel hükümlere göre Z.'ye rücu edebilir. Rücu davasının zamanaşımı ve kusur derecesi tartışmalı olduğundan bu noktada kesin bir süreye hükmedilmemelidir. Z.'nin ceza yargılaması disiplin sorumluluğunu engellemez.

      **Sonuç:** M.'ye aylıktan kesme cezası verilemez. Esnaf belediyeye dava açar; belediye rücu hakkını Z.'ye karşı kullanabilir. Disiplin, ceza ve tazminat sorumlulukları birbirinden bağımsız yürür.
kartlar:
  - on: "Disiplin cezası için Anayasa'daki iki güvence nedir?"
    arka: "Savunma hakkı tanınmadıkça ceza verilemez (AY m. 129/2); disiplin kararları yargı denetimi dışında bırakılamaz (AY m. 129/3)."
  - on: "DMK'daki beş disiplin cezası hangileridir?"
    arka: "Uyarma, kınama, aylıktan kesme (brüt aylığın 1/30-1/8'i), kademe ilerlemesinin durdurulması (1-3 yıl), Devlet memurluğundan çıkarma (DMK m. 125)."
  - on: "Devamsızlığın cezası nasıl basamaklanır?"
    arka: "Özürsüz 1-2 gün aylıktan kesme (C-b); kesintisiz 3-9 gün kademe durdurma (D-b); bir yılda toplam 20 gün memurluktan çıkarma (E-d) (DMK m. 125)."
  - on: "Siyasi parti ile ilgili fiiller hangi cezaları gerektirir?"
    arka: "Partiye girmek memurluktan çıkarma (E-c); parti yararına veya zararına fiilen faaliyette bulunmak kademe durdurma (D-o) (DMK m. 125)."
  - on: "Tekerrür ve hafifletme nasıl işler?"
    arka: "Silinme süresi içinde aynı fiil tekrarlanırsa bir derece ağır ceza. Ödül veya başarı belgesi alan, geçmişi olumlu memura bir derece hafif ceza uygulanabilir; bu takdirdir (DMK m. 125)."
  - on: "Hangi ceza hangi merci tarafından verilir?"
    arka: "Uyarma, kınama, aylıktan kesme: disiplin amiri. Kademe durdurma: disiplin kurulu kararından sonra atamaya yetkili amir. Memurluktan çıkarma: yüksek disiplin kurulu (DMK m. 126)."
  - on: "Disiplin kurulu cezayı değiştirebilir mi?"
    arka: "Hayır; yalnız kabul veya ret eder. Ret hâlinde atamaya yetkili amir 15 gün içinde başka bir ceza verebilir (DMK m. 126)."
  - on: "Savunma süresi ve sonucu nedir?"
    arka: "Savunma alınmadan ceza verilemez. Süre 7 günden az olamaz; bu süre içinde savunma yapmayan vazgeçmiş sayılır (DMK m. 130)."
  - on: "DMK m. 127'deki iki zamanaşımı nedir?"
    arka: "Öğrenmeden itibaren bir ay (memurluktan çıkarmada altı ay) içinde soruşturma başlanmazsa yetki düşer (127/1). Fiilin işlendiği tarihten itibaren nihayet iki yıl içinde ceza verilmezse yetki düşer (127/2)."
  - on: "7573 sayılı Kanunun (2026) DMK m. 127/2'deki yeniliği nedir?"
    arka: "İki yıllık süre yeni değildir. Yargı kararıyla iptal edilen cezanın kalan sürede, süre dolmuşsa ya da altı aydan az kalmışsa en geç altı ay içinde, gerekçeye uygun yeniden verilebilmesi getirildi."
  - on: "Ceza mahkemesindeki beraat disiplin cezasını engeller mi?"
    arka: "Hayır. Ceza kovuşturması disiplini geciktirmez; mahkûmiyet veya beraat disiplin cezasına engel olmaz (DMK m. 131)."
  - on: "Üçüncü kişinin zararında dava kime açılır, rücu kimin hakkıdır?"
    arka: "Dava idareye açılır (AY m. 129/5, DMK m. 13). İdare ödeme yaparsa sorumlu personele genel hükümlere göre rücu eder; rücu hakkı idarenindir."
