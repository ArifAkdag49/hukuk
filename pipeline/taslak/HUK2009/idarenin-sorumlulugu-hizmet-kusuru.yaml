    tanim: "Kusuru işleyen görevlinin kim olduğunun bulunmasının şart olmadığı, kusurun hizmete mal edildiği nitelik."
  - terim: Hizmetten ayrılabilen kişisel kusur
    tanim: "Kamu hizmetiyle ilgisi olmayan, görevlinin özel hayatından ve özel tutumundan kaynaklanan kusur."
  - terim: Hizmetten ayrılamayan kusur
    tanim: "Görev yapılırken işlenen, görevle bağlantılı kusur; zarar gören karşısında hizmet kusuru olarak idareye yüklenir."
  - terim: Rücu
    tanim: "İdarenin ödediği tazminatı genel hükümlere göre sorumlu görevliden geri istemesi (DMK m. 13/1; AY m. 129/5)."
  - terim: Müterafik kusur
    tanim: "Zarar görenin zararın doğmasına veya artmasına katkı sağlayan kendi kusuru; tazminatın azaltılması veya kaldırılması sebebidir."
  - terim: Zımni ret
    tanim: "İdarenin başvuruya 30 gün içinde cevap vermemesi; istek reddedilmiş sayılır ve dava süresi bu sürenin bittiği tarihten başlar (İYUK m. 13/1)."
kararlar:
  - id: "1064398100"
    ozet: |
      Davacı şirketin akaryakıt istasyonu ve diğer yapıları belediyenin verdiği yapı ruhsatlarıyla yapıldı. Ruhsatlar imar planına ve karayolu kenarı mesafe kurallarına aykırı bulunarak iptal edildi, yapılar belediye encümeni kararıyla yıkıldı. Şirket zararının giderilmesi için tam yargı davası açtı. İlk derece mahkemesi belediyenin hizmet kusurunu kabul etti ve yapım ile yıkım giderlerini faiziyle hükmetti. Bölge idare mahkemesi ise açık hata varsa burada belediye organ üyelerinin kişisel kusuru bulunduğunu, bu nedenle idarenin sorumlu olmadığını söyleyerek davayı tümden reddetti. Danıştay İdari Dava Daireleri Kurulu, bu kararı kendi gerekçesiyle onadı: hizmet kusurunun tanımını ve üç görünümünü hatırlattı, önce hizmet kusurunun araştırılacağını belirtti ve şirketin ortağının ruhsat veren belediyenin karar organlarında bulunması nedeniyle aykırılığı bilmediğinin ileri sürülemeyeceğini, bilerek ve isteyerek kendi kusuruyla uğradığı zarardan idarenin sorumlu tutulamayacağını söyledi. Karar oyçokluğuyla verildi; karşı oylar tazminatın indirilmesi veya bozma yönündedir. Karar, kişisel kusur gerekçesini değil zarar görenin kendi kusurunu esas aldığı için dikkatle okunmalıdır.
  - id: "1185421500"
    ozet: |
      Van'da yaklaşık yedi yaşındaki bir çocuk evinin yakınındaki arazide hayvan saldırısı sonucu öldü. Yakınları iki belediye ile valiliğe karşı maddi ve manevi tazminat davası açtı. İlk derece mahkemesi, kontrolsüz beslenme alanlarının oluşmasına ve güvenlik çiti, kısırlaştırma, işaretleme gibi önlemlerin alınmamasına dayanarak idarelerin hizmet kusurunu kabul etti, kusuru idareler arasında paylaştırdı ve gözetimi ihmal eden ana-babaya da müterafik kusur verdi. Danıştay 8. Daire bölge idare mahkemesi kararını oyçokluğuyla bozdu: ilgili görevlerin sonradan ayrı tüzel kişiliği olan Doğa Koruma ve Milli Parklar Genel Müdürlüğüne geçtiğini, kamu hizmetinin devamlılığı gereği Genel Müdürlüğün de hasım gösterilmesi gerektiğini belirtti; ayrıca dava açma süresi geçtikten sonra miktar artırım dilekçesiyle istenen faizin davanın genişletilmesi olduğunu söyledi. Karar, idarenin önlem alma ve işleyişi kontrol yükümlülüğünün ihlalini hizmet kusuru saydığı için konuyu örnekler; kusur oranlarını ayrıca onamadığı için oranlar kesin bilgi olarak alınmamalıdır.
sorular:
  - soru: |
      Aşağıdakilerden hangisi idarenin hizmet kusurunu en doğru biçimde tanımlar?
    siklar:
      - "Hizmetin kuruluşunda, düzenlenişinde veya işleyişinde ortaya çıkan nesnel bozukluk, aksaklık veya boşluk"
      - "Görevlinin kasten veya ağır ihmalle zarar vermesi"
      - "Zararı doğuran görevlinin kimliğinin belirlenmiş olduğu kusur"
      - "İdarenin hukuka uygun davranışı nedeniyle bazı kişilere özel ve olağandışı zarar vermesi"
    dogru: 0
    aciklama: |
      Hizmet kusuru, hizmetin kuruluşunda, düzenlenişinde veya işleyişindeki nesnel bozukluktur. Görevlinin kast veya ağır ihmali aranmaz, görevlinin kimliğinin bulunması da şart değildir. Son şık hukuka uygun faaliyetten doğan kusursuz sorumluluğu (fedakârlığın denkleştirilmesi) anlatır.
  - soru: |
      Bir ilçede hasta Ayşe'nin ambulansı 112'yi aradıktan iki saat sonra gelmiş, bu sürede Ayşe'nin durumu ağırlaşmıştır. Ambulansın makul süreden çok sonra gelmesi hizmet kusurunun hangi görünümüne en uygun örnektir?
    siklar:
      - "Kötü işleme"
      - "Hiç işlememe"
      - "Geç işleme"
      - "Hizmetten ayrılabilen kişisel kusur"
    dogru: 2
    aciklama: |
      Hizmet yapılmış ancak olması gereken süreden çok sonra yapılmıştır; bu geç işlemedir. Hiç işlememede hizmet hiç yapılmaz. Kişisel kusur ise görevlinin özel hayatından doğan, hizmetle ilgisi olmayan kusurdur.
  - soru: |
      Polis memuru Ali, görev sırasında gözaltına aldığı Veli'ye kusurlu biçimde orantısız güç kullanmış ve Veli yaralanmıştır. Veli tazminat için kime dava açmalıdır?
    siklar:
      - "Ali'ye karşı asliye hukuk mahkemesinde, çünkü kusuru işleyen kişidir"
      - "Ali ve idareye karşı birlikte, seçtiği yargı kolunda"
      - "İdare aleyhine, idari yargıda tam yargı davası olarak; idarenin Ali'ye rücu hakkı saklıdır"
      - "Dava açamaz, çünkü kişisel kusur idarenin sorumluluğunu kaldırır"
    dogru: 2
    aciklama: |
      Memurların yetkilerini kullanırken işledikleri kusurlardan doğan tazminat davaları, rücu edilmek kaydıyla ancak idare aleyhine açılır (AY m. 129/5). DMK m. 13/1 de kişilerin personel aleyhine değil kurum aleyhine dava açacağını söyler. Kurumun rücu hakkı saklıdır.
  - soru: |
      Tam yargı davasında hakim sorumluluk sebebini hangi sırayla inceler?
    siklar:
      - "Önce kusursuz sorumluluk, ardından hizmet kusuru"
      - "Önce hizmet kusuru, hizmet kusuru yoksa kusursuz sorumluluk; her halde sorumluluk sebebi kararda açıkça gösterilir"
      - "Yalnız hizmet kusuru incelenir, kusursuz sorumluluk idare hukukunda yoktur"
      - "Hakimin seçtiği sebep incelenir, sıra yoktur"
    dogru: 1
    aciklama: |
      Danıştay'ın yerleşik içtihadına göre önce hizmet kusuru araştırılır; yoksa kusursuz sorumluluk incelenir ve sorumluluk sebebi açıkça belirtilir. Kusursuz sorumluluk hizmet kusuruna göre ikincildir.
  - soru: |
      Zeynep'in evinin önündeki cadde belediyenin sorumluluğunda olduğu hâlde kanalizasyon kapağı aylardır açıktır; üç kez yazılı şikâyete rağmen önlem alınmamıştır. Zeynep boşluğa düşüp yaralanmıştır. Zeynep eylemi 10 Mart'ta öğrenmiş, belediyeye aynı gün başvurmuş, belediye 30 gün içinde cevap vermemiştir. Dava süresi ne zaman başlar?
    siklar:
      - "Başvurunun yapıldığı 10 Mart'ta"
      - "Otuz günün bitiminden itibaren, dava süresi içinde dava açılabilir"
      - "Altmış günün bitiminden itibaren"
      - "Süre başlamaz, cevap gelene kadar beklenir"
    dogru: 1
    aciklama: |
      İdari eylemden doğan zararda önce idareye başvurulur. İstek hakkında otuz gün içinde cevap verilmezse bu sürenin bittiği tarihten itibaren dava süresi içinde dava açılabilir (İYUK m. 13/1). Altmış gün eski düzenlemedir; 2021'de otuz güne indirilmiştir. İdare mahkemesinde dava süresi altmış gündür (İYUK m. 7/1).
  - soru: |
      İdari eylemden zarar gören kişi dava açmadan önce idareye hangi süre içinde başvurmalıdır?
    siklar:
      - "Eylemi öğrendiği tarihten itibaren altmış gün ve her halde eylem tarihinden itibaren bir yıl"
      - "Eylemi öğrendiği tarihten itibaren otuz gün, süre sınırı olmaksızın"
      - "Eylemi öğrendiği tarihten itibaren bir yıl ve her halde eylem tarihinden itibaren beş yıl"
      - "Eylem tarihinden itibaren on yıl"
    dogru: 2
    aciklama: |
      İYUK m. 13/1'e göre başvuru, eylemin öğrenildiği tarihten itibaren bir yıl ve her halde eylem tarihinden itibaren beş yıl içinde yapılır. Altmış gün ve bir yıl birleşimi 5233 sayılı Kanundaki başvuru süresidir; karıştırılmamalıdır.
  - soru: |
      X Belediyesi, imar planına aykırı olduğu halde Mehmet'e yapı ruhsatı vermiş, ruhsat iptal edilmiş ve belediye encümeni binanın yıkılmasına karar vermiştir. Mehmet bu idari işlemler nedeniyle zarar gördüğünü ileri sürmektedir. Hangisi doğrudur?
    siklar:
      - "Mehmet'in İYUK m. 13'teki ön başvuruyu yapması zorunludur, başvuru yapmadan dava açamaz"
      - "Mehmet adli yargıda belediye çalışanlarına dava açmalıdır"
      - "Mehmet yalnızca önce iptal davası açabilir, doğrudan tam yargı davası açamaz"
      - "Mehmet doğrudan tam yargı davası veya iptal ve tam yargı davalarını birlikte açabilir (İYUK m. 12)"
    dogru: 3
    aciklama: |
      İdari işlemden doğan zararda ilgililer doğrudan tam yargı davası veya iptal ve tam yargı davalarını birlikte açabilir; dilerlerse önce iptal davası açıp sonradan tam yargı davası da açabilirler (İYUK m. 12). Eylemden doğan zararda aranan ön başvuru, işlemde bu biçimde zorunlu değildir.
  - soru: |
      Zarar görenin kusuru ve idarenin hizmet kusuru birlikte varsa aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Zarar görenin kusuru hiçbir hâlde dikkate alınmaz, idare zararın tamamını öder"
      - "Zarar görenin kusuru idarenin sorumluluğunu kaldırabilir veya azaltabilir; mahkeme bunu araştırmalıdır"
      - "Zarar görenin kusuru yalnız manevi tazminatta dikkate alınır"
      - "Zarar görenin kusuru bulunursa dava her durumda tümden reddedilir"
    dogru: 1
    aciklama: |
      Zarar görenin veya üçüncü kişinin kusuru idarenin sorumluluğunu kaldırabilir ya da azaltabilir ve mahkeme bunu araştırmalıdır. Sonucun tam ret mi indirim mi olacağı olaya göre değişir; bu yüzden "her durumda tümden ret" ifadesi yanlıştır.
  - soru: |
      Kamu hastanesinde doğum yapan Elif'in bebeğinde önlenemez bir komplikasyon (omuz distosisi) gelişmiştir. Bebeğin sonraki takibi, ailenin bilgilendirilmesi ve ihtiyaç duyulan sevk konusunda eksiklik iddia edilmektedir. Hangisi doğrudur?
    siklar:
      - "Komplikasyon önlenemez olduğu için idare hiçbir koşulda sorumlu tutulamaz"
      - "Komplikasyon oluştuğu için idare kusursuz sorumluluk ilkesiyle otomatik sorumludur"
      - "Komplikasyonun kendisi kusur olmasa bile, sonrasındaki yönetim, bilgilendirme ve sevk eksikliği ayrıca hizmet kusuru olabilir ve araştırılmalıdır"
      - "Sağlık hizmetinde hizmet kusuru aranmaz, yalnız hasta kusursuz sorumlulukla korunur"
    dogru: 2
    aciklama: |
      Sağlık hizmetinde tazmin yükümlülüğü hizmet kusuruna dayanır. Komplikasyonun kendisi kusur sayılmasa bile komplikasyon yönetimi, bilgilendirme ve sevkteki eksiklik ayrıca hizmet kusuru olabilir ve mahkeme bunu eksiksiz araştırmalıdır. Karar "idare kusurludur" demek değildir; yalnız araştırmayı gerektirir.
  - soru: |
      Devlet hastanesinde bir hastaya yanlış tedavi uygulanmış, ancak dosyada hangi doktorun hata yaptığı belirlenememiştir. Hastanenin sorumluluğu bakımından hangisi doğrudur?
    siklar:
      - "Hizmet kusuru anonim olduğundan görevlinin belirlenememesi, idarenin sorumluluğunu engellemez"
      - "Hata yapan görevli belirlenemediği için idare sorumlu olamaz"
      - "Dava, kimliği belirsiz doktorlara karşı adli yargıda açılmalıdır"
      - "Önce görevli doktorun kişisel kusuru kesinleşmeli, ancak sonra idareye gidilebilir"
    dogru: 0
    aciklama: |
      Hizmet kusuru nesnel ve anonimdir; kusuru işleyen görevlinin belirlenmesi şart değildir. Hizmetin işleyişindeki aksaklık ispatlanırsa idare sorumludur. Kişisel kusurun önceden kesinleşmesi aranmaz.
  - soru: |
      İdarenin ödediği tazminat için rücu hakkı kime aittir ve kime karşı kullanılır?
    siklar:
      - "Zarar görene aittir; görevliye karşı kullanır"
      - "İdareye aittir; genel hükümlere göre sorumlu personele karşı kullanır"
      - "Hazineye aittir; zarar görene karşı kullanır"
      - "Görevliye aittir; idareye karşı kullanır"
    dogru: 1
    aciklama: |
      Kurumun, genel hükümlere göre sorumlu personele rücu hakkı saklıdır (DMK m. 13/1). AY m. 129/5 ve AY m. 40/3 de rücu hakkını idare ve Devlet lehine öngörür. Rücu mağdurun değil idarenin hakkıdır.
  - soru: |
      Bir şirket, hukuka aykırı ruhsatla yaptığı bina yıkıldığı için idareden yapım ve yıkım giderlerini ve ayrıca "binayı ileride kiraya verseydim elde edeceğim muhtemel kira geliri"ni istemektedir. Hangisi doğrudur?
    siklar:
      - "Muhtemel kira geliri de gerçekleşmiş zarar gibi tazmin edilir"
      - "Hiçbir zarar kalemi tazmin edilmez, çünkü şirket ruhsatın hukuka aykırılığını bilebilirdi"
      - "Yalnız kira geliri istenebilir, yapım gideri istenemez"
      - "Gerçekleşmiş ve kesin zarar tazmin edilir; muhtemel, henüz gerçekleşmemiş zarar tazmin edilmez"
    dogru: 3
    aciklama: |
      Tazmin için zarar gerçekleşmiş ve kesin olmalıdır; muhtemel zarar tazmin edilmez. Yapım ve yıkım giderleri gerçekleşmiş zarar niteliğindedir. Zarar görenin aykırılığı bilmesi ise ayrıca kusur olarak değerlendirilebilir; ama olayda böyle bir bilgi yoktur.
olaylar:
  - olay: |
      X Belediyesinin sorumluluğundaki Gül Sokak'ta bir kanalizasyon kapağı aylardır açıktır. Mahalle sakinleri belediyeye üç kez yazılı şikâyette bulunmuş, ancak belediye ne uyarı levhası koymuş ne de bariyer yerleştirmiştir. Ayşe 4 Kasım 2025'te akşam yürürken açık kapağın boşluğuna düşmüş ve bacağını kırmıştır. Tedavi görmüş, giderlerini kendisi karşılamış ve acı çekmiştir. Ayşe bu olayı 4 Kasım 2025'te öğrenmiştir. Belediye, kapağı "başkasının çaldığını" ve olayda kendisinin kusuru bulunmadığını ileri sürmektedir.

      1. Belediyenin sorumluluğu hangi sebeple doğabilir?
      2. Ayşe hangi davayı açmalıdır?
      3. Ayşe doğrudan dava açabilir mi? Önce ne yapmalı, hangi süreler işler?
      4. Dava kime karşı açılır?
    olcut:
      - {tespit: "Sorumluluk sebebi hizmet kusurudur: belediye hizmetin işleyişini kontrol etme ve gerekli önlemi alma yükümlülüğünü yerine getirmemiştir (hiç işlememe veya geç işleme)", puan: 25, madde: "AY m. 125"}
      - {tespit: "Zararın giderilmesi için tam yargı davası açılır", puan: 15, madde: "İYUK m. 2"}
      - {tespit: "Zarar idari eylemden doğduğu için dava öncesi idareye başvuru şarttır: öğrenmeden itibaren 1 yıl, her halde eylemden itibaren 5 yıl", puan: 25, madde: "İYUK m. 13"}
      - {tespit: "Ret veya 30 gün cevapsızlık üzerine dava süresi içinde (idare mahkemesinde 60 gün) dava açılır", puan: 20, madde: "İYUK m. 7"}
      - {tespit: "Hasım, hizmeti yürüten belediyedir (kurum aleyhine dava)", puan: 15, madde: "DMK m. 13"}
    cozum: |
      **Nitelendirme:** Olay, idarenin yürütmesi gereken bir hizmette (cadde güvenliği) aksaklıktan doğan bir zarara ilişkindir. Zarar bir idari işlemden değil, idari eylemden (önlem almama) kaynaklanır.

      **Hukuki sorunlar:** (1) Sorumluluk sebebi nedir? (2) Hangi dava açılır? (3) Dava öncesi şart ve süreler nelerdir? (4) Dava kime karşı açılır?

      **İlgili hükümler:** AY m. 125'in son fıkrasına göre idare, kendi eylem ve işlemlerinden doğan zararı ödemekle yükümlüdür. Tam yargı davası İYUK m. 2/1-b'ye dayanır. İdari eylemden zarar görenler için İYUK m. 13/1 idareye başvuruyu şart koşar; İYUK m. 7/1 idare mahkemesinde dava süresini altmış gün olarak belirler. DMK m. 13/1 kişilerin kurum aleyhine dava açacağını söyler.

      **Değerlendirme:** Belediye, cadde güvenliği ve altyapı hizmetini yürütmekle, hizmetin işleyişini sürekli kontrol etmekle ve gerekli önlemleri almakla yükümlüdür. Kapağın aylardır açık kalması, üç yazılı şikâyete rağmen ne uyarı levhası ne bariyer konması, belediyenin önlem alma yükümlülüğünü yerine getirmediğini, yani hizmetin hiç işlemediğini veya en azından çok geç işlediğini gösterir. Bu bir hizmet kusurudur. Hizmet kusuru nesnel ve anonim olduğundan kapağı açan kişinin ya da sorumlu görevlinin kim olduğunun bulunması gerekmez. Belediyenin "başkası çaldı" savunması, kapağın kim tarafından açıldığıyla ilgilidir; ama şikâyetlerden sonra bile önlem alınmaması idarenin kendi ihmalidir. Belediye üçüncü kişinin kusuruna dayanabilir; mahkeme bunu araştırır, fakat belediyenin kendi kusuru ortadan kalkmaz. Önce hizmet kusuru bulunduğundan kusursuz sorumluluğa geçilmez.

      Zarar bir işlemden değil eylemden doğduğu için Ayşe doğrudan dava açamaz. Önce, eylemi öğrendiği tarihten itibaren bir yıl içinde ve her halde eylem tarihinden itibaren beş yıl içinde belediyeye başvurarak zararının giderilmesini istemelidir. Belediye isteği reddederse red işleminin tebliğini izleyen günden; otuz gün içinde cevap vermezse bu sürenin bittiği tarihten itibaren dava süresi içinde, yani idare mahkemesinde altmış gün içinde dava açabilir. Eski düzenlemedeki altmış günlük zımni ret süresi 2021'de otuz güne indirilmiştir.

      **Sonuç:** Ayşe, belediyeye başvurup ret veya otuz günlük cevapsızlık sonrasında altmış gün içinde belediye aleyhine idare mahkemesinde tam yargı davası açar. Tedavi giderleri gibi gerçekleşmiş zararlarını ve acısı nedeniyle manevi tazminatı isteyebilir. Belediyenin hizmet kusuru bulunduğundan sorumluluk kusursuz sorumluluğa değil hizmet kusuruna dayanır.
  - olay: |
      Y Devlet Hastanesi acil servisinde nöbetçi Dr. Mehmet, göğüs ağrısıyla gelen Ali'yi gerekli tetkikleri yapmadan taburcu etmiştir. Ali eve gittikten birkaç saat sonra durumu ağırlaşarak yoğun bakıma alınmış ve kalıcı rahatsızlık geliştirmiştir. Ali, Dr. Mehmet'in hatalı davrandığını düşünmekte ve ona karşı asliye hukuk mahkemesinde tazminat davası açmak istemektedir. Avukatı bu yolun doğru olmadığını söylemektedir. Ayrıca hastane yönetimi, tetkik cihazının o gece arızalı olduğunu ve hangi hekimin ne yaptığının tam bilinmediğini ileri sürmektedir.

      1. Ali tazminat davasını kime karşı, hangi yargı kolunda açmalıdır?
      2. Dava türü nedir?
      3. İdare tazminatı öderse hangi hakkı kullanabilir?
      4. Hizmet kusuru varsa mahkeme kusursuz sorumluluğa geçer mi?
    olcut:
      - {tespit: "Kamu görevlisi yetkisini kullanırken kusur işlediği için dava rücu kaydıyla ancak idare aleyhine açılır", puan: 25, madde: "AY m. 129"}
      - {tespit: "Kişiler personel aleyhine değil ilgili kurum aleyhine dava açar", puan: 15, madde: "DMK m. 13"}
      - {tespit: "İdari yargıda tam yargı davası açılır", puan: 20, madde: "İYUK m. 2"}
      - {tespit: "İdarenin, genel hükümlere göre sorumlu personele rücu hakkı saklıdır; Devlet için de rücu hakkı saklıdır", puan: 20, madde: "AY m. 40"}
      - {tespit: "Hizmet kusuru anonim ve nesneldir; hizmet kusuru varsa kusursuz sorumluluğa geçilmez, önce hizmet kusuru incelenir", puan: 20, madde: "AY m. 125"}
    cozum: |
      **Nitelendirme:** Olayda bir kamu hastanesinde görevli hekimin görevi sırasında yaptığı eksik muayene nedeniyle zarar doğmuştur. Sağlık hizmetinde sorumluluk hizmet kusuruna dayanır. Soru, kusurlu görevli ile idare arasındaki dava ilişkisini ve rücuyu içerir.

      **Hukuki sorunlar:** (1) Dava kime açılır? (2) Hangi yargı yolu ve dava türü? (3) Rücu hakkı kime aittir? (4) Hizmet kusuru ve kusursuz sorumluluk ilişkisi nedir?

      **İlgili hükümler:** AY m. 129/5'e göre memurlar ve diğer kamu görevlilerinin yetkilerini kullanırken işledikleri kusurlardan doğan tazminat davaları, kendilerine rücu edilmek kaydıyla ve kanunun gösterdiği şekil ve şartlara uygun olarak ancak idare aleyhine açılabilir. DMK m. 13/1'e göre kişiler, kamu hukukuna tabi görevlerle ilgili zararlar nedeniyle personel aleyhine değil kurum aleyhine dava açar; kurumun genel hükümlere göre sorumlu personele rücu hakkı saklıdır. AY m. 40/3 Devletin zararı tazmin edeceğini ve sorumlu görevliye rücu hakkını saklı tuttuğunu belirtir. Tam yargı davası İYUK m. 2/1-b'ye dayanır.

      **Değerlendirme:** Dr. Mehmet nöbet görevini yürütürken, yani yetkisini kullanırken hatalı davranmıştır. Bu görevle bağlantılı bir kusurdur; özel hayatından doğan, hizmetten ayrılabilen bir kişisel kusur değildir. Bu nedenle Ali'nin asliye hukuk mahkemesinde doktora doğrudan dava açması doğru yol olmaz; AY m. 129/5 ve DMK m. 13/1 uyarınca dava idare aleyhine, idari yargıda tam yargı davası olarak açılmalıdır. Hizmet kusuru nesnel ve anonimdir: hastane yönetiminin "hangi hekimin ne yaptığı bilinmiyor" savunması idareyi kurtarmaz; acil serviste gerekli tetkiklerin yapılmadan taburcu edilmesi hizmetin kötü işlemesidir. Cihazın arızalı olması da idarenin hizmeti yeterli araç-gereçle yürütme yükümlülüğünü gündeme getirir ve başka bir hizmet kusuru hâli olabilir. Mahkeme zarar görenin veya üçüncü kişinin kusurunu da araştırmalıdır; ancak bu olayda böyle bir olgu yoktur.

      İdare tazminatı öderse DMK m. 13/1 ve AY m. 40/3 uyarınca sorumlu personele rücu edebilir. Rücu, Ali'nin değil idarenin hakkıdır ve kapsamı, usulü 13. konuda işlenir.

      Hizmet kusuru bulunduğundan mahkeme kusursuz sorumluluğa geçmez. Önce hizmet kusuru incelenir; ancak hizmet kusuru yoksa kusursuz sorumluluk incelenir ve her halde sorumluluk sebebi kararda açıkça gösterilir.

      **Sonuç:** Ali, Dr. Mehmet'e değil Y Devlet Hastanesinin bağlı olduğu idareye karşı idari yargıda tam yargı davası açar. Dava, hizmet kusuruna dayanır. İdare ödediği tazminat için genel hükümlere göre sorumlu personele rücu edebilir. Dava öncesi idareye başvuru ve sürelere ilişkin ayrıntılar İYUK m. 13 ve İYUK m. 7'ye göre belirlenir.
kartlar:
  - on: "İdarenin sorumluluğunun anayasal dayanağı nedir?"
    arka: "AY m. 125'in son fıkrası: idare, kendi eylem ve işlemlerinden doğan zararı ödemekle yükümlüdür. Hüküm kusurlu/kusursuz ayrımı yapmaz."
  - on: "Tam yargı davası hangi hükme dayanır, kim açar?"
    arka: "İYUK m. 2/1-b: idari eylem ve işlemlerden kişisel hakları doğrudan muhtel olanlar açar. İptal davasındaki menfaat ihlali yetmez."
  - on: "Hizmet kusuru nedir?"
    arka: "Hizmetin kuruluşunda, düzenlenişinde veya işleyişinde nesnel bozukluk, aksaklık veya boşluk. Nesnel ve anonimdir."
  - on: "Hizmet kusurunun üç görünümü?"
    arka: "Kötü işleme, geç işleme, hiç işlememe. Sınırları kesin değildir; belirleyici olan hizmet kusurunun varlığıdır."
  - on: "Tam yargı davasında inceleme sırası nedir?"
    arka: "Önce hizmet kusuru; yoksa kusursuz sorumluluk. Kararda sorumluluk sebebi açıkça yazılır."
  - on: "İdarenin sorumluluğu için genel şartlar?"
    arka: "Gerçekleşmiş kesin zarar, idareye yüklenebilen işlem veya eylem, illiyet bağı. Muhtemel zarar tazmin edilmez."
  - on: "Zarar görenin kusuru sorumluluğu nasıl etkiler?"
    arka: "Sorumluluğu kaldırabilir ya da azaltabilir; mahkeme araştırmalıdır. Tam ret mi indirim mi, olaya göre değişir."
  - on: "Görevli yetkisini kullanırken kusur işlerse dava kime açılır?"
    arka: "Rücu kaydıyla ancak idare aleyhine (AY m. 129/5; DMK m. 13/1). Rücu hakkı idarenindir."
  - on: "Hizmetten ayrılabilen kişisel kusur nedir?"
    arka: "Kamu hizmetiyle ilgisi olmayan, görevlinin özel hayatından ve özel tutumundan kaynaklanan kusur. Örnek: izinli günde özel araçla kaza."
  - on: "Komplikasyon varsa idare kusurlu mudur?"
    arka: "Komplikasyonun kendisi kusur olmayabilir; ama komplikasyon yönetimi, bilgilendirme ve sevk eksikliği ayrıca hizmet kusuru olabilir."
  - on: "İdari eylemden zarar gören dava öncesi ne yapar?"
    arka: "Öğrenmeden itibaren 1 yıl, her halde eylemden itibaren 5 yıl içinde idareye başvurur (İYUK m. 13/1)."
  - on: "İYUK m. 13/1'deki zımni ret süresi kaç gündür?"
    arka: "30 gün (7331 sayılı Kanun, 2021). Eskiden 60 gündü. Süre bitince dava süresi içinde dava açılır."
