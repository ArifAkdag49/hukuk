kararlar: []
sorular:
  - soru: |
      İYUK m. 2/1-a'da iptal sebebi olarak sayılan beş unsur arasında aşağıdakilerden hangisi **yer almaz**?
    siklar:
      - "Sebep"
      - "Konu"
      - "Maksat"
      - "Gerekçe"
    dogru: 3
    aciklama: |
      İYUK m. 2/1-a, yetki, şekil, sebep, konu ve maksat yönlerinden hukuka aykırılığı sayar. Gerekçe ayrı bir unsur değildir; işlemin metninde açıklanan ve şekil unsuruna bağlanan bir öğedir.
  - soru: |
      Belediye encümeni, su borcunu ödemeyen Hasan'ın üç gün süreyle hürriyetinden yoksun bırakılmasına karar vermiştir. Bu karar hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Olağan yetki tecavüzü olup yalnızca iptal edilebilir."
      - "Yer yönünden yetkisizlik olduğundan altmış gün içinde dava edilmelidir."
      - "Fonksiyon gaspı niteliğinde olup yok hükmündedir."
      - "Şekil yönünden tali bir eksikliktir."
    dogru: 2
    aciklama: |
      AY m. 38/11'e göre idare, kişi hürriyetinin kısıtlanması sonucunu doğuran bir müeyyide uygulayamaz. Hürriyeti bağlayıcı yaptırım yargı fonksiyonuna aittir; idarenin bunu uygulaması fonksiyon gaspıdır ve işlemi yok hükmünde kılar.
  - soru: |
      Şube müdürü, kanunen müdürün yetkisinde olan bir işlemi kendisi yapmıştır. Her ikisi de aynı kurumun hiyerarşisi içindedir. Bu sakatlığın sonucu nedir?
    siklar:
      - "İşlem yok hükmündedir."
      - "İşlem iptal edilebilir; altmış gün içinde iptal davası açılabilir."
      - "İşlem geçerlidir, hiyerarşi bu yetkiyi verir."
      - "Yalnızca tazminat davası açılabilir."
    dogru: 1
    aciklama: |
      Aynı idari bütün içinde ast ile üstün birbirinin yerine işlem yapması olağan yetki tecavüzüdür ve işlemi iptal edilebilir kılar. Hiyerarşi, amire astın yetkisini kullanma (ikame) yetkisi vermez. İptal davası süresi İYUK m. 7'ye göredir.
  - soru: |
      Bakan, imza yetkisini genel müdür yardımcısına devretmiştir. Bakan görevden ayrıldıktan sonra yeni bakan göreve başlamıştır. Bu devir hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Devir yeni bakan açıkça iptal edene kadar sürer."
      - "İmza devri kişiden kişiye olduğundan, devredenin değişmesiyle kendiliğinden sona erer."
      - "Yetki devri olduğundan makama bağlıdır ve sürer."
      - "Devir hiç geçerli olmamıştır, çünkü kanunen yasaktır."
    dogru: 1
    aciklama: |
      İmza devri, yetkinin değil yalnızca imzalama yetkisinin ismen belirli kişiden kişiye devridir. Devreden veya devralan değişirse kendiliğinden sona erer. Yetki devri ise makamdan makama olduğundan makamdaki kişi değişse de sürer.
  - soru: |
      Belediye, memur Ayşe'ye göreve sarhoş geldiği gerekçesiyle ceza vermiştir. Soruşturmada Ayşe'nin o gün hiç sarhoş olmadığı ve olayın gerçekleşmediği anlaşılmıştır. Hangi unsur yönünden sakatlık vardır?
    siklar:
      - "Yetki"
      - "Sebep"
      - "Maksat"
      - "Konu"
    dogru: 1
    aciklama: |
      İşlemin dayandığı maddi olay (göreve sarhoş gelmek) gerçekleşmemiştir. Maddi olayın hiç mevcut olmaması sebep unsurunun sakatlığıdır. DMK m. 125'e göre sarhoş gelmek ceza gerektiren bir fiildir; ama fiil yoksa sebep de yoktur.
  - soru: |
      Sebep ve maksat unsurları arasındaki fark aşağıdakilerden hangisinde doğru ifade edilmiştir?
    siklar:
      - "Sebep işlemden sonra ortaya çıkan sonuçtur; maksat işlemden önceki olgudur."
      - "Sebep işlemden önceki maddi olay ve hukuki durumdur; maksat işlemle ulaşılmak istenen hedeftir."
      - "Sebep ile maksat aynı unsurun iki adıdır."
      - "Sebep yalnız şekil kurallarına, maksat yalnız yetkiye ilişkindir."
    dogru: 1
    aciklama: |
      Sebep, "idare bu işlemi niçin yaptı?" sorusunun cevabı olan önceden var olan olgudur. Maksat ise işlemle ulaşılmak istenen nihai hedeftir (genellikle kamu yararı). İkisi ayrı iptal sebebidir (İYUK m. 2/1-a).
  - soru: |
      Belediye başkanı, seçimde rakip partiyi destekleyen fırıncı Murat'ı cezalandırmak için yalnız onun fırınına işlem yaptırmıştır. Fırında gerçekten bir ruhsat eksikliği vardır. Hangi unsur yönünden hukuka aykırılık vardır?
    siklar:
      - "Yetki"
      - "Şekil"
      - "Sebep"
      - "Maksat"
    dogru: 3
    aciklama: |
      Ruhsat eksikliği gerçek olsa bile işlem, kamu yararı için değil siyasi öç alma saikiyle yapılmıştır. Yetkinin kamu yararı dışında kullanılması yetki saptırmasıdır ve maksat unsurunun sakatlığıdır.
  - soru: |
      Memur Zeynep'e savunması alınmadan aylıktan kesme cezası verilmiştir. Bu işlem hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Savunma alınması bir tali şekil kuralıdır; iptal sebebi olmaz."
      - "AY m. 129/2 ve DMK m. 130 nedeniyle şekil/usul yönünden hukuka aykırıdır ve iptal edilebilir."
      - "İşlem yetki gaspı sebebiyle yok hükmündedir."
      - "Yalnızca maksat yönünden sakattır."
    dogru: 1
    aciklama: |
      AY m. 129/2'ye göre savunma hakkı tanınmadıkça disiplin cezası verilemez; DMK m. 130/1 aynı kuralı koyar. Savunma alınması kişiye tanınan temel bir güvence olduğundan asli usul kuralıdır ve ihlali iptal sebebidir.
  - soru: |
      DMK m. 130/2'ye göre disiplin soruşturmasında memura savunma için verilecek süre aşağıdakilerden hangisidir?
    siklar:
      - "En az 3 gün"
      - "7 günden az olmamak üzere verilen süre"
      - "En fazla 7 gün"
      - "Süre kanunda belirlenmemiştir"
    dogru: 1
    aciklama: |
      Soruşturmayı yapanın veya yetkili disiplin kurulunun "7 günden az olmamak üzere" verdiği süre içinde savunma yapılır. Savunmasını bu süre içinde yapmayan memur savunma hakkından vazgeçmiş sayılır (DMK m. 130/2).
  - soru: |
      İdare mahkemesi, belediyenin bir işyerini 30 gün süreyle kapatma kararını hukuka aykırı bulmuş, ancak "10 gün kapatma daha uygun olurdu" diyerek kararın yerine bunu yazmıştır. Bu karar hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Geçerlidir; mahkeme takdir yetkisini kullanabilir."
      - "Hukuka aykırıdır; yargı yetkisi yerindelik denetimiyle kullanılamaz ve idarenin yerine karar verilemez (AY m. 125/4)."
      - "Geçerlidir, çünkü kapatma ceza hukuku alanındadır."
      - "Yalnızca Anayasa Mahkemesi böyle bir karar verebilir."
    dogru: 1
    aciklama: |
      AY m. 125/4 ve İYUK m. 2/2'ye göre yargı yetkisi hukuka uygunluk denetimiyle sınırlıdır; idari işlem niteliğinde karar verilemez. Mahkeme, işlemi iptal edebilir ama yerine kendi tercihini koyamaz.
  - soru: |
      Bir kadro dolu iken ikinci bir kişi aynı kadroya asaleten atanmıştır. Bu işlem hangi unsur bakımından hukuka aykırıdır?
    siklar:
      - "Konu"
      - "Yer yönünden yetki"
      - "Zaman yönünden yetki"
      - "Maksat"
    dogru: 0
    aciklama: |
      İşlemin doğurduğu hukuki sonuç (dolu kadroya ikinci kişinin atanması) imkânsız ya da kanuna aykırıdır. Konu unsurunda imkânsızlık veya kanuna aykırılık sakatlıktır; yetki ve maksat bu olayda tartışma konusu değildir.
  - soru: |
      Ali memurdur; mazeretsiz olarak iki gün işe gelmemiştir. İdare, Ali'ye savunmasını alıp "Devlet memurluğundan çıkarma" cezası vermiştir. Sebep (devamsızlık) gerçektir. İşlemin unsurlar bakımından durumu nedir?
    siklar:
      - "Hukuka uygundur; sebep gerçek olduğu için başka bir denetim yapılmaz."
      - "Konu yönünden hukuka aykırıdır: kanun iki günlük özürsüz devamsızlığa aylıktan kesme cezasını bağlamıştır (DMK m. 125)."
      - "Yetki gaspı vardır."
      - "Yalnızca tali şekil eksikliği vardır."
    dogru: 1
    aciklama: |
      DMK m. 125'e göre özürsüz olarak bir veya iki gün göreve gelmemek aylıktan kesme cezasını gerektirir. Sebep gerçek olsa bile işlemin konusu (çıkarma) kanunun fiile bağladığı sonucu aşar. Unsurlardan biri sakatsa iptal için yeterlidir (İYUK m. 2/1-a).
olaylar:
  - olay: |
      A Bakanlığının taşra teşkilatında memur olarak çalışan Ali, 12 ve 13 Mart günleri göreve gelmemiştir. Ali bu iki gün için amirinin onayladığı yıllık izin kullanmıştır. İl müdürü, Ali'nin "özürsüz devamsızlık" yaptığını ileri sürerek, kendisine savunma hakkı tanımadan "Devlet memurluğundan çıkarma" cezası vermiş; karar 2 Nisan günü Ali'ye yazılı olarak tebliğ edilmiştir. Olayda uygulanan mevzuat, memurluktan çıkarma cezasını yalnızca yüksek disiplin kurulunun verebileceğini öngörmektedir. Ali, 20 Nisanda idare mahkemesinde iptal davası açmıştır. İl müdürü, davada mahkemeden cezayı "aylıktan kesme" olarak değiştirmesini talep etmiştir.

      1. Cezada hangi unsurlar yönünden hukuka aykırılık vardır?
      2. Yetki yönündeki sakatlığın sonucu (yokluk veya iptal) nedir?
      3. Ali'nin açtığı dava süresinde midir?
      4. Mahkeme cezayı "aylıktan kesme" olarak değiştirebilir mi?
    olcut:
      - {tespit: "Yetki: memurluktan çıkarma cezasını kurul yerine il müdürünün vermesi; aynı idari bütün içinde olağan yetki tecavüzü olduğundan iptal sebebi", puan: 20, madde: "İYUK m. 2/1-a"}
      - {tespit: "Şekil/usul: savunma alınmaması asli usul sakatlığıdır", puan: 20, madde: "AY m. 129/2"}
      - {tespit: "Sebep: izinli olunan günler için özürsüz devamsızlık olayının bulunmaması", puan: 20, madde: "DMK m. 125"}
      - {tespit: "Konu: iki günlük özürsüz devamsızlığa kanunun aylıktan kesme bağladığı, çıkarmanın bu fiille bağdaşmaması", puan: 15, madde: "DMK m. 125"}
      - {tespit: "Dava açma süresinin tebliği izleyen günden başlayan 60 gün olması; dava süresindedir", puan: 10, madde: "İYUK m. 7"}
      - {tespit: "Mahkemenin yerindelik denetimi yapamaması, cezayı değiştirememesi", puan: 15, madde: "AY m. 125/4"}
    cozum: |
      **Nitelendirme:** İl müdürünün verdiği "Devlet memurluğundan çıkarma" cezası, tek yanlı, kesin ve icrai bir idari işlemdir. İşlem, Ali'ye yazılı bildirilmiştir. Soru, bu işlemin beş unsuru yönünden denetlenmesi ve iptal davasının sonucudur.

      **Hukuki sorunlar:** Yetki, şekil, sebep ve konu yönlerinden hukuka aykırılık; sakatlığın yokluk veya iptal sonucu; dava açma süresi; yargı denetiminin sınırı.

      **İlgili hükümler:** İYUK m. 2/1-a, unsurlardan biri ile hukuka aykırılığı iptal sebebi sayar. AY m. 129/2 ve DMK m. 130/1, savunma alınmadan disiplin cezası verilemeyeceğini söyler. DMK m. 125, özürsüz olarak bir veya iki gün göreve gelmemeyi aylıktan kesme cezasına bağlar. Dava açma süresi İYUK m. 7'ye göre idare mahkemesinde altmış gündür ve yazılı bildirimin yapıldığı tarihi izleyen günden başlar (İYUK m. 7/2-a; AY m. 125/3). AY m. 125/4 ile İYUK m. 2/2, yerindelik denetimini yasaklar.

      **Değerlendirme:** (1) **Yetki:** Olayda uygulanan mevzuat cezayı yalnızca kurul vereceğini öngörür. İl müdürü ile kurul aynı idari teşkilat içinde olduğundan bu bir olağan yetki tecavüzüdür; işlemi yok hükmünde değil, iptal edilebilir kılar. (2) **Şekil/usul:** Savunma alınmaması, AY m. 129/2 ve DMK m. 130 uyarınca asli usul sakatlığıdır. (3) **Sebep:** Ali'nin devamsızlığı özürsüz değildir; çünkü bu günler için onaylı izni vardır. Maddi olay gerçekleşmemiştir. (4) **Konu:** Olay özürsüz devamsızlık sayılsa bile, DMK m. 125 iki günlük devamsızlığa aylıktan kesme bağlar. Çıkarma cezası kanunun fiile bağladığı sonucu aşar. Sebep ve konuda sakatlık birbirini tamamlar ama her biri tek başına iptale yeter. (5) **Süre:** 2 Nisan tebliğ tarihidir; süre 3 Nisanda başlar. 20 Nisanda açılan dava, altmış günlük süre içindedir. (6) **Yargı denetimi:** İdare mahkemesi hukuka uygunluk denetimi yapar. İşlem iptal edilirse idare, mahkeme kararının gereğini yerine getirir; mahkeme cezayı "aylıktan kesme" olarak değiştirip idarenin yerine geçemez. Aksi yerindelik denetimi olurdu.

      **Sonuç:** İşlem yetki, şekil, sebep ve konu unsurları yönünden hukuka aykırıdır ve iptal edilir. Yetki sakatlığı olağan olduğundan yokluk değil iptal sonucu doğurur. Dava süresindedir. Mahkeme cezayı değiştiremez; yalnızca iptal eder.
  - olay: |
      D Belediyesi Başkanı B, seçimlerde rakip partiyi destekleyen fırın işletmecisi F'yi cezalandırmak istemektedir. Zabıta ekipleri, F'nin fırınında bir ruhsat eksikliği tespit etmiş; aynı mahallede üç fırında da aynı eksiklik tutanak altına alınmıştır. Buna rağmen yalnızca F'nin fırını için 30 gün süreyle kapatma işlemi tesis edilmiştir. B, bir toplantıda "Bu fırın bu mahallede açık kalmayacak, kimi desteklediğini biliyoruz" demiştir. Kapatma işlemi F'ye yazılı olarak tebliğ edilmiş; işlemde başvuru yolu ve süresi gösterilmemiştir. F, idare mahkemesinde iptal davası açmıştır. Belediye, ruhsat eksikliğinin kapatma için yeterli sebep olduğunu, takdir yetkisini kullandığını ve mahkemenin yerindelik denetimi yapamayacağını savunmuştur.

      1. İşlemin sebep ve maksat unsurları yönünden durumu nedir?
      2. Belediyenin "takdir yetkisi kullandık, yerindelik denetimi yapılamaz" savunması geçerli midir?
      3. Başvuru yolu ve sürenin gösterilmemesi hangi Anayasa hükmüne ilişkindir?
      4. Hukuka aykırılığın tek bir unsurda bulunması iptal için yeterli midir?
    olcut:
      - {tespit: "Sebep unsuru: ruhsat eksikliği maddi olarak mevcuttur; tek başına sakat sayılmaz", puan: 15, madde: "İYUK m. 2/1-a"}
      - {tespit: "Maksat unsuru: siyasi öç alma saiki; yetki saptırması", puan: 25, madde: "İYUK m. 2/1-a"}
      - {tespit: "Eşitlik: aynı eksikliği olan diğer fırınlara işlem yapılmaması takdir yetkisinin sınırını gösterir", puan: 15, madde: "AY m. 10"}
      - {tespit: "Takdir yetkisinin kamu yararı, eşitlik ve ölçülülükle sınırlı olması; hukuka uygunluk denetiminin yerindelik yasağıyla engellenmemesi", puan: 20, madde: "AY m. 125/4"}
      - {tespit: "Devletin işlemlerinde başvuru yollarını, mercilerini ve sürelerini belirtme yükümlülüğü; sonucu tartışmalı", puan: 10, madde: "AY m. 40/2"}
      - {tespit: "Unsurlardan biri ile hukuka aykırılığın iptal için yeterli olması", puan: 15, madde: "İYUK m. 2/1-a"}
    cozum: |
      **Nitelendirme:** Kapatma işlemi, belediyenin tek yanlı, kesin ve icrai bir idari işlemidir. F'nin açtığı dava bir iptal davasıdır. İşlemin beş unsuru yönünden denetimi gerekir.

      **Hukuki sorunlar:** Sebep ve maksat unsurlarının ayrı değerlendirilmesi; takdir yetkisinin sınırı; yerindelik savunması; AY m. 40/2'nin ihlali; tek unsurdaki sakatlığın yeterliliği.

      **İlgili hükümler:** İYUK m. 2/1-a, yetki, şekil, sebep, konu ve maksat yönlerinden biri ile hukuka aykırılığı iptal sebebi sayar. AY m. 125/4 ve İYUK m. 2/2, yargı yetkisini hukuka uygunluk denetimiyle sınırlar. AY m. 10 kanun önünde eşitliği, AY m. 13 ölçülülüğü düzenler. AY m. 40/2, Devlete işlemlerinde başvuru yollarını ve sürelerini belirtme yükümlülüğü yükler.

      **Değerlendirme:** (1) **Sebep:** Fırında gerçek bir ruhsat eksikliği vardır; maddi olay mevcuttur ve kanunun aradığı nitelikte olabilir. Bu yönden işlem tek başına sakat değildir. (2) **Maksat:** İşlem, kamu yararı için değil, B'nin siyasi öç alma amacıyla tesis edilmiştir. Aynı eksikliği olan diğer fırınlara işlem yapılmaması ve B'nin açıklaması, bu amacın göstergeleridir. İşlemin dış görünüşü hukuka uygun olsa bile yetki saptırması vardır ve maksat unsuru sakattır. (3) **Takdir yetkisi:** Belediyenin takdir yetkisi mutlak değildir; kamu yararı, eşitlik (AY m. 10) ve ölçülülük (AY m. 13) ile sınırlıdır. Mahkemenin maksat sakatlığını araştırması yerindelik denetimi değil, hukuka uygunluk denetimidir. Bu nedenle yerindelik savunması geçerli değildir. Mahkeme dosyayı kendiliğinden inceler (İYUK m. 20/1). (4) **AY m. 40/2:** İşlemde başvuru yolu ve sürenin gösterilmemesi bu hükme aykırıdır. Bunun işlemi tek başına şekil yönünden sakatlayıp sakatlamayacağı tartışmalıdır; öğretide ve uygulamada daha çok ilgili lehine yorum ve sürelerin işleyişi bakımından önem taşıdığı savunulur. Bu nedenle iptal gerekçesi olarak asıl dayanak maksat sakatlığıdır. (5) İYUK m. 2/1-a unsurlardan **biri** ile hukuka aykırılığı yeterli saydığından, yalnızca maksat sakatlığı iptal için yeterlidir.

      **Sonuç:** İşlem maksat unsuru (yetki saptırması) yönünden hukuka aykırıdır ve iptal edilir. Sebep unsuru tek başına sakat değildir. Yerindelik savunması mahkemeyi bağlamaz. AY m. 40/2'ye uyulmaması ayrıca eleştirilir, ama sonucu tartışmalıdır.
kartlar:
  - on: "İdari işlemin beş unsuru?"
    arka: "Yetki, şekil, sebep, konu, maksat (İYUK m. 2/1-a). Biri sakatsa iptal sebebidir."
  - on: "Beş unsurun soruları?"
    arka: "Yetki: kim? Şekil: nasıl? Sebep: niçin? Konu: ne? Maksat: ne için?"
  - on: "Yok hükmünde işlem doğuran yetki sakatlıkları?"
    arka: "Fonksiyon gaspı, yetki gaspı, ağır ve bariz yetki tecavüzü. Olağan yetki tecavüzü ise iptal sebebidir."
  - on: "Yetki devri ile imza devri farkı?"
    arka: "Yetki devri makamdan makamadır, kişi değişse de sürer. İmza devri kişiden kişiyedir, kişi değişince kendiliğinden sona erer."
  - on: "Hangi şekil/usul kuralları iptal ettirir?"
    arka: "Yalnız asli (esaslı) kurallar: savunma, bağlayıcı görüş, kurul yeter sayısı. Tali eksiklik iptal sebebi değildir."
  - on: "Disiplin cezasında savunma hakkının dayanağı ve süresi?"
    arka: "AY m. 129/2, DMK m. 130/1. Savunma süresi 7 günden az olmamak üzere verilir (DMK m. 130/2)."
  - on: "AY m. 40/2 neyi ister?"
    arka: "Devlet, işlemlerinde başvurulacak kanun yollarını, mercileri ve süreleri belirtmek zorundadır."
  - on: "Sebep unsurundaki sakatlık türleri?"
    arka: "Maddi olayın bulunmaması, tavsif (nitelendirme) hatası, hukuki dayanağın yanlışlığı."
  - on: "Sebep, gerekçe ve maksat farkı?"
    arka: "Sebep: işlemden önceki olgu. Gerekçe: olgunun metindeki açıklaması. Maksat: ulaşılmak istenen hedef."
  - on: "Konu unsurunda hangi sakatlıklar olur?"
    arka: "Kanuna aykırı ya da imkânsız sonuç, geriye yürüme; örnek: dolu kadroya ikinci atama."
  - on: "Bağlı yetki ile takdir yetkisi farkı?"
    arka: "Bağlı yetkide tercih yoktur, kanun kararı belirler. Takdir yetkisinde seçenek vardır ama mutlak değildir (kamu yararı, eşitlik, ölçülülük)."
  - on: "Yetki saptırması nedir?"
    arka: "Yetkinin kamu yararı dışında (kişisel, siyasi, mali saik) ya da kanunun öngördüğü özel amaç dışında kullanılması; maksat unsurunun sakatlığıdır."
