ozet: |
  - **Hizmet yerinden yönetim:** Belirli bir kamu hizmetini yürütmek üzere kanunla veya Cumhurbaşkanlığı kararnamesiyle kurulan, **ayrı kamu tüzel kişiliği** ve özerkliği olan kuruluşlardır (AY m. 123/2-3). Yer yönünden yerinden yönetimden (mahalli idareler) farkı: hizmet esastır, karar organı genellikle seçimle gelmez.
  - **İhtisas ilkesi:** Kuruluş yalnız kuruluş normunda gösterilen hizmet alanında faaliyet gösterebilir; merkezi idarenin vesayeti de yalnız kanunun gösterdiği ölçüde olur.
  - **Üniversite (AY m. 130):** Kamu tüzel kişiliği ve bilimsel özerkliği vardır; **kanunla** kurulur. Rektörü **Cumhurbaşkanı**, dekanı **YÖK** seçer ve atar (AY m. 130/6). YÖK ya da üniversitenin yetkili organları dışındaki makamlar üniversite organlarını ve öğretim elemanlarını görevden uzaklaştıramaz (AY m. 130/7). Bütçe YÖK onayıyla Millî Eğitim Bakanlığına sunulur (AY m. 130/8).
  - **Vakıf yükseköğretimi:** Kazanç amacı güdülmez; Devletin gözetim ve denetimine tabidir (AY m. 130/2). Vakıf senediyle üniversite kurulmaz.
  - **Diğer anayasal kurumlar:** YÖK (AY m. 131), RTÜK ve TRT (AY m. 133), Atatürk Kültür, Dil ve Tarih Yüksek Kurumu (AY m. 134).
  - **Kamu kurumu niteliğindeki meslek kuruluşları (AY m. 135):** **Kanunla** kurulur; organları üyelerce **yargı gözetimi altında gizli oyla** seçilir; siyasi partiler aday gösteremez (AY m. 135/4). Kamu kurum ve KİT'lerde asli ve sürekli görevde çalışanlar için kayıt zorunlu değildir (AY m. 135/2). Amaç dışı faaliyette organlara **mahkeme kararıyla** son verilir (AY m. 135/6); gecikmede sakınca varsa faaliyetten men kararı 24 saatte hâkim onayına sunulur, hâkim 48 saatte açıklamazsa karar kendiliğinden kalkar (AY m. 135/7).
  - **Bağımsız idari otoriteler (BİO):** Belirli sektörlerde düzenleme, denetim ve yaptırım yetkisi kullanan, özerk, kurul tipi kuruluşlardır. 5018 sayılı Kanun m. 3/c, **düzenleyici ve denetleyici kurumları** (III) sayılı cetvele bağlar; cetvelde 11 kurum yer alır.
  - **Yargısal denetim:** Kamu kuruluşları ya da meslek kuruluşlarınca çıkarılan, **ülke çapında uygulanacak düzenleyici işlemlere** karşı iptal davası ilk derece mahkemesi olarak Danıştayda görülür (2575 sayılı Kanun m. 24/1-c).
  - 📌 **Güncel:** AYM'nin 7/12/2023 tarihli kararıyla iptal edilen YÖK üye yapısı ve rektör atama hükümleri 7551 sayılı Kanunla (2025) yeniden düzenlenmiştir (2547 sayılı Kanun m. 6/b; 2547 sayılı Kanun m. 13/a). Çok avukatlı illerde baro kurma imkânı 7249 sayılı Kanunla getirilmiştir (1136 sayılı Kanun m. 77).
anlatim: |
  ## 1. Hizmet yerinden yönetim

  İdarenin kuruluş ve görevleri merkezden yönetim ve yerinden yönetim esaslarına dayanır (AY m. 123/2). Yerinden yönetimin iki kolu vardır: **yer yönünden** (mahalli idareler) ve **hizmet yönünden** yerinden yönetim. Hizmet yönünden yerinden yönetimde belirli bir kamu hizmeti, teknik bilgi ve uzmanlık gerektirdiği için Devlet tüzel kişiliğinden ayrılarak **kamu tüzel kişiliği** kazanmış bir kuruluşa bırakılır. Kamu tüzel kişiliği **kanunla veya Cumhurbaşkanlığı kararnamesiyle** kurulur (AY m. 123/3).

  | Ölçüt | Yer yönünden | Hizmet yönünden |
  |---|---|---|
  | Esas alınan | Yer ve yer halkı | Belirli hizmet |
  | Karar organı | Seçmence seçilir | Genellikle atanır |
  | Örnek | Belediye, köy | Üniversite, sosyal güvenlik kurumu |

  Ortak özellikler şunlardır:

  - **Kamu tüzel kişiliği:** kendi malı, bütçesi, personeli ve sorumluluğu vardır.
  - **İhtisas ilkesi:** kuruluş yalnız kuruluş normunda gösterilen hizmet alanında faaliyet gösterebilir.
  - **Özerklik:** idari ve mali özerklik vardır; derecesi kuruluştan kuruluşa değişir.
  - **Vesayet:** merkezi idarenin denetimi kuruluş normunda gösterilen ölçüde ve yollarla yapılır; hiyerarşik emir verme yoktur.

  > **Örnek:** Bilimsel faaliyet yürütmek üzere kurulan bir üniversitenin, kuruluş amacıyla ilgisi olmayan ticari bir hizmeti asıl faaliyet olarak üstlenmesi ihtisas ilkesiyle bağdaşmaz. Öte yandan bakanlık, üniversiteye hiyerarşik emir veremez; yalnız kanunun öngördüğü gözetim ve denetim yetkisini kullanır.

  Kuruluşun bakanlık ya da Cumhurbaşkanlığıyla ilişkisinin derecesi (bağlı, ilgili, ilişkili) kuruluş normundan okunur; sınavda ezbere değil, normdaki ifadeden hareket edin.

  Doktrinde kamu kurumları faaliyet alanına göre ayrılır: **idari** kurumlar, **iktisadi** kurumlar (KİT'ler), **sosyal** kurumlar ve **bilimsel-kültürel** kurumlar. Sosyal güvenlik kurumları 5018 sayılı Kanun m. 3/d uyarınca (IV) sayılı cetvelde sayılır (Sosyal Güvenlik Kurumu ve Türkiye İş Kurumu gibi).

  > ⚠️ **Sınavda dikkat:** Her kamu tüzel kişisi aynı usulle kurulmaz. Genel kural AY m. 123/3'tür (kanun ya da kararname); ancak Anayasa özel olarak "kanunla kurulur" diyorsa (üniversite, meslek kuruluşu) kararnameyle kurulamaz.

  ## 2. Anayasal kamu kurumları

  ### Üniversiteler (AY m. 130)

  Üniversiteler, **kamu tüzel kişiliğine ve bilimsel özerkliğe** sahip kurumlardır ve Devlet tarafından **kanunla** kurulur (AY m. 130/1; 2547 sayılı Kanun m. 3/d ve 2547 sayılı Kanun m. 5). Üniversiteler 5018 sayılı Kanun'un (II) sayılı cetvelinde özel bütçeli idareler arasında yer alır.

  **Vakıflar**, kazanç amacına yönelik olmamak şartıyla, Devletin gözetim ve denetimine tabi yükseköğretim kurumları kurabilir (AY m. 130/2). Vakıf yükseköğretim kurumları, mali ve idari konular dışında akademik çalışma, öğretim elemanlarının sağlanması ve güvenlik bakımından Devlet üniversiteleri için öngörülen anayasal hükümlere tabidir (AY m. 130/10).

  > **Örnek:** A Vakfı, noterde düzenlediği vakıf senediyle "A Üniversitesi"ni kurduğunu ilan eder. Üniversite kanunla kurulabileceğinden bu ilan bir üniversite doğurmaz.

  **Yönetim ve güvenceler:**

  - **Rektör** kanundaki usule göre **Cumhurbaşkanınca**, **dekanlar ise Yükseköğretim Kurulunca** seçilir ve atanır (AY m. 130/6). Dekan, rektörün önereceği üç profesör arasından YÖK tarafından seçilir (2547 sayılı Kanun m. 16). Vakıf üniversitelerinde rektör ataması mütevelli heyetinin teklifi üzerine yapılır (2547 sayılı Kanun m. 13/a).
  - Üniversite yönetim ve denetim organları ile öğretim elemanları, **YÖK'ün veya üniversitelerin yetkili organlarının dışında kalan makamlarca** görevlerinden uzaklaştırılamaz (AY m. 130/7). Bakan ya da vali bu yetkiyi kullanamaz.
  - Üniversitelerin hazırladığı bütçeler **YÖK'çe tetkik ve onaylandıktan sonra Millî Eğitim Bakanlığına** sunulur (AY m. 130/8).
  - Kuruluş, organlar ve işleyiş kanunla düzenlenir (AY m. 130/9). Üniversitenin organları **rektör, senato ve üniversite yönetim kurulu**dur; fakültenin organları **dekan, fakülte kurulu ve fakülte yönetim kurulu**dur (2547 sayılı Kanun m. 13-15; 2547 sayılı Kanun m. 16-18).

  Üniversiteler ve bunlara bağlı birimler **Devletin gözetimi ve denetimi altındadır**; güvenlik hizmetleri Devletçe sağlanır (AY m. 130/5). Üniversiteler ve öğretim üyeleri her türlü bilimsel araştırma ve yayını serbestçe yapabilir; ancak bu yetki, Devletin varlığı ve bağımsızlığı ile milletin ve ülkenin bütünlüğü ve bölünmezliği aleyhinde faaliyet serbestliği vermez (AY m. 130/4). Yani bilimsel özerklik, denetimsizlik demek değildir.

  > 💡 **Püf nokta:** "Kim atar?" sorusunda zinciri hatırlayın: rektör → Cumhurbaşkanı; dekan → YÖK; ikisi de öğretim elemanlarının seçimiyle gelmez.

  ### YÖK, TRT/RTÜK ve Atatürk Kültür, Dil ve Tarih Yüksek Kurumu

  **YÖK**, yükseköğretimi planlayan ve yönlendiren, özerkliğe ve kamu tüzel kişiliğine sahip bir üst kuruluştur (AY m. 131; 2547 sayılı Kanun m. 6/a). Radyo ve televizyon faaliyetlerini düzenleyen ve denetleyen **Radyo ve Televizyon Üst Kurulu** dokuz üyeden oluşur; üyeler Türkiye Büyük Millet Meclisi Genel Kurulunca seçilir. Devletçe kamu tüzel kişiliği olarak kurulan tek radyo ve televizyon kurumunun (TRT) özerkliği ve yayınlarının tarafsızlığı esastır (AY m. 133). **Atatürk Kültür, Dil ve Tarih Yüksek Kurumu** kamu tüzel kişiliğine sahiptir ve Cumhurbaşkanının görevlendireceği bakana bağlıdır (AY m. 134).

  ## 3. Kamu kurumu niteliğindeki meslek kuruluşları

  AY m. 135/1'e göre bunlar, belli bir mesleğe mensup olanların müşterek ihtiyaçlarını karşılamak, mesleki faaliyetlerini kolaylaştırmak, mesleğin genel menfaatlere uygun gelişmesini sağlamak ve meslek disiplini ile ahlakını korumak amacıyla **kanunla kurulan** ve organları kendi üyelerince **yargı gözetimi altında, gizli oyla** seçilen **kamu tüzel kişileridir**. Barolar ve Türkiye Barolar Birliği, tabip ve eczacı odaları, mühendis ve mimar odaları ile birlikleri tipik örneklerdir.

  Anayasal rejimin ana çizgileri:

  - **Girme mecburiyeti:** Kamu kurum ve kuruluşları ile KİT'lerde **asli ve sürekli görevlerde çalışanlar** için meslek kuruluşuna girme mecburiyeti aranmaz (AY m. 135/2). Serbest çalışanlar için üyelik zorunludur.
  - **Amaç dışı faaliyet yasağı** (AY m. 135/3).
  - **Siyasi partiler** organ seçimlerinde aday gösteremez (AY m. 135/4).
  - **Devletin idari ve mali denetimi** kanunla düzenlenir (AY m. 135/5).
  - **Görevine son verme:** Amaçları dışında faaliyet gösteren meslek kuruluşlarının sorumlu organlarının görevine, kanunun belirlediği merciin veya **Cumhuriyet savcısının istemi üzerine mahkeme kararıyla** son verilir ve yerlerine yenileri seçtirilir (AY m. 135/6).
  - **Faaliyetten men:** Milli güvenlik, kamu düzeni, suçun önlenmesi veya yakalanması gerektirir ve gecikmede sakınca varsa kanunla yetkilendirilen merci faaliyetten men edebilir; karar **24 saat** içinde hâkim onayına sunulur, hâkim **48 saat** içinde açıklamazsa karar **kendiliğinden yürürlükten kalkar** (AY m. 135/7).

  > **Örnek:** İnşaat Mühendisleri Odasının yönetim kurulunun amaç dışı siyasi faaliyet yürüttüğü ileri sürülüyor. Bakanlığın "olur"uyla yönetim kuruluna son verilemez; bunun için kanunun belirlediği merciin ya da savcının istemi üzerine **mahkeme kararı** gerekir.

  | Özellik | Meslek kuruluşu | Dernek / sendika |
  |---|---|---|
  | Tüzel kişilik | Kamu tüzel kişisi | Özel hukuk tüzel kişisi |
  | Üyelik | Serbest çalışanlar için zorunlu | Zorlanamaz (AY m. 33; AY m. 51) |
  | Kuruluş | Kanunla | Önceden izin almadan |

  Barolar bakımından Avukatlık Kanunu bu çerçeveyi somutlaştırır: baro, kuruluşunu Türkiye Barolar Birliğine bildirmekle tüzel kişilik kazanır (1136 sayılı Kanun m. 77/3); amaçları dışında faaliyet gösteren baro ve Birlik organlarının görevine asliye hukuk mahkemesinde görülen davada son verilir (1136 sayılı Kanun m. 77/5). Barolar kuruluş amaçları dışında faaliyette bulunamaz (1136 sayılı Kanun m. 76/2). 7249 sayılı Kanunla (2020) yeni bir imkân getirilmiştir: beşbinden fazla avukat bulunan illerde asgari **ikibin** avukatla bir baro kurulabilir (1136 sayılı Kanun m. 77/1).

  Meslek kuruluşları kamu tüzel kişisi olduğundan kamu gücü ayrıcalıkları kullanır; AY m. 124 kamu tüzelkişilerine kendi görev alanlarında yönetmelik çıkarma yetkisi verir. Kayıt ve disiplin gibi kamu gücüne dayanan işlemleri idari işlemdir.

  > ⚠️ **Sınavda dikkat:** Dernekler (AY m. 33) ve sendikalar (AY m. 51) özel hukuk tüzel kişisidir; üyelik serbesttir, kimse üye olmaya zorlanamaz. Meslek kuruluşları ise kamu tüzel kişisidir ve serbest çalışanlar için üyelik zorunludur.

  ## 4. Bağımsız idari otoriteler (düzenleyici ve denetleyici kurumlar)

  **Bağımsız idari otoriteler**, ekonomik ve toplumsal yaşamın hassas alanlarında (bankacılık, sermaye piyasası, enerji, elektronik haberleşme, rekabet, medya, kişisel veriler, kamu ihaleleri gibi) siyasi etkiden korunarak **düzenleme, lisans verme, denetleme ve idari yaptırım uygulama** yetkilerini kullanan kuruluşlardır.

  Bu kurumların bağımsız olmasının nedeni, kararlarının günlük siyasi tercihlerden değil teknik ve tarafsız değerlendirmeden çıkması beklentisidir; yine de yargı denetiminden bağışık değildirler, işlemleri idari işlemdir ve yargısal denetime tabidir.

  Öne çıkan özellikleri:

  - **kurul tipi yönetim**; üyelerin atanma, görev süresi ve görevden alınma şartları kuruluş normunda ayrıca güvenceye bağlanır (organik bağımsızlık);
  - kararlarında talimat almamaları (fonksiyonel bağımsızlık);
  - kamu tüzel kişiliği, kendi bütçesi ve gelirleri (mali özerklik).

  5018 sayılı Kanun m. 3/c, **düzenleyici ve denetleyici kurumları** (III) sayılı cetvelde yer alan kurumlar olarak tanımlar. Cetvel şunları sayar: Radyo ve Televizyon Üst Kurulu, Bilgi Teknolojileri ve İletişim Kurumu, Sermaye Piyasası Kurulu, Bankacılık Düzenleme ve Denetleme Kurumu, Enerji Piyasası Düzenleme Kurumu, Kamu İhale Kurumu, Rekabet Kurumu, Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu, Kişisel Verileri Koruma Kurumu, Nükleer Düzenleme Kurumu, Sigortacılık ve Özel Emeklilik Düzenleme ve Denetleme Kurumu.

  > 💡 **Püf nokta:** (III) sayılı cetveldeki kurumlar arasında Anayasa'da adı geçen tek kurum RTÜK'tür (AY m. 133); üyelerini TBMM seçer. TRT ise bir yayıncı kamu kurumudur, düzenleyici kurum değildir.

  **Yargısal denetim:** Bakanlıklar ile kamu kuruluşları veya kamu kurumu niteliğindeki meslek kuruluşlarınca çıkarılan ve **ülke çapında uygulanacak düzenleyici işlemlere** karşı iptal ve tam yargı davaları **Danıştayda ilk derece mahkemesi olarak** görülür (2575 sayılı Kanun m. 24/1-c). Bu nedenle bir BİO'nun ülke çapında uygulanacak yönetmelik ya da tebliği ilk derecede Danıştayda dava edilir. Kurumların tekil işlemleri bakımından görevli mahkeme ise ilgili kurum kanununa göre belirlenir.

  ## 5. Güncel değişiklikler

  📌 Anayasa Mahkemesi, **7/12/2023 tarihli ve E.2018/117, K.2023/212** sayılı kararıyla 2547 sayılı Kanun'un YÖK üye yapısına ilişkin 6. maddesinin (b) fıkrasını ve rektör atamasına ilişkin 13. maddesinin (a) bendinin birinci paragrafını iptal etmiştir. 18/6/2025 tarihli **7551 sayılı Kanun** bunları yeniden düzenlemiştir: YÖK yirmi bir üyeden oluşur; on dördünü Cumhurbaşkanı seçer, yedisi Üniversitelerarası Kurulca seçilip Cumhurbaşkanınca atanır (2547 sayılı Kanun m. 6/b); devlet ve vakıf üniversitelerine rektör Cumhurbaşkanınca atanır, vakıf üniversitelerinde atama mütevelli heyetinin teklifi üzerine yapılır (2547 sayılı Kanun m. 13/a). Bu iptal kararı belediyelere ilişkin hükümleri de kapsamıştır (bkz. mahalli idareler konusu). Çok avukatlı illerde asgari ikibin avukatla baro kurma imkânı ise 2020'de 7249 sayılı Kanunla getirilmiştir (1136 sayılı Kanun m. 77/1).
kritik: |
  - 📌 **Kuruluş:** Kamu tüzel kişiliği kanunla veya Cumhurbaşkanlığı kararnamesiyle kurulur (AY m. 123/3). Üniversiteler ve kamu kurumu niteliğindeki meslek kuruluşları ise Anayasa gereği **kanunla** kurulur (AY m. 130/1; AY m. 135/1).
  - 📌 **İhtisas ilkesi:** Hizmet yerinden yönetim kuruluşu yalnız kuruluş normunda gösterilen hizmetle sınırlıdır. Karar organı genellikle seçimle gelmez; bu, mahalli idarelerden farkıdır.
  - 📌 **Rektör ve dekan:** Rektörü Cumhurbaşkanı, dekanı Yükseköğretim Kurulu seçer ve atar (AY m. 130/6).
  - 📌 **Görevden uzaklaştırma güvencesi:** Üniversite organları ve öğretim elemanları, YÖK'ün veya üniversitelerin yetkili organları dışındaki makamlarca görevden uzaklaştırılamaz (AY m. 130/7).
  - 📌 **Üniversite bütçesi:** YÖK'çe tetkik ve onaylandıktan sonra Millî Eğitim Bakanlığına sunulur (AY m. 130/8).
  - ⚠️ **Vakıf üniversitesi:** Vakıf senediyle kurulmaz; kazanç amacı güdülemez ve Devlet gözetimine tabidir (AY m. 130/2).
  - 📌 **Meslek kuruluşu üyeliği:** Kamu kurum ve KİT'lerde asli ve sürekli görevde çalışanlar için girme mecburiyeti aranmaz (AY m. 135/2). Dernek ve sendikada ise üyelik zaten zorunlu değildir (AY m. 33; AY m. 51).
  - 📌 **Seçim:** Organlar üyelerce yargı gözetimi altında gizli oyla seçilir; siyasi partiler aday gösteremez (AY m. 135/1; AY m. 135/4).
  - ⚠️ **Organlara son verme:** Amaç dışı faaliyette sorumlu organların görevine idari kararla değil, kanunun belirlediği merciin veya savcının istemi üzerine mahkeme kararıyla son verilir (AY m. 135/6). Karşılaştırın: mahalli idarelerde geçici uzaklaştırmayı İçişleri Bakanı yapar (AY m. 127/4).
  - 📌 **Süreler:** Faaliyetten men kararı 24 saat içinde hâkim onayına sunulur; hâkim 48 saat içinde açıklamazsa karar kendiliğinden kalkar (AY m. 135/7).
  - 📌 **BİO listesi:** 5018 sayılı Kanun'un (III) sayılı cetveli 11 düzenleyici ve denetleyici kurumu sayar (5018 sayılı Kanun m. 3/c).
  - 📌 **Dava yeri:** Ülke çapında uygulanacak düzenleyici işlemler (kamu kuruluşları ve meslek kuruluşları dahil) Danıştayda ilk derecede dava edilir (2575 sayılı Kanun m. 24/1-c).
doktrin: |
  ### Bağımsız idari otoritelerin idari teşkilattaki yeri

  AY m. 123/2 idareyi merkezden yönetim ve yerinden yönetim diye ikiye ayırır. Bir görüş, bağımsız idari otoritelerin üzerinde klasik hiyerarşi ve vesayet bulunmadığı, bu nedenle merkezden yönetim ile hizmet yerinden yönetimin dışında **üçüncü (kendine özgü) bir kategori** oluşturduğunu savunur. Karşı görüş, Anayasa'nın ikili ayrımının kapalı olduğunu, bu kurumların ayrı tüzel kişilikleri ve bütçeleri bulunduğu için **hizmet yerinden yönetim kuruluşları** içinde, yalnızca özerkliği en yüksek olanlar olarak yer aldığını belirtir. Sınavda, soru "doktrinde" diye başlamadıkça yürürlükteki düzene (5018 sayılı Kanun m. 3/c; AY m. 123/2) dayanın.

  ### Meslek kuruluşlarının sınıflandırması

  Klasik kamu kurumları belli bir hizmet için ayrılmış **mal topluluğu** niteliğindedir (ör. sosyal güvenlik kurumları). Meslek kuruluşları ise belli bir meslek mensuplarının oluşturduğu **kişi topluluğu**dur. Bu nedenle bir görüş meslek kuruluşlarını hizmet yerinden yönetimin korporatif bir alt türü sayarken, diğer görüş onları ayrı bir yerinden yönetim grubu olarak değerlendirir. Her iki yaklaşımda da AY m. 135'teki kurallar ortaktır: kanunla kuruluş, seçimle organ, mahkeme kararıyla görevine son verme.

  ### Kurul üyelerinin bağımsızlığı

  Düzenleyici kurumların başkan ve üyelerinin atanma biçimi ile görev güvencelerinin hükümet sisteminde ne ölçüde korunduğu ve yürütme gücü karşısındaki bağımsızlığın derecesi tartışmalıdır; olay ve sorularda bu konu sonuca bağlanmaz.
sozluk:
  - terim: Hizmet yerinden yönetim
    tanim: "Belirli bir kamu hizmetinin, Devlet tüzel kişiliğinden ayrı, kamu tüzel kişiliği olan kuruluşlara bırakılması (AY m. 123/2-3)."
  - terim: İhtisas ilkesi
    tanim: "Kamu tüzel kişisinin yalnız kuruluş normunda gösterilen hizmet alanında faaliyet göstermesi kuralı."
  - terim: Kamu kurumu
    tanim: "Belirli bir hizmeti yürütmek üzere kurulan, kamu tüzel kişiliğine, bütçesine ve personeline sahip hizmet yerinden yönetim kuruluşu."
  - terim: Bilimsel özerklik
    tanim: "Üniversitelerin eğitim, araştırma ve yayın faaliyetlerinde bağımsız karar alabilmesi (AY m. 130/1)."
  - terim: Yükseköğretim Kurulu (YÖK)
    tanim: "Yükseköğretimi planlayan ve yönlendiren, özerkliğe ve kamu tüzel kişiliğine sahip üst kuruluş (AY m. 131; 2547 sayılı Kanun m. 6/a)."
  - terim: Kamu kurumu niteliğindeki meslek kuruluşu
    tanim: "Belli bir mesleğe mensupların kanunla kurulan, organları üyelerce yargı gözetiminde gizli oyla seçilen kamu tüzel kişisi (AY m. 135/1)."
  - terim: Üst kuruluş
    tanim: "Meslek kuruluşlarının üst birliği (ör. Türkiye Barolar Birliği); AY m. 135 üst kuruluşlar için de geçerlidir."
  - terim: Bağımsız idari otorite
    tanim: "Belirli sektörlerde düzenleme, lisans, denetim ve yaptırım yetkisi kullanan, özerk, kurul tipi kuruluş."
  - terim: Düzenleyici ve denetleyici kurum
    tanim: "5018 sayılı Kanun m. 3/c uyarınca (III) sayılı cetvelde yer alan kurum."
  - terim: Faaliyetten men
    tanim: "Kanunla yetkilendirilen merciin meslek kuruluşunu geçici olarak durdurması; 24 saatte hâkim onayına sunulur, hâkim 48 saatte açıklamazsa kendiliğinden kalkar (AY m. 135/7)."
kararlar: []
sorular:
  - soru: |
      Hizmet yerinden yönetim kuruluşları için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Kuruluş normunda gösterilen hizmet alanı dışında faaliyet gösteremezler (ihtisas ilkesi)."
      - "Karar organları kural olarak ilgili bölge halkınca seçilir."
      - "Kamu tüzel kişiliği taşımazlar; Devletin bir birimidir."
      - "Merkezi idarenin hiyerarşik emir yetkisi altındadırlar."
    dogru: 0
    aciklama: |
      Hizmet yerinden yönetim kuruluşları, kuruluş normunda gösterilen hizmetle sınırlı olarak faaliyet gösteren ve ayrı kamu tüzel kişiliği olan kuruluşlardır (AY m. 123/2-3). Seçimle oluşan karar organı yer yönünden yerinden yönetimin (mahalli idare) özelliğidir (AY m. 127/1).
  - soru: |
      Bir Cumhurbaşkanlığı kararnamesiyle "X Üniversitesi" adlı kamu tüzel kişisi kurulmak istenmektedir. Bu girişimle ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Üniversiteler Devlet tarafından kanunla kurulur; kararnameyle kurulamaz."
      - "AY m. 123/3 gereği kamu tüzel kişisi kararnameyle kurulabildiği için girişim geçerlidir."
      - "Üniversite ancak vakıf senediyle kurulabilir."
      - "Üniversite Yükseköğretim Kurulunun kararıyla kurulur."
    dogru: 0
    aciklama: |
      Kamu tüzel kişiliği genel olarak kanunla veya Cumhurbaşkanlığı kararnamesiyle kurulur (AY m. 123/3). Ancak Anayasa üniversiteler için özel olarak Devlet tarafından kanunla kurulmayı öngörür (AY m. 130/1; 2547 sayılı Kanun m. 5).
  - soru: |
      Devlet üniversitesi Hukuk Fakültesinde dekanlık görevi boşalmıştır. Rektör, kendi seçtiği bir profesörü doğrudan dekan olarak atamıştır. Bu işlem hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Dekanları Yükseköğretim Kurulu seçer ve atar; rektörün doğrudan ataması yetki bakımından hukuka aykırıdır."
      - "Dekanları Cumhurbaşkanı atar; rektör yalnız öneride bulunur."
      - "Dekanı fakülte öğretim üyeleri seçer; rektör onaylar."
      - "Dekan atama yetkisi rektöre aittir; işlem hukuka uygundur."
    dogru: 0
    aciklama: |
      Rektörler Cumhurbaşkanınca, dekanlar ise Yükseköğretim Kurulunca seçilir ve atanır (AY m. 130/6). Kanuna göre dekan, rektörün önereceği üç profesör arasından YÖK tarafından seçilir (2547 sayılı Kanun m. 16).
  - soru: |
      Bir ilin valisi, devlet üniversitesinin yönetim kurulu üyesini kampüsteki olaylar gerekçesiyle geçici olarak görevden uzaklaştırmıştır. Bu işlem hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Üniversite organları, YÖK'ün veya üniversitelerin yetkili organları dışındaki makamlarca görevden uzaklaştırılamaz; işlem Anayasa'ya aykırıdır."
      - "Vali, genel kolluk yetkisine dayanarak her üniversite organını uzaklaştırabilir."
      - "Yalnız İçişleri Bakanı, görevle ilgili suç nedeniyle geçici uzaklaştırma yapabilir."
      - "Uzaklaştırma ancak Danıştay kararıyla olur."
    dogru: 0
    aciklama: |
      Üniversite yönetim ve denetim organları ile öğretim elemanları, YÖK'ün veya üniversitelerin yetkili organlarının dışında kalan makamlarca her ne suretle olursa olsun görevlerinden uzaklaştırılamazlar (AY m. 130/7). İçişleri Bakanının geçici uzaklaştırma yetkisi mahalli idare organlarına ilişkindir (AY m. 127/4), üniversitelere uygulanmaz.
  - soru: |
      Üniversite bütçeleri Anayasa'ya göre hangi usulle yürürlüğe konulur?
    siklar:
      - "YÖK'çe tetkik ve onaylandıktan sonra Millî Eğitim Bakanlığına sunulur."
      - "Doğrudan Maliye Bakanlığına sunulur; YÖK'ün görüşü aranmaz."
      - "Üniversite senatosu bütçeyi onaylar; hiçbir makama sunulmaz."
      - "Cumhurbaşkanlığı kararnamesiyle belirlenir."
    dogru: 0
    aciklama: |
      Üniversitelerin hazırladığı bütçeler Yükseköğretim Kurulunca tetkik ve onaylandıktan sonra Millî Eğitim Bakanlığına sunulur ve merkezi yönetim bütçesinin bağlı olduğu esaslara uygun olarak işleme tabi tutularak yürürlüğe konulur ve denetlenir (AY m. 130/8).
  - soru: |
      Bir kamu kurumunda asli ve sürekli görevle çalışan mühendis memur M, hiçbir meslek odasına kayıtlı değildir. İnşaat Mühendisleri Odası, kayıt yaptırmadığı gerekçesiyle M'ye para cezası vermiştir. Bu işlem hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Kamu kurumlarında asli ve sürekli görevlerde çalışanlar için meslek kuruluşuna girme mecburiyeti aranmaz; ceza hukuka aykırıdır."
      - "Mühendislik odalarına üyelik herkes için zorunludur; ceza hukuka uygundur."
      - "Girme mecburiyeti istisnası yalnız kamu iktisadi teşebbüslerinde çalışanlar içindir; kamu kurumunda çalışan M'ye verilen ceza hukuka uygundur."
      - "Mecburiyet vardır ancak ceza yalnız savcının istemiyle verilebilir."
    dogru: 0
    aciklama: |
      Kamu kurum ve kuruluşları ile kamu iktisadi teşebbüslerinde asli ve sürekli görevlerde çalışanların meslek kuruluşlarına girme mecburiyeti aranmaz (AY m. 135/2). Mecburiyetin sınırı bu istisnadır; serbest çalışanlar için üyelik zorunludur.
  - soru: |
      Bir Bakanlık, tabip odası yönetim kurulunun amaç dışı siyasi faaliyette bulunduğu gerekçesiyle yönetim kurulunun görevine bakanlık oluruyla son vermiştir. Bu işlem hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Sorumlu organların görevine kanunun belirlediği merciin veya Cumhuriyet savcısının istemi üzerine mahkeme kararıyla son verilebilir; bakanlık işlemi hukuka aykırıdır."
      - "Bakan, oda organlarını idari kararla görevden alabilir."
      - "Amaç dışı faaliyet halinde organlara son vermek yalnızca Danıştayın görevidir."
      - "Oda organlarına hiçbir şekilde son verilemez."
    dogru: 0
    aciklama: |
      Amaçları dışında faaliyet gösteren meslek kuruluşlarının sorumlu organlarının görevine, kanunun belirlediği merciin veya Cumhuriyet savcısının istemi üzerine mahkeme kararıyla son verilir ve yerlerine yenileri seçtirilir (AY m. 135/6). İdari kararla görevine son verme bu rejimle bağdaşmaz.
  - soru: |
      Meslek kuruluşunu faaliyetten men eden idari karar, Anayasa'ya göre hangi sürelerle yargısal güvenceye bağlanmıştır?
    siklar:
      - "Karar 24 saat içinde hâkim onayına sunulur; hâkim 48 saat içinde açıklamazsa karar kendiliğinden kalkar."
      - "Karar 48 saat içinde hâkim onayına sunulur; hâkim 24 saat içinde açıklar."
      - "Karar 7 gün içinde mahkemeye sunulur; mahkeme 30 gün içinde karar verir."
      - "Karar 24 saat içinde Danıştaya bildirilir; Danıştay karar verinceye kadar uygulanır."
    dogru: 0
    aciklama: |
      Faaliyetten men yetkisi kanunla bir mercie verilebilir. Bu merciin kararı yirmidört saat içinde görevli hâkimin onayına sunulur; hâkim kararını kırksekiz saat içinde açıklar, aksi hâlde idari karar kendiliğinden yürürlükten kalkar (AY m. 135/7).
  - soru: |
      Bir ilde 6.200 avukat kayıtlıdır. Avukatlık Kanunu'na göre bu ilde ek bir baro kurulabilmesi için asgari kaç avukat gerekir?
    siklar:
      - "2.000 avukat; yeni baro, kuruluş talebi ve imzaları Türkiye Barolar Birliğine verilerek kurulur."
      - "Otuz avukat yeter; il sınırı gözetilmez."
      - "5.000 avukat; il nüfusu gözetilmez."
      - "Yeni baro kurulamaz; ilde tek baro bulunur."
    dogru: 0
    aciklama: |
      Beşbinden fazla avukat bulunan illerde asgari ikibin avukatla bir baro kurulabilir; kuruluş talebi ve imzalar Türkiye Barolar Birliğine verilir (1136 sayılı Kanun m. 77/1). Bölgesinde en az otuz avukat bulunan her il merkezinde bir baro kurulması ise genel kuraldır.
  - soru: |
      Aşağıdaki kurumlardan hangisi 5018 sayılı Kanun'a ekli (III) sayılı cetvelde düzenleyici ve denetleyici kurum olarak sayılmıştır?
    siklar:
      - "Sermaye Piyasası Kurulu"
      - "Yükseköğretim Kurulu"
      - "Türkiye Barolar Birliği"
      - "Türkiye Radyo-Televizyon Kurumu"
    dogru: 0
    aciklama: |
      (III) sayılı cetvel 11 kurumu sayar; bunlar arasında Sermaye Piyasası Kurulu bulunur (5018 sayılı Kanun m. 3/c). YÖK (II) sayılı cetvelde özel bütçeli idareler arasındadır, Türkiye Barolar Birliği meslek kuruluşunun üst kuruluşudur, TRT ise düzenleyici değil yayıncı bir kamu kurumudur (AY m. 133).
  - soru: |
      Bilgi Teknolojileri ve İletişim Kurumu, ülke çapında uygulanacak bir yönetmelik çıkarmıştır. Yönetmeliğin iptali için açılacak davanın görüleceği yer hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Dava, ilk derece mahkemesi olarak Danıştayda görülür."
      - "Dava, kurumun bulunduğu yerdeki idare mahkemesinde görülür."
      - "Dava, asliye hukuk mahkemesinde görülür."
      - "Dava, Anayasa Mahkemesinde görülür."
    dogru: 0
    aciklama: |
      Bakanlıklar ile kamu kuruluşları veya kamu kurumu niteliğindeki meslek kuruluşlarınca çıkarılan ve ülke çapında uygulanacak düzenleyici işlemlere karşı açılacak iptal ve tam yargı davaları Danıştayda ilk derece mahkemesi olarak görülür (2575 sayılı Kanun m. 24/1-c). Düzenleyici işlem kamu tüzelkişilerinin çıkardığı yönetmelik biçimindedir (AY m. 124).
  - soru: |
      Dernekler, sendikalar ve kamu kurumu niteliğindeki meslek kuruluşları arasındaki fark bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Kimse derneğe ya da sendikaya üye olmaya zorlanamaz; serbest çalışanlar ise ilgili meslek kuruluşuna üye olmak zorundadır."
      - "Üçünde de üyelik zorunludur."
      - "Üçü de kamu tüzel kişisidir."
      - "Üçünün organları siyasi partilerin göstereceği adaylar arasından seçilir."
    dogru: 0
    aciklama: |
      Hiç kimse bir derneğe üye olmaya ve dernekte üye kalmaya (AY m. 33), bir sendikaya üye olmaya ya da üyelikten ayrılmaya (AY m. 51) zorlanamaz. Meslek kuruluşları ise kamu tüzel kişisidir; organ seçimlerinde siyasi partiler aday gösteremez (AY m. 135/1; AY m. 135/4).
olaylar:
  - olay: |
      A Vakfı, noterde düzenlediği ek vakıf senediyle "A Üniversitesi"ni kurduğunu ilan etmiştir. Öte yandan Devlet Üniversitesi B'nin Hukuk Fakültesi dekanlığı boşalınca B'nin rektörü, bir profesörü doğrudan dekan atamıştır. Kampüste yaşanan olaylar üzerine ilin valisi, B Üniversitesi yönetim kurulunun bir üyesini geçici olarak görevden uzaklaştırmıştır. B Üniversitesi, hazırladığı bütçeyi YÖK'e sunmadan doğrudan Millî Eğitim Bakanlığına göndermiştir.

      1. A Vakfının işlemi hukuka uygun mudur?
      2. Dekanın rektörce atanması hukuka uygun mudur? Dekanları kim seçer ve atar?
      3. Valinin işlemi hukuka uygun mudur?
      4. B Üniversitesinin bütçeyi doğrudan Bakanlığa göndermesi hukuka uygun mudur?
    olcut:
      - {tespit: "Üniversitenin kamu tüzel kişiliği ve bilimsel özerkliği olan, Devlet tarafından kanunla kurulan bir kurum olduğu; vakfın senetle üniversite kuramayacağı", puan: 25, madde: "AY m. 130/1"}
      - {tespit: "Vakıfların yalnız kanunda gösterilen esaslara göre, kazanç amacı gütmeksizin ve Devletin gözetimine tabi yükseköğretim kurumu kurabileceği", puan: 15, madde: "AY m. 130/2"}
      - {tespit: "Dekanların YÖK tarafından seçilip atanması; rektörün doğrudan ataması yetkisizdir", puan: 20, madde: "AY m. 130/6"}
      - {tespit: "Üniversite organlarının YÖK ya da üniversitenin yetkili organları dışında kalan makamlarca (vali) uzaklaştırılamayacağı", puan: 25, madde: "AY m. 130/7"}
      - {tespit: "Bütçenin YÖK'çe tetkik ve onaylandıktan sonra Millî Eğitim Bakanlığına sunulması", puan: 15, madde: "AY m. 130/8"}
    cozum: |
      **Nitelendirme:** Olay, hizmet yerinden yönetim kuruluşlarından üniversitenin kuruluş, atama, görevden uzaklaştırma ve bütçe rejimini sınar. Üniversite, AY m. 123/2'deki yerinden yönetimin hizmet yönünden olanlarından biridir; kamu tüzel kişiliğine ve bilimsel özerkliğe sahiptir (AY m. 130/1).

      Soruların hepsi, üniversitenin Anayasa'da ayrıca güvenceye bağlanmış özel bir kamu tüzel kişisi olduğu noktasında birleşir.

      **Hukuki sorunlar:** (1) vakıf senediyle üniversite kurulup kurulamayacağı; (2) dekan atama yetkisi; (3) valinin uzaklaştırma yetkisi; (4) bütçenin yürürlüğe konması.

      **İlgili hükümler ve değerlendirme:** Üniversiteler Devlet tarafından kanunla kurulur (AY m. 130/1). Vakıflar da kazanç amacına yönelik olmamak şartıyla yükseköğretim kurumu kurabilir; ancak bu, kanunda gösterilen usul ve esaslara göre ve Devletin gözetim ve denetimi altında yapılır (AY m. 130/2). Noterde düzenlenen bir vakıf senedi, tek başına üniversite doğurmaz; A Vakfının "A Üniversitesi"ni kurduğuna ilişkin ilanı hukuken geçerli sonuç doğurmaz. Üniversite bütçeleri YÖK'çe tetkik ve onaylandıktan sonra Millî Eğitim Bakanlığına sunulur, merkezi yönetim bütçesinin bağlı olduğu esaslara uygun olarak işleme tabi tutularak yürürlüğe konulur ve denetlenir (AY m. 130/8). B Üniversitesinin bütçeyi YÖK'e sunmadan doğrudan Bakanlığa göndermesi bu usule uymaz.

      Dekanlar Yükseköğretim Kurulunca seçilir ve atanır (AY m. 130/6); rektörün doğrudan atama yapması yetkisizlik nedeniyle hukuka aykırıdır. Dekanın seçiminde rektör yalnız öneride bulunur: rektörün önereceği üç profesör arasından YÖK seçer (2547 sayılı Kanun m. 16). Üniversite yönetim ve denetim organları ile öğretim elemanları, YÖK'ün veya üniversitelerin yetkili organlarının dışında kalan makamlarca her ne suretle olursa olsun görevlerinden uzaklaştırılamaz (AY m. 130/7). Vali bu makamlar arasında olmadığından yönetim kurulu üyesini geçici olarak dahi uzaklaştıramaz; işlem Anayasa'ya aykırıdır. Mahalli idarelerde görevle ilgili suç nedeniyle uzaklaştırma yetkisi İçişleri Bakanındır (AY m. 127/4); bu yetki üniversitelere genişletilemez. Üniversiteler Devletin gözetimi ve denetimi altındadır (AY m. 130/5); ancak bu gözetim, organlara tanınan güvenceyi ortadan kaldırmaz. Güvenlik gerekçesi de valiye uzaklaştırma yetkisi vermez, yalnız güvenlik hizmetlerinin Devletçe sağlanmasını gerektirir.

      **Sonuç:** A Vakfının işlemi geçersizdir; rektörün dekan ataması, valinin uzaklaştırması ve bütçenin YÖK'ü atlayarak gönderilmesi hukuka aykırıdır.
  - olay: |
      Bir kamu kurumunda asli ve sürekli görevle çalışan inşaat mühendisi M, İnşaat Mühendisleri Odasına kayıt yaptırmamıştır. Oda, bu gerekçeyle M'ye para cezası vermiştir. Odanın yönetim kurulu hakkında basında "siyasi faaliyette bulunduğu" yönünde haberler çıkınca ilgili Bakanlık, bir olurla yönetim kurulunun görevine son vermiş ve yerine geçici bir kurul atamıştır. Ayrıca Y Partisi, odanın yaklaşan organ seçimlerinde kendi göstereceği adayların listesini açıklamıştır.

      1. M'ye verilen para cezası hukuka uygun mudur?
      2. Bakanlığın işlemi hukuka uygun mudur? Oda organlarının görevine nasıl son verilebilir?
      3. Faaliyetten men yetkisi nasıl kullanılabilir ve hangi güvenceye bağlıdır?
      4. Y Partisinin adaylarını göstermesi hukuka uygun mudur?
    olcut:
      - {tespit: "Kamu kurum ve kuruluşlarında asli ve sürekli görevde çalışanlar için meslek kuruluşuna girme mecburiyeti aranmaz", puan: 25, madde: "AY m. 135/2"}
      - {tespit: "Meslek kuruluşunun kanunla kurulan, organları üyelerce yargı gözetimi altında gizli oyla seçilen kamu tüzel kişisi olduğu", puan: 15, madde: "AY m. 135/1"}
      - {tespit: "Amaç dışı faaliyette organların görevine kanunun belirlediği merciin veya Cumhuriyet savcısının istemiyle mahkeme kararıyla son verilebileceği; bakanlık oluruyla verilemeyeceği", puan: 25, madde: "AY m. 135/6"}
      - {tespit: "Faaliyetten men kararının 24 saat içinde hâkim onayına sunulması ve hâkimin 48 saat içinde açıklamaması hâlinde kendiliğinden kalkması", puan: 15, madde: "AY m. 135/7"}
      - {tespit: "Organ seçimlerinde siyasi partilerin aday gösteremeyeceği", puan: 20, madde: "AY m. 135/4"}
    cozum: |
      **Nitelendirme:** İnşaat Mühendisleri Odası, AY m. 135/1 anlamında kamu kurumu niteliğindeki bir meslek kuruluşudur: kanunla kurulmuş, organları üyelerce yargı gözetimi altında ve gizli oyla seçilen bir kamu tüzel kişisidir. Dernek ya da sendika gibi özel hukuk tüzel kişisi değildir.

      Dernek ve sendikadan farkı, üyelik zorunluluğunun ve kamu gücü yetkilerinin bulunmasıdır.

      **Hukuki sorunlar:** (1) kayıt zorunluluğu ve para cezası; (2) organların görevine son verme; (3) faaliyetten men; (4) siyasi partilerin aday göstermesi.

      **İlgili hükümler ve değerlendirme:** Kamu kurum ve kuruluşları ile kamu iktisadi teşebbüslerinde asli ve sürekli görevlerde çalışanların meslek kuruluşlarına girme mecburiyeti aranmaz (AY m. 135/2). M, bir kamu kurumunda asli ve sürekli görevle çalıştığından kayıt yaptırmak zorunda değildir; ceza bu nedenle hukuka aykırıdır. Serbest çalışan bir mühendis için sonuç farklı olurdu.

      Amaçları dışında faaliyet gösteren meslek kuruluşlarının sorumlu organlarının görevine, kanunun belirlediği merciin veya Cumhuriyet savcısının istemi üzerine mahkeme kararıyla son verilir ve yerlerine yenileri seçtirilir (AY m. 135/6). Bakanlığın olurla yönetim kuruluna son vermesi ve yerine kurul atanması bu rejime aykırıdır; seçilmiş organın yerini seçim doldurur, atama değil; çünkü organlar üyelerce seçilmek zorundadır (AY m. 135/1). Oda kamu tüzel kişisi olduğundan başka bir yönetim organı da atanamaz. Gecikmede sakınca varsa milli güvenlik, kamu düzeni ya da suçun önlenmesi gibi sebeplerle kanunla yetkilendirilmiş bir merci meslek kuruluşunu faaliyetten men edebilir; ancak karar 24 saat içinde görevli hâkimin onayına sunulur, hâkim 48 saat içinde açıklamazsa karar kendiliğinden yürürlükten kalkar (AY m. 135/7). Basın haberleri bu hâllerden biri sayılmaz; bakanlık olurunun bu yolla da dayanağı yoktur.

      Meslek kuruluşları ve üst kuruluşları organlarının seçimlerinde siyasi partiler aday gösteremez (AY m. 135/4). Y Partisinin kendi adaylarını açıklaması Anayasa'ya aykırıdır; seçimin siyasi parti adayı gösterilmeden, üyelerce yargı gözetiminde gizli oyla yapılması gerekir.

      **Sonuç:** M'ye verilen ceza hukuka aykırıdır. Bakanlığın işlemi yetkisiz ve Anayasa'ya aykırıdır; yönetim kurulunun görevine ancak mahkeme kararıyla son verilebilir. Y Partisinin aday göstermesi AY m. 135/4'e aykırıdır.
kartlar:
  - on: "Hizmet yerinden yönetimin yer yönünden yerinden yönetimden farkı?"
    arka: "Esas olan belirli bir hizmettir (ihtisas ilkesi); karar organları genellikle atanır. Mahalli idarede esas yer halkıdır ve karar organı seçilir (AY m. 123/2; AY m. 127/1)."
  - on: "Kamu tüzel kişiliği hangi araçlarla kurulur?"
    arka: "Kanunla veya Cumhurbaşkanlığı kararnamesiyle (AY m. 123/3). Üniversite ve meslek kuruluşu için Anayasa kanunla kuruluşu şart koşar."
  - on: "Üniversiteler nasıl kurulur ve hangi niteliklere sahiptir?"
    arka: "Devlet tarafından kanunla kurulur; kamu tüzel kişiliği ve bilimsel özerkliği vardır (AY m. 130/1)."
  - on: "Rektör ve dekanı kim seçer/atar?"
    arka: "Rektörü Cumhurbaşkanı, dekanı Yükseköğretim Kurulu seçer ve atar (AY m. 130/6)."
  - on: "Üniversite organlarını kim görevden uzaklaştıramaz?"
    arka: "YÖK'ün veya üniversitelerin yetkili organları dışındaki makamlar (ör. vali) uzaklaştıramaz (AY m. 130/7)."
  - on: "Üniversite bütçesi nasıl yürürlüğe girer?"
    arka: "YÖK'çe tetkik ve onaylanır, Millî Eğitim Bakanlığına sunulur (AY m. 130/8)."
  - on: "Vakıf yükseköğretim kurumu için temel şartlar?"
    arka: "Kazanç amacı güdülmez, kanunda gösterilen esaslara göre kurulur, Devletin gözetim ve denetimine tabidir (AY m. 130/2)."
  - on: "Kamu kurumu niteliğindeki meslek kuruluşunun tanımı?"
    arka: "Kanunla kurulan, organları üyelerce yargı gözetimi altında gizli oyla seçilen kamu tüzel kişisi (AY m. 135/1)."
  - on: "Meslek kuruluşuna girme mecburiyetinin istisnası?"
    arka: "Kamu kurum ve kuruluşları ile KİT'lerde asli ve sürekli görevde çalışanlar için aranmaz (AY m. 135/2)."
  - on: "Meslek kuruluşu organlarının görevine nasıl son verilir?"
    arka: "Amaç dışı faaliyette, kanunun belirlediği merciin veya savcının istemiyle mahkeme kararıyla (AY m. 135/6)."
  - on: "Meslek kuruluşunu faaliyetten men kararının güvencesi?"
    arka: "24 saatte hâkim onayına sunulur; hâkim 48 saatte açıklamazsa karar kendiliğinden kalkar (AY m. 135/7)."
  - on: "Düzenleyici ve denetleyici kurumların ülke çapındaki düzenleyici işlemleri nerede dava edilir?"
    arka: "Danıştayda ilk derece mahkemesi olarak (2575 sayılı Kanun m. 24/1-c). Bu kurumlar 5018 sayılı Kanun'un (III) sayılı cetvelinde sayılır (5018 sayılı Kanun m. 3/c)."
