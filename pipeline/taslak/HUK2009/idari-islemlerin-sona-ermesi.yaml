sorular:
  - soru: |
      Aşağıdakilerden hangisi idari işlemin geri alınmasını doğru tanımlar?
    siklar:
      - "Hukuka aykırı bir idari işlemin idarece, yapıldığı andan itibaren ortadan kaldırılması"
      - "Hukuka uygun bir idari işlemin yalnızca gelecek için ortadan kaldırılması"
      - "İdari işlemin mahkeme kararıyla iptali"
      - "İdari işlemin yazım hatasının düzeltilmesi"
    dogru: 0
    aciklama: |
      Geri alma, hukuka aykırı işlemin idare tarafından yeni bir işlemle geçmişe etkili olarak, yani yapıldığı andan itibaren ortadan kaldırılmasıdır. Yalnızca gelecek için sona erdirmek kaldırmadır; mahkeme iptali idarenin değil yargının işlemidir; maddi hata giderilmesi ise düzeltmedir.
  - soru: |
      Kaldırma (ilga) işlemi hakkında hangisi doğrudur?
    siklar:
      - "Yalnızca hukuka aykırı işlemlere uygulanır."
      - "Geleceğe etkilidir; işlemin kaldırıldığı tarihe kadar doğurduğu sonuçlara dokunulmaz."
      - "Geçmişe etkilidir; işlem baştan itibaren hiç doğmamış sayılır."
      - "Yalnızca mahkeme tarafından yapılabilir."
    dogru: 1
    aciklama: |
      Kaldırma, işlemi geleceğe etkili olarak sona erdirir; geçmişte doğan sonuçlar geçerliliğini korur. Geçmişe etkili olan geri alma ya da yargı kararıyla iptaldir. Kaldırma hukuka uygun işlemlere de uygulanabilir ve idarenin yaptığı karşıt bir işlemdir.
  - soru: |
      Hukuka aykırı olarak yapılmış, kişi lehine hak doğuran bir işlemin, ilgilinin hilesi, açık hata ve işlemde yokluk bulunmaması şartıyla, idarece geri alınabilmesi için kural olarak hangi süre içinde hareket edilmelidir?
    siklar:
      - "Otuz gün"
      - "Dava açma süresi olan altmış gün"
      - "Bir yıl"
      - "Süre sınırı yoktur"
    dogru: 1
    aciklama: |
      Danıştay içtihadında hukuka aykırı, hak doğuran işlemin kural olarak dava açma süresi içinde geri alınabileceği kabul edilir. Dava açma süresi özel kanunda aksi yoksa Danıştay ve idare mahkemelerinde altmış gündür (İYUK m. 7/1). Süre geçtikten sonra hile, açık hata ya da yokluk yoksa kazanılmış hak doğar.
  - soru: |
      Kemal, memuriyete atanmak için sahte diploma sunmuş ve atanmıştır. Atamadan beş yıl sonra sahtelik anlaşılmıştır. İdare, atama işlemini geri almak istemektedir. Hangisi doğrudur?
    siklar:
      - "Altmış gün geçtiği için atama artık geri alınamaz."
      - "Atama kazanılmış hak doğurduğundan yalnız kaldırılabilir, geri alınamaz."
      - "Atama, ilgilinin hilesine dayandığı için dava açma süresi geçmiş olsa da geri alınabilir."
      - "Atama ancak mahkeme kararıyla ortadan kaldırılabilir."
    dogru: 2
    aciklama: |
      İşlem ilgilinin sahte belgesi ya da gerçeğe aykırı beyanı yüzünden tesis edilmişse iyi niyet ve kazanılmış haktan söz edilemez; işlem dava açma süresi geçse bile geri alınabilir. Atamanın mahkeme kararı olmadan geri alınamayacağı yönünde bir kural yoktur.
  - soru: |
      Belediye encümeni, bütün kanuni şartları taşıyan Ayşe'ye işyeri açma ruhsatı vermiştir. İki ay sonra encümen, işyerinin bulunduğu sokaktaki trafik yoğunluğunun arttığını gerekçe göstererek ruhsatı geçmişe etkili geri almıştır. Bu işlemle ilgili hangisi doğrudur?
    siklar:
      - "Kamu yararı gerekçesi olduğu için geri alma hukuka uygundur."
      - "Altmış gün dolmadığı için geri alma hukuka uygundur."
      - "Hukuka uygun hak doğuran işlem geri alınamayacağından, geri alma işlemi hukuka aykırıdır."
      - "Ruhsat düzenleyici işlem olduğundan geri alma serbesttir."
    dogru: 2
    aciklama: |
      Ruhsat, hukuka uygun ve ilgili lehine hak doğuran bireysel işlemdir. Hukuka uygun hak doğuran işlemler kazanılmış hak yaratır ve geri alınamaz. Altmış günlük süre, yalnızca hukuka aykırı işlemlerin geri alınması bakımından önemlidir. Ruhsat bireysel işlemdir, düzenleyici değildir.
  - soru: |
      Zeynep, yatay geçiş başvurusunda bütün belgelerini doğru sunmuştur. Fakülte yönetim kurulu, yönetmelik şartını yanlış yorumlayarak başvurusunu kabul etmiştir. Zeynep hile yapmamıştır, işlem yok hükmünde değildir ve hata ancak ayrıntılı bir hukuki incelemeyle anlaşılabilecek nitelikte olduğundan açık hata da sayılmaz. Üç yıl sonra yeni dekan kaydı geri almıştır. Hangisi doğrudur?
    siklar:
      - "Geri alma işlemi, hata idareden kaynaklandığı için hukuka uygundur."
      - "Altmış gün geçmiş, hile, açık hata ve yokluk bulunmadığından geri alma işlemi hukuka aykırıdır."
      - "Geri alma ancak Zeynep razıysa yapılabilir."
      - "İdare, hata kendisinden kaynaklandığında işlemi her zaman geri alabilir."
    dogru: 1
    aciklama: |
      Hukuka aykırı olsa bile hak doğuran işlem, dava açma süresi geçtikten sonra, yokluk, açık hata ya da hile yoksa geri alınamaz; kazanılmış hak doğmuştur. İdarenin kendi hatası, açık hata niteliğinde değilse süresiz geri almayı haklı kılmaz. Bu olayda hata ancak ayrıntılı incelemeyle anlaşılabildiğinden açık hata istisnası uygulanmaz.
  - soru: |
      Bakanlık, bir yönetmelikle öğrencilere burs hakkı tanımış, daha sonra yeni bir yönetmelikle bu hükmü yürürlükten kaldırmıştır. Hangisi doğrudur?
    siklar:
      - "Düzenleyici işlem kazanılmış hak doğurmadığından kaldırma geleceğe etkili olarak yapılabilir."
      - "Yönetmeliğin kaldırılması için mahkeme kararı gerekir."
      - "Kaldırma geçmişe etkili olacağından önceki ödemeler geri istenir."
      - "Düzenleyici işlem hiçbir şekilde değiştirilemez."
    dogru: 0
    aciklama: |
      Düzenleyici işlemler genel ve soyut kural koyar; tek başlarına kazanılmış hak doğurmaz ve idare bunları geleceğe etkili kaldırabilir veya değiştirebilir. Kaldırma geçmişe etkili olmadığından yürürlükte iken yapılan ödemeler geri istenemez.
  - soru: |
      İYUK m. 11'e göre ilgililer dava açmadan önce işlemin kaldırılması, geri alınması veya değiştirilmesi için idareye başvurursa, cevap verilmeyen hâlde isteğin reddedilmiş sayılması için gereken süre (7331 sayılı Kanun sonrası) nedir?
    siklar:
      - "Altmış gün"
      - "Otuz gün"
      - "On beş gün"
      - "Doksan gün"
    dogru: 1
    aciklama: |
      İYUK m. 11/2'ye göre otuz gün içinde cevap verilmezse istek reddedilmiş sayılır. 8/7/2021 tarihli 7331 sayılı Kanunla bu süre altmış günden otuz güne indirilmiştir.
  - soru: |
      Mustafa, Danıştay ve idare mahkemelerindeki altmış günlük dava açma süresinin 20. gününde, işlemin kaldırılması için üst makama başvurmuş; otuz gün içinde cevap alamamıştır. Hangisi doğrudur?
    siklar:
      - "Dava açma süresi başvuruyla sona erer."
      - "İstek reddedilmiş sayılır; süre yeniden işler ve başvuruya kadar geçen 20 gün hesaba katılır."
      - "Başvuru, sürenin 60 gün olarak yeniden başlamasını sağlar."
      - "Zımni red sayıldığı için artık dava açılamaz."
    dogru: 1
    aciklama: |
      İYUK m. 11/1'e göre başvuru işlemeye başlamış dava açma süresini durdurur. Otuz günlük sürenin sonunda istek reddedilmiş sayılır ve dava açma süresi yeniden işlemeye başlar; başvuru tarihine kadar geçen süre de hesaba katılır (İYUK m. 11/3). Mustafa'nın 40 günü kalır.
  - soru: |
      İdare mahkemesi, bir belediyenin ruhsat iptaline ilişkin işlemini iptal etmiş, karar idareye tebliğ edilmiştir. İYUK m. 28/1'e göre idarenin yükümlülüğü nedir?
    siklar:
      - "İptal kararına uymak isteğe bağlıdır; uyuşmazlık Danıştaya götürülür."
      - "Kararın icaplarına göre gecikmeksizin işlem tesis etmek; bu süre kararın tebliğinden itibaren otuz günü geçemez."
      - "Kararın icaplarına göre altmış gün içinde işlem tesis etmek."
      - "Karar kesinleşinceye kadar bekleyerek işlem tesis etmek."
    dogru: 1
    aciklama: |
      İYUK m. 28/1'e göre idare, mahkeme kararlarının icaplarına göre gecikmeksizin işlem tesis etmeye veya eylemde bulunmaya mecburdur ve bu süre hiçbir şekilde kararın idareye tebliğinden başlayarak otuz günü geçemez. Kesinleşmenin beklenmesi yalnız 7588 sayılı Kanunla eklenen cümlede sayılan personel davalarındaki göreve iade kararları için öngörülmüştür; ruhsat uyuşmazlığı bu kapsamda değildir. Uymazsa tazminat davası açılabilir (İYUK m. 28/3).
  - soru: |
      Bir idarenin hukuka aykırı bir işlemi geri alması, ilgili kişi için ayrı bir sonuç doğurur. Bu geri alma işlemi hakkında hangisi doğrudur?
    siklar:
      - "Geri alma bir iç işlemdir; dava konusu olamaz."
      - "Geri alma da yeni bir idari işlemdir; yetki, şekil, sebep, konu ve maksat yönünden hukuka aykırıysa iptal davasına konu olur."
      - "Geri alma yalnızca tam yargı davasının konusu olabilir."
      - "Geri alma işlemine karşı yalnızca üst makama başvurulabilir."
    dogru: 1
    aciklama: |
      Geri alma, kaldırma ve değiştirme işlemleri başlı başına birer idari işlemdir. İdari işlemlere karşı yetki, şekil, sebep, konu ve maksat yönlerinden biriyle hukuka aykırılık iddiasıyla iptal davası açılabilir (İYUK m. 2/1-a). Zarar doğmuşsa tam yargı davası da açılabilir (İYUK m. 2/1-b).
  - soru: |
      Belediye, bir lokanta işletmecisine beş yıl süreli işletme ruhsatı vermiştir. Beş yıl sona erdiğinde ruhsatın hukuki durumu için hangisi doğrudur?
    siklar:
      - "Belediye geri alma işlemi yapmadıkça ruhsat geçerli kalır."
      - "Ruhsat, süresinin dolmasıyla kendiliğinden sona erer."
      - "Ruhsat ancak mahkeme kararıyla ortadan kalkar."
      - "Ruhsat, kaldırma işlemiyle geçmişe etkili sona erer."
    dogru: 1
    aciklama: |
      Belirli süre için yapılmış işlemler sürenin dolmasıyla kendiliğinden sona erer; ayrıca geri alma ya da kaldırma işlemi gerekmez. Bu, idarenin iradesi dışındaki sona erme nedenlerinden biridir.
olaylar:
  - olay: |
      Devlet üniversitesinin Hukuk Fakültesine 1 Eylül 2022'de iki öğrenci yatay geçişle kabul edilmiştir.
      Öğrenci Ömer, yatay geçiş başvurusunda 2.10 olan not ortalamasını bilgisayarla tahrif ederek 3.60 göstermiştir. Sahtelik, üç yıl sonra yapılan denetimde ortaya çıkmıştır.
      Öğrenci Zeynep ise belgelerini eksiksiz ve doğru sunmuştur. Fakülte yönetim kurulu, yönetmelikte aranan bir şartı yanlış yorumlayarak yatay geçişi kabul etmiştir. Zeynep derslerini başarıyla vermiş, mezuniyet aşamasına gelmiştir. Yeni dekan, 15 Mayıs 2025'te yönetim kurulunun yönetmelik şartını yanlış yorumladığını belirterek Zeynep'in yatay geçiş işlemini geri almış ve kaydını silmiştir. Zeynep'in işlemde herhangi bir hilesi yoktur, işlem yok hükmünde değildir ve yönetim kurulunun yanılgısı ancak ayrıntılı bir hukuki incelemeyle anlaşılabilecek niteliktedir. Zeynep geri alma işleminin kendisine 20 Mayıs 2025'te tebliğ edildiğini belirtmektedir.
      1. Ömer'in kaydının silinmesi hukuka uygun mudur?
      2. Zeynep'in kaydını silen geri alma işlemini değerlendiriniz.
      3. Zeynep hangi yollara başvurabilir ve süresi nedir?
    olcut:
      - {tespit: "Geri alma kavramı: hukuka aykırı işlemin idarece geçmişe etkili ortadan kaldırılması; yatay geçiş hak doğuran bireysel işlemdir", puan: 15, madde: "İYUK m. 2"}
      - {tespit: "Genel kural: hukuka aykırı hak doğuran işlem dava açma süresi (altmış gün) içinde geri alınabilir; süre geçince kazanılmış hak", puan: 20, madde: "İYUK m. 7"}
      - {tespit: "Ömer: ilgilinin hilesi nedeniyle süre geçse de geri alma hukuka uygundur", puan: 20, madde: "AY m. 2"}
      - {tespit: "Zeynep: hile, açık hata ve yokluk yok, süre geçmiş; geri alma kazanılmış hakka aykırı olup hukuka aykırıdır", puan: 25, madde: "AY m. 2"}
      - {tespit: "Geri alma işlemi yeni idari işlemdir; iptal davası, süre bildirimden itibaren altmış gün; İYUK m. 11 başvurusu süreyi durdurur", puan: 20, madde: "İYUK m. 11"}
    cozum: |
      **Nitelendirme:** Üniversiteye yatay geçişin kabulü, öğrenci lehine hak doğuran bireysel bir idari işlemdir. Dekanlığın kaydı silmesi ise bu işlemin yeniden bir idari işlemle geçmişe etkili ortadan kaldırılmasıdır, yani **geri alma**dır.

      **Hukuki sorunlar:** İdare hangi şartlarda hak doğuran, hukuka aykırı işlemi geri alabilir? Ömer'in hilesi ile Zeynep'in iyi niyeti sonucu nasıl değiştirir? Zeynep geri alma işlemine karşı hangi yola başvurabilir?

      **İlgili hükümler:** Hukuka aykırı, hak doğuran işlem, Danıştay içtihadında kural olarak dava açma süresi içinde geri alınabilir. Dava açma süresi özel kanunda aksi yoksa Danıştay ve idare mahkemelerinde altmış gündür (İYUK m. 7/1). Süre geçtikten sonra işlem istikrar kazanır ve kişi lehine kazanılmış hak doğar; bu, hukuk devletinin gereği olan hukuki güvenlik ilkesine dayanır (AY m. 2). Yokluk, açık hata ve ilgilinin hilesi ya da gerçeğe aykırı beyanı ise iyi niyeti ortadan kaldırır; bu hâllerde süre geçse de geri alınabilir.

      **Değerlendirme:**
      - **Ömer:** İşlem, bizzat Ömer'in sahte transkripti yüzünden doğmuştur. Hileye dayanan işlemden kazanılmış hak doğmaz; altmış gün geçmiş olsa da geri alma hukuka uygundur. Ömer'in kaydının silinmesi geçerlidir.
      - **Zeynep:** Zeynep belgelerini doğru sunmuştur; hata tamamen idarenin yönetmeliği yanlış yorumlamasından kaynaklanmaktadır. İşlem yok hükmünde değildir ve hile yoktur. Yanılgı ancak ayrıntılı hukuki incelemeyle anlaşılabildiğinden, yüzeysel bir bakışla fark edilebilecek açık hata da yoktur. Üç yıl geçtiği için dava açma süresi dolmuştur ve Zeynep lehine kazanılmış hak doğmuştur. Kayıt silme, mezuniyet aşamasındaki öğrencinin hukuki güvenlik beklentisini de ağır biçimde zedeler. Geri alma işlemi **sebep ve konu yönünden** hukuka aykırıdır.
      - **Başvuru yolu:** Geri alma işlemi de yeni bir idari işlemdir. Zeynep, işlemin yetki, şekil, sebep, konu ve maksat yönlerinden biriyle hukuka aykırı olduğu gerekçesiyle iptal davası açabilir (İYUK m. 2/1-a; AY m. 125/1). Dava süresi, işlemin yazılı bildirimini izleyen günden itibaren altmış gündür (İYUK m. 7/1-2); tebliğ 20 Mayıs 2025'te yapıldığından süre 21 Mayıs'ta başlar. Dava açmadan önce işlemi yapan makama ya da üst makama başvurabilir; bu başvuru süreyi durdurur ve otuz gün içinde cevap verilmezse istek reddedilmiş sayılır (İYUK m. 11/1-3). Geri alma işlemi nedeniyle bir zarara uğradıysa tam yargı davası da açabilir (İYUK m. 2/1-b; AY m. 125/7).

      **Sonuç:** Ömer'in kaydının silinmesi hukuka uygundur. Zeynep'in kaydını silen geri alma işlemi ise hukuka aykırıdır; Zeynep işlemin tebliğinden itibaren altmış gün içinde iptal davası açabilir.
  - olay: |
      Çiçek Belediyesi encümeni, bütün kanuni şartları taşıyan Hasan'a 10 Ocak 2025'te işyeri açma ve çalışma ruhsatı vermiştir. İki ay sonra encümen, ruhsatın bulunduğu sokakta trafik yoğunluğu yarattığını, bu nedenle ruhsatın "verildiği tarihten itibaren hükümsüz sayıldığını" belirterek Hasan'a bildirmiştir. Belediye, kararın dayanağı olarak yalnızca kamu yararını göstermiştir; ruhsatın hukuka aykırı verildiğine dair bir iddia ileri sürülmemiştir.

      Bunun yanında Bilim Bakanlığı, 1 Mart 2023'te yayımladığı yönetmelikle doktora öğrencilerine aylık burs ödenmesini öngörmüştür. Selin, bu yönetmelik yürürlükteyken burs hakkı kazanmış, 2023 ve 2024 yıllarında ödemeleri almıştır. Bakanlık 10 Nisan 2025'te yeni bir yönetmelik yayımlayarak burs hükmünü yürürlükten kaldırmış ve ayrıca 2023-2025 arasında ödenen bursların geri alınacağını düzenlemiştir.
      1. Encümenin Hasan'ın ruhsatı hakkındaki işlemini niteleyiniz ve değerlendiriniz.
      2. Bakanlığın burs hükmünü kaldırmasını değerlendiriniz.
      3. Geçmiş dönem bursların geri istenmesi hukuka uygun mudur?
    olcut:
      - {tespit: "Geri alma (geçmişe etkili) ile kaldırma (geleceğe etkili) ayrımı; encümen işleminin geri alma olduğu", puan: 15, madde: "İYUK m. 11"}
      - {tespit: "Ruhsat hukuka uygun hak doğuran bireysel işlemdir; hukuka uygun hak doğuran işlem geri alınamaz", puan: 25, madde: "AY m. 2"}
      - {tespit: "Kamu yararı gerekçesi geri almayı haklı kılmaz; kanunda öngörülen kaldırma hâlleri ayrıdır", puan: 10, madde: "AY m. 2"}
      - {tespit: "Düzenleyici işlem kazanılmış hak doğurmaz; yönetmelik geleceğe etkili kaldırılabilir", puan: 20, madde: "AY m. 124"}
      - {tespit: "Yürürlükte iken tamamlanmış bireysel haklar geriye yürütülerek ortadan kaldırılamaz; geçmiş burslar geri istenemez", puan: 20, madde: "AY m. 2"}
      - {tespit: "Geri alma/kaldırma işlemi yeni idari işlemdir; iptal davası ve süre", puan: 10, madde: "İYUK m. 2"}
    cozum: |
      **Nitelendirme:** Ruhsat, hukuka uygun olarak verilmiş ve Hasan lehine hak doğuran bireysel bir idari işlemdir. Encümenin ruhsatı "verildiği tarihten itibaren hükümsüz saymasına" ilişkin kararı geçmişe etkili olduğu için **geri almadır**. Bakanlığın yönetmeliğin burs hükmünü yürürlükten kaldırması ise düzenleyici işlemin **kaldırılması (ilga)** işlemidir.

      **Hukuki sorunlar:** (1) Hukuka uygun hak doğuran işlem geri alınabilir mi? (2) Düzenleyici işlemin kaldırılması kazanılmış haklara engel midir? (3) Yeni yönetmelik geriye yürütülerek geçmiş ödemeler geri istenebilir mi?

      **İlgili hükümler ve değerlendirme:**
      - **Ruhsat:** Geri alma, hukuka **aykırı** işlemlere yönelik bir kurumdur. Burada işlemin hukuka aykırılığı ileri sürülmemekte, hukuka uygun bir işlem sonradan "kamu yararı" gerekçesiyle ortadan kaldırılmak istenmektedir. Hukuka uygun hak doğuran işlem kazanılmış hak yaratır (hukuki güvenlik, AY m. 2) ve geri alınamaz. Geleceğe etkili kaldırma ise kural olarak ancak kanunun öngördüğü hâllerde, örneğin ruhsat şartlarının sonradan kaybedilmesi gibi sebeplerde mümkündür; trafik yoğunluğu kendiliğinden böyle bir sebep olarak gösterilmemiştir. Encümenin işlemi hukuka aykırıdır.
      - **Yönetmelik:** Yönetmelik düzenleyici işlemdir (AY m. 124); genel ve soyut kural koyduğundan tek başına kazanılmış hak doğurmaz. Bakanlık kamu yararı gerektirdiğinde yönetmeliği geleceğe etkili kaldırabilir. Selin'in gelecekteki burs beklentisi bu aşamada kazanılmış hak değil, en fazla haklı beklentidir; Bakanlığın geçiş hükmü koyması beklenir.
      - **Geçmiş burslar:** Yönetmelik yürürlükteyken ona dayanılarak yapılmış ve tamamlanmış ödemeler, hukuka uygun bireysel işlemlerdir ve Selin lehine kazanılmış hak doğurmuştur. Kaldırma geleceğe etkilidir; yeni düzenlemeyle geriye yürütülerek geçmiş ödemelerin geri istenmesi hukuki güvenlik ve geriye yürümezlik ilkesine aykırıdır.
      - **Yargı yolu:** Hem encümenin geri alma işlemi hem de burs geri istemine ilişkin işlem yeni birer idari işlemdir. Bu işlemlere karşı yetki, şekil, sebep, konu ve maksat yönlerinden biriyle hukuka aykırılık iddiasıyla iptal davası açılabilir (İYUK m. 2/1-a). Hasan ve Selin idareye başvurabilir; bu başvuru süreyi durdurur (İYUK m. 11/1).

      **Sonuç:** Encümenin geri alma işlemi hukuka aykırıdır. Bakanlık yönetmeliği geleceğe etkili kaldırabilir, ama geçmiş dönem bursların geri istenmesi hukuka aykırıdır.
kartlar:
  - on: "Geri alma ile kaldırma arasındaki temel fark nedir?"
    arka: "Geri alma hukuka aykırı işlemi geçmişe etkili (yapıldığı andan itibaren) ortadan kaldırır. Kaldırma yalnızca geleceğe etkilidir; geçmiş sonuçlar korunur."
  - on: "Yargı kararıyla iptalin zaman bakımından etkisi nedir, idare ne yapmalıdır?"
    arka: "Geçmişe etkilidir. İdare gecikmeksizin, kararın tebliğinden başlayarak en geç otuz gün içinde işlem tesis etmelidir (İYUK m. 28/1). 2026'da eklenen istisna: sayılan güvenlik personeli davalarındaki göreve iade kararları kesinleşince yerine getirilir."
  - on: "Hukuka aykırı, hak doğuran işlem ne zamana kadar geri alınabilir?"
    arka: "Kural olarak dava açma süresi içinde (altmış gün, İYUK m. 7/1); süre içinde dava açılmışsa karar verilinceye kadar. Süre geçince kazanılmış hak doğar."
  - on: "Süre geçse de geri almayı mümkün kılan temel hâller hangileridir?"
    arka: "Yokluk (yok hükmünde işlem), açık hata ve ilgilinin hilesi veya gerçeğe aykırı beyanı. Açık hatanın uzun yıllar sonra kullanılması ve geçici işlem kategorisi tartışmalıdır."
  - on: "Hukuka uygun, hak doğuran işlem geri alınabilir mi?"
    arka: "Hayır. Kazanılmış hak doğurduğundan geri alınamaz; kaldırma da kural olarak ancak kanunun öngördüğü hâllerde mümkündür."
  - on: "Düzenleyici işlem kazanılmış hak doğurur mu, nasıl sona erdirilir?"
    arka: "Doğurmaz; idare geleceğe etkili kaldırabilir veya değiştirebilir. Yürürlükte iken tamamlanmış bireysel haklar geriye yürütülerek ortadan kaldırılamaz."
  - on: "Kazanılmış hak ile haklı beklenti arasındaki fark nedir?"
    arka: "Kazanılmış hak doğmuş ve tamamlanmış haktır. Haklı beklenti, idarenin tutumuyla doğan ama henüz tamamlanmamış makul beklentidir; değişikliklerde geçiş hükmü gerekir."
  - on: "İYUK m. 11 başvurusunda ret sayılma süresi ve etkisi nedir?"
    arka: "Otuz gün cevapsızlık ret sayılır (7331 sayılı Kanunla altmıştan indirildi). Başvuru süreyi durdurur; ret sayılınca süre yeniden işler ve geçen süre hesaba katılır (İYUK m. 11)."
  - on: "Hak doğurmayan (yükümlendirici) işlemde geri alma ve kaldırma nasıl yapılır?"
    arka: "Kazanılmış hak engeli yoktur; hukuka aykırıysa geri alınır, kaldırma da yapılabilir. Üçüncü kişilerin kazanılmış hakları saklıdır."
  - on: "Geri alma veya kaldırma işlemine karşı hangi dava açılır?"
    arka: "Geri alma/kaldırma yeni bir idari işlemdir; hukuka aykırıysa iptal davası açılır (İYUK m. 2/1-a). Zarar için tam yargı davası da mümkündür."
  - on: "Düzeltme ile geri alma arasındaki fark nedir?"
    arka: "Düzeltme yazım ve hesap gibi maddi hataların işlemin özüne dokunmadan giderilmesidir. Geri alma hukuka aykırı işlemi baştan ortadan kaldırır."
  - on: "Süresi dolan işlem için geri alma işlemi gerekir mi?"
    arka: "Hayır. Belirli süreli işlem süre dolunca, bozucu şarta bağlı işlem şart gerçekleşince kendiliğinden sona erer."
