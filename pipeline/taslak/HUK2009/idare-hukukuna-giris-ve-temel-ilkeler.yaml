sorular:
  - soru: |
      AY m. 123/3'e göre kamu tüzelkişiliği hangi araçlarla kurulabilir?
    siklar:
      - "Yalnızca kanunla"
      - "Kanunla veya Cumhurbaşkanlığı kararnamesiyle"
      - "Kanun, Cumhurbaşkanlığı kararnamesi veya yönetmelikle"
      - "Kanunun açıkça verdiği yetkiye dayanılarak yapılan idari işlemle"
    dogru: 1
    aciklama: |
      AY m. 123/3 kamu tüzelkişiliğinin "kanunla veya Cumhurbaşkanlığı kararnamesiyle" kurulacağını söyler. Dördüncü şıktaki ibare 2017 değişikliği öncesi metne aittir; yönetmelik de bu aracın dışındadır (AY m. 123/3).
  - soru: |
      İçişleri Bakanlığına bağlı, ayrı kamu tüzelkişiliği bulunmayan bir genel müdürlük, kendi adıyla "Yönetmelik" çıkarıp internet sitesinde yayımlamış ve bu metne dayanarak Ali hakkında işlem tesis etmiştir. Bu yönetmeliğe ilişkin aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Genel müdürlükler, bağlı oldukları bakanlığın görev alanındaki konularda her zaman yönetmelik çıkarabilir."
      - "Yönetmelik yalnızca Resmî Gazetede yayımlanmadığı için hukuka aykırıdır."
      - "Yönetmelik çıkarma yetkisi AY m. 124/1'e göre Cumhurbaşkanı, bakanlıklar ve kamu tüzelkişilerine aittir; tüzelkişiliği olmayan genel müdürlüğün yönetmeliği yetki yönünden sakattır."
      - "Yönetmelik, yalnızca valilik onayı alınırsa geçerli olur."
    dogru: 2
    aciklama: |
      AY m. 124/1, yönetmelik çıkarmaya yetkili makamları sayar: Cumhurbaşkanı, bakanlıklar ve kamu tüzelkişileri. Tüzelkişiliği olmayan genel müdürlük yönerge veya genelge gibi adsız düzenleyici işlem çıkarabilir ama yönetmelik çıkaramaz. Sorun yalnız yayım şekli değil, öncelikle yetkidir.
  - soru: |
      Aşağıdakilerden hangisi AY m. 125'e göre yargı denetimi dışında kalan bir idari işlemdir?
    siklar:
      - "Cumhurbaşkanının tek başına yaptığı idari işlemler"
      - "Yüksek Askerî Şûranın bir subayın TSK ile ilişiğini kesme kararı"
      - "Yüksek Askerî Şûranın terfi işlemleri"
      - "Bir bakanlığın atama kararı"
    dogru: 2
    aciklama: |
      AY m. 125/2'ye göre YAŞ'ın terfi işlemleri ile kadrosuzluk nedeniyle emekliye ayırma hariç her türlü ilişik kesme kararlarına karşı yargı yolu açıktır; dolayısıyla terfi işlemleri denetim dışıdır. Cumhurbaşkanının tek başına yaptığı işlemleri denetim dışı sayan ibare 2017'de metinden çıkarılmıştır.
  - soru: |
      Bir idare mahkemesi, belediyenin düzenlediği kültür festivalinin tarihini "bir hafta sonrası daha uygun olurdu" gerekçesiyle iptal etmiştir. Bu karar bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Karar hukuka uygundur, çünkü mahkeme idarenin amacına daha uygun çözümü göstermiştir."
      - "Karar, AY m. 125/4'e aykırı biçimde yerindelik denetimi yapılarak verilmiştir."
      - "Karar, ancak belediye meclisi onaylarsa geçerli olur."
      - "Karar, yürütmenin durdurulması şartları varsa hukuka uygundur."
    dogru: 1
    aciklama: |
      AY m. 125/4 yargı yetkisini hukuka uygunluk denetimiyle sınırlar ve hiçbir surette yerindelik denetimi şeklinde kullanılmasına izin vermez (aynı yönde İYUK m. 2/2). Tarihin "daha uygun" olup olmadığı yerindelik sorunudur. Yürütmenin durdurulması şartları bu sınırı değiştirmez.
  - soru: |
      İdare mahkemesi, bir işlemin yürütmesini yalnızca "uygulanırsa telafisi güç zarar doğacağı" gerekçesiyle durdurmuştur. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Karar hukuka uygundur; telafisi güç zarar tek başına yeterlidir."
      - "Karar eksiktir; AY m. 125/5 ve İYUK m. 27/2'ye göre işlemin açıkça hukuka aykırı olması da birlikte aranır."
      - "Karar eksiktir; yalnızca işlemin açıkça hukuka aykırı olması yeterlidir, zarar aranmaz."
      - "Yürütmenin durdurulması davalı idarenin savunması alınmadan hiçbir hâlde verilemez."
    dogru: 1
    aciklama: |
      AY m. 125/5 ve İYUK m. 27/2, telafisi güç veya imkânsız zararın doğması ile işlemin açıkça hukuka aykırı olması şartlarının birlikte gerçekleşmesini arar. Son şık yanlıştır: uygulanmakla etkisi tükenecek işlemlerde savunma alınmadan da karar verilebilir (İYUK m. 27/2).
  - soru: |
      AY m. 8'e göre yürütme yetkisi ve görevi kim tarafından, nasıl kullanılır?
    siklar:
      - "Bakanlar Kurulu tarafından, yalnızca kanunlara uygun olarak"
      - "Cumhurbaşkanı tarafından, Anayasaya ve kanunlara uygun olarak"
      - "Cumhurbaşkanı ve bakanlar tarafından, Cumhurbaşkanlığı kararnamelerine uygun olarak"
      - "Cumhurbaşkanı tarafından, yalnızca Anayasaya uygun olarak"
    dogru: 1
    aciklama: |
      AY m. 8: yürütme yetkisi ve görevi Cumhurbaşkanı tarafından Anayasaya ve kanunlara uygun olarak kullanılır ve yerine getirilir. "Ve Bakanlar Kurulu" ibaresi 2017'de çıkarılmıştır.
  - soru: |
      Bir bakanlık, kanuni dayanağı olmayan bir genelgeyle özel işletmelerden yıllık 250.000 TL "sektörel katkı payı" alınmasını öngörmüştür. Bu genelge bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Genelge hukuka uygundur, çünkü bakanlıklar kendi görev alanında yükümlülük getirebilir."
      - "Genelge, mali yükümlülüklerin kanunla konulması gerektiği (AY m. 73/3) ve idarenin kanuniliği ilkesi (AY m. 123/1) nedeniyle hukuka aykırıdır."
      - "Genelge, Resmî Gazetede yayımlanırsa hukuka uygun hâle gelir."
      - "Genelge, yalnızca Danıştay denetimine tabi olduğu için işletmeler dava açamaz."
    dogru: 1
    aciklama: |
      Vergi, resim, harç ve benzeri mali yükümlülükler kanunla konulur (AY m. 73/3). Kanuni dayanak yoksa idare genelgeyle mali yük getiremez; bu, kanuna dayanma şartının ihlalidir (AY m. 123/1). Yayım, yetki ve dayanak eksikliğini gidermez.
  - soru: |
      Aşağıdakilerden hangisi AY m. 104/17 uyarınca Cumhurbaşkanlığı kararnamesiyle düzenlenebilir?
    siklar:
      - "Kişi hürriyeti ve güvenliğinin sınırları"
      - "Siyasi hak ve ödevlerin kapsamı"
      - "Anayasada münhasıran kanunla düzenlenmesi öngörülen bir konu"
      - "Bakanlıkların teşkilat yapısı"
    dogru: 3
    aciklama: |
      Bakanlıkların kurulması, görevleri ve teşkilat yapısı Cumhurbaşkanlığı kararnamesiyle düzenlenir (AY m. 106/11). Temel haklar ve kişi hakları, siyasi haklar ve ödevler ile Anayasada münhasıran kanuna bırakılan konular CBK ile düzenlenemez (AY m. 104/17).
  - soru: |
      Aynı konuda hem bir Cumhurbaşkanlığı kararnamesi hem de sonradan çıkarılan bir kanun farklı hükümler içermektedir. AY m. 104/17'ye göre sonuç nedir?
    siklar:
      - "Kararname uzman idari işlem olduğu için öncelikle uygulanır."
      - "Çıkış tarihi sonra olan hüküm her zaman uygulanır."
      - "Kanun hükümleri uygulanır; TBMM aynı konuda kanun çıkarırsa kararname hükümsüz hâle gelir."
      - "Kararname uygulanır; kanun ancak Anayasa Mahkemesi kararıyla öncelik kazanır."
    dogru: 2
    aciklama: |
      AY m. 104/17: kararname ile kanunlarda farklı hükümler bulunması hâlinde kanun hükümleri uygulanır; TBMM'nin aynı konuda kanun çıkarması durumunda CBK hükümsüz hâle gelir.
  - soru: |
      Bir belediyenin çıkardığı ve yalnızca o belediyenin yetki ve görev alanına giren yönetmelik nasıl ilan edilir?
    siklar:
      - "Mutlaka Resmî Gazetede yayımlanarak"
      - "Sadece Cumhurbaşkanlığı onayıyla"
      - "Mahallinde çıkan gazete veya internet haber sitesi ya da diğer yayın yolları ile"
      - "Yalnızca valiliğe bildirilerek; ilan gerekmez"
    dogru: 2
    aciklama: |
      Mahalli idarelerce düzenlenen ve bu idarelerin yetki ve görev alanlarına giren yönetmelikler mahallinde çıkan gazete veya internet haber sitesi ya da diğer yayın yolları ile ilan olunur (3011 sayılı Kanun m. 2). Resmî Gazete'de yayım, 3011 sayılı Kanun m. 1'deki yönetmelikler içindir.
  - soru: |
      İdare mahkemesinde dava açmak isteyen Zeynep'e bir idari işlem yazılı olarak bildirilmiştir. Özel kanunda ayrı bir süre yoksa dava süresi hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Süre işlemin alındığı tarihten itibaren otuz gündür."
      - "Süre yazılı bildirimin yapıldığı tarihi izleyen günden başlar ve altmış gündür."
      - "Süre işlemin öğrenildiği tarihten başlar ve doksan gündür."
      - "Süre kural olarak yoktur; dava her zaman açılabilir."
    dogru: 1
    aciklama: |
      AY m. 125/3 idari işlemlere karşı açılacak davalarda sürenin yazılı bildirim tarihinden başlayacağını söyler. İYUK m. 7/1'e göre özel kanunlarda ayrı süre gösterilmeyen hâllerde süre Danıştayda ve idare mahkemelerinde altmış gündür; idari uyuşmazlıklarda yazılı bildirimin yapıldığı tarihi izleyen günden başlar (İYUK m. 7/2-a). Otuz gün vergi mahkemeleri içindir.
  - soru: |
      Aşağıdakilerden hangisi AY m. 124/1'e göre yönetmelik çıkarabilecek makamlar arasında sayılmıştır?
    siklar:
      - "Valilik"
      - "Kaymakamlık"
      - "Kamu tüzelkişileri"
      - "Tüzelkişiliği bulunmayan bağlı kuruluşlar"
    dogru: 2
    aciklama: |
      AY m. 124/1 yetkiyi Cumhurbaşkanına, bakanlıklara ve kamu tüzelkişilerine verir. Valilik, kaymakamlık ve tüzelkişiliği olmayan birimler yönetmelik çıkaramaz.
olaylar:
  - olay: |
      İçişleri Bakanlığına bağlı olup ayrı kamu tüzelkişiliği bulunmayan bir genel müdürlük, yabancıların başvurularına ilişkin genel kurallar içeren ve kamuyu ilgilendiren bir "Yönetmelik"i kendi adıyla çıkararak yalnız internet sitesinde yayımlamıştır. Genel müdürlük bu metne dayanarak yabancı uyruklu Ali hakkında bir idari işlem tesis etmiştir. Ali işlemin kendisine 3 Mart tarihinde yazılı olarak bildirildiğini belirtmektedir.

      Aynı hafta Yüksek Askerî Şûra (YAŞ), Albay Mehmet'i kadrosuzluk nedeniyle emekliye ayırmış, Binbaşı Ahmet'in ise Türk Silahlı Kuvvetleriyle ilişiğinin kesilmesine karar vermiştir. Mehmet ve Ahmet bu kararlara karşı dava açmak istemektedir.

      1. Genel müdürlüğün yönetmeliği hukuka uygun mudur?
      2. Ali hangi süre içinde ve hangi gerekçelerle dava açabilir?
      3. Mehmet ve Ahmet'in yargı yoluna başvurma imkânı var mıdır?
    olcut:
      - {tespit: "Yönetmelik çıkarma yetkisi yalnız Cumhurbaşkanı, bakanlıklar ve kamu tüzelkişilerindedir; tüzelkişiliği olmayan genel müdürlüğün yönetmeliği yetki yönünden sakattır", puan: 25, madde: "AY m. 124"}
      - {tespit: "Hangi yönetmeliklerin Resmî Gazetede yayımlanacağı kanunla belirlenir; kamuyu ilgilendiren, yetki ve görev alanına ait hükümler içeren yönetmelikler Resmî Gazetede yayımlanır, internet sitesinde yayım yeterli sayılmaz", puan: 15, madde: "3011 sayılı Kanun m. 1"}
      - {tespit: "Ali'ye dava süresi yazılı bildirimden başlar; idare mahkemesinde altmış gündür", puan: 15, madde: "İYUK m. 7"}
      - {tespit: "Ali dava açarken işlemi yetki yönünden hukuka aykırı olduğu için iptal ettirebilir; dayanak yönetmeliğin de yetkisizlik nedeniyle hukuka aykırılığını ileri sürer", puan: 15, madde: "İYUK m. 2"}
      - {tespit: "YAŞ'ın kadrosuzluk nedeniyle emekliye ayırma kararına karşı yargı yolu kapalıdır; Mehmet dava açamaz", puan: 15, madde: "AY m. 125"}
      - {tespit: "YAŞ'ın ilişik kesme kararına karşı yargı yolu açıktır; Ahmet iptal davası açabilir", puan: 15, madde: "AY m. 125"}
    cozum: |
      **Nitelendirme:** Olay iki ayrı soruyu birleştiriyor. İlki, bir genel müdürlüğün yönetmelik çıkarma yetkisi ve bu yetkisizliğin yönetmeliğe dayanan bireysel işleme etkisidir. İkincisi, YAŞ kararlarında yargı denetiminin kapsamıdır.

      **Hukuki sorunlar:** (1) Yönetmelik çıkarmaya kimler yetkilidir? (2) Yönetmeliğin yayım şekli sorunu var mıdır? (3) Ali hangi süre içinde nasıl bir dava açabilir? (4) YAŞ kararlarının hangileri yargı denetimine tabidir?

      **İlgili hükümler:** AY m. 124/1; 3011 sayılı Kanun m. 1; İYUK m. 2/1-a; İYUK m. 7/1-2; AY m. 125/2.

      **Değerlendirme:** AY m. 124/1'e göre yönetmelik çıkarma yetkisi Cumhurbaşkanı, bakanlıklar ve kamu tüzelkişilerindedir. Ayrı tüzelkişiliği olmayan genel müdürlük bu sayılanlar arasında yer almadığından kendi adıyla yönetmelik çıkaramaz; yalnızca yönerge, genelge gibi adsız düzenleyici işlem yapabilir. Yönetmeliğin, bakanlık adına ve bakanlıkça çıkarılması gerekirdi. Yetki unsuru bakımından sakat olan bir metin, kural olarak kendisine dayanılarak yapılan işlemi de hukuka aykırı hâle getirir.

      Yayım yönünden de ayrıca sorun vardır: AY m. 124/2'ye göre hangi yönetmeliklerin Resmî Gazetede yayımlanacağı kanunda belirtilir. 3011 sayılı Kanun m. 1'e göre yetki ve görev alanına ait hükümleri düzenleyen ve kamuyu ilgilendiren yönetmelikler Resmî Gazetede yayımlanır. Yalnızca internet sitesinde yayım bu bakımdan yeterli görünmez; ancak asıl sakatlık yetkidedir.

      Ali işlemin yazılı olarak bildirildiği tarihi izleyen günden itibaren altmış gün içinde idare mahkemesinde iptal davası açabilir (AY m. 125/3; İYUK m. 7/1 ve 7/2-a). Dava, İYUK m. 2/1-a uyarınca yetki yönünden hukuka aykırılığa dayanır. Ali, işleme dayanak yapılan yönetmeliğin de yetkisizlik nedeniyle hukuka aykırı olduğunu ileri sürebilir (İYUK m. 7/4).

      YAŞ kararlarında AY m. 125/2 açıktır: terfi işlemleri ile kadrosuzluk nedeniyle emekliye ayırma kararlarına karşı yargı yolu kapalıdır; bunlar dışındaki her türlü ilişik kesme kararına karşı açıktır. Mehmet'in kadrosuzluk nedeniyle emekliye ayrılmasına karşı açacağı dava yargı denetimine tabi değildir. Ahmet'in ilişiğinin kesilmesi ise denetime tabidir ve iptal davası açabilir.

      **Sonuç:** Yönetmelik yetki yönünden hukuka aykırıdır. Ali, bildirimden itibaren altmış gün içinde iptal davası açabilir. Mehmet'in kararına karşı yargı yolu kapalı, Ahmet'in kararına karşı açıktır.
  - olay: |
      Bir bakanlık, kanuni dayanağı olmayan bir genelgeyle özel işletmelerden yıllık 250.000 TL "sektörel katkı payı" tahsil edilmesini öngörmüştür. X Ltd. Şti. genelgeye dayanılarak hakkında tesis edilen tahsil işlemine karşı iptal davası açmış ve yürütmenin durdurulmasını istemiştir. İdare mahkemesi, yalnızca "ödemenin işletme için telafisi güç zarar doğuracağı" gerekçesiyle yürütmeyi durdurmuştur. Bakanlık, mahkemenin yürütmeyi durdurma konusunda hata yaptığını ileri sürmektedir.

      1. Genelge hukuka uygun mudur?
      2. Mahkemenin yürütmeyi durdurma kararı yeterli gerekçeye dayanmakta mıdır?
      3. Mahkeme, bakanlığa bunun yerine "başka bir mali düzenleme yapmasını" emredebilir mi?
    olcut:
      - {tespit: "Vergi, resim, harç ve benzeri mali yükümlülükler kanunla konulur; genelgeyle mali yükümlülük getirilemez", puan: 20, madde: "AY m. 73"}
      - {tespit: "İdarenin kanuniliği ilkesi: kanuna dayanma şartı eksiktir, işlem yetki ve konu yönünden hukuka aykırıdır", puan: 20, madde: "AY m. 123"}
      - {tespit: "Genelge adsız düzenleyici işlemdir; normlar hiyerarşisinde Anayasa ve kanunun altındadır", puan: 10, madde: "AY m. 11"}
      - {tespit: "Yürütmenin durdurulması için telafisi güç veya imkânsız zarar ile açık hukuka aykırılık birlikte gerekir", puan: 20, madde: "İYUK m. 27"}
      - {tespit: "Kararda işlemin hangi gerekçelerle açıkça hukuka aykırı olduğu ve doğacak zararın neler olduğu belirtilmelidir; mahkemenin gerekçesi eksiktir", puan: 15, madde: "AY m. 125"}
      - {tespit: "Yargı yetkisi hukuka uygunluk denetimiyle sınırlıdır; mahkeme idareye yeni bir düzenleme yapma talimatı veremez", puan: 15, madde: "İYUK m. 2"}
    cozum: |
      **Nitelendirme:** Olay, bir idari düzenlemenin kanuniliği ile idari yargıda yürütmenin durdurulması şartlarını birlikte soruyor. Genelge, yönetmelik dışında kalan adsız bir düzenleyici işlemdir.

      **Hukuki sorunlar:** (1) Mali yükümlülük genelgeyle getirilebilir mi? (2) Yürütmenin durdurulması şartları gerçekleşmiş midir ve karar gerekçesi yeterli midir? (3) Mahkeme idareye düzenleme yapma talimatı verebilir mi?

      **İlgili hükümler:** AY m. 73/3; AY m. 123/1; AY m. 11; AY m. 125/4-5; İYUK m. 2/2; İYUK m. 27/2.

      **Değerlendirme:** Vergi, resim, harç ve benzeri mali yükümlülükler kanunla konulur, değiştirilir veya kaldırılır (AY m. 73/3). Katkı payı niteliği ne olursa olsun, kanuni dayanağı olmayan bir genelgeyle işletmelere mali yük getirmek AY m. 123/1'deki kanuna dayanma şartına aykırıdır. Genelge, normlar hiyerarşisinde Anayasa ve kanunun altında yer alan adsız bir işlemdir ve kanunun bulunmadığı yerde asli bir yetki yaratamaz (AY m. 11, AY m. 123/1). İşlem yetki ve konu yönlerinden hukuka aykırıdır.

      Yürütmenin durdurulması bakımından AY m. 125/5 ve İYUK m. 27/2, telafisi güç veya imkânsız zararların doğması ve idari işlemin açıkça hukuka aykırı olması şartlarının **birlikte** gerçekleşmesini arar. Mahkeme yalnızca zarar unsurunu gerekçelendirmiştir. Oysa kararda, işlemin hangi gerekçelerle hukuka açıkça aykırı olduğu ve uygulanması hâlinde doğacak telafisi güç zararların neler olduğu belirtilmek zorundadır. Somut olayda hukuka açık aykırılık unsuru (kanuni dayanak bulunmaması) gerçekten de mevcut görünse de kararın gerekçesi bu unsuru içermediğinden eksiktir.

      Üçüncü soruda AY m. 125/4 ve İYUK m. 2/2 belirleyicidir: yargı yetkisi hukuka uygunluk denetimiyle sınırlıdır; idarenin takdir yetkisini kaldıracak veya yürütme görevinin kanunlardaki şekil ve esaslara uygun yerine getirilmesini kısıtlayacak biçimde karar verilemez. Mahkeme, işlemi iptal edebilir ya da yürütmesini durdurabilir; ancak idareye alternatif bir mali düzenleme yapmasını emredemez.

      **Sonuç:** Genelge kanunilik ilkesine ve AY m. 73/3'e aykırıdır. Mahkemenin yürütmeyi durdurma kararı iki şartı birlikte gerekçelendirmediği için eksiktir. Mahkeme idareye yeni düzenleme yapma talimatı veremez.
kartlar:
  - on: "Organik ve fonksiyonel anlamda idare nedir?"
    arka: "Organik: yasama ve yargı dışında kalan kamu kuruluşları bütünü. Fonksiyonel: yasama, yargı ve hükümet tasarrufları dışında kalan sürekli kamu hizmeti ve kamu düzeni faaliyetleri."
  - on: "Türkiye hangi idare sistemini benimsemiştir?"
    arka: "Kıta Avrupası tipi idari rejimi: idare kamu gücü ayrıcalıkları taşıyan özerk bir hukuka ve ayrı bir idari yargı düzenine tabidir. Şûrâ-yı Devlet 1868'de kurulmuştur."
  - on: "İdare hukukunun yazılı kaynaklarının hiyerarşisi nasıldır?"
    arka: "Anayasa; kanun ve kanun hükmündeki milletlerarası andlaşmalar (temel haklara ilişkin andlaşma çatışmada esas alınır, AY m. 90/5); CBK (AY m. 104/17); yönetmelik (AY m. 124); adsız düzenleyici işlemler."
  - on: "AY m. 8'e göre yürütme yetkisi ve görevi kimindir?"
    arka: "Cumhurbaşkanının; Anayasaya ve kanunlara uygun olarak kullanılır. 'Ve Bakanlar Kurulu' ibaresi 2017'de çıkarıldı."
  - on: "İdarenin kanuniliği ilkesinin iki yönü nedir?"
    arka: "Kanuna dayanma (kural olarak kanuni dayanak olmadan işlem yapılamaz) ve kanuna aykırı olmama (AY m. 123/1)."
  - on: "Kamu tüzelkişiliği nasıl kurulur?"
    arka: "Kanunla veya Cumhurbaşkanlığı kararnamesiyle (AY m. 123/3). Yönetmelik veya bireysel idari kararla kurulamaz."
  - on: "Yönetmelik çıkarabilecek makamlar kimlerdir?"
    arka: "Cumhurbaşkanı, bakanlıklar ve kamu tüzelkişileri (AY m. 124/1). Valilik, kaymakamlık ve tüzelkişiliği olmayan genel müdürlük çıkaramaz."
  - on: "Hangi yönetmelikler Resmî Gazetede yayımlanır?"
    arka: "AY m. 124/2'ye göre bunu kanun belirler. 3011 sayılı Kanun m. 1: işbirliği, yetki-görev, kamu personeli genel hükümleri ve kamuyu ilgilendiren yönetmelikler. Mahalli idare yönetmelikleri mahallinde ilan edilir (3011 sayılı Kanun m. 2)."
  - on: "CBK ile neler düzenlenemez? Kanunla çatışırsa ne olur?"
    arka: "Temel haklar, kişi hakları, siyasi haklar ve ödevler; Anayasada münhasıran kanuna bırakılan ve kanunda açıkça düzenlenen konular. Çatışmada kanun uygulanır; TBMM aynı konuda kanun çıkarırsa CBK hükümsüz hâle gelir (AY m. 104/17)."
  - on: "İdari yargı denetimi hangi ölçüyle sınırlıdır?"
    arka: "Hukuka uygunluk denetimiyle; yerindelik denetimi yapılamaz (AY m. 125/4; İYUK m. 2/2)."
  - on: "Yürütmenin durdurulması şartları nelerdir?"
    arka: "Telafisi güç veya imkânsız zarar ve işlemin açıkça hukuka aykırılığı, birlikte; kararda gerekçe şart (AY m. 125/5; İYUK m. 27/2)."
  - on: "Yargı yolu kapalı olan YAŞ ve HSK kararları hangileridir?"
    arka: "YAŞ: terfi işlemleri ve kadrosuzluk nedeniyle emekliye ayırma (diğer ilişik kesmeler açık, AY m. 125/2). HSK: meslekten çıkarma dışındaki kararlar (AY m. 159/10)."
