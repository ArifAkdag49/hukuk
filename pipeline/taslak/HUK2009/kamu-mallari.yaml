kararlar:
  - id: "884768000"
    ozet: |
      Davacı, parselin 490,94 m²'lik kısmının kıyı kenar çizgisi içinde kaldığını ve taşınmazı davalı belediyenin kullandığını ileri sürerek tapu iptali ve terkin, el atmanın önlenmesi ve yıkım istedi. Asliye Hukuk Mahkemesi kıyı kenar çizgisi içindeki kısım için tapu iptaline, bu kısmın "tescil harici bırakılmasına", el atmanın önlenmesine ve yıkıma karar verdi. Yargıtay 1. Hukuk Dairesi, AY m. 43, 3621 sayılı Kanun m. 5, TMK m. 715 ve TMK m. 999'a dayandı. TMK m. 999/2 gereği iptal edilen kısım için sicilden **terkin** kararı verilmesi gerekirken "tescil harici bırakma" biçiminde infazda tereddüt yaratan hüküm kurulmasını doğru bulmadı; yeniden yargılamayı gerektirmediği için hükmü düzelterek onadı. Karar, kıyı kenar çizgisinin belirlenmesinde adli yargı ile idari yargının rolünü anlatan bir içtihadı birleştirme kararına da değinir. Kararın katkısı: kıyı kenar çizgisi içinde kalan tapulu kısımda doğru sonuç iptal ve terkindir.
  - id: "421512500"
    ozet: |
      Davacıların parseli, Hazinenin açtığı davada kıyı kenar çizgisi içinde kaldığı gerekçesiyle tazminat ödenmeksizin iptal edildi; karar temyiz edilmeden kesinleşti. Davacılar sonradan TMK m. 1007'ye dayanarak Hazineden tazminat istedi. İlk derece mahkemesi sorumluluğu haksız fiil sayıp bir yıllık süreyi dolmuş bularak davayı reddetti; Yargıtay 5. Hukuk Dairesi bozdu, mahkeme direndi. Hukuk Genel Kurulu, TMK m. 1007 sorumluluğunun kusursuz (objektif) sorumluluk olduğunu, haksız fiil sorumluluğuyla ilgisi bulunmadığını ve özel bir süre öngörülmediğinden on yıllık genel zamanaşımının uygulanacağını belirtti. Süre iptal kararının kesinleşmesinden işler ve dolmamıştı; direnme kararı değişik gerekçeyle bozuldu. Karar oy çokluğuyla verildi; karşı görüş haksız fiildeki bir ve on yıllık sürelerin uygulanmasını savundu. Kararın katkısı: Devletin tapu sicili sorumluluğuna ilişkin dava on yıllık genel süreye tabidir.
sorular:
  - soru: |
      3621 sayılı Kıyı Kanunu'na göre "kıyı" aşağıdakilerden hangisidir?
    siklar:
      - "Kıyı kenar çizgisinden kara yönünde en az 100 metre genişliğindeki alan"
      - "Kıyı çizgisi ile kıyı kenar çizgisi arasındaki alan"
      - "Suyun karaya değdiği noktaların birleşmesinden oluşan çizgi"
      - "Sahil şeridi ile yapı yaklaşma sınırı arasındaki alan"
    dogru: 1
    aciklama: |
      Kıyı, kıyı çizgisi ile kıyı kenar çizgisi arasındaki alandır (3621 sayılı Kanun m. 4). İlk şık sahil şeridinin, üçüncü şık kıyı çizgisinin tanımıdır; sahil şeridi kıyının dışında, kıyı kenar çizgisinden sonra başlar.
  - soru: |
      3621 sayılı Kıyı Kanunu'ndaki "50 metre" ölçüsü aşağıdakilerden hangisini ifade eder?
    siklar:
      - "Sahil şeridinin azami genişliğini"
      - "Kıyı kenar çizgisinin tespit edilmesi için valiliğe tanınan süreyi"
      - "Sahil şeridindeki yapıların kıyı kenar çizgisine en fazla yaklaşabileceği mesafeyi"
      - "Kıyıda plansız yapılabilecek yapıların azami alanını"
    dogru: 2
    aciklama: |
      Sahil şeritlerinde yapılacak yapılar kıyı kenar çizgisine en fazla 50 metre yaklaşabilir (3621 sayılı Kanun m. 5). Sahil şeridi ise kıyı kenar çizgisinden itibaren en az 100 metre genişliğindedir (3621 sayılı Kanun m. 4); bu iki ölçü sık karıştırılır.
  - soru: |
      Kıyı kenar çizgisinin tespiti ve yürürlüğe girmesi bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Belediye encümeni tespit eder, vali onaylar"
      - "Valilikçe kurulan, kamu görevlilerinden oluşan en az 5 kişilik komisyon tespit eder; Çevre ve Şehircilik Bakanlığı onayıyla yürürlüğe girer"
      - "Tapu müdürlüğü tespit eder, yargı kararıyla yürürlüğe girer"
      - "Cumhurbaşkanı kararıyla tespit edilir, Resmî Gazete'de yayımlanmakla yürürlüğe girer"
    dogru: 1
    aciklama: |
      3621 sayılı Kanun m. 9'a göre kıyı kenar çizgisi valiliklerce, kamu görevlilerinden oluşturulacak en az 5 kişilik komisyonca tespit edilir ve Çevre ve Şehircilik Bakanlığınca onaylandıktan sonra yürürlüğe girer. Belediye encümeninin ya da tapu müdürlüğünün bu konuda yetkisi yoktur.
  - soru: |
      Anayasa'nın 169. maddesi Devlet ormanları bakımından aşağıdakilerden hangisini öngörmektedir?
    siklar:
      - "Devlet ormanları yirmi yıllık zilyetlikle mülk edinilebilir"
      - "Devlet ormanlarının mülkiyeti devrolunamaz ve bu ormanlar zamanaşımı ile mülk edinilemez"
      - "Devlet ormanları üzerinde hiçbir hâlde irtifak hakkı kurulamaz"
      - "Orman suçları için ancak genel af çıkarılamaz, özel af çıkarılabilir"
    dogru: 1
    aciklama: |
      AY m. 169/2: Devlet ormanlarının mülkiyeti devrolunamaz, bu ormanlar zamanaşımı ile mülk edinilemez ve kamu yararı dışında irtifak hakkına konu olamaz. Yani irtifak kamu yararı hâlinde kurulabilir; münhasıran orman suçları için ise hem genel hem özel af çıkarılamaz.
  - soru: |
      6831 sayılı Kanun m. 17/3 uyarınca Devlet ormanında kamu yararı ve zaruret bulunan bir enerji tesisi için bedel karşılığı verilen izin bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İzin süresi en çok 99 yıldır; uzatma yapılamaz"
      - "İzin süresi en çok 49 yıldır; amaca uygun faaliyet gösterenlerde 99 yıla kadar uzatılabilir"
      - "İzin süresi sınırsızdır, Bakanlık dilediği zaman sona erdirir"
      - "İzin süresi en çok 29 yıldır; uzatma yalnız Devlete ait tesislerde yapılır"
    dogru: 1
    aciklama: |
      6831 sayılı Kanun m. 17/3'e göre izin süresi kırk dokuz yılı geçemez; izin amaç ve şartlarına uygun faaliyet gösteren hak sahiplerinin süreleri yıllık bedelle doksan dokuz yıla kadar uzatılabilir. İki sayı karıştırılır: 49 ilk izin, 99 uzatma sınırıdır.
  - soru: |
      TMK m. 715/2'ye göre aşağıdakilerden hangisi için "aksi ispatlanmadıkça kimsenin mülkiyetinde değildir ve özel mülkiyete konu olamaz" denilebilir?
    siklar:
      - "Köy yerleşim alanındaki tarla"
      - "Tapuda kayıtlı verimli bağ"
      - "Dağ ve kayalık gibi tarıma elverişli olmayan yerler"
      - "Belediyenin kiraya verdiği dükkân"
    dogru: 2
    aciklama: |
      TMK m. 715/2: yararı kamuya ait sular ile kayalar, tepeler, dağlar, buzullar gibi tarıma elverişli olmayan yerler ve bunlardan çıkan kaynaklar aksi ispatlanmadıkça kimsenin mülkiyetinde değildir. Tarla, bağ ve kiralanan dükkân bu gruba girmez.
  - soru: |
      Ayşe'nin tapulu parselinin bir kısmı, mahkemece kıyı kenar çizgisi içinde kaldığı gerekçesiyle iptal edilmiştir. Mahkemenin bu kısım için kuracağı doğru hüküm aşağıdakilerden hangisidir?
    siklar:
      - "Kısmın tapu kaydının iptali ve sicilden terkini"
      - "Kısmın tescil harici bırakılması"
      - "Kısmın Hazine adına tescili"
      - "Kısmın bedelsiz olarak belediyeye devri"
    dogru: 0
    aciklama: |
      Tapuya kayıtlı taşınmaz kayda tabi olmayan taşınmaza dönüşürse tapu sicilinden çıkarılır (TMK m. 999/2). Yargıtay "tescil harici bırakma" biçimindeki hükmün infazda tereddüt yarattığını belirterek iptal ve terkini doğru bulmuştur. Kıyı kimsenin mülkiyetinde olmadığı için Hazine adına tescil edilmez.
  - soru: |
      Zeynep'in tapusu 2016'da kıyı kenar çizgisi içinde kaldığı gerekçesiyle tazminatsız iptal edilmiş ve karar aynı yıl kesinleşmiştir. Zeynep 2023'te TMK m. 1007'ye dayanarak Hazineye dava açmıştır. Hazine bir yıllık haksız fiil süresinin dolduğunu savunmaktadır. Hukuk Genel Kurulu'nun yaklaşımına göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Dava, bir yıllık süre geçtiği için zamanaşımına uğramıştır"
      - "Sorumluluk haksız fiildir; süre zararın öğrenilmesinden işler"
      - "Sorumluluk kusursuzdur; on yıllık genel zamanaşımı iptal kararının kesinleşmesinden işler, süre dolmamıştır"
      - "Devlet TMK m. 1007'den hiçbir hâlde sorumlu tutulamaz"
    dogru: 2
    aciklama: |
      Hukuk Genel Kurulu, TMK m. 1007 sorumluluğunun kusursuz olduğunu ve haksız fiil hükümleriyle ilgisi bulunmadığını, özel süre öngörülmediğinden on yıllık genel zamanaşımının uygulanacağını kabul etmiştir. 2016'dan 2023'e on yıl dolmadığından dava süresindedir.
  - soru: |
      X Ltd. Şti., belediyeden olan kesinleşmiş alacağı için belediyenin itfaiye aracına haciz koydurmak istemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Belediye malları Devlet malı sayılmadığından araç haczedilebilir"
      - "İtfaiye aracı kamu hizmetinde fiilen kullanılan mal olduğundan haczedilemez"
      - "Belediyenin bütün malları, kullanım amacına bakılmaksızın haczedilemez"
      - "Haciz için önce belediye meclisinin izni alınmalıdır"
    dogru: 1
    aciklama: |
      Belediyenin kamu hizmetlerinde fiilen kullanılan malları haczedilemez (5393 sayılı Kanun m. 15). Ölçüt fiilen kamu hizmetinde kullanılmadır; belediyenin her malı haczedilemez değildir ve meclis izni diye bir şart yoktur. İcra dairesi haciz kararı almadan önce belediyeden borca yeter haczedilebilir mal gösterilmesini ister.
  - soru: |
      Bir bakanlık okul yapmak için belediyeye ait bir arsayı edinmek istiyor ve bedeli belirleyerek belediyeye yazılı başvuruyor. Belediye altmış gün içinde cevap vermiyor. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Bakanlık arsayı doğrudan kamulaştırma kararıyla alır"
      - "Anlaşmazlığı Danıştay ilgili idari dairesi inceler ve iki ay içinde kesin karara bağlar"
      - "Cevap verilmemesi zımnen kabul sayılır ve arsa bakanlık adına tescil edilir"
      - "Uyuşmazlığı Yargıtay Hukuk Genel Kurulu çözer"
    dogru: 1
    aciklama: |
      Kamu tüzel kişisinin taşınmazı başka bir kamu tüzel kişisince kamulaştırılamaz (2942 sayılı Kanun m. 30/1). Mal sahibi idare devre muvafakat etmez veya altmış gün içinde cevap vermezse anlaşmazlık alıcı idarenin başvurusuyla Danıştay ilgili idari dairesince incelenerek iki ay içinde kesin karara bağlanır (2942 sayılı Kanun m. 30/2).
  - soru: |
      Ali, tapulu arsasının önündeki kumsala tel örgü çekmiştir. Kumsal, onaylı kıyı kenar çizgisinin deniz tarafında kalmaktadır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Arsa maliki olduğu için çit çekebilir"
      - "Çit, plan kararı olmadan da yapılabilir ancak izin gerekir"
      - "Kıyıda duvar, çit, telörgü gibi engeller oluşturulamaz; kıyı herkesin eşit ve serbest yararlanmasına açıktır"
      - "Telörgü yalnız kıyı kenar çizgisinden 50 metre içeride yasaktır"
    dogru: 2
    aciklama: |
      Kıyı herkesin eşitlik ve serbestlikle yararlanmasına açıktır; kıyıda hiçbir yapı yapılamaz, duvar, çit, parmaklık, telörgü gibi engeller oluşturulamaz (3621 sayılı Kanun m. 6/1; AY m. 43). Komşu tapulu arsanın maliki olmak kıyı üzerinde hak vermez. 50 metre kıyının değil sahil şeridinin yapı yaklaşma ölçüsüdür.
  - soru: |
      Aşağıdakilerden hangisi Anayasa'ya göre orman suçlarıyla ilgili doğru bir kuraldır?
    siklar:
      - "Orman suçları için özel af çıkarılabilir, genel af çıkarılamaz"
      - "Münhasıran orman suçları için genel ve özel af çıkarılamaz"
      - "Orman suçları için af yalnız Bakanlar Kurulu kararıyla çıkarılabilir"
      - "Orman suçları, genel af kapsamına her zaman alınabilir"
    dogru: 1
    aciklama: |
      AY m. 169/3: münhasıran orman suçları için genel ve özel af çıkarılamaz; ormanları yakmak, yok etmek veya daraltmak amacıyla işlenen suçlar da genel ve özel af kapsamına alınamaz. Hem genel hem özel af yasaktır.
olaylar:
  - olay: |
      Ali, Ege kıyısındaki tapulu arsasının önünde bulunan kumsala bir kafeterya yapar ve kumsalın etrafına tel örgü çeker. Bölgede kıyı kenar çizgisi valilik komisyonunca tespit edilmiş ve Çevre ve Şehircilik Bakanlığınca onaylanmıştır. Kumsal, kıyı kenar çizgisinin deniz tarafında kalmaktadır. Ali, kumsalı yıllardır kullandığını, bu nedenle zilyetlikle kazandığını ileri sürmektedir. Ayrıca kafeterya için ruhsat almamıştır.

      Bu olaya göre:
      1. Ali kumsala tel örgü çekebilir mi?
      2. Kafeterya yapılabilir mi?
      3. Kumsal Ali'nin mülkü sayılabilir mi?
      4. Ruhsatsız yapıya hangi hükümler uygulanır?
      5. Bu alan nasıl bir hukuki rejime tabidir?
    olcut:
      - {tespit: "Kıyı tanımı ve kıyı kenar çizgisinin tespit usulünün (valilik komisyonu, Bakanlık onayı) belirtilmesi", puan: 15, madde: "3621 sayılı Kanun m. 4 ve m. 9"}
      - {tespit: "Kıyının Devletin hüküm ve tasarrufu altında olduğu ve herkesin eşit ve serbest yararlanmasına açık olduğu", puan: 20, madde: "AY m. 43"}
      - {tespit: "Kıyıda duvar, çit, telörgü gibi engel oluşturulamayacağı", puan: 20, madde: "3621 sayılı Kanun m. 6"}
      - {tespit: "Kafeteryanın 3621 sayılı Kanun m. 6'daki plan istisnalarından olmadığı, yapı yasağına aykırılık", puan: 20, madde: "3621 sayılı Kanun m. 6"}
      - {tespit: "Kıyının özel mülkiyete ve zilyetlikle kazanmaya konu olamaması, tapuya kaydedilmemesi", puan: 15, madde: "TMK m. 715"}
      - {tespit: "Ruhsatsız yapıya 3194 sayılı İmar Kanunu hükümlerinin uygulanması", puan: 10, madde: "3621 sayılı Kanun m. 14"}
    cozum: |
      **Nitelendirme:** Olay, kamunun ortak kullanımına ayrılmış mal niteliğindeki kıyıda yapı ve engel yasağının, kıyının hukuki rejiminin ve yapının ruhsat durumunun değerlendirilmesidir.

      **Hukuki sorunlar:** (1) Kumsal kıyı mıdır? (2) Kıyıda tel örgü ve kafeterya yapılabilir mi? (3) Kıyı zilyetlikle kazanılabilir mi? (4) Ruhsatsız yapıya hangi hükümler uygulanır?

      **İlgili hükümler:** Kıyı, kıyı çizgisi ile kıyı kenar çizgisi arasındaki alandır (3621 sayılı Kanun m. 4). Kıyı kenar çizgisi valiliklerce kurulan en az 5 kişilik komisyonca tespit edilir ve Çevre ve Şehircilik Bakanlığı onayıyla yürürlüğe girer (3621 sayılı Kanun m. 9). Kıyılar Devletin hüküm ve tasarrufu altındadır, herkesin eşit ve serbest yararlanmasına açıktır (AY m. 43; 3621 sayılı Kanun m. 5). Kıyıda hiçbir yapı yapılamaz, duvar, çit, telörgü gibi engeller oluşturulamaz; istisna yalnız imar planı kararıyla 3621 sayılı Kanun m. 6'da sayılan kamu yararlı yapılar için geçerlidir (3621 sayılı Kanun m. 6). Yararı kamuya ait malların kazanılması özel kanunlara tabidir ve bu tür yerler özel mülkiyete konu olamaz; kamunun yararlanmasına ayrılan taşınmazlar kütüğe kaydolunmaz (TMK m. 715 ve TMK m. 999). Ruhsatsız yapılar hakkında 3194 sayılı İmar Kanunu uygulanır (3621 sayılı Kanun m. 14).

      **Değerlendirme:** Kumsal, onaylı kıyı kenar çizgisinin deniz tarafında kaldığı için kıyıdır. Ali'nin tapulu arsasının kumsala bitişik olması ona kıyı üzerinde hak vermez. Tel örgü, 3621 sayılı Kanun m. 6/1'deki engel yasağına aykırıdır. Kafeterya, iskele, liman, rıhtım gibi kıyının kamu yararına kullanımına yönelik altyapı ya da 3621 sayılı Kanun m. 6'daki diğer istisnalardan değildir; olayda bir imar planı kararından da söz edilmemektedir. Kıyıda yapılabilecek yapılar için ayrıca Bakanlık izni gerekir (3621 sayılı Kanun m. 11). Kıyı özel mülkiyete konu olamadığından Ali'nin "yıllardır kullanıyorum" savunması sonuç doğurmaz; Yargıtay uygulamasında kamu malı niteliğindeki yerler zilyetlikle kazanılamaz.

      **Sonuç:** Tel örgü ve kafeterya hukuka aykırıdır; kumsal Ali'nin mülkü değildir. Ruhsatsız yapı için 3194 sayılı İmar Kanunu hükümleri uygulanır.
  - olay: |
      X Ltd. Şti., Y Belediyesi'nden olan kesinleşmiş alacağı için icra takibi yapmaktadır. Şirket, belediyenin itfaiye aracı ile belediyece kiraya verilen boş bir arsa üzerine haciz konulmasını istemektedir. Ayrıca belediyenin tahsil ettiği emlak vergisi gelirleri de haczedilmek istenmektedir. Aynı zamanda bir bakanlık, okul yapmak amacıyla belediyeye ait başka bir arsayı kamulaştırmak istemekte, belediye ise bu arsayı vermek istememektedir.

      Bu olaya göre:
      1. İtfaiye aracı ve vergi gelirleri haczedilebilir mi?
      2. Haciz öncesi icra dairesi ne yapmalıdır?
      3. Bakanlık arsayı kamulaştırabilir mi?
      4. Belediye cevap vermezse sonuç ne olur?
    olcut:
      - {tespit: "İtfaiye aracının kamu hizmetinde fiilen kullanılan mal olarak haczedilemeyeceği", puan: 25, madde: "5393 sayılı Kanun m. 15"}
      - {tespit: "Belediyece tahsil edilen vergi, resim ve harç gelirlerinin haczedilemeyeceği", puan: 15, madde: "5393 sayılı Kanun m. 15"}
      - {tespit: "İcra dairesinin haciz kararı almadan önce belediyeden borca yeter haczedilebilir mal gösterilmesini istemesi", puan: 15, madde: "5393 sayılı Kanun m. 15"}
      - {tespit: "Genel kural: Devlet mallarının haczedilemezliği ve mahalli idarelerdeki özel ölçüt", puan: 10, madde: "İİK m. 82"}
      - {tespit: "Kamu tüzel kişisinin taşınmazının başka bir kamu tüzel kişisince kamulaştırılamaması", puan: 20, madde: "2942 sayılı Kanun m. 30"}
      - {tespit: "Altmış gün cevap verilmezse Danıştay ilgili idari dairesinin iki ay içinde kesin karar vermesi", puan: 15, madde: "2942 sayılı Kanun m. 30"}
    cozum: |
      **Nitelendirme:** Olay, mahalli idare mallarının haczedilemezliği ile kamu tüzel kişileri arasında taşınmaz devrinin değerlendirilmesidir. İtfaiye aracı hizmet malıdır.

      **Hukuki sorunlar:** (1) Belediye malları ve gelirleri haczedilebilir mi? (2) Haciz öncesinde hangi işlem yapılır? (3) Bakanlık belediye arsasını kamulaştırabilir mi? (4) Belediye yanıt vermezse uyuşmazlık nasıl çözülür?

      **İlgili hükümler:** Devlet malları ile mahsus kanunlarında haczi caiz olmadığı gösterilen mallar haczedilemez (İİK m. 82/1). Belediyenin kamu hizmetlerinde fiilen kullanılan malları ile belediyece tahsil edilen vergi, resim ve harç gelirleri haczedilemez (5393 sayılı Kanun m. 15). İcra dairesi haciz kararı almadan önce belediyeden borca yeter miktarda haczedilebilecek mal gösterilmesini ister (5393 sayılı Kanun m. 15). Kamu tüzel kişilerinin sahip oldukları taşınmazlar başka bir kamu tüzel kişisince kamulaştırılamaz; ihtiyacı olan idare bedeli belirleyip mal sahibi idareye yazılı başvurur, mal sahibi idare muvafakat etmez veya altmış gün içinde cevap vermezse Danıştay ilgili idari dairesi iki ay içinde kesin karar verir (2942 sayılı Kanun m. 30).

      **Değerlendirme:** İtfaiye aracı kamu hizmetinde fiilen kullanıldığı için haczedilemez. Emlak vergisi gibi belediyece tahsil edilen vergi, resim ve harç gelirleri de açıkça haczedilemez. Boş bir arsanın kiraya verilmesi hâlinde haczedilip edilemeyeceği, kamu hizmetinde fiilen kullanılıp kullanılmadığına bağlı olgusal bir değerlendirmedir; bu nedenle bu noktada kesin bir sonuca varılmamıştır. İcra dairesinin haciz kararı almadan önce belediyeden haczedilebilir mal göstermesini istemesi usul gereğidir. İkinci olarak, bakanlık arsayı "kamulaştıramaz"; 2942 sayılı Kanun m. 30 devir usulünü getirir. Bakanlık belediyeye yazılı başvurur; belediye altmış gün içinde cevap vermezse Danıştay ilgili dairesi inceleyerek iki ay içinde kesin karara bağlar.

      **Sonuç:** İtfaiye aracı ve vergi gelirleri haczedilemez; icra dairesi önce belediyeden haczedilebilir mal göstermesini ister. Bakanlık belediye arsasını kamulaştıramaz, 2942 sayılı Kanun m. 30'daki devir usulünü işletir; belediyenin sessizliği hâlinde uyuşmazlığı Danıştay ilgili idari dairesi iki ay içinde kesin olarak çözer.
kartlar:
  - on: "Kıyı nedir?"
    arka: "Kıyı çizgisi ile kıyı kenar çizgisi arasındaki alandır (3621 sayılı Kanun m. 4)."
  - on: "Sahil şeridinin genişliği nedir?"
    arka: "Kıyı kenar çizgisinden itibaren kara yönünde yatay olarak en az 100 metredir (3621 sayılı Kanun m. 4)."
  - on: "Sahil şeridindeki yapılar kıyı kenar çizgisine ne kadar yaklaşabilir?"
    arka: "En fazla 50 metre (3621 sayılı Kanun m. 5). Bu, sahil şeridinin genişliği değildir."
  - on: "Kıyı kenar çizgisini kim tespit eder, kim onaylar?"
    arka: "Valilikçe kurulan en az 5 kişilik komisyon tespit eder; Çevre ve Şehircilik Bakanlığı onayıyla yürürlüğe girer (3621 sayılı Kanun m. 9)."
  - on: "Kıyıda yapı ve engel yasağının istisnası nedir?"
    arka: "Kıyıda imar planı kararıyla, iskele, liman, rıhtım gibi kamu yararına yönelik altyapı ve sayılan tesisler yapılabilir (3621 sayılı Kanun m. 6)."
  - on: "Devlet ormanlarına ilişkin üç anayasal yasak nedir?"
    arka: "Mülkiyet devrolunamaz, zamanaşımıyla mülk edinilemez, kamu yararı dışında irtifak hakkına konu olamaz (AY m. 169/2)."
  - on: "Devlet ormanında kamu yararlı tesis için izin süresi?"
    arka: "En çok 49 yıl; amaca uygun faaliyette uzatmayla 99 yıla kadar (6831 sayılı Kanun m. 17/3)."
  - on: "TMK m. 715/2 neyi söyler?"
    arka: "Yararı kamuya ait sular ile kayalar, tepeler, dağlar gibi tarıma elverişsiz yerler aksi ispatlanmadıkça kimsenin mülkiyetinde değildir ve özel mülkiyete konu olamaz."
  - on: "Tapulu taşınmaz kayda tabi olmayan yere dönüşürse ne olur?"
    arka: "Tapu sicilinden çıkarılır (TMK m. 999/2). Doğru hüküm iptal ve terkindir."
  - on: "TMK m. 1007 sorumluluğunun niteliği ve süresi?"
    arka: "Devletin sorumluluğu kusursuzdur; HGK'ya göre on yıllık genel zamanaşımı, iptal kararının kesinleşmesinden işler."
  - on: "Belediye mallarında haczedilemezlik ölçütü nedir?"
    arka: "Malın kamu hizmetlerinde fiilen kullanılması; ayrıca belediyece tahsil edilen vergi, resim ve harç gelirleri (5393 sayılı Kanun m. 15)."
  - on: "Bir kamu tüzel kişisinin taşınmazı başka bir idarece kamulaştırılabilir mi?"
    arka: "Hayır. Devir usulü işler; mal sahibi idare altmış gün cevap vermezse Danıştay ilgili idari dairesi iki ay içinde kesin karar verir (2942 sayılı Kanun m. 30)."
