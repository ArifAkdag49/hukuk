ozet: |
  - **Kamu hizmeti:** toplumun ortak bir ihtiyacını karşılayan, kamu yararı taşıyan ve bir **kamu tüzelkişisince üstlenilen** sürekli ve düzenli faaliyettir. İki unsuru vardır: **maddi (amaçsal) unsur** (ortak ihtiyaç, kamu yararı) ve **organik (şekli) unsur** (kamu tüzelkişisinin üstlenmesi). İdarenin kuruluş ve görevleri kanunla düzenlenir (AY m. 123/1).
  - **Sınıflandırma:** idari, iktisadi ve ticari, sosyal, bilimsel-teknik-kültürel hizmetler.
  - **Hâkim ilkeler (Rolland yasaları):** **süreklilik ve düzenlilik**, **değişkenlik (uyarlama)**, **eşitlik ve tarafsızlık** (AY m. 10). Bedelsizlik (meccanilik) mutlak bir ilke değildir; ilköğretim devlet okullarında parasızdır (AY m. 42/5).
  - **Yürütülme usulleri:** **emanet** (idare bizzat; sermaye ve risk idarede), **müşterek emanet**, **iltizam**, **imtiyaz** (idari sözleşme; kâr-zarar imtiyaz sahibinde; Danıştay iki ay içinde düşünce bildirir, AY m. 155/2), **ruhsat**, **yap-işlet-devret** (3996 sayılı Kanun m. 5: özel hukuk sözleşmesi) ve **hizmet alımı** (5393 sayılı Kanun m. 67).
  - **Belediyelerde imtiyaz:** su, toplu taşıma ve katı atık hizmetleri; Danıştay görüşü ve bakanlık kararıyla, süresi **49 yılı** geçmemek üzere (5393 sayılı Kanun m. 15).
  - **Tahkim:** imtiyaz sözleşmelerinde milli veya milletlerarası tahkim öngörülebilir; milletlerarası tahkim yalnız yabancılık unsuru taşıyan uyuşmazlıklarda (AY m. 125/1). Tahkim yoksa dava Danıştayda açılır (2575 sayılı Kanun m. 24).
  - **Devletleştirme (AY m. 47/1-2):** kamu hizmeti niteliğindeki **özel teşebbüsün**, kamu yararı zorunlu kılarsa, **gerçek karşılığı** ödenerek Devlete geçirilmesi. **Kamulaştırma** (AY m. 46) ise özel mülkiyetteki **taşınmazlara** ilişkindir.
  - **Özelleştirme (AY m. 47/3):** Devletin, KİT'lerin ve diğer kamu tüzelkişilerinin işletme ve varlıklarının kanundaki esaslara göre devri (4046 sayılı Kanun m. 18). AY m. 47/4: hangi yatırım ve hizmetlerin özel hukuk sözleşmeleriyle yaptırılabileceği kanunla belirlenir.
  - **Anayasal sınır (AY m. 128/1):** genel idare esaslarına göre yürütülen hizmetlerin **asli ve sürekli görevleri** memurlar ve diğer kamu görevlileri eliyle görülür; özel kişilere devredilemez. 📌 AYM, belediyenin itfaiye hizmetini "yaptırabilmesini" iptal etmiştir (5393 sayılı Kanun m. 14).
anlatim: |
  ## 1. Kamu hizmeti nedir?

  **Kamu hizmeti**, toplumun ortak bir ihtiyacını karşılamak üzere, kamu yararı gözetilerek yürütülen sürekli ve düzenli faaliyetlerdir. Bu faaliyeti ya bir kamu tüzelkişisi bizzat yürütür ya da kamu tüzelkişisinin gözetim ve denetimi altında özel kişiler yürütür. Kavramı şöyle düşün: "Bu iş toplum için vazgeçilmez ve onun sorumluluğunu devlet üstlenmiş" diyebiliyorsan karşında bir kamu hizmeti vardır.

  Kamu hizmetinin iki kurucu unsuru vardır:

  - **Maddi (amaçsal) unsur:** Faaliyet, topluluğun ortak bir ihtiyacını karşılamaya ve kamu yararını gerçekleştirmeye yönelmiştir.
  - **Organik (şekli) unsur:** Faaliyet bir **kamu tüzelkişisi tarafından üstlenilmiştir**; ister bizzat yürütsün, ister özel kişilere yaptırsın, hizmetin sorumluluğu ve denetimi kamu tüzelkişisindedir.

  > **Örnek:** Büyükşehir belediyesinin metro işletmesi hem ortak bir ulaşım ihtiyacını karşılar hem de belediye tarafından üstlenilmiştir; kamu hizmetidir. Mahalledeki özel bir kafe de insanların ihtiyacını karşılar ama hiçbir kamu tüzelkişisi bu faaliyeti üstlenmemiştir; kamu hizmeti değildir.

  İdarenin kuruluş ve görevleri bir bütündür ve kanunla düzenlenir (AY m. 123/1). Bu yüzden bir faaliyetin kamu hizmeti hâline getirilmesi, özellikle özel girişim hürriyetini (AY m. 48) daraltacaksa, kanuni dayanak gerektirir; temel hak ve hürriyetleri sınırlamak da ancak kanunla olabilir (AY m. 13).

  ## 2. Kamu hizmetlerinin sınıflandırılması

  Konularına göre dört grupta incelenir:

  1. **İdari kamu hizmetleri:** Devletin varlığıyla ilgili klasik işlevler (kolluk, savunma, yargı, vergi).
  2. **İktisadi ve ticari kamu hizmetleri:** Su, elektrik, ulaşım gibi, kullanıcıdan ücret alınarak sunulan hizmetler.
  3. **Sosyal kamu hizmetleri:** Sağlık, eğitim, sosyal yardım.
  4. **Bilimsel, teknik ve kültürel hizmetler:** Araştırma, meteoroloji, müze, kütüphane gibi faaliyetler.

  Bu ayrım sınav için önemlidir, çünkü yürütülme usulü ve hukuki rejim hizmetin türüne göre değişir. Örneğin iktisadi ve ticari hizmetlerin özel kişilere gördürülmesi kolaydır; idari hizmetlerin asli ve sürekli görevleri ise devredilemez (aşağıda 6. bölüm).

  ## 3. Kamu hizmetine hâkim ilkeler (Rolland yasaları)

  Kamu hizmetinin hukuki rejimini üç klasik ilke belirler.

  ### a) Süreklilik ve düzenlilik ilkesi
  Kamu hizmeti aksatılmadan ve kesintisiz yürütülmelidir. Sonuçları:

  - Memurların kamu hizmetini aksatacak toplu eylemleri yasaktır (DMK m. 26).
  - Çekilmek isteyen memur, yerine atanan kişi gelinceye veya çekilme isteği kabul edilinceye kadar görevine devam eder (DMK m. 94). Yerine atanan kişi bir aya kadar gelmezse veya vekil atanmazsa, üstüne haber vererek görevi bırakabilir.
  - İdari sözleşmelerde **beklenmeyen hâl (imprévision)** kuramı: Sözleşmenin dengesi öngörülemeyen olaylarla bozulsa bile yüklenici hizmeti kendiliğinden durduramaz; idare zararın bir bölümünü karşılayarak hizmetin sürmesini sağlar.
  - Kamu hizmetinde fiilen kullanılan mallar haczedilemez. Belediyeler açısından bunu açıkça 5393 sayılı Kanun m. 15 düzenler. Genel olarak Devlet malları da haczedilemez (İİK m. 82/1).

  ### b) Değişkenlik (uyarlama) ilkesi
  Kamu hizmeti, toplumun değişen ihtiyaçlarına göre değiştirilebilir. Sonuçları:

  - İdare hizmetin örgütlenmesini, düzenleyici işlemleri ve hizmet standartlarını **tek yanlı** değiştirebilir.
  - İmtiyaz sözleşmesinde idarenin hizmete ilişkin kuralları değiştirme yetkisi saklıdır; ancak bu değişiklik imtiyaz sahibinin mali dengesini bozarsa idare dengeyi yeniden kurar (telafi eder).
  - Hizmetten yararlananlar ve kamu görevlileri, hizmetin işleyişinin ya da statü kurallarının aynı kalması yönünde "kazanılmış hak" ileri süremez.

  > **Örnek:** İmtiyaz sahibi şirket, belediyenin "vagonlara güvenlik kamerası takılsın" talimatına "sözleşmede yok" diyerek karşı çıkamaz. Kamera masrafı dengeyi bozuyorsa şirket telafi talep eder, ama talimatı reddedemez.

  ### c) Eşitlik ve tarafsızlık ilkesi
  Aynı hukuki ve fiili durumdaki kişiler hizmetten aynı koşullarda yararlanır. Dayanağı kanun önünde eşitliktir: devlet organları ve idare makamları bütün işlemlerinde kanun önünde eşitlik ilkesine uygun hareket etmek zorundadır (AY m. 10). Eşitlik, farklı durumdakilere farklı davranmayı yasaklamaz; engelli, yaşlı gibi gruplar için alınacak tedbirler eşitliğe aykırı sayılmaz.

  ### d) Bedelsizlik (meccanilik) ilkesi: tartışmalı
  Klasik anlayışta kamu hizmeti vergilerle karşılandığı için kullanıcıya parasız sunulmalıdır. Günümüzde bu **mutlak bir ilke sayılmaz**. Kanunun açıkça parasız saydığı hizmetlerde geçerlidir: ilköğretim zorunludur ve Devlet okullarında parasızdır (AY m. 42/5). İktisadi ve ticari hizmetlerde ise tarife üzerinden ölçülü bir ücret alınması asıldır.

  > ⚠️ **Sınavda dikkat:** "Rolland yasaları" denince üç ilke sayılır: süreklilik, değişkenlik, eşitlik. Bedelsizliği dördüncü ilke olarak yazan kaynak da vardır; bu nedenle soruda ayrıca "bedelsizlik" geçiyorsa ilkenin mutlak olmadığını hatırla.

  ## 4. Kamu hizmetinin yürütülme usulleri

  Kamu hizmeti idare tarafından bizzat ya da özel kişiler eliyle yürütülür. Ayırt edici soru her zaman şudur: **sermaye, kâr ve zarar (işletme riski) kimde?**

  | Usul | Hukuki niteliği | Risk kimde? |
  |---|---|---|
  | Emanet | İdarenin iç örgütlenmesi | İdare |
  | Müşterek emanet | İdari sözleşme | İdare (işletmeci gelirden pay alır) |
  | İltizam | İdari sözleşme | İşletmeci (idareye maktu bedel öder) |
  | İmtiyaz | İdari sözleşme | İmtiyaz sahibi |
  | Ruhsat | Tek yanlı idari izin | Ruhsat sahibi |
  | Yap-işlet-devret | Özel hukuk sözleşmesi | Görevli şirket |

  ### Emanet (régie)
  Hizmeti idare kendi personeli, malvarlığı ve bütçesiyle yürütür. Kamu hizmetinin en doğal usulüdür; AY m. 128/1 kapsamındaki asli ve sürekli görevlerde **zorunludur**.

  ### Müşterek emanet ve iltizam
  Müşterek emanette tesis ve zarar riski idareye aittir, özel kişi işletir ve gelirden pay alır. İltizamda ise işletmeci idareye sabit bir bedel öder; kâr ve zarar kendisine aittir. İkisi de bugün klasik anlamda neredeyse uygulanmaz, ama sınavda tanım olarak çıkar.

  ### İmtiyaz (concession)
  İmtiyazda kamu hizmetinin uzun süreli kurulup işletilmesi özel kişiye devredilir. Tesis, sermaye, kâr ve zarar imtiyaz sahibine aittir; geliri kullanıcıdan tarife üzerinden alınan ücrettir. Bilmen gereken kurallar:

  - **Niteliği:** İdari sözleşmedir. Kamu hizmetleri ile ilgili imtiyaz şartlaşma ve sözleşmeleri hakkında **iki ay içinde düşünce bildirmek** Danıştayın görevidir (AY m. 155/2).
  - **Belediyelerde:** Belediye, su, toplu taşıma ve katı atık hizmetlerini Danıştayın görüşü ve bakanlık kararıyla, **süresi kırk dokuz yılı geçmemek** üzere imtiyaz yoluyla devredebilir (5393 sayılı Kanun m. 15). Toplu taşımada imtiyaz yerine ruhsat verme, hat kiralama veya hizmet satın alma da mümkündür.
  - **Uyuşmazlık:** İmtiyaz sözleşmelerinde milli veya milletlerarası tahkim öngörülebilir; milletlerarası tahkime **ancak yabancılık unsuru taşıyan uyuşmazlıklar** için gidilebilir (AY m. 125/1). Tahkim yolu öngörülmemişse uyuşmazlık idari yargıya gider (İYUK m. 2/1-c) ve ilk derece mahkemesi olarak Danıştayda görülür (2575 sayılı Kanun m. 24).

  > ⚠️ **Sınavda dikkat:** Sözleşmeye "imtiyaz" denmesi şart değildir. Özel kişi hizmeti uzun süreli kurup işletiyor, işletme riskini üstleniyor ve kullanıcıdan ücret alıyorsa maddi anlamda imtiyaz söz konusu olabilir. Ama kanun belli bir modeli özel hukuk sözleşmesi saymışsa (YİD gibi) imtiyaz rejimi uygulanmaz.

  ### Ruhsat (izin, lisans)
  Tekel konusu olmayan hizmetlerde (özel okul, özel hastane, belediyenin toplu taşıma ruhsatı gibi) idare tek yanlı izinle özel kişinin faaliyet göstermesine imkân verir; risk özel kişidedir. Ruhsatın gerçekten bir "yürütülme usulü" mü yoksa bir kolluk izni mi olduğu tartışmalıdır (doktrin bölümüne bak).

  ### Yap-işlet-devret ve kamu-özel işbirliği
  3996 sayılı Kanun, ileri teknoloji veya yüksek maddi kaynak gerektiren bazı yatırım ve hizmetlerin (köprü, tünel, otoyol, baraj, enerji tesisi gibi, 3996 sayılı Kanun m. 2) sermaye şirketleri veya yabancı şirketler eliyle yaptırılmasını düzenler. Bu modelde:

  - İdare ile şirket arasındaki sözleşme **özel hukuk hükümlerine tabidir** (3996 sayılı Kanun m. 5). Anayasal zemin AY m. 47/4'tür.
  - Şirketin yaptığı yatırım ve hizmetler, sözleşme sona erince borç ve taahhütlerden arî, bakımlı, çalışır durumda ve **bedelsiz** olarak kendiliğinden idareye geçer (3996 sayılı Kanun m. 9).

  6428 sayılı Kanun da Sağlık Bakanlığı tesislerinin ihale ile ve özel hukuk hükümlerine göre kamu özel iş birliği modeliyle yaptırılmasını düzenler (6428 sayılı Kanun m. 1). Çekirdek sağlık hizmeti kamu görevlilerince, bina ve destek hizmetleri ise şirketçe görülür.

  ### Hizmet alımı
  İdare, kendi görevini devretmeksizin bazı **destek hizmetlerini** ihale yoluyla üçüncü kişilere gördürür. Belediyelerde temizlik, güvenlik, yemek, park-bahçe bakımı gibi hizmetler, belediye meclisi kararıyla ve süresi ilk mahallî idareler genel seçimlerini izleyen altıncı ayın sonunu geçmemek üzere ihaleyle gördürülebilir (5393 sayılı Kanun m. 67).

  ## 5. Devletleştirme ve özelleştirme

  **Devletleştirme (AY m. 47/1-2):** Kamu hizmeti niteliği taşıyan **özel teşebbüsler**, kamu yararının zorunlu kıldığı hâllerde devletleştirilebilir. Devletleştirme **gerçek karşılığı** üzerinden yapılır; hesaplama usulleri kanunla düzenlenir (3082 sayılı Kanun m. 1).

  > ⚠️ **Sınavda dikkat:** Devletleştirmeyi kamulaştırmayla karıştırma. **Kamulaştırma** (AY m. 46), Devlet ve kamu tüzelkişilerinin, kamu yararının gerektirdiği hâllerde gerçek karşılığı peşin ödemek şartıyla, **özel mülkiyetteki taşınmaz malları** almasıdır. Devletleştirmenin konusu ise kamu hizmeti niteliğindeki **özel teşebbüsün kendisidir**.

  **Özelleştirme (AY m. 47/3):** Devletin, kamu iktisadi teşebbüslerinin ve diğer kamu tüzelkişilerinin mülkiyetindeki işletme ve varlıkların özelleştirilmesine ilişkin esas ve usuller **kanunla** gösterilir. 4046 sayılı Kanun m. 18'e göre yöntemler şunlardır: satış, kiralama, işletme hakkının verilmesi, mülkiyetin gayri ayni haklar tesisi, gelir ortaklığı modeli ve işin gereğine uygun diğer hukuki tasarruflar.

  **Kamu yatırım ve hizmetlerinin özel hukuk sözleşmesiyle yaptırılması (AY m. 47/4):** Devlet, KİT'ler ve diğer kamu tüzelkişilerinin yürüttüğü yatırım ve hizmetlerden hangilerinin özel hukuk sözleşmeleriyle gerçek veya tüzelkişilere yaptırılabileceği ya da devredilebileceği kanunla belirlenir. 3996 ve 6428 sayılı Kanunlar bu fıkranın uygulama alanlarıdır.

  > 📌 **Kesin bilgi:** AY m. 47'nin üçüncü ve dördüncü fıkraları 1999 yılında 4446 sayılı Kanunla eklenmiştir. Aynı yıl imtiyaz sözleşmelerinde milli veya milletlerarası tahkim yolu açılmış (AY m. 125/1) ve Danıştayın bu sözleşmelere ilişkin görevi iki ay içinde düşünce bildirmek olarak düzenlenmiştir (AY m. 155/2).

  ## 6. Devredilemeyen çekirdek: AY m. 128/1

  Devletin, KİT'lerin ve diğer kamu tüzelkişilerinin **genel idare esaslarına göre yürütmekle yükümlü oldukları kamu hizmetlerinin gerektirdiği asli ve sürekli görevler**, memurlar ve diğer kamu görevlileri eliyle görülür (AY m. 128/1). Yani kamu gücü kullanımını gerektiren çekirdek görevler özel hukuk kişilerine bırakılamaz. Anayasa Mahkemesi, bu ilkeden hareketle 5393 sayılı Kanun m. 14'te belediyelerin hizmetleri "yapar veya yaptırır" denmesindeki "yaptırır" ibaresini **itfaiye hizmeti yönünden** iptal etmiştir (2019). İtfaiye hizmetini bu nedenle belediye ancak kendisi yapabilir.

  > **Örnek:** Belediye, park-bahçe bakımı ve temizlik işini ihale ile bir şirkete gördürebilir (5393 sayılı Kanun m. 67). Ama itfaiye hizmetinin yürütülmesini özel şirkete devretmesi AY m. 128/1'e aykırıdır.

  > 💡 **Püf nokta:** Soruda "özel kişiye gördürülebilir mi?" diye sorulursa şu sırayla düşün: (1) Hizmet asli ve sürekli, kamu gücü gerektiren bir çekirdek görev mi? Evetse emanet zorunlu. (2) Değilse, destek hizmeti mi (hizmet alımı), iktisadi-ticari hizmet mi (imtiyaz, ruhsat, YİD)?

  ## 7. Kısa denetim şeması

  1. Faaliyet kamu hizmeti mi? (Maddi unsur + organik unsur)
  2. Hangi türden? (İdari, iktisadi-ticari, sosyal, bilimsel-kültürel)
  3. Özel kişiye devredilebilir mi? (AY m. 128/1 çekirdeği mi?)
  4. Devredilecekse hangi usulle? (Risk kimde, sözleşme idari mi özel hukuk mu?)
  5. Uyuşmazlık varsa yargı yolu: idari sözleşme ise idari yargı (tahkim yoksa imtiyazda Danıştay), özel hukuk sözleşmesi ise adli yargı.
  6. Hâkim ilkelerden hangisi tartışılıyor? (Süreklilik, değişkenlik, eşitlik)
kritik: |
  - 📌 **İki unsur:** maddi (ortak ihtiyaç, kamu yararı) + organik (kamu tüzelkişisinin üstlenmesi).
  - 📌 **Rolland yasaları:** süreklilik ve düzenlilik, değişkenlik, eşitlik. Bedelsizlik mutlak değildir (AY m. 42/5: ilköğretim parasız).
  - 📌 **Süreklilik sonuçları:** memur toplu eylem yasağı (DMK m. 26), çekilme kabul edilene veya yerine atanan gelene kadar görev; atanan bir aya kadar gelmez ya da vekil atanmazsa üstüne haber vererek bırakabilir (DMK m. 94), beklenmeyen hâl, kamu hizmetinde kullanılan malların haczedilememesi.
  - 📌 **Değişkenlik sonucu:** idare hizmeti tek yanlı değiştirir; yararlanan ve imtiyazcı "kazanılmış hak" ileri süremez, mali denge bozulursa telafi edilir.
  - 📌 **Risk ölçütü:** emanet ve müşterek emanette risk idarede; iltizam, imtiyaz ve ruhsatta işletmecide.
  - 📌 **İmtiyaz:** idari sözleşme; Danıştay iki ay içinde düşünce bildirir (AY m. 155/2); belediyelerde en çok 49 yıl ve yalnız su, toplu taşıma, katı atık (5393 sayılı Kanun m. 15).
  - 📌 **Tahkim:** milletlerarası tahkim yalnız yabancılık unsurlu uyuşmazlıkta (AY m. 125/1). Tahkim yoksa imtiyaz davası ilk derece mahkemesi olarak Danıştayda (2575 sayılı Kanun m. 24).
  - 📌 **YİD:** özel hukuk sözleşmesi (3996 sayılı Kanun m. 5); sözleşme bitince tesis bedelsiz idareye geçer (3996 sayılı Kanun m. 9). İmtiyaz ile karıştırma.
  - 📌 **Devletleştirme (AY m. 47/1-2) ≠ kamulaştırma (AY m. 46):** biri kamu hizmeti niteliğindeki özel teşebbüs, öteki özel mülkiyetteki taşınmaz.
  - 📌 **Özelleştirme:** esas ve usuller kanunla (AY m. 47/3); yöntemler 4046 sayılı Kanun m. 18'de (satış, kiralama, işletme hakkı, gayri ayni hak, gelir ortaklığı).
  - 📌 **AY m. 128/1:** asli ve sürekli görevler memurlarca görülür. Belediyenin itfaiye hizmetini "yaptırması" AYM tarafından iptal edilmiştir; temizlik gibi destek hizmetleri ise hizmet alımıyla gördürülebilir (5393 sayılı Kanun m. 67).
  - ⚠️ **Tuzak:** Sözleşmenin adı değil içeriği belirleyicidir; ama kanun açıkça özel hukuk saymışsa (3996 sayılı Kanun m. 5) idari sözleşme rejimi uygulanmaz.
doktrin: |
  ### Bedelsizlik ilkesi mutlak mı?
  Klasik Fransız öğretisinde kamu hizmetinin vergilerle finanse edildiği, bu yüzden kullanıcıya bedelsiz sunulması gerektiği savunulurdu. Çağdaş öğretide **baskın görüş**, bedelsizliği mutlak bir ilke olarak görmez: Bedelsizlik yalnız kanunun veya Anayasanın açıkça parasız saydığı hizmetlerde (örneğin devlet okullarında ilköğretim, AY m. 42/5) geçerlidir. İktisadi ve ticari hizmetlerde tarife üzerinden ölçülü ücret alınması kural sayılır. Bu yüzden notta bedelsizlik, üç klasik ilkeden ayrı ve mutlak olmayan bir ilke olarak anlatılmıştır.

  ### Ruhsatın niteliği
  **Birinci görüş**, özel okul, özel hastane veya toplu taşıma ruhsatlarında idarenin tek yanlı izinle özel kişiyi kamu hizmetini yürütmeye yetkilendirdiğini, dolayısıyla ruhsatın bir **kamu hizmeti görülüş usulü** olduğunu savunur. **İkinci görüş** ise özel okul veya özel hastanenin özel girişim hürriyeti (AY m. 48) kapsamında faaliyet gösterdiğini, ruhsatın bir **kolluk izni** olduğunu ileri sürür; bu görüşe göre ortada devredilmiş bir kamu hizmeti yoktur. Sınavda hangi görüşün benimsendiği belirtilmedikçe ruhsat, "tek yanlı idari işlemle verilen izin" olarak tanımlanmalı ve tartışma ayrıca anılmalıdır.

  ### KÖİ projelerinde gelir garantisi ve imtiyaz
  İmtiyazın ayırt edici özelliği işletme riskinin özel kişide olmasıdır. Kamu-özel işbirliği projelerinde idarenin verdiği uzun vadeli talep ve gelir garantileri bu riski büyük ölçüde idareye kaydırdığı için, bu projelerin klasik imtiyazla ne ölçüde örtüştüğü tartışmalıdır. Kanun bu sözleşmeleri özel hukuk sözleşmesi saydığından uygulamada özel hukuk rejimi esas alınır; bu tartışma yalnız doktrinde yaşar ve olay çözümlerinin sonucunu belirlemez.
sozluk:
  - terim: Kamu hizmeti
    tanim: "Toplumun ortak ihtiyacını karşılayan, kamu yararı taşıyan ve bir kamu tüzelkişisince üstlenilen sürekli ve düzenli faaliyet."
  - terim: Maddi unsur
    tanim: "Faaliyetin ortak bir ihtiyacı karşılamaya ve kamu yararını gerçekleştirmeye yönelik olması."
  - terim: Organik unsur
    tanim: "Faaliyetin bir kamu tüzelkişisi tarafından üstlenilmiş olması; bizzat yürütülse de özel kişilere yaptırılsa da sorumluluk kamu tüzelkişisindedir."
  - terim: Süreklilik ilkesi
    tanim: "Kamu hizmetinin kesintisiz ve düzenli yürütülmesi gerektiğini söyleyen Rolland ilkesi."
  - terim: Değişkenlik (mutabilité)
    tanim: "İdarenin, değişen ihtiyaçlara göre hizmeti tek yanlı değiştirebilmesi; kimse hizmetin aynı kalmasında kazanılmış hak ileri süremez."
  - terim: Emanet (régie)
    tanim: "Hizmetin idare tarafından kendi personeli, malvarlığı ve bütçesiyle bizzat yürütülmesi."
  - terim: İmtiyaz
    tanim: "Kamu hizmetinin uzun süreli kurulup işletilmesinin, kâr ve zararı kendisine ait olmak üzere idari sözleşmeyle özel kişiye bırakılması."
  - terim: İltizam
    tanim: "İşletmecinin idareye maktu bir bedel ödeyip kâr ve zararı üstlendiği usul."
  - terim: Yap-işlet-devret
    tanim: "3996 sayılı Kanun kapsamında özel hukuk sözleşmesiyle şirkete yaptırılan yatırımın, süre sonunda bedelsiz olarak idareye geçtiği model."
  - terim: Devletleştirme
    tanim: "Kamu hizmeti niteliği taşıyan özel teşebbüsün, gerçek karşılığı üzerinden kanunla Devlet mülkiyetine alınması (AY m. 47/1-2)."
  - terim: Özelleştirme
    tanim: "Devletin, KİT'lerin ve diğer kamu tüzelkişilerinin işletme ve varlıklarının kanundaki esaslara göre özel hukuk kişilerine devri (AY m. 47/3)."
  - terim: Beklenmeyen hâl (imprévision)
    tanim: "Sözleşme dengesini öngörülemeyen biçimde bozan olay; yüklenici hizmeti durduramaz, idare zararın bir kısmını karşılar."
