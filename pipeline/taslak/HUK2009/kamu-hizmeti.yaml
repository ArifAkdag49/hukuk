sorular:
  - soru: |
      Bir faaliyetin kamu hizmeti sayılması için aranan unsurlardan, faaliyetin bir kamu tüzelkişisi tarafından üstlenilmiş olmasına ne ad verilir?
    siklar:
      - "Organik (şekli) unsur"
      - "Maddi (amaçsal) unsur"
      - "Kanunilik unsuru"
      - "Süreklilik unsuru"
    dogru: 0
    aciklama: |
      Kamu hizmetinin iki unsurundan maddi unsur ortak ihtiyaç ve kamu yararıyla ilgilidir; faaliyetin bir kamu tüzelkişisince üstlenilmesi ise organik (şekli) unsurdur. Süreklilik bir unsur değil, kamu hizmetine hâkim bir ilkedir.
  - soru: |
      Kamu yararının zorunlu kıldığı hâllerde, kamu hizmeti niteliği taşıyan bir özel teşebbüsün gerçek karşılığı üzerinden Devlet mülkiyetine alınmasını düzenleyen kurum aşağıdakilerden hangisidir?
    siklar:
      - "Kamulaştırma (AY m. 46)"
      - "Özelleştirme (AY m. 47/3)"
      - "Devletleştirme (AY m. 47/1-2)"
      - "İmtiyaz (AY m. 155/2)"
    dogru: 2
    aciklama: |
      AY m. 47/1-2'ye göre kamu hizmeti niteliği taşıyan özel teşebbüsler kamu yararının zorunlu kıldığı hâllerde gerçek karşılığı üzerinden devletleştirilebilir. Kamulaştırma (AY m. 46) özel mülkiyetteki taşınmaz mallara ilişkindir; özelleştirme ise tam tersi yönde, kamunun işletme ve varlıklarının devridir.
  - soru: |
      X Büyükşehir Belediyesi, şehir içi toplu taşıma hizmetini imtiyaz sözleşmesiyle özel bir şirkete devretmek istemektedir. Belediye Kanunu'na göre bu devir bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Devir yalnız belediye meclisi kararıyla yapılır, başka görüş alınmaz."
      - "Danıştayın görüşü ve bakanlık kararıyla, süresi kırk dokuz yılı geçmemek üzere yapılabilir."
      - "Süre sınırı yoktur; Cumhurbaşkanı kararıyla her süre için yapılabilir."
      - "Toplu taşıma hizmeti hiçbir hâlde imtiyaz yoluyla devredilemez."
    dogru: 1
    aciklama: |
      5393 sayılı Kanun m. 15'e göre belediye, su, toplu taşıma ve katı atık hizmetlerini Danıştayın görüşü ve Çevre ve Şehircilik Bakanlığının kararıyla, süresi kırk dokuz yılı geçmemek üzere imtiyaz yoluyla devredebilir. Toplu taşıma bakımından ruhsat, hat kiralama ve hizmet satın alma da mümkündür.
  - soru: |
      Y Belediyesi, itfaiye hizmetinin tamamını beş yıllığına ihale yoluyla özel bir şirkete devretmiştir. Bu işlem bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Hizmet alımı olduğundan 5393 sayılı Kanun m. 67 uyarınca tamamen hukuka uygundur."
      - "Hizmet iktisadi nitelikte olduğundan imtiyaz yoluyla devri mümkündür."
      - "Belediye meclisi karar verirse her hizmet özel kişiye devredilebilir."
      - "İtfaiye hizmeti genel idare esaslarına göre yürütülen asli ve sürekli görev niteliğinde olduğundan devir AY m. 128/1'e aykırıdır."
    dogru: 3
    aciklama: |
      AY m. 128/1'e göre genel idare esaslarına göre yürütülen kamu hizmetlerinin gerektirdiği asli ve sürekli görevler memurlar ve diğer kamu görevlileri eliyle görülür. Anayasa Mahkemesi de 5393 sayılı Kanun m. 14'teki "yaptırır" ibaresini itfaiye hizmeti yönünden iptal etmiştir. 5393 sayılı Kanun m. 67 ise temizlik, park-bahçe bakımı gibi destek hizmetleri içindir.
  - soru: |
      Aşağıdakilerden hangisi kamu hizmetinde **süreklilik** ilkesinin bir sonucudur?
    siklar:
      - "İdarenin hizmet kurallarını tek yanlı değiştirebilmesi"
      - "Kullanıcıların tarifenin sabit kalmasını isteyememesi"
      - "Memurun çekilme isteği kabul edilinceye veya yerine atanan gelinceye kadar görevine devam etmesi"
      - "Aynı durumdaki kişilere eşit davranılması"
    dogru: 2
    aciklama: |
      DMK m. 94'e göre çekilmek isteyen memur, yerine atanan kimsenin gelmesine veya çekilme isteğinin kabulüne kadar görevine devam eder; bu süreklilik ilkesinin sonucudur. Tek yanlı değiştirme ve kazanılmış hak ileri sürememe değişkenlik ilkesinin, eşit davranma ise eşitlik ilkesinin sonucudur.
  - soru: |
      Z İmtiyaz A.Ş. ile belediye arasındaki raylı sistem imtiyazında, enerji maliyetleri sözleşme yapılırken öngörülmeyecek ölçüde artmıştır. Şirket zarar ettiğini belirterek seferleri kendiliğinden durdurmak istemektedir. Kamu hizmeti ilkeleri bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Şirket, zarar ettiği için hizmeti durdurabilir; çünkü kâr ve zarar kendisine aittir."
      - "Süreklilik ilkesi gereği şirket hizmeti kendiliğinden durduramaz; beklenmeyen hâl kuramı çerçevesinde idareden destek talep edebilir."
      - "Değişkenlik ilkesi gereği sözleşme kendiliğinden sona erer."
      - "Eşitlik ilkesi gereği zarar belediye ile yolcular arasında yarı yarıya paylaşılır."
    dogru: 1
    aciklama: |
      Süreklilik ilkesi gereği imtiyaz sahibi, sözleşme dengesi öngörülemeyen olaylarla bozulsa bile hizmeti kendiliğinden durduramaz. Beklenmeyen hâl (imprévision) kuramına göre idare, zararın bir bölümünü karşılayarak hizmetin sürmesini sağlar. Kâr ve zararın imtiyaz sahibine ait olması bu kuralı ortadan kaldırmaz.
  - soru: |
      Belediyenin tarifesinde zam yapılması üzerine metro kullanıcısı Ali, "Bilet ücreti benim için değişmeyecek bir hak kazanmıştı" diyerek dava açmak istemektedir. Ali'nin iddiasına karşı en doğru dayanak aşağıdakilerden hangisidir?
    siklar:
      - "Süreklilik ilkesi"
      - "Değişkenlik (uyarlama) ilkesi"
      - "Eşitlik ilkesi"
      - "Bedelsizlik ilkesi"
    dogru: 1
    aciklama: |
      Hizmetten yararlananlar, hizmetin işleyişinin ya da şartlarının aynı kalması yönünde kazanılmış hak ileri süremez; bu, değişkenlik (uyarlama) ilkesinin sonucudur. Zammın hukuka uygunluğu ayrıca yargısal denetime tabi olabilir, ancak "kazanılmış hak" argümanı bu ilke karşısında tutmaz.
  - soru: |
      3996 sayılı Kanun kapsamında idare ile bir sermaye şirketi arasında yapılan yap-işlet-devret sözleşmesi hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İdari sözleşmedir; Danıştay iki ay içinde düşünce bildirmek zorundadır."
      - "Özel hukuk hükümlerine tabidir."
      - "Tek yanlı idari işlemdir; ruhsat niteliğindedir."
      - "Müşterek emanet usulünün bir türüdür."
    dogru: 1
    aciklama: |
      3996 sayılı Kanun m. 5'e göre Yüksek Planlama Kurulunca belirlenen idare ile sermaye şirketi veya yabancı şirket arasında yapılacak sözleşme özel hukuk hükümlerine tabidir; anayasal zemin AY m. 47/4'tür. Danıştayın iki ay içinde düşünce bildirmesi AY m. 155/2'ye göre kamu hizmeti imtiyaz şartlaşma ve sözleşmeleriyle ilgilidir.
  - soru: |
      Bir kamu hizmeti imtiyaz sözleşmesinde tahkim yolu öngörülmemiştir. İdare ile imtiyaz sahibi arasında çıkan uyuşmazlık bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Uyuşmazlık adli yargıda asliye hukuk mahkemesinde görülür."
      - "Uyuşmazlık idare mahkemesinde görülür."
      - "Uyuşmazlık ilk derece mahkemesi olarak Danıştayda görülür."
      - "Uyuşmazlık milletlerarası tahkim yoluyla çözülmek zorundadır."
    dogru: 2
    aciklama: |
      Tahkim yolu öngörülmeyen imtiyaz şartlaşma ve sözleşmelerinden doğan idari davalar, 2575 sayılı Kanun m. 24'e göre ilk derece mahkemesi olarak Danıştayda görülür (İYUK m. 2/1-c ile birlikte). AY m. 125/1 tahkimi mümkün kılar, ama zorunlu kılmaz.
  - soru: |
      Aşağıdakilerden hangisi 4046 sayılı Kanun m. 18'de sayılan özelleştirme yöntemlerinden biridir?
    siklar:
      - "Devletleştirme"
      - "Kamulaştırma"
      - "İşletme hakkının verilmesi"
      - "Emanet"
    dogru: 2
    aciklama: |
      4046 sayılı Kanun m. 18'e göre özelleştirme yöntemleri satış, kiralama, işletme hakkının verilmesi, mülkiyetin gayri ayni hakların tesisi ve gelir ortaklığı modeli ile işin gereğine uygun diğer hukuki tasarruflardır. Devletleştirme ve kamulaştırma, mülkiyetin kamuya geçtiği kurumlardır; emanet ise bir yürütülme usulüdür.
  - soru: |
      Z Belediyesi, park ve bahçe bakımı ile yemek hizmetlerini süresi, ilk mahallî idareler genel seçimlerini izleyen altıncı ayın sonunu geçmemek üzere ihaleyle özel bir şirkete gördürmüştür. Bu işlem bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "AY m. 128/1'e aykırıdır, çünkü her kamu hizmeti memurlarla görülmelidir."
      - "İmtiyaz sayılır; Danıştay görüşü alınmadığı için geçersizdir."
      - "5393 sayılı Kanun m. 67 çerçevesinde hizmet alımı olarak yapılabilir."
      - "Yalnız devletleştirme yoluyla yapılabilir."
    dogru: 2
    aciklama: |
      5393 sayılı Kanun m. 67, park-bahçe bakımı, temizlik, güvenlik ve yemek gibi destek hizmetlerinin, belirtilen süre sınırı içinde ihale yoluyla üçüncü kişilere gördürülmesine imkân verir. AY m. 128/1'in korunan çekirdeği asli ve sürekli görevlerdir; destek hizmetleri bu çekirdeğe girmez.
  - soru: |
      Bir alacaklı, belediyenin şehir içi toplu taşıma hizmetinde fiilen kullanılan otobüslerine haciz koydurmak istemektedir. Bu istem hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Belediyenin kamu hizmetlerinde fiilen kullanılan malları haczedilemez."
      - "Belediye malları hiçbir hâlde haczedilemez, hizmette kullanılsın ya da kullanılmasın."
      - "Otobüsler hizmette de olsa haczedilir; çünkü kamu hizmetinde kullanılan mal diye bir sınır yoktur."
      - "Haciz yalnız belediye meclisinin onayıyla yapılabilir."
    dogru: 0
    aciklama: |
      5393 sayılı Kanun m. 15'e göre kamu hizmetlerinde fiilen kullanılan mallar haczedilemez; bu kural kamu hizmetinin sürekliliğini korur. Yine de belediyenin her malı haczedilemez değildir; bu nedenle ikinci şık yanlıştır.
olaylar:
  - olay: |
      Büyükşehir Belediyesi, şehir içi raylı toplu taşıma hizmetini Danıştayın görüşünü alarak ve bakanlık kararıyla 30 yıl süreyle Metro A.Ş.'ye imtiyaz sözleşmesiyle devretmiştir. Sözleşmede tahkim yolu öngörülmemiştir. Sözleşmenin beşinci yılında enerji fiyatları öngörülemeyecek ölçüde artmış, A.Ş. zarar ettiğini bildirerek seferleri durduracağını açıklamıştır. Aynı dönemde Belediye, yolcu güvenliği için vagonlara kamera takılmasını tek yanlı olarak istemiş, Metro A.Ş. ise "sözleşmede bu yükümlülük yoktur ve kazanılmış hakkımız var" diyerek reddetmiştir. Ayrıca Belediye tarifeye zam yapınca yolcu Ayşe, "bilet fiyatının değişmemesi benim kazanılmış hakkımdı" diyerek dava açmaya hazırlanmaktadır. Belediye, daha önce itfaiye hizmetini de bir güvenlik şirketine beş yıllığına devretmiştir.

      1. Bu devir hukuka uygun mudur, süre ve usul bakımından?
      2. Metro A.Ş. seferleri durdurabilir mi?
      3. Kamera talimatı ve Ayşe'nin iddiası hakkında hangi ilkeler uygulanır?
      4. İtfaiye devri hukuka uygun mudur? Sözleşmeden doğan uyuşmazlık nerede çözülür?
    olcut:
      - {tespit: "İmtiyaz usulünün niteliği, Danıştay görüşü, bakanlık kararı ve 49 yıl sınırı (30 yıl uygun)", puan: 20, madde: "5393 sayılı Kanun m. 15; AY m. 155/2"}
      - {tespit: "Süreklilik ilkesi gereği hizmetin kendiliğinden durdurulamayacağı; beklenmeyen hâl", puan: 20, madde: "Süreklilik ilkesi (genel ilke)"}
      - {tespit: "Değişkenlik ilkesi: kamera talimatı ve yolcunun kazanılmış hak iddiası", puan: 20, madde: "Değişkenlik ilkesi (genel ilke)"}
      - {tespit: "İtfaiye hizmetinin devredilemezliği", puan: 20, madde: "AY m. 128/1"}
      - {tespit: "Tahkim yoksa uyuşmazlığın ilk derece mahkemesi olarak Danıştayda görülmesi", puan: 20, madde: "2575 sayılı Kanun m. 24"}
    cozum: |
      **Nitelendirme:** Olay, kamu hizmeti yürütülme usullerinden imtiyazı, kamu hizmetine hâkim ilkelerden süreklilik ve değişkenliği, AY m. 128/1'in devredilemez çekirdeğini ve imtiyaz uyuşmazlıklarında yargı yolunu birlikte sorgulamaktadır.

      **Hukuki sorunlar:** (1) İmtiyaz devri usulüne uygun mu? (2) Zarar eden imtiyaz sahibi hizmeti durdurabilir mi? (3) Tek yanlı değişiklik ve kazanılmış hak iddiası. (4) İtfaiye devri ve uyuşmazlığın çözüm yeri.

      **İlgili hükümler:** 5393 sayılı Kanun m. 15 (Danıştay görüşü, bakanlık kararı, 49 yıl), AY m. 155/2 (Danıştay iki ay içinde düşünce bildirir), AY m. 10 (eşitlik), AY m. 128/1 (asli ve sürekli görevler), 5393 sayılı Kanun m. 14 (itfaiye bakımından "yaptırır"ın iptali), AY m. 125/1, İYUK m. 2/1-c ve 2575 sayılı Kanun m. 24.

      **Değerlendirme:** (1) Toplu taşıma hizmeti, Belediye Kanunu'nda imtiyazla devredilebilecek hizmetler arasındadır. Danıştay görüşü ve bakanlık kararı alınmış, süre de 49 yılı aşmadığından (30 yıl) devir usul ve süre bakımından uygundur. (2) Süreklilik ilkesi gereği imtiyaz sahibi, sözleşme dengesi öngörülemeyen olaylarla bozulmuş olsa bile hizmeti kendiliğinden durduramaz. İşletme riski şirkete aittir, ama beklenmeyen hâl kuramı çerçevesinde dengenin yeniden kurulması için idareden destek isteyebilir; hizmeti sürdürmek zorundadır. (3) Değişkenlik ilkesi gereği idare, hizmetin standartlarını tek yanlı değiştirebilir; Metro A.Ş. kazanılmış hak ileri sürerek kamera talimatını reddedemez. Mali dengeyi bozan bir yükümlülük varsa telafi talep edebilir. Aynı ilke gereği Ayşe de tarifenin değişmemesi yönünde kazanılmış hak ileri süremez; zammın hukuka uygunluğu ayrıca denetlenebilir, ama bu iddia tek başına yeterli değildir. (4) İtfaiye, genel idare esaslarına göre yürütülen asli ve sürekli görevdir; AY m. 128/1 gereği memurlar ve kamu görevlileri eliyle görülür. Anayasa Mahkemesi bu nedenle belediyenin itfaiye hizmetini yaptırabilmesini iptal etmiştir; devir hukuka aykırıdır. İmtiyaz sözleşmesinden doğan uyuşmazlıkta tahkim yolu öngörülmediğinden dava ilk derece mahkemesi olarak Danıştayda açılır.

      **Sonuç:** İmtiyaz devri usulüne uygundur; Metro A.Ş. hizmeti kendiliğinden durduramaz, kamera talimatını reddedemez; Ayşe'nin kazanılmış hak iddiası tek başına tutmaz; itfaiye devri AY m. 128/1'e aykırıdır; imtiyaz uyuşmazlığının çözüm yeri Danıştaydır.
  - olay: |
      Ankara Belediyesi, temizlik ve park-bahçe bakım hizmetlerini ihaleyle özel bir şirkete gördürmüştür. Ayrıca bir kamu iktisadi teşebbüsünün işletmesi, özelleştirme programına alınarak işletme hakkının verilmesi yoluyla özel bir şirkete devredilmiştir. Öte yandan Devlet, kamu hizmeti niteliğindeki özel bir elektrik dağıtım şirketini kamu yararı gerekçesiyle devletleştirmek ve bir otoyol projesini 3996 sayılı Kanun kapsamında yap-işlet-devret modeliyle bir sermaye şirketine yaptırmak istemektedir. Şirket, sözleşme sonunda tesisin bedelsiz geri verilmesine itiraz edecektir. Öğrenci Mehmet, devletleştirme ile kamulaştırmanın aynı şey olduğunu iddia etmektedir.

      1. Belediyenin temizlik ve park-bahçe ihalesi ile KİT işletmesinin işletme hakkı devri hangi hukuki çerçevede değerlendirilir?
      2. Elektrik şirketinin devletleştirilmesi için hangi şartlar aranır ve Mehmet'in iddiası doğru mudur?
      3. YİD sözleşmesinin hukuki niteliği nedir ve sözleşme sonunda tesis kime geçer?
    olcut:
      - {tespit: "Temizlik ve park-bahçe hizmetinin hizmet alımı olarak ihale ile gördürülebilmesi", puan: 20, madde: "5393 sayılı Kanun m. 67"}
      - {tespit: "İşletme hakkının verilmesinin özelleştirme yöntemi olması ve kanunla belirlenen esaslara tabi olması", puan: 20, madde: "4046 sayılı Kanun m. 18"}
      - {tespit: "Devletleştirmenin şartları: kamu yararı, kamu hizmeti niteliğindeki özel teşebbüs, gerçek karşılık", puan: 20, madde: "AY m. 47"}
      - {tespit: "Devletleştirme ile kamulaştırmanın farkı", puan: 20, madde: "AY m. 46"}
      - {tespit: "YİD sözleşmesinin özel hukuk niteliği ve sözleşme sonunda tesisin bedelsiz idareye geçmesi", puan: 20, madde: "3996 sayılı Kanun m. 5"}
    cozum: |
      **Nitelendirme:** Olayda hizmet alımı, özelleştirme, devletleştirme, kamulaştırma ile ayrım ve yap-işlet-devret modeli birlikte tartışılmaktadır.

      **Hukuki sorunlar:** (1) Destek hizmetlerinin ihaleyle gördürülmesi ve KİT işletmesinin devri. (2) Devletleştirmenin şartları ve kamulaştırmadan farkı. (3) YİD sözleşmesinin niteliği ve devir.

      **İlgili hükümler:** 5393 sayılı Kanun m. 67 (destek hizmetlerinin ihale yoluyla gördürülmesi), AY m. 47 (devletleştirme, özelleştirme, özel hukuk sözleşmeleri), 4046 sayılı Kanun m. 18 (özelleştirme yöntemleri), 3082 sayılı Kanun m. 1, AY m. 46 (kamulaştırma), 3996 sayılı Kanun m. 5 ve m. 9.

      **Değerlendirme:** (1) Temizlik ve park-bahçe bakımı, 5393 sayılı Kanun m. 67'de sayılan destek hizmetlerindendir; belirtilen süre sınırı içinde ihale yoluyla üçüncü kişilere gördürülebilir. Bu bir görev devri değil hizmet alımıdır ve AY m. 128/1'in korunan çekirdeğine girmez. KİT işletmesinin işletme hakkının verilmesi yoluyla devri ise özelleştirmedir; AY m. 47/3'e göre esas ve usuller kanunla gösterilir ve işletme hakkının verilmesi 4046 sayılı Kanun m. 18'deki yöntemlerden biridir. (2) AY m. 47/1-2'ye göre devletleştirme için konunun kamu hizmeti niteliği taşıyan bir özel teşebbüs olması, kamu yararının zorunlu kılması ve bedelin gerçek karşılığı üzerinden ödenmesi gerekir; usuller kanunla düzenlenir (3082 sayılı Kanun m. 1). Mehmet'in iddiası yanlıştır: kamulaştırma (AY m. 46) Devlet ve kamu tüzelkişilerinin özel mülkiyetteki taşınmaz malları almasıdır; devletleştirmede ise konu, kamu hizmeti niteliğindeki özel teşebbüstür. (3) 3996 sayılı Kanun kapsamındaki YİD sözleşmesi özel hukuk hükümlerine tabidir (3996 sayılı Kanun m. 5; zemin AY m. 47/4). Şirketin itirazı yerinde değildir: yatırım ve hizmetler sözleşme sona erince borç ve taahhütlerden arî, bakımlı, çalışır ve kullanılabilir durumda bedelsiz olarak kendiliğinden idareye geçer (3996 sayılı Kanun m. 9).

      **Sonuç:** İhale hizmet alımıdır ve hukuka uygundur; işletme hakkı devri özelleştirmedir; devletleştirme ve kamulaştırma farklı kurumlardır; YİD sözleşmesi özel hukuk sözleşmesidir ve tesis süre sonunda bedelsiz idareye geçer.
kartlar:
  - on: "Kamu hizmetinin iki unsuru nedir?"
    arka: "Maddi (amaçsal) unsur: ortak ihtiyaç ve kamu yararı. Organik (şekli) unsur: kamu tüzelkişisinin faaliyeti üstlenmesi."
  - on: "Rolland yasaları hangi ilkelerdir?"
    arka: "Süreklilik ve düzenlilik, değişkenlik (uyarlama), eşitlik ve tarafsızlık (AY m. 10). Bedelsizlik mutlak bir ilke sayılmaz."
  - on: "Bedelsizlik ilkesi nerede geçerlidir?"
    arka: "Kanunun açıkça parasız saydığı hizmetlerde; örneğin devlet okullarında ilköğretim (AY m. 42/5). İktisadi ve ticari hizmetlerde tarife üzerinden ücret alınır."
  - on: "Süreklilik ilkesinin üç örnek sonucu?"
    arka: "Memur toplu eylem yasağı (DMK m. 26), çekilen memurun çekilmesi kabul edilinceye veya yerine atanan gelinceye kadar, en çok bir ay görev yapması (DMK m. 94), beklenmeyen hâl kuramı; ayrıca hizmette kullanılan belediye mallarının haczedilememesi (5393 sayılı Kanun m. 15)."
  - on: "Değişkenlik ilkesinin sonucu nedir?"
    arka: "İdare hizmeti tek yanlı değiştirebilir; yararlanan ve imtiyaz sahibi kazanılmış hak ileri süremez. Mali denge bozulursa idare telafi eder."
  - on: "Emanet ile imtiyazı risk bakımından karşılaştır."
    arka: "Emanette sermaye ve risk idaredir; imtiyazda tesis, kâr ve zarar imtiyaz sahibindedir ve gelir kullanıcıdan alınır."
  - on: "İmtiyaz sözleşmesi için Danıştayın rolü?"
    arka: "İmtiyaz şartlaşma ve sözleşmeleri hakkında iki ay içinde düşünce bildirir (AY m. 155/2)."
  - on: "Belediyede imtiyaz süresi ve hizmetleri?"
    arka: "Su, toplu taşıma ve katı atık hizmetleri; Danıştay görüşü ve bakanlık kararıyla en çok 49 yıl (5393 sayılı Kanun m. 15)."
  - on: "Tahkimi olmayan imtiyaz uyuşmazlığı nerede görülür?"
    arka: "İlk derece mahkemesi olarak Danıştayda (2575 sayılı Kanun m. 24). Milletlerarası tahkim yalnız yabancılık unsurlu uyuşmazlıkta olur (AY m. 125/1)."
  - on: "YİD sözleşmesinin niteliği ve sonu?"
    arka: "Özel hukuk sözleşmesidir (3996 sayılı Kanun m. 5). Süre sonunda tesis bedelsiz, çalışır durumda kendiliğinden idareye geçer (3996 sayılı Kanun m. 9)."
  - on: "Devletleştirme ile kamulaştırma farkı?"
    arka: "Devletleştirme (AY m. 47/1-2): kamu hizmeti niteliğindeki özel teşebbüs, gerçek karşılık. Kamulaştırma (AY m. 46): özel mülkiyetteki taşınmaz mallar."
  - on: "AY m. 128/1 neyi söyler, belediye itfaiyesiyle ilişkisi nedir?"
    arka: "Asli ve sürekli görevler memurlar ve kamu görevlilerince görülür. AYM, 5393 sayılı Kanun m. 14'teki 'yaptırır' ibaresini itfaiye yönünden iptal etmiştir."
