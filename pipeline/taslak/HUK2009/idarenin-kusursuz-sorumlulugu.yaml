    tanim: "Hukuka uygun kamu faaliyetinin bir kişiye özel ve olağandışı külfet yüklemesi hâlinde zararın tazmini; kamu külfetleri karşısında eşitlik."
  - terim: Genel külfet
    tanim: "Kamu hizmetinin doğal sonucu olarak herkesin katlanması gereken, tazmin edilmeyen yük."
  - terim: Sosyal risk
    tanim: "Üçüncü kişinin (terör) eyleminden doğan, idarenin kusurunun bulunmadığı zararların toplumca dayanışmayla karşılanması; illiyet aranmaz."
  - terim: Zarar tespit komisyonu
    tanim: "5233 sayılı Kanun kapsamında her ilde başvuru üzerine on gün içinde kurulan, vali yardımcısı başkanlığındaki komisyon."
  - terim: Sulhname
    tanim: "Komisyonun hazırladığı, hak sahibiyle imzalanan ve zararı sulh yoluyla karşılayan belge (5233 sayılı Kanun m. 12)."
  - terim: Ayni ifa
    tanim: "Zararın para yerine malın/konutun yeniden yapılması veya onarılması gibi ayni olarak karşılanması."
kararlar:
  - id: "1149543400"
    ozet: |
      Davacı şirketin taşınmazı ve üzerindeki akaryakıt istasyonu, Karayolları'nın devlet yolunu genişletme çalışması sonucunda yol seviyesinin altında kaldı; bilirkişi yaklaşık dört-beş metrelik kot farkı ve yaklaşık yüzde on değer kaybı tespit etti. İdare mahkemesi, önlem almayan idarenin hizmet kusuru bulunduğuna karar verdi. Danıştay 10. Daire kararı bozdu: zarar yoldaki tüm işyerleri için geçerli genel külfettir, davacı yeni yoldan da yararlanır. İlk derece ısrar edince İdari Dava Daireleri Kurulu ısrar kararını, gerekçeyi değiştirerek ve oyçokluğuyla onadı. Kurul'a göre yol yapımında hizmet kusuru yoktur; ama kamu yararına yapılan çalışmanın kot farkı doğurması nedeniyle taşınmazı değer kaybeden kişi diğerlerine göre özel ve olağandışı zarara uğramıştır ve zarar, fedakârlığın denkleştirilmesi ilkesine göre kusursuz sorumluluk kapsamında tazmin edilir. Karar, risk sorumluluğundan farkı da açıklar: zarar kazadan doğmaz, önceden öngörülebilir ve faaliyetin doğal sonucudur.
  - id: "1178874500"
    ozet: |
      Kara Kuvvetlerinde piyade üsteğmen olan davacı, Irak'ta teröristlerin sızma girişimi sonucu çıkan çatışmada ağır yaralandı; sağlık kurulu yüzde 58 engel ve TSK'da görev yapamayacağı kararını verdi. Kendisi, annesi, babası ve kardeşi manevi tazminat istedi. İdare mahkemesi, davacının mesleğin risklerini girerken kabul ettiğini ve idareye sorumluluk yüklemenin hakkaniyete aykırı olduğunu söyleyerek davayı reddetti; bölge idare mahkemesi istinafı reddetti. Danıştay 10. Daire kararı oybirliğiyle bozdu: hizmet kusuru yoktur ama çatışmada yaralanma hizmetin bünyesindeki riskin gerçekleşmesidir ve zarar mesleki risk ilkesine göre karşılanır. Yaşam hakkı vazgeçilmez olduğundan riskli göreve talip olmak zarara razı olmak anlamına gelmez. Karar ayrıca kusursuz sorumluluğun hizmet kusuruna göre ikincil olduğunu, hakimin önce hizmet kusurunu araştırıp sorumluluk sebebini kararda açıkça göstermesi gerektiğini yineler.
  - id: "1193212400"
    ozet: |
      Şırnak İdil'de 9 yaşındaki bir çocuk, annesiyle giderken bir cismin (iddiaya göre polis aracından atılan biber gazı fişeğinin) sol gözüne isabet etmesiyle yaralandı. Aile hizmet kusuruna dayanarak maddi ve manevi tazminat istedi. İlk derece mahkemesi davayı hizmet kusuruyla kısmen kabul etti; bölge idare mahkemesi zararın idareye yüklenebilir bir eylemden doğduğunun kanıtlanamadığını söyleyerek davayı reddetti. Danıştay 10. Daire, hizmet kusuru ve kusursuz sorumluluk için illiyet bulunmadığını, ama olayın terör olayı niteliğinde olduğunu belirterek bozdu; bölge idare mahkemesi direndi. İdari Dava Daireleri Kurulu ısrar kararını oyçokluğuyla bozdu. Çoğunluğa göre idarenin eylemiyle bağlantısı her türlü şüpheden uzak delillerle kanıtlanamayan zarar için hizmet kusuru da kusursuz sorumluluk da kurulamaz. Ancak olay terör olayıysa ve idarenin kusuru ya da kusursuz sorumluluğu yoksa maddi zarar, sosyal risk ilkesinin kanunlaşmış hâli olan 5233 sayılı Kanun kapsamında, manevi zarar ise sosyal risk ilkesi gereğince genel hükümlere göre tazmin edilir. Karşı oylar farklı yöndedir.
sorular:
  - soru: |
      Kusursuz sorumlulukla ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Zarar herkesin katlandığı genel külfet olsa bile idare tazminle yükümlüdür"
      - "İdarenin kusuru aranmaz, ancak zararın özel ve olağandışı olması gerekir"
      - "Kusursuz sorumluluk, hizmet kusurundan önce incelenir"
      - "Kusursuz sorumlulukta hiçbir hâlde illiyet bağı aranmaz"
    dogru: 1
    aciklama: |
      Kusursuz sorumlulukta idarenin kusuru aranmaz; zararın özel ve olağandışı olması gerekir. Genel külfet tazmin edilmez. Kusursuz sorumluluk hizmet kusuruna göre ikincildir, yani önce hizmet kusuru araştırılır. İlliyet risk ve fedakârlıkta şarttır; yalnız sosyal riskte aranmaz.
  - soru: |
      Askerî atış alanında yapılan atış sırasında bir mermi sekip köydeki Ali'nin evinin çatısına düşmüş ve çatıyı delmiştir. Ordunun atış planında teknik hata bulunmamıştır. İdarenin sorumluluğu hangi ilkeye dayanır?
    siklar:
      - "Fedakârlığın denkleştirilmesi"
      - "Sosyal risk"
      - "Hizmet kusuru"
      - "Risk ilkesi (tehlikeli faaliyet)"
    dogru: 3
    aciklama: |
      Atış faaliyeti tehlikeli bir faaliyettir ve mermi sekmesi arızi, kaza niteliğinde bir zarardır. Teknik hata bulunmadığı için hizmet kusuru yoktur; sorumluluk risk ilkesine dayanır. Fedakârlıkta zarar öngörülebilir ve doğal sonuçtur; sosyal riskte zarar üçüncü kişinin eyleminden doğar.
  - soru: |
      Uzman çavuş Mehmet, sınır karakolunda nöbetteyken teröristlerin saldırısında yaralanmış ve yüzde 40 engelli kalmıştır. Komutanlığın önlemlerinde eksiklik bulunmamıştır. İdare, "Mehmet mesleğin riskini kendisi kabul etti" diyerek tazminat başvurusunu reddetmiştir. Hangisi doğrudur?
    siklar:
      - "İdarenin savunması geçerlidir, çünkü hizmet kusuru yoktur"
      - "Sorumluluk ancak sosyal riske dayanabilir ve yalnız 5233 sayılı Kanun uygulanır"
      - "Savunma geçersizdir; zarar mesleki risk ilkesine göre karşılanır"
      - "Mehmet yalnız görevliye karşı adli yargıda dava açabilir"
    dogru: 2
    aciklama: |
      Görevde yaralanma hizmetin bünyesindeki riskin gerçekleşmesidir; hizmet kusuru olmasa da mesleki risk ilkesine göre tazmin edilir. Yaşam hakkı vazgeçilmez olduğundan riskli göreve talip olmak zarara razı olmak sayılmaz. İdarenin kusursuz olması sorumluluğu ortadan kaldırmaz.
  - soru: |
      Karayolları, devlet yolunu projesine uygun biçimde yükseltip genişletmiştir. Teknik hata yoktur. X Petrol Ltd. Şti.'nin yol kenarındaki istasyonu yolun dört metre altında kalmış, bilirkişi yüzde on değer kaybı tespit etmiştir. Yol genişletilirken komşu parsellerde böyle bir zarar doğmamış, yalnız bu istasyon etkilenmiştir. Sorumluluk sebebi nedir?
    siklar:
      - "Mesleki risk"
      - "Fedakârlığın denkleştirilmesi (kamu külfetleri karşısında eşitlik)"
      - "Hizmet kusuru (hizmetin kötü işlemesi)"
      - "Sosyal risk"
    dogru: 1
    aciklama: |
      Hizmet kusuru yoktur. Zarar hukuka uygun kamu faaliyetinin öngörülebilir, doğal sonucudur ve yalnız bir işletmeye özgü olduğu için özel ve olağandışıdır. Bu durumda fedakârlığın denkleştirilmesi ilkesi uygulanır. Mülkiyet malikte kalır; kamulaştırma yapılmamıştır.
  - soru: |
      Risk ilkesi ile fedakârlığın denkleştirilmesi arasındaki temel fark aşağıdakilerden hangisidir?
    siklar:
      - "Risk ilkesinde illiyet aranmaz, fedakârlıkta aranır"
      - "Risk ilkesinde zarar arızi ve kaza niteliğindedir; fedakârlıkta zarar öngörülebilir ve faaliyetin doğal sonucudur"
      - "Risk ilkesinde idarenin kusuru aranır, fedakârlıkta aranmaz"
      - "Risk ilkesi yalnız terör zararlarında, fedakârlık yalnız imar işlerinde uygulanır"
    dogru: 1
    aciklama: |
      Risk ilkesinde zarar kaza niteliğindeki arızi zarardır; fedakârlıkta ise faaliyetin önceden öngörülebilir, doğal sonucudur. İkisinde de illiyet aranır ve ikisinde de kusur aranmaz.
  - soru: |
      Bir ilçede teröristlerin attığı bomba sonucu Ayşe'nin dükkânı yanmıştır. İdareye ulaşmış somut bir istihbarat yoktur. Ayşe olayı olay günü öğrenmiştir. Ayşe'nin 5233 sayılı Kanuna göre başvuru süresi ve yeri hangisidir?
    siklar:
      - "Öğrenmeden itibaren bir yıl, her halde olaydan itibaren beş yıl; ilgili idareye"
      - "Öğrenmeden itibaren altmış gün, her halde olaydan itibaren bir yıl; zararın gerçekleştiği veya olayın meydana geldiği il valiliğine"
      - "Olaydan itibaren otuz gün; Cumhurbaşkanlığına"
      - "Süre sınırı yoktur; herhangi bir kaymakamlığa"
    dogru: 1
    aciklama: |
      5233 sayılı Kanun m. 6'ya göre zarar gören, olayın öğrenilmesinden itibaren altmış gün içinde ve her halde olayın meydana gelmesinden itibaren bir yıl içinde zararın gerçekleştiği veya olayın meydana geldiği il valiliğine başvurur. Bir yıl/beş yıl İYUK m. 13/1'in süresidir; karıştırılmamalıdır.
  - soru: |
      Köylü Hasan, terör olaylarından bağımsız, daha iyi iş bulmak istediği için güvenlik kaygısı olmaksızın kendi isteğiyle köyünü terk etmiş ve bu nedenle malvarlığında zarar doğmuştur. Hasan'ın bu zararı 5233 sayılı Kanun bakımından nasıl değerlendirilir?
    siklar:
      - "Kapsam dışıdır; güvenlik kaygısı dışında kendi isteğiyle yerini terk edenlerin bu sebeple uğradığı zararlar kapsam dışındadır"
      - "Kapsam içindedir; her yer terk zararı karşılanır"
      - "Kapsam içindedir ancak yalnız manevi zarar karşılanır"
      - "Kapsam içindedir ancak ödeme yapılması için dava açılması şarttır"
    dogru: 0
    aciklama: |
      5233 sayılı Kanun m. 2/2-d uyarınca terör dışındaki ekonomik ve sosyal sebeplerle uğranılan zararlar ve güvenlik kaygıları dışında kendi istekleriyle bulundukları yerleri terk edenlerin bu sebeple uğradıkları zararlar kapsam dışındadır. Kanun ayrıca yalnız maddi zararı kapsar.
  - soru: |
      5233 sayılı Kanunun kapsamıyla ilgili hangisi doğrudur?
    siklar:
      - "Hem maddi hem manevi zararı kapsar"
      - "Yalnız tüzel kişilerin zararlarını kapsar"
      - "Yalnız maddi zararı kapsar; kapsama gerçek kişiler ile özel hukuk tüzel kişileri girer"
      - "Kişinin kendi kasıtlarıyla oluşan zararları da karşılar"
    dogru: 2
    aciklama: |
      Kanun terör ve terörle mücadeleden doğan maddî zararların sulhen karşılanmasını düzenler (5233 sayılı Kanun m. 1 ve 5233 sayılı Kanun m. 2). Kapsamında gerçek kişiler ile özel hukuk tüzel kişileri vardır. Kişilerin kendi kasıtlarıyla oluşan zararları kapsam dışıdır.
  - soru: |
      5233 sayılı Kanuna göre terör olayında ölen kişinin mirasçılarına yapılacak nakdî ödeme nasıl belirlenir?
    siklar:
      - "(7000) gösterge rakamının memur aylık katsayısıyla çarpımının elli katı tutarında"
      - "(7000) gösterge rakamının memur aylık katsayısıyla çarpımının altı katı tutarında"
      - "Her olayda gerçek zarar kadar, sınırsız"
      - "Asgari ücretin on katı tutarında"
    dogru: 0
    aciklama: |
      5233 sayılı Kanun m. 9'a göre ölenlerin mirasçılarına (7000) gösterge rakamının memur aylık katsayısı ile çarpımı sonucunda bulunan miktarın elli katı tutarında nakdî ödeme yapılır. Altı kat, yaralananlar için üst sınırdır.
  - soru: |
      5233 sayılı Kanun kapsamında komisyon, hak sahibine sulhname tasarısını tebliğ etmiştir. Hak sahibi otuz gün içinde gelmemiş ve temsilci de göndermemiştir. Sonuç nedir?
    siklar:
      - "Tasarı kabul edilmiş sayılır ve zarar ödenir"
      - "Hak sahibi tasarıyı kabul etmemiş sayılır; uyuşmazlık tutanağı düzenlenir ve yargı yolu saklıdır"
      - "Başvuru düşer ve bir daha başvurulamaz"
      - "Komisyon hak sahibinin yerine tasarıyı imzalar"
    dogru: 1
    aciklama: |
      Davet yazısında belirtildiği gibi hak sahibi otuz gün içinde gelmezse tasarıyı kabul etmemiş sayılır. Bu durumda uyuşmazlık tutanağı düzenlenir ve sulh yoluyla çözülemeyen uyuşmazlıklarda yargı yoluna başvurma hakları saklıdır (5233 sayılı Kanun m. 12).
  - soru: |
      Zeynep, terör zararı için dava açma süresi içinde 5233 sayılı Kanun kapsamında valiliğe başvurmuştur. Başvurunun dava açma süresi bakımından etkisi nedir?
    siklar:
      - "Dava açma süresi başvuru tarihinde sona erer"
      - "Başvuru dava hakkını ortadan kaldırır"
      - "Etkisi yoktur; süre işlemeye devam eder"
      - "Nihai işlem sonucunun ilgiliye tebliğine kadar dava açma sürelerini durdurur"
    dogru: 3
    aciklama: |
      5233 sayılı Kanun m. 6'nın son fıkrasına göre dava açma süresi içinde yapılan başvuru, nihai işlem sonucunun ilgiliye tebliğine kadar genel hükümlere göre dava açma sürelerini durdurur.
  - soru: |
      İdarenin kusursuz sorumluluğu ile hizmet kusuru arasındaki ilişki aşağıdakilerden hangisidir?
    siklar:
      - "Kusursuz sorumluluk asli, hizmet kusuru ikincildir"
      - "Önce hizmet kusuru araştırılır; yoksa kusursuz sorumluluğa geçilir ve sorumluluk sebebi kararda açıkça yazılır"
      - "Hakim iki sorumluluktan birini serbestçe seçer"
      - "Hizmet kusuru bulunsa bile kusursuz sorumluluk ayrıca uygulanır"
    dogru: 1
    aciklama: |
      Danıştay'ın yerleşik içtihadına göre hizmet kusuru asli, kusursuz sorumluluk ikincil sorumluluktur. Hakim önce hizmet kusurunu araştırır; yoksa kusursuz sorumluluğa geçer ve sorumluluk sebebini açıkça belirtir.
olaylar:
  - olay: |
      Karayolları Genel Müdürlüğü, devlet yolunu projesine uygun biçimde yükseltip genişletmiştir. Çalışmada teknik hata veya usul eksikliği yoktur. Yolun kenarındaki X Petrol Ltd. Şti.'ne ait akaryakıt istasyonu, yolun yaklaşık dört metre altında kalmış ve yolla bağlantısı zayıflamıştır. Yol çalışması sırasında komşu parsellerde böyle bir kot farkı oluşmamış, yalnız bu istasyon etkilenmiştir. Mahkemece görevlendirilen bilirkişi, istasyonun değerinde yaklaşık yüzde on azalma olduğunu tespit etmiştir. Şirket durumu 1 Mart 2025'te öğrenmiştir. İstasyon mülkiyeti şirkette kalmaya devam etmektedir. İdare, "projeye uygun yol yaptık, kusurumuz yok" diyerek sorumluluğu kabul etmemektedir.

      1. İdarenin sorumluluğu hangi sebebe dayanır? Hizmet kusuru var mıdır?
      2. Şirket hangi davayı açmalıdır?
      3. Dava açmadan önce yapılması gereken işlem ve süreler nelerdir?
      4. İdare cevap vermezse ne olur?
    olcut:
      - {tespit: "Önce hizmet kusuru araştırılır; teknik hata olmadığı için hizmet kusuru yoktur, kusursuz sorumluluğa geçilir (ikincil sorumluluk)", puan: 20, madde: "AY m. 125"}
      - {tespit: "Sorumluluk sebebi fedakârlığın denkleştirilmesidir: zarar hukuka uygun faaliyetin öngörülebilir, doğal sonucudur ve yalnız bu istasyona özgü, özel ve olağandışıdır", puan: 30, madde: "AY m. 125"}
      - {tespit: "Zararın giderilmesi için tam yargı davası açılır", puan: 15, madde: "İYUK m. 2"}
      - {tespit: "Zarar idari eylemden doğduğu için önce idareye başvuru şarttır: öğrenmeden itibaren 1 yıl, her halde eylemden itibaren 5 yıl", puan: 20, madde: "İYUK m. 13"}
      - {tespit: "Başvuruya 30 gün içinde cevap verilmezse bu sürenin bittiği tarihten itibaren dava süresi içinde dava açılır", puan: 15, madde: "İYUK m. 13"}
    cozum: |
      **Nitelendirme:** Olay, idarenin hukuka uygun ve kamu yararına yaptığı bir yol çalışmasının, tek bir işletmeye zarar vermesine ilişkindir. Zarar bir idari eylemden (fiili yol çalışması) doğmuştur.

      **Hukuki sorunlar:** (1) Hizmet kusuru var mı, yoksa hangi kusursuz sorumluluk ilkesi uygulanır? (2) Hangi dava açılır? (3) Dava öncesi şart ve süreler nelerdir?

      **İlgili hükümler:** AY m. 125'in son fıkrasına göre idare, kendi eylem ve işlemlerinden doğan zararı ödemekle yükümlüdür. Tam yargı davası İYUK m. 2/1-b'ye dayanır. İdari eylemden zarar görenler için İYUK m. 13/1, öğrenmeden itibaren bir yıl ve her halde eylemden itibaren beş yıl içinde idareye başvuruyu şart koşar; otuz gün içinde cevap verilmezse bu sürenin bittiği tarihten itibaren dava süresi içinde dava açılabilir.

      **Değerlendirme:** Kusursuz sorumluluk ikincil bir sorumluluktur, o yüzden önce hizmet kusuru araştırılır. Olayda yol projesine uygun yapılmış, teknik hata yoktur; hizmetin kuruluşunda, düzenlenişinde veya işleyişinde nesnel bir aksaklık bulunmamaktadır. Hizmet kusuru olmadığına göre kusursuz sorumluluk ilkeleri incelenir. Zarar bir tehlikeli faaliyetin kazası değildir; yol yükseltme faaliyetinin önceden öngörülebilir, doğal sonucudur. Bu yüzden risk ilkesi değil, fedakârlığın denkleştirilmesi (kamu külfetleri karşısında eşitlik) uygulanır. Zarar yalnız bu istasyona özgü olduğundan genel külfetten farklı, özel ve olağandışıdır. Mülkiyet şirkette kaldığı için kamulaştırma da söz konusu değildir; yalnız değer kaybı tazmin edilir. İdarenin "kusurumuz yok" savunması kusursuz sorumlulukta sonucu değiştirmez, çünkü kusur aranmaz.

      Usul bakımından zarar eylemden doğduğu için şirket doğrudan dava açamaz. Durumu 1 Mart 2025'te öğrendiğine göre bir yıl içinde (ve her halde eylem tarihinden itibaren beş yılı aşmadan) Karayollarına başvurarak değer kaybının giderilmesini istemelidir. İdare isteği reddederse red işleminin tebliğini izleyen günden itibaren; otuz gün içinde cevap vermezse bu sürenin bittiği tarihten itibaren dava süresi içinde tam yargı davası açılır. Zımni ret süresi 2021'de altmıştan otuza indirilmiştir.

      **Sonuç:** Hizmet kusuru yoktur; sorumluluk fedakârlığın denkleştirilmesine dayanan kusursuz sorumluluktur. Şirket önce idareye başvurur, ret veya otuz günlük cevapsızlık üzerine tam yargı davası açar ve değer kaybının (yaklaşık yüzde on) tazminini ister.
  - olay: |
      Bir ilçede bir terör örgütü mensuplarının attığı bomba sonucu Ayşe'nin işlettiği dükkân yanmıştır. Dükkânın içindeki mallar ve dükkânın kendisi zarar görmüştür. Ayşe hiçbir yaralanmaya uğramamıştır. İdareye ulaşmış, saldırının yeri, zamanı veya failleri hakkında somut bir istihbarat bulunmamaktadır. Ayşe olayı olay günü öğrenmiştir. Ayşe, zararının nasıl karşılanacağını öğrenmek istemektedir.

      1. Ayşe'nin zararı hangi sorumluluk ilkesi ve hangi Kanun kapsamında değerlendirilir?
      2. Ayşe nereye, hangi süre içinde başvurmalıdır?
      3. Komisyon başvuruyu kaç ayda sonuçlandırır?
      4. Komisyonun hazırladığı sulhname tasarısını Ayşe kabul etmezse ne olur?
      5. Zarar nasıl, ne zaman karşılanır?
    olcut:
      - {tespit: "Hizmet kusuru ve kusursuz sorumluluk yoktur (somut istihbarat yok); terör olayı olduğundan sosyal risk ilkesi gereği maddi zarar 5233 kapsamında, gerçek kişinin maddi zararı olarak karşılanır", puan: 20, madde: "5233 sayılı Kanun m. 2"}
      - {tespit: "Başvuru, olayın öğrenilmesinden itibaren 60 gün ve her halde olaydan itibaren 1 yıl içinde, zararın gerçekleştiği veya olayın meydana geldiği il valiliğine yapılır; sonraki başvurular kabul edilmez", puan: 25, madde: "5233 sayılı Kanun m. 6"}
      - {tespit: "Komisyon, başvuru tarihinden itibaren 6 ay içinde çalışmasını tamamlar; zorunlu hâllerde vali 3 ay daha uzatabilir", puan: 10, madde: "5233 sayılı Kanun m. 6"}
      - {tespit: "Sulhname tasarısını Ayşe kabul etmez ya da 30 gün içinde gelmezse kabul etmemiş sayılır; uyuşmazlık tutanağı düzenlenir ve yargı yolu saklıdır", puan: 20, madde: "5233 sayılı Kanun m. 12"}
      - {tespit: "Taşınır/taşınmaz zararları ayni veya nakdî karşılanır, imkânlar ölçüsünde ayni ifaya öncelik verilir", puan: 10, madde: "5233 sayılı Kanun m. 10"}
      - {tespit: "Sulhname imzalandıktan sonra valinin onayıyla zarar üç ay içinde karşılanır; Devlet sorumlulara genel hükümlere göre rücu eder", puan: 15, madde: "5233 sayılı Kanun m. 13"}
    cozum: |
      **Nitelendirme:** Zarar, üçüncü kişilerin (terör örgütü mensuplarının) eyleminden doğmuştur. İdarenin eylem ve işlemiyle doğrudan illiyet bağı yoktur. Bu nedenle sosyal risk ve 5233 sayılı Kanun gündeme gelir.

      **Hukuki sorunlar:** (1) Hangi ilke ve Kanun uygulanır? (2) Başvuru yeri ve süresi nedir? (3) Komisyonun süresi ve sulhname süreci nasıl işler? (4) Zarar nasıl ve ne zaman karşılanır?

      **İlgili hükümler:** 5233 sayılı Kanun m. 1 ve m. 2'ye göre Kanun, terör eylemleri nedeniyle zarar gören gerçek kişiler ile özel hukuk tüzel kişilerinin maddi zararlarının sulhen karşılanmasını düzenler. 5233 sayılı Kanun m. 7 hayvanlara, ağaçlara, ürünlere ve diğer taşınır ve taşınmazlara verilen zararları sayar. 5233 sayılı Kanun m. 6 başvuru süresini, yerini ve komisyon süresini; 5233 sayılı Kanun m. 10 ayni ifaya önceliği; 5233 sayılı Kanun m. 12 sulhname sürecini; 5233 sayılı Kanun m. 13 ödemeyi düzenler.

      **Değerlendirme:** Önce hizmet kusuru araştırılır. İdareye ulaşmış somut bir istihbarat bulunmadığı için hizmet kusuru kurulamaz; kusursuz sorumluluk için de idari faaliyetle bağlantı yoktur. Bu hâlde terör olayında sosyal risk ilkesi devreye girer ve maddi zarar 5233 sayılı Kanun kapsamında karşılanır. Ayşe gerçek kişidir ve dükkânın ve malların zararı Kanunun karşıladığı zarar türlerindendir. Zarar kendi kasıtlarından doğmadığı için kapsam dışı da değildir. Ayşe olayı olay günü öğrendiğinden altmış günlük süre bu günden başlar; bir yıllık süre de olaydan itibaren işler. İkisinden önce dolan süre sonunda başvuru kabul edilmez. Başvuru olayın meydana geldiği il valiliğine yapılır. Komisyon on gün içinde kurulur; altı ay içinde çalışmasını bitirir, vali üç ay uzatabilir. Komisyon tespit yaparken Ayşe'nin kusuru varsa onu da gözetir. Komisyon sulhname tasarısını hazırlar ve tebliğ eder. Ayşe otuz gün içinde gelip imzalamazsa tasarıyı kabul etmemiş sayılır; uyuşmazlık tutanağı düzenlenir ve yargı yolu saklıdır. İmzalanırsa zarar, valinin onayından sonra üç ay içinde ayni veya nakdî karşılanır; imkânlar ölçüsünde ayni ifaya öncelik verilir. Bu aşamada davada maddi zararın 5233 hesabıyla mı, gerçek zarar üzerinden mi belirleneceği ayrı bir tartışma konusudur; olayın çözümü buna bağlanmaz.

      **Sonuç:** Ayşe, hizmet kusuru ve kusursuz sorumluluk bulunmayan terör olayında sosyal risk gereği 5233 sayılı Kanuna göre, olayın öğrenilmesinden itibaren altmış gün ve olaydan itibaren bir yıl içinde il valiliğine başvurur; sulhname imzalamazsa yargı yoluna başvurma hakkı saklı kalır. Dava açma süresi içinde yaptığı başvuru, nihai işlemin tebliğine kadar dava sürelerini durdurur.
kartlar:
  - on: "Kusursuz sorumlulukta idarenin kusuru aranır mı? Ne aranır?"
    arka: "Kusur aranmaz; zarar özel ve olağandışı olmalıdır. Genel külfet tazmin edilmez."
  - on: "Kusursuz sorumluluk ile hizmet kusuru ilişkisi?"
    arka: "Kusursuz sorumluluk ikincildir: önce hizmet kusuru araştırılır, yoksa kusursuz sorumluluğa geçilir; sorumluluk sebebi kararda açıkça yazılır."
  - on: "Risk ilkesi nedir?"
    arka: "Tehlikeli faaliyet veya araçlardan doğan arızi (kaza niteliğinde) zararın idarenin kusuru olmasa da tazmini."
  - on: "Mesleki risk nedir?"
    arka: "Risk ilkesinin iş kazası ve meslek hastalığı alanındaki görünümü. Örnek: görevde çatışmada yaralanan asker."
  - on: "Fedakârlığın denkleştirilmesi nedir? Başka adı?"
    arka: "Kamu külfetleri karşısında eşitlik. Hukuka uygun faaliyetin bir kişiye özel ve olağandışı zarar vermesi; zarar öngörülebilir, doğal sonuçtur."
  - on: "Risk ile fedakârlık farkı?"
    arka: "Risk: arızi, kaza niteliğinde zarar. Fedakârlık: öngörülebilir, faaliyetin doğal sonucu. İkisinde de illiyet aranır."
  - on: "Fedakârlık ile kamulaştırma farkı?"
    arka: "Kamulaştırmada mülkiyet bedelle idareye geçer; fedakârlıkta mülkiyet malikte kalır, yalnız değer kaybı/külfet tazmin edilir."
  - on: "Sosyal risk nedir? İlliyet aranır mı?"
    arka: "Üçüncü kişinin (terör) eyleminden doğan zararın toplumca karşılanması. İdareyle illiyet aranmaz; terör zararında 5233 sayılı Kanun uygulanır."
  - on: "5233 sayılı Kanun hangi zararı kapsar?"
    arka: "Yalnız maddi zararı; gerçek kişiler ile özel hukuk tüzel kişileri yararlanır. Kendi kasıtlarıyla oluşan zararlar kapsam dışıdır."
  - on: "5233 sayılı Kanuna göre başvuru süresi ve yeri?"
    arka: "Öğrenmeden 60 gün, her halde olaydan 1 yıl; zararın gerçekleştiği veya olayın meydana geldiği il valiliğine (5233 sayılı Kanun m. 6)."
  - on: "Sulhname tasarısı için süre ve sonuç?"
    arka: "Hak sahibi 30 gün içinde gelmezse tasarıyı kabul etmemiş sayılır; uyuşmazlık tutanağı düzenlenir, yargı yolu saklıdır (5233 sayılı Kanun m. 12)."
  - on: "İYUK m. 13/1 süreleri ve 5233 başvurusu farkı?"
    arka: "İYUK m. 13: ilgili idareye, öğrenmeden 1 yıl / eylemden 5 yıl, zımni ret 30 gün. 5233: valiliğe, öğrenmeden 60 gün / olaydan 1 yıl."
