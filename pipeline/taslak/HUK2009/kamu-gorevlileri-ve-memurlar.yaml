kararlar:
  - id: "4da0fbff-6eb1-4622-db30-30176cbc233e"
    ozet: |
      Başvurucu, 2016 açıktan atama kurasıyla bir devlet hastanesine eczacı olarak yerleştirilmişti. Ardından DMK m. 48/A'ya eklenen güvenlik soruşturması bendi uyarınca soruşturma yapıldı, sonuç olumsuz çıkınca atanmadı. İdare mahkemesi ve bölge idare mahkemesi, FETÖ/PDY üyeliğinden yargılama, tutuklama ve ByLock tespitine dayanarak davayı reddetti. AYM'ye göre atama, kura yerleştirmesinden ayrı ve yeni bir işlemdir; henüz atanmamış kişi atama anında DMK m. 48'deki şartları taşımalıdır. Bendin AYM'nin 24/7/2019 tarihli kararıyla iptal edilmesi sonucu değiştirmez. Sadakatten kuşku soyut kanaate değil somut ve maddi tespitlere dayanmalıdır; burada ceza davasındaki tutuklama ve ByLock tespiti bulunduğundan keyfîlik yoktur. Başvuru açıkça dayanaktan yoksun olduğu için kabul edilemez bulundu.
  - id: "e4c81e90-0a5e-511f-baba-30da2e635e47"
    ozet: |
      Batman'da bir lisede çalışan öğretmenler, üyesi oldukları sendikanın nöbet ücreti talebiyle aldığı karar üzerine 2015 yılının Nisan-Haziran döneminde 7 ilâ 11 gün nöbet tutmadı ve DMK m. 125/A-a uyarınca en hafif ceza olan uyarma cezası aldı. İdare mahkemeleri davaları reddetti. AYM Genel Kurulu, toplu eylemin sendika hakkının yardımcı bir aracı olduğunu, cezanın AY m. 51'e müdahale oluşturduğunu, ancak müdahalenin kanuni dayanağı (DMK m. 26 ve 125) bulunduğunu belirtti. Eylem nöbet düzenini işlevsiz bırakmış, idare uzun süre müsamaha göstermiş ve en hafif ceza verilmiştir; müdahale orantılıdır. Sendika hakkı ihlal edilmedi; karar üç karşı oyla oyçokluğuyla verildi. Karşı oya göre barışçıl ve ölçülü toplu eylem demokratik bir haktır.
