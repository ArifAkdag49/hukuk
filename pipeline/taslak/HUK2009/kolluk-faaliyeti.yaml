ozet: |
  - **Kolluk (idari zabıta):** idarenin **kamu düzenini** koruma, bozulmasını önleme ve bozulduğunda yeniden kurma faaliyetidir. Kamu düzeninin klasik üç maddi unsuru: **kamu güvenliği, kamu huzuru, genel sağlık**.
  - **İdari kolluk:** suç işlenmeden önce devreye giren **önleyici** faaliyettir (PVSK m. 2 A bendi). İdari makamların (vali, kaymakam vb.) emrindedir; uyuşmazlıklar **idari yargıda** görülür.
  - **Adli kolluk:** suç işlendikten sonra faili yakalama ve delil toplama gibi **soruşturma işlemleri**dir (PVSK m. 2 B bendi). **Cumhuriyet savcısının** emir ve talimatı altındadır (CMK m. 160, CMK m. 164); adli görev dışında üstlerinin emrindedir (CMK m. 164/3). Aynı personel iki sıfatı da taşır; ölçüt faaliyetin **amacıdır**.
  - **Genel kolluk:** polis, jandarma (İçişleri Bakanlığına bağlı, 2803 sayılı Kanun m. 4), Sahil Güvenlik (2692 sayılı Kanun m. 2) ve yardımcı silahlı kolluk olarak çarşı ve mahalle bekçileri (7245 sayılı Kanun m. 2). Vali, ilindeki genel ve özel bütün kolluk teşkilatının amiridir (5442 sayılı Kanun m. 11). **Özel kolluk:** örn. belediye zabıtası (5393 sayılı Kanun m. 51).
  - **Sınırlar (AY m. 13):** kanunilik, Anayasadaki özel sınırlama sebepleri, ölçülülük (elverişlilik, gereklilik, orantılılık), özüne dokunmama. Kolluk kendiliğinden temel hak sınırlayamaz.
  - **Durdurma (PVSK m. 4/A):** makul sebep gerekir; süreklilik ve keyfilik oluşturacak biçimde yapılamaz.
  - **Önleme araması (PVSK m. 9):** sulh ceza hâkimi kararı, gecikmesinde sakınca varsa **mülkî âmirin yazılı emri**; **konutta, yerleşim yerinde ve kamuya açık olmayan işyerlerinde yapılamaz.**
  - **Zor ve silah (PVSK m. 16):** direnişi kıracak ölçüde, kademeli.
  - **Emir:** kanuna aykırı emir bildirilir; amir yazılı yenilerse yerine getirilir, **konusu suç olan emir hiçbir hâlde** yerine getirilmez (PVSK m. 2, AY m. 137).
  - **Toplantı:** izin değil **bildirim** sistemi (AY m. 34; 2911 sayılı Kanun m. 10: en az 48 saat önce).
  - 📌 7245 sayılı Kanun (2020) ve Anayasa Mahkemesinin 2023 tarihli iptal kararı; 2024'te yeniden düzenleme.
anlatim: |
  ## 1. Kolluk faaliyeti nedir?

  **Kolluk (idari zabıta)**, idarenin **kamu düzenini** korumak, bozulmasını önlemek ve bozulduğunda yeniden kurmak için yaptığı düzenleyici, denetleyici ve zorlayıcı faaliyetlerdir. Kamu hizmeti topluma bir şey **sunar** (ulaşım, sağlık); kolluk ise bireylerin hak ve özgürlüklerini kamu düzeniyle bağdaştırmak için **sınırlar koyar** (yasaklar, izinler, zor kullanma). Bu yüzden kolluk, temel haklara en doğrudan dokunan idari faaliyettir ve Anayasanın koyduğu sınırlara en sıkı bağlı olandır.

  Polis bakımından görevin çerçevesini PVSK m. 1 çizer: polis asayişi, amme, şahıs, tasarruf emniyetini ve mesken masuniyetini korur; halkın ırz, can ve malını muhafaza eder, ammenin istirahatini temin eder.

  ## 2. Kamu düzeni

  Klasik öğretide kamu düzeninin üç maddi unsuru vardır:

  1. **Kamu güvenliği:** Kişilerin can ve mal güvenliğinin saldırı, kaza ve tehlikelere karşı korunması (örn. trafik güvenliği, yıkılacak bina).
  2. **Kamu huzuru (dirlik ve esenlik):** Günlük yaşamı bozan gürültü, kargaşa ve taşkınlıkların giderilmesi.
  3. **Genel sağlık:** Bulaşıcı hastalık, çevre kirliliği ve sağlıksız koşullara karşı korunma.

  Anayasa, bazı hakların sınırlama sebepleri arasında kamu düzenini, suç işlenmesinin önlenmesini, genel sağlığı ve genel ahlâkı sayar (örn. AY m. 20, AY m. 21, AY m. 34). **Genel ahlâkın** ve insan onurunun kamu düzeninin bir parçası olup olmadığı tartışmalıdır (doktrin bölümüne bak).

  ## 3. İdari kolluk ve adli kolluk

  Aynı polis veya jandarma personeli hem idari hem adli işlev görür. PVSK m. 2 bunu iki bentle ayırır: **A bendi**, kanuna ve kamu düzenine aykırı hareketlerin **işlenmeden önce** önünü almak; **B bendi**, **işlenmiş bir suç** hakkında CMK ve diğer kanunlarda yazılı görevleri yapmaktır.

  | Ölçüt | İdari kolluk | Adli kolluk |
  |---|---|---|
  | Amaç | Önleyici (suçtan önce) | Soruşturma, bastırıcı (suçtan sonra) |
  | Emir veren | İdari makamlar (vali, kaymakam) | Cumhuriyet savcısı |
  | Yargı yolu | İdari yargı | Adli yargı (ceza muhakemesi) |

  **Adli kolluk** Cumhuriyet savcısının emir ve talimatları doğrultusunda soruşturma işlemlerini yapar (CMK m. 160/2, CMK m. 164/2). Adli kolluk, adli görevlerin dışındaki hizmetlerde **üstlerinin emrindedir** (CMK m. 164/3). PVSK'nın ek 6. maddesi de polisin CMK'da yazılı soruşturma görevlerini yerine getireceğini belirtir. PVSK'nın ek 4. maddesi ise polisin, görev yeri ve branşı ne olursa olsun, bir suçla karşılaştığında suça el koymakla, suçu önlemekle ve delilleri tespit ve muhafaza etmekle yetkili olduğunu söyler.

  > ⚠️ **Sınavda dikkat:** Ayrımın ölçütü **kişi ya da kurum değil, faaliyetin amacıdır.** Aynı polis, devriyede kimlik sorarken idari kolluktur; savcının yakalama emrini uygularken adli kolluktur. Önleme araması sırasında bir suç delili (örn. ruhsatsız silah) ele geçince polis suç delillerini koruma altına alır ve CMK hükümlerine göre işlem yapar (PVSK m. 9); yani işlem o noktadan itibaren adli niteliğe bürünür.

  ## 4. Genel ve özel idari kolluk

  **Genel kolluk**, ülke çapında genel güvenliği sağlar: polis, jandarma, Sahil Güvenlik. Jandarma Genel Komutanlığı İçişleri Bakanlığına bağlıdır (2803 sayılı Kanun m. 4); Sahil Güvenlik Komutanlığı da silahlı bir genel kolluk kuvvetidir ve İçişleri Bakanlığına bağlıdır (2692 sayılı Kanun m. 2). **Çarşı ve mahalle bekçileri**, genel kolluk kuvvetlerine yardımcı silahlı kolluk olarak emniyet ve jandarma bünyesinde istihdam edilir (7245 sayılı Kanun m. 2).

  Genel idari kolluk makamları merkezde **Cumhurbaşkanı ve İçişleri Bakanı**, taşrada **vali ve kaymakamdır**. Vali, il sınırları içindeki genel ve özel bütün kolluk kuvvet ve teşkilatının amiridir ve suç işlenmesini önlemek, kamu düzenini korumak için gereken tedbirleri alır (5442 sayılı Kanun m. 11, A bendi).

  **Özel kolluk**, belirli bir alanda uzmanlaşmış kolluktur. Örnek olarak **belediye zabıtası**, beldede esenlik, huzur, sağlık ve düzenin sağlanmasıyla görevlidir (5393 sayılı Kanun m. 51). Belediye başkanı, belediye meclisi ve encümeni genel idari kolluk makamı değil, özel (mahalli) kolluk makamıdır.

  ## 5. Kolluk yetkisinin sınırları

  ### Anayasal çerçeve
  Temel hak ve hürriyetler, özlerine dokunulmaksızın yalnızca Anayasanın ilgili maddelerinde belirtilen sebeplere bağlı olarak ve ancak **kanunla** sınırlanabilir; sınırlamalar demokratik toplum düzeninin gereklerine ve **ölçülülük ilkesine** aykırı olamaz (AY m. 13). Bundan şu denetim şeması çıkar:

  1. Müdahalenin **kanuni dayanağı** var mı? (Genel "kamu düzenini koruma" görevi tek başına yetmez.)
  2. Anayasadaki ilgili hakkın **sınırlama sebebi**ne dayanıyor mu?
  3. **Ölçülü** mü? (Amaca elverişli, gerekli, orantılı)
  4. Hakkın **özüne** dokunuyor mu?

  > **Örnek:** Vali, "il genelinde kapkaç olaylarını önlemek için motosiklet kullanımı süresiz yasaklanmıştır" diye bir genel emir yayımlarsa, daha hafif tedbirler (denetimi artırmak) varken tüm motosikletlileri hedef alması gereklilik ve orantılılığa aykırıdır.

  ### Durdurma ve kimlik sorma (PVSK m. 4/A)
  Polis kişileri ve araçları suç veya kabahat işlenmesini önlemek, kaçan failleri yakalamak, yakalama emri bulunanları tespit etmek ya da kişilerin hayatına veya topluma yönelik tehlikeyi önlemek amacıyla durdurabilir. Şartları:

  - Polisin **tecrübesine ve durumdan edindiği izlenime dayanan makul bir sebep** bulunmalıdır.
  - Durdurma **süreklilik arz edecek, fiilî durum ve keyfilik oluşturacak şekilde** yapılamaz.
  - Polis durdurma sebebini bildirir, kimlik sorabilir; durdurma süresi, sebebe esas işlemin gerçekleştirilmesi için zorunlu süreden fazla olamaz.
  - Polis, silah veya tehlikeli eşya bulunduğuna dair **yeterli şüphe** varsa zarar verilmesini önlemek için gerekli tedbirleri alabilir; ancak bu amaçla kişinin elbisesinin çıkarılması veya aracın dışarıdan bakıldığında görünmeyen bölümlerinin açılması kural olarak istenemez.

  **Çarşı ve mahalle bekçileri** de görev bölgesi ve çalışma saatleriyle sınırlı olarak, aynı amaçlarla ve makul sebeple durdurma yapabilir. Silah veya tehlikeli eşya şüphesinde yalnız yoklama suretiyle **elle dıştan kontrol** yapabilirler; üst ve araç araması yapamazlar (7245 sayılı Kanun m. 7).

  ### Önleme araması (PVSK m. 9)
  Polis, tehlikenin veya suç işlenmesinin önlenmesi amacıyla, usulüne göre verilmiş **sulh ceza hâkimi kararı** veya bu sebeplere bağlı olarak gecikmesinde sakınca bulunan hâllerde **mülkî âmirin yazılı emri** ile kişilerin üstlerini, araçlarını, özel kâğıtlarını ve eşyasını arar. Karar veya emirde aramanın sebebi, konusu ve kapsamı, yeri, zamanı ve süresi belirtilir. Arama yapılabilecek yerler sayılmıştır (toplantı ve gösteri yürüyüşü yapılan yerler, halkın topluca bulunduğu yerler, umumî veya umuma açık yerler, toplu taşıma araçları gibi).

  > ⚠️ **Sınavda dikkat:** Önleme araması emri **Cumhuriyet savcısından değil**, sulh ceza hâkiminden veya (gecikmede) mülkî âmirden alınır. Savcının yazılı emri CMK m. 119'daki **adli arama** içindir. Ayrıca PVSK m. 9'a göre **konutta, yerleşim yerinde ve kamuya açık olmayan işyerlerinde ve eklentilerinde önleme araması yapılamaz.** Konut dokunulmazlığı AY m. 21'de de güvence altındadır.

  ### Zor ve silah kullanma (PVSK m. 16)
  Polis, görevini yaparken direnişle karşılaşırsa bu direnişi **kırmak amacıyla ve kıracak ölçüde** zor kullanmaya yetkilidir. Zor, direnmenin mahiyetine ve derecesine göre **kademeli olarak artan** biçimde bedenî kuvvet, maddî güç ve kanunî şartlar gerçekleşince silah kullanımından oluşur. Silah kullanma ancak kanunda sayılan hâllerde mümkündür; örneğin hakkında yakalama emri bulunan kişinin yakalanması amacıyla ve sağlayacak ölçüde silah kullanılacaksa önce "dur" çağrısı yapılır, kaçmaya devam edilirse önce uyarı amacıyla ateş edilir. AY m. 17 de kanunun silah kullanımına cevaz verdiği zorunlu durumlardaki öldürme fiillerini (meşru müdafaa, yakalama kararının yerine getirilmesi gibi) birinci fıkra hükmü dışında tutar; ama bu istisna zorunluluk ve ölçülülükle sınırlıdır.

  ### Toplantı ve gösteri yürüyüşü
  Herkes **önceden izin almadan**, silahsız ve saldırısız toplantı ve gösteri yürüyüşü düzenleme hakkına sahiptir (AY m. 34/1). Düzenleme kurulunun bildirimi, toplantıdan **en az kırk sekiz saat önce** valiliğe veya kaymakamlığa verilir (2911 sayılı Kanun m. 10). Bölge valisi, vali veya kaymakam belirli bir toplantıyı bir ayı aşmamak üzere erteleyebilir, suç işleneceğine dair **açık ve yakın tehlike** varsa yasaklayabilir (2911 sayılı Kanun m. 17). Kolluğun veya valiliğin bildirim sistemini fiilen izin sistemine dönüştürmesi AY m. 13 ve AY m. 34'e aykırıdır.

  ### Valinin genel kolluk yetkisi
  Vali, kamu düzeni veya güvenliğinin olağan hayatı durduracak veya kesintiye uğratacak şekilde bozulduğu ya da bozulacağına ilişkin ciddi belirtilerin bulunduğu hâllerde, **on beş günü geçmemek üzere** ildeki belirli yerlere girişi ve çıkışı sınırlayabilir, belli yerlerde veya saatlerde kişilerin dolaşmalarını, toplanmalarını ve araçların seyirlerini düzenleyebilir veya kısıtlayabilir (5442 sayılı Kanun m. 11, C bendi). Bu karar ve tedbirlere uymayanlar hakkında 5442 sayılı Kanun m. 66 uygulanır.

  ## 6. Kanunsuz emir

  Polis, amirinden aldığı emri kanun, Cumhurbaşkanlığı kararnamesi veya yönetmelik hükümlerine aykırı görürse yerine getirmez ve aykırılığı emri verene bildirir. Amir emrinde ısrar eder ve **yazılı olarak yenilerse** emir yerine getirilir; emri yerine getiren sorumlu olmaz. **Konusu suç teşkil eden emir hiçbir suretle yerine getirilmez**, yerine getirenler sorumluluktan kurtulamaz (PVSK m. 2, AY m. 137, TCK m. 24/3).

  > **Örnek:** Amir, gözaltındaki şüpheliye "sorgu için dayak atın" diye yazılı emir verse de polis bu emri yerine getiremez. Emrin konusu suçtur; yazılı yenileme sorumluluğu kaldırmaz.

  ## 7. Kolluk tedbiri ile idari yaptırım

  **Kolluk tedbiri** düzeni korumak veya yeniden kurmak içindir ve sebep ortadan kalkınca sona erer: ruhsatsız çalışan işyerinin ruhsat alınıncaya kadar kapatılması, yangın güvenliği olmayan otelin eksikler giderilene kadar faaliyetten men edilmesi gibi. **İdari yaptırım** ise geçmiş fiili cezalandırır: para cezası gibi. Yaptırımlar için ayrıca kanuni dayanak ve usul güvencesi aranır; idare, kişi hürriyetinin kısıtlanması sonucunu doğuran bir müeyyide de uygulayamaz (AY m. 38).

  ## 8. Yargı yolu

  İdari kolluk işlem ve eylemlerine karşı yargı yolu açıktır (AY m. 125/1). İptal davası ve idari eylem ile işlemlerden dolayı kişisel hakları doğrudan etkilenenlerin açacağı **tam yargı davası** idari yargının görev alanındadır (İYUK m. 2/1-a, İYUK m. 2/1-b). Adli kolluk işlemleri ise ceza muhakemesi hukukunun konusudur.

  > **Örnek:** Devriye polisinin el frenini çekmeyi unutması sonucu aracın kayıp bir otomobile çarpması, idari kolluk faaliyetinin kötü işlemesinden doğan zarardır; zarar gören idare mahkemesinde tam yargı davası açar. Çünkü idare, kendi eylem ve işlemlerinden doğan zararı ödemekle yükümlüdür (AY m. 125).

  ## 9. 📌 Güncel gelişme: Bekçiler

  7245 sayılı Kanun 2020'de çıkarılmış, çarşı ve mahalle bekçilerini genel kolluğa yardımcı silahlı kolluk olarak düzenlemiştir. Anayasa Mahkemesi 2023 tarihli kararıyla, bekçilerin görev ve yetkilerine ilişkin bazı hükümleri (7245 sayılı Kanun m. 2 ve 7245 sayılı Kanun m. 6) iptal etmiş; bu hükümler 2024 yılında 7533 sayılı Kanunla yeniden düzenlenmiştir. Bekçilerin durdurma yetkisi (7245 sayılı Kanun m. 7) ise yukarıda anlatılan sınırlarla geçerlidir.

  ## 10. Denetim şeması

  1. Faaliyetin amacı önleyici mi (idari kolluk), suç soruşturması mı (adli kolluk)?
  2. Yetkili makam kim? (vali, kaymakam; adli işlemde savcı)
  3. Müdahalenin kanuni dayanağı var mı? (PVSK, 5442 sayılı Kanun, 2911 sayılı Kanun)
  4. Özel şartlar (makul sebep, hâkim kararı veya mülkî âmir emri, mekân sınırı) sağlanmış mı?
  5. Ölçülü mü? (AY m. 13)
  6. Hukuka aykırıysa yargı yolu ve sonuç: idari yargıda tam yargı, adli yargıda delilin kullanılamaması (AY m. 38)
kritik: |
  - 📌 **Kamu düzeninin üç maddi unsuru:** kamu güvenliği, kamu huzuru, genel sağlık.
  - 📌 **İdari kolluk önleyici, adli kolluk bastırıcıdır.** Ölçüt faaliyetin amacıdır; aynı personel iki sıfatı da taşır (PVSK m. 2).
  - 📌 **Adli kolluğun emir makamı Cumhuriyet savcısıdır** (CMK m. 164/2); adli görev dışında üstlerinin emrindedir (CMK m. 164/3).
  - 📌 **Genel kolluk makamları:** Cumhurbaşkanı, İçişleri Bakanı, vali, kaymakam. Belediye başkanı özel (mahalli) kolluk makamıdır.
  - 📌 **Jandarma Genel Komutanlığı ve Sahil Güvenlik İçişleri Bakanlığına bağlıdır** (2803 sayılı Kanun m. 4, 2692 sayılı Kanun m. 2); Milli Savunma Bakanlığına bağlı değildir.
  - 📌 **Vali** ilindeki genel ve özel bütün kolluk kuvvet ve teşkilatının amiridir (5442 sayılı Kanun m. 11).
  - 📌 **Kolluk yetkisi kanuna dayanır** (AY m. 13): kanunilik, özel sınırlama sebebi, ölçülülük, hakkın özüne dokunmama.
  - 📌 **Durdurma:** makul sebep; süreklilik ve keyfilik yasak (PVSK m. 4/A). Bekçi yalnız elle dıştan kontrol yapabilir, üst ve araç araması yapamaz (7245 sayılı Kanun m. 7).
  - 📌 **Önleme araması:** sulh ceza hâkimi kararı; gecikmede mülkî âmirin yazılı emri; savcı verici değildir; konutta yapılamaz (PVSK m. 9).
  - 📌 **Zor ve silah:** direnişi kıracak ölçüde ve kademeli (PVSK m. 16). Yakalama amaçlı silahtan önce "dur" çağrısı ve uyarı atışı gerekir.
  - 📌 **Konusu suç olan emir hiçbir suretle yerine getirilmez;** yazılı yenileme sorumluluğu kaldırmaz (PVSK m. 2, AY m. 137, TCK m. 24/3).
  - ⚠️ **Toplantı:** izin değil bildirim sistemi; en az 48 saat önce (AY m. 34, 2911 sayılı Kanun m. 10). Vali tedbirleri en çok 15 gün (5442 sayılı Kanun m. 11).
doktrin: |
  ### Kamu düzeni genel ahlâkı ve insan onurunu kapsar mı?
  **Baskın görüşe** göre kamu düzeni **maddi ve dışsal** bir kavramdır; kolluk, bireylerin iç dünyasını veya özel ahlâk anlayışını düzenlemek için kullanılamaz. Genel ahlâk, ancak kamuya açık alanda somut bir düzensizlik doğurduğu ölçüde ve kanuni yetki çerçevesinde kolluk müdahalesine konu olur. **Karşı görüşe** göre Anayasanın birçok maddesinde "genel ahlâkın korunması" ayrı bir sınırlama sebebi olarak sayıldığından (örn. AY m. 20, AY m. 21, AY m. 34) genel ahlâk, kamu düzeninin ayrı bir unsurudur. Karşılaştırmalı hukukta insan onurunun da kamu düzeninin bileşeni sayıldığı örnekler vardır; Türk hukukunda bu konu açık bir kanuni düzenleme olmadan kolluk yetkisi doğurmaz.

  ### Yoklama ile arama arasındaki sınır
  Durdurulan kişinin üzerinde elle dıştan kontrol (yoklama) ile arama arasındaki ayrım, uygulamada en çok tartışılan noktalardan biridir. Kişinin ceplerine el sokulması veya kapalı bölümlerin açtırılması bir **arama** niteliği taşır ve arama için gereken karar veya emir olmadan yapılırsa hukuka aykırıdır; sonuçta elde edilen bulgunun delil olarak kullanılması da AY m. 38 bakımından sorun çıkarır. Sınırın tam çizgisi olaydan olaya değiştiği için soruda "kapalı çanta açıldı, cebe el sokuldu" gibi somut işaretlere bakılır.

  ### Kolluk zararlarında kusur ölçüsü
  Eski uygulamada kolluk faaliyetinden doğan zararlarda "ağır kusur" aranırdı. Günümüzde yaşam hakkı ve vücut bütünlüğüne müdahalelerde olağan **hizmet kusuru** esas alınır. Bu konuda uygulamanın tam sınırı tartışmalı olduğundan sınavda genel kural olan "idare kendi eylemlerinden doğan zararı öder" (AY m. 125) ilkesi esas alınmalıdır.
sozluk:
  - terim: Kolluk (idari zabıta)
    tanim: "İdarenin kamu düzenini koruma, bozulmasını önleme ve bozulduğunda yeniden kurma faaliyeti."
  - terim: Kamu düzeni
    tanim: "Klasik anlayışta kamu güvenliği, kamu huzuru ve genel sağlıktan oluşan, maddi ve dışsal düzen."
  - terim: İdari kolluk
    tanim: "Suç işlenmeden önce devreye giren, önleyici nitelikteki kolluk faaliyeti."
  - terim: Adli kolluk
    tanim: "Suç işlendikten sonra faili yakalama ve delil toplama gibi soruşturma işlemlerini Cumhuriyet savcısının emriyle yapan kolluk."
  - terim: Genel kolluk
    tanim: "Ülke çapında genel güvenliği sağlayan polis, jandarma ve Sahil Güvenlik gibi kuvvetler."
  - terim: Özel kolluk
    tanim: "Belirli bir alanda görev yapan kolluk; örn. belediye zabıtası."
  - terim: Önleme araması
    tanim: "Tehlikenin veya suç işlenmesinin önlenmesi amacıyla sulh ceza hâkimi kararı veya gecikmede mülkî âmir emriyle yapılan arama (PVSK m. 9)."
  - terim: Durdurma
    tanim: "Polisin, makul sebebe dayanarak kişileri ve araçları suç veya tehlikeyi önlemek gibi amaçlarla durdurması (PVSK m. 4/A)."
  - terim: Mülkî âmir
    tanim: "İl ve ilçede devletin genel yönetim temsilcisi olan vali ve kaymakam."
  - terim: Kolluk tedbiri
    tanim: "Düzeni korumak için alınan, sebep ortadan kalkınca sona eren önleyici önlem; cezalandırma amacı taşımaz."
  - terim: İdari yaptırım
    tanim: "Kanunda öngörülen fiili cezalandırmak için uygulanan idari para cezası gibi müeyyide."
kararlar: []
sorular:
  - soru: |
      Klasik öğretide kamu düzeninin maddi unsurları aşağıdakilerden hangisinde doğru sıralanmıştır?
    siklar:
      - "Kamu güvenliği, kamu huzuru, genel sağlık"
      - "Kamu güvenliği, kamu huzuru, genel ahlâk"
      - "Kamu güvenliği, estetik düzen, genel sağlık"
      - "Genel ahlâk, estetik düzen, kamu huzuru"
    dogru: 0
    aciklama: |
      Kamu düzeninin klasik üçlü maddi unsuru kamu güvenliği, kamu huzuru (dirlik ve esenlik) ve genel sağlıktır. Genel ahlâkın bu üçlüye eklenip eklenmeyeceği tartışmalıdır; bu nedenle genel ahlâk içeren şıklar klasik tanımı yansıtmaz.
  - soru: |
      Aşağıdakilerden hangisi idari kolluk ile adli kolluğu birbirinden ayıran temel ölçüttür?
    siklar:
      - "Görevlinin hangi kurumun personeli olduğu"
      - "Görevlinin silahlı olup olmaması"
      - "Faaliyetin amacı: suç işlenmeden önlenmesi mi, işlenmiş suçun soruşturulması mı"
      - "Faaliyetin gündüz mü gece mi yapıldığı"
    dogru: 2
    aciklama: |
      PVSK m. 2'ye göre polisin görevleri, işlenmeden önce önünü almak (A bendi) ve işlenmiş suç hakkında CMK ve diğer kanunlardaki görevleri yapmak (B bendi) olarak ayrılır. Aynı personel iki sıfatı da taşıdığından ölçüt kişi değil faaliyetin amacıdır.
  - soru: |
      A ilçesinde yılbaşı gecesi asayişi sağlamak isteyen polis, nöbetçi Cumhuriyet savcısının yazılı "önleme araması" emriyle meydandaki yayanın çantasını aramıştır. Bu işlemle ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Arama hukuka uygundur, çünkü savcı gecikmesinde sakınca bulunan hâllerde önleme araması emri verebilir."
      - "Arama hukuka uygundur, çünkü meydan umuma açık bir yerdir ve emir yazılıdır."
      - "Arama hukuka aykırıdır, çünkü önleme araması için yetkili merci sulh ceza hâkimi, gecikmede mülkî âmirdir."
      - "Arama hukuka aykırıdır, çünkü önleme araması hiçbir açık alanda yapılamaz."
    dogru: 2
    aciklama: |
      PVSK m. 9'a göre önleme araması usulüne göre verilmiş sulh ceza hâkimi kararı veya gecikmesinde sakınca bulunan hâllerde mülkî âmirin yazılı emriyle yapılır. Cumhuriyet savcısının yazılı emri CMK m. 119'daki adli arama içindir. Umuma açık yerlerde önleme araması yapılabilir, ama yetkili merciin kararı ya da emri şarttır.
  - soru: |
      Valilik, bir ilçedeki mahalle sakinlerinin evlerinde silah bulunduğu ihbarını almış, mülkî âmirin yazılı emriyle önleme araması yapmak üzere polisi apartman dairelerine göndermiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Emir yazılı olduğundan konutlarda önleme araması yapılabilir."
      - "Konutta önleme araması yapılamaz; konuta ancak adli arama kuralları çerçevesinde girilebilir."
      - "Konutlarda önleme araması yalnız gece yapılamaz, gündüz serbesttir."
      - "Konutta önleme araması için sulh ceza hâkimi kararı yeterlidir."
    dogru: 1
    aciklama: |
      PVSK m. 9'a göre konutta, yerleşim yerinde ve kamuya açık olmayan işyerlerinde ve eklentilerinde önleme araması yapılamaz. Konut dokunulmazlığı AY m. 21'de güvence altındadır; konutta arama ancak hâkim kararı veya gecikmede kanunla yetkili kılınmış merciin yazılı emriyle (adli arama bakımından CMK m. 119) mümkündür.
  - soru: |
      Adli kolluk görevlilerinin adli görevlere ilişkin emir ve talimatlarını hangi makam verir?
    siklar:
      - "Vali"
      - "Cumhuriyet savcısı"
      - "İçişleri Bakanı"
      - "Belediye başkanı"
    dogru: 1
    aciklama: |
      CMK m. 164/2'ye göre soruşturma işlemleri Cumhuriyet savcısının emir ve talimatları doğrultusunda öncelikle adli kolluğa yaptırılır ve adli kolluk savcının adli görevlere ilişkin emirlerini yerine getirir. Adli görevlerin dışında ise üstlerinin emrindedir (CMK m. 164/3).
  - soru: |
      Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı hangi bakanlığa bağlıdır?
    siklar:
      - "Milli Savunma Bakanlığı"
      - "Adalet Bakanlığı"
      - "Dışişleri Bakanlığı"
      - "İçişleri Bakanlığı"
    dogru: 3
    aciklama: |
      Jandarma Genel Komutanlığı İçişleri Bakanlığına bağlıdır (2803 sayılı Kanun m. 4). Sahil Güvenlik Komutanlığı da silahlı bir genel kolluk kuvveti olarak İçişleri Bakanlığına bağlıdır (2692 sayılı Kanun m. 2).
  - soru: |
      Aşağıdakilerden hangisi, il sınırları içindeki genel ve özel bütün kolluk kuvvet ve teşkilatının amiridir?
    siklar:
      - "Belediye başkanı"
      - "İl emniyet müdürü"
      - "Vali"
      - "Cumhuriyet başsavcısı"
    dogru: 2
    aciklama: |
      5442 sayılı Kanun m. 11'in A bendine göre vali, il sınırları içinde bulunan genel ve özel bütün kolluk kuvvet ve teşkilatının amiridir. Belediye başkanı genel idari kolluk makamı değildir; Cumhuriyet başsavcısı ise adli kolluk bakımından emir verir.
  - soru: |
      Emniyet amiri, gözaltındaki şüphelinin "ifade vermesi için dövülmesi" yönünde polis memuru Mehmet'e önce sözlü, ardından ısrar ederek yazılı emir vermiştir. Bu durumda aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Emir yazılı yenilendiğinden Mehmet emri yerine getirmeli ve sorumlu olmaz."
      - "Mehmet emri yerine getirmeli, ancak sorumluluk emri verene aittir."
      - "Emrin konusu suç teşkil ettiğinden Mehmet bu emri hiçbir surette yerine getiremez; yerine getirirse sorumluluktan kurtulamaz."
      - "Mehmet emri yalnız amirin üstüne bildirdikten sonra yerine getirebilir."
    dogru: 2
    aciklama: |
      PVSK m. 2 ve AY m. 137'ye göre amir emrinde ısrar eder ve yazılı olarak yenilerse emir yerine getirilir ve yerine getiren sorumlu olmaz; ancak konusu suç teşkil eden emir hiçbir suretle yerine getirilmez, yerine getirenler sorumluluktan kurtulamaz (TCK m. 24/3).
  - soru: |
      Polis memuru Ali, her akşam aynı sokaktan geçen genç sürücülerin hepsini herhangi bir somut gerekçe olmadan sürekli olarak durdurup kimlik sormaktadır. Bu uygulama için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Polis kimlik sorma yetkisine sahip olduğundan uygulama serbesttir."
      - "Uygulama hukuka uygundur, çünkü durdurma yetkisinde süre sınırı yoktur."
      - "Uygulama yalnız mülkî âmirin yazılı emri varsa hukuka uygundur."
      - "Durdurma için makul sebep gerekir ve süreklilik arz edecek, keyfilik oluşturacak şekilde durdurma yapılamaz; uygulama hukuka aykırıdır."
    dogru: 3
    aciklama: |
      PVSK m. 4/A'ya göre durdurma yetkisi için polisin tecrübesine ve durumdan edindiği izlenime dayanan makul bir sebep bulunmalıdır; süreklilik arz edecek, fiilî durum ve keyfilik oluşturacak şekilde durdurma yapılamaz. Durdurma süresi de zorunlu süreden fazla olamaz.
  - soru: |
      Bir sendika, Cumartesi günü yapacağı silahsız ve saldırısız yürüyüş için hangi usule tabidir?
    siklar:
      - "Validen önceden izin almak zorundadır."
      - "Toplantıdan en az kırk sekiz saat önce valiliğe veya kaymakamlığa bildirim verir; izin aranmaz."
      - "Toplantıdan yedi gün önce Cumhurbaşkanından izin alır."
      - "Hiçbir bildirim gerekmez."
    dogru: 1
    aciklama: |
      AY m. 34/1'e göre herkes önceden izin almadan silahsız ve saldırısız toplantı ve gösteri yürüyüşü düzenleme hakkına sahiptir. 2911 sayılı Kanun m. 10'a göre ise düzenleme kurulunun imzalayacağı bildirim, toplantıdan en az kırk sekiz saat önce valilik veya kaymakamlığa verilir.
  - soru: |
      Devriye gezen polis aracının el frenini çekmeyi unutması nedeniyle aracın kayarak Zeynep'in otomobiline çarpması sonucu zarar doğmuştur. Zeynep'in başvuracağı yargı yolu aşağıdakilerden hangisidir?
    siklar:
      - "İdare mahkemesinde tam yargı davası"
      - "Ağır ceza mahkemesinde tazminat davası"
      - "Sulh ceza hâkimliğine itiraz"
      - "Danıştayda ilk derece mahkemesi olarak iptal davası"
    dogru: 0
    aciklama: |
      Devriye faaliyeti idari kolluk faaliyetidir; zarar idari kolluk hizmetinin kötü işlemesinden doğmuştur. İdari eylemden dolayı kişisel hakları doğrudan etkilenenler idari yargıda tam yargı davası açar (İYUK m. 2/1-b); idare kendi eylem ve işlemlerinden doğan zararı ödemekle yükümlüdür (AY m. 125).
  - soru: |
      Aşağıdakilerden hangisi çarşı ve mahalle bekçileri bakımından doğrudur?
    siklar:
      - "Silah veya tehlikeli eşya şüphesinde kişilerin üst ve araç aramasını kendiliğinden yapabilirler."
      - "Genel kolluk makamı olarak vali yerine geçerler."
      - "Yalnız adli kolluk görevi yaparlar; durdurma yetkileri yoktur."
      - "Makul sebeple kişileri durdurabilir; silah veya tehlikeli eşya şüphesinde yalnız yoklama suretiyle elle dıştan kontrol yapabilirler."
    dogru: 3
    aciklama: |
      7245 sayılı Kanun m. 7'ye göre bekçiler, görev bölgesi ve çalışma saatleriyle sınırlı olmak üzere makul sebeple kişileri ve araçları durdurabilir; yeterli şüphe hâlinde yoklama suretiyle elle dıştan kontrol yapabilir, ancak bu amaçla üst ve araç araması yapamazlar. Bekçiler genel kolluğa yardımcı silahlı kolluktur (7245 sayılı Kanun m. 2).
olaylar:
  - olay: |
      Yılbaşı gecesi X ilçesi meydanında asayiş olaylarını önlemek isteyen İlçe Emniyet Müdürlüğü, ilçe Cumhuriyet Başsavcılığından meydanda ve meydandaki apartmanın dairelerinde "önleme araması" yapmak için yazılı emir talep etmiş; nöbetçi Cumhuriyet savcısı, gecikmesinde sakınca bulunduğunu belirterek yazılı önleme araması emri vermiştir. Polis ekipleri bu emre dayanarak meydanda yürüyen Kemal'in sırt çantasını aramış ve ruhsatsız bir tabanca bulmuştur. Ardından meydandaki apartmanda Ayşe'nin oturduğu daireye girerek önleme araması yapmışlardır. Kemal hakkındaki ceza davasında savcılık, tabancanın delil olarak kullanılmasını istemektedir.

      1. Önleme araması emrini veren makam yetkili midir?
      2. Ayşe'nin dairesinde yapılan işlem hukuka uygun mudur?
      3. Kemal'in çantasında bulunan tabancanın akıbeti ve polisin yapması gerekenler nelerdir?
    olcut:
      - {tespit: "İdari kolluk faaliyeti olan önleme aramasının amacı ve niteliği", puan: 15, madde: "PVSK m. 2"}
      - {tespit: "Önleme araması için yetkili merci: sulh ceza hâkimi, gecikmede mülkî âmir; savcı yetkili değil", puan: 25, madde: "PVSK m. 9"}
      - {tespit: "Konutta önleme araması yapılamaz; konut dokunulmazlığı", puan: 25, madde: "AY m. 21"}
      - {tespit: "Suç delilinin bulunması hâlinde delillerin korunması ve CMK hükümlerine göre işlem yapılması", puan: 15, madde: "PVSK m. 9"}
      - {tespit: "Kanuna aykırı elde edilen bulguların delil olarak kabul edilememesi", puan: 20, madde: "AY m. 38"}
    cozum: |
      **Nitelendirme:** Olay, önleyici nitelikteki bir idari kolluk işleminin (önleme araması) yetki ve mekân sınırlarını ve bu işlem sırasında bulunan delilin akıbetini sorgulamaktadır.

      **Hukuki sorunlar:** (1) Önleme araması emrini vermeye yetkili makam kimdir? (2) Konutta önleme araması yapılabilir mi? (3) Tabanca ceza davasında delil olarak kullanılabilir mi?

      **İlgili hükümler:** PVSK m. 2 (önleyici görev), PVSK m. 9 (önleme araması), CMK m. 119 (adli arama), AY m. 21 (konut dokunulmazlığı), AY m. 38/6 (kanuna aykırı delil).

      **Değerlendirme:** (1) Polis ekipleri tehlikenin veya suç işlenmesinin önlenmesi amacıyla hareket ettiğinden işlem, PVSK m. 2 A bendi kapsamında idari kolluk faaliyetidir. PVSK m. 9'a göre önleme araması usulüne göre verilmiş sulh ceza hâkimi kararıyla veya bu sebeplere bağlı olarak gecikmesinde sakınca bulunan hâllerde mülkî âmirin yazılı emriyle yapılır. Nöbetçi Cumhuriyet savcısı bu emri vermeye yetkili merci değildir; savcının yazılı emri ancak CMK m. 119'daki adli arama için söz konusudur. Dolayısıyla emir yetki yönünden hukuka aykırıdır. (2) PVSK m. 9'a göre konutta, yerleşim yerinde ve kamuya açık olmayan işyerlerinde ve eklentilerinde önleme araması yapılamaz. Ayşe'nin dairesine yapılan girişte hem yetkili merci eksikliği hem de mekân yasağı vardır. Konut dokunulmazlığına ilişkin AY m. 21 de ancak hâkim kararı veya gecikmede kanunla yetkili kılınmış merciin yazılı emri hâlinde istisna tanır. (3) Aramanın yetkisiz merciin emriyle yapılması nedeniyle arama kanuna aykırıdır; kanuna aykırı olarak elde edilmiş bulgular delil olarak kabul edilemez (AY m. 38/6). Polis, bir suç delili bulduğu anda delilleri koruma altına alır ve CMK hükümlerine göre işlem yapar (PVSK m. 9); bu noktada işlem adli nitelik kazanır ve Cumhuriyet savcısı bilgilendirilir. Ancak bu, baştaki arama yetkisizliğini ortadan kaldırmaz.

      **Sonuç:** Savcının önleme araması emri yetkisizdir; konuttaki arama kesin biçimde yasaktır; kanuna aykırı arama sonucu bulunan tabanca ceza davasında delil olarak kabul edilemez.
  - olay: |
      Ankara'da devriye görevi yapan polis memurları Ahmet ve Ali, şüpheli gördükleri Murat'ı durdurup kimlik sormuşlardır. Kimlik kontrolü sırasında Ahmet, devriye aracının el frenini çekmeyi unutmuş, araç kayarak Murat'ın otomobiline çarpmıştır. Bir saat sonra aynı memurlar, hakkında yakalama emri bulunan gasp şüphelisi Selim'i yakalamak üzere düzenlenen operasyona katılmışlardır. Selim kaçmaya çalışmadığı hâlde, yakalanırken Ahmet ve Ali yerde kelepçeleyip aşırı güç kullanmışlar ve Selim'in kolu kırılmıştır.

      1. Devriyedeki kimlik kontrolü ve çarpma olayı hangi nitelikte kolluk faaliyetidir? Murat hangi yola başvurmalıdır?
      2. Selim'in yakalanması hangi nitelikte kolluk faaliyetidir?
      3. Memurların zor kullanması hukuka uygun mudur?
    olcut:
      - {tespit: "Devriye ve kimlik sorma faaliyetinin idari kolluk olması ve durdurma şartları", puan: 20, madde: "PVSK m. 4/A"}
      - {tespit: "Murat'ın idari yargıda tam yargı davası açması", puan: 20, madde: "İYUK m. 2/1-b"}
      - {tespit: "Selim'in yakalanmasının adli kolluk niteliği ve Cumhuriyet savcısının emir ve talimatı", puan: 20, madde: "CMK m. 164"}
      - {tespit: "Zor kullanmanın yalnız direnişi kıracak ölçüde ve kademeli olabilmesi", puan: 25, madde: "PVSK m. 16"}
      - {tespit: "Sınırı aşan zorda kanunun hükmünü yerine getirme nedeninin uygulanmaması", puan: 15, madde: "TCK m. 24"}
    cozum: |
      **Nitelendirme:** Olay, aynı polis memurlarının hem idari hem adli kolluk sıfatıyla yaptığı iki ayrı işlemi ve bunların hukuki sonuçlarını içermektedir.

      **Hukuki sorunlar:** (1) İlk faaliyetin niteliği ve yargı yolu. (2) İkinci faaliyetin niteliği. (3) Zor kullanmanın sınırı.

      **İlgili hükümler:** PVSK m. 2 (A ve B bentleri), PVSK m. 4/A (durdurma), PVSK m. 16 (zor ve silah), CMK m. 160 ve CMK m. 164 (adli kolluk), İYUK m. 2/1-b (tam yargı), AY m. 125 (idarenin zararı ödemesi), TCK m. 24 (kanunun hükmünü yerine getirme).

      **Değerlendirme:** (1) Şüpheli kişiyi durdurup kimlik sormak, PVSK m. 4/A kapsamında önleyici nitelikte idari kolluk faaliyetidir. Aracın el freninin çekilmemesi sonucu otomobile çarpması, idari kolluk hizmetinin kötü işlemesinden doğan bir zarardır. İdare, kendi eylem ve işlemlerinden doğan zararı ödemekle yükümlü olduğundan (AY m. 125) Murat, idari yargıda idari eylemden doğan zararın tazmini için tam yargı davası açmalıdır (İYUK m. 2/1-b). Ayrıca durdurmanın makul sebebe dayanıp dayanmadığı da değerlendirilir. (2) Hakkında yakalama emri bulunan şüpheliyi yakalamak işlenmiş bir suça ilişkin soruşturma işlemidir; PVSK m. 2 B bendi ve CMK m. 164 kapsamında adli kolluk faaliyetidir ve Cumhuriyet savcısının emir ve talimatları doğrultusunda yürütülür (CMK m. 160/2, CMK m. 164/2). (3) PVSK m. 16'ya göre polis, direnişi kırmak amacıyla ve kıracak ölçüde, kademeli olarak artan şekilde zor kullanabilir. Selim ne kaçmaya ne de direnmeye çalışmıştır; bu hâlde aşırı güç kullanılması zor kullanma yetkisinin sınırını aşar. Kanunun hükmünü yerine getiren kimseye ceza verilmez (TCK m. 24/1); ancak bu hukuka uygunluk nedeni, kanunun öngördüğü sınırlar içinde kalan müdahaleler için geçerlidir, sınırı aşan eylemi kapsamaz.

      **Sonuç:** Birinci faaliyet idari kolluk işlemidir ve Murat idare mahkemesinde tam yargı davası açar; ikinci faaliyet adli kolluk işlemidir ve savcının emri altında yürütülür; memurların Selim'e karşı zor kullanması PVSK m. 16'nın sınırını aştığından hukuka aykırıdır.
kartlar:
  - on: "Kamu düzeninin klasik üç maddi unsuru nedir?"
    arka: "Kamu güvenliği, kamu huzuru (dirlik ve esenlik) ve genel sağlık. Genel ahlâkın dördüncü unsur olup olmadığı tartışmalıdır."
  - on: "İdari kolluk ile adli kolluk arasındaki temel fark nedir?"
    arka: "İdari kolluk suç işlenmeden önce önleyici; adli kolluk suç işlendikten sonra soruşturmaya yönelik çalışır (PVSK m. 2 A ve B bentleri). Ölçüt faaliyetin amacıdır."
  - on: "Adli kolluk kimin emir ve talimatıyla çalışır?"
    arka: "Cumhuriyet savcısının (CMK m. 164/2). Adli görev dışındaki hizmetlerde üstlerinin emrindedir (CMK m. 164/3)."
  - on: "Genel kolluk kuvvetleri nelerdir ve hangi bakanlığa bağlıdır?"
    arka: "Polis, jandarma ve Sahil Güvenlik. Jandarma Genel Komutanlığı ve Sahil Güvenlik İçişleri Bakanlığına bağlıdır (2803 sayılı Kanun m. 4, 2692 sayılı Kanun m. 2)."
  - on: "Belediye başkanı genel kolluk makamı mıdır?"
    arka: "Hayır. Belediye zabıtası özel kolluktur (5393 sayılı Kanun m. 51). Genel idari kolluk makamları Cumhurbaşkanı, İçişleri Bakanı, vali ve kaymakamdır."
  - on: "Kolluk yetkisinin Anayasal sınırı nedir?"
    arka: "Temel haklar ancak kanunla, Anayasadaki sebeplere bağlı olarak ve ölçülülük ilkesine uygun sınırlanabilir; özüne dokunulamaz (AY m. 13)."
  - on: "Polis kişileri hangi şartla durdurabilir?"
    arka: "Makul sebep varsa. Süreklilik arz edecek, fiilî durum ve keyfilik oluşturacak şekilde durdurma yapılamaz (PVSK m. 4/A)."
  - on: "Önleme araması kim tarafından verilir?"
    arka: "Sulh ceza hâkimi kararıyla; gecikmesinde sakınca varsa mülkî âmirin yazılı emriyle (PVSK m. 9). Cumhuriyet savcısı bu emri veremez."
  - on: "Önleme araması nerede yapılamaz?"
    arka: "Konutta, yerleşim yerinde ve kamuya açık olmayan işyerlerinde ve eklentilerinde (PVSK m. 9)."
  - on: "Konusu suç olan amir emri yazılı yenilenirse yerine getirilir mi?"
    arka: "Hayır. Konusu suç teşkil eden emir hiçbir suretle yerine getirilmez; yerine getiren sorumluluktan kurtulamaz (PVSK m. 2, AY m. 137)."
  - on: "Toplantı ve gösteri yürüyüşünde izin mi bildirim mi esastır?"
    arka: "Bildirim. Önceden izin aranmaz (AY m. 34); bildirim en az 48 saat önce verilir (2911 sayılı Kanun m. 10)."
  - on: "Bekçi üzerinde hangi kontrolü yapabilir?"
    arka: "Silah veya tehlikeli eşya şüphesinde yoklama suretiyle elle dıştan kontrol; üst ve araç araması yapamaz (7245 sayılı Kanun m. 7)."
