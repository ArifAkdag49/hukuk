doktrin: |
  ### İdari işlemin ölçütü
  Organik ölçüt, işlemin idari örgüte ait bir makamdan çıkmasını arar. Maddi ölçüt ise işlemin idari fonksiyon kapsamında ve kamu gücüne dayanarak yapılmasına bakar. Yasama ve yargı organlarının idari nitelikli işlemlerinin ve kamu gücü kullanan özel kişilerin tek yanlı işlemlerinin idari yargıda denetlenmesi, uygulamanın ağırlıkla maddi ölçütü esas aldığını gösterir. Saf organik ölçüt bu işlemleri dışarıda bırakırdı.

  ### Kesinliğin sınırı: bağlayıcı görüş
  Hazırlık işlemleri kural olarak dava konusu olmaz. Buna karşılık, kanunun bir kurumun uygun görüşünü şart koştuğu ve olumsuz görüşün nihai işlemin tesisini doğrudan engellediği hâllerde, bu görüşün ilgilinin hukuki durumunu etkilediği ve bu nedenle dava konusu yapılabileceği savunulur. Ayrım somut olaya göre yapılır; "hazırlık işlemi dava edilemez" kuralı mutlak sayılmamalıdır.

  ### Şart işlem ve öznel işlem
  Şart işlem, kişiyi genel statüye sokar; statü kurallarının sonradan değişmesi kazanılmış hak ileri sürülerek engellenemez. Öznel işlem ise kişiye özgü içerik taşıdığı için sonradan çıkan genel normlarla geriye dönük ortadan kaldırılamaz. Bir işlemin hangi gruba girdiği, kazanılmış hak tartışmasında belirleyicidir.

  ### Hükümet tasarrufu
  Cumhurbaşkanının yabancı devletlerle ilişkiler veya yüksek siyasi nitelikli işlemlerinin "idari fonksiyon" dışında kalıp kalmadığı tartışmalıdır. 2017 değişikliğiyle AY m. 125/2'den ilgili ibare çıkarılmıştır; bununla birlikte siyasi nitelikteki bazı işlemlerin idari işlem sayılmayacağı yönünde bir görüş de ileri sürülmektedir. Bu nokta tartışmalı olduğundan sınav cevabında kesin dille verilmemelidir.

  ### Otomatik işlemler
  Algoritma ve otomatik karar sistemleriyle tesis edilen işlemlerin açıklama ve gerekçe yükümlülüğü güncel öğretide tartışılan bir alandır; bu konuda yerleşik bir kural yoktur.
sozluk:
  - terim: İdari işlem
    tanim: "İdari makamların idari fonksiyon kapsamında, kamu gücüne dayanarak tek yanlı irade açıklamasıyla hukuk düzeninde değişiklik yaptığı işlem."
  - terim: Tek yanlılık
    tanim: "İşlemin muhatabın rızasına bağlı olmadan yalnızca idarenin iradesiyle kurulması."
  - terim: İcrailik
    tanim: "İdari işlemin tesis edildiği anda kendiliğinden hukuki sonuç doğurması (yürütülmesi gereklilik)."
  - terim: Re'sen icra
    tanim: "İdarenin hukuki sonucu maddi alemde zorla uygulaması; kanunun yetki verdiği ya da acil hâllere özgü istisnadır."
  - terim: Kesinlik
    tanim: "İşlemin karar alma sürecinin son halkası olması; başka makamın onayına gerek kalmadan uygulanabilmesi."
  - terim: Hukuka uygunluk karinesi
    tanim: "İdari işlemin iptal ya da geri alınıncaya kadar hukuka uygun sayılması; dava açılması yürütmeyi durdurmaz."
  - terim: Hazırlık işlemi
    tanim: "Nihai işlemin kurulması için yapılan teklif, rapor ve görüş niteliğindeki ara işlem; tek başına dava konusu olmaz."
  - terim: Teyit edici işlem
    tanim: "Önceki kesin işlemin yeniden inceleme yapılmadan tekrarı; dava açma süresini canlandırmaz."
  - terim: Zımni ret
    tanim: "İdarenin 30 gün içinde cevap vermemesiyle isteğin reddedilmiş sayılması (İYUK m. 10/2)."
  - terim: Şart işlem
    tanim: "Kişiyi önceden genel olarak düzenlenmiş bir hukuki statüye sokan ya da çıkaran işlem (memur ataması)."
  - terim: Öznel işlem
    tanim: "Kişiye özgü hak veya borç doğuran bireysel işlem (vergi tarhı, disiplin cezası)."
  - terim: Ayrılabilir işlem
    tanim: "İdari sözleşme yapılmadan önce alınan ve iptal davasına konu olabilen tek yanlı işlem (ihale komisyonu kararı gibi)."
kararlar:
  - id: "1227605800"
    ozet: |
      Davacılar, bitişik parsellerdeki bir inşaatın hissedarları ve yüklenici şirketti; davalılar, komşu parselin maliklerinden oluşuyordu. Davalılar, daha önce tevhit ve ikiz nizam konusunda belediyeye karşı ayrı bir iptal davası açmıştı. Ardından davacıların parseline verilen inşaat ruhsatları ile kendi başvurularının reddine ilişkin 25.10.2013 tarihli işlemin iptali istemiyle ikinci bir dava açtılar; bu davada verilen yürütmenin durdurulması kararıyla inşaat 22.07.2014 tarihinde durduruldu. İdare mahkemesinin iptal kararı Danıştayca 20.05.2015 tarihinde bozuldu; yeniden yapılan yargılamada idare mahkemesi, başvurunun reddine ilişkin işlemde hukuka aykırılık bulunmadığı gerekçesiyle davayı reddetti ve ret kesinleşti. Davacılar, inşaatın gecikmesinden doğan kira kaybı için adli yargıda tazminat davası açtı. İlk derece mahkemesinin ilk kabul kararı, idari dava dosyalarının kesinleşmesinin beklenmesi gerektiği gerekçesiyle istinafta kaldırıldı. Yeniden yapılan yargılamada ilk derece mahkemesi, bilirkişinin yürütmenin durdurulması kararı ile Danıştay bozma kararı arasındaki 9 ay 23 günlük süre için hesapladığı kira kaybı talebini kabul etti, inşaat maliyeti artışına ilişkin talebi reddetti; bölge adliye mahkemesi iki tarafın istinafını da esastan reddetti. Yargıtay 4. Hukuk Dairesi, davalıların sorumluluğa ilişkin itirazlarını reddetti ve bir davacı bakımından temyizi miktardan reddetti. Ancak kira kaybının yürütmenin durdurulması süresinin tamamı için hesaplanmasını doğru bulmadı; inşaat bittikten sonra makul bir süre içinde kiraya verilemeyecek olması dikkate alınarak hesap yapılmasını ve TBK m. 51 ile TBK m. 52 gereği hakkaniyet indirimi uygulanmasını gerekli görüp hükmü bozdu. Karar, idari işlemin hukuka uygunluk karinesine rağmen yürütmenin durdurulmasının üçüncü kişilere zarar verebildiğini ve bu zararın adli yargıda tartışılabildiğini gösterir; idari işlemin unsurlarına ilişkin bir ilke koymaz.
sorular:
  - soru: |
      Aşağıdakilerden hangisi tek başına iptal davasına konu olabilecek "kesin ve yürütülmesi gereken" idari işlemdir?
    siklar:
      - "Bakanlık müfettişinin disiplin cezası teklifi içeren soruşturma raporu"
      - "Disiplin kurulu kararı alındıktan sonra atamaya yetkili amirin memura kademe ilerlemesinin durdurulması cezası vermesi ve bunun ilgiliye tebliği"
      - "Valiliğin yazı işlerine yönelik genel bir bilgilendirme yazısı"
      - "Bir komisyonun bir konuda verdiği istişari nitelikli görüş"
    dogru: 1
    aciklama: |
      Bu ceza, disiplin kurulu kararı alındıktan sonra atamaya yetkili amirce verilir (657 sayılı Kanun m. 126). Yetkili amirin cezayı vermesi ve tebliği, karar alma sürecinin son halkasıdır; ilgilinin hukuki durumunu kendiliğinden değiştirir. Rapor, bilgilendirme yazısı ve istişari görüş hazırlık, bilgi verme ya da danışma niteliğindedir ve tek başına dava konusu olmaz (İYUK m. 14/3-d).
  - soru: |
      Zeynep, imar planı değişikliği istemiyle 1 Nisanda belediyeye yazılı başvurmuştur. Belediyeden hiçbir cevap alamayan Zeynep'in durumu için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Otuz gün sonunda isteği zımnen kabul edilmiş sayılır."
      - "Otuz gün sonunda isteği reddedilmiş sayılır ve dava açma süresi içinde dava açabilir."
      - "Sükut hiçbir sonuç doğurmaz; idare cevap verene kadar dava açılamaz."
      - "Altmış gün sonunda isteği reddedilmiş sayılır."
    dogru: 1
    aciklama: |
      İdari makamlara yapılan başvuruda otuz gün içinde cevap verilmezse istek reddedilmiş sayılır ve ilgili dava açma süresi içinde dava açabilir (İYUK m. 10/2). Zımni kabul istisnadır ve kanunun açık hükmünü gerektirir. Altmış gün, 7331 sayılı Kanundan önceki süredir.
  - soru: |
      İYUK m. 10/2'ye göre idare otuz gün içinde "başvurunuz incelenmektedir" şeklinde kesin olmayan bir cevap vermişse, ilgilinin kesin cevabı bekleyebileceği azami süre nedir?
    siklar:
      - "Başvuru tarihinden itibaren iki ay"
      - "Başvuru tarihinden itibaren dört ay"
      - "Başvuru tarihinden itibaren altı ay"
      - "Cevabın tebliğinden itibaren altmış gün"
    dogru: 1
    aciklama: |
      Kesin olmayan cevapta ilgili, cevabı ret sayıp dava açabilir ya da kesin cevabı bekleyebilir; bekleme süresi başvuru tarihinden itibaren dört ayı geçemez (İYUK m. 10/2). Altı ay, 7331 sayılı Kanundan önceki süredir.
  - soru: |
      Yürütmenin durdurulması kararı verilebilmesi için aşağıdaki şartlardan hangileri gerekir?
    siklar:
      - "Yalnızca işlemin açıkça hukuka aykırı olması"
      - "Yalnızca telafisi güç veya imkânsız zarar doğması"
      - "Telafisi güç veya imkânsız zarar doğması ile işlemin açıkça hukuka aykırı olmasının birlikte gerçekleşmesi"
      - "Zarar doğması ile idarenin kusurlu olması"
    dogru: 2
    aciklama: |
      AY m. 125/5 ve İYUK m. 27/2, iki şartın birlikte gerçekleşmesini ve gerekçe gösterilmesini ister. Tek şart yeterli değildir; idarenin kusuru ise şartlar arasında yer almaz.
  - soru: |
      Öğretmen Ali, naklen atama işleminin iptali için dava açmış ve yürütmenin durdurulmasını istemiştir. Mahkeme idarenin savunmasını beklemeden yürütmeyi durdurabilir mi?
    siklar:
      - "Evet, atama işlemleri uygulanmakla etkisi tükenecek işlemlerdendir."
      - "Hayır, kamu görevlilerinin naklen atama işlemleri uygulanmakla etkisi tükenecek işlemlerden sayılmaz."
      - "Evet, ancak yalnızca Danıştay bu karara verebilir."
      - "Hayır, kamu görevlilerinin atama işlemlerine karşı yürütmenin durdurulması istenemez."
    dogru: 1
    aciklama: |
      İYUK m. 27/2'ye göre kamu görevlileri hakkında tesis edilen atama, naklen atama, görev ve unvan değişikliği ile görevlendirme işlemleri uygulanmakla etkisi tükenecek işlemlerden sayılmaz. Bu nedenle savunma alınmadan yürütmenin durdurulması kararı verilemez. YD istemi ise elbette yapılabilir.
  - soru: |
      Mükellef Hasan, beyannamesini ihtirazi kayıtla vermiş ve bu beyanname üzerine yapılan tarhiyata karşı vergi mahkemesinde dava açmıştır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Dava açılması tahsil işlemini kendiliğinden durdurur."
      - "Dava açılması tahsil işlemini durdurmaz; Hasan yürütmenin durdurulmasını isteyebilir."
      - "Vergi mahkemelerinde yürütmenin durdurulması istenemez."
      - "Dava açılması işlemi hukuken yok sayar."
    dogru: 1
    aciklama: |
      Vergi mahkemelerinde dava açılması dava konusu bölümün tahsilini kural olarak durdurur; ancak ihtirazi kayıtla verilen beyannameler üzerine yapılan işlemler ve tahsilat işlemlerinden dolayı açılan davalar tahsili durdurmaz, bunlarda yürütmenin durdurulması istenebilir (İYUK m. 27/4).
  - soru: |
      Aşağıdakilerden hangisi AY m. 125'in bugünkü metnine göre yanlıştır?
    siklar:
      - "İdarenin her türlü eylem ve işlemlerine karşı yargı yolu açıktır."
      - "İdari işlemlere karşı açılacak davalarda süre yazılı bildirim tarihinden başlar."
      - "Cumhurbaşkanının tek başına yapacağı işlemler yargı denetimi dışındadır."
      - "Yargı yetkisi hukuka uygunluk denetimiyle sınırlıdır."
    dogru: 2
    aciklama: |
      6771 sayılı Kanunla bu ibare Anayasadan çıkarılmıştır; Cumhurbaşkanının tek başına yaptığı işlemler artık yargı denetimine tabidir. Diğer üç ifade AY m. 125/1, m. 125/3 ve m. 125/4'ün içeriğiyle uyumludur.
  - soru: |
      Hâkim Selim'in Hâkimler ve Savcılar Kurulunca meslekten çıkarılmasına karar verilmiştir. Selim'in yargı yoluna başvurma imkânı hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "HSK kararlarına karşı hiçbir koşulda yargı yoluna başvurulamaz."
      - "Meslekten çıkarma cezasına ilişkin kararlara karşı yargı yoluna başvurulabilir."
      - "Yalnızca disiplin cezası dışındaki kararlara karşı başvurulabilir."
      - "Yargı yoluna ancak Anayasa Mahkemesi aracılığıyla başvurulabilir."
    dogru: 1
    aciklama: |
      AY m. 159/10'a göre Kurulun meslekten çıkarma cezasına ilişkin olanlar dışındaki kararlarına karşı yargı mercilerine başvurulamaz. Dolayısıyla meslekten çıkarma kararına karşı yargı yolu açıktır.
  - soru: |
      Belediye, ruhsatsız yapıyı 3194 sayılı Kanun m. 32'ye dayanarak encümen kararı ile yıkmıştır. Bu uygulama için aşağıdaki nitelendirmelerden hangisi doğrudur?
    siklar:
      - "İcrailiğin sonucudur; ayrıca kanuni dayanak aranmaz."
      - "Re'sen icra örneğidir; kanunun idareye verdiği yetkiye dayanır."
      - "İdari eylemdir; idari işlemle ilgisi yoktur."
      - "Zımni kabulün sonucudur."
    dogru: 1
    aciklama: |
      Yıkım, idari işlemin (encümen kararı) maddi alemde zorla uygulanmasıdır. Bu re'sen icra kural değil istisnadır ve burada 3194 sayılı Kanun m. 32 kanuni dayanağı sağlar. İcrailik ise hukuki sonuç doğurmayı anlatır.
  - soru: |
      Kazanılmış hak tartışmasında hangi işlem sonradan çıkan genel kurallarla geriye dönük olarak ortadan kaldırılamaz?
    siklar:
      - "Memurun atanması gibi şart işlem"
      - "Yönetmelik gibi düzenleyici işlem"
      - "Belirli bir kişiye özgü hak doğuran öznel işlem"
      - "Hiçbir idari işlem"
    dogru: 2
    aciklama: |
      Öznel işlem kişiye özgü hak veya borç doğurduğundan sonradan çıkan genel normlarla geriye dönük ortadan kaldırılamaz. Şart işlemde ise kişi, kuralları geleceğe dönük değişebilen bir statüye girer.
  - soru: |
      Ali, hakkında tesis edilen bir idari işlemin tebliğinden yirmi gün sonra, işlemin kaldırılması istemiyle üst makama başvurmuştur. Üst makam otuz gün içinde cevap vermezse dava açma süresi hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Süre işlememiş sayılır, yeniden altmış gün başlar."
      - "Başvuru süreyi durdurur; ret sayıldığında süre yeniden işlemeye başlar ve başvuruya kadar geçen süre hesaba katılır."
      - "Süre başvuruyla kesilir ve tamamen yeniden başlar."
      - "Üst makama başvuru dava açma süresine hiçbir etki yapmaz."
    dogru: 1
    aciklama: |
      İYUK m. 11'e göre üst makama başvuru, işlemeye başlamış dava açma süresini durdurur. Otuz günde cevap verilmezse istek reddedilmiş sayılır ve süre yeniden işlemeye başlar; başvurma tarihine kadar geçmiş süre de hesaba katılır.
  - soru: |
      İhale komisyonunun belediye taşınmazının kiralanmasına ilişkin ihale kararı ile imzalanan kira sözleşmesi arasındaki ilişki için hangisi doğrudur?
    siklar:
      - "Her ikisi de sözleşme olduğundan idari yargıda iptal davasına konu olamaz."
      - "İhale komisyonu kararı sözleşmeden ayrılabilir idari işlemdir ve iptal davasına konu olabilir."
      - "Kira sözleşmesi idari işlem olduğundan yalnızca o dava edilebilir."
      - "İhale kararı idari eylemdir ve tam yargı davasına konu olur."
    dogru: 1
    aciklama: |
      Sözleşmenin yapılmasından önceki aşamada idarenin tek yanlı kamu gücüyle tesis ettiği işlemler (ihale ilanı, komisyon kararı, onay) ayrılabilir idari işlemlerdir. Bunlar iptal davasına konu olabilir; sözleşme ise ayrı bir hukuki rejime tabidir.
olaylar:
  - olay: |
      A Bakanlığında şube müdürü olarak çalışan Murat hakkında, Bakanlık müfettişi bir soruşturma yürütmüş ve 10 Mart tarihli raporunda Murat'ın kademe ilerlemesinin durdurulması cezasıyla cezalandırılmasını önermiştir. Rapor disiplin işlemleri için yetkili makama sunulmuş; disiplin kurulu henüz toplanmamış, ceza da verilmemiştir. Murat raporu öğrenir öğrenmez, 20 Mart'ta idare mahkemesinde raporun iptali istemiyle dava açar.

      Daha sonra disiplin kurulu cezayı uygun bulur, atamaya yetkili amir de Murat'a cezayı verir ve karar 5 Mayıs'ta yazılı olarak tebliğ edilir. Murat, dava açmadan önce ve dava açma süresi dolmadan ilgili üst makama başvurarak cezanın kaldırılmasını ister; üst makam otuz gün içinde cevap vermez. Bunun üzerine Murat cezanın iptali için dava açar ve ceza kararının uygulanmasının durdurulmasını da ister.

      1. 20 Mart'ta açılan dava hakkında mahkeme nasıl karar verir?
      2. Murat'ın ceza kararına karşı dava açma süresi ve usulü nasıldır?
      3. Murat'ın üst makama başvurusunun dava açma süresine etkisi nedir?
      4. Dava açılmış olması cezanın uygulanmasını durdurur mu? Yürütmenin durdurulması için hangi şartlar aranır?
    olcut:
      - {tespit: "Müfettiş raporunun hazırlık ve teklif işlemi olduğu, kesin ve icrai olmadığı", puan: 20, madde: "İYUK m. 14/3-d"}
      - {tespit: "Hazırlık işlemine karşı açılan davanın reddedileceği", puan: 15, madde: "İYUK m. 15/1-b"}
      - {tespit: "Yetkili amirin ceza kararının kesin ve icrai işlem olduğu; dava açma süresinin yazılı bildirimi izleyen günden başladığı", puan: 20, madde: "İYUK m. 7"}
      - {tespit: "Üst makama başvurunun süreyi durdurduğu, otuz günde cevap gelmezse istemin reddedilmiş sayılıp sürenin yeniden işlediği ve geçmiş sürenin hesaba katıldığı", puan: 20, madde: "İYUK m. 11"}
      - {tespit: "Dava açmanın yürütmeyi durdurmadığı", puan: 10, madde: "İYUK m. 27/1"}
      - {tespit: "YD için iki şartın birlikte aranması: telafisi güç zarar ve açıkça hukuka aykırılık", puan: 15, madde: "AY m. 125/5"}
    cozum: |
      **Nitelendirme:** Olayda iki ayrı işlem vardır. Birincisi müfettiş raporudur: cezaya karar verecek makamlara sunulan bir teklif içerir ve bu makamlar teklifle bağlı değildir. İkincisi, disiplin kurulu kararı alındıktan sonra atamaya yetkili amirin verdiği ceza kararıdır: karar alma sürecinin son halkasıdır.

      **Hukuki sorunlar:** Hangi işlemin iptal davasına konu olabileceği; dava açma süresi; üst makama başvurunun etkisi; yürütmenin durdurulması.

      **İlgili hükümler:** İYUK m. 14/3-d ilk incelemede işlemin "kesin ve yürütülmesi gereken" olup olmadığına bakılacağını söyler. Bu şart bulunmazsa dava İYUK m. 15/1-b uyarınca reddedilir. Dava açma süresi İYUK m. 7'ye göre idare mahkemelerinde altmış gündür ve yazılı bildirimin yapıldığı tarihi izleyen günden başlar (İYUK m. 7/2; AY m. 125/3). İYUK m. 11/1 üst makama başvurunun işlemeye başlamış süreyi durdurduğunu, m. 11/2-3 ise otuz gün içinde cevap verilmezse isteğin reddedilmiş sayılacağını, bu durumda sürenin yeniden işlemeye başlayıp başvuruya kadar geçen sürenin hesaba katılacağını belirtir. İYUK m. 27/1 dava açılmasının yürütmeyi durdurmadığını, İYUK m. 27/2 ve AY m. 125/5 ise YD için iki şartı birlikte arar.

      **Değerlendirme:** (1) Müfettiş raporu hazırlık ve teklif işlemidir; Murat'ın hukuki durumunu kendiliğinden değiştirmez. 20 Mart'ta açılan dava, "kesin ve yürütülmesi gereken işlem" şartı yokluğundan reddedilir. Murat, ceza verildikten sonra nihai işleme karşı dava açıp raporun sakatlığını o davada ileri sürebilir. (2) Ceza kararı kesin ve icrai işlemdir; tebliğ tarihini (5 Mayıs) izleyen günden itibaren altmış gün içinde dava açılabilir. (3) Üst makama başvuru, işlemeye başlamış süreyi durdurur. Üst makam otuz gün cevap vermediği için başvuru reddedilmiş sayılır; süre yeniden işlemeye başlar ve başvuruya kadar geçen süre hesaba katılır. Bu, süreyi baştan başlatmaz. (4) Dava açılmış olması cezanın uygulanmasını durdurmaz, çünkü işlem hukuka uygunluk karinesinden yararlanır. Murat'ın ayrı bir YD istemi vardır. Mahkeme, uygulanması hâlinde telafisi güç veya imkânsız zarar doğması ile işlemin açıkça hukuka aykırı olması şartları birlikte gerçekleşirse, gerekçe göstererek ve normalde idarenin savunmasını alarak yürütmeyi durdurabilir. Bir şartın eksikliği durdurmayı engeller. Disiplin cezası gibi para veya kademe etkisi doğuran işlemler her zaman "telafisi güç zarar" şartını karşılamaz; bu, somut olayın değerlendirmesine bağlıdır.

      **Sonuç:** Rapora karşı dava reddedilir; ceza kararına karşı tebliği izleyen günden itibaren altmış gün içinde dava açılabilir. Üst makama başvuru süreyi durdurur ama baştan başlatmaz. Dava, kendiliğinden yürütmeyi durdurmaz; durdurma ancak iki şartın birlikte gerçekleşmesiyle mümkündür.
  - olay: |
      Mehmet, B Belediyesinin sınırlarındaki parselinde ruhsat almadan bir ek kat yapmaya başlamıştır. Belediye ekipleri yapıyı mühürleyip inşaatı durdurmuş, belediye encümeni de yapının yıkılmasına karar vermiş ve karar Mehmet'e 4 Haziranda tebliğ edilmiştir. Mehmet 10 Haziranda idare mahkemesinde iptal davası açmış ve yürütmenin durdurulmasını istemiştir. Belediye, "dava açılması yıkımı engellemez" diyerek 20 Haziranda yıkım hazırlığına başlamıştır.

      Mehmet, ayrıca Mart ayında aynı parsel için ruhsat almak üzere belediyeye başvurmuş; belediye yirmi gün sonra "başvurunuz imar komisyonunda incelenmektedir" şeklinde bir yazı göndermiş, sonrasında cevap vermemiştir.

      1. Encümen kararı ile yıkımın uygulanması idari hukuk bakımından nasıl nitelendirilir? İcrailik ile re'sen icra arasındaki ilişki nedir?
      2. Dava açılması yıkımı engeller mi?
      3. Mahkeme yürütmenin durdurulmasına hangi şartlarla karar verebilir? Savunma alınmadan karar verilebilir mi?
      4. Mart ayındaki başvuruya verilen yazının hukuki niteliği nedir ve Mehmet'in seçenekleri nelerdir?
    olcut:
      - {tespit: "Encümen kararının tek yanlı, kesin ve icrai idari işlem olması", puan: 15, madde: "İYUK m. 14/3-d"}
      - {tespit: "Yıkımın re'sen icra olduğu ve kanuni dayanağının bulunduğu; icrailik ile re'sen icranın ayrımı", puan: 20, madde: "3194 sayılı Kanun m. 32"}
      - {tespit: "Dava açılmasının yürütmeyi durdurmadığı (hukuka uygunluk karinesi)", puan: 15, madde: "İYUK m. 27/1"}
      - {tespit: "YD için iki şartın birlikte aranması ve gerekçe zorunluluğu", puan: 20, madde: "AY m. 125/5"}
      - {tespit: "Otuz gün içinde verilen kesin olmayan cevabın ret sayılabileceği veya kesin cevabın beklenebileceği", puan: 15, madde: "İYUK m. 10/2"}
      - {tespit: "Bekleme süresinin başvurudan itibaren dört ayı aşamaması", puan: 15, madde: "İYUK m. 10/2"}
    cozum: |
      **Nitelendirme:** Encümenin yıkım kararı, tek yanlı irade açıklamasıyla Mehmet'in hukuki durumunu değiştiren bir idari işlemdir. Yıkımın fiilen yapılması ise bu işlemin maddi alemde zorla uygulanmasıdır (re'sen icra). Mart ayındaki başvuruya verilen yazı ise kesin olmayan bir cevaptır.

      **Hukuki sorunlar:** İşlemin özellikleri ve re'sen icranın dayanağı; dava açılmasının etkisi; yürütmenin durdurulması; sükut ve kesin olmayan cevap.

      **İlgili hükümler:** 3194 sayılı Kanun m. 32, ruhsatsız yapının mühürlenip inşaatın durdurulmasını ve belirtilen şartlar gerçekleşirse encümen ya da il idare kurulu kararını izleyen yıktırma ile masrafın yapı sahibinden tahsilini düzenler. İYUK m. 27/1 dava açmanın yürütmeyi durdurmayacağını söyler. İYUK m. 27/2 ve AY m. 125/5 YD şartlarını belirler. İYUK m. 10/2 sükut ve kesin olmayan cevabı düzenler.

      **Değerlendirme:** (1) Encümen kararı icrai işlemdir: tesis edildiği anda hukuki sonuç doğurur. Yıkımın belediye eliyle gerçekleştirilmesi ise ayrıca kanuni yetki ister; bu yetki 3194 sayılı Kanun m. 32'de açıkça verilmiştir. Yani icrailik kuraldır, re'sen icra kanunun yetkisine bağlı istisnadır; her ikisi birbirinin yerine kullanılamaz. (2) Mehmet'in davası, işlem hukuka uygun sayıldığı için yıkımı kendiliğinden durdurmaz (İYUK m. 27/1). Belediye mahkeme YD kararı vermedikçe işlemi uygulayabilir; Mehmet'in korunması YD istemine bağlıdır. (3) Mahkeme, yıkımın uygulanması hâlinde telafisi güç veya imkânsız zararların doğması ile işlemin açıkça hukuka aykırı olması şartlarının birlikte gerçekleşmesi hâlinde ve gerekçe göstererek YD verebilir. Normalde idarenin savunması alınır; yıkım gibi uygulanmakla etkisi tükenecek işlemlerde ise savunma alınmadan da geçici olarak durdurulabileceği kabul edilir (İYUK m. 27/2). Bir şartın eksikliği karara engeldir; ruhsatsız yapının varlığı ise açık hukuka aykırılığı çoğu zaman tartışmalı kılacağından istem reddedilebilir. (4) Belediyenin yirmi gün sonra verdiği yazı otuz gün içinde verildiği için ret sonucu doğurmaz, ama kesin değildir. Mehmet bu yazıyı ret sayıp dava açabilir veya kesin cevabı bekleyebilir. Beklerken dava açma süresi işlemez, ancak bekleme başvuru tarihinden itibaren dört ayı geçemez.

      **Sonuç:** Yıkım, 3194 sayılı Kanun m. 32'ye dayanan re'sen icradır; dava tek başına yıkımı durdurmaz. Durdurma için YD iki şartı birlikte aranır. Mart başvurusu bakımından Mehmet kesin olmayan cevabı ret sayıp dava açabilir ya da en çok dört ay bekleyebilir.
kartlar:
  - on: "İdari işlemin dört temel özelliği nedir?"
    arka: "Tek yanlılık, icrailik, kesinlik, hukuka uygunluk karinesi."
  - on: "İcrailik ile re'sen icra farkı nedir?"
    arka: "İcrailik: işlemin kendiliğinden hukuki sonuç doğurması (kural). Re'sen icra: sonucun maddi alemde zorla uygulanması; kanuni dayanak ister (istisna), ör. 3194 sayılı Kanun m. 32."
  - on: "İptal davasına konu işlem hangi niteliği taşımalı?"
    arka: "Kesin ve yürütülmesi gereken (icrai) olmalı (İYUK m. 14/3-d); yoksa dava reddedilir (İYUK m. 15/1-b)."
  - on: "Hangi işlemler tek başına iptal davasına konu olmaz?"
    arka: "Hazırlık, teklif, görüş, iç düzen, bilgi verme ve teyit edici işlemler."
  - on: "Dava açılması yürütmeyi durdurur mu?"
    arka: "Hayır (İYUK m. 27/1). İstisna: vergi mahkemesinde vergi uyuşmazlığı davası tahsili durdurur (İYUK m. 27/4)."
  - on: "YD şartları nelerdir?"
    arka: "Telafisi güç veya imkânsız zarar + işlemin açıkça hukuka aykırılığı; birlikte aranır, gerekçe zorunlu (AY m. 125/5, İYUK m. 27/2)."
  - on: "YD kararına itiraz süresi?"
    arka: "Tebliği izleyen günden itibaren 7 gün, bir defaya mahsus (İYUK m. 27/7)."
  - on: "Zımni ret süresi ve bekleme süresi?"
    arka: "30 gün; kesin olmayan cevapta bekleme başvurudan itibaren en çok 4 ay (İYUK m. 10/2; 7331 sayılı Kanunla 60 gün ve 6 aydan indirildi)."
  - on: "Üst makama başvurunun etkisi?"
    arka: "İşleyen dava süresini durdurur; ret sayılınca süre yeniden işler, geçen süre hesaba katılır (İYUK m. 11)."
  - on: "Şart işlem ile öznel işlem farkı?"
    arka: "Şart işlem kişiyi genel statüye sokar (memur ataması); öznel işlem kişiye özgü hak/borç doğurur (vergi tarhı) ve geriye dönük kaldırılamaz."
  - on: "Cumhurbaşkanının tek başına yapacağı işlemler yargı denetimi dışında mı?"
    arka: "Hayır. 6771 sayılı Kanunla AY m. 125/2'den ilgili ibare çıkarıldı (2017)."
  - on: "Yargı yolu kapalı Anayasa alanları?"
    arka: "HSK (meslekten çıkarma hariç, AY m. 159/10), YSK (AY m. 79/2), Sayıştay kesin hükümleri (AY m. 160/1)."
