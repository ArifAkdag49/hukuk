ozet: |
  - **Tanım (AY m. 127/1):** Mahalli idareler, il, belediye veya köy halkının **mahalli müşterek ihtiyaçlarını** karşılamak üzere kuruluş esasları kanunla belirlenen, **karar organları seçmenlerce seçilen** kamu tüzel kişileridir. Anayasa yalnız **karar organlarının** seçilmesini şart koşar; yürütme organının atanması (ör. vali) Anayasa'ya aykırı değildir.
  - **Üç tür:** belediye, il özel idaresi, köy. Büyük yerleşim merkezleri için kanun **özel yönetim biçimi** getirebilir (AY m. 127/3); örnek büyükşehir belediyesi (5216 sayılı Kanun m. 4 ve 5216 sayılı Kanun m. 5). Seçimler **beş yılda bir** yapılır.
  - **Belediye organları** (5393 sayılı Kanun m. 3): **meclis** (karar organı, 5393 sayılı Kanun m. 17), **encümen** (5393 sayılı Kanun m. 33), **başkan** (5393 sayılı Kanun m. 37). Meclisin başkanı belediye başkanıdır (5393 sayılı Kanun m. 19).
  - **Yetki dağılımı:** taşınmaz alım-satımı, üç yıldan fazla kiralama, şartlı bağış, yönetmelik **meclise**; üç yılı geçmeyen kiralama, cezalar, kamulaştırma kararı **encümene**; şartsız bağış, personel atama, temsil **başkana** aittir.
  - **İl özel idaresi** (5302 sayılı Kanun m. 3): il genel meclisi, il encümeni ve **vali**. Meclis kendi başkanını seçer (5302 sayılı Kanun m. 11); encümene vali başkanlık eder (5302 sayılı Kanun m. 25).
  - **Köy:** tüzel kişidir (442 sayılı Kanun m. 7). Köy derneği, muhtar ve ihtiyar meclisi vardır (442 sayılı Kanun m. 20). **Mahallenin** tüzel kişiliği yoktur (5393 sayılı Kanun m. 3/d).
  - **Belediye kurma:** nüfusu 5.000 ve üzerindeki yerleşimlerde kurulabilir, il ve ilçe merkezlerinde zorunludur (5393 sayılı Kanun m. 4); nüfusu 2.000'in altına düşen belediye köye dönüştürülür (5393 sayılı Kanun m. 11).
  - **İdari vesayet (AY m. 127/5):** merkezi idarenin, mahalli idareler üzerinde **kanunda gösterilen esas ve usullerle**, idarenin bütünlüğü ve kamu görevlerinde birliği gibi amaçlarla kullandığı denetim yetkisidir. Hiyerarşi değildir.
  - **Kişiye yönelik vesayet:** İçişleri Bakanı görevle ilgili suçtan soruşturulan organları **geçici** uzaklaştırır (AY m. 127/4); organlık sıfatının **kesin** kaybı ve meclisin feshi **yargı (Danıştay)** işidir.
  - 📌 **Güncel:** 5393 sayılı Kanun m. 4 ve m. 11'in bazı hükümleri AYM'nin 7/12/2023 tarihli kararıyla iptal edilmiş, 7551 sayılı Kanun (2025) yeniden düzenlemiştir.
anlatim: |
  ## 1. Mahalli idare nedir?

  İdarenin kuruluş ve görevleri **merkezden yönetim** ve **yerinden yönetim** esaslarına dayanır (AY m. 123/2). Belli bir yerin halkının işlerini o halkın seçtiği organlara bırakan **yer yönünden yerinden yönetim**, yani mahalli idareler, bu ikinci grubun bir koludur.

  AY m. 127/1'e göre mahalli idareler; il, belediye veya köy halkının **mahalli müşterek ihtiyaçlarını** karşılamak üzere kuruluş esasları kanunla belirtilen ve **karar organları** kanunda gösterilen, **seçmenler tarafından seçilerek** oluşturulan **kamu tüzel kişileridir**. Buradan unsurlar çıkar: kamu tüzel kişiliği; mahalli ve müşterek ihtiyaç; kanunla kuruluş ve görev (AY m. 127/2); seçimle oluşan karar organı; idari ve mali özerklik (5393 sayılı Kanun m. 3/a; 5302 sayılı Kanun m. 3/a).

  > ⚠️ **Sınavda dikkat:** Anayasa **karar organlarının** seçilmesini zorunlu kılar, **bütün organların** değil. İl özel idaresinin yürütme organı olan valinin atanmış olması bu yüzden Anayasa'ya aykırı sayılmaz. Belediye başkanının seçilmesi kanundan gelir (5393 sayılı Kanun m. 37).

  Seçimler **beş yılda bir** yapılır; kanun büyük yerleşim merkezleri için **özel yönetim biçimleri** getirebilir (AY m. 127/3).

  ### Türler ve güncel yapı

  | Mahalli idare | Karar organı | Yürütme organı |
  |---|---|---|
  | Belediye | Belediye meclisi | Belediye başkanı |
  | İl özel idaresi | İl genel meclisi | Vali |
  | Köy | Köy derneği ve ihtiyar meclisi | Muhtar |

  6360 sayılı Kanun (2012) büyükşehir sistemini köklü biçimde değiştirdi. 6360 sayılı Kanun m. 1 sayılan illerde köy ve belde belediyelerinin tüzel kişiliğini kaldırıp mahalleye dönüştürdü, il özel idarelerinin tüzel kişiliğini de kaldırdı. Sonuç: büyükşehirlerde il özel idaresi ve köy yoktur; bu idareler **büyükşehir olmayan illerde** sürer. Büyükşehir belediyesinin sınırı da il mülki sınırıdır (5216 sayılı Kanun m. 5).

  ## 2. Belediye

  ### Kuruluş ve sona erme

  5393 sayılı Kanun m. 4/1'e göre nüfusu **5.000 ve üzerinde** olan yerleşim birimlerinde belediye **kurulabilir**; **il ve ilçe merkezlerinde** belediye kurulması **zorunludur**. Meskûn sahası kurulu bir belediyenin sınırlarına 5.000 metreden daha yakın yerleşimlerde belediye kurulamaz (5393 sayılı Kanun m. 4/2).

  Tüzel kişiliğin sona ermesi de kanunla çizilmiştir (5393 sayılı Kanun m. 11): meskûn sahası il veya ilçe belediyesinin ya da nüfusu 50.000 ve üzerinde bir belediyenin sınırına 5.000 metreden daha yakın hâle gelen belediye ve köyler, imar düzeni veya alt yapı hizmetleri gerektirirse bu belediyeye katılır. Ayrıca **nüfusu 2.000'in altına düşen belediyeler köye dönüştürülür.**

  > **Örnek:** Z beldesinin nüfusu 1.850'ye düşmüştür. Belediye köye dönüştürülür; mal, hak ve borçları köy tüzel kişiliğine geçer (5393 sayılı Kanun m. 11/2). Uygulama zamanı 5393 sayılı Kanun m. 12'de ayrıca düzenlenmiştir.

  **Mahalle**, komşuluk ilişkisi bulunan bir **idari birimdir** (5393 sayılı Kanun m. 3/d); tüzel kişiliği yoktur, muhtar ve ihtiyar heyetince yönetilir (5393 sayılı Kanun m. 9/1). Nüfusu 500'ün altında mahalle kurulamaz (5393 sayılı Kanun m. 9/3).

  ### Görevler ve yetkiler

  Belediye, **mahalli müşterek nitelikte olmak şartıyla** imar, su ve kanalizasyon, ulaşım, çevre ve temizlik, zabıta, itfaiye, şehir içi trafik, defin, park, konut, sosyal hizmet gibi işleri yapar veya yaptırır (5393 sayılı Kanun m. 14/1-a). Büyükşehir belediyeleri ile nüfusu 100.000'in üzerindeki belediyeler kadınlar ve çocuklar için **konukevi açmak zorundadır**. Cemevlerinin yapım, bakım ve onarımı ise **yetkidir, zorunluluk değil** (5393 sayılı Kanun m. 14/1-b). Yetkiler ve imtiyazlar 5393 sayılı Kanun m. 15'te sayılır.

  Su, toplu taşıma ve katı atık hizmetleri **imtiyaz yoluyla** devredilebilir; süre **49 yılı geçemez**, **Danıştayın görüşü** ve Çevre ve Şehircilik Bakanlığının kararı gerekir (5393 sayılı Kanun m. 15).

  > ⚠️ **Sınavda dikkat:** Anayasa Mahkemesi 26/6/2019 tarihli kararıyla 5393 sayılı Kanun m. 14/1-a'daki "yaptırır" ibaresini **itfaiye hizmeti yönünden** iptal etmiştir; itfaiye hizmeti özel kişilere yaptırılamaz.

  ### Organlar

  5393 sayılı Kanun m. 3/b'ye göre belediyenin organları **meclis, encümen ve başkandır**.

  **Belediye meclisi** karar organıdır (5393 sayılı Kanun m. 17); başkanı belediye başkanıdır, başkan katılamazsa birinci, o da katılamazsa ikinci başkan vekili başkanlık eder (5393 sayılı Kanun m. 19/3). Görevleri 5393 sayılı Kanun m. 18'de sayılır: bütçe, imar planı, borçlanma, taşınmaz alım-satımı, **üç yıldan fazla kiralama**, süresi otuz yılı geçmemek kaydıyla sınırlı aynî hak, **şartlı bağış**, yönetmelik, ad verme ve birlik kurma gibi.

  **Belediye encümeni** başkanın başkanlığında oluşur (5393 sayılı Kanun m. 33). İl belediyelerinde ve nüfusu 100.000'in üzerindeki belediyelerde **yedi kişidir** (meclisin seçtiği üç üye, mali hizmetler birim amiri, başkanın seçtiği iki birim amiri ve başkan); diğer belediyelerde **beş kişidir**. Başlıca yetkileri: yıllık çalışma programındaki işlerle ilgili **kamulaştırma kararı** (5393 sayılı Kanun m. 34/b), kanunlardaki cezaları vermek (5393 sayılı Kanun m. 34/e), meclisçe kararlaştırılan taşınmaz satışını uygulamak ve **üç yılı geçmemek üzere kiralamaya karar vermek** (5393 sayılı Kanun m. 34/g).

  **Belediye başkanı** belediye idaresinin başı ve tüzel kişiliğin temsilcisidir (5393 sayılı Kanun m. 37). Meclis ve encümene başkanlık eder, kararları uygular, personeli atar, **şartsız bağışı** kabul eder (5393 sayılı Kanun m. 38).

  | Konu | Yetkili | Dayanak |
  |---|---|---|
  | Taşınmaz satışı, 3 yıldan fazla kiralama | Meclis | 5393 sayılı Kanun m. 18/e |
  | 3 yılı geçmeyen kiralama | Encümen | 5393 sayılı Kanun m. 34/g |
  | Şartlı bağış | Meclis | 5393 sayılı Kanun m. 18/g |
  | Şartsız bağış | Başkan | 5393 sayılı Kanun m. 38/l |
  | Yönetmelik kabulü | Meclis | 5393 sayılı Kanun m. 18/m |
  | Kamulaştırma kararı | Encümen | 5393 sayılı Kanun m. 34/b |

  > 💡 **Püf nokta:** Süre uzadıkça ve işlem kalıcı hâle geldikçe yetki **meclise** kayar; uygulayıcı ve ceza işleri encümene, bağış ve personel gibi yönetim işleri başkana kalır.

  ### Meclis kararlarının akıbeti

  Başkan, hukuka aykırı gördüğü meclis kararını **beş gün** içinde gerekçesiyle iade edebilir. Meclis **üye tam sayısının salt çoğunluğuyla** ısrar ederse karar kesinleşir; başkan, ısrarla kesinleşen karara karşı **on gün** içinde idari yargıya başvurabilir (5393 sayılı Kanun m. 23/1-3). Kesinleşen kararlar en geç **yedi gün** içinde mahallin en büyük mülkî idare amirine gönderilir; **gönderilmeyen kararlar yürürlüğe girmez** (5393 sayılı Kanun m. 23/4).

  > **Örnek:** Meclis, cadde adının değiştirilmesine üye tam sayısının salt çoğunluğuyla karar verdi. Ad **verilmesi** için salt çoğunluk yeter; **değiştirilmesi** için üçte iki gerekir ve karar mülkî idare amirinin onayıyla yürürlüğe girer (5393 sayılı Kanun m. 81).

  ## 3. Büyükşehir belediyesi

  Büyükşehir, AY m. 127/3'teki özel yönetim biçimidir. Toplam nüfusu 750.000'den fazla olan illerin il belediyeleri **kanunla** büyükşehir belediyesine dönüştürülebilir (5216 sayılı Kanun m. 4). Başkan il seçmenlerince doğrudan seçilir (5216 sayılı Kanun m. 17). Büyükşehir belediye meclisi ilgili kanunda gösterilen esaslara göre seçilen üyelerden oluşur ve büyükşehir içindeki diğer belediyelerin başkanları meclisin **doğal üyesidir** (5216 sayılı Kanun m. 12). Encümen, başkan, meclisin seçtiği beş üye ve başkanın seçtiği beş birim amirinden (biri genel sekreter, biri mali hizmetler birim amiri) oluşur; yani **on bir kişidir** (5216 sayılı Kanun m. 16).

  > ⚠️ **Sınavda dikkat:** Bazı kaynaklar büyükşehir meclisini doğrudan seçilmeyen bir yapı olarak anlatır. 5216 sayılı Kanun m. 12'nin bugünkü metni böyle demez: üyeler seçimle gelir, ilçe belediye başkanları doğal üyedir.

  ## 4. İl özel idaresi

  İl özel idaresi, ilin halkının mahalli müşterek ihtiyaçları için kurulan, idari ve mali özerkliğe sahip kamu tüzel kişisidir; organları **il genel meclisi, il encümeni ve validir** (5302 sayılı Kanun m. 3). İlin kurulmasına dair kanunla kurulur (5302 sayılı Kanun m. 4). Sağlık, tarım, sanayi ve ticaret, sosyal hizmet gibi işleri il sınırları içinde; imar, yol, su, katı atık gibi işleri **belediye sınırları dışında** yapar (5302 sayılı Kanun m. 6).

  - **İl genel meclisi** karar organıdır (5302 sayılı Kanun m. 9). Meclis kendi üyeleri arasından gizli oyla **meclis başkanını** seçer; başkan vali değildir (5302 sayılı Kanun m. 11). Taşınmaz konularında üç yıldan fazla kiralama ve süresi **yirmibeş yılı** geçmemek kaydıyla sınırlı aynî hak tesisi meclis kararıyla olur (5302 sayılı Kanun m. 10/f); belediyede bu süre otuz yıldır.
  - **İl encümeni** valinin başkanlığında, genel sekreter, meclisin seçtiği üç üye ve valinin seçtiği iki birim amirinden oluşur; **yedi kişidir** (5302 sayılı Kanun m. 25). Üç yılı geçmeyen kiralama encümenindir (5302 sayılı Kanun m. 26/g).
  - **Vali** il özel idaresinin başı ve tüzel kişiliğin temsilcisidir (5302 sayılı Kanun m. 29); şartsız bağışı kabul eder, personeli atar (5302 sayılı Kanun m. 30).

  Meclis kararlarının tam metni en geç **beş gün** içinde valiye gönderilir; gönderilmeyen karar yürürlüğe girmez. Vali, hukuka aykırı gördüğü kararı **yedi gün** içinde iade edebilir (5302 sayılı Kanun m. 15/1). Bu maddedeki "ısrar" ibaresi ile üçüncü fıkra Anayasa Mahkemesinin 18/1/2007 tarihli kararıyla iptal edilmiştir; belediyedeki ısrar düzenini il genel meclisine uygulamayın.

  ## 5. Köy

  Köy, kendi malı olan ve kanunla verilen işleri yapan **tüzel kişidir** (442 sayılı Kanun m. 7). Her köyde bir **köy derneği**, bir **muhtar** ve bir **ihtiyar meclisi** bulunur; köy derneği, muhtarı ve ihtiyar meclisi azalarını seçmeye hakkı olan köylülerin toplanmasıdır (442 sayılı Kanun m. 20). Muhtar köyün başıdır, aynı zamanda Devlet işlerinde Devletin memuru sayılır (442 sayılı Kanun m. 10). Köyün imamı ile öğretmeni ihtiyar meclisinin **her zaman azasıdır** (442 sayılı Kanun m. 23).

  Köy işleri **zorunlu** ve **isteğe bağlı** olarak ayrılır; isteğe bağlı iş, köy derneğinin yarısından çoğunun kararı ve vali ya da kaymakamın rızasıyla zorunlu hâle gelebilir (442 sayılı Kanun m. 12).

  ## 6. Merkezi idarenin idari vesayeti

  **İdari vesayet**, merkezi idarenin mahalli idareler üzerindeki denetim yetkisidir. AY m. 127/5'e göre merkezi idare, mahalli hizmetlerin idarenin bütünlüğü ilkesine uygun yürütülmesi, kamu görevlerinde birliğin sağlanması, toplum yararının korunması ve mahalli ihtiyaçların gereği gibi karşılanması amacıyla, **kanunda belirtilen esas ve usuller dairesinde** idari vesayet yetkisine sahiptir.

  Vesayet **hiyerarşi değildir**: hiyerarşik amir emir verir ve işlemi değiştirir; vesayet makamı ise yalnız kanunun öngördüğü araçları, öngörülen şartlarla kullanabilir.

  ### Kişilere yönelik vesayet

  - **Geçici uzaklaştırma:** Görevleriyle ilgili bir suç nedeniyle soruşturma veya kovuşturma açılan organ ya da üyeler **kesin hükme kadar İçişleri Bakanı** tarafından uzaklaştırılabilir (AY m. 127/4; 5393 sayılı Kanun m. 47/1). Karar **iki ayda bir** gözden geçirilir; devamında kamu yararı yoksa kaldırılır. Uzaklaştırılan başkana aylık ödeneğinin **üçte ikisi** ödenir (5393 sayılı Kanun m. 47/2 ve 5393 sayılı Kanun m. 47/4).
  - **Fesih:** Meclis, kanunla verilen görevleri süresi içinde yapmayı ihmal eder ve bu durum işleri aksatırsa ya da belediyeye verilen görevlerle ilgisiz **siyasi konularda karar alırsa**, **İçişleri Bakanlığının bildirimi üzerine Danıştayın kararıyla** feshedilir (5393 sayılı Kanun m. 30). Aynı düzen il genel meclisi için de vardır (5302 sayılı Kanun m. 22).
  - **Başkanlığın sona ermesi:** Mazeretsiz ve kesintisiz yirmi günden fazla görevi terk, seçilme yeterliğinin kaybı, rapora bağlı hastalık ya da engellilik, meclisin feshine neden olan eylemlere katılma hâllerinde **İçişleri Bakanlığının başvurusu üzerine Danıştay** karar verir (5393 sayılı Kanun m. 44). Meclis, faaliyet raporunu üye tam sayısının dörtte üç çoğunluğuyla yetersiz bulursa dosya vali aracılığıyla Danıştaya gider; Danıştay uygun görürse başkan başkanlıktan düşer (5393 sayılı Kanun m. 26/4-6).

  Dayanak AY m. 127/4'tür: organlık sıfatının **kaybedilmesi** denetimi **yargı yolu ile** olur. Bu istemleri Danıştay inceler (2575 sayılı Kanun m. 24/2).

  > ⚠️ **Sınavda dikkat:** İçişleri Bakanı yalnız **geçici** tedbir alır. Vali, Bakan ya da Cumhurbaşkanı meclisi **feshedemez** ve başkanı **kesin olarak** görevden alamaz; bu iş Danıştaya aittir.

  ### Başkanlık boşalırsa

  Vali, meclisin **on gün** içinde toplanmasını sağlar; başkan görevden uzaklaştırılır veya tutuklanırsa meclis **başkan vekili**, başkanlık boşalırsa **başkan** seçer. Seçim **gizli oyla**, meclis üyeleri arasından yapılır; ilk iki oylamada üye tam sayısının üçte ikisi, üçüncüde salt çoğunluk aranır (5393 sayılı Kanun m. 45/1 ve 5393 sayılı Kanun m. 45/3). Terör veya terör örgütlerine yardım ve yataklık suçlarında ise büyükşehir ve il belediyelerinde İçişleri Bakanı, diğerlerinde vali **görevlendirir** (5393 sayılı Kanun m. 45/2 ve 5393 sayılı Kanun m. 46).

  ### İşlemlere yönelik vesayet ve birlikler

  Mahalli idarelerin belirli kamu hizmetleri için kuracakları **birlikler Cumhurbaşkanının izni ile** kurulur (AY m. 127/6). Belediye meclisi birlik kurulmasına karar verir (5393 sayılı Kanun m. 18/o), ancak izin merkezi idareden gelir. Mali işlemler dışındaki idari işlemler ise İçişleri Bakanlığınca idarenin bütünlüğü açısından da denetlenir (5393 sayılı Kanun m. 55/3; 5302 sayılı Kanun m. 38/3).

  ## 7. Güncel değişiklikler

  📌 5393 sayılı Kanun m. 4 ve 5393 sayılı Kanun m. 11'in bazı cümle ve fıkraları, Anayasa Mahkemesinin **7/12/2023 tarihli ve E.2018/117, K.2023/212** sayılı kararıyla iptal edilmiştir. 18/6/2025 tarihli **7551 sayılı Kanun** bu hükümleri yeniden düzenlemiştir. Güncel metinde: dosya valinin görüşüyle Çevre ve Şehircilik Bakanlığına gönderilir ve o yerde belediye kurulabilir (5393 sayılı Kanun m. 4/5); yeni iskân nedeniyle oluşan ve nüfusu 5.000 ve üzerinde olan yerleşimde de belediye kurulabilir (5393 sayılı Kanun m. 4/6); katılma ve köye dönüşme hükümleri 5393 sayılı Kanun m. 11'de yeniden yazılmıştır. Cemevi yetkisi 7421 sayılı Kanunla (2022) eklenmiştir (5393 sayılı Kanun m. 14/1-b; 5302 sayılı Kanun m. 6).
kritik: |
  - 📌 **Anayasal tanım:** Karar organları seçmenlerce seçilir (AY m. 127/1). Yürütme organının seçilmesi Anayasa'dan gelen bir şart değildir; vali atanır.
  - 📌 **Üç tür:** belediye, il özel idaresi, köy. Büyükşehir, "özel yönetim biçimi" olarak AY m. 127/3'e dayanır; seçim beş yılda bir yapılır.
  - 📌 **Belediye kurma:** nüfus 5.000 ve üzeri → kurulabilir; il ve ilçe merkezi → zorunlu (5393 sayılı Kanun m. 4). Nüfusu 2.000'in altına düşen belediye köye dönüşür (5393 sayılı Kanun m. 11).
  - ⚠️ **Mahalle ≠ köy:** Mahallenin tüzel kişiliği yoktur (5393 sayılı Kanun m. 3/d); köy tüzel kişidir (442 sayılı Kanun m. 7). Nüfusu 500'ün altında mahalle kurulamaz (5393 sayılı Kanun m. 9).
  - 📌 **Encümen sayısı:** İl belediyeleri ve nüfusu 100.000'i aşan belediyelerde 7, diğerlerinde 5 kişi (5393 sayılı Kanun m. 33). İl encümeni 7 kişidir ve başkanı validir (5302 sayılı Kanun m. 25). Büyükşehir encümeni 11 kişidir (5216 sayılı Kanun m. 16).
  - ⚠️ **Meclis başkanı:** Belediye meclisine belediye başkanı başkanlık eder (5393 sayılı Kanun m. 19); il genel meclisi kendi başkanını seçer, vali encümene başkanlık eder (5302 sayılı Kanun m. 11 ve 5302 sayılı Kanun m. 25).
  - 📌 **Kiralama ve ayni hak:** 3 yılı geçmeyen kiralama encümende, 3 yıldan fazlası meclistedir. Sınırlı aynî hak süresi belediyede en çok 30, il özel idaresinde en çok 25 yıldır (5393 sayılı Kanun m. 18/e; 5302 sayılı Kanun m. 10/f).
  - 📌 **Bağış:** şartlı bağış meclise, şartsız bağış başkana ya da valiye aittir (5393 sayılı Kanun m. 18/g; 5393 sayılı Kanun m. 38/l; 5302 sayılı Kanun m. 30/l).
  - 📌 **Meclis kararı:** başkan 5 gün içinde iade eder, meclis salt çoğunlukla ısrar ederse karar kesinleşir, başkan 10 gün içinde dava açabilir; kararlar 7 gün içinde mülkî amire gönderilmezse yürürlüğe girmez (5393 sayılı Kanun m. 23). İl genel meclisinde gönderme 5, vali iadesi 7 gündür (5302 sayılı Kanun m. 15).
  - 📌 **Ad verme:** Ad vermede üye tam sayısının salt çoğunluğu, değiştirmede üçte ikisi aranır; kararlar mülkî amirin onayıyla yürürlüğe girer (5393 sayılı Kanun m. 81).
  - ⚠️ **Vesayet:** İçişleri Bakanı geçici uzaklaştırır; meclisi Danıştay (Bakanlığın bildirimi üzerine) feshe eder; başkanlık sıfatını Danıştay sona erdirir (AY m. 127/4; 5393 sayılı Kanun m. 30; 5393 sayılı Kanun m. 44; 5393 sayılı Kanun m. 47).
  - 📌 **Birlik ve imtiyaz:** Mahalli idare birliği Cumhurbaşkanının izniyle kurulur (AY m. 127/6); su, toplu taşıma ve katı atık hizmetlerinde imtiyaz süresi 49 yılı aşamaz ve Danıştay görüşü gerekir (5393 sayılı Kanun m. 15).
doktrin: |
  ### Büyükşehir düzeni ve yerinden yönetim ilkesi

  6360 sayılı Kanun'la büyükşehir sayılan illerde il özel idaresinin ve köylerin tüzel kişiliği kaldırıldı. AY m. 127/1 mahalli idareleri "il, belediye veya köy" olarak sayar. Bu yüzden bir görüş, il özel idaresi ve köy gibi **anayasal türlerin** kaldırılmasının yerinden yönetim ilkesine aykırı olduğunu savunur. Karşı görüş, AY m. 127/3'teki "büyük yerleşim merkezleri için özel yönetim biçimleri" yetkisinin kanun koyucuya bu esnekliği verdiğini, bu nedenle büyükşehir illerinde ayrı bir il özel idaresine gerek bulunmadığını söyler. Sınavda her iki görüş de bilinmeli; ancak yürürlükteki hukuk (6360 sayılı Kanun m. 1) esas alınır.

  ### Terör suçlarında başkan vekili görevlendirmesi

  5393 sayılı Kanun m. 45 genel kuralda **meclisin** kendi üyeleri arasından başkan vekili seçmesini öngörür. Terör veya terör örgütlerine yardım ve yataklık suçlarında ise büyükşehir ve il belediyelerinde İçişleri Bakanı, diğer belediyelerde vali kişiyi **görevlendirir** (5393 sayılı Kanun m. 45/2; 5393 sayılı Kanun m. 46). Eleştiri şudur: AY m. 127/1 karar organlarının seçmenlerce oluşturulmasını arar; atanmış bir kişinin başkanlık görevini yürütmesi **seçilmişlik** ve yerinden yönetim ilkesiyle bağdaşmaz. Diğer görüş, geçici nitelikteki görevlendirmeyi vesayetin bir uzantısı ve kamu düzeni tedbiri sayar. Konu tartışmalıdır; olay ve sorularda bu tartışma sonuca bağlanmaz.

  ### Vesayet ile hiyerarşinin ayrımı

  Tartışmasız ilke: vesayet makamı, yalnız kanunun verdiği yetkiyi ve kanunun gösterdiği usulle kullanır; emir veremez, mahalli idarenin işlemini kendiliğinden değiştiremez. Uygulamada onay, iptal ve yerine geçme gibi araçlar birbirine karıştırılır; her vakada önce "bu yetkiyi hangi kanun maddesi veriyor?" sorusu sorulmalıdır.
sozluk:
  - terim: Mahalli idare
    tanim: "İl, belediye veya köy halkının mahalli müşterek ihtiyaçlarını karşılamak üzere kurulan, karar organları seçmenlerce seçilen kamu tüzel kişisi (AY m. 127/1)."
  - terim: İdari vesayet
    tanim: "Merkezi idarenin, mahalli idarelere karşı yalnızca kanunda gösterilen esas ve usullerle kullandığı denetim yetkisi (AY m. 127/5). Hiyerarşi değildir."
  - terim: Karar organı
    tanim: "Mahalli idarenin kararlarını veren, seçmenlerce seçilen organ: belediye meclisi, il genel meclisi, köyde köy derneği ve ihtiyar meclisi."
  - terim: Encümen
    tanim: "Belediyede başkanın, il özel idaresinde valinin başkanlığında toplanan, seçilmiş ve atanmış üyelerden oluşan yürütmeye yakın organ."
  - terim: Belde
    tanim: "Belediyesi bulunan yerleşim yeri (5393 sayılı Kanun m. 3/c)."
  - terim: Mahalle
    tanim: "Belediye sınırları içinde komşuluk ilişkisi bulunan idari birim; kamu tüzel kişiliği yoktur (5393 sayılı Kanun m. 3/d)."
  - terim: Büyükşehir belediyesi
    tanim: "Büyük yerleşim merkezleri için getirilmiş özel yönetim biçimi; sınırı il mülki sınırıdır (5216 sayılı Kanun m. 5)."
  - terim: Muhtar
    tanim: "Köyün başı; köy işlerinde karar yetkilisi, Devlet işlerinde Devletin memuru sayılır (442 sayılı Kanun m. 10)."
  - terim: Görevden uzaklaştırma
    tanim: "Görevle ilgili suçtan soruşturulan organın İçişleri Bakanınca kesin hükme kadar geçici olarak görevden uzaklaştırılması (AY m. 127/4)."
  - terim: İmtiyaz
    tanim: "Belediyece yürütülen su, toplu taşıma ve katı atık hizmetlerinin en çok 49 yıl süreyle devri; Danıştay görüşü ve Bakanlık kararı gerekir (5393 sayılı Kanun m. 15)."
kararlar: []
sorular:
  - soru: |
      AY m. 127/1'e göre mahalli idarelerde seçmenler tarafından seçilerek oluşturulması gereken organlar aşağıdakilerden hangisidir?
    siklar:
      - "Karar organları"
      - "Karar ve yürütme organlarının tamamı"
      - "Yalnız yürütme organları"
      - "Yalnız encümen"
    dogru: 0
    aciklama: |
      Anayasa yalnız karar organlarının seçilmesini zorunlu kılar. Bu yüzden il özel idaresinin yürütme organı olan valinin atanması Anayasa'ya aykırı değildir. Belediye başkanının seçilmesi ise Anayasa'dan değil ilgili kanundan gelir (AY m. 127/1; 5302 sayılı Kanun m. 3).
  - soru: |
      Nüfusu 3.400 olan bir ilçenin merkezinde belediye yoktur. Bu durumla ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İlçe merkezinde belediye kurulması zorunludur; 5.000 nüfus şartı il ve ilçe merkezleri için aranmaz."
      - "Nüfus 5.000'in altında olduğu için belediye hiçbir şekilde kurulamaz."
      - "İlçe merkezi ancak köy olarak kalabilir."
      - "Belediye kurulması, nüfus 5.000'e ulaşıncaya kadar yasaktır."
    dogru: 0
    aciklama: |
      Nüfusu 5.000 ve üzerindeki yerleşim birimlerinde belediye kurulabilir; il ve ilçe merkezlerinde ise belediye kurulması zorunludur (5393 sayılı Kanun m. 4/1). Yaygın yanılgı, 5.000 şartını ilçe merkezlerine de uygulamaktır.
  - soru: |
      Nüfusu 120.000 olan X Belediyesinin encümeni, belediyeye ait bir iş hanının 5 yıl süreyle kiralanmasına karar vermiştir. Bu karar hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Karar yetki yönünden hukuka aykırıdır; üç yıldan fazla kiralamaya karar verme yetkisi meclistedir."
      - "Karar hukuka uygundur; kiralama bütün süreler için encümenin yetkisindedir."
      - "Karar hukuka aykırıdır; çünkü kiralama bütünüyle belediye başkanının yetkisindedir."
      - "Karar hukuka uygundur; çünkü nüfusu 100.000'i aşan belediyelerde encümenin yetkisi süreden bağımsızdır."
    dogru: 0
    aciklama: |
      Encümen süresi üç yılı geçmemek üzere kiralamaya karar verebilir (5393 sayılı Kanun m. 34/g). Üç yıldan fazla kiralamaya karar vermek ise meclisin görevidir (5393 sayılı Kanun m. 18/e). Nüfus ölçütü yalnız encümenin üye sayısını etkiler (5393 sayılı Kanun m. 33).
  - soru: |
      Belediyeye yapılan bağışlarla ilgili aşağıdaki eşleştirmelerden hangisi doğrudur?
    siklar:
      - "Şartlı bağışı meclis, şartsız bağışı belediye başkanı kabul eder."
      - "Şartlı bağışı belediye başkanı, şartsız bağışı meclis kabul eder."
      - "Her iki bağışı da encümen kabul eder."
      - "Şartlı bağışı encümen, şartsız bağışı meclis kabul eder."
    dogru: 0
    aciklama: |
      Şartlı bağışları kabul etmek meclisin görevidir (5393 sayılı Kanun m. 18/g). Şartsız bağışları kabul belediye başkanının yetkisindedir (5393 sayılı Kanun m. 38/l). İl özel idaresinde de aynı düzen geçerlidir: şartlı bağış il genel meclisinde, şartsız bağış valide.
  - soru: |
      Belediye başkanı hukuka aykırı bulduğu bir meclis kararını geri göndermiştir. Aşağıdakilerden hangisi 5393 sayılı Kanun m. 23'teki düzene uygundur?
    siklar:
      - "Başkan kararı 5 gün içinde iade eder; meclis üye tam sayısının salt çoğunluğuyla ısrar ederse karar kesinleşir ve başkan 10 gün içinde idari yargıya başvurabilir."
      - "Başkan kararı 10 gün içinde iade eder; meclis üye tam sayısının üçte ikisiyle ısrar ederse karar kesinleşir ve başkan 5 gün içinde idari yargıya başvurabilir."
      - "Başkan kararı 7 gün içinde iade eder; ısrar edilirse karar kendiliğinden iptal olur."
      - "Başkan iade edemez; yalnızca valiye bildirir ve vali kararı iptal eder."
    dogru: 0
    aciklama: |
      Başkan, hukuka aykırı gördüğü kararı beş gün içinde iade edebilir; meclis üye tam sayısının salt çoğunluğuyla ısrar ederse karar kesinleşir ve başkan on gün içinde idari yargıya başvurabilir (5393 sayılı Kanun m. 23/1-3). Yedi gün ise kesinleşen kararların mülkî idare amirine gönderilme süresidir.
  - soru: |
      Belediye meclisi, belediyeye verilen görevlerle ilgisi olmayan siyasi bir konuda karar almıştır. Vali, meclisi feshettiğini duyurmuştur. Bu işlem hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Meclis, ancak İçişleri Bakanlığının bildirimi üzerine Danıştayın kararıyla feshedilebilir; valinin işlemi yetkisizdir."
      - "Meclis, İçişleri Bakanının kararıyla feshedilir; vali bunu uygular."
      - "Meclisi fesih yetkisi valide olup Danıştay yalnız itiraz mercidir."
      - "Siyasi konuda karar alan meclis kendiliğinden düşer; kimsenin kararı gerekmez."
    dogru: 0
    aciklama: |
      Kanunla verilen görevleri ihmal eden ya da görevleriyle ilgisiz siyasi konularda karar alan meclis, İçişleri Bakanlığının bildirimi üzerine Danıştayın kararıyla feshedilir (5393 sayılı Kanun m. 30). Bu, kişiye yönelik idari vesayetin yargı güvencesidir (AY m. 127/4-5).
  - soru: |
      İlçe belediye başkanı Y hakkında, görevi sırasındaki bir imar işlemi nedeniyle görevi kötüye kullanma suçundan kovuşturma açılmıştır. İçişleri Bakanı ne yapabilir?
    siklar:
      - "Y'yi geçici tedbir olarak kesin hükme kadar görevden uzaklaştırabilir; karar iki ayda bir gözden geçirilir."
      - "Y'nin başkanlık sıfatını kesin olarak sona erdirebilir."
      - "Y'yi ancak mahkeme kararıyla uzaklaştırabilir; Bakanın yetkisi yoktur."
      - "Y'yi altı ay uzaklaştırabilir; süre dolunca Y kendiliğinden göreve döner."
    dogru: 0
    aciklama: |
      Görevle ilgili suç nedeniyle soruşturma ya da kovuşturma açılan organlar kesin hükme kadar İçişleri Bakanı tarafından görevden uzaklaştırılabilir; karar iki ayda bir gözden geçirilir (AY m. 127/4; 5393 sayılı Kanun m. 47/1-2). Kesin olarak başkanlık sıfatının sona ermesi ise Danıştay kararıyla olur (5393 sayılı Kanun m. 44).
  - soru: |
      İl özel idaresi organlarıyla ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İl genel meclisi başkanını kendi üyeleri arasından seçer; il encümenine vali başkanlık eder."
      - "İl genel meclisine vali başkanlık eder; il encümenini meclis başkanı yönetir."
      - "Hem il genel meclisine hem il encümenine vali başkanlık eder."
      - "İl genel meclisi başkanı Cumhurbaşkanınca atanır."
    dogru: 0
    aciklama: |
      İl genel meclisi, kendi üyeleri arasından gizli oyla meclis başkanını seçer (5302 sayılı Kanun m. 11). İl encümeni ise valinin başkanlığında toplanır (5302 sayılı Kanun m. 25). Belediyede bu ayrım yoktur: belediye başkanı hem meclise hem encümene başkanlık eder.
  - soru: |
      Mahalle ve köy karşılaştırmasıyla ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Köy kamu tüzel kişisidir; mahalle belediye sınırları içinde tüzel kişiliği olmayan idari birimdir."
      - "İkisi de kamu tüzel kişisidir ve ikisinin de karar organı seçimle gelir."
      - "Mahalle tüzel kişidir; köy ise belediyenin idari birimidir."
      - "Ne mahalle ne köy tüzel kişidir; yalnız belediye tüzel kişidir."
    dogru: 0
    aciklama: |
      Köy, kendi malı olan ve kanunla verilen işleri gören bir tüzel kişidir (442 sayılı Kanun m. 7). Mahalle ise belediye sınırları içinde komşuluk ilişkisine dayanan bir idari birimdir ve kamu tüzel kişiliği yoktur (5393 sayılı Kanun m. 3/d).
  - soru: |
      Belediye meclisi, bir caddenin adının değiştirilmesine üye tam sayısının salt çoğunluğuyla karar vermiştir. Bu kararla ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Değiştirme için üye tam sayısının üçte ikisi aranır ve karar mülkî idare amirinin onayıyla yürürlüğe girer; salt çoğunlukla alınan karar yetersizdir."
      - "Salt çoğunluk yeterlidir ve karar derhal yürürlüğe girer."
      - "Ad değiştirme yetkisi encümene aittir, meclis kararı geçersizdir."
      - "Üçte iki çoğunluk gerekir fakat mülkî idare amirinin onayı aranmaz."
    dogru: 0
    aciklama: |
      Ad verilmesinde üye tam sayısının salt çoğunluğu, değiştirilmesinde üçte ikisi aranır; bu kararlar mülkî idare amirinin onayıyla yürürlüğe girer (5393 sayılı Kanun m. 81). Ad verme ve değiştirme kararını meclis alır (5393 sayılı Kanun m. 18/n).
  - soru: |
      Köy organlarıyla ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Köy muhtarı ve ihtiyar meclisi azaları köy derneği tarafından seçilir; köyün imamı ile öğretmeni ihtiyar meclisinin her zaman azasıdır."
      - "Köy muhtarı kaymakamca atanır; ihtiyar meclisi yoktur."
      - "Köy derneği yalnızca imam ve öğretmenden oluşur."
      - "Muhtar ihtiyar meclisinin dışındadır; imam ve öğretmen ihtiyar meclisine giremez."
    dogru: 0
    aciklama: |
      Köyde köy derneği, muhtar ve ihtiyar meclisi bulunur; muhtar ve ihtiyar meclisi azaları köy derneği tarafından seçilir (442 sayılı Kanun m. 20). Köyün imamı ile öğretmeni ihtiyar meclisinin her zaman azasıdır (442 sayılı Kanun m. 23).
  - soru: |
      Üç belediye, ortak bir atık yönetimi hizmeti için aralarında birlik kurmak istemektedir. Belediye meclisleri birlik kurulmasına karar vermiştir. Hangi izin gereklidir?
    siklar:
      - "Cumhurbaşkanının izni"
      - "Valinin izni"
      - "Danıştayın izni"
      - "Hiçbir izin gerekmez; meclis kararı yeterlidir."
    dogru: 0
    aciklama: |
      Mahalli idareler belirli kamu hizmetleri için kendi aralarında birlik kurmak istediklerinde bunu Cumhurbaşkanının izni ile yapar (AY m. 127/6). Birlik kurulmasına karar vermek belediye meclisinin görevidir (5393 sayılı Kanun m. 18/o); ancak kararın tek başına yeterli olmadığı vesayetin bir örneğidir.
olaylar:
  - olay: |
      Nüfusu 120.000 olan X Belediyesinin Belediye Başkanı B, belediyeye ait iş hanının bir ticaret şirketine beş yıl süreyle kiralanmasına ve merkezdeki "Çınar Caddesi"nin adının değiştirilmesine doğrudan belediye encümeni kararıyla onay vermiştir. Encümen kararlarını alırken meclisin onayını aramamıştır. B, ayrıca bir iş insanının belediyeye bağışladığı taşınmazı, "yalnızca spor tesisi yapılmak şartıyla" kabul ettiğini belirten bir işlem yapmıştır. Bu arada belediye meclisi, belediye hizmetleriyle ilgisi olmayan siyasi bir bildiri yayımlamış; Vali V, meclisi doğrudan feshettiğini açıklamıştır.

      1. Encümen kararı yetki bakımından hukuka uygun mudur?
      2. Cadde adının değiştirilmesi için hangi çoğunluk ve hangi onay gerekir?
      3. Şartlı bağışı kimin kabul etmesi gerekir?
      4. Valinin feshi hukuka uygun mudur? Fesih yetkilisi kimdir?
      5. Encümen kaç kişiden oluşur?
      6. Meclisin feshi ya da toplantılarının ertelenmesi hâlinde meclisin görevini kim yürütür?
    olcut:
      - {tespit: "Beş yıllık kiralama yetkisinin meclise, encümenin ise yalnız üç yılı geçmeyen kiralamaya yetkili olduğu", puan: 25, madde: "5393 sayılı Kanun m. 34/g"}
      - {tespit: "Cadde adının değiştirilmesinde üye tam sayısının üçte ikisi ve mülkî idare amirinin onayı", puan: 15, madde: "5393 sayılı Kanun m. 81"}
      - {tespit: "Şartlı bağışı kabul yetkisinin meclise, şartsız bağışın başkana ait olduğu", puan: 15, madde: "5393 sayılı Kanun m. 18/g"}
      - {tespit: "Meclisin feshinin İçişleri Bakanlığının bildirimi üzerine Danıştay kararıyla yapılabileceği, valinin yetkisiz olduğu", puan: 25, madde: "5393 sayılı Kanun m. 30"}
      - {tespit: "Nüfusu 100.000'in üzerindeki belediyede encümenin yedi kişiden oluştuğu", puan: 10, madde: "5393 sayılı Kanun m. 33"}
      - {tespit: "Fesih ya da erteleme hâlinde meclisin görevini encümenin memur üyelerinin yürüttüğü", puan: 10, madde: "5393 sayılı Kanun m. 31"}
    cozum: |
      **Nitelendirme:** Olay, belediye organları arasındaki yetki dağılımını ve mahalli idare organlarının feshinde işleyen idari vesayeti sınar. Belediye, AY m. 127/1'deki mahalli idare niteliğini taşır; kararlarda yetkili organ kanunla belirlendiği için yetki, kanunun saydığı organa göre incelenir.

      **Hukuki sorunlar:** (1) kiralamada yetkili organ; (2) ad değiştirmede çoğunluk ve onay; (3) bağışı kabul yetkilisi; (4) fesih mercii; (5) encümen yapısı; (6) meclisin görevini yürütecek organ.

      **İlgili hükümler ve değerlendirme:** Süresi üç yılı geçmemek üzere kiralamaya karar vermek encümenin görevidir (5393 sayılı Kanun m. 34/g); üç yıldan fazla kiralamaya karar vermek ise meclisin görevidir (5393 sayılı Kanun m. 18/e). Beş yıllık kiralama üç yılı aştığı için encümenin kararı yetki yönünden hukuka aykırıdır. Cadde, sokak ve benzerlerinin adının değiştirilmesinde meclis üye tam sayısının üçte ikisinin kararı aranır ve karar mülkî idare amirinin onayıyla yürürlüğe girer (5393 sayılı Kanun m. 81); encümen bu konuda yetkili değildir, ad verme ve değiştirme kararı meclisindir (5393 sayılı Kanun m. 18/n). Şartlı bağışı kabul meclisin görevidir (5393 sayılı Kanun m. 18/g); belediye başkanı yalnız şartsız bağışı kabul edebilir (5393 sayılı Kanun m. 38/l). Spor tesisi yapılması şartı bağışı şartlı yaptığı için B'nin tek başına kabulü yetki yönünden hukuka aykırıdır.

      Meclis, kanunla verilen görevleri ihmal eder ya da belediyeye verilen görevlerle ilgisi olmayan siyasi konularda karar alırsa İçişleri Bakanlığının bildirimi üzerine Danıştayın kararıyla feshedilir (5393 sayılı Kanun m. 30). Vali bu karar sürecinde yetkili değildir; meclisi doğrudan feshetmesi yetkisizlik nedeniyle hukuka aykırıdır. Bu, AY m. 127/5'te kabul edilen idari vesayetin ancak kanundaki usulle kullanılabileceğini gösterir. Nüfusu 100.000'in üzerindeki belediyelerde encümen, başkanın başkanlığında yedi kişiden oluşur (5393 sayılı Kanun m. 33). Meclisin Danıştay tarafından feshi veya toplantılarının ertelenmesi hâlinde, meclis çalışabilir duruma gelinceye veya yeni meclis seçilinceye kadar meclisin görevi encümenin memur üyelerince yürütülür (5393 sayılı Kanun m. 31).

      **Sonuç:** Encümen kararı, cadde adı değişikliği ve şartlı bağışın encümen veya başkanca kabulü hukuka aykırıdır. Meclisin feshi yalnız İçişleri Bakanlığının bildirimi üzerine Danıştay kararıyla mümkündür; valinin işlemi yetkisizdir. Encümen yedi kişidir ve meclisin görevi fesih hâlinde encümenin memur üyelerince yürütülür.
  - olay: |
      Y, nüfusu 85.000 olan bir ilçe belediyesinin başkanıdır. Hakkında, belediyenin imar uygulamaları sırasında yapı ruhsatı verirken görevi kötüye kullanma suçundan kovuşturma açılmıştır; dava terör suçlarıyla ilgili değildir. İçişleri Bakanı, Y'yi kesin hükme kadar görevden uzaklaştırmıştır. Ardından Vali, belediye meclisini toplamadan kendi yardımcısını başkan vekili olarak görevlendirmiştir. Y'nin ayrıca "mazeretsiz olarak yirmi günden fazla görevini terk ettiği" iddiasıyla başkanlık sıfatının sona erdirilmesi gündeme gelmiştir.

      1. İçişleri Bakanının Y'yi görevden uzaklaştırması hukuka uygun mudur? Karar bakımından hangi güvenceler vardır?
      2. Valinin başkan vekili görevlendirmesi hukuka uygun mudur?
      3. Başkan vekili nasıl ve hangi çoğunlukla seçilir?
      4. Başkanlık sıfatının kesin olarak sona ermesine kim karar verir?
    olcut:
      - {tespit: "Görevle ilgili suçtan kovuşturma açılan organın İçişleri Bakanınca kesin hükme kadar geçici olarak uzaklaştırılabileceği", puan: 20, madde: "AY m. 127/4"}
      - {tespit: "Kararın iki ayda bir gözden geçirilmesi ve uzaklaştırılan başkana aylık ödeneğin üçte ikisinin ödenmesi", puan: 15, madde: "5393 sayılı Kanun m. 47"}
      - {tespit: "Terör kaynaklı olmayan uzaklaştırmada valinin görevlendirme yetkisinin bulunmadığı, başkan vekilini meclisin seçeceği", puan: 25, madde: "5393 sayılı Kanun m. 45/1"}
      - {tespit: "Başkan vekilinin meclis üyeleri arasından gizli oyla, ilk iki oylamada üçte iki, üçüncüde salt çoğunlukla seçilmesi", puan: 15, madde: "5393 sayılı Kanun m. 45/3"}
      - {tespit: "Seçimin on beş günde tamamlanmaması hâlinde fesih hükümlerinin uygulanması", puan: 10, madde: "5393 sayılı Kanun m. 45/7"}
      - {tespit: "Başkanlık sıfatının sona ermesine İçişleri Bakanlığı başvurusu üzerine Danıştayın karar vermesi", puan: 15, madde: "5393 sayılı Kanun m. 44"}
    cozum: |
      **Nitelendirme:** Olay, belediye başkanına yönelik idari vesayet araçlarını (geçici uzaklaştırma, başkanlık sıfatının kesin sona ermesi) ve başkan vekili seçimini sınar. Y'nin kovuşturulduğu suç terör suçu değildir; bu nokta sonucu belirler.

      **Hukuki sorunlar:** (1) uzaklaştırma yetkisi ve güvenceler; (2) boşalan görevin yürütülmesi; (3) başkan vekili seçimi; (4) kesin sıfat kaybında yetkili merci.

      **İlgili hükümler ve değerlendirme:** Görevleriyle ilgili bir suç nedeniyle haklarında soruşturma veya kovuşturma açılan mahalli idare organları ya da üyeleri, İçişleri Bakanı tarafından geçici bir tedbir olarak kesin hükme kadar uzaklaştırılabilir (AY m. 127/4). Aynı yetki Belediye Kanunu'nda da düzenlenmiştir; karar iki ayda bir gözden geçirilir, uzaklaştırılan başkana aylık ödeneğinin üçte ikisi ödenir (5393 sayılı Kanun m. 47). İmar uygulamasındaki görevi kötüye kullanma, görevle ilgili suç olduğundan Bakanın işlemi hukuka uygundur.

      Başkanın görevden uzaklaştırılması hâlinde vali, belediye meclisinin on gün içinde toplanmasını sağlar; meclis başkan vekilini seçer (5393 sayılı Kanun m. 45/1). Başkan vekilinin meclis yerine görevlendirme yoluyla belirlenmesi ancak terör veya terör örgütlerine yardım ve yataklık suçlarında mümkündür; bu durumda büyükşehir ve il belediyelerinde İçişleri Bakanı, diğer belediyelerde vali görevlendirir (5393 sayılı Kanun m. 45/2; 5393 sayılı Kanun m. 46). Olayda suç terör suçu olmadığından bu istisna uygulanamaz; valinin işlemi yetkisizdir. Başkan vekili meclis üyeleri arasından gizli oyla seçilir; ilk iki oylamada üye tam sayısının üçte ikisi, üçüncüde salt çoğunluk aranır (5393 sayılı Kanun m. 45/3). Seçim en geç on beş gün içinde tamamlanmazsa meclisin feshine ilişkin hükümler uygulanır (5393 sayılı Kanun m. 45/7). Seçim yapılıncaya kadar başkanlık görevi meclis birinci başkan vekili tarafından yürütülür (5393 sayılı Kanun m. 45/6).

      Mazeretsiz ve kesintisiz yirmi günden fazla görevi terk iddiası söz konusu olursa, durumun mülkî idare amirince belirlenmesi ve İçişleri Bakanlığının başvurusuyla Danıştayın karar vermesi gerekir (5393 sayılı Kanun m. 44). Bu karar ancak yargı organı tarafından verilir; AY m. 127/4 de organlık sıfatının kaybı bakımından denetimin yargı yoluyla olduğunu belirtir.

      **Sonuç:** Bakanın geçici uzaklaştırması hukuka uygundur; valinin görevlendirmesi hukuka aykırıdır, başkan vekilini meclis seçer. Başkanlık sıfatının kesin sona ermesine yalnız Danıştay karar verebilir.
kartlar:
  - on: "Mahalli idare nedir (AY m. 127/1)?"
    arka: "İl, belediye veya köy halkının mahalli müşterek ihtiyaçlarını karşılamak üzere kurulan, karar organları seçmenlerce seçilen kamu tüzel kişisidir."
  - on: "Anayasa mahalli idarelerde hangi organların seçilmesini şart koşar?"
    arka: "Yalnız karar organlarını. Yürütme organı (ör. vali) atanabilir (AY m. 127/1)."
  - on: "Belediye kurma nüfus şartı ve istisnası nedir?"
    arka: "Nüfus 5.000 ve üzeri → kurulabilir; il ve ilçe merkezlerinde kurulması zorunludur (5393 sayılı Kanun m. 4)."
  - on: "Hangi belediyeler köye dönüştürülür?"
    arka: "Nüfusu 2.000'in altına düşen belediyeler (5393 sayılı Kanun m. 11)."
  - on: "Belediye organları ve encümen sayısı?"
    arka: "Meclis, encümen, başkan. Encümen: il belediyelerinde ve nüfusu 100.000'in üzerindeki belediyelerde 7, diğerlerinde 5 kişi (5393 sayılı Kanun m. 3/b; 5393 sayılı Kanun m. 33)."
  - on: "3 yılı geçmeyen / 3 yıldan fazla kiralamaya kim karar verir?"
    arka: "3 yılı geçmeyen: encümen (5393 sayılı Kanun m. 34/g); 3 yıldan fazla: meclis (5393 sayılı Kanun m. 18/e)."
  - on: "Şartlı / şartsız bağışı kim kabul eder?"
    arka: "Şartlı: meclis (5393 sayılı Kanun m. 18/g). Şartsız: belediye başkanı (5393 sayılı Kanun m. 38/l)."
  - on: "Meclis kararında iade ve ısrar süreleri?"
    arka: "Başkan 5 gün içinde iade eder; salt çoğunlukla ısrar → kesinleşir; başkan 10 gün içinde dava açabilir; kararlar 7 gün içinde mülkî amire gönderilir (5393 sayılı Kanun m. 23)."
  - on: "İl genel meclisine ve il encümenine kim başkanlık eder?"
    arka: "Meclise kendi seçtiği meclis başkanı, encümene vali (5302 sayılı Kanun m. 11; 5302 sayılı Kanun m. 25)."
  - on: "Meclisi kim feshedebilir?"
    arka: "İçişleri Bakanlığının bildirimi üzerine Danıştay (5393 sayılı Kanun m. 30). Bakan yalnız geçici uzaklaştırır (AY m. 127/4)."
  - on: "Mahalle ile köy farkı?"
    arka: "Köy tüzel kişidir (442 sayılı Kanun m. 7); mahalle belediye içinde tüzel kişiliği olmayan idari birimdir (5393 sayılı Kanun m. 3/d)."
  - on: "Mahalli idare birliği nasıl kurulur?"
    arka: "Cumhurbaşkanının izni ile (AY m. 127/6)."
