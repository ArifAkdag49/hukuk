    tanim: "Borçlunun borç ilişkisinin kendisinden beklediği davranıştan ayrılması: borcu hiç ya da gereği gibi ifa etmemesi (TBK m. 112)."
  - terim: "Kötü ifa"
    tanim: "Edimin yerine getirilmesi, ama eksik, kusurlu ya da ayıplı biçimde yerine getirilmesi."
  - terim: "Sözleşmenin olumlu ihlali"
    tanim: "Asıl edim yerine getirildiği hâlde bilgi verme, sır saklama, koruma gibi yan yükümlülüklerin ihlal edilmesi."
  - terim: "Koruma yükümlülüğü"
    tanim: "Borçlunun ifa sırasında alacaklının bedenine ve malvarlığına zarar vermeme yükümlülüğü. Dürüstlük kuralına (TMK m. 2) dayanır."
  - terim: "Kusur karinesi"
    tanim: "Sözleşmeye aykırılıkta kusurun var sayılması; borçlunun ancak kusursuzluğunu ispatlayarak kurtulabilmesi (TBK m. 112)."
  - terim: "Ağır kusur"
    tanim: "Kast ve ağır ihmal. Ağır ihmal, aynı durumdaki herkesin göstereceği en basit özenin bile gösterilmemesidir."
  - terim: "Hafif kusur"
    tanim: "Hafif ihmal: dikkatli ve makul bir kişinin göstereceği özenin gösterilmemesi."
  - terim: "Yapma borcu"
    tanim: "Borçlunun bir faaliyette bulunmasını konu alan borç. İfa edilmezse alacaklı, masrafı borçluya ait olmak üzere başkasına yaptırma izni isteyebilir (TBK m. 113/1)."
  - terim: "Yapmama borcu"
    tanim: "Borçlunun bir davranıştan kaçınmasını konu alan borç. Aykırı davranışın kendisi borca aykırılıktır (TBK m. 113/2-3)."
  - terim: "Sorumsuzluk anlaşması"
    tanim: "Borçlunun ileride doğabilecek sorumluluğunu önceden tamamen ya da kısmen kaldıran anlaşma (TBK m. 115, m. 116/2-3)."
  - terim: "Yardımcı kişi (ifa yardımcısı)"
    tanim: "Borçlunun iradesiyle borcun ifasına ya da borçtan doğan bir hakkın kullanılmasına katılan kişi. Bağımlılık şart değildir (TBK m. 116/1)."
  - terim: "Varsayımsal (farazi) kusur"
    tanim: "Yardımcının davranışını borçlu kendisi yapsaydı bunun ona kusur olarak yüklenip yüklenemeyeceği ölçütü."
  - terim: "Olumlu (müspet) zarar"
    tanim: "Sözleşme gereği gibi ifa edilseydi alacaklının ulaşacağı durum ile şimdiki durumu arasındaki fark (ifa yararı)."
  - terim: "Olumsuz (menfi) zarar"
    tanim: "Sözleşmenin geçerli olarak kurulacağına ya da ifa edileceğine güvenilmesi yüzünden uğranılan zarar (güven yararı)."
  - terim: "Hakların yarışması"
    tanim: "Aynı davranışın hem sözleşmeye aykırılık hem haksız fiil oluşturması; zarar gören istemini dilediğine dayandırabilir."

kararlar:
  - id: "685291900"
    ozet: |
      Böbrek hastası olan ve gebeliği hayati risk taşıyan bir kadının özel hastanede yapılan kürtaj sırasında rahmi ve bağırsağı delinmiş; hasta aynı gün eve gönderilmiş, şikâyetleri artınca diyaliz ünitesi olmayan bir hastaneye yönlendirilmiş ve sonunda ölmüştür. Mirasçıların hekim ve hastaneye açtığı tazminat davasını ilk derece mahkemesi, Adli Tıp Kurumu Genel Kurulunun kusur bulunmadığı yönündeki raporuna dayanarak reddetmiş; Özel Daire bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu direnme kararını genişletilmiş gerekçeyle oybirliğiyle bozmuştur. Gerekçeye göre hastaneye kabul sözleşmesinde tıbbi tedaviye vekâlet hükümleri uygulanır; hastane yanında çalışan hekim ve hemşire gibi personelin eylemlerinden de sorumludur ve vekil en hafif kusurundan sorumludur. Kusur karine olarak var sayılır, ama sözleşmenin ihlalini, zararı ve uygun illiyet bağını alacaklı ispatlar; iyi yönetilen bir komplikasyon sorumluluk doğurmaz. Gerekçesiz rapor hükme esas alınamaz, üniversitelerden seçilecek uzman bir heyetten denetime elverişli rapor alınmalıdır. Konuya katkısı: kusur karinesinin sınırını ve özen borcunda ispat yükünün dağılımını gösterir; karar, bugünkü TBK m. 112'nin karşılığı olan eski hükme dayanır.
  - id: "693458700"
    ozet: |
      Özel hastanede hekimin 1 cc (50 mikrogram) olarak yazdığı ağrı kesici hemşire tarafından 10 cc (500 mikrogram) uygulanmış; davacıya göre solunumu ve kalbi durmuş, üç gün yoğun bakımda kalmıştır. İlk derece mahkemesi hastaneyi manevi tazminatla sorumlu tutup hekim hakkındaki davayı reddetmiş; bölge adliye mahkemesi hekimi de hemşirenin verdiği zarardan sorumlu sayarak iki davalıyı birlikte tazminata mahkûm etmiştir. Yargıtay 3. Hukuk Dairesi hastanenin temyizini usulden reddetmiş, hekim yönünden kararı oybirliğiyle bozmuştur. Gerekçeye göre adam çalıştıranın sorumluluğu sözleşme dışıdır ve kurtuluş kanıtı tanır; yardımcı kişilerden sorumluluk ise önceden kurulmuş bir sözleşmeyi gerektirir ve kurtuluş kanıtı tanımaz. Çalıştıran, yardımcının yerine geçip aynı davranışta bulunsaydı bu ona kusur olarak yüklenebilecek idiyse sorumludur. Sözleşme hasta ile hastane arasında kurulduğu için hekim de hemşire de hastanenin yardımcı kişisidir; doğru dozu yazan hekimin kusuru yoktur ve hemşire onun yardımcı kişisi değildir. Konuya katkısı: özel hastanede borçlunun kim olduğunu ve varsayımsal kusur ölçütünü gösterir; karar, bugünkü TBK m. 116 ile TBK m. 66'nın karşılığı olan eski hükümlere dayanır.
  - id: "587236400"
    ozet: |
      Davalı banka, davacı şirket adına anlaşmalı bir matbaada bastırdığı çek karnesini kargoyla getirtirken karne kaybolmuş ve çeklerden biriyle davacı aleyhine icra takibi başlatılmıştır. Davacı, ticari itibarının zedelendiğini ileri sürerek manevi tazminat istemiştir. İlk derece mahkemesi istemi kısmen kabul etmiş; bölge adliye mahkemesi bankanın gerekli önlemleri aldığını ve haksız fiil şartlarının oluşmadığını belirterek davayı reddetmiştir. Yargıtay 11. Hukuk Dairesi bu kararı oybirliğiyle bozmuştur. Gerekçeye göre karne bankanın sorumluluk alanındayken kaybolmuştur ve banka onu elden teslim alabilecekken kargoya verdirmiştir. Uzmanlık gerektiren ve izinle yürütülen işlerde hafif kusurdan sorumsuzluk anlaşması kesin hükümsüzdür (TBK m. 115/3); banka da faaliyetini izinle yürütür ve davacıya bir kusur yüklenemez, bu yüzden banka zarardan sorumlu tutulmalıdır. Konuya katkısı: Yargıtay'ın bankacılığı bu hükmün kapsamında gördüğünü ve bankayı hafif kusurundan da sorumlu tuttuğunu gösterir.
  - id: "782216600"
    ozet: |
      Davacılar, 770 kişilik çifte düğün için anlaştıkları organizasyon şirketinin düğünden bir gün önce organizasyonu yapamayacağını bildirmesi üzerine son anda başka bir firmayla anlaşmak zorunda kalmış ve manevi tazminat istemiştir. İlk derece mahkemesi, düğün aynı otelde yapıldığı için kişilik haklarına saldırı bulunmadığını belirterek davayı reddetmiş; Özel Daire bozmuş, mahkeme sözleşmeye aykırılık nedeniyle manevi tazminata hükmedilemeyeceğini de ekleyerek direnmiştir. Hukuk Genel Kurulu direnme kararını değişik gerekçeyle oybirliğiyle bozmuştur. Gerekçeye göre TBK'da borca aykırılık için ayrı bir manevi tazminat hükmü yoktur ve sözleşmeye aykırılık tek başına manevi tazminat gerektirmez; ama aykırılık kişilik hakkını zedelerse TBK m. 114/2 yoluyla TBK m. 58 uygulanır. Nikâh ve düğün gibi genellikle bir kez yaşanan, tekrarı mümkün olmayan bir günde yaşanan bu süreç davacılarda acı ve üzüntüye yol açmış ve kişilik haklarını zedelemiştir; uygun bir manevi tazminata hükmedilmelidir. Konuya katkısı: sözleşmeye aykırılıkta manevi tazminatın dayanağını ve şartını gösterir.

sorular:
  - soru: |
      TBK m. 112'ye göre borç hiç veya gereği gibi ifa edilmediğinde, borçlunun tazminat sorumluluğundan kurtulması için neyi ispatlaması gerekir?
    siklar:
      - "Alacaklının zararını ispat edemediğini"
      - "Kendisine hiçbir kusurun yüklenemeyeceğini"
      - "Borcun ifasını bir yardımcı kişiye bıraktığını"
      - "Alacaklının kendisine ihtar göndermediğini"
    dogru: 1
    aciklama: |
      TBK m. 112'de kusur karine olarak var sayılır; borçlu ancak kendisine hiçbir kusurun yüklenemeyeceğini ispatlayarak kurtulur. Zararı ispatlamak alacaklının yüküdür, borçlunun değil. İfayı yardımcıya bırakmak borçluyu kurtarmaz (TBK m. 116). İhtar kural olarak temerrüdün şartıdır (TBK m. 117); ihtar yapılmamış olması kötü ifadan doğan sorumluluğu ortadan kaldırmaz.

  - soru: |
      Haksız fiil sorumluluğu ile sözleşmeye aykırılıktan doğan sorumluluk arasındaki temel ispat farkı hangisidir?
    siklar:
      - "Haksız fiilde zarar gören, zarar verenin kusurunu ispatlar; sözleşmeye aykırılıkta borçlu kusursuzluğunu ispatlar."
      - "Her ikisinde de zarar gören, karşı tarafın kusurunu ispatlar."
      - "Sözleşmeye aykırılıkta alacaklı zararını ispatlamak zorunda değildir."
      - "Haksız fiilde kusur karinesi vardır, sözleşmeye aykırılıkta yoktur."
    dogru: 0
    aciklama: |
      Haksız fiilde zarar gören, zararını ve zarar verenin kusurunu ispat yükü altındadır (TBK m. 50/1). Sözleşmeye aykırılıkta ise kusur var sayılır ve borçlu kusursuzluğunu ispatlar (TBK m. 112). Zararın ispatı her iki sorumlulukta da zarar görene aittir.

  - soru: |
      Boya ustası Kemal, Zeynep'in salonunu boyarken merdiveni dikkatsizce devirir ve vitrindeki porselen takımı kırar. Boya işi kusursuz yapılmıştır. Zeynep'in porselen için tazminat istemi hakkında hangisi doğrudur?
    siklar:
      - "Boya işi kusursuz yapıldığı için borca aykırılık yoktur; Zeynep yalnız haksız fiile dayanabilir."
      - "Kemal'in ifa sırasında Zeynep'in diğer mallarına zarar vermeme yükümlülüğü vardır; bunun ihlali borca aykırılıktır ve Kemal kusursuzluğunu ispatlamadıkça sorumludur."
      - "Zeynep, Kemal'in kusurunu ispatlamadıkça tazminat isteyemez."
      - "Kemal ancak porseleni kasten kırmışsa sorumludur."
    dogru: 1
    aciklama: |
      Asıl edimin yanında, dürüstlük kuralından (TMK m. 2) doğan koruma yükümlülüğü de vardır: borçlu ifa sırasında alacaklının malvarlığına zarar vermemelidir. Bu yükümlülüğün ihlali borcun gereği gibi ifa edilmemesidir (TBK m. 112). Borçlu her türlü kusurdan sorumludur (TBK m. 114/1) ve kusur karine olarak var sayılır. Zeynep isterse haksız fiile de dayanabilir, ama "yalnız haksız fiil" cevabı yanlıştır.

  - soru: |
      Aşağıdakilerden hangisi "sözleşmenin olumlu ihlali"ne örnektir?
    siklar:
      - "Satıcının satılan malı hiç teslim etmemesi"
      - "Kiracının kira bedelini vadesinde ödememesi"
      - "Avukatın, işi yürütürken müvekkilinin kendisine anlattığı sırları üçüncü kişilere açıklaması"
      - "Borcun ifasının borçlunun sorumlu tutulamayacağı bir sebeple imkânsızlaşması"
    dogru: 2
    aciklama: |
      Olumlu ihlal, asıl edimin yanındaki yan yükümlülüklerin (sır saklama, bilgi verme, koruma) ihlalidir ve TBK m. 112'deki "gereği gibi ifa etmeme" kapsamında değerlendirilir. Malın hiç teslim edilmemesi ifa etmemedir; kiranın vadesinde ödenmemesi temerrüt konusudur (TBK m. 117). Borçlunun sorumlu tutulamayacağı imkânsızlıkta ise borç sona erer (TBK m. 136).

  - soru: |
      TBK m. 113/1'e göre yapma borcu borçlu tarafından ifa edilmezse alacaklı ne isteyebilir?
    siklar:
      - "Masrafı borçluya ait olmak üzere edimin kendisi veya başkası tarafından ifasına izin verilmesini; ayrıca her türlü giderim hakkı saklıdır."
      - "Yalnız sözleşmeden dönebilir; başka bir hakkı yoktur."
      - "Edimi başkasına yaptırabilir, ama bu durumda ayrıca tazminat isteyemez."
      - "Borçlunun işi bizzat yapması için kolluk gücüyle zorlanmasını isteyebilir."
    dogru: 0
    aciklama: |
      TBK m. 113/1'e göre alacaklı, masrafı borçluya ait olmak üzere edimin kendisi veya başkası tarafından ifasına izin verilmesini isteyebilir ve her türlü giderim isteme hakkı saklıdır. Yani başkasına yaptırma ile tazminat birlikte istenebilir. Borçlunun kişisel bir işi yapmaya zorla getirilmesi öngörülmemiştir; kişisel yeteneğe bağlı edimlerde alacaklıya tazminat yolu kalır.

  - soru: |
      Ayşe, komşusu Mehmet'le yaptığı sözleşmeyle bahçe sınırına iki metreden yüksek duvar örmemeyi üstlenmiştir. Ayşe üç metrelik bir duvar örer. Mehmet'in hakları bakımından hangisi doğrudur?
    siklar:
      - "Mehmet yalnız tazminat isteyebilir; duvarın fazla kısmının kaldırılmasını isteyemez."
      - "Mehmet zararının giderilmesini, ayrıca aykırılığın ortadan kaldırılmasını ya da masrafı Ayşe'ye ait olmak üzere bunun için kendisinin yetkili kılınmasını isteyebilir."
      - "Yapmama borcuna aykırılık tazminat doğurmaz; Mehmet yalnız ifa davası açabilir."
      - "Mehmet yalnız sözleşmeden dönebilir; tazminat ve duvarın yıkılması istenemez."
    dogru: 1
    aciklama: |
      Yapmama borcuna aykırı davranan borçlu, bu davranışın doğurduğu zararı gidermekle yükümlüdür (TBK m. 113/2). Alacaklı ayrıca borca aykırı durumun ortadan kaldırılmasını veya masrafı borçluya ait olmak üzere bu konuda kendisinin yetkili kılınmasını isteyebilir (TBK m. 113/3). İki hak birlikte kullanılabilir.

  - soru: |
      Mert, yurt dışına giden arkadaşı Can'ın bisikletini karşılıksız olarak garajında saklamayı üstlenir. Bir akşam garaj kapısını kilitlemeyi unutur ve bisiklet çalınır. Hangisi doğrudur?
    siklar:
      - "Saklama karşılıksız olduğu için Mert hiçbir kusurundan sorumlu değildir."
      - "Mert yalnız kastından sorumludur."
      - "Mert kusurlu olduğu için sorumludur; ancak iş ona bir yarar sağlamadığından hâkim sorumluluğu daha hafif değerlendirebilir."
      - "Can, Mert'in kusurunu ispatlamadıkça Mert sorumlu olmaz."
    dogru: 2
    aciklama: |
      Borçlu genel olarak her türlü kusurdan sorumludur; hafif ihmal de yeter. Ancak iş özellikle borçlu için bir yarar sağlamıyorsa sorumluluk daha hafif olarak değerlendirilir (TBK m. 114/1). Karşılıksız iş sorumluluğu ortadan kaldırmaz, yalnız hafifletir. Kusur da karine olarak var sayılır (TBK m. 112).

  - soru: |
      TBK m. 114/2 uyarınca haksız fiil hükümlerinin sözleşmeye aykırılık hâllerine kıyasen uygulanması bakımından hangisi **yanlıştır**?
    siklar:
      - "Hâkim, tazminatın kapsamını belirlerken kusurun ağırlığını gözetebilir."
      - "Alacaklının zararın doğmasında veya artmasında etkili olması tazminattan indirim sebebi olabilir."
      - "Sözleşmeye aykırılık yüzünden bedensel zarar doğmuşsa manevi tazminat istenebilir."
      - "Sözleşmeye aykırılıkta da kusuru, haksız fiilde olduğu gibi alacaklı ispatlar."
    dogru: 3
    aciklama: |
      TBK m. 114/2 yoluyla tazminatın belirlenmesi (TBK m. 51), indirim sebepleri (TBK m. 52) ve manevi tazminat (TBK m. 56) gibi hükümler sözleşmeye aykırılığa da uygulanır. Ama kusurun ispatında sözleşme hukukunun özel kuralı vardır: kusur var sayılır ve borçlu kusursuzluğunu ispatlar (TBK m. 112). Haksız fiile ilişkin ispat kuralı (TBK m. 50/1) buraya taşınmaz.

  - soru: |
      Borçlunun kendi kusurundan doğan sorumluluğunu önceden bir anlaşmayla kaldırması bakımından genel kural hangisidir?
    siklar:
      - "Her türlü kusur için sorumsuzluk anlaşması kesin hükümsüzdür."
      - "Ağır kusurdan sorumsuzluk anlaşması kesin hükümsüzdür; hafif kusur için kural olarak geçerlidir."
      - "Yalnız kasttan sorumsuzluk anlaşması hükümsüzdür; ağır ihmal için geçerlidir."
      - "Sorumsuzluk anlaşması ancak hâkim uygun görürse geçerlidir."
    dogru: 1
    aciklama: |
      TBK m. 115/1'e göre borçlunun ağır kusurundan sorumlu olmayacağına ilişkin önceden yapılan anlaşma kesin hükümsüzdür. Ağır kusur kastı ve ağır ihmali birlikte kapsar. Hafif kusurdan sorumsuzluk kural olarak geçerlidir; istisnaları hizmet sözleşmesi (TBK m. 115/2) ve izinle yürütülen uzmanlık işleridir (TBK m. 115/3). Geçerlilik hâkimin takdirine bırakılmamıştır.

  - soru: |
      X A.Ş., işçileriyle yaptığı iş sözleşmelerine "İşveren, iş kazalarında hafif kusurundan sorumlu değildir" kaydını koymuştur. İşçi Hasan, işverenin hafif kusuruyla meydana gelen bir iş kazasında yaralanır. Kayıt hakkında hangisi doğrudur?
    siklar:
      - "Kayıt yalnız hafif kusura ilişkin olduğu için geçerlidir."
      - "Kayıt, hizmet sözleşmesinden doğan bir borçla ilgili önceden yapılmış sorumsuzluk anlaşması olduğundan kesin hükümsüzdür."
      - "Kayıt, işyerinde ilan edilmişse geçerlidir."
      - "Kayıt geçerlidir; ama hâkim hakkaniyete göre tazminatı indirebilir."
    dogru: 1
    aciklama: |
      Borçlunun alacaklıyla arasındaki hizmet sözleşmesinden kaynaklanan herhangi bir borç sebebiyle sorumlu olmayacağına ilişkin önceden yaptığı her türlü anlaşma kesin hükümsüzdür (TBK m. 115/2). Burada kusurun hafif olması sonucu değiştirmez. İşverenin iş sağlığı ve güvenliği için önlem alma borcu hizmet ilişkisinin parçasıdır (TBK m. 417/2); bu yüzden işçinin yaralanmasından doğan zararlar sözleşmeye aykırılık hükümlerine tabidir (TBK m. 417/3).

  - soru: |
      Avukat Selim, müvekkili Deniz'le yaptığı sözleşmeye "Avukat, hafif kusurundan doğan zararlardan sorumlu değildir" kaydını koymuştur. Selim, hafif bir dikkatsizlikle istinaf süresini kaçırır. Kayıt hakkında hangisi doğrudur?
    siklar:
      - "Kayıt geçerlidir; çünkü yalnız ağır kusurdan sorumsuzluk yasaktır."
      - "Avukatlık uzmanlık gerektiren ve ancak kanuni izinle yürütülebilen bir meslek olduğundan, hafif kusurdan sorumsuzluk kaydı da kesin hükümsüzdür."
      - "Kayıt, Deniz onu okuyup imzaladığı için her durumda geçerlidir."
      - "Kayıt yalnız Deniz tüketiciyse geçersizdir; tacirse geçerlidir."
    dogru: 1
    aciklama: |
      Uzmanlığı gerektiren bir hizmet, meslek veya sanat ancak kanun ya da yetkili makamların verdiği izinle yürütülebiliyorsa, borçlunun hafif kusurundan sorumlu olmayacağına ilişkin önceden yapılan anlaşma kesin hükümsüzdür (TBK m. 115/3). Avukatlık bu kapsamdadır. Sonuç, müvekkilin tacir ya da tüketici olmasına göre değişmez. Avukatın özen ölçüsü de basiretli bir vekilin davranışıdır (TBK m. 506/3).

  - soru: |
      TBK m. 115'teki kesin hükümsüzlük sınırları hangi anlaşmalar için öngörülmüştür?
    siklar:
      - "Zarar doğduktan sonra alacaklının tazminattan vazgeçtiği anlaşmalar için"
      - "Zarara yol açan borca aykırılıktan önce yapılan anlaşmalar için"
      - "Yalnız resmî şekilde yapılan anlaşmalar için"
      - "Yalnız tüketici sözleşmelerindeki anlaşmalar için"
    dogru: 1
    aciklama: |
      TBK m. 115'in üç fıkrası da "önceden yapılan" anlaşmalardan söz eder. Zarar doğduktan sonra alacaklının tazminat alacağından vazgeçmesi bu maddenin konusu değildir. Sorumsuzluk anlaşması bir şekle bağlı değildir ve madde yalnız tüketici sözleşmeleri için değil, bütün sözleşmeler için geçerlidir.

  - soru: |
      TBK m. 116 anlamında yardımcı kişi bakımından hangisi doğrudur?
    siklar:
      - "Yardımcı kişi yalnız borçlunun yanında hizmet sözleşmesiyle çalışan işçi olabilir."
      - "Borçlunun iradesiyle borcun ifasına katılan bağımsız bir firma da yardımcı kişi olabilir; bağımlılık şart değildir."
      - "Yardımcı kişi kullanılabilmesi için alacaklının ayrıca onay vermesi gerekir."
      - "Borçlunun birlikte yaşadığı aile bireyleri yardımcı kişi sayılmaz."
    dogru: 1
    aciklama: |
      TBK m. 116/1, "birlikte yaşadığı kişiler ya da yanında çalışanlar gibi" diyerek örnek verir; sayım sınırlı değildir. Borçlunun iradesiyle ifaya katılan bağımsız bir girişimci ya da alt yüklenici de yardımcı kişidir. Aile bireyleri kanunda açıkça anılır. Borcun bizzat ifası kural olarak zorunlu olmadığından (TBK m. 83) alacaklının onayı da aranmaz.

  - soru: |
      Mobilyacı Ahmet, Zeynep'e sattığı gardırobun kurulumunu çırağı Can'a bırakır. Can, kurulum sırasında dikkatsizce Zeynep'in parkesini çizer. Ahmet, Can'ı özenle seçtiğini ve iyi eğittiğini ispatlayarak sorumluluktan kurtulmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Ahmet, seçmede ve denetimde gerekli özeni gösterdiğini ispatlarsa kurtulur."
      - "Ahmet ile Zeynep arasında sözleşme bulunduğundan TBK m. 116 uygulanır; Ahmet özen kanıtıyla kurtulamaz ve aynı davranış ona kusur olarak yükleneceği için sorumludur."
      - "Yalnız Can sorumludur; Ahmet'in sorumluluğu için kendi kusuru gerekir."
      - "Ahmet ancak Can'ı yazılı olarak yetkilendirmişse sorumludur."
    dogru: 1
    aciklama: |
      Zarar gören ile borçlu arasında önceden kurulmuş bir sözleşme olduğu için adam çalıştıranın sorumluluğu (TBK m. 66) değil, yardımcı kişilerden sorumluluk (TBK m. 116) uygulanır. Bu maddede özen kanıtıyla kurtuluş yoktur. Ölçü varsayımsal kusurdur: parkeyi Ahmet kendisi çizseydi kusurlu olurdu. Can da Zeynep'e karşı haksız fiilden sorumludur, ama bu Ahmet'in sorumluluğunu ortadan kaldırmaz.

  - soru: |
      Kiracı Burak'ın kiraladığı dairede birlikte yaşadığı oğlu Kaan'ın dikkatsizliği yüzünden kombi zarar görür. Kiraya veren Selin'in Burak'a karşı tazminat istemi hakkında hangisi doğrudur?
    siklar:
      - "Burak, zararı kendisi vermediği için sorumlu değildir."
      - "Burak, kiralananı kullanma hakkını birlikte yaşadığı oğluna bıraktığı için onun verdiği zarardan Selin'e karşı sorumludur."
      - "Selin yalnız Kaan'a karşı haksız fiil davası açabilir."
      - "Burak ancak Kaan'ı denetlemede kusurlu olduğu ispatlanırsa sorumludur."
    dogru: 1
    aciklama: |
      TBK m. 116/1, borcun ifası yanında borç ilişkisinden doğan bir hakkın kullanılmasının yardımcılara bırakılmasını da kapsar. Kiracı kiralananı kullanma hakkını birlikte yaşadığı kişilere bıraktığında, onların bu kullanım sırasında verdiği zarardan kiraya verene karşı sorumludur. Kurtuluş için kendi özenini ispatlaması yetmez. Selin, Kaan'a karşı haksız fiile de dayanabilir; ama "yalnız" ona başvurabileceği doğru değildir.

  - soru: |
      X Bankası, bireysel müşterileriyle yaptığı standart sözleşmeye "Banka, şube çalışanlarının kusurlu işlemlerinden doğan zararlardan sorumlu değildir" kaydını koymuştur. Bir çalışanın hafif kusuruyla müşteri Derya'nın hesabından yanlış kişiye para gönderilir. Kayıt hakkında hangisi doğrudur?
    siklar:
      - "Yardımcı kişilerin fiilinden doğan sorumluluk önceden kaldırılabildiği için kayıt geçerlidir."
      - "Kayıt yalnız çalışanın ağır kusuru bakımından hükümsüzdür; hafif kusurda geçerlidir."
      - "Bankacılık uzmanlık gerektiren ve ancak izinle yürütülebilen bir faaliyet olduğundan, yardımcı kişilerin fiillerinden sorumsuzluk kaydı kesin hükümsüzdür."
      - "Kayıt geçerlidir; Derya yalnız çalışana haksız fiil davası açabilir."
    dogru: 2
    aciklama: |
      Kural olarak yardımcı kişilerden sorumluluk önceden kaldırılabilir (TBK m. 116/2). Ama uzmanlığı gerektiren bir hizmet ancak kanun ya da yetkili makamların izniyle yürütülebiliyorsa bu anlaşma kesin hükümsüzdür ve hafif-ağır kusur ayrımı yapılmaz (TBK m. 116/3). Yargıtay bankacılığı izinle yürütülen uzmanlık faaliyeti sayar. Kayıt ayrıca tüketici aleyhine bir haksız şart olarak da kesin hükümsüzdür (TKHK m. 5).

  - soru: |
      Yargıtay Hukuk Genel Kurulunun yerleşik görüşüne göre sözleşmeye aykırılık nedeniyle manevi tazminat hakkında hangisi doğrudur?
    siklar:
      - "Sözleşmeye aykırılıkta manevi tazminat hiçbir durumda istenemez."
      - "Her sözleşmeye aykırılık kendiliğinden manevi tazminat gerektirir."
      - "Sözleşmeye aykırılık tek başına yetmez; aykırılık kişilik hakkını zedelemişse TBK m. 114/2 yoluyla TBK m. 58 uygulanarak manevi tazminat istenebilir."
      - "Manevi tazminat ancak sözleşmede ceza koşulu kararlaştırılmışsa istenebilir."
    dogru: 2
    aciklama: |
      TBK'da borca aykırılık için ayrı bir manevi tazminat hükmü yoktur. Hukuk Genel Kurulu'na göre sözleşmeye aykırılık tek başına manevi tazminat gerektirmez; ama aykırı davranış kişilik hakkını zedelerse TBK m. 114/2 yoluyla TBK m. 58 uygulanır. Kurul bu ölçütle, düğünden bir gün önce iptal edilen organizasyon nedeniyle manevi tazminata hükmedilmesi gerektiğine karar vermiştir.

  - soru: |
      Sözleşme gereği gibi ifa edilseydi alacaklının malvarlığının ulaşacağı durum ile ifa edilmemesi yüzünden bulunduğu durum arasındaki farka ne ad verilir?
    siklar:
      - "Olumsuz (menfi) zarar"
      - "Olumlu (müspet) zarar"
      - "Manevi zarar"
      - "Yansıma zarar"
    dogru: 1
    aciklama: |
      Bu tanım olumlu zararın, yani ifa yararının tanımıdır; TBK m. 112'deki tazminat kural olarak bu zarardır. Olumsuz zarar ise sözleşmeye güvenilmesi yüzünden uğranılan zarardır (güven yararı); örneğin temerrüt yüzünden sözleşmeden dönen alacaklı, borçlu kusursuzluğunu ispat edemezse sözleşmenin hükümsüz kalması yüzünden uğradığı zararı ister (TBK m. 125/3). Manevi zarar malvarlığına ilişkin değildir.

  - soru: |
      Aynı davranış hem sözleşmeye aykırılık hem haksız fiil oluşturuyorsa, Yargıtay Hukuk Genel Kurulunun benimsediği görüşe göre hangisi doğrudur?
    siklar:
      - "Yalnız sözleşme hükümleri uygulanır; haksız fiile dayanılamaz."
      - "Yalnız haksız fiil hükümleri uygulanır."
      - "İki sorumluluk yarışır; zarar gören istemini dilediğine dayandırabilir, açıkça belirtmediyse hâkim onun lehine olan hükümleri bir bütün olarak uygular."
      - "Zarar gören iki istemi birlikte kullanarak zararını iki kez tahsil edebilir."
    dogru: 2
    aciklama: |
      Hukuk Genel Kurulu, Türk hukukunda iki sorumluluğun yarıştığı görüşünü benimser. Zarar gören istemini sözleşmeye ya da haksız fiile dayandırabilir; hukuki sebebi açıkça belirtmemişse hâkim, zarar görenin lehine olan sorumluluk hükümlerini bir bütün olarak uygular. Ama aynı zarar iki kez tahsil edilemez. Seçimin önemi, kusurun ispatı (TBK m. 112 ve m. 50/1) ile zamanaşımı (TBK m. 146 ve m. 72) gibi farklardan gelir.

  - soru: |
      Bir alışveriş merkezinin ücretli otoparkının girişinde "Otoparkımızda araçlarda meydana gelecek hasar ve hırsızlıklardan sorumluluk kabul edilmez" levhası asılıdır. Ücret ödeyerek aracını otoparka bırakan Elif'in aracı çalınır. Hangisi doğrudur?
    siklar:
      - "Levha nedeniyle işleten sorumlu değildir."
      - "İşleten, sorumluluk üstlenmediğini ilan etse de bu yolla kurtulamaz; ancak kanunda sayılan kurtuluş sebeplerini ispatlayarak kurtulabilir."
      - "Levha geçerli bir sorumsuzluk anlaşmasıdır; yalnız işletenin ağır kusuru varsa hükümsüzdür."
      - "Elif levhayı gördüğü için zararını tamamen kendisi üstlenmiştir."
    dogru: 1
    aciklama: |
      Garaj ve otopark işleteni, sorumluluk üstlenmediğini ya da sorumluluğu kanunda gösterilmeyen bir koşula bağladığını herhangi bir yolla ilan etse bile sorumluluktan kurtulamaz (TBK m. 579/3). İşleten ancak zararın aracı bırakana veya yanındakilere yüklenebilecek kusurdan, mücbir sebepten ya da eşyanın niteliğinden doğduğunu ispatlayarak kurtulur (TBK m. 579/1). Kendisine ya da çalışanlarına kusur yüklenemiyorsa sorumluluğu, günlük saklama ücretinin on katıyla sınırlıdır (TBK m. 579/2).

olaylar:
  - olay: |
      Serbest grafik tasarımcı Ayşe (34), safra kesesi ameliyatı için Özel Şifa Hastanesi A.Ş.'ye yatar. Girişte ona imzalatılan ve hastanenin bütün hastalarına verdiği matbu kabul formunda şu kayıt vardır: "Hastanemiz, hekim ve sağlık personelinin hafif kusurlarından doğan zararlardan sorumlu değildir." Kayıt hakkında Ayşe'ye hiçbir açıklama yapılmamıştır.

      Ameliyatı hastanenin kadrolu genel cerrahı Dr. Kerem yapar; ameliyat başarılıdır. Gece Dr. Kerem, Ayşe için 1 ampul ağrı kesici yazar. Servis hemşiresi Elif, ilacı dalgınlıkla 10 ampul olarak uygular. Ayşe'nin solunumu durur; müdahaleyle kurtarılır ve dört gün yoğun bakımda kalır. Kalıcı bir hasar kalmaz, ama Ayşe iki ay çalışamaz ve bu sürede 120.000 TL'lik iki işini kaybeder. Hastane yoğun bakım için 60.000 TL fatura keser; Ayşe bunu öder.

      Ayşe hastaneye ve Dr. Kerem'e dava açar. Hastane, Elif'i deneyimine bakarak işe aldığını, düzenli eğitim verip denetlediğini, ayrıca formdaki kayıt nedeniyle sorumlu olmadığını ve kusuru Ayşe'nin ispatlaması gerektiğini savunur. Dr. Kerem ise doğru dozu yazdığını ileri sürer.

      1. Ayşe ile kim arasında hangi hukuki ilişki vardır; hastanenin sorumluluğu hangi hükümlere dayanır?
      2. Hastanenin özen ve ispat yüküne ilişkin savunmalarını değerlendiriniz.
      3. Formdaki kayıt geçerli midir?
      4. Ayşe hangi tazminatları isteyebilir?
      5. Dr. Kerem sorumlu mudur?
    olcut:
      - {tespit: "Hastaneye kabul sözleşmesi; borçlunun hastane, hekim ve hemşirenin hastanenin yardımcı kişisi olması", puan: 15, madde: "TBK m. 116"}
      - {tespit: "On kat doz uygulamasının borca aykırılık olması ve varsayımsal kusur ölçütünün gerçekleşmesi", puan: 15, madde: "TBK m. 116"}
      - {tespit: "Özenle seçme ve denetleme savunmasının dinlenmemesi; adam çalıştıranın sorumluluğundan farkı", puan: 15, madde: "TBK m. 66"}
      - {tespit: "Kusur karinesi: kusursuzluğu hastanenin, aykırılık, zarar ve illiyeti Ayşe'nin ispatlaması", puan: 15, madde: "TBK m. 112"}
      - {tespit: "Kaydın izinle yürütülen uzmanlık hizmeti nedeniyle kesin hükümsüzlüğü; genel işlem koşulu ve haksız şart denetimi", puan: 20, madde: "TBK m. 116"}
      - {tespit: "Tedavi gideri, kazanç kaybı ve manevi tazminatın haksız fiil hükümlerinin kıyasen uygulanmasıyla istenmesi", puan: 10, madde: "TBK m. 114"}
      - {tespit: "Doğru dozu yazan ve hasta ile sözleşmesi bulunmayan hekimin sorumlu olmaması", puan: 10, madde: "TBK m. 116"}
    cozum: |
      **Nitelendirme:** Ayşe ile Özel Şifa Hastanesi A.Ş. arasında bir **hastaneye kabul sözleşmesi** vardır. Bu, kanunda düzenlenmemiş bir işgörme sözleşmesidir ve tıbbi tedavi edimine vekâlet hükümleri uygulanır (TBK m. 502/2). Sözleşmenin borçlusu hastanedir. Dr. Kerem ve hemşire Elif, hastanenin borcunu ifa ederken kullandığı **yardımcı kişilerdir**.

      **Hukuki sorunlar:** (1) Hastanenin yardımcı kişinin fiilinden sorumluluğu ve kurtuluş imkânı. (2) İspat yükü. (3) Sorumsuzluk kaydının geçerliliği. (4) Tazminat kalemleri. (5) Hekimin sorumluluğu.

      **İlgili hükümler:** TBK m. 112, m. 114, m. 116; TBK m. 21; TKHK m. 5; TBK m. 54 ve m. 56.

      **Değerlendirme:**
      - *Borca aykırılık ve yardımcı kişi:* Hekimin yazdığından on kat fazla ilaç uygulanması, tedavi ve bakım ediminin gereği gibi ifa edilmemesidir (TBK m. 112). Elif, hastanenin borcunu yürütürken zarar vermiştir (TBK m. 116/1). Hastane bu işi kendisi yapsaydı on kat doz uygulaması ona kusur olarak yüklenirdi; varsayımsal kusur ölçütü gerçekleşmiştir.
      - *Özen savunması:* Hastane, Elif'i özenle seçtiğini ve denetlediğini ispatlasa bile kurtulamaz. Bu kurtuluş kanıtı yalnız sözleşme dışı bir sorumluluk olan adam çalıştıranın sorumluluğunda vardır (TBK m. 66/2). Taraflar arasında sözleşme bulunduğu için TBK m. 116 uygulanır ve bu maddede özen kanıtıyla kurtuluş yoktur.
      - *İspat:* TBK m. 112 kusuru karine olarak var sayar. Ayşe; sözleşmeyi, yanlış dozun uygulandığını (hekim talimatı ve hemşire kayıtları), zararı ve illiyet bağını ispatlar. Kusursuzluğu ispat yükü hastanededir ve olaydaki durumda bu ispat mümkün görünmemektedir.
      - *Kayıt:* Kayıt, yardımcı kişilerin fiillerinden sorumluluğu kaldırmaya yöneliktir. Kural olarak bu mümkündür (TBK m. 116/2). Ancak hastanecilik ve hekimlik uzmanlık gerektiren ve ancak kanuni izinle yürütülebilen hizmetlerdir. Bu yüzden yardımcı kişilerin fiillerinden sorumsuzluk anlaşması kusur derecesine bakılmaksızın kesin hükümsüzdür (TBK m. 116/3). Kayıt ayrıca matbu bir genel işlem koşuludur ve Ayşe'ye açıkça bilgi verilmediği için yazılmamış sayılır (TBK m. 21/1). Hastaneye kabul sözleşmesi tüketici sözleşmesi sayılırsa, müzakere edilmemiş ve Ayşe aleyhine dengesizlik yaratan bu şart haksız şart olarak da kesin hükümsüz olur (TKHK m. 5/1-2); sonuç bu nitelendirmeye bağlı değildir, çünkü kayıt yukarıdaki iki sebeple zaten etkisizdir. Kaldı ki on kat doz hafif kusur sayılamayacağı için kayıt kendi lafzına göre de olayı kapsamaz. Sözleşmenin geri kalanı geçerliliğini korur.
      - *Tazminat:* TBK m. 114/2 yoluyla haksız fiil hükümleri kıyasen uygulanır. Ayşe, ödediği 60.000 TL yoğun bakım giderini ve iki aylık 120.000 TL kazanç kaybını bedensel zarar kalemleri olarak isteyebilir (TBK m. 54). Bedensel bütünlüğü zedelendiği için manevi tazminat da isteyebilir (TBK m. 56/1); miktarı hâkim olayın özelliklerine göre belirler.
      - *Dr. Kerem:* Ayşe'nin sözleşme tarafı hastanedir; Dr. Kerem borçlu değildir. Doğru dozu yazdığı için kusuru da yoktur. Elif onun değil hastanenin yardımcı kişisidir; bu yüzden Dr. Kerem, Elif'in hatasından TBK m. 116'ya göre sorumlu tutulamaz. Elif ise Ayşe'ye karşı haksız fiilden sorumludur (TBK m. 49); hastane ile müteselsil sorumluluğu ayrı konuda incelenir.

      **Sonuç:** Hastane TBK m. 112 ve m. 116'ya göre sorumludur; özen savunması ve formdaki kayıt onu kurtarmaz. Ayşe 60.000 TL tedavi giderini, 120.000 TL kazanç kaybını ve uygun bir manevi tazminatı isteyebilir. Dr. Kerem hakkındaki dava reddedilmelidir.

  - olay: |
      Zeynep, Ayvalık'ta deniz manzarasıyla tanınan bir pansiyon işletmektedir. Pansiyonla deniz arasında komşusu Mehmet'in arsası vardır. 2 Ocak 2025'te yaptıkları sözleşmeye göre Zeynep, Mehmet'e her yıl 60.000 TL ödeyecektir. Mehmet de beş yıl boyunca arsasına iki metreden yüksek bir yapı yapmamayı ve sınırdaki çam ağaçlarını her yıl nisan ayında manzarayı kapatmayacak biçimde budatmayı üstlenmiştir. Taraflar uzun bir pazarlıktan sonra sözleşmeye şu kaydı da koymuştur: "Mehmet, ağaçların budanması sırasında pansiyona gelecek zararlardan sorumlu değildir."

      2025 nisanında Mehmet budamayı kendisi yapar. Hiç deneyimi olmadığı hâlde, Zeynep'in "Dalı çatıya doğru kesme" uyarısını dinlemez ve dalı iple sabitlemeden keser. Kalın dal pansiyonun çatısına düşer, kiremitler kırılır ve bir odaya su sızar. Onarım 45.000 TL tutar. Mehmet, sözleşmedeki kayda dayanarak ödemeyi reddeder.

      2026 nisanında Mehmet ağaçları hiç budatmaz. Zeynep'in 4 Mayıs 2026'da çektiği ihtara "Bu yıl budatmayacağım" diye cevap verir. Mayıs sonunda arsasına yaklaşık dört metre yüksekliğinde ahşap bir depo yapar. Depo, pansiyonun deniz manzaralı altı odasının manzarasını kapatır. Zeynep bu odaların fiyatını düşürmek zorunda kalır ve haziranda 90.000 TL daha az gelir elde eder. Bilirkişiye göre bu kaybın tamamı deponun manzarayı kapatmasından kaynaklanmaktadır.

      1. Mehmet'in sözleşmeden doğan borçlarını nitelendiriniz.
      2. Mehmet 2025'teki çatı zararından kayda dayanarak kurtulabilir mi? İspat yükü nasıl dağılır?
      3. Zeynep, 2026'da budatılmayan ağaçlar için ne isteyebilir?
      4. Zeynep depo nedeniyle neler isteyebilir?
    olcut:
      - {tespit: "Budatma borcunun yapma, yükseklik sınırının yapmama borcu olarak ayrılması", puan: 10, madde: "TBK m. 113"}
      - {tespit: "Budama sırasında çatıya zarar verilmesinin gereği gibi ifa etmeme olması ve kusur karinesi", puan: 15, madde: "TBK m. 112"}
      - {tespit: "Kaydın hafif kusurda geçerli, ağır kusurda kesin hükümsüz olması; uyarıya rağmen önlemsiz kesimin ağır ihmal sayılması", puan: 20, madde: "TBK m. 115"}
      - {tespit: "Budama için hâkimden izinle başkasına yaptırma, masrafın Mehmet'e ait olması ve giderim hakkı", puan: 20, madde: "TBK m. 113"}
      - {tespit: "Depo nedeniyle 90.000 TL yoksun kalınan kârın tazmini", puan: 15, madde: "TBK m. 113"}
      - {tespit: "Deponun fazla kısmının kaldırılması ya da Zeynep'in masrafı Mehmet'e ait olmak üzere yetkili kılınması", puan: 15, madde: "TBK m. 113"}
      - {tespit: "Karşılıklı sözleşmede temerrüde bağlı seçimlik haklara bağlantı kurulması", puan: 5, madde: "TBK m. 123"}
    cozum: |
      **Nitelendirme:** Taraflar arasında kanunda düzenlenmemiş, karşılıklı borç yükleyen bir sözleşme vardır; buna genel hükümler uygulanır. Mehmet'in iki borcu farklı niteliktedir. İki metreden yüksek yapı yapmamak bir **yapmama borcu**, ağaçları budatmak ise bir **yapma borcudur** (TBK m. 113).

      **Hukuki sorunlar:** (1) Budama sırasında verilen zarar ve sorumsuzluk kaydının geçerliliği. (2) İspat yükü. (3) Yapma borcunun ifa edilmemesinin sonuçları. (4) Yapmama borcuna aykırılığın sonuçları.

      **İlgili hükümler:** TBK m. 112, m. 113, m. 114, m. 115; TBK m. 123 vd.

      **Değerlendirme:**
      - *Çatı zararı:* Mehmet 2025'te budama borcunu kendisi ifa etmiştir. Ama ifa sırasında pansiyona zarar vermemek, yani koruma yükümlülüğüne uymak zorundaydı. Dalın çatıya düşmesi borcun gereği gibi ifa edilmemesidir (TBK m. 112). Borçlu her türlü kusurdan sorumludur (TBK m. 114/1).
      - *Kayıt:* Kayıt önceden yapılmış bir sorumsuzluk anlaşmasıdır. Taraflar pazarlık ederek koyduğu için genel işlem koşulu denetimi gündeme gelmez; pansiyon işleten Zeynep tüketici de değildir. Ortada hizmet sözleşmesi ya da izinle yürütülen bir uzmanlık işi de yoktur. Ölçü yalnız TBK m. 115/1'dir: kayıt **hafif kusur** bakımından geçerli olurdu. Ancak Mehmet deneyimsiz olduğu hâlde açık bir uyarıyı dinlememiş ve dalı sabitlemek gibi en basit önlemi almamıştır. Bu, herkesin göstereceği en basit özenin gösterilmemesi, yani **ağır ihmaldir**. Ağır kusurdan sorumsuzluğa ilişkin önceden yapılan anlaşma kesin hükümsüzdür. Mehmet 45.000 TL'lik onarım bedelinden sorumludur.
      - *İspat:* Zeynep sözleşmeyi, dalın budama sırasında çatıya düşmesini, zararı ve illiyet bağını ispatlar. Kusur karine olarak var sayılır ve Mehmet kusursuzluğunu ispatlayamaz (TBK m. 112). Kusurun ağır olduğu da olaydaki somut olgulardan, yani uyarıya rağmen önlemsiz kesimden açıkça anlaşılmaktadır.
      - *Budatılmayan ağaçlar (2026):* Mehmet ihtara rağmen yapma borcunu ifa etmemiştir. Zeynep, masrafı Mehmet'e ait olmak üzere budamanın kendisi ya da bir bahçıvan tarafından yapılmasına izin verilmesini hâkimden isteyebilir. Her türlü giderim isteme hakkı da saklıdır (TBK m. 113/1). Sözleşme karşılıklı borç yüklediği için borçlunun temerrüdüne bağlanan seçimlik haklar da (TBK m. 123 vd.) gündeme gelir; ayrıntısı ayrı konudadır.
      - *Depo:* Dört metrelik depo, yapmama borcuna aykırıdır. Mehmet bu aykırılığın doğurduğu zararı gidermekle yükümlüdür (TBK m. 113/2). Bilirkişiye göre haziran ayındaki 90.000 TL gelir azalmasının tamamı depodan kaynaklandığı için bu yoksun kalınan kâr tazmin edilir. Zeynep ayrıca aykırılığın ortadan kaldırılmasını, yani deponun iki metreyi aşan kısmının kaldırılmasını isteyebilir. İsterse masrafı Mehmet'e ait olmak üzere bu işi kendisinin yaptırmaya yetkili kılınmasını da talep edebilir (TBK m. 113/3).

      **Sonuç:** Kayıt ağır kusuru kapsayamayacağı için Mehmet çatı onarımının 45.000 TL'sinden sorumludur. Zeynep, budama için masrafı Mehmet'e ait olmak üzere başkasına yaptırma izni ve giderim isteyebilir. Depo için 90.000 TL tazminatı ve deponun fazla kısmının kaldırılmasını ya da bunun için yetki verilmesini isteyebilir.

  - olay: |
      Ece ve Can, 12 Eylül 2026'daki düğünleri için Mutlu Gün Organizasyon Ltd. Şti. ile 400.000 TL bedelli bir sözleşme yapar ve 100.000 TL kapora öder. Sözleşme, şirketin bütün müşterilerine imzalattığı matbu bir metindir. Maddeler çiftle tartışılmamış, şirket yetkilisi imza sırasında aşağıdaki maddeden hiç söz etmemiştir. Sözleşmenin 14. maddesinde küçük puntoyla şunlar yazılıdır: "Şirket, ses-ışık ve ikram hizmetlerini yaptırdığı firmaların ve çalışanlarının kusurundan sorumlu değildir. Şirketin sorumluluğu her hâlde ödenen kapora tutarıyla sınırlıdır."

      Düğün günü, şirketin ses sistemi için anlaştığı firma hiç gelmez; nikâh töreni ve ilk dans müziksiz yapılır. Çift son anda başka bir firmadan 30.000 TL'ye ses sistemi kiralar, ama sistem ancak gece yarısına doğru kurulabilir. Ayrıca şirketin ikram için anlaştığı firmanın garsonu, dikkatsizce taşıdığı içecek tepsisini gelinin üzerine devirir. 80.000 TL değerindeki gelinlik lekelenir ve temizlenemez. Şirket, firmaları piyasadaki en iyi firmalar arasından özenle seçtiğini ve 14. maddeyi ileri sürerek hiçbir ödeme yapmaz.

      1. Şirketin sorumluluğunun dayanağını ve şartlarını değerlendiriniz.
      2. Şirket, firmaları özenle seçtiğini ispatlayarak kurtulabilir mi?
      3. 14. maddedeki iki kayıt geçerli midir?
      4. Çift hangi maddi tazminatları isteyebilir; manevi tazminat isteyebilir mi?
    olcut:
      - {tespit: "Tüketici sözleşmesi ve genel işlem koşulu niteliği; ses ve ikram firmalarının yardımcı kişi sayılması", puan: 15, madde: "TBK m. 116"}
      - {tespit: "Ses hizmetinin ifa edilmemesi ve gelinliğin lekelenmesinin borca aykırılık olarak nitelendirilmesi", puan: 15, madde: "TBK m. 112"}
      - {tespit: "Özenle seçme savunmasının dinlenmemesi ve varsayımsal kusur ölçütü", puan: 15, madde: "TBK m. 116"}
      - {tespit: "Yardımcı kişi kaydının m. 116/2'ye rağmen genel işlem koşulu ve haksız şart denetimiyle etkisiz kalması", puan: 20, madde: "TKHK m. 5"}
      - {tespit: "Kapora ile sınırlama kaydının kısmi sorumsuzluk olarak geçersizliği", puan: 10, madde: "TBK m. 115"}
      - {tespit: "Ses kiralama bedeli ve gelinlik değerinin maddi tazminat olarak istenmesi", puan: 10, madde: "TBK m. 112"}
      - {tespit: "Manevi tazminatın m. 114/2 yoluyla m. 58'e dayanması ve kişilik hakkının zedelenmesi şartı", puan: 15, madde: "TBK m. 114"}
    cozum: |
      **Nitelendirme:** Ece ve Can sözleşmeyi ticari olmayan bir amaçla yapmıştır; şirket ise mesleki olarak hizmet sunmaktadır. Sözleşme bir **tüketici sözleşmesidir** (TKHK m. 3). Metin, şirketin çok sayıda sözleşmede kullanmak üzere önceden ve tek başına hazırladığı hükümlerden oluştuğu için **genel işlem koşulu** içerir (TBK m. 20). Ses ve ikram firmaları, şirketin borcunun bir kısmını onun iradesiyle ifa eden **yardımcı kişilerdir** (TBK m. 116/1). Bağımsız şirket olmaları sonucu değiştirmez, çünkü yardımcı kişi için bağımlılık aranmaz.

      **Hukuki sorunlar:** (1) Şirketin borca aykırılıktan sorumluluğu. (2) Özen kanıtıyla kurtuluş. (3) Sorumsuzluk ve sınırlama kayıtlarının geçerliliği. (4) Maddi ve manevi tazminat.

      **İlgili hükümler:** TBK m. 112, m. 114, m. 115, m. 116; TBK m. 20, m. 21; TKHK m. 5; TBK m. 58.

      **Değerlendirme:**
      - *Borca aykırılıklar:* Ses firmasının gelmemesi, şirketin üstlendiği edimin bir kısmının hiç ifa edilmemesidir. Gelinliğin lekelenmesi ise ikram yapılırken alacaklının malvarlığına zarar vermeme, yani koruma yükümlülüğünün ihlalidir. Her iki zarar da yardımcıların işi yürüttükleri sırada doğmuştur (TBK m. 112, m. 116/1).
      - *Özen savunması:* TBK m. 116'da, adam çalıştıranın sorumluluğundaki gibi bir kurtuluş kanıtı yoktur. Belirleyici olan varsayımsal kusurdur: şirket ses sistemini getirmeseydi ya da tepsiyi kendisi devirseydi bu ona kusur olarak yüklenirdi. Firmaları özenle seçmiş olması onu kurtarmaz.
      - *Yardımcı kişiler için kayıt:* Yardımcı kişilerden sorumluluğun önceden kaldırılması kural olarak mümkündür (TBK m. 116/2). Düğün organizasyonu izinle yürütülen bir uzmanlık işi olmadığından m. 116/3 de uygulanmaz. Ancak iki denetim kaydı etkisiz kılar. Birincisi, şirket bu aleyhe koşul hakkında açıkça bilgi vermediği için kayıt **yazılmamış sayılır** (TBK m. 21/1). İkincisi, tüketiciyle müzakere edilmeden konan ve onun aleyhine dengesizlik yaratan bu şart **haksız şarttır** ve kesin hükümsüzdür (TKHK m. 5/1-2). Yönetmeliğin örnek listesi de edimin hiç, kısmen veya ayıplı ifasında tüketicinin yasal haklarını kaldıran ya da ölçüsüz sınırlayan şartları ve tüketicinin maddi zarara uğraması hâlinde sorumluluğu kaldıran şartları haksız sayar.
      - *Kapora ile sınırlama:* Bu kayıt kısmi bir sorumsuzluk anlaşmasıdır ve yukarıdaki iki denetim burada da aynı sonucu verir. Ayrıca "her hâlde" ifadesiyle şirketin ağır kusurunu da kapsadığı ölçüde TBK m. 115/1'e göre kesin hükümsüzdür. Sözleşmenin geri kalanı geçerlidir; şirket bu kayıtlar olmasaydı sözleşmeyi yapmayacağını ileri süremez (TKHK m. 5/2).
      - *Maddi tazminat:* Çift, son anda kiraladığı ses sistemi için ödediği 30.000 TL'yi ve temizlenemeyen gelinliğin değeri olan 80.000 TL'yi isteyebilir (TBK m. 112). Hâkim tazminatın kapsamını m. 114/2 yoluyla m. 51'e göre belirler. İfa edilmeyen kısım için bedelden indirim gibi seçimlik haklar ayrı konudadır.
      - *Manevi tazminat:* Sözleşmeye aykırılık tek başına manevi tazminat gerektirmez. Ancak aykırılık kişilik hakkını zedelemişse TBK m. 114/2 yoluyla TBK m. 58 uygulanır. Yargıtay Hukuk Genel Kurulu, organizasyonun düğünden bir gün önce iptal edildiği bir olayda, düğün gibi insan hayatında genellikle bir kez yaşanan ve tekrarı mümkün olmayan bir günde yaşanan aksaklıkların acı ve üzüntüye yol açarak kişilik haklarını zedelediğini kabul etmiştir. Nikâhın ve ilk dansın müziksiz yapılması ve gelinliğin düğünün ortasında lekelenmesi bu ölçüte uyar. Çift manevi tazminat isteyebilir; miktarı hâkim olayın özelliklerine göre takdir eder.

      **Sonuç:** Şirket TBK m. 112 ve m. 116'ya göre sorumludur; özen savunması ve 14. maddedeki kayıtlar onu kurtarmaz. Çift 30.000 TL ve 80.000 TL maddi tazminatı, ayrıca kişilik haklarının zedelenmesi nedeniyle uygun bir manevi tazminatı isteyebilir.

kartlar:
  - on: "TBK m. 112'de kusurun ispat yükü kimdedir?"
    arka: "Borçlu, kendisine hiçbir kusurun yüklenemeyeceğini ispatlar. Alacaklı ise borç ilişkisini, aykırılığı, zararı ve uygun illiyet bağını ispatlar."
  - on: "Borca aykırılığın üç türü nedir?"
    arka: "Hiç ifa etmeme, kötü ifa ve sözleşmenin olumlu ihlali (yan ve koruma yükümlülüklerinin ihlali)."
  - on: "Borçlunun kusuruyla imkânsızlaşan borç sona erer mi?"
    arka: "Hayır. Borç TBK m. 112'ye göre tazminat borcuna dönüşür. Borçlunun sorumlu tutulamayacağı imkânsızlıkta borç sona erer (TBK m. 136)."
  - on: "Koruma yükümlülüğü nedir?"
    arka: "Borçlunun ifa sırasında alacaklının bedenine ve malvarlığına zarar vermeme yükümlülüğü. Dürüstlük kuralına (TMK m. 2) dayanır."
  - on: "Yapma borcu ifa edilmezse alacaklı ne ister? (TBK m. 113/1)"
    arka: "Masrafı borçluya ait olmak üzere edimin kendisi veya başkası tarafından ifasına izin verilmesini. Her türlü giderim hakkı da saklıdır."
  - on: "Yapmama borcuna aykırılıkta alacaklının hakları? (TBK m. 113/2-3)"
    arka: "Zararın giderilmesi; ayrıca aykırılığın ortadan kaldırılması ya da masrafı borçluya ait olmak üzere bunun için kendisinin yetkili kılınması."
  - on: "Borçlu hangi kusurlardan sorumludur? (TBK m. 114/1)"
    arka: "Genel olarak her türlü kusurdan; hafif ihmal de yeter. Kapsam işin özel niteliğine göre belirlenir."
  - on: "İş borçluya yarar sağlamıyorsa ne olur?"
    arka: "Sorumluluk daha hafif olarak değerlendirilir (TBK m. 114/1). Örnek: karşılıksız saklama."
  - on: "TBK m. 114/2 ne der?"
    arka: "Haksız fiil sorumluluğuna ilişkin hükümler kıyas yoluyla sözleşmeye aykırılık hâllerine de uygulanır."
  - on: "Sözleşmeye aykırılıkta manevi tazminat ne zaman istenir?"
    arka: "Aykırılık tek başına yetmez. Kişilik hakkı zedelenmişse m. 114/2 yoluyla m. 58, bedensel bütünlük zedelenmişse m. 56 uygulanır (Yargıtay HGK)."
  - on: "Ağır kusurdan sorumsuzluk anlaşması geçerli mi? (TBK m. 115/1)"
    arka: "Önceden yapılmışsa kesin hükümsüzdür. Ağır kusur kastı ve ağır ihmali kapsar."
  - on: "Hizmet sözleşmesinde sorumsuzluk anlaşması? (TBK m. 115/2)"
    arka: "Hizmet sözleşmesinden kaynaklanan herhangi bir borç için önceden yapılan her türlü sorumsuzluk anlaşması kesin hükümsüzdür."
  - on: "TBK m. 115/3'ün iki şartı nedir?"
    arka: "Uzmanlık gerektiren bir hizmet, meslek veya sanat olması ve bunun ancak kanun ya da yetkili makam izniyle yürütülebilmesi. O zaman hafif kusurdan sorumsuzluk da kesin hükümsüzdür."
  - on: "Sorumsuzluk kaydı hükümsüzse sözleşmenin tamamı düşer mi?"
    arka: "Kural olarak hayır; yalnız kayıt hükümsüzdür (TBK m. 27/2). Genel işlem koşullarında ve tüketici sözleşmelerinde düzenleyen, kayıt olmasa sözleşmeyi yapmayacağını ileri süremez (TBK m. 22, TKHK m. 5/2)."
  - on: "Yardımcı kişi olmak için bağımlılık gerekir mi?"
    arka: "Hayır. Borçlunun iradesiyle ifaya katılan aile bireyi, işçi ya da bağımsız bir firma da yardımcı kişidir (TBK m. 116/1)."
  - on: "Varsayımsal (farazi) kusur ölçütü nedir?"
    arka: "Yardımcının davranışını borçlu kendisi yapsaydı bu ona kusur olarak yüklenebilir miydi? Cevap evetse borçlu TBK m. 116'ya göre sorumludur."
  - on: "TBK m. 116 ile m. 66'nın temel farkı nedir?"
    arka: "m. 116 önceden kurulmuş borç ilişkisinde uygulanır ve özen kanıtıyla kurtuluş yoktur. m. 66 sözleşme dışıdır; adam çalıştıran gerekli özeni gösterdiğini ispatlayarak kurtulabilir."
  - on: "Yardımcı kişiler için sorumsuzluk kaydı geçerli mi? (TBK m. 116/2-3)"
    arka: "Kural olarak sorumluluk tamamen veya kısmen kaldırılabilir. İzinle yürütülen uzmanlık işlerinde ise böyle bir anlaşma kesin hükümsüzdür."
  - on: "Özel hastanede hastanın sözleşme tarafı kimdir?"
    arka: "Kural olarak hastane (hastaneye kabul sözleşmesi). Hekim ve hemşire hastanenin yardımcı kişileridir."
  - on: "Otoparktaki 'sorumluluk kabul edilmez' levhası işleteni kurtarır mı?"
    arka: "Hayır (TBK m. 579/3). İşleten ancak kanunda sayılan sebepleri ispatlayarak kurtulur (TBK m. 579/1)."
  - on: "Olumlu ve olumsuz zarar arasındaki fark nedir?"
    arka: "Olumlu zarar, sözleşme ifa edilseydi ulaşılacak durumla aradaki farktır (ifa yararı). Olumsuz zarar, sözleşmeye güvenilmesi yüzünden uğranılan zarardır (güven yararı)."
  - on: "Sözleşmeye aykırılıkta zamanaşımı kuralı nedir?"
    arka: "Kanunda aksine hüküm yoksa on yıl (TBK m. 146). Bazı sözleşmelerden doğan alacaklarda beş yıl (TBK m. 147)."
