  - id: "638623900"
    ozet: |
      Davacı iş sahibi, şantiyesine kurulacak bir asfalt plentinin imali ve montajı için davalı yükleniciyle sözleşme yapmış, eser zamanında teslim edilmeyince sözleşmeyi feshetmiştir. Yüklenicinin şantiyeye getirdiği yedi bitüm tankı ile bir kızgın yağ jeneratörü ve bacası iş sahibinin elinde kalmış; iş sahibi iki ihtarla bunların alınmasını istemiş, sonuç alamayınca korunma ve saklama giderinin malzemelerin değerini aştığını ileri sürerek satışa izin verilmesini talep etmiştir. İlk derece mahkemesi, davacının tevdi edeceği bir borç konusu bulunmadığı gerekçesiyle davayı hukuki yarar yokluğundan reddetmiş, özel dairenin bozma kararına da direnmiştir. Hukuk Genel Kurulu direnme kararını oy birliğiyle bozmuştur. Gerekçeye göre fesihle iş sahibi bu malzemeleri iade borcu altına girmiş, ihtarlara rağmen almayan yüklenici temerrüde düşmüştür. İhtar şartı yerine getirildiğinden TBK m. 108'in şartları keşifle araştırılmalıdır; satış şartlarının gerçekleşip gerçekleşmediğine ve satışın biçimine borçlu değil mahkeme karar verir. Konuya katkısı: alacaklı ve borçlu sıfatının somut borca göre belirlendiğini ve satma hakkında ihtar ile hâkim izninin önemini gösterir.
  - id: "429146200"
    ozet: |
      Kullandığı araçla yaptığı kazada ölen sürücünün eşi ve çocukları, aracın trafik sigortacısına destekten yoksun kalma tazminatı davası açmış ve talebi ıslahla 250.000 TL'ye çıkarmıştır. Sigortacı, ıslah dilekçesinin tebliğinden sonra asıl alacak ve fer'ileri olarak kendi hesapladığı toplam 296.400 TL'yi davacılar vekilinin hesabına yatırmış; vekil, uzlaşma olmadığı ve hesabın neye göre yapıldığının belli olmadığı gerekçesiyle parayı iade etmiştir. Mahkeme, parayı iade eden davacıların alacaklı temerrüdüne düştüğünü ve davanın konusuz kaldığını kabul etmiştir. Yargıtay 17. Hukuk Dairesi kararı bozmuştur. Gerekçeye göre sigortacı fer'iler, özellikle faiz türü konusunda kendi belirlemesiyle ödeme yaptığından davacıların kabulden kaçınma hakkı vardır ve alacaklı temerrüdünün şartları oluşmamıştır. Daire, temerrüt gerçekleşmiş sayılsa bile TBK m. 109/2 uyarınca alacağın yan haklarıyla sürdüğünü, ödemenin yalnız davalının temerrüdünü kesip temerrüt faizini durduracağını belirtmiştir. Konuya katkısı: alacaklı temerrüdünün borcu sona erdirmediğini ve tartışmalı bir hesapla yapılan öneriyi reddetmenin haklı sebep olabileceğini gösterir.
  - id: "1155984600"
    ozet: |
      İki bölge adliye mahkemesi dairesi, kiracının ödeme yeri (tevdi mahalli) belirlenmesi talebinde talep dilekçesinin kiraya verene tebliğinin gerekip gerekmediği konusunda farklı kesin kararlar vermiştir. Her iki olayda da kiracı, yasal artışla ödediği kiraların iade edildiğini ve kiraya verenin hesabını kapattığını ileri sürmüş; ilk derece mahkemeleri TBK m. 106-107'ye dayanarak alacaklı temerrüdünü kabul edip ödeme yeri belirlemiştir. Uyuşmazlığın giderilmesi istemi üzerine Yargıtay 3. Hukuk Dairesi, tevdi mahalli belirlenmesinin HMK m. 382'de sayılan bir çekişmesiz yargı işi olduğunu, kararın uyuşmazlığın esasını çözmediğini ve kesin hüküm oluşturmadığını vurgulamıştır. Daireye göre sözleşmedeki ya da teamülen kullanılan hesabın kapatılması veya konutta ödemeli gönderilen kiranın alınmaması hâlinde TBK m. 107'ye göre tevdi mahalli gündeme gelir; mahkeme kiraya veren adına açılan bir hesabı belirleyerek kiracının temerrüdünü önler. Tebliğ ve cevap süresi beklenirse kiracı TBK m. 315 ve m. 352/2'deki ağır sonuçlarla karşılaşabileceğinden talep kiraya verene tebliğ edilmeden karara bağlanabilir; bu, hukuki dinlenilme hakkını ihlal etmez. Konuya katkısı: para borcunda tevdiin uygulamadaki işleyişini ve amacını gösterir.

sorular:
  - soru: |
      TBK m. 106/1'de alacaklının temerrüdü için sayılan unsurlar arasında **yer almayan** hangisidir?
    siklar:
      - "Yapma veya verme ediminin alacaklıya gereği gibi önerilmesi"
      - "Alacaklının edimi kabulden ya da kendisine düşen hazırlık fiillerinden kaçınması"
      - "Alacaklının kabulden kaçınmakta kusurlu olması"
      - "Kaçınmanın haklı bir sebebe dayanmaması"
    dogru: 2
    aciklama: |
      TBK m. 106/1 öneriyi, kabulden ya da hazırlık fiillerinden kaçınmayı ve kaçınmanın haklı bir sebebe dayanmamasını arar; kusurdan söz etmez. Baskın görüş de alacaklının kusurunu aramaz. "Haklı sebep" objektif bir ölçüttür ve kusurla aynı şey değildir.

  - soru: |
      Mobilyacı Ali, Ayşe'ye sattığı dolabı kararlaştırılan gün ve saatte Ayşe'nin evine götürür. Ayşe aynı sabah ani bir rahatsızlıkla hastaneye kaldırılmıştır; evde kimse olmadığından teslim yapılamaz. **Baskın görüşe göre** hangisi doğrudur?
    siklar:
      - "Ayşe kusursuz olduğu için alacaklı temerrüdüne düşmez."
      - "Kabulü engelleyen sebep Ayşe'nin kendi alanında doğduğundan, kusuru olmasa da Ayşe alacaklı temerrüdüne düşer."
      - "Dolap teslim edilemediği için Ali borçlu temerrüdüne düşer."
      - "Ali'nin borcu, dolabı götürmekle kendiliğinden sona ermiştir."
    dogru: 1
    aciklama: |
      Alacaklı temerrüdü için kusur aranmaz; belirleyici olan kaçınmanın objektif olarak haklı bir sebebe dayanıp dayanmadığıdır. Alacaklının hastalığı onun kendi alanındaki bir engeldir ve haklı sebep sayılmaz (TBK m. 106/1). Alacaklı temerrüdü varken aynı borç için Ali temerrüde düşmez. Ancak borç kendiliğinden de bitmez; Ali kurtulmak için tevdi gibi kanuni yollara başvurmalıdır.

  - soru: |
      Murat, kış için odun alan komşusu Gül'e 5 ton odunu tek seferde teslim etmeyi üstlenmiştir. Teslim günü yalnız 4 ton getirir; Gül odunu almayı reddeder. Hangisi doğrudur?
    siklar:
      - "Gül 4 tonu almak zorundadır; almadığı için alacaklı temerrüdüne düşmüştür."
      - "Borcun tamamı belli ve muaccel olduğundan Gül kısmi ifayı reddedebilir; reddi haklı olduğundan alacaklı temerrüdüne düşmez."
      - "Murat 4 ton odunu tevdi ederek 5 tonluk borcunun tamamından kurtulur."
      - "Gül'ün reddi kusurlu bir davranış olduğundan Murat'ın zararını tazmin eder."
    dogru: 1
    aciklama: |
      Alacaklı temerrüdü için edimin gereği gibi, yani tam olarak önerilmesi gerekir. Borcun tamamı belli ve muaccelse alacaklı kısmi ifayı reddedebilir (TBK m. 84/1). Bu ret haklı bir sebebe dayandığından Gül temerrüde düşmez (TBK m. 106/1). Eksik edimi tevdi etmek de borcun tamamından kurtarmaz.

  - soru: |
      Terzi Fatma, Elif'in gelinliğini dikmeyi üstlenmiştir; sözleşmeye göre kumaşı Elif getirecektir. Fatma defalarca istemesine rağmen Elif haklı bir sebep olmaksızın kumaşı getirmez. Hangisi doğrudur?
    siklar:
      - "Hazırlık fiilleri TBK m. 106'da sayılmadığından Elif temerrüde düşmez."
      - "Elif'in temerrüde düşmesi için önce Fatma'nın gelinliği dikip tevdi etmesi gerekir."
      - "Kumaşı getirmek Elif'in yapması gereken bir hazırlık fiilidir; bundan haklı bir sebep olmaksızın kaçınan Elif alacaklı temerrüdüne düşer."
      - "Gelinlik zamanında yetişmezse Fatma borçlu temerrüdüne düşer ve gecikme tazminatı öder."
    dogru: 2
    aciklama: |
      TBK m. 106/1, alacaklının yalnız edimi kabulden değil, borçlunun ifa edebilmesi için kendisinin yapması gereken hazırlık fiillerinden kaçınmasını da temerrüt sebebi sayar. Kumaşı vermemek tipik bir hazırlık fiilinden kaçınmadır. Alacaklı temerrüdü aynı edim için borçlu temerrüdünü dışladığından Fatma gecikmeden sorumlu tutulamaz.

  - soru: |
      TBK m. 106/2'ye göre alacaklı, müteselsil borçlulardan birine karşı temerrüde düşerse ne olur?
    siklar:
      - "Yalnız o borçluya karşı temerrüde düşer; diğerleri borçlu temerrüdüne düşebilir."
      - "Diğer borçlular borçtan kendiliğinden kurtulur."
      - "Diğer borçlulara karşı da temerrüde düşmüş olur."
      - "Diğer borçlulara karşı ancak onlara ayrıca ihtar çekilirse temerrüde düşer."
    dogru: 2
    aciklama: |
      TBK m. 106/2 açıktır: Alacaklı müteselsil borçlulardan birine karşı temerrüde düşerse diğerlerine karşı da temerrüde düşmüş olur. Bu, diğer borçluları borçtan kurtarmaz; ama alacaklı temerrüdünün sonuçları, örneğin borçlu temerrüdünün doğmaması, onlar için de geçerli olur.

  - soru: |
      Alacaklının temerrüdünün **genel sonuçları** hakkında hangisi doğrudur?
    siklar:
      - "Alacaklı temerrüdü borcu kendiliğinden sona erdirir."
      - "Borçlu, kural olarak alacaklıyı dava yoluyla edimi kabule zorlayamaz; borcundan ancak tevdi, satış ya da dönme gibi kanuni yollarla kurtulur."
      - "Borçlu, alacaklı temerrüdü nedeniyle her durumda alacaklıdan tazminat isteyebilir."
      - "Alacaklı temerrüdü sürerken aynı alacak için borçlu temerrüdü de devam eder."
    dogru: 1
    aciklama: |
      Kabul, alacaklı için kural olarak bir külfettir. Bu yüzden alacaklı kabule zorlanamaz ve temerrüdü tek başına tazminat doğurmaz. Borç da kendiliğinden bitmez; borçlu TBK m. 107-110'daki yollarla kurtulur. Aynı alacak bakımından alacaklı temerrüdü borçlu temerrüdünü dışlar. Kabulün borç olarak yüklendiği hâller (TBK m. 232/1) ayrıktır.

  - soru: |
      Ahmet, Banu'ya olan 100.000 TL borcunu vadesinde ödemeyip temerrüde düşmüştür. İki ay sonra anapara, işlemiş temerrüt faizi ve masrafların tamamını Banu'nun evine götürür. Banu haklı bir sebep olmaksızın parayı almaz. Hangisi doğrudur?
    siklar:
      - "Banu almadığı için borç kendiliğinden sona ermiştir."
      - "Ahmet temerrüde düşmüş olduğundan önerisi hüküm doğurmaz; temerrüt faizi işlemeye devam eder."
      - "Ahmet'in temerrüdü sona erer ve Banu'nun kabulden kaçındığı andan itibaren temerrüt faizi işlemez; Ahmet borcundan kurtulmak için parayı tevdi etmelidir."
      - "Banu'nun reddi Ahmet'e, Banu'dan her durumda tazminat isteme hakkı verir."
    dogru: 2
    aciklama: |
      Temerrüde düşmüş borçlu, borcun tamamını işlemiş faiz ve masraflarla birlikte gereği gibi önerirse temerrüdü sona erer. Alacaklının haklı sebep olmadan reddiyle alacaklı temerrüdü doğar. Aynı alacak için borçlu temerrüdü bulunamayacağından temerrüt faizi de işlemez (TBK m. 106/1, m. 120). Ancak alacaklı temerrüdü borcu bitirmez; Ahmet kurtulmak için parayı tevdi etmelidir (TBK m. 107).

  - soru: |
      Satış sözleşmesinde alıcının satılanı devralması hakkında hangisi doğrudur?
    siklar:
      - "Alıcı için yalnız bir haktır; devralmamasının satıcı bakımından hiçbir sonucu yoktur."
      - "Alıcı kendisine sunulan satılanı devralmakla yükümlüdür; haklı sebep olmadan devralmayan alıcı alacaklı temerrüdüne düşer ve ayrıca kendi borcuna aykırı davranmış olur."
      - "Alıcı devralmazsa satış sözleşmesi kendiliğinden sona erer."
      - "Devralma borcu yalnız tacirler arasındaki satışlarda vardır."
    dogru: 1
    aciklama: |
      Alacaklının kabulü kural olarak külfettir; ama satışta kanun devralmayı alıcıya borç olarak yüklemiştir (TBK m. 232/1). Bu nedenle devralmaktan kaçınan alıcıya karşı satıcı, tevdi ve satış gibi yolların yanında borca aykırılık ve borçlu temerrüdü hükümlerine de başvurabilir. Sözleşme kendiliğinden sona ermez.

  - soru: |
      Emekli Kaan, kullandığı motosikletini komşusu Ece'ye satmıştır. Kararlaştırılan teslim günü motosikleti hazır eder ve Ece'ye gelip almasını söyler. Ece haklı bir sebep olmaksızın gelmez. İki gün sonra motosiklet, Kaan'ın hiçbir kusuru olmadan çıkan bir yangında yanar. Hangisi doğrudur?
    siklar:
      - "Zilyetlik devredilmediği için hasar Kaan'dadır; Ece bedeli ödemez."
      - "Ece zilyetliği devralmada temerrüde düştüğünden yarar ve hasar ona geçmiştir; Ece satış bedelini ödemekle yükümlüdür."
      - "Kaan motosikleti tevdi etmediği için hasar hiçbir durumda Ece'ye geçmemiştir."
      - "Taraflar zararı yarı yarıya paylaşır."
    dogru: 1
    aciklama: |
      Taşınır satışlarında alıcı satılanın zilyetliğini devralmada temerrüde düşerse, zilyetliğin devri gerçekleşmişçesine yarar ve hasar alıcıya geçer (TBK m. 208/2). Bu özel hüküm karşısında hasarın geçmesi için tevdi beklenmez. Satılan Kaan'ın kusuru olmadan yok olduğu için Ece bedeli öder.

  - soru: |
      Ticari mal olmayan bir eşyanın alacaklı temerrüdü nedeniyle tevdi edileceği yeri kim belirler?
    siklar:
      - "Borçlu, dilediği bir depoyu kendisi seçer."
      - "Alacaklının yerleşim yerindeki noter"
      - "İfa yerindeki hâkim"
      - "Borçlunun yerleşim yerindeki icra dairesi"
    dogru: 2
    aciklama: |
      TBK m. 107/2'ye göre tevdi yerini ifa yerindeki hâkim belirler. Bu, sulh hukuk mahkemesinin baktığı bir çekişmesiz yargı işidir (HMK m. 382-383). Hâkim kararı olmadan tevdi yalnız ticari mallar için ve bir ardiyeye yapılabilir.

  - soru: |
      TBK m. 107/2'ye göre **ticari mallar** bakımından hangisi doğrudur?
    siklar:
      - "Tevdi edilemezler, satılmaları zorunludur."
      - "Hâkim kararı olmadan da bir ardiyeye tevdi edilebilirler."
      - "Ancak alacaklıya önceden ihtar çekildikten sonra tevdi edilebilirler."
      - "Yalnız alacaklının yazılı rızasıyla tevdi edilebilirler."
    dogru: 1
    aciklama: |
      TBK m. 107/2, tevdi yerini kural olarak ifa yerindeki hâkimin belirleyeceğini söyledikten sonra ticari malların hâkim kararı olmadan da bir ardiyeye tevdi edilebileceğini kabul eder. Tevdi için kanun önceden ihtar aramaz; önceden ihtar satma hakkının şartıdır (TBK m. 108/1).

  - soru: |
      TBK m. 108/1'e göre aşağıdakilerden hangisi borçluya **satma hakkı vermez**?
    siklar:
      - "Teslim edilecek şeyin bozulabilir olması"
      - "Şeyin bakımının, korunmasının ya da tevdiinin önemli bir gider gerektirmesi"
      - "Şeyin niteliğinin veya işin özelliğinin tevdie uygun olmaması"
      - "Alacaklının borçluya uzak bir şehirde oturması"
    dogru: 3
    aciklama: |
      TBK m. 108/1 üç sebep sayar: şeyin niteliği veya işin özelliğinin tevdie uygun olmaması, şeyin bozulabilir olması ve bakımının, korunmasının ya da tevdiinin önemli bir gider gerektirmesi. Alacaklının uzakta oturması tek başına satış sebebi değildir; borçlu bu durumda tevdi yolunu kullanır.

  - soru: |
      Bahçesinde sebze yetiştiren Mehmet, komşusu Zeynep'e 300 kg domates satmıştır. Teslim günü Zeynep haklı bir sebep olmaksızın domatesleri almaz. Domatesler birkaç gün içinde bozulacaktır ve pazarda belirli bir fiyatları vardır. Mehmet'in hukuki durumu hakkında hangisi doğrudur?
    siklar:
      - "Hâkimin izniyle domatesleri sattırıp bedelini tevdi edebilir; piyasa fiyatı olduğu için satışın açık artırmayla yapılması zorunlu değildir."
      - "Domatesleri hâkim izni olmadan, dilediği fiyata kendi başına satabilir."
      - "Domatesleri bozulmaya bırakıp Zeynep'ten yalnız tazminat isteyebilir; satış yolu kapalıdır."
      - "Satış ancak Zeynep yazılı olarak izin verirse mümkündür."
    dogru: 0
    aciklama: |
      Teslim edilecek şey bozulabilir nitelikteyse borçlu hâkimin izniyle onu sattırıp bedelini tevdi edebilir (TBK m. 108/1). Şeyin piyasa fiyatı varsa açık artırma zorunlu değildir; hâkim önceden ihtar koşulunu da aramayabilir (TBK m. 108/2). Hâkim izni her durumda gerekir, alacaklının rızası ise aranmaz.

  - soru: |
      TBK m. 109'a göre tevdi edilen şeyin geri alınması hakkında hangisi doğrudur?
    siklar:
      - "Tevdi edilen şey hiçbir durumda geri alınamaz."
      - "Borçlu geri alabilir; ancak geri alınca alacak sona erer ve alacaklı yalnız tazminat isteyebilir."
      - "Alacaklı kabul ettiğini açıklamadıkça ya da tevdi bir rehnin kalkması sonucunu doğurmadıkça borçlu geri alabilir; geri alırsa alacak bütün yan haklarıyla varlığını sürdürür."
      - "Geri alma yalnız alacaklının yazılı izniyle mümkündür ve geri alınca rehin ile kefalet sona erer."
    dogru: 2
    aciklama: |
      TBK m. 109/1 geri almayı iki durumda engeller: alacaklının tevdi edilen şeyi kabul ettiğini açıklaması ve tevdiin bir rehnin ortadan kaldırılması sonucunu doğurması. Bunların dışında borçlu geri alabilir. Geri alma anında alacak bütün yan haklarıyla birlikte varlığını sürdürür (TBK m. 109/2).

  - soru: |
      Yargıtay 3. Hukuk Dairesinin 2025'te bölge adliye mahkemeleri arasındaki görüş ayrılığını gideren kararına göre, kiracının ödeme yeri (tevdi mahalli) belirlenmesi talebi hakkında hangisi doğrudur?
    siklar:
      - "Çekişmeli bir dava olduğundan talep kiraya verene tebliğ edilmeli ve cevap süresi beklenmelidir."
      - "Çekişmesiz yargı işi olduğundan talep kiraya verene tebliğ edilmeden karara bağlanabilir; bu, hukuki dinlenilme hakkını ihlal etmez."
      - "Verilen karar kira bedelinin miktarı konusunda kesin hüküm oluşturur."
      - "Talep asliye hukuk mahkemesinde, dava yoluyla ileri sürülmelidir."
    dogru: 1
    aciklama: |
      Tevdi mahalli belirlenmesi HMK m. 382'de çekişmesiz yargı işleri arasında sayılır ve görevli mahkeme sulh hukuk mahkemesidir (HMK m. 383). Yargıtay, tebliğ ve cevap süresinin beklenmesinin kiracıyı temerrüde ve tahliye riskine sokabileceğini belirterek talebin tebliğsiz karara bağlanabileceğini kabul etmiştir. Karar uyuşmazlığın esasını çözmez ve kesin hüküm oluşturmaz; ilgililer istinafa başvurabilir.

  - soru: |
      Ressam Deniz, Can'ın portresini yapmayı üstlenmiştir. Sözleşmeye göre Can her cumartesi poz vermek için atölyeye gelecektir. Can haklı bir sebep olmaksızın bir aydır gelmemekte, portreye bu yüzden başlanamamaktadır. Deniz'in hukuki durumu hakkında hangisi doğrudur?
    siklar:
      - "Tevdi edilecek bir şey olmadığından Deniz sözleşmeyle süresiz olarak bağlı kalır."
      - "Deniz, Can'a uygun bir süre verip bu sürede de gelmezse, borçlu temerrüdüne ilişkin hükümlere göre sözleşmeden dönebilir."
      - "Deniz boş tuvali tevdi ederek borcundan kurtulur."
      - "Can'ın gelmemesi Deniz'i kendiliğinden borcundan kurtarır ve sözleşme sona erer."
    dogru: 1
    aciklama: |
      Borcun konusu bir şeyin teslimini gerektirmiyorsa borçlu, alacaklı temerrüdünde borçlu temerrüdüne ilişkin hükümlere göre sözleşmeden dönebilir (TBK m. 110). Bu atıf nedeniyle Deniz kural olarak uygun bir süre verir (TBK m. 123) ve süre sonuçsuz kalırsa dönme iradesini açıklar (TBK m. 125). Alacaklı temerrüdü sözleşmeyi kendiliğinden sona erdirmez.

  - soru: |
      Kiracı Emre'nin kiraladığı dairenin maliki ve kiraya vereni Hasan ölmüştür. Mirasçılardan biri kiranın kendisine, diğeri başka bir hesaba ödenmesini noter ihtarıyla istemektedir; mirasçılık belgesi de ibraz edilmemiştir. Emre için hangisi doğrudur?
    siklar:
      - "Tevdi yalnız alacaklının temerrüdü hâlinde mümkün olduğundan Emre'nin tevdi imkânı yoktur."
      - "Alacaklının kim olduğunda kusuru olmaksızın duraksadığı için Emre, sulh hukuk mahkemesinden tevdi yeri belirlenmesini isteyip kirayı oraya yatırabilir."
      - "Emre kirayı ilk ihtarı gönderen mirasçıya öderse her durumda borcundan kurtulur."
      - "Emre'nin kirayı kendi adına açtığı bir hesapta bekletmesi tevdi sayılır."
    dogru: 1
    aciklama: |
      TBK m. 111'e göre borçlunun kusuru olmaksızın alacağın kime ait olduğunda ya da alacaklının kimliğinde duraksama nedeniyle borç ifa edilemiyorsa borçlu, alacaklı temerrüdündeki gibi tevdi hakkını kullanabilir. Tevdi yerini ifa yerindeki hâkim belirler (TBK m. 107/2). Borçlunun parayı kendi hesabında tutması tevdi değildir.

  - soru: |
      Kiracı Selin kirayı yıllardır sözleşmede yazılı banka hesabına yatırmaktadır. Kira artışında anlaşamayan kiraya veren Kemal hesabı kapatmış, Selin'in havalesi geri dönmüştür. Selin'in temerrüde düşmemek için izleyeceği en doğru yol hangisidir?
    siklar:
      - "Kemal'e karşı dava açarak onu parayı kabul etmeye zorlamak"
      - "Kemal alacaklı temerrüdüne düştüğü için kira borcunun sona erdiğini kabul edip ödemeyi bırakmak"
      - "Sulh hukuk mahkemesinden tevdi mahalli (ödeme yeri) belirlenmesini isteyip kirayı belirlenen hesaba yatırmak"
      - "Kirayı kendi banka hesabında biriktirip Kemal'e yazıyla bildirmek"
    dogru: 2
    aciklama: |
      Sözleşmede ödeme yeri olarak belirlenen hesabın kiraya veren tarafından kapatılması alacaklı temerrüdü doğurur (TBK m. 106/1). Alacaklı kabule zorlanamaz ve temerrüt borcu kendiliğinden bitirmez. Kiracı sulh hukuk mahkemesinden tevdi yeri belirlenmesini isteyerek kirayı oraya yatırır (TBK m. 107/2, HMK m. 383). Böylece temerrüde ve TBK m. 315'e dayalı fesih riskine düşmez.

  - soru: |
      Kira sözleşmesi sona eren kiracı Burak evi boşaltmış, ancak kiraya veren Leyla anahtarı teslim almamıştır. Burak'ın kira borcundan kurtulması için hangisi doğrudur?
    siklar:
      - "Evi boşaltması yeterlidir; anahtarın teslimi önem taşımaz."
      - "Anahtarı tevdi yerine (uygulamada notere de) teslim edip durumu Leyla'ya bildirmelidir; iade borcu bildirim tarihinde sona erer."
      - "Anahtarı kapının önüne bırakıp fotoğrafını çekmesi yeterlidir."
      - "Leyla anahtarı almadığı sürece Burak, sözleşme sona ermiş olsa da kira bedelinden hiçbir şekilde kurtulamaz."
    dogru: 1
    aciklama: |
      Kiracı sözleşme sonunda kiralananı geri vermekle yükümlüdür (TBK m. 334/1) ve iade için anahtarın teslimi gerekir. Kiraya veren anahtarı almazsa kiracı tevdi yolunu kullanır. Yargıtay'a göre kiracının iade borcu, anahtarın tevdi edildiğinin kiraya verene bildirildiği tarihte sona erer; o tarihe kadar kira bedeli dâhil yükümlülükleri sürer.

  - soru: |
      Alacaklının temerrüdü ile borçlunun temerrüdünü karşılaştıran ifadelerden hangisi doğrudur?
    siklar:
      - "Her ikisi de ancak noter ihtarıyla doğar."
      - "Borçlu temerrüdü kural olarak muaccel borçta alacaklının ihtarıyla, alacaklı temerrüdü ise gereği gibi önerilen edimin haklı bir sebep olmaksızın kabul edilmemesiyle doğar."
      - "Aynı alacak bakımından ikisi aynı anda bulunabilir."
      - "Alacaklı temerrüdünde de borçlu temerrüdünde de temerrüde düşen taraf kural olarak temerrüt faizi öder."
    dogru: 1
    aciklama: |
      Muaccel bir borcun borçlusu kural olarak alacaklının ihtarıyla temerrüde düşer (TBK m. 117/1). Alacaklı ise kendisine gereği gibi önerilen edimi haklı bir sebep olmaksızın kabul etmezse ya da hazırlık fiillerinden kaçınırsa temerrüde düşer (TBK m. 106/1). Aynı alacak için iki temerrüt bir arada bulunmaz. Temerrüt faizi borçlu temerrüdünün sonucudur (TBK m. 120); alacaklı temerrüdü faiz borcu doğurmaz.

olaylar:
  - olay: |
      Emekli öğretmen Nihat, kullandığı piyanoyu 60.000 TL'ye, bahçesinden toplayacağı 300 kg kirazı da 30.000 TL'ye komşusu Sevgi'ye satar. Sevgi toplam 90.000 TL'yi sözleşme günü peşin öder. Taraflar, Sevgi'nin 10 Haziran'da Nihat'ın evine gelip piyanoyu ve kirazları alacağını kararlaştırır.

      10 Haziran sabahı Nihat piyanoyu taşımaya hazır hâle getirir, kirazları toplayıp kasalara koyar ve Sevgi'yi arayarak her şeyin hazır olduğunu bildirir. Kiraz fiyatlarının düştüğünü ve daha uygun bir piyano bulduğunu söyleyen Sevgi, "Vazgeçtim, hiçbirini almayacağım, paramı geri verin" der ve gelmez.

      Nihat 11 Haziran'da noter aracılığıyla Sevgi'ye kirazların bozulacağını ve mahkemeden satış izni isteyeceğini bildirir. Sulh hukuk mahkemesinin izniyle kirazlar, açık artırma yapılmadan pazarda o günkü fiyattan 20.000 TL'ye satılır. Bedel, mahkemenin belirlediği banka hesabına Sevgi adına yatırılır.

      Piyanoyu ise Nihat henüz bir yere bırakmamıştır. 15 Haziran'da apartmanda, Nihat'ın hiçbir kusuru olmadan meydana gelen bir su baskınında piyano zarar görür ve değeri 10.000 TL düşer.

      Sevgi şunları ileri sürmektedir: "Kirazlar benim iznim olmadan ve açık artırma yapılmadan satıldı; ödediğim 30.000 TL'yi geri isterim. Piyano bana teslim edilmedi, zarar Nihat'a aittir; en azından 10.000 TL indirim yapılmalı."

      1. Sevgi alacaklı temerrüdüne düşmüş müdür? "Vazgeçtim" demesinin hukuki değeri nedir?
      2. Kirazların satışı hukuka uygun mudur? Sevgi ödediği 30.000 TL'yi geri isteyebilir mi?
      3. Piyanodaki zarara kim katlanır?
      4. Nihat piyano bakımından borcundan nasıl kurtulabilir?
    olcut:
      - {tespit: "Gereği gibi öneri ve fiyat düşüşünün haklı sebep olmaması; Sevgi'nin alacaklı temerrüdü", puan: 20, madde: "TBK m. 106"}
      - {tespit: "Tek taraflı vazgeçme beyanının sözleşmeyi sona erdirmemesi; alacaklı temerrüdünün borcu kendiliğinden bitirmemesi", puan: 10, madde: "TBK m. 106"}
      - {tespit: "Bozulabilir kirazların hâkim izniyle satışı; piyasa fiyatı nedeniyle açık artırmanın zorunlu olmaması; alacaklının rızasının aranmaması", puan: 20, madde: "TBK m. 108"}
      - {tespit: "Satış bedelinin tevdiiyle Nihat'ın kiraz borcundan kurtulması; Sevgi'nin bedeli geri isteyemeyip yalnız tevdi edilen tutarı alabilmesi", puan: 15, madde: "TBK m. 108"}
      - {tespit: "Taşınır satışında devralma temerrüdüyle yarar ve hasarın alıcıya geçmesi; indirim isteminin reddi", puan: 20, madde: "TBK m. 208"}
      - {tespit: "Piyanonun ifa yerindeki sulh hukuk hâkiminin belirleyeceği yere tevdii; hasar ve giderlerin Sevgi'ye ait olması; alıcının devralma borcu", puan: 15, madde: "TBK m. 107"}
    cozum: |
      **Nitelendirme:** Taraflar arasında iki taşınırın, piyano ve kirazın satışına ilişkin bir satış sözleşmesi vardır. Nihat teslim borcunun borçlusu, Sevgi bu borcun alacaklısıdır. Sevgi bedeli ödemiş, ancak satılanları almaktan kaçınmıştır. Sorun alacaklının temerrüdü ve sonuçlarıdır (TBK m. 106-109). Hasar bakımından satışa ilişkin özel hüküm (TBK m. 208/2) uygulanır.

      **Hukuki sorunlar:** (1) Alacaklı temerrüdünün şartları gerçekleşmiş midir? (2) Kirazların satışı usulüne uygun mudur, sonucu nedir? (3) Piyanodaki hasar kime aittir? (4) Nihat piyano borcundan nasıl kurtulur?

      **İlgili hükümler:** TBK m. 106/1, m. 107, m. 108, m. 208/2, m. 232/1; HMK m. 382-383.

      **Değerlendirme:**

      *1. Alacaklı temerrüdü:* Teslim günü belliydi ve Sevgi'nin Nihat'ın evine gelip alacağı kararlaştırılmıştı; yani aranacak bir borç söz konusudur. Nihat edimleri eksiksiz hazırlamış ve Sevgi'ye hazır olduğunu bildirmiştir. Doktrinde aranacak borçlarda bu bildirim yeterli öneri sayılır; üstelik Sevgi almayacağını açıkça söylemiştir. Fiyatların düşmesi ve başka bir piyano bulmak haklı sebep değildir. Bu nedenle Sevgi 10 Haziran'da alacaklı temerrüdüne düşmüştür (TBK m. 106/1). "Vazgeçtim" demesi sözleşmeyi sona erdirmez, çünkü Sevgi'nin sözleşmeden dönmesini sağlayacak bir hakkı yoktur. Alacaklı temerrüdü de borcu kendiliğinden bitirmez; Nihat'ın borçtan kurtulması kanundaki yolları kullanmasına bağlıdır.

      *2. Kirazların satışı:* Kiraz bozulabilir bir maldır ve bu, satma hakkının sebeplerinden biridir (TBK m. 108/1). Nihat önceden ihtarda bulunmuş ve hâkimin iznini almıştır. Kirazın pazarda belirli bir fiyatı olduğundan satışın açık artırmayla yapılması zorunlu değildir (TBK m. 108/2). Kanun alacaklının rızasını aramaz; Sevgi'nin itirazları yerinde değildir. Satış bedeli Sevgi adına tevdi edildiğinden Nihat kiraz teslim borcundan kurtulmuştur. Sevgi'nin ödediği 30.000 TL sözleşmenin karşı edimidir ve geri istenemez. Sevgi'nin hakkı, tevdi edilen 20.000 TL'yi banka hesabından almaktır. Aradaki fark kendi temerrüdünün sonucudur.

      *3. Piyanodaki hasar:* Taşınır satışında alıcı satılanın zilyetliğini devralmada temerrüde düşerse, zilyetliğin devri gerçekleşmişçesine yarar ve hasar alıcıya geçer (TBK m. 208/2). Sevgi 10 Haziran'da temerrüde düşmüştür; su baskını 15 Haziran'da ve Nihat'ın kusuru olmadan meydana gelmiştir. Hasar Sevgi'ye aittir, indirim istemi reddedilmelidir. Bu sonuç için Nihat'ın piyanoyu daha önce tevdi etmiş olması gerekmez. Hasarın genel olarak ne zaman geçtiği doktrinde tartışmalıdır, ama taşınır satışında özel hüküm sorunu kesin biçimde çözer.

      *4. Piyanonun tevdii:* Nihat borcundan tamamen kurtulmak için piyanoyu tevdi etmelidir. Tevdi yerini ifa yerindeki hâkim, yani Nihat'ın evinin bulunduğu yerdeki sulh hukuk mahkemesi çekişmesiz yargı yoluyla belirler (TBK m. 107/2, HMK m. 382-383). Hasar ve depo ücreti gibi giderler alacaklı Sevgi'ye aittir (TBK m. 107/1). Ayrıca alıcı satılanı devralmakla yükümlü olduğundan (TBK m. 232/1), Nihat bu yüzden uğradığı ek zararlar için borca aykırılık hükümlerine de başvurabilir.

      **Sonuç:**
      - Sevgi alacaklı temerrüdüne düşmüştür; "vazgeçtim" demesi sözleşmeyi sona erdirmez.
      - Kirazların satışı TBK m. 108'e uygundur. Nihat kiraz borcundan kurtulmuştur; Sevgi 30.000 TL'yi geri isteyemez, tevdi edilen 20.000 TL'yi alabilir.
      - Piyanodaki 10.000 TL'lik zarar TBK m. 208/2 uyarınca Sevgi'ye aittir.
      - Nihat piyanoyu sulh hukuk hâkiminin belirleyeceği yere tevdi ederek borcundan kurtulur; giderler Sevgi'ye aittir.

  - olay: |
      Kerem, Kadıköy'deki bir dükkânı Kadıköy'de oturan Leyla'dan 1 Ocak 2025 başlangıçlı ve bir yıl süreli bir sözleşmeyle kiralamıştır. Sözleşmeye göre aylık kira her ayın ilk beş günü içinde Leyla'nın X Bankası'ndaki hesabına yatırılacaktır. Kerem 2025 boyunca kiraları bu hesaba yatırmış, sözleşme yenilenmiştir.

      Yeni dönemin kira artışında anlaşamayan Leyla 2 Ocak 2026'da hesabını kapatır. Kerem'in 3 Ocak'taki havalesi "hesap kapalı" açıklamasıyla geri döner. Kerem 5 Ocak'ta kirayı PTT'den konutta ödemeli olarak gönderir; Leyla gönderiyi almaz ve para iade edilir. Kerem 7 Ocak'ta Kadıköy'deki sulh hukuk mahkemesine başvurur. Mahkeme talebi Leyla'ya tebliğ etmeden, 8 Ocak'ta Leyla adına açılacak bir banka hesabını ödeme yeri olarak belirler. Kerem Ocak kirasını 9 Ocak'ta, Şubat ve Mart kiralarını da vadesinde bu hesaba yatırır.

      Leyla 20 Ocak'ta Kerem'e "Ocak kirası ödenmedi, 30 gün içinde ödemezsen sözleşmeyi feshedeceğim" diyen bir ihtarname gönderir. Ayrıca tevdi kararının kendisine tebliğ edilmeden verildiğini, bu yüzden geçersiz olduğunu ileri sürer.

      Taraflar sözleşmeyi 31 Mart 2026'da sona erdirmekte anlaşır. Kerem 30 Mart'ta dükkânı boşaltır ve anahtarı Leyla'ya götürür; Leyla almaz. Kerem aynı gün anahtarı notere teslim eder; noterin tevdi tutanağı 31 Mart'ta Leyla'ya tebliğ edilir. Leyla, anahtarı ancak Mayıs sonunda noterden aldığını belirterek Nisan ve Mayıs kiralarını istemektedir.

      1. Leyla'nın davranışını nitelendiriniz.
      2. Leyla'nın tevdi kararına itirazını değerlendiriniz.
      3. Leyla'nın ihtarnamesi Kerem için bir sonuç doğurur mu?
      4. Leyla Nisan ve Mayıs kiralarını isteyebilir mi?
    olcut:
      - {tespit: "Kira bedelinin götürülecek para borcu olması; sözleşmedeki hesaba havale ve konutta ödemeli gönderinin gereği gibi öneri olması", puan: 15, madde: "TBK m. 89"}
      - {tespit: "Hesabın kapatılması ve gönderinin alınmamasıyla kiraya verenin haklı sebep olmaksızın kabulden kaçınması; artış anlaşmazlığının haklı sebep olmaması", puan: 20, madde: "TBK m. 106"}
      - {tespit: "Tevdi mahalli belirlenmesinin sulh hukuk mahkemesinde çekişmesiz yargı işi olması ve talebin tebliğ edilmeden karara bağlanabilmesi", puan: 20, madde: "HMK m. 382"}
      - {tespit: "Belirlenen hesaba yatırılan kiralarla kiracının borçtan kurtulması ve temerrüde düşmemesi", puan: 15, madde: "TBK m. 107"}
      - {tespit: "Kiraya verenin ihtarının fesih sonucu doğurmaması ve haklı ihtar sayılmaması", puan: 15, madde: "TBK m. 315"}
      - {tespit: "Anahtarın tevdii ve bildirimle iade borcunun sona ermesi; sonraki dönem için kira istenememesi", puan: 15, madde: "TBK m. 334"}
    cozum: |
      **Nitelendirme:** Taraflar arasında bir işyeri kira sözleşmesi vardır. Kerem kira bedelinin borçlusu, Leyla alacaklısıdır. Leyla ödemeyi almaktan, sözleşme bitince de kiralananın iadesini kabul etmekten kaçınmıştır. Sorun alacaklının temerrüdü ve para borcunda tevdi uygulamasıdır.

      **Hukuki sorunlar:** (1) Leyla alacaklı temerrüdüne düşmüş müdür? (2) Tebliğsiz verilen tevdi kararı geçerli midir? (3) Kerem temerrüde düşmüş müdür, ihtarname sonuç doğurur mu? (4) Anahtarın tevdii kira borcunu ne zaman sona erdirir?

      **İlgili hükümler:** TBK m. 89/1-1, m. 106/1, m. 107, m. 315, m. 334/1, m. 352/2; HMK m. 382-383.

      **Değerlendirme:**

      *1. Leyla'nın alacaklı temerrüdü:* Kira bedeli para borcudur ve götürülecek borçtur (TBK m. 89/1-1). Taraflar ödeme yeri olarak Leyla'nın banka hesabını kararlaştırmıştır. Kerem kirayı vadesinde bu hesaba göndermiş, hesap kapatılınca konutta ödemeli PTT havalesiyle Leyla'nın adresine ulaştırmaya çalışmıştır. Edim tam olarak ve doğru yerde önerilmiştir. Leyla hesabı kapatarak ve gönderiyi almayarak kabulden kaçınmıştır. Kira artışında anlaşamamak haklı sebep değildir; artış uyuşmazlığı ayrı bir davada çözülür. Leyla alacaklı temerrüdüne düşmüştür (TBK m. 106/1).

      *2. Tevdi kararına itiraz:* Tevdi yerini ifa yerindeki hâkim belirler (TBK m. 107/2). Bu iş, HMK m. 382'de sayılan bir çekişmesiz yargı işidir ve görevli mahkeme sulh hukuk mahkemesidir (HMK m. 383). Yargıtay 3. Hukuk Dairesi, bölge adliye mahkemeleri arasındaki görüş ayrılığını gidererek bu talebin kiraya verene tebliğ edilmeden karara bağlanabileceğini kabul etmiştir. Gerekçe, bekleme süresinin kiracıyı temerrüde ve tahliye riskine sokabilmesidir. Karar uyuşmazlığın esasını çözmez; Leyla isterse istinafa başvurabilir. Leyla'nın "tebliğ edilmedi, geçersiz" itirazı yerinde değildir.

      *3. İhtarname:* Ocak kirası 3 ve 5 Ocak'ta gereği gibi önerilmiş, Leyla'nın kabulden kaçınması nedeniyle ödenememiştir. Aynı alacak için alacaklı temerrüdü varken borçlu temerrüdü doğmaz. Kerem 9 Ocak'ta kirayı mahkemenin belirlediği hesaba yatırmış ve borcundan kurtulmuştur. Şubat ve Mart kiraları da vadesinde yatırılmıştır. Bu nedenle 20 Ocak tarihli ihtarname TBK m. 315 anlamında fesih sonucu doğurmaz. Kerem kirayı ödemediği için ihtara sebep olmadığından bu ihtar haklı ihtar da sayılmaz ve TBK m. 352/2 bakımından hesaba katılamaz.

      *4. Anahtarın tevdii:* Sözleşme bitince kiracı kiralananı geri vermekle yükümlüdür (TBK m. 334/1); bunun için anahtarın teslimi gerekir. Leyla anahtarı almayarak bu kez iade borcunun alacaklısı olarak kabulden kaçınmıştır. Kerem anahtarı notere teslim etmiş, tevdi tutanağı 31 Mart'ta Leyla'ya tebliğ edilmiştir. Yargıtay'a göre kiracının iade borcu, anahtarın tevdi edildiğinin kiraya verene bildirildiği tarihte sona erer. Bu tarih sözleşmenin bittiği 31 Mart'tır. Leyla'nın anahtarı noterden geç alması kendi tercihidir ve Kerem'in sorumluluğunu uzatmaz.

      **Sonuç:**
      - Leyla hesabı kapatıp gönderiyi almadığı için alacaklı temerrüdüne düşmüştür.
      - Tebliğsiz verilen tevdi mahalli kararı geçerlidir; itiraz yerinde değildir.
      - Kerem temerrüde düşmemiştir; ihtarname fesih sonucu doğurmaz ve haklı ihtar sayılmaz.
      - Kerem'in iade borcu 31 Mart'ta sona ermiştir; Leyla Nisan ve Mayıs kiralarını isteyemez.

  - olay: |
      Zafer ve Yusuf, ortak bir iş için Ayten'den 1.000.000 TL faizsiz ödünç alır. Sözleşmede ikisinin müteselsil borçlu olduğu ve borcun 1 Mart 2026'da Türk lirası olarak ödeneceği yazılıdır. Borcun güvencesi olarak Zafer'in dairesi üzerinde Ayten lehine ipotek kurulmuştur.

      Zafer 1 Mart'ta 1.000.000 TL'yi Ayten'in evine götürür. Ayten, döviz kuru yükseldiği için parayı Türk lirası olarak almayacağını, dolar karşılığını istediğini söyler; parayı kabul etmez ve ipoteği çözmeyi de reddeder.

      Ayten 1 Nisan'da Yusuf'a bir ihtarname göndererek borcun ödenmediğini, ikisinin de 1 Mart'tan itibaren temerrüt faizi ödemesi gerektiğini bildirir.

      Zafer ipotekten kurtulmak için icra dairesine başvurur. İcra dairesinin tebliğine rağmen Ayten on beş gün içinde gelmez. Zafer 1.000.000 TL'nin tamamını icra dairesine yatırır. İcra mahkemesi paranın Ayten adına saklanmasına ve ipotek kaydının terkinine karar verir; karar tapuya bildirilir.

      Bir süre sonra nakit sıkıntısına düşen Zafer, icra dairesine yatırdığı parayı geri almak istemektedir.

      1. Ayten alacaklı temerrüdüne düşmüş müdür? Bu durum Yusuf'u nasıl etkiler?
      2. Ayten'in temerrüt faizi istemini değerlendiriniz.
      3. İpoteğin terkini için izlenen yolu değerlendiriniz.
      4. Zafer parayı geri alabilir mi?
      5. Zafer 1 Mart'ta hiç ödeme önerisinde bulunmasaydı hukuki durum ne olurdu?
    olcut:
      - {tespit: "Para borcunun alacaklının evinde, kararlaştırılan para cinsinden ve tam olarak önerilmesi; döviz isteminin haklı sebep olmaması; Ayten'in alacaklı temerrüdü", puan: 20, madde: "TBK m. 106"}
      - {tespit: "Alacaklının müteselsil borçlulardan birine karşı temerrüdünün diğerine de etkili olması", puan: 15, madde: "TBK m. 106"}
      - {tespit: "Alacaklı temerrüdü süresince borçlu temerrüdünün doğmaması; temerrüt faizi isteminin reddi", puan: 20, madde: "TBK m. 120"}
      - {tespit: "İpotekli borçta icra dairesine başvuru, on beş günlük tebliğ, paranın yatırılması ve ipoteğin terkini", puan: 20, madde: "İİK m. 153"}
      - {tespit: "Rehnin kalkması sonucunu doğuran tevdiin geri alınamaması", puan: 15, madde: "TBK m. 109"}
      - {tespit: "Öneri olmasaydı belirli günün geçmesiyle ihtarsız borçlu temerrüdü ve temerrüt faizi", puan: 10, madde: "TBK m. 117"}
    cozum: |
      **Nitelendirme:** Zafer ve Yusuf, Ayten'e karşı faizsiz bir ödünçten doğan para borcunun müteselsil borçlularıdır. Borcun güvencesi ipotektir. Zafer borcu vadesinde önermiş, Ayten kabul etmemiştir. Sorun alacaklının temerrüdü, bunun müteselsil borçlulara ve faize etkisi, ipotekli borçtaki özel tevdi yolu ve geri alma hakkıdır.

      **Hukuki sorunlar:** (1) Ayten'in reddi haklı mıdır? (2) Temerrüt Yusuf'a da etkili midir? (3) Temerrüt faizi istenebilir mi? (4) İİK m. 153 yolu ve sonucu nedir? (5) Yatırılan para geri alınabilir mi?

      **İlgili hükümler:** TBK m. 89/1-1, m. 106/1-2, m. 109, m. 117, m. 120; İİK m. 153/1.

      **Değerlendirme:**

      *1. Alacaklı temerrüdü ve Yusuf:* Para borcu alacaklının yerleşim yerinde ödenir (TBK m. 89/1-1). Zafer borcun tamamını vadesinde, sözleşmede kararlaştırılan para olan Türk lirasıyla Ayten'in evine götürmüştür. Öneri tam, zamanında ve doğru yerdedir. Kur artışı nedeniyle dolar istemek sözleşmeye aykırıdır ve haklı sebep değildir. Ayten alacaklı temerrüdüne düşmüştür (TBK m. 106/1). Alacaklı müteselsil borçlulardan birine karşı temerrüde düşerse diğerlerine karşı da temerrüde düşmüş olur (TBK m. 106/2). Bu nedenle Ayten, Yusuf'a karşı da temerrüt hâlindedir.

      *2. Temerrüt faizi:* Temerrüt faizi borçlu temerrüdünün sonucudur (TBK m. 117, m. 120). Aynı alacak bakımından alacaklı temerrüdü varken borçlu temerrüdü doğmaz. Ayten 1 Mart'ta haklı sebep olmadan parayı reddettiği için ne Zafer ne de Yusuf temerrüde düşmüştür. 1 Nisan tarihli ihtarname de bu sonucu değiştirmez. Temerrüt faizi istemi reddedilmelidir. Ödünç faizsiz olduğundan sözleşme faizi tartışması da gündeme gelmez.

      *3. İpoteğin terkini:* Alacaklı temerrüdü borcu kendiliğinden bitirmez, ipoteği de kendiliğinden kaldırmaz. Bu yüzden İİK m. 153/1 ipotekli borçlar için özel bir yol öngörür. Vadesi gelmiş ve ipotekle güvence altına alınmış borcun borçlusu, alacaklının parayı almaktan ve ipoteği çözmekten kaçındığını icra dairesine bildirir. İcra dairesi alacaklıya on beş gün içinde gelip parayı almasını ve ipoteği çözmesini tebliğ eder. Alacaklı gelmezse ve borçlu borcun tamamını yatırırsa, icra mahkemesi paranın alacaklı adına saklanmasına ve ipoteğin terkinine karar verir; karar tapu siciline geçirilir. Zafer bu yolu eksiksiz izlemiştir. Böylece borç sona ermiş, ipotek kalkmıştır.

      *4. Geri alma:* Borçlu tevdi ettiği şeyi kural olarak geri alabilir. Ancak tevdi bir rehnin ortadan kaldırılması sonucunu doğurmuşsa geri alma mümkün değildir (TBK m. 109/1). Zafer'in yatırdığı para ipoteğin terkini sonucunu doğurmuştur. Geri almasına izin verilseydi Ayten hem güvencesini hem de parasını kaybederdi. Zafer parayı geri alamaz.

      *5. Öneri olmasaydı:* Borcun ifa günü olarak 1 Mart birlikte belirlenmiştir. Zafer hiç ödeme önerisinde bulunmasaydı, borçlular bu günün geçmesiyle ihtara gerek olmadan temerrüde düşerdi (TBK m. 117/2). Ayten bu durumda temerrüt faizi isteyebilirdi (TBK m. 120). Aradaki fark, borçlunun zamanında ve gereği gibi önerisinin borçlu temerrüdünü engellemesidir.

      **Sonuç:**
      - Ayten alacaklı temerrüdüne düşmüştür; bu temerrüt Yusuf'a karşı da geçerlidir.
      - Ayten temerrüt faizi isteyemez.
      - İİK m. 153'e göre izlenen yol usulüne uygundur; ipotek terkin edilmiş, borç sona ermiştir.
      - Tevdi rehnin kalkması sonucunu doğurduğundan Zafer parayı geri alamaz.
      - Öneri yapılmasaydı borçlular 1 Mart'ın geçmesiyle temerrüde düşer ve temerrüt faizi işlerdi.

kartlar:
  - on: "Alacaklının temerrüdünün şartları nelerdir? (TBK m. 106/1)"
    arka: "İfa hakkı olan ve ifaya hazır borçlu; edimin gereği gibi önerilmesi; alacaklının kabulden ya da hazırlık fiillerinden kaçınması; kaçınmanın haklı bir sebebe dayanmaması."
  - on: "Alacaklı temerrüdü için kusur aranır mı?"
    arka: "Baskın görüşe göre hayır. Kanun kusurdan söz etmez; ölçüt objektif haklı sebep yokluğudur."
  - on: "Hazırlık fiiline örnek verin."
    arka: "Dikilecek kumaşı vermek, ölçü ya da model bildirmek, teslim adresini bildirmek, sözleşmeyle kendisine bırakılan seçim hakkını kullanmak."
  - on: "Para borcunda gereği gibi öneri nasıl yapılır?"
    arka: "Para götürülecek borçtur (TBK m. 89/1-1). Tam tutar, kararlaştırılan para cinsiyle, alacaklının yerleşim yerinde ya da kararlaştırılan hesapta önerilir."
  - on: "Alacaklı müteselsil borçlulardan birine karşı temerrüde düşerse?"
    arka: "Diğerlerine karşı da temerrüde düşmüş olur (TBK m. 106/2)."
  - on: "Alacaklı temerrüdü borcu sona erdirir mi?"
    arka: "Hayır. Borçlu ancak tevdi, satış ya da teslim gerektirmeyen edimlerde dönme yoluyla borcundan kurtulur."
  - on: "Alacaklı temerrüdü temerrüt faizini etkiler mi?"
    arka: "Evet. Aynı alacak için borçlu temerrüdü bulunamaz, temerrüt faizi işlemez. Sözleşme faizinin durumu tartışmalıdır."
  - on: "Alacaklı kabule zorlanabilir mi?"
    arka: "Kural olarak hayır, kabul külfettir. Kabul borç olarak yüklenmişse (alıcının devralma borcu, TBK m. 232/1) borca aykırılık hükümleri de işler."
  - on: "Tevdi yerini kim belirler? (TBK m. 107/2)"
    arka: "İfa yerindeki hâkim: sulh hukuk mahkemesi, çekişmesiz yargı (HMK m. 382-383). Ticari mallar hâkim kararı olmadan ardiyeye tevdi edilebilir."
  - on: "Tevdi edilen şeyin hasarı ve giderleri kime aittir?"
    arka: "Alacaklıya (TBK m. 107/1)."
  - on: "Satma hakkının sebepleri nelerdir? (TBK m. 108/1)"
    arka: "Şeyin niteliği veya işin özelliği tevdie uygun değilse, şey bozulabilirse ya da bakımı, korunması veya tevdii önemli gider gerektiriyorsa."
  - on: "Satışın olağan usulü nedir?"
    arka: "Alacaklıya önceden ihtar, hâkimin izni ve açık artırma (TBK m. 108/1)."
  - on: "Açık artırma ne zaman zorunlu değildir? (TBK m. 108/2)"
    arka: "Şey borsada kayıtlıysa, piyasa fiyatı varsa ya da değeri gidere oranla azsa. Hâkim bu durumda ihtar koşulunu da aramayabilir."
  - on: "Tevdi edilen şey ne zaman geri alınamaz? (TBK m. 109/1)"
    arka: "Alacaklı kabul ettiğini açıklamışsa ya da tevdi bir rehnin kalkması sonucunu doğurmuşsa."
  - on: "Tevdi edilen şey geri alınırsa ne olur?"
    arka: "Alacak bütün yan haklarıyla birlikte varlığını sürdürür (TBK m. 109/2)."
  - on: "Teslim gerektirmeyen edimlerde alacaklı temerrüdünün sonucu? (TBK m. 110)"
    arka: "Borçlu, borçlu temerrüdü hükümlerine göre sözleşmeden döner: kural olarak uygun süre verir (TBK m. 123), sonra dönme iradesini açıklar (TBK m. 125)."
  - on: "TBK m. 111 hangi durumları düzenler?"
    arka: "Borçlunun kusuru olmaksızın alacağın kime ait olduğunda veya alacaklının kimliğinde duraksama ya da alacaklıdan kaynaklanan kişisel bir sebep. Borçlu tevdi edebilir ya da sözleşmeden dönebilir."
  - on: "Taşınır satışında alıcı devralmada temerrüde düşerse hasar? (TBK m. 208/2)"
    arka: "Zilyetlik devredilmiş gibi yarar ve hasar alıcıya geçer."
  - on: "Kiraya veren hesabı kapatırsa kiracı ne yapar?"
    arka: "Sulh hukuk mahkemesinden tevdi mahalli (ödeme yeri) belirlenmesini ister ve kirayı oraya yatırır. Yargıtay'a göre talep kiraya verene tebliğ edilmeden karara bağlanabilir."
  - on: "Kiraya veren anahtarı almazsa?"
    arka: "Kiracı anahtarı tevdi eder (uygulamada notere de) ve kiraya verene bildirir. İade borcu bildirim tarihinde sona erer."
  - on: "İpotekli borçta alacaklı parayı almazsa? (İİK m. 153/1)"
    arka: "Borçlu icra dairesine başvurur, alacaklıya 15 gün içinde gelmesi tebliğ edilir. Gelmezse borcun tamamı yatırılır; icra mahkemesi paranın saklanmasına ve ipoteğin terkinine karar verir."
  - on: "Kefil muaccel borcu ödemek ister, alacaklı haklı sebep olmadan kabul etmezse?"
    arka: "Kefil borcundan kurtulur; birlikte müteselsil kefalette kefillerin sorumluluğu kendi payları kadar azalır (TBK m. 593/2)."
  - on: "İşveren işçinin edimini kabulde temerrüde düşerse?"
    arka: "Ücreti öder ve edimin sonradan yerine getirilmesini isteyemez. İşçinin kurtulduğu giderler ile başka işten kazandığı ya da bilerek kaçındığı yararlar indirilir (TBK m. 408)."
