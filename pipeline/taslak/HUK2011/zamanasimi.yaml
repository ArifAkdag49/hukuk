ozet: |
  **Bu konu neyi cevaplıyor?** Bir alacak ne kadar sürede ve hangi tarihten başlayarak zamanaşımına uğrar? Süre ne zaman durur, ne zaman kesilip yeniden başlar? Borçlu zamanaşımını nasıl ve ne zamana kadar ileri sürmelidir?

  - **Niteliği:** Zamanaşımı alacağı sona erdirmez, dava edilebilirliğini kaldırır. Alacak **eksik borç** olur: ödenirse geri istenemez (TBK m. 78/2), şartları varsa takasta kullanılabilir (TBK m. 139/3).
  - **Def'idir (TBK m. 161):** Hâkim zamanaşımını kendiliğinden gözetemez. Hak düşürücü süre ise hakkın kendisini sona erdirir ve hâkim onu kendiliğinden gözetir.
  - **Süreler:** Genel süre **on yıldır** (TBK m. 146). **Beş yıl** (TBK m. 147): kira bedelleri, anapara faizleri ve ücret gibi dönemsel edimler; otel ve lokanta bedelleri; küçük sanat işleri ve küçük çaplı perakende satışlar; ortaklık ilişkisinden doğan alacaklar; vekâlet, komisyon, acentalık ve simsarlıktan doğan alacaklar (ticari simsarlık ücreti hariç); eser sözleşmesinden doğan alacaklar (yüklenicinin ağır kusurlu ifa etmemesi hariç). Bu süreler sözleşmeyle değiştirilemez (TBK m. 148).
  - **Başlangıç:** Alacağın muaccel olduğu an; muacceliyet bir bildirime bağlıysa bildirimin yapılabileceği gün (TBK m. 149). Alacaklının öğrenmesi aranmaz. Ömür boyu gelirde tamamı için süre, ödenmeyen ilk dönemsel edimin muacceliyetiyle başlar (TBK m. 150).
  - **Hesap:** Başlangıç günü sayılmaz, süre son gün de geçince dolar ve ifa sürelerinin hesabına ilişkin kurallar uygulanır (TBK m. 151). Asıl alacak zamanaşımına uğrayınca faiz de uğrar (TBK m. 152).
  - **Durma (TBK m. 153):** Velayet, vesayet, evlilik, ev hizmetliliği, borçlunun intifa hakkı, Türk mahkemelerinde ileri sürme imkânsızlığı ve birleşmenin geçmişe etkili olarak kalkması. Süre kaldığı yerden devam eder. Arabuluculuk süreci de zamanaşımını durdurur (HUAK m. 16/2, HUAK m. 18/A).
  - **Kesilme (TBK m. 154):** Borçlunun ikrarı (faiz ödeme, kısmi ifa, rehin verme, kefil gösterme) ile alacaklının dava, def'i, icra takibi ya da iflas masasına başvurusu. **İhtarname kesmez.** Yeni süre kural olarak eski sürenin aynısıdır; borç senetle ikrar edilmişse ya da mahkeme veya hakem kararına bağlanmışsa her zaman on yıldır (TBK m. 156). Dava ve takip sürerken her işlemden sonra yeniden işler (TBK m. 157).
  - **Birlikte borçlular (TBK m. 155):** Müteselsil borçlulardan birine karşı kesilme hepsine karşı kesilmedir. Asıl borçluya karşı kesilme kefili de etkiler, kefile karşı kesilme asıl borçluyu etkilemez.
  - **Ek süre (TBK m. 158):** Dava yetkisizlik, görevsizlik, düzeltilebilir bir yanlışlık ya da erken açılma nedeniyle reddedilmiş ve bu arada süre dolmuşsa alacaklıya altmış gün tanınır.
  - **Rehin:** Taşınır rehninde zamanaşımı işler ama alacaklı hakkını rehinden alabilir (TBK m. 159). Tapuya tescilli taşınmaz rehninde zamanaşımı işlemez (TMK m. 864).
  - **Feragat (TBK m. 160):** Önceden yasaktır; süre dolduktan sonraki feragat yalnız feragat edeni bağlar.
  - **Usul:** Def'i dilekçeler aşamasında ileri sürülür; sonrasında ancak açık muvafakat ya da ıslahla (HMK m. 141). 📌 2026'dan beri kısmi davada talep bir kez artırılırsa zamanaşımı, artırılan kısım için de dava tarihinden kesilmiş sayılır (HMK m. 109/4).

anlatim: |
  ## 0. Konunun haritası

  Bir alacağın zamanaşımına uğrayıp uğramadığını beş soruyla, sırayla incele:

  | Soru | Madde |
  |---|---|
  | Hangi süre? | TBK m. 146-148 |
  | Ne zaman başladı, nasıl hesaplanır? | TBK m. 149-152 |
  | Durdu mu? | TBK m. 153, HUAK m. 16 ve HUAK m. 18/A |
  | Kesildi mi, yeni süre ne? | TBK m. 154-158 |
  | Borçlu ileri sürdü mü, zamanında mı? | TBK m. 160-161, HMK |

  > 💡 **Püf nokta:** Zamanaşımı bir takvim sorusudur. Olayda önce bir zaman çizelgesi çiz: muacceliyet, ikrar, takip, arabuluculuk, dava, def'i. Birden çok alacak varsa her birini ayrı hesapla.

  ## 1. Zamanaşımı nedir?

  **Zamanaşımı**, kanunda öngörülen süre içinde istenmeyen bir alacağın **dava edilebilirliğini** yitirmesidir. Alacak ortadan kalkmaz. Yargıtay Hukuk Genel Kurulu'nun ifadesiyle zamanaşımına uğramış borç, ifa edilebilen ama dava edilemeyen bir **eksik borçtur**. Sonuçları:

  - **Ödenen geri istenmez.** Zamanaşımına uğramış borcu ödeyen, "süre geçmişti, bilmiyordum" diyerek ödediğini geri isteyemez (TBK m. 78/2). Ayrıntısı sebepsiz zenginleşme konusunda.
  - **Takasta kullanılabilir.** Zamanaşımına uğramış bir alacak, takas edilebileceği anda henüz zamanaşımına uğramamışsa takas edilebilir (TBK m. 139/3). Ayrıntısı takas konusunda.
  - **Rehin ayakta kalabilir** (TBK m. 159, aşağıda §7).

  Kurumun gerekçesi hukuki güvenliktir.

  ### 1.1 Zamanaşımı bir def'idir
  **Def'i**, var olan bir hakka karşı borçluya ifadan kaçınma imkânı veren karşı haktır. **İtiraz** ise hakkın hiç doğmadığını ya da sona erdiğini gösteren olgudur (ödeme, kesin hükümsüzlük gibi). İtiraz dosyadan anlaşılıyorsa hâkim onu kendiliğinden gözetir.

  Zamanaşımı ileri sürülmedikçe hâkim bunu kendiliğinden göz önüne alamaz (TBK m. 161). Süre yıllar önce dolmuş olsa bile davalı susarsa hâkim alacağa hükmeder.

  ### 1.2 Hak düşürücü süreden farkı
  **Hak düşürücü süre**, bir hakkın, çoğunlukla bir yenilik doğuran hakkın, yalnız belli bir süre içinde kullanılabilmesidir. Süre geçince hakkın kendisi düşer. Örneğin yanılma, aldatma ya da korkutma nedeniyle sözleşmeyle bağlı olmadığını bildirme hakkı bir yıllık süreye (TBK m. 39), aşırı yararlanmadaki haklar bir yıllık ve her hâlde beş yıllık süreye bağlıdır (TBK m. 28).

  | | Zamanaşımı | Hak düşürücü süre |
  |---|---|---|
  | Süre geçince | Alacak eksik borç olur | Hak sona erer |
  | Hâkim | Kendiliğinden gözetemez | Kendiliğinden gözetir |
  | Durma, kesilme | Var (TBK m. 153-157) | Kural olarak yok |

  > ⚠️ **Sınavda dikkat:** "Hak düşürücü süre hiçbir şekilde uzamaz" demek eksiktir. TBK m. 158'deki altmış günlük ek süre, metne göre hak düşürücü süreler için de geçerlidir. Arabuluculuk sürecinde de hak düşürücü süreler işlemez (HUAK m. 16/2, HUAK m. 18/A'nın 15. fıkrası).

  ## 2. Süreler

  ### 2.1 Genel süre (TBK m. 146)
  Kanunda aksine bir hüküm bulunmadıkça her alacak **on yıllık** zamanaşımına tabidir. Satım bedeli, ödünç verilen paranın geri istenmesi ve sözleşmeye aykırılıktan doğan tazminat, özel bir hüküm yoksa bu süreye girer.

  ### 2.2 Beş yıllık süre (TBK m. 147)
  Kanun şu alacakları beş yıllık zamanaşımına bağlar (metin aynen):
  1. "Kira bedelleri, anapara faizleri ve ücret gibi diğer dönemsel edimler."
  2. "Otel, motel, pansiyon ve tatil köyü gibi yerlerdeki konaklama bedelleri ile lokanta ve benzeri yerlerdeki yeme içme bedelleri."
  3. "Küçük sanat işlerinden ve küçük çapta perakende satışlardan doğan alacaklar."
  4. "Bir ortaklıkta, ortaklık sözleşmesinden doğan ve ortakların birbirleri veya kendileri ile ortaklık arasındaki; bir ortaklığın müdürleri, temsilcileri, denetçileri ile ortaklık veya ortaklar arasındaki alacaklar."
  5. "Vekâlet, komisyon ve acentalık sözleşmelerinden, ticari simsarlık ücreti alacağı dışında, simsarlık sözleşmesinden doğan alacaklar."
  6. "Yüklenicinin yükümlülüklerini ağır kusuruyla hiç ya da gereği gibi ifa etmemesi dışında, eser sözleşmesinden doğan alacaklar."

  **Bentleri doğru okumak:**
  - **Bent 1.** **Dönemsel edim**, Yargıtay'ın tanımıyla aynı hukuki sebepten belli ve düzenli aralıklarla doğan edimdir: aylık kira, aylık ücret, yıllık faiz. Her dönemin alacağı kendi muacceliyetinden başlayarak ayrı ayrı zamanaşımına uğrar.
    - Anapara faizi beş yıldır, **anaparanın kendisi** (örneğin ödünç) ise on yıldır.
    - Bent kira **bedelini** sayar. Kira ilişkisinden doğan başka bir alacak için özel hüküm yoksa genel süre uygulanır.
  - **Bent 2.** Otelin oda ücreti ve lokantanın hesabı beş yıldır.
  - **Bent 3.** Terzinin dikiş ücreti ya da mahalle bakkalının veresiye alacağı beş yıldır. Toptancının bakkala sattığı malın bedeli gibi küçük çaplı olmayan satışlar bu bende girmez.
  - **Bent 4.** Adi ortaklıkta bir ortağın ortaklık sözleşmesinden doğan kâr payı alacağı beş yıldır. Ortakların ortaklıkla ilgisiz olarak birbirine verdiği ödünç bu bende girmez.
  - **Bent 5.** Avukatlık sözleşmesi bir vekâlet sözleşmesidir ve Yargıtay avukatın ücret alacağına beş yıllık süreyi uygular. Bent "sözleşmelerinden doğan alacaklar" dediği için lafzen vekâlet verenin sözleşmeden doğan alacaklarını da kapsar. **Ticari simsarlık ücreti** açıkça dışarıda bırakılmıştır.
    - Müvekkilin sözleşmeye dayanarak **avukata** karşı ileri sürdüğü tazminat istekleri ise özel bir hükme tabidir: hakkın doğumunun öğrenildiği tarihten bir yıl ve her hâlde zararı doğuran olaydan beş yıl geçmekle düşer (1136 sayılı Kanun m. 40).
  - **Bent 6.** Yüklenicinin bedel alacağı beş yıldır ve bedel kural olarak eserin teslimiyle muaccel olur (TBK m. 479). İş sahibinin alacakları da beş yıldır. Ancak alacak, yüklenicinin yükümlülüklerini **ağır kusuruyla** hiç ya da gereği gibi ifa etmemesinden doğuyorsa genel süre uygulanır.

  > ⚠️ **Sınavda dikkat:** Eserdeki **ayıptan** doğan davalar için ayrı süreler vardır: teslimden başlayarak iki yıl, taşınmaz yapılarda beş yıl, yüklenicinin ağır kusuru varsa yirmi yıl (TBK m. 478). Bunu bent 6 ile karıştırma. Ayrıntısı Borçlar Özel'de.

  ### 2.3 Özel sürelerle karşılaştırma

  | Alacak | Süre | Madde |
  |---|---|---|
  | Genel kural | 10 yıl | TBK m. 146 |
  | Listedeki alacaklar | 5 yıl | TBK m. 147 |
  | Haksız fiil tazminatı | Öğrenmeden 2, fiilden 10 yıl; suçsa ceza süresi | TBK m. 72 |
  | Sebepsiz zenginleşme | Öğrenmeden 2, zenginleşmeden 10 yıl | TBK m. 82 |
  | Satılanın ayıbı | Devirden 2 yıl | TBK m. 231 |
  | Senetle ikrar, karar sonrası | Her zaman 10 yıl | TBK m. 156/2 |

  Haksız fiil ve sebepsiz zenginleşmede kısa süre **öğrenmeye** bağlıdır, TBK m. 146-147'de ise öğrenmeye bakılmaz; ayrıntıları ilgili konularda.

  ### 2.4 Sürelerin kesinliği
  - "Bu ayırımda belirlenen zamanaşımı süreleri, sözleşmeyle değiştirilemez" (TBK m. 148). Taraflar on ya da beş yıllık süreyi ne kısaltabilir ne uzatabilir.
  - Zamanaşımından önceden feragat da edilemez (TBK m. 160/1).

  > **Örnek:** Kira sözleşmesindeki "kira alacakları iki yılda zamanaşımına uğrar" ya da "kiracı zamanaşımını ileri sürmeyecektir" kaydına dayanılamaz. Kira bedeli yine beş yıllık süreye tabidir.

  ## 3. Başlangıç ve hesap

  ### 3.1 Muacceliyet (TBK m. 149)
  - Zamanaşımı alacağın **muaccel olmasıyla** işlemeye başlar (m. 149/1). İfa zamanı kararlaştırılmamışsa borç doğduğu anda muacceldir (TBK m. 90).
  - Muacceliyet bir **bildirime** bağlıysa zamanaşımı, bildirimin **yapılabileceği** günden başlar (m. 149/2). Alacaklı bildirimi geciktirerek başlangıcı erteleyemez.
  - Yargıtay'a göre alacak muaccel olunca alacaklı bilmese de süre işler.
  - Geciktirici koşula bağlı alacakta süre, koşulun gerçekleşmesiyle başlar.

  > **Örnek:** Ayşe 01.03.2014'te Burak'a süre belirlemeden 100.000 TL ödünç verir. Burak ancak ilk istemden başlayarak altı hafta geçince ödemek zorundadır (TBK m. 392); muacceliyet bir isteme bağlıdır. Ayşe istemi ilk günden yapabileceği için zamanaşımı, istemde bulunabileceği ilk günden işler. 2025'e kadar beklemesi başlangıcı ertelemez; on yıllık süre 2024'te dolmuştur.

  ### 3.2 Dönemsel edimler (TBK m. 150)
  Ömür boyu gelir gibi ilişkilerde iki şey vardır: tek tek taksitler ve taksitleri doğuran **ana hak**. Alacağın tamamı için zamanaşımı, ifa edilmemiş **ilk** dönemsel edimin muaccel olduğu gün başlar (m. 150/1). Tamamı zamanaşımına uğrarsa ifa edilmemiş taksitler de zamanaşımına uğramış olur (m. 150/2). Taksitler tek tek beş yıla tabidir (TBK m. 147/1). Kanun ana hakkın süresini ayrıca göstermez; m. 147/1 yalnız dönemsel edimleri saydığı için ana hakkın genel süreye (TBK m. 146) bağlı olduğu sonucuna varılabilir, ama bu bir yorumdur.

  > **Örnek:** Kemal'e bağlanan ömür boyu aylık gelir Mart 2015'ten itibaren hiç ödenmez. Her taksit beş yılda zamanaşımına uğrar. Gelir hakkının tamamı için süre Mart 2015'te başlar (m. 150/1). Ana hak on yıllık süreye bağlı sayılırsa Mart 2025'te düşer ve henüz beş yılı dolmamış taksitler de onunla birlikte düşer (m. 150/2).

  ### 3.3 Sürenin hesabı (TBK m. 151)
  - Zamanaşımının başladığı gün sayılmaz. Zamanaşımı ancak sürenin son günü de hak kullanılmadan geçince gerçekleşir (m. 151/1).
  - İfa sürelerinin hesabına ilişkin hükümler burada da uygulanır (m. 151/2). Yıl olarak belirlenen süre, son yılın başlangıç gününe karşılık gelen gününde dolar (TBK m. 92/1-3). Son gün kanunda tatil sayılan bir güne rastlarsa izleyen ilk iş gününe geçer (TBK m. 93).

  > **Örnek:** Kira bedeli 16.03.2021'de muaccel olmuştur. Beş yıllık süre 16.03.2026 gününün bitiminde dolar. Kiraya veren 16.03.2026'da dava açarsa dava süresindedir.

  ### 3.4 Bağlı alacaklar (TBK m. 152)
  Asıl alacak zamanaşımına uğrayınca ona bağlı faiz ve diğer alacaklar da zamanaşımına uğramış olur. Faiz kendi beş yıllık süresiyle (TBK m. 147/1) asıl alacaktan **önce** de düşebilir. Ama asıl alacak düşünce süresi dolmamış faiz de onunla düşer. Faizin zamanaşımı ise asıl alacağı etkilemez.

  ## 4. Durma (TBK m. 153)

  **Durmada** süre işlemez. Henüz başlamamışsa hiç başlamaz, başlamışsa sebep ortadan kalkınca **kaldığı yerden** devam eder. Kanuna göre şu durumlarda zamanaşımı işlemeye başlamaz, başlamışsa durur (metin aynen):
  1. "Velayet süresince, çocukların ana ve babalarından olan alacakları için."
  2. "Vesayet süresince, vesayet altında bulunanların vasiden veya vesayet işlemleri sebebiyle Devletten olan alacakları için."
  3. "Evlilik devam ettiği sürece, eşlerin diğerinden olan alacakları için."
  4. "Hizmet ilişkisi süresince, ev hizmetlilerinin onları çalıştıranlardan olan alacakları için."
  5. "Borçlu, alacak üzerinde intifa hakkına sahip olduğu sürece."
  6. "Alacağı, Türk mahkemelerinde ileri sürme imkânının bulunmadığı sürece."
  7. "Alacaklı ve borçlu sıfatının aynı kişide birleşmesinde, birleşmenin ileride geçmişe etkili olarak ortadan kalkması durumunda, bu durumun ortaya çıkmasına kadar geçecek sürece."

  Durduran sebebin ortadan kalktığı günün bitiminde zamanaşımı işlemeye başlar ya da durmadan önce başlamış olan işlemesini sürdürür (m. 153/son). İlk dört bentte alacaklıdan dava açmasını beklemenin uygun olmayacağı bir yakınlık ya da bağımlılık, son üç bentte hakkın kullanılmasına bir engel vardır.

  > **Örnek (eşler):** Elif 2012'de eşi Murat'a 300.000 TL ödünç verir, borç 2013'te muaccel olur. Evlilik 2026'da boşanmayla sona erer. Evlilik sürerken zamanaşımı işlemediği için on yıllık süre boşanma kararının kesinleştiği günün bitiminden itibaren başlar.

  > **Örnek (birleşme):** Can amcası Ali'ye borçludur. Ali ölünce mirası Can'a kalır ve borç birleşmeyle sona erer (TBK m. 135/1). Can mirası reddederse mirasçılığı geçmişe etkili olarak kalkar ve borç varlığını sürdürür (TBK m. 135/2); ölümle ret arasındaki süre zamanaşımına sayılmaz.

  > ⚠️ **Sınavda dikkat:** Nişanlılar, kardeşler ya da evlenmeden birlikte yaşayanlar arasındaki alacaklar için kanunda bir durma sebebi yoktur.

  ### 4.1 Arabuluculuk: kesmez, durdurur
  - **Dava şartı arabuluculukta** arabuluculuk bürosuna başvurulmasından son tutanağın düzenlendiği tarihe kadar zamanaşımı durur ve hak düşürücü süre işlemez (HUAK m. 18/A'nın 15. fıkrası). Ticari davalardan konusu bir miktar para olan alacak ve tazminat davalarında (TTK m. 5/A) ve kira ilişkisinden doğan uyuşmazlıklarda (HUAK m. 18/B) arabulucuya başvurmak dava şartıdır.
  - **İhtiyari arabuluculukta** sürecin başlamasından sona ermesine kadar geçen süre, zamanaşımı ve hak düşürücü sürelerin hesabında dikkate alınmaz (HUAK m. 16/2). Dava açılmadan önceki başvuruda süreç, tarafların ilk toplantıya davet edilip sürecin devamında anlaştıklarının tutanakla belgelendiği tarihte başlar (HUAK m. 16/1).

  > ⚠️ **Sınavda dikkat:** Arabuluculuk süreyi **baştan başlatmaz**. Son tutanaktan sonra yalnız kalan süre işler. Başvurudan önce dolmuş bir süreyi de canlandırmaz.

  ## 5. Kesilme (TBK m. 154-157)

  **Kesilmede** o ana kadar işlemiş süre silinir ve kesilmeden itibaren **yeni bir süre** başlar (TBK m. 156/1). Kesilme için sürenin henüz dolmamış olması gerekir. Dolmuş bir süre kesilemez.

  ### 5.1 Kesilme sebepleri (TBK m. 154)
  **(1) Borçlunun ikrarı.** Borçlu borcu ikrar etmişse, "özellikle faiz ödemiş veya kısmen ifada bulunmuşsa ya da rehin vermiş veya kefil göstermişse" zamanaşımı kesilir (m. 154/1).
  - İkrar, borcun varlığını kabul eden ve alacaklıya yöneltilen bir beyan ya da davranıştır. Yazılı olması şart değildir.
  - Kısmi ödeme borcun geri kalanını da tanımaktır; kalan kısım için de süre kesilir.
  - Yargıtay'a göre üçüncü kişinin, borçlunun bilgisi dışında yaptığı ödeme zamanaşımını kesmez.

  **(2) Alacaklının başvurusu.** Alacaklı "dava veya def'i yoluyla mahkemeye veya hakeme başvurmuşsa, icra takibinde bulunmuşsa ya da iflas masasına başvurmuşsa" zamanaşımı kesilir (m. 154/2).
  - Dava, dava dilekçesinin kaydedildiği tarihte açılmış sayılır (HMK m. 118).
  - Def'i yoluyla kesilme: alacaklının, kendisine açılan davada alacağını takas def'i olarak ileri sürmesi.

  > ⚠️ **Sınavda dikkat:** **Noter ihtarnamesi zamanaşımını kesmez**, çünkü TBK m. 154 ihtarı saymaz. İhtar borçluyu temerrüde düşürebilir, ama zamanaşımını ne durdurur ne keser. Arabulucuya başvuru da kesmez, yalnız durdurur (§4.1).

  **Kısmi dava.** Yargıtay'ın yerleşik uygulamasına göre fazlaya ilişkin hak saklı tutularak açılan kısmi dava zamanaşımını **yalnız dava edilen kısım** için keser. Saklı tutulan kısım için süre işlemeye devam eder.

  > 📌 **Kesin bilgi:** 16.07.2026 tarihli ve 7589 sayılı Kanunla HMK m. 109'a eklenen dördüncü fıkraya göre kısmi davada talep, aynı davada **bir defaya mahsus** ve iddianın genişletilmesi yasağına tabi olmaksızın tahkikatın sonuna kadar artırılabilir. Bu durumda zamanaşımı **artırılan kısım bakımından da dava tarihinden itibaren kesilmiş sayılır**. Aynı Kanun belirsiz alacak davasını (HMK'nın 107. maddesi) kaldırdı.

  ### 5.2 Birlikte borçlulara etkisi (TBK m. 155)
  - Müteselsil borçlulardan ya da bölünemeyen borcun borçlularından birine karşı kesilme, **diğerlerine karşı da** kesilme sayılır (m. 155/1).
  - Asıl borçluya karşı kesilme **kefile karşı da** kesilmedir (m. 155/2).
  - Kefile karşı kesilme **asıl borçluya karşı** kesilme sayılmaz (m. 155/3).

  > 💡 **Püf nokta:** Kesilme asıl borçludan kefile iner, kefilden asıl borçluya çıkmaz.

  Kuralın haksız fiilde birden çok sorumlu bakımından kapsamı haksız fiil konusunda.

  ### 5.3 Yeni süre (TBK m. 156-157)
  - **Kural:** Kesilmeyle yeni bir süre başlar (m. 156/1). Kanun bu sürenin uzunluğunu ayrıca söylemez; Yargıtay'a göre yeni süre kesilen sürenin aynısıdır. Beş yıllık süre kesilirse yeniden beş yıl işler.
  - **İstisna:** Borç **bir senetle ikrar edilmiş** ya da **mahkeme veya hakem kararına bağlanmışsa** yeni süre **her zaman on yıldır** (m. 156/2).
  - Dava ya da def'i ile kesilen süre, dava boyunca tarafların yargılamaya ilişkin her işleminden ya da hâkimin her kararından sonra yeniden işler (m. 157/1).
  - İcra takibiyle kesilen süre, alacağın takibine ilişkin her işlemden sonra yeniden işler (m. 157/2).
  - İflas masasına başvuruyla kesilen süre, iflas hükümlerine göre alacağın yeniden istenebileceği tarihten itibaren işler (m. 157/3).

  > **Örnek:** Kiracı Okan'ın 2024'e ait kira borcu beş yıllık süreye tabidir. Okan 2026'da kiraya verene "120.000 TL kira borcum vardır" yazan imzalı bir belge verir. Süre kesilir ve yeni süre beş değil **on yıl** olur.

  ### 5.4 İcra takibinde zamanaşımı
  - Takip talebiyle icra dairesine başvurmak zamanaşımını keser; takibin kesinleşmesi beklenmez.
  - Haciz isteme hakkı ödeme emrinin tebliğinden itibaren bir yıl geçmekle düşer ve süresinde haciz istenmezse dosya işlemden kaldırılır (İİK m. 78/2, İİK m. 78/4). Yargıtay Hukuk Genel Kurulu'na göre işlemden kaldırma takibi sona erdirmez; takip derdest kalır ve kesme etkisi ortadan kalkmaz.
  - Alacaklının yenileme talebi ve haciz, satış gibi takibi ilerleten işlemleri zamanaşımını yeniden keser.
  - Borçlu ödeme emrine yedi gün içinde itiraz ederek takibi durdurabilir (İİK m. 62). Takip kesinleştikten sonraki dönemde borcun zamanaşımına uğradığını ileri sürerse icra mahkemesine başvurur ve İİK m. 33/a kıyasen uygulanır (İİK m. 71/2).
  - İlama dayalı takip, son işlemden itibaren on yıl geçmekle zamanaşımına uğrar (İİK m. 39).

  ## 6. Davanın reddinde ek süre (TBK m. 158)

  Dava ya da def'i; mahkemenin yetkili veya görevli olmaması, düzeltilebilecek bir yanlışlık yapılması ya da vaktinden önce açılmış olması nedeniyle reddedilmiş ve bu arada zamanaşımı ya da hak düşürücü süre dolmuşsa alacaklı **altmış günlük ek süre** içinde haklarını kullanabilir.
  - Yargıtay uygulamasına göre ek süre ret kararının kesinleşmesinden itibaren işler. İlk davanın, zamanaşımı **dolmadan** açılmış olması gerekir. Dava açıldığında süre zaten dolmuşsa ek süre alacaklıyı kurtarmaz.
  - Görevsizlik ya da yetkisizlik kararından sonra iki hafta içinde başvurulursa dosya görevli ya da yetkili mahkemeye gönderilir ve aynı dava sürer (HMK m. 20); ilk dava tarihi korunur.

  > **Örnek:** Hakan, adli yargıda görülmesi gereken bir tazminat istemi için zamanaşımı dolmadan idare mahkemesinde dava açar. Mahkeme davayı yargı yolu nedeniyle reddeder ve karar kesinleşir; bu arada zamanaşımı dolmuştur. Yargıtay uygulamasına göre Hakan kesinleşmeden itibaren altmış gün içinde adli yargıda dava açabilir.

  ## 7. Rehinli alacaklar (TBK m. 159, TMK m. 864)
  - **Taşınır rehni:** Alacağın taşınır rehniyle güvenceye bağlanması zamanaşımının işlemesine engel olmaz. Ama alacaklının hakkını **rehinden alma yetkisi devam eder** (TBK m. 159).
  - **Taşınmaz rehni:** Rehnin tapu kütüğüne tescilinden sonra alacak için zamanaşımı **işlemez** (TMK m. 864).

  ## 8. Feragat, ileri sürme ve ispat

  ### 8.1 Zamanaşımından feragat (TBK m. 160)
  - **Önceden** feragat edilemez (m. 160/1). Süre dolduktan sonra borçlu doğmuş def'i hakkından açıkça ya da örtülü olarak vazgeçebilir.
  - Müteselsil borçlulardan birinin feragati diğerlerine karşı ileri sürülemez (m. 160/2). Bölünemez borçta da aynı kural geçerlidir (m. 160/3). Asıl borçlunun feragati kefile karşı ileri sürülemez (m. 160/4).

  > ⚠️ **Sınavda dikkat:** TBK m. 155 ile TBK m. 160'ı karıştırma. Bir müteselsil borçluya karşı **kesilme** herkesi etkiler (m. 155/1). Bir müteselsil borçlunun **feragati** yalnız kendisini bağlar (m. 160/2).

  ### 8.2 Def'i ne zaman ileri sürülür?
  Zamanaşımı ilk itiraz değildir, ama savunmanın genişletilmesi yasağı başlamadan ileri sürülmelidir. HMK ve Hukuk Genel Kurulu'na göre:
  1. **Yazılı yargılamada** davalı def'iyi cevap dilekçesinde (tebliğden itibaren iki hafta, zorunlu hâllerde bir defaya mahsus en çok bir ay ek süre; HMK m. 127) ya da ikinci cevap dilekçesinde (HMK m. 136) ileri sürer. Dilekçelerin karşılıklı verilmesinden sonra savunma genişletilemez (HMK m. 141/1).
  2. **Sonrası** için karşı tarafın **açık muvafakati** ya da **ıslah** gerekir (HMK m. 141/2). Islah aynı davada bir kez ve tahkikatın sonuna kadar yapılabilir (HMK m. 176/2, HMK m. 177/1). Süresinde cevap verip def'iyi unutan davalı, Yargıtay'a göre def'iyi ıslahla ileri sürebilir.
  3. **Süresinde cevap vermeyen davalı** davacının vakıalarını inkâr etmiş sayılır (HMK m. 128). Hukuk Genel Kurulu'na göre bu inkâr zamanaşımı def'ini kapsamaz; sonradan ileri sürülen def'i, davacı açıkça muvafakat etmezse dinlenmez.
  4. **Basit yargılamada** savunmanın genişletilmesi yasağı cevap dilekçesinin verilmesiyle başlar (HMK m. 319).
  5. **Islahla artırılan talebe karşı** davalı, ıslah dilekçesinin tebliği üzerine süresi içinde artırılan kısım için def'i ileri sürebilir.
  6. **İstinafta** ilk derecede ileri sürülmeyen savunmalar dinlenmez (HMK m. 357/1); zamanaşımı ilk kez istinafta ileri sürülemez.

  > ⚠️ **Sınavda dikkat:** Uygulamada "zamanaşımı itirazı" denir, ama teknik olarak doğrusu **def'idir**. Hâkim davalıyı bu savunmaya yönlendirmez.

  ### 8.3 İspat
  Her taraf hakkını dayandırdığı olguyu ispatlar (TMK m. 6). Zamanaşımına dayanan davalı sürenin başladığı tarihi ve geçtiğini, kesilmeye ya da durmaya dayanan davacı ise ikrar, takip veya arabuluculuk başvurusu gibi olguları ispatlar.

  ## 9. Olay çözerken denetim şeması
  1. **Nitelendir ve süreyi seç:** TBK m. 146, m. 147 ya da özel bir hüküm.
  2. **Başlangıç:** Muacceliyet (TBK m. 149, TBK m. 90, TBK m. 479), bildirim, dönemsel edim (m. 150). Her alacağı ayrı hesapla.
  3. **Hesap:** Başlangıç günü sayılmaz, son gün, tatil (m. 151, TBK m. 92-93).
  4. **Durma:** TBK m. 153, arabuluculuk (HUAK m. 16/2, HUAK m. 18/A).
  5. **Kesilme:** Sebep (m. 154), kimlere etkili (m. 155), yeni süre (m. 156-157), kısmi dava ve HMK m. 109/4.
  6. **Ek süre, rehin, feragat:** TBK m. 158, m. 159, m. 160 ve TMK m. 864.
  7. **Usul:** Def'i zamanında ileri sürüldü mü (m. 161, HMK m. 128, 141, 319)? Süre dolmuşsa alacak eksik borçtur (TBK m. 78/2).

kritik: |
  - 📌 Genel süre on yıl (TBK m. 146). Beş yıllık süre (TBK m. 147) altı bentle sınırlıdır: dönemsel edimler; otel ve lokanta; küçük sanat ve küçük çaplı perakende; ortaklık; vekâlet, komisyon, acentalık, simsarlık; eser.
  - ⚠️ Ticari simsarlık ücreti beş yıla değil genel süreye girer. Yüklenicinin yükümlülüklerini ağır kusuruyla hiç ya da gereği gibi ifa etmemesinden doğan alacaklar da beş yıl dışındadır. Eserdeki ayıp için ayrı süreler TBK m. 478'dedir.
  - ⚠️ Avukatın ücret alacağı beş yıldır (TBK m. 147/5). Müvekkilin sözleşmeye dayanarak avukata karşı ileri sürdüğü tazminat istekleri ise öğrenmeden bir yıl, her hâlde zararı doğuran olaydan beş yıl geçmekle düşer (1136 sayılı Kanun m. 40).
  - ⚠️ Anapara faizi beş, anapara (ödünç) on yıldır. Faiz kendi süresiyle önce düşebilir; asıl alacak düşünce faiz de düşer (TBK m. 152). Tersi geçerli değildir.
  - 📌 Süreler sözleşmeyle ne kısaltılabilir ne uzatılabilir (TBK m. 148). Zamanaşımından önceden feragat edilemez (TBK m. 160/1); süre dolduktan sonraki feragat geçerlidir.
  - 📌 Süre muacceliyetle, bildirime bağlı muacceliyette bildirimin yapılabileceği gün başlar (TBK m. 149). Alacaklının öğrenmesi aranmaz; TBK m. 72 ve TBK m. 82'deki öğrenme ölçütüyle karıştırma.
  - 📌 Başlangıç günü sayılmaz, süre son gün de geçince dolar; son gün tatilse izleyen iş gününe geçer (TBK m. 151, TBK m. 93).
  - ⚠️ Durmada süre kaldığı yerden devam eder; kesilmede baştan yeni süre başlar. TBK m. 153 yedi durma sebebi sayar; arabuluculuk gibi özel kanunlardaki durma hâlleri bunlara eklenir.
  - ⚠️ Noter ihtarnamesi zamanaşımını kesmez. Arabulucuya başvuru kesmez, durdurur (HUAK m. 16/2, HUAK m. 18/A); dolmuş süreyi canlandırmaz.
  - ⚠️ Kesilme için sürenin dolmamış olması gerekir. Süre dolduktan sonraki ikrar kesmez; Yargıtay'a göre kural olarak def'iden örtülü feragat sayılır.
  - 📌 Kesilme: müteselsil ya da bölünemez borçta herkese; asıl borçludan kefile; kefilden asıl borçluya değil (TBK m. 155). Feragat ise yalnız feragat edeni bağlar (TBK m. 160).
  - 📌 Yeni süre eskisinin aynısıdır; borç senetle ikrar edilmiş ya da mahkeme veya hakem kararına bağlanmışsa her zaman on yıldır (TBK m. 156/2).
  - 📌 Kısmi dava yalnız dava edilen kısmı keser. 2026'dan beri talep bir kez artırılırsa zamanaşımı artırılan kısım için de dava tarihinden kesilmiş sayılır (HMK m. 109/4).
  - ⚠️ İcra dosyasının işlemden kaldırılması takibin kesme etkisini ortadan kaldırmaz; yenileme talebi süreyi yeniden keser (TBK m. 157/2, İİK m. 78).
  - 📌 TBK m. 158: altmış günlük ek süre zamanaşımı ve hak düşürücü süre için; ilk dava süre dolmadan açılmış olmalıdır.
  - ⚠️ Hâkim zamanaşımını kendiliğinden gözetemez (TBK m. 161). Def'i dilekçeler aşamasından sonra ancak açık muvafakat ya da ıslahla (HMK m. 141), basit yargılamada cevap dilekçesiyle (HMK m. 319) ileri sürülür; istinafta ilk kez ileri sürülemez (HMK m. 357).

doktrin: |
  ### Zamanaşımına uğramış alacağın niteliği
  Baskın görüş ve Yargıtay, zamanaşımının alacağı sona erdirmediğini, yalnız dava edilebilirliğini kaldırdığını kabul eder; alacak eksik borç olarak yaşar. Hukuk Genel Kurulu bir kararında bir adım ileri giderek alacağın, salt sürenin dolmasıyla değil, borçlunun def'iyi ileri sürmesiyle eksik borca dönüştüğünü söylemiştir. Sonuç bakımından fark azdır: def'i ileri sürülmedikçe hâkim alacağa hükmeder, ödenen de geri istenemez.

  ### Süre dolduktan sonra yapılan ikrar
  Dolmuş bir süre kesilemeyeceği için bu ikrar zamanaşımını kesmez. Hukuk Genel Kurulu'na göre süre dolduktan sonra alacaklıya yöneltilen ikrar, öğretideki baskın görüşle birlikte, kural olarak def'iden örtülü feragat anlamına gelir; bu ikrara rağmen def'iyi ileri sürmek çelişkili davranış olarak dürüstlük kuralına (TMK m. 2) aykırı sayılabilir. Feragat bir irade beyanı olduğundan, borçlunun sürenin dolduğunu bilmeden yaptığı bir ikrarın feragat sayılıp sayılamayacağı ise tartışmalıdır. Hukuk Genel Kurulu da haciz baskısı altında ve ihtirazi kayıtla yapılan bir borç yapılandırma başvurusunu feragat saymamıştır. İradenin yorumu olayın özelliklerine bağlıdır.

  ### Zamanaşımı def'i ve dürüstlük kuralı
  Def'i kanunun tanıdığı bir haktır ve kural olarak kötüye kullanma oluşturmaz. Bir görüşe göre borçlu, alacaklıyı oyalayarak ya da güven telkin ederek dava açmasını geciktirmişse def'iyi ileri sürmesi hakkın açıkça kötüye kullanılmasıdır (TMK m. 2/2). Yargıtay'ın bir dairesi, izinsiz para toplayan şirketlere karşı yatırımcıların açtığı davalarda uzun süre bu görüşü uyguladı. 2022'de off-shore hesap alacaklarında zamanaşımının başlangıcına ilişkin bir İçtihadı Birleştirme Kararı verildi; daire çoğunluğu bu kararın gerekçesini yol gösterici sayarak benzer davalarda zamanaşımını uygulamaya başladı, karşı oy ise oyalama nedeniyle def'inin dürüstlük kuralına aykırı olduğu görüşünü sürdürdü. Konu istisnaidir ve olayın özelliklerine göre değerlendirilir.

  ### Vekâlet verenin vekile karşı tazminat alacağı
  TBK m. 147/5 "vekâlet ... sözleşmelerinden ... doğan alacaklar" dediği için, lafza göre vekâlet verenin sözleşmeye aykırılıktan doğan tazminat alacağı da beş yıllık süreye girer. Vekil avukatsa özel hüküm önce gelir: müvekkilin sözleşmeye dayanan tazminat istekleri, hakkın doğumunun öğrenildiği tarihten bir yıl ve her hâlde zararı doğuran olaydan beş yıl geçmekle düşer (1136 sayılı Kanun m. 40; madde başlığı bu süreyi zamanaşımı olarak adlandırır). Bir yıllık sürenin ne zaman başladığı tartışmalıdır. Yargıtay'ın bir dairesi süreyi azil tarihinden başlatan bir yerel mahkeme kararını onamıştır. Karşı oya göre azil anında zarar henüz doğmamış olabilir; süre, zararın varlığı ve kapsamı öğrenildiğinde, örneğin avukatın geç açtığı ya da takipsiz bıraktığı işin kesin olarak kaybedildiği anda başlamalıdır.

  ### Süresinde cevap vermeyen davalı ıslahla def'i ileri sürebilir mi?
  Hukuk Genel Kurulu çoğunluğuna göre hayır: ıslahın konusu daha önce yapılmış geçerli bir usul işlemidir ve ıslah kaçırılmış süreyi geri getirmez. Karşı oya ve öğretideki bir görüşe göre ise kanunen inkâr etmiş sayılan davalı ile cevap verip def'iyi unutan davalı arasında fark gözetmenin dayanağı yoktur; ıslah ikisine de açık olmalıdır.

  ### HMK m. 109/4 derdest davalara uygulanır mı?
  Hüküm yenidir. Usul hükümleri tamamlanmış işlemleri etkilememek kaydıyla derhâl uygulanır (HMK m. 448). Ancak zamanaşımının maddi hukuka ilişkin sonuçları nedeniyle, yürürlükten önce açılmış kısmi davalarda artırılan kısım için kesilmenin dava tarihine götürülüp götürülemeyeceği tartışmalıdır. Artırımın ıslah hakkıyla ilişkisi konusunda da uygulama henüz oturmamıştır.

sozluk:
  - terim: Zamanaşımı
    tanim: Kanunda öngörülen süre içinde istenmeyen bir alacağın dava edilebilirliğini yitirmesi. Alacak sona ermez, eksik borç olarak kalır.
  - terim: Hak düşürücü süre
    tanim: Bir hakkın yalnız belli bir süre içinde kullanılabilmesi. Süre geçince hak sona erer ve hâkim bunu kendiliğinden gözetir.
  - terim: Def'i
    tanim: Var olan bir hakka karşı borçluya ifadan kaçınma imkânı veren karşı hak. Ancak ileri sürülürse dikkate alınır; zamanaşımı bir def'idir.
  - terim: İtiraz
    tanim: Hakkın hiç doğmadığını ya da sona erdiğini gösteren olgu (ödeme, kesin hükümsüzlük gibi). Dosyadan anlaşılıyorsa hâkim kendiliğinden gözetir.
  - terim: Eksik borç
    tanim: İfa edilebilen ama dava edilemeyen borç. Zamanaşımına uğramış borç ödenirse geri istenemez (TBK m. 78/2).
  - terim: Muacceliyet
    tanim: Alacaklının ifayı isteyebilmesi. Zamanaşımı kural olarak bu anda işlemeye başlar (TBK m. 149).
  - terim: Dönemsel edim
    tanim: Aynı hukuki sebepten belli ve düzenli aralıklarla doğan edim, örneğin aylık kira, ücret ya da yıllık faiz (TBK m. 147/1).
  - terim: Zamanaşımının durması
    tanim: Kanunda sayılan bir sebep sürerken zamanaşımının işlememesi; sebep kalkınca süre kaldığı yerden devam eder (TBK m. 153).
  - terim: Zamanaşımının kesilmesi
    tanim: İşlemiş sürenin silinip kesilmeden itibaren yeni bir sürenin başlaması (TBK m. 154, TBK m. 156).
  - terim: Borç ikrarı
    tanim: Borçlunun borcun varlığını alacaklıya karşı kabul etmesi; faiz ödemek, kısmen ifa etmek, rehin vermek ve kefil göstermek de ikrardır (TBK m. 154/1).
  - terim: Ek süre
    tanim: Dava yetkisizlik, görevsizlik, düzeltilebilir yanlışlık ya da erken açılma nedeniyle reddedilip arada süre dolmuşsa alacaklıya tanınan altmış gün (TBK m. 158).
  - terim: Zamanaşımından feragat
    tanim: Borçlunun zamanaşımı def'inden vazgeçmesi. Önceden yapılamaz; süre dolduktan sonra yapılabilir ve yalnız feragat edeni bağlar (TBK m. 160).
  - terim: Savunmanın genişletilmesi yasağı
    tanim: Dilekçelerin karşılıklı verilmesinden sonra davalının yeni savunma ileri sürememesi; istisnası açık muvafakat ve ıslahtır (HMK m. 141).
  - terim: Kısmi dava
    tanim: Bölünebilir bir alacağın yalnız bir kısmının dava edilmesi. Zamanaşımı kural olarak yalnız dava edilen kısım için kesilir (HMK m. 109).
  - terim: Islah
    tanim: Tarafın kendi usul işlemini kısmen ya da tamamen düzeltmesi; aynı davada bir kez ve tahkikat sonuna kadar yapılabilir (HMK m. 176, HMK m. 177).

kararlar:
  - id: "76448800"
    ozet: |
      Bir kooperatifin konut inşaatında elektrik tesisatı işini üstlenen yüklenici, bakiye 7.700 TL ücret alacağı için iş sahibi kooperatife dava açmıştır. Alacak eserin en geç 31.12.2003'te teslimiyle muaccel olmuş, yüklenici 12.09.2007'de icra takibi başlatmış, takip dosyası 18.11.2008'de işlemden kaldırılmış, dava 2011'de açılmıştır. Yerel mahkeme beş yıllık sürenin dolduğunu ve işlemden kaldırmayla takibin kesme etkisinin ortadan kalktığını kabul ederek davayı reddetmiş, Yargıtay 15. Hukuk Dairesi bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu oy birliğiyle direnme kararını bozmuştur. Gerekçeye göre eser sözleşmesinden doğan alacak beş yıllık süreye tabidir, icra takibi zamanaşımını keser ve kesilmeden itibaren aynı uzunlukta yeni bir süre başlar. Bir yıl içinde haciz istenmediği için dosyanın işlemden kaldırılması takibi sona erdirmez, takip derdest kalır ve yenilemeyle sürdürülebilir; bu yüzden kesme etkisi ortadan kalkmaz. Karar ayrıca zamanaşımına uğrayan borcun eksik borca dönüştüğünü, kesilme için sürenin henüz dolmamış olması gerektiğini ve kısmi dava ya da takipte kesilmenin yalnız dava veya takip edilen kısım için gerçekleştiğini vurgular. Konuya katkısı: icra takibinin zamanaşımına etkisini ve kesilmenin genel ilkelerini toplu olarak gösterir.
  - id: "348425100"
    ozet: |
      Kasko sigortalı aracı kazada hasar gören davacı, sigortacıya tazminat davası açmıştır. Dava dilekçesi 19.09.2011'de tebliğ edilen davalı, cevap dilekçesini yasal süre geçtikten sonra 17.10.2011'de vermiş; bu dilekçede zamanaşımı def'inde bulunmuş, bu kabul edilmezse savunmasını ıslah ederek aynı def'iyi ileri sürdüğünü bildirmiştir. Davacı savunmanın genişletilmesine muvafakat etmediğini bildirmiştir. Ticaret mahkemesi ıslah yoluyla zamanaşımı def'inin ileri sürülebileceğini kabul ederek davayı reddetmiş, Yargıtay 17. Hukuk Dairesi bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu oy çokluğuyla direnme kararını bozmuştur. Gerekçeye göre zamanaşımı ilk itiraz değildir, ama savunmanın genişletilmesi yasağı başlamadan ileri sürülmelidir. Süresinde cevap vermeyen davalının sonradan ileri sürdüğü def'i ancak davacının açık muvafakatiyle dinlenir. Islahın konusu daha önce yapılmış geçerli bir usul işlemi olduğundan, süresinde verilmemiş ve itirazla karşılaşmış bir cevap dilekçesi ıslah edilemez; ıslah kaçırılmış süreyi geri getirmez. Karşı oy, süresinde cevap vermeyen davalının da ıslahla def'i ileri sürebileceğini savunmuştur. Karar, HMK m. 141'in 7251 sayılı Kanunla 2020'de değişmeden önceki metnine dayanır; o metin dilekçelerden sonra ön inceleme aşamasında açık muvafakatle, karşı taraf ön inceleme duruşmasına mazeretsiz gelmemişse muvafakatsiz genişletmeye de izin veriyordu. Bugünkü metinde taraflar cevaba cevap ve ikinci cevap dilekçeleriyle serbestçe genişletebilir, dilekçelerin karşılıklı verilmesinden sonra genişletme yasaktır; açık muvafakat ve ıslah istisnası (HMK m. 141/2) aynen korunmuştur. Bu yüzden kararın süresinde cevap vermeyen davalıya ilişkin sonucu değişmemiştir; Hukuk Genel Kurulu 2021'de değişik metni de anarak aynı sonuca yine oy çokluğuyla varmıştır. Konuya katkısı: def'inin ileri sürülme zamanını ve ıslahla ilişkisini gösterir.
  - id: "1229194200"
    ozet: |
      Kasko sigortalı aracı çalınan davacı, fazlaya ilişkin hakkını saklı tutarak sigortacıya 30.000 TL araç bedeli ve 70.000 TL kazanç kaybı için dava açmış, 28.10.2022'de ıslahla araç bedeli talebini 44.349,40 TL'ye çıkarmıştır. Davalı, ıslah dilekçesinin tebliği üzerine süresi içinde artırılan kısım için zamanaşımı def'inde bulunmuştur. İlk derece mahkemesi, Daire'nin bu def'inin incelenmesi gerektiğine ilişkin önceki bozma kararına uyduktan sonra def'iyi reddetmiş ve araç bedelini kabul etmiştir. Yargıtay 4. Hukuk Dairesi hükmü oy birliğiyle bozmuştur. Olay 18.12.2009'da gerçekleşmiş, sigortacının 15.03.2010 tarihli borç ikrarı sigorta alacağına uygulanan iki yıllık zamanaşımını kesmiş ve eski Borçlar Kanunu'nun senetle ikrar kuralı (bugün TBK m. 156/2) uyarınca ikrar tarihinden itibaren on yıllık yeni süre başlamıştır. Dava 11.11.2014'te açılmıştır, ama kısmi davada zamanaşımı yalnız dava edilen kısım için kesildiğinden saklı tutulan kısım için süre işlemeye devam etmiş ve ıslah tarihinde dolmuştur; artırılan kısım reddedilmelidir. Konuya katkısı: ikrarın kesme etkisini, yeni süreyi ve kısmi davada eski uygulamayı gösterir. 7589 sayılı Kanunla eklenen HMK m. 109/4, talebin bir kez artırıldığı kısmi davalarda bu sonucu değiştirmiş, artırılan kısım için de zamanaşımının dava tarihinden kesilmiş sayılmasını öngörmüştür.

sorular:
  - soru: |
      Kiraya veren, kira alacağı için dava açmadan önce arabuluculuk bürosuna başvurmuştur. Başvurunun zamanaşımına etkisi hakkında hangisi doğrudur?
    siklar:
      - "Başvuru zamanaşımını keser ve son tutanaktan itibaren yeni beş yıllık süre başlar."
      - "Başvurudan son tutanağın düzenlendiği tarihe kadar zamanaşımı durur, sonra kalan süre işler."
      - "Arabuluculuk bir dava olmadığı için zamanaşımına hiçbir etkisi yoktur."
      - "Başvuru, o tarihte dolmuş olan süreleri de yeniden canlandırır."
    dogru: 1
    aciklama: |
      Kira ilişkisinden doğan uyuşmazlıklarda dava açmadan önce arabulucuya başvurmak dava şartıdır (HUAK m. 18/B). Dava şartı arabuluculukta başvurudan son tutanağa kadar zamanaşımı durur ve hak düşürücü süre işlemez (HUAK m. 18/A'nın 15. fıkrası). Durma kesilme değildir: süre baştan başlamaz, kaldığı yerden devam eder. Başvurudan önce dolmuş bir süre de canlanmaz.

  - soru: |
      TBK m. 147'ye göre aşağıdaki alacaklardan hangisi beş yıllık zamanaşımına **tabi değildir**?
    siklar:
      - "Lokantadaki yeme içme bedeli"
      - "Adi ortaklıkta bir ortağın ortaklık sözleşmesinden doğan kâr payı alacağı"
      - "Ticari simsarın ücret alacağı"
      - "Acentalık sözleşmesinden doğan alacak"
    dogru: 2
    aciklama: |
      TBK m. 147/5, simsarlık sözleşmesinden doğan alacakları beş yıla bağlarken **ticari simsarlık ücreti alacağını** açıkça dışarıda bırakır. Özel bir hüküm yoksa bu alacağa on yıllık genel süre uygulanır (TBK m. 146). Yeme içme bedeli (m. 147/2), ortaklık sözleşmesinden doğan alacak (m. 147/4) ve acentalık sözleşmesinden doğan alacak (m. 147/5) beş yıldır.

  - soru: |
      Av. Selin, müvekkili Kaan'ın alacak davasını sonuçlandırmıştır. Avukatlık sözleşmesinde kararlaştırılan 150.000 TL ücret muaccel olmuş, ama Kaan ödememiştir. Selin'in ücret alacağının tabi olduğu zamanaşımı süresi hakkında hangisi doğrudur?
    siklar:
      - "Avukatlık ücreti için kanunda özel bir süre bulunmadığından on yıllık genel süre uygulanır."
      - "Avukatlık sözleşmesi bir vekâlet sözleşmesi olduğundan ücret alacağı beş yıllık zamanaşımına tabidir."
      - "Ücret alacağı, müvekkilin avukata karşı tazminat istekleri gibi, öğrenmeden itibaren bir yıllık süreye tabidir."
      - "Ücret alacağı haksız fiil hükümlerine göre öğrenmeden itibaren iki yıllık süreye tabidir."
    dogru: 1
    aciklama: |
      Avukatlık sözleşmesi bir vekâlet sözleşmesidir. TBK m. 147/5 vekâlet sözleşmesinden doğan alacakları beş yıllık zamanaşımına bağlar ve Yargıtay avukatın ücret alacağına bu süreyi uygular. Alacak sözleşmeden doğduğu için haksız fiil süresi (TBK m. 72) uygulanmaz. Bir yıllık süre ise yalnız müvekkilin sözleşmeye dayanarak avukata karşı ileri sürdüğü tazminat istekleri içindir: bu istekler hakkın doğumunun öğrenildiği tarihten bir yıl ve her hâlde zararı doğuran olaydan beş yıl geçmekle düşer (1136 sayılı Kanun m. 40).

  - soru: |
      Mert 2014'te Deniz'e faizli 500.000 TL ödünç vermiştir. Anapara 01.06.2020'de geri ödenecek, faizler her yıl sonunda ödenecektir. Deniz 2014-2019 yıllarının faizlerini ve anaparayı ödememiş, zamanaşımını kesen ya da durduran bir olay da olmamıştır. Mert 2026'da dava açar, Deniz zamanaşımı def'inde bulunur. Hangisi doğrudur?
    siklar:
      - "Anapara da faizler de on yıllık süreye tabi olduğundan hepsi istenebilir."
      - "Anapara on yıllık süreye tabi olduğundan istenebilir; yıllık faizlerin her biri kendi muacceliyetinden başlayan beş yılda zamanaşımına uğramıştır."
      - "Faizler zamanaşımına uğradığı için bağlılık ilkesi gereği anapara da zamanaşımına uğramıştır."
      - "Faizler anaparaya bağlı olduğundan anapara muaccel olmadıkça faizler için zamanaşımı işlemez."
    dogru: 1
    aciklama: |
      Anapara faizleri dönemsel edim olarak beş yıllık süreye tabidir (TBK m. 147/1) ve her yılın faizi kendi muacceliyetinden başlayarak ayrı ayrı zamanaşımına uğrar; en son 2019 faizi 2024 sonunda düşmüştür. Ödünç verilen paranın geri istenmesi ise on yıldır (TBK m. 146) ve 01.06.2030'a kadar istenebilir. TBK m. 152 yalnız bir yönde işler: asıl alacak zamanaşımına uğrayınca faiz de uğrar; faizin zamanaşımı asıl alacağı etkilemez.

  - soru: |
      Bir eser sözleşmesine "Bu sözleşmeden doğan bütün alacaklar iki yılda zamanaşımına uğrar" hükmü konmuştur. Yüklenici bedel alacağı için eserin tesliminden üç yıl sonra dava açar, iş sahibi zamanaşımı def'inde bulunur. Hangisi doğrudur?
    siklar:
      - "Taraflar süreyi serbestçe kısaltabileceği için alacak zamanaşımına uğramıştır."
      - "Süre sözleşmeyle değiştirilemeyeceği için kanundaki beş yıllık süre uygulanır ve dava süresindedir."
      - "Süre sözleşmeyle uzatılamaz ama kısaltılabilir; bu yüzden dava reddedilir."
      - "Hüküm geçerlidir, ama yalnız iş sahibinin alacaklarına uygulanır."
    dogru: 1
    aciklama: |
      TBK m. 148'e göre bu ayırımda belirlenen zamanaşımı süreleri sözleşmeyle değiştirilemez; kısaltma da uzatma da yasaktır. Yüklenicinin bedel alacağı beş yıllık süreye tabidir (TBK m. 147/6) ve bedel kural olarak eserin teslimiyle muaccel olur (TBK m. 479). Teslimden üç yıl sonra açılan dava süresindedir; sözleşmedeki iki yıllık kayda dayanılamaz.

  - soru: |
      Zamanaşımı ile hak düşürücü süre arasındaki fark bakımından hangisi doğrudur?
    siklar:
      - "Hak düşürücü sürenin dolduğunu hâkim kendiliğinden gözetir; zamanaşımını ise ileri sürülmedikçe gözetemez."
      - "İkisi de ancak def'i olarak ileri sürülürse dikkate alınır."
      - "Zamanaşımı dolunca alacak tamamen sona erer; hak düşürücü süre dolunca hak eksik borç olarak kalır."
      - "Hak düşürücü süreler de borçlunun ikrarıyla kesilir ve yeniden başlar."
    dogru: 0
    aciklama: |
      Zamanaşımı bir def'idir: ileri sürülmedikçe hâkim onu kendiliğinden göz önüne alamaz (TBK m. 161). Zamanaşımına uğrayan alacak sona ermez, eksik borç olur. Hak düşürücü süre ise hakkın kendisini sona erdirir ve hâkim bunu kendiliğinden gözetir; örneğin yanılma nedeniyle sözleşmeyle bağlı olmadığını bildirme süresi (TBK m. 39). İkrarla kesilme zamanaşımına özgü bir kurumdur (TBK m. 154).

  - soru: |
      Alacağın muaccel olması alacaklının bir bildirimine bağlı ise zamanaşımı ne zaman işlemeye başlar?
    siklar:
      - "Alacaklının bildirimi fiilen yaptığı günden"
      - "Bildirimin yapılabileceği günden"
      - "Bildirimden sonra borçluya tanınan sürenin bittiği günden"
      - "Alacaklının alacağını öğrendiği günden"
    dogru: 1
    aciklama: |
      TBK m. 149/2'ye göre alacağın muaccel olması bir bildirime bağlı ise zamanaşımı bu bildirimin **yapılabileceği** günden işlemeye başlar. Böylece alacaklı bildirimi geciktirerek başlangıcı erteleyemez. Öğrenme ölçütü TBK m. 146-147'de yoktur; haksız fiil (TBK m. 72) ve sebepsiz zenginleşme (TBK m. 82) için geçerlidir.

  - soru: |
      Ömür boyu gelir gibi dönemsel edimlerde alacağın **tamamı** için zamanaşımı ne zaman başlar?
    siklar:
      - "Gelir sözleşmesinin kurulduğu gün"
      - "İfa edilmemiş ilk dönemsel edimin muaccel olduğu gün"
      - "En son ödenen dönemsel edimin ödendiği gün"
      - "Gelir alacaklısının ölümüyle"
    dogru: 1
    aciklama: |
      TBK m. 150/1'e göre ömür boyu gelir ve benzeri dönemsel edimlerde alacağın tamamı için zamanaşımı, ifa edilmemiş ilk dönemsel edimin muaccel olduğu günde başlar. Alacağın tamamı zamanaşımına uğrarsa ifa edilmemiş dönemsel edimler de zamanaşımına uğramış olur (m. 150/2). Tek tek taksitler ise beş yıllık süreye tabidir (TBK m. 147/1).

  - soru: |
      Kira bedeli 16.03.2021'de muaccel olmuştur. Arada ne durma ne de kesilme olmuştur. Kiraya veren 16.03.2026'da dava açar. Hangisi doğrudur?
    siklar:
      - "Süre 15.03.2026'da dolduğu için alacak zamanaşımına uğramıştır."
      - "Başlangıç günü sayılmadığı ve zamanaşımı ancak son gün de geçince gerçekleştiği için dava süresindedir."
      - "Kira bedeli on yıllık süreye tabi olduğu için tarihlerin önemi yoktur."
      - "Zamanaşımı muacceliyetten değil, kiraya verenin ödemenin yapılmadığını fark ettiği günden başlar."
    dogru: 1
    aciklama: |
      Kira bedeli beş yıllık süreye tabidir (TBK m. 147/1) ve süre muacceliyetle başlar (TBK m. 149). TBK m. 151/1'e göre başlangıç günü sayılmaz ve zamanaşımı ancak son gün de hak kullanılmadan geçince gerçekleşir. Yıl olarak belirlenen süre son yılın karşılık gelen gününde dolduğundan (TBK m. 92/1-3) süre 16.03.2026 gününün bitiminde dolar; o gün açılan dava süresindedir.

  - soru: |
      TBK m. 153'e göre aşağıdakilerden hangisi zamanaşımını durduran sebepler arasında **sayılmamıştır**?
    siklar:
      - "Velayet süresince, çocukların ana ve babalarından olan alacakları"
      - "Evlilik devam ettiği sürece, eşlerin diğerinden olan alacakları"
      - "Hizmet ilişkisi süresince, ev hizmetlilerinin onları çalıştıranlardan olan alacakları"
      - "Nişanlılık devam ettiği sürece, nişanlıların birbirinden olan alacakları"
    dogru: 3
    aciklama: |
      TBK m. 153 yedi durma sebebi sayar: velayet, vesayet, evlilik, ev hizmetlilerinin hizmet ilişkisi, borçlunun alacak üzerindeki intifa hakkı, alacağı Türk mahkemelerinde ileri sürme imkânının bulunmaması ve birleşmenin geçmişe etkili olarak ortadan kalkması. Nişanlılık bu sebepler arasında yoktur; nişanlılar arasındaki alacaklarda süre işler.

  - soru: |
      Aşağıdakilerden hangisi TBK m. 154'e göre zamanaşımını **kesmez**?
    siklar:
      - "Borçlunun faiz ödemesi"
      - "Alacaklının borçluya noter aracılığıyla ihtarname göndermesi"
      - "Borçlunun borç için kefil göstermesi"
      - "Alacaklının icra takibinde bulunması"
    dogru: 1
    aciklama: |
      TBK m. 154 kesilme sebeplerini borçlunun ikrarı (faiz ödeme, kısmi ifa, rehin verme, kefil gösterme) ile alacaklının dava, def'i, icra takibi ve iflas masasına başvurusu olarak sayar. İhtarname bunlar arasında değildir. İhtar borçluyu temerrüde düşürebilir, ama zamanaşımını kesmez.

  - soru: |
      Banka, Ozan'ın kredi borcuna kefil olan Pınar hakkında icra takibi başlatmış, Ozan hakkında hiçbir işlem yapmamıştır. Ozan da borcu ikrar eden bir davranışta bulunmamıştır. Zamanaşımının kesilmesi bakımından hangisi doğrudur?
    siklar:
      - "Takip Pınar'a karşı zamanaşımını keser, Ozan'a karşı kesmez."
      - "Kefile karşı kesilme asıl borçluyu da etkilediği için Ozan'a karşı da kesilmiştir."
      - "Kefile karşı başlatılan icra takibi zamanaşımını kesmez; yalnız asıl borçluya karşı takip keser."
      - "Kefil ile asıl borçlunun borcu aynı borç olduğu için takip ikisine karşı da zamanaşımını keser."
    dogru: 0
    aciklama: |
      TBK m. 155/3'e göre zamanaşımı kefile karşı kesilince asıl borçluya karşı kesilmiş olmaz. Tersi ise geçerlidir: asıl borçluya karşı kesilme kefile karşı da kesilme sayılır (m. 155/2). İcra takibi kimin hakkında başlatılmışsa ona karşı zamanaşımını keser (TBK m. 154/2).

  - soru: |
      Kiracı Okan'ın 2023 yılına ait kira borcu muaccel olmuştur. Okan 10.01.2026'da kiraya verene "2023 yılı kiralarından 120.000 TL borcum vardır" yazan imzalı bir belge verir. Bu belgenin zamanaşımına etkisi nedir?
    siklar:
      - "Zamanaşımı kesilir ve yeni süre yine beş yıldır."
      - "Zamanaşımı kesilir ve borç senetle ikrar edildiği için yeni süre on yıldır."
      - "Zamanaşımı yalnız durur, belge tarihinden sonra kalan süre işler."
      - "Belge zamanaşımı dolmadan verildiği için hiçbir etkisi yoktur."
    dogru: 1
    aciklama: |
      Borcun ikrarı zamanaşımını keser (TBK m. 154/1) ve kural olarak kesilen sürenin aynısı yeniden başlar (TBK m. 156/1). Ancak borç bir senetle ikrar edilmişse yeni süre her zaman on yıldır (TBK m. 156/2). Kira bedeli için beş yıllık süre (TBK m. 147/1) 2028'den önce dolmayacağından ikrar işleyen bir süreyi kesmiştir.

  - soru: |
      Yüklenici Hasan, eser bedeli alacağı için 2023'te icra takibi başlatmıştır. Ödeme emri tebliğ edilmiş, borçlu itiraz etmemiş, ama Hasan bir yıl içinde haciz istemediği için dosya işlemden kaldırılmıştır. Borçlu, işlemden kaldırmayla takibin zamanaşımını kesen etkisinin ortadan kalktığını ileri sürmektedir. Yargıtay Hukuk Genel Kurulu'nun yaklaşımına göre hangisi doğrudur?
    siklar:
      - "İşlemden kaldırılan takip hiç yapılmamış sayılır, kesme etkisi ortadan kalkar."
      - "İşlemden kaldırma takibi sona erdirmez, takip derdest kalır ve kesme etkisi sürer."
      - "Kesme etkisi ancak alacaklı işlemden kaldırmadan sonraki bir ay içinde yenileme isterse sürer."
      - "İcra takibi zamanaşımını kesmez, yalnız dava keser."
    dogru: 1
    aciklama: |
      İcra takibi zamanaşımını keser (TBK m. 154/2). İİK m. 78'e göre süresinde haciz istenmezse dosya işlemden kaldırılır, ama Hukuk Genel Kurulu'na göre bu takibi sona erdirmez; takip derdest kalır ve alacaklı yenileme talebiyle aynı dosyada devam edebilir. Bu nedenle takibin kesme etkisi ortadan kalkmaz. Yenileme talebi ise süreyi yeniden keser (TBK m. 157/2).

  - soru: |
      Selda'nın tazminat istemi için zamanaşımı 2020'de dolmuştur. Selda 2021'de istemini idare mahkemesinde ileri sürer; mahkeme davanın adli yargıda görülmesi gerektiği gerekçesiyle davayı reddeder ve karar kesinleşir. Selda kesinleşmeden itibaren altmış gün içinde adli yargıda dava açar ve TBK m. 158'e dayanır. Hangisi doğrudur?
    siklar:
      - "Altmış günlük ek süre her durumda tanındığı için dava süresindedir."
      - "Ek süre ancak ilk dava zamanaşımı dolmadan açılmışsa işe yarar; süre ilk davadan önce dolduğu için Selda ek süreden yararlanamaz."
      - "Ek süre yalnız hak düşürücü süreler için öngörüldüğünden zamanaşımına uygulanmaz."
      - "Ek süre, ilk davanın açıldığı tarihten itibaren altmış gündür."
    dogru: 1
    aciklama: |
      TBK m. 158, dava reddedilmiş olup "o arada" zamanaşımı ya da hak düşürücü süre dolmuşsa altmış günlük ek süre tanır; madde iki tür süreyi de kapsar. Yargıtay uygulamasına göre ek süre ret kararının kesinleşmesinden işler ve ilk davanın zamanaşımı dolmadan açılmış olmasını gerektirir. Selda'nın süresi ilk davadan önce dolduğu için ek süre onu kurtarmaz.

  - soru: |
      Rehinle güvence altına alınmış alacaklarda zamanaşımı hakkında hangisi doğrudur?
    siklar:
      - "Taşınır rehniyle güvence altına alınmış alacakta zamanaşımı hiç işlemez."
      - "Taşınır rehninde zamanaşımı işler ama alacaklının hakkını rehinden alma yetkisi devam eder; tapuya tescilli taşınmaz rehninde ise tescilden sonra zamanaşımı işlemez."
      - "Taşınmaz rehninde zamanaşımı işler, taşınır rehninde işlemez."
      - "Rehinli alacak zamanaşımına uğrayınca rehin de kendiliğinden sona erer."
    dogru: 1
    aciklama: |
      TBK m. 159'a göre alacağın taşınır rehniyle güvenceye bağlanması zamanaşımının işlemesine engel olmaz, ama alacaklının hakkını rehinden alma yetkisi devam eder. TMK m. 864'e göre ise rehnin tapu kütüğüne tescil edilmesinden sonra alacak için zamanaşımı işlemez.

  - soru: |
      Ali ve Veli, Zeynep'e karşı 200.000 TL'lik bir borçtan müteselsilen sorumludur. Borç 2024'te zamanaşımına uğramıştır. Veli 2025'te Zeynep'e gönderdiği imzalı yazıda zamanaşımını ileri sürmeyeceğini ve borcu ödeyeceğini bildirir. Zeynep 2026'da ikisine dava açar, ikisi de zamanaşımı def'inde bulunur. Hangisi doğrudur?
    siklar:
      - "Zamanaşımından feragat hiçbir zaman geçerli olmadığından ikisinin def'i de kabul edilir."
      - "Veli süre dolduktan sonra feragat ettiği için def'iye dayanamaz; feragati Ali'ye karşı ileri sürülemeyeceğinden Ali'nin def'i kabul edilir."
      - "Veli'nin yazısı zamanaşımını kestiği için ikisine karşı da yeni süre başlamıştır."
      - "Müteselsil borçlulardan birinin feragati hepsini bağladığı için ikisinin def'i de reddedilir."
    dogru: 1
    aciklama: |
      TBK m. 160/1 yalnız **önceden** feragati yasaklar; süre dolduktan sonra doğmuş def'i hakkından vazgeçmek geçerlidir. Müteselsil borçlulardan birinin feragati diğerlerine karşı ileri sürülemez (m. 160/2). Yazı zamanaşımını da kesmez, çünkü dolmuş bir süre kesilemez; bu yüzden kesilmenin herkese yayıldığını söyleyen TBK m. 155/1 burada uygulanmaz.

  - soru: |
      Dava dilekçesi kendisine tebliğ edilen davalı, iki haftalık süre içinde cevap dilekçesi vermez ve ek süre de istemez. Aylar sonra verdiği dilekçede alacağın zamanaşımına uğradığını ileri sürer; davacı açıkça karşı çıkar. Davalı ıslah yoluna da başvurmamıştır. Hangisi doğrudur?
    siklar:
      - "Süresinde cevap vermeyen davalı bütün vakıaları inkâr etmiş sayıldığından zamanaşımı def'i de ileri sürülmüş sayılır."
      - "Def'i savunmanın genişletilmesi niteliğindedir; davacının açık muvafakati olmadığından dikkate alınamaz."
      - "Hâkim zamanaşımını kendiliğinden gözetmek zorunda olduğundan def'inin zamanı önemsizdir."
      - "Zamanaşımı ilk itiraz olduğundan yalnız cevap dilekçesinde ileri sürülebilir; davacı muvafakat etse bile dinlenmez."
    dogru: 1
    aciklama: |
      Süresinde cevap vermeyen davalı davacının vakıalarını inkâr etmiş sayılır (HMK m. 128), ama Hukuk Genel Kurulu'na göre bu inkâr zamanaşımı def'ini kapsamaz. Dilekçelerin karşılıklı verilmesinden sonra savunma genişletilemez (HMK m. 141/1); sonradan ileri sürülen def'i savunmanın genişletilmesidir ve karşı tarafın açık muvafakati ya da ıslah olmadıkça dinlenmez (HMK m. 141/2). Zamanaşımı ilk itiraz değildir ve hâkim onu kendiliğinden gözetemez (TBK m. 161).

  - soru: |
      7589 sayılı Kanunla HMK m. 109'a eklenen dördüncü fıkraya göre, kısmi davada talep artırıldığında zamanaşımı bakımından hangisi doğrudur?
    siklar:
      - "Artırılan kısım için zamanaşımı, artırım dilekçesinin verildiği tarihte kesilir."
      - "Talep aynı davada bir defaya mahsus artırılabilir ve zamanaşımı artırılan kısım bakımından da dava tarihinden itibaren kesilmiş sayılır."
      - "Talep sınırsız sayıda artırılabilir ve her artırım zamanaşımını yeniden başlatır."
      - "Artırım ancak davalının açık muvafakatiyle yapılabilir, aksi hâlde zamanaşımı işlemeye devam eder."
    dogru: 1
    aciklama: |
      HMK m. 109/4'e göre alacağın yalnız bir kısmının dava edildiği durumlarda talep, aynı davada bir defaya mahsus olmak üzere, iddianın genişletilmesi yasağına tabi olmaksızın tahkikatın sona ermesine kadar artırılabilir. Bu durumda zamanaşımı, artırılan kısım bakımından da dava tarihinden itibaren kesilmiş sayılır. Eski uygulamada kısmi dava zamanaşımını yalnız dava edilen kısım için keserdi.

  - soru: |
      Kiracı Ece, zamanaşımına uğradığını bilmediği 2018 yılına ait kira borcunu 2025'te kiraya verene ödemiştir. Sonra durumu öğrenerek ödediğini geri istemektedir. Hangisi doğrudur?
    siklar:
      - "Borcun zamanaşımına uğradığını bilmeden ödediği için sebepsiz zenginleşme hükümlerine göre geri isteyebilir."
      - "Zamanaşımına uğramış borç eksik borçtur; ifa edilmişse geri istenemez."
      - "Kiraya veren alacağını zamanaşımı nedeniyle kaybettiği için parayı iade etmek zorundadır."
      - "Ancak ödeme sırasında ihtirazi kayıt koymamışsa geri isteyebilir."
    dogru: 1
    aciklama: |
      Zamanaşımı alacağı sona erdirmez, dava edilebilirliğini kaldırır. Zamanaşımına uğramış bir borcun ifasından kaynaklanan zenginleşme geri istenemez (TBK m. 78/2). Borçlunun sürenin dolduğunu bilmemesi sonucu değiştirmez; ortada gerçekten var olan bir borç ödenmiştir.

olaylar:
  - olay: |
      Selim, işyerini 01.01.2019'dan itibaren X Ltd. Şti.'ne kiraya vermiştir. Sözleşmeye göre aylık 40.000 TL kira her ayın 5'inde peşin ödenecektir. X Ltd., Ocak-Haziran 2021 arasındaki altı ayın kirasını ödememiştir.

      10.03.2025'te X Ltd., açıklamasına "Ocak 2021 kirasına mahsuben" yazarak Selim'in hesabına 20.000 TL göndermiş, diğer aylar hakkında hiçbir beyanda bulunmamıştır. Selim 20.02.2026'da noter aracılığıyla ihtarname çekerek altı aylık kira borcunun ödenmesini istemiştir. Ödeme yapılmayınca 16.03.2026'da arabuluculuk bürosuna başvurmuş, taraflar anlaşamamış ve son tutanak 30.03.2026'da düzenlenmiştir. Selim 10.04.2026'da kalan bütün kira alacakları için dava açmıştır. X Ltd. süresinde verdiği cevap dilekçesinde zamanaşımı def'inde bulunmuştur. Arada başka bir ödeme, ikrar ya da takip yoktur.

      1. Kira alacakları hangi zamanaşımı süresine tabidir ve süre her ay için ne zaman başlar?
      2. 10.03.2025 tarihli ödemenin ve 20.02.2026 tarihli ihtarnamenin zamanaşımına etkisi nedir?
      3. Arabuluculuk başvurusu hangi aylar bakımından sonucu etkiler?
      4. Mahkeme hangi alacakları kabul etmelidir? X Ltd., zamanaşımına uğrayan kiraları ileride kendiliğinden öderse geri isteyebilir mi?
    olcut:
      - {tespit: "Kira bedelinin dönemsel edim olarak beş yıllık süreye tabi olduğu ve her ayın kirası için sürenin kendi muacceliyetinden ayrı başladığı", puan: 20, madde: "TBK m. 147"}
      - {tespit: "Ocak 2021 kirasına mahsuben yapılan kısmi ödemenin ikrar olarak yalnız bu alacak için süreyi kestiği ve yeni beş yıllık sürenin başladığı", puan: 20, madde: "TBK m. 154"}
      - {tespit: "Noter ihtarnamesinin zamanaşımını kesmediği", puan: 10, madde: "TBK m. 154"}
      - {tespit: "Şubat ve Mart kiralarında sürenin arabuluculuk başvurusundan önce dolduğu ve dolmuş sürenin durmayla canlanmadığı", puan: 15, madde: "HUAK m. 18/A"}
      - {tespit: "Dava şartı arabuluculuk sürecinde zamanaşımının durduğu, Nisan kirasının bu sayede süresinde dava edildiği; Mayıs ve Haziran kiralarının zaten süresinde olduğu", puan: 20, madde: "HUAK m. 18/A"}
      - {tespit: "Süresinde ileri sürülen def'i üzerine 140.000 TL'nin kabulü, 80.000 TL'nin reddi; zamanaşımına uğramış borç ödenirse geri istenemeyeceği", puan: 15, madde: "TBK m. 78"}
    cozum: |
      **Nitelendirme:** Uyuşmazlık kira sözleşmesinden doğan kira bedeli alacaklarına ilişkindir. Kira bedeli dönemsel bir edimdir ve beş yıllık zamanaşımına tabidir (TBK m. 147/1). X Ltd. def'iyi süresinde cevap dilekçesinde ileri sürdüğü için mahkeme zamanaşımını inceleyecektir (TBK m. 161).

      **Hukuki sorunlar:** Her ay için sürenin başlangıcı; kısmi ödemenin ve ihtarnamenin etkisi; arabuluculuğun durdurucu etkisi; zamanaşımına uğrayan alacağın akıbeti.

      **İlgili hükümler:** TBK m. 147, 149, 151, 154, 156, 161 ve TBK m. 78; HUAK m. 18/A ve HUAK m. 18/B.

      **Değerlendirme:**

      *1. Süre ve başlangıç.* Zamanaşımı alacağın muaccel olmasıyla başlar (TBK m. 149/1). Taraflar ödeme gününü her ayın 5'i olarak kararlaştırdığı için kanundaki ay sonu kuralı (TBK m. 314) uygulanmaz. Her ayın kirası ayrı bir alacaktır ve kendi muacceliyetinden başlayarak ayrı ayrı zamanaşımına uğrar. Başlangıç günü sayılmaz ve süre son gün de geçince dolar (TBK m. 151). Buna göre süreler, hiçbir olay olmasaydı, Ocak kirası için 05.01.2026'da, Şubat için 05.02.2026'da, Mart için 05.03.2026'da, Nisan için Nisan 2026'nın ilk günlerinde, Mayıs için 05.05.2026'da ve Haziran için 05.06.2026'da dolacaktı.

      *2. Ödeme ve ihtarname.* Kısmi ifa borcun ikrarıdır ve zamanaşımını keser (TBK m. 154/1). Ödeme 10.03.2025'te, yani Ocak kirasının süresi dolmadan yapılmıştır. Ödemenin açıklaması yalnız Ocak 2021'e ilişkindir ve diğer aylar için borcun tanındığına dair bir beyan yoktur. Bu nedenle kesilme Ocak kirasının kalan 20.000 TL'si içindir. Yeni süre kesilen sürenin aynısıdır, yani beş yıldır (TBK m. 156/1) ve 10.03.2030'da dolar. Ödeme bir senetle ikrar olmadığı için on yıllık süre uygulanmaz. İhtarname ise TBK m. 154'te sayılmadığından zamanaşımını kesmez. Üstelik Şubat kirasının süresi ihtarnameden önce dolmuştu.

      *3. Arabuluculuk.* Kira ilişkisinden doğan uyuşmazlıkta dava açmadan önce arabulucuya başvurmak dava şartıdır (HUAK m. 18/B). Başvurudan son tutanağın düzenlendiği tarihe kadar zamanaşımı durur (HUAK m. 18/A'nın 15. fıkrası). Durma ancak işlemekte olan bir süreyi etkiler. Şubat ve Mart kiralarının süreleri başvurudan (16.03.2026) önce dolmuştur; arabuluculuk bu süreleri canlandırmaz. Nisan kirası için başvuru anında sürenin dolmasına yaklaşık üç hafta kalmıştır. Süre 16.03-30.03.2026 arasında işlememiş, kalan kısım 30.03.2026 gününün bitiminden itibaren işlemeye devam etmiştir. Bu nedenle süre Nisan 2026'nın ikinci yarısından önce dolmaz ve 10.04.2026'da açılan dava süresindedir. Arabuluculuk olmasaydı Nisan kirası dava tarihinden önce zamanaşımına uğramış olurdu. Mayıs ve Haziran kiralarının süreleri dava tarihinde zaten dolmamıştır. Dava açılmasıyla bu alacaklar için zamanaşımı kesilmiştir (TBK m. 154/2).

      *4. Hüküm ve eksik borç.* Def'i süresinde ileri sürüldüğü için mahkeme zamanaşımına uğramış alacakları reddetmelidir. Zamanaşımına uğrayan alacaklar ortadan kalkmaz, eksik borç olarak kalır. X Ltd. bunları ileride kendiliğinden öderse geri isteyemez (TBK m. 78/2).

      **Sonuç:**
      - Kabul: Ocak 2021 kirasının kalan 20.000 TL'si ile Nisan, Mayıs ve Haziran kiraları (120.000 TL), toplam 140.000 TL.
      - Ret: Şubat ve Mart 2021 kiraları (80.000 TL).
      - İhtarnamenin zamanaşımına etkisi yoktur. Zamanaşımına uğrayan kiralar ödenirse geri istenemez.

  - olay: |
      Kaya Yapı Ltd. Şti., Ahmet ve Burcu'nun ortak yazlık evini onarmayı üstlenmiştir. Sözleşmede Ahmet ve Burcu bedelden müteselsilen sorumlu olduklarını kabul etmişlerdir. Sözleşmenin son maddesinde "Bu sözleşmeden doğan alacaklar on beş yılda zamanaşımına uğrar; iş sahipleri zamanaşımı def'inde bulunmayacaklarını kabul eder" yazmaktadır. Eser 01.07.2019'da teslim edilmiş, 600.000 TL bedelin 200.000 TL'si ödenmemiştir. Kaya Yapı'nın işi ayıplı ya da kusurlu yaptığına ilişkin bir iddia yoktur.

      Ahmet de 2018'de Kaya Yapı'ya 80.000 TL ödünç vermiştir. Ödünç 02.09.2019'da geri ödenecekti, ödenmemiştir.

      Burcu, 01.09.2025'te Kaya Yapı'ya gönderdiği imzalı yazıda "Zamanaşımı süresinin dolduğunu biliyorum, yine de bunu ileri sürmeyeceğim ve borcu ödeyeceğim" demiştir. Ahmet 01.09.2026'da Kaya Yapı'dan 80.000 TL'nin ödenmesini istemiş, Kaya Yapı da 07.09.2026'da Ahmet'e gönderdiği yazıyla bu borcunu eser bedeli alacağıyla takas ettiğini bildirmiştir. Kaya Yapı 21.09.2026'da kalan 120.000 TL için Ahmet ve Burcu'ya dava açmıştır. Ahmet ve Burcu cevap dilekçelerinde zamanaşımı def'inde bulunmuşlardır. Bu tarihler arasında zamanaşımını kesen ya da durduran başka bir olay yoktur.

      1. Kaya Yapı'nın bedel alacağı hangi süreye tabidir ve süre ne zaman dolmuştur?
      2. Sözleşmenin son maddesi geçerli midir?
      3. Burcu'nun yazısının Burcu ve Ahmet bakımından etkisi nedir?
      4. Takas geçerli midir? Mahkeme nasıl karar vermelidir?
    olcut:
      - {tespit: "Yüklenicinin bedel alacağının beş yıllık süreye tabi olduğu, sürenin teslimle başlayıp 01.07.2024'te dolduğu", puan: 20, madde: "TBK m. 147"}
      - {tespit: "On beş yıllık süre kaydının (TBK m. 148) ve def'iden önceden vazgeçme kaydının (TBK m. 160/1) geçersizliği", puan: 20, madde: "TBK m. 148"}
      - {tespit: "Burcu'nun süre dolduktan sonraki açık beyanının geçerli bir feragat olduğu ve dolmuş sürenin kesilemeyeceği", puan: 15, madde: "TBK m. 160"}
      - {tespit: "Feragatin müteselsil borçlu Ahmet'e karşı ileri sürülemeyeceği ve TBK m. 155/1'deki kesilme kuralından farkı", puan: 15, madde: "TBK m. 160"}
      - {tespit: "Takasın, takas edilebileceği anda henüz zamanaşımına uğramamış alacakla geçerli olduğu ve borçların 80.000 TL tutarında sona erdiği", puan: 20, madde: "TBK m. 139"}
      - {tespit: "Ahmet hakkındaki davanın reddi ve Burcu'nun 120.000 TL'den sorumlu tutulması; hâkimin zamanaşımını ancak ileri sürülünce inceleyebilmesi", puan: 10, madde: "TBK m. 161"}
    cozum: |
      **Nitelendirme:** Taraflar arasında bir eser sözleşmesi vardır. Kaya Yapı'nın bedel alacağı eser sözleşmesinden doğar. Ahmet ve Burcu bu borçtan müteselsilen sorumludur. Ahmet'in Kaya Yapı'dan alacağı ise bir ödünç sözleşmesine dayanır.

      **Hukuki sorunlar:** Bedel alacağının süresi; sözleşmeyle süre değiştirme ve önceden feragat; süre dolduktan sonra feragatin müteselsil borçlulara etkisi; zamanaşımına uğramış alacakla takas.

      **İlgili hükümler:** TBK m. 139, 143, 147, 148, 149, 151, 155, 160, 161 ve TBK m. 479.

      **Değerlendirme:**

      *1. Süre.* Eser sözleşmesinden doğan alacaklar beş yıllık zamanaşımına tabidir (TBK m. 147/6). Yüklenicinin ağır kusurlu ifasına ilişkin bir iddia olmadığından istisna uygulanmaz. Bedel eserin teslimiyle muaccel olur (TBK m. 479) ve zamanaşımı bu tarihte başlar (TBK m. 149/1). Teslim 01.07.2019'da gerçekleştiği için süre 01.07.2024 gününün bitiminde dolmuştur (TBK m. 151). Arada kesme ya da durdurma olmamıştır.

      *2. Sözleşmenin son maddesi.* Bu ayırımda belirlenen zamanaşımı süreleri sözleşmeyle değiştirilemez (TBK m. 148). On beş yıllık süre kaydına dayanılamaz; kanundaki beş yıllık süre uygulanır. Zamanaşımından önceden feragat da edilemez (TBK m. 160/1). İş sahiplerinin sözleşme kurulurken def'iden vazgeçmesi geçersizdir. Kaya Yapı bu maddeye dayanarak def'inin dinlenmemesini isteyemez.

      *3. Burcu'nun yazısı.* Yazı 01.09.2025'te, yani süre dolduktan sonra gönderilmiştir. Dolmuş bir süre kesilemeyeceği için yazı zamanaşımını kesmez. Ancak TBK m. 160/1 yalnız önceden feragati yasaklar. Süre dolduktan sonra borçlu doğmuş def'i hakkından vazgeçebilir. Burcu sürenin dolduğunu bildiğini ve buna rağmen zamanaşımını ileri sürmeyeceğini açıkça bildirmiştir. Bu geçerli bir feragattir ve Burcu davada def'iye dayanamaz.

      Feragat Ahmet'i bağlamaz. Müteselsil borçlulardan birinin feragati diğerlerine karşı ileri sürülemez (TBK m. 160/2). Burada TBK m. 155/1 uygulanmaz. O hüküm, işleyen bir sürenin müteselsil borçlulardan birine karşı kesilmesinin hepsini etkilediğini söyler; oysa ortada kesilme değil, dolmuş bir süreden sonra yapılan feragat vardır.

      *4. Takas.* Karşılıklı para borçları, her ikisi muaccel olunca takas edilebilir (TBK m. 139/1). Kaya Yapı'nın alacağı 01.07.2019'da, Ahmet'in ödünç alacağı 02.09.2019'da muaccel olmuştur. Takas edilebilecek an 02.09.2019'dur. Zamanaşımına uğramış bir alacağın takası, takas edilebileceği anda henüz zamanaşımına uğramamış olması koşuluyla ileri sürülebilir (TBK m. 139/3). Kaya Yapı'nın alacağı o tarihte zamanaşımına uğramamıştı. Takas, Kaya Yapı'nın 07.09.2026 tarihli bildirimiyle gerçekleşmiştir. İki borç, takas edilebilecekleri anda, daha az olan borç tutarınca, yani 80.000 TL tutarında sona erer (TBK m. 143). Ahmet'in ödünç alacağı tamamen sona ermiş, Kaya Yapı'nın alacağı 120.000 TL'ye inmiştir.

      **Sonuç:**
      - Bedel alacağı beş yıllık süreye tabidir ve süre 01.07.2024'te dolmuştur. Sözleşmedeki on beş yıl ve önceden feragat kayıtları geçersizdir.
      - Takas geçerlidir. Ahmet'in 80.000 TL'lik alacağı sona ermiş, Kaya Yapı'nın alacağı 120.000 TL'ye inmiştir.
      - Ahmet'in def'i yerindedir ve ona karşı dava reddedilmelidir. Hâkim zamanaşımını ancak ileri sürüldüğü için inceleyebilir (TBK m. 161).
      - Burcu geçerli biçimde feragat ettiği için def'iye dayanamaz. Müteselsil borçlu olarak 120.000 TL'nin tamamından sorumludur.

  - olay: |
      Mimarlık şirketi Çizgi Ltd., otel işletmecisi Y A.Ş.'nin yeni otelinin projesini hazırlamayı üstlenmiştir. Proje 01.03.2022'de teslim edilmiş, 900.000 TL bedel ödenmemiştir. İki taraf da tacirdir ve uyuşmazlık her ikisinin ticari işletmesiyle ilgilidir.

      Çizgi Ltd. 01.02.2027'de arabuluculuk bürosuna başvurmuş, anlaşma sağlanamamış ve son tutanak 12.02.2027'de düzenlenmiştir. Çizgi Ltd. 15.02.2027'de, fazlaya ilişkin hakkını saklı tutarak 300.000 TL için dava açmıştır. Dava dilekçesi 22.02.2027'de Y A.Ş.'ye tebliğ edilmiş; Y A.Ş. cevap dilekçesi vermemiş, ek süre de istememiştir. Y A.Ş. 20.04.2027'de verdiği dilekçede alacağın zamanaşımına uğradığını ileri sürmüş, Çizgi Ltd. buna açıkça karşı çıkmıştır. Y A.Ş. ıslah yoluna başvurmamıştır.

      Çizgi Ltd. 10.06.2027'de HMK m. 109/4'e dayanarak talebini ilk kez 900.000 TL'ye artırmıştır. Y A.Ş., artırılan 600.000 TL için ancak artırım tarihinde başvurulduğunu ve bu kısmın zamanaşımına uğradığını savunmaktadır.

      1. Alacak hangi süreye tabidir? Dava açıldığında süre dolmuş muydu?
      2. Y A.Ş.'nin 20.04.2027 tarihli zamanaşımı savunması dikkate alınabilir mi?
      3. Artırılan 600.000 TL için zamanaşımı savunmasını değerlendiriniz.
      4. Davanın kabulüyle verilecek hüküm kesinleşirse alacak için hangi zamanaşımı süresi işler?
    olcut:
      - {tespit: "Proje bedelinin eser sözleşmesinden doğan alacak olarak beş yıllık süreye tabi olduğu ve sürenin teslimle 01.03.2022'de başladığı", puan: 20, madde: "TBK m. 147"}
      - {tespit: "Dava şartı arabuluculukta başvurudan son tutanağa kadar zamanaşımının durduğu ve 15.02.2027'de açılan davanın dava edilen kısım için süreyi kestiği", puan: 15, madde: "HUAK m. 18/A"}
      - {tespit: "Süresinde cevap vermeyen davalının sonradan ileri sürdüğü def'inin savunmanın genişletilmesi olduğu ve açık muvafakat ya da ıslah yokken dinlenmeyeceği", puan: 25, madde: "HMK m. 141"}
      - {tespit: "Bir defaya mahsus artırımda zamanaşımının artırılan kısım için de dava tarihinden kesilmiş sayılması ve eski uygulamayla farkı", puan: 25, madde: "HMK m. 109"}
      - {tespit: "Hükümden sonra yeni sürenin her zaman on yıl olduğu ve ilamlı takibin son işlemden itibaren on yılda zamanaşımına uğradığı", puan: 15, madde: "TBK m. 156"}
    cozum: |
      **Nitelendirme:** Otel projesinin hazırlanması bir eser sözleşmesidir. Çizgi Ltd.'nin bedel alacağı bu sözleşmeden doğar. Uyuşmazlık iki tacirin ticari işletmesiyle ilgili olduğu için ticari davadır.

      **Hukuki sorunlar:** Sürenin başlangıcı ve arabuluculuğun etkisi; kısmi davanın kesme etkisi; süresinde cevap vermeyen davalının def'i; kısmi davada talebin artırılması; hükümden sonraki yeni süre.

      **İlgili hükümler:** TBK m. 147, 149, 154, 156, 161 ve TBK m. 479; TTK m. 5/A; HUAK m. 18/A; HMK m. 109, 118, 127, 128 ve HMK m. 141; İİK m. 39.

      **Değerlendirme:**

      *1. Süre ve dava tarihi.* Eser sözleşmesinden doğan alacak beş yıllık süreye tabidir (TBK m. 147/6). Bedel teslimle muaccel olur (TBK m. 479). Süre 01.03.2022'de başlamıştır (TBK m. 149/1) ve başka bir olay olmasaydı 01.03.2027'de dolacaktı. Ticari davalarda konusu bir miktar para olan alacak davasında arabulucuya başvurmak dava şartıdır (TTK m. 5/A). Başvurudan son tutanağa kadar, yani 01.02-12.02.2027 arasında zamanaşımı durmuştur (HUAK m. 18/A'nın 15. fıkrası). Dava, dilekçenin kaydedildiği 15.02.2027'de açılmıştır (HMK m. 118) ve süre henüz dolmamıştır. Dava açılması zamanaşımını keser (TBK m. 154/2). Ancak dava kısmi olduğu için kesilme dava edilen 300.000 TL içindir.

      *2. 20.04.2027 tarihli savunma.* Cevap süresi tebliğden itibaren iki haftadır ve 08.03.2027'de dolmuştur (HMK m. 127). Süresinde cevap vermeyen davalı davacının vakıalarını inkâr etmiş sayılır (HMK m. 128). Hukuk Genel Kurulu'na göre bu inkâr zamanaşımı def'ini kapsamaz. Dilekçelerin karşılıklı verilmesinden sonra savunma genişletilemez (HMK m. 141/1). Sonradan ileri sürülen def'i savunmanın genişletilmesidir ve ancak karşı tarafın açık muvafakati ya da ıslah ile mümkündür (HMK m. 141/2). Çizgi Ltd. açıkça karşı çıkmış, Y A.Ş. de ıslah yapmamıştır. Bu nedenle def'i dinlenmez. Hâkim de zamanaşımını kendiliğinden gözetemez (TBK m. 161). Kaldı ki dava edilen 300.000 TL için süre dava tarihinde dolmamıştı.

      *3. Artırılan 600.000 TL.* Eski uygulamaya göre kısmi dava zamanaşımını yalnız dava edilen kısım için keserdi. Saklı tutulan kısım için süre işlemeye devam eder ve arabuluculuktaki durma da hesaba katıldığında Mart 2027 ortasında dolardı. Haziran 2027'deki artırım bu nedenle zamanaşımına takılırdı. 7589 sayılı Kanunla eklenen HMK m. 109/4 bu sonucu değiştirmiştir. Alacağın yalnız bir kısmı dava edilmişse talep aynı davada bir defaya mahsus, iddianın genişletilmesi yasağına tabi olmaksızın tahkikatın sonuna kadar artırılabilir. Bu durumda zamanaşımı artırılan kısım bakımından da dava tarihinden itibaren kesilmiş sayılır. Çizgi Ltd. talebini ilk kez ve bu hükme dayanarak artırmıştır. Artırılan 600.000 TL için zamanaşımı 15.02.2027'de kesilmiş sayılır ve o tarihte süre dolmamıştı. Y A.Ş.'nin savunması yerinde değildir.

      *4. Hükümden sonra.* Dava ya da def'i ile kesilen zamanaşımı, dava süresince tarafların ve hâkimin işlemlerinden sonra yeniden işler (TBK m. 157/1). Borç mahkeme kararına bağlandığında ise yeni süre, kesilen süre beş yıl olsa bile, her zaman on yıldır (TBK m. 156/2). İlama dayanan icra takibi de son işlemden itibaren on yıl geçmekle zamanaşımına uğrar (İİK m. 39).

      **Sonuç:**
      - Alacak beş yıllık süreye tabidir. Dava süresinde açılmıştır.
      - Y A.Ş.'nin 20.04.2027 tarihli def'i, açık muvafakat ve ıslah bulunmadığı için dinlenmez.
      - Artırılan 600.000 TL için de zamanaşımı dava tarihinden kesilmiş sayılır. Zamanaşımı savunması reddedilir.
      - Hüküm kesinleşince alacak için yeni süre on yıldır.

kartlar:
  - on: "Genel zamanaşımı süresi nedir? (TBK m. 146)"
    arka: "Kanunda aksine hüküm yoksa her alacak on yıllık zamanaşımına tabidir."
  - on: "Beş yıllık süreye tabi alacaklar nelerdir? (TBK m. 147)"
    arka: "Kira, anapara faizi, ücret gibi dönemsel edimler; otel ve lokanta bedelleri; küçük sanat ve küçük çaplı perakende; ortaklık; vekâlet, komisyon, acentalık, simsarlık (ticari simsarlık ücreti hariç); eser (yüklenicinin ağır kusurlu ifa etmemesi hariç)."
  - on: "Zamanaşımı süresi sözleşmeyle değiştirilebilir mi?"
    arka: "Hayır. TBK m. 148'e göre bu ayırımdaki süreler ne kısaltılabilir ne uzatılabilir."
  - on: "Zamanaşımı ne zaman başlar? (TBK m. 149)"
    arka: "Alacağın muaccel olmasıyla. Muacceliyet bildirime bağlıysa bildirimin yapılabileceği günden. Alacaklının öğrenmesi aranmaz."
  - on: "Ömür boyu gelirde alacağın tamamı için zamanaşımı ne zaman başlar?"
    arka: "İfa edilmemiş ilk dönemsel edimin muaccel olduğu gün. Tamamı zamanaşımına uğrarsa ödenmemiş taksitler de uğrar (TBK m. 150)."
  - on: "Zamanaşımı süresi nasıl hesaplanır? (TBK m. 151)"
    arka: "Başlangıç günü sayılmaz, süre son gün de hak kullanılmadan geçince dolar. İfa sürelerinin hesabına ilişkin kurallar (TBK m. 92-93) uygulanır."
  - on: "Asıl alacak zamanaşımına uğrarsa faize ne olur?"
    arka: "Faiz ve diğer bağlı alacaklar da zamanaşımına uğrar (TBK m. 152). Faizin zamanaşımı ise asıl alacağı etkilemez."
  - on: "Durma ile kesilme arasındaki fark nedir?"
    arka: "Durmada süre işlemez ve sebep kalkınca kaldığı yerden devam eder. Kesilmede işlemiş süre silinir ve yeni bir süre başlar."
  - on: "TBK m. 153'teki durma sebepleri nelerdir?"
    arka: "Velayet, vesayet, evlilik, ev hizmetlilerinin hizmet ilişkisi, borçlunun alacak üzerindeki intifa hakkı, Türk mahkemelerinde ileri sürme imkânsızlığı, birleşmenin geçmişe etkili olarak kalkması."
  - on: "Arabulucuya başvuru zamanaşımını keser mi?"
    arka: "Kesmez, durdurur. Dava şartı arabuluculukta başvurudan son tutanağa kadar (HUAK m. 18/A), ihtiyari arabuluculukta süreç boyunca (HUAK m. 16/2)."
  - on: "Zamanaşımını kesen sebepler nelerdir? (TBK m. 154)"
    arka: "Borçlunun ikrarı (faiz ödeme, kısmi ifa, rehin verme, kefil gösterme) ve alacaklının dava, def'i, icra takibi ya da iflas masasına başvurusu."
  - on: "Noter ihtarnamesi zamanaşımını keser mi?"
    arka: "Hayır. TBK m. 154 ihtarı saymaz. İhtar temerrüde düşürebilir ama zamanaşımını kesmez."
  - on: "Kesilmenin birlikte borçlulara etkisi nedir? (TBK m. 155)"
    arka: "Müteselsil ya da bölünemez borçta biri için kesilme hepsi için kesilmedir. Asıl borçluya karşı kesilme kefili de etkiler; kefile karşı kesilme asıl borçluyu etkilemez."
  - on: "Kesilmeden sonra yeni süre ne kadardır? (TBK m. 156)"
    arka: "Kural olarak eski sürenin aynısı. Borç senetle ikrar edilmiş ya da mahkeme veya hakem kararına bağlanmışsa her zaman on yıl."
  - on: "İcra dosyasının işlemden kaldırılması zamanaşımını etkiler mi?"
    arka: "Hukuk Genel Kurulu'na göre hayır. Takip derdest kalır, kesme etkisi sürer. Yenileme talebi süreyi yeniden keser (TBK m. 157/2)."
  - on: "TBK m. 158'deki ek süre nedir?"
    arka: "Dava yetkisizlik, görevsizlik, düzeltilebilir yanlışlık ya da erken açılma nedeniyle reddedilip arada süre dolmuşsa altmış gün. Zamanaşımı ve hak düşürücü süre için geçerlidir."
  - on: "Rehinli alacakta zamanaşımı işler mi?"
    arka: "Taşınır rehninde işler ama alacaklı hakkını rehinden alabilir (TBK m. 159). Tapuya tescilli taşınmaz rehninde tescilden sonra işlemez (TMK m. 864)."
  - on: "Zamanaşımından feragat edilebilir mi? (TBK m. 160)"
    arka: "Önceden edilemez. Süre dolduktan sonra edilebilir. Müteselsil borçlulardan birinin ya da asıl borçlunun feragati diğerlerine ve kefile karşı ileri sürülemez."
  - on: "Hâkim zamanaşımını kendiliğinden gözetebilir mi?"
    arka: "Hayır. Zamanaşımı ileri sürülmedikçe hâkim bunu kendiliğinden göz önüne alamaz (TBK m. 161)."
  - on: "Zamanaşımı def'i en geç ne zaman ileri sürülür?"
    arka: "Dilekçeler aşamasının sonuna kadar serbestçe; sonra yalnız açık muvafakat ya da ıslahla (HMK m. 141). Basit yargılamada cevap dilekçesiyle (HMK m. 319)."
  - on: "Kısmi davada talep artırılırsa zamanaşımı ne olur? (HMK m. 109/4)"
    arka: "Talep bir defaya mahsus artırılabilir. Zamanaşımı artırılan kısım bakımından da dava tarihinden itibaren kesilmiş sayılır (7589 sayılı Kanun, 2026)."
  - on: "Zamanaşımına uğramış borç ödenirse geri istenebilir mi?"
    arka: "Hayır. Eksik borçtur; ifasından kaynaklanan zenginleşme geri istenemez (TBK m. 78/2)."
  - on: "Zamanaşımına uğramış alacakla takas yapılabilir mi?"
    arka: "Takas edilebileceği anda henüz zamanaşımına uğramamışsa evet (TBK m. 139/3)."
