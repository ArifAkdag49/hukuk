  - id: "84197700"
    ozet: |
      Merkezi İzmir'de bulunan davacı şirket, yolcu transferini üstlendiği sözleşmenin haksız feshedildiğini ileri sürerek kazanç kaybı, masraf ve manevi tazminat olarak 100.000 TL istemiş ve davayı İzmir'de açmıştır. Merkezi Bodrum'daki davalının yetki itirazı üzerine mahkeme yetkisizlik kararı vermiş, Özel Daire bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu çoğunluğu direnme kararını bozmuştur. Gerekçeye göre özel yetki genel yetkiyi kaldırmaz ve davacı ikisi arasında seçim yapar. İfa yeri kararlaştırılmamışsa para borcu alacaklının ödeme zamanındaki yerleşim yerinde ödenir; mülga Borçlar Kanunu'nun 73. maddesindeki bu kural TBK m. 89'da da vardır. Feshe dayanan tazminat da para alacağı olduğundan alacaklı, ifa yeri mahkemesinin yetkisine (bugün HMK m. 10) dayanarak kendi yerleşim yerinde dava açabilir ve orada icra takibi de başlatabilir (İİK m. 50). Karşı oy, her tazminatı para borcu saymanın genel yetki kuralını istisnaya çevireceğini ve kuralın verilen paranın geri ödenmesi gibi borçlarla sınırlı tutulması gerektiğini savunmuştur. Konuya katkısı: TBK m. 89 ile HMK m. 10'un birlikte nasıl uygulandığını gösterir.
  - id: "862074900"
    ozet: |
      Davacılar, davalının yapacağı binadan bir daireyi 65.000 TL'ye almak için satış vaadi sözleşmesi yapmıştır. Bedelin son taksiti 05.08.2010'da, yani 31.01.2011 olan teslim tarihinden önce ödenecekti. Davacılar bedelin 5.000 TL'lik kısmını ödemeden, geç teslim nedeniyle kira kaybı ve sözleşmedeki tazminat için başlattıkları takibe yapılan itirazın iptalini istemiştir. İlk derece mahkemesi, edimini tam ifa etmeyen alıcının karşı edimi isteyemeyeceği gerekçesiyle davayı reddetmiş, Özel Daire bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu çoğunluğuna göre satışta edimler kural olarak aynı anda ifa edilir; alıcı teslimden önce ödemekle yükümlü olduğundan satıcı ödemezlik def'ini ileri sürebilir. Ancak satıcı, kalan bedel için 26.08.2011 tarihli yeni bir senet alarak alıcıya yeni bir ödeme imkânı tanımış ve yeni bir teslim tarihi belirlenmemiştir; bu yüzden satıcının en geç bu tarihte teslim etmesi gerektiği kabul edilerek direnme kararı değişik gerekçeyle bozulmuştur. Karşı oy, kalan bedeli ödemeyen ve ödemeyi önermeyen alıcının TBK m. 97 gereği tazminat isteyemeyeceğini savunmuştur. Konuya katkısı: önce ifa yükümlüsünün def'iye karşı korunmadığını, ama alacaklının sonraki davranışının ifa sırasını etkileyebileceğini gösterir.
  - id: "1219186400"
    ozet: |
      Davacı, yapımı süren bir binadaki bağımsız bölümü yükleniciden 740.000 TL'ye satın almış ve 190.000 TL ödemiştir; kalan bedel teslimde ödenecekti. Bağımsız bölüm teslim edilmeyince davacı, 550.000 TL'lik bakiyeyi depo etmeye hazır olduğunu bildirerek tapu iptali ve tescil ile gecikme tazminatı istemiştir. İlk derece mahkemesi davayı reddetmiş, bölge adliye mahkemesi de alıcının bütün borcunu ödemediği ve teslimin gerçekleşmediği gerekçesiyle istinaf başvurusunu esastan reddetmiştir. Yargıtay 7. Hukuk Dairesi bu kararları kaldırıp bozmuştur. Gerekçeye göre taraflardan birinin önce ifa yükümlülüğü yoksa edimler TBK m. 97 uyarınca aynı anda ifa edilir; bağımsız bölüm davalılar adına kayıtlı olduğundan inşaatın aşaması önemli değildir. Mahkeme, taşınmazın dava tarihindeki rayiç değerini ve ödenen miktarın sözleşme bedeline oranını belirlemeli, rayiç değer üzerinden kalan orana düşen bedeli depo etmesi için davacıya süre vermeli ve bedel depo edilirse tescile karar vermelidir. Konuya katkısı: def'inin davadaki sonucunun ret değil, birlikte ifa kuralına göre karşılıklı ifaya hüküm olduğunu gösterir.

sorular:
  - soru: |
      Taraflar arasında aksine bir anlaşma yoksa **para borcu** nerede ödenir?
    siklar:
      - "Borçlunun, borcun doğduğu sıradaki yerleşim yerinde"
      - "Alacaklının, ödeme zamanındaki yerleşim yerinde"
      - "Sözleşmenin kurulduğu yerde"
      - "Alacaklının, borcun doğduğu sıradaki yerleşim yerinde"
    dogru: 1
    aciklama: |
      TBK m. 89/1-1'e göre para borçları, alacaklının **ödeme zamanındaki** yerleşim yerinde ödenir. Bu yüzden para borcu götürülecek borçtur. Belirleyici an borcun doğduğu an değil, ödeme anıdır. Borçlunun yerleşim yerine ilişkin kural (m. 89/1-3) para ve parça borçları dışındaki borçlar içindir. Sözleşmenin kurulduğu yer yedek kurallarda ölçüt değildir.

  - soru: |
      Ankara'da oturan Kemal, İzmir'deki yazlığının garajında duran klasik otomobilini, İstanbul'da imzalanan bir sözleşmeyle Bursa'da oturan Cem'e satar. Sözleşmede teslim yeri yoktur. Kemal bir hafta sonra otomobili Ankara'ya getirir. Otomobil nerede teslim edilmelidir?
    siklar:
      - "Ankara'da, çünkü borçlunun yerleşim yeridir"
      - "İstanbul'da, çünkü sözleşme orada kurulmuştur"
      - "İzmir'de, çünkü sözleşme kurulduğu sırada otomobil oradadır"
      - "Bursa'da, çünkü alıcının yerleşim yeridir"
    dogru: 2
    aciklama: |
      Belirli bir otomobilin teslimi bir **parça borcudur**. TBK m. 89/1-2'ye göre parça borcu, sözleşmenin kurulduğu sırada borç konusunun bulunduğu yerde ifa edilir. Otomobilin sonradan Ankara'ya götürülmesi ifa yerini değiştirmez. Borçlunun yerleşim yeri kuralı parça borçlarına uygulanmaz. Sözleşmenin kurulduğu yer ve alıcının yerleşim yeri de bu borç için ölçüt değildir.

  - soru: |
      Konya'da oturan değirmenci Hasan, mart ayında Kayseri'deki bir fırına 200 çuval un satar. Teslim yeri kararlaştırılmamıştır. Hasan nisan ayında yerleşim yerini Eskişehir'e taşır. Un nerede teslim edilmelidir?
    siklar:
      - "Konya'da"
      - "Eskişehir'de"
      - "Kayseri'de"
      - "Taraflar yeniden anlaşmadıkça hiçbir yerde, sözleşme askıya alınır"
    dogru: 0
    aciklama: |
      Un, türü ve miktarıyla belirlenmiş bir **cins borcudur**. TBK m. 89/1-3'e göre para ve parça borçları dışındaki borçlar, **doğdukları sırada** borçlunun yerleşim yerinde ifa edilir. Borç doğarken Hasan Konya'da oturmaktadır. Sonradan Eskişehir'e taşınması ifa yerini değiştirmez. Alacaklının yerleşim yeri ise para borçları için ölçüttür.

  - soru: |
      Alacaklının yerleşim yerinde ifası gereken bir borç doğduktan sonra alacaklı başka bir şehre taşınmış ve bu yüzden ifa önemli ölçüde güçleşmiştir. TBK m. 89/2'ye göre hangisi doğrudur?
    siklar:
      - "Borç kendiliğinden sona erer."
      - "Borçlu, borcu alacaklının önceki yerleşim yerinde ifa edebilir."
      - "Borçlu, ancak alacaklı taşıma masraflarını önceden öderse ifa etmek zorundadır."
      - "İfa yeri kendiliğinden borçlunun yerleşim yerine dönüşür."
    dogru: 1
    aciklama: |
      TBK m. 89/2'ye göre alacaklının yerleşim yerinde ifası gereken bir borcun doğumundan sonra alacaklının taşınması yüzünden ifa önemli ölçüde güçleşmişse borç, alacaklının **önceki** yerleşim yerinde ifa edilebilir. Bu, borçluya tanınmış bir imkândır. Borç sona ermez, ifa yeri de kendiliğinden borçlunun yerleşim yerine dönüşmez.

  - soru: |
      İzmir'de oturan Elif, Ankara'da oturan Murat'a 300.000 TL'ye bir tekne satar ve tekneyi teslim eder. Bedel ödenmez. Elif bedel için İzmir'de dava açar. Murat cevap dilekçesinde, Ankara mahkemelerini göstererek yetki itirazında bulunur. Yetki itirazı hakkında hangisi doğrudur?
    siklar:
      - "Genel yetkili mahkeme davalının yerleşim yeri mahkemesi olduğu için itiraz kabul edilmelidir."
      - "Para borcunun ifa yeri alacaklının yerleşim yeri olduğundan İzmir mahkemesi de yetkilidir, itiraz reddedilmelidir."
      - "İzmir mahkemesi ancak taraflar yazılı bir yetki sözleşmesi yapmışsa yetkili olur."
      - "Yetki kesin olduğundan mahkeme, itiraz olmasa da dosyayı Ankara'ya göndermelidir."
    dogru: 1
    aciklama: |
      Genel yetkili mahkeme davalının yerleşim yeri mahkemesidir (HMK m. 6). Ama sözleşmeden doğan davalar, sözleşmenin ifa edileceği yer mahkemesinde de açılabilir (HMK m. 10). Bedel borcu bir para borcudur ve alacaklının yerleşim yerinde ödenir (TBK m. 89/1-1). Yargıtay'ın yerleşik uygulamasına göre alacaklı bu yüzden kendi yerleşim yerinde dava açabilir. Yetki sözleşmesine gerek yoktur. Bu yetki kesin de değildir.

  - soru: |
      Ayşe 1 Mart'ta arkadaşı Burak'a 50.000 TL ödünç verir. Geri ödeme için belirli bir gün, bildirim süresi ya da istem üzerine ödeneceği kararlaştırılmamıştır. Ayşe 10 Mart'ta parasını ister. Hangisi doğrudur?
    siklar:
      - "Her borç doğumuyla muaccel olduğundan Burak parayı 10 Mart'ta hemen geri vermek zorundadır."
      - "Burak, ilk istemden itibaren altı hafta geçmedikçe parayı geri vermek zorunda değildir."
      - "Burak, ancak ödünç tarihinden itibaren bir yıl geçince geri vermek zorundadır."
      - "Geri ödeme zamanı kararlaştırılmadığı için ödünç sözleşmesi geçersizdir."
    dogru: 1
    aciklama: |
      TBK m. 90'daki hemen ifa kuralı, kanunun özel hükümleri saklı kalmak üzere uygulanır. Ödünçte geri verme için gün, bildirim süresi ya da istem anında muacceliyet kararlaştırılmamışsa ödünç alan, **ilk istemden itibaren altı hafta** geçmedikçe geri vermekle yükümlü değildir (TBK m. 392). Zamanın kararlaştırılmamış olması sözleşmeyi geçersiz kılmaz.

  - soru: |
      Bir borcun "haziran 2026'da" ödeneceği kararlaştırılmış, gün belirtilmemiştir. TBK m. 91'e göre borcun ifa zamanı hangi gündür?
    siklar:
      - "1 Haziran 2026"
      - "15 Haziran 2026"
      - "30 Haziran 2026"
      - "Alacaklının bildireceği gün"
    dogru: 2
    aciklama: |
      TBK m. 91/2'ye göre borcun ifası için gün belirtilmeden yalnız ay belirlenmişse o ayın **son günü** anlaşılır. Ayın başlangıcı denmiş olsaydı 1'i, ortası denmiş olsaydı 15'i anlaşılırdı (m. 91/1).

  - soru: |
      Sözleşme 1 Haziran 2026 Pazartesi günü kurulmuş ve malın "15 gün içinde" teslimi kararlaştırılmıştır. Süre hangi gün dolar?
    siklar:
      - "15 Haziran 2026 Pazartesi"
      - "16 Haziran 2026 Salı"
      - "14 Haziran 2026 Pazar"
      - "17 Haziran 2026 Çarşamba"
    dogru: 1
    aciklama: |
      TBK m. 92/1-1'e göre gün olarak belirlenen sürede sözleşmenin kurulduğu gün sayılmaz ve süre son günün bitiminde dolar. Kanun ayrıca "on beş gün"ün iki haftayı değil, **tam on beş günü** ifade ettiğini söyler. Bu yüzden süre 16 Haziran'da dolar. "İki hafta" denseydi süre, son haftanın sözleşmenin kurulduğu günle aynı adı taşıyan gününde, yani 15 Haziran Pazartesi dolardı (m. 92/1-2).

  - soru: |
      31 Mart 2026'da kurulan bir sözleşmede bedelin "bir ay sonra" ödenmesi kararlaştırılmıştır. Ödeme günü hangisidir?
    siklar:
      - "30 Nisan 2026"
      - "1 Mayıs 2026"
      - "2 Mayıs 2026"
      - "29 Nisan 2026"
    dogru: 0
    aciklama: |
      TBK m. 92/1-3'e göre ay olarak belirlenen süre, son ayda sözleşmenin kurulduğu güne karşılık gelen günde dolar. Nisan ayında 31. gün yoktur. Kanuna göre bu durumda süre o ayın son günü, yani 30 Nisan'da dolar. Süre bir sonraki aya taşmaz.

  - soru: |
      Bir borcun son ifa günü, Cumhuriyet Bayramı olan 29 Ekim 2026 Perşembe günüdür. Sözleşmede bu konuda bir hüküm yoktur. Hangisi doğrudur?
    siklar:
      - "Borçlu en geç bir gün önce ifa etmek zorundadır."
      - "Son gün kendiliğinden, tatil olmayan ilk gün olan 30 Ekim 2026 Cuma gününe geçer."
      - "Son gün ancak alacaklı kabul ederse ertelenir."
      - "Süre kendiliğinden bir hafta uzar."
    dogru: 1
    aciklama: |
      TBK m. 93/1'e göre ifa zamanı ya da sürenin son günü kanunlarda tatil olarak kabul edilen bir güne rastlarsa, **kendiliğinden** bu günü izleyen ve tatil olmayan ilk güne geçer. Bunun için alacaklının kabulü gerekmez. Taraflar aksini kararlaştırabilir (m. 93/2), ama olayda böyle bir hüküm yoktur.

  - soru: |
      Zehra'nın 1 Aralık'ta ödemesi gereken 100.000 TL borcu vardır. Sözleşmede erken ödemeye ilişkin bir hüküm yoktur, bu konuda bir âdet de bulunmamaktadır. Zehra 1 Eylül'de 97.000 TL ödeyerek "üç ay erken ödediğim için indirim hakkımdır" der. Hangisi doğrudur?
    siklar:
      - "Erken ifa yasak olduğundan ödeme geçersizdir."
      - "Zehra erken ifa edebilir, ama erken ödediği için indirim yapamaz; 3.000 TL için borcu devam eder."
      - "Zehra kanuni faiz oranında indirim yapmaya yetkilidir."
      - "Alacaklı ödemeyi aldığı anda borcun tamamı sona erer."
    dogru: 1
    aciklama: |
      TBK m. 96'ya göre tarafların aksini kastettiği anlaşılmadıkça borçlu, edimini süre dolmadan ifa edebilir. Ancak kanun, sözleşme ya da âdet gereği değilse borçlu, erken ifa ettiği için indirim yapamaz. Olayda indirimi haklı kılan böyle bir dayanak yoktur. Kanunun indirim öngördüğü bir örnek, konut finansmanında erken ödemedir (TKHK m. 37).

  - soru: |
      Ödemezlik def'i (TBK m. 97) aşağıdaki sözleşmelerin hangisinde **ileri sürülemez**?
    siklar:
      - "Satış"
      - "Kira"
      - "Eser"
      - "Bağışlama"
    dogru: 3
    aciklama: |
      TBK m. 97, **karşılıklı borç yükleyen** sözleşmelere ilişkindir. Satış, kira ve eser sözleşmelerinde her tarafın edimi diğerinin karşılığıdır. Bağışlama ise yalnız bağışlayana borç yükler. Bağışlanan bir karşı edim borçlanmadığı için geri tutulacak bir karşılık da yoktur.

  - soru: |
      Melis, Okan'dan bir piyanoyu 120.000 TL'ye satın alır. Teslim ve ödeme için 5 Mayıs kararlaştırılmış, ifa sırası konusunda başka bir hüküm konulmamıştır. Okan piyanoyu teslim etmeden ve teslimi önermeden bedel için dava açar. Melis cevap dilekçesinde, piyano teslim edilmedikçe ödemeyeceğini bildirir. Hangisi doğrudur?
    siklar:
      - "Alıcı her zaman önce ödemek zorunda olduğundan Melis'in savunması dinlenmez."
      - "Satıcı ve alıcı borçlarını aynı anda ifa edeceğinden Melis, piyano teslim edilmedikçe ya da teslimi gereği gibi önerilmedikçe ödemekten kaçınabilir."
      - "Melis'in savunması bir takas beyanı olduğundan bedel borcu sona ermiştir."
      - "Melis'in savunmasıyla Okan sözleşmeden dönmüş sayılır."
    dogru: 1
    aciklama: |
      Sözleşme ya da âdet aksini öngörmedikçe satıcı ve alıcı borçlarını aynı anda ifa eder (TBK m. 207/2). Karşılıklı borç yükleyen sözleşmenin ifasını isteyen taraf, sonra ifa etme hakkı yoksa kendi borcunu ifa etmiş ya da ifasını önermiş olmalıdır (TBK m. 97). Okan bunu yapmadığı için Melis'in savunması bir ödemezlik def'idir ve yerindedir. Def'i borcu sona erdirmez, dolayısıyla takas değildir. Sözleşmeden dönme sonucu da doğurmaz.

  - soru: |
      Kiraya veren Yusuf, daireyi teslim etmeden kiracı Ece'den ilk ayın kirasını ister ve ödenmezse daireyi teslim etmeyeceğini söyler. Sözleşmede kiranın ödeme zamanına ilişkin bir hüküm yoktur, bir yerel âdet de bulunmamaktadır. Hangisi doğrudur?
    siklar:
      - "Kira sözleşmesinde ödemezlik def'i uygulanmadığından Ece önce ödemek zorundadır."
      - "Kira bedeli ay sonunda ödeneceğinden Ece'nin borcu henüz muaccel değildir; Yusuf önce daireyi teslim etmelidir."
      - "Kira bedeli sözleşmenin kurulduğu anda muaccel olduğundan Yusuf teslimden kaçınabilir."
      - "Edimler aynı anda ifa edileceğinden Ece ilk ayın kirasını teslim anında ödemelidir."
    dogru: 1
    aciklama: |
      Kiracı, aksine sözleşme ve yerel âdet yoksa kira bedelini her ayın sonunda öder (TBK m. 314). Bu özel kural, borcun doğumuyla muaccel olacağına ilişkin genel kuralın (TBK m. 90) önüne geçer. Böylece kiraya veren önce ifa eder. Ece'nin TBK m. 97 anlamında sonra ifa etme hakkı vardır. Yusuf, kendi edimini ifa etmeden kirayı isteyemez ve teslimden de kaçınamaz.

  - soru: |
      Ödemezlik def'inin hukuki niteliği hakkında baskın görüşe göre hangisi doğrudur?
    siklar:
      - "Borcu sona erdiren bir sebeptir; ileri sürülünce karşı edim borcu ortadan kalkar."
      - "Geciktirici bir def'idir; davalı ileri sürmedikçe hâkim kendiliğinden dikkate almaz."
      - "Bir dava şartıdır; hâkim yargılamanın her aşamasında kendiliğinden gözetir."
      - "Yalnız noter ihtarnamesiyle ileri sürülebilir, davada ileri sürülemez."
    dogru: 1
    aciklama: |
      Ödemezlik def'i borcu sona erdirmez. Karşı taraf ifa edene ya da ifayı önerene kadar kendi edimini geri tutma imkânı verir. Bu yüzden geciktirici bir def'idir. Baskın görüşe göre gerçek bir def'idir ve davalı tarafından ileri sürülmelidir. Davalının def'inin adını koyması gerekmez. Def'i davada da dava dışında da ileri sürülebilir. Kanun lafzına dayanarak hâkimin bunu kendiliğinden gözetmesi gerektiğini savunan bir görüş de vardır (bkz. doktrin).

  - soru: |
      Burcu, yükleniciden bir daire satın almış ve bedelin bir kısmını ödemiştir. Kalan bedelin tapuda devir ve teslim sırasında ödenmesi kararlaştırılmıştır. Daire yüklenici adına kayıtlıdır ve yüklenici devirden kaçınmaktadır. Burcu, kalan bedeli depo etmeye hazır olduğunu bildirerek tapu iptali ve tescil davası açar. Yüklenici kalan bedelin ödenmediğini savunur. Yargıtay'ın yerleşik uygulamasına göre mahkeme nasıl hareket etmelidir?
    siklar:
      - "Kalan bedel ödenmediği için davayı reddetmelidir."
      - "Burcu'ya kalan bedeli depo etmesi için süre vermeli, bedel depo edilirse tescile karar vermelidir."
      - "Kalan bedele bakmaksızın koşulsuz tescile karar vermelidir."
      - "Sözleşmeyi kendiliğinden sona erdirmeli ve ödenen bedelin iadesine hükmetmelidir."
    dogru: 1
    aciklama: |
      Taraflardan birinin önce ifa yükümlülüğü yoksa edimler aynı anda ifa edilir (TBK m. 97). Yüklenicinin savunması bir ödemezlik def'idir. Yargıtay bu durumda davayı reddetmez. Birlikte ifa kuralı gereği davacıya kalan bedeli depo etmesi için süre verilmesini, bedel depo edilirse tescile karar verilmesini ister. Yargıtay bir kararında, kalan bedelin taşınmazın dava tarihindeki rayiç değeri üzerinden orantılı olarak belirlenmesini de aramıştır. Koşulsuz tescil, yüklenicinin def'isini görmezden gelmek olur.

  - soru: |
      X A.Ş., Y Ltd. Şti. adlı şirkete bir makine satmıştır. Makine 1 Haziran'da teslim edilecek, bedel ise teslimden 90 gün sonra ödenecektir. Mayıs ayında Y Ltd. Şti. hakkındaki hacizlerin sonuçsuz kaldığı ortaya çıkar. X A.Ş. ne yapabilir?
    siklar:
      - "Edimler aynı anda ifa edileceğinden ödemezlik def'iyle teslimden kaçınabilir."
      - "Bedel için güvence verilinceye kadar teslimden kaçınabilir; güvence uygun sürede verilmezse sözleşmeden dönebilir."
      - "Önce ifa yükümlüsü olduğu için makineyi her durumda 1 Haziran'da teslim etmek zorundadır."
      - "Y Ltd. Şti. temerrüde düştüğü için süre vermeden hemen tazminat isteyebilir."
    dogru: 1
    aciklama: |
      Sözleşmeye göre X A.Ş. önce ifa yükümlüsüdür. Bu yüzden TBK m. 97'ye dayanamaz. Ancak karşı tarafın hakkındaki haciz işleminin sonuçsuz kalması bir ifa güçsüzlüğüdür ve X A.Ş.'nin bedel alacağını tehlikeye düşürür. TBK m. 98/1'e göre X A.Ş., karşı edim güvence altına alınıncaya kadar kendi ediminin ifasından kaçınabilir. İstediği güvence uygun bir sürede verilmezse sözleşmeden dönebilir (m. 98/2). Bedel henüz muaccel olmadığı için Y Ltd. Şti. temerrüde düşmemiştir.

  - soru: |
      Ödemezlik def'ini takastan ayıran özellik hangisidir?
    siklar:
      - "Ödemezlik def'i, karşılıklı borçların aynı türden olmasını gerektirir ve borçları sona erdirir."
      - "Ödemezlik def'i borcu sona erdirmez, yalnız ifadan geçici olarak kaçınma imkânı verir; takas ise karşılıklı ve muaccel para ya da özdeş edim borçlarını sona erdirir."
      - "Takas yalnız karşılıklı borç yükleyen sözleşmelerde, ödemezlik def'i ise her borç ilişkisinde ileri sürülebilir."
      - "Takas yalnız yapma borçlarında, ödemezlik def'i ise yalnız para borçlarında ileri sürülebilir."
    dogru: 1
    aciklama: |
      Takas, karşılıklı olarak bir miktar para ya da özdeş edim borçlu olan ve iki borcu da muaccel olan kişilerin alacaklarını borçlarıyla takas etmesidir (TBK m. 139). Takas borçları sona erdirir ve borçların kaynağının karşılıklı bir sözleşme olmasını aramaz. Ödemezlik def'i ise yalnız karşılıklı borç yükleyen sözleşmelerde ileri sürülür, edimlerin aynı türden olmasını aramaz ve hiçbir borcu sona erdirmez (TBK m. 97).

  - soru: |
      Kerim, bir yükleniciden yapılmakta olan binadaki bir dükkânı satın almıştır. Sözleşmeye göre bedelin son taksiti bu yıl 1 Eylül'de ödenecek, dükkân ise gelecek yıl 30 Eylül'de teslim edilecektir. Kerim son taksiti ödemeden, dükkânın geç teslim edildiğini ileri sürerek gecikme tazminatı ister. Yüklenici cevap dilekçesinde ödemezlik def'ine dayanır. Hangisi doğrudur?
    siklar:
      - "Edimler her durumda aynı anda ifa edileceğinden yüklenicinin savunması dinlenmez."
      - "Kerim önce ifa yükümlüsü olduğundan ve son taksiti ödemediğinden def'i yerindedir; yüklenici temerrüde düşmediği için tazminat istemi reddedilir."
      - "Yüklenici, Kerim'in borcunu takas ettiği için tazminat borcundan kurtulur."
      - "Def'i ancak dava açılmadan önce noter ihtarnamesiyle bildirilmişse dikkate alınır."
    dogru: 1
    aciklama: |
      Aynı anda ifa kuralının istisnası, sözleşmeden doğan önce ifa yükümlülüğüdür. Olayda son taksitin teslimden önce ödenmesi kararlaştırılmıştır. Kerim önce ifa yükümlüsüdür ve kendi edimini ifa etmeden karşı edimi isteyemez (TBK m. 97). Def'i hakkına dayanan yüklenici temerrüde düşmez. Bu yüzden gecikme tazminatı istemi reddedilir. Def'i cevap dilekçesinde de ileri sürülebilir. Takas ise borcu sona erdiren ayrı bir kurumdur.

  - soru: |
      Satış bedelini dava eden satıcıya karşı alıcı ödemezlik def'ini ileri sürmüştür. Satıcı, malı teslim ettiğini iddia etmektedir. Teslimin ispatı kime düşer?
    siklar:
      - "Alıcıya; çünkü def'iyi ileri süren, karşı tarafın ifa etmediğini ispatlamak zorundadır."
      - "Satıcıya; çünkü ifayı isteyen taraf, kendi edimini ifa ettiğini ya da önerdiğini ispatlar."
      - "Hiç kimseye; hâkim teslimin yapılıp yapılmadığını kendiliğinden araştırır."
      - "Hiç kimseye; def'i ileri sürülünce dava kendiliğinden reddedilir."
    dogru: 1
    aciklama: |
      Taraflardan her biri, hakkını dayandırdığı olguların varlığını ispatla yükümlüdür (TMK m. 6). TBK m. 97'ye göre ifa isteyen taraf, kendi borcunu ifa etmiş ya da ifasını önermiş olmalıdır. Bu yüzden def'i ileri sürüldüğünde teslimi ispatlamak satıcıya düşer. Uygulamada da ödemezlik def'inde ispat yükünün ifayı isteyen davacıda olduğu kabul edilir. Def'inin ileri sürülmesi davayı kendiliğinden sona erdirmez; önce davacının ifa ya da öneri iddiası incelenir.

olaylar:
  - olay: |
      Bursa'da oturan antikacı Selim, 3 Mart 2026'da İstanbul'daki bir antika fuarında, Ankara'da oturan Gizem'e 19. yüzyıldan kalma bir yazı masasını 400.000 TL'ye satar. Sözleşme kurulduğu sırada masa, Selim'in Eskişehir'deki deposundadır. Yazılı sözleşmede yalnız "Masa 15 gün içinde teslim edilecektir." hükmü vardır. Teslim ve ödeme yeri ile bedelin ödeme zamanı hakkında bir hüküm yoktur.

      Selim bir hafta sonra masayı Bursa'daki dükkânına taşır. 17 Mart'ta Gizem'e bir mesaj göndererek masanın yalnız Bursa'daki dükkânında ve ancak bedelin tamamı önceden hesabına yatırılırsa teslim edileceğini bildirir. Gizem ise masanın Eskişehir'de, bedel karşılığında teslim edilmesini ister. Taraflar anlaşamaz. Gizem ödeme yapmaz, Selim de masayı teslim etmez.

      Selim, nisan ayında Bursa'da Gizem aleyhine 400.000 TL satış bedelinin ödenmesi davası açar. Gizem cevap dilekçesinde, Ankara mahkemelerini yetkili mahkeme olarak göstererek yetki itirazında bulunur. Ayrıca masa kendisine teslim edilmedikçe bedeli ödemeyeceğini savunur.

      1. Masanın teslim borcu ve bedel borcu nerede ifa edilmelidir?
      2. On beş günlük teslim süresi hangi gün dolmuştur? Selim'in 17 Mart'taki önerisi gereği gibi bir ifa önerisi midir?
      3. Gizem'in yetki itirazını değerlendiriniz.
      4. Gizem'in savunmasının niteliğini ve mahkemenin nasıl karar vermesi gerektiğini açıklayınız.
    olcut:
      - {tespit: "Antika masanın parça borcu olduğu, sözleşme kurulduğu sırada bulunduğu Eskişehir'de teslim edileceği ve sonradan taşınmasının ifa yerini değiştirmediği", puan: 20, madde: "TBK m. 89"}
      - {tespit: "Bedel borcunun para borcu olarak alacaklı Selim'in ödeme zamanındaki yerleşim yeri olan Bursa'da ödeneceği; her edimin ifa yerinin ayrı belirlendiği", puan: 15, madde: "TBK m. 89"}
      - {tespit: "Sözleşmenin kurulduğu gün sayılmadan on beş günlük sürenin 18 Mart 2026'da dolduğu", puan: 10, madde: "TBK m. 92"}
      - {tespit: "Satışta edimlerin aynı anda ifa edileceği; Bursa'da ve önceden ödeme şartıyla yapılan önerinin gereği gibi bir öneri olmadığı", puan: 15, madde: "TBK m. 207"}
      - {tespit: "Genel yetkili Ankara mahkemesinin yanında, para borcunun ifa yeri olan Bursa mahkemesinin de yetkili olduğu ve itirazın reddedileceği", puan: 20, madde: "HMK m. 10"}
      - {tespit: "Gizem'in savunmasının ödemezlik def'i olarak nitelendirilmesi, şartlarının gerçekleşmesi ve davanın koşulsuz kabul edilemeyeceği (ağırlıklı görüşe göre karşılıklı ifaya hüküm)", puan: 20, madde: "TBK m. 97"}
    cozum: |
      **Nitelendirme:** Taraflar arasında bir taşınır satış sözleşmesi vardır. Satış, tam iki tarafa borç yükleyen bir sözleşmedir. Selim'in borcu masanın zilyetliğini ve mülkiyetini devretmek, Gizem'in borcu 400.000 TL bedeli ödemektir. Her borcun ifa yeri ve zamanı ayrı ayrı belirlenir.

      **Hukuki sorunlar:** (1) Teslim ve bedel borçlarının ifa yeri, (2) teslim süresinin hesabı ve Selim'in önerisinin niteliği, (3) yetkili mahkeme, (4) Gizem'in savunması ve hükmün içeriği.

      **İlgili hükümler:** TBK m. 89, 92, 97 ve 207/2; HMK m. 6, 10 ve 19.

      **Değerlendirme:**

      *1. İfa yerleri.* Sözleşmede ifa yeri hükmü yoktur, işin niteliğinden de örtülü bir irade çıkmamaktadır. Bu yüzden TBK m. 89/1'in yedek kuralları uygulanır. Antika masa, ferdî olarak belirlenmiş bir şeydir. Teslim borcu bir **parça borcudur** ve sözleşmenin kurulduğu sırada masanın bulunduğu Eskişehir'deki depoda ifa edilir (m. 89/1-2). Selim'in masayı sonradan Bursa'ya taşıması ifa yerini değiştirmez. Gizem masayı almak için Bursa'ya gitmek zorunda değildir. Bedel borcu ise bir **para borcudur**. Alacaklı Selim'in ödeme zamanındaki yerleşim yeri olan Bursa'da ödenir (m. 89/1-1). Gizem parayı Selim'e götürmekle, örneğin hesabına göndermekle yükümlüdür. Sözleşmenin İstanbul'da kurulmuş olması ifa yerini etkilemez.

      *2. Süre ve öneri.* Sözleşmenin kurulduğu 3 Mart günü sayılmaz. "On beş gün" iki hafta değil, tam on beş gündür. Süre 18 Mart 2026'da dolmuştur (m. 92/1-1). Selim'in 17 Mart'taki mesajı süre içindedir, ama gereği gibi bir öneri değildir. Birincisi, teslimi ifa yeri olmayan Bursa'da önermiştir. İkincisi, teslimi bedelin önceden ödenmesine bağlamıştır. Oysa sözleşme ya da âdet aksini öngörmedikçe satıcı ve alıcı borçlarını **aynı anda** ifa eder (TBK m. 207/2). Selim önceden ödeme isteyemez. Bu yüzden Gizem'in bu öneriyi reddetmesi onu alacaklı temerrüdüne düşürmez (ayrıntısı ayrı konuda).

      *3. Yetki.* Genel yetkili mahkeme, davalı Gizem'in yerleşim yeri olan Ankara mahkemesidir (HMK m. 6). Ancak dava sözleşmeden doğmuştur ve konusu bir para alacağıdır. Bu alacağın ifa yeri Bursa olduğu için Bursa mahkemesi de HMK m. 10 uyarınca yetkilidir. Yargıtay'ın yerleşik uygulaması da para alacaklarında alacaklının kendi yerleşim yerinde dava açabileceği yönündedir. Bu özel yetki genel yetkiyi kaldırmaz, davacıya seçim imkânı verir. Selim seçimini Bursa'dan yana yapmıştır. Gizem itirazını cevap dilekçesinde ve yetkili mahkemeyi göstererek usulüne uygun yapmıştır (HMK m. 19/2). Ama itiraz esasen yerinde olmadığından reddedilmelidir.

      *4. Savunmanın niteliği ve hüküm.* Gizem, karşı taraf kendi edimini ifa etmedikçe kendisinin de ifa etmeyeceğini söylemektedir. Bu bir **ödemezlik def'idir** (TBK m. 97). Şartlar gerçekleşmiştir: sözleşme karşılıklı borç yükler, teslim ile bedel karşılıklılık ilişkisi içindedir, Gizem önce ifa yükümlüsü değildir ve Selim kendi edimini ne ifa etmiş ne de gereği gibi önermiştir. Gizem def'iyi cevap dilekçesinde ileri sürmüştür. Bu yüzden dava koşulsuz kabul edilemez. Def'i borcu sona erdirmediği için Selim'in bedel alacağı da varlığını korur. Öğretide ağırlıklı görüş ve Yargıtay'ın birlikte ifa kuralı, böyle bir durumda karşılıklı ifaya hükmedilmesi yönündedir: Gizem, masanın Eskişehir'de teslimi karşılığında 400.000 TL ödemeye mahkûm edilir. Davanın şimdilik reddedilmesi gerektiğini savunan görüş için doktrin bölümüne bakılabilir.

      **Sonuç:**
      - Masa Eskişehir'de teslim edilmeli, bedel Bursa'da ödenmelidir.
      - Teslim süresi 18 Mart 2026'da dolmuştur. Selim'in önerisi, yer ve ödeme şartı yönünden gereği gibi değildir.
      - Bursa mahkemesi yetkilidir, yetki itirazı reddedilmelidir.
      - Gizem'in ödemezlik def'i yerindedir. Mahkeme bedele koşulsuz hükmedemez. Ağırlıklı görüşe göre masanın teslimi karşılığında ödemeye hükmetmelidir.

  - olay: |
      Ahmet, kendi arsasına bir depo binası yaptırmak için 2 Mart 2026'da X İnşaat Ltd. Şti. ile 3.000.000 TL bedelli bir eser sözleşmesi yapar. Sözleşmeye göre Ahmet 1.000.000 TL'lik ilk ödemeyi 23 Nisan 2026'da yapacak, X İnşaat ödemeyi izleyen ilk iş günü işe başlayacaktır. Bina 30 Ekim 2026'da teslim edilecek, kalan 2.000.000 TL teslimde ödenecektir.

      Ahmet 15 Nisan'da X İnşaat'a ihtarname göndererek hemen işe başlanmasını, aksi hâlde gecikme tazminatı isteyeceğini bildirir. X İnşaat, ödeme yapılmadan işe başlamayacağını yanıtlar.

      Ahmet ilk ödemeyi 24 Nisan 2026 Cuma günü yapar. X İnşaat, ödemenin 23 Nisan'da yapılması gerektiğini ve bir gün geciktiği için temerrüt faizi isteyeceğini bildirir. Ardından 27 Nisan'da işe başlar.

      Temmuz ayında X İnşaat, başka alacaklıların haziranda Ahmet hakkında yaptırdığı haciz işlemlerinin sonuçsuz kaldığını öğrenir. X İnşaat işi durdurur ve Ahmet'ten kalan 2.000.000 TL için on beş gün içinde banka teminat mektubu ister. Ahmet güvence vermez. Üstelik X İnşaat'ın işi bıraktığını, bu yüzden temerrüde düştüğünü ve kendisinden tazminat isteyeceğini bildirir.

      1. Ahmet'in 15 Nisan tarihli ihtarnamesinin hukuki sonucunu değerlendiriniz.
      2. X İnşaat'ın temerrüt faizi talebi yerinde midir?
      3. X İnşaat işi durdurmakta haklı mıdır?
      4. Güvence verilmezse X İnşaat ne yapabilir? Ahmet'in tazminat talebi yerinde midir?
    olcut:
      - {tespit: "X İnşaat'ın işe başlama borcunun sözleşme gereği ilk ödemeye bağlı olduğu, 15 Nisan'da muaccel olmadığı ve ihtarın temerrüt doğurmadığı", puan: 20, madde: "TBK m. 117"}
      - {tespit: "İlk ödeme bakımından Ahmet'in önce ifa yükümlüsü olduğu ve X İnşaat'ın ödeme yapılmadan işe başlamamakta haklı olduğu", puan: 15, madde: "TBK m. 97"}
      - {tespit: "Ödeme gününün resmî tatile rastlaması nedeniyle kendiliğinden 24 Nisan'a geçtiği ve temerrüt faizi talebinin yersiz olduğu", puan: 15, madde: "TBK m. 93"}
      - {tespit: "Kalan bedelin teslimde ödeneceği; bu yüzden X İnşaat'ın kalan iş bakımından önce ifa yükümlüsü olduğu ve ödemezlik def'ine dayanamayacağı", puan: 10, madde: "TBK m. 479"}
      - {tespit: "Haciz işlemlerinin sonuçsuz kalmasının ifa güçsüzlüğü olduğu ve X İnşaat'ın güvence verilinceye kadar işi durdurabileceği", puan: 20, madde: "TBK m. 98"}
      - {tespit: "Güvence uygun sürede verilmezse X İnşaat'ın sözleşmeden dönebileceği; işi haklı olarak durduran X İnşaat'ın temerrüde düşmediği", puan: 20, madde: "TBK m. 98"}
    cozum: |
      **Nitelendirme:** Ahmet ile X İnşaat arasında bir eser sözleşmesi vardır. Eser sözleşmesi tam iki tarafa borç yükler. X İnşaat binayı yapıp teslim etmeyi, Ahmet bedeli ödemeyi üstlenmiştir. Taraflar bedelin bir kısmının işe başlamadan önce, kalanının teslimde ödenmesini kararlaştırmıştır. Bu kararlaştırma, ifa sırasını belirler.

      **Hukuki sorunlar:** (1) Muaccel olmayan bir borç için çekilen ihtarın sonucu, (2) ödeme gününün tatile rastlaması, (3) önce ifa yükümlüsü yüklenicinin karşı tarafın güçsüzlüğü karşısındaki hakları, (4) dönme ve Ahmet'in temerrüt iddiası.

      **İlgili hükümler:** TBK m. 90, 93, 97, 98, 117 ve 479.

      **Değerlendirme:**

      *1. 15 Nisan ihtarı.* Taraflar ifa zamanını kararlaştırdığı için hemen ifa kuralı (TBK m. 90) uygulanmaz. X İnşaat'ın işe başlama borcu, ilk ödemeyi izleyen iş gününe bağlanmıştır. 15 Nisan'da ödeme yapılmamış olduğundan bu borç henüz muaccel değildir. TBK m. 117/1'e göre temerrüt için **muaccel** bir borç ve ihtar gerekir. Muaccel olmayan bir borç için çekilen ihtar temerrüt doğurmaz. Ayrıca ilk ödeme bakımından Ahmet önce ifa yükümlüsüdür. X İnşaat'ın, sözleşmenin koşullarına göre sonra ifa etme hakkı vardır (TBK m. 97). Ahmet kendi edimini ifa etmeden X İnşaat'tan işe başlamasını isteyemez. Gecikme tazminatı istemi bu dönem için yersizdir.

      *2. Temerrüt faizi.* Ödeme günü olan 23 Nisan 2026, Ulusal Egemenlik ve Çocuk Bayramı'dır. TBK m. 93/1'e göre ifa zamanı kanunda tatil kabul edilen bir güne rastlarsa kendiliğinden izleyen ve tatil olmayan ilk güne geçer. Sözleşmede aksine bir hüküm yoktur. Ödeme günü 24 Nisan Cuma gününe geçmiştir. Ahmet o gün ödediği için temerrüde düşmemiştir. Temerrüt faizi talebi yersizdir.

      *3. İşin durdurulması.* Kalan 2.000.000 TL teslimde ödenecektir. Eser sözleşmesinde bedel zaten eserin teslimi anında muaccel olur (TBK m. 479/1). Demek ki kalan iş bakımından X İnşaat önce ifa yükümlüsüdür ve TBK m. 97'ye dayanamaz. Ancak başka alacaklıların Ahmet hakkında yaptırdığı haciz işlemleri sonuçsuz kalmıştır. Bu, TBK m. 98'de özellikle sayılan bir **ifa güçsüzlüğüdür**. Güçsüzlük sözleşmeden sonra ortaya çıkmıştır ve X İnşaat'ın teslimde alacağı 2.000.000 TL'yi açıkça tehlikeye düşürür. X İnşaat, karşı edim güvence altına alınıncaya kadar kendi ediminin ifasından kaçınabilir (m. 98/1). İşi durdurması haklıdır.

      *4. Dönme ve Ahmet'in iddiası.* X İnşaat güvence istemiş ve on beş günlük bir süre vermiştir. Bu süre, teminat mektubu almak için makul görünmektedir. Güvence uygun sürede verilmezse X İnşaat sözleşmeden dönebilir (m. 98/2). Bunun için Ahmet'in temerrüde düşmüş olması gerekmez. Dönmenin sonuçları, yani ödenen 1.000.000 TL ile yapılan işin tasfiyesi, dönmeye ilişkin genel kurallara göre çözülür. Ahmet'in temerrüt iddiası ise yersizdir. X İnşaat işi kanunun tanıdığı bir hakka dayanarak durdurmuştur. Hukuka uygun biçimde ifadan kaçınan taraf, bu yüzden temerrüde düşmez. Temerrüt hâlindeki seçimlik haklar ayrı bir konudur.

      **Sonuç:**
      - 15 Nisan ihtarı, muaccel olmayan bir borç için çekildiğinden ve Ahmet önce ifa yükümlüsü olduğundan temerrüt doğurmaz.
      - Ödeme günü tatil nedeniyle 24 Nisan'a geçmiştir. Temerrüt faizi istenemez.
      - X İnşaat, TBK m. 98/1'e göre güvence verilinceye kadar işi durdurmakta haklıdır.
      - Güvence uygun sürede verilmezse sözleşmeden dönebilir. Ahmet'in temerrüde dayalı tazminat talebi yerinde değildir.

  - olay: |
      Zeynep, Y Yapı A.Ş.'nin İstanbul'da tamamladığı bir binadan daire almak için 12 Ocak 2026'da noterde düzenleme şeklinde bir taşınmaz satış vaadi sözleşmesi yapar. Bedel 5.000.000 TL'dir. Zeynep 4.000.000 TL'yi sözleşme günü öder. Sözleşmeye göre kalan 1.000.000 TL, dairenin tapuda devri ve teslimi sırasında tapu müdürlüğünde ödenecek, devir ve teslim 1 Haziran 2026'da yapılacaktır. Binada kat mülkiyeti kurulmuştur ve daire Y Yapı A.Ş. adına kayıtlıdır.

      Y Yapı A.Ş. 1 Haziran'da devir için tapu müdürlüğüne başvurmaz. Zeynep aynı gün noter aracılığıyla bir ihtarname gönderir. Kalan 1.000.000 TL'yi banka hesabında hazır tuttuğunu, 10 Haziran'da tapu müdürlüğünde ödemeye hazır olduğunu bildirir ve o gün için devir randevusu alır. Y Yapı A.Ş. tapu müdürlüğüne gelmez.

      Zeynep 1 Temmuz'da tapu iptali ve tescil davası açar. Dairenin teslim edilmemesi yüzünden yoksun kaldığı kira geliri için gecikme tazminatı da ister. Y Yapı A.Ş. cevap dilekçesinde, Zeynep'in kalan bedeli henüz ödemediğini, parayı önce şirketin İstanbul'daki merkezine ödemesi gerektiğini ve ödeme yapılmadıkça devir yapmayacağını savunur.

      1. Kalan bedelin ifa yerini ve zamanını belirleyiniz.
      2. Y Yapı A.Ş.'nin savunmasını değerlendiriniz. Zeynep neyi ispatlamalıdır?
      3. Mahkeme tescil istemi hakkında nasıl karar vermelidir?
      4. Gecikme tazminatı istemi bakımından Y Yapı A.Ş.'nin durumu nedir?
    olcut:
      - {tespit: "Kalan bedelin ifa yerinin taraf iradesiyle tapu müdürlüğü olarak belirlendiği ve alacaklının yerleşim yerine ilişkin yedek kuralın uygulanmayacağı", puan: 15, madde: "TBK m. 89"}
      - {tespit: "Sözleşmeye göre edimlerin devir ve teslimle birlikte, aynı anda ifa edileceği ve Zeynep'in önce ifa yükümlüsü olmadığı", puan: 15, madde: "TBK m. 97"}
      - {tespit: "Zeynep'in ihtarname, hazır tutulan bedel ve alınan randevuyla gereği gibi ifa önerisinde bulunduğu; bu yüzden ödemezlik def'inin yerinde olmadığı", puan: 20, madde: "TBK m. 97"}
      - {tespit: "İfa önerisinin ispat yükünün Zeynep'te olduğu ve belgelerle ispatlanabileceği", puan: 10, madde: "TMK m. 6"}
      - {tespit: "Önerinin kalan borcu sona erdirmediği; birlikte ifa kuralı gereği kalan bedelin depo ettirilmesi ve depo edilince tescile karar verilmesi", puan: 25, madde: "TBK m. 97"}
      - {tespit: "Y Yapı A.Ş.'nin en geç 10 Haziran'dan itibaren def'iye dayanamayacağı, temerrüde düştüğü ve gecikme tazminatı isteminin bu çerçevede inceleneceği", puan: 15, madde: "TBK m. 117"}
    cozum: |
      **Nitelendirme:** Taraflar arasında noterde düzenleme şeklinde yapılmış, geçerli bir taşınmaz satış vaadi sözleşmesi vardır. Sözleşme iki tarafa da borç yükler: Y Yapı A.Ş. daireyi devretmeyi ve teslim etmeyi, Zeynep bedeli ödemeyi üstlenmiştir. Bedelin 4.000.000 TL'si ödenmiş, 1.000.000 TL'si devir ve teslime bırakılmıştır.

      **Hukuki sorunlar:** (1) Kalan bedelin ifa yeri ve zamanı, (2) ödemezlik def'inin ve ifa önerisinin etkisi, ispat yükü, (3) tescil davasında hükmün içeriği, (4) satıcının temerrüdü.

      **İlgili hükümler:** TBK m. 89, 97 ve 117; TMK m. 6.

      **Değerlendirme:**

      *1. İfa yeri ve zamanı.* TBK m. 89/1'e göre ifa yeri önce tarafların açık ya da örtülü iradesine göre belirlenir. Kanunun yedek kuralları, ancak böyle bir irade yoksa uygulanır. Taraflar kalan bedelin tapu müdürlüğünde, devir ve teslim sırasında ödeneceğini açıkça kararlaştırmıştır. Bu yüzden para borcunun alacaklının yerleşim yerinde ödeneceğine ilişkin yedek kural (m. 89/1-1) uygulanmaz. Y Yapı A.Ş., paranın önce şirket merkezine ödenmesini isteyemez. İfa zamanı da sözleşmeyle belirlenmiştir: devir ve teslim günü olan 1 Haziran 2026.

      *2. Savunma ve ispat.* Sözleşmeye göre edimler aynı anda, devir ve teslimle birlikte ifa edilecektir. Zeynep önce ifa yükümlüsü değildir. TBK m. 97'ye göre ifa isteyen taraf, kendi borcunu ifa etmiş **ya da ifasını önermiş** olmalıdır. Zeynep ihtarnameyle ödemeye hazır olduğunu bildirmiş, parayı hesabında hazır tutmuş ve sözleşmedeki ifa yerinde ödeme için randevu almıştır. Bu, doğru yerde, doğru zamanda ve eksiksiz yapılmış, gereği gibi bir ifa önerisidir. Y Yapı A.Ş. randevuya gelmeyerek öneriyi sonuçsuz bırakmıştır. Bu yüzden ödemezlik def'i yerinde değildir. Zeynep, önerisini ispatlamakla yükümlüdür (TMK m. 6). İhtarname, banka kayıtları ve tapu randevusu bunun delilleridir.

      *3. Tescil istemi.* İfa önerisi, Zeynep'in kalan 1.000.000 TL borcunu sona erdirmez. Öneri yalnız karşı tarafın def'iye dayanmasını engeller. Edimlerin aynı anda ifası kuralı davada da korunur. Yargıtay'ın yerleşik uygulamasına göre mahkeme, Zeynep'e kalan bedeli depo etmesi için süre verir. Bedel depo edilirse tapu kaydının iptaline ve dairenin Zeynep adına tesciline karar verilir. Depo edilen para satıcıya ödenir. Böylece hiçbir taraf karşılığını almadan kendi edimini ifa etmiş olmaz. Yargıtay bir kararında kalan bedelin dava tarihindeki rayiç değere göre orantılı olarak belirlenmesini de aramıştır. Olayda sözleşme ile dava arasında yalnız birkaç ay vardır ve bu ayrıntı çözümün özünü değiştirmez.

      *4. Gecikme tazminatı.* Y Yapı A.Ş.'nin devir ve teslim borcu 1 Haziran'da muacceldir. Zeynep 1 Haziran'da ihtar çekmiş ve kendi edimini 10 Haziran için gereği gibi önermiştir. Y Yapı A.Ş., en geç 10 Haziran'dan itibaren def'iye dayanamaz ve temerrüde düşmüştür (TBK m. 117). Zeynep, gecikme yüzünden yoksun kaldığı kira gelirini ve zararın miktarını ispatlarsa gecikme tazminatı isteyebilir. Tazminatın şartları ve kapsamı borçlu temerrüdü konusunda ayrıca incelenir.

      **Sonuç:**
      - Kalan bedel, taraf iradesine göre tapu müdürlüğünde ve devirle birlikte ödenecektir. Şirket merkezine önceden ödeme gerekmez.
      - Zeynep gereği gibi ifa önerisinde bulunduğu için Y Yapı A.Ş.'nin ödemezlik def'i yerinde değildir. Öneriyi ispat yükü Zeynep'tedir.
      - Mahkeme kalan bedeli depo ettirir ve depo edilince tescile karar verir.
      - Y Yapı A.Ş. en geç 10 Haziran'dan itibaren temerrüttedir. Gecikme tazminatı istemi bu çerçevede incelenir.

kartlar:
  - on: "Para borcu nerede ödenir? (TBK m. 89/1-1)"
    arka: "Aksine anlaşma yoksa alacaklının ödeme zamanındaki yerleşim yerinde. Para borcu götürülecek borçtur."
  - on: "Parça borcunun ifa yeri neresidir?"
    arka: "Sözleşme kurulduğu sırada borç konusunun bulunduğu yer (TBK m. 89/1-2). Malın sonradan taşınması bunu değiştirmez."
  - on: "Para ve parça borcu dışındaki borçlar nerede ifa edilir?"
    arka: "Borcun doğduğu sırada borçlunun yerleşim yerinde (TBK m. 89/1-3). Bunlar aranacak borçtur."
  - on: "İfa yerine ilişkin kanuni kurallar ne zaman uygulanır?"
    arka: "Taraflar açık ya da örtülü bir irade ortaya koymamışsa. Bu kurallar yedek niteliktedir (TBK m. 89/1)."
  - on: "Alacaklı taşınırsa borçlu ne yapabilir? (TBK m. 89/2)"
    arka: "İfa bu yüzden önemli ölçüde güçleşmişse borcu alacaklının önceki yerleşim yerinde ifa edebilir."
  - on: "Sözleşmeden doğan para alacağında alacaklı kendi yerleşim yerinde dava açabilir mi?"
    arka: "Evet. HMK m. 10 ifa yeri mahkemesini de yetkili kılar, para borcunun ifa yeri de alacaklının yerleşim yeridir. Davalının yerleşim yeri mahkemesi de yetkili kalır (HMK m. 6)."
  - on: "Yetki itirazı ne zaman ve nasıl yapılır? (HMK m. 19)"
    arka: "Kesin olmayan yetkide cevap dilekçesinde ve yetkili mahkeme gösterilerek. Süresinde itiraz edilmezse davanın açıldığı mahkeme yetkili hâle gelir."
  - on: "Haksız fiil davasını zarar görenin yerleşim yerinde açmanın dayanağı nedir?"
    arka: "HMK m. 16. HMK m. 10 yalnız sözleşmeden doğan davalar içindir."
  - on: "Borç ne zaman muaccel olur? (TBK m. 90)"
    arka: "Taraflar kararlaştırmamışsa ve hukuki ilişkinin özelliğinden aksi anlaşılmıyorsa borcun doğduğu anda."
  - on: "Geri verme zamanı kararlaştırılmamış ödünç ne zaman geri verilir?"
    arka: "Ödünç alan, ilk istemden itibaren altı hafta geçmedikçe geri vermek zorunda değildir (TBK m. 392)."
  - on: "Ayın ortası ve sonu, yalnız ay belirtilmesi (TBK m. 91)?"
    arka: "Ayın ortası 15'i, sonu son günüdür. Yalnız ay belirtilmişse o ayın son günü anlaşılır."
  - on: "Gün olarak belirlenen sürede sözleşme günü sayılır mı? (TBK m. 92)"
    arka: "Hayır, sözleşmenin kurulduğu gün sayılmaz. On beş gün iki hafta değil, tam on beş gündür."
  - on: "Ay olarak belirlenen sürede son ayda karşılık gelen gün yoksa?"
    arka: "Süre o ayın son günü dolar (TBK m. 92/1-3). Örneğin 31 Mart'tan itibaren bir aylık süre 30 Nisan'da dolar."
  - on: "Son gün resmî tatile rastlarsa ne olur? (TBK m. 93)"
    arka: "Kendiliğinden izleyen ve tatil olmayan ilk güne geçer. Aksine anlaşma geçerlidir."
  - on: "Uzatılan süre ne zaman başlar? (TBK m. 95)"
    arka: "Aksi kararlaştırılmadıkça önceki sürenin sona ermesini izleyen ilk günden."
  - on: "Erken ödeyen borçlu indirim yapabilir mi? (TBK m. 96)"
    arka: "Hayır; kanun, sözleşme ya da âdet gereği değilse. Kanun gereği örnek: konut finansmanında erken ödeme indirimi (TKHK m. 37)."
  - on: "Ödemezlik def'inin şartları nelerdir? (TBK m. 97)"
    arka: "Karşılıklı borç yükleyen sözleşme, karşılıklı edimler, def'i ileri sürenin önce ifa yükümlüsü olmaması, ifa isteyenin kendi edimini ifa etmemesi ve gereği gibi önermemesi."
  - on: "Ödemezlik def'i borcu sona erdirir mi?"
    arka: "Hayır. Geciktirici bir def'idir, yalnız ifadan geçici olarak kaçınma imkânı verir. Baskın görüşe göre hâkim bunu kendiliğinden dikkate almaz."
  - on: "Def'i yerindeyse davada ne olur?"
    arka: "Ağırlıklı görüşe göre dava reddedilmez, karşılıklı ifaya hükmedilir. Tescil davasında Yargıtay kalan bedeli depo ettirir ve depo edilince tescile karar verir."
  - on: "Kirada ve eserde önce kim ifa eder?"
    arka: "Kirada kiraya veren, çünkü kira ay sonunda ödenir (TBK m. 314). Eserde yüklenici, çünkü bedel teslim anında muaccel olur (TBK m. 479)."
  - on: "TBK m. 98 hangi hakları verir?"
    arka: "Karşı taraf iflas eder ya da hakkındaki haciz sonuçsuz kalırsa güvence verilinceye kadar kendi edimini ifa etmeme. Güvence uygun sürede verilmezse sözleşmeden dönme."
  - on: "Ödemezlik def'i ile hapis hakkı arasındaki fark nedir?"
    arka: "Def'ide kişi kendi edimini geri tutar ve borç yalnız ertelenir. Hapis hakkında borçlunun taşınırı elde tutulur ve gerekirse paraya çevrilebilir (TMK m. 950, 953)."
