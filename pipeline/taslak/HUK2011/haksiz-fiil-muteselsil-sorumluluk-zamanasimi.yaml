    ozet: |
      Hazine, kum ve çakıl ocağını iki belediyeye kiralamış; belediyeler sözleşmeye aykırı olarak ocakları davalı şirkete devretmiş, şirket de izin verilenden fazla malzeme çıkarmıştır. Hazine, belediyelere sözleşmeye dayalı ayrı davalar açmanın yanında şirkete de haksız fiile dayanarak dava açmıştır. Yerel mahkeme, aynı zarar için belediyeler aleyhine hüküm kurulduğunu belirterek davayı mükerrer saymış ve Yargıtay 4. Hukuk Dairesinin bozma kararına karşı direnmiştir. Hukuk Genel Kurulu oy birliğiyle direnme kararını bozmuştur: müteselsil sorumluluk haksız fiil, sözleşme ve kanun gibi farklı sebeplere dayanabilir ve zarar gören, zararı tamamen giderilinceye kadar dilediği sorumluya başvurabilir. Sorumlulardan birini dava etmek, hatta mahkûm ettirmek diğerlerini kurtarmaz; kurtaran yalnız ifadır. Belediyeler aleyhine verilen kararlar kesinleşmemiş ve zarar tazmin edilmemiş olduğundan hüküm tahsilde tekerrür oluşturmamak kaydıyla kurulmalıdır; iç ilişkide ise teselsül değil pay esası geçerlidir. Konuya katkısı: aynı zarardan çeşitli sebeplerle sorumluluğu ve tek zarar, tek tazminat ilkesini gösterir.
