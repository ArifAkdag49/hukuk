  - id: "520427600"
    ozet: |
      Davalı şirkete ait ve diğer davalı sürücünün kullandığı kamyonet, kontrolsüz biçimde aniden yola çıkan bir yayaya çarpmış, yaya ölmüş ve yakınları tazminat istemiştir. Ceza davasında sürücü, cezalandırılmasına yeterli kesin ve inandırıcı delil elde edilemediği gerekçesiyle beraat etmiş; ceza dosyasındaki raporlardan biri sürücüyü tali kusurlu, Adli Tıp Kurumu raporu ise kusursuz bulmuştur. Hukuk mahkemesi sürücüyü %25 kusurlu bulan rapora dayanmış ve Yargıtay 17. Hukuk Dairesinin bozma kararına karşı direnmiştir. Hukuk Genel Kurulu oy birliğiyle direnme kararını bozmuştur: beraat kararı, kusur ve derecesi, zarar tutarı ve ceza dosyasındaki kusur raporu hukuk hâkimini bağlamaz; buna karşılık olayın varlığına ve sanık tarafından işlendiğine ilişkin kesinleşmiş saptamalar bağlar ve beraat, suçun sanık tarafından işlenmediğinin kesin tespitine dayanıyorsa bağlayıcıdır. Ceza mahkemesi bir tarafın kusurlu olduğunu maddi olgu olarak kabul etmişse hukuk hâkimi onu kusursuz sayamaz, ama kusur oranını yeniden inceleyebilir. Raporlar çeliştiği ve hükme esas rapor ceza dosyasındaki raporları neden benimsemediğini açıklamadığı için uzman bir bilirkişi kurulundan ayrıntılı ve denetime elverişli yeni rapor alınmalıdır. Kurul eski Kanunun aynı içerikteki hükmünü uygulamıştır. Konuya katkısı: TBK m. 74'teki bağımsızlığın sınırını, yani maddi olgu ile kusur oranı ayrımını gösterir.

sorular:
  - soru: |
      TBK m. 61'e göre müteselsil sorumluluk hükümleri hangi durumda uygulanır?
    siklar:
      - "Birden çok kişi bir zarara birlikte sebep olmuşsa ya da aynı zarardan çeşitli sebeplerle sorumluysa"
      - "Yalnız birden çok kişi aynı zarara kasten ve birlikte sebep olmuşsa"
      - "Yalnız sorumlular kendi aralarında teselsül anlaşması yapmışsa"
      - "Bir kişinin sorumluluğu birden çok sebebe dayanıyorsa"
    dogru: 0
    aciklama: |
      TBK m. 61 iki hâli sayar: birden çok kişinin birlikte zarar vermesi ve aynı zarardan çeşitli sebeplerle sorumluluk. Kast şartı yoktur. Teselsül burada kanundan doğduğu için ayrıca anlaşma gerekmez (TBK m. 162/2). Tek kişinin birden çok sebeple sorumluluğu ise TBK m. 60'ın konusudur.

  - soru: |
      Kerem ve Ozan'ın kusurlarıyla çarpışan araçlardan biri kaldırımdaki Zeynep'i yaralar. Zeynep'in zararı 900.000 TL'dir; bilirkişiye göre Kerem %70, Ozan %30 kusurludur. Zeynep davayı yalnız Ozan'a karşı açar. Hangisi doğrudur?
    siklar:
      - "Ozan yalnız 270.000 TL'den sorumludur, çünkü kusuru %30'dur."
      - "Zeynep 900.000 TL'nin tamamını Ozan'dan isteyebilir; kusur oranları iç ilişkide önem taşır."
      - "Zeynep önce Kerem'e başvurmak zorundadır, çünkü ağır kusurlu odur."
      - "Kerem de davalı gösterilmediği için dava reddedilir."
    dogru: 1
    aciklama: |
      Birlikte zarar verenlere müteselsil sorumluluk hükümleri uygulanır (TBK m. 61). Zarar gören borcun tamamını dilediği sorumludan isteyebilir (TBK m. 163/1). Kusur oranları zarar görene karşı ileri sürülemez, iç ilişkide paylaştırmada dikkate alınır (TBK m. 62/1). Önce ağır kusurluya başvurma zorunluluğu ya da bütün sorumluları birlikte dava etme şartı yoktur.

  - soru: |
      Ali ve Veli'nin kusurlarıyla yaralanan Can'ın zararı 1.000.000 TL'dir. Hâkim, Can'ın kendi dikkatsizliği zararın doğmasında etkili olduğu için tazminattan %20 indirim yapmıştır. Can, Ali'den en fazla ne kadar isteyebilir?
    siklar:
      - "1.000.000 TL"
      - "800.000 TL"
      - "400.000 TL"
      - "Ali'nin kusur oranına düşen tutar kadar"
    dogru: 1
    aciklama: |
      Zarar görenin kendi kusuru tazminatın indirilmesine yol açabilir (TBK m. 52). İndirimden sonra kalan 800.000 TL'den sorumlular dış ilişkide müteselsilen sorumludur (TBK m. 61). Can bu tutarın tamamını Ali'den isteyebilir. Tutar ne yarıya bölünür ne de Ali'nin kusur payıyla sınırlanır; paylar iç ilişkinin konusudur.

  - soru: |
      Müteselsil sorumlulardan biri zarar görene ödeme yaparsa bu ödeme dış ilişkide hangi sonucu doğurur?
    siklar:
      - "Ödediği oranda diğer sorumluları da zarar görene karşı borçtan kurtarır."
      - "Yalnız ödeyeni kurtarır; diğerleri zararın tamamından sorumlu kalır."
      - "Diğerlerini ancak zarar gören bunu açıkça kabul ederse kurtarır."
      - "Hiçbir etki doğurmaz; zarar gören herkesten tamamını yeniden tahsil edebilir."
    dogru: 0
    aciklama: |
      TBK m. 166/1'e göre borçlulardan biri ifa veya takasla borcu sona erdirdiği oranda diğerlerini de borçtan kurtarır. Haksız fiilde zarar bir kez tazmin edilir. Bu yüzden ayrı davalarda verilen hükümler tahsilde tekerrür olmamak kaydıyla kurulur; aksi zarar görenin zenginleşmesine yol açar.

  - soru: |
      Hazine, aynı zarar için sözleşmeye aykırılık nedeniyle bir belediye aleyhine hüküm almış ama henüz tahsil edememiştir. Zarara haksız fiiliyle yol açan şirkete de dava açar. Şirket "Hazine aynı zarar için belediye aleyhine hüküm aldı, bu dava mükerrerdir" diye savunur. Hangisi doğrudur?
    siklar:
      - "Savunma yerindedir; sorumlulardan biri aleyhine hüküm alınması diğerlerini kurtarır."
      - "Savunma yerinde değildir; diğer sorumluları kurtaran mahkûmiyet değil ifadır. Hüküm tahsilde tekerrür olmamak kaydıyla kurulur."
      - "Savunma yerinde değildir; Hazine iki sorumludan da zararın tamamını ayrı ayrı tahsil edebilir."
      - "Şirket sözleşmenin tarafı olmadığı için hiçbir şekilde sorumlu tutulamaz."
    dogru: 1
    aciklama: |
      Aynı zarardan çeşitli sebeplerle sorumlu olanlara müteselsil sorumluluk hükümleri uygulanır (TBK m. 61). Sorumluların hepsi borç tamamen ödeninceye kadar sorumludur (TBK m. 163/2); birini dava etmek ya da mahkûm ettirmek diğerlerini kurtarmaz. Zarar bir kez tazmin edileceği için iki kez tahsil mümkün değildir; hüküm tahsilde tekerrür olmamak kaydıyla kurulur. Şirketin sorumluluğu sözleşmeye değil haksız fiile dayanır.

  - soru: |
      TBK m. 62/1'e göre tazminatın müteselsil sorumlular arasında paylaştırılmasında özellikle hangileri göz önünde tutulur?
    siklar:
      - "Sorumluların ekonomik güçleri ve yaşları"
      - "Her birine yüklenebilecek kusurun ağırlığı ve yarattıkları tehlikenin yoğunluğu"
      - "Zarar görenin hangi sorumluyu dava ettiği"
      - "Yalnız sorumluların sayısı; paylar her durumda eşittir"
    dogru: 1
    aciklama: |
      TBK m. 62/1 bütün durum ve koşulları, özellikle kusurun ağırlığını ve tehlikenin yoğunluğunu ölçüt yapar. Zarar görenin kime dava açtığı iç ilişkiyi belirlemez. Haksız fiilde paylar, genel hükümdeki eşit pay kuralına (TBK m. 167/1) göre belirlenmez.

  - soru: |
      Aynı zarardan müteselsilen sorumlu olan Arda ile Berk'in iç ilişkideki paylarını hâkim Arda için %60, Berk için %40 olarak belirlemiştir. Berk, zarar görene 500.000 TL'nin tamamını ödemiştir. Berk, Arda'dan ne kadar isteyebilir?
    siklar:
      - "200.000 TL"
      - "250.000 TL"
      - "300.000 TL"
      - "500.000 TL"
    dogru: 2
    aciklama: |
      Berk'in iç ilişkideki payı 200.000 TL'dir. Payından fazla ödediği 300.000 TL için Arda'ya rücu eder ve bu oranda zarar görenin haklarına halef olur (TBK m. 62/2). Kendi payını kendisi taşıdığından tamamını isteyemez. Eşit bölüşüm haksız fiilde esas değildir; paylar hâkimce %60-%40 belirlenmiştir.

  - soru: |
      Tazminatın kendi payına düşeninden fazlasını ödeyen müteselsil sorumlunun hukuki durumu nedir?
    siklar:
      - "Yalnız sebepsiz zenginleşme hükümlerine göre diğerlerine başvurabilir."
      - "Fazla ödemesi için diğer sorumlulara rücu eder ve zarar görenin haklarına halef olur."
      - "Fazla ödediği kısmı zarar görenden geri isteyebilir."
      - "Fazla ödediği tutarın tamamını diğer sorumluların her birinden müteselsilen isteyebilir."
    dogru: 1
    aciklama: |
      TBK m. 62/2'ye göre kendi payından fazlasını ödeyen kişi, bu fazla için diğer müteselsil sorumlulara karşı rücu hakkına sahiptir ve zarar görenin haklarına halef olur. Zarar gören borcun tamamını almaya hakkı olduğundan ona karşı geri isteme söz konusu olmaz. İç ilişkide teselsül değil pay esası geçerlidir; ödeyen her birinden ancak payı oranında isteyebilir (TBK m. 167/2).

  - soru: |
      TBK m. 73'e göre müteselsil sorumlular arasındaki rücu istemi hangi sürelerde zamanaşımına uğrar?
    siklar:
      - "Zarar görenin zararı öğrendiği tarihten itibaren iki yıl"
      - "Tazminatın tamamının ödendiği ve birlikte sorumlu kişinin öğrenildiği tarihten itibaren iki yıl, her hâlde tamamının ödendiği tarihten itibaren on yıl"
      - "Haksız fiilin işlendiği tarihten itibaren on yıl"
      - "İlk kısmi ödemenin yapıldığı tarihten itibaren bir yıl"
    dogru: 1
    aciklama: |
      TBK m. 73/1 rücu istemi için ayrı bir zamanaşımı öngörür. Süreyi başlatan, olay ya da zarar görenin öğrenmesi değil, tazminatın tamamının ödenmesidir. Zarar görenin kendi istemi ise TBK m. 72'ye tabidir.

  - soru: |
      Zarar gören, tazminatın tamamını müteselsil sorumlulardan Selin'den istemiştir. Selin, diğer sorumlu Mert'e durumu hiç bildirmeden ödemeyi yapar ve daha sonra Mert'e rücu etmek ister. Bildirim yapılmamasının sonucu nedir?
    siklar:
      - "Selin'in rücu hakkı tamamen ortadan kalkar."
      - "Rücu isteminin zamanaşımı, bildirimin dürüstlük kurallarına göre yapılabileceği tarihte işlemeye başlar."
      - "Bildirim yapılıncaya kadar rücu zamanaşımı durur."
      - "Bildirim yükümlülüğü yalnız sözleşmeden doğan sorumlulukta vardır; haksız fiilde sonuç doğurmaz."
    dogru: 1
    aciklama: |
      TBK m. 73/2'ye göre tazminatın ödenmesi kendisinden istenen kişi, durumu birlikte sorumlu olduğu kişilere bildirmek zorundadır. Bildirmezse zamanaşımı, bildirimin dürüstlük kurallarına göre yapılabileceği tarihte işlemeye başlar. Kanun rücu hakkını kaldırmaz; yaptırım, sürenin daha erken başlamasıdır.

  - soru: |
      Bir trafik kazası nedeniyle yargılanan sürücü Selin, ceza mahkemesince "mahkûmiyetine yeterli, kesin ve inandırıcı delil bulunmadığı" gerekçesiyle beraat ettirilmiş ve karar kesinleşmiştir. Zarar görenin açtığı tazminat davasında hangisi doğrudur?
    siklar:
      - "Beraat kararı hukuk hâkimini bağladığından tazminat davası reddedilmelidir."
      - "Hukuk hâkimi beraat kararıyla bağlı değildir; delillere göre Selin'i kusurlu bulup tazminata hükmedebilir."
      - "Hukuk hâkimi ceza dosyasındaki delilleri hiç inceleyemez."
      - "Tazminat davası ancak ceza kararı kaldırılırsa görülebilir."
    dogru: 1
    aciklama: |
      TBK m. 74/1'e göre hâkim, kusurun varlığı konusunda beraat kararıyla bağlı değildir. Yerleşik içtihada göre beraat, ancak fiilin sanık tarafından işlenmediğinin kesin tespitine dayanıyorsa bağlar; delil yetersizliğine dayanan beraat bağlamaz. Hukuk hâkimi ceza dosyasını delil olarak inceleyebilir.

  - soru: |
      Yargıtay'ın yerleşik uygulamasına göre ceza mahkemesi kararıyla ilgili aşağıdakilerden hangisi hukuk hâkimini **bağlar**?
    siklar:
      - "Ceza dosyasındaki bilirkişinin belirlediği kusur oranı"
      - "Ceza mahkemesinin zarar miktarına ilişkin değerlendirmesi"
      - "Kesinleşmiş kararda fiilin sanık tarafından işlenmediğinin kesin olarak saptanması"
      - "Ceza hukukundaki yaş küçüklüğü nedeniyle ceza sorumluluğu bulunmadığı kuralı"
    dogru: 2
    aciklama: |
      TBK m. 74/2 kusur değerlendirmesinin ve zararın belirlenmesinin, TBK m. 74/1 de ceza hukukunun sorumluluk hükümlerinin hukuk hâkimini bağlamadığını söyler. Buna karşılık kesinleşmiş ceza kararında saptanan maddi olgular, özellikle fiilin sanık tarafından işlenmediğinin kesin tespiti, hukuk hâkimini bağlar.

  - soru: |
      Ceza mahkemesi, Hakan'ın kırmızı ışıkta geçtiğini saptayarak onu taksirle yaralama suçundan mahkûm etmiş, karar kesinleşmiştir. Ceza dosyasındaki rapor Hakan'ı %75 kusurlu bulmuştur. Tazminat davasında hangisi doğrudur?
    siklar:
      - "Hukuk hâkimi, Hakan'ın kırmızı ışıkta geçmediğini kabul edebilir."
      - "Hukuk hâkimi %75 kusur oranıyla bağlıdır."
      - "Hukuk hâkimi Hakan'ı kusursuz sayamaz; ama kusur oranını kendi bilirkişi incelemesiyle farklı belirleyebilir."
      - "Mahkûmiyet nedeniyle tazminat miktarı da ceza mahkemesince belirlenmiş sayılır."
    dogru: 2
    aciklama: |
      Kesinleşmiş ceza kararında saptanan maddi olgu (kırmızı ışıkta geçme) ve Hakan'ın kusurlu olduğunun maddi olgu olarak kabulü hukuk hâkimini bağlar; hâkim onu kusursuz sayamaz. Ancak kusur oranı ve zarar miktarı bakımından ceza hâkiminin değerlendirmesi bağlayıcı değildir (TBK m. 74/2). Hâkim kusur oranını yeni bir bilirkişi incelemesiyle belirleyebilir.

  - soru: |
      11 yaşındaki Emir taş atarak komşusunun aracının camını kırmıştır. Fiil sırasında 12 yaşını doldurmadığı için Emir'in ceza sorumluluğu yoktur. Tazminat davasında hangisi doğrudur?
    siklar:
      - "Ceza sorumluluğu bulunmadığı için Emir'in haksız fiil sorumluluğu da yoktur."
      - "Hukuk hâkimi Emir'in ayırt etme gücünü kendisi değerlendirir; ayırt etme gücü varsa Emir haksız fiilinden sorumludur."
      - "Emir ayırt etme gücüne bakılmaksızın her durumda tam olarak sorumludur."
      - "Emir'e dava açılamaz; yalnız velisi sorumlu tutulabilir."
    dogru: 1
    aciklama: |
      TBK m. 74/1'e göre hâkim, ayırt etme gücü konusunda ceza hukukunun sorumluluk hükümleriyle bağlı değildir. Ceza sorumluluğunun bulunmaması (TCK m. 31/1) sonucu belirlemez. Ayırt etme gücüne sahip küçükler haksız fiillerinden sorumludur (TMK m. 16/2). Velinin ayrıca sorumlu olup olmadığı ayrı bir sorundur ve çocuğun sorumluluğunu kaldırmaz.

  - soru: |
      TBK m. 72/1'deki iki yıllık zamanaşımı süresi ne zaman işlemeye başlar?
    siklar:
      - "Fiilin işlendiği tarihte"
      - "Zarar görenin zararı ve tazminat yükümlüsünü öğrendiği tarihte; ikisinden hangisi daha sonra öğrenildiyse o tarihte"
      - "Zarar görenin zararı öğrenebilecek durumda olduğu tarihte"
      - "Ceza davasının kesinleştiği tarihte"
    dogru: 1
    aciklama: |
      TBK m. 72/1'e göre iki yıllık süre, zarar görenin zararı ve tazminat yükümlüsünü öğrendiği tarihten başlar. İkisi birlikte aranır; hangisi sonra öğrenildiyse süre o tarihten işler. Yargıtay'a göre öğrenebilecek durumda olmak yetmez. Ceza davasının sonucu sürenin başlangıcını belirlemez.

  - soru: |
      Bir haksız fiil 15.03.2012'de işlenmiştir. Zarar gören, zararı ve sorumluyu ilk kez 10.05.2023'te öğrenmiş ve 01.02.2024'te dava açmıştır. Fiil suç oluşturmamaktadır. Davalı zamanaşımı def'inde bulunmuştur. Hangisi doğrudur?
    siklar:
      - "Dava süresindedir, çünkü iki yıllık süre 10.05.2023'te başlamıştır."
      - "Dava zamanaşımına uğramıştır, çünkü fiilin işlendiği tarihten itibaren on yıllık süre dolmuştur."
      - "Zarar geç öğrenildiği için zamanaşımı hiç işlememiştir."
      - "Dava süresindedir, çünkü on yıllık süre öğrenme tarihinden başlar."
    dogru: 1
    aciklama: |
      TBK m. 72/1'e göre istem, her hâlde fiilin işlendiği tarihten başlayarak on yılın geçmesiyle zamanaşımına uğrar. On yıllık süre öğrenmeye bağlı değildir ve üst sınırdır; 15.03.2022'de dolmuştur. Fiil suç olmadığı için uzamış süre de söz konusu değildir. Def'i ileri sürüldüğünden dava reddedilir (TBK m. 161).

  - soru: |
      TBK m. 72/1'in son cümlesindeki "ceza kanunlarının öngördüğü daha uzun zamanaşımı" belirlenirken hangisi esas alınır?
    siklar:
      - "TCK m. 66'daki dava zamanaşımı"
      - "TCK m. 68'deki ceza zamanaşımı"
      - "Ceza mahkemesinin somut olayda hükmettiği hapis cezasının süresi"
      - "Ceza davasının fiilen sürdüğü süre"
    dogru: 0
    aciklama: |
      Uzamış zamanaşımında esas alınan, kamu davasının açılabileceği süreyi gösteren dava zamanaşımıdır (TCK m. 66). TCK m. 68 kesinleşmiş cezanın infazına ilişkindir. Süre, verilen cezaya göre değil, suçun kanundaki cezasının üst sınırına göre belirlenir (TCK m. 66/4). Ceza davasının sürmesi de tek başına zamanaşımını etkilemez.

  - soru: |
      Mert 01.03.2021'de dikkatsizce bisiklet sürerken yaya Nur'a çarpar. Nur'un tedavisi aynı yıl tamamlanır, kalıcı bir sakatlık kalmaz. Nur şikâyette bulunmadığı için ceza davası açılmamıştır. Nur 20.04.2025'te tazminat davası açar, Mert zamanaşımı def'inde bulunur. Yargıtay'ın yerleşik uygulamasına göre hangisi doğrudur?
    siklar:
      - "Ceza davası açılmadığı için uzamış süre uygulanamaz; dava zamanaşımına uğramıştır."
      - "Nur şikâyette bulunmadığı için uzamış süreden yararlanamaz."
      - "Fiil taksirle yaralama suçunu oluşturduğundan sekiz yıllık dava zamanaşımı uygulanır; dava süresindedir."
      - "Uzamış süre ancak fail mahkûm olmuşsa uygulanır."
    dogru: 2
    aciklama: |
      İki yıllık süre dolmuştur, ama uzamış süre için fiilin suç oluşturması yeterlidir; ceza davası, mahkûmiyet ya da şikâyet şart değildir. Fiilin suç olup olmadığını hukuk hâkimi kendisi belirler. Taksirle yaralama suçunun cezasının üst sınırı beş yılı geçmediğinden dava zamanaşımı sekiz yıldır (TCK m. 66/1-e). Süre olay tarihinden işler ve 01.03.2029'da dolar (TBK m. 72/1).

  - soru: |
      Yargıtay'ın yerleşik uygulamasına göre uzamış zamanaşımında sürenin kesilmesi ve durması hakkında hangisi doğrudur?
    siklar:
      - "Ceza kanunundaki kesilme hükümleri uygulanır ve süre kesilmeyle yarısı oranında uzar."
      - "TBK'daki kesilme ve durma hükümleri uygulanır; ceza kanunundaki uzama kuralı uygulanmaz."
      - "Uzamış süre hiçbir sebeple kesilemez."
      - "Zarar görenin ceza davasına katılması zamanaşımını keser."
    dogru: 1
    aciklama: |
      Uzamış süre, ceza kanunundan alınsa da özel hukuka ait bir zamanaşımıdır. Durma ve kesilme TBK hükümlerine göre belirlenir (TBK m. 153 vd.). Ceza kanunundaki kesilme sonucu sürenin uzaması kuralı tazminat davasında uygulanmaz. Ceza davasına katılmak da zamanaşımını kesmez, çünkü bugünkü ceza yargılamasında tazminat istenemez.

  - soru: |
      Haksız fiil dolayısıyla zarar gören bakımından bir borç doğmuşsa, TBK m. 72/2'ye göre hangisi doğrudur?
    siklar:
      - "Zarar gören, tazminat istemi zamanaşımına uğramış olsa bile bu borcu ifadan her zaman kaçınabilir."
      - "Zarar görenin borcu da tazminat istemiyle birlikte zamanaşımına uğrar."
      - "Zarar gören ancak iki yıl içinde ifadan kaçınabilir."
      - "Zarar gören borcu ödemek zorundadır; ödediğini ancak sebepsiz zenginleşme hükümlerine göre geri isteyebilir."
    dogru: 0
    aciklama: |
      TBK m. 72/2'ye göre haksız fiil dolayısıyla zarar gören bakımından bir borç doğmuşsa zarar gören, haksız fiilden doğan tazminat istemi zamanaşımına uğramış olsa bile bu borcu ifadan her zaman kaçınabilir. Bu, süreye bağlı olmayan bir def'idir.

olaylar:
  - olay: |
      12.09.2024 günü Kadıköy'de bir kavşakta, kendi aracını kullanan Kerem kırmızı ışıkta kavşağa girer. Diğer yönden gelen ve kendi aracını kullanan Ozan da saatte 50 km hız sınırının bulunduğu yolda 75 km hızla seyretmektedir. Araçlar çarpışır; savrulan Ozan'ın aracı kaldırımda yürüyen Zeynep'e çarpar. Zeynep ağır yaralanır, maddi zararı 900.000 TL olarak hesaplanır.

      Ceza mahkemesi, Kerem'in kırmızı ışıkta geçtiğini saptayarak onu taksirle yaralama suçundan mahkûm eder. Ceza dosyasındaki bilirkişi raporu Kerem'i %75, Ozan'ı %25 kusurlu bulmuştur. Ozan ise "mahkûmiyetine yeterli, kesin ve inandırıcı delil bulunmadığı" gerekçesiyle beraat eder. İki karar da kesinleşir.

      Zeynep, ödeme gücü yüksek olan Ozan'a 10.03.2025'te dava açar ve 900.000 TL'nin tamamını ister. Ozan iki savunma yapar: "Beraat ettim, sorumlu değilim." ve "Sorumluysam bile ceza dosyasındaki rapora göre kusurum %25'tir; en fazla 225.000 TL öderim." Ozan, dava kendisine tebliğ edilince durumu noter aracılığıyla Kerem'e bildirir.

      Hukuk mahkemesinin aldırdığı ayrıntılı bilirkişi raporu, ceza dosyasındaki raporu da tartışarak Kerem'i %70, Ozan'ı %30 kusurlu bulur. Mahkeme Ozan'ı 900.000 TL'yi ödemeye mahkûm eder; Ozan bu tutarın tamamını 15.01.2026'da öder ve şimdi Kerem'e başvurmak istemektedir. Rücu davasında alınan rapor da aynı oranları benimser.

      1. Ozan'ın iki savunmasını değerlendiriniz.
      2. Kerem ve Ozan'ın Zeynep'e karşı sorumluluğunun niteliği nedir?
      3. Ozan, Kerem'den ne kadar isteyebilir ve hangi hukuki imkânlara sahiptir?
      4. Ozan'ın rücu istemi ne zaman zamanaşımına uğrar?
    olcut:
      - {tespit: "Delil yetersizliğine dayanan beraatin hukuk hâkimini bağlamaması; Kerem'in kırmızı ışıkta geçtiğine ilişkin maddi olgunun bağlaması", puan: 20, madde: "TBK m. 74"}
      - {tespit: "Ceza dosyasındaki kusur oranının bağlamaması; kusurun hukuk mahkemesinin bilirkişi incelemesiyle belirlenebilmesi", puan: 10, madde: "TBK m. 74"}
      - {tespit: "Birlikte zarar verme nedeniyle müteselsil sorumluluk; Zeynep'in zararın tamamını Ozan'dan isteyebilmesi", puan: 20, madde: "TBK m. 61"}
      - {tespit: "Kusur oranının dış ilişkide zarar görene karşı ileri sürülememesi; Ozan'ın ödemesiyle Kerem'in de Zeynep'e karşı kurtulması", puan: 10, madde: "TBK m. 163"}
      - {tespit: "İç ilişkide kusurun ağırlığına göre paylaştırma; Ozan'ın 630.000 TL için Kerem'e rücu edebilmesi", puan: 20, madde: "TBK m. 62"}
      - {tespit: "Ozan'ın ödediği fazla oranında Zeynep'in haklarına halef olması", puan: 10, madde: "TBK m. 62"}
      - {tespit: "Rücu zamanaşımının tamamının ödendiği 15.01.2026'dan başlaması; bildirim yükümlülüğünün yerine getirilmiş olması", puan: 10, madde: "TBK m. 73"}
    cozum: |
      **Nitelendirme:** Kerem kırmızı ışıkta geçerek, Ozan hız sınırını aşarak kusurlu ve hukuka aykırı davranmıştır. İkisinin davranışı birlikte Zeynep'in yaralanmasına yol açmıştır ve her biri TBK m. 49'a göre sorumludur. Birden çok kişi bir zarara birlikte sebep olduğu için müteselsil sorumluluk hükümleri uygulanır (TBK m. 61). Sürücüler aynı zamanda araçlarının işleteni olduğundan Karayolları Trafik Kanunu'na göre de sorumludur; bu, sonucu değiştirmez.

      **Hukuki sorunlar:** Ceza kararlarının tazminat davasına etkisi; dış ilişkide Ozan'ın sorumluluğunun kapsamı; iç ilişki, rücu ve halefiyet; rücu zamanaşımı.

      **İlgili hükümler:** TBK m. 49, m. 61, m. 62, m. 73, m. 74, m. 163, m. 166.

      **Değerlendirme:**

      *1. Ozan'ın savunmaları.*
      - *Beraat:* TBK m. 74/1'e göre hukuk hâkimi kusurun varlığı konusunda beraat kararıyla bağlı değildir. Yerleşik içtihada göre beraat ancak fiilin sanık tarafından işlenmediğinin kesin tespitine dayanıyorsa bağlar. Ozan'ın beraati delil yetersizliğine dayandığından hâkim, kendi topladığı delillere göre onu kusurlu bulabilir. Buna karşılık Kerem hakkındaki kesinleşmiş mahkûmiyette saptanan maddi olgu, yani Kerem'in kırmızı ışıkta geçtiği, hukuk hâkimini bağlar. Özellikle Ozan'ın açacağı rücu davasında Kerem bunun aksini ileri süremez.
      - *Kusur oranı:* Ceza dosyasındaki %25 oranı bağlayıcı değildir (TBK m. 74/2). Hâkim kusuru yeni bilirkişi incelemesiyle belirleyebilir; ancak hukuk dosyasındaki raporun ceza dosyasındaki rapordan neden ayrıldığı gerekçeli ve denetime elverişli biçimde açıklanmalıdır. Olayda hukuk mahkemesinin raporu ceza dosyasındaki raporu da tartışmıştır. Daha önemlisi, kusur oranı ne olursa olsun Ozan'ın zarar görene karşı sorumluluğunu sınırlamaz.

      *2. Dış ilişki.* Zarar gören borcun tamamını dilediği müteselsil sorumludan isteyebilir (TBK m. 163/1). Zeynep'in yalnız Ozan'a dava açması ve 900.000 TL'nin tamamını istemesi yerindedir. Ozan'ın "en fazla payım kadar öderim" savunması dinlenmez; kusur oranları iç ilişkiye aittir. Ozan'ın ödemesiyle Kerem de Zeynep'e karşı borçtan kurtulur (TBK m. 166/1). Zeynep aynı zararı Kerem'den yeniden isteyemez.

      *3. İç ilişki ve rücu.* TBK m. 62/1'e göre tazminat bütün durum ve koşullar, özellikle kusurun ağırlığı göz önünde tutularak paylaştırılır. Kırmızı ışık ihlali, hız sınırını aşmaya göre daha ağır bir kusur olarak değerlendirilmiş ve paylar %70-%30 belirlenmiştir. Ozan'ın payı 900.000 × %30 = 270.000 TL'dir. Payından fazla ödediği 630.000 TL için Kerem'e rücu eder (TBK m. 62/2). Ayrıca bu tutar oranında Zeynep'in haklarına halef olur; Zeynep'in alacağına bağlı teminat ve öncelik hakları varsa bunlardan da yararlanabilir.

      *4. Rücu zamanaşımı.* TBK m. 73/1'e göre rücu istemi, tazminatın tamamının ödendiği ve birlikte sorumlunun öğrenildiği tarihten itibaren iki yılda, her hâlde tamamının ödendiği tarihten itibaren on yılda zamanaşımına uğrar. Ozan, Kerem'i olaydan beri tanımaktadır ve tamamını 15.01.2026'da ödemiştir. İki yıllık süre 15.01.2028'de dolar. Ozan, dava kendisine tebliğ edilince durumu Kerem'e bildirdiği için TBK m. 73/2'deki yükümlülüğünü yerine getirmiştir; süre erken başlamaz.

      **Sonuç:**
      - Ozan'ın beraat savunması yerinde değildir; delil yetersizliğine dayanan beraat hukuk hâkimini bağlamaz. Kerem'in kırmızı ışıkta geçtiği ise bağlayıcı bir maddi olgudur.
      - Ozan, Zeynep'e karşı 900.000 TL'nin tamamından sorumludur; kusur oranını dış ilişkide ileri süremez.
      - Ozan, Kerem'den 630.000 TL isteyebilir ve bu oranda Zeynep'in haklarına halef olur.
      - Rücu istemi 15.01.2028'e kadar ileri sürülmelidir.

  - olay: |
      15.03.2023 günü Üsküdar'da, Kuzey İnşaat A.Ş.'nin yüklenicisi olduğu bir bina inşaatında, taşeron Demir Yapı Ltd. Şti.'nin işçisi Hasan, dördüncü katta demir çubukları bağlamadan taşırken bir çubuğu elinden kaçırır. Çubuk, kaldırımdan geçen öğretmen Gül'ün başına düşer ve Gül ağır yaralanır.

      Gül, demiri düşürenin Hasan olduğunu olay günü tutulan polis tutanağından öğrenir. Kalıcı %35 maluliyetini gösteren kesin Adli Tıp raporu 01.09.2024'te düzenlenir ve aynı gün Gül'e bildirilir. Gül, Hasan'ı Kuzey İnşaat'ın işçisi sanmaktadır. Hasan'ın aslında Demir Yapı'nın çalışanı olduğunu, katılan olarak izlediği ceza davasında gerekçeli kararın kendisine tebliğ edildiği 10.05.2025'te öğrenir.

      Ceza mahkemesi Hasan'ı taksirle yaralama suçundan mahkûm etmiştir. Kararda inşaatın kaldırım tarafında hiçbir uyarı levhası ve bariyer bulunmadığı saptanmıştır. Karar kesinleşmiştir.

      Gül, 15.11.2026'da Hasan ve Demir Yapı'ya karşı maddi ve manevi tazminat davası açar. Davalıların savunmaları şunlardır:
      - Demir Yapı: "Gül bariyerle kapatılmış alana girdi, %50 kusurludur."
      - Hasan: "Kesin rapor 01.09.2024'te öğrenildi; iki yıllık süre 01.09.2026'da doldu."
      - Demir Yapı: "Olay 15.03.2023'te oldu; iki yıl çoktan geçti."

      1. Hasan ve Demir Yapı'nın sorumluluk sebeplerini ve Gül'e karşı aralarındaki ilişkiyi belirtiniz.
      2. Ceza mahkemesi kararı tazminat davasında neyi bağlar? Demir Yapı'nın kusur savunmasını değerlendiriniz.
      3. Zamanaşımı savunmalarını her davalı için ayrı ayrı değerlendiriniz.
      4. Demir Yapı tazminatı öderse Hasan'a başvurabilir mi?
    olcut:
      - {tespit: "Hasan'ın kusur sorumluluğu ve Demir Yapı'nın adam çalıştıran sorumluluğu; aynı zarardan çeşitli sebeplerle müteselsil sorumluluk", puan: 20, madde: "TBK m. 61"}
      - {tespit: "Ceza kararında saptanan maddi olgunun (bariyer bulunmaması) bağlaması ve bariyer savunmasının dinlenmemesi; kusur oranı ve zarar miktarının hukuk hâkimince belirlenmesi", puan: 20, madde: "TBK m. 74"}
      - {tespit: "Hasan yönünden iki yıllık sürenin dolduğu, ancak fiil suç olduğundan sekiz yıllık dava zamanaşımının olay tarihinden işlediği", puan: 20, madde: "TCK m. 66"}
      - {tespit: "Demir Yapı yönünden iki yıllık sürenin tazminat yükümlüsünün öğrenildiği 10.05.2025'ten başladığı ve dolmadığı", puan: 20, madde: "TBK m. 72"}
      - {tespit: "On yıllık sürenin dolmadığı ve zamanaşımının ancak def'i olarak ileri sürülünce incelenebileceği", puan: 5, madde: "TBK m. 161"}
      - {tespit: "Demir Yapı'nın Hasan'a ancak onun bizzat sorumlu olduğu ölçüde rücu edebilmesi; paylaştırma ölçütleri", puan: 15, madde: "TBK m. 66"}
    cozum: |
      **Nitelendirme:** Hasan, çubukları bağlamadan taşıyarak özen yükümlülüğüne aykırı davranmış ve Gül'ün yaralanmasına yol açmıştır; kusur sorumluluğu doğar (TBK m. 49). Demir Yapı, çalışanının kendisine verilen işin yapılması sırasında başkasına verdiği zarardan adam çalıştıran olarak sorumludur (TBK m. 66/1). İkisi aynı zarardan çeşitli sebeplerle sorumlu olduğundan müteselsil sorumluluk hükümleri uygulanır (TBK m. 61).

      **Hukuki sorunlar:** Ceza kararının bağlayıcılığı; her davalı için zamanaşımı; adam çalıştıranın çalışana rücuu.

      **İlgili hükümler:** TBK m. 49, m. 61, m. 62, m. 66, m. 72, m. 74, m. 161; TCK m. 66.

      **Değerlendirme:**

      *1. Sorumluluk ilişkisi.* Gül zararın tamamını Hasan'dan, Demir Yapı'dan ya da ikisinden birlikte isteyebilir (TBK m. 163/1). Demir Yapı ancak gerekli özeni gösterdiğini ya da işletmesinin çalışma düzeninin zararı önlemeye elverişli olduğunu ispat ederek sorumluluktan kurtulabilir (TBK m. 66/2-3); ayrıntısı kusursuz sorumluluk konusundadır. Olayda böyle bir ispat yoktur. Gül, Kuzey İnşaat'a dava açmamıştır.

      *2. Ceza kararının etkisi.* TBK m. 74/2 uyarınca hukuk hâkimi kusurun değerlendirilmesinde ve zararın belirlenmesinde ceza hâkiminin kararıyla bağlı değildir. Ancak yerleşik içtihada göre kesinleşmiş ceza kararında saptanan maddi olgular hukuk hâkimini bağlar. Ceza mahkemesi inşaatın kaldırım tarafında uyarı levhası ve bariyer bulunmadığını saptamıştır. Bu yüzden Demir Yapı'nın "Gül bariyerle kapatılmış alana girdi" savunması, bağlayıcı maddi olguya aykırı olduğu için dinlenmez. Gül'ün başka bir kusuru (örneğin dikkatsizliği) iddia edilirse bunun varlığını ve oranını hukuk hâkimi kendisi değerlendirir. Hasan'ın kusurlu olduğu da maddi olgu olarak saptandığından hâkim onu kusursuz sayamaz; kusur oranını ve zarar miktarını ise kendisi belirler.

      *3. Zamanaşımı.* Süre her davalı için ayrı hesaplanır.
      - *Hasan:* İki yıllık süre, zarar ve tazminat yükümlüsünün birlikte öğrenilmesiyle başlar. Hasan olay günü, zararın kapsamı kesin raporla 01.09.2024'te öğrenilmiştir. Süre 01.09.2026'da dolmuştur. Ancak Hasan'ın fiili taksirle yaralama suçunu oluşturur ve bu, kesinleşmiş mahkûmiyetle sabittir. Suçun cezasının üst sınırı beş yılı geçmediğinden dava zamanaşımı sekiz yıldır (TCK m. 66/1-e) ve TBK m. 72/1 uyarınca bu süre uygulanır. Yargıtay'ın yerleşik uygulamasına göre uzamış süre olay tarihinden işler ve 15.03.2031'de dolar. Hasan'a karşı dava süresindedir.
      - *Demir Yapı:* Gül, tazminat yükümlüsü olarak Demir Yapı'yı ancak 10.05.2025'te öğrenmiştir. Zarar daha önce öğrenildiğinden iki yıllık süre, son öğrenme tarihi olan 10.05.2025'ten başlar ve 10.05.2027'de dolar. Dava süresindedir. Bu nedenle uzamış sürenin adam çalıştırana uygulanıp uygulanmayacağı tartışmasına girmeye gerek yoktur. Demir Yapı'nın olay tarihinden hesap yapması yanlıştır.
      - On yıllık süre 15.03.2033'te dolacağından aşılmamıştır. Gül'ün ceza davasına katılan olması zamanaşımını kesmez; ama bu olayda sonuca etkisi yoktur. Zamanaşımı kendiliğinden dikkate alınmaz (TBK m. 161); davalılar def'i ileri sürmüştür, ama def'iler yukarıdaki gerekçelerle reddedilmelidir.

      *4. Rücu.* Demir Yapı tazminatı öderse, çalışana ancak onun bizzat sorumlu olduğu ölçüde rücu edebilir (TBK m. 66/4). Paylaştırmada TBK m. 62/1'deki ölçütler, özellikle kusurun ağırlığı dikkate alınır. Demir Yapı'nın kendi eksiklikleri varsa (örneğin işçisine gerekli ekipmanı ve eğitimi sağlamamışsa) rücu edebileceği tutar buna göre azalır. Rücu istemi, tazminatın tamamının ödenmesinden itibaren TBK m. 73'teki sürelere tabidir.

      **Sonuç:**
      - Hasan ve Demir Yapı Gül'e karşı müteselsilen sorumludur.
      - Bariyer savunması bağlayıcı maddi olguya aykırıdır; kusur oranını ve zarar miktarını hukuk hâkimi belirler.
      - Hasan'a karşı istem sekiz yıllık uzamış süre içinde, Demir Yapı'ya karşı istem iki yıllık süre içinde ileri sürülmüştür; zamanaşımı def'ileri reddedilmelidir.
      - Demir Yapı ödeme yaparsa Hasan'a ancak onun bizzat sorumlu olduğu ölçüde rücu edebilir.

  - olay: |
      05.05.2023 günü Ataşehir'de, köpeklerin tasmalı gezdirilmesinin zorunlu olduğu bir parkta Kaan'ın iri ve saldırgan köpeği Duman tasmasız dolaşmaktadır. Aynı sırada Melis, köpeği Pamuk'u gezdirirken telefonla konuşmak için tasmayı elinden bırakır. Duman'ın havlamasıyla ürken Pamuk, Duman'la birlikte 9 yaşındaki Ece'ye saldırır. Ece'nin kolunda ağır yaralar oluşur; hangi yaranın hangi köpekten kaynaklandığı belirlenememektedir.

      Ece aylarca tedavi görür. Kolunda kalıcı %15 maluliyet bulunduğunu gösteren kesin sağlık kurulu raporu 10.02.2024'te düzenlenir ve aynı gün ailesine verilir. Kaan'ın ödeme gücü yoktur.

      Ece'nin anne ve babası, onun yasal temsilcisi olarak 20.12.2025'te yalnız Melis'e karşı dava açar ve Ece'nin kalıcı maluliyetinden doğan, 600.000 TL olarak hesaplanan çalışma gücü kaybı zararının tamamını ister. Melis şunları savunur:
      - "Saldırının asıl sorumlusu tasmasız ve saldırgan Duman'dır; en fazla zararın %30'unu öderim."
      - "Olay 05.05.2023'te oldu; iki yıllık zamanaşımı süresi dolmuştur."

      1. Melis ve Kaan'ın sorumluluğunu ve Ece'ye karşı aralarındaki ilişkiyi değerlendiriniz.
      2. Melis'in iki savunması yerinde midir?
      3. Melis zararın tamamını öderse Kaan'a başvurabilir mi? Paylaştırmada nelere bakılır?
      4. Bu rücu istemi hangi süre içinde ileri sürülmelidir?
    olcut:
      - {tespit: "Kaan ve Melis'in hayvan bulunduran olarak (ve kusurları nedeniyle) sorumluluğu; tek ve bölünemez zarar nedeniyle müteselsil sorumluluk", puan: 20, madde: "TBK m. 61"}
      - {tespit: "Zararın tamamının Melis'ten istenebilmesi; yüzde otuz savunmasının dış ilişkide dinlenmemesi", puan: 20, madde: "TBK m. 163"}
      - {tespit: "İki yıllık sürenin zararın kapsamının kesin olarak öğrenildiği 10.02.2024'ten başlaması ve dolmamış olması; on yıllık sürenin de dolmaması", puan: 20, madde: "TBK m. 72"}
      - {tespit: "İç ilişkide kusurun ağırlığı ve tehlikenin yoğunluğuna göre paylaştırma; Kaan'ın payının daha yüksek tutulabilmesi", puan: 15, madde: "TBK m. 62"}
      - {tespit: "Payından fazlasını ödeyen Melis'in rücu hakkı ve halefiyeti; ürkütmeye ilişkin özel rücu hükmü", puan: 15, madde: "TBK m. 67"}
      - {tespit: "Rücu isteminin tamamının ödenmesinden itibaren iki ve on yıllık sürelere tabi olması; bildirim yükümlülüğü", puan: 10, madde: "TBK m. 73"}
    cozum: |
      **Nitelendirme:** Bir hayvanın bakımını ve yönetimini üstlenen kişi, hayvanın verdiği zararı gidermekle yükümlüdür; ancak zararı önlemek için gerekli özeni gösterdiğini ispat ederse sorumlu olmaz (TBK m. 67). Kaan köpeğini tasmanın zorunlu olduğu parkta serbest bırakmış, Melis de tasmayı elinden bırakmıştır; ikisi de gerekli özeni göstermemiştir. Davranışları kusurlu olduğundan TBK m. 49'a göre de sorumludurlar. Aynı kişinin birden çok sebeple sorumluluğu TBK m. 60'ın konusudur. İki kişinin aynı zarardan sorumluluğu ise TBK m. 61'e göre müteselsil sorumluluktur.

      **Hukuki sorunlar:** Dış ilişkide Melis'in sorumluluğunun kapsamı; zamanaşımının başlangıcı; iç ilişkide paylaştırma ve rücu; rücu zamanaşımı.

      **İlgili hükümler:** TBK m. 49, m. 60, m. 61, m. 62, m. 67, m. 72, m. 73, m. 163.

      **Değerlendirme:**

      *1. Müteselsil sorumluluk.* Yaraların hangi köpekten kaynaklandığı ayrılamamaktadır. Zarar tek ve bölünemez olduğundan kısmi sorumluluk değil müteselsil sorumluluk söz konusudur (TBK m. 61).

      *2. Melis'in savunmaları.*
      - *Yüzde otuz savunması:* Zarar gören borcun tamamını dilediği sorumludan isteyebilir (TBK m. 163/1). Kaan'ın daha ağır kusurlu olması ve ödeme gücünün bulunmaması Ece'nin aleyhine sonuç doğurmaz. Müteselsil sorumluluğun amacı da budur: zarar gören, ödeme gücü olan sorumluya başvurarak zararını giderir. Savunma dış ilişkide dinlenmez; pay meselesi iç ilişkiye aittir.
      - *Zamanaşımı savunması:* İki yıllık süre, zarar görenin zararı ve tazminat yükümlüsünü öğrendiği tarihten başlar (TBK m. 72/1). Yargıtay'a göre zararın öğrenilmesi, varlığının, niteliğinin ve kapsamının kesin olarak bilinmesidir. Ece'nin kalıcı maluliyeti ve dolayısıyla zararın kapsamı, kesin raporun verildiği 10.02.2024'te öğrenilmiştir. Süre 10.02.2026'da dolar ve 20.12.2025'te açılan dava süresindedir. On yıllık süre de 05.05.2033'e kadar işler. Melis süreyi yanlış başlangıçtan hesaplamıştır; savunma reddedilir. Bu sonuca ulaşmak için uzamış süreye başvurmaya gerek yoktur. Ayrıca küçüklük, üçüncü kişilere karşı alacaklarda zamanaşımını durdurmaz; durma sebepleri TBK m. 153'te sayılmıştır.

      *3. İç ilişki ve rücu.* Melis zararın tamamını öderse, kendi payından fazlası için Kaan'a rücu eder ve bu oranda Ece'nin haklarına halef olur (TBK m. 62/2). Paylaştırmada bütün durum ve koşullar, özellikle kusurun ağırlığı ve tehlikenin yoğunluğu dikkate alınır (TBK m. 62/1). İri ve saldırgan bir köpeği tasmanın zorunlu olduğu yerde tamamen serbest bırakmak, tasmayı kısa süre elden bırakmaktan hem daha ağır bir kusur hem daha yoğun bir tehlikedir. Ayrıca Pamuk, Duman'ın havlamasıyla ürkmüştür; hayvan başkasına ait bir hayvan tarafından ürkütülmüşse hayvan bulunduranın bu kişilere rücu hakkı saklıdır (TBK m. 67/3). Bu nedenle hâkim Kaan'ın payını belirgin biçimde yüksek tutabilir. Örneğin paylar %70-%30 belirlenirse Melis, ödediği 600.000 TL'nin 420.000 TL'si için Kaan'a rücu eder. Kaan'ın bugün ödeme gücünün olmaması bu hakkı ortadan kaldırmaz; ama tahsil riskini artık Melis taşır.

      *4. Rücu zamanaşımı.* Melis'in rücu istemi, tazminatın tamamını ödediği ve Kaan'ı öğrendiği tarihten itibaren iki yılda, her hâlde tamamını ödediği tarihten itibaren on yılda zamanaşımına uğrar (TBK m. 73/1). Melis, kendisinden ödeme istendiği için durumu Kaan'a bildirmelidir. Bildirmezse süre, bildirimin dürüstlük kurallarına göre yapılabileceği tarihte işlemeye başlar (TBK m. 73/2).

      **Sonuç:**
      - Kaan ve Melis, Ece'ye karşı 600.000 TL'nin tamamından müteselsilen sorumludur; Melis'in yüzde otuz savunması dinlenmez.
      - Dava, zararın kapsamının öğrenildiği 10.02.2024'ten itibaren iki yıl içinde açıldığından süresindedir.
      - Melis ödeme yaparsa, kusur ve tehlike yoğunluğuna göre belirlenecek payını aşan kısım için Kaan'a rücu eder ve halef olur.
      - Rücu istemi, tamamının ödenmesinden itibaren TBK m. 73'teki sürelere tabidir.

kartlar:
  - on: "TBK m. 61 hangi iki hâlde uygulanır?"
    arka: "Birden çok kişinin bir zarara birlikte sebep olması ve aynı zarardan çeşitli sebeplerle sorumlu olunması. İkisinde de müteselsil sorumluluk hükümleri uygulanır."
  - on: "TBK m. 60 ile m. 61 arasındaki fark?"
    arka: "m. 60, tek kişinin birden çok sorumluluk sebebini (yarışma) düzenler. m. 61, birden çok kişinin aynı zarardan sorumluluğunu düzenler."
  - on: "Zarar gören müteselsil sorumlulardan ne isteyebilir?"
    arka: "Tazminatın tamamını ya da bir kısmını, dilediğinden, birkaçından ya da hepsinden (TBK m. 163/1)."
  - on: "Sorumlu, kusur oranını zarar görene karşı ileri sürebilir mi?"
    arka: "Hayır. Kusur oranları yalnız iç ilişkide, paylaştırmada önem taşır."
  - on: "Sorumlulardan birini dava etmek ya da mahkûm ettirmek diğerlerini kurtarır mı?"
    arka: "Hayır, yalnız ifa kurtarır (TBK m. 166/1). Hüküm tahsilde tekerrür olmamak kaydıyla kurulur."
  - on: "Müteselsil sorumluluk için zarar nasıl olmalı?"
    arka: "Tek ve bölünemez. Herkes ayrı ve belirlenebilir bir zarar vermişse kısmi sorumluluk vardır."
  - on: "Sorumlulardan biri ibra edilirse diğerleri ne olur?"
    arka: "İbra edilenin iç ilişkideki payı oranında borçtan kurtulurlar (TBK m. 166/3)."
  - on: "İç ilişkide paylaştırma ölçütleri? (TBK m. 62/1)"
    arka: "Bütün durum ve koşullar, özellikle kusurun ağırlığı ve yaratılan tehlikenin yoğunluğu."
  - on: "Payından fazlasını ödeyen sorumlunun hakları? (TBK m. 62/2)"
    arka: "Fazlası için diğer sorumlulara rücu eder ve zarar görenin haklarına halef olur."
  - on: "İç ilişkide teselsül var mı?"
    arka: "Hayır. Ödeyen her birinden ancak onun payı oranında isteyebilir (TBK m. 167/2)."
  - on: "Adam çalıştıranın çalışana rücuu? (TBK m. 66/4)"
    arka: "Ancak çalışanın bizzat sorumlu olduğu ölçüde."
  - on: "Rücu isteminin zamanaşımı? (TBK m. 73/1)"
    arka: "Tamamının ödendiği ve birlikte sorumlunun öğrenildiği tarihten 2 yıl; her hâlde tamamının ödendiği tarihten 10 yıl."
  - on: "TBK m. 73/2'deki bildirim yapılmazsa ne olur?"
    arka: "Rücu zamanaşımı, bildirimin dürüstlük kurallarına göre yapılabileceği tarihte işlemeye başlar."
  - on: "Beraat kararı hukuk hâkimini bağlar mı? (TBK m. 74)"
    arka: "Kural olarak hayır. Yalnız fiilin sanık tarafından işlenmediğinin kesin tespitine dayanıyorsa bağlar; delil yetersizliğine dayanan beraat bağlamaz."
  - on: "Ceza kararında hukuk hâkimini bağlayan nedir?"
    arka: "Kesinleşmiş kararda saptanan maddi olgular: olayın varlığı, fiilin kim tarafından işlendiği, hukuka aykırılık."
  - on: "Ceza dosyasındaki kusur oranı hukuk hâkimini bağlar mı?"
    arka: "Hayır (TBK m. 74/2). Ama kusurlu olduğu maddi olgu olarak saptanan kişi hukukta kusursuz sayılamaz."
  - on: "Haksız fiilde zamanaşımı süreleri? (TBK m. 72/1)"
    arka: "Zararı ve tazminat yükümlüsünü öğrenmeden 2 yıl; her hâlde fiilden 10 yıl; fiil suçsa ceza kanunundaki daha uzun süre."
  - on: "Zararın öğrenilmesi ne demektir?"
    arka: "Yargıtay'a göre zararın varlığının, niteliğinin ve kapsamının kesin olarak öğrenilmesi. Bedensel zararda çoğu zaman kesin raporun öğrenildiği tarih."
  - on: "Uzamış zamanaşımında hangi süre esas alınır?"
    arka: "TCK m. 66'daki dava zamanaşımı, suçun cezasının üst sınırına göre. Taksirle yaralamada 8, taksirle öldürmede 15 yıl."
  - on: "Uzamış süre için ceza davası ya da mahkûmiyet gerekir mi?"
    arka: "Hayır. Fiilin suç olması yeter; şikâyet yokluğu da engel değil. Süre olay tarihinden işler."
  - on: "Ceza davasına katılmak tazminat isteminin zamanaşımını keser mi?"
    arka: "Hayır. Bugünkü ceza yargılamasında tazminat istenemediği için ceza davasına katılmanın kesme etkisi yoktur."
  - on: "TBK m. 72/2 neyi düzenler?"
    arka: "Haksız fiil yüzünden borç altına giren zarar gören, tazminat istemi zamanaşımına uğrasa bile bu borcu ifadan her zaman kaçınabilir."
  - on: "TBK m. 75'teki iki yıllık süre nedir?"
    arka: "Bedensel zararın kapsamı belirlenemiyorsa hâkimin, kararın kesinleşmesinden itibaren iki yıl içinde hükmü değiştirme yetkisini saklı tutabilmesi. Zamanaşımı değildir."
