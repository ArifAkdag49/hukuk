  - id: "520441400"
    ozet: |
      LPG dağıtım şirketi ile bir istasyon işleteni arasında beş yıllık otogaz bayilik sözleşmesi yapılmış, bayi sözleşmeyi süresinden önce feshetmiştir. Dağıtıcı ceza, kâr kaybı ve emtia bedeli istemiş, ceza talebini ıslahla 15.000 USD'ye çıkarmıştır. Ticaret mahkemesi feshi haksız bulmuş, ama cezanın bayinin ekonomik yıkımına yol açacağını belirterek 5.000 USD'ye hükmetmiştir. Yargıtay 19. Hukuk Dairesi, başka bir eksikliğin yanında, indirimin dayanağının yeterince araştırılmadığı ve gerekçelendirilmediği için bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu oy birliğiyle direnme kararını bozmuştur. Olaya eski Borçlar Kanunu ile eski Ticaret Kanunu'nun 24. maddesi uygulanmıştır. Bu madde, bugünkü TTK m. 22 ile aynı yöndedir. Kurula göre tacir borçlu cezanın aşırı olduğu iddiasıyla indirim isteyemez. Ancak ceza tacirin ekonomik mahvına yol açacak derecede ağırsa ahlaka aykırıdır ve kısmen ya da tamamen iptal edilebilir. Bu değerlendirme öznel olamaz: cezanın kararlaştırıldığı tarihteki ekonomik durum, ödeme gücü ve fesihteki kusur defter ve kayıtlar üzerinden bilirkişiyle araştırılmalı, karar denetlenebilir biçimde gerekçelendirilmelidir. Konuya katkısı: tacir borçlunun indirim yasağını ve ekonomik yıkım istisnasının sınırlarını gösterir.
  - id: "484382600"
    ozet: |
      Bir okul, anaokulu öğretmeniyle 01.09.2012-31.08.2013 dönemi için belirli süreli iş sözleşmesi yapmıştır. Sözleşmeye göre haklı bir neden olmadan sözleşmeyi fesheden taraf, kalan süre kadar ücreti ödeyecektir. Öğretmen KPSS sonucunda kamuya atanmış ve 10.09.2012'de işten ayrılmıştır. İşveren ceza istemiş, iş mahkemesi kaydın iki taraflı ve eşit olduğunu, hakkaniyet indirimi yapılamayacağını belirterek davayı kabul etmiştir. İşçinin temyizi üzerine Yargıtay 9. Hukuk Dairesi kararı oy birliğiyle bozmuştur. Gerekçeye göre hizmet sözleşmesine yalnız işçi aleyhine konan ceza geçersizdir. İki taraflı cezada işçinin cezası işverenin cezasını aşamaz. Ceza geçerli olsa da hâkim TBK m. 182'nin son fıkrasını uygulamalı, işçinin ekonomik mahvına yol açmayacak bir çözüm bulmalı ve çalışılan ile çalışılması gereken süreyi oranlamalıdır. Somut olayda on günlük çalışma, on iki aylık süre ve memuriyete geçiş sebebi gözetilerek daha yüksek oranda indirim yapılmalıdır. Konuya katkısı: iş hukukunda karşılıklılık ve orantılılık yaklaşımını gösterir.

sorular:
  - soru: |
      TBK m. 177'ye göre sözleşme yapılırken bir tarafın diğerine verdiği bir miktar para, aksi ispatlanmadıkça nasıl nitelendirilir?
    siklar:
      - "Sözleşmenin yapıldığına kanıt olarak verilmiş bağlanma parası"
      - "Taraflara cayma yetkisi veren cayma parası"
      - "Borca aykırılık hâlinde alacaklıya kalacak ceza koşulu"
      - "Sözleşme sonunda iade edilecek güvence"
    dogru: 0
    aciklama: |
      TBK m. 177/1'e göre sözleşme yapılırken verilen para, cayma parası olarak değil sözleşmenin yapıldığına kanıt olarak verilmiş sayılır. Bu bir karinedir. Paranın cayma parası ya da başka bir nitelikte olduğunu iddia eden taraf bunu ispatlamalıdır.

  - soru: |
      Aksine sözleşme veya yerel âdet yoksa bağlanma parası hakkında hangisi doğrudur?
    siklar:
      - "Esas alacaktan düşülmeden alan tarafa kalır."
      - "Esas alacaktan düşülür."
      - "Sözleşme ifa edilince parayı verene iade edilir."
      - "Alan taraf, parayı iki katıyla geri vermedikçe sözleşmeden kurtulamaz."
    dogru: 1
    aciklama: |
      TBK m. 177/2'ye göre aksine sözleşme veya yerel âdet olmadıkça bağlanma parası esas alacaktan düşülür. Paranın alacaktan düşülmeden alana kalması eski Borçlar Kanunu'nun kuralıydı. TBK bu kuralı bırakmıştır.

  - soru: |
      Ayşe, Burak'tan bir tekne almak üzere anlaşmış ve sözleşmede cayma parası olduğu açıkça yazılan 40.000 TL'yi Burak'a vermiştir. Burak sözleşmeden caymaktadır. Burak Ayşe'ye ne ödemelidir?
    siklar:
      - "Yalnız aldığı 40.000 TL'yi iade eder."
      - "Aldığının iki katı olan 80.000 TL'yi geri verir."
      - "40.000 TL'yi iade eder ve ayrıca iki katı ceza olarak 80.000 TL öder."
      - "Cayma hakkı yalnız parayı verene ait olduğu için Burak cayamaz, tekneyi teslim etmek zorundadır."
    dogru: 1
    aciklama: |
      TBK m. 178'e göre cayma parası kararlaştırılmışsa taraflardan her biri caymaya yetkilidir. Parayı almış olan cayarsa aldığının iki katını geri verir. Burak 80.000 TL öder; bunun 40.000 TL'si iade, 40.000 TL'si cayma bedelidir. Ayrıca iki kat ceza ödemez.

  - soru: |
      Cayma parası kararlaştırılan bir sözleşmede parayı **veren** taraf sözleşmeden cayarsa ne olur?
    siklar:
      - "Verdiği parayı bırakır."
      - "Verdiği paranın iki katını öder."
      - "Parayı geri alır, ama karşı tarafın zararını tazmin eder."
      - "Cayma için karşı tarafın borca aykırı davranmış olması gerekir."
    dogru: 0
    aciklama: |
      TBK m. 178'e göre parayı vermiş olan cayarsa verdiğini bırakır. İki kat kuralı yalnız parayı alan tarafın caymasında uygulanır. Cayma bir hakkın kullanılmasıdır, karşı tarafın borca aykırılığı aranmaz.

  - soru: |
      Mert, Nihat'a ait tapulu bir dükkânı satın almak için bir emlak ofisinde yazılı ama resmî şekle uyulmamış bir sözleşme imzalamış ve 150.000 TL "cayma akçesi" vermiştir. Satıcı vazgeçerse iki katını ödeyecektir. Nihat vazgeçmiştir. Mert'in hakkı nedir?
    siklar:
      - "300.000 TL'yi isteyebilir, çünkü cayma parası kaydı sözleşmeden bağımsızdır."
      - "Verdiği 150.000 TL'yi sebepsiz zenginleşme hükümlerine göre geri isteyebilir. Satış vaadi resmî şekilde yapılmadığından geçersizdir ve fer'i cayma parası kaydına dayanılamaz."
      - "Dükkânın kendi adına tescilini isteyebilir."
      - "Hiçbir şey isteyemez, çünkü geçersiz sözleşmeye bilerek giren taraf verdiğini geri alamaz."
    dogru: 1
    aciklama: |
      Taşınmaz satışı ve satış vaadi resmî şekilde düzenlenmedikçe geçerli olmaz (TBK m. 237, TMK m. 706). Cayma parası asıl sözleşmeye bağlı fer'i bir kayıttır, bu yüzden ona da dayanılamaz. Geçersiz bir sebebe dayanan zenginleşme geri verilir (TBK m. 77). Mert 150.000 TL'yi geri ister.

  - soru: |
      Bir sözleşmenin hiç veya gereği gibi ifa edilmemesi için ceza kararlaştırılmış, sözleşmede başka bir açıklık yoktur. Alacaklının hakkı nedir?
    siklar:
      - "Hem borcun hem cezanın ifasını birlikte isteyebilir."
      - "Yalnız cezayı isteyebilir, ifa talebi düşmüştür."
      - "Ya borcun ya da cezanın ifasını isteyebilir."
      - "Önce zararını ispatlamadıkça cezayı isteyemez."
    dogru: 2
    aciklama: |
      TBK m. 179/1'e göre bu durumda, aksi sözleşmeden anlaşılmadıkça alacaklı ya borcun ya da cezanın ifasını isteyebilir. İkisini birlikte isteme imkânı, zaman veya yer için kararlaştırılan cezaya (TBK m. 179/2) özgüdür. Zarar ispatı da gerekmez (TBK m. 180/1).

  - soru: |
      Yüklenici, deponun inşaatını 1 Mart'ta teslim edecek, gecikilen her gün için 5.000 TL ödeyecektir. Depo 20 gün geç teslim edilmiş, iş sahibi Elif teslim tutanağını hiçbir not düşmeden imzalamıştır. Elif iki ay sonra 100.000 TL gecikme cezası istemektedir. Sözleşmede çekinceye ilişkin bir hüküm yoktur ve Elif teslimden önce de bir bildirim yapmamıştır. Hangisi doğrudur?
    siklar:
      - "Ceza istenebilir, çünkü ifaya eklenen ceza zamanaşımı dolana kadar her zaman istenir."
      - "Ceza istenemez, çünkü gecikmiş ifa çekincesiz kabul edilmiştir."
      - "Ceza istenebilir, ama yalnız Elif zararını ispatlarsa."
      - "Ceza istenemez, çünkü gecikme cezası yalnız para borçlarında kararlaştırılabilir."
    dogru: 1
    aciklama: |
      Zaman için kararlaştırılan ceza ifaya eklenen cezadır. Alacaklı ifayı çekincesiz kabul etmişse ceza istenemez (TBK m. 179/2). Yargıtay'a göre çekince ifa anında açıkça yapılmalıdır. Sonradan yapılan istem, kaybedilmiş hakkı geri getirmez.

  - soru: |
      Yargıtay'ın yerleşik uygulamasına göre ifaya eklenen cezada **çekince** hakkında hangisi doğrudur?
    siklar:
      - "Çekince, dava açılıncaya kadar her zaman yapılabilir."
      - "Çekince yalnız noter ihtarnamesiyle yapılabilir."
      - "Çekince ifa anında açıkça yapılmalıdır. Teslim tutanağına not, ifadan önce yazılı bildirim ya da bedelden ceza tutarının kesilmesi yeterlidir."
      - "Çekince yalnız sözleşmede ayrıca öngörülmüşse gerekir, aksi hâlde hiç aranmaz."
    dogru: 2
    aciklama: |
      Hukuk Genel Kurulu, çekincenin ifa anında açıkça yapılması gerektiğini, bunun tutanağa not, ifadan önce yazılı bildirim ya da bedelden kesme gibi yollarla gerçekleşebileceğini belirtir. Kanunun kuralı çekincesiz kabulde cezanın düşmesidir (TBK m. 179/2). Çekinceyi gereksiz kılmak için sözleşmede bunun ayrıca kararlaştırılması gerekir.

  - soru: |
      Bir sözleşmede "Borçlu 200.000 TL ödeyerek sözleşmeden dönebilir" anlamına gelebilecek belirsiz bir kayıt vardır. Borçlu cezayı ödeyip sözleşmeden kurtulmak istemektedir. İspat yükü kimdedir?
    siklar:
      - "Alacaklı, kaydın dönme cezası olmadığını ispat eder."
      - "Borçlu, cezayı ödeyerek sözleşmeyi sona erdirmeye yetkili olduğunu ispat eder."
      - "İspat yükü yoktur, belirsiz kayıt her zaman borçlu lehine dönme cezası sayılır."
      - "Hâkim kendiliğinden araştırır, taraflara ispat yükü düşmez."
    dogru: 1
    aciklama: |
      TBK m. 179/3, borçlunun kararlaştırılan cezayı ifa ederek sözleşmeyi dönme veya fesih yoluyla sona erdirmeye yetkili olduğunu ispat etme hakkını saklı tutar. Yani dönme cezası karine değildir, ispat yükü borçludadır. İspatlayamazsa kayıt seçimlik ya da ifaya eklenen ceza olarak değerlendirilir.

  - soru: |
      Alacaklı, borçlunun sözleşmeye aykırılığı yüzünden hiçbir zarara uğramamıştır. Kararlaştırılan ceza hakkında hangisi doğrudur?
    siklar:
      - "Zarar olmadığı için ceza istenemez."
      - "Ceza, alacaklı hiçbir zarara uğramamış olsa bile istenir."
      - "Ceza ancak yarısına indirilerek istenebilir."
      - "Alacaklı en azından manevi zararını ispatlamalıdır."
    dogru: 1
    aciklama: |
      TBK m. 180/1'e göre alacaklı hiçbir zarara uğramamış olsa bile kararlaştırılan cezanın ifası gerekir. Ceza koşulu alacaklıyı zararı ispat yükünden kurtarır. Zararın yokluğu ancak hâkimin indirim değerlendirmesinde bir ölçüt olabilir (TBK m. 182/3).

  - soru: |
      TBK m. 180/2'ye göre alacaklının zararı kararlaştırılan cezayı aşıyorsa, aşan miktar hakkında hangisi doğrudur?
    siklar:
      - "Borçlu kendisine hiçbir kusur yüklenemeyeceğini ispat etmedikçe aşan miktarı öder."
      - "Aşan miktar hiçbir durumda istenemez, ceza üst sınırdır."
      - "Alacaklı, borçlunun kusuru bulunduğunu ispat etmedikçe aşan miktarı isteyemez."
      - "Aşan miktar kusur aranmaksızın her zaman istenir."
    dogru: 2
    aciklama: |
      TBK m. 180/2: "Alacaklının uğradığı zarar kararlaştırılan ceza tutarını aşıyorsa alacaklı, borçlunun kusuru bulunduğunu ispat etmedikçe aşan miktarı isteyemez." Borçlunun kusursuzluğunu ispat etmesi gerektiğini söyleyen kural, genel sözleşmeye aykırılık hükmüdür (TBK m. 112). Aşan zarar için kanun ispat yükünü alacaklıya yüklemiştir.

  - soru: |
      Sözleşmede 100.000 TL ceza kararlaştırılmıştır. Alacaklının ispatladığı zarar 160.000 TL'dir ve borçlunun kasten ifa etmediği de ispatlanmıştır. Alacaklı toplam ne kadar alabilir?
    siklar:
      - "100.000 TL"
      - "160.000 TL"
      - "260.000 TL"
      - "60.000 TL"
    dogru: 1
    aciklama: |
      Alacaklı cezayı (100.000 TL) zarar ispatına gerek olmadan alır. Cezayı aşan 60.000 TL'yi ise borçlunun kusurunu ispatladığı için ayrıca alır (TBK m. 180/2). Toplam 160.000 TL'dir. Aşan miktar cezaya eklenen fark kadardır. Ceza ile zararın tamamı toplanmaz.

  - soru: |
      Bir eşya satışında "alıcı taksitlerden birini ödemezse ve satıcı sözleşmeden dönerse ödenmiş bedeller satıcıda kalır" kaydı vardır. Bu kayda hangi hükümler uygulanır?
    siklar:
      - "Hiçbir sınırlama olmaksızın sözleşme serbestisi gereği aynen uygulanır."
      - "Bağlanma parası hükümleri uygulanır ve ödenenler alacaktan düşülür."
      - "Ceza koşuluna ilişkin hükümler uygulanır; taksitle satışa ilişkin özel hükümler saklıdır."
      - "Kayıt kesin hükümsüzdür, ödenenler her durumda faiziyle iade edilir."
    dogru: 2
    aciklama: |
      TBK m. 181'e göre ceza koşuluna ilişkin hükümler, dönme durumunda ifa edilmiş kısmın alacaklıya kalacağını öngören sözleşmelere de uygulanır. Bu yüzden hâkim aşırı bulduğu tutarı indirebilir. Taksitle satışa ilişkin hükümler ise saklıdır (TBK m. 259-260).

  - soru: |
      Asıl borcun ifası, borçlunun sorumlu tutulamayacağı bir sebeple sonradan imkânsız hâle gelmiştir. Sözleşmede bu konuda özel bir kayıt yoktur. Ceza hakkında hangisi doğrudur?
    siklar:
      - "Cezanın ifası istenemez."
      - "Ceza her durumda istenir, çünkü zarar şartı yoktur."
      - "Cezanın yarısı istenir."
      - "Ceza istenir, ama hâkim kendiliğinden indirir."
    dogru: 0
    aciklama: |
      TBK m. 182/2'ye göre asıl borç, aksi kararlaştırılmadıkça sonradan borçlunun sorumlu tutulamayacağı bir sebeple imkânsız hâle gelmişse cezanın ifası istenemez. Taraflar bu durumda da cezanın ödeneceğini kararlaştırabilirdi. Böyle bir kayıt yoksa ceza istenemez.

  - soru: |
      Bir sözleşmedeki ceza koşulu kaydı ahlaka aykırılık sebebiyle geçersizdir. Asıl borç hakkında hangisi doğrudur?
    siklar:
      - "Asıl borç da kendiliğinden geçersiz olur."
      - "Ceza koşulunun geçersizliği asıl borcun geçerliliğini etkilemez."
      - "Asıl borç, alacaklı isterse geçersiz sayılır."
      - "Asıl borç eksik borca dönüşür."
    dogru: 1
    aciklama: |
      TBK m. 182/2'nin ikinci cümlesine göre ceza koşulunun geçersiz olması veya borçlunun sorumlu tutulamayacağı bir sebeple sonradan imkânsızlaşması asıl borcun geçerliliğini etkilemez. Fer'ilik tek yönlüdür: asıl borç düşerse ceza düşer, tersi olmaz.

  - soru: |
      Tacir olmayan borçlu, davada cezanın aşırı olduğunu ileri sürmemiş ve indirim talep etmemiştir. Hâkim ne yapmalıdır?
    siklar:
      - "Talep olmadığı için cezanın tamamına hükmetmelidir."
      - "Aşırılığı kendiliğinden değerlendirmeli, aşırı görürse cezayı indirmelidir."
      - "Ancak alacaklı kabul ederse indirim yapabilir."
      - "Yalnız ayrı bir indirim davası açılırsa indirim yapabilir."
    dogru: 1
    aciklama: |
      TBK m. 182/3'e göre hâkim aşırı gördüğü ceza koşulunu kendiliğinden indirir. Yargıtay, tacir olmayan borçlu ileri sürmese bile hâkimin indirim gerekip gerekmediğini incelemesi gerektiğini, bunu yapmadan cezanın tamamına hükmetmenin bozma sebebi olduğunu kabul eder.

  - soru: |
      Akaryakıt dağıtım şirketi ile bayilik sözleşmesi yapan Y Petrol Ltd. Şti., sözleşmeyi haksız feshetmiş ve 2.000.000 TL ceza ödemeye mahkûm edilmek istenmektedir. Y Ltd. Şti. cezanın aşırı olduğunu ileri sürerek indirim istemektedir. Hangisi doğrudur?
    siklar:
      - "Hâkim, TBK m. 182/3 uyarınca her durumda kendiliğinden indirim yapar."
      - "Y Ltd. Şti. tacir olduğundan aşırılık iddiasıyla indirim isteyemez. Ancak ceza ekonomik yıkımına yol açacak ağırlıktaysa ahlaka aykırılık gerekçesiyle kısmen ya da tamamen iptal edilebilir."
      - "Tacirler hiçbir şekilde korunmaz, cezanın tamamı ödenir."
      - "Alacaklı da tacir olduğu için indirim mümkündür."
    dogru: 1
    aciklama: |
      Ticaret şirketleri tacirdir (TTK m. 16/1). Tacir borçlu, aşırı ceza iddiasıyla indirimini mahkemeden isteyemez (TTK m. 22). Yargıtay'a göre cezanın tacirin ekonomik mahvına yol açacak derecede ağır olması ahlaka aykırılıktır ve kısmen ya da tamamen iptal mümkündür. Bu, sözleşme tarihindeki ekonomik duruma göre bilirkişiyle objektif biçimde araştırılır.

  - soru: |
      Tacir olan Z Mobilya A.Ş., tacir olmayan Ece'ye mutfak dolabı yapmayı üstlenmiştir. Ece, sözleşmede kararlaştırılan cezayı ödemekle yükümlü hâle gelmiş ve indirim istemektedir. Hangisi doğrudur?
    siklar:
      - "Alacaklı tacir olduğu için TTK m. 22 uygulanır, Ece indirim isteyemez."
      - "TTK m. 22 borçlunun tacir olmasına bakar. Ece tacir olmadığından hâkim aşırı cezayı indirebilir."
      - "Taraflardan biri tacir olduğu için iş ticari sayılır ve indirim yasağı iki taraf için de geçerlidir."
      - "Ece ancak ekonomik yıkımını ispatlarsa indirim isteyebilir."
    dogru: 1
    aciklama: |
      TTK m. 22'deki yasak "tacir sıfatını haiz borçlu" için konmuştur. Borçlu Ece tacir olmadığından TBK m. 182/3 uygulanır ve hâkim aşırı cezayı kendiliğinden indirir. İşin bir taraf için ticari olmasının diğeri için de ticari sayılmasına yol açması (TTK m. 19/2) sonucu değiştirmez, çünkü yasak borçlunun sıfatına bağlıdır. Ekonomik yıkım ölçütü tacir borçlu için geliştirilmiş bir istisnadır.

  - soru: |
      Bir şirket, işçiyle yaptığı iş sözleşmesine "işçi süresinden önce ayrılırsa altı aylık ücreti tutarında ceza öder" kaydını koymuş, işveren için hiçbir ceza öngörmemiştir. Bu kayıt hakkında hangisi doğrudur?
    siklar:
      - "Geçerlidir, ama hâkim aşırı bulursa indirir."
      - "Geçersizdir, çünkü hizmet sözleşmelerine sadece işçi aleyhine konulan ceza koşulu geçersizdir."
      - "Geçerlidir, çünkü taraflar cezanın miktarını serbestçe belirler."
      - "Yalnız işçi tacirse geçersizdir."
    dogru: 1
    aciklama: |
      TBK m. 420/1'e göre hizmet sözleşmelerine sadece işçi aleyhine konulan ceza koşulu geçersizdir. Miktar serbestliği (TBK m. 182/1) bu özel hükmü aşamaz. İşçi lehine konulan ya da iki taraflı ceza ise kural olarak geçerlidir.

  - soru: |
      Yargıtay'ın yerleşik uygulamasına göre iş sözleşmesindeki iki taraflı ceza koşulunda işçi aleyhine öngörülen ceza, işveren aleyhine öngörülenden fazlaysa sonuç nedir?
    siklar:
      - "Kayıt tümüyle geçersiz olur, iki taraf da ceza isteyemez."
      - "Kayıt aynen uygulanır, çünkü karşılıklılık şartı sağlanmıştır."
      - "Kayıt tümden geçersiz olmaz, ama işçinin yükümlülüğü işverenin sorumlu olduğu miktar ve hâlleri aşamaz."
      - "Yalnız işçinin cezası geçerli kalır, işverenin cezası düşer."
    dogru: 2
    aciklama: |
      Yargıtay, işçi aleyhine cezanın koşulları ve miktarı bakımından işverenin sorumluluğunu aşamayacağını kabul eder. Eşitsizlik varsa kayıt tümden geçersiz sayılmaz, işçinin yükümlülüğü işverenin sorumlu olduğu ölçüye çekilir. Bu yaklaşım TBK m. 420/1'deki işçiyi koruma amacına dayanır.

  - soru: |
      Zeynep ile Can nişanlanırken, evlenmekten kaçınan tarafın diğerine 500.000 TL ceza ödeyeceğini yazılı olarak kararlaştırmışlardır. Can nişanı bozmuştur. Hangisi doğrudur?
    siklar:
      - "Zeynep 500.000 TL'yi dava edebilir, hâkim aşırı bulursa indirir."
      - "Evlenmeden kaçınma hâli için öngörülen ceza şartı dava edilemez. Ancak yapılan ödemeler de geri istenemez."
      - "Ceza şartı geçerlidir ve indirilemez."
      - "Zeynep yalnız cezanın yarısını dava edebilir."
    dogru: 1
    aciklama: |
      TMK m. 119/2'ye göre evlenmeden kaçınma hâli için öngörülen cayma tazminatı veya ceza şartı dava edilemez; ancak yapılan ödemeler de geri istenemez. Bu, ceza koşulu hükümlerine göre özel bir kuraldır. Can ödemeyi kendiliğinden yapmış olsaydı geri isteyemezdi.

olaylar:
  - olay: |
      Mehmet, 3 Mart 2025'te galeri işleten Zeynep'le ikinci el bir otomobilin 1.200.000 TL bedelle satışında anlaşır. Aynı gün Zeynep'e 60.000 TL öder. Zeynep'in verdiği belgede yalnız "60.000 TL kapora alınmıştır" yazmaktadır. Aracın teslimi ve kalan bedelin ödenmesi bir hafta sonra yapılacaktır. İki gün sonra Mehmet, daha ucuz bir araç bulduğunu, "kaporamı yakıp vazgeçiyorum" diyerek aracı almayacağını bildirir. Zeynep ise sözleşmenin ifasında ısrar etmekte, ayrıca "kapora her durumda bende kalır" demektedir.

      Mehmet ayrıca, Hasan'a ait tapulu bir arsayı 4.000.000 TL'ye satın almak için bir emlak ofisinde Hasan'la yazılı bir sözleşme imzalamıştır. Sözleşme noterde ya da tapuda yapılmamıştır. Sözleşmede "Alıcı 100.000 TL cayma akçesi vermiştir. Alıcı vazgeçerse bu parayı geri isteyemez. Satıcı vazgeçerse aldığının iki katını öder." yazmaktadır. Hasan, arsayı daha yüksek bedelle başkasına satıp tapuda devretmiş ve Mehmet'e 100.000 TL'yi iade etmiştir. Mehmet, sözleşme gereği 100.000 TL daha ödenmesini istemektedir.

      1. Otomobil satışında verilen 60.000 TL'nin niteliğini belirleyiniz. Mehmet "kaporayı yakarak" sözleşmeden kurtulabilir mi? Aracı alsaydı ne kadar daha ödeyecekti?
      2. Zeynep'in "kapora her durumda bende kalır" görüşünü değerlendiriniz.
      3. Mehmet, Hasan'dan 100.000 TL daha isteyebilir mi? Arsa için sözleşme resmî şekilde (noterde düzenleme şeklinde satış vaadi olarak) yapılmış olsaydı sonuç ne olurdu?
    olcut:
      - {tespit: "60.000 TL'nin karine gereği bağlanma parası sayılması ve Mehmet'e cayma hakkı vermemesi", puan: 20, madde: "TBK m. 177"}
      - {tespit: "Bağlanma parasının esas alacaktan düşülmesi: kalan bedelin 1.140.000 TL olması", puan: 10, madde: "TBK m. 177"}
      - {tespit: "Mehmet'in vazgeçmesinin borca aykırılık olması; Zeynep'in ifa ya da temerrüt hükümlerine göre dönme; dönmede bağlanma parasının iadesi ve ispatlanan zararın düşülmesi", puan: 20, madde: "TBK m. 125"}
      - {tespit: "Arsa sözleşmesindeki kaydın cayma parası niteliği", puan: 10, madde: "TBK m. 178"}
      - {tespit: "Resmî şekil eksikliği nedeniyle sözleşmenin ve fer'i cayma parası kaydının geçersizliği; yalnız verilen paranın sebepsiz zenginleşmeyle iadesi", puan: 25, madde: "TBK m. 237"}
      - {tespit: "Sözleşme geçerli olsaydı Hasan'ın aldığının iki katını geri vermesi ve Mehmet'in 100.000 TL daha isteyebilmesi", puan: 15, madde: "TBK m. 178"}
    cozum: |
      **Nitelendirme:** Otomobil satışı şekle bağlı olmayan, geçerli bir taşınır satışıdır. 60.000 TL sözleşme kurulurken verilmiştir. Arsa sözleşmesi ise taşınmaz satışına yöneliktir ve resmî şekle tabidir.

      **Hukuki sorunlar:** (1) Kaporanın niteliği ve cayma hakkı verip vermediği, (2) alıcının vazgeçmesi hâlinde paranın akıbeti, (3) şekle aykırı sözleşmedeki cayma parası kaydının hükmü.

      **İlgili hükümler:** TBK m. 77, TBK m. 125, TBK m. 177, TBK m. 178, TBK m. 237, TMK m. 706.

      **Değerlendirme:**

      *1. 60.000 TL'nin niteliği:* Belgede yalnız "kapora" yazmaktadır. Tarafların cayma parası kararlaştırdığına dair bir olgu yoktur. TBK m. 177/1'e göre sözleşme yapılırken verilen para, cayma parası olarak değil sözleşmenin yapıldığına kanıt olarak verilmiş sayılır. Paranın cayma parası olduğunu iddia eden Mehmet bunu ispatlamak zorundadır, olayda bunu gösteren bir olgu yoktur. Bu nedenle para **bağlanma parasıdır.** Bağlanma parası cayma hakkı vermez. Mehmet "kaporayı yakarak" sözleşmeden kurtulamaz. Vazgeçme beyanı, sözleşmeye aykırı bir ifadan kaçınmadır. Aracı alsaydı aksine sözleşme ya da yerel âdet bulunmadığı için 60.000 TL esas alacaktan düşülecek (TBK m. 177/2), Mehmet **1.140.000 TL** daha ödeyecekti.

      *2. "Kapora her durumda bende kalır" görüşü:* Bu görüş TBK'ya uygun değildir. Paranın alacaktan düşülmeden alana kalması eski Kanun'un kuralıydı. Zeynep sözleşmeye bağlı kalıp aracın alınmasını ve bedelin ödenmesini isteyebilir. Alıcı temerrüde düşerse temerrüt hükümlerine göre sözleşmeden de dönebilir (TBK m. 125; temerrüdün şartları ayrı konudur). Dönme hâlinde taraflar aldıklarını geri verir, bağlanma parası da iade edilir. Ancak Yargıtay'a göre Zeynep, Mehmet'in borca aykırılığından doğan zararını ispatlarsa bu tutarı iade edeceği paradan düşebilir. TBK m. 125/3'e göre Mehmet temerrüdünde kusursuz olduğunu ispat edemezse Zeynep sözleşmenin hükümsüz kalmasından doğan zararını isteyebilir. Zararını ispatlayamazsa 60.000 TL'nin tamamını iade eder.

      *3. Arsa sözleşmesi:* "Satıcı vazgeçerse aldığının iki katını öder, alıcı vazgeçerse geri isteyemez" kaydı, her iki tarafa cayma imkânı veren bir **cayma parası** kaydıdır (TBK m. 178). Ancak taşınmaz satışı ve satış vaadi resmî şekilde düzenlenmedikçe geçerli olmaz (TBK m. 237, TMK m. 706). Emlak ofisinde yapılan yazılı sözleşme geçersizdir. Cayma parası fer'idir, geçersiz sözleşmedeki kayda dayanılarak 100.000 TL daha istenemez. Geçersiz bir sebebe dayanarak elde edilen 100.000 TL sebepsiz zenginleşme hükümlerine göre iade edilmelidir (TBK m. 77/2). Hasan bunu zaten iade etmiştir. Mehmet'in başka bir istemi yoktur.

      *Resmî şekil olsaydı:* Noterde düzenleme şeklinde yapılan satış vaadi geçerli olurdu, cayma parası kaydı da geçerli olurdu. Hasan'ın arsayı başkasına satması, cayma iradesini açıkça gösterir. Parayı alan taraf caydığı için Hasan aldığının iki katını, yani **200.000 TL** geri vermek zorundadır. 100.000 TL'yi iade ettiğinden Mehmet 100.000 TL daha isteyebilir. Hasan cayma hakkını kullandığı için Mehmet arsanın kendisine devrini isteyemez.

      **Sonuç:**
      - 60.000 TL bağlanma parasıdır. Mehmet bunu bırakarak sözleşmeden kurtulamaz. Aracı alsaydı 1.140.000 TL daha ödeyecekti.
      - Kapora kendiliğinden Zeynep'te kalmaz. Dönme hâlinde iade edilir, Zeynep ancak ispatladığı zararı düşebilir.
      - Arsa sözleşmesi şekle aykırı olduğu için Mehmet 100.000 TL daha isteyemez. Resmî şekil olsaydı 200.000 TL'ye tamamlanması için 100.000 TL daha isteyebilirdi.

  - olay: |
      Kuru Gıda A.Ş., 10 Ocak 2025'te Makine Ltd. Şti. ile 3.000.000 TL bedelli bir paketleme makinesinin üretimi için eser sözleşmesi yapar. Makine 1 Haziran 2025'te fabrikada teslim edilecektir. Sözleşmede iki ceza kaydı vardır:
      - (a) "Teslimde gecikilen her gün için yüklenici 10.000 TL ceza öder."
      - (b) "Makine hiç teslim edilmezse yüklenici 1.500.000 TL ceza öder."

      Makine Ltd. Şti., kendisine daha yüksek kâr bırakan başka bir müşterinin siparişine öncelik verir ve makineyi 30 gün gecikmeyle, 1 Temmuz 2025'te teslim eder. Teslim tutanağına Kuru Gıda'nın yetkilisi "Gecikme cezası alacağımız saklıdır" notunu düşer. Kuru Gıda, gecikme yüzünden bir ihracat siparişini kaçırdığını ve bundan 500.000 TL zarar gördüğünü belgeleriyle ispatlar. Makine Ltd. Şti.'nin başka bir müşterinin işine öncelik verdiği de yazışmalarla ispatlanmıştır.

      Kuru Gıda 500.000 TL'nin ödenmesi için dava açar. Makine Ltd. Şti. savunmasında cezanın aşırı olduğunu ve hâkimin bunu indirmesi gerektiğini ileri sürer. Makine Ltd. Şti.'nin ekonomik durumuna ilişkin bir iddia ya da olgu yoktur.

      1. Sözleşmedeki ceza kayıtlarını nitelendiriniz. Makine hiç teslim edilmeseydi Kuru Gıda hem makinenin teslimini hem 1.500.000 TL'yi isteyebilir miydi?
      2. Kuru Gıda gecikme cezasını isteyebilir mi? Tutanağa not düşülmeseydi sonuç ne olurdu?
      3. Kuru Gıda 500.000 TL'nin tamamını alabilir mi?
      4. Makine Ltd. Şti.'nin indirim savunmasını değerlendiriniz.
    olcut:
      - {tespit: "(b) kaydının seçimlik ceza olması; alacaklının ya ifayı ya cezayı isteyebilmesi", puan: 15, madde: "TBK m. 179"}
      - {tespit: "(a) kaydının ifaya eklenen ceza olması; teslimle birlikte 300.000 TL cezanın istenebilmesi", puan: 15, madde: "TBK m. 179"}
      - {tespit: "Tutanaktaki notun ifa anında yapılmış çekince olması; çekincesiz kabulde ceza hakkının düşmesi", puan: 20, madde: "TBK m. 179"}
      - {tespit: "Cezayı aşan 200.000 TL için alacaklının borçlunun kusurunu ispat etmesi; kusur ispatlandığından toplam 500.000 TL", puan: 20, madde: "TBK m. 180"}
      - {tespit: "Tacir borçlunun aşırılık iddiasıyla indirim isteyememesi; hâkimin kendiliğinden de indirememesi", puan: 20, madde: "TTK m. 22"}
      - {tespit: "Ekonomik yıkım istisnasının şartlarının bulunmaması", puan: 10, madde: "TBK m. 27"}
    cozum: |
      **Nitelendirme:** Taraflar arasında eser sözleşmesi vardır. Sözleşmede iki ayrı ceza koşulu bulunur. Yüklenici Makine Ltd. Şti. bir ticaret şirketidir, bu yüzden tacirdir (TTK m. 16/1).

      **Hukuki sorunlar:** (1) Ceza kayıtlarının türü, (2) gecikmiş ifanın kabulünde çekince, (3) cezayı aşan zarar, (4) tacir borçlu bakımından indirim.

      **İlgili hükümler:** TBK m. 27, TBK m. 112, TBK m. 179, TBK m. 180, TBK m. 182, TTK m. 16, TTK m. 19, TTK m. 22.

      **Değerlendirme:**

      *1. Kayıtların niteliği:* (b) kaydı, borcun **hiç ifa edilmemesi** için kararlaştırılmıştır. Sözleşmeden aksi anlaşılmadığı için **seçimlik cezadır** (TBK m. 179/1). Makine hiç teslim edilmeseydi Kuru Gıda ya makinenin teslimini ya da 1.500.000 TL cezayı isteyebilirdi, ikisini birden isteyemezdi. (a) kaydı ise borcun **belirlenen zamanda** ifa edilmemesi için kararlaştırılmıştır. Bu bir **ifaya eklenen cezadır** (TBK m. 179/2). Alacaklı, asıl borçla birlikte cezayı da isteyebilir. Makine teslim edildiğinden (b) kaydı artık gündemde değildir.

      *2. Gecikme cezası:* Gecikme 30 gündür, ceza 30 x 10.000 = **300.000 TL**'dir. İfaya eklenen cezada alacaklı, ifayı çekincesiz kabul ederse ceza hakkını kaybeder (TBK m. 179/2). Yargıtay'a göre çekince ifa anında açıkça yapılmalıdır ve teslim tutanağına düşülen not yeterlidir. Kuru Gıda'nın yetkilisi bu notu teslim sırasında düşmüştür. Ceza istenebilir. Makine Ltd. Şti., başka bir müşteriye öncelik vererek gecikmiştir. Gecikmede kusurludur ve kusursuzluğunu ispat edebileceği bir olgu yoktur. Tutanağa not düşülmeseydi ve sözleşmede çekince aranmayacağına ya da önceden saklı tutmaya ilişkin bir olgu bulunmasaydı, gecikmiş ifa çekincesiz kabul edilmiş olurdu ve ceza istenemezdi. Hâkim bunu kendiliğinden gözetirdi.

      *3. 500.000 TL'nin tamamı:* Zarar 500.000 TL, ceza 300.000 TL'dir. Cezayı aşan 200.000 TL için TBK m. 180/2 uygulanır: "Alacaklının uğradığı zarar kararlaştırılan ceza tutarını aşıyorsa alacaklı, borçlunun kusuru bulunduğunu ispat etmedikçe aşan miktarı isteyemez." Burada ispat yükü, TBK m. 112'deki genel kuraldan farklı olarak alacaklıdadır. Kuru Gıda hem zararını hem de Makine Ltd. Şti.'nin başka bir müşterinin işine bilerek öncelik verdiğini yazışmalarla ispatlamıştır. Bu nedenle 300.000 TL ceza ve 200.000 TL aşan zarar olmak üzere toplam **500.000 TL** isteyebilir. TBK m. 180/2'nin eleştirisine ilişkin tartışma sonucu değiştirmez, çünkü kusur zaten ispatlanmıştır.

      *4. İndirim savunması:* TBK m. 182/3'e göre hâkim aşırı gördüğü cezayı kendiliğinden indirir. Ancak TTK m. 22'ye göre tacir sıfatını haiz borçlu, aşırı ceza kararlaştırıldığı iddiasıyla indirimini mahkemeden isteyemez. Bu hüküm TBK m. 182/3'e bir istisnadır, bu yüzden hâkim kendiliğinden de indirim yapamaz. Makine Ltd. Şti. sözleşme yapılırken de tacirdir ve cezayı ticari işletmesiyle ilgili olarak üstlenmiştir (TTK m. 19/1). Yargıtay, cezanın tacirin ekonomik mahvına yol açacak derecede ağır olması hâlinde ahlaka aykırılık gerekçesiyle (TBK m. 27) kısmen ya da tamamen iptale izin verir. Olayda böyle bir iddia ve olgu yoktur. Üstelik 3.000.000 TL'lik bir işte 300.000 TL'lik ceza, ispatlanan 500.000 TL'lik zararın da altındadır.

      **Sonuç:**
      - (b) seçimlik, (a) ifaya eklenen cezadır. Hiç teslim olmasaydı Kuru Gıda ya teslimi ya 1.500.000 TL'yi isteyebilirdi.
      - Çekince konduğu için 300.000 TL gecikme cezası istenebilir. Not düşülmeseydi istenemezdi.
      - Kusur ispatlandığı için aşan 200.000 TL de istenir, toplam 500.000 TL'dir.
      - Tacir olan Makine Ltd. Şti.'nin indirim savunması reddedilmelidir.

  - olay: |
      X Yazılım A.Ş., 1 Eylül 2025'te iki yazılımcıyla bir yıllık iş sözleşmesi yapar.

      Selin'in sözleşmesinde şu kayıt vardır: "İşçi sözleşmeyi süresinden önce haklı bir neden olmaksızın sona erdirirse, kalan aylara ait ücretlerin toplamını ceza olarak öder." İşverene benzer bir yükümlülük yüklenmemiştir. Selin aylık 80.000 TL ücretle üç ay çalışır ve haklı bir neden olmaksızın ayrılır.

      Kerem'in sözleşmesinde ise şu kayıt vardır: "Taraflardan biri sözleşmeyi süresinden önce haklı bir neden olmaksızın sona erdirirse, karşı tarafa kalan aylara ait ücretlerin toplamını ceza olarak öder. İşçi, cezanın indirilmesini istemekten şimdiden feragat eder." Kerem aylık 90.000 TL ücretle bir ay çalışır ve daha yüksek ücret teklif eden rakip bir firmaya geçer. İşveren, Kerem'in yerine bir hafta içinde yeni bir yazılımcı almıştır.

      X Yazılım A.Ş., Selin'den 720.000 TL, Kerem'den 990.000 TL ceza istemektedir. Kerem davada yalnız işverenin hiçbir zarara uğramadığını savunmuş, indirim talep etmemiştir. İşveren ayrıca, kendisinin tacir olduğunu ve Kerem'in feragat ettiğini, bu yüzden indirim yapılamayacağını ileri sürmektedir.

      1. Selin ceza ödemek zorunda mıdır?
      2. Kerem'in sözleşmesindeki ceza kaydı geçerli midir?
      3. Kerem'in "işveren zarara uğramadı" savunmasını değerlendiriniz.
      4. Hâkim, Kerem'in talebi bulunmadığı, feragat kaydı ve işverenin tacir olması karşısında cezayı indirebilir mi? Hangi ölçütleri gözetir?
    olcut:
      - {tespit: "Selin'in sözleşmesindeki cezanın yalnız işçi aleyhine olduğu için geçersizliği", puan: 25, madde: "TBK m. 420"}
      - {tespit: "Kerem'in sözleşmesindeki cezanın karşılıklı ve eşit olduğu için geçerliliği", puan: 15, madde: "TBK m. 420"}
      - {tespit: "Cezanın zarar olmasa da istenebilmesi; zarar yokluğunun yalnız indirimde ölçüt olması", puan: 15, madde: "TBK m. 180"}
      - {tespit: "Hâkimin aşırı cezayı kendiliğinden indirmesi; önceden feragatin geçersizliği", puan: 20, madde: "TBK m. 182"}
      - {tespit: "TTK m. 22'nin borçlunun tacirliğine bakması; işverenin tacir olmasının önemsizliği", puan: 10, madde: "TTK m. 22"}
      - {tespit: "Yargıtay'ın oransal indirim ölçütleri: çalışılan süre, zarar yokluğu, ekonomik durum, işçinin ekonomik mahvına yol açmama", puan: 15, madde: "TBK m. 182"}
    cozum: |
      **Nitelendirme:** Taraflar arasında hizmet (iş) sözleşmeleri vardır. Sözleşmelere süreden önce haksız sona erdirmeye bağlı ceza koşulları konmuştur. Ceza koşuluna TBK m. 179-182 ve hizmet sözleşmesine özgü TBK m. 420 uygulanır.

      **Hukuki sorunlar:** (1) Yalnız işçi aleyhine cezanın geçerliliği, (2) iki taraflı cezanın geçerliliği, (3) zarar şartı, (4) indirimin kendiliğinden yapılması, önceden feragat ve tacirlik.

      **İlgili hükümler:** TBK m. 180, TBK m. 182, TBK m. 420, TTK m. 22.

      **Değerlendirme:**

      *1. Selin:* Kayıt yalnız işçiye ceza yüklemekte, işverene benzer bir yükümlülük getirmemektedir. TBK m. 420/1'e göre hizmet sözleşmelerine sadece işçi aleyhine konulan ceza koşulu geçersizdir. Selin 720.000 TL ceza ödemek zorunda değildir. Cezanın geçersizliği, işverenin kanundan doğabilecek başka haklarını ortadan kaldırmaz, ama bunlar ayrı konudur.

      *2. Kerem'in kaydı:* Ceza her iki taraf için ve aynı ölçüde kararlaştırılmıştır. Yargıtay'ın yerleşik uygulamasına göre karşılıklılık bulunan ceza kayıtları kural olarak geçerlidir. İşçinin cezası işverenin cezasını aşmamaktadır. Kayıt geçerlidir. Sözleşmenin İş Kanunu'ndaki objektif koşullar bakımından belirli süreli sayılıp sayılmayacağı tartışılsa bile sonuç değişmez. Yargıtay İçtihadı Birleştirme Hukuk Genel Kurulu, böyle sözleşmelerde süreden önce haksız feshe bağlı cezanın kararlaştırılan süre için geçerli olduğunu kabul etmiştir. Kerem haklı bir neden olmadan ayrıldığı için ceza doğmuştur: 11 x 90.000 = 990.000 TL.

      *3. Zarar savunması:* TBK m. 180/1'e göre alacaklı hiçbir zarara uğramamış olsa bile kararlaştırılan cezanın ifası gerekir. Bu savunma cezayı ortadan kaldırmaz. Ancak zararın yokluğu ya da azlığı, hâkimin aşırılık değerlendirmesinde önemli bir ölçüttür.

      *4. İndirim:*
      - **Talep yokluğu:** TBK m. 182/3'e göre hâkim aşırı gördüğü cezayı kendiliğinden indirir. Kerem'in indirim istememesi engel değildir.
      - **Feragat kaydı:** Yargıtay'a göre indirim imkânı borçluyu korumaya yönelik, kamu düzenine ilişkin bir kuraldır. Borçlunun indirimden önceden feragati geçersizdir. Bu kayıt hâkimi bağlamaz.
      - **Tacirlik:** TTK m. 22 "tacir sıfatını haiz borçlu" için konmuştur. Bakılan borçludur. Borçlu Kerem tacir değildir, alacaklı işverenin tacir olması önemsizdir.
      - **Ölçütler:** Yargıtay iş hukukunda, işçinin ekonomik mahvına yol açmayacak bir çözüm arar ve çalışılan süre ile çalışılması gereken süreyi oranlar. Hâkim ayrıca tarafların ekonomik durumunu, işverenin zararını, borçlunun aykırılıktan sağladığı yararı ve kusurun ağırlığını gözetir. Kerem on iki aylık sürenin yalnız birinde çalışmıştır. İşveren bir hafta içinde yerine yeni bir yazılımcı almış, olayda bir zarar ispatlanmamıştır. Öte yandan Kerem daha yüksek ücret için bilerek ayrılmıştır, bu da kusurun ağırlığında dikkate alınır. 990.000 TL'lik ceza bu koşullarda aşırıdır. Hâkim, miktarı denetlenebilir bir gerekçeyle önemli ölçüde indirmelidir. Kesin oran hâkimin takdirindedir.

      **Sonuç:**
      - Selin ceza ödemez, kayıt TBK m. 420/1 uyarınca geçersizdir.
      - Kerem'in kaydı geçerlidir ve zarar olmasa da ceza doğmuştur.
      - Hâkim, talep ve feragat kaydına bakmaksızın cezayı kendiliğinden indirir. İşverenin tacir olması buna engel değildir.

kartlar:
  - on: "Sözleşme yapılırken verilen para karine olarak nedir? (TBK m. 177/1)"
    arka: "Sözleşmenin yapıldığına kanıt olarak verilmiş bağlanma parası. Cayma parası olduğunu iddia eden ispatlar."
  - on: "Bağlanma parası esas alacaktan düşülür mü?"
    arka: "Evet, aksine sözleşme veya yerel âdet olmadıkça düşülür (TBK m. 177/2). Eski Kanun'da alana kalırdı."
  - on: "Bağlanma parası cayma hakkı verir mi?"
    arka: "Hayır. Parayı bırakıp sözleşmeden kurtulmak ancak cayma parası kararlaştırılmışsa mümkündür."
  - on: "Cayma parasında kim cayabilir, sonucu nedir? (TBK m. 178)"
    arka: "Her iki taraf. Veren cayarsa verdiğini bırakır; alan cayarsa aldığının iki katını geri verir."
  - on: "40.000 TL cayma parasını alan taraf cayarsa ne öder?"
    arka: "80.000 TL geri verir: 40.000 TL iade, 40.000 TL cayma bedeli."
  - on: "Şekle aykırı taşınmaz satışında 'kaporanın iki katı' istenebilir mi?"
    arka: "Hayır. Sözleşme geçersizdir, fer'i kayda dayanılamaz. Verilen para sebepsiz zenginleşmeyle geri istenir."
  - on: "Seçimlik ceza nedir? (TBK m. 179/1)"
    arka: "Borç hiç ya da gereği gibi ifa edilmezse alacaklı ya borcun ya cezanın ifasını ister, ikisini birden isteyemez."
  - on: "İfaya eklenen ceza nedir? (TBK m. 179/2)"
    arka: "Zaman veya yer için kararlaştırılan ceza. Alacaklı ifa ile birlikte cezayı da ister; açık feragat ya da çekincesiz kabulde ceza düşer."
  - on: "Çekince ne zaman ve nasıl yapılır?"
    arka: "İfa anında, açıkça: teslim tutanağına not, ifadan önce yazılı bildirim ya da bedelden ceza tutarının kesilmesi (Yargıtay)."
  - on: "Dönme cezasında ispat yükü kimdedir? (TBK m. 179/3)"
    arka: "Borçluda. Borçlu, cezayı ödeyerek sözleşmeyi sona erdirmeye yetkili olduğunu ispatlar."
  - on: "Zarar yoksa ceza istenir mi? (TBK m. 180/1)"
    arka: "Evet. Alacaklı hiçbir zarara uğramamış olsa bile ceza ödenir."
  - on: "Cezayı aşan zarar nasıl istenir? (TBK m. 180/2)"
    arka: "Alacaklı, borçlunun kusuru bulunduğunu ispat etmedikçe aşan miktarı isteyemez."
  - on: "TBK m. 180/2 genel kuraldan nasıl ayrılır?"
    arka: "TBK m. 112'de borçlu kusursuzluğunu ispatlar. Aşan zararda ise kusuru alacaklı ispatlar."
  - on: "Kısmi ifanın yanması kaydına hangi hükümler uygulanır? (TBK m. 181)"
    arka: "Ceza koşulu hükümleri. Taksitle satış hükümleri saklıdır."
  - on: "Taksitle satışta peşinat temerrüdü yüzünden devirden önce dönülürse ceza sınırı nedir?"
    arka: "Ceza koşulu peşin satış bedelinin yüzde onunu aşamaz (TBK m. 260/2)."
  - on: "Asıl borç geçersizse ceza istenir mi? (TBK m. 182/2)"
    arka: "Hayır. Kusursuz sonraki imkânsızlıkta da aksi kararlaştırılmadıkça istenmez. Cezanın geçersizliği ise asıl borcu etkilemez."
  - on: "Hâkim aşırı cezayı talep üzerine mi indirir? (TBK m. 182/3)"
    arka: "Hayır, kendiliğinden indirir. İndirimden önceden feragat geçersizdir."
  - on: "Tacir borçlu indirim isteyebilir mi? (TTK m. 22)"
    arka: "Hayır. Yalnız ceza ekonomik yıkımına yol açacak ağırlıktaysa ahlaka aykırılıkla kısmen ya da tamamen iptal edilebilir."
  - on: "TTK m. 22'de kimin tacirliğine bakılır?"
    arka: "Borçlunun. Tacirlik cezanın taahhüt edildiği anda aranır; alacaklının tacirliği önemsizdir."
  - on: "Hizmet sözleşmesinde hangi ceza geçersizdir? (TBK m. 420/1)"
    arka: "Sadece işçi aleyhine konulan ceza. İşçinin cezası işverenin cezasını da aşamaz (Yargıtay)."
  - on: "Nişanlılıkta ceza şartı dava edilebilir mi? (TMK m. 119/2)"
    arka: "Hayır. Ancak yapılan ödemeler de geri istenemez."
  - on: "Konut kirasında geç ödemeye ceza konabilir mi?"
    arka: "Hayır. Kira bedelinin zamanında ödenmemesi hâlinde ceza koşulu ödeneceğine ilişkin anlaşmalar geçersizdir (TBK m. 346)."
