      Alıcı, tapulu bir taşınmazı almak için satıcıyla noter ya da tapu dışında "cayma akçesinin verilmesine dair akit" başlıklı bir sözleşme yapmış ve 25.000 TL ödemiştir. Sözleşmeye göre satıcı vazgeçerse aldığının iki katını ödeyecektir. Satıcı satıştan vazgeçmiş ve 25.000 TL'yi senetle iade etmiştir. Alıcı, 50.000 TL için başlattığı takibe itirazın iptalini istemiştir. Asliye hukuk mahkemesi davayı kabul etmiş, Yargıtay 3. Hukuk Dairesi şekle aykırı sözleşmede ceza istenemeyeceği gerekçesiyle bozmuş, mahkeme kaydın bağlanma parası olduğunu belirterek direnmiştir. Hukuk Genel Kurulu, direnme kararını oy birliğiyle ve değişik gerekçeyle bozmuştur. Kurula göre kayıt bağlanma parası değil cayma parasıdır. Ancak resmî şekle uyulmadığı için sözleşme geçersizdir ve fer'i nitelikteki cayma parası kaydına dayanılamaz. Taraflar yalnız sebepsiz zenginleşme hükümlerine göre aldıklarını geri verir. Konuya katkısı: bağlanma parası, cayma parası ve ceza koşulu ayrımını ve fer'iliğin sonucunu gösterir.
