  - id: "76491600"
    ozet: |
      Bir tarım satış kooperatifinin ortağı, 2006'da kooperatife teslim ettiği fındığın bedelini alamayınca 2011'de ilamsız takip başlatmış ve anaparanın yanında takipten önceki dönem için işlemiş temerrüt faizi istemiştir. Kooperatif borcun muaccel olmadığını ve takipten önce temerrüde düşürülmediğini ileri sürerek itiraz etmiştir. İcra hukuk mahkemesi itirazın kesin olarak kaldırılmasına karar vermiş; Yargıtay 12. Hukuk Dairesi, belgede ödeme tarihi bulunmadığı için faizin ancak temerrüt tarihinden, olayda takip tarihinden istenebileceği gerekçesiyle bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu direnme kararını oybirliğiyle bozmuştur. Gerekçeye göre temerrüt faizi zarar ve kusur ispatı aranmadan işleyen asgari bir tazminattır, ama temerrüt için borcun muaccel olması yetmez, kural olarak ihtar da gerekir; vadesi kesin belirlenmemiş ve takipten önce ihtar yapılmamış alacakta takip öncesi için işlemiş temerrüt faizi istenemez. Konuya katkısı: TBK m. 117/1'deki ihtar şartının faizin başlangıcına etkisini gösterir.
  - id: "752470900"
    ozet: |
      Davacı 1999'da bir bankaya yatırdığı 450.000 TL'nin usulsüz olarak bir off-shore bankanın hesabına aktarılması üzerine açtığı davayı 2015'te kazanmış ve parasını 2016'da, yatırma tarihinden işletilen avans faiziyle tahsil etmiştir. Ardından 16 yıllık süreçte paranın satın alma gücünün düştüğünü ileri sürerek TBK m. 122'ye dayanan munzam zarar davası açmıştır. İlk derece mahkemesi zararın somut olarak ispatlanmadığı gerekçesiyle davayı reddetmiş, istinaf başvurusu esastan reddedilmiş; Yargıtay 11. Hukuk Dairesi yüksek enflasyon dönemlerinde zararın karine olarak kabul edilmesi ve sepet hesabı yapılması gerektiği gerekçesiyle bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu direnme kararını oybirliğiyle onamıştır. Gerekçeye göre aşkın zarar için para borcunda temerrüt, temerrüt faiziyle karşılanmayan zarar, temerrüde düşmekte kusur (karine) ve illiyet gerekir; enflasyon, kur artışı ve mevduat faizi gibi genel göstergeler davacıyı ispat yükünden kurtarmaz. Konuya katkısı: temerrüt faizinin kusur aranmadan işlediğini, aşkın zararın ise alacaklıya özgü somut vakıalarla ispatlanması gerektiğini gösterir.
  - id: "857187100"
    ozet: |
      Alacaklı, 5.212,93 avronun 1996'daki vade tarihinden itibaren devlet bankalarının avroya bir yıllık mevduatta ödediği en yüksek faizle tahsiline ilişkin ilama dayanarak bir bankaya karşı ilamlı takip başlatmıştır. Takip talebinde asıl alacağı ve işlemiş faizi takip tarihindeki kurla Türk lirasına çevirmiş, takipten sonrası için ise yine avro mevduatı faizi istemiştir. Borçlu bankanın şikâyeti üzerine icra mahkemesi, alacaklının fiilî ödeme günü kurunu seçtiğini kabul ederek işleyecek faize yönelik şikâyeti reddetmiş; Yargıtay 12. Hukuk Dairesi bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu direnme kararını oybirliğiyle bozmuştur. Gerekçeye göre alacaklı fiilî ödeme günündeki kuru seçerse alacak ödemeye kadar yabancı para alacağı olarak kalır ve vade tarihinden ödemeye kadar 3095 sayılı Kanun m. 4/a'daki faiz istenir; alacak vade ya da takip tarihindeki kurla Türk lirasına çevrilmişse o tarihten itibaren Türk lirası alacağıdır ve 3095 sayılı Kanun m. 1'e göre yasal faiz işler. Konuya katkısı: TBK m. 99/3'teki kur seçiminin faiz türünü de belirlediğini gösterir.
  - id: "792146600"
    ozet: |
      2011'deki bir trafik kazasında motorlu bisikletiyle yaralanan davacı, kazaya karışan ticari taksinin maliki, sürücüsü ve sigortacısına karşı maddi ve manevi tazminat davası açmış ve kaza tarihinden itibaren ticari faiz istemiştir. Mahkeme yasal faize hükmetmiş; Yargıtay (kapatılan) 17. Hukuk Dairesi, aracın ticari taksi olduğunu ve ticari faiz istendiğini belirterek avans faizine hükmedilmesi gerektiği gerekçesiyle bozmuştur. Mahkeme, ticari faizin zarar verenin değil zarar görenin niteliğine göre belirlenmesi gerektiğini söyleyerek direnmiştir. Hukuk Genel Kurulu, olay tarihindeki mülga 6762 sayılı TTK'nın ticari iş hükümlerini 3095 sayılı Kanun m. 2 ile birlikte değerlendirerek direnme kararını oy çokluğuyla bozmuştur. Gerekçeye göre avans faizi için borçlunun tacir olması ve borcun ticari işletmesiyle ilgili bulunması yeterlidir; alacaklının tacir olması gerekmez ve haksız fiil dahil her türlü sebepten doğan alacakta, açıkça istenmişse avans faizi uygulanır. Karşı oy, aracın trafikte ticari olarak kayıtlı olmasının tek başına tacir ve ticari iş sonucunu doğurmayacağını savunmuştur. Konuya katkısı: ticari işlerdeki temerrüt faizinde ölçütün borçlu tarafında arandığını gösterir.

sorular:
  - soru: |
      TBK m. 117/1'e göre borçlu temerrüdünün **kural olarak** gerçekleşmesi için aşağıdakilerden hangisi gerekir?
    siklar:
      - "Borcun muaccel olması ve alacaklının ihtarı"
      - "Borcun muaccel olması ve borçlunun gecikmede kusurlu olması"
      - "Alacaklının borçlu aleyhine dava açması"
      - "Borçlunun borcu ifa etmeyeceğini açıkça bildirmesi"
    dogru: 0
    aciklama: |
      TBK m. 117/1'e göre muaccel bir borcun borçlusu alacaklının ihtarıyla temerrüde düşer. Kusur temerrüdün şartı değildir; yalnız gecikme tazminatı gibi sonuçlarda önem taşır ve orada da kusursuzluğu borçlu ispatlar (TBK m. 118). Dava açılması ihtar yerine geçebilir ama zorunlu değildir.

  - soru: |
      Ali ile Burak arasındaki ödünç sözleşmesinde geri ödeme günü "1 Mart 2026" olarak yazılmıştır. Burak bu tarihte ödeme yapmaz, Ali de hiçbir ihtarda bulunmaz. Burak ne zaman temerrüde düşer?
    siklar:
      - "1 Mart 2026 gününün geçmesiyle, ihtara gerek olmadan"
      - "Ali'nin göndereceği ihtarname tebliğ edildiğinde"
      - "Ali dava açtığında"
      - "1 Mart 2026'dan itibaren otuz gün geçtiğinde"
    dogru: 0
    aciklama: |
      TBK m. 117/2'ye göre borcun ifa edileceği gün birlikte belirlenmişse borçlu, bu günün geçmesiyle ihtara gerek kalmadan temerrüde düşer. Otuz günlük süre, ticari işletmeler arasındaki mal ve hizmet tedarikinde ödeme günü belirlenmemişse uygulanan özel bir kuraldır (TTK m. 1530/4).

  - soru: |
      Ödeme günü kararlaştırılmamış muaccel bir borç için alacaklı, borçluya "tebliğden itibaren 7 gün içinde ödeyiniz" yazılı bir ihtarname gönderir. İhtarname 10 Mayıs'ta tebliğ edilir. Borçlu ne zaman temerrüde düşer?
    siklar:
      - "Borcun doğduğu gün"
      - "İhtarnamenin postaya verildiği gün"
      - "10 Mayıs'ta, tebliğ anında"
      - "İhtarnamede verilen yedi günlük sürenin bitimiyle"
    dogru: 3
    aciklama: |
      Muacceliyet tek başına temerrüt doğurmaz; ihtar gerekir (TBK m. 117/1). Yargıtay'a göre ihtarda süre vermek zorunlu değildir, ama süre verilmişse temerrüt bu sürenin bitiminde gerçekleşir. Tebliğ günü sayılmadığından süre 17 Mayıs'ta dolar (TBK m. 92/1). İhtar borçluya ulaşmakla hüküm doğurduğu için gönderme günü esas alınmaz.

  - soru: |
      Ödeme günü belirlenmemiş 100.000 TL'lik bir alacak için alacaklı hiç ihtar göndermeden 1 Eylül'de icra takibi başlatır ve takip talebinde alacağın doğduğu tarihten itibaren işlemiş temerrüt faizi ister. Yargıtay Hukuk Genel Kurulu'nun yaklaşımına göre hangisi doğrudur?
    siklar:
      - "Para borcu doğduğu anda muaccel olduğundan doğum tarihinden itibaren işlemiş faiz istenebilir."
      - "Takipten önce temerrüt bulunmadığından takip öncesi için işlemiş faiz istenemez; faiz takip tarihinden işler."
      - "Faiz ancak takibin kesinleştiği tarihten işler."
      - "Önceden ihtar yapılmadığı için hiçbir dönem için faiz istenemez."
    dogru: 1
    aciklama: |
      Borcun muaccel olması temerrüt için yetmez; kural olarak ihtar da gerekir (TBK m. 117/1). İhtar yoksa icra takibi borçluyu temerrüde düşürür. Hukuk Genel Kurulu, vadesi kesin belirlenmemiş ve takipten önce ihtar yapılmamış alacakta takip öncesi için işlemiş temerrüt faizi istenemeyeceğini kabul eder. Takipten sonraki dönem için ise faiz işler.

  - soru: |
      TBK m. 117/2'ye göre haksız fiilden doğan tazminat borcunda borçlu ne zaman temerrüde düşer?
    siklar:
      - "Zarar görenin ihtarıyla"
      - "Fiilin işlendiği tarihte"
      - "Dava tarihinde"
      - "Tazminatı belirleyen kararın kesinleştiği tarihte"
    dogru: 1
    aciklama: |
      TBK m. 117/2'ye göre haksız fiilde borçlu, fiilin işlendiği tarihte temerrüde düşer. Bu yüzden faiz kural olarak olay tarihinden işler. 2026'da TBK m. 55'e eklenen fıkra yalnız çalışma gücü kaybı ve destekten yoksun kalma tazminatlarında, kazancın bilinemediği dönem için faizi karar tarihinden başlatır; bu, iki kaleme özgü bir istisnadır.

  - soru: |
      Bir şirketin muhasebe hatasıyla Selin'in hesabına 60.000 TL yatırılır. Selin paranın burs ödemesi olduğunu sanır ve bunu bilmesi de gerekmez. Para hesabında durmaktadır. Şirket hatayı aylar sonra fark eder ve ihtar göndermeden dava açar. Temerrüt faizi hangi tarihten istenebilir?
    siklar:
      - "Paranın hesaba geçtiği tarihten"
      - "Şirketin hatayı fark ettiği tarihten"
      - "Borçluyu temerrüde düşüren dava tarihinden"
      - "Hiçbir tarihten; iyiniyetli zenginleşen hiçbir durumda faiz ödemez"
    dogru: 2
    aciklama: |
      TBK m. 117/2'ye göre sebepsiz zenginleşmede borçlu zenginleşmenin gerçekleştiği tarihte temerrüde düşer; ancak zenginleşen iyiniyetliyse temerrüt için bildirim şarttır. İyiniyet karine olduğundan (TMK m. 3) Selin iyiniyetli sayılır. Bildirim yapılmadan dava açıldığı için temerrüt dava ile gerçekleşir. Şirketin hatayı fark etmesi Selin'e bildirilmediği sürece sonuç doğurmaz.

  - soru: |
      Temerrüt ile kusur arasındaki ilişki hakkında hangisi doğrudur?
    siklar:
      - "Kusursuz borçlu temerrüde düşmez."
      - "Kusur temerrüdün şartı değildir; borçlu gecikme tazminatından ancak temerrüde düşmekte kusursuz olduğunu ispatlayarak kurtulur, temerrüt faizinden ise bu yolla kurtulamaz."
      - "Gecikme tazminatı isteyen alacaklı, borçlunun kusurunu ispatlamak zorundadır."
      - "Kusur yalnız temerrüt faizi için aranır, gecikme tazminatında aranmaz."
    dogru: 1
    aciklama: |
      TBK m. 117 temerrüt için kusur aramaz. TBK m. 118'e göre borçlu, temerrüde düşmekte kusuru olmadığını ispat etmedikçe gecikme zararını öder; kusur karine olarak var sayılır ve ispat yükü borçludadır. Yargıtay Hukuk Genel Kurulu'na göre temerrüt faizi ise kusura bağlı değildir; borçlu kusursuzluğunu ispatlasa da öder.

  - soru: |
      Mehmet, Ayşe'ye sattığı belirli bir atı 1 Haziran'da teslim edecekti, etmedi. 10 Haziran'da çıkan büyük orman yangını hem Mehmet'in çiftliğini hem de Ayşe'nin hemen yanındaki çiftliğini tamamen sarar; at Mehmet'in ahırında telef olur. Mehmet sorumluluktan kurtulabilir mi?
    siklar:
      - "Hayır; temerrüde düşen borçlu beklenmedik hâlden her durumda sorumludur."
      - "Evet; yangın beklenmedik hâl olduğu için temerrüdün hiçbir önemi yoktur."
      - "Evet; at zamanında teslim edilseydi bile aynı yangında Ayşe'nin çiftliğinde telef olacağını ispatlarsa kurtulur."
      - "Hayır; ancak Ayşe'nin de kusurlu olduğunu ispatlarsa kurtulabilir."
    dogru: 2
    aciklama: |
      TBK m. 119/1'e göre temerrüde düşen borçlu beklenmedik hâlin yol açtığı zarardan da sorumludur. Ancak m. 119/2 iki kurtuluş yolu tanır: temerrüde düşmekte kusursuzluk ya da borç zamanında ifa edilseydi bile beklenmedik hâlin ifa konusuna zarar vereceği. Yangın Ayşe'nin çiftliğini de sardığından Mehmet ikinci yolu kullanabilir. Yangının beklenmedik hâl olması tek başına yetmez.

  - soru: |
      Adi bir işte sözleşmede ne temerrüt faizi ne de akdî faiz kararlaştırılmıştır. Borçlu para borcunda temerrüde düşmüştür. Temerrüt faizinin oranı nedir?
    siklar:
      - "TCMB'nin kısa vadeli avans faizi oranı"
      - "3095 sayılı Kanun m. 1'deki kanuni faiz oranı"
      - "Hâkimin hakkaniyete göre belirleyeceği oran"
      - "Devlet bankalarının bir yıllık mevduata ödediği en yüksek faiz oranı"
    dogru: 1
    aciklama: |
      TBK m. 120/1 oranı yürürlükteki mevzuata bırakır. 3095 sayılı Kanun m. 2/1'e göre temerrüde düşen borçlu, aksi kararlaştırılmadıkça geçmiş günler için kanuni faiz oranında temerrüt faizi öder. Avans faizi ticari işlere ilişkindir (3095 sayılı Kanun m. 2/2). Devlet bankalarının mevduat faizi ise yabancı para borçlarında uygulanır (3095 sayılı Kanun m. 4/a).

  - soru: |
      2026'da 7589 sayılı Kanunla değiştirilen 3095 sayılı Kanun m. 1'e göre kanuni faiz nasıl belirlenir?
    siklar:
      - "Cumhurbaşkanının her yıl karar ile belirlediği sabit oranla"
      - "TCMB'nin önceki yılın 31 Aralık günü kısa vadeli kredi işlemlerinde uyguladığı reeskont oranının yüzde sekseniyle"
      - "TÜİK'in açıkladığı yıllık enflasyon oranıyla"
      - "TCMB'nin kısa vadeli avans faizi oranının iki katıyla"
    dogru: 1
    aciklama: |
      Yeni 3095 sayılı Kanun m. 1'e göre kanuni faiz, TCMB'nin önceki yılın 31 Aralık günü kısa vadeli kredi işlemlerinde uyguladığı reeskont oranının yüzde sekseni üzerinden ödenir. 30 Haziran'daki oran beş puan veya daha fazla farklıysa yılın ikinci yarısında 30 Haziran oranının yüzde sekseni geçerli olur. Örneğin önceki yılın 31 Aralık günkü reeskont oranı %38,75 ise kanuni faiz yıllık %31 olur.

  - soru: |
      Adi bir ödünç sözleşmesi yapılmaktadır. Kanuni faizin yıllık %30 olduğunu varsayınız. Taraflar sözleşmeye geçerli olarak en çok hangi yıllık temerrüt faizi oranını yazabilir?
    siklar:
      - "%45"
      - "%60"
      - "%90"
      - "Oran serbesttir, üst sınır yoktur."
    dogru: 1
    aciklama: |
      TBK m. 120/2'ye göre sözleşmeyle kararlaştırılan yıllık temerrüt faizi, kanuni faizin yüzde yüz fazlasını aşamaz: %30'un iki katı %60'tır. %45, sözleşme (akdî) faizinin sınırıdır (TBK m. 88/2). Oran serbestisi yalnız ticari işler için öngörülmüştür (TTK m. 8/1).

  - soru: |
      Adi bir ödünç sözleşmesinde yıllık %40 akdî faiz kararlaştırılmış, temerrüt faizi kararlaştırılmamıştır. Kanuni faizin yıllık %30 olduğunu varsayınız. Borçlu temerrüde düşerse temerrüt faizi hangi oranda işler?
    siklar:
      - "%30, çünkü temerrüt faizi kararlaştırılmamıştır."
      - "%40, çünkü akdî faiz kanuni faizden yüksektir."
      - "%60, çünkü temerrüt faizi her zaman kanuni faizin iki katıdır."
      - "%45, çünkü akdî faizin üst sınırı uygulanır."
    dogru: 1
    aciklama: |
      TBK m. 120/3'e göre akdî faiz kararlaştırılmış, temerrüt faizi kararlaştırılmamışsa ve akdî faiz kanuni faizden yüksekse temerrüt faizi oranı olarak akdî faiz oranı uygulanır. 3095 sayılı Kanun m. 2/3 de temerrüt faizinin akdî faizden az olamayacağını söyler. %40, sözleşme faizinin %45'lik sınırı içinde kaldığından geçerlidir (TBK m. 88/2).

  - soru: |
      Tacir olmayan Elif, bir lojistik şirketine ait ve şirketin ticari faaliyetinde kullanılan kamyonun sürücüsünün kusuruyla yaralanır. Elif, şirketten istediği maddi tazminata avans faizi uygulanmasını açıkça talep eder. Yargıtay Hukuk Genel Kurulu'nun yaklaşımına göre hangisi doğrudur?
    siklar:
      - "Elif tacir olmadığı için yalnız kanuni faiz isteyebilir."
      - "Haksız fiilden doğan alacaklarda avans faizi hiçbir zaman uygulanmaz."
      - "Borçlu şirket tacir olduğu ve borç ticari işletmesiyle ilgili bulunduğu için avans faizi istenebilir."
      - "Avans faizi ancak taraflar sözleşmeyle kararlaştırmışsa istenebilir."
    dogru: 2
    aciklama: |
      3095 sayılı Kanun m. 2/2'ye göre ticari işlerde, aralarında sözleşme olmasa bile, kanuni faizden yüksekse avans faizi oranında temerrüt faizi istenebilir. Hukuk Genel Kurulu'na göre bunun için borçlunun tacir olması ve borcun ticari işletmesiyle ilgili bulunması yeter; alacaklının tacir olması gerekmez. Haksız fiilden doğan alacaklar da dahildir. Avans faizinin açıkça istenmesi gerekir.

  - soru: |
      İki ticari işletme arasındaki mal tedarik sözleşmesinde ödeme günü ya da süresi belirlenmemiştir. Satıcı malları teslim etmiş, alıcı faturayı teslimden sonra 2 Nisan'da almıştır. TTK m. 1530'a göre alıcı ne zaman temerrüde düşer?
    siklar:
      - "Satıcının göndereceği ihtarname tebliğ edildiğinde"
      - "Faturayı aldığı 2 Nisan'da"
      - "Faturanın alınmasını izleyen otuz günlük sürenin sonunda, ihtara gerek olmadan"
      - "Satıcı dava açtığında"
    dogru: 2
    aciklama: |
      TTK m. 1530/4-a'ya göre sözleşmede ödeme günü ya da süresi belirtilmemişse borçlu, faturanın alınmasını izleyen otuz günlük sürenin sonunda ihtara gerek kalmadan temerrüde düşer ve alacaklı faize hak kazanır. Borçlunun gecikmeden sorumlu tutulamayacağı hâller ayrıktır (TTK m. 1530/2). Bu özel kural, TBK m. 117/1'deki ihtar şartının istisnasıdır.

  - soru: |
      Tacirler arasında diğer tarafı temerrüde düşürmeye yönelik ihtarın yapılabileceği yollar arasında TTK m. 18/3'te **sayılmayan** hangisidir?
    siklar:
      - "Noter aracılığıyla ihtar"
      - "Taahhütlü mektup"
      - "Güvenli elektronik imza kullanılarak kayıtlı elektronik posta"
      - "Güvenli elektronik imza taşımayan sıradan e-posta"
    dogru: 3
    aciklama: |
      TTK m. 18/3 tacirler arasındaki temerrüt ihtarı için dört yol sayar: noter, taahhütlü mektup, telgraf ve güvenli elektronik imzalı kayıtlı elektronik posta (KEP). Sıradan e-posta bunlar arasında değildir. Kanunun gerekçesine ve Yargıtay'a göre bu şekil ispat şartıdır. Adi işlerde ise ihtar şekle bağlı değildir.

  - soru: |
      Geçerli olarak kurulmuş ve sözleşmede aynen ödeme kaydı bulunmayan 20.000 avroluk borç 1 Mart'taki vadesinde ödenmez. Avro kuru 1 Mart'ta 45 TL, borcun ödendiği 1 Ekim'de 50 TL'dir. Alacaklı için hangisi doğrudur?
    siklar:
      - "Yalnız avro olarak ödeme isteyebilir."
      - "Yalnız vade günündeki kur üzerinden 900.000 TL isteyebilir."
      - "Aynen avro olarak, vade günü kuruyla 900.000 TL ya da fiilî ödeme günü kuruyla 1.000.000 TL olarak ödeme isteyebilir."
      - "Seçim borçluya aittir; borçlu en düşük kuru seçer."
    dogru: 2
    aciklama: |
      TBK m. 99/3'e göre aynen ödeme kaydı bulunmayan yabancı para borcu ödeme gününde ödenmezse alacaklı, alacağın aynen ya da vade veya fiilî ödeme günündeki kur üzerinden Türk lirasıyla ödenmesini isteyebilir. Seçim alacaklınındır ve kur riski geciken borçluya yüklenir. Borçlunun ödeme günündeki kurla Türk lirası ödeme yetkisi ise vadedeki ifaya ilişkindir (TBK m. 99/2).

  - soru: |
      Ticari olmayan ve geçerli bir sözleşmeden doğan dolar alacağı vadesinde ödenmemiştir. Alacaklı takip talebinde alacağı vade tarihindeki kurla Türk lirasına çevirerek istemiştir. Yargıtay Hukuk Genel Kurulu'na göre bu tarihten sonra hangi faiz istenebilir?
    siklar:
      - "Devlet bankalarının dolar mevduatına ödediği en yüksek faiz (3095 sayılı Kanun m. 4/a)"
      - "Alacak Türk lirası alacağına dönüştüğü için 3095 sayılı Kanun m. 1'e göre yasal faiz"
      - "Hem yasal faiz hem de dolar mevduatı faizi"
      - "Hiçbir faiz; kur farkı faizin yerini tutar"
    dogru: 1
    aciklama: |
      Hukuk Genel Kurulu'na göre alacaklı alacağını vade ya da takip tarihindeki kurla Türk lirasına çevirirse alacak o tarihten itibaren Türk lirası alacağı olur ve 3095 sayılı Kanun m. 1'e göre yasal faiz istenir. Fiilî ödeme günü kurunu seçseydi alacak ödemeye kadar dövizde kalır ve vadeden itibaren 3095 sayılı Kanun m. 4/a'daki mevduat faizi işlerdi (TBK m. 99/3).

  - soru: |
      Ayten, kardeşi Can'a geçerli bir bağışlama vaadiyle 1 Nisan'da 100.000 TL vereceğini taahhüt eder, ama ödemez. Can 10 Nisan'da noter ihtarı gönderir ve 1 Temmuz'da dava açar. Temerrüt faizi hangi tarihten istenebilir?
    siklar:
      - "1 Nisan'dan, çünkü ifa günü birlikte belirlenmiştir."
      - "10 Nisan'dan, ihtarın tebliğiyle."
      - "1 Temmuz'dan, yani dava tarihinden."
      - "Bağışlamadan doğan borçta hiçbir zaman temerrüt faizi istenemez."
    dogru: 2
    aciklama: |
      TBK m. 121/1'e göre bağışladığı bir miktar parayı ödemekte temerrüde düşen borçlu, icra takibine girişildiği ya da dava açıldığı günden başlayarak temerrüt faizi öder. Belirli gün nedeniyle Ayten 1 Nisan'ın geçmesiyle temerrüde düşmüştür (TBK m. 117/2), ama faizin başlangıcı bu özel hükümle dava tarihine ertelenmiştir.

  - soru: |
      Temerrüt faizi ve bileşik faiz hakkında hangisi doğrudur?
    siklar:
      - "İşlemiş temerrüt faizine, takip tarihinden itibaren ayrıca temerrüt faizi yürütülür."
      - "Temerrüt faizine ayrıca temerrüt faizi yürütülemez; kanuni faiz ve temerrüt faizi hesaplanırken mürekkep faiz de işletilemez."
      - "Tacir olmayan iki kişi arasında işlemiş kanuni faiz, üç ayda bir anaparaya eklenerek yeniden faiz yürütülebilir."
      - "Mürekkep faiz yasağı, her iki taraf için ticari olan ödünçlerde ve cari hesaplarda da istisnasız uygulanır."
    dogru: 1
    aciklama: |
      TBK m. 121/3'e göre temerrüt faizine ayrıca temerrüt faizi yürütülemez. 3095 sayılı Kanun m. 3'e göre kanuni faiz ve temerrüt faizi hesaplanırken mürekkep faiz yürütülemez; TTK hükümleri saklıdır. TTK m. 8/2, üç aydan kısa olmamak üzere bileşik faizi yalnız cari hesaplarda ve her iki taraf için ticari olan ödünçlerde kabul eder; tacir olmayanlara uygulanmaz.

  - soru: |
      TBK m. 122'deki aşkın zarar hakkında hangisi doğrudur?
    siklar:
      - "Alacaklı, borçlunun temerrüde düşmekte kusurlu olduğunu ispatlamak zorundadır."
      - "Alacaklı temerrüt faizini aşan zararını ve illiyeti ispatlar; borçlu ancak hiçbir kusurunun bulunmadığını ispatlayarak kurtulur."
      - "Aşkın zarar yalnız asıl alacakla aynı davada istenebilir, sonradan ayrı dava açılamaz."
      - "Aşkın zarar temerrüt faizinin yerine geçer, ikisi birlikte istenemez."
    dogru: 1
    aciklama: |
      TBK m. 122/1'e göre borçlu, hiçbir kusurunun bulunmadığını ispat etmedikçe temerrüt faizini aşan zararı da öder; kusur karinedir. Hukuk Genel Kurulu'na göre zararı ve illiyeti alacaklı ispatlar ve aşkın zarar saklı tutulmasa bile ayrı bir davayla istenebilir. Aşkın zarar faizin üstünde kalan kısmı karşıladığı için faizle birlikte istenir.

  - soru: |
      Banka mevduatını yıllar sonra avans faiziyle tahsil eden bir mudi, "enflasyon ve döviz kurları faizden çok arttı, param eridi" diyerek aşkın zarar davası açar. Kendi durumuna özgü başka bir vakıa ileri sürmez. Yargıtay Hukuk Genel Kurulu'nun 2022'deki yaklaşımına göre hangisi doğrudur?
    siklar:
      - "Yüksek enflasyon herkesçe bilinen bir vakıa olduğundan zarar ispatlanmış sayılır ve sepet hesabıyla belirlenir."
      - "Genel ekonomik göstergeler tek başına aşkın zararı ispatlamaz; davacı kendi durumuna özgü somut vakıaları ispatlamalıdır."
      - "Aşkın zarar yalnız tacir olan alacaklılar tarafından istenebilir."
      - "Borçlu banka kusursuzluğunu ispatlasa da aşkın zarardan sorumludur."
    dogru: 1
    aciklama: |
      Hukuk Genel Kurulu, enflasyon, kur artışı ve mevduat faizi gibi genel göstergelerin davacıyı ispat yükünden kurtarmadığını ve ona ispat kolaylığı da sağlamadığını kabul etmiştir (TBK m. 122). Bazı daireler yüksek enflasyon dönemlerinde soyut ispatı kabul ettiğinden konu tartışmalıdır; soru Hukuk Genel Kurulu'nun yaklaşımını sormaktadır. Borçlu hiçbir kusurunun olmadığını ispatlarsa aşkın zarardan kurtulur.

  - soru: |
      Bir düğün için kiralanan ses sisteminin "14 Haziran saat 18.00'de, törenden önce" teslim edileceği kararlaştırılmıştır. Sözleşmeden bu saatten sonraki teslimin kabul edilmeyeceği açıkça anlaşılmaktadır. Teslim yapılmaz. Hangisi doğrudur?
    siklar:
      - "Borçlu ancak ihtarla temerrüde düşer ve alacaklı seçimlik haklar için mutlaka süre vermelidir."
      - "Teslim günü birlikte belirlendiği için ihtar gerekmez; ifanın sonradan kabul edilmeyeceği anlaşıldığından seçimlik haklar için süre vermek de gerekmez."
      - "Borçlu temerrüde düşmez, borç kendiliğinden sona erer ve alacaklının hiçbir hakkı kalmaz."
      - "İhtar gerekmez, ama alacaklı her durumda uygun bir süre vermelidir."
    dogru: 1
    aciklama: |
      Teslim günü birlikte belirlendiğinden borçlu bu zamanın geçmesiyle ihtarsız temerrüde düşer (TBK m. 117/2). İfanın belirli bir zamanda gerçekleşmemesi üzerine artık kabul edilmeyeceği sözleşmeden anlaşıldığı için süre verilmesine de gerek yoktur (TBK m. 124/3). Alacaklının bundan sonraki seçimlik hakları ayrı konudadır (TBK m. 125).

olaylar:
  - olay: |
      Ayşe, açacağı kafe için ikinci el eşya satıcısı Hakan'ın dükkânında sergilenen ve kendisinin seçtiği bir espresso makinesini 1 Mart 2026'da 120.000 TL'ye satın alır ve bedeli peşin öder. Makinenin 15 Mart 2026'da kafeye teslim edilmesi kararlaştırılır. Hakan makineyi teslimden önce bakım için bir teknik servise gönderir. Servis işi geciktirir ve Hakan 15 Mart'ta teslim yapamaz. Ayşe 16 Mart'tan itibaren günlük 1.000 TL'ye başka bir makine kiralayarak kafeyi açar.

      Hakan'ın 25 Mart'ta servisten geri aldığı makine, aynı gece deposunu basan sel yüzünden tamamen kullanılamaz hâle gelir. Ayşe'nin kafesi, selin hiç ulaşmadığı yüksek bir sokaktadır. Ayşe aynı nitelikte bir makineyi 30 Mart'ta 150.000 TL'ye satın alır ve kiraladığı makineyi o gün iade eder.

      Hakan şunları ileri sürmektedir: "Bana hiç ihtar gelmedi, temerrüde düşmedim. Gecikmenin sebebi servistir, benim kusurum yok. Sel bir doğa olayıdır, ondan sorumlu tutulamam."

      1. Hakan temerrüde düşmüş müdür? Düşmüşse hangi tarihte?
      2. Ayşe kira giderlerini Hakan'dan isteyebilir mi?
      3. Makinenin selde kullanılamaz hâle gelmesinden Hakan sorumlu mudur? Ayşe ne isteyebilir?
      4. Sel 14 Mart'ta olsaydı sonuç ne olurdu?
    olcut:
      - {tespit: "Borcun 15 Mart'ta muaccel olması; ifa günü birlikte belirlendiği için ihtarsız temerrüt ve temerrüdün 15 Mart'ın geçmesiyle doğması", puan: 25, madde: "TBK m. 117"}
      - {tespit: "Kusurun temerrüdün şartı olmaması; gecikme tazminatında kusur karinesi ve ispat yükünün Hakan'da olması", puan: 15, madde: "TBK m. 118"}
      - {tespit: "Servisin ifa yardımcısı olması nedeniyle gecikmenin Hakan'ı kurtarmaması", puan: 10, madde: "TBK m. 116"}
      - {tespit: "16-30 Mart arasındaki 15.000 TL kira giderinin tazminat olarak istenebilmesi", puan: 15, madde: "TBK m. 118"}
      - {tespit: "Temerrüdündeki borçlunun beklenmedik hâlden sorumluluğu; iki kurtuluş yolunun olayda gerçekleşmemesi; bedel iadesi ve fiyat farkının istenebilmesi", puan: 25, madde: "TBK m. 119"}
      - {tespit: "Temerrüt olmasaydı borcun sorumlu tutulamayacak bir sebeple sona ermesi; Hakan'ın yalnız bedeli geri vermesi ve tazminat ödememesi", puan: 10, madde: "TBK m. 136"}
    cozum: |
      **Nitelendirme:** Ayşe ile Hakan arasında bir satış sözleşmesi vardır. Satılan, Ayşe'nin dükkânda seçtiği belirli bir ikinci el makinedir; Hakan'ın teslim borcu bir parça borcudur. Ayşe bedeli peşin ödemiştir. Uyuşmazlık, para borcu dışındaki bir edimde borçlu temerrüdüne ilişkindir.

      **Hukuki sorunlar:** (1) İhtar olmadan temerrüt doğmuş mudur? (2) Servisin gecikmesi Hakan'ı kurtarır mı, kira giderleri istenebilir mi? (3) Temerrüt sırasında selin yol açtığı zarardan kim sorumludur? (4) Temerrüt olmasaydı ne olurdu?

      **İlgili hükümler:** TBK m. 117/2, m. 118, m. 116, m. 119, m. 136.

      **Değerlendirme:**

      *1. Temerrüt:* Taraflar teslim gününü 15 Mart 2026 olarak birlikte belirlemiştir. TBK m. 117/2'ye göre bu durumda borçlu, günün geçmesiyle ihtara gerek kalmadan temerrüde düşer. Borç o gün muacceldi ve makine henüz sağlam olduğu için ifa mümkündü. Ayşe bedeli peşin ödediğinden Hakan'ın ileri sürebileceği bir ödemezlik def'i de yoktur. Hakan 15 Mart'ın geçmesiyle temerrüde düşmüştür. "İhtar gelmedi" savunması dinlenmez.

      *2. Kusur ve kira giderleri:* Kusur temerrüdün şartı değildir, yalnız tazminat sonuçlarında önem taşır. TBK m. 118'e göre temerrüde düşen borçlu, temerrüde düşmekte kusuru olmadığını ispat etmedikçe geç ifadan doğan zararı öder. İspat yükü Hakan'dadır. Hakan gecikmeyi servise yüklemektedir. Ancak servis, Hakan'ın teslim borcunu yerine getirmek için kullandığı bir yardımcıdır. Borçlu ifayı yardımcısına bırakmış olsa bile onun işi yürütürken verdiği zarardan sorumludur (TBK m. 116). Bu nedenle servisin gecikmesi Hakan'ın kusursuzluğunu göstermez. Ayşe'nin 16 Mart'tan yeni makineyi aldığı 30 Mart'a kadar ödediği 15 günlük kira (15.000 TL), gecikmenin ve ardından makinenin telef olmasının uygun sonucudur ve tazmin edilir. Ayşe zararı ve illiyeti kira sözleşmesi ve ödeme belgeleriyle ispatlar.

      *3. Sel:* Sel, Hakan'ın kusuruna dayanmayan bir beklenmedik hâldir. Ancak TBK m. 119/1'e göre temerrüde düşen borçlu beklenmedik hâl sebebiyle doğacak zarardan da sorumludur. Hakan iki yoldan biriyle kurtulabilirdi (m. 119/2):
      - *Temerrüde düşmekte kusursuzluk:* Servisin gecikmesi Hakan'a yüklendiğinden bu ispat yapılamaz. "Sel benim kusurum değil" demek yetmez; bakılan, gecikmedeki kusurdur.
      - *Zamanında ifada da zararın doğacağı:* Makine 15 Mart'ta teslim edilseydi Ayşe'nin kafesinde olacaktı. Kafe selin ulaşmadığı bir sokakta olduğundan makine zarar görmeyecekti. Bu yol da kapalıdır.

      Hakan makinenin kullanılamaz hâle gelmesinden doğan zarardan sorumludur. Artık ifa mümkün olmadığından Ayşe ifa yerine tazminat ister. Hakan, Ayşe'yi sözleşme gereği gibi ifa edilmiş olsaydı bulunacağı duruma getirmelidir: Ödenen 120.000 TL'yi geri vermeli ve aynı nitelikte makinenin daha pahalıya alınmasından doğan 30.000 TL'lik farkı ödemelidir. Zarar hesabının ve sözleşmenin tasfiyesinin ayrıntısı borca aykırılık ve seçimlik haklar konularındadır.

      *4. Sel 14 Mart'ta olsaydı:* Hakan henüz temerrütte olmazdı. Borcun ifası borçlunun sorumlu tutulamayacağı bir sebeple imkânsızlaştığı için borç sona ererdi (TBK m. 136/1). Hakan aldığı 120.000 TL'yi sebepsiz zenginleşme hükümlerine göre geri verir, ama ne fiyat farkını ne de kira giderini öderdi (TBK m. 136/2). Aradaki fark tamamen temerrütten doğar.

      **Sonuç:**
      - Hakan 15 Mart'ın geçmesiyle ihtarsız temerrüde düşmüştür.
      - Servisin gecikmesi onu kurtarmaz; 15.000 TL kira gideri tazminat olarak istenir.
      - Hakan selden doğan zarardan da sorumludur; Ayşe bedelin iadesini ve 30.000 TL fiyat farkını isteyebilir.
      - Sel temerrütten önce olsaydı Hakan yalnız bedeli geri verir, tazminat ödemezdi.

  - olay: |
      Emekli öğretmen Kemal, hobi olarak kullandığı teknesini tekne turu işletmesi olan Mavi Koy Turizm Ltd. Şti.'ne 600.000 TL'ye satar ve 2 Mart 2026'da teslim eder. Sözleşmede bedelin ne zaman ödeneceği yazılı değildir. Şirket tekneyi hemen turlarda kullanmaya başlar ama bedeli ödemez.

      Kemal, 10 Mart'ta şirkete noter aracılığıyla ihtarname göndererek bedelin derhal ödenmesini ister. İhtarnamede bu parayı 1 Nisan'da yapacağı bir daire alımında kullanacağını da yazar. İhtarname 12 Mart'ta tebliğ edilir. Şirket nakdini sezon hazırlığına ayırmayı tercih eder ve ödemeyi bilerek geciktirir.

      Kemal'in başka birikimi yoktur ve bankaya yaptığı kredi başvurusu reddedilmiştir. Daire bedelini 1 Nisan'da ödeyemeyince daire satıcısına sözleşmedeki 150.000 TL'lik ceza koşulunu öder. Şirket teknenin bedelini 1 Temmuz'da öder. Kemal parayı alırken faiz ve tazminat haklarını saklı tuttuğunu şirkete yazılı olarak bildirir.

      Kemal açtığı davada (a) teslim tarihi olan 2 Mart'tan itibaren avans faizi, (b) ödediği ceza koşulu nedeniyle tazminat ister. Şirket, Kemal tacir olmadığı için yalnız kanuni faiz istenebileceğini, anapara ödendiği için faiz istenemeyeceğini ve ceza koşulunun kendisini ilgilendirmediğini savunur.

      1. Şirket ne zaman temerrüde düşmüştür? Kemal'in 2 Mart'tan faiz istemi yerinde midir?
      2. Kemal hangi tür temerrüt faizi isteyebilir?
      3. Anaparanın ödenmiş olması faiz istemini engeller mi?
      4. Ceza koşulu nedeniyle tazminat istemini değerlendiriniz.
    olcut:
      - {tespit: "Ödeme günü belirlenmediği için ihtarın gerekmesi; muacceliyetin tek başına temerrüt doğurmaması; temerrüdün 12 Mart'taki tebliğle doğması ve 2 Mart'tan faiz isteminin yerinde olmaması", puan: 25, madde: "TBK m. 117"}
      - {tespit: "Satışın şirket için ticari iş olması ve tek taraflı ticari işin diğer taraf için de ticari sayılması", puan: 10, madde: "TTK m. 19"}
      - {tespit: "Ticari işte sözleşme olmadan da avans faizi istenebilmesi; ölçütün borçlunun tacir olması ve borcun ticari işletmesiyle ilgili bulunması; alacaklının tacir olmasının gerekmemesi", puan: 20, madde: "3095 sayılı Kanun m. 2"}
      - {tespit: "Temerrüt faizinin kusura bağlı olmadan işlemesi", puan: 10, madde: "TBK m. 120"}
      - {tespit: "Anapara ödendikten sonra işlemiş faizin istenebilmesi için saklı tutma; Kemal'in yazılı bildirimi", puan: 10, madde: "TBK m. 131"}
      - {tespit: "Ceza koşulu ödemesinin temerrüt faizini aşan kısmının aşkın zarar olarak istenmesi; somut zarar ve illiyet; şirketin kusursuzluğu ispatlayamaması", puan: 25, madde: "TBK m. 122"}
    cozum: |
      **Nitelendirme:** Kemal ile Mavi Koy Turizm Ltd. Şti. arasında satış sözleşmesi vardır. Şirketin bedel borcu bir para borcudur. Şirket tacirdir ve tekneyi tur işletmesinde kullanmak için almıştır.

      **Hukuki sorunlar:** (1) Şirket ne zaman temerrüde düştü? (2) Hangi tür temerrüt faizi istenir? (3) Anapara ödendikten sonra faiz istenebilir mi? (4) Ceza koşulu ödemesi aşkın zarar mıdır?

      **İlgili hükümler:** TBK m. 117/1, m. 120, m. 122, m. 131; 3095 sayılı Kanun m. 2/2; TTK m. 3, 10, 18/3, 19 ve 1530.

      **Değerlendirme:**

      *1. Temerrüt tarihi:* Bedelin ödeme günü kararlaştırılmamıştır; borç teslimle muaccel olmuştur. Ancak muacceliyet tek başına temerrüt doğurmaz ve TBK m. 117/2'deki ihtarsız temerrüt hâllerinden biri de yoktur. Şirket, Kemal'in ihtarıyla temerrüde düşer (TBK m. 117/1). Bedelin derhal ödenmesini isteyen ihtarname 12 Mart'ta tebliğ edildiğinden şirket bu tebliğle temerrüde düşmüştür. Ticari borçlar için TTK m. 10 da aynı sonucu verir: Belli bir vade yoksa faiz ihtar gününden işler. Kemal'in 2 Mart'tan faiz istemi yerinde değildir. TTK m. 18/3'teki şekil yalnız tacirler arasındaki ihtarlar için öngörülmüştür; Kemal tacir olmadığından ihtar şekle bağlı değildir, noter ihtarı ise ispatı kolaylaştırır. TTK m. 1530'daki ihtarsız temerrüt de yalnız ticari işletmeler arasındaki mal ve hizmet tedarikinde uygulanır.

      *2. Faiz türü:* Satış, tekneyi turlarda kullanmak için alan şirketin ticari işletmesini ilgilendirir (TTK m. 3) ve tacirin borçlarının ticari olması asıldır (TTK m. 19/1). Taraflardan yalnız biri için ticari olan sözleşme, kanunda aksine hüküm yoksa diğeri için de ticari sayılır (TTK m. 19/2). Ticari işlerde TCMB avans oranı kanuni faizden yüksekse temerrüt faizi sözleşme olmasa bile bu oran üzerinden istenebilir (3095 sayılı Kanun m. 2/2). Yargıtay Hukuk Genel Kurulu'na göre bunun için borçlunun tacir olması ve borcun ticari işletmesiyle ilgili bulunması yeter; alacaklının tacir olması gerekmez. Kemal avans faizini açıkça istediğinden şirketin "Kemal tacir değil" savunması dinlenmez. Kemal 12 Mart'tan itibaren, değişen oranlarda avans faizi isteyebilir. Şirketin ödemeyi bilerek geciktirmesi faiz açısından ayrıca önemli değildir, çünkü temerrüt faizi kusura bağlı olmadan işler (TBK m. 120).

      *3. Anaparanın ödenmesi:* Asıl borç ifa edilince faiz gibi bağlı haklar kural olarak sona erer (TBK m. 131/1). İşlemiş faiz, ifa anına kadar yapılan bir bildirimle saklı tutulmuşsa istenebilir (TBK m. 131/2). Kemal ödemeyi alırken faiz ve tazminat haklarını saklı tuttuğunu yazılı olarak bildirdiği için 12 Mart-1 Temmuz arasındaki temerrüt faizini isteyebilir.

      *4. Ceza koşulu:* Temerrüt faizi götürü bir asgaridir; zarar bundan büyükse fark aşkın zarar olarak istenir (TBK m. 122/1). Şartlar gerçekleşmiştir: Para borcunda temerrüt vardır. Kemal'in, belgeyle ispatlanan 150.000 TL'lik bir zararı vardır. Kemal ihtarnamede paraya 1 Nisan'da ihtiyacı olduğunu bildirmiş, başka birikimi yoktur ve kredi başvurusu reddedilmiştir; bu yüzden ceza koşulunu ödemesi şirketin temerrüdünün uygun sonucudur. Bu zarar Kemal'in kendi durumuna özgü somut bir zarardır ve yalnız enflasyona dayanan soyut bir iddiadan farklıdır. Şirketin kusuru karine olarak var sayılır; şirket ödemeyi bilerek geciktirdiği için hiçbir kusurunun olmadığını ispatlayamaz. "Ceza koşulu beni ilgilendirmez" savunması dinlenmez. Kemal, 150.000 TL'nin temerrüt süresince işleyen temerrüt faizini aşan kısmını aşkın zarar olarak alır. Örneğin bu dönemin temerrüt faizi 70.000 TL ise aşkın zarar 80.000 TL'dir. Kemal bu zararı faiz alacağıyla birlikte aynı davada isteyebilir; aşkın zarar bağımsız bir borç olduğundan ayrı bir davayla da istenebilirdi.

      **Sonuç:**
      - Şirket 12 Mart'taki tebliğle temerrüde düşmüştür; 2 Mart'tan faiz istenemez.
      - Kemal 12 Mart'tan itibaren avans faizi isteyebilir; tacir olmaması bunu engellemez.
      - Kemal faiz hakkını saklı tuttuğundan anapara ödendikten sonra da faiz ister.
      - Ceza koşulu ödemesinin temerrüt faizini aşan kısmı aşkın zarar olarak istenir.

  - olay: |
      Öğretmen Leyla'nın 2026 yılında dört ayrı alacağı vardır. Kanuni faizin yıllık %30 olduğunu varsayınız. Taraflardan hiçbiri tacir değildir ve işlemlerin hiçbiri bir ticari işletmeyle ilgili değildir.

      (a) 10 Ocak'ta komşusu Tarık, bir tartışma sırasında öfkeyle fırlattığı taşla Leyla'nın otomobilinin camlarını kırar. Onarım 80.000 TL tutar. Leyla, Tarık'a ihtar göndermeden 10 Haziran'da dava açar ve 10 Ocak'tan itibaren faiz ister. Tarık, ihtar almadığı için faizin ancak dava tarihinden işleyebileceğini savunur.

      (b) Teyzesi Nur, geçerli bir yazılı bağışlama vaadiyle Leyla'ya 1 Mart'ta 300.000 TL vereceğini taahhüt etmiş, ama ödememiştir. Leyla 5 Mart'ta ihtar göndermiş, 1 Haziran'da icra takibine girişmiştir. Leyla 1 Mart'tan itibaren temerrüt faizi istemektedir.

      (c) Leyla'nın kirasını ödemek için gönderdiği 40.000 TL, 5 Şubat'ta IBAN hatası yüzünden Murat'ın hesabına geçer. Murat paranın kendisine ait olmadığını hemen anlar ama sesini çıkarmaz. Leyla durumu 1 Mayıs'ta fark eder.

      (d) Leyla'nın arkadaşı Selin'e verdiği 200.000 TL'lik ödünçte yıllık %40 sözleşme faizi kararlaştırılmış, temerrüt faizi kararlaştırılmamıştır. Geri ödeme günü 1 Nisan'dır ve Selin ödeme yapmaz. Selin, temerrüt faizinin kanuni faiz oranında olması gerektiğini savunur.

      Her alacak için borçlunun temerrüde düştüğü tarihi, temerrüt faizinin başlangıcını ve oranını belirleyiniz.
    olcut:
      - {tespit: "Haksız fiilde temerrüdün fiilin işlendiği tarihte doğması; ihtarın gerekmemesi; faizin 10 Ocak'tan işlemesi", puan: 25, madde: "TBK m. 117"}
      - {tespit: "Adi işte sözleşme yoksa temerrüt faizinin kanuni faiz oranında olması", puan: 10, madde: "3095 sayılı Kanun m. 2"}
      - {tespit: "Belirli gün nedeniyle 1 Mart'ta temerrüt doğsa da bağışlanan parada temerrüt faizinin ancak takip gününden (1 Haziran) işlemesi", puan: 20, madde: "TBK m. 121"}
      - {tespit: "Kötüniyetli sebepsiz zenginleşenin zenginleşme tarihinde (5 Şubat) temerrüde düşmesi; iyiniyetli olsaydı bildirim gerekeceği", puan: 20, madde: "TBK m. 117"}
      - {tespit: "1 Nisan'ın geçmesiyle ihtarsız temerrüt; akdî faiz kanuni faizden yüksek olduğu ve temerrüt faizi kararlaştırılmadığı için temerrüt faizinin %40 olması", puan: 15, madde: "TBK m. 120"}
      - {tespit: "Sözleşme faizinin %45 sınırı içinde geçerli olması ve temerrüt faizine ayrıca temerrüt faizi yürütülememesi", puan: 10, madde: "TBK m. 88"}
    cozum: |
      **Nitelendirme:** Leyla'nın dört alacağı farklı kaynaklardan doğar: (a) haksız fiil, (b) bağışlama vaadi, (c) sebepsiz zenginleşme, (d) ödünç sözleşmesi. Hepsi para borcudur ve hiçbiri ticari iş değildir. Bu yüzden sözleşmede başka bir oran yoksa temerrüt faizi kanuni faiz oranındadır (TBK m. 120/1; 3095 sayılı Kanun m. 2/1).

      **Hukuki sorunlar:** Her alacakta temerrüt anı, faizin başlangıcı ve faizin oranı.

      **İlgili hükümler:** TBK m. 117/2, m. 120, m. 121, m. 88/2; 3095 sayılı Kanun m. 2; TMK m. 3.

      **Değerlendirme:**

      *(a) Tarık:* Taşla otomobilin camlarını kırmak kusurlu ve hukuka aykırı bir fiildir; Tarık haksız fiilden sorumludur. TBK m. 117/2'ye göre haksız fiilde borçlu, fiilin işlendiği tarihte temerrüde düşer ve ihtar gerekmez. Tarık'ın savunması yerinde değildir. Leyla, 80.000 TL'ye 10 Ocak'tan itibaren temerrüt faizi ister. İş ticari olmadığından oran kanuni faizdir (varsayıma göre yıllık %30). Oran değişirse faiz değişen oranlarda hesaplanır.

      *(b) Nur:* İfa günü 1 Mart olarak belirlendiğinden Nur 1 Mart'ın geçmesiyle temerrüde düşmüştür (TBK m. 117/2). Ancak bağışladığı bir miktar parayı ödemekte temerrüde düşen borçlu, temerrüt faizini ancak icra takibine girişildiği ya da dava açıldığı günden başlayarak öder (TBK m. 121/1). Bu nedenle ne 1 Mart ne de ihtar tarihi olan 5 Mart esas alınır; temerrüt faizi takip günü olan 1 Haziran'dan işler. Leyla'nın 1 Mart'tan faiz istemi reddedilmelidir. Taraflar aksini kararlaştırmış olsaydı bu anlaşma ceza koşulu hükümlerine tabi olurdu (TBK m. 121/2).

      *(c) Murat:* Murat, haklı bir sebep olmadan Leyla'nın malvarlığından zenginleşmiştir. Sebepsiz zenginleşmede borçlu zenginleşmenin gerçekleştiği tarihte temerrüde düşer, ama zenginleşen iyiniyetliyse temerrüt için bildirim şarttır (TBK m. 117/2). İyiniyet karine olduğundan (TMK m. 3) Leyla, Murat'ın paranın kendisine ait olmadığını bildiğini ispatlamalıdır. Olayda Murat bunu hemen anlamıştır; kötüniyetlidir. Murat 5 Şubat'ta temerrüde düşmüştür ve kanuni faiz bu tarihten işler. Leyla'nın durumu 1 Mayıs'ta fark etmesi sonucu değiştirmez. Murat iyiniyetli olsaydı faiz Leyla'nın bildiriminden, bildirim yoksa takip ya da dava tarihinden işlerdi.

      *(d) Selin:* Geri ödeme günü birlikte belirlendiğinden Selin 1 Nisan'ın geçmesiyle ihtarsız temerrüde düşmüştür (TBK m. 117/2). Yıllık %40'lık sözleşme faizi, kanuni faizin yüzde elli fazlası olan %45'lik sınırın altında kaldığı için geçerlidir (TBK m. 88/2). Sözleşmede temerrüt faizi kararlaştırılmamıştır, ama akdî faiz kanuni faizden yüksektir. Bu durumda temerrüt faizi oranı olarak akdî faiz oranı uygulanır (TBK m. 120/3; 3095 sayılı Kanun m. 2/3). Selin'in "kanuni faiz uygulanmalı" savunması yerinde değildir; borçlu temerrüde düşerek daha düşük bir orana geçemez. Temerrüt faizine ayrıca temerrüt faizi yürütülemez (TBK m. 121/3).

      **Sonuç:**
      - Tarık: 10 Ocak'tan itibaren kanuni faiz.
      - Nur: Temerrüt 1 Mart'ta doğar, ama temerrüt faizi takip günü olan 1 Haziran'dan işler.
      - Murat: Kötüniyetli olduğu için 5 Şubat'tan itibaren kanuni faiz.
      - Selin: 1 Nisan'dan itibaren yıllık %40 temerrüt faizi.

kartlar:
  - on: "Borçlu temerrüdünün kural şartları? (TBK m. 117/1)"
    arka: "Borcun muaccel olması ve alacaklının ihtarı. İfa hâlâ mümkün olmalı ve borçlu ifa etmemiş olmalı. Kusur aranmaz."
  - on: "İhtarsız temerrüdün dört hâli? (TBK m. 117/2)"
    arka: "Birlikte belirlenen ifa günü; sözleşmedeki hakla bildirimle belirlenen gün; haksız fiilde fiil tarihi; sebepsiz zenginleşmede zenginleşme tarihi (zenginleşen iyiniyetliyse bildirim şart)."
  - on: "İhtar şekle bağlı mıdır?"
    arka: "Adi işlerde hayır. Tacirler arasında noter, taahhütlü mektup, telgraf ya da KEP ile yapılır; bu şekil ispat şartıdır (TTK m. 18/3)."
  - on: "İhtarda süre verilirse temerrüt ne zaman doğar?"
    arka: "Verilen sürenin bitiminde. Süre vermek zorunlu değildir; ödemenin açıkça istenmesi yeter."
  - on: "Hiç ihtar yoksa faiz ne zamandan işler?"
    arka: "Borçluyu temerrüde düşüren takip ya da dava tarihinden. Takip öncesi için işlemiş faiz istenemez (Yargıtay Hukuk Genel Kurulu)."
  - on: "Haksız fiilde faiz başlangıcı?"
    arka: "Kural olarak olay tarihi (TBK m. 117/2). 31.7.2026'dan beri çalışma gücü kaybı ve destek tazminatında kazancın bilinemediği dönem için karar tarihi (TBK m. 55)."
  - on: "Gecikme tazminatında ispat yükü? (TBK m. 118)"
    arka: "Alacaklı temerrüdü, zararı ve illiyeti; borçlu temerrüde düşmekte kusursuz olduğunu ispatlar."
  - on: "Temerrüt beklenmedik hâl riskini nasıl etkiler? (TBK m. 119)"
    arka: "Borçlu beklenmedik hâlden de sorumlu olur. Kurtuluş: gecikmede kusursuzluk ya da zamanında ifa edilse bile zararın doğacağı."
  - on: "Temerrüt faizi için kusur ve zarar ispatı gerekir mi?"
    arka: "Hayır. Temerrüt faizi götürü bir asgari tazminattır; kusursuz borçlu da öder."
  - on: "Adi işte sözleşme yoksa temerrüt faizi oranı?"
    arka: "Kanuni faiz oranı (TBK m. 120/1; 3095 sayılı Kanun m. 2/1)."
  - on: "31.7.2026'dan beri kanuni faiz nasıl belirlenir?"
    arka: "TCMB'nin önceki yıl 31 Aralık reeskont oranının %80'i; 30 Haziran'da 5 puan veya daha fazla fark varsa ikinci yarıda o oranın %80'i (3095 sayılı Kanun m. 1). Örneğin reeskont oranı %38,75 ise kanuni faiz %31 olur."
  - on: "Sözleşmeyle temerrüt faizinin üst sınırı? (TBK m. 120/2)"
    arka: "Kanuni faizin yüzde yüz fazlası, yani iki katı. Sözleşme faizinde sınır yüzde elli fazlasıdır (TBK m. 88/2)."
  - on: "Akdî faiz var, temerrüt faizi kararlaştırılmamışsa?"
    arka: "Akdî oran kanuni faizden yüksekse temerrüt faizi de akdî oranda işler (TBK m. 120/3)."
  - on: "Ticari işte sözleşme yoksa temerrüt faizi?"
    arka: "Kanuni faizden yüksekse TCMB avans faizi istenebilir (3095 sayılı Kanun m. 2/2). Borçlunun tacir olması ve borcun ticari işletmesiyle ilgili olması yeter; açıkça istenmelidir."
  - on: "TBK m. 88/2 ve m. 120/2 sınırları ticari işte uygulanır mı?"
    arka: "Hukuk Genel Kurulu çoğunluğuna göre hayır; ticari işte oran serbesttir (TTK m. 8/1). Konu tartışmalıdır."
  - on: "TTK m. 1530'da ödeme günü belirlenmemiş mal tedarikinde temerrüt?"
    arka: "Faturanın alınmasını izleyen otuz günün sonunda, ihtara gerek olmadan. Faiz şart edilmemiş olsa da işler."
  - on: "Vadede ödenmeyen yabancı para borcunda alacaklının seçimi? (TBK m. 99/3)"
    arka: "Aynen döviz, vade günü kuru ya da fiilî ödeme günü kuru üzerinden Türk lirası."
  - on: "Yabancı para borcunda fiilî ödeme kuru seçilirse hangi faiz işler?"
    arka: "Alacak dövizde kalır; vadeden itibaren devlet bankalarının o dövizle bir yıllık mevduata ödediği en yüksek faiz (3095 sayılı Kanun m. 4/a)."
  - on: "Faiz, irat ve bağışlanan parada temerrüt faizi? (TBK m. 121)"
    arka: "Ancak takip ya da dava gününden işler. Aykırı anlaşma ceza koşulu sayılır; temerrüt faizine temerrüt faizi yürütülemez."
  - on: "Aşkın zarar nedir? (TBK m. 122)"
    arka: "Temerrüt faiziyle karşılanmayan zarar. Alacaklı somut zararı ve illiyeti, borçlu hiçbir kusurunun olmadığını ispatlar."
  - on: "Hukuk Genel Kurulu'na göre genel bir 'paramı enflasyon eritti' iddiası aşkın zarar için yeter mi?"
    arka: "Hayır. Genel ekonomik göstergeler yetmez, alacaklıya özgü somut vakıa gerekir. Bazı daireler yüksek enflasyon dönemlerinde soyut ispatı kabul eder."
  - on: "'Kesin vade' ile 'kesin vadeli işlem' farkı?"
    arka: "Belirli gün ihtarı gereksiz kılar (TBK m. 117/2). Kesin vadeli işlem seçimlik haklar için süre vermeyi gereksiz kılar (TBK m. 124/3)."
