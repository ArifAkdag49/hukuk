  - soru: |
      İşçi Hasan'ın işyerine sarhoş geldiğini işveren vekili 4 Mayıs Pazartesi günü öğrenmiş, ancak işveren feshi 25 Mayıs günü bildirmiştir. Aynı davranışta maddi çıkar yoktur. İşverenin fesih yetkisi bakımından hangisi doğrudur?
    siklar:
      - "Fesih hakkı İK m. 26'daki altı iş günü geçtiği için kullanılamaz"
      - "Maddi çıkar bulunmadığından bir yıllık süre işler ve fesih süresindedir"
      - "Fesih hakkı fiilden itibaren altı ay içinde kullanılabilir"
      - "Süre, işverenin kararı verdiği günden başlar"
    dogru: 0
