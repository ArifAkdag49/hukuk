      Bent suçun **işyerinde** işlenmesini, **yedi günden fazla** hapis cezasını ve cezanın **ertelenmemesini** birlikte arar. Diğer şıklarda biri eksiktir.
  - soru: |
      Tekniker Burak'a amiri bir kez rapor formatını hazırlamasını söylemiş, Burak formatı hazırlamamıştır. Amir görevi kendisine hiç hatırlatmadan işveren vekiline durumu bildirmiş, işveren aynı gün İK m. 25/II-h'ye dayanarak sözleşmeyi derhal feshetmiştir. Hangisi doğrudur?
    siklar:
      - "Bentteki unsurlar gerçekleşmemiştir; görevin işçiye hatırlatılmış olması ve işçinin yapmamakta ısrar etmesi gerekir"
      - "Görev bir kez yapılmadığı için bent uygulanır"
      - "Bent yalnız noter ihtarı yapılmışsa uygulanır"
      - "Bent, işçinin sözlü olarak reddetmesi hâlinde de hatırlatma aranmaksızın uygulanır"
    dogru: 0
    aciklama: |
      İK m. 25/II-h, ödevli olduğu görevleri kendisine **hatırlatıldığı hâlde** yapmamakta **ısrar** etmeyi arar. Olayda hatırlatma ve sonraki ısrar yoktur; bu yüzden bent uygulanmaz. Kanun noter ihtarı şartı koymaz.
  - soru: |
      Heyelan nedeniyle köy yolu kapanan işçi Gülay işyerine on gün gelememiştir. İşverenin durumu için hangisi doğrudur?
    siklar:
      - "İK m. 25/III'e dayanarak derhal feshedebilir; bekleme süresinde bir haftaya kadar her gün için yarım ücret ödenir"
      - "İK m. 25/III uygulanmaz, çünkü zorlayıcı sebepler yalnız işçi tarafından ileri sürülebilir"
      - "Derhal fesih hakkı doğması için on beş günlük süre geçmelidir"
      - "Fesih hakkı doğar, ama bekleme süresinde tam ücret ödenir"
