  - 📌 Güncel: İK m. 74'e göre doğum izni 8 + 16 = **24 hafta** (7578 sayılı Kanun).
doktrin: |
  ### Üst düzey yöneticilerin kapsam durumu (İK m. 18/5)
  Genel müdür yardımcısı, direktör gibi unvanlı yöneticilerin iş güvencesi dışında kalıp kalmadığı sıkça tartışılır. Bir yaklaşım, unvana bakar ve üst yöneticilerin işveren adına hareket ettiği için iş güvencesi dışında olması gerektiğini savunur. Hâkim yaklaşım ise kanunun dar yazıldığını, istisnanın yalnız bütünü yöneten ve işe alma-çıkarma yetkisi bulunan vekilleri kapsadığını, belirli bir birimi yöneten yöneticinin iş güvencesinden yararlandığını kabul eder. Metin "ve" bağlacıyla iki şartı birlikte aradığı için unvandan çok yetkinin önemi vurgulanır.

  ### İşçi sayısı ve kıdemin işveren tarafından manipülasyonu
  İşverenin işçiyi altı aylık kıdem dolmadan hemen önce ya da işçi sayısını otuzun altında tutmak için işten çıkardığı iddialarında, ispat ve dürüstlük kuralı (hakkın kötüye kullanılması yasağı) devreye girer. Bu hâllerde fesihin gerçek tarihi ve işçi sayısı araştırılır; sırf şekli bir tarih verilerek iş güvencesinin devre dışı bırakılması kabul görmez. Her somut olayda ispat ve delillerle çözülür; kanunda bu konuda özel bir hüküm yoktur.

  ### Savunma alınmasında kapsam
  İK m. 19/2'nin lafzı davranış ve verim nedenlerini anar; İK m. 25/II şartlarına uygun fesih hakkını da açıkça saklı tutar. Sağlık sebeplerinde savunma aranıp aranmayacağı uzun süre tartışılmıştır. Yargıtay'ın 2018 tarihli içtihadı birleştirme kararı, sağlık raporları nedeniyle İK m. 25/I-b uyarınca yapılan derhal fesihte savunma alınmasının gerekmediğini kabul ederek bu tartışmayı haklı fesih bakımından kapatmıştır. Bekleme süresini aşmayan ama sık sık rapor alma nedeniyle geçerli sebeple yapılan fesihte ise uygulama ağırlıklı olarak durumu işçinin verimiyle ilgili sayar ve savunma arar. Sınavda kanun metnine ve içtihadı birleştirme kararına dayan, ara örneklerde gerekçeni yaz.
sozluk:
  - terim: İş güvencesi
    tanim: "Belirli şartları taşıyan işçinin belirsiz süreli sözleşmesinin geçerli sebep ve usule uyulmadan feshedilememesi (İK m. 18-19)."
  - terim: Geçerli sebep
    tanim: "İşçinin yeterliliğinden, davranışlarından ya da işletmenin, işyerinin veya işin gereklerinden kaynaklanan, süreli feshe imkân veren sebep."
  - terim: Haklı neden
    tanim: "İş ilişkisinin sürdürülmesini dürüstlük kurallarına göre beklenemez kılan, derhal feshe imkân veren ağır sebep (İK m. 24-25)."
  - terim: İşletmesel karar
    tanim: "İşverenin işletmenin organizasyonuna ilişkin aldığı karar; yerindeliği denetlenmez, tutarlılığı ve keyfî olup olmadığı denetlenir."
  - terim: Son çare (ultima ratio) ilkesi
    tanim: "Feshin ancak daha hafif tedbirlerin yetersiz kalması hâlinde başvurulacak kaçınılmaz yol olması gerektiği ilkesi."
  - terim: İşveren vekili
    tanim: "İşveren adına hareket eden yönetici; İK m. 18/5'te sayılan dar grup iş güvencesi dışındadır."
  - terim: Belirsiz süreli iş sözleşmesi
    tanim: "Bir süreye bağlı olarak yapılmayan veya esaslı neden olmaksızın zincirleme belirli süreli yapılan sözleşme (İK m. 11)."
  - terim: Savunma alma
    tanim: "İşçinin davranışı veya verimi nedeniyle fesihten önce hakkındaki iddialara karşı savunmasının alınması (İK m. 19/2)."
  - terim: Yazılı ve açık-kesin sebep
    tanim: "Fesih bildiriminin yazılı olması ve sebebin anlaşılır, somut olgularla belirtilmesi zorunluluğu (İK m. 19/1)."
  - terim: Toplu işçi çıkarma
    tanim: "İK m. 29'daki eşiklere ulaşan sayıda işçinin işine bir aylık süre içinde işletme gerekleriyle son verilmesi; geçerli sebep aranmasına engel değildir."
kararlar:
  - id: "1071283800"
    ozet: |
      Davacı, kayyım atanan bir şirkette uygulamadan sorumlu genel müdür yardımcısı olarak çalışırken, yeni yönetim kurulunun yazısıyla "sevk ve idaresinde beklenen iş birliğini sağlayamama, gereken gayreti gösterememe" gerekçesiyle feshedilmiştir. İlk derece mahkemesi, davranışa dayalı fesihte savunma alınması gerektiği hâlde alınmadığı için feshi geçersiz saymış; istinaf başvurusu esastan reddedilmiştir. Yargıtay 9. Hukuk Dairesi önce feshi geçerli bulup davayı reddetmiş, ardından Anayasa Mahkemesi gerekçeli karar hakkının ihlal edildiğine karar vermiştir. Daire önceki kararını ortadan kaldırarak istinaf kararını oybirliğiyle onamış, böylece savunma alınmadan yapılan davranış ve verim feshinin geçersizliği sonucu geçerli kalmıştır. Karar, İK m. 19/2'nin uygulamada davranış ve verim nedenleriyle fesihte savunma alma yükümlülüğünün feshin sonucunu belirleyen bir koşul olduğunu gösterir.
  - id: "900729900"
    ozet: |
      Bir belediye, personel giderlerinin bütçe gelirlerine oranının yasal sınırı aştığı gerekçesiyle, emekliliğe hak kazanmış 27 kadrolu işçinin sözleşmesini toplu işçi çıkarma yoluyla feshetmiştir. Açılan işe iade davalarında bölge adliye mahkemesinin bir dairesi feshi geçerli bulurken diğer dört dairesi geçersiz saymıştır; çelişkinin giderilmesi için Yargıtay'a başvurulmuştur. Yargıtay 9. Hukuk Dairesi, toplu işçi çıkarmada da feshin geçerli bir nedene dayanması ve işletmesel karar sonucu feshin zorunlu ve kaçınılmaz olması gerektiğini vurgulamıştır. Pandemi döneminde İK'nın geçici 10. maddesiyle işverene tanınan tek taraflı ücretsiz izne çıkarma gibi daha hafif imkânlardan yararlanılmadığı için feshin son çare ilkesine uygun olmadığı sonucuna varılmış; çelişki, feshin geçerli nedene dayanmadığını kabul eden dairelerin görüşü doğrultusunda giderilmiştir.
sorular:
  - soru: |
      İK m. 18/1'e göre iş güvencesinden yararlanabilmek için işyerinde en az kaç işçi çalışmalı ve işçinin en az ne kadar kıdemi bulunmalıdır?
    siklar:
      - "Yirmi işçi ve bir yıl kıdem"
      - "Otuz işçi ve altı ay kıdem"
      - "Otuz işçi ve bir yıl kıdem"
      - "Elli işçi ve altı ay kıdem"
    dogru: 1
    aciklama: |
      İK m. 18/1: otuz veya daha fazla işçi çalıştıran işyerlerinde en az altı aylık kıdemi olan işçi. Yer altı işlerinde kıdem şartı aranmaz.
  - soru: |
      Soma'daki bir yer altı kömür ocağında üç aydır belirsiz süreli iş sözleşmesiyle çalışan işçi Ali'nin sözleşmesi feshedilmiştir. İşyerinde otuzdan fazla işçi çalışmaktadır. İş güvencesi bakımından hangisi doğrudur?
    siklar:
      - "Altı ay kıdemi doldurmadığı için iş güvencesinden yararlanamaz"
      - "Yer altı işlerinde kıdem şartı aranmadığı için iş güvencesinden yararlanabilir"
      - "Yer altı işçileri iş güvencesi kapsamı dışındadır"
      - "Yer altı işçisi için kıdem şartı altı aydan bir yıla çıkar"
    dogru: 1
    aciklama: |
      İK m. 18/1'in ek cümlesi: yer altı işlerinde çalışan işçilerde kıdem şartı aranmaz. Otuz işçi şartı ise sağlandığına göre Ali kapsamdadır.
  - soru: |
      X Ltd. Şti.'nin tekstil işkolunda 20, gıda işkolunda 15 işçi çalışan iki ayrı işyeri vardır. Tekstil işyerinde bir yıldır çalışan Ayşe'nin sözleşmesi feshedilmiştir. Ayşe iş güvencesinden yararlanır mı?
    siklar:
      - "Evet; çünkü işverenin toplam 35 işçisi vardır"
      - "Hayır; işkolları farklı olduğundan işyerlerindeki işçi sayıları toplanmaz ve otuz işçi şartı sağlanmaz"
      - "Evet; çünkü kıdemi bir yıldır"
      - "Hayır; çünkü tekstil işyerinde kıdem şartı iki yıldır"
    dogru: 1
    aciklama: |
      İK m. 18/4: işçi sayısı, yalnız aynı işkolundaki birden fazla işyeri varsa onların toplamına göre belirlenir. İşkolları farklı olduğu için sayılar toplanmaz.
  - soru: |
      Zeynep, aynı işverenin gıda işyerinde dört ay, ardından tekstil işyerinde üç ay çalışmıştır. İş güvencesi bakımından altı aylık kıdem hakkında hangisi doğrudur?
    siklar:
      - "Yalnız son işyerindeki süre sayılır; üç ay yetersizdir"
      - "İşyerleri aynı işkolunda olmadığı için süreler birleştirilemez"
      - "Aynı işverenin değişik işyerlerinde geçen süreler birleştirilir; yedi ay kıdem vardır"
      - "Süreler birleştirilir, ancak yalnız aynı işkolundaki işyerleri sayılır"
    dogru: 2
    aciklama: |
      İK m. 18/4: altı aylık kıdem, aynı işverenin bir veya değişik işyerlerinde geçen süreler birleştirilerek hesaplanır. Kıdemde işkolu aranmaz; işkolu birleştirmesi işçi sayısı içindir.
  - soru: |
      Aşağıdakilerden hangisi İK m. 18/5 kapsamında iş güvencesi dışında kalan işveren vekillerindendir?
    siklar:
      - "İşyerinin bütününü yöneten ama işçi alma ve çıkarma yetkisi olmayan fabrika müdürü"
      - "Yalnız bir vardiyayı yöneten ve işçi alma-çıkarma yetkisi olmayan vardiya amiri"
      - "İşyerinin bütününü sevk ve idare eden ve işçiyi işe alma ve işten çıkarma yetkisi bulunan işveren vekili"
      - "İşyerinde en kıdemli olan işçi"
    dogru: 2
    aciklama: |
      İK m. 18/5: işyerinin bütününü sevk ve idare eden ve işçiyi işe alma ve işten çıkarma yetkisi bulunan işveren vekilleri kapsam dışıdır. İki şart birlikte aranır; yetkisi yoksa vekil kapsam dışında olmaz.
  - soru: |
      Aşağıdakilerden hangisi İK m. 18/3'te özellikle geçerli sebep oluşturmayacağı belirtilen hâllerden biridir?
    siklar:
      - "İşçinin performansının ölçülebilir biçimde düşmesi"
      - "Kadın işçinin İK m. 74'teki çalıştırılma yasağı sürelerinde işe gelmemesi"
      - "İşyerindeki bölümün kapatılması"
      - "İşçinin uyarılara rağmen sürekli geç gelmesi"
    dogru: 1
    aciklama: |
      İK m. 18/3-e: İK m. 74'te kadın işçilerin çalıştırılmasının yasak olduğu sürelerde işe gelmemek geçerli sebep oluşturmaz. Diğer şıklar yeterlilik, işletme gerekleri ve davranış gruplarına örnektir.
  - soru: |
      İşçi Mehmet, ödenmeyen fazla mesai alacağı için işveren aleyhine dava açmıştır. İşveren kısa süre sonra "uyum sorunu" diyerek sözleşmeyi feshetmiştir. Mehmet iş güvencesi kapsamındadır. Hangisi doğrudur?
    siklar:
      - "Dava açmak geçerli sebep oluşturmaz; fesih İK m. 18/3-c ışığında geçersiz sayılabilir"
      - "İşveren her zaman serbestçe feshedebilir"
      - "Dava açmak haklı neden oluşturur"
      - "İşçi dava açtığı için iş güvencesinden çıkar"
    dogru: 0
    aciklama: |
      İK m. 18/3-c: mevzuattan veya sözleşmeden doğan haklarını takip için işveren aleyhine idari veya adli makamlara başvurmak geçerli sebep sayılmaz. Gerçek sebep buysa fesih geçersizdir; işveren geçerli sebebi ispatla yükümlüdür (İK m. 20/2).
  - soru: |
      İK m. 19/1'e göre iş güvencesi kapsamındaki işçinin sözleşmesini fesheden işveren hangisini yapmak zorundadır?
    siklar:
      - "Fesih bildirimini sözlü yapıp sebebi daha sonra açıklamak"
      - "Fesih bildirimini yazılı yapmak ve fesih sebebini açık ve kesin bir şekilde belirtmek"
      - "Fesih bildirimini noter aracılığıyla yapmak"
      - "Fesih için iş mahkemesinden izin almak"
    dogru: 1
    aciklama: |
      İK m. 19/1: yazılı bildirim ve açık-kesin sebep. Noter veya mahkeme izni kanunda aranmaz.
  - soru: |
      Bir restoranda otuzdan fazla işçi çalışmaktadır. İşveren, iki yıldır belirsiz süreli iş sözleşmesiyle çalışan kasiyer Elif'in iş sözleşmesini "kasa farklarına sürekli sebep olması" gerekçesiyle, Elif'in savunmasını almadan yazılı bildirimle feshetmiştir. Hangisi doğrudur?
    siklar:
      - "Savunma alınmaması fesihi etkilemez"
      - "Davranış veya verimle ilgili fesihte savunma alınması gerekir; alınmaması İK m. 19/2'ye aykırıdır"
      - "Yalnız İK m. 25/II kapsamındaki fesihlerde savunma gerekir"
      - "Savunma yalnız işe iade davasında alınır"
    dogru: 1
    aciklama: |
      İK m. 19/2: işçinin davranışı veya verimi ile ilgili nedenlerle fesihten önce savunma alınmalıdır. Yargıtay'ın bu kuraldan biçim eksikliğine dayalı geçersizlik sonucu çıkardığı kararlar vardır; İK m. 25/II şartlarına uygun fesih hakkı ise saklıdır.
  - soru: |
      İşveren, bir bölümü kapatarak 40 işçili işyerinde altı aydır çalışan Ahmet'in işine işletme gerekleriyle son vermiştir. Kapatma kararı gerçekten uygulanmıştır ve Ahmet'e başka iş önerilmesi mümkün değildir. Fesihten önce Ahmet'in savunması alınmamıştır. Hangisi doğrudur?
    siklar:
      - "İK m. 19/2 gereği fesih yalnız bu nedenle geçersizdir"
      - "İşletmesel nedenle fesihte işçinin davranışı veya verimi ile ilgili bir sebep olmadığından İK m. 19/2'deki savunma şartı aranmaz"
      - "İşletmesel fesih yazılı yapılmak zorunda değildir"
      - "İşveren mahkemeden önceden onay almalıdır"
    dogru: 1
    aciklama: |
      İK m. 19/2 yalnız davranış veya verimle ilgili nedenleri kapsar. İşletmesel nedenlerle fesihte savunma alma zorunluluğu yoktur; ancak İK m. 19/1'deki yazılı bildirim ve açık-kesin sebep şartı devam eder.
  - soru: |
      İşletmesel nedenle yapılan fesihte mahkemenin denetimi bakımından hangisi doğrudur?
    siklar:
      - "Mahkeme işletme kararının yerindeliğini ve ekonomik sonuçlarını yeniden değerlendirir"
      - "Mahkeme yalnız kararın alınıp alınmadığına bakar, uygulamasına bakmaz"
      - "Mahkeme yerindelik denetimi yapmaz; tutarlılığı, keyfî olup olmadığını ve feshin son çare olup olmadığını denetler"
      - "Işletmesel nedenle fesih denetime tabi değildir"
    dogru: 2
    aciklama: |
      İşletmesel kararlar yerindelik denetimine tabi tutulmaz; ancak tutarlılık, keyfîlik ve ölçülülük (son çare ilkesi) denetlenir. Yargıtay toplu işçi çıkarma hâlinde de feshin kaçınılmaz olup olmadığını arar.
  - soru: |
      Belirli süreli iş sözleşmesi esaslı bir neden olmaksızın üst üste yapılmış ve işçi otuz işçili işyerinde bir yıldır çalışmaktadır. İş güvencesi bakımından hangisi doğrudur?
    siklar:
      - "Gerçek belirli süreli sayıldığından iş güvencesi kapsamı dışındadır"
      - "İK m. 11/2 gereği baştan belirsiz süreli sayılır; diğer şartlar sağlanıyorsa iş güvencesinden yararlanır"
      - "Zincirleme sözleşmede iş güvencesi yalnız son sözleşme için doğar"
      - "Zincirleme sözleşme yapılan işçi iş güvencesinden hiçbir hâlde yararlanamaz"
    dogru: 1
    aciklama: |
      İK m. 11/2: esaslı neden olmadıkça zincirleme belirli süreli sözleşme yapılamaz, aksi hâlde sözleşme başlangıçtan itibaren belirsiz süreli kabul edilir. Diğer şartlar (otuz işçi, altı ay kıdem) varsa İK m. 18 uygulanır.
olaylar:
  - olay: |
      X Madencilik A.Ş. merkezi İstanbul'da olup aynı işkolunda faaliyet gösteren iki yer altı kömür ocağı işletmektedir: Kütahya ocağında 22, Soma ocağında 15 işçi çalışmaktadır. Soma ocağında üç ay önce belirsiz süreli iş sözleşmesiyle işe başlayan maden işçisi Mehmet, son bir ayda iki kez vardiyaya 15 dakika geç kaldığı gerekçesiyle, savunması alınmaksızın ve sözlü olarak işten çıkarılmıştır.

      Kütahya ocağını on yıldır belirsiz süreli iş sözleşmesiyle sevk ve idare eden İşletme Müdürü Yusuf'un işçi alma ve çıkarma yetkisi yoktur; bu yetki yalnız İstanbul'daki Genel Müdürlüktedir. Şirket, maliyetlerin arttığını ve Yusuf'un emekliliğe hak kazandığını belirterek hiçbir alternatif tedbir araştırmadan Yusuf'un sözleşmesini yazılı bildirimle feshetmiştir. Fesih yazısında gerekçe olarak yalnızca "maliyet nedenleri" yazılıdır.

      1. Mehmet ve Yusuf iş güvencesi kapsamında mıdır?
      2. Mehmet'in feshi usul bakımından geçerli midir?
      3. Yusuf'un feshini geçerli sebep ve son çare ilkesi bakımından değerlendiriniz.
    olcut:
      - {tespit: "Aynı işkolundaki iki işyerinin işçi sayılarının toplanması (22 + 15 = 37) ve otuz işçi şartının sağlanması", puan: 20, madde: "İK m. 18"}
      - {tespit: "Mehmet yer altı işçisi olduğundan altı aylık kıdem şartının aranmaması", puan: 20, madde: "İK m. 18"}
      - {tespit: "Mehmet'e yazılı bildirim yapılmamasının İK m. 19/1'e aykırılığı", puan: 15, madde: "İK m. 19"}
      - {tespit: "Davranışa dayalı fesihte savunma alınmamasının İK m. 19/2'ye aykırılığı", puan: 15, madde: "İK m. 19"}
      - {tespit: "Yusuf'un İK m. 18/5 kapsamında olmadığı (işe alma-çıkarma yetkisi yok), iş güvencesinden yararlandığı", puan: 15, madde: "İK m. 18"}
      - {tespit: "İşletmesel fesihte ispat yükünün işverende olması, alternatif tedbirler araştırılmadığından son çare ilkesine uyulmadığının değerlendirilmesi", puan: 15, madde: "İK m. 20"}
    cozum: |
      **Nitelendirme:** Olay, iş güvencesinin kapsamı ile davranış ve işletme gereklerine dayalı fesihlerin geçerliliğini ve usulünü birlikte sorar.

      **Hukuki sorunlar:** (1) İş güvencesi şartları; (2) Mehmet'in davranışa dayalı feshinde usul; (3) Yusuf'un işletmesel feshinde geçerli sebep ve son çare ilkesi.

      **İlgili hükümler:** İK m. 18/1, İK m. 18/4, İK m. 18/5; İK m. 19/1-2; İK m. 20/2.

      **Değerlendirme:**
      *Kapsam.* İK m. 18/4'e göre işverenin aynı işkolunda birden fazla işyeri varsa işçi sayısı bu işyerlerinin toplamına göre belirlenir. Kütahya (22) ve Soma (15) aynı işkolunda olduğundan toplam 37 işçi vardır; otuz işçi şartı sağlanır. Mehmet'in kıdemi üç aydır; ancak İK m. 18/1'in ek cümlesine göre yer altı işlerinde çalışan işçilerde kıdem şartı aranmaz. Mehmet belirsiz süreli sözleşmeyle çalıştığına göre iş güvencesi kapsamındadır. Yusuf'un işyerini sevk ve idare ettiği doğrudur; ancak İK m. 18/5'te "ve" bağlacıyla işe alma ve işten çıkarma yetkisi de aranır. Yusuf'un bu yetkisi olmadığı için kapsam dışı kalmaz, on yıllık kıdemi ve belirsiz süreli sözleşmesiyle o da iş güvencesinden yararlanır.
      *Mehmet'in feshi.* İK m. 19/1 yazılı bildirim ve açık-kesin sebep ister; sözlü fesih bu şarta aykırıdır. Fesih sebebi geç kalmak yani işçinin davranışıdır; İK m. 19/2 uyarınca savunma alınmadan yapılamaz. Kanun, İK m. 25/II şartlarına uygun fesih hakkını saklı tutar; ancak 15 dakikalık iki geç kalma bu ağırlıkta bir haklı neden olarak görünmemektedir. Bu nedenle fesih usulden de geçersizdir.
      *Yusuf'un feshi.* Fesih yazılıdır ve gerekçe yazılıdır; ancak gerekçenin "maliyet nedenleri" biçiminde soyut kalması açık ve kesin sebep şartı bakımından tartışılabilir. İşletmesel nedenle fesihte İK m. 19/2'deki savunma aranmaz. Geçerli sebebi ispat yükü işverendedir (İK m. 20/2). Mahkeme işletme kararının yerindeliğini denetlemez; ancak tutarlılığı, keyfî olup olmadığını ve feshin son çare olup olmadığını inceler. Emekliliğe hak kazanmış olmak tek başına geçerli sebep sayılmaz. Hiçbir alternatif tedbir (örneğin başka görev, daha hafif önlemler) araştırılmadığı için fesih son çare ilkesine uygun görünmemektedir.

      **Sonuç:** Mehmet ve Yusuf iş güvencesi kapsamındadır. Mehmet'in feshi yazılı bildirim ve savunma alma şartlarına uyulmadığı için usulden geçersizdir. Yusuf'un feshinde işveren, işletmesel kararın tutarlı ve feshin kaçınılmaz olduğunu kanıtlayamazsa fesih geçersiz sayılır.
  - olay: |
      Ankara'da 45 işçi çalıştıran Y Plastik Ltd. Şti.'nde pazarlama uzmanı Ayşe sekiz aydır belirsiz süreli sözleşmeyle çalışmaktadır. Ayşe, ödenmeyen fazla mesai ücreti için işverene karşı iş mahkemesinde dava açmıştır. Dava açıldıktan bir hafta sonra işveren Ayşe'ye e-postayla "performansınızın yetersiz olması" nedeniyle iş sözleşmesinin feshedildiğini bildirmiştir. Ayşe'nin performansının düşük olduğuna dair işveren daha önce hiçbir yazılı uyarı yapmamış, Ayşe'den savunma da istememiştir.

      Aynı işyerinde üç yıldır belirsiz süreli sözleşmeyle çalışan Zehra ise doğum iznine ayrıldığı için işyerine gelmemektedir; işveren Zehra'ya "iznini çok uzattığı" gerekçesiyle fesih yazısı göndermiştir. Zehra'nın doğum izninin hâlâ sürdüğü anlaşılmaktadır.

      1. Ayşe iş güvencesi kapsamında mıdır?
      2. Ayşe'nin feshini geçerli sebep ve usul bakımından değerlendiriniz.
      3. Zehra'nın feshini değerlendiriniz.
    olcut:
      - {tespit: "Ayşe için otuz işçi, altı ay kıdem ve belirsiz süreli sözleşme şartlarının sağlanması", puan: 20, madde: "İK m. 18"}
      - {tespit: "Fesih sebebi performans (yeterlilik/verim) olduğundan savunma alınmamasının İK m. 19/2'ye aykırılığı", puan: 20, madde: "İK m. 19"}
      - {tespit: "Dava açmanın İK m. 18/3-c uyarınca geçerli sebep olmaması ve gerçek sebebin dava olabileceği", puan: 20, madde: "İK m. 18"}
      - {tespit: "İspat yükünün işverende olması; işçinin başka sebep iddiasını ispatlaması", puan: 15, madde: "İK m. 20"}
      - {tespit: "Zehra'nın doğum izninde işe gelmemesinin İK m. 18/3-e uyarınca geçerli sebep olmaması", puan: 15, madde: "İK m. 18"}
      - {tespit: "İK m. 74 değişikliği: doğum izninin doğumdan önce 8, sonra 16 hafta, toplam 24 hafta olması", puan: 10, madde: "İK m. 74"}
    cozum: |
      **Nitelendirme:** Olay, iş güvencesi kapsamındaki işçilerin fesihlerinde geçerli sebep, usul ve geçerli sebep sayılmayan hâlleri sorar.

      **Hukuki sorunlar:** (1) Ayşe iş güvencesi şartlarını taşıyor mu? (2) Performans nedeniyle feshin usulü ve gerçek sebebi nedir? (3) Doğum izni sırasında yapılan fesih geçerli midir?

      **İlgili hükümler:** İK m. 18/1, İK m. 18/3-c, İK m. 18/3-e; İK m. 19/1-2; İK m. 20/2; İK m. 74.

      **Değerlendirme:**
      *Kapsam.* Y Ltd. Şti.'nde 45 işçi vardır (otuzdan fazla), Ayşe'nin kıdemi sekiz aydır (altı ay şartı sağlanmıştır) ve sözleşmesi belirsiz süreli olduğundan Ayşe iş güvencesi kapsamındadır (İK m. 18/1). Ayşe pazarlama uzmanıdır; işveren vekili olduğuna dair bir olgu yoktur, bu nedenle İK m. 18/5 uygulanmaz.
      *Ayşe'nin feshi.* Fesih e-postayla yapılmıştır. Bildirimin yazılı olması ve sebebin açık ve kesin belirtilmesi gerekir (İK m. 19/1). "Performansınızın yetersiz olması" soyut kalmaktadır. Sebep işçinin verimi ile ilgili olduğundan İK m. 19/2 uyarınca fesihten önce savunma alınmalıdır; alınmamıştır, bu nedenle fesih biçim bakımından geçersizdir. Ayrıca fesih, dava açıldıktan bir hafta sonra yapılmıştır. Mevzuattan doğan hakları takip için işveren aleyhine adli makamlara başvurmak İK m. 18/3-c uyarınca geçerli sebep oluşturmaz. Geçerli sebebin ispat yükü işverende olduğu için (İK m. 20/2) işverenin performans düşüklüğünü somut ve objektif olgularla kanıtlaması gerekir; daha önce uyarı yapılmamış olması bunu güçleştirir. Ayşe, feshin başka bir sebebe (dava açması) dayandığını iddia ederse bunu ispat etmelidir.
      *Zehra'nın feshi.* Zehra İK m. 74'e göre kadın işçilerin çalıştırılmasının yasak olduğu sürede izindedir. İK m. 18/3-e, bu sürelerde işe gelmemeyi geçerli sebep saymaz. 7578 sayılı Kanunla İK m. 74 değişmiş; doğumdan önce sekiz, doğumdan sonra onaltı, toplam yirmidört hafta çalıştırılmama esası getirilmiştir. İzin süresi içinde işe gelmeme nedeniyle yapılan fesih geçerli sebebe dayanmaz. Zehra da 45 işçili işyerinde üç yıllık kıdem ve belirsiz süreli sözleşmeyle iş güvencesi kapsamındadır.

      **Sonuç:** Ayşe iş güvencesi kapsamındadır; savunma alınmadan, soyut sebeple ve dava açması üzerine yapılan fesih geçersiz sayılmaya elverişlidir. Zehra'nın doğum izni sırasındaki feshi İK m. 18/3-e gereği geçerli sebebe dayanmaz.
kartlar:
  - on: "İş güvencesinin kapsam şartları nelerdir (İK m. 18)?"
    arka: "Otuz işçi, altı ay kıdem, belirsiz süreli sözleşme, İK m. 18/5'teki işveren vekillerinden olmama. Yer altı işlerinde kıdem aranmaz."
  - on: "Kıdem ve işçi sayısı birleştirmesinde fark nedir (İK m. 18/4)?"
    arka: "Kıdemde aynı işverenin değişik işyerlerindeki süreler birleştirilir; işçi sayısında yalnız aynı işkolundaki işyerleri toplanır."
  - on: "İş güvencesi dışında kalan işveren vekilleri kimlerdir?"
    arka: "İşletmenin bütününü yöneten vekil ve yardımcıları; işyerinin bütününü yöneten ve işe alma-çıkarma yetkisi de olan vekiller (İK m. 18/5)."
  - on: "Üç geçerli sebep grubu nedir?"
    arka: "İşçinin yeterliliği, işçinin davranışları, işletmenin/işyerinin/işin gerekleri (İK m. 18/1)."
  - on: "Geçerli sebep ile haklı neden farkı?"
    arka: "Haklı neden derhal feshe imkân verir (İK m. 25); geçerli sebep daha hafiftir, süreli feshe yeter."
  - on: "İK m. 18/3'te hangi hâller geçerli sebep sayılmaz?"
    arka: "Sendika üyeliği/faaliyeti, sendika temsilciliği, işveren aleyhine hak arama, ayrımcılık nedenleri, İK m. 74 süreleri, İK m. 25/I-b bekleme süresi."
  - on: "İşletmesel fesihte mahkeme neyi denetler?"
    arka: "Yerindeliği değil; tutarlılığı, keyfîliği ve feshin son çare olup olmadığını."
  - on: "Son çare (ultima ratio) ilkesi nedir?"
    arka: "Fesih ancak daha hafif tedbirler (başka iş, mevzuatın verdiği ücretsiz izin imkânı vb.) yetersiz kalırsa başvurulacak kaçınılmaz yoldur."
  - on: "İK m. 19/1 ne ister?"
    arka: "Yazılı fesih bildirimi ve fesih sebebinin açık ve kesin belirtilmesi."
  - on: "İK m. 19/2 hangi fesihlerde savunma ister?"
    arka: "İşçinin davranışı veya verimi ile ilgili nedenlerle yapılan fesihlerde; İK m. 25/II şartlarına uygun fesih hakkı saklıdır."
  - on: "Geçerli sebebi kim ispat eder?"
    arka: "İşveren; işçi başka bir sebebe dayanıldığını iddia ederse bunu ispat eder (İK m. 20/2)."
  - on: "7578 sayılı Kanunla İK m. 74'te ne değişti?"
    arka: "Doğumdan önce 8, doğumdan sonra 16, toplam 24 hafta. İK m. 18/3-e bu çalıştırma yasağı sürelerine gönderme yapar."
