  - 📌 İş güvencesi şartları (İK m. 18/1): **30 işçi, 6 ay kıdem, belirsiz süreli sözleşme**, işveren vekili olmamak.
  - 📌 **Yer altı işlerinde** çalışan işçilerde kıdem şartı **aranmaz**; otuz işçi şartı aranır.
