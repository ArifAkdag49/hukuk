      - "Kazadan sonraki üç iş günü; kolluğa ise derhâl bildirir"
      - "Kazadan sonraki on gün"
      - "Bir ay içinde"
    dogru: 1
    aciklama: |
      İş kazası, işveren tarafından o yer yetkili kolluk kuvvetlerine derhâl ve Kuruma en geç kazadan sonraki üç iş günü içinde bildirilir (5510 sayılı Kanun m. 13/2-a; 6331 sayılı Kanun m. 14/2-a). Salı günü olan kaza için son gün üç iş günü sonrası olan Cuma'dır.
  - soru: |
      İşveren, meydana gelen bir iş kazasını Kuruma süresinde bildirmemiştir. 5510 sayılı Kanun m. 21/2'ye göre sonuç aşağıdakilerden hangisidir?
    siklar:
      - "Bildirim tarihine kadar geçen süre için sigortalıya ödenecek geçici iş göremezlik ödeneği Kurumca işverenden tahsil edilir."
      - "Kurum, sigortalıya hiçbir ödeme yapmaz."
      - "İşverenden bağlanan gelirin ilk peşin sermaye değerinin tamamı alınır."
      - "Yalnızca idari para cezası verilir; Kurumun rücu hakkı yoktur."
    dogru: 0
    aciklama: |
      Süresinde bildirilmeyen iş kazasında bildirim tarihine kadar geçen süre için sigortalıya ödenecek geçici iş göremezlik ödeneği Kurumca işverenden tahsil edilir (5510 sayılı Kanun m. 21/2). Gelirin ilk peşin sermaye değerinin işverene ödettirilmesi ise 5510 sayılı Kanun m. 21/1'deki kast veya mevzuata aykırılık koşuluna bağlıdır.
  - soru: |
      İş kazası üçüncü bir kişinin kusuruyla meydana gelmiştir. SGK'nın bu üçüncü kişiye rücuu 5510 sayılı Kanun m. 21/4'e göre hangi esasa dayanır?
    siklar:
      - "Bağlanan gelirin ilk peşin sermaye değerinin tamamı"
      - "Bağlanan gelirin ilk peşin sermaye değerinin yarısı"
      - "Yalnızca yapılan tedavi giderleri"
      - "Rücu hakkı yoktur"
    dogru: 1
    aciklama: |
      Kaza üçüncü bir kişinin kusuruyla meydana gelmişse, ödemeler ile bağlanan gelirin başladığı tarihteki ilk peşin sermaye değerinin yarısı zarara sebep olan üçüncü kişilere ve varsa bunları çalıştıranlara rücu edilir (5510 sayılı Kanun m. 21/4).
olaylar:
  - olay: |
      35 işçi çalıştıran Y Kimya Atölyesinde (çok tehlikeli sınıfta değil) havalandırma sistemi arızalanmış, zehirli gaz birikimi tehlikesi doğmuştur. Çalışan Ali, işverene yazılı olarak durumu bildirmiş ve tedbir alınmasını istemiştir. İşveren aynı gün tutanak düzenleyerek Ali'nin talebi yönünde karar vermiş, ancak "tamir yaklaşık bir ay sürer" demiş ve herhangi bir tedbir almamıştır. Ali, kararın ardından çalışmaktan kaçınmıştır. İşveren, Ali'nin kaçındığı günler için ücret ödemeyeceğini söylemiştir. Bir ay sonra hâlâ tedbir alınmayınca Ali sözleşmesini feshetmiştir. Atölyenin işyeri hekimi Dr. Kaan, işverenin giderilmeyen hayati tehlikeyi Bakanlığın yetkili birimine bildirmiş, işveren bu nedenle Dr. Kaan'ın sözleşmesini feshetmiştir. Atölyeye hizmet veren dış İSG kuruluşu uyarı raporu vermiştir; işveren "uzman kuruluş sorumlu" demektedir.

      1. Ali'nin başvurusunu kime yapması gerekirdi ve kaçınma dönemindeki ücreti hakkında ne söylenebilir?
      2. Ali'nin feshi hukuki sonuç doğurur mu?
      3. Gaz kaçağı patlak vererek derhâl tahliye gerekseydi Ali başvuru yapmak zorunda kalır mıydı?
      4. Dr. Kaan'ın durumu ve işverenin yükümlülüğü nedir?
      5. İşverenin "uzman kuruluş sorumlu" savunması geçerli midir?
    olcut:
      - {tespit: "Elli çalışandan az olduğu için kurul bulunmaması, başvurunun işverene yapılması", puan: 15, madde: "6331 sayılı Kanun m. 13"}
      - {tespit: "Talep yönünde karar verilmesi hâlinde tedbir alınıncaya kadar çalışmaktan kaçınma ve ücretin saklı olması", puan: 20, madde: "6331 sayılı Kanun m. 13"}
      - {tespit: "Talebe rağmen tedbir alınmazsa iş sözleşmesinin haklı nedenle feshedilebilmesi (İK m. 24 hükümleri)", puan: 20, madde: "6331 sayılı Kanun m. 13"}
      - {tespit: "Önlenemez tehlikede başvuru şartı olmaksızın terk ve hakların kısıtlanamaması", puan: 15, madde: "6331 sayılı Kanun m. 13"}
      - {tespit: "İşyeri hekiminin bildirimi nedeniyle sözleşmesine son verilemeyeceği ve bir yıllık sözleşme ücreti tutarından az olmamak üzere tazminat", puan: 20, madde: "6331 sayılı Kanun m. 8"}
      - {tespit: "Dış uzman hizmetinin işverenin sorumluluğunu kaldırmaması", puan: 10, madde: "6331 sayılı Kanun m. 4"}
    cozum: |
      **Nitelendirme:** Olay, 6331 sayılı Kanundaki işverenin genel yükümlülüğü, çalışmaktan kaçınma hakkı ve işyeri hekiminin güvencesi sorunlarını birlikte içerir.

      **Hukuki sorunlar:** Başvurunun muhatabı; kaçınma dönemindeki ücret; fesih; önlenemez tehlike hâlinde usul; işyeri hekiminin güvencesi; dış uzman hizmeti ve işverenin sorumluluğu.

      **İlgili hükümler:** 6331 sayılı Kanun m. 13/1'e göre ciddi ve yakın tehlike karşısında çalışan kurula, kurul bulunmayan işyerlerinde işverene başvurur; işveren derhâl karar verir. Karar çalışanın talebi yönündeyse çalışan tedbirler alınıncaya kadar çalışmaktan kaçınabilir ve ücreti ile diğer hakları saklıdır (m. 13/2). Tehlike önlenemezse başvuru usulü aranmaz (m. 13/3). Talep etmeye rağmen tedbir alınmazsa çalışan tabi olduğu kanun hükümlerine göre sözleşmesini feshedebilir (m. 13/4). 6331 sayılı Kanun m. 22/1 kurul için elli çalışan ve altı aydan fazla sürekli iş arar. 6331 sayılı Kanun m. 8/2 işyeri hekimine güvence sağlar. 6331 sayılı Kanun m. 4/2 dış uzman hizmetinin işvereni sorumluluktan kurtarmadığını söyler.

      **Değerlendirme:** Atölyede 35 çalışan vardır; elli çalışan eşiği aşılmadığı için kurul oluşturma yükümlülüğü yoktur. Bu nedenle Ali'nin işverene başvurması doğrudur ve işveren de bunu kabul ederek talebi yönünde karar vermiştir. Karar talep yönünde olduğundan Ali tedbirler alınıncaya kadar çalışmaktan kaçınabilir; işverenin ücreti ödemeyeceği savı 6331 sayılı Kanun m. 13/2'ye aykırıdır, çünkü kaçınma dönemindeki ücret ve diğer haklar saklıdır. Tedbirin bir ay boyunca alınmaması hâlinde Ali'nin sözleşmesini feshetme hakkı doğar (m. 13/4); İş Kanunu kapsamındaki işçi için fesih, İK m. 24'teki haklı neden hükümlerine göre değerlendirilir. Kıdem tazminatının ayrıca 1475 sayılı Kanun m. 14 şartlarını sağlaması gerekir (örneğin bir yıllık kıdem). Gaz kaçağı patlak verip tehlike önlenemez hâle gelseydi, Ali başvuru usulüne uymak zorunda olmaksızın işyerini terk edebilir ve bu nedenle hakları kısıtlanamazdı (m. 13/3). Dr. Kaan'ın bildirimi 6331 sayılı Kanun m. 8/2'nin öngördüğü görevin gereğidir; bu bildirim nedeniyle iş sözleşmesine son verilemez ve verilirse işveren hakkında bir yıllık sözleşme ücreti tutarından az olmamak üzere tazminata hükmedilir. İşverenin dış kuruluşun sorumlu olduğu savı, 6331 sayılı Kanun m. 4/2 nedeniyle geçersizdir; dış hizmet alınması işverenin sorumluluğunu ortadan kaldırmaz.

      **Sonuç:** Ali'nin kaçınma dönemindeki ücreti saklıdır; tedbirin alınmaması nedeniyle yaptığı fesih haklı nedene dayandırılabilir. Dr. Kaan'ın sözleşmesine son verilmesi hukuka aykırıdır ve işveren en az bir yıllık sözleşme ücreti tutarında tazminata mahkûm edilebilir. Dış uzman kuruluşun bulunması işvereni sorumluluktan kurtarmaz.
  - olay: |
      Kadın işçi Kübra, 10.3.2026 Salı günü, çocuğu bir yaşını doldurmadığı için kullandığı süt izni sırasında evine yürürken kaldırımdaki bir bisikletlinin (Ü) çarpması sonucu düşerek kolunu kırmış, 20 gün istirahat raporu almıştır. İşveren olayı aynı gün öğrenmiş, "işyeri dışında olduğu için bizi ilgilendirmez" diyerek kolluğa ve SGK'ya bildirim yapmamıştır. SGK'ya bildirim ancak 25.3.2026 tarihinde yapılmıştır. İşverenin işyerinde, kazanın oluşuna etki eden hiçbir iş güvenliği mevzuatı ihlali tespit edilmemiştir. Bisikletlinin kusuru kaza raporunda tespit edilmiştir.

      1. Olay sosyal güvenlik hukuku bakımından iş kazası mıdır?
      2. İşverenin bildirim yükümlülüğü ve süresi nedir? Süresinde bildirilmemesinin sonucu nedir?
      3. Kübra'ya istirahat raporu süresince hangi ödenek ödenir?
      4. SGK, işverene 5510 sayılı Kanun m. 21/1 uyarınca rücu edebilir mi?
      5. SGK'nın bisikletliye karşı rücu hakkı var mıdır?
    olcut:
      - {tespit: "Emziren kadının süt izni zamanında meydana gelen olayın iş kazası sayılması", puan: 20, madde: "5510 sayılı Kanun m. 13"}
      - {tespit: "Kolluğa derhâl, Kuruma üç iş günü içinde bildirim yükümlülüğü ve sürenin 13.3.2026'da dolması", puan: 20, madde: "5510 sayılı Kanun m. 13"}
      - {tespit: "Geç bildirimde bildirim tarihine kadarki geçici iş göremezlik ödeneğinin işverenden tahsili", puan: 20, madde: "5510 sayılı Kanun m. 21"}
      - {tespit: "İş kazası nedeniyle istirahat raporu süresince geçici iş göremezlik ödeneği", puan: 10, madde: "5510 sayılı Kanun m. 18"}
      - {tespit: "Kast veya mevzuata aykırılık bulunmadığından 5510 sayılı Kanun m. 21/1 rücuunun gündeme gelmemesi", puan: 15, madde: "5510 sayılı Kanun m. 21"}
      - {tespit: "Üçüncü kişiye ilk peşin sermaye değerinin yarısı esasıyla rücu", puan: 15, madde: "5510 sayılı Kanun m. 21"}
    cozum: |
      **Nitelendirme:** Olay, sosyal güvenlik hukukunda iş kazası kavramı, bildirim süresi ve işverenin ile üçüncü kişinin Kuruma karşı sorumluluğuna ilişkindir.

      **Hukuki sorunlar:** İş kazası niteliği; bildirim süresi ve yaptırımı; ödenek; işverene ve üçüncü kişiye rücu.

      **İlgili hükümler:** 5510 sayılı Kanun m. 13/1-d, emziren kadın sigortalının iş mevzuatı gereğince çocuğuna süt vermek için ayrılan zamanlarda meydana gelen olayı iş kazası sayar. Aynı maddenin ikinci fıkrasının a bendi, kolluğa derhâl ve Kuruma en geç kazadan sonraki üç iş günü içinde bildirimi arar. 5510 sayılı Kanun m. 18/1-a iş kazası nedeniyle iş göremezliğe uğrayan sigortalıya istirahat raporu şartıyla geçici iş göremezlik ödeneği öngörür. 5510 sayılı Kanun m. 21/1, kast veya iş güvenliği mevzuatına aykırı hareketi; 5510 sayılı Kanun m. 21/2 geç bildirimi; 5510 sayılı Kanun m. 21/4 üçüncü kişiye rücuu düzenler.

      **Değerlendirme:** Kübra'nın kazası, süt izni için ayrılan zamanda gerçekleştiğinden, işyeri dışında olsa bile iş kazasıdır (5510 sayılı Kanun m. 13/1-d); işverenin "işyeri dışı" savı bu bent karşısında dayanaksızdır. İşveren olayı aynı gün öğrendiği için bildirim yükümlülüğü derhâl kolluğa ve en geç üç iş günü içinde Kuruma bildirim şeklinde doğmuştur; son gün 13.3.2026'dır. Bildirim 25.3.2026'da yapıldığından süre aşılmıştır. 5510 sayılı Kanun m. 21/2 gereği bildirim tarihine kadar geçen süre için Kübra'ya ödenecek geçici iş göremezlik ödeneği Kurumca işverenden tahsil edilir. Kübra, istirahat raporu süresince 5510 sayılı Kanun m. 18/1-a uyarınca geçici iş göremezlik ödeneği alır. İşverenin iş güvenliği mevzuatına aykırı bir hareketi veya kastı bulunmadığından 5510 sayılı Kanun m. 21/1'deki ilk peşin sermaye değeri rücuu için koşul gerçekleşmemiştir; işverenin sorumluluğu geç bildirim yaptırımıyla sınırlıdır. Kaza üçüncü kişinin kusuruyla meydana geldiğinden, ödemeler ile bağlanan gelirin ilk peşin sermaye değerinin yarısı üçüncü kişiye rücu edilebilir (5510 sayılı Kanun m. 21/4); bu, sürekli iş göremezlik geliri bağlanması hâlinde gündeme gelir ve kırık nedeniyle gelir bağlanması için meslekte kazanma gücünün en az yüzde 10 azalması gerekir (5510 sayılı Kanun m. 19/1).

      **Sonuç:** Kaza iş kazasıdır. İşveren bildirim yükümlülüğünü geciktirdiği için bildirim tarihine kadarki ödeneği Kuruma ödemekle karşı karşıyadır. Kuruma karşı kusur sorumluluğuna dayalı rücu 5510 sayılı Kanun m. 21/1 uyarınca yoktur; üçüncü kişiye ise ilk peşin sermaye değerinin yarısı kadar rücu edilebilir.
kartlar:
  - on: "İşverenin genel İSG yükümlülüğü hangi maddede ve neleri kapsar?"
    arka: "6331 sayılı Kanun m. 4: önleme, eğitim ve bilgi, araç gereç, izleme-denetim, risk değerlendirmesi, işe uygunluk, hayati tehlikeli yerlere giriş kontrolü."
  - on: "İSG hizmetini dışarıdan almak işvereni sorumluluktan kurtarır mı?"
    arka: "Hayır. İşyeri dışındaki uzman kişi ve kuruluşlardan hizmet alınması işverenin sorumluluklarını ortadan kaldırmaz (6331 sayılı Kanun m. 4/2)."
  - on: "İSG tedbirlerinin maliyeti kime aittir?"
    arka: "İşverene. Maliyet çalışanlara yansıtılamaz (6331 sayılı Kanun m. 4/4)."
  - on: "İSG kurulu hangi işyerlerinde kurulur?"
    arka: "Elli ve daha fazla çalışanı olan ve altı aydan fazla süren sürekli işlerin yapıldığı işyerlerinde (6331 sayılı Kanun m. 22/1)."
  - on: "Diğer sağlık personeli kimlerde zorunludur?"
    arka: "On ve daha fazla çalışanı olan çok tehlikeli sınıftaki işyerlerinde; tam süreli işyeri hekimi varsa zorunlu değildir (6331 sayılı Kanun m. 6/1-a, m. 6/3)."
  - on: "Çalışmaktan kaçınma hakkının basamakları?"
    arka: "Kurula (yoksa işverene) başvuru → talep yönünde karar → tedbir alınana kadar kaçınma, ücret saklı; önlenemez tehlikede başvurusuz terk; tedbir alınmazsa fesih (6331 sayılı Kanun m. 13)."
  - on: "Tehlike bildirimi nedeniyle işten çıkarılan işyeri hekimine ne olur?"
    arka: "Sözleşmesine son verilemez; verilirse işveren hakkında bir yıllık sözleşme ücreti tutarından az olmamak üzere tazminata hükmedilir (6331 sayılı Kanun m. 8/2)."
  - on: "İş kazasının 5510 sayılı Kanun m. 13/1'deki beş hâli?"
    arka: "İşyerinde bulunma; yürütülen iş nedeniyle; görevle işyeri dışına gönderilme; emziren kadının süt izni zamanı; işverence sağlanan taşıtla gidiş geliş."
  - on: "İş kazası bildirim süreleri?"
    arka: "Kolluğa derhâl; Kuruma en geç kazadan sonraki üç iş günü (5510 sayılı Kanun m. 13/2). Geç bildirimde geçici iş göremezlik ödeneği işverenden tahsil edilir (5510 sayılı Kanun m. 21/2)."
  - on: "Sürekli iş göremezlik geliri için eşik nedir?"
    arka: "Meslekte kazanma gücünde en az yüzde 10 azalma (5510 sayılı Kanun m. 19/1)."
  - on: "SGK rücuunda işveren ile üçüncü kişi farkı?"
    arka: "İşverene: ilk peşin sermaye değeri, kast veya mevzuata aykırılık şartıyla ve sorumluluk sınırlarıyla (5510 sayılı Kanun m. 21/1). Üçüncü kişiye: ilk peşin sermaye değerinin yarısı (5510 sayılı Kanun m. 21/4)."
  - on: "İşçi işverenden iş kazası tazminatını hangi hükümle ister ve zamanaşımı?"
    arka: "TBK m. 417/3: sözleşmeye aykırılık hükümleri; kusursuzluğu işveren ispatlar (TBK m. 112); genel zamanaşımı on yıl (TBK m. 146)."
