sorular:
  - soru: |
      X Ltd. Şti., iş güvenliği hizmetini bir dış kuruluştan satın almıştır. Kuruluş makine korumasının eksik olduğunu yazılı bildirdiği hâlde işveren bir önlem almamış ve işçi yaralanmıştır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Hizmet dış kuruluştan alındığı için işverenin sorumluluğu ortadan kalkar."
      - "Dış kuruluştan hizmet alınması işverenin sorumluluklarını ortadan kaldırmaz."
      - "Sorumluluk yalnız işçiye aittir."
      - "İşverenin sorumluluğu ancak işçi talep ederse doğar."
    dogru: 1
    aciklama: |
      6331 sayılı Kanun m. 4/2'ye göre işyeri dışındaki uzman kişi ve kuruluşlardan hizmet alınması işverenin sorumluluklarını ortadan kaldırmaz. Eksiklik işverene yazılı bildirildiği hâlde tedbir alınmaması işverenin aykırılığını daha da belirgin kılar.
  - soru: |
      Bir işveren, kask ve iş ayakkabısı bedelini işçilerin ücretlerinden kesmektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İşveren İSG tedbirlerinin maliyetini çalışanlara yansıtamaz."
      - "Yalnızca kask bedeli yansıtılabilir."
      - "İşçi yazılı onay verirse her tedbirin maliyeti yansıtılabilir."
      - "Maliyetin yarısı işçiye yüklenebilir."
    dogru: 0
    aciklama: |
      6331 sayılı Kanun m. 4/4 açıktır: işveren iş sağlığı ve güvenliği tedbirlerinin maliyetini çalışanlara yansıtamaz. Kanun, işçi onayına göre bir istisna öngörmez.
  - soru: |
      35 çalışanlı bir kimya atölyesinde havalandırma arızası nedeniyle ciddi ve yakın bir zehirli gaz tehlikesi doğmuştur. İşçi Ayşe, 6331 sayılı Kanun m. 13/1'e göre başvurusunu kime yöneltmelidir?
    siklar:
      - "İşyerinde kurul bulunmadığından işverene"
      - "Doğrudan iş mahkemesine"
      - "Yalnızca SGK il müdürlüğüne"
      - "İSG kuruluna; kurul yoksa başvuru yapılamaz"
    dogru: 0
    aciklama: |
      Elli ve daha fazla çalışan şartı bulunmadığından kurul oluşturulması zorunlu değildir (6331 sayılı Kanun m. 22/1). Kurulun bulunmadığı işyerlerinde çalışan, durumun tespiti ve tedbirler için işverene başvurur (6331 sayılı Kanun m. 13/1).
  - soru: |
      Maden ocağında metan alarmı çalınca işçi Mehmet, işverene veya kurula başvurmadan ocağı terk ederek güvenli bölgeye gitmiştir. İşverenin "usule uymadın" diyerek hak kısıtlaması yapması mümkün müdür?
    siklar:
      - "Mümkündür; çünkü önce başvuru yapması zorunluydu."
      - "Mümkün değildir; ciddi ve yakın tehlike önlenemiyorsa çalışan başvuru usulüne uymak zorunda olmaksızın güvenli yere gider ve hakları kısıtlanamaz."
      - "Mümkündür; yalnız ücret kesilemez."
      - "Mümkün değildir; ancak ocağı terk etme yetkisi yalnız kurula aittir."
    dogru: 1
    aciklama: |
      6331 sayılı Kanun m. 13/3, tehlikenin önlenemez olduğu hâllerde çalışanın birinci fıkradaki usule uymak zorunda olmaksızın işyerini veya tehlikeli bölgeyi terk ederek belirlenen güvenli yere gidebileceğini ve bu hareketi nedeniyle haklarının kısıtlanamayacağını söyler.
  - soru: |
      İSG kurulunun oluşturulması için 6331 sayılı Kanun m. 22/1'e göre aşağıdaki ölçütlerden hangisi aranır?
    siklar:
      - "On ve daha fazla çalışan ve çok tehlikeli sınıf"
      - "Elli ve daha fazla çalışan ve altı aydan fazla süren sürekli iş"
      - "Yüz ve daha fazla çalışan ve en az bir yıllık faaliyet"
      - "Her işyerinde çalışan sayısına bakılmaksızın"
    dogru: 1
    aciklama: |
      Kurul, elli ve daha fazla çalışanın bulunduğu ve altı aydan fazla süren sürekli işlerin yapıldığı işyerlerinde kurulur (6331 sayılı Kanun m. 22/1). On çalışan ve çok tehlikeli sınıf ölçütü ise diğer sağlık personeli görevlendirmesine ilişkindir (6331 sayılı Kanun m. 6/1-a).
  - soru: |
      Diğer sağlık personelinin görevlendirilmesi zorunluluğu 6331 sayılı Kanun m. 6/1-a'ya göre hangi işyerleri için öngörülmüştür?
    siklar:
      - "Bütün işyerleri"
      - "Elli ve daha fazla çalışanı olan bütün işyerleri"
      - "On ve daha fazla çalışanı olan çok tehlikeli sınıftaki işyerleri"
      - "Yalnızca kamu kurumları"
    dogru: 2
    aciklama: |
      Diğer sağlık personeli, on ve daha fazla çalışanı olan çok tehlikeli sınıftaki işyerlerinde görevlendirilir; tam süreli işyeri hekimi görevlendirilen işyerlerinde ise zorunlu değildir (6331 sayılı Kanun m. 6/1-a ve m. 6/3).
  - soru: |
      İşyeri hekimi Dr. Kaan, işverence giderilmeyen hayati bir tehlikeyi Bakanlığın yetkili birimine bildirmiştir. İşveren bu nedenle Dr. Kaan'ın iş sözleşmesini feshetmiştir. 6331 sayılı Kanun m. 8/2'ye göre sonuç nedir?
    siklar:
      - "Fesih geçerlidir; yalnızca kıdem tazminatı ödenir."
      - "İşveren hakkında bir yıllık sözleşme ücreti tutarından az olmamak üzere tazminata hükmedilir."
      - "Dr. Kaan'ın belgesi askıya alınır."
      - "İşverene yalnızca idari para cezası verilir; tazminat öngörülmemiştir."
    dogru: 1
    aciklama: |
      Bildirim nedeniyle işyeri hekimi veya iş güvenliği uzmanının iş sözleşmesine son verilemez; aksi hâlde işveren hakkında bir yıllık sözleşme ücreti tutarından az olmamak üzere tazminata hükmedilir (6331 sayılı Kanun m. 8/2). Askı yaptırımı bildirimi yapmayan hekim ve uzmana uygulanır.
  - soru: |
      Hangi hâlde aşağıdaki kaza, 5510 sayılı Kanun m. 13/1'e göre iş kazası sayılır?
    siklar:
      - "İşçinin kendi arabasıyla işe gelirken yaptığı kaza"
      - "İşçinin belediye otobüsüyle işe giderken yaşadığı kaza"
      - "İşçinin işverence sağlanan servis aracıyla işe gidiş gelişi sırasındaki kaza"
      - "İşçinin yıllık izninde tatil yaparken geçirdiği kaza"
    dogru: 2
    aciklama: |
      5510 sayılı Kanun m. 13/1-e, sigortalının işverence sağlanan bir taşıtla işin yapıldığı yere gidiş gelişi sırasında meydana gelen olayı iş kazası sayar. Kendi aracı, toplu taşıma veya izinde yaşanan kaza bu hükme girmez.
  - soru: |
      Emziren kadın işçi Selin, süt izni saatinde evine yürürken kaldırımda düşerek yaralanmıştır. Olay hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İşyeri dışında olduğu için hiçbir şekilde iş kazası sayılmaz."
      - "5510 sayılı Kanun m. 13/1-d gereği süt izni zamanında meydana geldiğinden iş kazasıdır."
      - "Yalnızca işveren servis sağladıysa iş kazasıdır."
      - "Süt izni için ayrılan zamanlarda yaşanan olay yalnız hastalık sayılır."
    dogru: 1
    aciklama: |
      5510 sayılı Kanun m. 13/1-d, emziren kadın sigortalının iş mevzuatı gereğince çocuğuna süt vermek için ayrılan zamanlarda meydana gelen olayı iş kazası sayar. İş mevzuatındaki dayanak İK m. 74/7'dir.
  - soru: |
      Bir iş kazası Salı günü meydana gelmiş ve işveren aynı gün durumu öğrenmiştir. Hafta içi tatil yoktur. İşverenin Kuruma bildirim süresi aşağıdakilerden hangisidir?
