ozet: |
  - **Dayanaklar:** İşverenin gözetme borcu TBK m. 417/2'de, ayrıntılı kamu hukuku yükümlülükleri 6331 sayılı Kanunda düzenlenir. 6331 sayılı Kanun, kamu ve özel sektöre ait bütün işlere ve işyerlerine, çırak ve stajyerler dâhil tüm çalışanlara uygulanır (6331 sayılı Kanun m. 2/1); ev hizmetleri gibi sayılı faaliyetler dışarıda kalır (m. 2/2).
  - **İşverenin genel yükümlülüğü (6331 sayılı Kanun m. 4):** Önleme, eğitim, araç gereç, denetim ve **risk değerlendirmesi**. Dışarıdan hizmet alınması sorumluluğu kaldırmaz; çalışanların yükümlülükleri işvereninkini etkilemez; **maliyet çalışana yansıtılamaz.**
  - **İSG hizmetleri ve kurul:** İş güvenliği uzmanı, işyeri hekimi; **on veya daha fazla çalışanı olan çok tehlikeli sınıf** işyerlerinde ayrıca diğer sağlık personeli (6331 sayılı Kanun m. 6/1-a). İSG kurulu: **elli ve daha fazla çalışan** ve **altı aydan fazla süren sürekli iş** (m. 22/1).
  - **Çalışmaktan kaçınma (6331 sayılı Kanun m. 13):** Ciddi ve yakın tehlikede kurula, kurul yoksa işverene başvurulur; talep yönünde karar verilirse tedbir alınana kadar çalışmaktan kaçınılır, ücret ve haklar saklıdır. Önlenemez tehlikede başvuru şartsız terk edilir. Tedbir alınmazsa sözleşme haklı nedenle feshedilebilir.
  - **İş kazası (5510 sayılı Kanun m. 13/1):** Beş hâl: işyerinde, yürütülen iş nedeniyle, görevle işyeri dışına gönderilmede, emziren kadının süt izni zamanında, işverence sağlanan taşıtla gidiş gelişte. **Meslek hastalığı** (m. 14/1): işin niteliği veya yürütüm şartları yüzünden tekrarlanan bir sebeple uğranılan hastalık.
  - **Bildirim:** Kolluğa **derhâl**, Kuruma **kazadan sonra üç iş günü içinde**. Süresinde bildirilmezse bildirim tarihine kadar geçici iş göremezlik ödeneği işverenden tahsil edilir (5510 sayılı Kanun m. 21/2).
  - **Tazminat:** İşverenin zararı gidermesi **sözleşmeye aykırılık** hükümlerine tabidir (TBK m. 417/3, TBK m. 112); on yıllık genel zamanaşımı (TBK m. 146).
  - **Rücu:** Kast veya mevzuata aykırı hareket varsa Kurum, ödemelerin ilk peşin sermaye değerini işverene ödetir (5510 sayılı Kanun m. 21/1); üçüncü kişiye rücu **ilk peşin sermaye değerinin yarısı** üzerinden yapılır (5510 sayılı Kanun m. 21/4).
  - 📌 **Güncel:** 9.1.2025 tarihli 7538 sayılı Kanunla ÇASMER ve ekipman muayene kuruluşu tanımları eklenmiş, İSG hizmetleri ÇASMER'lerden de alınabilir hâle gelmiştir.
anlatim: |
  ## 1. İSG hukukunun yeri

  İşçinin kişiliğini ve sağlığını koruma, iş sözleşmesinden doğan **gözetme borcunun** en sert yanıdır. Bu alanda üç hukuk katmanı iç içe işler: (1) **6331 sayılı İş Sağlığı ve Güvenliği Kanunu**, işverene somut önleme yükümlülükleri yükler; (2) **5510 sayılı Kanun**, kazalıya ve hak sahiplerine sosyal güvenlik yardımı sağlar ve Kurumun işverene rücuunu düzenler; (3) **TBK m. 417**, işçinin işverenden özel hukuk tazminatı istemesinin dayanağıdır. Sınav sorusu çoğu kez bu üç katmandan birini diğeriyle karıştırarak kurulur; her olayda "hangi soruyu hangi kanun yanıtlıyor?" diye düşün.

  6331 sayılı Kanun, kamu ve özel sektöre ait bütün işlere ve işyerlerine, işverenlere ve işveren vekillerine, **çırak ve stajyerler de dâhil** tüm çalışanlara uygulanır (6331 sayılı Kanun m. 2/1). Yani İş Kanunu'nun kapsamı dışında kalan işçiler de çoğu zaman bu Kanunun korumasındadır. Buna karşılık ev hizmetleri, afet ve acil durum birimlerinin müdahale faaliyetleri gibi sayılı faaliyetler Kanunun uygulanmadığı alanlardır (m. 2/2).

  ## 2. İşverenin yükümlülükleri

  ### 2.1 Genel yükümlülük: 6331 sayılı Kanun m. 4

  İşveren, çalışanların işle ilgili sağlık ve güvenliğini sağlamakla yükümlüdür. Bu çerçevede (1) mesleki risklerin önlenmesi, eğitim ve bilgi verilmesi dâhil her türlü tedbiri alır; (2) alınan tedbirlere uyulup uyulmadığını **izler, denetler** ve uygunsuzlukların giderilmesini sağlar; (3) **risk değerlendirmesi yapar veya yaptırır**; (4) görev verirken çalışanın işe sağlık ve güvenlik yönünden uygunluğunu göz önüne alır; (5) yeterli bilgi ve talimat verilenler dışındaki çalışanların hayati ve özel tehlike bulunan yerlere girmemesi için tedbir alır.

  Maddenin son üç fıkrası sınavlık kurallar içerir:

  - İşyeri dışındaki uzman kişi ve kuruluşlardan hizmet alınması işverenin sorumluluklarını **ortadan kaldırmaz** (m. 4/2).
  - Çalışanların İSG alanındaki yükümlülükleri işverenin sorumluluklarını **etkilemez** (m. 4/3).
  - İşveren İSG tedbirlerinin **maliyetini çalışanlara yansıtamaz** (m. 4/4).

  > **Örnek:** X Ltd. Şti., iş güvenliği hizmetini bir dış firmadan alıyor. Firma yazılı uyarı gönderdiği hâlde işveren makine korumasını yaptırmıyor. İşçi Ali'nin eli makinede ezildiğinde işveren "uzman firmamız var" diyerek sorumluluktan kurtulamaz (m. 4/2). Kask ve eldiven bedelini Ali'nin maaşından kesmesi de m. 4/4'e aykırıdır.

  ### 2.2 Risk değerlendirmesi: 6331 sayılı Kanun m. 10

  Risk değerlendirmesi, işyerindeki tehlikelerin belirlenmesi, risklerin analiz edilip derecelendirilmesi ve kontrol tedbirlerinin kararlaştırılması çalışmasıdır (6331 sayılı Kanun m. 3/1-ö). İşveren bunu yaparken belirli risklerden etkilenecek çalışanların durumunu, iş ekipmanı ve kimyasal seçimini, işyerinin tertip ve düzenini ve **genç, yaşlı, engelli, gebe veya emziren çalışanlar** gibi özel politika gerektiren grupları dikkate alır (m. 10/1). Sonuca göre alınacak tedbirleri ve kullanılacak koruyucu donanımı işveren belirler (m. 10/2).

  ### 2.3 İSG hizmetleri, tehlike sınıfı ve kurul

  İşveren çalışanları arasından **iş güvenliği uzmanı** ve **işyeri hekimi**, **on ve daha fazla çalışanı olan çok tehlikeli sınıftaki işyerlerinde ayrıca diğer sağlık personeli** görevlendirir (6331 sayılı Kanun m. 6/1-a). Çalışanları arasında nitelikli kişi yoksa hizmetin tamamı veya bir kısmı ortak sağlık ve güvenlik birimlerinden (uygulamada OSGB) veya 7538 sayılı Kanunla eklenen **ÇASMER'lerden** alınır. Tam süreli işyeri hekimi görevlendirilen yerde diğer sağlık personeli zorunlu değildir (m. 6/3). Görevlendirme süresinin belirlenmesinde çırak ve stajyer statüsündeki öğrenciler çalışan sayısına dâhil edilmez (m. 6/4).

  İşyerinin tehlike sınıfı belirlenirken orada yapılan **asıl iş** dikkate alınır (6331 sayılı Kanun m. 9/2).

  **İSG kurulu:** Elli ve daha fazla çalışanın bulunduğu ve altı aydan fazla süren sürekli işlerin yapıldığı işyerlerinde işveren kurul oluşturur (6331 sayılı Kanun m. 22/1).

  > ⚠️ **Sınavda dikkat:** İki eşik karıştırılır: **50 çalışan + 6 aydan fazla sürekli iş** → kurul; **10 çalışan + çok tehlikeli sınıf** → diğer sağlık personeli. Her ikisi de ayrı maddelerdedir.

  ### 2.4 İşyeri hekimi ve iş güvenliği uzmanı: 6331 sayılı Kanun m. 8

  Bu kişilerin hak ve yetkileri görevlerini yerine getirmeleri nedeniyle kısıtlanamaz (m. 8/1). Eksiklik ve aksaklıkları işverene yazılı bildirirler; düzeltmekten işveren sorumludur. Acil ve hayati tehlike arz eden durumlarda gerekli tedbirler alınmazsa durum Bakanlığın yetkili birimine bildirilir. **Bu bildirim nedeniyle işyeri hekiminin veya iş güvenliği uzmanının iş sözleşmesine son verilemez; aksi hâlde işveren hakkında bir yıllık sözleşme ücreti tutarından az olmamak üzere tazminata hükmedilir** (m. 8/2). Bildirim yapmayan hekim ve uzmanın belgesi üç ay, tekrarında altı ay; 7538 sayılı Kanundan sonra ortak sağlık ve güvenlik birimlerinin yetki belgesi altı ay, tekrarında bir yıl askıya alınır.

  ## 3. Çalışanın hakları: çalışmaktan kaçınma (6331 sayılı Kanun m. 13)

  Mekanizma üç basamaktır; sıralamayı bozmadan öğren.

  1. **Başvuru (m. 13/1):** Ciddi ve yakın tehlikeyle karşılaşan çalışan **kurula**, kurul yoksa **işverene** başvurarak durumun tespitini ve gerekli tedbirlerin alınmasına karar verilmesini ister. Kurul acilen toplanır, işveren derhâl karar verir ve durumu tutanakla tespit eder; karar çalışana ve çalışan temsilcisine yazılı bildirilir.
  2. **Kaçınma (m. 13/2):** Kurul veya işveren çalışanın talebi yönünde karar verirse çalışan **tedbirler alınıncaya kadar çalışmaktan kaçınabilir.** Bu dönemdeki **ücreti ile kanunlardan ve iş sözleşmesinden doğan diğer hakları saklıdır.**
  3. **Önlenemez tehlike (m. 13/3):** Tehlike önlenemez nitelikteyse çalışan, başvuru usulüne uymak zorunda olmaksızın işyerini veya tehlikeli bölgeyi terk ederek belirlenen güvenli yere gider; bu hareketi nedeniyle hakları kısıtlanamaz.

  Talep etmelerine rağmen gerekli tedbirler alınmazsa iş sözleşmesiyle çalışanlar tabi oldukları kanun hükümlerine göre sözleşmelerini feshedebilir (m. 13/4). İş Kanunu kapsamındaki işçi için bu, İK m. 24'teki haklı nedenle derhâl fesih hükümleridir; Borçlar Kanunu kapsamında kalan ilişkilerde TBK m. 435 uygulanır. Haklı fesihte kıdem tazminatının şartları ayrıca 1475 sayılı Kanun m. 14 çerçevesinde aranır. Son olarak, 6331 sayılı Kanun m. 25 uyarınca işyerinde **işin durdurulması** hâlinde m. 13 hükümleri uygulanmaz (m. 13/5); iş durdurulduğunda işveren işsiz kalan çalışanlara ücretlerini ödemekle yükümlüdür (m. 25/6).

  İş durdurma kararını işveren, yerine getirildiği tarihten itibaren altı iş günü içinde yetkili iş mahkemesinde itirazla ele alabilir; itiraz kararın uygulanmasını etkilemez (m. 25/4). Durdurulan işte izinsiz çalışma yaptıran işveren veya işveren vekiline üç yıldan beş yıla kadar hapis cezası öngörülmüştür (m. 25/8).

  Çalışanın da yükümlülükleri vardır: eğitim ve talimatlara uyma, makine ve koruyucu donanımı doğru kullanma, ciddi ve yakın tehlike gördüğünde işverene veya çalışan temsilcisine derhâl haber verme (6331 sayılı Kanun m. 19). Bunlar işverenin sorumluluğunu ortadan kaldırmaz (m. 4/3).

  ## 4. İş kazası ve meslek hastalığı

  ### 4.1 İki ayrı tanım

  6331 sayılı Kanun m. 3/1-g iş kazasını, **işyerinde veya işin yürütümü nedeniyle** meydana gelen, ölüme sebebiyet veren veya vücut bütünlüğünü ruhen ya da bedenen engelli hâle getiren olay olarak tanımlar. Sosyal güvenlik hukukundaki tanım ise 5510 sayılı Kanun m. 13/1'dedir ve **beş hâl** sayar. Olay, sigortalıyı hemen veya sonradan bedenen ya da ruhen engelli hâle getirmelidir:

  | Hâl | Anahtar ifade |
  |---|---|
  | a | Sigortalının işyerinde bulunduğu sırada |
  | b | İşveren tarafından yürütülen iş nedeniyle |
  | c | Görevle işyeri dışına gönderilmede, asıl işi yapmaksızın geçen zaman |
  | d | Emziren kadın sigortalının süt izni zamanında |
  | e | İşverence sağlanan taşıtla gidiş gelişte |

  > ⚠️ **Sınavda dikkat:** (e) bendinde taşıtın **işverence sağlanmış** olması aranır. İşçinin kendi arabasıyla, yürüyerek veya belediye otobüsüyle işe gelişi sırasındaki kaza bu bentten iş kazası sayılmaz. (d) bendinde ise süt izni sırasında işyeri dışında yaşanan kaza da iş kazasıdır.

  > **Örnek:** Banka memuru Selin, müdürün talimatıyla vergi dairesine evrak götürürken sokakta düşüp bileğini kırdı. Görevle işyeri dışına gönderilme (c bendi) vardır; kaza iş kazasıdır.

  Meslek hastalığı, sigortalının çalıştığı veya yaptığı işin niteliğinden dolayı **tekrarlanan bir sebeple** veya **işin yürütüm şartları yüzünden** uğradığı geçici veya sürekli hastalık, bedensel veya ruhsal engellilik hâlleridir (5510 sayılı Kanun m. 14/1). Meslek hastalığı Kurum Sağlık Kurulunca tespit edilir (m. 14/2). Sürekli iş göremezlik gelirine hak kazanmak için meslekte kazanma gücünün **en az yüzde 10** azalmış olması gerekir (5510 sayılı Kanun m. 19/1).

  ### 4.2 Bildirim

  İş kazası, işveren tarafından o yer yetkili kolluk kuvvetlerine **derhâl** ve Kuruma **en geç kazadan sonraki üç iş günü içinde** bildirilir; kazanın işverenin kontrolü dışındaki yerlerde olması hâlinde bu süre kazanın öğrenildiği tarihten başlar (5510 sayılı Kanun m. 13/2). 6331 sayılı Kanun m. 14/2-a da iş kazalarının üç iş günü içinde SGK'ya bildirilmesini söyler. Meslek hastalığı, işverence öğrenildiği günden başlayarak üç iş günü içinde bildirilir (5510 sayılı Kanun m. 14; 6331 sayılı Kanun m. 14/2-b). Sağlık hizmeti sunucuları kendilerine intikal eden iş kazalarını en geç on gün içinde Kuruma bildirir (6331 sayılı Kanun m. 14/4). Ayrıca işveren iş kazalarının ve meslek hastalıklarının kaydını tutar (6331 sayılı Kanun m. 14/1).

  **Yaptırım:** Kazayı süresinde bildirmeyen işverenden, bildirim tarihine kadar geçen süre için sigortalıya ödenen geçici iş göremezlik ödeneği tahsil edilir (5510 sayılı Kanun m. 21/2). Meslek hastalığında bildirimi yapmayan işverene Kurumca yapılan masraflar ve ödenmişse geçici iş göremezlik ödenekleri rücu edilir (5510 sayılı Kanun m. 14).

  ## 5. İşverenin sorumlulukları

  ### 5.1 İşçiye karşı özel hukuk tazminatı

  TBK m. 417/2'ye göre işveren, işyerinde iş sağlığı ve güvenliğinin sağlanması için **gerekli her türlü önlemi almak, araç ve gereçleri noksansız bulundurmak** zorundadır. TBK m. 417/3 ise bu yükümlülüğe aykırılık nedeniyle işçinin **ölümü veya vücut bütünlüğünün zedelenmesi** hâlinde zararın tazmininin **sözleşmeye aykırılıktan doğan sorumluluk hükümlerine** tabi olduğunu söyler. Sonuçları:

  - Borç gereği gibi ifa edilmediğinden işveren, **kendisine kusur yüklenemeyeceğini ispat etmedikçe** zararı gidermekle yükümlüdür (TBK m. 112). Yani kusur karinesi işverene karşıdır.
  - Maddi zarar kalemleri: tedavi giderleri, kazanç kaybı, çalışma gücünün azalmasından kayıplar, ekonomik geleceğin sarsılmasından kayıplar (TBK m. 54); ölümde cenaze giderleri ve destekten yoksun kalma (TBK m. 53).
  - **Manevi tazminat** için TBK m. 56 uygulanır; ağır bedensel zarar veya ölümde zarar görenin yakınlarına da manevi tazminat verilebilir.
  - Genel zamanaşımı **on yıldır** (TBK m. 146). Haksız fiil zamanaşımı hükümleri (TBK m. 72) ile ilişki ve uzamış zamanaşımı gibi ayrıntılar ayrıca incelenmelidir.

  Uygulamada işverenin sorumluluğu, 6331 sayılı Kanun m. 4 ve TBK m. 417/2'nin geniş yorumlanmasıyla "gerekli her türlü önlem" ölçüsüne göre değerlendirilir. Kusur oranlarının belirlenmesi için kural olarak uzman bilirkişi raporu alınır.

  ### 5.2 SGK ile işveren: rücu (5510 sayılı Kanun m. 21)

  Burada ayrım şudur: işçi, işverenden zararının **tamamını** TBK m. 417 ile ister; SGK ise kendi yaptığı veya yapacağı ödemeleri işverene **rücu** ile ister.

  - **Koşul (5510 sayılı Kanun m. 21/1):** İş kazası veya meslek hastalığı, işverenin **kastı** veya sigortalıların sağlığını koruma ve iş güvenliği mevzuatına aykırı bir hareketi sonucu meydana gelmiş olmalıdır.
  - **Tutar:** Kurumca yapılan veya ileride yapılması gereken ödemeler ile bağlanan gelirin başladığı tarihteki **ilk peşin sermaye değeri** toplamı; ancak sigortalı veya hak sahiplerinin işverenden isteyebilecekleri tutarlarla sınırlıdır. İşverenin sorumluluğunun tespitinde **kaçınılmazlık ilkesi** dikkate alınır.
  - **Üçüncü kişi (5510 sayılı Kanun m. 21/4):** Olay üçüncü bir kişinin kusuruyla meydana gelmişse ödemeler ile bağlanan gelirin ilk peşin sermaye değerinin **yarısı**, zarara sebep olan üçüncü kişilere ve varsa bunları çalıştıranlara rücu edilir.
  - **Ölüm hâlinde (5510 sayılı Kanun m. 21/5):** Kusuru bulunan hak sahiplerine veya iş kazası sonucu ölen kusurlu sigortalının hak sahiplerine Kurumca rücu edilmez.
  - **Kayıt dışı çalıştırma (5510 sayılı Kanun m. 23/2):** Sigortalı işe giriş bildirgesi süresinde verilmeyen işçinin kazasında Kurumun yaptığı masraflar ve ilk peşin sermaye değeri, 5510 sayılı Kanun m. 21/1'deki sorumluluk hâlleri aranmaksızın işverene ödettirilir.

  Uygulamada işçinin tazminatı hesaplanırken SGK'nın rücu edebileceği kısım işçinin zararından düşülür; böylece aynı zarar için çifte ödeme önlenir. Kaçınılmazlık payının nasıl hesaba katılacağı ayrıca incelenmesi gereken bir noktadır.

  ## 6. 📌 Güncel değişiklikler

  9.1.2025 tarihli 7538 sayılı Kanun 6331 sayılı Kanunda şunları getirmiştir: ÇASMER (Sağlık Bakanlığına bağlı, işyerlerine İSG hizmeti sunmak üzere yetkilendirilen birim) ve ekipman muayene kuruluşu tanımları (m. 3/1-t ve u); İSG hizmetlerinin ÇASMER'lerden de alınabilmesi (m. 6/1-a); m. 8/2'de bildirim yükümlüsü olarak ortak sağlık ve güvenlik birimi yönetiminin eklenmesi ve ortak sağlık ve güvenlik birimlerinin yetki belgesi için altı ay, tekrarında bir yıl askı yaptırımı.

  Ayrıca Anayasa Mahkemesinin 22.7.2025 tarihli, E.2024/54, K.2025/163 sayılı kararıyla 6331 sayılı Kanun m. 38 birinci fıkra (a) bendinin 1 numaralı alt bendindeki "31/12/2024" ibaresi iptal edilmiştir. Bu alt bent, kamu kurumları ile elliden az çalışanı olan az tehlikeli sınıftaki işyerleri için m. 6 ve 7'nin yürürlük tarihini düzenliyordu. İptal kararının uygulamadaki ayrıntıları için güncel mevzuata bakılmalıdır.

  ## 7. Denetim şeması

  1. Olay 6331 sayılı Kanunun kapsamında mı? (işyeri, çalışan)
  2. İşveren hangi önleme yükümlülüğünü yerine getirmemiş? (risk değerlendirmesi, eğitim, uzman, kurul)
  3. Çalışan tehlike karşısında m. 13'ün hangi basamağında? (başvuru, kaçınma, terk, fesih)
  4. Sosyal güvenlik bakımından olay iş kazası mı, meslek hastalığı mı? (5510 sayılı Kanun m. 13-14)
  5. Bildirim süresi uyulmuş mu? (kolluğa derhâl, Kuruma üç iş günü)
  6. İşçinin işverene karşı tazminat istemi: TBK m. 417, kusur karinesi, zarar kalemleri.
  7. SGK'nın rücu hakkı: işverene (5510 sayılı Kanun m. 21/1), üçüncü kişiye (5510 sayılı Kanun m. 21/4); hak sahiplerine rücu yasağı (5510 sayılı Kanun m. 21/5).
kritik: |
  - 📌 6331 sayılı Kanun çırak ve stajyerler dâhil tüm çalışanlara uygulanır; ev hizmetleri gibi sayılı faaliyetler hariçtir (m. 2).
  - 📌 İşverenin genel yükümlülüğü: önleme, eğitim, denetim, **risk değerlendirmesi** (m. 4/1).
  - ⚠️ Dış uzman veya OSGB/ÇASMER hizmeti almak işverenin sorumluluğunu **ortadan kaldırmaz** (m. 4/2); çalışanın yükümlülükleri de işverenin sorumluluğunu etkilemez (m. 4/3).
  - 📌 İSG maliyeti çalışana **yansıtılamaz** (m. 4/4).
  - 📌 İSG kurulu: **50 ve daha fazla çalışan + altı aydan fazla süren sürekli iş** (m. 22/1). Diğer sağlık personeli: **10 ve daha fazla çalışanlı çok tehlikeli sınıf** işyeri (m. 6/1-a).
  - 📌 Çalışmaktan kaçınma: başvuru (kurul, yoksa işveren) → talep yönünde karar → kaçınma; **ücret ve diğer haklar saklı** (m. 13/1-2). Önlenemez tehlikede başvuru şartı yoktur (m. 13/3).
  - ⚠️ İşin durdurulması (m. 25) hâlinde m. 13 uygulanmaz (m. 13/5); işveren çalışanların ücretini ödemeye devam eder.
  - 📌 İşyeri hekimi veya uzman, tehlike bildirimi nedeniyle işten çıkarılırsa işveren **en az bir yıllık sözleşme ücreti** tazminatı öder (m. 8/2).
  - 📌 5510 sayılı Kanun m. 13'e göre iş kazası **beş hâl**dir; işverence sağlanan taşıt aranır, kendi aracı yetmez.
  - 📌 İş kazası bildirimi: kolluğa **derhâl**, Kuruma **üç iş günü**; geç bildirimde bildirim tarihine kadarki geçici iş göremezlik ödeneği işverenden tahsil edilir (5510 sayılı Kanun m. 21/2).
  - 📌 Sürekli iş göremezlik geliri için meslekte kazanma gücünde **en az yüzde 10** kayıp (m. 19/1).
  - ⚠️ SGK rücuu: işverene ilk peşin sermaye değeri (sorumluluk sınırlarıyla), üçüncü kişiye **yarısı** (5510 sayılı Kanun m. 21/4); ölen kusurlu sigortalının hak sahiplerine rücu yok (5510 sayılı Kanun m. 21/5).
  - 📌 İşverenin işçiye tazminatı sözleşmeye aykırılık hükümlerine tabidir (TBK m. 417/3); kusursuzluğu işveren ispatlar (TBK m. 112); zamanaşımı genel kuralla on yıldır (TBK m. 146).
doktrin: |
  ### İşverenin tazminat sorumluluğunun niteliği
  TBK m. 417/3 sorumluluğu sözleşmeye aykırılık hükümlerine bağlar. Bir görüşe göre bu, açık yollama nedeniyle kusura dayalı sözleşme sorumluluğudur: işçi borca aykırılığı ve zararı ispat eder, işveren TBK m. 112 gereği kendisine kusur yüklenemeyeceğini ispat etmedikçe sorumlu olur. Karşı görüşe göre iş sağlığı ve güvenliğinin yoğun tehlike barındırdığı işletmelerde TBK m. 71'deki önemli ölçüde tehlike arz eden işletme sorumluluğu da gündeme gelebilir ve bu hâlde kusursuz sorumluluk kuralları yarışır. Sınav olaylarında kural olarak TBK m. 417/3 ve TBK m. 112 dayanak alınır; tehlike sorumluluğu ancak tartışma olarak anılmalıdır.

  ### İki ayrı iş kazası kavramı
  5510 sayılı Kanun m. 13, sosyal sigorta yardımlarının kapısını açmak için geniş bir tanım kullanır. Bir olayın bu anlamda iş kazası sayılması, işverenin tazminatla veya rücuyla sorumlu olacağı anlamına gelmez. Bir görüşe göre özel hukuk tazminatı için olay ile işin yürütülmesi arasında uygun illiyet bağı ve işverenin sorumluluğunu doğuran bir aykırılık aranmalıdır. Bu nedenle sosyal güvenlik hukuku bakımından iş kazası sayılan her olay, TBK m. 417 anlamında işveren aleyhine tazminat sorumluluğu doğurmaz.

  ### Çalışmaktan kaçınma talebinin reddi
  6331 sayılı Kanun m. 13/2, kaçınma hakkını kurul veya işverenin talep yönünde karar vermesine bağlar. Başvuru reddedilir veya karar verilmezse işçinin çalışmaktan kaçınıp kaçınamayacağı tartışmalıdır: bir görüşe göre kanunun açık şartı karar olduğundan işçi bu yola gidemez, sözleşmeyi m. 13/4 gereği feshedebilir; diğer görüşe göre işçinin yaşam ve beden bütünlüğü bakımından tehlike gerçekten ciddi ve yakınsa ret, işçiyi tehlikeli işe zorlayamaz. Bu soru olay çözümünün tek dayanağı yapılmamalıdır.
sozluk:
  - terim: Gözetme borcu
    tanim: "İşverenin işçinin kişiliğini ve sağlığını koruma, iş sağlığı ve güvenliğini sağlama yükümlülüğü (TBK m. 417)."
  - terim: Risk değerlendirmesi
    tanim: "İşyerindeki tehlikelerin belirlenmesi, risklerin analiz edilip derecelendirilmesi ve kontrol tedbirlerinin kararlaştırılması çalışmaları (6331 sayılı Kanun m. 3 ve m. 10)."
  - terim: İş kazası (sosyal güvenlik)
    tanim: "5510 sayılı Kanun m. 13/1'deki beş hâlden birinde meydana gelip sigortalıyı hemen veya sonradan bedenen ya da ruhen engelli hâle getiren olay."
  - terim: Meslek hastalığı
    tanim: "İşin niteliği nedeniyle tekrarlanan bir sebeple veya işin yürütüm şartları yüzünden uğranılan geçici veya sürekli hastalık, bedensel veya ruhsal engellilik (5510 sayılı Kanun m. 14/1)."
  - terim: Çalışmaktan kaçınma hakkı
    tanim: "Ciddi ve yakın tehlikede, işveren veya kurulun olumlu kararı üzerine tedbir alınıncaya kadar ücret kaybı olmaksızın çalışmaya ara verme hakkı (6331 sayılı Kanun m. 13)."
  - terim: İSG kurulu
    tanim: "Elli ve daha fazla çalışanı olan ve altı aydan fazla süren sürekli işlerin yapıldığı işyerlerinde kurulan, İSG çalışmalarını yürüten kurul (6331 sayılı Kanun m. 22)."
  - terim: ÇASMER
    tanim: "Çalışan sağlığı merkezi; Sağlık Bakanlığına bağlı, işyerlerine İSG hizmeti sunmak üzere yetkilendirilen birim (6331 sayılı Kanun m. 3/1-t)."
  - terim: Geçici iş göremezlik ödeneği
    tanim: "İş kazası, meslek hastalığı, hastalık veya analık nedeniyle istirahat raporu alan sigortalıya verilen günlük ödenek (5510 sayılı Kanun m. 18)."
  - terim: İlk peşin sermaye değeri
    tanim: "Bağlanan gelirin başladığı tarihteki toplam değerinin peşin hesabı; SGK rücusunda esas alınan tutar (5510 sayılı Kanun m. 21)."
  - terim: Rücu
    tanim: "SGK'nın kazalıya yaptığı veya yapacağı ödemeleri, kusurlu işverenden veya üçüncü kişiden geri isteme hakkı (5510 sayılı Kanun m. 21)."
