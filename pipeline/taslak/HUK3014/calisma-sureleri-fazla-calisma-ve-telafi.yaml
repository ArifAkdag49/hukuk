    aciklama: |
      Sözleşmeyle 45 saatin altında belirlenen süreyi aşıp 45 saate kadar olan çalışma fazla sürelerle çalışmadır (İK m. 41/3); 45 saati aşan kısım fazla çalışmadır (İK m. 41/1). 40-45 arası 5 saat birinci, 45-47 arası 2 saat ikinci kategoridedir. Fazla sürelerle çalışma %25, fazla çalışma %50 artırımlıdır.
  - soru: |
