    aciklama: |
      Genel kural iki aydır, toplu iş sözleşmesiyle dört aya çıkarılabilir. Turizm sektöründe süre dört aydır ve toplu iş sözleşmesiyle altı aya kadar artırılabilir (İK m. 63/2).
  - soru: |
      Bir işçinin fazla çalışma süresinin toplamı yılda en çok kaç saat olabilir?
