doktrin: |
  ### Denkleştirmede günlük 11 saatin aşılması
  İK m. 41/1 denkleştirme uygulanan yerde ortalama haftalık süre aşılmadıkça 45 saati aşan haftaların fazla çalışma sayılmayacağını söyler. İK m. 63/2 ise günlük çalışmanın 11 saati aşamayacağını belirtir. Yargıtay'ın yerleşik uygulaması, ortalama tutsa bile günlük 11 saati aşan sürelerin ayrıca fazla çalışma olarak ücretlendirilmesi yönündedir. Aynı hafta içinde hem haftalık hem günlük aşım varsa çift hesap yapılmaz; işçi lehine daha yüksek olan süre esas alınır. Uygulamada bu hesap, bilirkişi raporlarında sık hata kaynağıdır.

  ### İstisna sektörlerde onaylı 7,5 saat üstü gece çalışması
  İK m. 69/3, dört istisna işte yazılı onayla 7,5 saatin üzerinde gece çalışması yaptırılabileceğini söyler. Tartışma, bu aşan kısmın fazla çalışma sayılıp sayılmayacağındadır. Bir görüşe göre yazılı onay varsa ve günlük-haftalık sınırlar aşılmıyorsa ayrıca fazla çalışma doğmaz, çünkü kanun bu çalışmayı açıkça mümkün kılmıştır. Karşı görüşe göre ise gece çalışmasının işçi sağlığına etkisi nedeniyle 7,5 saati aşan kısım onay olsa bile fazla çalışma gibi ücretlendirilmelidir. Konu tartışmalı olduğundan sınavda kesin sonuç olarak yazılmamalıdır; asıl bilinmesi gereken, istisnanın **yalnız dört işte** ve **yazılı onayla** işlediğidir.

  ### Üst düzey yöneticiler
  Çalışma gün ve saatlerini kendisi belirleyen, üstünden talimat almayan ve yüksek ücretli üst düzey yöneticilerin kural olarak fazla çalışma ücreti isteyemeyeceği kabul edilir. Ancak yönetici sıfatı tek başına yeterli sayılmaz; çalışma saatleri daha üst bir makamca belirlenip denetleniyorsa ve ücret 270 saatlik fazla çalışmayı karşılayacak düzeyde değilse talep kabul edilebilir. Bu nedenle sonuç, her olayın şartlarına göre değişir.
sozluk:
  - terim: Denkleştirme
    tanim: "Haftalık normal çalışma süresinin taraf anlaşmasıyla haftalara farklı dağıtılması; günlük sınır 11 saat, ortalama normal süreyi aşamaz (İK m. 63/2)."
  - terim: Fazla çalışma
    tanim: "Haftalık 45 saati aşan çalışma; ücret %50 artırımlıdır ya da işçi isterse saat başına 1 saat 30 dakika serbest zaman (İK m. 41)."
  - terim: Fazla sürelerle çalışma
    tanim: "Sözleşmeyle 45 saatin altında belirlenen haftalık süreyi aşıp 45 saate kadar olan çalışma; %25 artırım ya da 1 saat 15 dakika serbest zaman (İK m. 41/3-4)."
  - terim: Serbest zaman
    tanim: "İşçinin isteğiyle zamlı ücret yerine kullandığı, altı ay içinde ve ücret kesintisiz verilen izin süresi (İK m. 41/4-5)."
  - terim: Telafi çalışması
    tanim: "Zorunlu neden, bayram öncesi veya sonrası tatil ya da işçinin talebiyle izin gibi nedenlerle çalışılmayan sürelerin dört ay içinde, günde en çok üç saat ek çalışmayla kapatılması; fazla çalışma sayılmaz (İK m. 64)."
  - terim: Ara dinlenmesi
    tanim: "Günlük çalışma süresi içinde verilen, çalışma süresinden sayılmayan en az 15 dakika, 30 dakika ya da 1 saatlik dinlenme (İK m. 68)."
  - terim: Gece çalışması
    tanim: "20.00 ile 06.00 arasındaki dönemde yapılan çalışma; 7,5 saati geçemez, dört istisna işte yazılı onayla aşılabilir (İK m. 69)."
  - terim: Posta
    tanim: "Gece ve gündüz işletilen yerlerde nöbetleşe çalışan işçi grubu; postası değişen işçiye kesintisiz en az 11 saat dinlenme verilir (İK m. 69)."
  - terim: Yer altı maden işi
    tanim: "Günde 7,5, haftada 37,5 saatlik özel çalışma süresine tabi iş; fazla çalışma yalnız zorunlu ve olağanüstü hâllerde, en az %100 artırımla yapılır (İK m. 63/1, İK m. 41/9-10)."
  - terim: Zorunlu nedenle fazla çalışma
    tanim: "Arıza, acele iş ve zorlayıcı sebeplerde, işçinin onayı aranmaksızın ama uygun dinlenme verilerek yaptırılan fazla çalışma (İK m. 42)."
kararlar:
  - id: "1219197900"
    ozet: |
      Davacı, davalıya ait yaşlı ve hasta bakım evinde çalışmış, iş sözleşmesini ödenmeyen fazla çalışma ücreti nedeniyle haklı nedenle feshettiğini ileri sürerek işçilik alacaklarını istemiştir. İlk derece mahkemesi davayı kısmen kabul etmiş, davalının istinaf başvurusu esastan reddedilmiş, kararı davalı temyiz etmiştir. İlk derece mahkemesi 20.00-08.00 arasındaki 12 saatlik çalışmadan yalnız 45 dakika ara dinlenmesi düşmüştür. Yargıtay 9. Hukuk Dairesi, İK m. 68'deki 1 saatlik ara dinlenmesinin günlük 11 saate kadar olan çalışmalar için geçerli olduğunu, 11 saatten fazla çalışmalarda en az 1,5 saat ara dinlenmesi verilmesi gerektiğini belirtmiştir. Ara dinlenmesinin kanundaki sürelerden kısa kullandırıldığı iddiası somut ve kesin biçimde ispatlanmalıdır; burada ispat olmadığından 12 saatten 1,5 saat düşülmesi gerekmiştir. Karar ayrıca, dava dilekçesinde çalışmanın 10.06.2022'de sona erdiği bildirilmişken hesabın 21.06.2022'ye kadar yapılmasını taleple bağlılık ilkesine aykırı bulmuş ve Bölge Adliye Mahkemesi kararını kaldırarak İlk Derece Mahkemesi kararını oybirliğiyle bozmuştur.
sorular:
