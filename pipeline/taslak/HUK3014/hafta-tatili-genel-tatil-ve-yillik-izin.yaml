    dogru: 0
    aciklama: |
      İK m. 53'e göre onsekiz ve daha küçük yaştaki işçilerle elli ve daha yukarı yaştaki işçilere verilecek yıllık ücretli izin süresi yirmi günden az olamaz. Kıdemden gelen 14 gün bu işçiler için yeterli değildir.
  - soru: |
      İşveren, 20 günlük yıllık izni olan Mehmet'i işçinin anlaşması olmaksızın 5 gün + 5 gün + 10 gün olarak üç parçada kullandıracağını bildirmiştir. Hangisi doğrudur?
