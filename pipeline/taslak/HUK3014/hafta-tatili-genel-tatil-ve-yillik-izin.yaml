    dogru: 0
    aciklama: |
      İK m. 46/1 yedi günlük zaman diliminde kesintisiz en az yirmidört saat dinlenme verileceğini söyler ve bunu tatilden önceki iş günlerinde çalışmış olma koşuluna bağlar. 48 saat gibi süreler kanun metninde yoktur.
  - soru: |
      Kültür ve Turizm Bakanlığından turizm işletmesi belgesi almış bir otelin resepsiyonunda çalışan Barış yazılı onay vermiştir. Pazar günü hak kazandığı hafta tatili kendisine Çarşamba günü kullandırılmıştır. Hangisi doğrudur?
    siklar:
      - "Hak kazanılan günü takip eden dört gün içinde kullandırıldığı için uygulama kanuna uygundur; onay otuz gün önceden yazılı bildirimle geri alınabilir"
      - "Hafta tatili ertelenemez, uygulama kanuna aykırıdır"
      - "Erteleme için sözlü onay yeterlidir ve süre sınırı yoktur"
      - "Uygulama ancak toplu iş sözleşmesi varsa mümkündür"
    dogru: 0
    aciklama: |
      7553 sayılı Kanunla İK m. 46/1'e eklenen cümleye göre belgeli konaklama tesislerinde işçinin yazılı talebi veya onayıyla hafta tatili, hak kazanılan günü takip eden dört gün içinde kullandırılabilir. Çarşamba, Pazar'ı izleyen üçüncü gündür. İşçi onayını otuz gün önceden yazılı bildirimle geri alabilir.
  - soru: |
      Aylık ücretli Ayşe'nin sözleşmesinde ulusal bayram ve genel tatillerde çalışma hakkında hüküm yoktur. İşveren 23 Nisan günü Ayşe'yi onayını almadan çalıştırmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Hüküm bulunmadığından bu günde çalıştırılması için Ayşe'nin onayı gerekir"
      - "İşveren onay almadan çalıştırabilir"
      - "Yalnız yazılı toplu iş sözleşmesi varsa çalıştırılabilir, aksi hâlde çalıştırılamaz"
      - "Ayşe çalıştırılırsa ücreti üç kat ödenir, onay gerekmez"
    dogru: 0
    aciklama: |
      İK m. 44'e göre bu günlerde çalışılıp çalışılmayacağı toplu iş sözleşmesi veya iş sözleşmeleriyle kararlaştırılır; sözleşmelerde hüküm yoksa çalışılması için işçinin onayı gereklidir.
  - soru: |
      Aylık çıplak ücreti 36.000 TL (günlük çıplak ücret 1.200 TL), ayrıca aylık yemek yardımı alan Zeynep, onay vererek ulusal bayram günü çalışmıştır. Aylık ücreti tam ödenmiştir. Zeynep'e ayrıca ne ödenir?
    siklar:
      - "Çalışılan gün için ayrıca bir günlük çıplak ücret olan 1.200 TL"
      - "Yemek yardımı da eklenerek günlük giydirilmiş ücretin iki katı"
      - "Hiçbir ek ödeme yapılmaz, çünkü aylık ücretli işçiye tatil ücreti hükümleri uygulanmaz"
      - "Çıplak ücretin %50 zamlı hâli olan 1.800 TL"
    dogru: 0
    aciklama: |
      İK m. 49/4'e göre aylığı tam ödenen aylık ücretli işçiye İK m. 47 uygulanmaz, ancak ulusal bayram ve genel tatil günlerinde çalışanlara ayrıca çalıştığı her gün için bir günlük ücret ödenir. Sosyal yardımlar tatil ücretinin tespitinde hesaba katılmaz (İK m. 50); UBGT çalışması %50 zamlı değildir.
  - soru: |
      Hizmet süresi tam 5 yıl olan 35 yaşındaki bir işçinin yer altı işleri dışındaki işyerinde yıllık izin hakkı en az kaç gündür?
    siklar:
      - "14 gün"
      - "20 gün"
      - "26 gün"
      - "18 gün"
    dogru: 0
    aciklama: |
      İK m. 53'te "bir yıldan beş yıla kadar (beş yıl dahil)" olanlara en az ondört gün verilir. 20 gün ancak beş yıldan fazla hizmette başlar. 18 gün, yer altı işçisi için 14 günün dört gün artırılmış hâlidir.
  - soru: |
      18 yaşında olan ve işyerinde bir yıllık kıdemini doldurmuş bulunan işçi Kemal'in yıllık izin süresi hakkında hangisi doğrudur?
