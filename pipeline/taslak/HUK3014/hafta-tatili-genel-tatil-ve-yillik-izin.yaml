olaylar:
  - olay: |
      Ayşe, 53 yaşında olup üç yıldır bir market zincirinin şubesinde kasiyer olarak çalışmaktadır. Aylık çıplak ücreti 36.000 TL (günlük çıplak ücret 1.200 TL), ayrıca aylık yemek yardımı almaktadır. Ayşe yıllık izne çıkmak isteyince işveren, "kıdemin üç yıl, sana 14 gün yeter; onu da 5 + 5 + 4 gün diye ben bölerim" demiştir. Ayşe'nin kullandığı izin döneminde 30 Ağustos günü de yer almış, ayrıca Ayşe izin süresi boyunca bir akrabasının mağazasında ücretle çalışmıştır. Sözleşmede ulusal bayram günlerinde çalışma hakkında hüküm yoktur. İşveren, 23 Nisan günü Ayşe'yi onayını almadan çalıştırmış ve "aylık ücretli olduğun için ek ücret yok" demiştir.
      1. Ayşe'nin yıllık izin süresi en az kaç gündür?
      2. İşverenin izni tek taraflı bölmesi mümkün müdür?
      3. İzin dönemine rastlayan 30 Ağustos günü bakımından durum nedir?
      4. Ayşe'nin izin süresince ücretle çalışmasının sonucu nedir?
      5. 23 Nisan çalışması bakımından işverenin tutumu doğru mudur, Ayşe'ye ne ödenmelidir?
    olcut:
      - {tespit: "Hizmet süresi 3 yıl olduğundan 14 gün, ancak 50 ve üzeri yaştaki işçiye izin 20 günden az olamayacağından Ayşe için en az 20 gün", puan: 20, madde: "İK m. 53"}
      - {tespit: "Yıllık iznin işveren tarafından bölünememesi; ancak tarafların anlaşmasıyla bir bölümü 10 günden aşağı olmamak üzere bölünebilmesi", puan: 20, madde: "İK m. 56"}
      - {tespit: "İzin süresine rastlayan ulusal bayramın izin süresinden sayılmaması", puan: 10, madde: "İK m. 56"}
      - {tespit: "İzin süresinde ücret karşılığı başka işte çalışan işçiye ödenen izin ücretinin işverence geri alınabilmesi", puan: 15, madde: "İK m. 58"}
      - {tespit: "Sözleşmede hüküm olmadığından bayramda çalıştırma için işçinin onayının gerekmesi", puan: 15, madde: "İK m. 44"}
      - {tespit: "Aylık ücretliye çalışılan her tatil günü için ayrıca bir günlük çıplak ücretin (1.200 TL) ödenmesi, yemek yardımının hesaba girmemesi", puan: 20, madde: "İK m. 49"}
    cozum: |
      **Nitelendirme:** Olay, yıllık ücretli iznin süresi, kullanılma biçimi ve izin süresinde çalışmanın sonucu ile ulusal bayram günü çalışmasının ücretine ilişkindir. Ayşe aylık ücretli bir işçidir.

      **Hukuki sorunlar:** (1) İzin süresinin kıdem ve yaşa göre belirlenmesi, (2) işverenin izni tek taraflı bölmesi, (3) izne rastlayan bayramın hesabı, (4) izinde ücretli çalışma, (5) bayram çalışması için onay ve ücret.

      **İlgili hükümler:** İK m. 53'e göre bir yıldan beş yıla kadar (beş yıl dahil) hizmet süresi için izin ondört günden az olamaz; ancak elli ve daha yukarı yaştaki işçilere verilecek izin yirmi günden az olamaz. İK m. 56/1 ve İK m. 56/3 izni bölme konusunu düzenler. İK m. 56/5'e göre izin süresine rastlayan ulusal bayram izin süresinden sayılmaz. İK m. 58 izinde ücretli çalışma hâlinde izin ücretinin geri alınabileceğini söyler. İK m. 44 onay şartını, İK m. 47 ve İK m. 49/4 ücreti, İK m. 50 çıplak ücretin esas alınmasını düzenler.

      **Değerlendirme:** Ayşe'nin kıdemi üç yıldır; kıdem bakımından 14 gün gerekir. Fakat Ayşe 53 yaşında olduğundan yaş hükmü uygulanır ve izin en az 20 gündür; işverenin "14 gün yeter" demesi hatalıdır. Yıllık izin işveren tarafından bölünemez ve sürekli verilmelidir; Ayşe ile anlaşılmaksızın 5 + 5 + 4 gün olarak tek taraflı bölme mümkün değildir. Anlaşma olsa bile bir bölüm 10 günden az olmamalıdır. 30 Ağustos bir ulusal bayram günüdür; izin süresine rastladığı için izin süresinden sayılmaz, izin o kadar uzar ve bayram ücreti ayrıca ödenir. İzin süresinde ücret karşılığı başka bir işte çalışan işçiye ödenen izin ücreti işverence geri alınabilir. 23 Nisan için sözleşmede hüküm yoktur; bu nedenle çalışma, Ayşe'nin onayını gerektirir ve onay alınmadan çalıştırma kanuna aykırıdır. Çalışılmış olduğuna göre aylık ücretli Ayşe, aylığına ek olarak çalıştığı gün için bir günlük çıplak ücret olan 1.200 TL alır; yemek yardımı hesaba girmez ve ödeme %50 zamlı değildir. İşverenin "aylık ücretli olduğun için ek ücret yok" tutumu İK m. 49/4'e aykırıdır.

      **Sonuç:** Ayşe'nin izni en az 20 gündür, işveren izni tek taraflı bölemez, 30 Ağustos izin süresinden sayılmaz, izinde ücretli çalışma nedeniyle izin ücreti geri alınabilir, 23 Nisan çalışması onay gerektirir ve ek olarak 1.200 TL ödenir.
  - olay: |
      Antalya'da Kültür ve Turizm Bakanlığından turizm işletmesi belgesi verilmiş bir konaklama tesisinde resepsiyonist Barış, haftanın 6 günü günde 7,5 saat çalışmaktadır. Barış yazılı onay vererek hafta tatilini ertelemeli kullanmayı kabul etmiş, hak kazandığı Pazar günü de 7,5 saat çalışmış ve hafta tatili kendisine Çarşamba günü kesintisiz 24 saat olarak kullandırılmıştır. Aynı işveren, turizm işletmesi belgeli bir restoranda çalışan Cem'e de aynı uygulamayı yapmak istemektedir. Barış'ın iş sözleşmesi 6 yıl 4 ay sonunda işverence haklı nedenle feshedilmiştir. Barış bu sürede toplam 62 gün yıllık izin kullanmıştır. Hiç yıllık izin ücreti ödenmemiştir.
      1. Barış'ın hafta tatilinin Çarşamba günü kullandırılması hukuka uygun mudur?
      2. Barış'ın Pazar günkü 7,5 saatlik çalışması fazla çalışma hesabında nasıl değerlendirilir?
      3. Aynı uygulama Cem için yapılabilir mi?
      4. Barış onayını geri almak isterse ne yapmalıdır?
      5. Barış'ın fesih sonrası izin ücreti hakkı var mıdır, kaç günlük ve hangi ücretle, zamanaşımı ne zaman başlar?
    olcut:
      - {tespit: "Belgeli konaklama tesisinde yazılı onayla hafta tatilinin hak kazanılan günü takip eden dört gün içinde kullandırılabilmesi; Çarşamba, Pazar'ı izleyen üçüncü gündür", puan: 20, madde: "İK m. 46"}
      - {tespit: "Pazar günkü çalışmanın günlük normal çalışma süresi kadarlık (7,5 saat) kısmının fazla çalışmanın hesabında dikkate alınmaması", puan: 15, madde: "İK m. 46"}
      - {tespit: "İstisnanın yalnız belgeli konaklama tesislerini kapsaması; belgeli restoranın kapsam dışı olması", puan: 15, madde: "İK m. 46"}
      - {tespit: "Onayın otuz gün önceden yazılı bildirimle geri alınabilmesi", puan: 10, madde: "İK m. 46"}
      - {tespit: "Sözleşme haklı fesihle bile sona ermiş olsa kullanılmayan izin ücretinin sona erme tarihindeki ücretle ödenmesi; altı hak (5 x 14 + 20 = 90 gün), 62 gün kullanıldığından 28 gün", puan: 25, madde: "İK m. 53 ve İK m. 59"}
      - {tespit: "İzin ücreti zamanaşımının sözleşmenin sona erdiği tarihten başlaması", puan: 15, madde: "İK m. 59"}
    cozum: |
      **Nitelendirme:** Olay, turizm konaklama tesislerine özgü hafta tatili düzenlemesini ve sözleşmenin haklı fesihle sona ermesinden sonra yıllık izin ücretini birlikte içerir.

      **Hukuki sorunlar:** (1) Hafta tatilinin ertelenmesinin şartları, (2) bu hâlde tatil günündeki çalışmanın fazla çalışma hesabındaki yeri, (3) kapsam sınırı, (4) onayın geri alınması, (5) haklı fesihte izin ücreti ve zamanaşımı.

      **İlgili hükümler:** İK m. 46/1'e göre Kültür ve Turizm Bakanlığı tarafından turizm işletmesi belgesi verilen konaklama tesislerinde çalışan işçinin hak kazandığı hafta tatili, işçinin yazılı talebi veya onayıyla hak kazandığı günü takip eden dört gün içinde kullandırılabilir. Bu hâlde hak kazanılan hafta tatilinde yapılan çalışmaların günlük normal çalışma süresi kadarlık kısmı fazla çalışmanın hesabında dikkate alınmaz. İşçi onayını otuz gün önceden yazılı bildirimle geri alabilir. İK m. 53'e göre izin süreleri 14, 20 ve 26 gündür. İK m. 59/1'e göre sözleşme herhangi bir nedenle sona ererse kullanılmayan izin ücreti sona erme tarihindeki ücret üzerinden ödenir ve zamanaşımı sona erme tarihinden başlar.

      **Değerlendirme:** Barış, belgeli konaklama tesisinde çalışmakta ve yazılı onay vermiştir. Pazar günü hak kazandığı hafta tatili Çarşamba günü, yani izleyen üçüncü günde kullandırıldığından dört günlük süre içindedir. Günlük normal çalışma süresi 7,5 saat olduğundan Pazar günkü 7,5 saatlik çalışma, fazla çalışma hesabında dikkate alınmaz. Cem'in çalıştığı restoran belgeli olsa bile konaklama tesisi olmadığı için bu istisna ona uygulanamaz; Cem'in hafta tatili genel kurala göre verilir. Barış onayını otuz gün önceden işverene yazılı bildirerek geri alabilir. Barış 6 yıl 4 ay çalıştığından altı izin hakkı doğmuştur: ilk beş hak 14 gün, altıncı hak 20 gündür; toplam 90 gün. 62 gün kullanıldığından 28 günlük izin kalmıştır (örnek hesaptır). İşverenin haklı nedenle feshi izin ücretini ortadan kaldırmaz; ücret sona erme tarihindeki ücretle ödenir ve zamanaşımı bu tarihten başlar.

      **Sonuç:** Barış için uygulama hukuka uygundur, Pazar günkü 7,5 saat fazla çalışma hesabına katılmaz, Cem için uygulanamaz, onay otuz gün önceden bildirimle geri alınabilir ve Barış 28 günlük izin ücretine sona erme tarihindeki ücretle hak kazanır.
kartlar:
  - on: "Hafta tatilinin süresi ve koşulu?"
    arka: "7 günlük zaman diliminde kesintisiz en az 24 saat; tatilden önce İK m. 63'e göre belirlenen iş günlerinde çalışmış olma koşuluyla (İK m. 46/1)."
  - on: "Turizm konaklama tesislerinde hafta tatili istisnası?"
    arka: "7553 sayılı Kanunla: belgeli konaklama tesisinde yazılı talep veya onayla hak kazanılan günü izleyen 4 gün içinde kullandırılır; onay 30 gün önceden yazılı bildirimle geri alınır (İK m. 46/1)."
  - on: "Ulusal bayram ve genel tatilde çalışma için onay?"
    arka: "Sözleşmede hüküm yoksa işçinin onayı gerekir (İK m. 44)."
  - on: "UBGT'de çalışan aylık ücretli işçiye ne ödenir?"
    arka: "Aylığa ek olarak çalışılan her gün için bir günlük ücret (İK m. 47, İK m. 49/4)."
  - on: "Tatil ücretinde hangi ücret esas alınır?"
    arka: "Çıplak ücret; fazla çalışma ücreti, primler ve sosyal yardımlar hesaba katılmaz (İK m. 50)."
  - on: "Yıllık izin için gereken hizmet süresi ve vazgeçme?"
    arka: "Deneme süresi dahil en az 1 yıl; yıllık izin hakkından vazgeçilemez (İK m. 53/1-2)."
  - on: "Yıllık izin süreleri?"
    arka: "1-5 yıl (5 dahil) 14 gün; 5 yıldan fazla 15 yıldan az 20 gün; 15 yıl (dahil) ve fazlası 26 gün (İK m. 53/4)."
  - on: "Yaş ve yer altı işi izin kuralları?"
    arka: "18 ve daha küçük ile 50 ve daha yukarı yaşta en az 20 gün; yer altı işlerinde süreler dörder gün artırılır (İK m. 53)."
  - on: "Yıllık iznin bölünmesi?"
    arka: "İşveren bölemez; taraflar anlaşırsa bir bölümü 10 günden aşağı olmamak üzere bölümler hâlinde kullanılabilir (İK m. 56/1-3)."
  - on: "İzne rastlayan bayram ve yol izni?"
    arka: "Bayram, hafta tatili ve genel tatil izin süresinden sayılmaz; izni başka yerde geçirecek işçiye istemi hâlinde 4 güne kadar ücretsiz yol izni (İK m. 56/5-6)."
  - on: "Sözleşme sona erince izin ücreti?"
    arka: "Sona erme şekli önemli değildir; sona erme tarihindeki ücretle ödenir, zamanaşımı sona erme tarihinden başlar (İK m. 59/1). Sözleşme sürerken izin ücrete dönüşmez."
  - on: "Eşin doğumunda ve evlenmede mazeret izni?"
    arka: "Evlenme, evlat edinme, yakın ölümü: 3 gün; eşin doğum yapması: 10 gün (7578 sayılı Kanunla 5 günden çıkarıldı) (İK'nın ek 2. maddesi)."
