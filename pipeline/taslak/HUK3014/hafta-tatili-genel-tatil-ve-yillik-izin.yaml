      - "İşveren izni üç parçaya bölebilir, işçinin rızası gerekmez"
      - "İzin en çok üç parçaya bölünebilir ve her parça en az beş gün olmalıdır"
      - "İzin kesinlikle bölünemez, anlaşmayla da olmaz"
