ozet: |
  - **Dayanak:** Anayasa'nın 50. maddesi dinlenmeyi çalışanların hakkı sayar; ücretli hafta ve bayram tatili ile yıllık izin kanunla düzenlenir. İK m. 45'e göre bu haklara aykırı sözleşme hükmü konulamaz, daha elverişli haklar saklıdır.
  - **Hafta tatili (İK m. 46):** tatil gününden önce İK m. 63'e göre belirlenen iş günlerinde çalışan işçiye 7 günlük zaman diliminde **kesintisiz en az 24 saat** dinlenme verilir. Çalışılmayan hafta tatili günü için **o günün ücreti tam** ödenir. 📌 7553 sayılı Kanunla (10.7.2025), **turizm işletmesi belgeli konaklama tesislerinde** hafta tatili işçinin yazılı talebi veya onayıyla hak kazanılan günü takip eden **4 gün** içinde kullandırılabilir; işçi onayını **30 gün önceden** yazılı bildirimle geri alabilir.
  - **Ulusal bayram ve genel tatil (İK m. 44, İK m. 47):** çalışılıp çalışılmayacağı sözleşmeyle belirlenir; hüküm yoksa **işçinin onayı** gerekir. Çalışılmazsa o günün ücreti tam ödenir; **çalışılırsa ayrıca bir günlük ücret** ödenir. Aylık ücretli işçiye çalışılan her tatil günü için **ayrıca bir günlük ücret** eklenir (İK m. 49/4).
  - **Hesap:** fazla çalışma ücretleri, primler ve sosyal yardımlar tatil ücretinin tespitinde **hesaba katılmaz** (İK m. 50).
  - **Yıllık izin hakkı (İK m. 53):** deneme süresi dahil **en az 1 yıl** çalışan işçiye verilir; haktan **vazgeçilemez**. Süreler: 1-5 yıl (5 dahil) **14 gün**, 5 yıldan fazla 15 yıldan az **20 gün**, 15 yıl (dahil) ve fazlası **26 gün**; 18 ve daha küçük yaştakiler ile 50 ve daha yukarı yaştakiler için **en az 20 gün**; yer altı işlerinde süreler **dörder gün** artar.
  - **Kullanım:** işveren izni bölemez; taraflar anlaşırsa bir bölümü **10 günden az olmamak üzere** bölünebilir (İK m. 56/3). İzne rastlayan bayram ve hafta tatili izin süresinden **sayılmaz**; yol için **4 güne kadar ücretsiz izin** verilir (İK m. 56).
  - **Ücret:** izin ücreti izne başlamadan **peşin** ödenir (İK m. 57). İzinde ücretle başka işte çalışan işçiden izin ücreti **geri alınabilir** (İK m. 58). Sözleşme **herhangi bir nedenle** sona ererse kullanılmayan izin ücreti sona erme tarihindeki ücretle ödenir, zamanaşımı sona ermeden başlar (İK m. 59).
  - **Mazeret izni (İK'nın ek 2. maddesi):** evlenme, evlat edinme, ana-baba, eş, kardeş, çocuk ölümünde **3 gün**; eşin doğumunda **10 gün** (📌 7578 sayılı Kanunla beşten ona çıkarıldı); en az %70 engelli veya süreğen hastalıklı çocuğun tedavisinde, rapora dayalı ve ebeveynlerden yalnız biri kullanmak üzere yılda **10 güne kadar**.
anlatim: |
  ## 1. Anayasal çerçeve ve sistem

  Anayasa'nın 50. maddesi "Dinlenmek, çalışanların hakkıdır" der ve ücretli hafta ve bayram tatili ile yıllık ücretli izin haklarının kanunla düzenleneceğini belirtir. İş Kanunu bu hakları üç grupta toplar: **hafta tatili** (İK m. 46), **ulusal bayram ve genel tatiller** (İK m. 44, İK m. 47) ve **yıllık ücretli izin** (İK m. 53-60). İK m. 45 bu haklara aykırı sözleşme hükmü konulamayacağını, işçiye daha elverişli kanun, toplu iş sözleşmesi, iş sözleşmesi veya gelenekten doğan hakların saklı olduğunu söyler. Yani bu kurallar işçi lehine **emredicidir**.

  ## 2. Hafta tatili (İK m. 46)

  İK m. 46/1'e göre işçilere tatil gününden önce İK m. 63'e göre belirlenen iş günlerinde çalışmış olmaları koşuluyla yedi günlük zaman dilimi içinde **kesintisiz en az yirmidört saat** dinlenme (hafta tatili) verilir. Çalışılmayan hafta tatili günü için işveren, bir iş karşılığı olmaksızın o günün ücretini **tam** öder (İK m. 46/2).

  Bazı günler çalışılmamış olsa da **çalışılmış gibi** hesaba katılır:

  - Kanunen çalışma süresinden sayılan zamanlar ile kanun veya sözleşmeden doğan tatil günleri,
  - İK'nın ek 2. maddesindeki mazeret izinleri,
  - Bir haftalık süre içinde kalmak üzere işverence verilen diğer izinler ve hekim raporuyla verilen hastalık ve dinlenme izinleri.

  Ayrıca zorlayıcı ve ekonomik bir sebep olmadan işveren haftanın bir veya birkaç gününü tatil ederse, çalışılmayan günler hafta tatiline hak kazanmak bakımından çalışılmış sayılır. İşin bir haftadan fazla durmasını gerektiren zorlayıcı sebeplerde (İK m. 24 ve İK m. 25'in III numaralı bentleri) çalışılmayan günler için ödenen yarım ücret hafta tatili günü için de ödenir.

  > **Örnek:** Ali her gün çalıştığı bir haftada Cumartesi günü hastalık raporu aldı. Rapor günü çalışılmış gibi sayıldığından, Pazar günkü hafta tatili ücretini kaybetmez.

  **📌 Turizm konaklama tesisi istisnası.** 7553 sayılı Kanunla (10.7.2025) İK m. 46/1'e yeni cümleler eklenmiştir. Kültür ve Turizm Bakanlığı tarafından **turizm işletmesi belgesi verilen konaklama tesislerinde** çalışan işçinin hafta tatili, işçinin **yazılı talebi veya onayıyla** hak kazanılan günü takip eden **dört gün** içinde kullandırılabilir. Bu hâlde işçinin hak kazandığı hafta tatilinde yaptığı çalışmaların **günlük normal çalışma süresi kadarlık kısmı** fazla çalışmanın hesabında dikkate alınmaz. İşçi onayını **otuz gün önceden** yazılı bildirimle geri alabilir.

  > ⚠️ **Sınavda dikkat:** İstisna her turizm işletmesini değil, yalnız **belgeli konaklama tesislerini** kapsar. Belgeli bir restoran işçisi kapsam dışındadır. Onay da yazılı olmak zorundadır.

  **Ücret ve çalışma karşılığı.** Günlük ücretli işçinin tatil günü ücreti çalıştığı günlere göre bir güne düşen ücrettir; saat ücretlinin tatil günü ücreti saat ücretinin 7,5 katıdır (İK m. 49). Hafta tatilinde **çalışılırsa**, Yargıtay'ın yerleşik uygulamasına göre tatil ücretine ek olarak çalışma karşılığı %50 zamlı ödenir; böylece günlük ücretli işçiye toplam 2,5 günlük, aylık ücretli işçiye ise ilave 1,5 günlük ücret düşer. Bu oran kanun metninde yazmaz, uygulamadan gelir. İşçi bu çalışmayı ispatla yükümlüdür; tanık beyanına dayanan alacaklardan takdiren indirim yapılır.

  ## 3. Ulusal bayram ve genel tatiller (İK m. 44, İK m. 47)

  İK m. 44'e göre bu günlerde işyerinde çalışılıp çalışılmayacağı toplu iş sözleşmesi veya iş sözleşmesiyle kararlaştırılır. Sözleşmelerde hüküm yoksa çalışılması için **işçinin onayı** gerekir. Ücretler İK m. 47'ye göre ödenir:

  - **Çalışılmazsa** o günün ücreti tam ödenir,
  - **Çalışılırsa** ayrıca çalışılan her gün için bir günlük ücret ödenir.

  İK m. 49/4'e göre aylığı tam ödenen **aylık ücretli** işçiye İK m. 46, İK m. 47 ve İK m. 48'in birinci fıkrası uygulanmaz, çünkü tatil günü ücreti aylık ücretin içindedir. Ancak bunlardan ulusal bayram ve genel tatil günlerinde **çalışanlara ayrıca çalıştığı her gün için bir günlük ücret** ödenir.

  | Durum | Çalışılan UBGT günü |
  |---|---|
  | Günlük ücretli işçi | 1 günlük tatil ücreti + 1 günlük ücret |
  | Aylık ücretli işçi | aylığa ek 1 günlük ücret |

  İK m. 50'ye göre fazla çalışma karşılığı ücretler, primler, hazırlama-tamamlama-temizleme ücretleri ve **sosyal yardımlar** bu günlerin ücretinin tespitinde hesaba katılmaz; yani **çıplak ücret** esas alınır.

  > **Örnek:** Aylık çıplak ücreti 36.000 TL olan Zeynep'in günlük çıplak ücreti 1.200 TL, yemek yardımı ise aylıktır. 23 Nisan'da onayıyla çalışırsa aylık ücretine ek olarak 1.200 TL alır; yemek yardımı hesaba girmez. Bu ödeme %50 zamlı değildir.

  ## 4. Yıllık ücretli izin: hak kazanma (İK m. 53-55)

  İK m. 53/1'e göre işyerinde işe başladığı günden itibaren, **deneme süresi de içinde olmak üzere**, en az **bir yıl** çalışmış işçilere yıllık ücretli izin verilir. Bu haktan **vazgeçilemez**. Niteliği gereği bir yıldan az süren mevsimlik veya kampanya işlerinde bu hükümler uygulanmaz.

  | Hizmet süresi | En az izin süresi |
  |---|---|
  | 1 yıldan 5 yıla kadar (5 yıl dahil) | 14 gün |
  | 5 yıldan fazla, 15 yıldan az | 20 gün |
  | 15 yıl (dahil) ve daha fazla | 26 gün |

  Kurallar:

  - **18 ve daha küçük** yaştaki işçilerle **50 ve daha yukarı** yaştaki işçilere verilecek izin **20 günden az olamaz**.
  - **Yer altı işlerinde** çalışan işçilerin izin süreleri **dörder gün** artırılarak uygulanır (14 gün yerine 18, 20 yerine 24, 26 yerine 30).
  - Süreler iş sözleşmesi ve toplu iş sözleşmesiyle artırılabilir.

  > ⚠️ **Sınavda dikkat:** Tam **5 yıl** kıdemli işçi "bir yıldan beş yıla kadar (beş yıl dahil)" bentine girer ve **14 gün** alır. 20 günlük izin, beşinci yılın üzerine geçildiğinde başlar. 15. yılda ise "onbeş yıl dahil" ifadesi nedeniyle 26 gün uygulanır.

  İK m. 54'e göre hak kazanma süresi hesaplanırken işçinin aynı işverenin bir veya çeşitli işyerlerinde çalıştığı süreler birleştirilir. Hizmet yılı içindeki bazı devamsızlıklar ise çalışılmış gibi sayılır (İK m. 55). Örnekler: iş kazası veya hastalıktan dolayı işe gidilemeyen günler (belirli üst sınırla), doğum izni, hafta tatili ve genel tatil günleri, ek 2. maddedeki izinler, işverence verilen diğer izinler ve kısa çalışma süreleri.

  ## 5. Yıllık iznin kullanılması (İK m. 56-58)

  - **Bölünme:** Yıllık izin işveren tarafından bölünemez ve sürekli verilmesi zorunludur. Ancak İK m. 56/3'e göre taraflar anlaşırsa izin, **bir bölümü on günden aşağı olmamak üzere** bölümler hâlinde kullanılabilir. Eski "en çok üçe bölünür" sınırı 6704 sayılı Kanunla kaldırılmıştır; parça sayısı yazılmamıştır, ama bir bölümün 10 günden az olmaması aranır.
  - **Mahsup yasağı:** İşverence yıl içinde verilen diğer ücretli ve ücretsiz izinler veya hastalık izinleri yıllık izne mahsup edilemez (İK m. 56/4).
  - **Tatil günleri:** İzin süresine rastlayan ulusal bayram, hafta tatili ve genel tatil günleri izin süresinden **sayılmaz** (İK m. 56/5).
  - **Yol izni:** İzni başka yerde geçirecek ve bunu belgeleyen işçiye, istemi hâlinde, gidiş-dönüş için toplam **dört güne kadar ücretsiz izin** verilir (İK m. 56/6). İşveren ayrıca **izin kayıt belgesi** tutmak zorundadır.
  - **Ücret:** İşveren yıllık izin dönemi ücretini işçi izne başlamadan **peşin** öder veya avans verir (İK m. 57). İzin ücretinin hesabında İK m. 50 uygulanır; izne rastlayan hafta tatili ve genel tatil ücretleri ayrıca ödenir.
  - **İzinde çalışma:** İşçi izin süresi içinde ücret karşılığı bir işte çalışırsa, izin süresi için ödenen ücret işverence **geri alınabilir** (İK m. 58).

  > **Örnek:** 20 gün izin hakkı olan Mehmet işverenle anlaşarak izninin 10 gününü Temmuz'da, kalan 10 gününü Aralık'ta kullanır. Birinci bölüm on günden az olmadığı için bu bölme kanuna uygundur.

  ## 6. Sözleşme sona erince izin ücreti (İK m. 59)

  İş sözleşmesi **herhangi bir nedenle** sona ererse işçinin hak kazanıp kullanmadığı yıllık izin sürelerinin ücreti, sözleşmenin sona erdiği tarihteki ücret üzerinden işçiye veya hak sahiplerine ödenir. Fesih biçimi ve feshin haklı olup olmaması önemli değildir; istifa ya da işverenin haklı feshi izin ücretini ortadan kaldırmaz. Zamanaşımı sözleşmenin sona erdiği tarihten başlar (İK m. 59/1); süresi İK'nın ek 3. maddesine göre **beş yıldır**. İşveren feshi hâlinde ihbar süresi ve yeni iş arama izinleri yıllık izin süreleriyle **iç içe giremez** (İK m. 59/2).

  **İzin ücretinin parayla ödenmesi.** Yıllık izin bir dinlenme hakkı olduğundan sözleşme devam ederken **ücrete dönüşmez**. İşçi izni kullanmak yerine ücretini almayı kararlaştırsa bu anlaşma geçersizdir (İK m. 53/2, İK m. 59). Kullandırıldığı iddiasının ispat yükü işverene aittir; bu yüzden işçinin imzasını taşıyan izin kayıt belgesi tutulur. Yargıtay uygulamasında yıllık iznin kullandırıldığı tanıkla kanıtlanamaz.

  > **Örnek:** Ayşe, 6 yıl 4 ay çalıştıktan sonra işverence haklı nedenle çıkarıldı. Altı izin hakkı doğmuştur: ilk beşi 14, altıncısı 20 gün; toplam 90 gün. 62 gün kullandıysa kalan 28 günün ücreti, işten çıkarma tarihindeki ücretle ödenir (örnek hesaptır).

  ## 7. Mazeret izinleri (İK'nın ek 2. maddesi)

  İşçiye şu hâllerde ücretli izin verilir:

  - **Evlenme veya evlat edinme** ya da **ana, baba, eş, kardeş veya çocuğun ölümü:** üç gün.
  - **Eşin doğum yapması:** on gün. 📌 22.4.2026 tarihli 7578 sayılı Kanunla bu süre **beş günden on güne** çıkarılmıştır.
  - **En az %70 engelli veya süreğen hastalığı olan çocuğun tedavisi:** hastalık raporuna dayalı olarak, çalışan ebeveynlerden yalnız biri tarafından kullanılmak kaydıyla bir yıl içinde toptan veya bölümler hâlinde **on güne kadar**.

  Bu izinler hafta tatili hesabında çalışılmış gün, yıllık izin hesabında çalışılmış süre sayılır (İK m. 46, İK m. 55).

  ## 8. Hızlı denetim şeması

  1. İşçi bir yıllık (deneme dahil) kıdemi doldurdu mu? Hangi bentte: 14/20/26, yaş (18, 50), yer altı?
  2. İzin tek parça mı verildi? Bölme için işçi anlaşması ve 10 günlük bölüm var mı? Bayram-hafta tatili izin süresinden düşülüyor mu?
  3. Tatil günü çalışıldı mı? UBGT'de onay var mı? Ücret çıplak ücretten hesaplanıyor mu (İK m. 50)?
  4. Turizm konaklama tesisinde yazılı onayla hafta tatili ertelendi mi (4 gün, 30 gün geri alma)?
  5. Sözleşme bittiğinde kullanılmayan izin ücreti, sona erme tarihindeki ücretle ödendi mi? Zamanaşımı sona ermeden başlar.
kritik: |
  - 📌 Hafta tatili: 7 günlük zaman dilimi içinde **kesintisiz en az 24 saat**; çalışılmayan hafta tatili günü ücreti **tam** ödenir (İK m. 46/1-2).
  - 📌 7553 sayılı Kanun: **turizm işletmesi belgeli konaklama tesislerinde** yazılı talep veya onayla hafta tatili hak kazanılan günü takip eden **4 gün** içinde kullandırılır; onay **30 gün** önceden yazılı bildirimle geri alınır (İK m. 46/1).
  - ⚠️ UBGT'de çalışma için sözleşmede hüküm yoksa **işçinin onayı** gerekir; çalışılırsa ayrıca **bir günlük ücret** ödenir, aylık ücretliye de çalışılan her gün için ayrıca bir günlük ücret eklenir (İK m. 44, İK m. 47, İK m. 49/4).
  - 📌 Tatil ücretinde **çıplak ücret** esas alınır; fazla çalışma ücreti, prim ve sosyal yardımlar hesaba katılmaz (İK m. 50).
  - 📌 Yıllık izin hakkı: deneme süresi dahil **en az 1 yıl**; vazgeçilemez (İK m. 53/1-2). Süreler: **14 / 20 / 26 gün** (5 yıl dahil 14; 5 yıldan fazla ve 15 yıldan az 20; 15 yıl dahil 26).
  - ⚠️ Tam **5 yıl** kıdemde izin **14 gündür**; 20 gün 5 yılı geçince başlar. 15 yılda **26 gün** uygulanır (İK m. 53/4).
  - 📌 **18 ve daha küçük** ile **50 ve daha yukarı** yaştakilere izin **20 günden az olamaz**; yer altı işlerinde süreler **dörder gün** artar (İK m. 53).
  - ⚠️ İşveren izni tek taraflı bölemez; taraf anlaşmasıyla **bir bölümü 10 günden az olmamak** üzere bölünebilir; "en çok üçe bölünür" eski kural kalkmıştır (İK m. 56/1-3).
  - 📌 İzne rastlayan **bayram, hafta tatili, genel tatil** izin süresinden sayılmaz; yol için **4 güne kadar ücretsiz** izin (İK m. 56/5-6).
  - 📌 İzin ücreti izne başlamadan **peşin** ödenir; izinde ücretle başka işte çalışan işçiden geri alınabilir (İK m. 57, İK m. 58).
  - ⚠️ İzin ücreti yalnız sözleşme **herhangi bir nedenle** sona erince doğar; sözleşme sürerken izin ücrete çevrilemez. Zamanaşımı sona erme tarihinden başlar, süresi 5 yıldır (İK m. 59/1, İK'nın ek 3. maddesi).
  - 📌 Mazeret izni: evlenme, evlat edinme, yakın ölümü **3 gün**; eşin doğumu **10 gün** (7578 sayılı Kanunla 5 günden çıkarıldı); %70 engelli/süreğen hastalıklı çocuk için yılda **10 güne kadar** (İK'nın ek 2. maddesi).
doktrin: |
  ### Kısmi süreli işçinin hafta tatili ücreti
  İK m. 46/1, hafta tatiline hak kazanmak için tatilden önce İK m. 63'e göre belirlenen iş günlerinde çalışmış olmayı arar. Yargıtay'ın yerleşik uygulamasına göre haftalık süresi 45 saatin altında kalan ve haftanın bütün iş günlerinde çalışmayan kısmi süreli işçiler, bu koşulu yerine getirmediklerinden ücretli hafta tatiline hak kazanamaz. Karşı görüş, ayrım yasağı nedeniyle haftanın bütün iş günlerinde günde birkaç saat çalışan kısmi süreli işçiye orantılı hafta tatili ücreti verilmesi gerektiğini savunur. Sınavda bu tartışmanın varlığı bilinmeli, ama olay sonucu kesin bir kurala değil, olayın ayrıntılarına bağlanmalıdır.

  ### Hafta tatili çalışmasının zam oranı
  Kanun, hafta tatilinde çalışılmasının karşılığını açıkça yüzde olarak göstermez. Uygulama, İK m. 46 ile İK m. 41'in birlikte yorumundan çalışma karşılığını %50 zamlı sayar. Bu nedenle günlük ücretliye 2,5, aylık ücretliye ilave 1,5 günlük ücret düşer. UBGT ise farklıdır: İK m. 47 ayrıca "bir günlük ücret" der, zam oranı yoktur.

  ### Çok uzun süre izin kullanılmadığı iddiası
  İznin kullandırıldığını ispat yükü işverendedir ve imzalı izin belgesi aranır. Buna karşılık işçinin onlarca yıl hiç izin kullanmadığı iddiası hayatın olağan akışına uymadığında, mahkemenin davayı aydınlatma ödevi kapsamında işçiyi dinleyerek durumu açıklattırması gerektiği yönünde Yargıtay uygulaması vardır. Bu, belge aranmasını kaldırmaz; yalnız olağan akışa aykırı iddiaların denetlenmesidir.
sozluk:
  - terim: Hafta tatili
    tanim: "7 günlük zaman diliminde işçiye verilen kesintisiz en az 24 saatlik dinlenme; çalışılmayan günün ücreti tam ödenir (İK m. 46)."
  - terim: Ulusal bayram ve genel tatil (UBGT)
    tanim: "Kanunlarda bayram ve genel tatil sayılan günler; çalışılmazsa tam ücret, çalışılırsa ayrıca bir günlük ücret ödenir (İK m. 47)."
  - terim: Çıplak ücret
    tanim: "Fazla çalışma ücreti, primler ve sosyal yardımlar hariç temel ücret; tatil ve izin ücreti buna göre hesaplanır (İK m. 50)."
  - terim: Yıllık ücretli izin
    tanim: "Deneme süresi dahil en az bir yıl çalışan işçiye verilen, vazgeçilemeyen dinlenme hakkı (İK m. 53)."
  - terim: Yer altı işi
    tanim: "Maden gibi yer altında çalışılan işler; yıllık izin süreleri dörder gün artırılarak uygulanır (İK m. 53)."
  - terim: İzin kayıt belgesi
    tanim: "İşverenin yıllık izin kullanımını gösterdiği, işçi imzalı belge; izin kullandırıldığının ispatında esastır (İK m. 56)."
  - terim: Yol izni
    tanim: "Yıllık izni başka yerde geçirecek ve bunu belgeleyen işçiye istemi hâlinde verilen, toplam 4 güne kadar ücretsiz izin (İK m. 56/6)."
  - terim: Bölünmüş izin
    tanim: "Taraf anlaşmasıyla bir bölümü 10 günden az olmamak üzere parçalara ayrılarak kullanılan yıllık izin (İK m. 56/3)."
  - terim: Mazeret izni
    tanim: "Evlenme, evlat edinme, yakın ölümü, eşin doğumu gibi hâllerde verilen ücretli izin (İK'nın ek 2. maddesi)."
  - terim: Zorlayıcı sebep
    tanim: "İşyerinde işin bir haftadan fazla durmasını gerektiren dış etken; hafta tatili için de yarım ücret ödenir (İK m. 46)."
kararlar:
  - id: "646422700"
    ozet: |
      Davacı, belediyede çalışırken 6111 sayılı Kanun uyarınca ihtiyaç fazlası işçi olarak İl Kültür ve Turizm Müdürlüğüne nakledilmiş, tebliğden sonra yeni görev yerinde çalışmaya başlamış ve belediyeden kullanmadığı yıllık izin ücretini istemiştir. Yerel mahkeme davayı kabul etmiş, Özel Daire kararı bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu, İK m. 59 uyarınca yıllık izin hakkının ücrete dönüşmesi için iş sözleşmesinin sona ermesinin şart olduğunu, bu hakkın Anayasa'nın 50. maddesine dayanan bir dinlenme hakkı olduğunu ve sözleşme sürerken ücrete dönüşmediğini belirtmiştir. Nakil, sözleşmenin sona ermesi değil devri olduğundan izin ücreti alacağı henüz doğmamıştır. Bu nedenle devir tarihinden önce doğmuş borçlara ilişkin hüküm de uygulanamaz. Direnme kararı 16.02.2021'de oybirliğiyle bozulmuştur.
  - id: "383701100"
    ozet: |
      Davacı, iş sözleşmesini 07/06/2011'de haklı nedenle feshettiğini ileri sürerek kıdem tazminatı, ücret, yıllık izin, fazla mesai ve hafta tatili/pazar çalışması ücreti istemiştir. Yerel mahkeme hafta tatili talebini reddetmiş, ayda iki hafta tatilinde 08:30-17:00 arasında bir saat ara dinlenmesi düşülerek yapılan günlük 7,5 saatlik çalışmayı fazla mesai ücreti içinde hesaplatmıştır. Yargıtay 9. Hukuk Dairesi, davacının haftada yedi gün çalıştığını ve pazar çalışmasını ayrı bir kalem olarak talep ettiğini belirterek bu alacağın fazla mesai değil hafta tatili ücreti olarak hüküm altına alınması gerektiğini söylemiştir. Karar, kısmi ibraname ve sayaç okuma kayıtlarına ilişkin eksiklikler nedeniyle de oybirliğiyle, 30/11/2017'de bozulmuştur.
sorular:
  - soru: |
      İK m. 46/1'e göre hafta tatili bakımından hangisi doğrudur?
    siklar:
      - "Tatil gününden önce İK m. 63'e göre belirlenen iş günlerinde çalışan işçiye 7 günlük zaman diliminde kesintisiz en az 24 saat verilir"
      - "İşçiye 7 günlük zaman diliminde kesintisiz en az 48 saat verilir"
      - "İşçiye her takvim haftasında Pazar günü olmak üzere 35 saat verilir"
