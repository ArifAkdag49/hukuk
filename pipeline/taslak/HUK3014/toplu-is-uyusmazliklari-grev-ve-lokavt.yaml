sorular:
  - soru: |
      Toplu görüşme süresi anlaşmasız sona eren taraflardan biri, uyuşmazlığı görevli makama bildirmemiştir. Altı iş günü geçmiştir. Sonuç ne olur?
    siklar:
      - "İşçi sendikasının yetkisi düşer."
      - "Uyuşmazlık kendiliğinden YHK'ya gider."
      - "Arabulucu resen görevlendirilir ve süreç devam eder."
      - "İşveren lokavt kararı alabilir."
    dogru: 0
    aciklama: |
      STİSK m. 49/1'e göre uyuşmazlık altı iş günü içinde bildirilmezse işçi sendikasının yetkisi düşer. Yaygın yanılgı, sürecin kendiliğinden ilerlediğini düşünmektir; bildirim yapılmadan arabuluculuk başlamaz.
  - soru: |
      Resmî arabulucunun görev süresi hangisidir?
    siklar:
      - "On beş gün; anlaşmayla en çok altı iş günü uzatılabilir."
      - "Otuz gün; anlaşmayla on beş gün uzatılabilir."
      - "Altı iş günü; uzatılamaz."
      - "On beş gün; uzatılamaz."
    dogru: 0
    aciklama: |
      STİSK m. 50/3: görev on beş gün sürer, tarafların anlaşmasıyla en çok altı iş günü uzatılabilir. Süre yanılgıları sınavda çeldirici olarak kullanılır.
  - soru: |
      Sendika, arabulucu tutanağının tebliğinden itibaren 60 gün içinde grev kararı almıştır. Kararın uygulanması için hangisi gerekir?
    siklar:
      - "Uygulama tarihi, altı iş günü önceden karşı tarafa bildirilmelidir."
      - "Uygulama tarihi, otuz gün önceden bildirilmelidir."
      - "Grev ilanından sonra görevli makamın izni alınmalıdır."
      - "Önce YHK'dan onay alınmalıdır."
    dogru: 0
    aciklama: |
      STİSK m. 60/1'e göre grev, altmış gün içinde altı iş günü önceden karşı tarafa bildirilecek tarihte uygulanır. Onay mekanizması yoktur.
  - soru: |
      Z İşveren Sendikası üyesi A Ltd. Şti., işçi sendikası henüz grev kararı almadan işyerini kapatıp tüm işçileri uzaklaştırmıştır. Bu işlem hakkında hangisi doğrudur?
    siklar:
      - "Kanun dışı lokavttır; işçiler haklı nedenle fesih yapabilir."
      - "Kanuni lokavttır, çünkü faaliyet tamamen durmuştur."
      - "Kısmi lokavt sayılır ve geçerlidir."
      - "Lokavt değil grevdir."
    dogru: 0
    aciklama: |
      STİSK m. 59/2'ye göre kanuni lokavt için işçi sendikasının grev kararı almış olması gerekir. Bu şart yokken yapılan lokavt kanun dışıdır (STİSK m. 59/3); işçiler sözleşmeyi haklı nedenle feshedebilir ve lokavt süresindeki haklarını isteyebilir (STİSK m. 70/3).
  - soru: |
      200 işçili bir işyerinde grev ilan edilmiş, 60 işçi altı iş günü içinde oylama istemiştir. Oylamaya 120 işçi katılmış, 65'i grevin yapılmamasından yana oy kullanmıştır. Sonuç nedir?
    siklar:
      - "Oylama yapılır ve grev uygulanamaz."
      - "Oylama yapılmaz, çünkü yarıdan fazla işçi başvurmamıştır."
      - "Grev uygulanır, çünkü 200 işçinin salt çoğunluğu oluşmamıştır."
      - "Grev uygulanır, çünkü katılım oranı yüzde 75'in altındadır."
    dogru: 0
    aciklama: |
      Oylama için ilan tarihinde çalışanların en az dörtte biri (50) yeterlidir; 60 işçi başvurmuştur (STİSK m. 61/1). Belirleyici olan oylamaya katılanların salt çoğunluğudur; 120 katılımcıdan 65 hayır oyu çoğunluktur (STİSK m. 61/3). Grev uygulanamaz.
  - soru: |
      Yüksek Hakem Kurulu kararları hakkında hangisi doğrudur?
    siklar:
      - "Kesindir ve toplu iş sözleşmesi hükmündedir."
      - "Taraflarca istinaf edilebilir."
      - "Yalnızca tavsiye niteliğindedir."
      - "Cumhurbaşkanının onayıyla yürürlüğe girer."
    dogru: 0
    aciklama: |
      STİSK m. 51/2: YHK kararları kesindir ve toplu iş sözleşmesi hükmündedir.
  - soru: |
      Aşağıdaki işlerden hangisinde grev ve lokavt yapılamaz?
    siklar:
      - "Kamu kuruluşlarınca yürütülen hastanelerde"
      - "Bankacılık hizmetlerinde"
      - "Şehir içi toplu taşıma hizmetlerinde"
      - "Özel sektör otel işletmesinde"
    dogru: 0
    aciklama: |
      Kamu kuruluşlarınca yürütülen itfaiye ve hastanelerde grev ve lokavt yasaktır (STİSK m. 62/1). Bankacılık ve şehir içi toplu taşıma ibareleri Anayasa Mahkemesinin iptal kararıyla metinden çıkmıştır; bu alanlarda yasak artık yoktur.
  - soru: |
      Cumhurbaşkanının kanuni grevi erteleyebilmesi için grevin nasıl bir nitelik taşıması gerekir ve erteleme süresi nedir?
    siklar:
      - "Genel sağlığı veya millî güvenliği bozucu nitelikte olmalı; süre altmış gündür."
      - "Ekonomik istikrarı bozucu olmalı; süre doksan gündür."
      - "Kamu düzenini bozucu olmalı; süre otuz gündür."
      - "Herhangi bir sebep yeter; süre altı iş günüdür."
    dogru: 0
    aciklama: |
      STİSK m. 63/1: genel sağlığı veya millî güvenliği bozucu nitelikteki grev veya lokavt altmış gün süreyle ertelenebilir.
  - soru: |
      Grev sonunda imzalanan protokolde "grev günleri kıdemden sayılır ve işçilere ücret ödenir" denmiştir. Bu hüküm hakkında hangisi doğrudur?
    siklar:
      - "Geçersizdir; STİSK m. 67/3 aksine hüküm konulmasına izin vermez."
      - "Geçerlidir, çünkü işçi lehinedir."
      - "Yalnız ücret kısmı geçersizdir."
      - "Yalnız kıdem kısmı geçersizdir."
    dogru: 0
    aciklama: |
      STİSK m. 67/3'e göre askı süresi için ücret ve sosyal yardım ödenemez, süre kıdem hesabında dikkate alınmaz ve TİS ile iş sözleşmesine bunların aksine hüküm konulamaz. İşçi lehine olması sonucu değiştirmez.
  - soru: |
      Grev sırasında haftada 15 saat kısmi süreli çalışan işçi Ali, başka bir işverende haftada 25 saat çalışmaya başlamıştır. Kanuni haftalık çalışma süresi 45 saattir. İşverenin fesih hakkı bakımından hangisi doğrudur?
    siklar:
      - "Toplam süre 45 saati aşmadığından haklı fesih sebebi oluşmaz."
      - "Başka işverende çalıştığı için işveren sözleşmeyi her hâlde haklı nedenle feshedebilir."
      - "Askıdaki işçi hiçbir koşulda başka işverende çalışamaz."
      - "Ali, grevci olduğu için işverenin onayını almak zorundadır."
    dogru: 0
    aciklama: |
      STİSK m. 68/3: askıdaki işçi başka işverende çalışamaz; ancak kısmi süreli işçi kanuni haftalık çalışma süresini tamamlayacak süreyi aşmamak üzere çalışabilir. 15 + 25 = 40 saat, 45 saati aşmaz.
  - soru: |
      Grev sırasında teknik zorunluluk nedeniyle çalışan nöbetçi işçi Hasan kendi isteğiyle işten ayrılmıştır. İşverenin yerine yeni işçi almasıyla ilgili hangisi doğrudur?
    siklar:
      - "Yeni işçi alınabilir; bu, STİSK m. 68/1'deki istisnadır."
      - "Grev bitene kadar işçi alınamaz."
      - "Yalnızca greve katılan işçilerden biri çağrılarak çalıştırılabilir."
      - "Yeni işçi alması halinde grev kanun dışı sayılır."
    dogru: 0
    aciklama: |
      STİSK m. 68/1'e göre greve katılamayacak işçilerden ölen, kendi isteğiyle ayrılan veya haklı nedenle çıkarılanların yerine yeni işçi alınabilir. Aksine yasak, askıdaki işçilerin yerine işçi almaktır.
  - soru: |
      Sendika, yetki başvurusu tarihinde 100 üyesi olan işyerinde grev yapmaktadır. Daha sonra üyeliklerinden ayrılanlarla üye sayısı 20'ye düşmüştür. Hangisi doğrudur?
    siklar:
      - "Dörtte üçten fazla üye ayrıldığından ilgililerden biri grevin sona erdirilmesi için mahkemeye başvurabilir."
      - "Grev kendiliğinden sona erer."
      - "Üye kaybı grevi etkilemez."
      - "Yalnızca işveren başvurabilir ve mahkeme zorunlu olarak onaylar."
    dogru: 0
    aciklama: |
      STİSK m. 75/6: yetki başvurusu tarihindeki üyelerin dörtte üçünün ayrıldığı tespit edilirse ilgililerden biri grevin sona erdirilmesi için mahkemeye başvurabilir. 100'ün 80'i ayrılmıştır; grev kendiliğinden bitmez, mahkemeye başvurulur.
olaylar:
  - olay: |
      X Plastik A.Ş.'de yetkili Plastik-İş sendikası ile işveren arasındaki toplu görüşme, 60 günlük süre sonunda anlaşma olmaksızın 5 Mart'ta bitmiştir. Sendika uyuşmazlığı 8 Mart'ta, işveren ise hiçbir bildirimde bulunmamıştır. Görevli makam arabulucu atamış, arabulucu 15 günlük süre sonunda anlaşma sağlayamayınca tutanağı düzenlemiştir. Tutanak 1 Nisan'da taraflara tebliğ edilmiştir.

      Sendika 25 Mayıs'ta grev kararı almış ve uygulama tarihini 10 Haziran olarak karşı tarafa bildirmiştir. 200 işçili işyerinde grev ilanından sonra 55 işçi altı iş günü içinde oylama istemiş; oylamaya katılan 140 işçiden 80'i greve karşı oy kullanmıştır. İşveren, bunun üzerine ilk gün kendi kararıyla sadece üretim bölümünü kapatmıştır. Greve katılmayan teknik personelden iki nöbetçi işçi ayrılmış, işveren yerlerine yenilerini almıştır.

      1. Sendikanın yetkisi bildirim ve grev kararı bakımından ayakta mıdır?
      2. Grev oylamasının sonucu nedir ve sendikanın önündeki yol nedir?
      3. İşverenin üretim bölümünü kapatması lokavt sayılır mı?
      4. Nöbetçi işçilerin yerine işçi alınabilir mi?
