      - {tespit: "Sendikanın YHK'ya altı iş günü içinde başvurma yükümü", puan: 15, madde: "STİSK m. 51"}
      - {tespit: "Kısmi kapatmanın lokavt sayılmaması ve lokavt şartları", puan: 10, madde: "STİSK m. 59"}
      - {tespit: "Nöbetçi işçilerin yerine yeni işçi alınabilmesi", puan: 10, madde: "STİSK m. 68"}
    cozum: |
      **Nitelendirme:** Olay, toplu iş uyuşmazlığında bildirim, resmî arabuluculuk, grev kararı, grev oylaması ve lokavt kavramlarını birlikte sorar.

      **Hukuki sorunlar:** (1) Bildirim ve grev kararı süreleri uygun mu? (2) Oylama sonucu ve sonrası. (3) Kısmi kapatmanın hukuki niteliği. (4) Nöbetçi işçi yerine işçi alma.

      **İlgili hükümler:** STİSK m. 49/1, m. 50, m. 51/1, m. 59/1-2, m. 60/1, m. 61/1-3, m. 68/1.

      **Değerlendirme:** Anlaşmasız sona eren görüşmede taraflardan biri uyuşmazlığı altı iş günü içinde bildirmelidir (STİSK m. 49/1). Süre 5 Mart'tan işler; sendikanın 8 Mart'taki bildirimi süre içindedir. Sendikanın bildirimi yeterlidir, işverenin ayrıca bildirmesi gerekmez. Tutanağın tebliği 1 Nisan olduğuna göre grev kararı altmış gün içinde, yani en geç 31 Mayıs'a kadar alınabilir; 25 Mayıs'taki karar ve 10 Haziran uygulama tarihi bu süre ve altı iş günü önceden bildirim kuralına uygundur (STİSK m. 60/1). Bildirimde yeterli süre bırakıldığı için yetki bu yönden düşmemiştir. Grev oylamasında 200 işçinin dörtte biri 50'dir; 55 işçi başvurduğundan oylama yapılır (STİSK m. 61/1). Oylamaya katılan 140 işçiden 80'i, yani salt çoğunluk, grevin yapılmamasından yana olduğundan grev uygulanamaz (STİSK m. 61/3). Sendika, kesinleşmeden itibaren altı iş günü içinde YHK'ya başvurmalıdır; aksi hâlde yetkisi düşer (STİSK m. 51/1, m. 61/3). Başvurursa YHK kararı kesindir ve TİS hükmündedir (STİSK m. 51/2).

      İşverenin yalnızca üretim bölümünü kapatması, faaliyetin tamamen durmasına yol açmadığından lokavt tanımına girmez (STİSK m. 59/1); ayrıca işçilerin topluca işten uzaklaştırıldığı da söylenemez. Sendikanın grev kararı bulunduğundan lokavtın ön şartı (STİSK m. 59/2) var görünse de, tam kapatma olmadığı için kanuni lokavttan söz edilemez. İşverenin kapatması bu nedenle işçilerin ücret ve diğer haklarını ortadan kaldırmaz. Teknik zorunluluk nedeniyle çalışan nöbetçi işçilerden ayrılanların yerine yeni işçi alınabilir (STİSK m. 68/1; ayrıca STİSK m. 65/5).

      **Sonuç:** Bildirim ve grev kararı süreleri usulüne uygundur. Oylama sonucu grev uygulanamaz; sendika altı iş günü içinde YHK'ya başvurmazsa yetkisi düşer. Üretim bölümünün kapatılması lokavt değildir. Nöbetçi işçilerin yerine işçi alınabilir.
  - olay: |
      Y Tekstil A.Ş.'de sendikanın aldığı kanuni grev, 3 Eylül'de başlamıştır. Grev sırasında şu olaylar yaşanmıştır:

      - İşçi Ahmet, greve katılmış ve grev boyunca ücret almamıştır. Grev bitiminde Ahmet, "grev süresinin kıdemden sayılması" için işverenle bir protokol imzalatmıştır.
      - Tam süreli işçi Mehmet, grev sürerken başka bir fabrikada tam zamanlı çalışmaya başlamıştır.
      - İşveren, greve katılan 30 işçinin yerine bir temizlik şirketinden geçici işçi çalıştırmıştır.
      - Bir grup işçi, grev kararı alınmadığı hâlde kendi aralarında anlaşarak iki gün işi bırakmıştır.

      1. Ahmet'in iş sözleşmesi grev boyunca nasıl bir duruma girmiştir ve protokolün geçerliliği nedir?
      2. Mehmet'in durumu ve işverenin hakkı nedir?
      3. İşverenin geçici işçi çalıştırması hukuka uygun mu?
      4. İki günlük iş bırakma bakımından işverenin hakkı nedir?
    olcut:
      - {tespit: "Kanuni grevde iş sözleşmesinin askıda kalması ve ücretin ödenememesi", puan: 20, madde: "STİSK m. 67"}
      - {tespit: "Kıdem süresine sayılma hükmünün geçersizliği", puan: 20, madde: "STİSK m. 67"}
      - {tespit: "Askıdaki işçinin başka işverende çalışamaması ve haklı fesih", puan: 20, madde: "STİSK m. 68"}
      - {tespit: "Grevci yerine geçici işçi çalıştırma yasağı", puan: 20, madde: "STİSK m. 68"}
      - {tespit: "Kanun dışı grevde işverenin haklı fesih hakkı", puan: 20, madde: "STİSK m. 70"}
    cozum: |
      **Nitelendirme:** Olay, kanuni grevin iş sözleşmelerine etkisini, işçi alma ve başka işe girme yasağını ve kanun dışı grevin sonuçlarını sorar.

      **Hukuki sorunlar:** (1) Askı ve kıdem. (2) Başka işverende çalışma. (3) İşçi alma yasağı. (4) Kanun dışı iş bırakma.

      **İlgili hükümler:** STİSK m. 58, m. 66/2, m. 67/1-3, m. 68/1-3, m. 70/1.

      **Değerlendirme:** Kanuni greve katılan işçinin iş sözleşmesi grev süresince askıda kalır (STİSK m. 67/1). Askı süresi için işverence ücret ve sosyal yardım ödenemez, süre kıdem tazminatı hesabında dikkate alınmaz; TİS veya iş sözleşmesiyle aksi kararlaştırılamaz (STİSK m. 67/3). Bu nedenle Ahmet'in aldığı protokol hükmü, grev süresinin kıdemden sayılması bakımından geçersizdir. Grev nedeniyle iş sözleşmesi feshedilemez de; Ahmet'in greve katılması tek başına fesih sebebi olamaz (STİSK m. 66/2).

      Askıdaki işçi, grev süresince başka bir işverenin yanında çalışamaz; çalışırsa işveren sözleşmeyi haklı nedenle feshedebilir (STİSK m. 68/3). Mehmet tam süreli çalıştığı için kısmi süreli işçilere tanınan istisnadan yararlanamaz; işverenin haklı fesih hakkı doğmuştur.

      İşveren, sözleşmeleri askıda kalan grevci işçilerin yerine sürekli ya da geçici olarak başka işçi alamaz, başkalarını çalıştıramaz (STİSK m. 68/1). Temizlik şirketinden geçici işçi çalıştırılması da bu yasağın kapsamındadır; sendikanın yazılı başvurusu hâlinde görevli makam bunu denetler. Greve katılmayanlar ise ancak kendi işlerinde çalıştırılabilir, grevcilerin işleri onlara yaptırılamaz (STİSK m. 68/2).

      Grev kararı alınmadığı hâlde işçilerin kendi aralarında anlaşıp işi bırakması, kanuni grev şartları gerçekleşmediğinden kanun dışı grevdir (STİSK m. 58/3). İşveren, greve katılan işçilerin sözleşmelerini haklı nedenle feshedebilir (STİSK m. 70/1); uğradığı zararı bu grev herhangi bir kuruluşça kararlaştırılmamışsa katılan işçiler karşılar (STİSK m. 70/2). Taraflar bu konuda ayrıca tespit davası da açabilir (STİSK m. 71).

      **Sonuç:** Ahmet'in sözleşmesi askıdadır, kıdemden sayma protokolü geçersizdir. Mehmet'in sözleşmesi haklı nedenle feshedilebilir. Geçici işçi çalıştırma yasağa aykırıdır. İki günlük iş bırakma kanun dışı greve girer ve katılanların sözleşmeleri haklı nedenle feshedilebilir.
kartlar:
  - on: "Uyuşmazlığın görevli makama bildirilme süresi?"
    arka: "Altı iş günü; bildirilmezse işçi sendikasının yetkisi düşer (STİSK m. 49/1)."
  - on: "Resmî arabulucunun görev süresi?"
    arka: "On beş gün; tarafların anlaşmasıyla en çok altı iş günü uzatılabilir (STİSK m. 50/3)."
  - on: "Grev kararı ne zamana kadar alınır, ne zaman uygulanır?"
    arka: "Tutanağın tebliğinden itibaren 60 gün içinde alınır; karşı tarafa altı iş günü önceden bildirilen tarihte uygulanır (STİSK m. 60/1)."
  - on: "Kanuni lokavtın temel şartı nedir?"
    arka: "İşçi sendikasının grev kararı almış olması; saldırı lokavtı yoktur (STİSK m. 59/2)."
  - on: "Grev oylaması nasıl istenir, nasıl sonuçlanır?"
    arka: "İlan tarihindeki işçilerin en az 1/4'ü altı iş günü içinde ister; oylamaya katılanların salt çoğunluğu ret derse grev uygulanamaz (STİSK m. 61)."
  - on: "YHK kararlarının niteliği?"
    arka: "Kesindir ve toplu iş sözleşmesi hükmündedir (STİSK m. 51/2)."
  - on: "Grev ve lokavtın yasak olduğu işlerden dört örnek?"
    arka: "Can-mal kurtarma, cenaze ve mezarlık, su-elektrik-doğal gaz-petrol-petrokimya, kamu itfaiyesi ve hastaneler (STİSK m. 62/1). Bankacılık ve şehir içi toplu taşıma yasağı AYM iptaliyle kalkmıştır."
  - on: "Cumhurbaşkanı grevi ne zaman, ne kadar erteleyebilir?"
    arka: "Genel sağlığı veya millî güvenliği bozucu nitelikteyse altmış gün (STİSK m. 63/1)."
  - on: "Kanuni grevde iş sözleşmesine ne olur?"
    arka: "Askıda kalır; ücret ve sosyal yardım ödenmez, süre kıdemde sayılmaz, aksi TİS ile kararlaştırılamaz (STİSK m. 67)."
  - on: "Askıdaki işçi başka işverende çalışabilir mi?"
    arka: "Hayır; çalışırsa haklı fesih olur. Kısmi süreli işçi kanuni haftalık süreyi aşmamak kaydıyla çalışabilir (STİSK m. 68/3)."
  - on: "Kanun dışı lokavtta işçi ne yapabilir?"
    arka: "Sözleşmeyi haklı nedenle feshedebilir; işveren lokavt süresine ilişkin bütün hakları iş karşılığı olmaksızın öder ve zararı tazmin eder (STİSK m. 70/3)."
  - on: "Grevin 3/4 üye kaybıyla sona erdirilmesi?"
    arka: "Yetki başvurusu tarihindeki üyelerin dörtte üçü ayrılmışsa ilgililerden biri mahkemeden grevin sona erdirilmesini ister (STİSK m. 75/6)."
