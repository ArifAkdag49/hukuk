ozet: |
  - **Eşit davranma (İK m. 5):** İş ilişkisinde dil, ırk, renk, cinsiyet, engellilik, siyasal düşünce, felsefî inanç, din ve mezhep ve benzeri sebeplere dayalı ayrım yapılamaz (m. 5/1). Esaslı sebep olmadıkça kısmî süreli ve belirli süreli çalışan işçiye farklı işlem yapılamaz (m. 5/2). Cinsiyet veya gebelik nedeniyle, sözleşmenin yapılmasından sona ermesine kadar her aşamada doğrudan ya da dolaylı farklı işlem yasaktır; eşit değerde işe eşit ücret esastır (m. 5/3-5).
  - **Yaptırım (İK m. 5/6):** Dört aya kadar ücret tutarında uygun bir tazminat ve yoksun bırakılan haklar. Sendikal ayrımcılıkta özel hüküm olan sendikal tazminat (STİSK m. 25) devreye girer.
  - **İspat (İK m. 5/7):** Yük kural olarak işçidedir; işçi ihlal ihtimalini güçlü biçimde gösteren bir durum ortaya koyarsa işveren ihlalin bulunmadığını ispatlar.
  - **İşyeri devri (İK m. 6):** Hukukî bir işleme dayanan devirde, devir tarihinde mevcut iş sözleşmeleri bütün hak ve borçlarıyla kendiliğinden devralana geçer; işçinin rızası aranmaz. Kıdeme bağlı haklarda devreden yanındaki başlangıç tarihi esastır.
  - **Birlikte sorumluluk:** Devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan birlikte sorumludur; devredenin sorumluluğu devir tarihinden itibaren iki yılla sınırlıdır (m. 6/3).
  - **Fesih yasağı ve istisnalar:** Sırf devir nedeniyle fesih yapılamaz, devir işçi için haklı sebep de sayılmaz; işletme gerekleri ve haklı nedenle fesih saklıdır (m. 6/5). İflasla tasfiyede m. 6 uygulanmaz (m. 6/6).
  - **Geçici iş ilişkisi (İK m. 7):** İki yol vardır: özel istihdam bürosu (ÖİB) aracılığıyla ve holding ya da aynı şirketler topluluğu içinde görevlendirme.
  - **ÖİB yolu:** Yalnız sayılan yedi hâlde kurulur; süre bentlere göre askı hâlinin devamı, süresiz ya da en fazla dört ay (iki yenilemeyle toplam sekiz ay, (g) bendinde yenileme yok). Aynı iş için altı ay geçmeden yeniden geçici işçi çalıştırılamaz. Süre aşılırsa işverenle işçi arasında belirsiz süreli sözleşme kurulmuş sayılır.
  - **Holding yolu:** Devir sırasında yazılı rıza gerekir; altı ayı geçmemek üzere kurulur, en fazla iki defa yenilenebilir.
  - 📌 İK m. 74 değişikliği (22.4.2026): doğum izni uzadığı için İK m. 7/2-a kapsamında "askı hâlinin devamı süresince" kurulan geçici iş ilişkisi de buna paralel sürebilir.
anlatim: |
  ## 1. Üç kurum, tek mantık: işçinin işini ve hakkını korumak
  İşveren yönetim hakkına sahiptir; ama İş Kanunu bu hakkın üç noktada sınırlandığını söyler. Birincisi işçiler arasında **ayrım yapılamaması** (İK m. 5), ikincisi işyeri el değiştirse bile **iş sözleşmelerinin sürmesi** (İK m. 6), üçüncüsü işçinin başka bir işverenin yanında **geçici olarak çalıştırılmasının sıkı şartlara bağlanması** (İK m. 7). Hepsinde amaç aynıdır: işçinin sözleşmesi, kıdemi ve ücreti işverenin tek taraflı tercihlerine kurban gitmesin.

  ## 2. Eşit davranma ilkesi ve ayrımcılık yasağı (İK m. 5)
  ### Dört katman
  İK m. 5 tek bir yasak gibi görünse de dört ayrı kural içerir. Bunları ayırmak sınavda çok işe yarar.

  | Fıkra | Konu |
  |---|---|
  | m. 5/1 | Sayılan sebeplere dayalı ayrım yasağı |
  | m. 5/2 | Kısmî süreli ve belirli süreli işçi |
  | m. 5/3-5 | Cinsiyet, gebelik, eşit ücret |
  | m. 5/6-7 | Tazminat ve ispat |

  **Birinci fıkra:** İş ilişkisinde dil, ırk, renk, cinsiyet, engellilik, siyasal düşünce, felsefî inanç, din ve mezhep ve "benzeri sebeplere" dayalı ayrım yapılamaz. Listenin sonundaki "benzeri sebepler" ifadesi, sayımın örnekleme olduğunu gösterir. Engellilik 6518 sayılı Kanunla listeye eklenmiştir.

  **İkinci fıkra:** İşveren, **esaslı sebepler olmadıkça** tam süreli çalışan işçi karşısında kısmî süreli çalışan işçiye, belirsiz süreli çalışan işçi karşısında belirli süreli çalışan işçiye farklı işlem yapamaz. Kısmî süreli çalışanın ücret ve paraya ilişkin bölünebilir menfaatleri çalıştığı süreyle orantılı ödenir (İK m. 13/2). Yani yarım gün çalışan işçinin yemek yardımı tam gün çalışanın yarısı olabilir; ama kısmî süreli olduğu için ikramiyeden tümüyle dışlanamaz.

  > **Örnek:** X Ltd. Şti., tam süreli işçilere ayda iki maaş tutarında ikramiye verirken yarım gün çalışan Ayşe'ye hiç ikramiye vermiyor. Ayşe'nin kısmî süreli olması ayrımı haklı kılan esaslı bir sebep değildir; en azından çalışma süresiyle orantılı ikramiye ödenmesi gerekir.

  **Üçüncü fıkra:** İşveren, biyolojik veya işin niteliğine ilişkin sebepler zorunlu kılmadıkça, bir işçiye iş sözleşmesinin **yapılmasında, şartlarının oluşturulmasında, uygulanmasında ve sona ermesinde** cinsiyet veya gebelik nedeniyle doğrudan ya da dolaylı farklı işlem yapamaz. Sayımın başında "yapılmasında" ifadesi bulunduğundan işe alım aşaması da yasağın içindedir.

  **Dördüncü ve beşinci fıkralar:** Aynı veya eşit değerde bir iş için cinsiyet nedeniyle daha düşük ücret kararlaştırılamaz (m. 5/4). Kadın işçiye uygulanan özel koruyucu hükümler (örneğin gece çalıştırma sınırlamaları) daha düşük ücreti haklı göstermez (m. 5/5).

  > ⚠️ **Sınavda dikkat:** "Doğrudan" ayrım, cinsiyeti açıkça ölçüt yapmaktır ("kadınlara düşük ücret"). "Dolaylı" ayrım, görünüşte tarafsız bir ölçütün fiilen bir cinsiyeti dezavantajlı kılmasıdır. Her ikisi de m. 5/3 kapsamındadır.

  ## 3. Ayrımcılığın yaptırımı ve ispat yükü
  İK m. 5/6'ya göre ihlal hâlinde işçi **dört aya kadar ücreti tutarında uygun bir tazminat** ile **yoksun bırakıldığı hakları** talep edebilir. Dört ay üst sınırdır; hâkim "uygun" miktarı belirler. Tazminat, iş sözleşmesinin feshine bağlı değildir: iş ilişkisi sürerken yapılan ücret, prim ya da terfi ayrımı da dava konusu olur. Hükmün sonundaki saklı tutma, sendikal ayrımcılık içindir: sendikal nedenle fesihte işçi, STİSK m. 25'e göre en az bir yıllık ücret tutarında **sendikal tazminat** ister. İK m. 5/6 hâlâ mülga 2821 sayılı Kanunun 31. maddesine gönderme yapar; bugünkü karşılığı STİSK m. 25'tir.

  > **Örnek:** Ali ile Zeynep aynı depoda aynı işi yapıyor. Zeynep'in ücreti cinsiyeti nedeniyle daha düşük belirlenmiş. Zeynep sözleşmesini sürdürerek hem dört aya kadar ücreti tutarında tazminatı hem de aradaki ücret farkını (yoksun bırakıldığı hakkı) isteyebilir.

  **İspat (İK m. 5/7):** Genel kural, işverenin kurala aykırı davrandığını **işçinin** ispat etmesidir. Ancak işçi ihlalin varlığı ihtimalini güçlü biçimde gösteren bir durum ortaya koyarsa yük yer değiştirir; artık işveren ihlalin bulunmadığını ispatlamak zorundadır. Bu, tam bir ispat yükü tersine çevirmesi değil, "güçlü emare" şartına bağlı **kolaylaştırılmış ispattır**. Madde, işe iade davasındaki özel ispat kuralını (İK m. 20) saklı tutar: orada geçerli sebebi ispat yükü işverendedir.

  > 💡 **Püf nokta:** Ayrımcılık tazminatı = en çok 4 ay ücret. Sendikal tazminat = en az 1 yıl ücret. Birini görünce diğerini ezberden karıştırma.

  ## 4. İşyerinin veya bir bölümünün devri (İK m. 6)
  ### 4.1. Devir kavramı ve şartları
  İK m. 6/1: İşyeri veya işyerinin bir bölümü **hukukî bir işleme dayalı olarak** başka birine devredildiğinde, devir tarihinde mevcut iş sözleşmeleri bütün hak ve borçlarıyla devralana geçer. İki şart önemlidir:
  1. **Hukukî işlem:** Satış, kira, devir sözleşmesi gibi bir işlem olmalıdır. Hukukî işlem sayılabilecek hâller geniştir; kanun yoluyla yapılan devirler ayrıca özel kurallara bağlı olabilir.
  2. **İşyerinin kimliğini koruyarak geçmesi:** Yargıtay Hukuk Genel Kurulu, işyerini oluşturan ekonomik birliğin kimliğini koruyarak devredilmesini arar. Sırf birkaç işçinin ya da bir iş sözleşmesinin başka işverene geçmesi işyeri devri değildir.

  Sözleşmeler **işçinin rızası aranmadan, kendiliğinden** geçer. Bu, işyeri devri ile **iş sözleşmesinin devri** arasındaki ana farktır: TBK m. 429'a göre sözleşme yalnızca işçinin **yazılı rızasıyla** başka işverene devredilebilir.

  | Kurum | İşçinin rızası |
  |---|---|
  | İşyeri devri (İK m. 6, TBK m. 428) | Aranmaz |
  | İş sözleşmesinin devri (TBK m. 429) | Yazılı rıza şart |
  | Geçici iş ilişkisi, holding (İK m. 7/15) | Yazılı rıza şart |

  ### 4.2. Kıdemin bütünlüğü
  Devralan işveren, işçinin hizmet süresinin esas alındığı haklarda, işçinin **devreden işveren yanında işe başladığı tarihe** göre işlem yapmakla yükümlüdür (m. 6/2). Kıdem tazminatı, ihbar süresi ve yıllık izin süresi bu kapsamdadır. 1475 sayılı Kanun m. 14 de devirde kıdemin toplam süre üzerinden hesaplanacağını söyler.

  > **Örnek:** Mehmet 2018'den beri A Anonim Şirketi'nde çalışıyor. İşyeri 2024'te B Anonim Şirketi'ne devrediliyor. B yanında yıllık izin hakkı ve ihbar süresi hesaplanırken Mehmet'in 2018 başlangıcı esas alınır; çalışma 2024'te baştan başlamış sayılmaz.

  ### 4.3. Birlikte sorumluluk ve iki yıl
  İK m. 6/3: Devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan işveren **birlikte sorumludur**. Ancak devreden işverenin sorumluluğu **devir tarihinden itibaren iki yıl** ile sınırlıdır. Devralan için böyle bir süre sınırı yoktur.

  > **Örnek:** Ayşe'nin Ocak ve Şubat aylarına ait ücreti ödenmemiştir. İşyeri 1 Mart 2024'te devredilmiştir. İki yıl 1 Mart 2026'da dolar. Ayşe davayı Nisan 2026'da açarsa devreden işverenin bu borçtan sorumluluğu sona ermiş olur; devralan ise borçtan sorumlu kalır.

  > ⚠️ **Sınavda dikkat:** Kanun "devir tarihinde ödenmesi gereken" borçlardan söz eder. Yıllık izin ücreti ile ihbar tazminatı fesih ile doğar (İK m. 59, İK m. 17). Devirden sonra devralan işverenin yaptığı fesihle doğan bu alacaklar devir tarihinde doğmuş borç değildir; bu yüzden birlikte sorumluluk kuralı bunlara uygulanmaz ve sorumlu devralandır. Hukuk Genel Kurulu, yıllık izin ücretinin ancak sözleşmenin sona ermesiyle doğduğunu, devir sırasında henüz doğmuş bir borç bulunmadığını açıkça vurgulamıştır.

  **Kıdem tazminatı** için ayrıca 1475 sayılı Kanun m. 14 vardır: devreden işverenin sorumluluğu, işçiyi çalıştırdığı süre ve devir esnasındaki ücret seviyesiyle sınırlıdır. İki yıl kuralıyla etkileşimi uygulamada ve doktrinde tartışmalı olduğundan sınav kurgusuna bu ayrıntıyı taşımamak güvenlidir.

  ### 4.4. Birleşme ve tür değiştirme
  Tüzel kişiliğin **birleşme veya katılma ya da türünün değişmesiyle sona ermesi** hâlinde birlikte sorumluluk hükümleri uygulanmaz (m. 6/4). Çünkü devreden artık yoktur; malvarlığı bütün hâlinde devralana geçer (TTK m. 153: tescil anında devrolunan şirketin bütün aktif ve pasifi kendiliğinden devralan şirkete geçer). Bölünmede ise TTK m. 178 işçiye itiraz hakkı verir: işçi itiraz ederse sözleşme kanuni işten çıkarma süresinin sonunda sona erer. İşyeri devri hükmü ise böyle bir itiraz hakkı düzenlemez.

  > **Örnek:** İşçi, fesihten sonra, devrolunan şirketin devralan şirketle birleşmesi üzerine alacağını devralan şirketten istemiştir. Yargıtay'a göre birleşme anında artık yürürlükte bir iş sözleşmesi yoksa İK m. 6 yerine TTK'nın külli halefiyet hükümleri (TTK m. 153) uygulanır ve devralan şirket devrolunanın borçlarından sorumludur.

  ### 4.5. Devir nedeniyle fesih yasağı ve iflas istisnası
  Devreden veya devralan işveren iş sözleşmesini **sırf devir nedeniyle** feshedemez; devir işçi için de haklı fesih sebebi sayılmaz (m. 6/5). Ama ekonomik ve teknolojik sebeplerin ya da iş organizasyonu değişikliğinin gerekli kıldığı fesih hakkı ve tarafların haklı nedenle derhal fesih hakları saklıdır. Yani devir fesih için tek başına yeterli sebep değil, ama devir sırasında gerçek bir işletme gereği ortaya çıkarsa fesih mümkündür.

  **İflas istisnası (m. 6/6):** Bu hükümler, iflas dolayısıyla malvarlığının **tasfiyesi sonucu** yapılan devirlerde uygulanmaz.

  > 💡 **Püf nokta:** İK m. 6 şu sırayla ezberlenir: geçiş (1) – kıdem (2) – birlikte sorumluluk ve 2 yıl (3) – birleşme (4) – fesih yasağı (5) – iflas (6).

  ## 5. Geçici iş ilişkisi (İK m. 7)
  ### 5.1. Kavram ve iki kurulum yolu
  **Geçici iş ilişkisi**, işçinin sözleşmesi bir işverenle sürerken iş görme edimini geçici süreyle başka işverene karşı yerine getirdiği üçlü ilişkidir. 6715 sayılı Kanunla yeniden düzenlenen İK m. 7/1'e göre yalnız iki yolla kurulabilir:
  - **Özel istihdam bürosu (ÖİB) aracılığıyla** (Türkiye İş Kurumunca izin verilen büro),
  - **Holding bünyesi içinde veya aynı şirketler topluluğuna bağlı başka bir işyerinde görevlendirme** yoluyla.

  Bu iki yol dışında "ödünç işçi" çalıştırmak hukuka uygun değildir.

  ### 5.2. ÖİB aracılığıyla geçici iş ilişkisi
  ÖİB, geçici işçi çalıştıran işverenle yazılı **geçici işçi sağlama sözleşmesi** yapar; işçisiyle de yazılı iş sözleşmesi yapar. Geçici iş ilişkisinde **işveren ÖİB'dir** (m. 7/11). İlişki yalnızca m. 7/2'deki yedi hâlde kurulabilir:

  | Bent | Hâl ve süre |
  |---|---|
  | a | İK m. 13/5, İK m. 74, askerlik, diğer askı hâlleri: hâlin devamı süresince |
  | b, c | Mevsimlik tarım, ev hizmetleri: süre sınırı yok |
  | d, e, f | Aralıklı işler, acil İSG işleri/zorlayıcı nedenler, öngörülemeyen kapasite artışı: en fazla 4 ay |
  | g | Dönemsellik arz eden iş artışı (mevsimlik işler hariç): en fazla 4 ay, yenilenemez |

  (d), (e), (f) bentlerinde sözleşme iki defa yenilenebilir ve toplam süre sekiz ayı geçemez. Süre sonunda geçici işçi çalıştıran işveren, **aynı iş için altı ay geçmedikçe** yeniden geçici işçi çalıştıramaz (m. 7/3).

  **Yasaklar (m. 7/4-5, 7/7):**
  - İK m. 29 kapsamında toplu işçi çıkarılan işyerlerinde **sekiz ay** süresince,
  - kamu kurum ve kuruluşlarında,
  - yer altında maden çıkarılan işyerlerinde,
  - grev ve lokavt sırasında (STİSK m. 65 saklı),
  - sözleşmesi feshedilen işçi, fesih tarihinden itibaren **altı ay** geçmeden geçici işçi olarak çalıştırılamaz.

  **Sayısal sınır (m. 7/6):** (f) bendi kapsamında çalıştırılan geçici işçi sayısı işyerindeki işçi sayısının **dörtte birini** geçemez; on ve daha az işçili işyerinde **beş işçiye** kadar geçici iş ilişkisi kurulabilir. Geçici işçi, İK m. 30'daki engelli ve eski hükümlü çalıştırma yükümlülüğünün hesabında ne ÖİB'nin ne de çalıştıran işverenin işçi sayısına dâhil edilir.

  **Ücret güvencesi (m. 7/12):** (f) bendinde bir ayı aşan çalışmalarda çalıştıran işveren her ay ücretlerin ödenip ödenmediğini kontrol eder; ödenmeyen ücret varsa ÖİB'nin alacağından mahsup etmek kaydıyla en çok üç aya kadar ücreti doğrudan işçinin banka hesabına yatırır.

  **Çağrılmama (m. 7/11):** Geçici işçi ile yapılacak sözleşmede, işçinin ne kadar süre işe çağrılmazsa sözleşmeyi haklı nedenle feshedebileceği yazılır; bu süre **üç ayı geçemez**.

  **Süre aşımı yaptırımı (m. 7/13):** Sözleşmede belirtilen süre dolduğu hâlde geçici iş ilişkisi sürerse, geçici işçi çalıştıran işveren ile işçi arasında sözleşmenin sona erme tarihinden itibaren **belirsiz süreli iş sözleşmesi kurulmuş sayılır**. ÖİB ise işçinin ücretinden, gözetme borcundan ve sigorta primlerinden sözleşme süresiyle sınırlı olarak sorumlu kalır.

  > **Örnek:** X Ltd. Şti., tatil sezonundaki geçici iş artışı için (g) bendine göre dört aylığa ÖİB aracılığıyla Zeynep'i çalıştırıyor. Dört ay dolduğu hâlde Zeynep çalışmaya devam ederse X Ltd. Şti. ile Zeynep arasında dört ayın bitiminden itibaren belirsiz süreli iş sözleşmesi kurulmuş sayılır.

  ### 5.3. Holding veya şirketler topluluğu içinde görevlendirme
  İK m. 7/15'e göre işveren, **devir sırasında yazılı rızasını almak suretiyle** işçisini holding bünyesindeki ya da aynı şirketler topluluğuna bağlı başka bir işyerinde geçici olarak çalıştırabilir. İlişki yazılı kurulur, **altı ayı geçmemek üzere** kurulabilir ve **en fazla iki defa yenilenebilir**; yani altışar aylık üç döneme kadar uzayabilir. İşçisini devreden işverenin ücret ödeme yükümlülüğü sürer. Geçici iş ilişkisi kurulan işveren, işçinin kendisinde çalıştığı sürede ödenmeyen ücretinden, işçiyi gözetme borcundan ve sosyal sigorta primlerinden devreden işverenle birlikte sorumludur.

  > ⚠️ **Sınavda dikkat:** ÖİB yolunda süre dört ay ve iki yenilemeyle toplam sekiz ay; holding yolunda altı ay ve iki yenileme. Holding yolunda ayrıca devir sırasında işçinin yazılı rızası şarttır.

  ### 5.4. Yakın tarihli değişiklik
  📌 7578 sayılı Kanunla İK m. 74'te doğum izni süreleri uzatılmıştır (doğumdan sonra 16 hafta, toplam 24 hafta). İK m. 7/2-a, İK m. 74'te belirtilen hâllerde geçici iş ilişkisini "bu hâllerin devamı süresince" kurulabilir saydığından, doğum yapan işçinin yerine alınan geçici işçinin çalışabileceği süre de uzayan izne paralel gider. M. 7'nin kendi metni değişmemiştir.

  ## 6. Denetim şeması
  1. Olayda ayrım var mı? Hangi sebep (m. 5/1 sayımı, benzeri sebep, cinsiyet-gebelik, sözleşme türü)?
  2. İşçi güçlü emare ortaya koymuş mu (m. 5/7)? Yoksa yük işçide.
  3. İşyerinin kimliği korunarak, hukukî işlemle mi geçti (m. 6/1)? Değilse TBK m. 429 ve rıza.
  4. Alacak devirden önce doğmuş mu? Devir tarihinden iki yıl geçti mi (m. 6/3)? Fesihle doğan alacak mı?
  5. Birleşme-bölünme var mı (m. 6/4, TTK m. 178)? İflas tasfiyesi mi (m. 6/6)?
  6. Geçici iş ilişkisi hangi yoldan, hangi bent ve hangi süreyle kurulmuş (m. 7)? Yasak hâl var mı? Süre aşıldı mı?
kritik: |
  - 📌 İK m. 5/6: ayrımcılık tazminatı dört aya kadar ücret tutarındadır ve yoksun bırakılan haklar ayrıca istenir.
  - 📌 İK m. 5/7: ispat yükü kural olarak işçidedir; ihlal ihtimalini güçlü biçimde gösteren durum ortaya konursa işveren ihlalin olmadığını ispatlar.
  - ⚠️ Sendikal nedenle fesihte ayrımcılık tazminatı değil, STİSK m. 25'teki en az bir yıllık ücret tutarındaki sendikal tazminat söz konusudur.
  - 📌 İK m. 5/3, iş sözleşmesinin yapılmasında da cinsiyet ve gebelik nedeniyle farklı işlemi yasaklar; eşit değerde işe eşit ücret (m. 5/4).
  - 📌 İK m. 5/2: esaslı sebep yoksa kısmî süreli ve belirli süreli işçiye farklı işlem yapılamaz.
  - 📌 İK m. 6/1: devirde iş sözleşmeleri kendiliğinden geçer; işçinin rızası aranmaz. İş sözleşmesinin devrinde (TBK m. 429) yazılı rıza şarttır.
  - 📌 İK m. 6/3: devredenin sorumluluğu devir tarihinden itibaren iki yılla sınırlıdır; devralanın sorumluluğu sınırsızdır.
  - ⚠️ Yıllık izin ücreti ve ihbar tazminatı fesihle doğar; devirden sonra devralanın yaptığı fesihte devreden bunlardan sorumlu tutulmaz.
  - 📌 İK m. 6/4: birleşme, katılma, tür değiştirmede birlikte sorumluluk hükümleri uygulanmaz (TTK m. 153 külli halefiyet).
  - 📌 İK m. 6/5: sırf devir nedeniyle fesih yasaktır; işletme gerekleri ve haklı nedenle fesih saklıdır.
  - 📌 İK m. 6/6: iflasla tasfiye sonucu devirde m. 6 uygulanmaz.
  - 📌 İK m. 7/1: geçici iş ilişkisi yalnız ÖİB aracılığıyla veya holding-şirketler topluluğu içinde görevlendirmeyle kurulur.
  - 📌 İK m. 7/3: (d), (e), (f) için en çok dört ay ve iki yenilemeyle toplam sekiz ay; (g) için dört ay, yenileme yok; sonrasında aynı iş için altı ay bekleme.
  - 📌 İK m. 7/15: holding içi geçici devir yazılı rıza ister; altı ay, en fazla iki yenileme.
  - 📌 İK m. 7/13: sürenin aşılması hâlinde belirsiz süreli iş sözleşmesi kurulmuş sayılır.
doktrin: |
  ### Ayrımcılık tazminatı için korunan sebep şart mı?
  Bir yaklaşım, İK m. 5/6'nın yalnız m. 5/1-3'teki ihlalleri yaptırıma bağladığını, bu yüzden korunan bir sebebe dayanmayan "salt farklı uygulama" için dört aya kadar tazminat verilemeyeceğini kabul eder; böyle bir işçi, eşit davranma borcundan doğan ücret ve hak farklarını (yoksun bırakılan hak) ister. Uygulamada Yargıtay 9. Hukuk Dairesi, ayrımcılık tazminatı için ihlalin m. 5'te sayılan sebeplerden birine dayandığının, ya da eşit durumdaki işçilerin keyfî biçimde farklı işlemle karşılaştığının işçi tarafından ortaya konmasını arar. Bunun ayrıntıları kararlarda değişebildiğinden sınavda kurala bağlı kalmak daha güvenlidir.

  ### İşe girişte ayrımcılık ve m. 5/6 tazminatı
  İK m. 5/3 "iş sözleşmesinin yapılmasında" ayrımı yasaklar; m. 5/6 ise "iş ilişkisinde veya sona ermesinde" aykırılıktan söz eder. Bir görüşe göre işe alınmayan aday henüz işçi değildir ve bu nedenle m. 5/6 tazminatı yerine genel hükümlere (sözleşme öncesi kusur, haksız fiil) başvurabilir. Karşı görüş, m. 5/6'nın "yukarıdaki fıkra hükümlerine" gönderme yaptığını, dolayısıyla üçüncü fıkradaki işe alım yasağını da kapsadığını savunur. Konu tartışmalıdır; olaylarda çözüm bu noktaya dayandırılmamalıdır.

  ### Devreden işverenin kıdem tazminatından sorumluluğu
  1475 sayılı Kanun m. 14'te devreden işverenin sorumluluğu çalıştırdığı süre ve devirdeki ücretle sınırlandırılmıştır; İK m. 6/3'teki iki yıllık sınır ise genel hükümdür. İki hükmün nasıl birleşeceği doktrinde ve uygulamada tartışmalıdır. Not alırken m. 6/3 kuralını ve 1475 sayılı Kanun m. 14'teki özel sınırlamayı ayrı ayrı bilmek yeterlidir.

  ### İşyeri devrinde işçinin itiraz hakkı
  İK m. 6 işçiye devire itiraz imkânı tanımaz; sözleşme kendiliğinden geçer. Buna karşılık TTK m. 178, bölünmede işçi itiraz ederse sözleşmenin kanuni işten çıkarma süresinin sonunda sona ereceğini söyler. İşyeri devrinde işçinin geçişe itiraz edip edemeyeceği ve itirazın sonuçları öğretide tartışmalıdır; sınavda kanun metnine göre cevap verilir.
sozluk:
  - terim: Eşit davranma ilkesi
    tanim: "İşverenin işçiler arasında esaslı sebep olmadan ya da korunan sebeplerle ayrım yapmama borcu (İK m. 5)."
  - terim: Ayrımcılık tazminatı
    tanim: "Dört aya kadar ücret tutarındaki uygun tazminat; yoksun bırakılan haklar ayrıca istenir (İK m. 5/6)."
  - terim: Kolaylaştırılmış ispat
    tanim: "İşçi ihlal ihtimalini güçlü biçimde gösterirse ispat yükünün işverene geçmesi (İK m. 5/7)."
  - terim: Doğrudan ve dolaylı ayrım
    tanim: "Doğrudan ayrım cinsiyet ya da gebeliği açıkça ölçüt yapar; dolaylı ayrım görünüşte tarafsız ölçütle fiilen bir grubu dezavantajlı kılar."
  - terim: İşyeri devri
    tanim: "İşyerinin veya bölümünün hukukî işlemle başkasına geçmesi; iş sözleşmeleri kendiliğinden devralana geçer (İK m. 6/1)."
  - terim: İş sözleşmesinin devri
    tanim: "Sözleşmenin işçinin yazılı rızasıyla başka işverene devredilmesi (TBK m. 429)."
  - terim: Müteselsil sorumluluk (birlikte sorumluluk)
    tanim: "Devreden ve devralanın devirden önce doğmuş borçlardan birlikte sorumlu olması; devredenin sorumluluğu iki yılla sınırlıdır (İK m. 6/3)."
  - terim: Külli halefiyet
    tanim: "Birleşmede devrolunan şirketin bütün aktif ve pasifinin kendiliğinden devralan şirkete geçmesi (TTK m. 153)."
  - terim: Geçici iş ilişkisi
    tanim: "İşçinin geçici süreyle başka işverene karşı iş görmesi; ÖİB aracılığıyla ya da holding-şirketler topluluğu içinde kurulur (İK m. 7)."
  - terim: Özel istihdam bürosu (ÖİB)
    tanim: "Türkiye İş Kurumundan izin almış, geçici işçi sağlayan ve geçici iş ilişkisinde işveren sayılan büro (İK m. 7/11)."
  - terim: Geçici işçi sağlama sözleşmesi
    tanim: "ÖİB ile geçici işçi çalıştıran işveren arasındaki yazılı sözleşme; başlangıç, bitiş, işin niteliği ve hizmet bedeli yer alır (İK m. 7/11)."
kararlar:
  - id: "1227168300"
    ozet: |
      Dava dışı bir belediyenin kapatılması üzerine 6360 sayılı Kanunun geçici 1/10 hükmü uyarınca 31.03.2014'te davalı Büyükşehir Belediyesine devredilen işçi, devralan belediyenin 01.03.2014-28.02.2017 yürürlük süreli toplu iş sözleşmesinden yararlandırılmadığını ileri sürerek fark alacaklarını ve ayrımcılık tazminatını istemiştir. İlk derece mahkemesi ayrımcılık tazminatını reddetmiş, bölge adliye mahkemesi davayı kısmen usulden kısmen esastan reddetmiştir. Gerekçeye göre işçinin devir öncesi toplu iş sözleşmesine tabi olması kanundan doğmuş, işçi korunan sebeplerden birine dayalı bir ayrım yapıldığını ispat edememiştir. Yargıtay 9. Hukuk Dairesi bölge adliye mahkemesinin kararını onamıştır. Karar, ayrımcılık tazminatının yalnızca farklı uygulama iddiasıyla değil, ayrımın ispatıyla verilebileceğini ve kanundan doğan farklı uygulamanın eşit davranma ihlali sayılmadığını gösterir.
  - id: "1204227300"
    ozet: |
      Beyin cerrahı olarak çalışan davacı, altı ay ücret alamadığı için sözleşmesini 29.09.2019'da haklı nedenle feshetmiştir. Hastane 23.02.2019'da başka bir şirkete devredilmiş, fesihten sonra bu şirket davalı şirketle devralma yoluyla birleşmiştir. İlk derece ve bölge adliye mahkemeleri davalıyı İK m. 6 uyarınca sorumlu tutmuştur. Yargıtay 9. Hukuk Dairesi, hastane devrinin işyeri devri olduğunu ve devir tarihinde sözleşme sürdüğü için devreden ve devralanın birlikte sorumlu olduğunu belirtmiş; ancak fesihten sonraki birleşmede iş sözleşmesi artık yürürlükte olmadığından davalının sorumluluğunun İK m. 6 değil TTK'nın külli halefiyet hükümlerine (TTK m. 153 ve devamı) dayandığını söyleyerek kararı değişik gerekçeyle onamıştır. Karar, birleşmenin zamanına göre farklı hükmün uygulanacağını gösterir.
  - id: "646422700"
    ozet: |
      Kapatılan 6111 sayılı Kanun kapsamında ihtiyaç fazlası sayılarak başka bir kuruma nakledilen belediye işçisi, kullanmadığı yıllık izin ücretini devreden belediyeden istemiştir. İlk derece mahkemesi davayı kabul etmiş, Özel Daire bozmuş, mahkeme direnmiş ve uyuşmazlık Hukuk Genel Kurulunda görülmüştür. Genel Kurul önce işyeri devri ile iş sözleşmesinin devrini ayırmış: işyeri devrinde sözleşme işçinin rızası aranmadan geçer, iş sözleşmesinin devrinde ise işçinin yazılı rızası gerekir. Sonra yıllık izin ücretinin ancak iş sözleşmesinin sona ermesiyle doğduğunu, sözleşme devam ettiği için henüz doğmuş bir borç bulunmadığını ve devir tarihinde ödenmesi gereken borçlara ilişkin hükmün bu alacağa uygulanamayacağını belirterek direnme kararını bozmuştur.
sorular:
  - soru: |
      İK m. 5/6'ya göre ayrımcılık yasağına aykırı davranılması hâlinde işçinin isteyebileceği tazminat aşağıdakilerden hangisidir?
    siklar:
      - "Dört aya kadar ücreti tutarında uygun bir tazminat"
      - "En az bir yıllık ücreti tutarında tazminat"
      - "Bildirim süresinin üç katı tutarında tazminat"
      - "Dört ila sekiz aylık ücret tutarında tazminat"
    dogru: 0
    aciklama: |
      İK m. 5/6 dört aya kadar ücret tutarında uygun bir tazminat ve yoksun bırakılan hakların talebini öngörür. En az bir yıllık ücret tutarı sendikal tazminattır (STİSK m. 25); bildirim süresinin üç katı İK m. 17'deki kötüniyet tazminatıdır.
  - soru: |
      İK m. 5/7'ye göre eşit davranma borcuna aykırılıkta ispat yükü bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İspat yükü her durumda işverene aittir."
      - "İşçi ihlal ihtimalini güçlü biçimde gösteren bir durum ortaya koyarsa işveren ihlalin bulunmadığını ispat etmekle yükümlü olur."
      - "İspat yükü yalnızca işe iade davasında işçiye geçer."
      - "İşçi ihlali kesin delillerle ispat etmedikçe işveren hiçbir şey ispat etmek zorunda kalmaz."
    dogru: 1
    aciklama: |
      Genel kural işçinin ispatıdır; ancak işçi ihlalin varlığı ihtimalini güçlü biçimde gösteren bir durumu ortaya koyarsa işveren, ihlalin bulunmadığını ispatlamak zorundadır (İK m. 5/7). Bu, kolaylaştırılmış ispattır; yük kendiliğinden işverene geçmez.
  - soru: |
      Aşağıdakilerden hangisi İK m. 5 kapsamındaki yasağa aykırıdır?
    siklar:
      - "İşverenin, aynı işi yapan Ayşe'ye cinsiyeti nedeniyle Ali'den daha düşük ücret kararlaştırması"
      - "İşverenin, yarım gün çalışan işçiye ikramiyeyi çalışma süresiyle orantılı ödemesi"
      - "İşverenin, daha kıdemli işçiye fazladan yıllık izin vermesi"
      - "İşverenin, işi gereği yer altında çalışacak kişi için sağlık şartı araması"
    dogru: 0
    aciklama: |
      Aynı veya eşit değerde iş için cinsiyet nedeniyle daha düşük ücret kararlaştırılamaz (İK m. 5/4). Kısmî süreli işçiye orantılı ödeme kanunun öngördüğü sonuçtur (İK m. 13/2); kıdem farkı cinsiyet gibi korunan bir sebep değildir.
  - soru: |
      İşverenin yalnızca gebe olduğunu öğrendiği için adayı işe almaması hangi fıkra kapsamında yasaklanmıştır?
    siklar:
      - "İK m. 5/2"
      - "İK m. 5/3"
      - "İK m. 5/5"
      - "İK m. 5/7"
    dogru: 1
    aciklama: |
      İK m. 5/3, cinsiyet veya gebelik nedeniyle iş sözleşmesinin yapılmasında, şartlarının oluşturulmasında, uygulanmasında ve sona ermesinde farklı işlemi yasaklar. Tazminat tartışması doktrindedir; yasağın kapsamı tartışmasızdır.
  - soru: |
      Aşağıdakilerden hangisi işyeri devrinin (İK m. 6) bir sonucudur?
    siklar:
      - "Devir tarihinde mevcut iş sözleşmeleri, işçinin yazılı rızası alınmadıkça devralana geçmez."
      - "Devir tarihinde mevcut iş sözleşmeleri bütün hak ve borçlarıyla devralana geçer."
      - "Devralan işveren, işçinin hizmet süresini devir tarihinden başlatır."
      - "Devir işçiye derhal fesih hakkı verir."
    dogru: 1
    aciklama: |
      İK m. 6/1'e göre sözleşmeler bütün hak ve borçlarıyla devralana kendiliğinden geçer. Yazılı rıza TBK m. 429'daki iş sözleşmesi devrine özgüdür; kıdem devreden yanındaki başlangıca göre hesaplanır (İK m. 6/2); devir işçi için haklı fesih sebebi sayılmaz (İK m. 6/5).
  - soru: |
      Mehmet'in işyeri 1 Mart 2024'te devredilmiştir. Devirden önce doğmuş ve devir tarihinde ödenmesi gereken fazla çalışma ücretinden devreden işverenin sorumluluğu hangi sürede sona erer?
    siklar:
      - "Devir tarihinden itibaren altı ay"
      - "Devir tarihinden itibaren bir yıl"
      - "Devir tarihinden itibaren iki yıl"
      - "Devralanın sorumluluğuyla birlikte süresiz"
    dogru: 2
    aciklama: |
      İK m. 6/3'e göre devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan devreden işverenin sorumluluğu devir tarihinden itibaren iki yılla sınırlıdır; o tarihe göre 1 Mart 2026'da sona erer.
  - soru: |
      İşyeri devredildikten üç ay sonra devralan işveren, Zeynep'in iş sözleşmesini haksız feshetmiştir. Zeynep'in kullanmadığı yıllık izin ücreti bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Devreden de devralanla birlikte iki yıl sorumludur."
      - "Alacak fesihle doğduğundan sorumlu olan devralan işverendir."
      - "Alacak devreden işveren yanında doğduğundan yalnız devreden sorumludur."
      - "Yıllık izin ücreti devirle birlikte sona erer."
    dogru: 1
    aciklama: |
      Yıllık izin ücreti sözleşmenin sona ermesiyle doğar (İK m. 59/1). Devir tarihinde doğmuş bir borç bulunmadığından İK m. 6/3'teki birlikte sorumluluk kuralı uygulanmaz; fesih devralan döneminde olduğu için sorumlu devralandır. Hukuk Genel Kurulu da yıllık izin ücretinin sözleşme sürdükçe doğmadığını belirtmiştir.
  - soru: |
      Devrolunan şirketin, işçinin sözleşmesi sona erdikten sonra devralan şirketle birleştiği bir olayda işçi alacağını devralan şirketten istemektedir. Alacağın dayanağı aşağıdakilerden hangisidir?
    siklar:
      - "İK m. 6/3, çünkü birleşmede de birlikte sorumluluk aranır."
      - "TTK m. 153, çünkü devrolunan şirketin bütün aktif ve pasifi tescil anında devralana geçer."
      - "İK m. 7/13, çünkü belirsiz süreli sözleşme kurulmuş sayılır."
      - "TBK m. 429, çünkü işçinin yazılı rızası alınmıştır."
    dogru: 1
    aciklama: |
      Sözleşme sona erdikten sonraki birleşmede devralan, külli halef olarak devrolunanın borçlarından TTK m. 153 gereği sorumludur. İK m. 6/4 birleşmede birlikte sorumluluk hükümlerini zaten uygulamaz.
  - soru: |
      Aşağıdaki işlemlerden hangisinde İK m. 6'nın devir hükümleri uygulanmaz?
    siklar:
      - "Fabrikanın satış sözleşmesiyle başka bir şirkete devri"
      - "İşyerinin bir bölümünün kira sözleşmesiyle devri"
      - "İşyerinin iflas dolayısıyla malvarlığının tasfiyesi sonucu başkasına devri"
      - "İşyerinin sahibinin türünü değiştirmeden başka bir şirkete devri"
    dogru: 2
    aciklama: |
      İK m. 6/6'ya göre hükümler iflas dolayısıyla malvarlığının tasfiyesi sonucu yapılan devirlerde uygulanmaz. Satış ve kira hukukî işlemdir ve m. 6/1 kapsamındadır.
  - soru: |
      Hangisi özel istihdam bürosu aracılığıyla geçici iş ilişkisinin kurulabileceği hâllerden biri değildir?
    siklar:
      - "İşçinin askerlik hizmeti süresince"
      - "Mevsimlik tarım işlerinde"
      - "Kamu kurum ve kuruluşlarında sürekli işlerde"
      - "Ev hizmetlerinde"
    dogru: 2
    aciklama: |
      Kamu kurum ve kuruluşlarında İK m. 7/2 kapsamında geçici iş ilişkisi kurulamaz (İK m. 7/4). Askerlik, mevsimlik tarım ve ev hizmetleri m. 7/2'de sayılan hâllerdendir.
  - soru: |
      Beyaz Ltd. Şti., üretim kapasitesindeki öngörülemeyen artış nedeniyle (f) bendine göre Ali'yi özel istihdam bürosu aracılığıyla dört aylığa çalıştırmaya başlamıştır. Sözleşme süresi doldu; Ali çalışmaya devam ediyor. Sonuç aşağıdakilerden hangisidir?
    siklar:
      - "Beyaz Ltd. Şti. ile Ali arasında sözleşmenin bitiminden itibaren belirsiz süreli iş sözleşmesi kurulmuş sayılır."
      - "Ali ile özel istihdam bürosu arasındaki sözleşme otomatik olarak belirli süreli yenilenir."
      - "Ali'nin çalışması hukuka aykırı olduğundan hiçbir sözleşme kurulmuş sayılmaz."
      - "Ali, ancak Türkiye İş Kurumuna başvurarak belirsiz süreli sözleşme isteyebilir."
    dogru: 0
    aciklama: |
      Sözleşmede belirtilen süre dolduğu hâlde geçici iş ilişkisi sürerse, geçici işçi çalıştıran işveren ile işçi arasında sözleşmenin sona erme tarihinden itibaren belirsiz süreli iş sözleşmesi kurulmuş sayılır (İK m. 7/13).
  - soru: |
      Kaya Holding bünyesindeki A Şirketi, işçisi Ayşe'yi aynı holdingdeki B Şirketine geçici olarak devretmek istemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Ayşe'nin yazılı rızası alınmalıdır; ilişki altı ayı geçmemek üzere kurulabilir ve en fazla iki defa yenilenebilir."
      - "Ayşe'nin rızası aranmaz; süre sınırı yoktur."
      - "Ayşe'nin sözlü rızası yeterlidir; süre bir yıldır."
      - "Bu devir ancak özel istihdam bürosu aracılığıyla yapılabilir."
    dogru: 0
    aciklama: |
      İK m. 7/15: devir sırasında işçinin yazılı rızası alınmak suretiyle, holding bünyesinde geçici iş ilişkisi kurulabilir; yazılı olarak altı ayı geçmemek üzere kurulur ve en fazla iki defa yenilenebilir. Devreden işverenin ücret borcu sürer.
olaylar:
  - olay: |
      Doğu Gıda A.Ş. (D), Gebze'deki fabrika işyerini 1 Mart 2024 tarihinde bütün aktif ve pasifiyle Batı Gıda A.Ş.'ye (B) satıp devretmiştir. Fabrikada 2020'den beri çalışan Zeynep'in (Z) Ocak ve Şubat 2024 aylarına ait toplam 40.000 TL fazla çalışma ücreti ödenmemiştir. Z devirden sonra B'nin işçisi olarak çalışmaya devam etmiştir.

      10 Nisan 2026'da B, Z'nin hamile olduğunu öğrenmiş ve yalnızca bu nedenle iş sözleşmesini bildirim süresi vermeden feshetmiştir. Z, 20 Nisan 2026'da hem D'ye hem B'ye karşı dava açarak şunları istemektedir: Ocak-Şubat 2024 fazla çalışma ücreti, ihbar tazminatı, kullanılmayan yıllık izin ücreti ve İK m. 5 uyarınca ayrımcılık tazminatı.

      1. D ve B'nin fazla çalışma ücretinden sorumluluğunu değerlendiriniz.
      2. İhbar tazminatı ve yıllık izin ücretinden kim sorumludur?
      3. Z'nin ayrımcılık tazminatı talebini ve miktar sınırını değerlendiriniz.
    olcut:
      - {tespit: "Olayın işyeri devri olarak nitelendirilmesi ve sözleşmelerin kendiliğinden geçişi", puan: 15, madde: "İK m. 6/1"}
      - {tespit: "Devirden önce doğan fazla çalışma ücretinden birlikte sorumluluk", puan: 20, madde: "İK m. 6/3"}
      - {tespit: "Devredenin sorumluluğunun devir tarihinden itibaren iki yılla sınırlı olması ve sürenin dolması", puan: 20, madde: "İK m. 6/3"}
      - {tespit: "İhbar tazminatı ve yıllık izin ücretinin fesihle doğması, sorumlunun devralan olması", puan: 20, madde: "İK m. 59"}
      - {tespit: "Gebelik nedeniyle fesihte ayrımcılık yasağının ihlali", puan: 15, madde: "İK m. 5/3"}
      - {tespit: "Dört aya kadar ücret tutarında tazminat ve yoksun bırakılan haklar", puan: 10, madde: "İK m. 5/6"}
    cozum: |
      **Nitelendirme:** Fabrika işyeri satış sözleşmesiyle, yani hukukî bir işlemle bütün olarak B'ye geçmiştir. Bu bir işyeri devridir; iş sözleşmeleri işçinin rızası aranmadan devralana geçer (İK m. 6/1). Sonradan B'nin yaptığı fesih ise devralan işverenin kendi dönemindeki işlemidir ve ayrı değerlendirilir.

      **Hukuki sorunlar:** (1) Devir öncesi alacaklardan kimin, ne zamana kadar sorumlu olduğu; (2) fesihle doğan alacaklardan kimin sorumlu olduğu; (3) gebelik nedeniyle fesihte ayrımcılık tazminatı.

      **İlgili hükümler:** İK m. 6/1 ve m. 6/3, İK m. 59, İK m. 17, İK m. 5/3 ve m. 5/6.

      **Değerlendirme:** Ocak-Şubat 2024 fazla çalışma ücreti, devirden önce doğmuş ve devir tarihinde ödenmesi gereken bir borçtur. Bu borçtan D ve B birlikte sorumludur; ancak D'nin sorumluluğu devir tarihinden itibaren iki yılla sınırlıdır (İK m. 6/3). İki yıl 1 Mart 2026'da dolmuştur; Z davayı 20 Nisan 2026'da açtığı için D'nin bu kalemden sorumluluğu sona ermiştir. Borçtan B sorumlu kalır, çünkü devralanın sorumluluğu bu süreyle sınırlı değildir.

      İhbar tazminatı (bildirim şartına uyulmadığı için, İK m. 17) ve kullanılmayan yıllık izin ücreti (İK m. 59/1), sözleşmenin 10 Nisan 2026'da feshedilmesiyle doğmuştur. Bunlar devir tarihinde doğmuş borçlar olmadığından birlikte sorumluluk kuralı uygulanmaz; fesih B'nin döneminde yapıldığı için bu alacaklardan yalnızca B sorumludur. Z'nin kıdemi ise İK m. 6/2 gereği D yanında 2020'de başlayan hizmete göre hesaplanır.

      B'nin Z'nin sözleşmesini yalnızca gebelik nedeniyle feshetmesi, İK m. 5/3'ün doğrudan ihlalidir; gebelik, sözleşmenin sona ermesinde farklı işlem yapılamayacak sebeplerden biridir. Bu bir biyolojik ya da işin niteliğine ilişkin zorunluluk değildir. İK m. 5/6'ya göre Z, dört aya kadar ücreti tutarında uygun bir tazminat ile yoksun bırakıldığı haklarını isteyebilir. İspat bakımından Z'nin gebelik ve feshin zamanını göstermesi ihlal ihtimalini güçlü biçimde ortaya koyar; bu durumda B'nin feshin gebelikle ilgili olmadığını ispatlaması gerekir (İK m. 5/7). Fesih, devir nedeniyle değil gebelik nedeniyle yapıldığından İK m. 6/5 burada belirleyici değildir. Ayrımcılık tazminatı B'nin eylemine bağlı olduğundan D bu talepten sorumlu tutulamaz.

      **Sonuç:** Fazla çalışma ücretinden yalnız B sorumludur (D'nin iki yıllık sorumluluğu dolmuştur). İhbar tazminatı ve yıllık izin ücreti B'dendir. Z, B'den ayrıca dört aya kadar ücreti tutarında ayrımcılık tazminatı isteyebilir.
  - olay: |
      Güneş Tekstil A.Ş. (G), 150 işçi çalıştıran bir işyeri işletmektedir. G, yılın son çeyreğindeki sipariş yoğunluğu için Ekin Personel Hizmetleri Ltd. Şti. ile, Türkiye İş Kurumundan izinli bir özel istihdam bürosu olarak, 4 aylık bir geçici işçi sağlama sözleşmesi yapmış ve dönemsellik arz eden iş artışını gerekçe göstererek on iki işçiyi (Mehmet dâhil) çalıştırmaya başlamıştır. Dört aylık sözleşme sona erdiği hâlde Mehmet aynı işte çalışmaya devam etmiştir. G, ilk sözleşme bittikten iki ay sonra aynı iş için Ekin ile yeni bir geçici işçi sağlama sözleşmesi daha yapmıştır.

      G, aynı holdingde yer alan Kaya Boya A.Ş.'ye kendi işçisi Ayşe'yi de geçici olarak devretmiştir. Ayşe'nin yalnızca sözlü onayı alınmış ve ilişki tek seferde on dört ay süreyle kurulmuştur.

      1. Dört aylık sözleşme bitiminde Mehmet'in çalışmaya devam etmesinin sonucunu açıklayınız.
      2. G'nin iki ay sonra aynı iş için yeni geçici işçi sözleşmesi yapabilmesini değerlendiriniz.
      3. Ayşe'nin Kaya Boya A.Ş.'ye devrini değerlendiriniz.
    olcut:
      - {tespit: "Geçici iş ilişkisinin ÖİB yoluyla kurulabileceği hâl ve (g) bendinin dört ay süre sınırı", puan: 15, madde: "İK m. 7/3"}
      - {tespit: "Süre dolduğu hâlde çalışmanın sürmesiyle G ile Mehmet arasında belirsiz süreli sözleşme kurulmuş sayılması", puan: 25, madde: "İK m. 7/13"}
      - {tespit: "Aynı iş için altı ay geçmeden yeniden geçici işçi çalıştırma yasağı", puan: 20, madde: "İK m. 7/3"}
      - {tespit: "Holding içi geçici devirde yazılı rıza şartı", puan: 20, madde: "İK m. 7/15"}
      - {tespit: "Holding içi geçici devirde altı ay ve en fazla iki yenileme sınırı", puan: 20, madde: "İK m. 7/15"}
    cozum: |
      **Nitelendirme:** G ile Ekin arasındaki ilişki, İK m. 7/2 kapsamında özel istihdam bürosu aracılığıyla kurulan geçici iş ilişkisidir; Ekin işçilerin işvereni, G ise geçici işçi çalıştıran işverendir. Ayşe'nin Kaya Boya A.Ş.'de çalıştırılması ise İK m. 7/15'teki holding içi geçici iş ilişkisi sorunudur.

      **Hukuki sorunlar:** (1) Süre dolduktan sonra çalışmanın sürmesinin sonucu; (2) yeniden geçici işçi çalıştırma bekleme süresi; (3) holding içi görevlendirmenin şekil ve süre şartları.

      **İlgili hükümler:** İK m. 7/1, İK m. 7/2-(g), İK m. 7/3, İK m. 7/13, İK m. 7/15.

      **Değerlendirme:** Dönemsellik arz eden iş artışında (g bendi) ÖİB aracılığıyla geçici iş ilişkisi en fazla dört ay kurulabilir ve bu bentte yenileme yapılamaz (İK m. 7/3). Dört aylık sözleşme bu sınırı aşmaz ve bu açıdan hukuka uygundur. Ancak sözleşmede belirtilen süre dolduğu hâlde Mehmet'in çalışmasının sürmesi hâlinde, G ile Mehmet arasında sözleşmenin sona erme tarihinden itibaren belirsiz süreli iş sözleşmesi kurulmuş sayılır (İK m. 7/13). ÖİB ise ücret, gözetme borcu ve sigorta primlerinden yalnızca sözleşme süresiyle sınırlı olarak sorumludur.

      G, süre sonunda aynı iş için altı ay geçmedikçe yeniden geçici işçi çalıştıramaz (İK m. 7/3). Yeni sözleşmenin yalnızca iki ay sonra yapılması bu bekleme süresine aykırıdır; hukuka uygun değildir. (Ayrıca (g) bendi yenilenemediğinden yeni sözleşme yenileme olarak da savunulamaz.)

      Ayşe bakımından devir, holding bünyesinde yapılacağından İK m. 7/15 uygulanır. Bu fıkra devir sırasında işçinin yazılı rızasını arar; sözlü onay yeterli değildir. Ayrıca ilişki altı ayı geçmemek üzere kurulabilir ve en fazla iki defa yenilenebilir. Ayşe'nin yalnızca sözlü onayı alınmıştır ve ilişki tek seferde on dört ay için kurulmuştur; bu, hem yazılı rıza şartına hem de kurulan ilişkinin altı ayı geçemeyeceği kuralına uymaz. Kanun, altı aydan uzun süre için ancak en fazla iki yenileme imkânı verir. Devreden işverenin ücret ödeme yükümlülüğü sürer; Kaya Boya A.Ş. de ödenmeyen ücret, gözetme borcu ve sigorta primlerinden birlikte sorumludur.

      **Sonuç:** Mehmet ile G arasında belirsiz süreli sözleşme kurulmuş sayılır; ikinci geçici işçi sözleşmesi altı aylık bekleme süresine aykırıdır; Ayşe'nin yazılı rızası alınmadığından ve süre altı ayı aştığından holding içi geçici iş ilişkisi İK m. 7/15'e uygun kurulmamıştır.
kartlar:
  - on: "Ayrımcılık tazminatı ne kadardır (İK m. 5/6)?"
    arka: "Dört aya kadar ücreti tutarında uygun bir tazminat; ayrıca yoksun bırakılan haklar istenir."
  - on: "İK m. 5/7'de ispat yükü kimdedir?"
    arka: "Kural olarak işçidedir; işçi ihlal ihtimalini güçlü biçimde gösterirse işveren ihlalin olmadığını ispatlar."
  - on: "Sendikal tazminat ile ayrımcılık tazminatı farkı nedir?"
    arka: "Sendikal tazminat en az bir yıllık ücrettir (STİSK m. 25); ayrımcılık tazminatı en çok dört aylık ücrettir (İK m. 5/6)."
  - on: "İK m. 5/3 hangi aşamalarda cinsiyet ve gebelik ayrımını yasaklar?"
    arka: "Sözleşmenin yapılmasında, şartlarının oluşturulmasında, uygulanmasında ve sona ermesinde."
  - on: "İşyeri devrinde iş sözleşmeleri nasıl geçer?"
    arka: "Devir tarihinde mevcut sözleşmeler bütün hak ve borçlarıyla kendiliğinden devralana geçer; işçinin rızası aranmaz (İK m. 6/1)."
  - on: "İşyeri devri ile iş sözleşmesinin devri farkı nedir?"
    arka: "İşyeri devrinde rıza aranmaz (İK m. 6); iş sözleşmesinin devrinde işçinin yazılı rızası şarttır (TBK m. 429)."
  - on: "Devredenin sorumluluk süresi nedir (İK m. 6/3)?"
    arka: "Devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan, devir tarihinden itibaren iki yıl."
  - on: "Devirden sonraki fesihte yıllık izin ücretinden kim sorumludur?"
    arka: "Fesihle doğduğu için devralan (İK m. 59). Devir tarihinde doğmuş borç değildir."
  - on: "İK m. 6/4 neyi söyler?"
    arka: "Tüzel kişiliğin birleşme, katılma ya da tür değiştirmeyle sona ermesinde birlikte sorumluluk hükümleri uygulanmaz (külli halefiyet: TTK m. 153)."
  - on: "ÖİB yoluyla geçici iş ilişkisinin süreleri nelerdir (İK m. 7/3)?"
    arka: "(a) hâlin devamı, (b)-(c) süresiz, (d)-(f) en fazla dört ay ve iki yenilemeyle toplam sekiz ay, (g) dört ay yenilenemez; sonra aynı iş için altı ay bekleme."
  - on: "Geçici iş ilişkisi süre dolduğu hâlde sürerse ne olur (İK m. 7/13)?"
    arka: "Çalıştıran işveren ile işçi arasında sürenin bitiminden itibaren belirsiz süreli iş sözleşmesi kurulmuş sayılır."
  - on: "Holding içi geçici devrin şartları nedir (İK m. 7/15)?"
    arka: "Devir sırasında işçinin yazılı rızası; altı ayı geçmemek üzere yazılı kurulur ve en fazla iki defa yenilenebilir."
