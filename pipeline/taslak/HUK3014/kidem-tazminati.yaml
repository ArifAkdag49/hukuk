ozet: |
  - **Dayanak:** Kıdem tazminatı, 1475 sayılı Kanun m. 14'te düzenlenir. İK m. 120, bu maddeyi yürürlükte bırakmıştır; İK'nın geçici 1. maddesi, m. 14'teki 16, 17 ve 26. madde atıflarını İK m. 24, İK m. 25 ve İK m. 32'ye çevirir.
  - **Hak doğuran haller (1475 sayılı Kanun m. 14/1):** (1) işverenin İK m. 25/II dışındaki sebeplerle feshi; (2) işçinin İK m. 24 uyarınca haklı feshi; (3) muvazzaf askerlik; (4) yaşlılık, emeklilik veya malullük aylığı ya da toptan ödeme almak amacıyla ayrılma; (5) yaş dışındaki sigortalılık süresi ve prim gün şartını tamamlayarak ayrılma; (6) kadının evlendiği tarihten itibaren **bir yıl içinde** kendi arzusuyla ayrılması; (7) işçinin ölümü.
  - **Miktar:** İşe başlama tarihinden itibaren her geçen **tam yıl** için **30 günlük ücret**; bir yıldan artan süreler için de aynı oranda ödenir. Hesap **son ücret** üzerinden yapılır ve ücrete ilaveten sağlanan, para veya para ile ölçülebilir akdi ve kanundan doğan menfaatler de eklenir (**giydirilmiş ücret**).
  - **Tavan:** Sözleşme veya TİS ile belirlenen yıllık miktar, en yüksek Devlet memuruna bir hizmet yılı için ödenecek azami emeklilik ikramiyesini geçemez. Tutar dönemlere göre değiştiğinden bu notta rakam yoktur.
  - **Kıdem birleştirme:** Aynı işverenin bir veya değişik işyerlerinde geçen süreler fasılalı olsa da birleştirilir; işyeri devrinde iki işveren de sorumludur, devreden işverenin sorumluluğu çalıştırdığı süre ve devirdeki ücret seviyesiyle sınırlıdır.
  - **Faiz:** Dava sonunda hâkim, gecikme süresi için mevduata uygulanan en yüksek faize hükmeder.
  - **Zamanaşımı:** İK'nın ek 3. maddesine göre **beş yıl** (7036 sayılı Kanun).
  - **Diğer:** Ölümde mirasçılara ödenir; sorumluluk sigortaya yaptırılamaz; aynı kıdem süresi için bir defadan fazla ödenmez. İstifa, kural olarak hak doğurmaz.
  - 📌 **Güncel:** 7573 sayılı Kanunla eklenen İK'nın geçici 12. maddesi, kamuda alt işverenlerin çalıştırdığı işçilerin kıdem tazminatı ödemelerine ilişkin rücu alacaklarının belirli bir dönem için tahsilinden vazgeçer (İK m. 112 bağlantısı).
anlatim: |
  ## 1. Kıdem tazminatı nedir?

  **Kıdem tazminatı**, uzun süre aynı işverenin yanında çalışmış işçiye, iş ilişkisi kanunda sayılan hâllerden biriyle sona erdiğinde ödenen, kanundan doğan bir tazminattır. İş Kanunu (4857 sayılı) kıdem tazminatını kendi içinde düzenlemez; İK m. 120 ile 1475 sayılı İş Kanununun yalnız **14. maddesi** yürürlükte bırakılmıştır. Bu yüzden atıf hep "1475 sayılı Kanun m. 14" biçiminde yapılır. İK'nın geçici 1. maddesi, m. 14'teki eski kanun atıflarını yeni karşılıklarına çevirir: eski kanunun on altıncı maddesi İK m. 24, on yedinci maddesi İK m. 25 ve yirmi altıncı maddesi İK m. 32 yerine geçer.

  İK'nın geçici 6. maddesi bir kıdem tazminatı fonu öngörür; fonla ilgili kanun yürürlüğe girene kadar işçilerin 1475 sayılı Kanun m. 14 hükümlerine göre kıdem tazminatı hakları saklıdır. Bu nedenle ödeme yükü bugün işverenin üzerindedir.

  > 💡 **Püf nokta:** İhbar tazminatı 4857'de (İK m. 17), kıdem tazminatı 1475'te (m. 14). İkisi ayrı kurumdur, ayrı şartlara bağlıdır.

  ## 2. Hak kazanma şartları

  ### 2.1. Kıdem süresi

  Madde, tazminatı işçinin işe başladığı tarihten itibaren "her geçen **tam yıl** için" öngörür; bir yıldan artan süreler için de aynı oranda ödeme yapılır. Bundan ve yerleşik uygulamadan çıkan sonuç, işçinin hak kazanması için **en az bir tam yıl** çalışması gerektiğidir. Kıdem süresi, aynı işverenin bir veya değişik işyerlerinde geçen sürelerin toplamıdır; sözleşme fasılalarla yeniden yapılmış olsa da bu hesap yapılır (m. 14/2).

  ### 2.2. Sona erme biçimi: numerus clausus

  Kıdem tazminatı her fesihte doğmaz. 1475 sayılı Kanun m. 14/1'e göre hizmet akdinin şu hâllerde sona ermesi gerekir:

  1. **İşveren tarafından**, İK m. 25/II'deki (ahlak ve iyi niyet) sebepler dışında feshedilmesi. Yani işverenin süreli feshi (İK m. 18'deki geçerli sebep dahil), İK m. 25/I, III ve IV'e dayanan feshi, haksız feshi kıdem tazminatı doğurur.
  2. **İşçi tarafından** İK m. 24 uyarınca haklı nedenle feshedilmesi (örneğin ücretin ödenmemesi).
  3. **Muvazzaf askerlik** hizmeti dolayısıyla sona ermesi.
  4. Bağlı olunan kurumdan **yaşlılık, emeklilik veya malullük aylığı ya da toptan ödeme** almak amacıyla ayrılma. İşçi, aylık veya toptan ödemeye hak kazandığını ve ilgili kuruma başvurduğunu **belgelemelidir**; ölüm hâlinde bu şart aranmaz.
  5. Eski kanundaki yaş şartları dışında kalan diğer koşulları, yani **sigortalılık süresini ve prim ödeme gün sayısını** tamamlayarak kendi isteğiyle ayrılma.
  6. **Kadın işçinin evlendiği tarihten itibaren bir yıl içinde** kendi arzusuyla sona erdirmesi.
  7. **İşçinin ölümü**; tutar kanuni mirasçılara ödenir.

  Tabloda ayrım:

  | Durum | Kıdem tazminatı |
  |---|---|
  | İşveren İK m. 25/II dışı fesih | Var |
  | İşveren İK m. 25/II fesih | Yok |
  | İşçi İK m. 24 haklı fesih | Var |
  | İşçi haklı sebepsiz istifa | Yok |

  > ⚠️ **Sınavda dikkat:** Haklı sebep olmaksızın **istifa**, kıdem tazminatı gerektiren hâller arasında sayılmaz. Yargıtay Hukuk Genel Kurulu da işçinin kendi isteğiyle ayrılmasında kıdem tazminatının doğmayacağını, işverenin iyi niyetle bir miktar ödeme yapmasının bu niteliği değiştirmediğini kabul etmiştir (aşağıdaki kararlara bak).

  > **Örnek:** Seda, 25 yaşında, üç yıldır çalışıyor ve 1 Mart'ta evlendi. 15 Aralık'ta dilekçeyle kendi isteğiyle ayrıldı. Evlenmeden itibaren bir yıl içinde ayrıldığı için kıdem tazminatına hak kazanır.

  ### 2.3. Sık görülen yanlışlar

  - **Askerlik:** Kıdem tazminatı, muvazzaf askerlik hizmeti dolayısıyla sözleşmenin sona ermesinde doğar; işçinin kendiliğinden başka bir sebeple ayrılması bu bent kapsamında sayılmaz.
  - **Emeklilik:** Aylık bağlanması için başvuru yapılmadan ayrılan işçi, bu hâlden yararlanamaz; belge şartı kanunda açıkça aranmıştır.
  - **Evlilik:** Süre, evlenme tarihinden başlar ve bir yıldır; yalnız kadın işçi için öngörülmüştür (m. 14/1).
  - **Haklı fesih:** İşçi İK m. 24'e dayanarak feshediyorsa gerçekten haklı bir sebebi (örneğin ücretin ödenmemesi) kanıtlamalıdır; kanıtlayamazsa fesih istifa sayılır ve hak doğmaz.

  ## 3. Miktarın hesabı

  ### 3.1. Temel formül

  Her tam yıl için **30 günlük ücret**; artan süreler aynı oranla oranlanır. Sözleşme veya toplu iş sözleşmesiyle bu 30 günlük süre **işçi lehine değiştirilebilir** (m. 14/12). Hesap **son ücret** üzerinden yapılır. Ücret sabit değilse (parça başı, akort, götürü, yüzde usulü) son bir yılda ödenen ücret, o sürede çalışılan günlere bölünür ve çıkan ortalama esas alınır; son bir yılda zam yapıldıysa ayrılma tarihi ile zam tarihi arasındaki ücret esas alınır.

  > **Örnek:** Giydirilmiş aylık ücreti 20.000 TL olan işçi 3 yıl 6 ay çalışmıştır. Üç tam yıl için 3 × 20.000, artan altı ay için 20.000'in yarısı eklenir: toplam 70.000 TL (tavan aşılmıyorsa).

  ### 3.2. Giydirilmiş ücret

  Kıdem tazminatına esas ücret, İK m. 32/1'deki ücrete ilaveten işçiye sağlanmış **para ve para ile ölçülmesi mümkün akdi ve kanundan doğan menfaatleri** de kapsar (m. 14/11). Buna **giydirilmiş ücret** denir. Yemek, yol, düzenli ikramiye gibi süreklilik taşıyan ödemeler çıplak ücrete eklenir; tek seferlik, arızi ödemeler eklenmez. Hukuk Genel Kurulu da işveren yemek ve yol yardımı yapıyorsa bunların ücretin eki sayılarak kıdem ve ihbar tazminatı hesabında nazara alınması gerektiğini belirtmiştir.

  ### 3.3. Tavan

  m. 14/13 uyarınca sözleşme ve TİS ile belirlenen kıdem tazminatının yıllık miktarı, **Devlet Memurları Kanununa tabi en yüksek Devlet memuruna** bir hizmet yılı için ödenecek **azami emeklilik ikramiyesini** geçemez. Uygulamada bu sınır kıdem tazminatı tavanı olarak her hizmet yılı için uygulanır. Tavan tutarı dönemlere göre değişir; sınav sorularında genellikle "tavanın X TL olduğunu varsayınız" denir. Güncel tutarı resmî kaynaktan öğrenmeden rakam vermek yanlıştır.

  > ⚠️ **Sınavda dikkat:** 30 günlük süreyi sözleşmeyle 45 güne çıkarmak mümkündür (m. 14/12); ama bu, tavanı aşma hakkı vermez.

  ### 3.4. Hesap adımları ve örnek

  1. **Kıdemi bul:** Tam yıl ve artan süre (ay veya gün olarak oranla).
  2. **Giydirilmiş ücreti bul:** Çıplak ücret + süreklilik taşıyan yan ödemeler (yemek, yol, yılda bir ödenen ikramiyenin aylık payı).
  3. **Tavan kontrolü:** Giydirilmiş ücret, bir hizmet yılı için tavanı aşıyor mu? Aşıyorsa her yıl için tavan esas alınır.
  4. **Çarp:** Kıdem yılı × giydirilmiş ücret (30 günlük ücret aylık ücretle aynı ölçüde alınır).

  > **Örnek:** Elif'in aylık çıplak ücreti 25.000 TL, yemek yardımı 2.500 TL, yol yardımı 1.500 TL'dir; yılda bir 12.000 TL ikramiye alır (aylık pay 1.000 TL). Giydirilmiş ücret 30.000 TL'dir. Elif 4 yıl çalışmışsa ve tavan aşılmıyorsa brüt kıdem tazminatı 4 × 30.000 = 120.000 TL'dir.

  > 💡 **Püf nokta:** Soruda "ücret" yazıyorsa önce çıplak mı giydirilmiş mi olduğuna bak. Kıdem tazminatı daima giydirilmiş ücretle hesaplanır.

  ## 4. İşyeri devri ve kıdemin birleşmesi

  İşyeri devir veya intikalinde işçinin kıdemi, işyerlerindeki hizmet sürelerinin toplamı üzerinden hesaplanır. 12.7.1975'ten sonra işyeri devredildiğinde işlemiş kıdem tazminatlarından **her iki işveren sorumludur**; devreden işverenin sorumluluğu ise işçiyi **çalıştırdığı sürelerle ve devir esnasındaki ücret seviyesiyle** sınırlıdır. İK m. 6'daki devir kuralları genel hükümdür; kıdem tazminatında 1475 sayılı Kanun m. 14'teki özel düzenleme esas alınır.

  > **Örnek:** Zeynep X Ltd.'de 3 yıl, devirden sonra Y A.Ş.'de 4 yıl çalıştı ve Y'nin feshi (İK m. 18) üzerine ayrıldı. Toplam kıdem 7 yıldır. Y A.Ş. son giydirilmiş ücret üzerinden 7 yıl için sorumludur; X Ltd. yalnız kendi 3 yılı ve devir anındaki ücret seviyesi kadarıyla birlikte sorumludur.

  ## 5. Faiz ve zamanaşımı

  - **Faiz:** m. 14/11'e göre hâkim, kıdem tazminatının zamanında ödenmemesi sebebiyle açılan davanın sonunda, gecikme süresi için mevduata uygulanan **en yüksek faize** hükmeder. Yargıtay'ın yerleşik uygulamasına göre işveren, kıdem tazminatı borcunda iş sözleşmesinin feshedildiği tarihte temerrüde düşer; faiz bu tarihten işletilir.
  - **Zamanaşımı:** İK'nın ek 3. maddesi (7036 sayılı Kanun, 2017): iş sözleşmesinden kaynaklanan kıdem tazminatı, bildirim şartına uyulmaksızın fesih tazminatı, kötüniyet tazminatı, eşit davranma tazminatı ve yıllık izin ücretinde zamanaşımı **beş yıldır**. İK'nın geçici 8. maddesi bu hükmün 7036 sayılı Kanunun yürürlüğünden sonra sona eren iş sözleşmeleri için geçerli olduğunu belirtir.

  ## 6. Diğer kurallar

  - **Aynı kıdem için çift ödeme yok:** "Aynı kıdem süresi için bir defadan fazla kıdem tazminatı veya ikramiye ödenmez" (m. 14).
  - **Ölüm:** Hak, işçinin kanuni mirasçılarına geçer.
  - **Sigorta ve fon:** İşveren kıdem tazminatı sorumluluğunu kişilere veya sigorta şirketlerine sigorta ettiremez.
  - **Kamu işverenleri:** Hizmet sürelerinin birleştirilmesi, kamu kuruluşlarında geçen sürelerle emeklilik ikramiyesi sınırı gibi özel düzenlemeler m. 14'ün sonraki fıkralarındadır. 📌 İK'nın geçici 12. maddesi (7573 sayılı Kanun) kamu kurumlarının 4734 sayılı Kamu İhale Kanununun 62. maddesinin birinci fıkrasının (e) bendi kapsamındaki alt işveren işçilerine yaptığı kıdem tazminatı ödemelerinden doğan rücu alacaklarının belirli bir dönem için tahsilinden vazgeçer; ayrıntı İK m. 112'yle birlikte okunur.

  ## 6A. Kıdem tazminatı ile ihbar tazminatı: kısa karşılaştırma

  | Konu | Kıdem tazminatı | İhbar tazminatı |
  |---|---|---|
  | Dayanak | 1475 sayılı Kanun m. 14 | İK m. 17 |
  | Hesap | Tam yıl × 30 gün, tavan var | Bildirim süresi ücreti |
  | Şart | Kanundaki hallerde sona erme | Bildirim süresine uyulmaması |

  İşverenin haklı bir sebebe (İK m. 25) dayanmadan, bildirim süresi tanımadan feshettiği olayda ikisi birlikte doğar. İşverenin İK m. 25/I, III veya IV'e dayanan derhal feshinde kıdem tazminatı doğar, ihbar tazminatı doğmaz. İşverenin İK m. 25/II'ye dayanan haklı feshinde ikisi de doğmaz. İşçinin İK m. 24 haklı feshinde kıdem tazminatı doğar, ihbar tazminatı doğmaz. Bu ayrımlar, sınavda en sık sorulan noktadır.

  > ⚠️ **Sınavda dikkat:** "Fesih haklıysa tazminat yok" demeyin. İşçi haklı feshettiyse kıdem tazminatı vardır; işveren İK m. 25/I, III veya IV ile feshettiyse de kıdem tazminatı vardır.

  ## 7. Denetim şeması

  1. İşçi 4857 kapsamında mı, kıdem (bir yıl, tam yıl hesabı, birleştirme) yeterli mi?
  2. Sözleşme nasıl sona erdi? İşveren feshiyse İK m. 25/II mi? İşçi feshiyse İK m. 24 mü, istifa mı?
  3. Askerlik, emeklilik, evlilik (kadın, bir yıl) veya ölüm hâli var mı? Emeklilikte belge ve başvuru şartı tamam mı?
  4. Son giydirilmiş ücret: sabit mi, değişken mi, zam var mı?
  5. Tavan kontrolü: her hizmet yılı için tavanı aşıyor mu?
  6. Hesap: tam yıl × 30 gün + artan süre oranı.
  7. Faiz (mevduata uygulanan en yüksek) ve zamanaşımı (beş yıl).
kritik: |
  - 📌 Kıdem tazminatı **1475 sayılı Kanun m. 14**'te; İK m. 120 onu yürürlükte tutar.
  - 📌 **7 hak doğuran hal:** işveren feshi (İK m. 25/II hariç), işçinin İK m. 24 feshi, muvazzaf askerlik, emeklilik/malullük/toptan ödeme, yaş dışı şartlarla ayrılma, kadının evlilikten sonra **1 yıl içinde** ayrılması, ölüm.
  - ⚠️ **İstifa** kural olarak kıdem tazminatı doğurmaz; işverenin iyi niyetle bir miktar ödeme yapması istifayı fesihe çevirmez.
  - 📌 Her tam yıl için **30 günlük** ücret; artan süreler oranlanır (m. 14/1).
  - 📌 Hesap **son ücret** üzerinden; ücret sabit değilse **son bir yılın** ortalaması (m. 14/9-10).
  - 📌 **Giydirilmiş ücret:** çıplak ücret + para ve para ile ölçülebilir akdi ve kanundan doğan menfaatler (m. 14/11, İK m. 32/1).
  - 📌 **Tavan:** en yüksek Devlet memurunun bir hizmet yılı için azami emeklilik ikramiyesi; 30 günlük süre sözleşmeyle artırılsa bile aşılamaz.
  - ⚠️ 30 gün **işçi lehine** değiştirilebilir (nispi emredici); tavan bunu sınırlar.
  - 📌 **Zamanaşımı: 5 yıl** (İK'nın ek 3. maddesi); faiz: **mevduata uygulanan en yüksek faiz**.
  - 📌 **İşyeri devri:** iki işveren sorumlu; devreden yalnız kendi süresi ve devirdeki ücret seviyesiyle sınırlı.
  - ⚠️ **Emeklilik** nedeniyle ayrılmada aylık/toptan ödemeye hak kazanıldığı ve kuruma başvurulduğu **belgelenmelidir**; ölümde bu şart aranmaz.
  - 💡 "Aynı kıdem süresi için bir defadan fazla ödenmez" (m. 14/8).
doktrin: |
  ### Tavanın niteliği

  Metin tavanı, sözleşme ve toplu iş sözleşmesiyle belirlenen kıdem tazminatları için koyar. Uygulama ve genel kabul ise tavanı, kanundan doğan tazminat dahil bütün kıdem tazminatlarının üst sınırı olarak yorumlar. Bu nedenle 30 günlük süreyi artıran sözleşme hükmü de tavanı aşamaz. Metin sınırı "bir hizmet yılı için" ödenecek tutara bağladığından hesap her hizmet yılı için yapılır; sınavda "tavanın X TL olduğunu varsayınız" ifadesi bu mantıkla kullanılır.

  ### Kıdem tazminatı fonu

  İK'nın geçici 6. maddesi bir fon öngörmektedir. Fonun kurulması, işveren sorumluluğunun fona devri ve kıdem tazminatının kapsamının daraltılıp daraltılmayacağı kamuoyunda tartışılan bir reform konusudur. Fon kanunu yürürlüğe girene kadar 1475 sayılı Kanun m. 14 uygulanır; güncel durum için mevzuat izlenmelidir.

  ### Emeklilik ve istifa arasındaki sınır

  Emeklilik amacıyla ayrılma (m. 14/1, 4. ve 5. bent) ile sıradan istifa arasındaki sınır, işçinin yaş dışındaki sigortalılık süresi ve prim gün sayısını tamamlayıp tamamlamadığına göre çizilir. İşçinin dilekçesinde "emeklilik" yazmaması, koşullar fiilen gerçekleşmişse hakkı tek başına ortadan kaldırmaz; mahkeme dilekçedeki genel ifadenin ardındaki gerçek nedeni araştırabilir.
sozluk:
  - terim: Kıdem tazminatı
    tanim: "Belirli hâllerde sona eren iş ilişkisinde, her tam yıl için 30 günlük giydirilmiş ücret tutarında ödenen kanuni tazminat (1475 sayılı Kanun m. 14)."
  - terim: Giydirilmiş ücret
    tanim: "Çıplak ücrete ek olarak işçiye sağlanan, para veya para ile ölçülebilen akdi ve kanundan doğan menfaatlerle birlikte hesaplanan ücret."
  - terim: Çıplak ücret
    tanim: "İK m. 32/1'deki, işveren veya üçüncü kişilerce iş karşılığında para olarak ödenen asıl ücret."
  - terim: Numerus clausus
    tanim: "Kıdem tazminatı doğuran hâllerin kanunda sınırlı sayıda sayılması."
  - terim: Kıdem tazminatı tavanı
    tanim: "Bir hizmet yılı için ödenecek kıdem tazminatının üst sınırı: en yüksek Devlet memurunun azami emeklilik ikramiyesi."
  - terim: Muvazzaf askerlik
    tanim: "Zorunlu askerlik hizmeti nedeniyle sona eren iş sözleşmesinde kıdem tazminatı doğuran hâl (m. 14/1-3)."
  - terim: Mevduata uygulanan en yüksek faiz
    tanim: "Kıdem tazminatında hâkimin gecikme süresi için hükmettiği faiz türü."
  - terim: Zamanaşımı (beş yıl)
    tanim: "Kıdem tazminatı, yıllık izin ücreti ve bazı diğer tazminatlar için İK'nın ek 3. maddesindeki süre; dolduktan sonra işveren def'i ileri sürerse talep reddedilir."
  - terim: Devreden işveren
    tanim: "İşyerini devreden işveren; kıdem tazminatından kendi çalıştırdığı süre ve devirdeki ücret seviyesi ölçüsünde sorumludur."
  - terim: İstifa
    tanim: "İşçinin haklı sebep olmaksızın sözleşmeyi sona erdirmesi; kural olarak kıdem tazminatı doğurmaz."
kararlar:
  - id: "759630500"
    ozet: |
      Davacı, bir elektrik dağıtım şirketinin bakım-onarım işlerini ihale yoluyla üstlenen alt işverenler nezdinde 24.04.2009 - 31.03.2014 arasında elektrik teknisyeni olarak çalışmış; kıdem ve ihbar tazminatı yanında yol, yemek ve belge eğitimi ücreti istemiştir. Özel Daire, yol ve yemek alacağının dayanağı ve miktarı ortaya konulmadığı için hükmü bozmuş, mahkeme direnmiştir.

      Hukuk Genel Kurulu gerekçesinde, iş mevzuatında işverene yemek veya yol ödeme zorunluluğu bulunmadığını, ancak işveren bu yardımları yapıyorsa bunların ücretin eki sayılarak kıdem ve ihbar tazminatlarının hesabında nazara alınması gerektiğini açıkça belirtmiştir (İK m. 32/1, İK m. 17, İK m. 120 ile yürürlükte kalan 1475 sayılı Kanun m. 14). Somut olayda ise sözleşmelerde, şartnamelerde ve bordrolarda yol ve yemek yardımına dair bir dayanak bulunmadığından bu yardımların varlığı ispatlanamamış; Kurul, yol ve yemek talebinin reddedilmesi ve kıdem ile ihbar tazminatının bu yardımlar dikkate alınmadan yeniden hesaplanması gerektiğini kabul etmiştir. Kurul üç uyuşmazlıktan ilk ikisinde direnme kararını bozmuş, üçüncüsünde onamıştır.
  - id: "833555100"
    ozet: |
      Davacı, davalı işyerinde 01.02.1999 - 11.10.2012 arasında çalışmış, işyerinden ayrılırken imzaladığı belgede kendi rızasıyla istifa ettiğini ve işverenin iyi niyetiyle 8.000 TL aldığını yazmıştır. Sonradan kıdem tazminatı istemiş; ilk derece mahkemesi isteği kısmen kabul etmiş, Özel Daire bozmuş, mahkeme direnmiştir.

      Hukuk Genel Kurulu, istifanın kanunda kıdem tazminatı doğuran hâller arasında sayılmadığını, işçinin haklı sebebe dayanmadan ve bildirim süresi tanımadan sözleşmeyi sona erdirmesinin istifa olduğunu, istifada iş güvencesi hükümlerinden de kıdem ve ihbar tazminatından da yararlanılamayacağını belirtmiştir. Davacı kıdem tazminatı doğuran bir sebebi kanıtlayamadığı için işverenin bir miktar ödeme yapmış olması feshin niteliğini değiştirmemiş ve talep reddedilmesi gerektiğinden direnme kararı oy çokluğuyla bozulmuştur. Karşı oyda, işverenin ödemenin kıdem tazminatı karşılığı olduğu ve istifada ödeme yapılan işyeri uygulamasının bulunduğu görüşü savunulmuştur.
  - id: "471441100"
    ozet: |
      Davacı, perakende zincirinde 10.06.2008 - 01.11.2012 arasında alan ve bölge yöneticisi olarak çalışmış; kıdem tazminatı, ücret, prim, izin ve tatil ücreti ile teminat bonosunun iadesini istemiştir. Yerel mahkeme, işçilik hakları ödenmediği için işçinin haklı feshinden söz ederek kıdem tazminatına hükmetmiştir.

      9. Hukuk Dairesi, dosya kapsamından davacının yaş hariç 15 yıl sigortalılık süresi ve 3600 prim günü koşulunu tamamlayarak ayrıldığını belirleyip kıdem tazminatına hükmedilmesini sonuç olarak yerinde bulmuş; yalnız mahkemenin gerekçesindeki haklı fesih vurgusunu hatalı saymıştır (hatanın sonucu etkilememesi nedeniyle bozma sebebi yapılmamıştır). Karar, yıllık izin ve ulusal bayram-genel tatil ücretine ilişkin bordroların yeniden incelenmesi gerektiği için bozulmuştur.
sorular:
  - soru: |
      Aşağıdakilerden hangisinde işçi kıdem tazminatına hak kazanır (diğer koşullar gerçekleşmiştir)?
    siklar:
      - "İşveren, işçinin yeterliliği nedeniyle bildirim süresine uyarak iş sözleşmesini feshetmiştir"
      - "İşçi başka bir işyerinde daha yüksek ücretle çalışmak için istifa dilekçesi vermiştir"
      - "İşveren, işçinin işyerinde hırsızlık yaptığı gerekçesiyle İK m. 25/II-e uyarınca sözleşmeyi derhal feshetmiştir"
      - "İşçi herhangi bir haklı sebep olmaksızın sözleşmeyi bildirim süresine uyarak feshetmiştir"
    dogru: 0
    aciklama: |
      1475 sayılı Kanun m. 14/1-1, işverenin İK m. 25/II dışındaki sebeplerle feshini kıdem tazminatı gerektiren hâl sayar; geçerli sebeple (İK m. 18) süreli fesih de bu gruba girer. Haklı sebepsiz istifa ve İK m. 25/II feshi kıdem tazminatı doğurmaz.
  - soru: |
      Üç yıldır çalışan kadın işçi Sevgi 3 Mart'ta evlenmiş, aynı yılın 20 Aralık'ında kendi arzusuyla işten ayrılmıştır. Hangisi doğrudur?
    siklar:
      - "Evlendiği tarihten itibaren bir yıl içinde ayrıldığı için kıdem tazminatına hak kazanır"
      - "İstifa ettiği için kıdem tazminatına hak kazanamaz"
      - "Ancak toplu iş sözleşmesi varsa hak kazanır"
      - "Evlilik nedeniyle ayrılmada hak kazanması için işverenin onayı gerekir"
    dogru: 0
    aciklama: |
      1475 sayılı Kanun m. 14/1, kadının evlendiği tarihten itibaren bir yıl içinde kendi arzusuyla sona erdirmesini kıdem tazminatı gerektiren hâl sayar. İşverenin onayı gerekmez; hak kanundan doğar.
  - soru: |
      Giydirilmiş aylık ücreti 20.000 TL olan işçi 3 yıl 6 ay çalıştıktan sonra işverenin geçerli sebebe dayanan feshi ile ayrılmıştır. Kıdem tazminatı tavanının aşılmadığı varsayıldığında brüt kıdem tazminatı kaç TL'dir?
    siklar:
      - "60.000 TL"
      - "70.000 TL"
      - "80.000 TL"
      - "42.000 TL"
    dogru: 1
    aciklama: |
      Her tam yıl için 30 günlük ücret, artan süreler için de aynı oran ödenir (1475 sayılı Kanun m. 14/1). Üç tam yıl 3 × 20.000 = 60.000; artan altı ay 20.000'in yarısı olan 10.000. Toplam 70.000 TL. Yalnız tam yılları hesaplamak (60.000) yaygın yanılgıdır.
  - soru: |
      Kıdem tazminatı alacağında zamanaşımı süresi kaç yıldır?
    siklar:
      - "Bir yıl"
      - "İki yıl"
      - "Beş yıl"
      - "On yıl"
    dogru: 2
    aciklama: |
      İK'nın ek 3. maddesine (7036 sayılı Kanun) göre iş sözleşmesinden kaynaklanan kıdem tazminatının zamanaşımı süresi beş yıldır. İK'nın geçici 8. maddesi bu hükmün 7036'nın yürürlüğünden sonra sona eren iş sözleşmeleri için geçerli olduğunu söyler.
  - soru: |
      Kıdem tazminatının zamanında ödenmemesi hâlinde dava sonunda gecikme süresi için hâkim hangi faize hükmeder?
    siklar:
      - "Kanuni faiz (yasal faiz)"
      - "Mevduata uygulanan en yüksek faiz"
      - "Avans faizi ile sınırlı olmak üzere ticari faiz"
      - "Faize hükmedilmez; yalnız enflasyon farkı eklenir"
    dogru: 1
    aciklama: |
      1475 sayılı Kanun m. 14/11: hâkim, ödenmeyen süreye göre mevduata uygulanan en yüksek faizin ödenmesine hükmeder. Yasal faiz seçeneği yaygın yanılgıdır.
  - soru: |
      Toplu iş sözleşmesiyle kıdem tazminatının yıllık miktarı artırılmak istenmektedir. Hangisi doğrudur?
    siklar:
      - "30 günlük süre işçi lehine artırılabilir; ancak yıllık miktar en yüksek Devlet memurunun bir hizmet yılı için azami emeklilik ikramiyesini geçemez"
      - "Hiçbir hâlde artırılamaz, çünkü 30 gün mutlak emredici bir kuraldır"
      - "Artırılabilir, tavan yalnız kanuni tutar için uygulanır ve sözleşmesel miktar sınırsızdır"
      - "Yalnız işçi ve işveren sendikasının onayıyla tavan aşılabilir"
    dogru: 0
    aciklama: |
      m. 14/12'ye göre 30 günlük süre sözleşme veya TİS ile işçi lehine değiştirilebilir; m. 14/13 ise sözleşme ve TİS ile belirlenen kıdem tazminatlarının yıllık miktarının en yüksek Devlet memuruna ödenecek azami emeklilik ikramiyesini geçemeyeceğini söyler.
  - soru: |
      İşçi Hasan, yaşlılık aylığına hak kazandığını ve aylık bağlanması için kuruma başvurduğunu belgeleyerek işten ayrılmıştır. Hangisi doğrudur?
    siklar:
      - "Kıdem tazminatına hak kazanır; ayrıca haklı fesih sebebinin kanıtlanması gerekmez"
      - "Kıdem tazminatına hak kazanmaz, çünkü emeklilik istifadır"
      - "Kıdem tazminatına hak kazanması için işverenin onayı gerekir"
      - "Yalnız ölüm hâlinde belge aranır; emeklilikte belge gerekmez"
    dogru: 0
    aciklama: |
      1475 sayılı Kanun m. 14/1-4 ve belgeleme fıkrası: aylık veya toptan ödemeye hak kazandığını ve ilgili kuruma başvurduğunu belgeleyen işçi kıdem tazminatına hak kazanır. Ölümde bu belge aranmaz. Yargıtay da yaş dışındaki sigortalılık ve prim gün koşulunu tamamlayarak ayrılan işçide ayrıca haklı fesih sebebi aramamıştır.
  - soru: |
      İşyeri devrinde devreden işverenin kıdem tazminatı sorumluluğu hakkında hangisi doğrudur?
    siklar:
      - "Her iki işveren sorumludur; devreden işverenin sorumluluğu işçiyi çalıştırdığı sürelerle ve devir esnasındaki ücret seviyesiyle sınırlıdır"
      - "Yalnız devralan işveren sorumludur"
      - "Yalnız devreden işveren sorumludur"
      - "Devreden işverenin sorumluluğu, kıdem süresinden bağımsız olarak son ücret üzerinden tam tutardır"
    dogru: 0
    aciklama: |
      1475 sayılı Kanun m. 14/2: işyeri devrinde işlemiş kıdem tazminatlarından her iki işveren sorumludur; devreden işverenin sorumluluğu çalıştırdığı süre ve devir esnasındaki ücret seviyesiyle sınırlıdır.
  - soru: |
      İşçi Ahmet'in ölümü hâlinde kıdem tazminatı hakkında hangisi doğrudur?
    siklar:
      - "Kıdem tazminatı işçinin kanuni mirasçılarına ödenir"
      - "Hak ölümle sona erer, mirasçılara ödenmez"
      - "Yalnız işçinin eşine ödenir"
      - "Ancak işçi sağlığında başvurmuşsa mirasçılara ödenir"
    dogru: 0
    aciklama: |
      Ölüm, kıdem tazminatı doğuran hâllerdendir; 1475 sayılı Kanun m. 14 uyarınca tutar kanuni mirasçılara ödenir.
  - soru: |
      Komisyon usulüyle çalışan işçinin ücreti sabit değildir. Kıdem tazminatına esas ücret nasıl bulunur?
    siklar:
      - "Son bir yıl içinde ödenen ücretin, o süre içinde çalışılan günlere bölünmesiyle bulunan ortalama ücret esas alınır"
      - "Son ayın ücreti esas alınır"
      - "Bütün çalışma süresi boyunca alınan ücretlerin ortalaması alınır"
      - "Asgari ücret esas alınır"
    dogru: 0
    aciklama: |
      1475 sayılı Kanun m. 14: parça başı, akort, götürü veya yüzde usulü gibi ücretin sabit olmadığı hâllerde son bir yıl içinde ödenen ücretin o süre içinde çalışılan günlere bölünmesiyle bulunan ortalama ücret esas alınır. Son bir yılda zam yapılmışsa ayrılma tarihi ile zam tarihi arasındaki ücret esas alınır.
  - soru: |
      İşçi Burcu önceki çalışma döneminin kıdem tazminatını tam olarak almış, aynı işverenin yanında yeniden çalışmaya başlamıştır. Yeni dönemin sonunda kıdem tazminatı hesaplanırken hangisi doğrudur?
    siklar:
      - "Aynı kıdem süresi için bir defadan fazla ödeme yapılmaz; ilk dönem için tazminat tekrar ödenmez"
      - "İlk dönem de yeniden hesaba katılır ve ilk dönemin tazminatı ikinci kez ödenir"
      - "Yeni dönem bir yıldan kısa olsa bile ilk dönemle birleştirilir ve iki dönemin toplamı için tazminat ödenir"
      - "Yalnız mahkeme kararıyla ilk dönem sayılabilir"
    dogru: 0
    aciklama: |
      1475 sayılı Kanun m. 14: "Aynı kıdem süresi için bir defadan fazla kıdem tazminatı veya ikramiye ödenmez." Daha önce ödenmiş döneme ait kıdem için tekrar tazminat istenemez.
  - soru: |
      Hangisi kıdem tazminatına esas giydirilmiş ücrete **dahil edilir**?
    siklar:
      - "İşçiye düzenli olarak sağlanan, para ile ölçülebilen yemek yardımı"
      - "Yalnızca net ücret"
      - "Yalnızca asgari ücret"
      - "İşçinin kendi ödediği vergi ve primler"
    dogru: 0
    aciklama: |
      1475 sayılı Kanun m. 14/11: kıdem tazminatına esas ücretin hesabında İK m. 32/1'deki ücrete ilaveten işçiye sağlanmış para ve para ile ölçülmesi mümkün akdi ve kanundan doğan menfaatler de gözetilir. Düzenli yemek yardımı bu kapsamdadır; Hukuk Genel Kurulu da yemek ve yol yardımını ücretin eki saymıştır.
olaylar:
  - olay: |
      A Tekstil Ltd. Şti.'nde çalışan üç işçi şu durumdadır. İlgili dönemde bir hizmet yılı için kıdem tazminatı tavanının **45.000 TL** olduğunu varsayınız.

      Mert, 5 yıl 6 ay çalışmıştır. İşveren, Mert'in yeterliliğinin işin gerektirdiği düzeyde olmadığı gerekçesiyle bildirim süresine uyarak İK m. 18'e göre iş sözleşmesini feshetmiştir. Mert'in aylık çıplak brüt ücreti 30.000 TL, yemek yardımı 3.000 TL, yol yardımı 1.500 TL'dir; ayrıca yılda bir kez ödenen 60.000 TL ikramiye almaktadır.

      Selin, 8 yıl çalışmış, işveren tarafından İK m. 18'e dayanılarak çıkarılmıştır. Giydirilmiş aylık ücreti 70.000 TL'dir.

      Gülsüm, 3 yıldır çalışan kadın işçidir. 1 Mart'ta evlenmiş, 1 Aralık'ta kendi arzusuyla ayrılmıştır. Giydirilmiş aylık ücreti 25.000 TL'dir.

      1. Her işçinin kıdem tazminatına hak kazanıp kazanmadığını değerlendiriniz.
      2. Mert, Selin ve Gülsüm'ün brüt kıdem tazminatını hesaplayınız.
      3. Faiz ve zamanaşımı bakımından işçilerin durumunu belirtiniz.
    olcut:
      - {tespit: "Mert işveren feshiyle (İK m. 25/II dışı) ayrıldığından ve bir yılı aştığından kıdem tazminatına hak kazanır", puan: 15, madde: "1475 sayılı Kanun m. 14"}
      - {tespit: "Mert'in giydirilmiş ücreti: 30.000 + 3.000 + 1.500 + 60.000/12 = 39.500 TL", puan: 20, madde: "İK m. 32"}
      - {tespit: "Mert'in tazminatı: 5,5 yıl × 39.500 = 217.250 TL, tavan aşılmıyor", puan: 15, madde: "1475 sayılı Kanun m. 14"}
      - {tespit: "Selin'in ücreti tavanı aştığından her yıl için 45.000 TL esas alınır: 8 × 45.000 = 360.000 TL", puan: 20, madde: "1475 sayılı Kanun m. 14"}
      - {tespit: "Gülsüm evlilikten itibaren bir yıl içinde kendi arzusuyla ayrıldığı için hak kazanır: 3 × 25.000 = 75.000 TL", puan: 20, madde: "1475 sayılı Kanun m. 14"}
      - {tespit: "Mevduata uygulanan en yüksek faiz; zamanaşımı beş yıl (ek 3)", puan: 10, madde: "1475 sayılı Kanun m. 14"}
    cozum: |
      **Nitelendirme:** Üç olayda da sorun, 1475 sayılı Kanun m. 14 kapsamında hak kazanma ve tutarın hesabıdır. Mert ve Selin'de sözleşme işveren tarafından geçerli sebeple, yani İK m. 25/II dışındaki bir sebeple feshedilmiştir. Gülsüm'de ayrılma kadın işçinin evlilikten sonraki bir yıl içinde kendi arzusuyla sona erdirmesi hâlidir.

      **Hukuki sorunlar:** (1) Hak doğuran hâl var mı? (2) Giydirilmiş ücret ve tavan nasıl uygulanır? (3) Faiz ve zamanaşımı.

      **İlgili hükümler:** 1475 sayılı Kanun m. 14/1'e göre işveren tarafından İK m. 25/II dışındaki sebeplerle fesih ve kadının evlendiği tarihten itibaren bir yıl içinde kendi arzusuyla ayrılması kıdem tazminatı doğurur; her geçen tam yıl için 30 günlük ücret, artan süreler için aynı oran uygulanır. Hesap giydirilmiş ücret üzerinden yapılır (İK m. 32/1 ücrete ilaveten sağlanan para ve para ile ölçülebilen menfaatler). Yıllık miktar, azami emeklilik ikramiyesi (tavan) ile sınırlıdır. Kıdem tazminatında zamanaşımı beş yıldır (İK'nın ek 3. maddesi).

      **Değerlendirme:** Mert'in aylık giydirilmiş ücreti 30.000 + 3.000 + 1.500 + (60.000 / 12 = 5.000) = 39.500 TL'dir; tavanın altındadır. Beş tam yıl için 5 × 39.500 = 197.500 TL ve artan altı ay için 39.500'ün yarısı olan 19.750 TL eklenir; toplam 217.250 TL. Selin'in ücreti (70.000 TL) varsayılan tavanı (45.000 TL) aştığından her hizmet yılı için tavan esas alınır; 8 × 45.000 = 360.000 TL. Gülsüm'ün ücreti tavanın altındadır; 3 × 25.000 = 75.000 TL.

      **Sonuç:** Mert 217.250 TL, Selin 360.000 TL ve Gülsüm 75.000 TL brüt kıdem tazminatı alır. Ödenmeyen kısım için mahkeme mevduata uygulanan en yüksek faize hükmeder; iş sözleşmelerinin sona ermesinden itibaren beş yıl geçince alacaklar zamanaşımına uğrar.
  - olay: |
      B Ltd. Şti.'nde şu üç olay yaşanmıştır. İlgili dönemde tavanın 60.000 TL olduğunu varsayınız.

      Ali, 12 yıl çalışmış; yaşlılık aylığına hak kazandığını ve kuruma başvurduğunu gösteren belgeyi işverene sunarak iş sözleşmesini feshetmiştir. Son giydirilmiş aylık ücreti 50.000 TL'dir.

      Kemal, 10 yıl çalıştıktan sonra "daha iyi bir iş buldum" diyerek istifa etmiştir; haklı bir sebep ileri sürmemiştir.

      Ayşe, X Ltd. Şti.'nde 3 yıl çalışmış (devir anındaki ücreti 15.000 TL), işyeri Y A.Ş.'ye devredilmiş, Y A.Ş.'de 4 yıl daha çalışmıştır. Y A.Ş., İK m. 18'e dayanarak Ayşe'yi çıkarmıştır; son giydirilmiş ücreti 40.000 TL'dir.

      Ayrıca Cengiz, işverene karşı İK m. 24'e dayanan haklı fesihle 15 Mart 2019'da ayrılmış, kıdem tazminatı için ilk kez Mart 2025'te arabulucuya başvurmuş, anlaşma sağlanamayınca 20 Nisan 2025'te dava açmış, işveren zamanaşımı def'ini ileri sürmüştür.

      1. Ali, Kemal ve Ayşe'nin durumunu değerlendiriniz.
      2. Ayşe'nin tazminatı ile iki işverenin sorumluluğunu belirleyiniz.
      3. Cengiz'in davasının sonucunu belirtiniz.
    olcut:
      - {tespit: "Ali aylık/toptan ödemeye hak kazanıp kuruma başvurduğunu belgelediğinden hak kazanır", puan: 20, madde: "1475 sayılı Kanun m. 14"}
      - {tespit: "Ali: 12 × 50.000 = 600.000 TL (tavan aşılmıyor)", puan: 10, madde: "1475 sayılı Kanun m. 14"}
      - {tespit: "Kemal haklı sebepsiz istifa ettiğinden kıdem tazminatı alamaz", puan: 15, madde: "1475 sayılı Kanun m. 14"}
      - {tespit: "Ayşe'nin süreleri birleşir: 7 yıl × 40.000 = 280.000 TL", puan: 20, madde: "1475 sayılı Kanun m. 14"}
      - {tespit: "Devreden işveren kendi çalıştırdığı süre ve devirdeki ücret seviyesiyle sınırlı sorumlu: 3 × 15.000 = 45.000 TL'yi aşmaz", puan: 20, madde: "1475 sayılı Kanun m. 14"}
      - {tespit: "Cengiz'in alacağı beş yıllık zamanaşımını aştığından def'i halinde talep reddedilir", puan: 15, madde: "İK'nın ek 3. maddesi"}
    cozum: |
      **Nitelendirme:** Olaylar kıdem tazminatının farklı hak kazanma biçimlerini içerir: emeklilik amacıyla ayrılma (Ali), istifa (Kemal), işyeri devri ve kıdem birleşmesi (Ayşe), zamanaşımı (Cengiz).

      **Hukuki sorunlar:** (1) Her işçide hak doğuran hâl var mı? (2) Devirde işverenlerin sorumluluğu. (3) Cengiz'in alacağı zamanaşımına uğramış mı?

      **İlgili hükümler:** 1475 sayılı Kanun m. 14/1-4: yaşlılık, emeklilik, malullük aylığı veya toptan ödeme almak amacıyla ayrılma; işçi aylık veya toptan ödemeye hak kazandığını ve ilgili kuruma başvurduğunu belgelemelidir. İstifa kıdem tazminatı doğuran hâller arasında sayılmaz (Yargıtay Hukuk Genel Kurulu kararlarında da böyle kabul edilir). İşyeri devrinde kıdem, hizmet sürelerinin toplamı üzerinden hesaplanır; her iki işveren sorumludur, devreden işverenin sorumluluğu çalıştırdığı sürelerle ve devir esnasındaki ücret seviyesiyle sınırlıdır. İK'nın ek 3. maddesi zamanaşımını beş yıl olarak belirler.

      **Değerlendirme:** Ali belgelerle emeklilik şartını göstermiştir; 12 × 50.000 = 600.000 TL tavan altında olduğundan bu tutar hesaplanır. Kemal'in istifasında 1475 sayılı Kanun m. 14'te sayılan bir hâl yoktur. Ayşe'nin X'te geçen 3 yılı ile Y'de geçen 4 yılı birleşir; Y A.Ş. 7 × 40.000 = 280.000 TL'nin tamamından sorumludur. X Ltd. Şti. ise m. 14'e göre yalnız çalıştırdığı 3 yıl ve devirdeki ücret seviyesi ölçüsünde sorumludur; bu ölçü 3 × 15.000 = 45.000 TL'yi aşmaz. Cengiz'in sözleşmesi 2019'da sona ermiş; dava şartı olan arabulucuya başvuru da dava da 2025'te yapılmıştır. Arabulucuya başvuru, zamanaşımı zaten dolduktan sonra yapıldığından sonucu değiştirmez; aradan beş yıldan fazla geçtiğinden alacak zamanaşımına uğramıştır.

      **Sonuç:** Ali 600.000 TL alır; Kemal alamaz; Ayşe 280.000 TL'yi Y A.Ş.'den isteyebilir, X Ltd. 45.000 TL'yi aşmayan kısımdan birlikte sorumludur; Cengiz'in davası, zamanaşımı def'i süresinde ileri sürüldüğü için reddedilir.
kartlar:
  - on: "Kıdem tazminatı hangi kanun maddesinde?"
    arka: "1475 sayılı Kanun m. 14; İK m. 120 onu yürürlükte tutar."
  - on: "Kıdem tazminatı doğuran 7 hal?"
    arka: "İşveren feshi (İK m. 25/II hariç), İK m. 24 işçi feshi, muvazzaf askerlik, emeklilik/malullük/toptan ödeme, yaş dışı şartlarla ayrılma, kadının evlilikten sonra 1 yıl içinde ayrılması, ölüm."
  - on: "Kıdem tazminatı miktarı?"
    arka: "Her tam yıl için 30 günlük giydirilmiş ücret; artan süreler aynı oranla ödenir."
  - on: "Giydirilmiş ücret?"
    arka: "Çıplak ücret + para veya para ile ölçülebilen akdi ve kanundan doğan menfaatler (1475 sayılı Kanun m. 14/11, İK m. 32/1)."
  - on: "Ücret sabit değilse hesap?"
    arka: "Son bir yılda ödenen ücret / o sürede çalışılan gün sayısı ortalaması esas alınır."
  - on: "Kıdem tazminatı tavanı?"
    arka: "En yüksek Devlet memurunun bir hizmet yılı için azami emeklilik ikramiyesi; 30 günlük süre artırılsa da aşılamaz. Tutar dönemlere göre değişir."
  - on: "Kıdem tazminatında zamanaşımı?"
    arka: "5 yıl (İK'nın ek 3. maddesi)."
  - on: "Kıdem tazminatında faiz?"
    arka: "Mevduata uygulanan en yüksek faiz; temerrüt kıdem tazminatında fesih tarihinde başlar."
  - on: "İstifa kıdem tazminatı doğurur mu?"
    arka: "Kural olarak hayır; işverenin iyi niyetle ödeme yapması istifayı fesihe çevirmez."
  - on: "İşyeri devrinde sorumluluk?"
    arka: "Devreden ve devralan işveren sorumlu; devreden yalnız çalıştırdığı süre ve devirdeki ücret seviyesiyle sınırlı."
  - on: "Emeklilik nedeniyle ayrılırken neyi belgelemek gerekir?"
    arka: "Aylık veya toptan ödemeye hak kazandığını ve ilgili kuruma başvurduğunu; ölümde aranmaz."
  - on: "Kadın işçinin evlilik nedeniyle ayrılması?"
    arka: "Evlendiği tarihten itibaren bir yıl içinde kendi arzusuyla ayrılırsa kıdem tazminatı alır."
