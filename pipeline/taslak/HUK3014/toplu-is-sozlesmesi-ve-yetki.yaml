  - 📌 TİS'e aykırı iş sözleşmesi hükmünün yerini TİS alır; TİS'e göre **işçi yararına** olan iş sözleşmesi hükmü geçerlidir (STİSK m. 36/1).
  - ⚠️ Art etki yalnız **iş sözleşmesine ilişkin** (normatif) hükümler için; yenisi yürürlüğe girinceye kadar sürer (STİSK m. 36/2).
  - 📌 İmzada üye olan **yürürlükten**, imzadan sonra üye olan **işverene bildirim tarihinden** itibaren yararlanır (STİSK m. 39/2).
  - 📌 Dayanışma aidatı: sendika onayı **aranmaz**, **talep tarihinden** geçerli, miktar **üyelik aidatından fazla olamaz** (STİSK m. 39/4-5).
  - ⚠️ İşveren vekilleri ve işvereni görüşmelerde temsil edenler TİS'ten yararlanamaz (STİSK m. 39/7).
  - 📌 Teşmil: Cumhurbaşkanı + Yüksek Hakem Kurulu görüşü; yalnız **TİS bulunmayan** işyerlerine; **borç doğuran hükümler ve özel hakem hükümleri teşmil edilemez**; geçmişe yürürlük yok (STİSK m. 40).
  - 📌 Yetki: işkolunda **%1** + işyerinde **yarıdan fazlası** / işletmede **%40**; işletmede birden çok sendika %40'ı aşarsa **en çok üyeli** olan yetkilidir (STİSK m. 41/1-3).
  - 📌 Tespit yazısına itiraz **6 iş günü**; işkolunda %1'den az üyesi olan sendika itiraz edemez (STİSK m. 43/1-2).
  - 📌 Yetki belgesinden sonra çağrı **15 gün**; işçi sendikası çağrıdan itibaren **30 gün** içinde ilk toplantıya gelmezse yetkisi düşer; görüşme süresi **60 gün** (STİSK m. 46-47).
doktrin: |
  ### Art etkinin kapsamı
  STİSK m. 36/2, sona eren TİS'in iş sözleşmesine ilişkin hükümlerinin yenisi yürürlüğe girinceye kadar iş sözleşmesi hükmü olarak devam edeceğini söyler. Metin, art etkiden kimlerin yararlanacağını açıkça belirtmez. Bir görüşe göre art etki, TİS sona erdiği sırada o TİS'ten yararlanmakta olan işçilerin iş sözleşmelerini dondurur; sonradan işe girenlerin sözleşmeleri bu hükümlerle bağlı değildir. Karşı görüş, normatif hükümlerin işyerindeki çalışma düzenini belirlediğini, bu yüzden aynı işyerinde sonradan işe giren işçileri de kapsaması gerektiğini ileri sürer. Konu tartışmalıdır; sınav olaylarında sonuç buna dayandırılmamalıdır.

  ### Borç doğuran hükümlerin niteliği
  TİS, hem iş sözleşmelerine doğrudan etki eden normatif hükümler hem de yalnızca taraf sendika ile işveren (veya işveren sendikası) arasında bağlayıcı olan borç doğuran hükümler içerir. Normatif hükümlerin işçi için bir tür kural gibi uygulandığı, borç doğuran hükümlerin ise sözleşme hukuku mantığıyla yorumlandığı genel olarak kabul edilir. Buna bağlı olarak teşmil (STİSK m. 40/5) ve art etki (STİSK m. 36/2) yalnız normatif kısımla ilgilidir. Hangi hükmün hangi gruba girdiği, TİS metninin amacına ve yazılış biçimine göre belirlenir; bu ayrım çoğu kez yorum sorunudur ve her TİS'te açık bir etiket bulunmaz.

  ### Dayanışma aidatı ve olumsuz sendika özgürlüğü
  Sendikaya üye olmayanların TİS'ten yalnızca dayanışma aidatı ödeyerek yararlanabilmesi, olumsuz sendika özgürlüğüyle ilişkili bir tartışmadır. Bir yaklaşım, aidatı bir tür "emeğe katılma payı" sayıp serbest iradeyle ödendiği için sorunsuz görür. Diğer yaklaşım, yararlanmayı bir ödemeye bağlamanın sendikasız kalan işçiyi dolaylı biçimde sendikaya yöneltebileceğini söyler. Kanun koyucu, sendika onayı aranmamasını ve aidat miktarının üyelik aidatını aşmamasını öngörerek dengeyi sağlamaya çalışmıştır (STİSK m. 39/4-5).
sozluk:
  - terim: Toplu iş sözleşmesi (TİS)
    tanim: "İşçi sendikası ile işveren sendikası veya sendikasız işveren arasında, iş sözleşmesinin yapılması, içeriği ve sona ermesini düzenleyen sözleşme (STİSK m. 2/1-h)."
  - terim: Normatif hüküm
    tanim: "İş sözleşmelerinin yapılması, içeriği ve sona ermesine ilişkin, bireysel iş ilişkilerine doğrudan etki eden TİS hükmü (STİSK m. 33/1)."
  - terim: Borç doğuran hüküm
    tanim: "Tarafların karşılıklı hak ve borçlarını, uygulama ve denetimi, uyuşmazlık çözüm yollarını düzenleyen TİS hükmü (STİSK m. 33/2)."
  - terim: İşletme TİS
    tanim: "Aynı işverene ait aynı işkolundaki birden çok işyerini kapsayan, bu durumda zorunlu olan TİS düzeyi (STİSK m. 34/2)."
  - terim: Grup TİS
    tanim: "İşçi sendikası ile işveren sendikası arasında, birden çok üye işverenin aynı işkolundaki işyerlerini kapsamak üzere, tarafların anlaşmasıyla yapılan TİS (STİSK m. 34/3)."
  - terim: Art etki
    tanim: "Sona eren TİS'in iş sözleşmesine ilişkin hükümlerinin yenisi yürürlüğe girinceye kadar iş sözleşmesi hükmü olarak sürmesi (STİSK m. 36/2)."
  - terim: Dayanışma aidatı
    tanim: "Sendikasız işçinin TİS'ten yararlanmak için taraf sendikaya ödediği, üyelik aidatını aşmayan aidat (STİSK m. 39/4-5)."
  - terim: Teşmil
    tanim: "Cumhurbaşkanı kararıyla bir TİS'in TİS bulunmayan işyerlerine yaygınlaştırılması (STİSK m. 40)."
  - terim: Yetki belgesi
    tanim: "Bakanlıkça, yetki şartlarını taşıyan ve tespiti kesinleşen sendikaya verilen TİS yapma yetkisini gösteren belge (STİSK m. 44)."
  - terim: Çerçeve sözleşme
    tanim: "Ekonomik ve Sosyal Konseyde temsil edilen konfederasyonlara üye işçi ve işveren sendikaları arasında işkolu düzeyinde yapılan sözleşme (STİSK m. 2/1-b)."
