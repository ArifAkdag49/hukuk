sorular:
  - soru: |
      Toplu iş sözleşmesinin şekli ve süresi hakkında hangisi doğrudur?
    siklar:
      - "Sözleşme yazılı yapılır; süresi en az bir, en çok üç yıldır"
      - "Sözleşme sözlü de yapılabilir; süresi en çok beş yıldır"
      - "Sözleşme yazılı yapılır; süresi en az iki, en çok dört yıldır"
      - "Sözleşme noter onayıyla yapılır; süresi sınırsızdır"
    dogru: 0
    aciklama: |
      STİSK m. 35/1 TİS'in yazılı yapılacağını, STİSK m. 35/2 ise en az bir ve en çok üç yıl süreli olacağını söyler. Faaliyeti bir yıldan az süren işler için istisna vardır (STİSK m. 35/3).
  - soru: |
      X Ltd. Şti. ve yetkili sendika, iki yıllık bir TİS imzalamıştır. Bir yıl sonra taraflar, anlaşarak sözleşmenin süresini üç yıla çıkarmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Taraflar anlaşırsa süre üç yıla çıkarılabilir"
      - "Süre, imzadan sonra taraflarca uzatılamaz"
      - "Süre ancak mahkeme izniyle uzatılabilir"
      - "Süre ancak işçilerin salt çoğunluğunun onayıyla uzatılabilir"
    dogru: 1
    aciklama: |
      STİSK m. 35/2'ye göre TİS'in süresi, sözleşmenin imzalanmasından sonra taraflarca uzatılamaz, kısaltılamaz ve sözleşme süresinden önce sona erdirilemez. Üç yıllık üst sınıra uyulması yeterli değildir; imzadan sonra değiştirme yoktur.
  - soru: |
      Yürürlükteki bir TİS'in sona ermesinden önce yeni sözleşme için yetki başvurusu en erken ne zaman yapılabilir?
    siklar:
      - "Sona ermeden önceki doksan gün içinde"
      - "Sona ermeden önceki yüz yirmi gün içinde"
      - "Sona ermeden önceki altı ay içinde"
      - "Yalnızca sona erdikten sonra"
    dogru: 1
    aciklama: |
      STİSK m. 35/4, TİS süresinin bitmesinden önceki yüz yirmi gün içinde yeni sözleşme için yetki başvurusu yapılabileceğini söyler. Yapılacak TİS önceki sözleşme sona ermedikçe yürürlüğe giremez.
  - soru: |
      Bir TİS sona ermiştir ve yenisi henüz yürürlüğe girmemiştir. Sona eren TİS'in hangi hükümleri devam eder?
    siklar:
      - "Hiçbir hüküm devam etmez"
      - "Yalnızca sendikaya oda tahsisine ilişkin hükümler devam eder"
      - "İş sözleşmesine ilişkin hükümler, yenisi yürürlüğe girinceye kadar iş sözleşmesi hükmü olarak devam eder"
      - "Bütün hükümler, süresiz olarak devam eder"
    dogru: 2
    aciklama: |
      STİSK m. 36/2'ye göre sona eren TİS'in iş sözleşmesine ilişkin hükümleri yenisi yürürlüğe girinceye kadar iş sözleşmesi hükmü olarak devam eder. Borç doğuran hükümler bu şekilde devam etmez.
  - soru: |
      Ayşe'nin iş sözleşmesinde aylık ücret 40.000 TL olarak kararlaştırılmıştır. Yetkili sendikanın yaptığı ve Ayşe'ye de uygulanan TİS'te aynı iş için 35.000 TL öngörülmüş, TİS'te iş sözleşmesine aykırılığa ilişkin ayrıca bir düzenleme yoktur. Hangisi doğrudur?
    siklar:
      - "TİS hükmü uygulanır; Ayşe'nin ücreti 35.000 TL'ye iner"
      - "İş sözleşmesindeki işçi yararına hüküm geçerlidir"
      - "İş sözleşmesi geçersiz sayılır"
      - "Ücreti işveren belirler"
    dogru: 1
    aciklama: |
      STİSK m. 36/1'e göre TİS'te iş sözleşmesine aykırı hükümler bulunması hâlinde iş sözleşmesinin işçi yararına olan hükümleri geçerlidir. TİS işçi lehine asgari düzey koyar; aleyhe düşürmez.
  - soru: |
      Bir şirketin aynı işkolunda 12 mağazası vardır. Hangi düzeyde TİS yapılabilir?
    siklar:
      - "Her mağaza için ayrı işyeri TİS'i yapılabilir"
      - "Yalnızca işletme düzeyinde TİS yapılabilir"
      - "Yalnızca grup TİS yapılabilir"
      - "TİS yapılamaz; yalnızca iş sözleşmesi yapılabilir"
    dogru: 1
    aciklama: |
      STİSK m. 34/2'ye göre bir gerçek ve tüzel kişiye ya da kamu kurumuna ait aynı işkolunda birden çok işyeri bulunuyorsa TİS ancak işletme düzeyinde yapılabilir. Grup TİS ise işveren sendikasıyla, tarafların anlaşması üzerine yapılır (STİSK m. 34/3).
  - soru: |
      Mehmet, 1 Mart'ta imzalanan ve 1 Nisan'da yürürlüğe giren TİS'in imza tarihinde taraf sendikanın üyesi değildir. 10 Mayıs'ta taraf sendikaya üye olmuş ve sendika bu üyeliği 15 Mayıs'ta işverene bildirmiştir. Mehmet TİS'ten hangi tarihten itibaren yararlanır?
    siklar:
      - "1 Mart'tan itibaren"
      - "1 Nisan'dan itibaren"
      - "10 Mayıs'tan itibaren"
      - "15 Mayıs'tan itibaren"
    dogru: 3
    aciklama: |
      STİSK m. 39/2'ye göre imza tarihinden sonra üye olanlar, üyeliklerinin taraf işçi sendikasınca işverene bildirildiği tarihten itibaren yararlanır. Üyeliğin başladığı tarih (10 Mayıs) değil, işverene bildirildiği tarih (15 Mayıs) esastır.
  - soru: |
      Dayanışma aidatı ile TİS'ten yararlanmaya ilişkin hangisi doğrudur?
    siklar:
      - "Taraf sendikanın onayı şarttır"
      - "Sendika onayı aranmaz; yararlanma talep tarihinden geçerlidir ve aidat üyelik aidatından fazla olamaz"
      - "Aidat işverence belirlenir"
      - "Yalnızca sendikaya üye olanlar yararlanabilir"
    dogru: 1
    aciklama: |
      STİSK m. 39/4'e göre dayanışma aidatı ödeyerek yararlanma için işçi sendikasının onayı aranmaz ve yararlanma talep tarihinden geçerlidir. STİSK m. 39/5'e göre aidat miktarı üyelik aidatından fazla olmamak kaydıyla tüzükte belirlenir.
  - soru: |
      Teşmil hakkında hangisi doğrudur?
    siklar:
      - "TİS'in bütün hükümleri, borç doğuran hükümler dahil, teşmil edilebilir"
      - "Teşmil kararı Resmî Gazete'de yayım tarihinden önceki bir tarihte yürürlüğe girebilir"
      - "Yetkili makam Cumhurbaşkanıdır; borç doğuran hükümler ve özel hakeme başvuru hükümleri teşmil edilemez"
      - "Teşmil yalnızca TİS bulunan işyerlerine yapılır"
    dogru: 2
    aciklama: |
      STİSK m. 40/1'e göre teşmil yetkisi Cumhurbaşkanına aittir ve yalnız TİS bulunmayan işyerlerine uygulanır. STİSK m. 40/5'e göre tarafların hak ve borçlarını düzenleyen hükümler ile özel hakeme başvuru hükümleri teşmil edilemez; yürürlük tarihi de yayım tarihinden önce olamaz (STİSK m. 40/2).
  - soru: |
      İşçi sendikasının yetkili sayılması için hangisi gereklidir?
    siklar:
      - "İşkolunda işçilerin en az yüzde onu ile işyerinde işçilerin yüzde yirmi beşinin üye olması"
      - "İşkolunda işçilerin en az yüzde birinin üye olması ile işyerinde işçilerin yarıdan fazlasının, işletmede yüzde kırkının üye olması"
      - "İşkolunda işçilerin yüzde üçü ile işyerinde işçilerin yarıdan fazlasının üye olması"
      - "Yalnızca işyerinde işçilerin yarıdan fazlasının üye olması"
    dogru: 1
    aciklama: |
      STİSK m. 41/1 çifte baraj öngörür: işkolunda en az yüzde bir ve işyerinde yarıdan fazlası, işletmede yüzde kırk. Yüzde üç oranı eski düzenlemeden kalmadır; metin güncel olarak yüzde bir yazar.
  - soru: |
      M AŞ'nin aynı işkolundaki mağazalarında 1.000 işçi çalışmaktadır. İşkolu barajını aşan A Sendikasının 430, B Sendikasının 410 üyesi vardır. İşletme TİS için hangi sendika yetkilidir?
    siklar:
      - "Hiçbiri; yarıdan fazla üye aranır"
      - "A Sendikası; başvuru tarihinde en çok üyeye sahip olduğu için"
      - "B Sendikası; sonradan başvurduğu için"
      - "İkisi birlikte yetkilidir"
    dogru: 1
    aciklama: |
      İşletmede aranan oran yüzde kırktır (STİSK m. 41/1). İşletmede birden çok sendikanın yüzde kırk veya fazla üyesi varsa başvuru tarihinde en çok üyeye sahip sendika yetkilidir (STİSK m. 41/3). A Sendikasının üyesi daha çoktur.
  - soru: |
      Yetki belgesini alan işçi sendikası, belgenin alınmasından itibaren on beş gün içinde karşı tarafı toplu görüşmeye çağırmamış, işveren de çağırmamıştır. Sonuç nedir?
    siklar:
      - "Yetki belgesinin hükmü kalmaz"
      - "Yetki belgesi bir yıl daha geçerli kalır"
      - "İşveren sendikayı çağırmak zorundadır, aksi takdirde ceza alır"
      - "Mahkeme çağrıyı kendiliğinden yapar"
    dogru: 0
    aciklama: |
      STİSK m. 46/1'e göre taraflardan biri yetki belgesinin alındığı tarihten itibaren on beş gün içinde karşı tarafı toplu görüşmeye çağırır; bu süre içinde çağrı yapılmazsa yetki belgesinin hükmü kalmaz (STİSK m. 46/2). Kanunda süreyi uzatan ya da çağrıyı yalnız işverene yükleyen bir düzenleme yoktur.
olaylar:
  - olay: |
      Marketler AŞ, aynı işkolundaki 12 mağazasında toplam 1.000 işçi çalıştırmaktadır. İşkolu barajını aşan A Sendikasının 430, B Sendikasının 410 üyesi vardır. Her iki sendika da başvuruda bulunmuştur.

      A Sendikası, Bakanlığın olumlu tespitinden ve yetki belgesinden sonra çağrıyı yapmış, taraflar 2 yıllık bir işletme TİS'i 15 Aralık 2025'te imzalamışlardır. TİS 1 Ocak 2026'da yürürlüğe girmiştir.

      İşçilerden Ali imza tarihinde A Sendikasının üyesidir ve işyerinde çalışmaya devam etmektedir. Ayşe, 1 Mart 2026'da A Sendikasına üye olmuş ve sendika bunu işverene 10 Mart 2026'da bildirmiştir. Zeynep sendikasızdır ve 1 Nisan 2026'da A Sendikasına dayanışma aidatı ödeyerek TİS'ten yararlanmak istediğini bildirmiştir. Mehmet, işletmenin bütününü yöneten genel müdürdür ve TİS görüşmelerinde işvereni temsil etmiştir. Taraflar sonradan sözleşmeyi 4 yıla çıkarmayı kararlaştırmışlardır.

      1. İşletme TİS yapılabilir mi, hangi sendika yetkilidir?
      2. Ali, Ayşe ve Zeynep TİS'ten hangi tarihlerden itibaren yararlanır?
      3. Mehmet TİS'ten yararlanabilir mi?
      4. Süre değişikliği geçerli midir?
    olcut:
      - {tespit: "Aynı işverenin aynı işkolunda birden çok işyeri olduğundan TİS ancak işletme düzeyinde yapılabilir", puan: 15, madde: "STİSK m. 34/2"}
      - {tespit: "İşletmede yüzde kırk barajı; iki sendika da aşıyor, başvuru tarihinde en çok üyesi olan A yetkilidir", puan: 20, madde: "STİSK m. 41/1 ve STİSK m. 41/3"}
      - {tespit: "İmzada üye olan Ali yürürlük tarihinden (1 Ocak 2026) itibaren yararlanır", puan: 15, madde: "STİSK m. 39/2"}
      - {tespit: "İmzadan sonra üye olan Ayşe, işverene bildirim tarihinden (10 Mart 2026) itibaren yararlanır", puan: 15, madde: "STİSK m. 39/2"}
      - {tespit: "Zeynep dayanışma aidatıyla, sendika onayı aranmadan, talep tarihinden (1 Nisan 2026) yararlanır", puan: 15, madde: "STİSK m. 39/4"}
      - {tespit: "İşvereni temsilen görüşmelere katılan Mehmet TİS'ten yararlanamaz; süre imzadan sonra uzatılamaz ve üç yılı aşamaz", puan: 20, madde: "STİSK m. 39/7 ve STİSK m. 35/2"}
    cozum: |
      **Nitelendirme:** Olay, TİS'in düzeyi, yetki, yararlanma ve süre sorunlarını birlikte içeriyor.

      **Hukuki sorunlar:** (1) TİS düzeyi, (2) yetkili sendika, (3) üyelerin ve sendikasızların yararlanma başlangıcı, (4) işvereni temsil edenin durumu, (5) süre değişikliği.

      **İlgili hükümler ve değerlendirme:** STİSK m. 34/2'ye göre aynı işverenin aynı işkolundaki birden çok işyerinin bulunduğu hâllerde TİS ancak işletme düzeyinde yapılabilir; mağaza bazında ayrı TİS yapılamaz. İşletmede yetki için işçilerin yüzde kırkının üye olması gerekir (STİSK m. 41/1). Her iki sendika da bu oranı aştığından STİSK m. 41/3 uyarınca başvuru tarihinde en çok üyeye sahip sendika, yani 430 üyeli A Sendikası yetkilidir.

      Yararlanma tarihleri STİSK m. 39'a göre belirlenir. İmza tarihinde taraf sendikaya üye olan Ali, yürürlük tarihinden itibaren, yani 1 Ocak 2026'dan itibaren yararlanır. İmzadan sonra üye olan Ayşe, üyeliğin taraf sendikaca işverene bildirildiği tarihten itibaren, yani 10 Mart 2026'dan itibaren yararlanır; üyeliğe başladığı 1 Mart değil, bildirim tarihi esastır (STİSK m. 39/2). Sendikasız Zeynep, taraf sendikaya dayanışma aidatı ödemek suretiyle yararlanabilir; bunun için sendikanın onayı aranmaz ve yararlanma talep tarihinden, yani 1 Nisan 2026'dan itibaren geçerlidir (STİSK m. 39/4). Aidat miktarı üyelik aidatını aşamaz (STİSK m. 39/5).

      Mehmet, TİS görüşmelerine işvereni temsilen katıldığı ve işveren vekili konumunda bulunduğu için TİS'ten yararlanamaz (STİSK m. 39/7).

      Süre bakımından STİSK m. 35/2, TİS'in süresinin imzalanmasından sonra taraflarca uzatılamayacağını ve en çok üç yıl olabileceğini söyler. İki yıllık sözleşmeyi dört yıla çıkaran anlaşma bu nedenle geçerli olmaz; üç yıla çıkarılması da imzadan sonra olduğu için mümkün değildir.

      **Sonuç:** İşletme TİS yapılır, A Sendikası yetkilidir; Ali 1 Ocak 2026'dan, Ayşe 10 Mart 2026'dan, Zeynep 1 Nisan 2026'dan itibaren yararlanır; Mehmet yararlanamaz; süre uzatımı geçersizdir.
  - olay: |
      Ege Tekstil AŞ'de çalışan işçilerin üye olduğu Tekstil-İş Sendikası, işkolunda çalışan işçilerin yüzde birinden fazlasını üye kaydetmiş durumdadır. Sendikanın başvurusu üzerine Bakanlık, işyerinde işçilerin yarıdan fazlasının sendika üyesi olduğunu tespit etmiş ve tespit yazısını sendikaya ve işverene tebliğ etmiştir. İşveren tebliğden sekiz iş günü sonra yetki tespitine itiraz etmiştir. Başka bir sendika olan Dokuma-Sen'in işkolunda yüzde birden daha az üyesi vardır; o da itiraz etmek istemektedir.

      Tekstil-İş yetki belgesini 3 Mart'ta almıştır. 10 Mart'ta işverene çağrı yapmıştır. Taraflar ilk toplantıyı 5 Nisan'da yapmışlardır. Görüşmeler sonunda TİS imzalanmış ve yürürlüğe girmiştir.

      Tekstil-İş, işkolunda en çok üyeye sahip sendikadır. Tekstil-İş, aynı işkolunda bulunan, TİS bulunmayan ve yetki başvurusu da yapılmamış Kuzey Tekstil Ltd. Şti.'nin işyerine Ege Tekstil'deki TİS'in teşmilini Cumhurbaşkanından talep etmektedir. Bu TİS'te sendikaya oda tahsisine ilişkin bir hüküm ve uyuşmazlıklarda özel hakem yoluna ilişkin bir hüküm vardır.

      1. İşverenin itirazı süresinde midir?
      2. Dokuma-Sen itiraz edebilir mi?
      3. Tekstil-İş çağrıyı süresinde yapmış mıdır, ilk toplantı süresinde midir, görüşme süresi ne kadardır?
      4. Teşmil mümkün müdür, kapsamı nedir?
    olcut:
      - {tespit: "Tespit yazısına itiraz süresi tebliğden itibaren altı iş günüdür; işverenin sekiz iş gün sonraki itirazı süresizdir", puan: 20, madde: "STİSK m. 43/1"}
      - {tespit: "İşkolunda yüzde birden az üyesi olan sendika yetki itirazında bulunamaz", puan: 15, madde: "STİSK m. 43/2"}
      - {tespit: "Çağrı yetki belgesinden itibaren on beş gün içinde yapıldığından süresindedir; ilk toplantı çağrıdan itibaren otuz gün içindedir", puan: 20, madde: "STİSK m. 46/1 ve STİSK m. 47/2"}
      - {tespit: "Toplu görüşme süresi ilk toplantı tarihinden itibaren altmış gündür", puan: 15, madde: "STİSK m. 47/3"}
      - {tespit: "Teşmil Cumhurbaşkanınca, Yüksek Hakem Kurulunun görüşü alınarak, TİS bulunmayan işyerine yapılabilir", puan: 15, madde: "STİSK m. 40/1"}
      - {tespit: "Borç doğuran hükümler (oda tahsisi) ve özel hakem hükmü teşmil edilemez", puan: 15, madde: "STİSK m. 40/5"}
    cozum: |
      **Nitelendirme:** Olay yetki tespitine itiraz, toplu görüşmeye çağrı ve görüşme süreleri ile teşmil sorunlarını içeriyor.

      **Hukuki sorunlar:** (1) İtiraz süresi, (2) itiraz ehliyeti, (3) çağrı süresi, (4) görüşme süresi, (5) teşmilin şartları ve kapsamı.

      **İlgili hükümler ve değerlendirme:** STİSK m. 43/1'e göre tespit yazısını alan taraflar, yazının tebliğ edildiği tarihten itibaren altı iş günü içinde mahkemeye itiraz edebilir. İşveren sekiz iş günü sonra itiraz ettiğinden süreyi kaçırmıştır; itirazı süre yönünden reddedilir. Bu tür süreye ilişkin itirazlar mahkemece altı iş günü içinde duruşma yapılmaksızın kesin olarak karara bağlanır (STİSK m. 43/3). Süre geçtikten sonra Bakanlık yetki belgesini verir (STİSK m. 44/1).

      Dokuma-Sen'in kurulu bulunduğu işkolunda çalışan işçilerin yüzde birinden daha az üyesi vardır. STİSK m. 43/2 bu durumdaki sendikanın yetki itirazında bulunamayacağını söyler; dolayısıyla Dokuma-Sen itiraz edemez.

      Toplu görüşmeye çağrı, yetki belgesinin alındığı tarihten itibaren on beş gün içinde yapılmalıdır; aksi hâlde yetki belgesinin hükmü kalmaz (STİSK m. 46/1-2). Tekstil-İş belgeyi 3 Mart'ta almış, çağrıyı 10 Mart'ta yapmıştır; çağrı süresindedir. İşçi sendikası, çağrı tarihinden itibaren otuz gün içinde yapılacak ilk toplantıya gelmezse yetkisi düşer (STİSK m. 47/2); ilk toplantı 5 Nisan'da, çağrıdan yirmi altı gün sonra yapıldığı için yetki düşmemiştir. Toplu görüşmenin süresi ilk toplantı tarihinden itibaren altmış gündür (STİSK m. 47/3); yani süre 5 Nisan'dan itibaren işler.

      Teşmil bakımından STİSK m. 40/1 uyarınca Cumhurbaşkanı, işkolunda en çok üyeye sahip sendikanın TİS'ini, talep üzerine ve Yüksek Hakem Kurulunun görüşünü aldıktan sonra, TİS bulunmayan işyerlerine teşmil edebilir. Talep, işkolundaki bir işçi sendikası olan Tekstil-İş'ten gelmiştir; işçilerin kendileri talep hakkı olanlar arasında sayılmaz. Kuzey Tekstil'de TİS bulunmadığı, yetki başvurusu da yapılmadığı (STİSK m. 40/6) ve Ege Tekstil'deki TİS işkolunda en çok üyeli sendikanın TİS'i olduğu için teşmilin şartları sağlanır. Teşmilde tarafların hak ve borçlarını düzenleyen oda tahsisi hükmü ile özel hakem hükmü kapsam dışı kalır (STİSK m. 40/5).

      **Sonuç:** İşverenin itirazı süresiz olduğu için reddedilir; Dokuma-Sen itiraz edemez; çağrı ve ilk toplantı süresindedir, görüşme süresi ilk toplantıdan itibaren altmış gündür; teşmil mümkündür ancak oda tahsisi ve özel hakem hükümlerini kapsamaz.
kartlar:
  - on: "TİS'in süresi ve şekli nedir?"
    arka: "Yazılı; en az bir, en çok üç yıl. İmzadan sonra uzatılamaz, kısaltılamaz (STİSK m. 35/1-2)."
  - on: "Yeni TİS için yetki başvurusu ne zaman yapılır?"
    arka: "Mevcut TİS'in bitiminden önceki 120 gün içinde; yeni TİS önceki sona ermeden yürürlüğe giremez (STİSK m. 35/4)."
  - on: "İşletme TİS ne zaman zorunludur?"
    arka: "Aynı işverenin aynı işkolunda birden çok işyeri varsa TİS ancak işletme düzeyinde yapılır (STİSK m. 34/2)."
  - on: "Grup TİS'in tarafları kimlerdir?"
    arka: "Bir işçi sendikası ile bir işveren sendikası; tarafların anlaşmasıyla, birden çok üye işverenin aynı işkolundaki işyerleri için (STİSK m. 34/3)."
  - on: "Yararlılık ilkesi nedir?"
    arka: "İş sözleşmesinin işçi yararına olan hükümleri, TİS'e aykırı olsa bile geçerlidir; aykırı diğer hükümlerin yerini TİS alır (STİSK m. 36/1)."
  - on: "Art etki nedir?"
    arka: "Sona eren TİS'in iş sözleşmesine ilişkin hükümleri, yenisi yürürlüğe girinceye kadar iş sözleşmesi hükmü olarak sürer (STİSK m. 36/2)."
  - on: "İmzadan sonra sendikaya üye olan işçi TİS'ten ne zaman yararlanır?"
    arka: "Üyeliğin taraf sendikaca işverene bildirildiği tarihten itibaren (STİSK m. 39/2)."
  - on: "Dayanışma aidatı şartları nelerdir?"
    arka: "Sendika onayı aranmaz; talep tarihinden geçerli; miktar üyelik aidatından fazla olamaz (STİSK m. 39/4-5)."
  - on: "Teşmili kim yapar, neler teşmil edilemez?"
    arka: "Cumhurbaşkanı, YHK görüşüyle, TİS bulunmayan işyerlerine. Borç doğuran hükümler ve özel hakem hükümleri teşmil edilemez (STİSK m. 40/1 ve STİSK m. 40/5)."
  - on: "Yetki için hangi barajlar aranır?"
    arka: "İşkolunda en az %1; işyerinde işçilerin yarıdan fazlası, işletmede %40. İşletmede birden çok sendika %40'ı aşarsa en çok üyeli yetkilidir (STİSK m. 41/1-3)."
  - on: "Yetki tespitine itiraz süresi nedir?"
    arka: "Tespit yazısının tebliğinden itibaren 6 iş günü. İşkolunda %1'den az üyesi olan sendika itiraz edemez (STİSK m. 43/1-2)."
  - on: "Toplu görüşmenin süre zinciri nasıldır?"
    arka: "Yetki belgesinden itibaren 15 gün içinde çağrı; çağrıdan itibaren 30 gün içinde işçi sendikası ilk toplantıya gelmezse yetkisi düşer; görüşme süresi ilk toplantıdan itibaren 60 gün (STİSK m. 46-47)."
