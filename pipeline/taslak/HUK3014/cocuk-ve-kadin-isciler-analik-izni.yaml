sorular:
  - soru: |
      Ortaokulu bitirmiş, 14 yaşını yeni doldurmuş Mehmet'in aşağıdaki işlerden hangisinde çalıştırılması İK m. 71 bakımından hukuka uygundur?
    siklar:
      - "Gelişmesine ve okuluna devamına engel olmayan hafif bir işte"
      - "Yer altı maden ocağında yardımcı işte"
      - "Haftada 45 saat çalışılan ağır bir vardiyalı işte"
      - "Kendi isteğiyle ve velisinin yazılı onayıyla her türlü işte"
    dogru: 0
    aciklama: |
      14 yaşını doldurmuş ve zorunlu ilköğretim çağını tamamlamış çocuk yalnızca hafif işlerde çalıştırılabilir (İK m. 71/1). Veli onayı veya çocuğun isteği yaş sınırını ya da hafif iş şartını ortadan kaldırmaz; yer altı işleri ise İK m. 72 nedeniyle 18 yaşını doldurmamış erkekler için yasaktır.
  - soru: |
      Zorunlu ilköğretimi tamamlamış ve örgün eğitime devam etmeyen 14 yaşındaki işçi için İK m. 71/4'e göre azami çalışma süresi aşağıdakilerden hangisidir?
    siklar:
      - "Günde 8, haftada 40 saat"
      - "Günde 7, haftada 35 saat"
      - "Günde 5, haftada 30 saat"
      - "Günde 2, haftada 10 saat"
    dogru: 1
    aciklama: |
      Örgün eğitime devam etmeyen çocuk günde 7, haftada 35 saatten fazla çalıştırılamaz (İK m. 71/4). 5/30 yalnız sanat, kültür ve reklam faaliyetleri içindir; 8/40 on beş yaşını tamamlamış çocuk için artırılabilen üst sınırdır; 2/10 okula devam edenler içindir.
  - soru: |
      Ortaokulu bitirip liseye devam eden 14 yaşındaki Ayşe, eğitim döneminde ders çıkışı bir fabrikada günde 4 saat, haftada 20 saat çalıştırılmaktadır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Süre, günde 7 ve haftada 35 saat sınırının altında olduğu için hukuka uygundur."
      - "Okula devam eden çocuk için eğitim saatleri dışında günde 2, haftada 10 saat sınırı aşıldığı için aykırıdır."
      - "Ayşe 15 yaşını doldurmadığı için hiçbir koşulda çalıştırılamaz."
      - "Günde 4 saat süre, sadece sanat ve kültür faaliyetlerinde uygundur."
    dogru: 1
    aciklama: |
      Okula devam eden çocukların eğitim dönemindeki çalışma süresi eğitim saatleri dışında olmak üzere en fazla günde iki ve haftada on saattir (İK m. 71/5). 7/35 sınırı örgün eğitime devam etmeyen çocuk içindir. Çocuk 15 yaşını doldurmasa da 14 yaşını doldurup ilköğretimi tamamladığı için hafif işlerde çalıştırılabilir (İK m. 71/1).
  - soru: |
      Maden mühendisi Elif, yer altı maden ocağında çalışmak istemekte, işveren de rıza göstermektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Rıza ve mühendislik unvanı varsa çalıştırılabilir."
      - "Yalnızca 18 yaşını doldurmamışsa çalıştırılamaz."
      - "İK m. 72 uyarınca her yaştaki kadınların yer altı işlerinde çalıştırılması yasaktır."
      - "Yasak yalnızca gebe ve emziren kadınlar için geçerlidir."
    dogru: 2
    aciklama: |
      İK m. 72, yer altında veya su altında çalışılacak işlerde 18 yaşını doldurmamış erkek ve her yaştaki kadınların çalıştırılmasını yasaklar. Madde rızaya veya unvana göre bir istisna öngörmez.
  - soru: |
      İK m. 73/1'e göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Sanayie ait işlerde 18 yaşını doldurmamış çocuk ve genç işçiler gece çalıştırılamaz."
      - "Tarım işlerinde 18 yaşını doldurmuş kadın işçiler gece hiç çalıştırılamaz."
      - "Gece çalışması yasağı yalnız 15 yaşını doldurmamış çocuklar içindir."
      - "Hizmet sektöründe de 21 yaşını doldurmamış herkes gece çalıştırılamaz."
    dogru: 0
    aciklama: |
      İK m. 73/1 gece yasağını sanayie ait işlerde 18 yaşını doldurmamış çocuk ve genç işçiler için koyar. Yetişkin kadın işçilerin gece postalarında çalıştırılmasının usul ve esasları ise yönetmelikte gösterilir (İK m. 73/2); Kanun mutlak yasak koymaz.
  - soru: |
      7578 sayılı Kanunla değişen İK m. 74/1'e göre normal (tek) gebelikte kadın işçinin çalıştırılmaması esas olan toplam süre aşağıdakilerden hangisidir?
    siklar:
      - "16 hafta (8 + 8)"
      - "18 hafta (8 + 10)"
      - "24 hafta (8 + 16)"
      - "26 hafta (10 + 16)"
    dogru: 2
    aciklama: |
      Doğumdan önce sekiz ve sonra on altı hafta, toplam yirmi dört haftadır (İK m. 74/1). 16 hafta eski toplam süredir; 26 hafta ise çoğul gebelikte doğum öncesi sürenin iki hafta artmasıyla bulunan toplamdır.
  - soru: |
      Sağlık durumu uygun olan kadın işçi doktor onayı ile doğumdan önce en fazla kaç haftaya kadar işyerinde çalışabilir ve çalıştığı süreler ne olur? (İK m. 74/1, 7578 sayılı Kanun sonrası)
    siklar:
      - "Doğumdan önceki iki haftaya kadar çalışabilir; çalıştığı süreler doğum sonrası sürelere eklenir."
      - "Doğumdan önceki üç haftaya kadar çalışabilir; çalıştığı süreler kaybolur."
      - "Doğumdan önceki iki haftaya kadar çalışabilir; çalıştığı süreler ücretsiz izne eklenir."
      - "Doğumdan önceki sekiz haftaya kadar çalışabilir; süreler ücret olarak ödenir."
    dogru: 0
    aciklama: |
      İK m. 74/1'e göre doktor onayı ve işçinin isteğiyle doğumdan önceki iki haftaya kadar çalışılabilir ve çalışılan süre doğum sonrası sürelere eklenir. Üç hafta, 7578 sayılı Kanun öncesindeki sınırdır.
  - soru: |
      Üçüncü çocuğunu doğuran ve doğum sonrası analık hâli izni biten Zeynep, İK m. 74/2'den yararlanmak istemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Haftalık çalışma süresinin yarısı kadar 60 gün ücretsiz izin kullanır ve bu sürede süt izni de kullanır."
      - "Haftalık çalışma süresinin yarısı kadar 180 gün ücretsiz izin kullanır; bu sürede süt izni uygulanmaz."
      - "Tam gün 120 gün ücretli izin kullanır."
      - "Haftalık çalışma süresinin yarısı kadar 120 gün ücretsiz izin kullanır; süt izni ayrıca işler."
    dogru: 1
    aciklama: |
      Birinci doğumda 60, ikincide 120, sonraki doğumlarda 180 gün haftalık çalışma süresinin yarısı kadar ücretsiz izin verilir; bu fıkradan yararlanılan sürede süt izni hükümleri uygulanmaz (İK m. 74/2). Üçüncü doğum "sonraki doğum"dur. Çoğul doğumda her bir süreye 30 gün eklenir.
  - soru: |
      Bir çocuğa koruyucu aile olan işçi Ali, çocuğun teslimi sonrası izin istemektedir. İK m. 74/1'e göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "8 hafta ücretli analık izni verilir."
      - "İsteği üzerine on gün ücretsiz izin verilir."
      - "24 hafta analık izni verilir."
      - "Koruyucu aile için hiçbir izin öngörülmemiştir."
    dogru: 1
    aciklama: |
      Bir veya daha fazla çocuğa koruyucu aile olan işçiye, çocuğun teslim edildiği tarihten sonra isteği üzerine on gün ücretsiz izin verilir (İK m. 74/1, 7578 sayılı Kanun). Sekiz haftalık analık hâli izni üç yaşını doldurmamış çocuğu evlat edinen içindir.
  - soru: |
      Ayşe 24 haftalık analık izni sonunda İK m. 74/6 uyarınca altı ay ücretsiz izin kullanmıştır. Bu iznin yıllık ücretli izin hakkı bakımından sonucu nedir?
    siklar:
      - "Altı ay yıllık izin hesabında çalışılmış gibi sayılır."
      - "Altı ay yıllık izin hakkının hesabında dikkate alınmaz."
      - "Altı ayın yalnızca yarısı yıllık izin hesabında sayılır."
      - "Yıllık izin hakkı bu süre içinde yeniden doğar."
    dogru: 1
    aciklama: |
      İK m. 74/6 son cümlesine göre isteğe bağlı ücretsiz izin süresi yıllık ücretli izin hakkının hesabında dikkate alınmaz. Buna karşılık doğumdan önce ve sonra çalıştırılmadığı 24 haftalık gün İK m. 55/1-b nedeniyle çalışılmış gibi sayılır.
  - soru: |
      Süt izni için aşağıdakilerden hangisi doğrudur? (İK m. 74/7)
    siklar:
      - "İki yaşından küçük çocuk için günde toplam iki saat verilir; saatleri işveren belirler."
      - "Bir yaşından küçük çocuk için günde toplam bir buçuk saat verilir; saatleri ve bölünmeyi işçi belirler; çalışma süresinden sayılır."
      - "Bir yaşından küçük çocuk için günde toplam bir saat verilir ve çalışma süresinden sayılmaz."
      - "Yalnız İş Kanunu kapsamındaki işçilere verilir."
    dogru: 1
    aciklama: |
      Bir yaşından küçük çocuğu emzirmek için günde toplam bir buçuk saat süt izni verilir; saatleri ve kaça bölüneceğini işçi belirler; süre günlük çalışma süresinden sayılır (İK m. 74/7, İK m. 66/1-e). İK m. 74/8 gereği hüküm kapsam dışı işçilere de uygulanır.
  - soru: |
      Zeynep'in çocuğu 5 yaşındadır ve ilköğretim çağı henüz başlamamıştır. İK m. 74'te öngörülen izinleri bitiren Zeynep, işverene bir ay önce yazılı başvurarak kısmi süreli çalışma talep etmiştir. Eşi de çalışmaktadır. Zeynep'in işi, yönetmelikte işverenin uygun bulmasına bağlanan işlerden değildir. İşveren, işin yoğunluğunu gerekçe göstererek talebi reddetmiştir. İK m. 13/5'e göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İşveren talebi karşılamak zorundadır; talep geçerli fesih nedeni sayılmaz."
      - "İşveren işin yoğunluğu nedeniyle talebi serbestçe reddedebilir."
      - "Eşi çalıştığı için Zeynep bu talepte bulunamaz."
      - "Talep için işverenin yazılı onayı şarttır."
    dogru: 0
    aciklama: |
      İzinlerin bitiminden sonra mecburi ilköğretim çağının başladığı tarihi izleyen ay başına kadar ebeveynlerden biri kısmi süreli çalışma talebinde bulunabilir; talep işverence karşılanır ve geçerli fesih nedeni sayılmaz (İK m. 13/5). Talebin bir ay önce yazılı yapılması gerekir. İşin yoğunluğu ret gerekçesi değildir; yönetmelik yalnız belirli işlerde işverenin uygun bulmasını arar ve Zeynep'in işi bunlardan değildir. Engel, ebeveynlerden birinin çalışmaması hâlinde çalışan eşin talepte bulunamamasıdır; olayda eş de çalıştığı için bu engel yoktur.
olaylar:
  - olay: |
      Bir mobilya fabrikası (sanayiden sayılan bir işyeri) şu işçileri çalıştırmaktadır:

      - Ç, 14 yıl 6 aylıktır. Ortaokulu bitirmiş, liseye devam etmektedir. Hafta içi okul çıkışı günde 4 saat, haftada 20 saat boyalı mobilya taşıma işinde çalışmaktadır.
      - G, 16 yaşındadır ve örgün eğitime devam etmemektedir. Günde 8, haftada 40 saat olmak üzere bir hafta gündüz, bir hafta gece (22.00-06.00) vardiyasında çalışmaktadır.
      - H, 11 yaşındadır. Fabrikanın tanıtım filminde, ebeveyninin yazılı sözleşmesi ile ancak bu çekim için ayrıca izin alınmaksızın oynatılmaktadır.

      İşverenin hukuki durumunu değerlendiriniz.

      1. Ç'nin çalıştırılması hukuka uygun mudur?
      2. G'nin çalıştırılması hukuka uygun mudur?
      3. H'nin çalıştırılması hukuka uygun mudur?
      4. İşverenin yaptırımla karşılaşma riski var mıdır?
    olcut:
      - {tespit: "Ç'nin yaşı ve hafif iş şartının tespiti (14 yaşını doldurmuş, ilköğretimi tamamlamış; ancak hafif iş)", puan: 20, madde: "İK m. 71"}
      - {tespit: "Okula devam eden çocuk için eğitim saatleri dışında günde 2, haftada 10 saat sınırının aşılması", puan: 20, madde: "İK m. 71"}
      - {tespit: "G'nin genç işçi sayılması ve günde 8, haftada 40 saat çalışmanın süre bakımından mümkün olması", puan: 15, madde: "İK m. 71"}
      - {tespit: "Sanayide 18 yaşını doldurmamış işçinin gece (22.00-06.00) çalıştırılmasının yasak olması", puan: 20, madde: "İK m. 73"}
      - {tespit: "H için sanat, kültür, reklam istisnasında yazılı sözleşme ve her faaliyet için ayrı izin şartının eksik kalması", puan: 15, madde: "İK m. 71"}
      - {tespit: "İdari para cezası riskinin belirlenmesi", puan: 10, madde: "İK m. 104"}
    cozum: |
      **Nitelendirme:** Olay, çocuk ve genç işçilerin çalıştırılmasına ilişkin İK m. 71 ve m. 73'ün uygulanmasıdır. Üç kişi farklı yaş basamaklarındadır: Ç çocuk işçi, G genç işçi, H ise 14 yaşını doldurmamış çocuktur.

      **Hukuki sorunlar:** (1) Ç'nin yaşına göre çalıştırılabileceği iş ve süre; (2) G'nin çalışma süresi ve gece çalıştırılması; (3) H'nin hangi şartla çalıştırılabileceği; (4) yaptırım.

      **İlgili hükümler:** İK m. 71/1 uyarınca 15 yaşını doldurmamış çocukların çalıştırılması yasaktır; 14 yaşını doldurmuş ve zorunlu ilköğretim çağını tamamlamış çocuklar hafif işlerde, 14 yaşını doldurmamış çocuklar ise sanat, kültür ve reklam faaliyetlerinde yazılı sözleşme ve her faaliyet için ayrı izin şartıyla çalıştırılabilir. İK m. 71/4-5 süre sınırlarını, İK m. 73/1 sanayide 18 yaşını doldurmamışların gece çalıştırılmasının yasağını, İK m. 104 yaptırımı düzenler.

      **Değerlendirme:** Ç, 14 yaşını doldurmuş ve ilköğretimi tamamlamış olduğundan ancak hafif işlerde çalıştırılabilir. Boyalı mobilya taşıma işinin hafif iş sayılıp sayılmayacağı yönetmelikteki listeye ve çocuğun gelişimine göre belirlenir; sanayi ortamında ağır yük taşıma işinin hafif iş niteliği şüphelidir. Ayrıca Ç okula devam ettiği için eğitim dönemindeki çalışma süresi eğitim saatleri dışında günde iki ve haftada on saatle sınırlıdır; günde dört ve haftada yirmi saat çalıştırılması aşar. G 15 yaşını tamamlamış genç işçi olduğundan günde 8 ve haftada 40 saate kadar çalıştırılması süre bakımından mümkündür; fakat sanayide 18 yaşını doldurmamış işçinin gece çalıştırılması İK m. 73/1 uyarınca kesin yasaktır; gece en geç 20.00'de başlayıp en erken 06.00'ya kadar süren dönem olduğundan (İK m. 69) 22.00-06.00 vardiyası her hâlde geceye girer. H 14 yaşını doldurmamış olduğundan yalnız sanat, kültür ve reklam faaliyetinde çalıştırılabilir; yazılı sözleşme vardır ama bu çekim için ayrı izin alınmamıştır, bu nedenle şart eksiktir. Üstelik tanıtım filmi niteliği, reklam faaliyeti kapsamına girip girmediği bakımından ayrıca değerlendirilmelidir.

      **Sonuç:** Ç'nin çalıştırılması hem iş türü (hafif iş şüphesi) hem süre bakımından, G'nin çalıştırılması gece vardiyası bakımından, H'nin çalıştırılması ise ayrı izin eksikliği nedeniyle hukuka aykırıdır. Bu aykırılıklar İK m. 104 uyarınca işveren veya işveren vekili hakkında idari para cezasını gerektirir.
  - olay: |
      Banka çalışanı Zeynep (28), ikinci çocuğunu doğurmuştur. Zeynep, doktor onayıyla doğuma iki hafta kalıncaya kadar işyerinde çalışmış, doğum sonrasında analık hâli iznini kullanmıştır. İznin bitiminde işverene yazılı başvurarak altı ay ücretsiz izin istemiş; işveren "iş yoğunluğu" gerekçesiyle bu izni onaylamayı reddetmiştir. Zeynep izne ayrılmış, altı ay sonra çocuğu bir yaşını doldurmadan işe dönmüştür. İşveren, Zeynep'in süt izni talebini "zaten uzun izin kullandın" diyerek reddetmiştir. Ayrıca işveren, yıllık ücretli izne hak kazanma süresinin hesabında altı aylık ücretsiz izin süresini olduğu gibi doğumdan önce ve sonra çalışmadığı süreleri de çalışılmamış sayacağını söylemiştir. Zeynep 5510 sayılı Kanun kapsamında sigortalıdır ve doğumdan önceki bir yılda 150 gün kısa vadeli sigorta primi bildirilmiştir.

      1. Zeynep'in doğum öncesi çalışması hukuka uygun mudur ve izin süresine etkisi nedir?
      2. Altı aylık ücretsiz iznin reddi hukuka uygun mudur? Bu izin yıllık izne nasıl yansır?
      3. Süt izni talebinin reddi hakkında ne söylenebilir?
      4. Doğum izni boyunca SGK ödeneği bakımından ne söylenebilir?
      5. İşverenin yaptırımla karşılaşma riski var mıdır?
    olcut:
      - {tespit: "Doktor onayı ve işçinin isteğiyle doğuma iki hafta kalıncaya kadar çalışma ve çalışılan sürenin doğum sonrasına eklenmesi", puan: 20, madde: "İK m. 74"}
      - {tespit: "Altı aya kadar ücretsiz iznin isteği hâlinde verilmesi ve işverenin yoğunluk gerekçesiyle reddedemeyeceği", puan: 20, madde: "İK m. 74"}
      - {tespit: "Altı aylık iznin yıllık izin hesabında dikkate alınmaması; 24 haftalık sürenin ise çalışılmış sayılması", puan: 20, madde: "İK m. 55"}
      - {tespit: "Bir yaşından küçük çocuk için günde 1,5 saat süt izni hakkının devamı", puan: 15, madde: "İK m. 74"}
      - {tespit: "Analık ödeneği için doğumdan önceki bir yılda en az 90 gün prim şartının sağlanması", puan: 15, madde: "5510 sayılı Kanun m. 18"}
      - {tespit: "Altı aylık ücretsiz iznin verilmemesi nedeniyle idari para cezası riski", puan: 10, madde: "İK m. 104"}
    cozum: |
      **Nitelendirme:** Olay, 7578 sayılı Kanun sonrası İK m. 74'te düzenlenen analık hâlinde çalışma, ücretsiz izin ve süt izni ile 5510 sayılı Kanun m. 18'deki analık ödeneğinin birlikte değerlendirilmesidir.

      **Hukuki sorunlar:** Doğum öncesi çalışma ve süre aktarımı; altı aylık ücretsiz iznin reddi ve yıllık izne etkisi; süt izni; ödenek şartları; yaptırım.

      **İlgili hükümler:** İK m. 74/1 doğum öncesi sekiz, sonrası on altı hafta, toplam yirmi dört hafta çalıştırılmamayı esas alır; doktor onayıyla doğumdan önceki iki haftaya kadar çalışılabilir ve çalışılan süre doğum sonrasına eklenir. İK m. 74/6 altı aya kadar ücretsiz izni, İK m. 74/7 süt iznini düzenler. İK m. 55/1-b doğum öncesi ve sonrası çalışılmayan günleri yıllık izin hesabında çalışılmış sayar. 5510 sayılı Kanun m. 18/1-c doğumdan önceki bir yılda en az doksan gün prim şartını arar. İK m. 104 yaptırımı gösterir.

      **Değerlendirme:** Zeynep'in doktor onayıyla doğuma iki hafta kalıncaya kadar çalışması İK m. 74/1'e uygundur; doğum öncesi sekiz haftalık sürenin kullanılmayan kısmı doğum sonrası sürelere eklenir. Altı aylık ücretsiz izin Kanunda "isteği halinde" verilir şeklinde düzenlenmiştir; işverene iş yoğunluğuna dayanarak reddetme yetkisi tanınmamıştır, bu nedenle ret metinle bağdaşmaz. Talep 24 haftalık süre bittikten sonra yapıldığı için zaman bakımından da yerindedir. Bu izin yıllık ücretli izin hakkının hesabında dikkate alınmaz (İK m. 74/6); işveren bu bakımdan haklıdır. Buna karşılık doğumdan önce ve sonra çalıştırılmadığı toplam 24 haftalık süre İK m. 55/1-b nedeniyle çalışılmış gibi sayılır; işverenin bu süreyi de hesap dışı bırakacağı yönündeki beyanı hukuka aykırıdır. Süt izni bakımından çocuk bir yaşını doldurmadığı sürece işçi günde toplam bir buçuk saat izne sahiptir (İK m. 74/7); önceki uzun iznin kullanılması bu hakkı ortadan kaldırmaz ve saatlerin hangi aralıkta, kaça bölünerek kullanılacağını Zeynep belirler. Prim şartı sağlandığı için (150 gün, en az 90 gün) analık ödeneği koşulu yerindedir (5510 sayılı Kanun m. 18/1-c).

      **Sonuç:** İşverenin iki ret gerekçesi de hukuka aykırıdır. Altı aylık ücretsiz izin ve süt izni verilmelidir; ücretsiz izin süresi yıllık izin hesabında dikkate alınmaz, analık izni süresi ise çalışılmış sayılır. İK m. 104, İK m. 74'e aykırı olarak ücretsiz izin vermeyen işverene idari para cezası öngördüğünden altı aylık ücretsiz iznin reddi bu yaptırımı gerektirir; süt izninin verilmemesi ise bu hükümde ayrıca sayılmamıştır.
kartlar:
  - on: "Çocuk işçi çalıştırma yasağının yaş sınırı nedir? (İK m. 71/1)"
    arka: "On beş yaşını doldurmamış çocukların çalıştırılması yasaktır. İstisna: 14 yaşını doldurmuş, ilköğretimi tamamlamış çocuk hafif işlerde çalışabilir."
  - on: "14 yaşını doldurmamış çocuk hangi şartla çalıştırılabilir?"
    arka: "Yalnız sanat, kültür ve reklam faaliyetlerinde; yazılı sözleşme yapılmalı ve her bir faaliyet için ayrı izin alınmalıdır (İK m. 71/1)."
  - on: "Çocuk işçilerin günlük ve haftalık süre sınırları?"
    arka: "Örgün eğitimde olmayan 7/35; sanat-kültür-reklam 5/30; 15 yaşını tamamlamış için 8/40'a kadar; okula devam edenlerde eğitim dönemi, eğitim saatleri dışında 2/10 (İK m. 71/4-5)."
  - on: "İK m. 72 hangi işçileri yasaklar?"
    arka: "Yer altı ve su altı işlerinde 18 yaşını doldurmamış erkekleri ve her yaştaki kadınları; rıza veya unvan yasağı kaldırmaz."
  - on: "Gece çalıştırma yasağı kimleri kapsar? (İK m. 73)"
    arka: "Sanayie ait işlerde 18 yaşını doldurmamış çocuk ve genç işçileri. Gece: en geç 20.00'de başlar, en erken 06.00'ya kadar sürer (İK m. 69)."
  - on: "7578 sayılı Kanun sonrası doğum izni süresi?"
    arka: "Doğumdan önce 8, sonra 16, toplam 24 hafta; çoğul gebelikte 26 hafta (İK m. 74/1). Eski toplam 16 (çoğulda 18) haftaydı."
  - on: "Doktor onayıyla doğum öncesi çalışma sınırı?"
    arka: "Doğumdan önceki iki haftaya kadar (önce üç hafta). Çalışılan süreler doğum sonrası sürelere eklenir."
  - on: "Yarım çalışma izni süreleri? (İK m. 74/2)"
    arka: "Birinci doğumda 60, ikincide 120, sonrakilerde 180 gün; çoğulda +30; engelli doğumda 360 gün. Bu sürede süt izni uygulanmaz."
  - on: "Koruyucu aile ile evlat edinme izni farkı?"
    arka: "Koruyucu aile: istek üzerine 10 gün ücretsiz izin. Üç yaşını doldurmamış çocuğu evlat edinen: teslimden itibaren 8 hafta analık hâli izni (İK m. 74/1)."
  - on: "Altı aylık ücretsiz iznin başlangıcı ve yıllık izne etkisi?"
    arka: "24 (çoğulda 26) haftalık sürenin bitiminden sonra başlar; yıllık izin hesabında dikkate alınmaz (İK m. 74/6). 24 haftalık izin ise İK m. 55/1-b gereği çalışılmış sayılır."
  - on: "Süt izninin süresi, kullanımı ve niteliği?"
    arka: "Bir yaşından küçük çocuk için günde toplam 1,5 saat; saatlerini işçi belirler; çalışma süresinden sayılır (İK m. 74/7, İK m. 66/1-e)."
  - on: "Analık izni sonrası kısmi süreli çalışma hakkı kimde ve ne zamana kadar?"
    arka: "İzinlerin bitiminden ilköğretim çağının başladığı tarihi izleyen ay başına kadar ebeveynlerden birinde; işveren karşılar (yönetmelikte işverenin uygun bulmasına bağlanan işler hariç), geçerli fesih nedeni olmaz; bir ay önce yazılı bildirim (İK m. 13/5)."
