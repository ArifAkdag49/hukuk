  - soru: |
      Ali ile Ayşe'nin iki yaşında bir çocukları vardır; İK m. 74'teki izinler sona ermiştir. Ayşe çalışmamaktadır; Ali işyerinde çalışmaktadır. Ali, İK m. 13/5'e dayanarak kısmî süreli çalışma talep etmiştir. Sonuç nedir?
