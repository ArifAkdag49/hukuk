    aciklama: |
      İK m. 11/1: belirli süreli sözleşme için yazılı şekilin yanında belirli süreli iş, belli bir işin tamamlanması ya da belirli bir olgunun ortaya çıkması gibi objektif koşul gerekir. Aksi hâlde sözleşme belirsiz süreli sayılır; süre kısalığı süreksiz iş (İK m. 10) anlamına gelmez.
  - soru: |
      Mehmet, esaslı bir neden olmaksızın aynı işte dört kez üst üste 6'şar aylık belirli süreli sözleşme imzalamıştır. Bu durumun sonucu aşağıdakilerden hangisidir?
