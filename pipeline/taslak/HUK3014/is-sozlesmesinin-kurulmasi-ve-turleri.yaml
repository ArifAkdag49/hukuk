  - soru: |
      Anadolu Ltd. Şti., sürekli yürüttüğü muhasebe işi için Zeynep ile objektif bir neden olmaksızın sekiz aylık yazılı "belirli süreli" sözleşme yapmıştır. Sözleşmenin niteliği nedir?
