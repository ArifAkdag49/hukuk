ozet: |
  - **Konum:** İK m. 18 ve İK m. 19 iş güvencesinin şartlarını ve fesih usulünü, İK m. 20 ve İK m. 21 ise bu güvencenin **yargısal yolunu ve yaptırımını** düzenler. Dava şartı arabuluculuk 7036 sayılı Kanun m. 3'tedir.
  - **Süre takvimi (sınavın omurgası):**
    - Fesih bildiriminin **tebliğinden** itibaren **bir ay** içinde arabulucuya başvuru (İK m. 20/1).
    - Anlaşmama **son tutanağından** itibaren **iki hafta** içinde iş mahkemesinde dava (İK m. 20/1).
    - Kesinleşen kararın tebliğinden itibaren **on işgünü** içinde işçinin işe başlamak için işverene başvurusu (İK m. 21/6).
    - İşverenin başvuru üzerine **bir ay** içinde işe başlatması (İK m. 21/1).
  - **İspat yükü:** Feshin geçerli sebebe dayandığını ispat işverene aittir; işçi feshin başka bir sebebe dayandığını ileri sürerse bunu kendisi ispatlar (İK m. 20/2).
  - **Kanun yolu:** Dava ivedilikle görülür; bölge adliye mahkemesi ivedilikle ve **kesin** karar verir (İK m. 20/3). Yargıtay'a temyiz yolu yoktur.
  - **Geçersizlik kararının sonuçları (İK m. 21):** işveren işçiyi bir ay içinde işe başlatmazsa **en az dört, en çok sekiz aylık ücret** tutarında tazminat öder; ayrıca kararın kesinleşmesine kadar çalıştırılmadığı süre için **en çok dört aya kadar** ücret ve diğer haklar ödenir. Her iki kalem **dava tarihindeki ücret** esas alınarak parasal olarak belirlenir (İK m. 21/4).
  - **Başvurmama:** İşçi on işgünü içinde başvurmazsa fesih geçerli sayılır (İK m. 21/6).
  - **Arabuluculukta işe başlatma anlaşması:** işe başlatma tarihi, boşta geçen süre ücretinin miktarı ve işe başlatmama tazminatının miktarı belirlenmek zorundadır; belirlenmezse anlaşma sağlanamamış sayılır (İK m. 21/7).
  - **Emredicilik:** İK m. 21'in birinci, ikinci ve üçüncü fıkraları sözleşmeyle değiştirilemez (İK m. 21/8).
  - **7036 sayılı Kanun m. 3:** işe iade ve işçi/işveren alacağı ve tazminatı davalarında arabuluculuk dava şartıdır; itirazın iptali, menfi tespit ve istirdat davaları da kapsamdadır; iş kazası ve meslek hastalığı tazminat davaları kapsam dışıdır.
  - 📌 **Güncel:** İlk toplantıya mazeretsiz katılmayan taraf 7531 sayılı Kanunla (7.11.2024) artık yargılama giderinin tamamından değil, **karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından** sorumludur ve lehine vekâlet ücretinin yarısına hükmedilir (7036 sayılı Kanun m. 3/12). Anayasa Mahkemesi 3.6.2025 tarihli kararıyla 7036 sayılı Kanun m. 3/15'i iptal etmiştir.
anlatim: |
  ## 1. Bu konu hangi soruya cevap veriyor?

  İK m. 18 "hangi işçi korunur, hangi fesih geçerli" sorusunu, İK m. 19 "fesih nasıl yapılır" sorusunu cevaplar. Bu konu ise bir sonraki adımdır: **geçersiz bir fesihle karşılaşan işçi ne yapar, süreç nasıl işler, kazanırsa ne alır?** Yol üç duraktır: (1) arabuluculuk, (2) dava, (3) karar sonrası işe başlama ve mali sonuçlar.

  İşe iade yolu kural olarak yalnızca iş güvencesi kapsamındaki işçiye açıktır. İK m. 18'e göre otuz veya daha fazla işçi çalıştıran işyerinde, en az altı aylık kıdemi olan, belirsiz süreli iş sözleşmesiyle çalışan işçi bu kapsamdadır; yer altı işlerinde çalışan işçilerde kıdem şartı aranmaz (İK m. 18/1). İşletmenin bütününü yöneten işveren vekili ve yardımcıları ile işyerinin bütününü yöneten ve işçiyi işe alma ve çıkarma yetkisi olan işveren vekilleri kapsam dışındadır (İK m. 18/son).

  > ⚠️ **Sınavda dikkat:** Kapsam şartlarından biri eksikse işe iade yolu kural olarak kapalıdır. İstisna: sendikal nedenle fesihte STİSK m. 25/5, İK m. 18'e atıf yapmaksızın işçiye İK m. 20 ve İK m. 21'e göre dava hakkı tanır. Bildirim süresine uyulmaması ya da süresine ait ücretin ödenmemesi ise ayrıca ihbar tazminatı doğurur (İK m. 17). İşe iade ile ihbar tazminatı farklı alacaklardır.

  ## 2. Birinci durak: dava şartı arabuluculuk

  İK m. 20/1'e göre fesih bildiriminde sebep gösterilmediği veya gösterilen sebebin geçerli olmadığı iddiasındaki işçi, **fesih bildiriminin tebliği tarihinden itibaren bir ay içinde** işe iade talebiyle arabulucuya başvurmak zorundadır. Bu süre, önelli (bildirimli) fesihte önelin bitiminden değil, **bildirimin tebliğinden** işler.

  > **Örnek:** İşveren Ayşe'ye 2 Mart'ta yazılı fesih bildirimini tebliğ etti ve iş sözleşmesi sekiz haftalık bildirim süresi sonunda sona erecek. Ayşe'nin arabulucuya başvuru süresi, sekiz haftanın bitiminde değil 2 Mart'ta başlar; bir ay 2 Nisan'da dolar.

  Arabuluculuk, 7036 sayılı Kanun m. 3/1 uyarınca bu davalarda **dava şartıdır**. Arabulucu, başvuruyu görevlendirildiği tarihten itibaren üç hafta içinde sonuçlandırır; zorunlu hâllerde bu süre en fazla bir hafta uzatılabilir (7036 sayılı Kanun m. 3/10). Arabuluculuk bürosuna başvurulmasından son tutanağın düzenlendiği tarihe kadar geçen sürede zamanaşımı durur ve hak düşürücü süre işlemez (7036 sayılı Kanun m. 3/17).

  Davacı, anlaşılamadığına dair son tutanağı dava dilekçesine eklemek zorundadır. Eklememişse mahkeme bir haftalık kesin süre verir; arabulucuya hiç başvurulmadan dava açıldığı anlaşılırsa herhangi bir işlem yapılmadan dava dava şartı yokluğundan usulden reddedilir (7036 sayılı Kanun m. 3/2).

  ### Usulden ret sonrası yeni bir şans
  Arabulucuya başvurmadan doğrudan dava açılıp dava usulden reddedilirse ret kararı taraflara resen tebliğ edilir. **Kesinleşen ret kararının resen tebliğinden itibaren iki hafta içinde** arabulucuya başvurulabilir (İK m. 20/1).

  ### Kapsam: neler arabuluculuğa tabi?
  - Kanuna, bireysel veya toplu iş sözleşmesine dayanan **işçi veya işveren alacağı ve tazminatı** ile **işe iade** talepli davalar (7036 sayılı Kanun m. 3/1).
  - Bu alacak ve tazminatla ilgili **itirazın iptali, menfi tespit ve istirdat** davaları da kapsamdadır (7445 sayılı Kanunla eklenen cümle).
  - **İş kazası veya meslek hastalığından** doğan maddi ve manevi tazminat ile bunlarla ilgili tespit, itiraz ve rücu davalarında dava şartı uygulanmaz (7036 sayılı Kanun m. 3/3).

  ### İlk toplantıya katılmama yaptırımı
  Taraflardan biri geçerli bir mazeret göstermeden ilk toplantıya katılmaz ve faaliyet bu yüzden sona ererse, o taraf son tutanakta belirtilir. Davada kısmen veya tamamen haklı çıksa bile **karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından** sorumlu tutulur; ayrıca bu taraf lehine Avukatlık Asgari Ücret Tarifesine göre belirlenen **vekâlet ücretinin yarısına** hükmedilir (7036 sayılı Kanun m. 3/12). Her iki taraf da katılmazsa yargılama giderleri kendi üzerlerinde kalır.

  Bu yaptırım, toplantıya katılmayan taraf davayı **kazandığında** anlam taşır. Katılmayan taraf davayı tamamen kaybederse, yargılama giderleri zaten genel kural gereği aleyhine hüküm verilen taraf olarak ona yükletilir (HMK m. 326/1) ve lehine vekâlet ücreti doğmaz.

  > 📌 **Kesin bilgi:** 7531 sayılı Kanun (7.11.2024) öncesindeki metinde yaptırım yargılama giderinin tamamıydı; güncel metin "yarısı"dır. Eski bilgiyle cevap vermeyin.

  ## 3. İkinci durak: dava

  Arabuluculukta anlaşma sağlanamazsa **son tutanağın düzenlendiği tarihten itibaren iki hafta içinde** iş mahkemesinde dava açılır. Taraflar anlaşırlarsa uyuşmazlık aynı sürede iş mahkemesi yerine özel hakeme de götürülebilir (İK m. 20/1). İş mahkemelerinde basit yargılama usulü uygulanır (7036 sayılı Kanun m. 7/1).

  **İspat yükü** işverendedir: feshin geçerli bir sebebe dayandığını işveren kanıtlar. İşçi, feshin işverenin ileri sürdüğünden başka bir sebebe dayandığını iddia ediyorsa (örneğin sendikal neden) bu iddiasını ispatla yükümlüdür (İK m. 20/2). Sendikal nedenle fesihte ayrıca STİSK m. 25'in özel düzenlemesi vardır: işçinin bir yıllık ücretinden az olmamak üzere sendikal tazminata hükmedilir (STİSK m. 25/4).

  Dava ivedilikle sonuçlandırılır. İstinaf yoluna başvurulursa **bölge adliye mahkemesi ivedilikle ve kesin olarak** karar verir (İK m. 20/3). Dolayısıyla işe iade davalarında Yargıtay'a temyiz yolu açık değildir.

  ## 4. Üçüncü durak: geçersizlik kararı ve İK m. 21

  Mahkeme veya özel hakem feshin geçersizliğine karar verirse üç şey gündeme gelir:

  1. **İşçinin başvurusu.** İşçi, kesinleşen karar kendisine tebliğ edildiğinden itibaren **on işgünü içinde** işe başlamak için işverene başvurmak zorundadır. Başvurmazsa işverence yapılan fesih **geçerli bir fesih sayılır** ve işveren yalnızca bunun hukuki sonuçlarından sorumlu olur (İK m. 21/6).
  2. **İşverenin işe başlatması.** Geçersizlik tespit edildiğinde işveren, işçiyi **bir ay içinde** işe başlatmak zorundadır (İK m. 21/1).
  3. **Mali sonuçlar.** İşveren işçiyi başvurusu üzerine bir ay içinde işe başlatmazsa işçiye **en az dört aylık ve en çok sekiz aylık ücreti tutarında tazminat** (işe başlatmama tazminatı) öder. Mahkeme veya özel hakem, geçersizlik kararında bu tazminatın miktarını da belirler (İK m. 21/1-2).

  Bunların yanında **kararın kesinleşmesine kadar çalıştırılmadığı süre** için işçiye **en çok dört aya kadar doğmuş bulunan ücret ve diğer haklar** (boşta geçen süre ücreti) ödenir (İK m. 21/3). Bu kalem, işçi sonunda işe başlatılsa da başlatılmasa da gündeme gelen kalemdir; ancak işçi on işgünü içinde başvurmazsa fesih geçerli sayıldığından işveren yalnızca bunun hukuki sonuçlarıyla sorumlu olur.

  İşe başlatmama tazminatı ile boşta geçen süre ücreti, **dava tarihindeki ücret** esas alınarak parasal olarak belirlenir (İK m. 21/4).

  > **Örnek:** Mehmet'in işe iade davası kabul edildi, karar kesinleşti ve 5 Ekim'de tebliğ edildi. Mehmet 12 Ekim'de işverene yazılı başvurdu, işveren bir ay içinde işe almadı. Mehmet, karar gereği belirlenen (dört ile sekiz aylık arasında) işe başlatmama tazminatını ve en çok dört aya kadar boşta geçen süre ücretini alır; ikisi de dava tarihindeki ücret üzerinden hesaplanır.

  > ⚠️ **Sınavda dikkat:** İşçi işe başlatılırsa **işe başlatmama tazminatı** doğmaz; ama boşta geçen süre ücreti yine ödenir. İşe başlatılan işçide peşin ödenen bildirim süresi ücreti ve kıdem tazminatı bu ödemeden **mahsup** edilir. İşe başlatılmayan işçiye bildirim süresi verilmemişse veya o süreye ait ücret peşin ödenmemişse, bu sürelerin ücreti ayrıca ödenir (İK m. 21/5).

  ### Hangi hükümler sözleşmeyle değiştirilemez?
  İK m. 21'in birinci, ikinci ve üçüncü fıkraları sözleşmelerle **hiçbir suretle** değiştirilemez; aksi yöndeki sözleşme hükümleri geçersizdir (İK m. 21/8). Toplu iş sözleşmesiyle işe başlatmama tazminatını on aya ya da boşta geçen süreyi altı aya çıkarmak bu nedenle mümkün değildir.

  ## 5. Arabuluculukta işe başlatma anlaşması

  Arabuluculuk sonunda taraflar işçinin **işe başlatılması** konusunda anlaşırsa üç şeyi belirlemek **zorundadır** (İK m. 21/7):

  - işe başlatma tarihi,
  - boşta geçen süre için ödenecek ücret ve diğer hakların parasal miktarı,
  - işçi işe başlatılmazsa ödenecek işe başlatmama tazminatının parasal miktarı.

  Bunlardan biri eksikse **anlaşma sağlanamamış sayılır** ve son tutanak buna göre düzenlenir; işçi böylece dava yoluna gidebilir. Anlaşma eksiksizse ve işçi kararlaştırılan tarihte işe başlamazsa fesih geçerli hâle gelir ve işveren yalnızca bunun hukuki sonuçlarından sorumlu olur.

  > 💡 **Püf nokta:** "İşe başlatma anlaşmasında üç şey zorunlu: tarih, boşta geçen süre miktarı, tazminat miktarı." Üçünden biri eksikse anlaşma yok.

  ## 6. Sürelerin toplu görünümü

  | Adım | Süre |
  |---|---|
  | Arabulucuya başvuru | Tebliğden itibaren 1 ay |
  | Dava açma | Son tutanaktan itibaren 2 hafta |
  | Usulden ret sonrası arabulucuya başvuru | Kesinleşen retin resen tebliğinden itibaren 2 hafta |
  | İşçinin işe başlama başvurusu | Kesinleşen kararın tebliğinden itibaren 10 işgünü |
  | İşverenin işe başlatması | Başvurudan itibaren 1 ay |

  ## 7. Uygulamadan notlar

  Yargıtay uygulamasında işçi işe başlatılmazsa iş sözleşmesinin **işe başlatmama tarihinde** sona erdiği kabul edilir. Bu yüzden işe başlatmama suretiyle fesih tarihindeki ücretin belirlenmesi ayrı bir sorun hâline gelir. Bu ücret belirlenirken önce aynı işyerindeki emsal işçinin ücretine, emsal işçi yoksa işverenin çalışanlarına uyguladığı genel ücret artış oranına bakılır (kararlar bölümündeki 9. Hukuk Dairesi kararı). İhbar önelinin usulüne uygun verildiği veya önele ait ücretin peşin ve eksiksiz ödendiği hâlde sonradan işe başlatılmama olursa, aynı bildirim süresi için yeniden ihbar tazminatı ödenmesi gerekmez (İK m. 21/5).

  7036 sayılı Kanun m. 3/15, Anayasa Mahkemesinin 3.6.2025 tarihli ve E.2024/157, K.2025/121 sayılı kararıyla iptal edilmiştir; resmî metinde fıkra yerinde iptal notu görünür. Sınavda bu fıkraya dayanarak bir kural aktarmayın.

  ## 8. Sık yapılan hatalar

  - **Süreleri birbirine karıştırmak.** Bir ay arabulucuya başvuru süresidir; dava için iki hafta, işçinin işe başlama başvurusu için on işgünü, işverenin işe başlatması için bir ay öngörülür. Her sürenin başlangıç olayı farklıdır: tebliğ, son tutanak, kesinleşen kararın tebliği, başvuru.
  - **Boşta geçen süre ücretini işe başlatmama tazminatına bağlamak.** İkisi ayrı kalemdir. Tazminat yalnız işe başlatılmayan işçiye ödenir; boşta geçen süre ücreti ise işçi işe başlatılsa da gündeme gelir (İK m. 21/1 ve İK m. 21/3).
  - **Aylık sınırları ters yazmak.** Tazminat dört ile sekiz ay arasındadır; boşta geçen süre ise en çok dört aya kadardır. İkisini birbirine aktarmayın.
  - **Eski 7036 metnini yazmak.** İlk toplantıya katılmama yaptırımı artık giderin tamamı değil, yarısıdır.

  ## 9. Denetim şeması

  1. İşçi İK m. 18 kapsamında mı (30 işçi, 6 ay kıdem, belirsiz süreli sözleşme, işveren vekili değil)?
  2. Fesih bildirimi tebliğ edilmiş mi; tebliğden itibaren **bir ay** içinde arabulucuya başvurulmuş mu?
  3. Son tutanaktan itibaren **iki hafta** içinde dava açılmış mı?
  4. İspat yükü: işveren geçerli sebebi ispatladı mı; yazılı fesih ve savunma (İK m. 19) var mı?
  5. Geçersizlik kararı kesinleşti mi; işçi **on işgünü** içinde başvurdu mu?
  6. İşveren **bir ay** içinde başlattı mı? Başlatmadıysa 4-8 aylık tazminat ve 4 aya kadar boşta geçen süre ücreti, dava tarihindeki ücretle.
  7. Peşin ödenen bildirim süresi ücreti var mı; mahsup ya da ayrıca ödeme?
kritik: |
  - 📌 Arabulucuya başvuru süresi **fesih bildiriminin tebliğinden itibaren bir aydır**; önelli fesihte önelin bitiminden başlamaz (İK m. 20/1).
  - 📌 Anlaşamama **son tutanağından** itibaren **iki hafta** içinde dava açılır (İK m. 20/1).
  - ⚠️ Arabulucuya başvurulmadan açılan dava dava şartı yokluğundan usulden reddedilir; kesinleşen ret kararının **resen tebliğinden itibaren iki hafta** içinde arabulucuya başvurulabilir (7036 sayılı Kanun m. 3/2, İK m. 20/1).
  - 📌 İspat yükü işverendedir; işçi, feshin başka bir sebebe dayandığını ileri sürerse bunu kendisi ispatlar (İK m. 20/2).
  - 📌 Bölge adliye mahkemesi kararı **kesindir**; işe iade davasında temyiz yoktur (İK m. 20/3).
  - 📌 İşçi kesinleşen kararın tebliğinden itibaren **on işgünü** içinde işe başlamak için başvurmazsa fesih geçerli sayılır (İK m. 21/6).
  - 📌 İşveren başvuru üzerine **bir ay** içinde işe başlatmalıdır; başlatmazsa **4 ile 8 aylık ücret** tutarında tazminat öder (İK m. 21/1).
  - ⚠️ Boşta geçen süre ücreti **en çok dört aya kadar**dır ve işçi işe başlatılsa da başlatılmasa da ödenir; işe başlatmama tazminatı yalnız işe başlatılmayan işçi içindir (İK m. 21/3).
  - 📌 İşe başlatmama tazminatı ve boşta geçen süre ücreti **dava tarihindeki ücret** esas alınarak parasal olarak belirlenir (İK m. 21/4).
  - ⚠️ İşe başlatılan işçide peşin ödenen bildirim süresi ücreti ve kıdem tazminatı mahsup edilir; işe başlatılmayana bildirim süresi verilmemişse veya ücreti peşin ödenmemişse ayrıca ödenir (İK m. 21/5).
  - 📌 Arabuluculuk anlaşmasında işe başlatma tarihi, boşta geçen süre ücretinin miktarı ve işe başlatmama tazminatının miktarı zorunludur; eksikse anlaşma sağlanamamış sayılır (İK m. 21/7).
  - 📌 İK m. 21'in 1-3. fıkraları sözleşmeyle değiştirilemez (İK m. 21/8).
  - 📌 İlk toplantıya mazeretsiz katılmayan taraf, davada haklı çıksa bile karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin **yarısından** sorumludur; lehine vekâlet ücretinin yarısına hükmedilir (7036 sayılı Kanun m. 3/12).
doktrin: |
  ### Boşta geçen süre ücretinde başka işten kazanç
  İşçi dava sürerken başka bir işte çalışıp gelir elde etmişse, bu gelirin İK m. 21/3'teki boşta geçen süre ücretinden indirilip indirilmeyeceği tartışmalıdır. Bir görüşe göre hizmet sözleşmesinin haksız feshindeki mantık kıyasen uygulanmalı ve işçinin başka yerden kazandığı tutar mahsup edilmelidir. Karşı görüşe göre İK m. 21/3 ve İK m. 21/8, işçi lehine emredici bir yaptırım kurmuştur; hükümde böyle bir indirim öngörülmemiştir ve kanunun düzenlemediği bir indirim yapılamaz. Sınavda bu tartışmayı bilmek yeterli; olayın çözümünde kanun metnine dayanın.

  ### "Dava tarihindeki ücret" kuralı
  İK m. 21/4 işe başlatmama tazminatını ve boşta geçen süre ücretini dava tarihindeki ücretle belirlettirir. Yargılama uzadıkça paranın değer kaybedeceği, bunun işçi aleyhine sonuç doğurduğu eleştirisi yapılır. Kanun açık olduğu için uygulamada bu iki kalem dava tarihindeki ücretle hesaplanır; işe başlatmama tarihindeki ücret ise kıdem tazminatı gibi fesih tarihine bağlı kalemlerde belirleyici olur.

  ### Başvuru ve davetin samimiyeti
  Kanun metni yalnızca on işgünü ve bir aylık süreleri sayar. İşçinin başvurusunun ve işverenin davetinin gerçekten işe dönmeye yönelik, yani samimi olup olmadığı ise yargı uygulamasının geliştirdiği bir denetimdir. İşveren başvuruyu kabul etmiş görünüp fiilen işe başlatmayacağını belli ediyorsa işe başlatmamış sayılır; işçi de davete rağmen işe dönmeye niyetli değilse başvurusu işe başlama iradesini taşımaz.
sozluk:
  - terim: İşe iade davası
    tanim: "Geçerli sebep olmaksızın veya usulsüz feshedilen iş sözleşmesinin geçersizliğinin tespiti ve işçinin işe başlatılması için açılan dava (İK m. 20)."
  - terim: Dava şartı arabuluculuk
    tanim: "Bazı iş davalarında dava açılmadan önce arabulucuya başvurulmuş olmasının zorunlu olması; yoksa dava usulden reddedilir (7036 sayılı Kanun m. 3)."
  - terim: Son tutanak
    tanim: "Arabulucunun faaliyeti bitirirken düzenlediği, anlaşma olup olmadığını gösteren belge; dava süresi bundan başlar."
  - terim: Özel hakem
    tanim: "Taraflar anlaşırsa iş mahkemesi yerine uyuşmazlığı çözen hakem (İK m. 20/1)."
  - terim: Feshin geçersizliği
    tanim: "Feshin geçerli sebebe dayanmadığının veya fesih usulüne uyulmadığının mahkemece tespiti."
  - terim: Boşta geçen süre ücreti
    tanim: "Kararın kesinleşmesine kadar çalıştırılmadığı süre için ödenen, en çok dört aya kadar ücret ve diğer haklar (İK m. 21/3)."
  - terim: İşe başlatmama tazminatı
    tanim: "İşçi başvurusu üzerine bir ay içinde işe başlatılmazsa ödenen dört ile sekiz aylık ücret tutarındaki tazminat (İK m. 21/1)."
  - terim: Mahsup
    tanim: "Önceden ödenen bildirim süresi ücreti ve kıdem tazminatının işçiye yapılacak ödemeden düşülmesi (İK m. 21/5)."
  - terim: Kesin süre
    tanim: "Mahkemenin verdiği, uzatılamayan ve kaçırılırsa hak kaybı doğuran süre; örneğin son tutanağı sunmak için bir hafta (7036 sayılı Kanun m. 3/2)."
  - terim: Mutlak emredici hüküm
    tanim: "Sözleşmeyle, işçi lehine bile olsa değiştirilemeyen kural; İK m. 21'in 1-3. fıkraları böyledir (İK m. 21/8)."
kararlar:
  - id: "1226002800"
    ozet: |
      Davacı işçinin işe iade davası kazanılmış ve karar kesinleşmişti; işçi süresinde başvurmuş, ancak işveren işçiyi işe başlatmamıştı. İşçi bunun üzerine kıdem tazminatı, ihbar tazminatı, iş güvencesi tazminatı, boşta geçen süre ücreti ve yıllık izin alacağı için dava açtı. İlk derece mahkemesi, işe başlatmama tarihindeki ücreti emsal bordro sunulmadığı için asgari ücrete oranlayarak belirledi ve ihbar tazminatına da hükmetti. Yargıtay 9. Hukuk Dairesi iki noktayı ele aldı. Birincisi, işe başlatmama suretiyle fesih tarihindeki ücretin ispat yükü işçidedir; önce aynı işyerindeki emsal işçi ücretine, o yoksa işverenin genel ücret artış oranına bakılır. Somut olayda işçi emsal işçileri bildirmiş, işveren bordroları sunmamış olduğundan asgari ücrete oranlama bozma nedeni sayılmamıştır. İkincisi, ilk fesihte ihbar önelinin usulüne uygun verildiği veya ücretinin peşin ve eksiksiz ödendiği hâlde, işe başlatılmama nedeniyle yeniden ihbar tazminatı ödenmesi gerekmez (İK m. 21/5); bu yönden karar bozulmuştur.
  - id: "1228659300"
    ozet: |
      Dava, işe iade davası değil, işyerindeki psikolojik taciz iddiasına dayalı maddi ve manevi tazminat davasıdır; ancak 7036 sayılı Kanun m. 3'teki dava şartı arabuluculuğun taraf değişikliğiyle ilişkisini gösterdiği için öğreticidir. Davacı aile sağlığı elemanı, davayı önce birlikte çalıştığı doktora açmış, mahkeme HMK m. 124 uyarınca davayı Sağlık Bakanlığına yöneltmesi için süre vermiş, davacı süre içinde Bakanlığa karşı arabulucuya başvurup davayı Bakanlığa yöneltmiş, son tutanak ise sonradan düzenlenmiştir. İlk derece mahkemesi dava şartı yokluğundan usulden ret kararı verdi, bölge adliye mahkemesi istinaf başvurusunu esastan reddetti; Yargıtay 9. Hukuk Dairesinin bozma kararına ilk derece mahkemesi direnince dosya Hukuk Genel Kurulu'na geldi. Hukuk Genel Kurulu, yeni davalı bakımından arabuluculuk koşulunun ayrıca arandığını kabul etmekle birlikte, somut olayda mahkemenin resen verdiği bir haftalık süre içinde arabuluculuk faaliyetinin tamamlanmasının mümkün olmadığını, arabulucuya başvurulmuş olmasının yeterli sayılması gerektiğini ve aksinin mahkemeye erişim hakkıyla bağdaşmayacağını belirterek direnme kararını bozdu.
sorular:
  - soru: |
      İşveren, 3 Mart'ta işçi Zeynep'e yazılı fesih bildirimini tebliğ etmiş; iş sözleşmesi sekiz haftalık bildirim süresinin bitiminde sona erecektir. Zeynep, iş güvencesi kapsamındadır ve feshin geçersiz olduğunu düşünmektedir. Arabulucuya başvuru süresi ne zaman işlemeye başlar?
    siklar:
      - "Bildirim süresinin sona erdiği tarihte başlar."
      - "Fesih bildiriminin tebliği tarihinde başlar."
      - "Dava açıldığı tarihte başlar."
      - "Zeynep'in fesih sebebini öğrendiği tarihten sonraki iş günü başlar."
    dogru: 1
    aciklama: |
      İK m. 20/1'e göre işçi, fesih bildiriminin tebliği tarihinden itibaren bir ay içinde arabulucuya başvurmak zorundadır. Önelli fesihte süre önelin bitiminden değil bildirimin tebliğinden işler; bu en sık yapılan hatadır.
  - soru: |
      Arabuluculuk faaliyeti sonunda işe iade konusunda anlaşılamamıştır. İşçi, iş mahkemesinde dava açmak istemektedir. Dava hangi süre içinde açılmalıdır?
    siklar:
      - "Fesih bildiriminin tebliğinden itibaren iki hafta içinde."
      - "Son tutanağın düzenlendiği tarihten itibaren iki hafta içinde."
      - "Son tutanağın düzenlendiği tarihten itibaren bir ay içinde."
      - "Arabulucuya başvurulduğu tarihten itibaren iki hafta içinde."
    dogru: 1
    aciklama: |
      İK m. 20/1: anlaşmaya varılamaması hâlinde son tutanağın düzenlendiği tarihten itibaren iki hafta içinde iş mahkemesinde dava açılabilir. Bir aylık süre arabulucuya başvuru süresidir; dava süresi ile karıştırılmamalıdır.
  - soru: |
      İşe iade davasında ispat yükü bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Feshin geçersiz olduğunu işçi ispatlar."
      - "Feshin geçerli bir sebebe dayandığını işveren ispatlar."
      - "İspat yükü tarafların eşit olarak paylaşılır."
      - "İspat yükü fesih sebebi ne olursa olsun yalnızca işçidedir."
    dogru: 1
    aciklama: |
      İK m. 20/2: feshin geçerli bir sebebe dayandığını ispat yükümlülüğü işverene aittir. İşçi, feshin başka bir sebebe dayandığını (örneğin sendikal nedeni) iddia ederse bu iddiasını ispatla yükümlüdür; ancak bu, genel kuralı değiştirmez.
  - soru: |
      İş mahkemesinin işe iade davasında verdiği karara karşı istinaf yoluna başvurulmuş ve bölge adliye mahkemesi kararı vermiştir. Bu karara karşı hangi yol açıktır?
    siklar:
      - "Yargıtay'a temyiz yolu açıktır."
      - "Yalnızca karar düzeltme yolu açıktır."
      - "Bölge adliye mahkemesi kararı kesindir, temyiz edilemez."
      - "Tekrar iş mahkemesine başvurulabilir."
    dogru: 2
    aciklama: |
      İK m. 20/3: istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi ivedilikle ve kesin olarak karar verir. İşe iade davalarında Yargıtay'a temyiz yolu yoktur.
  - soru: |
      Mahkeme Ali'nin işe iade davasını kabul etmiş, karar kesinleşmiş ve Ali'ye tebliğ edilmiştir. Ali işverene, tebliğden itibaren 13. işgününde işe başlamak için başvurmuştur. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Başvuru süresinde olduğundan işveren bir ay içinde işe başlatmak zorundadır."
      - "Başvuru süresinde yapılmadığından fesih geçerli bir fesih sayılır."
      - "Ali işe başlatmama tazminatını isteyebilir ama boşta geçen süre ücretini isteyemez."
      - "Ali yeniden arabulucuya başvurarak yeni bir süre kazanır."
    dogru: 1
    aciklama: |
      İK m. 21/6: işçi kesinleşen kararın tebliğinden itibaren on işgünü içinde başvurmazsa işverence yapılan fesih geçerli bir fesih sayılır ve işveren yalnızca bunun hukuki sonuçlarından sorumlu olur. On üçüncü iş günü süreyi aşmıştır.
  - soru: |
      İşe iade davası kesinleşmiş, işçi süresinde başvurmuş, ancak işveren bir ay içinde işçiyi işe başlatmamıştır. İşçiye ödenecek işe başlatmama tazminatı kaç aylık ücret tutarı arasında belirlenir?
    siklar:
      - "En az iki, en çok dört aylık."
      - "En az dört, en çok sekiz aylık."
      - "En az altı, en çok on iki aylık."
      - "Bir aylık ücretin üç katı ile beş katı arasında."
    dogru: 1
    aciklama: |
      İK m. 21/1: işveren, işçiyi başvurusu üzerine bir ay içinde işe başlatmazsa işçiye en az dört aylık ve en çok sekiz aylık ücreti tutarında tazminat öder. Mahkeme, geçersizlik kararında bu tutarı da belirler (İK m. 21/2).
  - soru: |
      Fatma'nın işe iade davası kazanılmış, işveren Fatma'yı kararın kesinleşmesinden sonra işe başlatmıştır. Fatma'nın alacakları bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İşe başlatıldığı için hiçbir ödeme yapılmaz."
      - "İşe başlatmama tazminatı ve boşta geçen süre ücreti birlikte ödenir."
      - "İşe başlatmama tazminatı doğmaz; en çok dört aya kadar boşta geçen süre ücreti ödenir, peşin ödenen bildirim süresi ücreti ve kıdem tazminatı bundan mahsup edilir."
      - "Yalnızca ihbar tazminatı ödenir."
    dogru: 2
    aciklama: |
      İK m. 21/3'e göre kararın kesinleşmesine kadar çalıştırılmadığı süre için en çok dört aya kadar ücret ve diğer haklar ödenir; işçi işe başlatılırsa peşin ödenen bildirim süresi ücreti ve kıdem tazminatı bu ödemeden mahsup edilir (İK m. 21/5). İşe başlatmama tazminatı yalnız işe başlatılmayan işçiye ödenir (İK m. 21/1).
  - soru: |
      Bir toplu iş sözleşmesinde "işçi lehine olacak şekilde işe başlatmama tazminatı en az on aylık ücret olarak ödenir" hükmü yer almaktadır. Bu hükmün durumu nedir?
    siklar:
      - "İşçi lehine olduğu için her hâlde geçerlidir."
      - "İK m. 21/8 nedeniyle geçersizdir."
      - "Yalnızca işveren kabul ederse geçerlidir."
      - "Yalnızca mahkeme onaylarsa geçerlidir."
    dogru: 1
    aciklama: |
      İK m. 21/8'e göre bu maddenin birinci, ikinci ve üçüncü fıkra hükümleri sözleşmelerle hiçbir suretle değiştirilemez; aksi yöndeki sözleşme hükümleri geçersizdir. İşçi lehine olması bu emredicilik karşısında önemli değildir.
  - soru: |
      Aşağıdaki davalardan hangisinde 7036 sayılı Kanun m. 3 uyarınca arabulucuya başvurulmuş olması dava şartı DEĞİLDİR?
    siklar:
      - "İşçilik alacağına ilişkin ilamsız takibe itiraz üzerine açılan itirazın iptali davası."
      - "Kıdem tazminatı alacağına dayalı eda davası."
      - "İşe iade davası."
      - "İş kazasından doğan maddi ve manevi tazminat davası."
    dogru: 3
    aciklama: |
      7036 sayılı Kanun m. 3/3: iş kazası veya meslek hastalığından kaynaklanan maddi ve manevi tazminat ile bunlarla ilgili tespit, itiraz ve rücu davalarında dava şartı hükmü uygulanmaz. Diğer üç dava 7036 sayılı Kanun m. 3/1 kapsamındadır; itirazın iptali davaları da kapsamdadır.
  - soru: |
      Hasan, geçersiz fesih nedeniyle doğrudan iş mahkemesinde işe iade davası açmış; mahkeme arabulucuya başvurulmadığı için davayı dava şartı yokluğundan usulden reddetmiştir. Ret kararı resen tebliğ edilmiş ve kesinleşmiştir. Hasan'ın izleyeceği yol nedir?
    siklar:
      - "Hasan'ın işe iade hakkı kesin olarak düşmüştür."
      - "Kesinleşen ret kararının resen tebliğinden itibaren iki hafta içinde arabulucuya başvurabilir."
      - "Kesinleşen ret kararının tebliğinden itibaren bir ay içinde yeniden dava açabilir."
      - "Aynı davayı arabuluculuğa gitmeden yeniden açabilir."
    dogru: 1
    aciklama: |
      İK m. 20/1: arabulucuya başvurmaksızın doğrudan dava açılması sebebiyle davanın usulden reddi hâlinde ret kararı taraflara resen tebliğ edilir ve kesinleşen ret kararının resen tebliğinden itibaren iki hafta içinde arabulucuya başvurulabilir. Arabuluculuk bitmeden yeniden dava açılamaz (7036 sayılı Kanun m. 3/1).
  - soru: |
      İşveren, işçinin işçilik alacakları için yaptığı arabuluculuk başvurusunda geçerli bir mazeret göstermeden ilk toplantıya katılmamış ve arabuluculuk faaliyeti bu nedenle sona ermiştir. İşçinin sonradan açtığı dava reddedilmiş, yani işveren davada tamamen haklı çıkmıştır. İşverenin yargılama gideri ve vekâlet ücreti bakımından durumu nedir?
    siklar:
      - "Hiçbir yaptırımla karşılaşmaz."
      - "Karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumlu tutulur ve lehine vekâlet ücretinin yarısına hükmedilir."
      - "Yargılama giderinin tamamından sorumlu tutulur ve lehine hiç vekâlet ücretine hükmedilmez."
      - "Yargılama giderlerinin tamamından sorumlu tutulur, ancak lehine vekâlet ücretinin yarısına hükmedilir."
    dogru: 1
    aciklama: |
      7036 sayılı Kanun m. 3/12 güncel metni (7531 sayılı Kanun, 7.11.2024): ilk toplantıya mazeretsiz katılmayan taraf, davada haklı çıksa bile karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumlu tutulur ve lehine vekâlet ücretinin yarısına hükmedilir. Davayı kazanan işveren bu nedenle işçinin ödeyeceği giderlerin yarısını üstlenir ve tam değil yarım vekâlet ücreti alır. Giderin tamamına ilişkin eski metin değiştirilmiştir.
  - soru: |
      Arabuluculuk sonunda işveren ve işçi, işçinin 1 Mart'ta işe başlatılması konusunda anlaşmış; ancak tutanakta boşta geçen süre ücretinin ve işe başlatmama tazminatının miktarı belirtilmemiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Anlaşma geçerlidir; miktarlar mahkemece sonradan belirlenir."
      - "Anlaşma sağlanamamış sayılır ve son tutanak buna göre düzenlenir."
      - "Yalnızca işe başlatma tarihi yeterli olduğundan anlaşma geçerlidir."
      - "Miktarlar kanunda belirlendiğinden tutanakta yer almasına gerek yoktur."
    dogru: 1
    aciklama: |
      İK m. 21/7: işe başlatma konusunda anlaşılırsa işe başlatma tarihi, boşta geçen süre ücretinin parasal miktarı ve işe başlatmama tazminatının parasal miktarı belirlenmek zorundadır. Aksi takdirde anlaşma sağlanamamış sayılır ve son tutanak buna göre düzenlenir.
olaylar:
  - olay: |
      X Gıda A.Ş. 120 işçi çalıştıran bir fabrikadır. Belirsiz süreli iş sözleşmesiyle 6 yıldır çalışan Ali'ye işveren, 2 Mart 2026 Pazartesi günü yazılı fesih bildirimini tebliğ etmiş; iş sözleşmesinin sekiz haftalık bildirim süresi sonunda sona ereceğini bildirmiştir. İşveren bildirim süresine ait ücreti peşin ödemiştir. Fesih bildiriminde "performans düşüklüğü" sebebi gösterilmiş, ancak Ali'nin savunması alınmamıştır.

      Ali, 25 Mart 2026'da işe iade talebiyle arabulucuya başvurmuştur. İşveren geçerli bir mazeret göstermeden ilk toplantıya katılmamış, arabuluculuk faaliyeti bu nedenle sona ermiş ve 10 Nisan 2026 Cuma günü anlaşmama son tutanağı düzenlenmiştir. Ali, 20 Nisan 2026'da iş mahkemesinde işe iade davası açmıştır. Mahkeme feshi geçersiz bulmuş, istinaf başvurusu üzerine bölge adliye mahkemesi de kararı onamıştır. Kesinleşen karar Ali'ye 5 Ekim 2026'da tebliğ edilmiş, Ali 12 Ekim 2026'da işverene yazılı olarak işe başlamak için başvurmuş, ancak işveren bir ay içinde onu işe başlatmamıştır.

      1. Ali'nin arabuluculuk başvurusu ve dava açması süresinde midir?
      2. Davada ispat yükü kimdedir ve işverenin ilk toplantıya katılmamasının sonucu nedir?
      3. Ali'nin işe başlama başvurusu ve işverenin işe başlatmaması hangi sonuçları doğurur?
      4. Bildirim süresi ücretinin peşin ödenmiş olması nasıl sonuç doğurur?
      5. Bölge adliye mahkemesi kararına karşı Yargıtay'a gidilebilir mi?
    olcut:
      - {tespit: "Arabulucuya başvuru (tebliğden itibaren 1 ay) ve dava (son tutanaktan itibaren 2 hafta) sürelerine uyulduğunun tespiti", puan: 20, madde: "İK m. 20"}
      - {tespit: "İspat yükünün işverende olması; savunma alınmaması ve usul (İK m. 19) eksikliğine değinilmesi", puan: 15, madde: "İK m. 19"}
      - {tespit: "İlk toplantıya mazeretsiz katılmama yaptırımı (giderlerin yarısı, vekâlet ücretinin yarısı) ve davayı kaybeden işveren bakımından genel kuralın uygulanması", puan: 20, madde: "7036 sayılı Kanun m. 3"}
      - {tespit: "On işgünü içinde başvuru; işe başlatmama tazminatı (4-8 ay), boşta geçen süre ücreti (en çok 4 ay), dava tarihindeki ücret", puan: 30, madde: "İK m. 21"}
      - {tespit: "Peşin ödenen bildirim süresi ücreti: işe başlatılmayana ayrıca ödenmez; kesin karar (temyiz yok)", puan: 15, madde: "İK m. 21"}
    cozum: |
      **Nitelendirme:** Ali, 120 işçi çalıştıran işyerinde, altı yıllık kıdemli, belirsiz süreli sözleşmeli işçidir; İK m. 18'in aradığı otuz işçi, altı ay kıdem ve belirsiz süreli sözleşme şartlarını taşımaktadır. Uyuşmazlık, geçersiz feshe karşı işe iade yoludur (İK m. 20 ve İK m. 21).

      **Hukuki sorunlar:** (1) Başvuru ve dava süreleri; (2) ispat yükü ve usul; (3) arabuluculuk toplantısına katılmamanın sonucu; (4) işe başlatmama sonuçları; (5) kanun yolu.

      **İlgili hükümler ve değerlendirme:** Fesih bildirimi 2 Mart 2026'da tebliğ edilmiştir. İK m. 20/1'e göre bir aylık arabuluculuk başvuru süresi tebliğden işler; önelin bitiminden değil. Ali 25 Mart'ta başvurduğundan süresindedir. Son tutanak 10 Nisan'da düzenlenmiş, Ali iki hafta içinde, 20 Nisan'da dava açmıştır; dava da süresindedir.

      Davada feshin geçerli sebebe dayandığını işveren ispatlamak zorundadır (İK m. 20/2). İşveren "performans düşüklüğü" iddiasını kanıtlayamazsa fesih geçersizdir. Üstelik davranış veya verimle ilgili nedenlerle fesihte işçinin savunması alınmadan fesih yapılamaz (İK m. 19/2); savunma alınmaması da feshi usulsüz kılar. İşveren geçerli mazereti olmadan ilk toplantıya katılmadığından son tutanakta belirtilir; davada haklı çıksaydı bile, karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumlu tutulur ve lehine vekâlet ücretinin yalnız yarısına hükmedilirdi (7036 sayılı Kanun m. 3/12). Somut olayda ise işveren davayı kaybetmiştir: yargılama giderleri aleyhine hüküm verilen taraf olarak zaten ona yükletilir (HMK m. 326/1) ve lehine vekâlet ücreti doğmaz. Yaptırım ancak işveren davayı kazansaydı ayrıca sonuç doğururdu.

      Karar kesinleşip 5 Ekim 2026'da tebliğ edilmiş, Ali 12 Ekim 2026'da, yani on işgünü içinde başvurmuştur (İK m. 21/6). İşveren bir ay içinde işe başlatmadığından Ali, mahkemenin kararda belirlediği en az dört, en çok sekiz aylık ücret tutarında işe başlatmama tazminatına hak kazanır (İK m. 21/1-2). Ayrıca kararın kesinleşmesine kadar çalıştırılmadığı süre için en çok dört aya kadar ücret ve diğer haklar ödenir (İK m. 21/3). Her iki kalem dava tarihindeki ücret esas alınarak parasal olarak belirlenir (İK m. 21/4).

      Bildirim süresi ücreti peşin ödendiği için, işe başlatılmayan işçiye bildirim süresi verilmemiş veya ücreti peşin ödenmemişse ayrıca ödenmesini öngören İK m. 21/5'in ikinci cümlesi bu olayda uygulanmaz; ayrıca bir bildirim süresi ücreti istenemez. İK m. 17'ye göre üç yıldan fazla kıdemde bildirim süresi sekiz haftadır; bu süre peşin ödenmiştir. Kıdem tazminatı hesabı bu konunun dışındadır.

      Bölge adliye mahkemesi ivedilikle ve kesin olarak karar verdiğinden (İK m. 20/3) Yargıtay'a temyiz yolu yoktur.

      **Sonuç:** Süreler korunmuştur; fesih geçersizdir; Ali işe başlatılmadığından dört ile sekiz aylık işe başlatmama tazminatı ve en çok dört aylık boşta geçen süre ücreti isteyebilir; ayrı bir bildirim süresi ücreti isteyemez; karar kesindir.
  - olay: |
      Y Ltd. Şti. 40 işçi çalıştıran bir işyeridir. Belirsiz süreli iş sözleşmesiyle 8 aydır çalışan Deniz'e, 12 Ocak 2026'da gerekçeli yazılı fesih bildirimi tebliğ edilmiştir. Deniz arabulucuya başvurmadan 20 Ocak 2026'da doğrudan iş mahkemesinde işe iade davası açmıştır. Mahkeme dava şartı yokluğundan davayı usulden reddetmiş; ret kararı taraflara resen tebliğ edilmiş ve kesinleşmiştir. Kesinleşen ret kararı 2 Mart 2026'da Deniz'e resen tebliğ edilmiş, Deniz 10 Mart 2026'da arabulucuya başvurmuştur.

      Arabuluculuk toplantısında taraflar, Deniz'in 1 Nisan 2026'da işe başlatılması konusunda anlaşmışlar; ancak tutanağa boşta geçen süre ücretinin ve işe başlatmama tazminatının parasal miktarı yazılmamıştır.

      1. Mahkemenin usulden ret kararı yerinde midir?
      2. Deniz'in arabulucuya başvurusu süresinde midir?
      3. Arabulucu görevlendirildikten sonra faaliyeti hangi sürede sonuçlandırmalıdır?
      4. Tutanaktaki anlaşma geçerli bir işe başlatma anlaşması mıdır?
      5. Taraflar eksiksiz anlaşsaydı ve Deniz kararlaştırılan tarihte işe başlamasaydı sonuç ne olurdu?
    olcut:
      - {tespit: "İşe iade davasında arabuluculuğun dava şartı olması; başvurulmadan açılan davanın usulden reddi", puan: 20, madde: "7036 sayılı Kanun m. 3"}
      - {tespit: "Kesinleşen ret kararının resen tebliğinden itibaren iki hafta içinde arabulucuya başvurulabilmesi; 10 Mart başvurusunun süresindeliği", puan: 20, madde: "İK m. 20"}
      - {tespit: "Arabulucunun üç hafta içinde sonuçlandırması, zorunlu hâllerde en fazla bir hafta uzatma", puan: 15, madde: "7036 sayılı Kanun m. 3"}
      - {tespit: "Eksik anlaşma: işe başlatma tarihi, boşta geçen süre ücreti ve işe başlatmama tazminatı miktarlarının zorunluluğu; anlaşma sağlanamamış sayılması", puan: 30, madde: "İK m. 21"}
      - {tespit: "Eksiksiz anlaşmada işçinin kararlaştırılan tarihte işe başlamaması: fesih geçerli hâle gelir", puan: 15, madde: "İK m. 21"}
    cozum: |
      **Nitelendirme:** Deniz, 40 işçili işyerinde sekiz aylık kıdemli, belirsiz süreli sözleşmeli işçidir; İK m. 18 kapsamındadır. Olay, işe iade davasının dava şartı arabuluculukla ilişkisini ve arabuluculukta işe başlatma anlaşmasının unsurlarını sınamaktadır.

      **Hukuki sorunlar:** Dava şartı eksikliğinin sonucu; usulden ret sonrası başvuru süresi; arabulucunun süresi; İK m. 21/7'nin aradığı zorunlu unsurlar.

      **İlgili hükümler ve değerlendirme:** 7036 sayılı Kanun m. 3/1'e göre işe iade talebiyle açılan davada arabulucuya başvurulmuş olması dava şartıdır. Arabulucuya başvurulmadan dava açıldığı anlaşılırsa, 7036 sayılı Kanun m. 3/2 gereği herhangi bir işlem yapılmadan dava dava şartı yokluğundan usulden reddedilir. Mahkemenin kararı yerindedir.

      İK m. 20/1'e göre bu hâlde ret kararı resen tebliğ edilir ve kesinleşen ret kararının resen tebliğinden itibaren iki hafta içinde arabulucuya başvurulabilir. Ret kararı 2 Mart 2026'da tebliğ edildiğinden iki hafta 16 Mart'ta dolar; Deniz 10 Mart'ta başvurmuştur ve süresindedir. Arabulucu, başvuruyu görevlendirildiği tarihten itibaren üç hafta içinde sonuçlandırmalıdır; zorunlu hâllerde bu süre arabulucu tarafından en fazla bir hafta uzatılabilir (7036 sayılı Kanun m. 3/10). Arabuluculuk bürosuna başvurudan son tutanağa kadar geçen sürede zamanaşımı durur ve hak düşürücü süre işlemez (7036 sayılı Kanun m. 3/17).

      İK m. 21/7'ye göre işe başlatma konusunda anlaşılırsa taraflar üç şeyi belirlemek zorundadır: işe başlatma tarihi, boşta geçen süre ücret ve diğer hakların parasal miktarı ve işe başlatılmama hâlinde ödenecek işe başlatmama tazminatının parasal miktarı. Somut olayda yalnız işe başlatma tarihi (1 Nisan 2026) belirlenmiştir; iki parasal miktar eksiktir. Bu nedenle anlaşma sağlanamamış sayılır ve son tutanak buna göre düzenlenir. Deniz, anlaşmama son tutanağından itibaren iki hafta içinde iş mahkemesinde dava açabilir (İK m. 20/1).

      Taraflar üç unsuru da belirleyip anlaşsaydı ve Deniz kararlaştırılan tarihte işe başlamasaydı, İK m. 21/7'nin son cümlesi uyarınca fesih geçerli hâle gelir ve işveren yalnız bunun hukuki sonuçlarından sorumlu olurdu.

      **Sonuç:** Usulden ret yerindedir; başvuru süresindedir; arabulucu üç hafta (en fazla bir hafta uzatmayla) içinde sonuçlandırır; mevcut anlaşma İK m. 21/7'nin zorunlu unsurlarını taşımadığından anlaşma sağlanamamış sayılır; Deniz iki hafta içinde dava açabilir.
kartlar:
  - on: "Arabulucuya başvuru süresi ve başlangıcı nedir?"
    arka: "Fesih bildiriminin tebliğinden itibaren bir ay; önelli fesihte önelin bitiminden değil bildirimin tebliğinden başlar (İK m. 20/1)."
  - on: "Anlaşmama son tutanağından sonra dava süresi nedir?"
    arka: "Son tutanağın düzenlendiği tarihten itibaren iki hafta içinde iş mahkemesinde dava açılır (İK m. 20/1)."
  - on: "Arabulucuya başvurmadan açılan dava usulden reddedilirse ne yapılır?"
    arka: "Kesinleşen ret kararının resen tebliğinden itibaren iki hafta içinde arabulucuya başvurulabilir (İK m. 20/1)."
  - on: "İşe iade davasında ispat yükü kimdedir?"
    arka: "Feshin geçerli sebebe dayandığını işveren ispatlar; feshin başka sebebe dayandığını söyleyen işçi bu iddiasını ispatlar (İK m. 20/2)."
  - on: "İşe iade davasında kanun yolu?"
    arka: "İstinafta bölge adliye mahkemesi ivedilikle ve kesin olarak karar verir; temyiz yoktur (İK m. 20/3)."
  - on: "İşçi kesinleşen karardan sonra ne kadar sürede başvurmalı?"
    arka: "Kararın tebliğinden itibaren on işgünü içinde işverene başvurmalıdır; başvurmazsa fesih geçerli sayılır (İK m. 21/6)."
  - on: "İşveren işe başlatma için ne kadar süre sahiptir ve başlatmazsa ne olur?"
    arka: "Başvurudan itibaren bir ay; başlatmazsa işçiye en az dört, en çok sekiz aylık ücret tutarında tazminat öder (İK m. 21/1)."
  - on: "Boşta geçen süre ücreti nedir?"
    arka: "Kararın kesinleşmesine kadar çalıştırılmadığı süre için en çok dört aya kadar doğmuş ücret ve diğer haklardır (İK m. 21/3)."
  - on: "Tazminat ve boşta geçen süre ücreti hangi ücretle hesaplanır?"
    arka: "Dava tarihindeki ücret esas alınarak parasal olarak belirlenir (İK m. 21/4)."
  - on: "Arabuluculukta işe başlatma anlaşmasının zorunlu unsurları?"
    arka: "İşe başlatma tarihi, boşta geçen süre ücretinin miktarı, işe başlatmama tazminatının miktarı; eksikse anlaşma sağlanamamış sayılır (İK m. 21/7)."
  - on: "İlk toplantıya mazeretsiz katılmayan tarafın yaptırımı?"
    arka: "Davada haklı çıksa bile karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumludur; lehine vekâlet ücretinin yarısına hükmedilir (7036 sayılı Kanun m. 3/12)."
  - on: "İK m. 21/1-3 sözleşmeyle değiştirilebilir mi?"
    arka: "Hayır; sözleşmeyle hiçbir suretle değiştirilemez, aksi hükümler geçersizdir (İK m. 21/8)."
