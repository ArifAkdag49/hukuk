ozet: |
  - **Hak:** İşçi, **süresi belirli olsun veya olmasın** iş sözleşmesini sürenin bitiminden önce veya **bildirim süresini beklemeksizin** feshedebilir (İK m. 24). Genel çerçeve: dürüstlük kurallarına göre hizmet ilişkisini sürdürmesi beklenemeyen her durum haklı sebeptir (TBK m. 435/2).
  - **Üç sebep grubu (İK m. 24):**
    - **I. Sağlık sebepleri:** işin niteliğinden doğan sebeple işçinin sağlığı veya yaşayışı için tehlikeli olması (a); sürekli ve doğrudan görüştüğü işveren veya işçinin bulaşıcı ya da işiyle bağdaşmayan hastalığa tutulması (b).
    - **II. Ahlak ve iyiniyet kurallarına uymayan haller:** yanıltma (a); şeref ve namusa dokunma ve cinsel taciz (b); sataşma, gözdağı, kanuna aykırı davranışa kışkırtma, hapsi gerektiren suç, asılsız ağır isnat (c); diğer işçi veya üçüncü kişilerce cinsel tacizin bildirilmesine rağmen önlem alınmaması (d); ücretin hesaplanmaması veya ödenmemesi (e); parça başı ücrette az iş verilip farkın ödenmemesi veya çalışma şartlarının uygulanmaması (f).
    - **III. Zorlayıcı sebepler:** işyerinde **bir haftadan fazla** işin durmasını gerektirecek zorlayıcı sebep.
  - **Hak düşürücü süre (İK m. 26/1):** Ahlak ve iyiniyet kurallarına uymayan hallerde fesih yetkisi, olayı **öğrendiği günden başlayarak altı iş günü** geçtikten ve her hâlde **fiilin gerçekleşmesinden itibaren bir yıl** sonra kullanılamaz. İşçinin olayda **maddi çıkar sağlaması** hâlinde bir yıllık süre uygulanmaz; altı iş günü uygulanır.
  - **Tazminat hakkı saklıdır** (İK m. 26/2).
  - **Mali sonuç:** Haklı nedenle fesheden işçi, en az bir yıllık hizmeti varsa **kıdem tazminatı** alır (1475 sayılı Kanun m. 14); fesih işçiden geldiği ve haklı olduğu için **ihbar tazminatı** ödemez ve almaz.
  - **Zorlayıcı sebepte yarım ücret:** bekleme süresinde bir haftaya kadar her gün için yarım ücret (İK m. 40).
  - **Sık hatalar:** diğer işçi veya üçüncü kişinin tacizinde işverene bildirim aranır (İK m. 24/II-d); işverenin tacizinde aranmaz (İK m. 24/II-b). Zorlayıcı sebep işyerinde ise işçi (İK m. 24/III), işçiyi işyerine gelmekten alıkoyuyorsa işveren (İK m. 25/III) derhal fesheder.
anlatim: |
  ## 1. Hakkın niteliği ve genel çerçeve

  İşçinin haklı nedenle derhal fesih hakkı, taraflardan birinin artık iş ilişkisini sürdürmesinin beklenemeyeceği durumlarda sözleşmeyi **bildirim süresine ve hatta sürenin bitimine uymadan** sona erdirebilmesidir. Bu, **tek taraflı bir fesih beyanıyla kullanılan bozucu yenilik doğuran haktır**; karşı tarafın kabulüne gerek yoktur.

  Genel ölçüt TBK m. 435/2'dedir: sözleşmeyi fesheden taraftan, dürüstlük kurallarına göre hizmet ilişkisini sürdürmesi beklenemeyen bütün durum ve koşullar haklı sebep sayılır. İK m. 24 ise işçi yönünden belirli sebepleri sıralar. İşverenin haklı fesih sebepleri İK m. 25'te ayrıca düzenlenmiştir ve bu konunun karşıtıdır.

  İK m. 24'ün başında hakkın **kapsamı** da yazılıdır: işçi, süresi belirli olsun veya olmasın, iş sözleşmesini sürenin bitiminden önce veya bildirim süresini beklemeksizin feshedebilir.

  > **Örnek:** İki yıllık belirli süreli sözleşmeyle çalışan Aylin'in ücreti üç aydır ödenmiyor. Aylin, sürenin bitimini beklemeden İK m. 24 uyarınca sözleşmeyi feshedebilir.

  ## 2. Sebepler

  ### I. Sağlık sebepleri (İK m. 24/I)
  - **a)** İş sözleşmesinin konusu olan işin yapılması, işin niteliğinden doğan bir sebeple işçinin sağlığı veya yaşayışı için tehlikeli olursa.
  - **b)** İşçinin sürekli olarak yakından ve doğrudan buluşup görüştüğü işveren yahut başka bir işçi bulaşıcı veya işçinin işi ile bağdaşmayan bir hastalığa tutulursa.

  > **Örnek:** Kimyasal buhar yayan bir atölyede çalışan Mehmet için sağlık kurulu raporu, işin onun sağlığı için tehlikeli olduğunu göstermektedir. Mehmet İK m. 24/I-a'ya dayanarak derhal feshedebilir. Burada ayrıca bir "ahlak ve iyiniyet" ihlali aranmaz.

  ### II. Ahlak ve iyiniyet kurallarına uymayan haller ve benzerleri (İK m. 24/II)
  - **a) Yanıltma:** İşveren, sözleşme yapılırken sözleşmenin esaslı noktalarından biri hakkında yanlış vasıflar veya şartlar göstermek yahut gerçeğe uygun olmayan bilgi vermek veya söz söylemek suretiyle işçiyi yanıltırsa.
  - **b) Şeref ve namusa dokunma ve cinsel taciz:** İşveren, işçinin veya ailesi üyelerinden birinin şeref ve namusuna dokunacak sözler söyler, davranışlarda bulunursa veya işçiye cinsel tacizde bulunursa.
  - **c) Sataşma, gözdağı, kışkırtma ve ağır suçlama:** İşveren işçiye veya aile üyelerinden birine sataşır veya gözdağı verir; işçiyi kanuna karşı davranışa özendirir, kışkırtır, sürükler; işçiye veya aile üyelerine hapsi gerektiren bir suç işler; ya da işçi hakkında şeref ve haysiyet kırıcı asılsız ağır isnat veya itham yapar.
  - **d) Üçüncü kişilerce cinsel taciz:** İşçi, işyerinde diğer bir işçi veya üçüncü kişiler tarafından cinsel tacize uğrar ve bunu işverene bildirmesine rağmen gerekli önlemler alınmazsa.
  - **e) Ücret:** İşçinin ücreti kanun hükümleri veya sözleşme şartlarına uygun olarak hesap edilmez veya ödenmezse.
  - **f) Parça başı ücret ve çalışma şartları:** Ücret parça başına veya iş tutarı üzerinden ödenmesi kararlaştırılıp işçiye yapabileceği sayı ve tutardan az iş verilir ve ücret farkı zaman esasına göre ödenmezse; yahut çalışma şartları uygulanmazsa.

  > ⚠️ **Sınavda dikkat:** Cinsel tacizde iki ayrı bent vardır. **İşverenin kendisi** tacizde bulunursa doğrudan İK m. 24/II-b uygulanır. **Başka bir işçi veya üçüncü kişi** tacizde bulunuyorsa İK m. 24/II-d'nin şartı, işçinin durumu işverene bildirmesi ve buna rağmen gerekli önlemlerin alınmamasıdır. Bildirim yoksa bu bent işlemez.

  Bu bentler, işverenin işçiyi koruma ve gözetme borcuyla da bağlantılıdır: işveren, işçilerin psikolojik ve cinsel tacize uğramamaları için gerekli önlemleri almakla yükümlüdür (TBK m. 417/1). Bu yükümlülüğün ihlali haklı fesih sebebi olabilir.

  **Ücretin ödenmemesi (II-e)** uygulamada en sık karşılaşılan sebeptir. "Ücret" ifadesinin yalnızca çıplak ücret mi, yoksa ücretin eklentilerini de kapsayıp kapsamadığı yargı uygulamasında geniş yorumlanır. Çalışmaktan kaçınma hakkı ayrıdır: ücreti ödeme gününden itibaren yirmi gün içinde mücbir neden dışında ödenmeyen işçi iş görme borcunu yerine getirmekten kaçınabilir (İK m. 34/1). İK m. 24/II-e'nin metninde böyle bir yirmi günlük şart yazılı değildir; yalnızca bir iki günlük arızi gecikmelerin dürüstlük kuralı (TMK m. 2) bakımından derhal fesih için yeterli olup olmadığı ayrıca değerlendirilir.

  **Çalışma şartlarının uygulanmaması (II-f)** ile İK m. 22 ilişkilidir: işveren esaslı değişikliği yazılı bildirmeden yaparsa ve işçi altı işgünü içinde yazılı kabul etmezse değişiklik işçiyi bağlamaz (İK m. 22/1). Değişikliği kabul etmeyen işçi bu durumda haklı nedenle feshetme yoluna gidebilir.

  ### III. Zorlayıcı sebepler (İK m. 24/III)
  İşçinin çalıştığı **işyerinde** bir haftadan fazla süre ile işin durmasını gerektirecek zorlayıcı sebepler ortaya çıkarsa işçi derhal feshedebilir. Bu durumda işçiye bekleme süresi içinde bir haftaya kadar her gün için **yarım ücret** ödenir (İK m. 40).

  > ⚠️ **Sınavda dikkat:** İK m. 24/III'te zorlayıcı sebep **işyerindedir** (işin durmasını gerektirir). İK m. 25/III ise işçiyi işyerinde çalışmaktan alıkoyan zorlayıcı sebebi sayar ve işverene hak verir. Kim feshedebiliyor, ona göre bent değişir.

  | Sebep | Dayanak |
  |---|---|
  | Sağlık | İK m. 24/I |
  | Ahlak ve iyiniyet | İK m. 24/II |
  | Zorlayıcı sebep | İK m. 24/III |

  ## 3. Hak düşürücü süre: İK m. 26

  İK m. 26/1'e göre, 24 ve 25. maddelerde gösterilen **ahlak ve iyiniyet kurallarına uymayan hallere** dayanarak tanınan fesih yetkisi:

  - tarafın bu davranışı **öğrendiği günden başlayarak altı iş günü** geçtikten ve
  - her hâlde **fiilin gerçekleşmesinden itibaren bir yıl** sonra

  kullanılamaz. Ancak **işçinin olayda maddi çıkar sağlaması** hâlinde bir yıllık süre uygulanmaz.

  > 📌 **Kesin bilgi:** İK m. 26/1 metni yalnızca ahlak ve iyiniyet kurallarına uymayan halleri anar. Bu süre, sağlık sebepleri (İK m. 24/I) ve zorlayıcı sebepler (İK m. 24/III) için yazılı değildir. Maddi çıkar hâlinde yalnız bir yıllık üst süre kalkar; **altı iş günü** devam eder. Çıkarı sağlayan, fiili işleyen işçidir; istisna bu nedenle işverenin feshinde (İK m. 25/II) önem taşır.

  > **Örnek:** Müdür, 2 Mart Pazartesi günü Burak'ın eşinin şeref ve namusuna dokunan sözler söylemiştir. Burak aynı gün öğrenmiştir. 5 Mart'ta (üçüncü iş günü) feshederse süresindedir. Müdürün aynı toplantıda kendi eşi hakkında da benzer sözler söylediğini 2 Mart'ta öğrenen arkadaşı Cem, ancak 20 Mart'ta feshederse altı iş günü geçmiştir; fesih hakkı düşmüştür.

  Süre hak düşürücü olduğu için mahkeme tarafından **kendiliğinden gözetilir**, durmaz ve kesilmez. Süre, olayı öğrendiği günden itibaren tarafın **kendi bilgisine** göre işler.

  > 💡 **Püf nokta:** "Altı iş günü öğrenmeden, bir yıl fiilden." Bir yıllık süre fiil tarihinden sayıldığı için olayı çok geç öğrenen işçi bir yılı aşmışsa hakkını kullanamaz. Maddi çıkar istisnası fiili işleyip çıkar sağlayan işçiye ilişkindir; bu nedenle işverenin feshinde işler, işverenin davranışı üzerine fesheden işçiye bir yıllık süreyi aşma imkânı vermez.

  Süre içinde feshedenin diğer taraftan **tazminat hakları saklıdır** (İK m. 26/2).

  ## 4. Haklı fesihte sonuçlar

  ### Kıdem tazminatı
  1475 sayılı Kanun m. 14, İK m. 120 sayesinde yürürlükte kalan tek maddedir. Bu maddeye göre işçi tarafından haklı nedenle yapılan fesihte işçiye, işe başladığı tarihten itibaren hizmet akdinin devamı süresince her geçen **tam yıl** için 30 günlük ücreti tutarında kıdem tazminatı ödenir; bir yıldan artan süreler için de aynı oran üzerinden ödeme yapılır. Bu nedenle uygulamada en az bir yıllık hizmet aranır. Madde, işçi tarafından yapılan haklı feshi 1475 sayılı Kanun'un yürürlükten kalkan 16. maddesine yollamayla düzenler; bu hüküm bugün İK m. 24 olarak okunur.

  ### İhbar tazminatı
  Bildirim şartına uymayan taraf, bildirim süresine ilişkin ücret tutarında tazminat öder (İK m. 17/4). Haklı nedenle fesheden işçi bildirim süresine uymak zorunda olmadığı için **ihbar tazminatı ödemez**. Ayrıca fesheden işçi, kendi feshi nedeniyle ihbar tazminatı da alamaz; bu tazminat işverenin bildirim süresine uymadan yaptığı fesihte işçiye doğar.

  ### Belirli süreli sözleşme
  İşverenin kusuruyla işçiyi haklı nedenle feshe zorlaması hâlinde, haklı fesih sebebi karşı tarafın sözleşmeye uymamasından doğmuşsa o taraf, sebep olduğu zararı hizmet ilişkisine dayanan bütün haklar göz önünde tutularak tamamen gidermekle yükümlüdür (TBK m. 437/1). Haksız derhal fesihteki bakiye süre tazminatı ise TBK m. 438'de işveren için düzenlenmiştir; işçinin haklı feshindeki zararın kapsamı tartışmalıdır (doktrin bölümüne bakın).

  ### Manevi tazminat
  Taciz, hakaret, kişilik hakkı saldırısı gibi sebeplerde işçi, sözleşmeye aykırılıktan doğan sorumluluk hükümlerine dayanarak kişilik haklarının ihlalinden doğan zararının giderilmesini isteyebilir (TBK m. 417/3). 

  ## 5. Uygulama: nasıl feshedilir, nasıl ispatlanır?

  Fesih, sebep gösterilerek **yazılı** yapılmalıdır; TBK m. 435/1 sözleşmeyi fesheden tarafın fesih sebebini yazılı olarak bildirmesini ister. İşçiler bunu genellikle **noter ihtarnamesi** ile yapar. Fesih beyanında hangi bende dayanıldığının yazılması yararlıdır; ancak mahkeme hukuki nitelendirmeyi kendisi yapar.

  Haklı fesih iddiasında bulunan işçi, sebebin varlığını somut olguları ve delilleriyle göstermek durumundadır; mahkeme olayı İK m. 24'ün bentleriyle karşılaştırır.

  > ⚠️ **Sınavda dikkat:** Haklı fesheden işçiye kıdem tazminatı verilmesi için fesihte işçinin **haklı** olması şarttır. Haklı sebebi ispat edemeyen işçinin feshi bildirimsiz fesih sayılır; kıdem tazminatı hakkı doğmaz ve belirsiz süreli sözleşmede işçi işverene ihbar tazminatı (İK m. 17/4) ödemekle yükümlü olur.

  ## 6. İşçinin feshi ile işverenin feshi çakışırsa

  Yargı uygulamasında, tarafların birbirine yakın tarihlerde yaptığı fesihlerde, kural olarak **önce yapılan fesih** hüküm doğurur. İşçi haklı nedenle feshettikten sonra işveren sonradan "devamsızlık" gibi bir sebep ileri sürerek fesih bildirirse, sözleşme zaten sona erdiği için bu sonraki fesih sonuç doğurmaz. Bu sonuç, uygulama kuralıdır ve her olayda tarih sıralamasına bağlıdır.

  ## 7. Sık karıştırılanlar

  - **İK m. 24 ile İK m. 25.** İşçinin feshi İK m. 24'te, işverenin feshi İK m. 25'te düzenlenir; sebepler benzer görünse de bentler aynı değildir.
  - **Çalışmaktan kaçınma ile derhal fesih.** İK m. 34 iş görmeyi durdurma hakkıdır, sözleşmeyi sona erdirmez; İK m. 24/II-e ise sözleşmeyi sona erdirir.
  - **Süre türleri.** İK m. 26/1'deki süreler hak düşürücüdür; hâkim bunları kendiliğinden gözetir. Süre geçtiyse fesih haklı sayılmaz ve kıdem tazminatı gündeme gelmez.

  ## 8. Denetim şeması

  1. İşçi sözleşmeyi **kendisi mi** feshetti? (İşveren feshetmişse İK m. 25 ve İK m. 17 incelenir.)
  2. Sözleşme süreli ya da süresiz olsun, İK m. 24 uygulanır.
  3. **Sebep:** sağlık (I), ahlak ve iyiniyet (II), zorlayıcı sebep (III) bentlerinden hangisi? Bentte aranan unsurlar var mı (örneğin II-d'de bildirim ve önlem alınmaması)?
  4. **Süre:** ahlak ve iyiniyet halinde öğrenmeden **altı iş günü**, fiilden **bir yıl** (maddi çıkar istisnası işçinin çıkar sağladığı fiile, yani işverenin feshine ilişkindir).
  5. **Usul:** yazılı ve sebepli fesih beyanı (TBK m. 435/1).
  6. **Sonuç:** en az bir yıl kıdem varsa kıdem tazminatı; ihbar tazminatı yok; zorlayıcı sebepte İK m. 40 yarım ücret; kişilik hakkı ihlalinde ayrıca tazminat hakkı saklıdır.
kritik: |
  - 📌 İşçi, **süresi belirli olsun veya olmasın** haklı nedenle derhal feshedebilir (İK m. 24).
  - 📌 Haklı fesih kıdem tazminatını doğurur (en az bir yıllık hizmet); **ihbar tazminatı** doğmaz (1475 sayılı Kanun m. 14, İK m. 17).
  - 📌 Hak düşürücü süre: olayı öğrendiği günden başlayarak **altı iş günü**, her hâlde fiilden itibaren **bir yıl** (İK m. 26/1).
  - ⚠️ İşçinin olayda **maddi çıkar sağlaması** hâlinde yalnızca bir yıllık süre uygulanmaz; altı iş günü uygulanır (İK m. 26/1). Bu istisna çıkar sağlayan işçiye karşı işverenin feshinde işler.
  - ⚠️ İK m. 26/1 metni yalnız **ahlak ve iyiniyet kurallarına uymayan hallere** ilişkindir; sağlık sebepleri ve zorlayıcı sebep bu metinde anılmaz.
  - 📌 İşverenin cinsel tacizinde bildirim aranmaz (İK m. 24/II-b); diğer işçi veya üçüncü kişilerin tacizinde **işverene bildirim ve önlem alınmaması** şarttır (İK m. 24/II-d).
  - 📌 Zorlayıcı sebep: işçi için **işyerinde bir haftadan fazla** işin durması (İK m. 24/III); işveren için işçiyi işyerinde çalışmaktan alıkoyan zorlayıcı sebep (İK m. 25/III).
  - 📌 Zorlayıcı sebepte bekleme süresinde **bir haftaya kadar her gün için yarım ücret** ödenir (İK m. 40).
