  - 📌 Süre içinde feshedenin **tazminat hakları saklıdır** (İK m. 26/2).
  - ⚠️ Haklı sebebi ispat edemeyen işçinin feshi haklı sayılmaz; kıdem tazminatı doğmaz.
  - 📌 Fesih sebebi yazılı bildirilmelidir (TBK m. 435/1).
doktrin: |
  ### Ücret ödenmemesinde altı iş günü süresi
  İK m. 26/1, ahlak ve iyiniyet kurallarına uymayan hallerde (bu arada ücretin ödenmemesinde) altı iş günlük süre öngörür. Bir görüşe göre ücret ödenmemesi sürekli bir ihlaldir; ihlal devam ettiği sürece fesih hakkı da canlı kalır ve altı iş günü sınırı kıdem yönünden bir engel oluşturmaz. Karşı görüşe göre kanun metninde böyle bir istisna yoktur ve süre öğrenme gününden işlemelidir. Uygulamada ücretin ödenmemesi gibi devam eden ihlaller için süre sorununun daha esnek yorumlandığı bilinmektedir; ancak bu konuda kesin bir kural gibi cevap yazmak yerine "tartışmalıdır" demek ve olayın somut tarihlerine göre sonuç çıkarmak daha güvenlidir.

  ### Tüzel kişi işverende sürenin başlangıcı
  İşverenin haklı feshinde (İK m. 25) sürenin, tüzel kişi işverende kimin öğrenme anından başlayacağı tartışmalıdır. Bir görüşe göre feshe yetkili makamın olayı öğrendiği an esas alınır; disiplin soruşturması gerekiyorsa soruşturma raporunun bu makama sunulduğu tarih önem taşır. İşçinin feshinde ise sürenin başlangıcı çoğu kez işçinin kendi bilgisine bağlıdır.

  ### Belirli süreli sözleşmede işçinin haklı feshinde bakiye süre
  TBK m. 437/1'e göre haklı fesih sebebi karşı tarafın sözleşmeye uymamasından doğmuşsa o taraf zararı tamamen gidermelidir. Bir görüşe göre işveren kusurlu davranışıyla işçiyi haklı fesihe zorladığında, işçi sözleşme süresine uyulsaydı kazanabileceği tutarı da zarar olarak isteyebilir. Karşı görüşe göre bakiye süre ücreti TBK m. 438'de yalnız işverenin haksız derhal fesihine bağlanmıştır ve kıyas yoluyla genişletilemez. Sınavda bu tartışmayı açıkça belirterek anlatın.

  ### Uzun süre sessiz kalmanın etkisi
  Çalışma şartlarının işçi aleyhine değiştirilmesinde (İK m. 22) işçinin yıllarca itiraz etmeden çalışmaya devam etmesi, sonradan şekil eksikliğini veya haklı fesih sebebini ileri sürmesini dürüstlük kuralı (TMK m. 2) bakımından sorunlu kılabilir. Hukuk Genel Kurulu bu yönde bir kararında fark ücret talebi yönünden bu sonuca varmıştır (kararlar bölümüne bakın); haklı feshe uygulanması ise olayın koşullarına bağlıdır.
sozluk:
  - terim: Haklı nedenle derhal fesih
    tanim: "Bildirim süresine veya sözleşme süresinin bitimine uymadan, kanunda gösterilen haklı sebebe dayanılarak yapılan fesih (İK m. 24 ve İK m. 25)."
  - terim: Bozucu yenilik doğuran hak
    tanim: "Tek taraflı beyanla kullanılan ve karşı tarafın kabulüne gerek olmadan hukuki ilişkiyi sona erdiren hak."
  - terim: Hak düşürücü süre
    tanim: "Geçmesiyle hakkın kendisinin sona erdiği süre; hâkim kendiliğinden gözetir, durmaz ve kesilmez (İK m. 26/1)."
  - terim: Ahlak ve iyiniyet kurallarına uymayan haller
    tanim: "İK m. 24/II ve İK m. 25/II'de sayılan, taraflardan birinin dürüstlük kurallarına aykırı davranışları."
  - terim: Zorlayıcı sebep
    tanim: "İşin bir haftadan fazla durmasını gerektiren olağanüstü, öngörülemeyen olay; işçi için işyerinde (İK m. 24/III)."
  - terim: Yarım ücret
    tanim: "Zorlayıcı sebep nedeniyle çalışamayan işçiye bekleme süresinde bir haftaya kadar her gün için ödenen ücretin yarısı (İK m. 40)."
  - terim: Maddi çıkar
    tanim: "Fiili işleyen işçinin olaydan elde ettiği ekonomik yarar; varsa işverenin feshinde yalnız bir yıllık hak düşürücü süre uygulanmaz, altı iş günü uygulanır (İK m. 26/1)."
  - terim: Kıdem tazminatı
    tanim: "İşçinin her tam hizmet yılı için 30 günlük ücreti tutarında alacağı tazminat (1475 sayılı Kanun m. 14)."
  - terim: İhbar tazminatı
    tanim: "Bildirim şartına uymayan tarafın bildirim süresine ait ücret tutarında ödediği tazminat (İK m. 17)."
  - terim: Çalışmaktan kaçınma hakkı
    tanim: "Ücreti ödeme gününden itibaren yirmi gün içinde mücbir neden olmaksızın ödenmeyen işçinin iş görmeyi durdurabilmesi (İK m. 34)."
kararlar:
  - id: "1101648000"
    ozet: |
      Davacı, bir şirkette iş destek müdürü olarak 24.08.2009 ile 07.06.2016 arasında çalışmıştır. Aynı seviyedeki başka bir yöneticinin kendisi için "küçük adam" ve "şirkete iki küpeli" gibi lakaplar kullandığını, durumu genel müdüre bildirdiği hâlde işlem yapılmadığını belirterek sözleşmeyi İK m. 24/II uyarınca feshetmiş; kıdem tazminatı ve bazı işçilik alacaklarını istemiştir. İlk derece mahkemesi, sözlerin işveren temsilcisinden değil bir çalışandan geldiğini, bunun haklı fesih imkânı vermeyeceğini, işverenin kusuru bulunmadığını ve durumun işverene bildirildiğinin de ispatlanamadığını belirterek asıl davayı reddetmiş, işverenin ihbar tazminatı talebine ilişkin karşı davayı kabul etmiştir. Bölge adliye mahkemesi, sistemli bir psikolojik tacizin (mobbing) somut delillerle kanıtlanmadığı ve feshin haklı olmadığı gerekçesiyle istinaf başvurusunu esastan reddetmiştir. Yargıtay 9. Hukuk Dairesi bölge adliye mahkemesi kararını oy çokluğuyla onamıştır. Karşı oy, davranışın mobbing niteliğinde olmamasının haklı fesih sebebini ortadan kaldırmayacağını, işverenin koruma ve gözetme borcunu (TBK m. 417) ihlal ettiğini ve feshin haklı sayılması gerektiğini savunmuştur. Karar, haklı feshin ispatı ve mobbing ile haklı fesih arasındaki farkı göstermesi bakımından öğreticidir.
  - id: "1225445400"
    ozet: |
      Davacı belediye işçisi, 2014 yılında yazılı onayı alınmadan depo görevlisi olarak görevlendirilmiş ve yevmiyesi düşürülmüştür; yaklaşık beş yıl itiraz etmeden çalıştıktan sonra 08.05.2019'da fark ücret ve sosyal yardım alacakları için dava açmıştır. Dava bir haklı fesih davası değildir; ancak İK m. 22'nin yazılı bildirim şartının ihlalini ve çalışma şartlarının işçi aleyhine değişmesinin sonradan ileri sürülmesini konu alır. İlk derece mahkemesi davayı reddetmiş, bölge adliye mahkemesi kısmen kabul etmiş, 9. Hukuk Dairesi bozmuş, bölge adliye mahkemesinin direnmesi üzerine dosya Hukuk Genel Kurulu'na gelmiştir. Hukuk Genel Kurulu, işçinin yaklaşık beş yıl boyunca görev ve ücret değişikliğine itiraz etmeyip çalışmaya devam etmesi karşısında, yıllar sonra İK m. 22/1'deki şekil eksikliğini ileri sürmesini dürüstlük kuralına ve hakkın kötüye kullanılması yasağına (TMK m. 2) aykırı bulmuş ve oy çokluğuyla direnme kararını bozmuştur. Kurul ayrıca, yapılmayan bir işin ücretinin istenemeyeceğini belirtmiştir.
sorular:
  - soru: |
      İki yıllık belirli süreli iş sözleşmesiyle çalışan Aylin'in ücreti üç aydır ödenmemektedir. Aylin, sözleşme süresinin bitmesini beklemeden iş sözleşmesini feshetmek istemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Belirli süreli sözleşmede işçi haklı nedenle derhal feshedemez."
      - "İşçi, süresi belirli olsun veya olmasın İK m. 24'teki sebeplere dayanarak derhal feshedebilir."
      - "Ancak mahkeme izin verirse feshedebilir."
      - "Yalnızca bildirim süresine uyarak feshedebilir."
    dogru: 1
    aciklama: |
      İK m. 24'ün başında işçinin, süresi belirli olsun veya olmasın, sözleşmeyi sürenin bitiminden önce veya bildirim süresini beklemeksizin feshedebileceği yazılıdır. Ücretin ödenmemesi İK m. 24/II-e kapsamındadır.
  - soru: |
      Çağrı merkezi çalışanı Deniz, ekip arkadaşı tarafından cinsel tacize uğramış; durumu işverene yazılı olarak bildirmiş, ancak işveren hiçbir önlem almamıştır. Deniz iş sözleşmesini derhal feshetmiştir. Fesih hangi hükme dayanır?
    siklar:
      - "İK m. 24/II-b"
      - "İK m. 24/II-c"
      - "İK m. 24/II-d"
      - "İK m. 24/III"
    dogru: 2
    aciklama: |
      İK m. 24/II-d, işçinin işyerinde diğer bir işçi veya üçüncü kişiler tarafından cinsel tacize uğraması ve bunu işverene bildirmesine rağmen gerekli önlemlerin alınmaması hâlini düzenler. İK m. 24/II-b ise işverenin kendisinin tacizini kapsar.
  - soru: |
      Satış elemanı Ece, bir müşterinin kendisine cinsel tacizde bulunduğunu ileri sürerek durumu işverene hiç bildirmeden sözleşmeyi derhal feshetmiştir. İK m. 24/II-d bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Bildirim gerekmediğinden bent hemen uygulanır."
      - "Bentte işverene bildirim ve işverenin önlem almaması aranır; bildirim olmadığı için bu bendin şartı gerçekleşmemiştir."
      - "Müşteri üçüncü kişi olduğundan bent hiç uygulanmaz."
      - "Taciz işverenden gelmediği için işçi ihbar tazminatı öder."
    dogru: 1
    aciklama: |
      İK m. 24/II-d, işçinin durumu işverene bildirmesine rağmen gerekli önlemlerin alınmamasını arar. Üçüncü kişiler de bu bende dahildir; ama bildirim ve önlem alınmaması unsurları gerçekleşmeden bent uygulanmaz. İşverenin kendisi tacizde bulunsaydı doğrudan İK m. 24/II-b uygulanırdı.
  - soru: |
      İK m. 26/1'e göre ahlak ve iyiniyet kurallarına uymayan hallere dayanan fesih yetkisi bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Olayı öğrendiği günden başlayarak altı iş günü ve her hâlde fiilin gerçekleşmesinden itibaren bir yıl geçtikten sonra kullanılamaz."
      - "Olayı öğrendiği günden başlayarak altı ay ve fiilden itibaren on yıl sonra kullanılamaz."
      - "Olayı öğrendiği günden itibaren bir ay geçtikten sonra kullanılamaz."
      - "Süreye bağlı değildir, işçi dilediği zaman kullanır."
    dogru: 0
    aciklama: |
      İK m. 26/1: altı iş günü (öğrenmeden başlayarak) ve her hâlde fiilin gerçekleşmesinden itibaren bir yıl. İki süre birlikte aranır; hangisi önce dolarsa hak düşer.
  - soru: |
      Müdür, 2 Mart Pazartesi günü Cem'in eşinin şeref ve namusuna dokunan sözler söylemiş; Cem durumu aynı gün öğrenmiştir. Cem, ancak 20 Mart'ta sözleşmeyi derhal feshetmiştir. Sonuç nedir?
    siklar:
      - "Fesih haklıdır; çünkü bir yıllık süre dolmamıştır."
      - "Altı iş günü geçtiği için fesih yetkisi kullanılamaz; hak düşmüştür."
      - "Fesih haklıdır; çünkü hak düşürücü süre fiilin sona erdiği günden başlar."
      - "Süre yalnızca işveren için uygulanır, işçi için uygulanmaz."
    dogru: 1
    aciklama: |
      Cem olayı 2 Mart'ta öğrenmiştir; İK m. 26/1'deki altı iş günü geçmiştir. Bir yıllık sürenin dolmamış olması altı iş günlük süreyi ortadan kaldırmaz.
  - soru: |
      Kasiyer Hakan'ın tahsilatları zimmetine geçirerek maddi çıkar sağladığı, fiilin üzerinden bir yıldan uzun süre geçtikten sonra işverence öğrenilmiştir. İK m. 26/1 bakımından işverenin fesih yetkisi hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İşçi olayda maddi çıkar sağladığı için bir yıllık süre uygulanmaz; öğrenmeden başlayan altı iş günlük süre ise uygulanır."
      - "Maddi çıkar hâlinde hiçbir süre uygulanmaz."
      - "Maddi çıkar hâlinde altı iş günü kalkar, bir yıl uygulanır."
      - "Fiilden itibaren bir yıl geçtiği için işveren artık feshedemez."
    dogru: 0
    aciklama: |
      İK m. 26/1: işçinin olayda maddi çıkar sağlaması hâlinde bir yıllık süre uygulanmaz. Altı iş günlük süre öğrenme gününden başlayarak işlemeye devam eder. Bu istisna, fiili işleyip çıkar sağlayan işçiye karşı işverenin feshinde işler; işverenin davranışı üzerine fesheden işçi yönünden bir yıllık süre her hâlde uygulanır.
  - soru: |
      Depremde işyeri hasar görmüş ve işin on gün durması gerekmiştir. Emre bu sebeple sözleşmeyi derhal feshetmek istemektedir. Hangi hüküm uygulanır?
    siklar:
      - "İK m. 24/I"
      - "İK m. 24/II-f"
      - "İK m. 24/III"
      - "İK m. 25/III"
    dogru: 2
    aciklama: |
      İK m. 24/III: işçinin çalıştığı işyerinde bir haftadan fazla süre ile işin durmasını gerektirecek zorlayıcı sebepler ortaya çıkarsa işçi derhal feshedebilir. İK m. 25/III ise işverenin fesih hakkını düzenler. Bekleme süresinde bir haftaya kadar her gün için yarım ücret ödenir (İK m. 40).
  - soru: |
      İşçi Elif, İK m. 24/II-b uyarınca haklı nedenle sözleşmesini feshetmiştir. Elif'in kıdemi üç yıldır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Kıdem tazminatına hak kazanır; ihbar tazminatı ödemez ve almaz."
      - "Kıdem tazminatına hak kazanamaz."
      - "Hem kıdem hem ihbar tazminatına hak kazanır."
      - "İşverene ihbar tazminatı öder."
    dogru: 0
    aciklama: |
      Haklı nedenle fesheden işçi, bir yıllık hizmeti varsa 1475 sayılı Kanun m. 14 uyarınca kıdem tazminatına hak kazanır. Haklı fesihte bildirim süresine uyma zorunluluğu yoktur; ihbar tazminatı ne ödenir ne alınır (İK m. 17).
  - soru: |
      İK m. 24/III kapsamındaki zorlayıcı sebep nedeniyle işyerinde bekleme yapılmaktadır. İşçiye bekleme süresinde ödeme bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Hiçbir ödeme yapılmaz."
      - "Bir haftaya kadar her gün için yarım ücret ödenir."
      - "Bir aya kadar her gün için tam ücret ödenir."
      - "Her gün için iki katı ücret ödenir."
    dogru: 1
    aciklama: |
      İK m. 40: İK m. 24 ve İK m. 25'in (III) numaralı bentlerinde gösterilen zorlayıcı sebepler dolayısıyla çalışamayan veya çalıştırılmayan işçiye bu bekleme süresi içinde bir haftaya kadar her gün için yarım ücret ödenir.
  - soru: |
      İşverenin sözleşme yapılırken esaslı noktalardan biri hakkında gerçeğe uygun olmayan bilgiler vererek işçiyi yanılttığı anlaşılmıştır. Bu durumda işçi hangi bende dayanarak derhal feshedebilir?
    siklar:
      - "İK m. 24/I-a"
      - "İK m. 24/II-a"
      - "İK m. 24/II-e"
      - "İK m. 24/III"
    dogru: 1
    aciklama: |
      İK m. 24/II-a: işveren iş sözleşmesi yapıldığı sırada sözleşmenin esaslı noktalarından biri hakkında yanlış vasıflar veya şartlar göstermek yahut gerçeğe uygun olmayan bilgiler vermek suretiyle işçiyi yanıltırsa işçi derhal feshedebilir.
  - soru: |
      Ücreti ödeme gününden itibaren yirmi gün içinde mücbir neden olmaksızın ödenmeyen işçinin hakları bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İşçi iş görme borcunu yerine getirmekten kaçınabilir (İK m. 34); ayrıca İK m. 24/II-e kapsamında haklı nedenle de feshedebilir."
      - "İşçi yalnızca çalışmaktan kaçınabilir, feshedemez."
      - "İşçi yalnızca feshedebilir, çalışmaktan kaçınamaz."
      - "İşçi yalnızca mahkeme kararıyla çalışmaktan kaçınabilir."
    dogru: 0
    aciklama: |
      İK m. 34/1 çalışmaktan kaçınma hakkını verir; İK m. 24/II-e ise ücretin kanun veya sözleşmeye uygun hesap edilmemesi veya ödenmemesi hâlinde derhal fesih hakkı tanır. İki hak ayrı hükümlere dayanır.
  - soru: |
      Haklı nedenle fesih sonrasında işçinin tazminat hakkı bakımından İK m. 26/2 ne söyler?
    siklar:
      - "Süre içinde feshedenlerin diğer taraftan tazminat hakları saklıdır."
      - "Haklı fesheden işçi hiçbir tazminat isteyemez."
      - "Tazminat hakkı yalnızca işveren için saklıdır."
      - "Tazminat hakkı mahkeme kararıyla doğar."
    dogru: 0
    aciklama: |
      İK m. 26/2: haklı sebeplerle işçi yahut işverenden iş sözleşmesini 26/1'de öngörülen süre içinde feshedenlerin diğer taraftan tazminat hakları saklıdır.
olaylar:
  - olay: |
      A Holding'in işçisi Burak, belirsiz süreli iş sözleşmesiyle dört yıldır çalışmaktadır. İşverenin yetkili müdürü, 2 Mart 2026 Pazartesi günü bir toplantıda Burak'ın eşinin şeref ve namusuna dokunan sözler söylemiş; Burak durumu aynı gün öğrenmiştir. Burak 5 Mart 2026'da noter ihtarnamesiyle bu sebebe dayanarak iş sözleşmesini derhal feshetmiştir. İhtarnamede ayrıca iki aylık ücretinin de ödenmediği belirtilmiştir.

      Burak'ın iş arkadaşı Cem de aynı toplantıdadır; müdür aynı toplantıda Cem'in eşi hakkında da şeref ve namusa dokunan sözler söylemiş, Cem bunu 2 Mart 2026'da öğrenmiştir. Cem, Burak'ın feshinden ilham alarak 20 Mart 2026'da noter ihtarnamesiyle bu sebebe dayanarak sözleşmesini derhal feshetmiştir.

      1. Burak'ın feshi hangi bentlere dayanır, süresinde midir?
      2. Burak hangi tazminat kalemlerini isteyebilir?
      3. Cem'in feshi bakımından sonuç nedir?
    olcut:
      - {tespit: "Burak'ın feshi şeref ve namusa dokunma (İK m. 24/II-b) ve ücretin ödenmemesi (İK m. 24/II-e) bentlerine dayanır", puan: 25, madde: "İK m. 24"}
      - {tespit: "Burak olayı 2 Mart'ta öğrenmiş, 5 Mart'ta feshetmiştir; altı iş günü içindedir ve hak düşmemiştir", puan: 20, madde: "İK m. 26"}
      - {tespit: "Burak'ın kıdem tazminatına hak kazanması (dört yıllık hizmet); ihbar tazminatının doğmaması", puan: 25, madde: "1475 sayılı Kanun m. 14"}
      - {tespit: "Cem'in öğrenmeden itibaren altı iş günü geçtikten sonra feshetmesi; fesih yetkisinin kullanılamaması", puan: 20, madde: "İK m. 26"}
      - {tespit: "İçinde bulunulan sürenin hak düşürücü olması ve tazminat haklarının saklı olması (İK m. 26/2)", puan: 10, madde: "İK m. 26"}
    cozum: |
      **Nitelendirme:** İş sözleşmesi, işçilerce kendi iradeleriyle, haklı nedene dayanılarak derhal feshedilmiştir. Olayda İK m. 24/II'deki ahlak ve iyiniyet kurallarına uymayan haller ve İK m. 26'daki hak düşürücü süre sorunu vardır.

      **Hukuki sorunlar:** (1) Fesih sebebinin hangi bende girdiği; (2) hak düşürücü sürenin korunup korunmadığı; (3) fesih sonrası mali sonuçlar; (4) Cem'in feshinin akıbeti.

      **İlgili hükümler ve değerlendirme:** Burak yönünden iki sebep vardır. İşveren adına hareket eden yetkili müdürün Burak'ın eşinin şeref ve namusuna dokunan sözler söylemesi, İK m. 24/II-b kapsamındadır; çünkü bu bent, işverenin işçinin veya ailesi üyelerinden birinin şeref ve namusuna dokunacak sözler söylemesini veya davranışlarda bulunmasını sayar. İki aylık ücretin ödenmemesi ise İK m. 24/II-e'ye girer.

      İK m. 26/1'e göre ahlak ve iyiniyet kurallarına uymayan hallere dayanan fesih yetkisi, olayı öğrendiği günden başlayarak altı iş gün geçtikten sonra kullanılamaz. Burak 2 Mart Pazartesi günü öğrenmiş, 5 Mart Perşembe günü (üçüncü iş günü) feshetmiştir; süre korunmuştur. Fiilden bir yıl da geçmemiştir. Fesih beyanı noter ihtarnamesiyle yazılı yapılmıştır (TBK m. 435/1).

      İki aylık ücretin ödenmemesi bakımından altı iş günü kuralının nasıl işleyeceği doktrinde tartışmalıdır; ancak şeref ve namusa dokunma sebebi tek başına süresinde ve yeterlidir. Haklı nedenle fesheden işçi, bir yıldan fazla hizmeti olduğu için 1475 sayılı Kanun m. 14 uyarınca her tam hizmet yılı için 30 günlük ücreti tutarında kıdem tazminatına hak kazanır. Haklı fesihte bildirim süresine uyma zorunluluğu yoktur; Burak ihbar tazminatı ödemez ve almaz (İK m. 17). Ayrıca İK m. 26/2'ye göre süre içinde feshedenin diğer taraftan tazminat hakları saklıdır; kişilik hakkı ihlali iddiası yönünden ayrıca TBK m. 417/3'e dayanılabilir.

      Cem'in eşine yönelik sözler de İK m. 24/II-b kapsamındadır; ancak Cem olayı 2 Mart'ta öğrenmiştir. 20 Mart'ta yaptığı fesih altı iş günlük süre geçtikten sonra yapılmıştır; İK m. 26/1 gereği fesih yetkisi kullanılamaz. Cem'in feshi haklı fesih olarak kabul edilmez; sözleşmeyi bildirim süresine uymadan sona erdirmiş sayılır. Kıdem tazminatı haklı fesih şartına bağlı olduğundan doğmaz ve işçi bildirim şartına uymadığı için ihbar tazminatı ödemekle karşılaşabilir (İK m. 17/4). Bir yıllık sürenin dolmamış olması bu sonucu değiştirmez.

      **Sonuç:** Burak'ın feshi süresinde ve haklıdır; kıdem tazminatına hak kazanır, ihbar tazminatı ödemez. Cem'in feshi süresinde yapılmadığı için hak düşürücü süre nedeniyle haklı sayılmaz.
  - olay: |
      B Çağrı Merkezi'nde iki yıldır çalışan Deniz, ekip arkadaşı Kerem'in kendisine cinsel tacizde bulunduğunu yazılı olarak işverene bildirmiş, ancak işveren hiçbir önlem almamış ve Kerem'in davranışları sürmüştür. Deniz bunun üzerine sözleşmeyi derhal feshetmiştir.

      Aynı işyerinde çalışan Ece ise bir müşterinin kendisine cinsel tacizde bulunduğunu söyleyerek, durumu işverene hiç bildirmeden sözleşmeyi derhal feshetmiştir.

      İşyerinin binası ayrıca bir yangında hasar görmüş ve işin on gün boyunca durması gerekmiştir. Bu süre içinde işyerinde çalıştırılamayan Emre (üç yıllık işçi), bir haftalık bekleme süresi dolduktan sonra, durmanın sekizinci günü sözleşmesini derhal feshetmiştir.

      1. Deniz'in feshi hangi bende dayanır; şartları gerçekleşmiş midir?
      2. Ece'nin feshi aynı bent bakımından haklı mıdır?
      3. Emre'nin feshi hangi hükme dayanır; bekleme süresinde ücret hakkı var mıdır?
      4. Üç işçi bakımından kıdem ve ihbar tazminatı sonuçları nelerdir?
    olcut:
      - {tespit: "Deniz'in feshinin İK m. 24/II-d'ye dayanması; bildirim yapılmış ve önlem alınmamıştır", puan: 25, madde: "İK m. 24"}
      - {tespit: "Ece'nin işverene bildirim yapmadığı için İK m. 24/II-d şartlarının gerçekleşmemesi", puan: 25, madde: "İK m. 24"}
      - {tespit: "Emre'nin feshinin İK m. 24/III'e dayanması; işyerinde bir haftadan fazla işin durması", puan: 20, madde: "İK m. 24"}
      - {tespit: "Bekleme süresinde bir haftaya kadar her gün için yarım ücret hakkı", puan: 15, madde: "İK m. 40"}
      - {tespit: "Haklı fesihte kıdem tazminatı ve ihbar tazminatı sonuçları", puan: 15, madde: "1475 sayılı Kanun m. 14"}
    cozum: |
      **Nitelendirme:** Üç ayrı işçi İK m. 24 kapsamında derhal fesih iddiasındadır: Deniz ve Ece cinsel taciz nedeniyle (İK m. 24/II), Emre zorlayıcı sebep nedeniyle (İK m. 24/III).

      **Hukuki sorunlar:** (1) Cinsel tacizde işverenin kendisinin mi yoksa üçüncü kişilerin mi fail olduğuna göre bent ve şart; (2) bildirim ve önlem alınmaması unsuru; (3) zorlayıcı sebepte işyerinde bir haftadan fazla durma ve ücret; (4) mali sonuçlar.

      **İlgili hükümler ve değerlendirme:** İK m. 24/II-d, işçinin işyerinde diğer bir işçi veya üçüncü kişiler tarafından cinsel tacize uğramasını ve bu durumu işverene bildirmesine rağmen gerekli önlemlerin alınmamasını arar. Deniz tacizi yazılı olarak bildirmiş, işveren önlem almamıştır; bent şartları gerçekleşmiştir. İşverenin bu davranışı ayrıca TBK m. 417/1'deki, işçileri cinsel tacizden korumak için gerekli önlemleri alma borcunun ihlalidir.

      Ece'yi taciz eden müşteri üçüncü kişidir; bent üçüncü kişileri de kapsar. Ancak Ece durumu işverene hiç bildirmediğinden, işverenin önlem almadığından söz edilemez. İK m. 24/II-d'nin şartı gerçekleşmediği için Ece'nin feshi bu bende dayanılarak haklı sayılamaz. Bu sonuç, tacizin gerçek olmadığı anlamına gelmez; yalnız bu bent bakımından şart oluşmamıştır. İşverenin kendisi tacizde bulunsaydı İK m. 24/II-b uygulanacak ve bildirim aranmayacaktı.

      Emre'nin çalıştığı işyerinde yangın nedeniyle işin on gün durması gerekmiştir. İK m. 24/III işçinin çalıştığı işyerinde bir haftadan fazla süre ile işin durmasını gerektirecek zorlayıcı sebepleri haklı fesih sebebi sayar. Bu sebep için İK m. 26/1'in altı iş günü ve bir yıl süreleri metinde anılmaz; çünkü o hüküm yalnız ahlak ve iyiniyet kurallarına uymayan hallere ilişkindir. Bekleme süresi içinde çalışamayan işçiye bir haftaya kadar her gün için yarım ücret ödenir (İK m. 40).

      Mali sonuç: Deniz ve Emre haklı nedenle fesheden işçiler olarak 1475 sayılı Kanun m. 14 uyarınca bir yılı aşan hizmetleri için kıdem tazminatına hak kazanırlar; ihbar tazminatı ödemez ve almazlar (İK m. 17). Ece'nin feshi haklı sayılmazsa kıdem tazminatı doğmaz ve bildirim şartına uymadığı için ihbar tazminatı sorunu gündeme gelir; ancak sonuç, Ece'nin tacizi başka bir bende veya TBK m. 435/2'deki genel haklı sebep ölçütüne dayandırıp dayandıramayacağına ve ispat durumuna bağlıdır.

      **Sonuç:** Deniz'in feshi İK m. 24/II-d'ye göre haklıdır; Ece'nin feshi bu bent bakımından şart eksikliği nedeniyle haklı değildir; Emre'nin feshi İK m. 24/III'e dayanır, bekleme süresinde yarım ücret alır ve haklıdır.
kartlar:
  - on: "İşçinin haklı nedenle derhal fesih hakkı hangi sözleşmelerde kullanılır?"
    arka: "Süresi belirli olsun veya olmasın, her iş sözleşmesinde; bildirim süresi veya sürenin bitimi beklenmez (İK m. 24)."
  - on: "İK m. 24'ün üç sebep grubu?"
    arka: "I. Sağlık sebepleri, II. Ahlak ve iyiniyet kurallarına uymayan haller, III. Zorlayıcı sebepler (İK m. 24)."
  - on: "Sağlık sebepleri (İK m. 24/I) nelerdir?"
    arka: "a) İşin niteliğinden doğan sebeple işçinin sağlığı veya yaşayışı için tehlikeli olması; b) sürekli görüşülen işveren veya işçinin bulaşıcı ya da işle bağdaşmayan hastalığa tutulması."
  - on: "İşverenin cinsel tacizi hangi bende girer?"
    arka: "İK m. 24/II-b; bildirim şartı aranmaz."
  - on: "Diğer işçi veya üçüncü kişilerin cinsel tacizinde fesih şartı?"
    arka: "İşçinin durumu işverene bildirmesi ve işverenin gerekli önlemleri almaması gerekir (İK m. 24/II-d)."
  - on: "Ücretin ödenmemesi hangi bende girer?"
    arka: "İK m. 24/II-e: ücretin kanun veya sözleşmeye uygun hesap edilmemesi veya ödenmemesi."
  - on: "İşçi için zorlayıcı sebep ne zaman haklı fesih sebebidir?"
    arka: "İşçinin çalıştığı işyerinde bir haftadan fazla süre ile işin durmasını gerektirecek zorlayıcı sebep ortaya çıkarsa (İK m. 24/III)."
  - on: "Zorlayıcı sebepte bekleme süresinde ücret?"
    arka: "Bir haftaya kadar her gün için yarım ücret (İK m. 40)."
  - on: "İK m. 26/1'deki hak düşürücü süreler?"
    arka: "Öğrenmeden başlayarak altı iş günü; her hâlde fiilden itibaren bir yıl. Maddi çıkarda bir yıllık süre uygulanmaz."
  - on: "İK m. 26/1 hangi hallere ilişkindir?"
    arka: "Ahlak ve iyiniyet kurallarına uymayan hallere (İK m. 24/II ve İK m. 25/II); metin sağlık ve zorlayıcı sebebi anmaz."
  - on: "Haklı fesheden işçi hangi tazminatları alır?"
    arka: "Kıdem tazminatı (en az bir yıl hizmetle, 1475 sayılı Kanun m. 14); ihbar tazminatı ödenmez ve alınmaz (İK m. 17)."
  - on: "Haklı fesih beyanı nasıl yapılır?"
    arka: "Fesih sebebi yazılı bildirilir (TBK m. 435/1); uygulamada çoğunlukla noter ihtarnamesi kullanılır."
