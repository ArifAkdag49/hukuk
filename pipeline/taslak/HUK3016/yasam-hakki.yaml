  - ⚠️ Derogasyon yasağı: Savaş ve olağanüstü hâllerde bile, savaş hukukuna uygun ölümler dışında yaşama hakkına dokunulamaz (AY m. 15/2).
  - 📌 Ölüm cezası: AY m. 38/10 "Ölüm cezası ve genel müsadere cezası verilemez"; 5170 sayılı Kanun ilgili ifadeleri AY m. 15, 17 ve 38'den çıkarmıştır.
  - 📌 AY m. 17/4'ten 6771 sayılı Kanunla "sıkıyönetim" ibaresi çıkarılmıştır.
  - ⚠️ Sınırın kast olmaksızın aşılması TCK m. 27/1 ile taksirle sorumluluğa yol açabilir; ceza altıda birinden üçte birine kadar indirilir.
  - ⚠️ Usuli yükümlülük sonuç değil araç yükümlülüğüdür: Soruşturma etkili olmalıdır, mahkûmiyetle bitmek zorunda değildir.
  - 📌 Sağlık alanında devlet kamu ve özel sağlık kurumlarını denetlemekle yükümlüdür (AY m. 56/4).
doktrin: |
  ### Yaşamın başlangıcı
  Yaşama hakkının ne zaman başladığı tartışmalıdır. Bir görüşe göre yaşama hakkının öznesi, tam ve sağ doğumla kişilik kazanan insandır; cenin bağımsız hak öznesi değildir. Karşı görüşe göre cenin de AY m. 17/1 kapsamında korunması gereken bir değerdir. AİHM içtihadında yaşamın başlangıcı konusunda Avrupa'da ortak bir görüş bulunmadığı, bu nedenle devletlerin takdir marjına sahip olduğu kabul edilir; gelişen yaşam potansiyelinin korunması annenin yaşam ve sağlık hakkıyla dengelenir. Sınavda bu konu "tartışmalıdır" diye yazılmalı, kesin hükme bağlanmamalıdır.

  ### Ölme hakkı ve ötanazi
  AİHM içtihadında yaşama hakkının "ölme hakkını" içermediği kabul edilir. Türk hukukunda aktif ötanazi, kasten öldürme (TCK m. 81) veya intihara yönlendirme (TCK m. 84) kapsamında değerlendirilir. Hastanın aydınlatılmış onamıyla tedaviyi reddetmesi ya da tedavinin geri çekilmesi ise vücut bütünlüğüne dokunulmazlık (AY m. 17/2) ile yaşamı koruma yükümlülüğü arasındaki sınırda tartışılır. Bir görüş, hastanın kendi bedeni üzerindeki karar hakkını öne çıkarır; diğer görüş, yaşamın korunmasında devletin koruyucu rolünü vurgular.

  ### Kaçan şüpheliye karşı silah yetkisinin sınırı
  2559 sayılı Kanun m. 16/7-c yakalama emri bulunan kişinin yakalanması için silah kullanma yetkisi tanır. Baskın görüş, bu yetkinin şiddet içermeyen ve kimsenin yaşamını tehdit etmeyen bir suç şüphelisine karşı öldürücü ateşe cevaz verecek biçimde yorumlanamayacağını, kanunun "sağlayacak ölçüde" ifadesinin mutlak zorunluluk ölçütüyle birlikte okunması gerektiğini savunur. Bu görüşe göre, başka yoldan yakalama imkânı varken öldürücü bölgeye ateş, kanuni yetkinin sınırını aşar. Uygulamada sınırın aşılması TCK m. 27/1'in taksirli sorumluluğu mu, yoksa kast yönünden daha ağır bir sorumluluğu mu doğuracağı olayın özelliklerine göre değerlendirilir; kesin bir formül yoktur.
sozluk:
  - terim: Negatif yükümlülük
    tanim: "Devlet görevlilerinin yaşama kasten ve hukuka aykırı biçimde son vermeme, güç kullanımında mutlak zorunluluk sınırında kalma ödevi."
  - terim: Pozitif yükümlülük
    tanim: "Devletin yaşamı koruyucu hukuki ve idari çerçeve kurma ve gerçek, yakın tehlikeye karşı önleyici tedbir alma ödevi."
  - terim: Usuli yükümlülük
    tanim: "Şüpheli ölümlerde etkili bir resmî soruşturma yürütme ve sorumluları ortaya çıkarma ödevi."
  - terim: Mutlak zorunluluk
    tanim: "Yaşama hakkını etkileyen güç kullanımında aranan, 'makul gereklilik'ten daha sıkı ölçüt; amaca ulaşmak için kaçınılmaz olandan fazlasına izin vermez."
  - terim: Osman testi
    tanim: "Yetkililerin gerçek ve yakın bir yaşam tehlikesini bildiği veya bilmesi gerektiği hâlde makul önlemi almaması ölçütü."
  - terim: Derogasyon
    tanim: "Olağanüstü hâllerde bazı hakların kullanımının durdurulması; yaşama hakkı, savaş hukukuna uygun ölümler dışında bu kapsama girmez (AY m. 15/2)."
  - terim: Kademeli zor kullanma
    tanim: "Polisin önce bedenî kuvvet, sonra maddî güç, kanuni şartlar varsa en son silah kullanması (2559 sayılı Kanun m. 16/2)."
  - terim: Hukuka uygunluk nedeni
    tanim: "Fiilin suç oluşturmasını engelleyen neden; örneğin kanunun hükmünü yerine getirme (TCK m. 24/1) ve meşru savunma (TCK m. 25/1)."
  - terim: Sınırın aşılması
    tanim: "Hukuka uygunluk nedeninde kast olmaksızın sınırın aşılması; fiil taksirle de cezalandırılıyorsa taksirli suç cezası indirilerek uygulanır (TCK m. 27/1)."
  - terim: Otopsi
    tanim: "Ölümün nedenini belirlemek için cesedin Cumhuriyet savcısı huzurunda, kural olarak biri adli tıp uzmanı iki hekim tarafından açılarak incelenmesi (CMK m. 87)."
  - terim: Cezasızlık
    tanim: "Sorumluların fiilen yargılanmaması veya cezalandırılmaması; etkili soruşturma yükümlülüğünün ihlal göstergesidir."
kararlar: []
sorular:
  - soru: |
      Aşağıdakilerden hangisi yaşama hakkından doğan devlet yükümlülüklerinden biri değildir?
    siklar:
      - "Devlet görevlilerinin yaşama hukuka aykırı biçimde son vermemesi (negatif yükümlülük)"
      - "Gerçek ve yakın tehlikeye karşı makul önleyici tedbirlerin alınması (pozitif yükümlülük)"
      - "Şüpheli ölümlerde etkili bir soruşturma yapılması (usuli yükümlülük)"
      - "Her ölüm olayında sorumlunun mutlaka mahkûm edilmesi"
    dogru: 3
    aciklama: |
      Yaşama hakkı üç yükümlülük doğurur: negatif, pozitif ve usuli. Usuli yükümlülük soruşturmanın etkili olmasını arar; her soruşturmanın mahkûmiyetle sonuçlanmasını garanti etmez. Bu bir araç yükümlülüğüdür.
  - soru: |
      AY m. 17/4'e göre aşağıdakilerden hangisi silah kullanılmasına kanunun cevaz verdiği zorunlu durumlar arasında sayılmıştır?
    siklar:
      - "Trafik düzenini sağlamak"
      - "Bir tutuklu veya hükümlünün kaçmasının önlenmesi"
      - "Kimliği sorulan kişinin kimlik göstermemesi"
      - "Kamu malına zarar verilmesinin önlenmesi"
    dogru: 1
    aciklama: |
      AY m. 17/4 şu durumları sayar: meşru müdafaa, yakalama ve tutuklama kararlarının yerine getirilmesi, bir tutuklu veya hükümlünün kaçmasının önlenmesi, bir ayaklanma veya isyanın bastırılması ve olağanüstü hâllerde yetkili merciin verdiği emirlerin uygulanması. Diğer şıklar bu listede yoktur.
  - soru: |
      Yaşama hakkını sınırlayan güç kullanımında aranan ölçüt aşağıdakilerden hangisidir?
    siklar:
      - "Demokratik toplumda gereklilik"
      - "Makul ve yararlı olma"
      - "Mutlak zorunluluk"
      - "Kamu yararına uygunluk"
    dogru: 2
    aciklama: |
      Yaşama hakkını etkileyen güç kullanımı yalnızca mutlak zorunluluk sınırı içinde kalabilir. Bu ölçüt, ifade özgürlüğü gibi alanlardaki "demokratik toplumda gereklilik" ölçütünden daha sıkıdır. AY m. 17/4 de silah kullanımının "zorunlu durumlarda" olmasını arar.
  - soru: |
      Polis P, hakkında yakalama emri bulunan ve kaçan şüpheliyi durdurmak için silah kullanacaktır. 2559 sayılı Kanun m. 16'ya göre P'nin izleyeceği sıra hangisidir?
    siklar:
      - "Doğrudan yakalamayı sağlayacak ölçüde ateş, sonra uyarı atışı"
      - "Duyabileceği şekilde 'dur' çağrısı, kaçmaya devam ederse uyarı amaçlı ateş, başka türlü ele geçirilemiyorsa yakalamayı sağlayacak ölçüde ateş"
      - "Önce uyarı atışı, sonra 'dur' çağrısı, en son bedenî kuvvet"
      - "Hiçbir uyarı yapmadan kaçanın bacağına nişan almak"
    dogru: 1
    aciklama: |
      2559 sayılı Kanun m. 16/8: Polis, 2559 sayılı Kanun m. 16/7-c kapsamında silah kullanmadan önce duyabileceği şekilde "dur" çağrısında bulunur; kaçmaya devam edilirse önce uyarı amacıyla silahla ateş edilebilir; buna rağmen ele geçirilmesi mümkün olmazsa yakalanmasını sağlamak amacıyla ve sağlayacak ölçüde ateş edilebilir.
  - soru: |
      Hakkında basit hırsızlıktan yakalama emri bulunan silahsız Ş'yi gören polis P, "Dur!" diye bağırmış, Ş'nin kaçması üzerine uyarı atışı yapmadan doğrudan sırtına ateş etmiş ve Ş ölmüştür. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "P kanunun hükmünü yerine getirdiği için her hâlde hukuka uygun davranmıştır."
      - "2559 sayılı Kanun m. 16/8'deki sıra izlenmediği ve silahsız, şiddet içermeyen bir suç şüphelisine karşı mutlak zorunluluk bulunmadığı için negatif yükümlülük ihlal edilmiş olabilir."
      - "Ateş edilen kişi hırsızlık şüphelisi olduğundan yaşama hakkı korumasından yararlanamaz."
      - "Olay yalnızca idari bir olaydır; ceza soruşturması gerekmez."
    dogru: 1
    aciklama: |
      2559 sayılı Kanun m. 16/8 önce "dur" çağrısını, sonra uyarı atışını arar; yakalamayı sağlayacak ölçüde ateş ancak başka türlü ele geçirilememesi hâlinde mümkündür. Silahsız ve şiddet içermeyen bir suç şüphelisine doğrudan öldürücü bölgeye ateş mutlak zorunluluk ölçütüne uymaz. Yaşama hakkı herkesin hakkıdır (AY m. 17/1); ölümde ceza soruşturması da gerekir.
  - soru: |
      Osman testine göre pozitif yükümlülüğün ihlalinden söz edilebilmesi için aşağıdakilerden hangileri birlikte gerçekleşmelidir?
    siklar:
      - "Ölümün gerçekleşmesi ve failin mahkûm edilmesi"
      - "Makamların gerçek ve yakın bir tehlikeyi bilmesi veya bilmesi gerekmesi ve makul önleyici tedbirleri almamaları"
      - "Tehlikenin yalnız soyut olması ve bir kişinin şikâyet etmesi"
      - "Devletin yasal çerçeve kurmuş olması ve kişinin ölmüş olması"
    dogru: 1
    aciklama: |
      Osman testi iki şartı birlikte arar: yetkililerin belirli bir kişinin yaşamının gerçek ve yakın bir tehlike altında olduğunu bilmesi veya bilmesi gerekmesi ve yetkileri kapsamında makul olarak beklenen önleyici tedbirleri almamış olmaları.
  - soru: |
      Cumhuriyet savcısı, bir polis memurunun şüpheli sayıldığı ölüm olayında olay yeri incelemesi ve tanık dinlemeyi, şüpheli polisin görev yaptığı birimdeki meslektaşlarına yaptırmıştır. Bu uygulamada etkili soruşturmanın hangi unsuru zedelenmiştir?
    siklar:
      - "Makul sürat unsuru"
      - "Kamuya açıklık unsuru"
      - "Bağımsızlık ve tarafsızlık unsuru"
      - "Re'sen başlama unsuru"
    dogru: 2
    aciklama: |
      Soruşturmayı yürütenlerin olaya karışanlarla kurumsal veya hiyerarşik bağ içinde olmaması gerekir. Delillerin şüpheli polisin kendi birimindeki meslektaşlarınca toplanması bağımsızlığı ve tarafsızlığı zedeler. Savcının soruşturmayı başlatmış olması re'sen başlama unsurunu karşılar (CMK m. 160/1).
  - soru: |
      AY m. 15/2'ye göre savaş, seferberlik veya olağanüstü hâllerde yaşama hakkıyla ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yaşama hakkı olağanüstü hâllerde tamamen durdurulabilir."
      - "Savaş hukukuna uygun fiiller sonucu meydana gelen ölümler dışında kişinin yaşama hakkına dokunulamaz."
      - "Yaşama hakkı yalnızca seferberlik hâlinde durdurulabilir."
      - "Yaşama hakkına dokunmak için Bakanlar Kurulu kararı yeterlidir."
    dogru: 1
    aciklama: |
      AY m. 15/2: Birinci fıkradaki durumlarda da savaş hukukuna uygun fiiller sonucu meydana gelen ölümler dışında kişinin yaşama hakkına, maddi ve manevi varlığının bütünlüğüne dokunulamaz.
  - soru: |
      Ölüm cezası ve genel müsadere cezasıyla ilgili olarak Anayasa'daki hüküm aşağıdakilerden hangisidir?
    siklar:
      - "Ölüm cezası yalnızca savaş zamanında verilebilir."
      - "Ölüm cezası ve genel müsadere cezası verilemez."
      - "Ölüm cezası yalnızca terör suçlarında verilebilir."
      - "Ölüm cezası yalnızca Yüce Divan tarafından verilebilir."
    dogru: 1
    aciklama: |
      AY m. 38/10: "Ölüm cezası ve genel müsadere cezası verilemez." Bu düzenleme 5170 sayılı Kanunla getirilmiştir; aynı Kanunla AY m. 15 ve AY m. 17'deki ölüm cezasına ilişkin ifadeler de çıkarılmıştır.
  - soru: |
      Polis P, hakkında yakalama emri bulunan bir kişiyi yakalamaya çalışırken bu kişi P'ye silahla saldırıya teşebbüs etmiş; P de saldırı tehlikesini etkisiz kılacak ölçüde ateş etmiştir. Hukuki durum aşağıdakilerden hangisidir?
    siklar:
      - "P, 'dur' çağrısı yapmadığı için hiçbir koşulda hukuka uygun davranmış sayılmaz."
      - "Kendisine silahla saldırıya teşebbüs edilen polis, saldırı tehlikesini etkisiz kılacak ölçüde duraksamadan silahla ateş edebilir."
      - "Polis, silahlı saldırı karşısında bile yalnız bedenî kuvvet kullanabilir."
      - "Her durumda önce Cumhuriyet savcısının izni gerekir."
    dogru: 1
    aciklama: |
      2559 sayılı Kanun m. 16/9: Polis, direnişi kırmak ya da yakalamak amacıyla zor veya silah kullanma yetkisini kullanırken, kendisine karşı silahla saldırıya teşebbüs edilmesi hâlinde, saldırıya teşebbüs eden kişiye karşı saldırı tehlikesini etkisiz kılacak ölçüde duraksamadan silahla ateş edebilir. "Dur" çağrısı ve uyarı atışı sırası 2559 sayılı Kanun m. 16/7-c kapsamındaki kaçan şüpheliye ilişkindir.
  - soru: |
      Polis memuru M, kanunun silah kullanma yetkisini kast olmaksızın aşmış ve bu sonuçta bir kişinin ölümüne neden olmuştur. Fiil taksirle de cezalandırılmaktadır. TCK m. 27/1'e göre sonuç aşağıdakilerden hangisidir?
    siklar:
      - "M kasten öldürmeden sorumlu tutulur."
      - "M'ye hiçbir ceza verilmez."
      - "Taksirli suç için kanunda yazılı cezanın altıda birinden üçte birine kadarı indirilerek hükmolunur."
      - "Taksirli suç cezası iki katına çıkarılır."
    dogru: 2
    aciklama: |
      TCK m. 27/1: Ceza sorumluluğunu kaldıran nedenlerde sınırın kast olmaksızın aşılması hâlinde, fiil taksirle işlendiğinde de cezalandırılıyorsa, taksirli suç için kanunda yazılı cezanın altıda birinden üçte birine kadarı indirilerek hükmolunur. Taksirle öldürme TCK m. 85'te düzenlenmiştir.
  - soru: |
      Savaş, olağanüstü hâl gibi durumlarda temel hak ve özgürlüklerin kullanımı durdurulabilir. Aşağıdakilerden hangisi bu durdurma yetkisinin sınırlarına ilişkin doğrudur?
    siklar:
      - "Yaşama hakkı dâhil bütün haklar durdurulabilir."
      - "Durdurma, milletlerarası hukuktan doğan yükümlülükler ihlal edilmemek kaydıyla ve durumun gerektirdiği ölçüde yapılabilir; yaşama hakkına, savaş hukukuna uygun ölümler dışında dokunulamaz."
      - "Durdurma ölçü gözetilmeksizin yapılabilir."
      - "Yalnızca ifade özgürlüğü durdurulabilir."
    dogru: 1
    aciklama: |
      AY m. 15/1, durdurmanın milletlerarası hukuktan doğan yükümlülükler ihlal edilmemek kaydıyla ve durumun gerektirdiği ölçüde yapılabileceğini söyler. AY m. 15/2 ise yaşama hakkına savaş hukukuna uygun ölümler dışında dokunulamayacağını belirtir.
olaylar:
  - olay: |
      Hakkında basit hırsızlık suçundan yakalama emri bulunan silahsız Ş, devriye gezen polis memuru P tarafından sokakta görülür. P, Ş'ye "Dur!" diye bağırır; Ş koşarak kaçmaya başlar. P, uyarı atışı yapmaksızın ve Ş'nin herhangi bir silahlı saldırı veya direniş girişimi olmamasına rağmen, tabancasıyla doğrudan Ş'nin sırt bölgesine ateş eder ve Ş olay yerinde ölür. Başlatılan soruşturmada Cumhuriyet savcısı, olay yeri incelemesini ve tanık dinlemeyi P'nin görev yaptığı polis merkezindeki mesai arkadaşlarına yaptırır, otopsi yaptırmaz ve dosya, polisin ifadesine dayanılarak kapatılır. Ş'nin eşi E, bu süreçlere karşı hakların ihlal edildiğini ileri sürmektedir.

      1. P'nin silah kullanımını yaşama hakkı ve 2559 sayılı Kanun m. 16 bakımından değerlendiriniz.
      2. Yürütülen soruşturmayı yaşama hakkının usuli boyutu bakımından değerlendiriniz.
    olcut:
      - {tespit: "Yaşama hakkının AY m. 17/1'de güvence altında olduğu ve AY m. 17/4'teki istisnaların yalnız kanunun silah kullanımına cevaz verdiği zorunlu durumları kapsadığı", puan: 20, madde: "AY m. 17"}
      - {tespit: "'Dur' çağrısı, uyarı atışı, yakalamayı sağlayacak ölçüde ateş sırasının izlenmemesi", puan: 25, madde: "2559 sayılı Kanun m. 16"}
      - {tespit: "Silahsız ve şiddet içermeyen suç şüphelisine karşı mutlak zorunluluk ölçütünün karşılanmaması; negatif yükümlülük ihlali", puan: 20, madde: "AY m. 17"}
      - {tespit: "Delillerin P'nin birimindeki meslektaşlarınca toplanması nedeniyle bağımsızlık ve tarafsızlık unsurunun zedelenmesi", puan: 15, madde: "CMK m. 161"}
      - {tespit: "Otopsinin yapılmaması nedeniyle soruşturmanın yeterliliğinin zedelenmesi", puan: 20, madde: "CMK m. 87"}
    cozum: |
      **Nitelendirme:** Olay, polisin güç kullanması sonucu meydana gelen bir ölümde yaşama hakkının negatif (maddi) ve usuli boyutlarını gündeme getirir.

      **Hukuki sorunlar:** (1) P'nin silah kullanımı kanuna ve mutlak zorunluluk ölçütüne uygun mu? (2) Soruşturma etkili mi?

      **İlgili hükümler:** AY m. 17/1 yaşama hakkını güvence altına alır. AY m. 17/4, yakalama ve tutuklama kararlarının yerine getirilmesi sırasında silah kullanılmasına kanunun cevaz verdiği zorunlu durumlarda meydana gelen öldürme fiillerini birinci fıkra hükmü dışında tutar. 2559 sayılı Kanun m. 16/7-c yakalama emri verilmiş kişilerin yakalanmasını sağlamak amacıyla ve sağlayacak ölçüde silah kullanma yetkisi verir; 2559 sayılı Kanun m. 16/8 ise önce "dur" çağrısı, kaçmaya devam edilirse uyarı amacıyla silahla ateş, buna rağmen ele geçirilemezse yakalamayı sağlayacak ölçüde ateş sırasını getirir. CMK m. 160/1 savcıya hemen işin gerçeğini araştırma, CMK m. 160/2 şüphelinin lehine ve aleyhine delilleri toplama görevi verir. CMK m. 161/2 adli kolluğun savcının emirlerini gecikmeksizin yerine getirmesini düzenler. CMK m. 87 otopsinin Cumhuriyet savcısının huzurunda, kural olarak biri adli tıp uzmanı iki hekim tarafından yapılacağını düzenler.

      **Değerlendirme:** (1) Ş hakkında yakalama emri bulunduğundan P'nin silah kullanma yetkisi ilke olarak 2559 sayılı Kanun m. 16/7-c kapsamındadır. Ancak P, 2559 sayılı Kanun m. 16/8'deki sırayı izlememiş; "dur" çağrısından sonra uyarı atışı yapmadan doğrudan sırta ateş etmiştir. Ş silahsızdır ve yalnız basit bir mala karşı suç şüphelisidir; saldırı veya direnişi yoktur. Bu koşullarda öldürücü bölgeye ateş, kaçışı önlemek için mutlak zorunlu olandan fazladır. Dolayısıyla AY m. 17/4'teki istisnaya girmez ve yaşama hakkının negatif boyutu ihlal edilmiştir. P'nin ceza sorumluluğunun niteliği (TCK m. 24/1'in koşullarının bulunmadığı, kastın mı taksirin mi bulunduğu) ayrıca olayın ayrıntılarına göre belirlenir. (2) Cumhuriyet savcısı soruşturmayı başlatmış olsa da, delillerin şüpheli polisin kendi birimindeki mesai arkadaşlarınca toplanması soruşturmanın bağımsızlığını ve tarafsızlığını zedeler. Ölüm olayında otopsinin yapılmaması ölüm nedeninin ve ateş yönünün aydınlatılmasını engelleyerek soruşturmanın yeterliliğini ortadan kaldırır. Dosyanın yalnız polisin ifadesine dayanılarak kapatılması, sorumluların belirlenmesini imkânsız kıldığından etkili soruşturma yükümlülüğüne de aykırıdır.

      **Sonuç:** Hem yaşama hakkının negatif boyutu (P'nin sırta doğrudan ve uyarı atışı yapmadan ateş etmesi) hem de usuli boyutu (bağımsız olmayan ve eksik soruşturma) ihlal edilmiştir.
  - olay: |
      Mahkûm K, cezaevinde kaldığı sırada diğer mahkûmlardan birinin kendisini tehdit ettiğini bildirerek başka bir koğuşa alınmasını defalarca yazılı olarak talep etmiştir. Cezaevi idaresi, K'nın korku içinde olduğunu ve talebini bildiren dilekçelerini bildiği hâlde herhangi bir tedbir almamıştır. Birkaç hafta sonra K, tehdit eden mahkûmun saldırısı sonucu ölmüştür. Savcılık, saldırgan hakkında soruşturma başlatmış ancak idarenin ihmalini hiç araştırmamıştır. K'nın annesi A, hakların ihlal edildiğini ileri sürmektedir.

      1. Devletin K'ya karşı yükümlülüğünü ve bu yükümlülüğün ölçütünü açıklayınız.
      2. Savcılığın tutumunu değerlendiriniz.
    olcut:
      - {tespit: "Devletin gözetimindeki kişinin yaşamını koruma yönündeki pozitif yükümlülüğü", puan: 20, madde: "AY m. 17"}
      - {tespit: "Osman testi: gerçek ve yakın tehlikenin bilinmesi veya bilinmesi gerekmesi", puan: 25, madde: "AY m. 17"}
      - {tespit: "Makul önleyici tedbirlerin alınmaması nedeniyle pozitif yükümlülük ihlali", puan: 20, madde: "AY m. 17"}
      - {tespit: "Etkili soruşturmanın yalnız saldırganla sınırlı kalması; idarenin ihmalinin araştırılmaması", puan: 20, madde: "CMK m. 160"}
      - {tespit: "İhmali davranışla öldürme ve kamu görevlilerinin sorumluluğunun değerlendirilmesi gerekliliği", puan: 15, madde: "TCK m. 83"}
    cozum: |
      **Nitelendirme:** Olay, devletin gözetimindeki bir kişinin diğer bir kişinin saldırısıyla ölmesi nedeniyle yaşama hakkının pozitif (maddi) ve usuli boyutlarını ilgilendirir.

      **Hukuki sorunlar:** (1) Devlet, gözetimindeki K'nın yaşamını koruma yükümlülüğünü yerine getirdi mi? (2) Soruşturma etkili mi?

      **İlgili hükümler:** AY m. 17/1 yaşama hakkını güvence altına alır. Pozitif yükümlülük kapsamında, makamlar belirli bir kişinin yaşamının gerçek ve yakın bir tehlike altında olduğunu bildiği veya bilmesi gerektiği hâlde, yetkileri içinde makul olarak beklenen önleyici tedbirleri almamışsa (Osman testi) hak ihlal edilmiş olur. CMK m. 160/1 savcıya bir suçun işlendiği izlenimini veren hâli öğrenir öğrenmez hemen işin gerçeğini araştırma görevi verir; CMK m. 160/2 şüphelinin lehine ve aleyhine olan delillerin toplanmasını arar. TCK m. 83 ihmalin icrai davranışa eşdeğer olması hâlinde ihmali davranışla öldürmeyi düzenler.

      **Değerlendirme:** (1) K devletin gözetimindedir; bu kişilerin diğer kişilerden gelecek saldırı riskine karşı korunması gerekir. K'nın korkusunu ve tehdidi defalarca yazılı olarak bildirmesi, idarenin gerçek ve yakın tehlikeyi bildiğini veya bilmesi gerektiğini gösterir. Yetkisi içindeki makul tedbirler (başka koğuşa alma, ayırma) alınabilecekken alınmamıştır. Osman testinin iki şartı da gerçekleşmiştir; pozitif yükümlülük ihlal edilmiştir. (2) Soruşturmanın yalnız saldırganla sınırlı kalması yetersizdir. Etkili soruşturma, ölüme yol açan koşulları ve devlet görevlilerinin olası ihmalini de kapsamalıdır. CMK m. 160/2 uyarınca delillerin lehe ve aleyhe toplanması gerekir; idarenin ihmali araştırılmadığı için soruşturma bu yönüyle eksiktir. İhmalin TCK m. 83 kapsamında icrai davranışa eşdeğer sayılıp sayılmayacağı, görevlilerin yükümlülüğü ve davranışlarının ayrıntılarına göre değerlendirilmelidir; TCK m. 83 kasten öldürmenin ihmali davranışla işlenmesini düzenler, kast yoksa görevlilerin sorumluluğu taksirle öldürme (TCK m. 85) yönünden araştırılır.

      **Sonuç:** Yaşama hakkının pozitif boyutu ihlal edilmiştir; idarenin ihmalinin araştırılmaması nedeniyle usuli boyut da ihlal edilmiştir.
kartlar:
  - on: "Yaşama hakkının anayasal dayanağı?"
    arka: "AY m. 17/1: Herkes, yaşama, maddi ve manevi varlığını koruma ve geliştirme hakkına sahiptir. Sözleşme düzeyinde karşılığı Sözleşme'nin 2. maddesidir."
  - on: "Yaşama hakkında devletin üç yükümlülüğü?"
    arka: "Negatif (öldürmeme), pozitif (koruma) ve usuli (etkili soruşturma) yükümlülük."
  - on: "AY m. 17/4'te kaç durum sayılır?"
    arka: "Beş: meşru müdafaa; yakalama/tutuklama kararlarının yerine getirilmesi; tutuklu/hükümlünün kaçmasının önlenmesi; ayaklanma/isyanın bastırılması; olağanüstü hâllerde yetkili merciin emirlerinin uygulanması."
  - on: "Yaşama hakkında güç kullanımı ölçütü?"
    arka: "Mutlak zorunluluk. 'Demokratik toplumda gereklilik'ten daha sıkı bir ölçüttür."
  - on: "Osman testi nedir?"
    arka: "Makamlar gerçek ve yakın tehlikeyi bildiği veya bilmesi gerektiği hâlde makul önleyici tedbirleri almamışsa pozitif yükümlülük ihlal edilir; iki şart birlikte aranır."
  - on: "Etkili soruşturmanın bileşenleri?"
    arka: "Re'sen ve derhâl başlama, bağımsızlık ve tarafsızlık, yeterlilik (otopsi dâhil), makul sürat, yakınların katılımı, cezasızlığa yol açmama."
  - on: "Savcı bir suçu öğrenince ne yapar?"
    arka: "Kamu davasını açmaya yer olup olmadığına karar vermek üzere hemen işin gerçeğini araştırmaya başlar (CMK m. 160/1)."
  - on: "Kaçan şüpheliye karşı silah kullanma sırası?"
    arka: "Duyabileceği şekilde 'dur' çağrısı, uyarı amaçlı ateş, ısrar ve başka türlü ele geçirilememe hâlinde yakalamayı sağlayacak ölçüde ateş (2559 sayılı Kanun m. 16/7-c ve 2559 sayılı Kanun m. 16/8)."
  - on: "Polisin zor kullanması hangi sırayla artar?"
    arka: "Bedenî kuvvet, maddî güç, kanuni şartlar gerçekleştiğinde silah (2559 sayılı Kanun m. 16/2)."
  - on: "Savaşta yaşama hakkına dokunulabilir mi?"
    arka: "Savaş hukukuna uygun fiiller sonucu meydana gelen ölümler dışında dokunulamaz (AY m. 15/2)."
  - on: "Ölüm cezası Anayasa'da nasıl düzenlenir?"
    arka: "AY m. 38/10: Ölüm cezası ve genel müsadere cezası verilemez. 5170 sayılı Kanun ilgili ifadeleri AY m. 15, 17 ve 38'den çıkarmıştır."
  - on: "Hukuka uygunluk nedeninde sınır kast olmaksızın aşılırsa?"
    arka: "Fiil taksirle de cezalandırılıyorsa taksirli suç cezasının altıda birinden üçte birine kadarı indirilir (TCK m. 27/1)."
