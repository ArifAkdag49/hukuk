      - "24 saat"
      - "48 saat"
      - "72 saat"
      - "4 gün"
    dogru: 1
    aciklama: |
      AY m. 19/5, bireysel suçlarda yol süresi hariç en geç kırksekiz saat, toplu işlenen suçlarda en çok dört gün der. 24 saat, CMK m. 91/1'deki gözaltı süresidir; Anayasa'daki azami hâkim önüne çıkarılma süresiyle karıştırılmamalıdır.
  - soru: |
      Ayşe, trafik kazasında karşı sürücüyü yaralamaktan (taksirle yaralama, TCK m. 89/1) şüphelidir. Savcılık, kaçma şüphesi bulunduğunu ileri sürerek tutuklanmasını istemiştir. Sulh ceza hâkiminin yapması gereken hangisidir?
    siklar:
      - "Kaçma şüphesi bir tutuklama nedeni olduğu için tutuklama kararı verebilir."
      - "Suç taksirle işlendiği için yalnız gözaltı süresini uzatabilir."
      - "Tutuklama kararı veremez; gerekirse adli kontrol uygulayabilir."
      - "Tutuklama kararı için ağır ceza mahkemesinden izin istemelidir."
