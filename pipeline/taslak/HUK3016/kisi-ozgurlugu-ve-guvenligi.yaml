olaylar:
  - olay: |
      Şahin (32), tek başına bir kişiyi kazara yaralamaktan (taksirle yaralama) şüphelenilerek 1 Mart 2025 günü saat 10.00'da polis tarafından yakalanmıştır. Karakol adliye binasının bitişiğindedir, yol süresi yoktur. Şahin'in yakalandığı yakınlarına hiç bildirilmemiş, kendisine yakalama sebebi sözlü olarak bile söylenmemiştir. Şahin, 4 Mart günü saat 10.00'a kadar, yani 72 saat gözaltında tutulmuş ve ardından sulh ceza hâkimi önüne çıkarılmıştır. Hâkim, "delillerin henüz toplanmamış olması" gerekçesiyle Şahin'i tutuklamıştır. Şahin 60 gün tutuklu kaldıktan sonra tahliye edilmiş; hakkında 100 gün süreyle "konutunu terk etmemek" ve 120 gün süreyle "yurt dışına çıkmamak" adli kontrol yükümlülükleri uygulanmıştır. Yargılama sonunda Şahin beraat etmiş, kesinleşen karar kendisine 10 Ocak 2026'da tebliğ edilmiştir.
      1. Gözaltı süresi ve bildirim yükümlülükleri bakımından işlemler hukuka uygun mudur?
      2. Tutuklama kararı hukuka uygun mudur?
      3. Adli kontrol tedbirleri bakımından tazminat hakkı doğar mı?
      4. Şahin tazminat istemini hangi süre içinde ve hangi merciye yapmalıdır?
    olcut:
      - {tespit: "72 saatlik gözaltı bireysel suçta AY m. 19/5'teki 48 saat ve CMK m. 91/1'deki 24 saat sınırını aşmıştır (kanuni süre içinde hâkim önüne çıkarılmama)", puan: 20, madde: "AY m. 19/5"}
      - {tespit: "Yakalamanın yakınlara bildirilmemesi ve sebeplerin açıklanmaması AY m. 19/4 ve AY m. 19/6'ya aykırıdır; CMK m. 141/1-g ve h tazminat sebebidir", puan: 15, madde: "CMK m. 141/1"}
      - {tespit: "Taksirle yaralamanın cezası 4 aydan 2 yıla kadar hapistir; üst sınır iki yılı aşmadığı ve suç kasten işlenmediği için tutuklama yasağı vardır", puan: 20, madde: "CMK m. 100/4"}
      - {tespit: "Konutunu terk etmemek (100 gün) CMK m. 141/1-l kapsamındadır; yurt dışına çıkış yasağı (120 gün) CMK m. 141/1'de sayılmadığından tazminat sebebi olmaz", puan: 20, madde: "CMK m. 141/1"}
      - {tespit: "Tazminat istemi için kesinleşme tebliğinden itibaren 3 ay ve her hâlde kesinleşmeden sonraki 1 yıl", puan: 10, madde: "CMK m. 142/1"}
      - {tespit: "(a), (b), (g), (h) kaynaklı istemler ağır ceza mahkemesine; (l) kaynaklı istem Tazminat Komisyonuna yapılır; birlikte yapılırsa Komisyona ait kısım ayrılır", puan: 15, madde: "CMK m. 142/2"}
    cozum: |
      **Nitelendirme:** Olay, kişi hürriyeti ve güvenliği hakkının (AY m. 19) gözaltı, tutuklama ve adli kontrol aşamalarındaki ihlal iddialarını ve bunların tazminat rejimini (CMK m. 141-142) birlikte sorar.

      **Hukuki sorunlar:** (1) Gözaltı süresine ve bildirime aykırılık, (2) tutuklama yasağı, (3) adli kontrol tedbirlerinin tazminat bakımından durumu, (4) tazminat için merci ve süre.

      **İlgili hükümler ve değerlendirme:** AY m. 19/5'e göre bireysel suçta yakalanan kişi, yol süresi hariç en geç 48 saat içinde hâkim önüne çıkarılmalıdır. Karakol adliyenin bitişiğinde olduğundan düşülecek yol süresi yoktur; 72 saatlik gözaltı bu sınırı aşmıştır. CMK m. 91/1'e göre gözaltı süresi zaten yirmidört saati geçemez. Bu nedenle Şahin kanuni gözaltı süresi içinde hâkim önüne çıkarılmamıştır (CMK m. 141/1-b). Ayrıca AY m. 19/4 yakalama sebeplerinin ve iddiaların derhal bildirilmesini, AY m. 19/6 yakınlara derhal haber verilmesini zorunlu kılar; bunların yerine getirilmemesi CMK m. 141/1-g ve h bentlerindeki tazminat hâllerindendir.

      Tutuklama bakımından CMK m. 100/4, hapis cezasının üst sınırı iki yılı aşmayan suçlarda (vücut dokunulmazlığına karşı kasten işlenenler hariç) tutuklamayı yasaklar. TCK m. 89/1'e göre taksirle yaralamanın cezası dört aydan iki yıla kadar hapis veya adli para cezasıdır; suç kasten işlenmediği için istisna da uygulanmaz. "Delillerin henüz toplanmamış olması" ise CMK m. 100/2'deki somut olguya dayalı bir tutuklama nedeni değildir. Dolayısıyla tutuklama, kanunlarda belirtilen koşullar dışında yapılmıştır (CMK m. 141/1-a).

      Adli kontrol yönünden, CMK m. 141/1-l bendi yalnız konutunu terk etmemek ile hastaneye yatmak dâhil tedavi veya muayene tedbirlerini kapsar. Dolayısıyla 100 günlük konutunu terk etmeme tedbiri tazminat sebebidir. 120 günlük yurt dışına çıkış yasağı (CMK m. 109/3-a) bendin kapsamında değildir ve CMK m. 141/1'de sayılan hâller arasında yer almaz.

      Süre ve merci: İstem, kesinleşme kararının tebliğinden (10 Ocak 2026) itibaren üç ay içinde ve her hâlde kesinleşmeyi izleyen bir yıl içinde yapılmalıdır (CMK m. 142/1). Tutuklama, gözaltı ve bildirim ihlalleri (a, b, g, h) için yetkili merci ikametgâhının bulunduğu yer ağır ceza mahkemesidir; (l) bendine dayanan istem ise 6384 sayılı Kanun uyarınca Tazminat Komisyonuna yapılır. Her ikisi birlikte yapılırsa ağır ceza mahkemesi Komisyona ait kısmı ayırarak göndermelidir (CMK m. 142/2).

      **Sonuç:** Gözaltı süresi aşılmış, bildirim yükümlülükleri ihlal edilmiş, tutuklama yasağına aykırı tutuklama yapılmıştır. Konutunu terk etmeme tedbiri tazminat doğurur; yurt dışına çıkış yasağı doğurmaz. Şahin, tebliğden itibaren 3 ay içinde (her hâlde bir yıl içinde) ağır ceza mahkemesine ve Komisyona başvurmalıdır.
  - olay: |
      Emre (17), fiili işlediği tarihte on yedi yaşındadır. Asliye ceza mahkemesinin görevine giren bir suç nedeniyle soruşturma evresinde tutuklanmıştır. Aradan beş ay geçmiş, savcılık hâlâ iddianame düzenlememiştir. Bu süre boyunca tutukluluğun devamı konusunda hiçbir inceleme yapılmamış, Emre'nin avukatı ise tahliye talebinde bulunmamıştır. Avukat, Emre'nin hemen serbest bırakılmasını ve uğradığı zararın karşılanmasını istemektedir. Emre sonunda serbest kalır ve soruşturma kovuşturmaya yer olmadığı kararıyla biter; karar kesinleşir.
      1. Soruşturma evresindeki tutukluluk süresi aşılmış mıdır?
      2. Tutukluluğun incelenmesine ilişkin kurallara uyulmuş mudur?
      3. Emre'nin başvurabileceği hukuki yollar nelerdir?
      4. Emre salıverilirse hakkında hangi tedbir uygulanabilir ve tazminat bakımından durum nedir?
    olcut:
      - {tespit: "Soruşturma evresinde ağır ceza dışı işlerde azami tutukluluk 6 aydır", puan: 15, madde: "CMK m. 102/4"}
      - {tespit: "Çocuk için süreler dörtte üç oranında uygulanır; bu hesapla dört buçuk ayı aşan beş aylık tutukluluk sınırı aşmıştır", puan: 25, madde: "CMK m. 102/5"}
      - {tespit: "Soruşturmada tutukluluk en geç otuzar günlük sürelerle sulh ceza hâkimince incelenmelidir; şüpheli de inceleme isteyebilir", puan: 20, madde: "CMK m. 108/1"}
      - {tespit: "Salıverilme istemi, itiraz ve yargı merciine başvuru yolları", puan: 15, madde: "CMK m. 104"}
      - {tespit: "Süreler dolduğu için salıverilen kişiye adli kontrol uygulanabilir", puan: 10, madde: "CMK m. 109/7"}
      - {tespit: "Kanunlarda belirtilen koşullar dışında tutukluluğun devamına karar verilmesi ve kanuna uygun tutuklama sonrası kovuşturmaya yer olmadığı kararı tazminat sebebidir", puan: 15, madde: "CMK m. 141/1"}
    cozum: |
      **Nitelendirme:** Olay, çocuk şüphelinin soruşturma evresindeki tutukluluk süresi, dönemsel inceleme yükümlülüğü ve tazminat hakkını ilgilendirir.

      **Hukuki sorunlar:** (1) Çocuklara özgü süre hesabı, (2) otuzar günlük inceleme, (3) başvuru yolları, (4) adli kontrol ve tazminat.

      **İlgili hükümler ve değerlendirme:** CMK m. 102/4'e göre soruşturma evresinde tutukluluk süresi, ağır ceza mahkemesinin görevine girmeyen işlerde altı ayı geçemez. Emre'nin işlediği suç asliye ceza mahkemesinin görevine girdiğinden bu süre uygulanır. Ancak CMK m. 102/5'e göre fiili işlediği sırada on sekiz yaşını doldurmamış çocuklar bakımından süreler dörtte üç oranında uygulanır. Bu oranla sınır dört buçuk aydır (altı ayın dörtte üçü); beş aylık tutukluluk bu sınırı aşmıştır. Yasal süre dolduğu için tutukluluğun devamına karar verilmesi kanunlarda belirtilen koşullara aykırıdır.

      Dönemsel inceleme yönünden CMK m. 108/1, soruşturmada en geç otuzar günlük sürelerle sulh ceza hâkimince tutukluluğun devamı gerekip gerekmediğine, şüpheli veya müdafii dinlenerek karar verilmesini ister. Şüpheli de bu incelemeyi isteyebilir (CMK m. 108/2). Beş ay boyunca hiçbir inceleme yapılmaması bu hükme aykırıdır. Avukatın talebi olmaması, hâkimin incelemesini gereksiz kılmaz; çünkü inceleme savcının istemi üzerine ve süreler itibarıyla yapılır.

      Hukuki yollar: Emre, soruşturma ve kovuşturmanın her aşamasında salıverilmesini isteyebilir ve ret kararına itiraz edebilir (CMK m. 104). Yargı merciine başvuru güvencesi AY m. 19/8'de, makul sürede yargılanma ve serbest bırakılma hakkı ise AY m. 19/7'de düzenlenmiştir. Gözaltı yönünden CMK m. 91/5 ise gözaltı aşamasına ilişkindir; burada uygulanmaz.

      Emre sürelerin dolması nedeniyle salıverilirse hakkında adli kontrol uygulanabilir (CMK m. 109/7). Tazminat bakımından, süre aşıldıktan sonra tutukluluğun devamına karar verilmesi CMK m. 141/1-a kapsamındadır ve istem oturduğu yer ağır ceza mahkemesinde görülür. Kanuna uygun geçen tutukluluk sonrasında kovuşturmaya yer olmadığı kararı verildiğinden bu kısım için CMK m. 141/1-e uygulanır ve bu istem Tazminat Komisyonuna yapılır (CMK m. 142/2). Süre, kararın kesinleştiğinin tebliğinden itibaren üç ay ve her hâlde kesinleşmeyi izleyen bir yıldır (CMK m. 142/1).

      **Sonuç:** Emre'nin tutukluluğu çocuklara özgü dörtte üç oranı nedeniyle sınırı aşmış, inceleme yükümlülüğüne uyulmamıştır. Hemen salıverilmeli, adli kontrol uygulanabilir, tazminat hakkı ise yukarıdaki bentlere göre doğar.
kartlar:
  - on: "AY m. 19/5: bireysel suçta ve toplu suçta hâkim önüne çıkarılma süresi?"
    arka: "Bireysel suçta yol süresi hariç en geç 48 saat; toplu suçta en çok 4 gün (AY m. 19/5)."
  - on: "CMK m. 91/1: gözaltı süresi kaç saattir?"
    arka: "Yakalamadan itibaren 24 saat; yola ayrılan zorunlu süre en fazla 12 saat. Toplu suçta savcı 1'er günden 3 gün uzatabilir (CMK m. 91/3)."
  - on: "CMK m. 100/4 tutuklama yasağı kimleri kapsar?"
    arka: "Yalnız adli para cezası gerektiren suçlar ve üst sınırı 2 yılı aşmayan hapis suçları; vücut dokunulmazlığına karşı kasten işlenenler hariç."
  - on: "Tutuklama için aranan üç şart nelerdir?"
    arka: "Kuvvetli suç şüphesini gösteren somut deliller, bir tutuklama nedeni ve ölçülülük (CMK m. 100/1)."
  - on: "Soruşturmada tutukluluk ne sıklıkla incelenir?"
    arka: "En geç otuzar günlük sürelerle, savcı istemi üzerine sulh ceza hâkimince; şüpheli veya müdafii dinlenir (CMK m. 108/1)."
  - on: "Soruşturma evresi azami tutukluluk süreleri?"
    arka: "Ağır ceza dışı 6 ay; ağır ceza 1 yıl; belirli özel suçlarda ve toplu suçlarda 1 yıl 6 ay (+6 ay) (CMK m. 102/4)."
  - on: "Çocuklarda tutukluluk süreleri nasıl uygulanır?"
    arka: "15 yaşını doldurmamışlarda yarı; 18 yaşını doldurmamışlarda dörtte üç oranında (CMK m. 102/5)."
  - on: "Hangi adli kontrol yükümlülükleri mahsup edilir?"
    arka: "(e) tedavi/hastaneye yatma ve (j) konutunu terk etmeme; konutta her 2 gün 1 gün sayılır (CMK m. 109/6)."
  - on: "Tazminat istemi süresi (CMK m. 142/1)?"
    arka: "Kesinleşmenin tebliğinden itibaren 3 ay ve her hâlde kesinleşmeyi izleyen 1 yıl."
  - on: "Hangi tazminat istemleri Tazminat Komisyonuna yapılır?"
    arka: "CMK m. 141/1-e, f ve l bentleri (6384 sayılı Kanun); diğerleri ağır ceza mahkemesine (CMK m. 142/2)."
  - on: "AY m. 19'da şüphe eşiği ile Sözleşme'nin 5. maddesindeki eşik farkı?"
    arka: "AY m. 19/3: kuvvetli belirti; CMK m. 100/1: kuvvetli suç şüphesini gösteren somut deliller; Sözleşme'nin 5. maddesinin 1. fıkrasının (c) bendi: makul şüphe."
  - on: "AY m. 38/8 neyi yasaklar?"
    arka: "Yalnızca sözleşmeden doğan bir yükümlülüğü yerine getirememe nedeniyle özgürlükten alıkoymayı."
