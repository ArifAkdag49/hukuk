sorular:
  - soru: |
      Bir belediye meclisi, aldığı kararla belirli bir davranışı yasaklayıp "aykırı davrananlar bir ay hapisle cezalandırılır" hükmünü koymuştur. Bu hüküm hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Belediye meclisi kendi yetki alanında ceza koyabileceği için hüküm geçerlidir."
      - "Hüküm, kanunilik ilkesine aykırıdır; hapis cezası ancak kanunla konabilir."
      - "Hüküm, Sayıştay onayı alınırsa geçerli hâle gelir."
      - "Hüküm yalnız belediye sınırları içinde uygulanabilir."
    dogru: 1
    aciklama: |
      AY m. 38/3'e göre ceza ancak kanunla konulur; TCK m. 2/2 de idarenin düzenleyici işlemleriyle suç ve ceza konulamayacağını söyler. Belediye meclisi kararı kanun değildir. Yetki alanı veya onay mekanizması bu eksikliği gidermez.
  - soru: |
      Zamanaşımı süresi 2020'de işlenen bir suç için sonradan çıkarılan kanunla fail aleyhine uzatılmıştır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Zamanaşımı usul kuralı olduğu için uzatma derhal uygulanır."
      - "Uzatma, ancak fail kabul ederse uygulanır."
      - "Uzatma, suç tarihinden sonra işlenmiş fiillerde dahi uygulanamaz."
      - "Uzatma, geçmişe yürütülemez; AY m. 38/2 zamanaşımını da kapsamına almıştır."
    dogru: 3
    aciklama: |
      AY m. 38/2, suç ve ceza zamanaşımı ile mahkûmiyetin sonuçlarında da aleyhe geçmişe yürümezlik kuralının uygulanacağını açıkça söyler. "Usul kuralı olduğu için derhal uygulanır" yaklaşımı Anayasa metnine aykırıdır.
  - soru: |
      Aşağıdakilerden hangisi TCK m. 7/3'e göre infaz rejimine ilişkin hükümlerin derhal uygulanması kuralının istisnası **değildir**?
    siklar:
      - "Hapis cezasının ertelenmesi"
      - "Koşullu salıverilme"
      - "Tekerrür"
      - "Cezaevinde haftalık telefon görüşme süresi"
    dogru: 3
    aciklama: |
      TCK m. 7/3'e göre hapis cezasının ertelenmesi, koşullu salıverilme ve tekerrürle ilgili hükümler derhal uygulama kuralının dışındadır; bunlarda lehe kanun ilkesi işler. Cezaevindeki görüşme düzeni ise salt infaz rejimi kuralıdır ve derhal uygulanır.
  - soru: |
      Ali'nin 2022'de işlediği suçu karşılayan ceza, sonradan çıkan bir kanunla hafifletilmiştir. Ali'nin yargılaması 2025'te sürmektedir. Mahkeme hangi kanunu uygulamalıdır?
    siklar:
      - "Suç tarihindeki kanunu, çünkü kanunlar geriye yürümez."
      - "Her iki kanunun ağır hükümlerini birleştirerek."
      - "Yeni kanunu, çünkü failin lehine olan kanun uygulanır ve infaz olunur."
      - "Hangisi uygulanırsa uygulansın, Anayasa Mahkemesinin onayı gerekir."
    dogru: 2
    aciklama: |
      TCK m. 7/2'ye göre suçun işlendiği zaman yürürlükteki kanun ile sonradan yürürlüğe giren kanunun hükümleri farklıysa failin lehine olan kanun uygulanır ve infaz olunur. Geçmişe yürümezlik yalnız aleyhe kanun için geçerlidir.
  - soru: |
      Aşağıdaki durumlardan hangisinde AY m. 38/10'daki yasak ihlal edilmiş olur?
    siklar:
      - "Silahlı soygunda kullanılan aracın müsaderesine karar verilmesi"
      - "Mahkûmun bütün malvarlığına ceza olarak el konulması"
      - "Rüşvet olarak alınan paranın kazanç olarak müsaderesi"
      - "Üretimi suç olan eşyanın müsaderesi"
    dogru: 1
    aciklama: |
      AY m. 38/10 ölüm cezası ve genel müsadere cezasını yasaklar. Bütün malvarlığına ceza olarak el konulması genel müsadere cezasıdır. Suçta kullanılan eşyanın veya suç kazancının müsaderesi ise güvenlik tedbiri niteliğindedir (TCK m. 54, TCK m. 55).
  - soru: |
      Mehmet, kredi borcunu ödeyemediği için bir kamu görevlisinin emriyle "borç hapsi" adı altında alıkonulmuştur. Mehmet'in hangi güvencesi ihlal edilmiştir?
    siklar:
      - "Sözleşmeden doğan yükümlülüğü yerine getirememe nedeniyle özgürlükten alıkonulamama güvencesi (AY m. 38/8)"
      - "Genel müsadere yasağı"
      - "Vatandaşın yabancı ülkeye verilememesi güvencesi"
      - "Tüzel kişiye ceza yaptırımı uygulanamaması güvencesi"
    dogru: 0
    aciklama: |
      AY m. 38/8'e göre hiç kimse yalnızca sözleşmeden doğan bir yükümlülüğü yerine getirememesinden dolayı özgürlüğünden alıkonulamaz. Kredi borcu sözleşmeden doğan bir yükümlülüktür.
  - soru: |
      X A.Ş., bir kamu kurumunun verdiği izne dayalı olarak faaliyet göstermektedir. Şirketin yönetim kurulu üyesi, bu iznin verdiği yetkiyi kötüye kullanarak şirket yararına kasıtlı bir suç işleyip mahkûm edilmiştir. İşlenen suç, kanunun tüzel kişiler hakkında güvenlik tedbiri uygulanmasını ayrıca öngördüğü suçlardandır. Şirket hakkında aşağıdakilerden hangisi uygulanabilir?
    siklar:
      - "Hapis cezası"
      - "Adli para cezası olarak 'tüzel kişi cezası'"
      - "Güvenlik tedbiri niteliğinde iznin iptali"
      - "Hiçbir yaptırım uygulanamaz"
    dogru: 2
    aciklama: |
      TCK m. 20/2'ye göre tüzel kişiler hakkında ceza yaptırımı uygulanamaz, ancak kanunda öngörülen güvenlik tedbiri niteliğindeki yaptırımlar saklıdır. TCK m. 60/1, izne dayalı faaliyet gösteren tüzel kişinin organ veya temsilcilerinin iştirakiyle ve iznin verdiği yetkinin kötüye kullanılmasıyla tüzel kişi yararına işlenen kasıtlı suçtan mahkûmiyet hâlinde iznin iptalini öngörür; tedbir kanunun ayrıca belirttiği hâllerde uygulanır (TCK m. 60/4).
  - soru: |
      Etkili başvuru hakkı (AY m. 40/1) bakımından aşağıdaki ifadelerden hangisi doğrudur?
    siklar:
      - "Hak bağımsızdır; başka bir hak ihlal edilmeden de tek başına ileri sürülebilir."
      - "Hak, başka bir hakkın ihlaline dair savunulabilir bir iddia ile bağlantılı olarak işler."
      - "Hak, yalnızca ceza yargılamasında geçerlidir."
      - "Hak, olağanüstü hâllerde Anayasa m. 15/2 uyarınca mutlak çekirdek sayılır."
    dogru: 1
    aciklama: |
      Etkili başvuru hakkı bağımlı niteliktedir; başka bir temel hakkın ihlaline dair savunulabilir iddia gerekir. Hak ceza yargılamasıyla sınırlı değildir. AY m. 15/2'deki çekirdek listesinde etkili başvuru hakkı yer almaz.
  - soru: |
      AY m. 40/2'ye göre Devletin yükümlülüğü aşağıdakilerden hangisidir?
    siklar:
      - "Her işlem için yargı mercii tarafından ön izin almak"
      - "İşlemlerinde ilgili kişilerin başvuracağı kanun yollarını, mercileri ve süreleri belirtmek"
      - "Kişinin zararını görevlinin malvarlığından doğrudan tahsil etmek"
      - "İdari işlemlerin tamamını yazılı olarak yayımlamak"
    dogru: 1
    aciklama: |
      AY m. 40/2: Devlet, işlemlerinde ilgili kişilerin hangi kanun yolları ve mercilere başvuracağını ve sürelerini belirtmek zorundadır. Görevlinin zararı Devletçe tazmin ve görevliye rücu ise AY m. 40/3 kapsamındadır.
  - soru: |
      Zeynep, bir polis memurunun haksız işlemi nedeniyle zarar görmüştür. AY m. 40/3'e göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Zarar Devletçe tazmin edilir; Devletin sorumlu görevliye rücu hakkı saklıdır."
      - "Zarar yalnızca görevli tarafından karşılanır; Devletin sorumluluğu yoktur."
      - "Zararı Devlet tazmin eder, ama rücu mümkün değildir."
      - "Zarar, ancak görevlinin mahkûmiyeti hâlinde tazmin edilir."
    dogru: 0
    aciklama: |
      AY m. 40/3'e göre resmî görevlilerin haksız işlemleri sonucu uğranılan zarar kanuna göre Devletçe tazmin edilir; Devletin sorumlu ilgili görevliye rücu hakkı saklıdır. Tazmin görevlinin mahkûmiyetine bağlı değildir.
  - soru: |
      Olağanüstü hâl ilan edilmiştir. Hükûmet, bu dönemde işlenen eylemler için çıkarılacak bir kararla fiilden sonra daha ağır ceza öngörmek istemektedir. AY m. 15/2 karşısında durum nedir?
    siklar:
      - "Olağanüstü hâlde temel haklar tamamen durdurulabileceğinden bu mümkündür."
      - "Suç ve cezalar geçmişe yürütülemez; bu güvence olağanüstü hâlde dahi durdurulamaz."
      - "Ancak Anayasa Mahkemesi izin verirse mümkündür."
      - "Yalnız savaş hâlinde mümkündür, olağanüstü hâlde değil."
    dogru: 1
    aciklama: |
      AY m. 15/2'ye göre AY m. 15/1'de sayılan durumlarda da suç ve cezalar geçmişe yürütülemez. AY m. 15/1 olağanüstü hâl dâhil hâllerde temel hakların durdurulmasına izin verse de bu güvence çekirdek içinde olduğu için askıya alınamaz.
  - soru: |
      Hasan'ın işlediği fiil, sonradan çıkan bir kanunla suç olmaktan çıkarılmıştır. Hasan hakkında verilmiş ve henüz infaz edilmekte olan bir hapis cezası vardır. Sonuç nedir?
    siklar:
      - "Ceza infaz edilmeye devam eder, çünkü karar kesinleşmiştir."
      - "Ceza ancak Hasan'ın başvurusu ve mahkeme kararıyla kalkar."
      - "Cezanın infazı ve kanuni neticeleri kendiliğinden kalkar (TCK m. 7/1)."
      - "Ceza yarısı oranında indirilir."
    dogru: 2
    aciklama: |
      TCK m. 7/1'e göre işlendikten sonra yürürlüğe giren kanuna göre suç sayılmayan fiil nedeniyle kimse cezalandırılamaz; böyle bir ceza hükmolunmuşsa infazı ve kanuni neticeleri kendiliğinden kalkar.
olaylar:
  - olay: |
      Mehmet, 10.03.2025 tarihinde bir suç işlemiştir. Suç, 8 yıllık dava zamanaşımına tabidir. 01.06.2025 tarihinde yürürlüğe giren varsayımsal bir kanunla (i) adli para cezasında bir gün karşılığının alt sınırı yükseltilmiş, (ii) koşullu salıverilme oranı artırılmış, (iii) cezaevinde haftalık telefon görüşme süresi kısaltılmış ve (iv) bu suç için dava zamanaşımı süresi 8 yıldan 10 yıla çıkarılmıştır. Yargılama sırasında mahkeme dört değişikliğin tamamını Mehmet hakkında uygulamıştır. Mehmet'in avukatı bu uygulamanın Anayasa'ya ve TCK'ya aykırı olduğunu savunmaktadır.

      1. Dört değişiklikten hangileri Mehmet'e uygulanabilir?
      2. Değerlendirmeyi hangi ilkelere dayandırırsınız?
    olcut:
      - {tespit: "Aleyhe kanunun geçmişe yürümezliği ve lehe kanunun uygulanması ilkesinin belirlenmesi", puan: 20, madde: "AY m. 38/1"}
      - {tespit: "Lehe kanun karşılaştırmasında failin lehine olanın uygulanması; adli para cezası alt sınırının artırılmasının aleyhe olması", puan: 20, madde: "TCK m. 7/2"}
      - {tespit: "Koşullu salıverilmenin derhal uygulama kuralının istisnası olması; artırılmış oranın uygulanamaması", puan: 25, madde: "TCK m. 7/3"}
      - {tespit: "Cezaevi telefon görüşme süresinin salt infaz rejimi kuralı olarak derhal uygulanması", puan: 15, madde: "TCK m. 7/3"}
      - {tespit: "Zamanaşımı süresinin uzatılmasının AY m. 38/2 uyarınca aleyhe geçmişe yürütülememesi", puan: 20, madde: "AY m. 38/2"}
    cozum: |
      **Nitelendirme:** Olay, ceza kanunlarının zaman bakımından uygulanmasına ilişkindir. Dört değişikliğin üçü maddi ceza hukuku veya zamanaşımı alanındadır; biri salt infaz düzenine ilişkindir.

      **Hukuki sorunlar:** (1) Aleyhe değişiklikler geçmişe yürütülebilir mi? (2) İnfaz hükümleri bakımından derhal uygulama kuralı nasıl işler? (3) Zamanaşımı bu kuralın dışında mıdır?

      **İlgili hükümler:** AY m. 38/1: Kimseye suçu işlediği zaman kanunda konulmuş cezadan daha ağır ceza verilemez. AY m. 38/2: Suç ve ceza zamanaşımı ile ceza mahkûmiyetinin sonuçları konusunda da aynı kural uygulanır. TCK m. 7/2: Failin lehine olan kanun uygulanır ve infaz olunur. TCK m. 7/3: Hapis cezasının ertelenmesi, koşullu salıverilme ve tekerrürle ilgili olanlar hariç, infaz rejimine ilişkin hükümler derhal uygulanır.

      **Değerlendirme:** (i) Adli para cezasında alt sınırın yükseltilmesi cezanın miktarını ve dolayısıyla ağırlığını belirleyen maddi ceza hükmüdür ve Mehmet aleyhinedir. Suç tarihindeki daha düşük sınır uygulanır. (ii) Koşullu salıverilme oranının artırılması, TCK m. 7/3'te derhal uygulama kuralının dışında bırakılan konulardandır. Yeni oran fail aleyhine olduğu için lehe kanun kuralı (TCK m. 7/2) gereği suç tarihindeki oran uygulanır. (iii) Cezaevi telefon görüşme süresi, ne ertelemeyle ne koşullu salıverilmeyle ne de tekerrürle ilgili, salt infaz düzenine ilişkindir. TCK m. 7/3'e göre derhal uygulanır; bu nedenle Mehmet'e yeni süre uygulanabilir. (iv) Dava zamanaşımı süresinin 8 yıldan 10 yıla çıkarılması AY m. 38/2'nin kapsamındadır. Anayasa zamanaşımını açıkça fıkra kapsamına aldığı için bu uzatma Mehmet'in suçuna uygulanamaz.

      **Sonuç:** Yalnız cezaevi telefon görüşme süresine ilişkin değişiklik Mehmet'e uygulanabilir. Adli para cezası sınırı, koşullu salıverilme oranı ve zamanaşımı süresine ilişkin değişiklikler geçmişe yürümez. Mahkemenin dört değişikliği birden uygulaması AY m. 38/1-2 ve TCK m. 7'ye aykırıdır.
  - olay: |
      Bir valilik, kamu düzeninin korunması gerekçesiyle yayımladığı genelgede belirli bir toplantı biçimini yasaklamış ve aykırı davrananların "15 gün hapis cezasıyla" cezalandırılacağını duyurmuştur. Genelgeye dayanarak zabıta, Zeynep'i 5 gün boyunca alıkoymuştur. Zeynep hakkında düzenlenen alıkoyma işleminde başvuru yolu ve süresi gösterilmemiştir. Ayrıca Zeynep, alıkonulması sırasında zabıta memuru Ali'nin yetkisini aşan işlemi nedeniyle bir sağlık sorunu yaşamıştır. Savcı, genelgede açıkça yasaklanmamış benzer bir toplantı biçimini de aynı hükme "kıyasen" dâhil ederek soruşturma başlatmayı düşünmektedir.

      1. Genelgedeki hapis cezası ve Zeynep'in alıkonulması Anayasa karşısında nasıl değerlendirilir?
      2. Savcının kıyas yaklaşımı hakkında ne söylenebilir?
      3. Başvuru yolunun gösterilmemesi ve Zeynep'in uğradığı zarar bakımından hangi güvenceler gündeme gelir?
    olcut:
      - {tespit: "Genelgeyle ceza konulamaması; ceza ve güvenlik tedbirinin ancak kanunla konulması", puan: 20, madde: "AY m. 38/3"}
      - {tespit: "İdarenin düzenleyici işlemleriyle suç ve ceza konulamaması", puan: 15, madde: "TCK m. 2/2"}
      - {tespit: "Savcının kıyas yoluyla suç ve ceza uygulamasının yasak olması", puan: 20, madde: "TCK m. 2/3"}
      - {tespit: "Etkili başvuru hakkının bağımlı niteliği ve Zeynep'in savunulabilir iddiası", puan: 15, madde: "AY m. 40/1"}
      - {tespit: "İşlemde başvuru yolu, merci ve sürenin gösterilmemesinin AY m. 40/2'ye aykırılığı", puan: 15, madde: "AY m. 40/2"}
      - {tespit: "Resmî görevlinin haksız işleminden doğan zararın Devletçe tazmini ve rücu", puan: 15, madde: "AY m. 40/3"}
    cozum: |
      **Nitelendirme:** Olayda üç sorun iç içedir: idarenin hapis cezası koyması ve kişiyi alıkoyması, savcının kıyas yoluyla ceza uygulama eğilimi ve başvuru yolunun gösterilmemesi ile görevlinin haksız işleminden doğan zarar.

      **Hukuki sorunlar:** (1) Genelge suç ve ceza koyabilir mi? (2) Kıyas yoluyla ceza uygulanabilir mi? (3) Etkili başvuru güvencelerinin bu olaydaki görünümü nedir?

      **İlgili hükümler:** AY m. 38/3: Ceza ve ceza yerine geçen güvenlik tedbirleri ancak kanunla konulur. AY m. 38/11: İdare, kişi hürriyetinin kısıtlanması sonucunu doğuran bir müeyyide uygulayamaz. TCK m. 2/2: İdarenin düzenleyici işlemleriyle suç ve ceza konulamaz. TCK m. 2/3: Kıyas yapılamaz; geniş yorum kıyasa yol açamaz. AY m. 40/1-3: Etkili başvuru, yol-merci-süre gösterme yükümlülüğü ve Devletçe tazmin.

      **Değerlendirme:** Genelge kanun değildir; hapis cezası AY m. 38/3 ve TCK m. 2/2 uyarınca ancak TBMM'nin çıkardığı kanunla konulabilir. Bu nedenle genelgedeki ceza hükmü geçersizdir. Zeynep'in zabıta tarafından 5 gün alıkonulması ise idarenin kişi hürriyetini kısıtlayan bir müeyyide uygulamasıdır ve AY m. 38/11'e aykırıdır. Savcının benzer toplantı biçimini kıyasen aynı hükme dâhil etmesi TCK m. 2/3 ile yasaktır; üstelik dayanak olan genelge zaten ceza koyamaz. Etkili başvuru hakkı bakımından Zeynep'in AY m. 38/11 ve kişi özgürlüğüne ilişkin savunulabilir bir iddiası vardır; hak bağımlı nitelikte olduğundan bu iddia sayesinde AY m. 40/1 devreye girer. İşlemin altında başvuru yolu, merci ve sürenin gösterilmemesi AY m. 40/2'ye aykırıdır. Zeynep'in uğradığı zarar da resmî görevlinin haksız işleminden doğduğundan AY m. 40/3 uyarınca Devletçe tazmin edilir; Devlet, sorumlu görevli Ali'ye rücu hakkını saklı tutar.

      **Sonuç:** Genelge ceza koyamaz; alıkoyma AY m. 38/11'e aykırıdır; kıyasen soruşturma TCK m. 2/3'e aykırıdır. Başvuru yolunun gösterilmemesi AY m. 40/2'nin ihlalidir ve Zeynep'in zararı AY m. 40/3 uyarınca Devletçe tazmin edilir.
kartlar:
  - on: "Kanunilik ilkesinin dört alt unsuru nedir?"
    arka: "Yazılı kanun, belirlilik, kıyas ve genişletici yorum yasağı, aleyhe geçmişe yürümezlik (AY m. 38, TCK m. 2, TCK m. 7)."
  - on: "İdare suç ve ceza koyabilir mi?"
    arka: "Hayır. İdarenin düzenleyici işlemleriyle suç ve ceza konulamaz (TCK m. 2/2); ceza ancak kanunla konur (AY m. 38/3)."
  - on: "TCK m. 7/2'nin kuralı nedir?"
    arka: "Suç tarihindeki ve sonradan yürürlüğe giren kanun farklıysa failin lehine olan uygulanır ve infaz olunur."
  - on: "İnfaz hükümleri derhal uygulanır; istisnaları nelerdir?"
    arka: "Hapis cezasının ertelenmesi, koşullu salıverilme ve tekerrür (TCK m. 7/3). Bunlarda lehe kanun ilkesi işler."
  - on: "Zamanaşımı geçmişe yürür mü?"
    arka: "Fail aleyhine uzatan düzenleme yürümez. AY m. 38/2, suç ve ceza zamanaşımını da geçmişe yürümezlik kapsamına alır."
  - on: "Suç sonradan suç olmaktan çıkarsa verilmiş ceza ne olur?"
    arka: "Cezanın infazı ve kanuni neticeleri kendiliğinden kalkar (TCK m. 7/1)."
  - on: "Olağanüstü hâlde durdurulamayan kanunilik güvencesi hangisi?"
    arka: "Suç ve cezaların geçmişe yürütülememesi (AY m. 15/2; Sözleşme'nin 15. maddesinin ikinci fıkrası ve 7. maddesi)."
  - on: "Genel müsadere ile özel müsadere farkı nedir?"
    arka: "Genel müsadere (tüm malvarlığı) AY m. 38/10 ile yasaktır. Eşya ve kazanç müsaderesi güvenlik tedbiridir ve serbesttir (TCK m. 54, TCK m. 55)."
  - on: "Etkili başvuru hakkının karakteri nedir?"
    arka: "Bağımlı haktır; başka bir hakkın ihlaline dair savunulabilir iddia gerekir (AY m. 40/1, Sözleşme'nin 13. maddesi)."
  - on: "AY m. 40/2 Devlete ne yükler?"
    arka: "İşlemlerinde ilgili kişilerin başvuracağı kanun yollarını, mercileri ve süreleri belirtme yükümlülüğü."
  - on: "AY m. 40/3'ün kuralı nedir?"
    arka: "Resmî görevlilerin haksız işlemleri sonucu zarar Devletçe tazmin edilir; Devletin sorumlu görevliye rücu hakkı saklıdır."
  - on: "Tüzel kişilere ceza verilebilir mi?"
    arka: "Hayır; ceza yaptırımı uygulanamaz, ancak kanundaki güvenlik tedbiri niteliğindeki yaptırımlar saklıdır (TCK m. 20/2, TCK m. 60)."
