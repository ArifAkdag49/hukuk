    dogru: 1
    aciklama: |
      TCK m. 216/1 kin ve düşmanlığa tahrik suçunda "kamu güvenliği açısından açık ve yakın bir tehlikenin ortaya çıkması" şartını arar. Aşağılamayı düzenleyen TCK m. 216/2 bu şartı aramaz ve cinsiyet farklılığını da sayar.
  - soru: |
      Bir dergide, bir kişinin gerçeğe aykırı biçimde "rüşvet aldığı" yazılmıştır. Kişi düzeltme ve cevap hakkını kullanmak istemiş, yayımlanmayınca mahkemeye başvurmuştur. AY m. 32'ye göre hangisi doğrudur?
    siklar:
      - "Düzeltme ve cevap hakkı her olumsuz haber için tanınır."
      - "Hakkı yalnız haysiyet ve şerefe dokunulması veya gerçeğe aykırı yayın hâllerinde tanınır; hâkim en geç yedi gün içinde karar verir."
      - "Hâkim başvuru tarihinden itibaren en geç otuz gün içinde karar verir."
      - "Hak yalnız devlet büyüklerine tanınır."
    dogru: 1
    aciklama: |
      AY m. 32'ye göre düzeltme ve cevap hakkı ancak kişilerin haysiyet ve şereflerine dokunulması veya kendileriyle ilgili gerçeğe aykırı yayın yapılması hâllerinde tanınır. Yayımlanmazsa hâkim, ilgilinin müracaat tarihinden itibaren en geç yedi gün içinde karar verir.
  - soru: |
      Basın özgürlüğünün sınırlanmasında hangi Anayasa maddeleri uygulanır?
    siklar:
      - "AY m. 13 ve AY m. 15"
      - "AY m. 26 ve AY m. 27"
      - "AY m. 29 ve AY m. 30"
      - "AY m. 31 ve AY m. 32"
    dogru: 1
    aciklama: |
      AY m. 28/4'e göre basın hürriyetinin sınırlanmasında Anayasanın 26 ve 27 nci maddeleri hükümleri uygulanır. Bu yüzden basın bakımından sebep listesi, düşünceyi açıklama hürriyetine ilişkin AY m. 26/2'den alınır.
olaylar:
  - olay: |
      Gazeteci Ayşe, ulusal bir gazetede yayımlanan köşe yazısında Meclis'te yaşanan bir tartışmayı ele almıştır. Yazıda, tartışmaya katılanları ad vermeden, genel ve alaycı bir dille eleştirmiş; milletvekillerinin bu tartışmada asabileştiğine ilişkin kamuoyunda dolaşan haberlere göndermeyle espirili bir cümle kurmuştur. Yazının tamamı siyasi bir uygulamaya yönelik görüşlerini içermekte, belirli bir milletvekilini hedef almamaktadır. İki milletvekili suç duyurusunda bulunmuştur. Başsavcılık, kurul hâlinde çalışan kamu görevlilerine görevlerinden dolayı basın yoluyla hakaret suçundan dava açmış, asliye ceza mahkemesi Ayşe'yi 1 yıl 2 ay hapse mahkûm etmiş ve hükmün açıklanmasını geri bırakmıştır. Mahkeme, eleştirilecek somut bir eylem bulunmadığını, amacın aşağılama olduğunu belirtmiştir. İtirazı reddedilen Ayşe, Anayasa Mahkemesine bireysel başvuru yapmıştır.

      1. Hükmün açıklanmasının geri bırakılması (HAGB) ifade özgürlüğüne müdahale sayılır mı?
      2. Müdahalenin kanuni dayanağı ve meşru amacı nedir?
      3. Siyasetçilere yönelik eleştirinin sınırı bakımından Ayşe'nin yazısı nasıl değerlendirilmelidir?
      4. Ayşe basın mensubu olduğuna göre, basın hürriyetinin sınırlanmasında hangi madde uygulanır?
      5. Bu tür bir olguda AYM'nin yaklaşımına göre sonuç ne olur?
    olcut:
      - {tespit: "HAGB'li mahkûmiyet de müdahaledir; denetim süresi ve ihtimal olarak hükmün açıklanması caydırıcı etki yaratır", puan: 20, madde: "AY m. 26"}
      - {tespit: "Kanuni dayanak hakaret hükmüdür; meşru amaç başkalarının şöhret veya haklarının korunmasıdır", puan: 20, madde: "TCK m. 125"}
      - {tespit: "Basın özgürlüğünün sınırlanmasında AY m. 26 ve AY m. 27 uygulanır", puan: 15, madde: "AY m. 28/4"}
      - {tespit: "Siyasetçi ve hükümet eleştirisinin sınırı geniştir; siyasetçinin şöhreti de korunur", puan: 20, madde: "AY m. 26/2"}
      - {tespit: "Yazı bütünüyle ve bağlamıyla okunur; kamu yararı, ifadenin kimden kime yöneldiği ve yaptırımın ağırlığı tartılır", puan: 15, madde: "AY m. 13"}
      - {tespit: "Müdahale demokratik toplumda gerekli değildir; basın ve ifade özgürlüğü ihlali", puan: 10, madde: "AY m. 28/1"}
    cozum: |
      **Nitelendirme:** Olay, basın yoluyla yapılan siyasi eleştirinin hakaret hükmü aracılığıyla cezalandırılması nedeniyle ortaya çıkan bir ifade ve basın özgürlüğü ihlali iddiasıdır. İlgili haklar AY m. 26 ve AY m. 28'dir; şeref ve itibar tarafında AY m. 17/1 ve TCK m. 125 yer alır.

      **Hukuki sorunlar:** (1) Müdahale var mı? (2) Müdahale kanunilik ve meşru amaç şartlarını sağlıyor mu? (3) Müdahale demokratik toplumda gerekli ve ölçülü mü?

      **İlgili hükümler:** AY m. 26/1 düşünceyi "söz, yazı, resim veya başka yollarla" açıklama ve yayma hakkını verir. AY m. 26/2 başkalarının şöhret veya haklarının korunmasını sınırlama sebebi sayar. AY m. 28/4'e göre basın hürriyetinin sınırlanmasında AY m. 26 ve AY m. 27 uygulanır. AY m. 13 ölçülülük ilkesini koyar. TCK m. 125, hakaret suçunu düzenler; kamu görevlisine görevinden dolayı hakarette alt sınır bir yıldan az olamaz (TCK m. 125/3-a), kurul hâlinde çalışanlara hakaret kurulu oluşturan üyelere karşı işlenmiş sayılır (TCK m. 125/5). TCK m. 218 ise eleştiri amacıyla yapılan, haber verme sınırlarını aşmayan düşünce açıklamalarının suç oluşturmayacağını söyler.

      **Değerlendirme:** HAGB, cezanın infazı anlamına gelmez; ama beş yıllık denetim süresi ve denetim süresinde yeniden suç işlenmesi hâlinde hükmün açıklanması ihtimali, kişi üzerinde caydırıcı etki yaratır. Bu nedenle HAGB'li mahkûmiyet de müdahaledir. Müdahalenin dayanağı hakaret hükmüdür, dolayısıyla kanunilik sağlanır; meşru amaç, başkalarının şöhret veya haklarıdır. Asıl sorun gereklilik ve ölçülülüktedir. Yazı bütünüyle ve bağlamı içinde okunmalıdır. Ayşe'nin sözleri belirli bir milletvekilini göstermemekte, kamusal bir tartışmaya katılmakta ve siyasetçilere yönelik eleştiri alanına girmektedir. Siyasetçilere yönelik eleştirinin sınırı sıradan kişilere göre geniştir; yine de siyasetçilerin şöhreti korunur. Mahkemelerin, ifade özgürlüğünün yararından çok daha ağır basan bir yararı somut olgularla göstermesi gerekir; ifade türü, kamusal tartışmaya katkısı, kimden kime yöneldiği ve yaptırımın niteliği bu tartımın unsurlarıdır. İlk derece mahkemesinin yalnızca "somut eylem yok, amaç aşağılama" demesi, bu tartımı yapmış sayılmaz.

      **Sonuç:** Benzer olgularda AYM, müdahaleyi demokratik toplumda gerekli bulmamış ve AY m. 26/1 ile AY m. 28/1'in ihlal edildiğine karar vermiştir. Aynı sonuç Ayşe bakımından da beklenir.
  - olay: |
      Bir idari kurum, Y adlı video paylaşım sitesinde yayımlanan üç video nedeniyle, kanunda sitenin tamamına erişimi engelleme yetkisini açıkça veren bir hüküm bulunmamasına rağmen, sitenin tamamına erişimi idari tedbirle engellemiştir. Aynı gün sulh ceza hâkimliği yalnız üç URL için engel kararı vermiş, sonrasında bir mahkeme sitenin açılmasına ve yalnız üç URL'ye engelin sürmesine kesin olarak karar vermiştir. Buna rağmen site açılmamıştır. Siteyi düzenli kullanan, öğretim üyesi Mehmet, derslerinde ve araştırmalarında bu siteden yararlanmaktadır. Mehmet, düşünceyi açıklama ve bilgi edinme özgürlüğünün ihlal edildiği iddiasıyla Anayasa Mahkemesine bireysel başvuru yapmıştır.

      1. Mehmet, siteyi yalnız kullanan biri olarak başvuru yapabilir mi?
      2. Müdahale hangi hakka yöneliktir ve incelemede ilk hangi ölçüt ele alınır?
      3. Kanuni dayanak bakımından hangi sonuca varılır?
      4. Kanunilik yoksa ölçülülük de incelenir mi?
      5. Başvurunun sonucu ne olur?
    olcut:
      - {tespit: "Siteyi kullanan kişiler de sitenin tamamına erişim engelinden doğrudan etkilenmiş sayılır; Mehmet'in mağdur sıfatı vardır", puan: 15, madde: "AY m. 26"}
      - {tespit: "Müdahale düşünceyi açıklama ve yayma, haber ve fikir alma hürriyetine yöneliktir", puan: 15, madde: "AY m. 26/1"}
      - {tespit: "İncelemede önce kanunilik ölçütüne bakılır; kanun erişilebilir, açık ve öngörülebilir olmalıdır", puan: 20, madde: "AY m. 13"}
      - {tespit: "Sitenin tamamına erişimi engelleme yetkisini açıkça veren bir kanun hükmü yoktur; müdahalenin yeterince açık ve belirgin kanuni dayanağı bulunmadığından öngörülebilir değildir", puan: 20, madde: "AY m. 13"}
      - {tespit: "Kanunilik yoksa öze dokunmama, gereklilik ve ölçülülük incelenmeden ihlal sonucuna varılır", puan: 15, madde: "AY m. 13"}
      - {tespit: "Sonuç AY m. 26 ihlalidir; sosyal medya düşünceyi açıklamanın ve bilgi edinmenin vazgeçilmez aracıdır", puan: 15, madde: "AY m. 26"}
    cozum: |
      **Nitelendirme:** Olay, internet erişim engelinin ifade özgürlüğüne (AY m. 26) müdahale oluşturup oluşturmadığına ilişkin bir bireysel başvurudur. Başvurucu, içeriği yayanlardan ayrı olarak, siteden yararlanan kullanıcıdır.

      **Hukuki sorunlar:** (1) Kullanıcının mağdur sıfatı ve başvuru yollarının tüketilmesi; (2) müdahalenin kanunilik şartını sağlayıp sağlamadığı; (3) kanunilik yoksa sonraki aşamaların incelenip incelenmeyeceği.

      **İlgili hükümler:** AY m. 26/1, düşünce ve kanaatlerin yanında, resmî makamların müdahalesi olmaksızın haber veya fikir almak ya da vermek serbestliğini de korur. AY m. 26/2 sınırlama sebeplerini sayar; AY m. 13'e göre sınırlama ancak kanunla, özüne dokunulmadan ve ölçülülük ilkesine uygun yapılabilir.

      **Değerlendirme:** Sitenin tamamına erişim engellenince, siteyi kullanan herkesin bilgi edinme ve düşünce açıklama imkânı doğrudan etkilenir. Bu nedenle öğretim üyesi Mehmet yalnız kullanıcı olsa da mağdur sıfatı taşır; üstelik kesin yargı kararlarına rağmen engel sürdüğü için başvuru yolları da tüketilmiş sayılır. Müdahale, ifadeyi ve bilgi edinmeyi doğrudan sınırladığı için AY m. 26/1 kapsamındadır. Üçlü testte ilk olarak kanunilik incelenir. Kanun erişilebilir, açık, net ve yeterince belirli olmalı; kişi hangi davranışın hangi sonucu doğuracağını öngörebilmelidir. Somut olayda idareye sitenin tamamına (URL bazlı değil) erişimi engelleme yetkisini veren ve sınırlama aracını belirleyen açık bir hüküm yoktur. Müdahalenin yeterince açık ve belirgin bir kanuni dayanağı olmadığından öngörülebilir değildir. Kanunilik yoksa öze dokunmama, gereklilik ve ölçülülük gibi aşamalar incelenmeden ihlal sonucuna varılır. Ayrıca sosyal medya düşünceyi açıklamanın ve bilgi edinmenin vazgeçilmez aracıdır; bir içerik yüzünden sitenin tamamını kapatmak ilgisiz milyonlarca kullanıcıyı etkiler ve daha hafif tedbir araştırılmadan genel yasak uygulanamaz.

      **Sonuç:** Mehmet'in başvurusu kabul edilebilirdir ve AY m. 26 ihlal edilmiştir; ihlal kanunilik şartının sağlanmamasından kaynaklanır, ölçülülük değerlendirilmez.
kartlar:
  - on: "AY m. 25 ile AY m. 26 arasındaki temel fark nedir?"
    arka: "AY m. 25 iç alanı (düşünce ve kanaat) korur ve sınırlama sebebi saymaz. AY m. 26 düşüncenin açıklanması ve yayılmasını korur ve AY m. 26/2'deki sebeplerle sınırlanabilir."
  - on: "'Genel ahlak' AY m. 26/2'de var mı?"
    arka: "Yok. AY m. 26/2'de ne genel ahlak ne de sağlık sayılır. Genel ahlak basın bakımından AY m. 28/7 ve 28/9'da, AY m. 31'de geçer. AİHS'in 10. maddesinin ikinci fıkrasında 'sağlığın veya ahlakın' korunması vardır."
  - on: "İzin sistemine hangi yayınlar bağlanabilir?"
    arka: "Radyo, televizyon, sinema ve benzeri yayımlar (AY m. 26/1). Basımevi kurmak, süreli ve süresiz yayın izne ve mali teminata bağlanamaz (AY m. 28/1 ve AY m. 29)."
  - on: "Toplatma ve dağıtımı önlemede 24 ve 48 saat kuralı nedir?"
    arka: "Yetkili merci kararını en geç 24 saat içinde hâkime bildirir; hâkim en geç 48 saat içinde onaylamazsa karar hükümsüz sayılır (AY m. 28/5 ve 28/7)."
  - on: "Süreli yayın hangi koşulda kapatılabilir?"
    arka: "Yalnız mahkûmiyet hâlinde, mahkeme kararıyla ve geçici olarak (AY m. 28/9)."
  - on: "Basın özgürlüğünün sınırlanmasında hangi maddeler uygulanır?"
    arka: "AY m. 26 ve AY m. 27 (AY m. 28/4). Sebep listesi AY m. 26/2'den alınır."
  - on: "Düzeltme ve cevap hakkı ne zaman tanınır?"
    arka: "Yalnız haysiyet ve şerefe dokunulması veya gerçeğe aykırı yayın hâllerinde. Yayımlanmazsa hâkim en geç yedi gün içinde karar verir (AY m. 32)."
  - on: "Siyasetçi eleştirisinde sınır nasıldır?"
    arka: "Siyasetçi ve hükümet için sıradan kişiye göre daha geniştir; ama siyasetçinin şöhreti de AY m. 26/2 kapsamında korunur."
  - on: "HAGB'li hapis cezası müdahale sayılır mı?"
    arka: "Evet. Beş yıllık denetim süresi ve hükmün açıklanması ihtimali caydırıcı etki yarattığı için HAGB de ifade özgürlüğüne müdahaledir."
  - on: "YouTube kararında ihlalin gerekçesi nedir?"
    arka: "Kanunilik. Sitenin tamamına erişimi engellemeye yetki veren yeterince açık ve belirgin kanuni dayanak yoktur; ölçülülük incelenmeden AY m. 26 ihlali bulunmuştur."
  - on: "AYM'ye göre nefret söyleminin ölçütü nedir?"
    arka: "Genel kabul gören tanım yoktur; ölçüt, hoşgörüsüzlüğe dayalı nefreti yayan, kışkırtan, teşvik eden veya meşrulaştıran ifadedir. Cinsel yönelim ve kimlik de kapsama girer."
  - on: "TCK m. 216/1 ile TCK m. 216/2 arasındaki fark nedir?"
    arka: "TCK m. 216/1 kin ve düşmanlığa tahriktir ve kamu güvenliği açısından açık ve yakın tehlike arar. TCK m. 216/2 aşağılamadır, açık ve yakın tehlike aramaz ve cinsiyeti de sayar."
