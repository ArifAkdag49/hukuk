sorular:
  - soru: |
      AY m. 12/1'de sayılan temel hak ve hürriyet niteliklerinden biri **olmayan** hangisidir?
    siklar:
      - "Kişiliğe bağlı olma"
      - "Devredilmez olma"
      - "Hiçbir surette sınırlandırılamaz olma"
      - "Vazgeçilmez olma"
    dogru: 2
    aciklama: |
      AY m. 12/1 dört nitelik sayar: kişiliğe bağlı, dokunulmaz, devredilmez ve vazgeçilmez. "Hiçbir surette sınırlandırılamaz" bunlar arasında değildir; temel haklar AY m. 13'te gösterilen şartlara uygun olarak kanunla sınırlanabilir. "Dokunulmaz" ifadesini "sınırlanamaz" diye okumak sık yapılan yanılgıdır.
  - soru: |
      Jellinek'in statü kuramına göre 1982 Anayasasının "Siyasi Haklar ve Ödevler" bölümündeki haklar hangi gruba girer?
    siklar:
      - "Negatif statü hakları"
      - "Pozitif statü hakları"
      - "Aktif statü hakları"
      - "Kolektif statü hakları"
    dogru: 2
    aciklama: |
      Siyasi haklar (AY m. 66-74), bireyin siyasal iradenin oluşumuna katılmasını sağladığı için aktif statü hakları sayılır. Kişinin hakları (AY m. 17-40) negatif, sosyal ve ekonomik haklar (AY m. 41-65) pozitif statüyü temsil eder.
  - soru: |
      Aşağıdakilerden hangisi Vasak'ın sınıflandırmasında ikinci kuşak haklar arasında yer alır?
    siklar:
      - "Seçme ve seçilme hakkı"
      - "Çevre hakkı"
      - "Çalışma ve sosyal güvenlik hakkı"
      - "Yaşama hakkı"
    dogru: 2
    aciklama: |
      İkinci kuşak, sosyal, ekonomik ve kültürel haklardır; çalışma ve sosyal güvenlik buna örnektir. Seçme-seçilme (siyasi hak) ve yaşama hakkı birinci kuşağa, çevre hakkı üçüncü kuşağa aittir.
  - soru: |
      AY m. 65'e göre devlet, sosyal ve ekonomik alanlarda Anayasa ile belirlenen görevlerini hangi ölçüde yerine getirir?
    siklar:
      - "Ekonomik istikrarın korunmasını gözeterek"
      - "Malî kaynaklarının yeterliliği ölçüsünde"
      - "Bütçe kanununun öngördüğü sınırlar içinde"
      - "Hiçbir sınır bulunmaksızın, tam ölçüde"
    dogru: 1
    aciklama: |
      AY m. 65 devletin görevlerini bu görevlerin amaçlarına uygun öncelikleri gözeterek malî kaynaklarının yeterliliği ölçüsünde yerine getireceğini söyler. "Ekonomik istikrarın korunmasını gözeterek" ibaresi 2001 değişikliğiyle metinden çıkarılmıştır.
  - soru: |
      Mülkiyet hakkı (AY m. 35) ile konut hakkı (AY m. 57) 1982 Anayasasının hangi bölümlerinde yer alır?
    siklar:
      - "İkisi de Sosyal ve Ekonomik Haklar ve Ödevler bölümünde"
      - "Mülkiyet hakkı Kişinin Hakları ve Ödevleri, konut hakkı Sosyal ve Ekonomik Haklar ve Ödevler bölümünde"
      - "Mülkiyet hakkı Siyasi Haklar ve Ödevler, konut hakkı Kişinin Hakları ve Ödevleri bölümünde"
      - "İkisi de Kişinin Hakları ve Ödevleri bölümünde"
    dogru: 1
    aciklama: |
      Mülkiyet ve miras hakkı (AY m. 35) kişinin haklarındadır; 1961 Anayasasında sosyal-iktisadi haklar arasındaydı. Konut hakkı (AY m. 57) sosyal ve ekonomik haklardadır. Konut dokunulmazlığı (AY m. 21) ile karıştırılmamalıdır.
  - soru: |
      Hangi anayasa metninde devletin niteliği "insan haklarına saygılı" olarak değil, "insan haklarına dayanan" biçiminde ifade edilmiştir?
    siklar:
      - "1982 Anayasasının 2. maddesi"
      - "1924 Teşkilat-ı Esasiye Kanunu"
      - "1961 Anayasasının 2. maddesi"
      - "1876 Kanun-ı Esasi"
    dogru: 2
    aciklama: |
      1961 Anayasası m. 2 "insan haklarına dayanan" ibaresini kullanır. 1982 Anayasası m. 2 ise "insan haklarına saygılı" der. 1982 Anayasasında "insan haklarına dayanan" ifadesi AY m. 14/1'de, hakların kötüye kullanılamayacağı bağlamında geçer.
  - soru: |
      Zeynep, çalıştığı şirketle yaptığı sözleşmede "özel hayatımın gizliliği konusunda şirkete karşı hiçbir hak ileri sürmeyeceğim" diye genel ve kesin bir kayıt kabul etmiştir. Bu kayıt hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Zeynep'in iradesi serbest olduğundan kayıt tamamen geçerlidir."
      - "Kayıt, kişinin özgürlüklerinden vazgeçemeyeceği kuralı (TMK m. 23/2) ve AY m. 12/1'deki vazgeçilmezlik karşısında geçerli değildir."
      - "Kayıt yalnızca şirket kanunla yetkilendirilmişse geçerlidir."
      - "Kayıt geçerlidir ama Zeynep onu istediği zaman tek taraflı olarak iptal edebilir."
    dogru: 1
    aciklama: |
      Genel ve kesin feragat, hakkın belirli bir olayda kullanılmasına rıza göstermekten farklıdır. TMK m. 23/2'ye göre kimse özgürlüklerinden vazgeçemez veya onları hukuka ya da ahlâka aykırı olarak sınırlayamaz; AY m. 12/1 de hakların vazgeçilmez olduğunu söyler. Belirli bilgilerin paylaşılmasına geri alınabilir bir rıza ise ayrı bir meseledir.
  - soru: |
      Bir belediye, doğalgaz yardımından yararlanmayı "yalnızca son yerel seçimde oy kullanmış olanlar" şartına bağlamış, belediye bütçesinin sınırlı olduğunu da ileri sürmüştür. Bu durum bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "AY m. 65 mali kaynak ölçütü getirdiğinden her türlü yararlanma koşulu serbestçe belirlenebilir."
      - "Sosyal haklar program hükmü olduğundan hiçbir hukuki denetime tabi değildir."
      - "Mali kaynak sınırı, sosyal yardımdan yararlanma koşullarında AY m. 10'daki eşitlik ilkesine uyma zorunluluğunu ortadan kaldırmaz."
      - "Yardım ancak yurttaş olmayanlara yönelik olarak AY m. 16 uyarınca sınırlanabilir."
    dogru: 2
    aciklama: |
      AY m. 65 devlete öncelik belirleme ve kaynakla sınırlı davranma imkânı verir; ancak yararlanma koşulları belirlenirken nesnel ve makul bir gerekçesi olmayan ayrım eşitlik ilkesine (AY m. 10) aykırıdır. Oy kullanmış olmak ile yardıma ihtiyaç duymak arasında bağlantı yoktur.
  - soru: |
      Olağanüstü hâl ilan edilmiş, yetkili organ geniş tedbirler almıştır. Aşağıdakilerden hangisi AY m. 15/2'ye göre olağanüstü hâlde dahi dokunulamayan haklardandır?
    siklar:
      - "Toplantı ve gösteri yürüyüşü yapma hakkı"
      - "Seyahat özgürlüğü"
      - "Suçluluğu mahkeme kararıyla saptanıncaya kadar suçlu sayılmama"
      - "Konut dokunulmazlığı"
    dogru: 2
    aciklama: |
      AY m. 15/2 çekirdek alanı sayar: yaşama hakkı ve maddi-manevi varlığın bütünlüğü (savaş hukukuna uygun ölümler hariç), din-vicdan-düşünce açıklamaya zorlanamama, suç ve cezaların geçmişe yürütülememesi ve suçluluğu mahkeme kararıyla saptanıncaya kadar kimsenin suçlu sayılmaması. Diğer haklar AY m. 15/1 çerçevesinde durdurulabilir.
  - soru: |
      Bir köy halkı, yakındaki bir fabrikanın çevreyi kirlettiğini ileri sürerek sağlıklı ve dengeli bir çevrede yaşama hakkına (AY m. 56) dayanıyor. Bu hak Vasak'ın sınıflandırmasında hangi kuşağa girer?
    siklar:
      - "Birinci kuşak (klasik) haklar"
      - "İkinci kuşak (sosyal) haklar"
      - "Üçüncü kuşak (dayanışma) haklar"
      - "Kuşak sınıflandırmasının dışında kalır"
    dogru: 2
    aciklama: |
      Çevre hakkı, barış ve gelişme hakkı ile birlikte üçüncü kuşak dayanışma haklarındandır. Öznesi yalnızca tekil birey değil, topluluklar ve gelecek kuşaklardır. AY m. 56/1 sağlıklı ve dengeli bir çevrede yaşama hakkını güvence altına alır.
  - soru: |
      Suriye uyruklu bir öğrenci, yabancı olduğu için bir temel hakkın kullanımının kanunla kısıtlanmasına itiraz ediyor. Anayasa açısından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Temel hak ve hürriyetler yalnızca Türk vatandaşlarına tanınmıştır."
      - "Yabancılar için temel haklar sınırlanamaz."
      - "Temel hak ve hürriyetler yabancılar için milletlerarası hukuka uygun olarak kanunla sınırlanabilir."
      - "Yabancıların hakları yalnızca idari düzenlemeyle sınırlanabilir."
    dogru: 2
    aciklama: |
      AY m. 16 yabancıların da hak sahibi olduğunu kabul eder, ancak bu haklar milletlerarası hukuka uygun olarak kanunla sınırlanabilir. Sınırlamanın kanunla yapılması şarttır; idari düzenleme yeterli değildir.
  - soru: |
      İşveren Ali, çalışanı Ayşe ile yaptığı iş sözleşmesine "10 yıl boyunca evlenmeyeceksin, evlenirsen cezai şart ödeyeceksin" kaydı koymuştur. Temel hakların etkisi bakımından bu kayıt nasıl değerlendirilir?
    siklar:
      - "Anayasa yalnızca devleti bağladığından özel hukuk sözleşmelerine hiçbir şekilde etki etmez."
      - "Kayıt geçerlidir; çünkü kişi evlenme özgürlüğünü sözleşmeyle devredebilir."
      - "Kayıt, kişinin özgürlüğünü hukuka ya da ahlâka aykırı biçimde sınırlaması nedeniyle TMK m. 23/2 aracılığıyla geçersizdir."
      - "Kayıt ancak Anayasa Mahkemesi iptal ederse geçersiz olur."
    dogru: 2
    aciklama: |
      Anayasa hükümleri yasama, yürütme, yargı organlarını ve diğer kuruluş ve kişileri de bağlar (AY m. 11/1). Temel hakların özel hukuktaki etkisi çoğunlukla TMK m. 23 ve TMK m. 24 gibi genel hükümler üzerinden, yani dolaylı yoldan görülür. TMK m. 23/2 özgürlüğün hukuka veya ahlâka aykırı sınırlanmasını yasaklar.
olaylar:
  - olay: |
      Yazılım mühendisi Ahmet, B Teknoloji A.Ş. ile imzaladığı iş sözleşmesine şu kayıtları kabul etmiştir:
      (i) "On yıl boyunca evlenmeyeceğim; evlenirsem şirkete cezai şart ödeyeceğim."
      (ii) "İşyerindeki her alanda, tuvalet ve soyunma kabinleri dâhil, ses ve görüntü kaydıyla sürekli izlenmeme geri dönülmez biçimde rıza gösteriyorum."
      (iii) "Şirkete karşı ileride doğabilecek hiçbir hak için hiçbir yargı merciine başvurmayacağım."
      İki yıl sonra Ahmet, Zeynep ile evlenmiştir. B A.Ş. cezai şartı talep etmiş, Ahmet ise kayıtların hiçbirinin kendisini bağlamadığını ileri sürmüştür. Ahmet'in avukatı ayrıca "temel haklar dokunulmaz olduğuna göre kanun bile bu haklara hiçbir sınırlama getiremez" demiştir.

      Sorular:
      1. Kayıtlar hangi anayasal niteliğe ve hangi özel hukuk kuralına aykırılık iddiasına dayanır?
      2. (i), (ii) ve (iii) numaralı kayıtların geçerliliğini değerlendiriniz.
      3. Avukatın "dokunulmaz olduğu için kanunla bile sınırlanamaz" görüşü doğru mudur?
    olcut:
      - {tespit: "Sorunun AY m. 12/1'deki vazgeçilmezlik ve dokunulmazlık niteliklerine, özel hukukta TMK m. 23'e dayandığının belirlenmesi", puan: 20, madde: "AY m. 12"}
      - {tespit: "Evlenmeme kaydının özgürlüğün hukuka ve ahlâka aykırı sınırlanması olarak TMK m. 23/2 uyarınca geçersiz olduğu, cezai şartın doğmadığı", puan: 20, madde: "TMK m. 23"}
      - {tespit: "Sürekli ve geri dönülmez izleme rızasının, özel hayat ve insan haysiyeti çekirdeğini ihlal ettiği için hakkın kendisinden vazgeçme sayılıp geçerli olmadığı", puan: 20, madde: "AY m. 20"}
      - {tespit: "Genel ve peşin yargı yoluna başvurmama kaydının hak arama hürriyetinden vazgeçme niteliği taşıdığı ve geçersiz olduğu", puan: 15, madde: "AY m. 36"}
      - {tespit: "Dokunulmazlığın sınırlanamazlık anlamına gelmediği; AY m. 13 şartlarına uygun kanunla sınırlama mümkün, AY m. 15/2 çekirdeğinin ise savaş ve olağanüstü hâlde dahi korunduğu", puan: 15, madde: "AY m. 13"}
      - {tespit: "Rıza ile feragat ayrımı ve temel hakların özel hukukta TMK m. 23 ve TMK m. 24 üzerinden dolaylı etkisinin gösterilmesi", puan: 10, madde: "TMK m. 24"}
    cozum: |
      **Nitelendirme:** Olay, temel hakların özel hukuk sözleşmesiyle devri ve sınırlanması sorunudur. Üç kayıt da kişinin özgürlüklerine ve haklarına ilişkindir; bu yüzden AY m. 12/1'deki "vazgeçilmezlik" ve TMK m. 23 çerçevesinde incelenir.

      **Hukuki sorunlar:** (1) Evlenmeme ve cezai şart kaydı geçerli midir? (2) Sürekli ve geri dönülemez izleme rızası geçerli midir? (3) Yargı yoluna peşinen başvurmama kaydı geçerli midir? (4) "Dokunulmazlık" sınırlanamazlık demek midir?

      **İlgili hükümler:** AY m. 12/1 temel hakların kişiliğe bağlı, dokunulmaz, devredilmez ve vazgeçilmez olduğunu söyler. AY m. 11/1'e göre Anayasa hükümleri diğer kuruluş ve kişileri de bağlar. TMK m. 23/1 hak ve fiil ehliyetinden kısmen bile vazgeçmeyi, TMK m. 23/2 özgürlüklerden vazgeçmeyi ve onları hukuka veya ahlâka aykırı sınırlamayı yasaklar. AY m. 20 özel ve aile hayatına saygıyı, AY m. 36 hak arama hürriyetini ve adil yargılanmayı güvenceye bağlar. TMK m. 24/2'ye göre rıza, kişilik saldırısını haklı kılan sebeplerden biridir.

      **Değerlendirme:** (i) Evlenme, aile kurma ve aile hayatı kişinin en kişisel tercihleridir. On yıl evlenmeme taahhüdü bu özgürlüğü hukuka ve ahlâka aykırı biçimde sınırlar; TMK m. 23/2 uyarınca kayıt geçersizdir ve cezai şart doğmaz. (ii) Ahmet'in izlenmeye rıza göstermesi, belirli ve geri alınabilir bir kullanıma izin değildir; tuvalet ve soyunma alanlarında sürekli izleme özel hayatın ve insan haysiyetinin çekirdeğine dokunur. Geri dönülmez ve genel rıza, hakkın kendisinden vazgeçme anlamına geldiğinden geçerli sayılmaz. TMK m. 24/2'deki rıza bu çekirdeği haklı kılamaz. (iii) İleride doğacak her hak için yargı yoluna peşinen ve genel biçimde başvurmama taahhüdü, AY m. 36 güvencesinden vazgeçme niteliği taşır ve TMK m. 23 karşısında geçersizdir. Avukatın görüşü ise hatalıdır. Dokunulmazlık, AY m. 13 şartlarına uygun kanunla sınırlama yapılabilmesine engel değildir. Gerçek anlamda sınırlanamayan çekirdek alan AY m. 15/2'de sayılanlardır. Bu olayda Ahmet'in hakları sözleşmesel vazgeçme ile sınırlanamaz; fakat bu, her sınırlamanın yasak olduğu anlamına gelmez.

      **Sonuç:** Üç kayıt da geçersizdir. B A.Ş. cezai şartı talep edemez. Avukatın "kanunla bile sınırlanamaz" savı yanlıştır; haklar AY m. 13 şartlarıyla sınırlanabilir, ancak sözleşmeyle vazgeçilemez.
  - olay: |
      X Belediyesi, kış yardımı yönetmeliği çıkarmıştır. Yönetmeliğe göre doğalgaz ve eğitim yardımından "yalnızca o ilin nüfusuna kayıtlı olup son yerel seçimde oy kullanmış vatandaşlar" yararlanabilecektir. İlçedeki engelli bireyler için ise "bütçe yetersizliği nedeniyle" hiçbir kontenjan ayrılmamıştır. Engelli Mehmet ve Suriye uyruklu mülteci öğrenci Layla yardım başvurusu yapmış, reddedilmiştir. Belediye, "sosyal haklar devletin kaynaklarına bağlıdır, AY m. 65 gereği dilediğimiz gibi dağıtırız" demiştir.

      Sorular:
      1. Yardım hangi hak kategorisine girer? Kuşak ve statü bakımından nitelendiriniz.
      2. AY m. 65'e dayanan belediye savunması yeterli midir?
      3. Oy kullanma şartı ve engellilerin dışlanması nasıl değerlendirilir?
      4. Layla'nın yabancı olması yardım talebini etkiler mi?
    olcut:
      - {tespit: "Sosyal yardımın ikinci kuşak, pozitif statü hakkı olarak nitelendirilmesi ve sosyal devlet ilkesiyle bağlantısı", puan: 15, madde: "AY m. 2"}
      - {tespit: "AY m. 65'in mali kaynakların yeterliliği ölçüsünde yerine getirme ve öncelik belirleme imkânı verdiği, ancak ayrımcı ölçüt koymaya izin vermediği", puan: 25, madde: "AY m. 65"}
      - {tespit: "Oy kullanma şartının yardıma ihtiyaçla nesnel bağı bulunmadığından kanun önünde eşitlik ilkesine aykırı olduğu", puan: 20, madde: "AY m. 10"}
      - {tespit: "Engellilerin tümden dışlanmasının bütçe gerekçesiyle kendiliğinden haklı olmadığı; engelliler lehine tedbirlerin eşitliğe aykırı sayılmadığı ve devletin koruma görevi bulunduğu", puan: 20, madde: "AY m. 61"}
      - {tespit: "Yabancılar için temel hakların milletlerarası hukuka uygun olarak kanunla sınırlanabileceği; yabancı olmanın tek başına dışlama sebebi yapılamayacağı", puan: 10, madde: "AY m. 16"}
      - {tespit: "Sınırlamanın yönetmelikle değil kanunla ve AY m. 13 şartlarıyla yapılabileceği", puan: 10, madde: "AY m. 13"}
    cozum: |
      **Nitelendirme:** Doğalgaz ve eğitim yardımı sosyal haktır. Vasak'a göre ikinci kuşak, Jellinek'e göre pozitif statü hakkıdır; devletin olumlu edimine dayanır ve sosyal hukuk devleti ilkesiyle (AY m. 2, AY m. 5) bağlantılıdır.

      **Hukuki sorunlar:** (1) AY m. 65 belediyeye dilediği gibi dağıtma yetkisi verir mi? (2) Oy kullanma şartı eşitlik ilkesiyle bağdaşır mı? (3) Engellilerin bütçe gerekçesiyle dışlanması hukuka uygun mu? (4) Layla'nın yabancı olması sonucu değiştirir mi?

      **İlgili hükümler:** AY m. 65'e göre devlet sosyal ve ekonomik görevlerini, amaçlarına uygun öncelikleri gözeterek malî kaynaklarının yeterliliği ölçüsünde yerine getirir. AY m. 10/1 herkesin kanun önünde eşit olduğunu söyler; AY m. 10/3 çocuklar, yaşlılar, özürlüler, harp ve vazife şehitlerinin dul ve yetimleri ile malul ve gaziler için alınacak tedbirlerin eşitlik ilkesine aykırı sayılmayacağını belirtir. AY m. 61 engellilerin ve yaşlıların korunmasına ilişkin tedbirleri devlete görev olarak verir. AY m. 16 yabancıların haklarının milletlerarası hukuka uygun olarak kanunla sınırlanabileceğini söyler. AY m. 13 sınırlamanın kanunla yapılmasını ve ölçülülük gibi şartları arar.

      **Değerlendirme:** AY m. 65 mali kaynak sınırı getirir; fakat bu sınır, bir yardımı ihdas ettikten sonra yararlanma koşullarını ayrımcı biçimde belirleme yetkisi vermez. Kaynak yetersizliği öncelik belirlemeyi haklı kılabilir; hangi ölçütle ayrım yapıldığını açıklamaz. Oy kullanmış olmak ile kış yardımına ihtiyaç duymak arasında nesnel ve makul bir bağ yoktur; bu şart AY m. 10'a aykırıdır. Engellilerin tümüyle dışlanması bakımından ise bütçe gerekçesi tek başına yeterli değildir: AY m. 10/3 ve AY m. 61 devleti dezavantajlı grupları korumaya yöneltir. Belediyenin öncelikleri belirleme imkânı vardır; ancak dışlamanın nesnel gerekçesini göstermesi gerekir. Layla bakımından AY m. 16 temel hakların yabancılar için sınırlanabileceğini kabul eder, ancak bu sınırlama kanunla ve milletlerarası hukuka uygun olmak zorundadır. Belediye yönetmeliği AY m. 13 anlamında kanun değildir; yabancı olma da ayrıca nesnel gerekçelendirilmedikçe dışlamayı doğrulamaz.

      **Sonuç:** Belediyenin AY m. 65 savunması yetersizdir. Oy kullanma şartı eşitlik ilkesine aykırıdır; engellilerin bütçe gerekçesiyle tümden dışlanması ise AY m. 10/3 ve AY m. 61 ışığında haklı gösterilemez. Layla'nın yabancılığı tek başına ret gerekçesi olamaz, çünkü sınırlama kanunla yapılmak zorundadır.
kartlar:
  - on: "AY m. 12/1'deki dört temel hak niteliği nedir?"
    arka: "Kişiliğe bağlı, dokunulmaz, devredilmez, vazgeçilmez. 'Sınırlanamaz' bu sayıda yoktur (AY m. 12/1, AY m. 13)."
  - on: "AY m. 12/2 ne söyler?"
    arka: "Temel hak ve hürriyetler, kişinin topluma, ailesine ve diğer kişilere karşı ödev ve sorumluluklarını da ihtiva eder."
  - on: "Vazgeçilmezliğin özel hukuktaki ifadesi hangi madde?"
    arka: "TMK m. 23: hak ve fiil ehliyetinden kısmen bile vazgeçilemez; özgürlüklerden vazgeçilemez, hukuka ya da ahlâka aykırı sınırlanamaz."
  - on: "Rıza ile feragat arasındaki fark nedir?"
    arka: "Belirli, somut ve geri alınabilir rıza mümkündür; hakkın kendisinden genel ve kesin feragat vazgeçilmezlik ilkesine aykırıdır."
  - on: "Jellinek'in üç statüsü ve Anayasadaki karşılığı?"
    arka: "Negatif: kişinin hakları (m. 17-40). Pozitif: sosyal ve ekonomik haklar (m. 41-65). Aktif: siyasi haklar (m. 66-74)."
  - on: "Vasak'ın üç kuşağı?"
    arka: "1. kuşak özgürlük (medeni ve siyasi haklar), 2. kuşak eşitlik (sosyal, ekonomik, kültürel haklar), 3. kuşak kardeşlik (çevre, barış, gelişme)."
  - on: "Siyasi haklar hangi kuşaktadır?"
    arka: "Vasak'a göre birinci kuşaktadır. Jellinek'te ise aktif statü hakkıdır."
  - on: "AY m. 65'in ölçütü nedir?"
    arka: "Devlet sosyal ve ekonomik görevlerini malî kaynaklarının yeterliliği ölçüsünde yerine getirir. Eşitlik ilkesi (AY m. 10) bundan etkilenmez."
  - on: "Konut dokunulmazlığı ile konut hakkı hangi bölümlerde?"
    arka: "Konut dokunulmazlığı (AY m. 21) kişinin haklarında; konut hakkı (AY m. 57) sosyal ve ekonomik haklarda."
  - on: "AY m. 15/2'ye göre olağanüstü hâlde dahi dokunulamayan haklar?"
    arka: "Yaşama hakkı ve maddi-manevi varlığın bütünlüğü (savaş hukukuna uygun ölümler hariç); din, vicdan, düşünce açıklamaya zorlanamama; suç ve cezaların geçmişe yürütülememesi; mahkeme kararına kadar suçlu sayılmama."
  - on: "Yabancıların temel hakları hakkında AY m. 16 ne der?"
    arka: "Temel hak ve hürriyetler yabancılar için milletlerarası hukuka uygun olarak kanunla sınırlanabilir."
  - on: "Devletin insan hakları karşısındaki üç yükümlülüğü nedir?"
    arka: "Saygı gösterme (karışmama), koruma (üçüncü kişilerin saldırısına karşı), yerine getirme (gerekli şartları sağlama, etkili soruşturma)."
