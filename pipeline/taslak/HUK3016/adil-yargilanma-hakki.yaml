ozet: |
  - **Dayanak:** AY m. 36/1 herkese iddia ve savunma ile **adil yargılanma** hakkı tanır. "Ile adil yargılanma" ibaresi 3/10/2001 tarihli 4709 sayılı Kanunla eklenmiştir. Hak, AY m. 37, AY m. 38/4-6, AY m. 138 ve AY m. 141 ile birlikte okunur; uluslararası karşılığı Sözleşme'nin 6. maddesidir.
  - **Kapsam:** Medeni hak ve yükümlülüklere ilişkin uyuşmazlıklar ile bir **suç isnadının** esası. Suç isnadı için üç **Engel ölçütü**: iç hukuktaki nitelendirme, fiilin niteliği, yaptırımın türü ve ağırlığı.
  - **Mahkeme:** Kanunla kurulmuş (AY m. 37, AY m. 142), **bağımsız ve tarafsız** (AY m. 9, AY m. 138) mahkeme. Tarafsızlık hem sübjektif (önyargı yok) hem objektif (makul gözlemcide şüphe uyandırmama) açıdan aranır.
  - **Mahkemeye erişim:** Dava açma, kanun yollarına başvurma ve kesinleşmiş kararın uygulanması; aşırı şekilcilik ve ölçüsüz sınırlamalar hakkı ihlal eder.
  - **Silahların eşitliği ve çelişmeli yargılama:** Taraflar arasında usuli denge; dosyadaki her belge ve görüşten haberdar olma ve cevap verme (HMK m. 27 hukuki dinlenilme).
  - **Aleniyet (AY m. 141/1):** Duruşmalar herkese açıktır; kapalı yapma yalnız **genel ahlak** veya **kamu güvenliğinin** kesin olarak gerektirdiği hâllerde. Kapalı duruşmada bile **hüküm kural olarak açık açıklanır** (CMK m. 182/3); istisna: 18 yaşını doldurmamış sanıkta duruşma kapalı yapılır ve hüküm de kapalı duruşmada açıklanır (CMK m. 185).
  - **Gerekçeli karar (AY m. 141/3)** ve **makul süre / en az giderle ve süratle sonuçlandırma (AY m. 141/4)**.
  - **Masumiyet karinesi (AY m. 38/4):** Suçluluğu hükmen sabit oluncaya kadar kimse suçlu sayılamaz; AY m. 15/2'ye göre olağanüstü hâllerde dahi dokunulamaz.
  - **Susma ve delil yasağı:** Kendini suçlayıcı beyana zorlanamama (AY m. 38/5); kanuna aykırı elde edilen bulgular delil olamaz (AY m. 38/6, CMK m. 206/2-a, HMK m. 189/2).
  - **Savunma hakkı:** Müdafi yardımı; alt sınırı beş yıldan fazla hapis gerektiren suçlarda istem aranmaksızın müdafi görevlendirilir (CMK m. 150/3).
  - **Makul süre için yol:** 📌 Makul sürede yargılanma iddiası için Tazminat Komisyonu yolu (6384 sayılı Kanun, 7499 sayılı Kanunla).
anlatim: |
  ## 1. Hakkın yeri ve kaynakları

  **Adil yargılanma hakkı**, bireyin haklarının yargı önünde gerçekten korunmasını sağlayan usuli güvencedir. Maddi hukuktaki bütün hakların etkinliği buna bağlıdır. AY m. 36/1'e göre herkes, meşru vasıta ve yollardan yararlanarak yargı mercileri önünde davacı veya davalı olarak iddia ve savunma ile **adil yargılanma** hakkına sahiptir. "Ile adil yargılanma" ibaresi 3/10/2001 tarihli 4709 sayılı Kanunla eklenmiştir. AY m. 36/2 de hiçbir mahkemenin görev ve yetkisi içindeki davaya bakmaktan kaçınamayacağını söyler.

  Hak tek bir maddeden ibaret değildir. Parçaları şu hükümlerde dağılmıştır:

  - **AY m. 36:** hak arama, iddia ve savunma, adil yargılanma,
  - **AY m. 37:** kanuni hâkim güvencesi,
  - **AY m. 38/4-6:** masumiyet karinesi, kendini suçlamama, hukuka aykırı delil yasağı,
  - **AY m. 9 ve AY m. 138:** bağımsız ve tarafsız mahkeme,
  - **AY m. 141:** aleniyet, gerekçeli karar, makul süre.

  Uluslararası düzeyde Sözleşme'nin 6. maddesi karşılığıdır. Sınırlandırma ölçütleri AY m. 13'e (kanunilik, ölçülülük, öze dokunmama) tabidir.

  > 💡 **Püf nokta:** AY m. 141 dört fıkradır ve her fıkra bir güvencedir: 1 aleniyet, 2 küçükler, 3 gerekçeli karar, 4 hız / makul süre.

  ## 2. Kapsam: hangi uyuşmazlıklar?

  Adil yargılanma güvenceleri iki alanda aranır.

  **a) Medeni hak ve yükümlülükler.** Kavram, iç hukuktaki adlandırmadan bağımsız, **özerk** yorumlanır. Özel hukuk davaları yanında kamulaştırma, imar, sosyal güvenlik ve benzeri idari uyuşmazlıklar da bu kapsamdadır. Buna karşılık salt vergi aslı uyuşmazlıkları, yabancıların ülkeye giriş, kalış ve sınır dışı işlemleri ile seçim ve siyasi haklar uyuşmazlıkları bu alan dışında tutulur.

  **b) Suç isnadı.** Bir yaptırımın "suç isnadı" sayılması için üç **Engel ölçütü** uygulanır:

  1. iç hukukta nasıl **nitelendirildiği**,
  2. ihlalin **niteliği** (herkese yönelik genel bir kural mı, caydırıcı veya cezalandırıcı amaç var mı),
  3. öngörülen yaptırımın **türü ve ağırlığı**.

  Ölçütler birlikte veya alternatif olarak değerlendirilir. Bu sayede iç hukukta "idari" adını taşıyan ağır yaptırımlar da suç isnadı güvencelerine kavuşur.

  > **Örnek:** Bir şirkete düzenleyici kurumca yüksek bir idari para cezası verilmiştir. İç hukukta ceza "idari" sayılsa da cezanın genel nitelikli bir kurala aykırılığa bağlanması ve ağırlığı nedeniyle Engel ölçütleri karşılanabilir; bu hâlde silahların eşitliği, susma ve masumiyet karinesi güvenceleri uygulanır.

  ## 3. Kurumsal güvenceler: kanuni, bağımsız ve tarafsız mahkeme

  **Kanuni hâkim.** AY m. 37/1: hiç kimse kanunen tabi olduğu mahkemeden başka bir merci önüne çıkarılamaz. AY m. 37/2: böyle bir sonuç doğuran yargı yetkisine sahip olağanüstü merciler kurulamaz. Mahkemelerin kuruluşu, görev ve yetkileri, işleyişi ve yargılama usulleri **kanunla** düzenlenir (AY m. 142/1). Mahkeme uyuşmazlıktan **önce** kanunla belirlenmiş olmalıdır.

  > **Örnek:** Bir olaydan sonra yalnız o olayı görmek üzere özel bir yargı kurulu oluşturulursa AY m. 37 ihlal edilir.

  **Bağımsızlık.** AY m. 9: yargı yetkisi Türk Milleti adına bağımsız ve tarafsız mahkemelerce kullanılır. AY m. 138/1: hâkimler görevlerinde bağımsızdır, Anayasa'ya, kanuna ve hukuka uygun vicdani kanaatlerine göre hüküm verirler. AY m. 138/2'ye göre hiçbir organ, makam, merci veya kişi yargı yetkisinin kullanılmasında mahkemelere ve hâkimlere emir ve talimat veremez, genelge gönderemez, tavsiye ve telkinde bulunamaz. AY m. 138/3 görülmekte olan bir dava hakkında Meclis'te yargı yetkisinin kullanılmasıyla ilgili soru sorulmasını, görüşme yapılmasını ve beyanda bulunulmasını yasaklar. AY m. 138/4 ise yasama ve yürütme organları ile idarenin mahkeme kararlarına uymak zorunda olduğunu, bunları değiştiremeyeceğini ve yerine getirilmesini geciktiremeyeceğini söyler. 📌 AY m. 9'a "ve tarafsız" ibaresi 21/1/2017 tarihli 6771 sayılı Kanunla eklenmiştir.

  Bağımsızlık denetiminde üyelerin atanma biçimi, görev süreleri ve azledilmezlik, dış baskılara karşı güvenceler ve bağımsız görünüm birlikte değerlendirilir.

  **Tarafsızlık** iki yönlüdür:

  - **Sübjektif tarafsızlık:** hâkimin kişisel önyargı taşımamasıdır; aksi kanıtlanana kadar karine olarak vardır.
  - **Objektif tarafsızlık:** kurumsal yapı veya hâkimin aynı davada daha önce üstlendiği görevler nedeniyle makul bir gözlemcide meşru şüphe doğmamasıdır.

  > ⚠️ **Sınavda dikkat:** Sübjektif tarafsızlıkta ispat yükü iddia edendedir ve zordur. Objektif tarafsızlıkta ise bir şüphenin **görünürde** haklı olması yeterlidir.

  ## 4. Mahkemeye erişim

  Mahkemeye erişim hakkı Sözleşme'nin 6. maddesinde açıkça yazılı değildir; Golder kararıyla bu maddenin ayrılmaz parçası sayılmıştır. Üç yönü vardır:

  - uyuşmazlığı **mahkeme önüne taşıyabilme**,
  - mahkemenin **esas hakkında karar verebilmesi**,
  - kesinleşmiş kararın **uygulanması**. Mahkeme kararlarının yerine getirilmemesi veya geciktirilmesi de hakkı ihlal eder; AY m. 138/4 bu yönün anayasal karşılığıdır.

  Hak mutlak değildir. Dava açma süreleri, harçlar, zorunlu arabuluculuk, kanun yolu sınırları gibi düzenlemeler meşru amaç izlediği ve **ölçülü** olduğu sürece kabul edilir. Hakkın özünü zedeleyen ağır harçlar veya usul kurallarının aşırı şekilci yorumu ihlal doğurur. Kanun yolu sürelerinin başlangıcı da bu açıdan önemlidir: AY m. 40/2'ye göre Devlet, işlemlerinde ilgili kişilerin hangi kanun yollarına ve mercilere başvuracağını ve sürelerini belirtmek zorundadır.

  > **Örnek:** Ali'nin hakkına ilişkin kararda "iki hafta içinde itiraz edilebilir" yazmıştır. Kanunda ise süre bir hafta ise, Ali'yi yanıltan bu açıklama karşısında başvurusunun salt süre aşımıyla reddi mahkemeye erişim ve AY m. 40/2 açısından sorun yaratır.

  ## 5. Silahların eşitliği, çelişmeli yargılama, hukuki dinlenilme

  **Silahların eşitliği**, tarafların hiçbirinin usul bakımından diğerine göre dezavantajlı konuma düşmemesi, herkese davasını makul koşullarda sunma imkânı tanınmasıdır. **Çelişmeli yargılama** ise tarafların dosyaya giren her belge, delil ve görüşten haberdar edilip bunlara karşı beyanda bulunabilmesidir. Biri denge, diğeri bilgi ve cevap hakkıdır; birlikte anılsalar da özdeş değildir.

  HMK m. 27/2 hukuki dinlenilme hakkını üç unsurla tanımlar: yargılama hakkında **bilgi sahibi olma**, **açıklama ve ispat hakkı**, mahkemenin açıklamaları dikkate alıp değerlendirmesi ve kararların **somut ve açık gerekçelendirilmesi**.

  > **Örnek:** Mahkeme, davalıya tebliğ etmediği bir bilirkişi raporuna dayanarak karar verirse davalı rapora karşı beyanda bulunamamıştır. Bu çelişmeli yargılama ve hukuki dinlenilme hakkının ihlalidir.

  İspat hakkı da sınırsız değildir. HMK m. 189/1'e göre taraflar kanunda belirtilen süre ve usule uygun olarak ispat hakkına sahiptir. Süresinde cevap dilekçesi vermeyen davalı, davacının dava dilekçesindeki vakıaların tamamını inkâr etmiş sayılır (HMK m. 128/1). Yargıtay Hukuk Genel Kurulunun bir kararında, süresinde cevap vermeyen davalının sonradan gösterdiği tanıkların dinlenmemesi, HMK'nın delil gösterilmesini dilekçeler aşamasına bağlayan sistemiyle ve usul ekonomisi ile makul sürede yargılanma ilkesiyle bağdaşan bir sonuç sayılmıştır.

  ## 6. Aleniyet

  AY m. 141/1: mahkemelerde duruşmalar herkese açıktır. Duruşmaların bir kısmının veya tamamının kapalı yapılmasına **ancak genel ahlakın veya kamu güvenliğinin kesin olarak gerekli kıldığı hâllerde** karar verilebilir. Küçüklerin yargılanması için kanunla özel hükümler konulur (AY m. 141/2). CMK m. 182/1-2 aynı çerçeveyi kurar. CMK m. 182/3 ayrıca kapalı yapma kararının gerekçeli verilmesini ve **hükmün açık duruşmada açıklanmasını** zorunlu kılar. Küçüklere ilişkin özel hüküm ise CMK m. 185'tir: sanık 18 yaşını doldurmamışsa duruşma kapalı yapılır ve hüküm de kapalı duruşmada açıklanır.

  > ⚠️ **Sınavda dikkat:** Sözleşme'nin 6. maddesinin 1. fıkrası kapalı yargılama sebeplerini daha geniş sayar (ör. ulusal güvenlik, tarafların özel hayatı). AY m. 141/1 ise yalnız genel ahlak ve kamu güvenliğini sayar. "Kamu düzeni" gerekçesi AY m. 141/1'in metninde yoktur. Genel ahlak veya kamu güvenliği nedeniyle kapalı yapılan duruşmada bile hüküm gizli açıklanamaz; tek istisna 18 yaşını doldurmamış sanıktır (CMK m. 185).

  ## 7. Gerekçeli karar ve makul süre

  **Gerekçeli karar.** AY m. 141/3: bütün mahkemelerin her türlü kararları gerekçeli yazılır. Gerekçenin tatmin edici olması için davanın sonucuna etkili esaslı iddia, savunma ve itirazlara makul bir yanıt verilmelidir. Mahkeme her argümana ayrıntılı cevap vermek zorunda değildir; ama sonucu doğrudan belirleyecek bir savunmayı hiç anmamak, kalıp ifadelerle geçiştirmek veya çelişkili gerekçe kurmak hakkı ihlal eder (HMK m. 27/2-c).

  **Makul süre.** AY m. 141/4: davaların en az giderle ve mümkün olan süratle sonuçlandırılması yargının görevidir. HMK m. 30 da hâkime yargılamayı makul süre içinde ve düzenli yürütme görevi yükler. Makul süre, hukuk ve idari davalarda davanın açılmasıyla, ceza davalarında kişiye suç isnadının bildirilmesi veya durumunu etkileyen bir işlemle başlar; kanun yolu ve icra aşaması dâhil uyuşmazlığın kesin olarak sonuçlandığı tarihte biter. Süre dört ölçütle değerlendirilir:

  1. davanın **karmaşıklığı**,
  2. **başvurucunun tutumu** (ertelemeler, gecikme yaratan davranışlar),
  3. **yargı ve idare makamlarının tutumu**,
  4. davanın başvurucu için taşıdığı **önem**.

  📌 6384 sayılı Kanun m. 2/3-a, 7499 sayılı Kanunla (2/3/2024) eklenmiştir: Ceza, özel hukuk ve idare hukuku kapsamındaki yargılamaların makul sürede sonuçlandırılmadığı iddiasıyla **manevi tazminat** için Tazminat Komisyonuna müracaat edilebilir. Kanunun 5/A maddesine göre müracaat, yargılama sürecinde ya da en geç bunların kesin bir kararla sonuçlandığının öğrenilmesinden itibaren bir ay içinde yapılır.

  ## 8. Masumiyet karinesi ve suç isnadına özgü güvenceler

  **Masumiyet karinesi.** AY m. 38/4: suçluluğu hükmen sabit oluncaya kadar kimse suçlu sayılamaz. AY m. 15/2'ye göre savaş, seferberlik ve olağanüstü hâllerde dahi suçluluğu mahkeme kararı ile saptanıncaya kadar kimse suçlu sayılamaz; yani bu güvence **çekirdek haktır**. İki boyutu vardır:

  - **Usuli boyut:** ispat yükü iddia makamındadır; makul şüphe sanık lehine yorumlanır (*in dubio pro reo*); yargılama sürerken kamu makamları kişiyi suçlu ilan edemez.
  - **Yargılama sonrası boyut:** beraat veya düşme kararından sonra, kişinin ceza hukuku anlamında suçlu olduğunu ima eden ifadelerin kullanılmaması beklenir.

  **Kendini suçlamama.** AY m. 38/5: hiç kimse kendisini ve kanunda gösterilen yakınlarını suçlayan bir beyanda bulunmaya veya bu yolda delil göstermeye zorlanamaz.

  **Hukuka aykırı delil.** AY m. 38/6: kanuna aykırı olarak elde edilmiş bulgular delil olarak kabul edilemez. Bu hüküm de 4709 sayılı Kanunla Anayasa'ya girmiştir. Uygulama: CMK m. 206/2-a, kanuna aykırı elde edilen delilin ortaya konulmasını reddeder; HMK m. 189/2 hukuka aykırı delillerin mahkemece dikkate alınamayacağını söyler. CMK m. 217/2'ye göre ise yüklenen suç hukuka uygun biçimde elde edilmiş her türlü delille ispat edilebilir.

  > **Örnek:** Polis, arama kararı veya yasal bir gerekçe olmaksızın Ayşe'nin evinde arama yapıp bir belge bulmuştur. Mahkeme belgeyi "serbestçe takdir edilen delil" sayarak mahkûmiyete dayanak yapamaz; AY m. 38/6 ve CMK m. 206/2-a nedeniyle belge delil olarak kabul edilmez.

  **Savunma hakları.** Sözleşme'nin 6. maddesinin 3. fıkrası asgari güvenceleri sayar: isnadı anladığı dilde öğrenme, savunma için yeterli zaman ve kolaylık, müdafi yardımı ve gerekirse adli yardım, tanıkları sorgulama ve dinletme, ücretsiz tercüman. Müdafiin gözaltında bile erişilebilir olması gerektiği Salduz kararıyla vurgulanmıştır.

  Türk hukukunda CMK m. 150/3: **alt sınırı beş yıldan fazla hapis cezasını gerektiren suçlardan dolayı** yapılan soruşturma ve kovuşturmada, müdafii bulunmayan şüpheli veya sanığa **istemi aranmaksızın** müdafi görevlendirilir (CMK m. 150/2 hükmü uygulanır).

  > ⚠️ **Sınavda dikkat:** Sanık "avukat istemiyorum" dese bile alt sınırı beş yıldan fazla hapis gerektiren suçlarda müdafi atanır. Çocuk veya kendini savunamayacak durumdaki kişiler için de istem aranmaz (CMK m. 150/2).

  ## 9. Sık karıştırılan noktalar

  | Ayrım | Kural |
  |---|---|
  | Silahların eşitliği / çelişmeli yargılama | Biri denge, diğeri bilgi ve cevap hakkı |
  | AY m. 141/1 / Sözleşme'nin 6. maddesi | AY'da iki sebep; Sözleşme'de daha geniş liste |
  | Kapalı duruşma / hüküm | Hüküm açık açıklanır; 18 yaş altı sanık hariç (CMK m. 185) |
  | Vergi aslı / vergi cezası | Aslı kapsam dışı; ceza niteliğindeki yaptırım suç isnadı olabilir |
  | AY m. 15/2 / AY m. 38/4 | İkincisinin metni "hükmen sabit", birincisinin "mahkeme kararı ile saptanıncaya" |

  ## 10. Denetim şeması

  1. Uyuşmazlık **medeni hak ve yükümlülük** mü, **suç isnadı** mı? (Engel ölçütleri)
  2. **Mahkeme** kanunla kurulmuş, bağımsız ve tarafsız mı? (AY m. 37, AY m. 9, AY m. 138)
  3. **Erişim** engellenmiş veya aşırı güçleştirilmiş mi?
  4. **Silahların eşitliği ve çelişmeli yargılama** sağlanmış mı?
  5. **Aleniyet** (AY m. 141/1, CMK m. 182) ve **gerekçeli karar** (AY m. 141/3) var mı?
  6. **Makul süre** aşıldı mı? (dört ölçüt, AY m. 141/4)
  7. Suç isnadında **masumiyet karinesi, susma hakkı, delil yasağı ve savunma hakları**
  8. Olayın bütününe bakıp AY m. 36/1 bakımından sonuç.
kritik: |
  - 📌 AY m. 36/1'deki "ile adil yargılanma" ibaresi 3/10/2001 tarihli **4709 sayılı Kanunla** eklenmiştir; AY m. 38/6 (hukuka aykırı delil) de aynı Kanunla girmiştir.
  - 📌 AY m. 141 dört fıkra: aleniyet (1), küçükler (2), **gerekçeli karar (3)**, **hız ve makul süre (4)**.
  - ⚠️ AY m. 141/1: kapalı duruşma yalnız **genel ahlak** veya **kamu güvenliği**. Sözleşme'nin 6. maddesi daha geniş sebep sayar; ikisi karıştırılmamalı.
  - 📌 Kapalı duruşma yapılsa da **hüküm açık** duruşmada açıklanır (CMK m. 182/3). İstisna: sanık 18 yaşını doldurmamışsa hüküm de kapalı duruşmada açıklanır (CMK m. 185).
  - 📌 **Engel ölçütleri (3):** iç hukuk nitelendirmesi, fiilin niteliği, yaptırımın türü ve ağırlığı.
  - 📌 **Makul süre ölçütleri (4):** karmaşıklık, başvurucunun tutumu, makamların tutumu, davanın başvurucu için önemi.
  - ⚠️ **Silahların eşitliği** (usuli denge) ile **çelişmeli yargılama** (bilgi ve cevap hakkı) özdeş değildir.
  - 📌 Masumiyet karinesi: AY m. 38/4; AY m. 15/2 uyarınca **olağanüstü hâlde dahi** dokunulamaz.
  - 📌 Kendini suçlamama: AY m. 38/5. Hukuka aykırı delil: AY m. 38/6, CMK m. 206/2-a, HMK m. 189/2.
  - 📌 CMK m. 150/3: alt sınırı **beş yıldan fazla** hapis gerektiren suçlarda istem aranmaksızın müdafi.
  - ⚠️ Sübjektif tarafsızlık **karine**; objektif tarafsızlıkta görünürde şüphe yeterli.
  - 📌 AY m. 138/2: mahkeme ve hâkimlere emir, talimat, genelge, tavsiye ve telkin yasak; AY m. 138/4: kararlara uyma ve yerine getirmeyi geciktirmeme.
  - 📌 Makul sürede yargılanma iddiasıyla Tazminat Komisyonuna müracaat süresi: yargılama sürerken veya kesin sonucun öğrenilmesinden itibaren **1 ay** (6384 sayılı Kanunun 5/A maddesi).
doktrin: |
  ### Hukuka aykırı delilin sınırları
  AY m. 38/6 kanuna aykırı elde edilen bulguların delil olamayacağını mutlak ifadeyle söyler. Uygulamada tartışma, **özel kişilerin** elde ettiği kayıtlar ve dolaylı deliller konusunda yoğunlaşır. Bir görüşe göre planlı ve sistematik gizli kayıtlar kesin biçimde reddedilmelidir. Başka bir görüşe göre kişinin kendisine yönelik işlenen bir suçu başka türlü kanıtlayamayacağı ani durumlarda alınan kayıtlar hukuka uygun sayılabilir. Hukuka aykırı delilden ulaşılan dolaylı delillerin de yasak kapsamına girip girmediği ("zehirli ağacın meyvesi") ayrı bir tartışmadır; çoğunluk yaklaşımı bunları da dışarıda bırakma yönündedir.

  ### Anayasanın ve Sözleşme'nin yaklaşımı
  Sözleşme sistemi, ulusal hukuka aykırı bir delilin kullanılması hâlinde yargılamanın bütününün adil olup olmadığına bakar; istisna olarak kötü muamele ile elde edilen deliller doğrudan sorun yaratır. AY m. 38/6 ise ulusal düzeyde daha katı bir standart kurar. Bu fark, iç hukukta Anayasa hükmünün önceliği nedeniyle önem taşır.

  ### Derece mahkemesi olmama ve bariz keyfîlik
  Anayasa Mahkemesi delillerin değerlendirilmesinde ve kanun yorumunda derece mahkemelerinin yerine geçmez. Müdahale, derece mahkemesi yorumunun **bariz bir takdir hatası veya açık bir keyfîlik** içermesi hâlinde söz konusu olur. Bu yaklaşım adil yargılanma iddialarında kabul edilebilirlik ve esas incelemesinin ölçüsünü belirler.

  ### Zorunlu müdafilikte artırım maddeleri
  CMK m. 150/3'ün "alt sınırı beş yıldan fazla" ölçütünde, temel cezanın mı yoksa artırım hükümleri uygulandıktan sonraki cezanın mı esas alınacağı Yargıtay uygulamasında zaman içinde değişmiş ve kurul içinde farklı görüşler bulunmuştur. Bu nedenle olay çözümlerinde, hem temel ceza hem artırılmış ceza bakımından alt sınırın beş yılı aştığı sade örneklerle çalışmak daha güvenlidir.
sozluk:
  - terim: Adil yargılanma hakkı
    tanim: "Bağımsız ve tarafsız mahkemede, makul sürede, hakkaniyete uygun ve gerekçeli karara bağlanan yargılama güvencesi (AY m. 36/1)."
  - terim: Medeni hak ve yükümlülük
    tanim: "Sözleşme'nin 6. maddesi bakımından özerk yorumlanan, iç hukukta savunulabilir bir hakka ilişkin ve sonucu doğrudan belirleyici uyuşmazlık."
  - terim: Suç isnadı
    tanim: "Engel ölçütleriyle belirlenen, kişi hakkında ceza niteliği taşıyan bir suçlamanın varlığı."
  - terim: Kanuni hâkim güvencesi
    tanim: "Kimsenin kanunen tabi olduğu mahkemeden başka bir merci önüne çıkarılamaması (AY m. 37)."
  - terim: Objektif tarafsızlık
    tanim: "Hâkimin davadaki görevi veya yapısal nedenlerle makul bir gözlemcide meşru şüphe uyandırmaması."
  - terim: Silahların eşitliği
    tanim: "Tarafların usul bakımından birbirine göre dezavantajlı konuma düşmemesi ilkesi."
  - terim: Çelişmeli yargılama
    tanim: "Tarafların dosyadaki tüm belge ve görüşlerden haberdar edilip bunlara cevap verebilmesi."
  - terim: Hukuki dinlenilme hakkı
    tanim: "Bilgi sahibi olma, açıklama ve ispat hakkı ile kararın gerekçelendirilmesini içeren hak (HMK m. 27)."
  - terim: Aleniyet
    tanim: "Duruşmaların herkese açık yapılması; kapalı yapma yalnız genel ahlak veya kamu güvenliğinin kesin gerekliliği hâlinde mümkündür (AY m. 141/1), küçükler için kanunla özel hüküm konulabilir (AY m. 141/2)."
  - terim: Masumiyet karinesi
    tanim: "Suçluluğu hükmen sabit oluncaya kadar kimsenin suçlu sayılamaması (AY m. 38/4)."
  - terim: Hukuka aykırı delil
    tanim: "Kanuna aykırı yolla elde edilen ve delil olarak kabul edilemeyen bulgu (AY m. 38/6)."
  - terim: Zorunlu müdafilik
    tanim: "Şüpheli veya sanığın istemi aranmaksızın müdafi görevlendirilmesi (CMK m. 150/2-3)."
kararlar:
  - id: "1227370300"
    ozet: |
      Sanık hakkında üç veya daha fazla kişiyle birlikte nitelikli dolandırıcılık suçundan İstanbul Anadolu 2. Ağır Ceza Mahkemesi 9 yıl hapis cezası vermiş, istinaf ve temyiz başvuruları reddedilmiştir. Kovuşturmada sanığa TCK'nın 158. maddesinin üçüncü fıkrasının uygulanma ihtimali nedeniyle ek savunma hakkı tanınmış ve müdafi istemediğini söylemiş; mahkeme müdafi görevlendirmemiştir. Yargıtay Cumhuriyet Başsavcılığı itiraz etmiş, itiraz Ceza Genel Kuruluna gelmiştir. Kurul, savunmanın Anayasa'nın 36. maddesiyle güvence altına alınan meşru bir yol, müdafiin de savunmanın meşru aracı olduğunu belirtmiş; TCK'nın 158. maddesinin birinci fıkrasında bu hâl için öngörülen dört yıllık alt sınır, üçüncü fıkra uyarınca zorunlu olarak yarı oranında artırıldığında beş yılı aştığından CMK'nın 150. maddesinin üçüncü fıkrası uyarınca zorunlu müdafi atanması gerektiği sonucuna varmıştır. Hükmü savunma hakkının kısıtlanması nedeniyle oy çokluğuyla bozmuştur. Bir üye ayrıntılı karşı oy yazısında Kurulun 2016 ve 2020 tarihli kararlarına dayanarak yalnız temel cezanın esas alınması gerektiğini savunmuş; altı üye de itirazın reddi gerektiği düşüncesiyle karşı oy kullanmıştır. Kurulun 2021'de içtihat değiştirdiği bu artırım değerlendirmesi bu yüzden tartışmalı bir içtihat alanıdır.
  - id: "646348900"
    ozet: |
      Boşanma davasında dava dilekçesi davalı eşe 16.10.2012'de tebliğ edilmiş, davalı iki haftalık süre içinde cevap vermemiş, 05.11.2012'de verdiği cevap dilekçesinde tanık delili göstermiştir. İzmir 2. Aile Mahkemesi süresinde bildirilmeyen tanıkları dinlemeyerek boşanmaya karar vermiş, Yargıtay 2. Hukuk Dairesi kararı bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu, HMK'nın delil gösterilmesini dilekçelerin teatisi aşamasına bağlayan sistemini ve usul ekonomisini (makul sürede yargılanma) gözeterek, süresinde cevap vermeyen davalının sonradan bildirdiği tanıkların karşı ispat bağlamında da dinlenemeyeceği sonucuna varmış ve direnme kararını oy birliğiyle uygun bulmuştur. Dosya esasa ilişkin diğer temyiz itirazları için Özel Daireye gönderilmiştir. Karar, ispat hakkının kanundaki süre ve usule uygun kullanılması gerektiğini gösterir.
sorular:
  - soru: |
      AY m. 36/1'e "ile adil yargılanma" ibaresi hangi değişiklikle eklenmiştir?
    siklar:
      - "3/10/2001 tarihli 4709 sayılı Kanun"
      - "7/5/2004 tarihli 5170 sayılı Kanun"
      - "21/1/2017 tarihli 6771 sayılı Kanun"
      - "2/3/2024 tarihli 7499 sayılı Kanun"
    dogru: 0
    aciklama: |
      AY m. 36/1'e "ile adil yargılanma" ibaresi 3/10/2001 tarihli 4709 sayılı Kanunun 14. maddesiyle eklenmiştir. 5170 sayılı Kanun ölüm cezasına ilişkin değişiklikleri; 6771 sayılı Kanun AY m. 9'a "ve tarafsız" ibaresini eklemiştir; 7499 sayılı Kanun ise Tazminat Komisyonuna ilişkindir.
  - soru: |
      AY m. 141/1'e göre duruşmaların kapalı yapılmasına aşağıdaki sebeplerden hangisi dayanak olabilir?
    siklar:
      - "Ulusal güvenlik"
      - "Tarafların özel hayatının korunması"
      - "Kamu düzeni"
      - "Kamu güvenliğinin kesin olarak gerekli kılması"
    dogru: 3
    aciklama: |
      AY m. 141/1 duruşmaların kapalı yapılmasına ancak genel ahlakın veya kamu güvenliğinin kesin olarak gerekli kıldığı hâllerde karar verilebileceğini söyler. Ulusal güvenlik, kamu düzeni ve tarafların özel hayatı Anayasa'nın metninde yer almaz; Sözleşme'nin 6. maddesi ise daha geniş bir liste öngörür.
  - soru: |
      Genel ahlak gerekçesiyle kapalı yapılan bir ceza duruşmasında yetişkin sanığın mahkûmiyetine karar verilmiştir. CMK m. 182/3'e göre hüküm nasıl açıklanır?
    siklar:
      - "Hüküm de kapalı duruşmada açıklanır."
      - "Hüküm yalnız sanığa ve müdafiine yazılı tebliğ edilir."
      - "Hüküm açık duruşmada açıklanır."
      - "Hüküm, kapalı duruşmanın gerekçesi ortadan kalkıncaya kadar açıklanmaz."
    dogru: 2
    aciklama: |
      CMK m. 182/3: duruşmanın kapalı yapılması konusundaki gerekçeli karar ile hüküm açık duruşmada açıklanır. Kapalı yargılama hükmün gizli açıklanması sonucunu doğurmaz.
  - soru: |
      AY m. 15/2'ye göre olağanüstü hâllerde dahi dokunulamayacak güvencelerden biri aşağıdakilerden hangisidir?
    siklar:
      - "Duruşmaların herkese açık yapılması"
      - "Suçluluğu mahkeme kararı ile saptanıncaya kadar kimsenin suçlu sayılmaması"
      - "Kararların gerekçeli yazılması"
      - "Davaların en az giderle ve süratle sonuçlandırılması"
    dogru: 1
    aciklama: |
      AY m. 15/2 olağanüstü hâllerde dahi suç ve cezaların geçmişe yürütülememesini ve suçluluğu mahkeme kararı ile saptanıncaya kadar kimsenin suçlu sayılamamasını (masumiyet karinesi) çekirdek güvence olarak korur. Aleniyet, gerekçeli karar ve hız AY m. 141'dedir ve AY m. 15/2'nin sayımında yer almaz.
  - soru: |
      Polis, ortada hâkim kararı, yazılı arama emri ya da başka bir yasal gerekçe bulunmadığı hâlde Ayşe'nin evinde arama yaparak bir belge ele geçirmiş, savcılık bu belgeyi iddianameye delil olarak eklemiştir. Mahkeme belge karşısında ne yapmalıdır?
    siklar:
      - "Belgeyi delil olarak serbestçe takdir ederek mahkûmiyete dayanak yapabilir."
      - "Belgeyi yalnızca sanık kabul ederse kullanabilir."
      - "Belge kanuna aykırı elde edildiği için delil olarak kabul edemez ve ortaya konulmasını reddeder."
      - "Belgeyi kullanabilir; yalnızca polisler hakkında soruşturma açılır."
    dogru: 2
    aciklama: |
      AY m. 38/6'ya göre kanuna aykırı elde edilmiş bulgular delil olarak kabul edilemez. CMK m. 206/2-a de kanuna aykırı elde edilen delilin reddini öngörür. CMK m. 217 hâkimin deliller üzerindeki takdir yetkisi hukuka uygun elde edilen deliller içindir.
  - soru: |
      Hukuk mahkemesi, tarafların birine tebliğ etmediği bir bilirkişi raporuna dayanarak davayı karara bağlamış, rapora karşı beyanda bulunma imkânı verilmeyen taraf kanun yoluna başvurmuştur. Hangi güvence bu olayda doğrudan ihlal edilmiştir?
    siklar:
      - "Kanuni hâkim güvencesi"
      - "Aleniyet ilkesi"
      - "Masumiyet karinesi"
      - "Çelişmeli yargılama ve hukuki dinlenilme hakkı"
    dogru: 3
    aciklama: |
      Taraf dosyadaki belgeden haberdar edilmemiş ve ona karşı açıklama yapma imkânı tanınmamıştır. Bu, HMK m. 27/2'deki bilgi sahibi olma ile açıklama ve ispat hakkını ve AY m. 36/1'deki adil yargılanma hakkını ilgilendirir. Kanuni hâkim, aleniyet ve masumiyet karinesi bu olayın konusu değildir.
  - soru: |
      Aşağıdakilerden hangisi bir yaptırımın "suç isnadı" sayılıp sayılmadığını belirleyen Engel ölçütlerinden biri değildir?
    siklar:
      - "İç hukukta yaptırımın nasıl nitelendirildiği"
      - "İhlalin (fiilin) niteliği"
      - "Yaptırımın türü ve ağırlığı"
      - "Yaptırımı uygulayan kurumun bütçesi"
    dogru: 3
    aciklama: |
      Engel ölçütleri iç hukuktaki nitelendirme, fiilin niteliği ve yaptırımın türü ile ağırlığıdır. Yaptırımı uygulayan kurumun bütçesi ölçüt değildir.
  - soru: |
      Aşağıdakilerden hangisi makul süre değerlendirmesinde kullanılan ölçütlerden biri **değildir**?
    siklar:
      - "Davanın karmaşıklığı"
      - "Başvurucunun tutumu"
      - "Yargı ve idare makamlarının tutumu"
      - "Karşı tarafın mali gücü"
    dogru: 3
    aciklama: |
      Dört ölçüt davanın karmaşıklığı, başvurucunun tutumu, yargı ve idare makamlarının tutumu ve davanın başvurucu için taşıdığı önemdir. Karşı tarafın mali gücü ölçüt değildir.
  - soru: |
      Kanunda hapis cezasının alt sınırı 6 yıl olan bir suçtan yargılanan Deniz, duruşmada "avukat istemiyorum, kendimi savunurum" demiştir. CMK m. 150'ye göre mahkeme ne yapmalıdır?
    siklar:
      - "Deniz'in beyanı bağlayıcıdır; müdafi atanmaz."
      - "Müdafi yalnızca Deniz tutuklu ise atanır."
      - "Yalnızca temyiz aşamasında müdafi atanır."
      - "Alt sınırı beş yıldan fazla hapis gerektiren suç olduğundan istem aranmaksızın müdafi görevlendirir."
    dogru: 3
    aciklama: |
      CMK m. 150/3: alt sınırı beş yıldan fazla hapis cezasını gerektiren suçlardan dolayı yapılan soruşturma ve kovuşturmada ikinci fıkra hükmü uygulanır, yani istem aranmaksızın müdafi görevlendirilir. Alt sınırı 6 yıl olan suçta sanığın istememesi sonucu değiştirmez.
  - soru: |
      Bir olaydan sonra yalnızca o olayı yargılamak üzere özel bir yargı kurulu oluşturulmuştur. Bu uygulama hangi anayasal güvenceyle bağdaşmaz?
    siklar:
      - "AY m. 37'deki kanuni hâkim güvencesi"
      - "AY m. 38/5'teki kendini suçlamama yasağı"
      - "AY m. 141/2'deki küçüklerin yargılanması"
      - "AY m. 141/4'teki en az giderle sonuçlandırma"
    dogru: 0
    aciklama: |
      AY m. 37/1 kimsenin kanunen tabi olduğu mahkemeden başka bir merci önüne çıkarılamayacağını, AY m. 37/2 ise böyle bir sonuç doğuran olağanüstü mercilerin kurulamayacağını söyler. Mahkemenin uyuşmazlıktan önce kanunla belirlenmiş olması gerekir.
  - soru: |
      Bir bakan, görülmekte olan bir davayı gören hâkime telefonla "bu davayı şu yönde karara bağla" tavsiyesinde bulunmuştur. Bu davranış hangi anayasal güvenceyi doğrudan ihlal eder?
    siklar:
      - "Mahkemelerin bağımsızlığı (AY m. 138/2)"
      - "Masumiyet karinesi (AY m. 38/4)"
      - "Aleniyet ilkesi (AY m. 141/1)"
      - "Gerekçeli karar hakkı (AY m. 141/3)"
    dogru: 0
    aciklama: |
      AY m. 138/2'ye göre hiçbir organ, makam, merci veya kişi yargı yetkisinin kullanılmasında mahkemelere ve hâkimlere emir ve talimat veremez, genelge gönderemez, tavsiye ve telkinde bulunamaz.
  - soru: |
      Mahkeme, sanığın savunmasının özünü oluşturan ve sonuca etkili olan alibi iddiasına karar gerekçesinde hiç değinmemiş, yalnızca "dosya kapsamına göre" demiştir. Hangi hak ihlal edilmiştir?
    siklar:
      - "Gerekçeli karar hakkı"
      - "Aleniyet hakkı"
      - "Kanuni hâkim güvencesi"
      - "Masumiyet karinesi"
    dogru: 0
    aciklama: |
      AY m. 141/3 bütün kararların gerekçeli yazılmasını; CMK m. 34/1 de hâkim ve mahkemelerin her türlü kararının gerekçeli yazılmasını, CMK m. 230/1 ise mahkûmiyet hükmünün gerekçesinde savunmada ileri sürülen görüşlerin ve delillerin tartışılmasının gösterilmesini gerektirir. Davanın sonucuna etkili esaslı bir savunmaya hiç değinilmemesi gerekçeli karar hakkını ihlal eder.
olaylar:
  - olay: |
      Deniz (30), kanunda alt sınırı altı yıl hapis olan bir suçtan yargılanmaktadır. Duruşmada Deniz, "avukat istemiyorum" demiş, mahkeme müdafi görevlendirmeden yargılamayı sürdürmüştür. Mahkeme, "kamu düzeninin korunması" gerekçesiyle duruşmanın tamamını kapalı yapmış ve hükmü de kapalı duruşmada açıklamıştır. Savcılık, polisin arama kararı ve yasal gerekçe olmaksızın Deniz'in iş yerinde yaptığı arama sırasında ele geçirdiği bir defteri delil olarak sunmuş, mahkeme bu defteri mahkûmiyete dayanak yapmıştır. Deniz, olay günü başka bir şehirde olduğunu belgeleyen otel kayıtlarını ve tanıklarını sunmuş ancak karar gerekçesinde bu savunmaya hiç değinilmemiş, yalnızca "dosya kapsamı" ifadesi kullanılmıştır. Deniz kanun yolunda hak ihlali iddialarını ileri sürmektedir.
      1. Müdafi yönünden yargılama hukuka uygun mudur?
      2. Duruşmanın kapalı yapılması ve hükmün kapalı açıklanması hukuka uygun mudur?
      3. Defterin delil olarak kullanılması hukuka uygun mudur?
      4. Gerekçesiz bırakılan savunma yönünden hangi hak ihlal edilmiştir?
