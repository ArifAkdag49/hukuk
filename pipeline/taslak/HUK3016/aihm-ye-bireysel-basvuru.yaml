    tanim: "AİHM'ye gitmeden önce olağan, erişilebilir ve etkili iç hukuk yollarının denenmesi (Türkiye'de AYM dâhil)."
  - terim: Dört aylık kural
    tanim: "İç hukuktaki nihai karardan itibaren AİHM'ye başvuru süresi."
  - terim: Önemli zarar
    tanim: "Başvurucunun önemli bir zarara uğramaması hâlinde başvurunun kabul edilemez bulunmasına yol açan ölçüt."
  - terim: Dostane çözüm
    tanim: "Taraflar arasında AİHM önünde varılan uzlaşma; sonucunda başvuru kayıttan düşer."
  - terim: Tek taraflı deklarasyon
    tanim: "Hükümetin ihlali tanıyıp giderim önerdiği, sonucunda AİHM'nin kayıttan düşürme kararı verebildiği beyan."
  - terim: Geçici tedbir
    tanim: "Geri dönülmez zarar riskinde AİHM İçtüzüğü'nün 39. maddesine göre verilen bağlayıcı acil karar."
kararlar:
  - id: "1196614200"
    ozet: |
      Tapu iptali ve tescil davasında ilk derece mahkemesinin ret kararı, Yargıtay denetiminden geçerek kesinleşmiştir. Davacıların bireysel başvurusu üzerine Anayasa Mahkemesi mülkiyet hakkının ihlal edildiğini tespit etmiş ve dosyayı ihlalin sonuçlarını ortadan kaldırmak üzere yeniden yargılama için ilk derece mahkemesine göndermiştir. Yeniden yargılamada davanın kısmen kabulüne karar verilmiş, Yargıtay özel dairesi bu kararı bozmuş, bölge adliye mahkemesi direnmiştir. Hukuk Genel Kurulu çoğunlukla direnme kararını bozmuştur. Karar metninde aktarılan gerekçeye göre, AYM ihlal kararı sonrasındaki yeniden yargılamanın dayanağı 6216 sayılı Kanun m. 50'dir; HMK m. 375/1-i bendi ise yalnız AİHM kararlarını ve dostane çözüm ile tek taraflı deklarasyon sonucu düşme kararlarını sayar, AYM kararlarını saymaz. Karar, ihlal kararı üzerine yapılan yeniden yargılama ile klasik yargılamanın iadesi arasındaki ayrımı göstermesi bakımından öğreticidir.
sorular:
  - soru: |
      AİHM'ye bireysel başvuru süresi, 15 No.lu Protokol'ün yürürlüğe girmesinin ardından kaç aydır?
    siklar:
      - "2 ay"
      - "3 ay"
      - "4 ay"
      - "6 ay"
    dogru: 2
    aciklama: |
      Sözleşme'nin 35. maddesinin birinci fıkrası, 15 No.lu Protokol'le değiştirilmiş hâliyle başvuruyu iç hukuktaki nihai karardan itibaren 4 ay içinde yapılmasını arar; bu süre 1 Şubat 2022'den itibaren uygulanır. Eski süre 6 aydı; bu seçenek yaygın bir yanılgıdır.
  - soru: |
      X Belediyesi, kamulaştırma nedeniyle mülkiyet hakkının ihlal edildiğini ileri sürerek AİHM'ye başvurmuştur. Başvurunun durumu nedir?
    siklar:
      - "Belediye tüzel kişi olduğu için her koşulda başvurabilir."
      - "Belediye kamu tüzel kişisi olduğundan hükümet dışı kuruluş sayılmaz ve başvuru kabul edilemez."
      - "Başvuru ancak belediye meclisi karar verirse kabul edilir."
      - "Belediye başkanı kişisel olarak imza atarsa belediye adına da başvuru kabul edilir."
    dogru: 1
    aciklama: |
      Sözleşme'nin 34. maddesi başvuruyu gerçek kişi, hükümet dışı kuruluş ve kişi grubuna tanır. Kamu gücü ayrıcalıkları kullanan kamu tüzel kişileri, örneğin belediyeler, hükümet dışı kuruluş sayılmaz. Yetki veya vekâlet de bu sonucu değiştirmez.
  - soru: |
      Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Tek Yargıç, adına seçildiği devlete karşı yapılan başvurularda da karar verebilir."
      - "Komite 7 yargıçtan oluşur."
      - "Büyük Daire 17 yargıçtan oluşur."
      - "Daire 3 yargıçtan oluşur."
    dogru: 2
    aciklama: |
      Tek Yargıç 1, Komite 3, Daire 7, Büyük Daire 17 yargıçtan oluşur. Adına seçilen yargıç, o devlete karşı başvuruda Tek Yargıç olarak görev yapamaz (Sözleşme'nin 26. maddesinin üçüncü fıkrası).
  - soru: |
      Daire kararından sonra tarafların Büyük Daireye gönderme talebini ne zamana kadar yapması gerekir?
    siklar:
      - "Daire kararından itibaren 1 ay"
      - "Daire kararından itibaren 3 ay"
      - "Daire kararından itibaren 4 ay"
      - "Daire kararından itibaren 6 ay"
    dogru: 1
    aciklama: |
      Sözleşme'nin 43. maddesine göre taraflardan biri, Daire kararının verildiği tarihten itibaren 3 ay içinde davanın Büyük Daireye gönderilmesini isteyebilir. Talebi 5 yargıçlık panel inceler. Dört ay, başvurunun ilk aşamasındaki süredir; karıştırma.
  - soru: |
      Ali, Yargıtayın onama kararı kendisine tebliğ edildikten 5 gün sonra, Anayasa Mahkemesine başvurmadan doğrudan AİHM'ye başvurmuştur. Başvurunun kabul edilebilirliği bakımından en doğru değerlendirme hangisidir?
    siklar:
      - "Süre henüz dolmadığı için başvuru kabul edilebilir."
      - "AİHM, yalnızca esasa ilişkin gerekçeleri incelediği için iç hukuk yolları aranmaz."
      - "İç hukuk yolları tüketilmediği için başvuru kabul edilemez; AYM'ye bireysel başvuru tüketilmesi gereken etkili bir yoldur."
      - "Başvuru, Ali bir gerçek kişi olduğu için her hâlde kabul edilir."
    dogru: 2
    aciklama: |
      AİHM, AYM bireysel başvuru yolunu etkili ve tüketilmesi gereken bir iç hukuk yolu olarak kabul eder (AY m. 148/3; 6216 sayılı Kanun m. 45/2). Doğrudan başvuru, Sözleşme'nin 35. maddesindeki iç hukuk yollarının tüketilmesi şartını karşılamaz. Sürenin henüz dolmamış olması bu eksikliği gidermez.
  - soru: |
      Zeynep'in AYM'ye bireysel başvurusu, 02.01.2024 tarihinde kendisine tebliğ edilen kararla kabul edilemez bulunmuştur. Zeynep 15.03.2024 tarihinde AİHM'ye başvurmuştur. Başvurunun süre bakımından durumu nedir?
    siklar:
      - "Süre geçmiştir, çünkü AİHM'ye başvuru süresi 30 gündür."
      - "Süre geçmemiştir; başvuru 4 aylık süre içindedir."
      - "Süre geçmiştir, çünkü başvuru süresi 2 aydır."
      - "Süre bakımından incelenmez, çünkü AYM kararları sonrasında süre aranmaz."
    dogru: 1
    aciklama: |
      AİHM'ye başvuru süresi nihai karardan itibaren 4 aydır; AYM kararının tebliğinden 15.03.2024'e kadar yaklaşık 2,5 ay geçmiştir. Otuz gün, AYM'ye bireysel başvuru süresidir (6216 sayılı Kanun m. 47/5) ve AİHM süresiyle karıştırılmamalıdır.
  - soru: |
      AİHM'in kesinleşmiş ihlal kararı üzerine hukuk yargılamasında yargılamanın iadesi talebi için HMK m. 377/1-e'ye göre süre başlangıcı ve süre aşağıdakilerden hangisidir?
    siklar:
      - "Kararın tebliğinden itibaren 3 ay"
      - "Kararın kesinleşmesinden itibaren 1 yıl"
      - "Kararın verilmesinden itibaren 30 gün"
      - "Kararın tebliğinden itibaren 6 ay"
    dogru: 0
    aciklama: |
      HMK m. 377/1-e, HMK m. 375/1-i bendindeki sebep için AİHM'nin kesinleşmiş kararının tebliğ edildiği tarihten itibaren üç ay süre öngörür. Bir yıl, ceza ve idari yargılamadaki süredir (CMK m. 311/1-f, İYUK m. 53/3).
  - soru: |
      Ceza yargılamasında AİHM'nin kesinleşmiş ihlal kararına dayanılarak yargılamanın yenilenmesi, CMK m. 311/1-f uyarınca kararın kesinleştiği tarihten itibaren ne kadar sürede istenebilir?
    siklar:
      - "30 gün"
      - "3 ay"
      - "1 yıl"
      - "10 yıl"
    dogru: 2
    aciklama: |
      CMK m. 311/1-f'ye göre yargılamanın yenilenmesi, AİHM kararının kesinleştiği tarihten itibaren bir yıl içinde istenebilir. Üç ay hukuk yargılamasındaki süredir (HMK m. 377/1-e).
  - soru: |
      Mehmet'in aleyhine verilmiş kesinleşmiş hukuk mahkemesi kararına karşı AİHM'ye başvurulmuş; Hükümetin sunduğu tek taraflı deklarasyon üzerine AİHM başvuruyu kayıttan düşürmüştür. Mehmet'in iç hukuktaki hakkı nedir?
    siklar:
      - "Tek taraflı deklarasyon sonucu düşme kararı yargılamanın iadesi sebebi değildir."
      - "Yalnızca AİHM'nin esastan verdiği ihlal kararı yargılamanın iadesi sebebidir; düşme kararı değildir."
      - "HMK m. 375/1-i uyarınca bu düşme kararı da yargılamanın iadesi sebebidir."
      - "Mehmet, yalnızca tazminat davası açabilir."
    dogru: 2
    aciklama: |
      HMK m. 375/1-i, AİHM'nin kesinleşmiş ihlal kararına ek olarak, karar aleyhine yapılan başvuruda dostane çözüm veya tek taraflı deklarasyon sonucunda düşme kararı verilmesini de yargılamanın iadesi sebebi sayar. CMK ve İYUK'ta da aynı eklemeler vardır.
  - soru: |
      AİHM'nin kesinleşmiş bir ihlal kararının icrasını aşağıdakilerden hangisi denetler?
    siklar:
      - "Avrupa Konseyi Parlamenter Meclisi"
      - "Avrupa Birliği Adalet Divanı"
      - "Avrupa Konseyi Bakanlar Komitesi"
      - "Birleşmiş Milletler İnsan Hakları Komitesi"
    dogru: 2
    aciklama: |
      Sözleşme'nin 46. maddesi uyarınca kesinleşmiş kararların icrasını Avrupa Konseyi Bakanlar Komitesi denetler. Parlamenter Meclis yargıçları seçer; BM İnsan Hakları Komitesi ve AB Adalet Divanı farklı sistemlerin organlarıdır.
  - soru: |
      Yabancı uyruklu Y, kendi ülkesinde işkenceye maruz kalacağını ileri sürerek sınır dışı edilmesine karşı AİHM'ye başvurmuş ve AİHM İçtüzüğü'nün 39. maddesi uyarınca sınır dışı işleminin durdurulması için geçici tedbir kararı verilmiştir. Devlet buna rağmen Y'yi sınır dışı ederse hangi sonuç doğar?
    siklar:
      - "Geçici tedbir bağlayıcı olmadığından hiçbir sonuç doğmaz."
      - "Devlet Sözleşme'nin 34. maddesini ihlal etmiş olur."
      - "Yalnızca iç hukuk bakımından idari sorumluluk doğar."
      - "Başvuru, sınır dışı nedeniyle konusuz kalır ve düşer."
    dogru: 1
    aciklama: |
      AİHM'nin Mamatkulov ve Askarov / Türkiye kararında geçici tedbirlerin bağlayıcı olduğu kabul edilmiştir. Tedbire uymamak, bireysel başvuru hakkının etkili kullanımını engellediğinden Sözleşme'nin 34. maddesinin ihlalidir.
  - soru: |
      Usulüne göre yürürlüğe konulmuş temel hak ve özgürlüklere ilişkin bir milletlerarası andlaşmanın hükmü ile bir kanun hükmü aynı konuda farklı düzenleme içeriyorsa AY m. 90/5'e göre hangisi esas alınır?
    siklar:
      - "Kanun hükmü esas alınır."
      - "Milletlerarası andlaşma hükmü esas alınır."
      - "Daha sonra yürürlüğe giren hüküm esas alınır."
      - "Karar, uyuşmazlığı çözecek mahkemenin takdirine bırakılmıştır."
    dogru: 1
    aciklama: |
      AY m. 90/5'in 2004'te eklenen cümlesine göre usulüne göre yürürlüğe konulmuş temel hak ve özgürlüklere ilişkin milletlerarası andlaşmalarla kanunların aynı konuda farklı hükümler içermesi hâlinde andlaşma hükümleri esas alınır. Bu andlaşmalar hakkında Anayasaya aykırılık iddiasıyla Anayasa Mahkemesine başvurulamaz.
olaylar:
  - olay: |
      Tacir Hasan Kaya, açtığı alacak davasını kaybetmiştir. Yargıtayın onama kararı 10.03.2023 tarihinde avukatına tebliğ edilmiştir. Hasan Kaya, başka bir ülkedeki aile işleriyle uğraştığından Anayasa Mahkemesine başvurmayı gereksiz görmüş ve 15.08.2023 tarihinde doğrudan AİHM'ye başvurmuştur.

      Aynı dönemde Ayşe Demir de farklı bir davada Yargıtay kararına karşı AYM'ye bireysel başvuruda bulunmuş; başvurusu kabul edilemez bulunmuş ve karar kendisine 02.01.2024 tarihinde tebliğ edilmiştir. Ayşe Demir 15.03.2024 tarihinde AİHM'ye başvurmuş; Hükümet tek taraflı deklarasyon sunmuş ve AİHM başvuruyu kayıttan düşürmüştür. Karar Ayşe Demir'e 20.09.2024 tarihinde tebliğ edilmiştir. Ayşe Demir iç hukuktaki hukuk davasının sonucunu değiştirmek istemektedir.

      1. Hasan Kaya'nın başvurusunun kabul edilebilirliğini inceleyiniz.
      2. Ayşe Demir'in AİHM başvurusunun süre bakımından durumunu değerlendiriniz.
      3. Ayşe Demir'in iç hukukta hangi yola başvurabileceğini ve süresini belirtiniz.
    olcut:
      - {tespit: "AYM bireysel başvurusunun AİHM öncesi tüketilmesi gereken etkili iç hukuk yolu olduğu; Hasan Kaya'nın bunu tüketmediği", puan: 25, madde: "AY m. 148"}
      - {tespit: "Hasan Kaya'nın başvurusunun ayrıca nihai karardan itibaren 4 aylık süreyi aşması", puan: 15, madde: "Sözleşme'nin 35. maddesi"}
      - {tespit: "Ayşe Demir'in AYM kararının tebliğinden itibaren 4 ay içinde başvurmuş olması", puan: 20, madde: "Sözleşme'nin 35. maddesi"}
      - {tespit: "Tek taraflı deklarasyon sonucu düşme kararının yargılamanın iadesi sebebi olması", puan: 20, madde: "HMK m. 375/1-i"}
      - {tespit: "İade süresinin AİHM kararının tebliğinden itibaren 3 ay olması", puan: 20, madde: "HMK m. 377/1-e"}
    cozum: |
      **Nitelendirme:** Olay iki ayrı başvurucunun AİHM yoluyla ilgilidir. Birincisi kabul edilebilirlik, ikincisi hem süre hem de karar sonrası iç hukuktaki sonuç sorunudur.

      **Hukuki sorunlar:** (1) Hasan Kaya iç hukuk yollarını tüketmiş ve süreye uymuş mudur? (2) Ayşe Demir'in başvurusu süresinde midir? (3) Düşme kararı iç hukukta yargılamanın iadesine imkân verir mi, süresi nedir?

      **İlgili hükümler:** Sözleşme'nin 35. maddesi iç hukuk yollarının tüketilmesini ve 4 aylık süreyi arar. AY m. 148/3'e göre herkes, temel hak ve özgürlüklerinin kamu gücü tarafından ihlal edildiği iddiasıyla AYM'ye başvurabilir; başvuru için olağan kanun yollarının tüketilmesi şarttır. HMK m. 375/1-i, karar aleyhine AİHM'ye yapılan başvuruda dostane çözüm veya tek taraflı deklarasyon sonucunda düşme kararı verilmesini iade sebebi sayar. HMK m. 377/1-e'ye göre bu sebeple süre, AİHM'nin kesinleşmiş kararının tebliğinden itibaren üç aydır.

      **Değerlendirme:** Hasan Kaya'nın başvurusu iki bakımdan kusurludur. Birincisi, AİHM'nin kabul ettiği etkili yol olan AYM bireysel başvurusunu tüketmemiştir; Yargıtay onaması sonrasında önce AYM'ye gitmesi gerekirdi. İkincisi, 10.03.2023'ten 15.08.2023'e kadar 4 aydan fazla süre geçmiştir. Bu nedenle başvuru kabul edilemezdir; tüketme eksikliği zaten başlı başına yeterlidir. Ayşe Demir ise AYM'den çıkan nihai karardan itibaren 4 ay içinde, yaklaşık 2,5 ayda başvurmuştur; kabul edilebilirlik şartlarını karşılamıştır. AİHM'nin düşme kararı, Hükümetin tek taraflı deklarasyonu sonucunda verildiğinden HMK m. 375/1-i kapsamındadır. Yargılamanın iadesi süresi, bu sebeple AİHM kararının tebliğinden itibaren üç aydır; Ayşe Demir'in kararı 20.09.2024'te tebliğ alması nedeniyle süre bu tarihten işler.

      **Sonuç:** Hasan Kaya'nın başvurusu kabul edilemez. Ayşe Demir'in başvurusu süresindedir ve düşme kararı yargılamanın iadesi sebebi olduğundan, tebliğden itibaren 3 ay içinde hukuk mahkemesinden yargılamanın iadesini isteyebilir.
  - olay: |
      Yabancı uyruklu Y, ülkesinde siyasi nedenlerle işkence göreceğini ileri sürmektedir. Türk makamları Y hakkında sınır dışı kararı almıştır. Y, sınır dışı edildiği takdirde kötü muameleye uğrayacağını belirterek AİHM'ye başvurmuş; Mahkeme, başvuru incelenirken sınır dışı işleminin durdurulması için AİHM İçtüzüğü'nün 39. maddesi uyarınca geçici tedbir kararı vermiştir. İdare, tedbir kararına rağmen Y'yi ülkesine göndermiştir.

      Y'nin avukatı Avukat Selin, devletin sorumluluğunun hangi hükümlere dayandığını ve bu başvurunun mağdurluk bakımından nasıl nitelendirileceğini araştırmaktadır.

      1. Y'nin başvurudaki mağdurluk niteliğini belirleyiniz.
      2. Geçici tedbirin bağlayıcılığını ve tedbire uyulmamasının sonucunu tartışınız.
      3. Başvuru sonucunda ihlal kararı çıkarsa devletin yükümlülüklerini belirtiniz.
    olcut:
      - {tespit: "Y'nin gönderileceği ülkede kötü muamele riski nedeniyle potansiyel mağdur sayılması", puan: 20, madde: "Sözleşme'nin 34. maddesi"}
      - {tespit: "Geçici tedbirin AİHM İçtüzüğü'nün 39. maddesine dayanması ve bağlayıcı olması", puan: 25, madde: "Sözleşme'nin 34. maddesi"}
      - {tespit: "Tedbire uymamanın Sözleşme'nin 34. maddesini ihlal etmesi", puan: 25, madde: "Sözleşme'nin 34. maddesi"}
      - {tespit: "İhlal kararının tespit niteliğinde olması ve devletin kesinleşmiş karara uyma yükümlülüğü", puan: 15, madde: "Sözleşme'nin 46. maddesi"}
      - {tespit: "Karar icrasının Bakanlar Komitesi tarafından denetlenmesi ve iç hukuktaki karşılığı", puan: 15, madde: "AY m. 90"}
    cozum: |
      **Nitelendirme:** Olay, sınır dışı edilecek bir yabancının kötü muamele riski nedeniyle AİHM'ye başvurması ve geçici tedbire uyulmamasıyla ilgilidir.

      **Hukuki sorunlar:** (1) Y hangi tür mağdurdur? (2) Geçici tedbir bağlayıcı mıdır, uyulmamasının sonucu nedir? (3) İhlal kararının sonuçları nelerdir?

      **İlgili hükümler:** Sözleşme'nin 34. maddesi mağdur olduğunu ileri süren kişiye başvuru hakkı tanır ve devletlerin bu hakkın etkili kullanımını engellememesini şart koşar. AİHM İçtüzüğü'nün 39. maddesi acil durumlarda geçici tedbir verilmesine imkân tanır. Sözleşme'nin 46. maddesi kesinleşmiş karara uyma yükümlülüğünü düzenler. AY m. 90/5, temel haklara ilişkin milletlerarası andlaşmaların iç hukukta kanunlara karşı üstünlüğünü belirtir.

      **Değerlendirme:** Y, sınır dışı edilmeden önce başvurduğu için ihlal henüz gerçekleşmemiştir ve hakları ihlal tehdidi altındadır; bu durum potansiyel mağdurluğun tipik bir örneğidir. Gönderilecek ülkede işkence riski bulunması hâlinde sınır dışı etme, gönderen devletin sorumluluğunu doğurabilir; bu nedenle Mahkeme acil durumda tedbir verir. Mamatkulov ve Askarov / Türkiye kararında Mahkeme, geçici tedbirlerin bağlayıcı olduğunu ve uyulmamasının Sözleşme'nin 34. maddesini ihlal ettiğini kabul etmiştir. İdare tedbire rağmen Y'yi gönderdiğinden, esasa ilişkin sonuç ne olursa olsun, bireysel başvuru hakkının etkili kullanımı engellenmiş sayılır. Esas bakımından ihlal tespit edilirse karar tespit niteliğindedir; ancak Sözleşme'nin 46. maddesi gereğince devlet karara uymak zorundadır. Adil tatmin ödemesi, mümkünse ihlali giderecek bireysel tedbirler ve benzer ihlalleri önleyecek genel tedbirler gündeme gelir. Kararın icrasını Bakanlar Komitesi denetler.

      **Sonuç:** Y potansiyel mağdurdur; geçici tedbire rağmen sınır dışı etme Sözleşme'nin 34. maddesini ihlal eder. İhlal kararı çıkarsa devlet Sözleşme'nin 46. maddesi uyarınca karara uymak zorundadır ve icrayı Bakanlar Komitesi izler.
kartlar:
  - on: "AİHM'ye bireysel başvuru süresi?"
    arka: "İç hukuktaki nihai karardan itibaren 4 ay (15 No.lu Protokol; 1 Şubat 2022'den itibaren). Önceki süre 6 aydı."
  - on: "AYM bireysel başvuru süresi?"
    arka: "Başvuru yollarının tüketildiği tarihten itibaren 30 gün (6216 sayılı Kanun m. 47/5)."
  - on: "Kimler AİHM'ye başvurabilir?"
    arka: "Gerçek kişiler, hükümet dışı kuruluşlar ve kişi grupları. Belediyeler gibi kamu tüzel kişileri başvuramaz (Sözleşme'nin 34. maddesi)."
  - on: "Mağdur türleri?"
    arka: "Doğrudan, dolaylı (yakın) ve potansiyel mağdur. Halk davası yoktur."
  - on: "Türkiye'de AİHM öncesi tüketilecek yol?"
    arka: "AYM'ye bireysel başvuru (23 Eylül 2012'den itibaren); AY m. 148/3."
  - on: "AİHM formasyonları ve yargıç sayıları?"
    arka: "Tek Yargıç 1, Komite 3, Daire 7, Büyük Daire 17."
  - on: "Büyük Daireye gönderme süresi?"
    arka: "Daire kararından itibaren 3 ay (Sözleşme'nin 43. maddesi); 5 yargıçlı panel inceler."
  - on: "Tek Yargıç hangi başvuruya bakamaz?"
    arka: "Adına seçildiği devlete karşı yapılan başvuruya (Sözleşme'nin 26. maddesinin üçüncü fıkrası)."
  - on: "AİHM ihlal kararının niteliği ve icrası?"
    arka: "Tespit niteliğindedir; devletler karara uymayı taahhüt eder (Sözleşme'nin 46. maddesi); icrayı Bakanlar Komitesi denetler."
  - on: "HMK'da AİHM kararı sonrası iade süresi?"
    arka: "AİHM'nin kesinleşmiş kararının tebliğinden itibaren 3 ay (HMK m. 377/1-e); sebep HMK m. 375/1-i."
  - on: "CMK ve İYUK'ta iade süresi?"
    arka: "AİHM kararının kesinleştiği tarihten itibaren 1 yıl (CMK m. 311/1-f; İYUK m. 53/3)."
  - on: "Düşme kararı iade sebebi midir?"
    arka: "Evet. Dostane çözüm veya tek taraflı deklarasyon sonucu verilen düşme kararı da yargılamanın iadesi sebebidir (HMK m. 375/1-i)."
