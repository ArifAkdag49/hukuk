    tanim: "İnsan ticareti mağdurunun, sömürü ve baskının sonucu olarak işlemek zorunda kaldığı fiillerden dolayı cezalandırılmaması."
  - terim: Palermo Protokolü
    tanim: "Sınıraşan Örgütlü Suçlara Karşı Sözleşme'ye Ek İnsan Ticaretinin Önlenmesine, Durdurulmasına ve Cezalandırılmasına İlişkin Protokol."
kararlar:
  - id: "1201686100"
    ozet: |
      Ağır Ceza Mahkemesi, aralarında insan ticareti ve fuhuş suçlarının da bulunduğu bir dosyada çok sayıda sanık hakkında hüküm kurmuştur. Dosyaya yansıyan anlatımlara göre mağdurlar zorla fuhşa yönlendirilmiş, çalışmak istemeyen veya az para getirenler mağarada kırbaçlanmış ve dövülmüştür. Sanıklardan biri de kendisinin fuhşa zorlandığını, tehdit edildiğini ve mağarada darp edildiğini ifade etmiştir. Yargıtay 4. Ceza Dairesi, bu sanık hakkında insan ticareti ve fuhuş suçlarından hüküm kurulurken, suçların karşı koyamayacağı veya kurtulamayacağı cebir ve şiddetin sonucu işlenip işlenmediğinin, yani TCK m. 28 kapsamında kalıp kalmadığının değerlendirilmemesini eksik inceleme ve yetersiz gerekçe saymıştır. Daire, Palermo Protokolü'ndeki cezalandırmama ilkesini anarak ilkenin yalnız yabancı uyruklu değil, Türk vatandaşı mağdurlar bakımından da uygulanması gerektiğini belirtmiştir. Hükümler bu ve başka nedenlerle bozulmuş, bazı suçlar bakımından ise dava zamanaşımı nedeniyle düşme kararı verilmiştir.
sorular:
  - soru: |
      Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Angarya yasağı Sözleşme'nin 4. maddesinde açıkça yazılıdır."
      - "Angarya yasağı yalnız AY m. 18/1'de ayrıca ve açıkça yer alır; Sözleşme'nin 4. maddesinde bu sözcük geçmez."
      - "AY m. 18'de angarya yasağı yoktur; yalnız zorla çalıştırma yasağı vardır."
      - "Angarya ve zorla çalıştırma aynı anlama gelir; Anayasa bunları birlikte anmaz."
    dogru: 1
    aciklama: |
      AY m. 18/1: "Hiç kimse zorla çalıştırılamaz. Angarya yasaktır." Sözleşme'nin 4. maddesi kölelik, kulluk ve zorla veya mecburi çalıştırmayı yasaklar; angarya sözcüğü yoktur.
  - soru: |
      AY m. 18/2'ye göre aşağıdakilerden hangisi zorla çalıştırma sayılmaz?
    siklar:
      - "Özel bir işverenin işçisine ücret ödemeden fazla mesai yaptırması."
      - "Olağanüstü hâllerde vatandaşlardan istenecek hizmetler."
      - "Bir kişinin pasaportuna el konularak ücretsiz çalıştırılması."
      - "Çocukların işverenlerine borçları nedeniyle çalıştırılması."
    dogru: 1
    aciklama: |
      AY m. 18/2, olağanüstü hâllerde vatandaşlardan istenecek hizmetleri zorla çalıştırma saymaz. Diğer şıklar özel işveren ilişkisi, pasaporta el koyma ve borç karşılığı çalıştırma örnekleridir; AY m. 18/2'nin kapsamına girmez.
  - soru: |
      5275 sayılı Kanuna göre tutuklu Kemal ile ilgili hangisi doğrudur?
    siklar:
      - "Kurum idaresi Kemal'i çalışmaya mecbur tutabilir; çünkü AY m. 18/2 tutukluluk süresindeki çalıştırmaları anar."
      - "Kemal'den çalışması istenebilir ancak çalışmaya mecbur tutulamaz."
      - "Tutuklu çalışamaz; çalışmak için istekte bulunamaz."
      - "Tutuklu yalnız kurumun hekimi uygun görürse çalışabilir ve bu durumda ücret ödenmez."
    dogru: 1
    aciklama: |
      5275 sayılı Kanun m. 114/1: Tutuklulardan çalışmaları istenebilir; ancak buna mecbur tutulamazlar. Anayasa'nın tutukluluk sürelerini anması, kanunun tutukluyu zorlayabileceği anlamına gelmez.
  - soru: |
      Sözleşme'nin 15. maddesinin ikinci fıkrasına göre olağanüstü hâlde askıya alınamayan hükümler arasında hangisi vardır?
    siklar:
      - "Zorla veya mecburi çalıştırma yasağı."
      - "Kölelik ve kulluk yasağı."
      - "Angarya yasağı."
      - "Tutukluların çalıştırılması."
    dogru: 1
    aciklama: |
      Sözleşme'nin 15. maddesinin ikinci fıkrası 4. maddenin birinci fıkrasını (kölelik ve kulluk) askıya alınamayan hükümler arasında sayar. Zorla çalıştırma yasağı (4. maddenin ikinci fıkrası) bu güvenceye dâhil değildir. Angarya ise Sözleşme'de geçmez.
  - soru: |
      Aşağıdakilerden hangisi zorla çalıştırmanın iki unsurundan biridir?
    siklar:
      - "İşin mutlaka fabrikada yaptırılması."
      - "İşin kişinin gönüllü olarak sunmadığı bir iş veya hizmet olması."
      - "İşin mutlaka bir yıldan uzun sürmesi."
      - "Kişinin yabancı uyruklu olması."
    dogru: 1
    aciklama: |
      Zorla çalıştırma için işin ceza veya yaptırım tehdidi altında yaptırılması ve kişinin gönüllü olarak sunmamış olması aranır. Süre, çalışma yeri ya da uyrukluk unsur değildir.
  - soru: |
      Tekstil atölyesi sahibi A, yüksek ücret vaadiyle kandırdığı yetişkin M'yi başka şehirden getirip atölyesinin bodrumunda barındırır, pasaportuna el koyar ve sınır dışı ettirme tehdidiyle günde 16 saat çalıştırır. A'nın eylemi bakımından hangisi doğrudur?
    siklar:
      - "Yalnız iş sözleşmesine aykırılık söz konusudur; ceza hukuku ilgilenmez."
      - "M gönüllü geldiği için rıza nedeniyle suç oluşmaz."
      - "TCK m. 117/1 uygulanır ve soruşturma mağdurun şikâyetine bağlıdır."
      - "TCK m. 80 kapsamında insan ticareti oluşabilir; M'nin rızası geçersizdir."
    dogru: 3
    aciklama: |
      Kandırma ve tehdit araç fiil, tedarik/götürme/barındırma hareket fiili, zorla çalıştırma ise amaçtır; TCK m. 80/1 oluşur. TCK m. 80/2'ye göre bu fiiller varsa mağdurun rızası geçersizdir. TCK m. 117/1 daha hafif ve şikâyete bağlı bir hükümdür.
  - soru: |
      Ahmet, 16 yaşındaki Ceren'e herhangi bir tehdit veya cebir uygulamadan, fuhuş yaptırmak amacıyla Ceren'i evinde barındırır. Ceren eve kendi isteğiyle gelmiştir. Hangisi doğrudur?
    siklar:
      - "Araç fiil bulunmadığı için TCK m. 80 uygulanamaz."
      - "Ceren'in rızası bulunduğundan fiil suç değildir."
      - "TCK m. 80/3 uyarınca 18 yaşından küçüklerde araç fiillere başvurulmamış olsa da insan ticareti suçu oluşur."
      - "Yalnız TCK m. 117/2 uygulanabilir."
    dogru: 2
    aciklama: |
      TCK m. 80/3: 18 yaşını doldurmamışların belirtilen maksatlarla tedarik edilmeleri, kaçırılmaları, götürülmeleri, sevk edilmeleri veya barındırılmaları hâlinde suça ait araç fiillerden hiçbirine başvurulmuş olmasa da faile birinci fıkradaki cezalar verilir.
  - soru: |
      TCK m. 80/1'deki temel ceza hangisidir?
    siklar:
      - "6 aydan 3 yıla kadar hapis."
      - "3 yıldan 8 yıla kadar hapis."
      - "5 yıldan 10 yıla kadar hapis ve beş bin güne kadar adli para cezası."
      - "8 yıldan 12 yıla kadar hapis ve on bin güne kadar adli para cezası."
    dogru: 3
    aciklama: |
      TCK m. 80/1: İnsan ticareti suçu 8 yıldan 12 yıla kadar hapis ve on bin güne kadar adli para cezasını gerektirir. 6 ay-3 yıl aralığı TCK m. 117/2'ye aittir.
  - soru: |
      Hatice, kimsesiz ve çaresiz Fatma'yı kendi evine kabul eder; Fatma'yı kimseden tedarik etmemiştir. Fatma'yı çatı katında insan onuruyla bağdaşmayan koşullarda tutar ve hiç ücret ödemeden yıllarca ev işlerinde çalıştırır. Hatice'nin eylemi hangi hükme girer?
    siklar:
      - "TCK m. 117/2, çünkü çaresizlik ve kimsesizlik sömürülerek ücretsiz çalıştırma söz konusudur."
      - "TCK m. 80/3, çünkü Fatma 18 yaşını doldurmuş olsa bile çocuk gibi korunur."
      - "TCK m. 117/1, çünkü ancak cebir veya tehdit varsa suç oluşur."
      - "Eylem yalnız iş hukukunu ilgilendirir; ceza hükmü yoktur."
    dogru: 0
    aciklama: |
      TCK m. 117/2, çaresizliğini, kimsesizliğini ve bağlılığını sömürerek ücretsiz çalıştıran veya insan onuruyla bağdaşmayacak çalışma ve konaklama koşullarına tabi kılan kişiyi cezalandırır (6 ay-3 yıl). Hatice tedarik, sevk gibi hareket fiillerini araç fiillerle gerçekleştirmediğinden TCK m. 80 değil TCK m. 117/2 gündeme gelir.
  - soru: |
      TCK m. 117/1'e ilişkin hangisi doğrudur?
    siklar:
      - "Suç re'sen soruşturulur; şikâyet aranmaz."
      - "Mağdurun şikâyeti hâlinde 6 aydan 2 yıla kadar hapis veya adli para cezası verilir."
      - "Yalnız kamu görevlileri tarafından işlenebilir."
      - "Ceza 8-12 yıl hapistir."
    dogru: 1
    aciklama: |
      TCK m. 117/1: Cebir veya tehdit kullanarak ya da hukuka aykırı başka bir davranışla iş ve çalışma hürriyetini ihlal eden kişiye, mağdurun şikâyeti hâlinde, 6 aydan 2 yıla kadar hapis veya adli para cezası verilir.
  - soru: |
      İnsan ticareti mağduru M, tehdit ve şiddetin etkisiyle atölyede sahte ürün dikmeye zorlanmış ve bu nedenle hakkında dava açılmıştır. TCK m. 28 bakımından hangisi doğrudur?
    siklar:
      - "M'nin rızası geçersiz olduğundan ceza sorumluluğu hiçbir koşulda tartışılmaz."
      - "Karşı koyamayacağı veya kurtulamayacağı cebir ve şiddet ya da muhakkak ve ağır korkutma veya tehdit sonucu suç işleyen kişiye ceza verilmez; M açısından bu koşulların varlığı değerlendirilmelidir."
      - "M, mağdur olduğu için yaptığı bütün fiiller otomatik olarak cezasız kalır."
      - "TCK m. 28 yalnız yabancı uyruklu mağdurlara uygulanır."
    dogru: 1
    aciklama: |
      TCK m. 28/1: Karşı koyamayacağı veya kurtulamayacağı cebir ve şiddet veya muhakkak ve ağır bir korkutma veya tehdit sonucu suç işleyen kimseye ceza verilmez; bu durumlarda cebir, şiddet, korkutma ve tehdidi kullanan kişi fail sayılır. Koşulların somut olayda değerlendirilmesi gerekir; ilke yalnız yabancı mağdurlara özgü değildir.
  - soru: |
      AY m. 18/2'nin ilk istisnası ile ilgili hangisi doğrudur?
    siklar:
      - "Hükümlülük veya tutukluluk süreleri içindeki çalıştırmaların şekil ve şartları kanunla düzenlenir."
      - "Hükümlülerin çalıştırılması için kanun gerekmez."
      - "Yalnız tutukluların çalıştırılması istisnadır; hükümlüler dâhil değildir."
      - "Bu istisna yalnız olağanüstü hâlde uygulanır."
    dogru: 0
    aciklama: |
      AY m. 18/2: "Şekil ve şartları kanunla düzenlenmek üzere hükümlülük veya tutukluluk süreleri içindeki çalıştırmalar" zorla çalıştırma sayılmaz. Hükümlülerin çalıştırılmasının şartları 5275 sayılı Kanun m. 29'da, tutuklularınki 5275 sayılı Kanun m. 114'te düzenlenmiştir.
olaylar:
  - olay: |
      Tekstil atölyesi sahibi A, yüksek ücret vaadiyle yabancı uyruklu yetişkin M'yi ve 16 yaşındaki Ç'yi başka bir şehirden atölyesinin bodrum katına getirip yerleştirir. A, M'nin pasaportuna el koyar, dışarı çıkarsa sınır dışı ettireceğini söyleyerek onu günde 16 saat çok düşük bir karşılıkla çalıştırır. Ç'ye ise hiçbir cebir veya tehdit uygulamaz; kendi isteğiyle geldiğini söyleyen Ç'yi günde 14 saat temizlik ve paketleme işinde çalıştırır. A ayrıca M'yi sahte markalı ürün dikmeye zorlar. Baskın sonrası M hakkında da bu fiilden dava açılır.

      1. A'nın M ve Ç'ye yönelik eylemlerinin hukuki niteliğini belirleyiniz.
      2. M ve Ç'nin rızalarının hukuki sonucunu değerlendiriniz.
      3. M hakkında açılan davada hangi hükümlerin dikkate alınması gerektiğini açıklayınız.
    olcut:
      - {tespit: "M yönünden araç fiil, hareket fiili ve amaçla insan ticareti suçunun oluşması", puan: 25, madde: "TCK m. 80/1"}
      - {tespit: "M'nin rızasının geçersiz olması", puan: 10, madde: "TCK m. 80/2"}
      - {tespit: "Ç 18 yaşından küçük olduğundan araç fiil aranmaksızın suçun oluşması", puan: 20, madde: "TCK m. 80/3"}
      - {tespit: "Cezanın 8-12 yıl hapis ve adli para cezası olması", puan: 10, madde: "TCK m. 80/1"}
      - {tespit: "M'nin sahte ürün dikme fiilinde karşı koyamayacağı cebir veya tehdit koşulunun incelenmesi", puan: 20, madde: "TCK m. 28"}
      - {tespit: "Olayın salt emeğin sömürülmesi (117/2) değil insan ticareti olması; kulluk ve zorla çalıştırma yasağı", puan: 15, madde: "TCK m. 117/2"}
    cozum: |
      **Nitelendirme:** Olayda hem Anayasa'nın zorla çalıştırma yasağı (AY m. 18/1) hem de bu yasağın ceza hukuku karşılığı olan insan ticareti ve emeğin sömürülmesi suçları birlikte gündemdedir. M'nin pasaportuna el konup sınır dışı ettirme tehdidiyle çalıştırılması ceza tehdidi altında ve rıza dışı çalışmadır; durumunu değiştirme imkânı da bulunmadığından kulluğa yaklaşan ağır bir zorla çalıştırmadır.

      **Hukuki sorunlar:** (1) A'nın M ve Ç yönünden hangi suçu işlediği. (2) Rızanın etkisi. (3) M'nin sahte ürün dikmesinin cezalandırılıp cezalandırılamayacağı.

      **İlgili hükümler ve değerlendirme:** TCK m. 80/1, zorla çalıştırmak maksadıyla tehdit, kandırma veya çaresizlikten yararlanarak rıza elde etmek suretiyle kişileri tedarik eden, götüren, sevk eden veya barındıran kimseyi 8-12 yıl hapis ve on bin güne kadar adli para cezasıyla cezalandırır. A, M'yi yüksek ücret vaadiyle kandırmış (araç fiil), başka şehirden getirip bodrumda barındırmıştır (hareket fiili) ve tehdidi zorla çalıştırma amacıyla sürdürmüştür. Suçun unsurları tamamdır. TCK m. 117/2 yalnız çaresizlik ve kimsesizliği sömürerek çalıştırmayı kapsar; burada daha ağır ve özel hüküm olan TCK m. 80 uygulanır.

      TCK m. 80/2'ye göre bu fiiller varsa mağdurun rızası geçersizdir; dolayısıyla M'nin işe gelmeyi baştan kabul etmiş olması A'yı kurtarmaz.

      Ç 18 yaşını doldurmamıştır. TCK m. 80/3'e göre belirtilen maksatlarla tedarik edilmesi, götürülmesi veya barındırılması hâlinde araç fiillerden hiçbirine başvurulmamış olsa da fail birinci fıkradaki cezalarla cezalandırılır. A, Ç'ye tehdit uygulamamış olsa da onu zorla çalıştırma maksadıyla barındırdığı için Ç yönünden de TCK m. 80 oluşur.

      M'nin sahte markalı ürün dikmesi bakımından TCK m. 28 devreye girer: karşı koyamayacağı veya kurtulamayacağı cebir ve şiddet veya muhakkak ve ağır korkutma veya tehdit sonucu suç işleyen kimseye ceza verilmez ve tehdidi kullanan kişi fail sayılır. Pasaporta el koyma ve sınır dışı etme tehdidi birlikte değerlendirildiğinde, M'nin bu koşulları taşıyıp taşımadığı mahkemece tartışılmalıdır. Yargıtay 4. Ceza Dairesi, benzer bir insan ticareti dosyasında Palermo Protokolü'ndeki cezalandırmama ilkesi ışığında bu incelemenin yapılmamasını bozma nedeni saymıştır.

      **Sonuç:** A, M ve Ç yönünden TCK m. 80 kapsamında insan ticaretinden sorumludur. M'nin rızası geçersizdir; Ç'de araç fiil aranmaz. M hakkındaki davada TCK m. 28 ve cezalandırmama ilkesi değerlendirilmeli, koşullar varsa M'ye ceza verilmemelidir.
  - olay: |
      Kemal tutuklu olarak bir ceza infaz kurumunda bulunmaktadır. Kurum görevlisi, Kemal'e "atölyede çalışmazsan ziyaretçi kabulün ve telefon görüşmelerin kısıtlanır" diyerek çalışmasını ister. Aynı kurumda hükümlü Ahmet, meslek sahibi değildir ve kurum hekimince ruhsal ve bedensel olarak sağlıklı bulunmuştur; kurum imkânları ölçüsünde belirlenen ücret karşılığında atölyede çalıştırılır. Kurum dışında, Hatice adlı bir kadın kimsesiz ve çaresiz yaşlı Fatma'yı evine alır; Fatma'ya hiç ücret ödemeden yıllarca ev işi yaptırır ve onu insan onuruyla bağdaşmayan koşullarda çatı katında tutar. Fatma'yı Hatice'ye başkası getirmemiştir.

      1. Kemal'in çalıştırılması AY m. 18 bakımından nasıl değerlendirilir?
      2. Ahmet'in çalıştırılması AY m. 18'e aykırı mıdır?
      3. Hatice'nin sorumluluğunu belirleyiniz.
    olcut:
      - {tespit: "Tutuklunun çalışmaya mecbur tutulamayacağı", puan: 25, madde: "5275 sayılı Kanun m. 114/1"}
      - {tespit: "Kemal'e baskı yapılmasının zorla çalıştırma yasağı ile ilişkisi", puan: 15, madde: "AY m. 18/1"}
      - {tespit: "Hükümlünün kanuni şartlarla ücret karşılığı çalıştırılmasının AY m. 18/2 kapsamında zorla çalıştırma sayılmaması", puan: 20, madde: "5275 sayılı Kanun m. 29/1"}
      - {tespit: "Hatice'nin çaresizliği ve kimsesizliği sömürerek ücretsiz çalıştırması", puan: 25, madde: "TCK m. 117/2"}
      - {tespit: "Tedarik/sevk fiilleri bulunmadığından TCK m. 80'in uygulanmaması", puan: 15, madde: "TCK m. 80/1"}
    cozum: |
      **Nitelendirme:** Olayda üç farklı çalıştırma vardır: tutuklunun çalıştırılması, hükümlünün çalıştırılması ve özel kişinin kimsesiz bir kadını sömürmesi. Birincisi ve ikincisi AY m. 18/2'nin istisna alanıyla, üçüncüsü ceza hukukuyla ilgilidir.

      **Hukuki sorunlar:** (1) Tutuklu Kemal'e çalışması için baskı yapılabilir mi? (2) Hükümlü Ahmet'in ücretli çalıştırılması zorla çalıştırma sayılır mı? (3) Hatice hangi suçtan sorumludur?

      **İlgili hükümler ve değerlendirme:** AY m. 18/2, şekil ve şartları kanunla düzenlenmek üzere hükümlülük veya tutukluluk süreleri içindeki çalıştırmaları zorla çalıştırma saymaz. Ancak şart ve şekli kanun belirler. 5275 sayılı Kanun m. 114/1'e göre tutuklulardan çalışmaları istenebilir; fakat buna mecbur tutulamazlar. Ziyaret ve telefon kısıtlaması tehdidiyle çalışmaya zorlamak bu kanuni sınırı aşar ve zorla çalıştırma yasağına (AY m. 18/1) aykırılık oluşturur. Kemal gönüllü olarak çalışmak isterse çalışabilir.

      Ahmet bakımından 5275 sayılı Kanun m. 29/1, kurum hekimi tarafından ruhsal ve bedensel olarak sağlıklı olduğu belirlenen meslek sahibi olmayan hükümlülerin kurum imkânları ölçüsünde belirlenen ücret karşılığında atölye veya işyurtlarında çalıştırılabileceğini söyler. Amaç salıverilmeden sonra meslek ve sanat öğrenmesini sağlamaktır (5275 sayılı Kanun m. 29/2). Bu çalıştırma kanuna dayandığı ve ücret karşılığı yapıldığı için AY m. 18/2 kapsamında zorla çalıştırma sayılmaz.

      Hatice, Fatma'nın çaresizliğini ve kimsesizliğini sömürerek onu ücretsiz çalıştırmış, ayrıca insan onuruyla bağdaşmayan konaklama koşullarına tabi kılmıştır. Bu fiiller TCK m. 117/2'ye girer ve 6 aydan 3 yıla kadar hapis veya yüz günden az olmamak üzere adli para cezası öngörülür. TCK m. 80 için araç fiillerle birlikte tedarik, sevk, barındırma gibi hareket fiilleri gerekir; Fatma'yı Hatice'ye başkası getirmediği ve bu amaçla araç fiil yoluyla rıza elde edilmediği için olay insan ticareti olarak nitelendirilemez.

      **Sonuç:** Kemal çalışmaya mecbur tutulamaz; baskı hukuka aykırıdır. Ahmet'in ücret karşılığı çalıştırılması kanuna dayalı olduğundan AY m. 18/2 kapsamındadır. Hatice TCK m. 117/2 uyarınca sorumludur; TCK m. 80 uygulanmaz.
kartlar:
  - on: "AY m. 18/1 ne der?"
    arka: "Hiç kimse zorla çalıştırılamaz. Angarya yasaktır."
  - on: "Angarya Sözleşme'nin 4. maddesinde geçer mi?"
    arka: "Hayır. Angarya yasağı AY m. 18/1'e özgüdür; Sözleşme'nin 4. maddesi kölelik, kulluk ve zorla çalıştırmayı yasaklar."
  - on: "Köleliğin özü nedir?"
    arka: "Kişi üzerinde mülkiyet hakkına bağlı yetkilerin kullanılmasıdır."
  - on: "Kulluk nedir?"
    arka: "Kişinin başkasının mülkünde yaşamak ve hizmet etmek zorunda kalıp durumunu değiştirememesidir; özellikle ağır bir zorla çalıştırmadır."
  - on: "Zorla çalıştırmanın iki unsuru?"
    arka: "Ceza veya yaptırım tehdidi altında yapılması ve kişinin gönüllü olarak sunmamış olması."
  - on: "AY m. 18/2'deki üç istisna?"
    arka: "Hükümlülük veya tutukluluk süreleri içinde kanunla düzenlenen çalıştırmalar; olağanüstü hâllerde istenen hizmetler; vatandaşlık ödevi niteliğindeki beden ve fikir çalışmaları."
  - on: "Tutuklu çalışmaya zorlanabilir mi?"
    arka: "Hayır. 5275 sayılı Kanun m. 114/1: Çalışmaları istenebilir ama mecbur tutulamazlar."
  - on: "Sözleşme'nin 15. maddesinin ikinci fıkrası hangi 4. madde hükmünü askıya almaz?"
    arka: "4. maddenin birinci fıkrasını: kölelik ve kulluk yasağını."
  - on: "TCK m. 80/1'in üç öğesi?"
    arka: "Araç fiil + hareket fiili + sömürü amacı. Ceza 8-12 yıl hapis ve 10.000 güne kadar adli para cezası."
  - on: "İnsan ticaretinde mağdur rıza gösterirse?"
    arka: "Rıza geçersizdir (TCK m. 80/2)."
  - on: "Çocuk mağdurda insan ticareti?"
    arka: "18 yaşını doldurmamışta araç fiillere başvurulmasa da suç oluşur (TCK m. 80/3)."
  - on: "TCK m. 80 ile TCK m. 117/2 farkı?"
    arka: "TCK m. 80: araç + hareket fiili + amaç, 8-12 yıl. TCK m. 117/2: çaresizliğin ve kimsesizliğin sömürülerek ücretsiz/orantısız düşük ücretle çalıştırılması, 6 ay-3 yıl."
