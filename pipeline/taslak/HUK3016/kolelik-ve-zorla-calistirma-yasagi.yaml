  - ⚠️ Tutuklu çalışmaya mecbur tutulamaz (5275 sayılı Kanun m. 114/1); anayasanın tutukluluğu anması tutuklunun zorla çalıştırılabileceği anlamına gelmez.
  - 📌 Kölelik ve kulluk yasağı Sözleşme'nin 15. maddesinin ikinci fıkrası uyarınca olağanüstü hâlde bile askıya alınamaz; zorla çalıştırma yasağı için aynı şey söylenemez.
  - 📌 Zorla çalıştırmada iki unsur: ceza tehdidi altında olma ve gönüllü olmama.
  - 📌 TCK m. 80/1: 8-12 yıl hapis ve 10.000 güne kadar adli para cezası.
  - 📌 TCK m. 80/2: mağdurun rızası geçersizdir.
