kararlar:
  - id: "646348900"
    ozet: |
      Boşanma davasında davalı eş, dava dilekçesi kendisine 16.10.2012'de tebliğ edildiği hâlde iki haftalık cevap süresi içinde cevap vermemiş, 05.11.2012'de verdiği cevap dilekçesinde tanık delili göstermiştir. Aile Mahkemesi süresinde bildirilmeyen tanıkları dinlemeden boşanmaya karar vermiş, Özel Daire bozunca mahkeme direnmiştir. Uyuşmazlık, süresinde cevap vermeyen davalının tanıklarının en azından karşı ispat kapsamında dinlenip dinlenemeyeceğidir.

      Hukuk Genel Kurulu gerekçesinde, HMK'daki sürelerin yargılamanın makul sürede tamamlanmasını amaçladığını; bunun AY m. 90/5 ışığında Sözleşme'nin 6. maddesindeki adil yargılanma hakkının makul süre unsuruna dayandığını belirtmiştir. Süresinde cevap vermeyen davalı, HMK m. 128 gereği vakıaları inkâr etmiş sayılır; HMK m. 129/1-e ise cevap dilekçesinde delil gösterilmesini ister. Bu nedenle süresinden sonra bildirilen tanıklar dinlenemez. Davacı da süresi geçen cevap dilekçesine muvafakat etmemiştir. Genel Kurul direnmeyi yerinde bulmuş, esasa ilişkin diğer temyiz itirazlarının incelenmesi için dosyayı Özel Daireye göndermiştir. Karar, AY m. 90/5'in yalnızca ağır hak ihlallerinde değil, usul kurallarının yorumunda da Sözleşme ilkelerinin yol gösterdiğini örnekler.
sorular:
  - soru: |
      Avrupa İnsan Hakları Mahkemesi aşağıdaki örgütlerden hangisine bağlıdır?
    siklar:
      - "Avrupa Birliği"
      - "Birleşmiş Milletler"
      - "Avrupa Konseyi"
      - "Avrupa Güvenlik ve İşbirliği Teşkilatı"
    dogru: 2
    aciklama: |
      AİHM, 1949'da kurulan ve merkezi Strazburg'da bulunan Avrupa Konseyi sistemine aittir. Avrupa Birliği Adalet Divanı Lüksemburg'dadır ve ayrı bir kurumdur; bu iki kurumun karıştırılması sık yapılan hatadır.
  - soru: |
      BM sözleşme komitelerinin bireysel başvuru üzerine verdiği metin için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Bağlayıcı bir yargı hükmüdür ve doğrudan icra edilir."
      - "\"Görüş\" niteliğindedir; yargı kararı gibi doğrudan bağlayıcı ve icra edilebilir değildir."
      - "Yalnızca Güvenlik Konseyi onaylarsa geçerli olur."
      - "Avrupa Konseyi Bakanlar Komitesi tarafından icra edilir."
    dogru: 1
    aciklama: |
      Komiteler mahkeme değildir; bireysel başvuruda verdikleri metin "Görüş"tür (Views). AİHM kararlarının aksine doğrudan yargısal bağlayıcılığı ve icra gücü yoktur.
  - soru: |
      Medeni ve Siyasi Haklar Sözleşmesi uyarınca bireysel başvuruları inceleyen organ hangisidir?
    siklar:
      - "İnsan Hakları Konseyi"
      - "İnsan Hakları Komitesi"
      - "Avrupa Sosyal Haklar Komitesi"
      - "Venedik Komisyonu"
    dogru: 1
    aciklama: |
      MSHS'nin kurduğu organ, bağımsız uzmanlardan oluşan İnsan Hakları Komitesidir. İnsan Hakları Konseyi ise BM Şartı'na dayanan, 47 devletten oluşan siyasi bir organdır. Avrupa Sosyal Haklar Komitesi ve Venedik Komisyonu Avrupa Konseyi organlarıdır.
  - soru: |
      AİHM'nin kesinleşmiş kararlarının icrasını hangi organ denetler?
    siklar:
      - "Parlamenter Meclis (AKPM)"
      - "AİHM Büyük Dairesi"
      - "Avrupa Konseyi Bakanlar Komitesi"
      - "Avrupa Komisyonu"
    dogru: 2
    aciklama: |
      Sözleşme'nin 46. maddesinin ikinci fıkrası uyarınca kesinleşmiş kararların icrasını Avrupa Konseyi Bakanlar Komitesi denetler. AKPM yargıçları seçen danışma organıdır; Avrupa Komisyonu ise Avrupa Birliği organıdır.
  - soru: |
      Başvuru süresini altı aydan dört aya indiren ve ikincillik ilkesi ile takdir marjını Sözleşme'nin başlangıç kısmına ekleyen düzenleme hangisidir?
    siklar:
      - "11 No.lu Protokol"
      - "14 No.lu Protokol"
      - "15 No.lu Protokol"
      - "16 No.lu Protokol"
    dogru: 2
    aciklama: |
      15 No.lu Protokol 1 Ağustos 2021'de yürürlüğe girmiş, başvuru süresinin dört aya inmesi 1 Şubat 2022'den itibaren uygulanmaya başlamıştır. 14 No.lu Protokol tek yargıç ve önemli zarar ölçütünü, 16 No.lu Protokol danışma görüşünü getirmiştir.
  - soru: |
      Aşağıdakilerden hangisi 14 No.lu Protokolün getirdiği yeniliklerden biridir?
    siklar:
      - "Komisyonun kaldırılarak tek ve sürekli çalışan Mahkemenin kurulması"
      - "Yargıçların görev süresinin yenilenemeyecek biçimde 9 yıl olması"
      - "Ulusal mahkemelerin Büyük Daireden danışma görüşü istemesi"
      - "İkincillik ilkesinin başlangıç kısmına eklenmesi"
    dogru: 1
    aciklama: |
      14 No.lu Protokol tek yargıç düzenini, komitelerin yerleşik içtihatta esastan karar vermesini, yenilenemeyen 9 yıllık yargıç görev süresini ve önemli zarar ölçütünü getirmiştir. Komisyonun kaldırılması 11 No.lu, danışma görüşü 16 No.lu, ikincillik ilkesi 15 No.lu Protokolle ilgilidir.
  - soru: |
      AY m. 90/5'in temel hak ve özgürlüklere ilişkin andlaşmaların kanunlarla çatışmasında andlaşmanın esas alınacağını belirten son cümlesi hangi kanunla eklenmiştir?
    siklar:
      - "4709 sayılı Kanun (2001)"
      - "5170 sayılı Kanun (2004)"
      - "5982 sayılı Kanun (2010)"
      - "6771 sayılı Kanun (2017)"
    dogru: 1
    aciklama: |
      AY m. 90/5'in son cümlesi 7 Mayıs 2004 tarihli ve 5170 sayılı Kanunun 7. maddesiyle eklenmiştir. Diğer kanunlar Anayasanın başka maddelerini değiştiren değişikliklerdir.
  - soru: |
      Türkiye ile bir devlet arasında yapılan vergi ve ticaret andlaşması, usulüne göre yürürlüğe konulmuş olup bir kanunla çelişmektedir. Mükellef "AY m. 90/5 gereği andlaşmalar kanunlara üstündür" demektedir. Bu iddia bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "AY m. 90/5'in son cümlesindeki öncelik kuralı yalnızca temel hak ve özgürlüklere ilişkin andlaşmalar içindir; vergi ve ticaret andlaşması bu kuraldan yararlanmaz."
      - "Her andlaşma kanunlara üstündür; iddia tamamen haklıdır."
      - "Andlaşmalar hiçbir hâlde kanun hükmünde sayılmaz."
      - "Öncelik kuralı yalnızca Anayasa Mahkemesi kararıyla uygulanabilir."
    dogru: 0
    aciklama: |
      AY m. 90/5'in son cümlesi "temel hak ve özgürlüklere ilişkin" andlaşmalar için öncelik tanır. Vergi ve ticaret andlaşması bu kapsamda değildir. Genel kural olarak andlaşmalar kanun hükmündedir, ancak "her andlaşma üstündür" sonucu çıkmaz.
  - soru: |
      Bir davada taraf vekili, Türkiye'nin usulüne göre yürürlüğe konulmuş bir insan hakları sözleşmesinin Anayasaya aykırı olduğunu ileri sürerek konunun Anayasa Mahkemesine götürülmesini istemektedir. Bu talep bakımından doğru olan hangisidir?
    siklar:
      - "Talep kabul edilir; mahkeme AY m. 152 uyarınca dosyayı Anayasa Mahkemesine gönderir."
      - "Talep reddedilir; çünkü andlaşmalar hakkında Anayasaya aykırılık iddiasıyla Anayasa Mahkemesine başvurulamaz (AY m. 90/5)."
      - "Talep yalnızca Cumhurbaşkanı aracılığıyla yapılabilir."
      - "Talep kabul edilir; çünkü temel hak sözleşmeleri Anayasa Mahkemesinin denetimine tabidir."
    dogru: 1
    aciklama: |
      AY m. 90/5'in ikinci cümlesi, usulüne göre yürürlüğe konulmuş andlaşmalar hakkında Anayasaya aykırılık iddiasıyla Anayasa Mahkemesine başvurulamayacağını söyler.
  - soru: |
      Ali, AİHM'nin Lüksemburg'da bulunduğunu ve Avrupa Birliği'nin yargı organı olduğunu söylemektedir. Ali'nin görüşü hakkında hangisi doğrudur?
    siklar:
      - "Doğrudur; AİHM ile AB Adalet Divanı aynı kurumdur."
      - "Kısmen doğrudur; AİHM AB'nin organıdır ama Strazburg'dadır."
      - "Yanlıştır; AİHM, Strazburg'da bulunan Avrupa Konseyi sistemine ait bir mahkemedir ve AB'den ayrıdır."
      - "Yanlıştır; AİHM, BM Genel Kurulunun yargı organıdır."
    dogru: 2
    aciklama: |
      AİHS ve AİHM, Türkiye'nin 1949'dan beri üyesi olduğu Avrupa Konseyi sistemine aittir; merkezi Strazburg'dadır. AB Adalet Divanı Lüksemburg'da bulunan ayrı bir kurumdur.
  - soru: |
      Bakanlık, kişi hâllerine dokunan ve kanunlara değişiklik getiren, temel hak ve özgürlüklere ilişkin bir andlaşmayı TBMM'nin uygun bulma kanunu çıkmadan yalnızca yayımlayarak yürürlüğe koymuştur. Bu işlem bakımından hangisi doğrudur?
    siklar:
      - "İşlem geçerlidir; çünkü her andlaşma yayımla yürürlüğe konabilir."
      - "İşlem sakattır; kişi hâllerine dokunan ve kanunlara değişiklik getiren andlaşma için TBMM'nin onaylamayı bir kanunla uygun bulması gerekir (AY m. 90/1 ve AY m. 90/4)."
      - "İşlem geçerlidir; çünkü süresi bir yılı aşmayan her andlaşma yayımla yürürlüğe konabilir."
      - "İşlem, yalnızca Danıştay onaylarsa geçerli olur."
    dogru: 1
    aciklama: |
      Yayımla yürürlüğe koyma istisnası ekonomik, ticari veya teknik ilişkileri düzenleyen, süresi bir yılı aşmayan ve kişi hâllerine dokunmayan andlaşmalar içindir (AY m. 90/2). Kanunlara değişiklik getiren andlaşmada ise birinci fıkra, yani uygun bulma kanunu şartı geçerlidir (AY m. 90/4).
  - soru: |
      Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Avrupa Sosyal Şartı'nın denetimini AİHM yapar."
      - "Parlamenter Meclis (AKPM), AİHM yargıçlarını seçer."
      - "CPT, BM İşkenceye Karşı Sözleşme'nin kurduğu komitedir."
      - "Venedik Komisyonu BM İnsan Hakları Konseyine bağlıdır."
    dogru: 1
    aciklama: |
      AKPM, AİHM yargıçlarını seçen Avrupa Konseyi organıdır. Avrupa Sosyal Şartı'nın denetimini Avrupa Sosyal Haklar Komitesi yapar. CPT, Avrupa Konseyi'nin İşkencenin Önlenmesi Sözleşmesi'yle kurulmuştur; BM İşkenceye Karşı Sözleşme'nin organı İşkenceye Karşı Komitedir. Venedik Komisyonu da Avrupa Konseyi bünyesindedir.
olaylar:
  - olay: |
      Aile Mahkemesinde görülen velayet davasında 13 yaşındaki çocuk Ece'nin dinlenmesi talep edilmiştir. Hâkim Ayşe, davanın uzayacağı gerekçesiyle ve kanundan çocuğun dinlenmesinin zorunlu olduğu sonucunu çıkarmadığı için Ece'yi dinlemeden dosya üzerinden karar vermeye hazırlanmaktadır. Davalı vekili Av. Mehmet, Çocuk Haklarına Dair Sözleşme'nin ve Çocuk Haklarının Kullanılmasına İlişkin Avrupa Sözleşmesi'nin çocuğun kendisini ilgilendiren yargısal süreçlerde görüşünün alınmasına ilişkin hükümlerine dayanmıştır. Vekil ayrıca "bu sözleşmeler Anayasaya aykırıdır; konu Anayasa Mahkemesine götürülmelidir" diyen karşı tarafa itiraz etmiştir. Karşı taraf ise "bunlar BM ve Avrupa Konseyi belgeleridir, birbirine karışır; önemli değil" demiştir.

      Sorular:
      1. Bu sözleşmelerin Türk hukukundaki konumu nedir?
      2. Kanun hükmü ile sözleşme hükmü çatışırsa hangisi esas alınır?
      3. Karşı tarafın "Anayasaya aykırıdır, Anayasa Mahkemesine götürülsün" talebi değerlendirilebilir mi?
      4. BM ve Avrupa Konseyi sistemleri arasındaki temel ayrım nedir?
    olcut:
      - {tespit: "Usulüne göre yürürlüğe konulmuş andlaşmaların kanun hükmünde olduğu", puan: 15, madde: "AY m. 90"}
      - {tespit: "Temel hak ve özgürlüklere ilişkin andlaşmalarla kanunun çatışmasında andlaşma hükümlerinin esas alınacağı (5170 sayılı Kanunla eklenen son cümle)", puan: 25, madde: "AY m. 90"}
      - {tespit: "Çocuk haklarına ilişkin sözleşmelerin temel hak ve özgürlük andlaşması niteliğiyle öncelik kuralı kapsamına girdiği ve hâkimin bunu uygulamak zorunda olduğu", puan: 20, madde: "AY m. 90"}
      - {tespit: "Andlaşmalar hakkında Anayasaya aykırılık iddiasıyla Anayasa Mahkemesine başvurulamayacağı", puan: 20, madde: "AY m. 90"}
      - {tespit: "BM sistemi (küresel, komiteler, Görüş) ile Avrupa Konseyi sistemi (bölgesel, AİHM, bağlayıcı karar) ayrımı; baskın görüşe göre öncelik kuralının Anayasanın altında, kanunun üstünde bir konum yarattığı", puan: 20, madde: "AY m. 11"}
    cozum: |
      **Nitelendirme:** Olay, uluslararası insan hakları sözleşmelerinin iç hukuktaki yeri ve kanunla çatışması sorunudur. Çocuğun kendisini ilgilendiren yargısal süreçte görüşünün alınması bir temel hak niteliğindedir.

      **Hukuki sorunlar:** (1) Anılan sözleşmeler hangi konumdadır? (2) Kanunla çatışırsa hangisi uygulanır? (3) Anayasaya aykırılık iddiası Anayasa Mahkemesine götürülebilir mi? (4) BM ve Avrupa Konseyi sistemleri nasıl ayrılır?

      **İlgili hükümler:** AY m. 90/5'e göre usulüne göre yürürlüğe konulmuş milletlerarası andlaşmalar kanun hükmündedir; bunlar hakkında Anayasaya aykırılık iddiasıyla Anayasa Mahkemesine başvurulamaz. 5170 sayılı Kanunla eklenen son cümleye göre, temel hak ve özgürlüklere ilişkin andlaşmalarla kanunların aynı konuda farklı hükümler içermesi nedeniyle çıkabilecek uyuşmazlıklarda andlaşma hükümleri esas alınır. AY m. 90/1 ve AY m. 90/4 uyarınca kanunlara değişiklik getiren andlaşmalar TBMM'nin uygun bulma kanunuyla yürürlüğe girer. AY m. 11'e göre Anayasa hükümleri bağlayıcıdır ve kanunlar Anayasaya aykırı olamaz.

      **Değerlendirme:** Çocuk Haklarına Dair Sözleşme ve Çocuk Haklarının Kullanılmasına İlişkin Avrupa Sözleşmesi temel hak ve özgürlüklere ilişkin andlaşmalardır. Usulüne göre yürürlüğe konulmuşlarsa kanun hükmündedirler ve ilgili kanun hükmüyle farklı sonuca götürdüklerinde AY m. 90/5'in son cümlesi gereği esas alınırlar. Hâkim Ayşe'nin "davanın uzayacağı" gerekçesi bu öncelik kuralını ortadan kaldırmaz. Karşı tarafın Anayasa Mahkemesi talebi ise AY m. 90/5'in ikinci cümlesi karşısında dinlenemez: andlaşmalar hakkında Anayasaya aykırılık iddiasıyla Anayasa Mahkemesine başvurulamaz. Burada kanunun Sözleşme'ye aykırı olması hâlinde ihmal mi, AY m. 152 mi sorusu doktrinde tartışmalıdır; ancak olayda uygulanacak kuralın "andlaşma hükmünün esas alınması" olduğu açıktır. Son olarak karşı tarafın "belgeler birbirine karışır" savı yanlıştır: BM sistemi küresel olup sözleşme komitelerinin bireysel başvuruda verdiği "Görüş"ler yargı kararı değildir; Avrupa Konseyi sistemi bölgesel olup AİHM kararları bağlayıcıdır ve icrasını Bakanlar Komitesi denetler.

      **Sonuç:** Sözleşmeler kanun hükmündedir; çatışmada AY m. 90/5 gereği esas alınır. Hâkim, çocuğun görüşünü almak zorundadır; aksi yönde karar verirse hüküm bozma nedeni olur. Anayasa Mahkemesine başvuru talebi AY m. 90/5 nedeniyle reddedilmelidir.
  - olay: |
      Zeynep, hakkındaki ceza davasında mahkûm olmuş ve hüküm kesinleşmiştir. Zeynep, yargılamada Sözleşme'nin ihlal edildiğini ileri sürerek iç hukuk yollarını tüketmiş ve AİHM'ye başvurmuştur. Mahkeme, mahkûmiyet hükmünün Sözleşme'yi ihlal ederek verildiğini ve hükmün bu ihlale dayandığını tespit etmiş; bu karar kesinleşmiştir. Ayşe ise benzer bir iddiayla BM İnsan Hakları Komitesine başvurmuş ve Komite ihlal saptayan bir "Görüş" yayımlamıştır. Zeynep'in avukatı şu iddialarda bulunmuştur: (a) "AİHM, Avrupa Birliği'nin mahkemesidir; kararını Avrupa Komisyonu denetler." (b) "Karar kesinleşince icrasını AKPM denetler." (c) "Ayşe'nin Komite Görüşü de kesin hüküm gibi doğrudan icra edilmelidir." (d) "Zeynep ceza mahkûmiyetinin yenilenmesini isteyebilir; bunun için AİHM kararının kesinleşmesinden itibaren bir yıl süresi vardır."

      Sorular:
      1. Avukatın (a), (b) ve (c) iddiaları doğru mudur?
      2. Zeynep yargılamanın yenilenmesini isteyebilir mi? Süre ne kadardır?
      3. Ayşe'nin durumunda Komite Görüşü hangi niteliktedir?
    olcut:
      - {tespit: "AİHM'nin Avrupa Birliği değil Avrupa Konseyi sistemine ait olduğu; (a) iddiasının yanlış olduğu", puan: 15, madde: "AY m. 90"}
      - {tespit: "AİHM kararlarının icrasını Bakanlar Komitesinin denetlediği; AKPM'nin yargıç seçen danışma organı olduğu", puan: 20, madde: "AY m. 90"}
      - {tespit: "AİHM kararlarının yargısal ve bağlayıcı olduğu (Sözleşme'nin 46. maddesi)", puan: 15, madde: "AY m. 90"}
      - {tespit: "Ceza hükmünün Sözleşme ihlali suretiyle verildiğinin ve hükmün bu aykırılığa dayandığının AİHM'nin kesinleşmiş kararıyla tespit edilmesinin hükümlü lehine yargılamanın yenilenmesi sebebi olduğu", puan: 25, madde: "CMK m. 311/1-f"}
      - {tespit: "Yenileme isteminin AİHM kararının kesinleştiği tarihten itibaren bir yıl içinde yapılması gerektiği", puan: 10, madde: "CMK m. 311"}
      - {tespit: "BM komitesi Görüşünün yargı kararı olmadığı, doğrudan bağlayıcı ve icra edilebilir olmadığı", puan: 15, madde: "AY m. 90"}
    cozum: |
      **Nitelendirme:** Olay, Avrupa Konseyi sistemindeki AİHM kararlarının niteliği ve iç hukuktaki sonuçları ile BM komitesi Görüşlerinin niteliğinin karşılaştırılmasıdır.

      **Hukuki sorunlar:** (1) AİHM hangi sisteme aittir ve kararlarını kim denetler? (2) AİHM kararı iç hukukta yargılamanın yenilenmesine yol açar mı? (3) BM komitesi Görüşü yargı kararı mıdır?

      **İlgili hükümler:** Sözleşme'nin 46. maddesi AİHM kararlarının bağlayıcılığını düzenler; icrayı aynı maddenin ikinci fıkrası uyarınca Avrupa Konseyi Bakanlar Komitesi denetler. CMK m. 311/1-f, ceza hükmünün Sözleşme'nin veya protokollerin ihlali suretiyle verildiğinin ve hükmün bu aykırılığa dayandığının AİHM'nin kesinleşmiş kararıyla tespit edilmesini hükümlü lehine yargılamanın yenilenmesi sebebi sayar. Yenileme, AİHM kararının kesinleştiği tarihten itibaren bir yıl içinde istenebilir. AY m. 90/5 uyarınca Sözleşme gibi temel hak andlaşmaları kanunların üstünde esas alınır.

      **Değerlendirme:** (a) iddiası yanlıştır. AİHM, 1949'da kurulan Avrupa Konseyi sistemine ait, Strazburg'daki bir mahkemedir; Avrupa Komisyonu Avrupa Birliği organıdır ve AİHM kararlarını denetlemez. (b) iddiası da yanlıştır: icrayı denetleyen organ Bakanlar Komitesidir; AKPM yargıçları seçen danışma organıdır. (c) iddiası yanlıştır. Komite mahkeme değildir; bireysel başvuruda verdiği metin "Görüş"tür ve doğrudan yargısal bağlayıcılığı ve icra gücü yoktur. Komite Görüşlerinin yargılamanın yenilenmesi sebebi sayılıp sayılmayacağı ise pozitif mevzuatta açıkça düzenlenmediğinden tartışmalıdır; bu olayda Zeynep'in durumu AİHM kararına dayandığı için net, Ayşe'nin durumu belirsizdir. (d) iddiası ise isabetlidir: Zeynep, AİHM kararı mahkûmiyet hükmünün Sözleşme ihlaliyle verildiğini ve bu ihlale dayandığını tespit ettiği ve karar kesinleştiği için CMK m. 311/1-f'ye dayanarak yenileme isteyebilir; süre kararın kesinleştiği tarihten itibaren bir yıldır.

      **Sonuç:** Avukatın (a), (b) ve (c) iddiaları yanlış, (d) iddiası doğrudur. Zeynep CMK m. 311/1-f uyarınca bir yıl içinde yenileme isteyebilir; Ayşe'nin Komite Görüşü ise yargı kararı olmayıp doğrudan bağlayıcı değildir.
kartlar:
  - on: "Küresel ve bölgesel koruma sistemleri hangileridir?"
    arka: "Küresel: Birleşmiş Milletler (BM) sistemi. Bölgesel: Avrupa Konseyi ve AİHS sistemi."
  - on: "BM Komitelerinin bireysel başvuruda verdiği metin nedir?"
    arka: "\"Görüş\" (Views). Yargı kararı değildir; doğrudan bağlayıcı ve icra edilebilir değildir."
  - on: "İnsan Hakları Konseyi ile İnsan Hakları Komitesi farkı?"
    arka: "Konsey: BM Şartı'na dayalı, 47 devletin siyasi organı. Komite: MSHS'nin kurduğu, bağımsız uzmanlardan oluşan, bireysel başvuruya bakan organ."
  - on: "Avrupa Konseyi ne zaman kuruldu, Avrupa Birliği ile ilişkisi?"
    arka: "5 Mayıs 1949, merkezi Strazburg. Avrupa Birliği'nden tamamen ayrı bir örgüttür."
  - on: "AİHS'nin imza ve yürürlük tarihleri?"
    arka: "4 Kasım 1950'de imzalandı, 3 Eylül 1953'te yürürlüğe girdi."
  - on: "11 No.lu Protokol ne getirdi?"
    arka: "Komisyonu kaldırdı; tek ve tam zamanlı AİHM kuruldu, bireysel başvuru zorunlu oldu (1998)."
  - on: "14 No.lu Protokol ne getirdi?"
    arka: "Tek yargıç, komite ile esastan karar, 9 yıllık yenilenemeyen görev, önemli zarar ölçütü (2010)."
  - on: "15 No.lu Protokol ne getirdi?"
    arka: "İkincillik ve takdir marjı başlangıca eklendi; başvuru süresi 6 aydan 4 aya indi (1 Şubat 2022'den itibaren)."
  - on: "16 No.lu Protokol ne getirdi?"
    arka: "Ulusal yüksek mahkemelerin Büyük Daireden bağlayıcı olmayan danışma görüşü istemesi. Türkiye taraf değildir."
  - on: "AİHM kararlarının icrasını kim denetler?"
    arka: "Avrupa Konseyi Bakanlar Komitesi (Sözleşme'nin 46. maddesinin ikinci fıkrası)."
  - on: "AY m. 90/5'in üç kuralı?"
    arka: "Andlaşmalar kanun hükmündedir; Anayasaya aykırılık iddiasıyla Anayasa Mahkemesine başvurulamaz; temel hak andlaşmalarıyla kanun çatışırsa andlaşma esas alınır (son cümle: 5170 sayılı Kanun, 2004)."
  - on: "AY m. 90/5'teki öncelik kuralı hangi andlaşmalar için?"
    arka: "Yalnızca temel hak ve özgürlüklere ilişkin, usulüne göre yürürlüğe konulmuş andlaşmalar için. Konumu (baskın görüş): Anayasanın altında, olağan kanunların üstünde."
