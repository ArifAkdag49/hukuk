doktrin: |
  ### İdari irtifak hangi kurala girer?

  Bir görüşe göre irtifak kurulsa da mülkiyet malikte kalır, o hâlde müdahale **kullanımın kontrolüdür**. Karşı görüşe göre hava ya da yer altı katmanına irtifakla el atmak mülkiyet içeriğinin bir kısmını elinden almak anlamına gelir ve **kısmi yoksun bırakmaya** yaklaşır. AYM enerji hattı olayında yoksun bırakma kuralını uygulamış, ama müdahalenin türünün olaya göre belirleneceğini vurgulamıştır. Bu nedenle kural seçimi tek başına sınav konusu yapılmamalı; esas olan sonucun ölçülülük denetiminde belirlenmesidir.

  ### İmar kısıtlılığında kural seçimi

  Kamu hizmetine ayrılan taşınmazın durumu genel kural çerçevesinde incelenir. Bir görüşe göre bu özünde kullanımın kontrolüdür. Diğer görüş, kısıtlılık uzadıkça durumun **fiilî yoksun bırakmaya** yaklaştığını söyler. Her iki yaklaşımda da asıl sorun süre ve giderimdir; bu yüzden kuralın adı sonucu değiştirmez.

  ### Enflasyon kaybı

  Sözleşme organının tutumu, devlete genel bir enflasyon telafisi yükümlülüğü yüklemediği yönündedir. AYM ise kamu alacaklarında (kamulaştırma, el atma bedelleri) aşırı külfet kavramıyla, özel alacaklarda pozitif yükümlülük ve etkili başvuru üzerinden ihlal bulur. Pilot karar usulü karşıoy konusu olmuştur: karşıoy yazan üyelere göre sorun yapısal değil, kanunun yorumu sorunudur.

  ### "Gerçek karşılık" tam piyasa değeri mi?

  AY m. 46 "gerçek karşılık" der. Bir görüş bunu tam piyasa değeri olarak okur. Diğer görüş, Protokol'ün tazminattan söz etmediğini ve her durumda tam değerin aranmadığını belirtir (bu görüş doğrulanmamış öğreti bilgisidir). AYM bedelin hesabını derece mahkemelerine bırakır, kendisi yalnız orantılılığı denetler.
sozluk:
  - terim: Mülk
    tanim: "Ekonomik değer ifade eden, parayla değerlendirilebilen her türlü mal varlığı hakkı; taşınmaz, taşınır, sınırlı ayni hak, fikrî hak ve icrası kabil alacağı kapsar."
  - terim: Kamulaştırma
    tanim: "Devlet ve kamu tüzel kişilerinin kamu yararı gerektirdiğinde, gerçek karşılığı peşin ödeyerek özel mülkiyetteki taşınmazı zorla edinmesi (AY m. 46)."
  - terim: Devletleştirme
    tanim: "Kamu hizmeti niteliğindeki özel teşebbüslerin kamu yararı zorunlu kıldığında gerçek karşılığı üzerinden Devlete geçirilmesi (AY m. 47)."
  - terim: İdari irtifak
    tanim: "Mülkiyet devredilmeden idare lehine kurulan, taşınmazın kullanımını sınırlayan ayni hak (ör. enerji hattı geçişi)."
  - terim: Kamulaştırmasız el atma
    tanim: "İdarenin kamulaştırma işlemi yapmadan özel mülkiyetteki taşınmaza fiilen el koyması; kanuni dayanağı olmadığı için kanunilik ihlalidir."
  - terim: Kullanımın kontrolü
    tanim: "Mülkiyetin kaybına yol açmayan, kullanma ve yararlanma yetkilerini düzenleyen veya sınırlayan müdahale türü (vergi, para cezası, imar kısıtı)."
  - terim: Mülkten yoksun bırakma
    tanim: "Malikin mülkiyetinin ya da mülkiyet içeriğinin önemli bölümünün elinden alınması."
  - terim: Adil denge
    tanim: "Müdahale ile korunan kamu yararı arasındaki denge; malik şahsi olarak aşırı bir yüke katlanıyorsa bozulur."
  - terim: Gerçek karşılık
    tanim: "AY m. 46 ve m. 47'de kamulaştırma ve devletleştirmenin ödenmesi gereken karşılığı; kamulaştırmada peşin ödenmelidir."
  - terim: Pilot karar usulü
    tanim: "Yapısal bir sorundan doğan çok sayıda benzer başvuruyu çözmek için kararda sorunun giderilmesini işaret eden ve benzer başvuruların ertelenebildiği yöntem."
  - terim: Küçük çiftçi
    tanim: "Kamulaştırılan toprağı doğrudan işleyen kişi; bedeli her hâlde peşin ödenir (AY m. 46/3)."
kararlar:
  - id: "e5e01d4b-fa75-cd09-8616-ca15b5bbdb19"
    ozet: |
      Van'ın Erciş ilçesinde 24.970,01 m² tarlanın hisseli malikleri, tarlalarından kamulaştırma ve idari irtifak olmadan iki kez enerji nakil hattı geçirildiği için idare aleyhine el atma tazminatı davası açtı. İlk derece mahkemesi 13.837,33 TL'ye hükmetti; istinaf, bedeli 3.998,03 TL'ye indirip başvurucular aleyhine 2.180 TL vekâlet ücreti ve 1.678,66 TL yargılama gideri yükledi. AYM Genel Kurulu, kamulaştırmasız el atmanın kanuni dayanağı bulunmadığını belirterek kanunilik ihlali saptadı. Ayrıca bedele karşılık gider yüklenince başvuruculara yalnız 139,37 TL kaldığını, bunun AY m. 46'daki gerçek karşılık güvencesiyle bağdaşmadığını belirtti. Sonuç: AY m. 35 ihlali (oybirliği), yeniden yargılama. Karar, el atmanın yapısal bir sorun olduğu için ilgili Bakanlığa da gönderildi.
  - id: "87ad2903-14bb-cac8-a420-5576847a4f26"
    ozet: |
      Elâzığ'da bir taşınmazın 15/2400 hissesinin maliki olan başvurucunun hissesi, 1989 imar planında kamu ortaklık payı kesintisinden oluşmuş, 1993 parselasyonunda "mesleki okul" alanı olarak ayrılmış; yaklaşık otuz yıl kamulaştırılmamıştı. Başvurucunun açtığı tam yargı davasını idare mahkemesi kesin olarak reddetti. AYM, kamu hizmetine ayırmanın yoksun bırakma olmadığını ama kullanma ve tasarruf yetkilerini önemli ölçüde kısıtladığını, bu nedenle genel kural çerçevesinde incelenmesi gerektiğini belirtti. Müdahale kanuna dayanıyor ve kamu yararı amacı taşıyordu; ancak süre uzamış, giderim sağlanmamıştı ve otuz yıla yaklaşan kamulaştırmama başvurucuya aşırı külfet yüklüyordu. AY m. 35 ihlali oybirliğiyle saptandı, yeniden yargılamaya karar verildi, tazminat talebi reddedildi.
sorular:
  - soru: |
      AYM'nin mülk kavramına ilişkin yaklaşımı aşağıdakilerden hangisidir?
    siklar:
      - "Mülk yalnız tapuya kayıtlı taşınmazları kapsar."
      - "Mülk, parayla değerlendirilebilen her türlü mal varlığı hakkını kapsar; icrası kabil alacaklar da buna dâhildir."
      - "Alacak hakları mülk sayılmaz, çünkü yalnız eşya üzerindeki haklar korunur."
      - "Fikrî haklar mülk kavramının dışında kalır."
    dogru: 1
    aciklama: |
      AYM mülkü, ekonomik değer ifade eden ve parayla değerlendirilebilen her türlü mal varlığı hakkı olarak tanımlar; taşınır, taşınmaz, sınırlı ayni hak, fikrî hak ve icrası kabil alacak da kapsama girer. Mülkün yalnız tapulu taşınmazdan ibaret sayılması yaygın bir yanılgıdır (AY m. 35).
  - soru: |
      AY m. 35'e göre mülkiyet hakkı hangi sebeple sınırlanabilir?
    siklar:
      - "Genel ahlakın korunması amacıyla, kanunla."
      - "Yalnızca kamu yararı amacıyla, kanunla."
      - "Millî güvenlik gerekçesiyle, idari işlemle."
      - "Kamu düzeni ve genel sağlık sebebiyle, yönetmelikle."
    dogru: 1
    aciklama: |
      AY m. 35/2'ye göre mülkiyet ve miras hakları ancak kamu yararı amacıyla, kanunla sınırlanabilir. Maddede başka bir özel sınırlama sebebi yoktur; sınırlama yalnız kanunla yapılabilir, idari işlem ya da yönetmelik yeterli değildir (AY m. 35, AY m. 13).
  - soru: |
      Aşağıdakilerden hangisi 1 No.lu Protokol'ün 1. maddesinde devletlerin kullanımın kontrolüne ilişkin açıkça saklı tuttuğu yetkiler arasındadır?
    siklar:
      - "Vergilerin, başka katkıların veya para cezalarının ödenmesini sağlamak için gerekli gördükleri yasaları uygulama yetkisi."
      - "Kamulaştırmada tam piyasa değerinden daha düşük bedel ödeme yetkisi."
      - "Mülkiyeti her hâlde tazminatsız kamulaştırma yetkisi."
      - "Mülk sahiplerinin dava açma hakkını sınırlama yetkisi."
    dogru: 0
    aciklama: |
      1 No.lu Protokol'ün 1. maddesinin ikinci paragrafı, devletlerin mülkiyetin kamu yararına uygun kullanılmasını düzenleme ile vergilerin, başka katkıların ve para cezalarının ödenmesini sağlama yetkisini saklı tutar. Diğer şıklar maddede yer almayan, uydurma yetkilerdir.
  - soru: |
      Bir belediye, kanuni bir dayanağı bulunmayan bir idari işlemle Ayşe'nin arsasının kullanımını fiilen engellemiştir. AYM bu başvuruyu nasıl inceler?
    siklar:
      - "Önce ölçülülüğü inceler, kanunilik son sırada gelir."
      - "Kanuni dayanak bulunmadığı için diğer ölçütlere geçmeden müdahaleyi kanunilik bakımından ihlal sayar."
      - "Kamu yararı varsayıldığı için ihlal bulunmaz."
      - "Başvuruyu kanun yolu şikâyeti sayıp reddeder."
    dogru: 1
    aciklama: |
      AYM müdahale denetiminde ilk ölçüt kanuniliktir. Müdahalenin kanuni dayanağı yoksa kamu yararı ve ölçülülük incelenmeden ihlal bulunur. Kamu yararının "varsayılması" kanuni dayanak eksikliğini gidermez (AY m. 35, AY m. 13).
  - soru: |
      Mülkiyet hakkına müdahalenin kamu yararına dayanmadığı iddiasında ispat yükü kime düşer?
    siklar:
      - "İdareye düşer; idare her hâlde kamu yararını kanıtlamalıdır."
      - "İddiayı ileri süren başvurucuya düşer; kamu yararı konusunda devletin takdir yetkisi geniştir."
      - "İspat yükü yoktur; AYM kendiliğinden araştırır."
      - "Yargılamayı yapan ilk derece mahkemesine düşer."
    dogru: 1
    aciklama: |
      AYM'ye göre kamu yararı bakımından devletin takdir alanı geniştir ve kamu yararına uygun olmadığını iddia eden bunu ispat etmelidir. İdare aleyhine genel bir ters ispat kuralı söz konusu değildir (AY m. 35).
  - soru: |
      AY m. 46'ya göre kamulaştırmaya ilişkin aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yalnız devlet, her türlü taşınır veya taşınmaz malı gerçek karşılığını daha sonra ödemek şartıyla kamulaştırabilir."
      - "Devlet ve kamu tüzel kişileri, kamu yararı gerektirdiğinde özel mülkiyetteki taşınmazları gerçek karşılığını peşin ödemek şartıyla kamulaştırabilir."
      - "Yalnız kamu hizmeti niteliğindeki özel teşebbüsler kamulaştırılabilir."
      - "Kamulaştırma bedeli her hâlde beş yıla yayılan eşit taksitlerle ödenir."
    dogru: 1
    aciklama: |
      AY m. 46/1, kamulaştırma yetkisini Devlet ve kamu tüzel kişilerine verir; konu özel mülkiyetteki taşınmazlardır ve gerçek karşılığın peşin ödenmesi şarttır. Özel teşebbüsün devletleştirilmesi ise ayrı bir kurumdur (AY m. 47).
  - soru: |
      Bir belediye, ilkokul yapmak için Ali'nin arsasını kamulaştırmaktadır. Belediye bedelin altı eşit taksitle ödenmesini öngören bir düzenleme yapmıştır. AY m. 46'ya göre durum nedir?
    siklar:
      - "Taksit, süresi beş yılı aşmadıkça her kamulaştırmada serbesttir."
      - "Anayasa taksite yalnız tarım reformu, büyük enerji ve sulama projeleri, iskân, yeni orman, kıyıların korunması ve turizm amaçlarında izin verir; okul bunlar arasında olmadığından bedel nakden ve peşin ödenmelidir."
      - "Taksit, ancak peşin kısım yarıdan fazla ise mümkündür."
      - "Okul yapımı kamu hizmeti olduğu için taksit zorunludur."
    dogru: 1
    aciklama: |
      AY m. 46/2'ye göre kural nakden ve peşin ödemedir; taksit ancak sayılan amaçlarla kamulaştırılan topraklar için kanunla öngörülebilir ve süre beş yılı aşamaz. Okul yapımı sayılan amaçlar arasında yer almaz. "Her kamulaştırmada beş yıla kadar taksit" yaygın bir yanılgıdır.
  - soru: |
      Turizm amacıyla yapılan bir kamulaştırmada, kanun bedelin 5 yıllık eşit taksitle ödenmesini öngörmektedir. Kamulaştırılan toprağı doğrudan işleten küçük çiftçi Mehmet'in bedeli bakımından hangisi doğrudur?
    siklar:
      - "Mehmet'in bedeli de beş yıllık eşit taksitle ödenir."
      - "Mehmet'in bedeli her hâlde peşin ödenir."
      - "Mehmet'in bedeli iki yıllık taksitle ödenir."
      - "Mehmet'in bedelinin yarısı peşin, kalanı taksitle ödenir."
    dogru: 1
    aciklama: |
      AY m. 46/3'e göre kamulaştırılan topraktan, o toprağı doğrudan işleten küçük çiftçiye ait olanların bedeli her hâlde peşin ödenir. Turizm amacında taksit mümkün olsa bile bu güvence küçük çiftçi için istisnasızdır.
  - soru: |
      AY m. 46/4'e göre taksitlendirmelerde ve herhangi bir sebeple ödenmemiş kamulaştırma bedellerinde hangi faiz uygulanır?
    siklar:
      - "Kanuni faiz."
      - "Avans faizi."
      - "Kamu alacakları için öngörülen en yüksek faiz."
      - "Ticari işlerde uygulanan temerrüt faizi."
    dogru: 2
    aciklama: |
      AY m. 46/4 açıkça kamu alacakları için öngörülen en yüksek faizi uygular. Yalnız kanuni faiz öngören bir kanun fıkrasının AYM tarafından iptal edilmesi de bunu doğrular; çünkü kanuni faiz enflasyon kaybını karşılamaz.
  - soru: |
      Kamulaştırma (AY m. 46) ile devletleştirme (AY m. 47) arasındaki fark hangisidir?
    siklar:
      - "İkisi de özel mülkiyetteki taşınmazlar için peşin ödemeyle yapılır."
      - "Kamulaştırma özel mülkiyetteki taşınmazlar için gerçek karşılığın peşin ödenmesiyle; devletleştirme kamu hizmeti niteliğindeki özel teşebbüsler için kamu yararının zorunlu kıldığı hâllerde ve gerçek karşılığı üzerinden yapılır."
      - "Devletleştirme yalnız taşınır mallar için, kamulaştırma ise yalnız taşınmazlar için yapılır."
      - "Devletleştirmede gerçek karşılık ödenmesi gerekmez."
    dogru: 1
    aciklama: |
      AY m. 46 özel mülkiyetteki taşınmazları ve peşin ödemeyi; AY m. 47 kamu hizmeti niteliğindeki özel teşebbüsleri, kamu yararının "zorunlu kıldığı" hâlleri ve gerçek karşılığı düzenler. Devletleştirme maddesinde "peşin" sözcüğü bulunmaz, ama gerçek karşılık şarttır.
  - soru: |
      Olağanüstü hâlde dahi dokunulamayan haklar bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Mülkiyet hakkı, AY m. 15/2'deki dokunulamaz haklar arasındadır."
      - "AY m. 15/2'de mülkiyet sayılmaz; çekirdek haklar yaşam hakkı, maddi ve manevi bütünlük, din ve vicdan konusunda açıklamaya zorlanamama, suç ve cezaların geçmişe yürütülememesi ve masumiyettir."
      - "Olağanüstü hâlde hiçbir hak durdurulamaz."
      - "Yalnız yaşam hakkı dokunulamazdır."
    dogru: 1
    aciklama: |
      AY m. 15/2'ye göre olağanüstü hâlde bile dokunulamayacak haklar arasında mülkiyet yoktur. Mülkiyetin dokunulamaz sayılması yaygın bir yanılgıdır (AY m. 15, AY m. 35).
  - soru: |
      Mehmet'in İzmir'deki arsası 1999 tarihli uygulama imar planında okul alanına ayrılmış, ama otuz yıla yaklaşan sürede kamulaştırılmamış ve herhangi bir giderim sağlanmamıştır. Mehmet'in tazminat davası "el atma yok" gerekçesiyle reddedilmiştir. AYM'nin yaklaşımı nasıl olur?
    siklar:
      - "El atma bulunmadığı için mülkiyet hakkına müdahale yoktur."
      - "Müdahale vardır; kanuni dayanak ve kamu yararı bulunsa da uzun süre kamulaştırılmama ve giderim yokluğu malike aşırı külfet yükleyebilir."
      - "Kanuni dayanak olduğu için ölçülülük incelenmez."
      - "İmar planı kararları bireysel başvuruya konu olamaz."
    dogru: 1
    aciklama: |
      Kamu hizmetine ayırma kullanma ve tasarruf yetkilerini önemli ölçüde kısıtladığından müdahaledir. Dayanak ve kamu yararı bulunsa da ölçülülük ve adil denge incelenir; süre uzar ve giderim sağlanmazsa külfet aşırılaşır (AY m. 35, AY m. 13). "El atma yok" gerekçesi müdahalenin varlığını ortadan kaldırmaz.
olaylar:
  - olay: |
      Konya Belediyesi, Ayşe'nin 8.000 m² tarlasının bir bölümünden, kamulaştırma kararı almadan ve herhangi bir bedel ödemeden bir yol geçirmiştir. Ayşe, belediye aleyhine kamulaştırmasız el atma nedeniyle tazminat davası açmış, ilk derece mahkemesi 18.000 TL bedele hükmetmiştir. Belediyenin istinaf başvurusu üzerine bölge adliye mahkemesi kararı bozarak bedeli 6.000 TL'ye indirmiş, Ayşe aleyhine 5.500 TL vekâlet ücreti ve yargılama gideri yüklemiştir. Karar kesinleşmiştir.

      Ayşe, kararın ardından bireysel başvuruda bulunmak istemektedir.

      1. Ayşe'nin hakkı hangi anayasal hükümle korunur ve mülk kavramına girer mi?
      2. Belediyenin fiilî el atması bakımından müdahale nasıl nitelendirilir ve kanunilik ölçütü karşılanır mı?
      3. Bedelin 6.000 TL'ye düşürülüp aleyhine gider yüklenmesi hangi güvenceyle ilgilidir ve sonuç ne olur?
    olcut:
      - {tespit: "Taşınmazın AY m. 35 kapsamında mülk olduğunun tespiti", puan: 15, madde: "AY m. 35"}
      - {tespit: "Fiilen alınan bölüm yönünden müdahalenin mülkten yoksun bırakma niteliğinde olduğunun tespiti", puan: 20, madde: "AY m. 35"}
      - {tespit: "Kamulaştırma yapılmadan el atmanın kanuni dayanağı olmadığı; kanunilik ihlali ve diğer ölçütlere geçilmeyeceği", puan: 25, madde: "AY m. 13"}
      - {tespit: "AY m. 46'daki gerçek karşılık güvencesi ve bedelin gider sonucu eline 500 TL kalacak biçimde eritilmesi", puan: 25, madde: "AY m. 46"}
      - {tespit: "Sonuç: AY m. 35 ihlali; ihlalin giderilmesi için yeniden yargılama", puan: 15, madde: "AY m. 35"}
    cozum: |
      **Nitelendirme:** Olay, kamulaştırmasız (fiilî) el atma nedeniyle mülkiyet hakkının ihlali iddiasıdır. Ayşe'nin tarlası taşınmaz olduğundan AY m. 35 anlamında mülktür. Hak, Anayasa ile Sözleşmenin ortak koruma alanında olduğu için AY m. 148/3 uyarınca bireysel başvuruya konu olabilir.

      **Hukuki sorunlar:** (1) Müdahalenin niteliği ve kanuniliği; (2) AY m. 46'daki gerçek karşılık güvencesinin istinaf sonucunda zedelenip zedelenmediği; (3) sonuç.

      **İlgili hükümler:** AY m. 35 mülkiyet hakkını ve ancak kamu yararı amacıyla kanunla sınırlanabileceğini söyler. AY m. 13 sınırlamanın kanunla yapılmasını ve ölçülülük ilkesine uymasını arar. AY m. 46 kamulaştırmanın kanunla gösterilen usullere göre, gerçek karşılık peşin ödenerek yapılabileceğini düzenler.

      **Değerlendirme:** Belediye kamulaştırma kararı almamış, bedel ödememiştir; tarlanın bir kısmı fiilen malikin elinden çıkmıştır. Bu bölüm bakımından mülkten yoksun bırakma kuralı uygulanır. Müdahalenin kanuni dayanağı yoktur: kanunda kamulaştırma ancak belirli esas ve usullere göre yapılabilir, fiilî el atmayı meşru kılan bir hüküm bulunmaz. AYM'nin yerleşik yaklaşımına göre kanunilik ilkesi bu durumda baştan ihlal edilir; ilk ölçüt karşılanmadığı için kamu yararı ya da ölçülülük incelenmeden ihlal bulunur.

      İkinci sorun bedeldir. Ayşe'nin eline geçen miktar 6.000 TL, aleyhe hükmedilen vekâlet ücreti ve gider ise 5.500 TL'dir; yani eline 500 TL kalmaktadır. Gerçek karşılık güvencesi, malike ödenen bedelin gerçekten karşılık olmasını ister; aleyhe gider bedeli neredeyse tamamen eritirse bu güvence anlamını yitirir. İdare, hukuka aykırı eyleminden avantaj sağlamamalıdır. Derece mahkemesinin bedeli hangi yöntemle hesapladığı kanun yolu meselesidir; AYM bu hesabı yeniden yapmaz, yalnız sonucun orantılılığını denetler.

      **Sonuç:** Hem kanunilik hem gerçek karşılık güvencesi bakımından AY m. 35 ihlal edilmiştir. Giderim olarak kararın yeniden yargılama yapılmak üzere mahkemeye gönderilmesi uygundur.
  - olay: |
      Mehmet, İzmir'de 600 m² arsanın maliki. Arsa 1999 yılında yürürlüğe giren uygulama imar planında "okul alanı" olarak ayrılmış, ancak bugüne kadar kamulaştırılmamıştır. Mehmet arsasına inşaat ruhsatı alamamakta, arsayı rayiç değerinde satamamaktadır. 2024'te idare aleyhine tazminat davası açmış, mahkeme "taşınmaza fiilen el atılmamıştır, malik mülkiyetini korumaktadır" diyerek davayı reddetmiş, karar kesinleşmiştir.

      Mehmet bireysel başvuruda bulunuyor.

      1. İmar planında okul alanına ayrılma mülkiyet hakkına müdahale sayılır mı?
      2. Müdahalenin kanunilik ve kamu yararı yönünden durumu nedir?
      3. Ölçülülük ve adil denge bakımından sonuç ne olur?
    olcut:
      - {tespit: "Arsanın AY m. 35 kapsamında mülk olduğunun tespiti", puan: 15, madde: "AY m. 35"}
      - {tespit: "Kullanma ve tasarruf yetkilerinin kısıtlanmasının müdahale olduğu; el atma bulunmamasının müdahaleyi ortadan kaldırmayacağı", puan: 20, madde: "AY m. 35"}
      - {tespit: "Kanunilik ve kamu yararı ölçütlerinin karşılandığının tespiti (imar mevzuatı, okul alanı)", puan: 20, madde: "AY m. 13"}
      - {tespit: "Beş yıllık sürenin çok aşıldığı, giderim yoksa külfetin aşırılaştığı; adil dengenin bozulduğu", puan: 30, madde: "AY m. 35"}
      - {tespit: "Sonuç: AY m. 35 ihlali; yeniden yargılama", puan: 15, madde: "AY m. 35"}
    cozum: |
      **Nitelendirme:** Olay, kamu hizmetine ayrılarak tasarrufu kısıtlanan taşınmaz nedeniyle mülkiyet hakkının ihlali iddiasıdır. Arsa taşınmaz olduğundan mülktür (AY m. 35).

      **Hukuki sorunlar:** (1) Müdahalenin varlığı; (2) kanunilik ve kamu yararı; (3) ölçülülük ve adil denge.

      **İlgili hükümler:** AY m. 35 mülkiyet hakkının kamu yararı amacıyla kanunla sınırlanabileceğini öngörür; AY m. 13 sınırlamanın özüne dokunmamasını ve ölçülülüğe uymasını arar. Kamulaştırma ancak AY m. 46'daki şartlarla ve gerçek karşılık ödenerek yapılabilir. Kamulaştırma Kanunu, uygulama imar planının yürürlüğünden itibaren beş yıllık süre içinde imar programı ve uygulaması yapılmasını, taşınmazın bütçe imkânları dâhilinde kamulaştırılmasını veya kısıtlılığın plan değişikliğiyle kaldırılmasını öngörür.

      **Değerlendirme:** Mülkiyet hakkına müdahale için fiilî el atma şart değildir; kullanma, semerelerinden yararlanma veya tasarruf yetkilerinden birinin sınırlanması müdahale sayılır. Mehmet'in arsasında ruhsat alınamaması ve satışın olanaksızlaşması bunu gösterir. Derece mahkemesinin "malik mülkiyetini korumaktadır" gerekçesi bu nedenle yetersizdir. Müdahale imar mevzuatına dayandığı için kanunilik karşılanır; okul alanı ayırma amacı da kamu yararıdır. Kamu yararına uygunsuzluğu iddia eden ispatlamalıdır ve burada böyle bir veri yoktur.

      Sorun ölçülülük ve adil dengededir. Kanundaki beş yıllık süre çok aşılmış, 1999'dan 2024'e uzun yıllar geçmiş, malike kamulaştırma ya da giderim önerilmemiştir. Süre uzar ve giderim sağlanmazsa malik şahsi olarak aşırı bir yük taşır ve adil denge bozulur. Kuralın adı (kullanımın kontrolü ya da yoksun bırakma) konusunda doktrinde tartışma olsa da sonuç ölçülülük denetiminde belirlenir; bu nedenle burada kural seçimi çözümün konusu değildir.

      **Sonuç:** Mehmet bakımından AY m. 35 ihlal edilmiştir. Giderim olarak yeniden yargılama yapılmak üzere kararın ilgili mahkemeye gönderilmesi uygundur.
kartlar:
  - on: "AY m. 35'te mülkiyet hakkı hangi sebeple sınırlanabilir?"
    arka: "Yalnızca kamu yararı amacıyla ve kanunla (AY m. 35/2). Başka özel sınırlama sebebi yoktur."
  - on: "AYM'ye göre mülk nedir?"
    arka: "Ekonomik değer ifade eden, parayla değerlendirilebilen her türlü mal varlığı hakkı; taşınır, taşınmaz, sınırlı ayni hak, fikrî hak ve icrası kabil (kesinleşmiş) alacak da mülktür."
  - on: "AY m. 35'ten çıkan üç kural nelerdir?"
    arka: "Mülkiyetten barışçıl yararlanma, mülkten yoksun bırakma, kullanımın kontrolü."
  - on: "AYM'nin mülkiyete müdahale denetim sırası?"
    arka: "Kanunilik, kamu yararı, ölçülülük (elverişlilik, gereklilik, orantılılık), adil denge. Kanunilik yoksa diğer ölçütlere geçilmeden ihlal bulunur."
  - on: "Adil denge ne zaman bozulur?"
    arka: "Malik şahsi olarak aşırı bir yüke katlandığında. Dengeleyici mekanizma (bedel, giderim) varsa ihlal bulunmayabilir."
  - on: "AY m. 46'ya göre kamulaştırmanın şartları?"
    arka: "Devlet ve kamu tüzel kişileri; kamu yararı; özel mülkiyetteki taşınmaz; kanunla gösterilen usul; gerçek karşılığın peşin ödenmesi."
  - on: "Taksitle ödemeye hangi amaçlarda izin verilir?"
    arka: "Tarım reformu, büyük enerji ve sulama projeleri, iskân, yeni orman, kıyıların korunması, turizm. Süre en çok 5 yıl, taksitler eşit (AY m. 46/2)."
  - on: "Küçük çiftçinin bedeli nasıl ödenir?"
    arka: "Toprağı doğrudan işleten küçük çiftçinin bedeli her hâlde peşin ödenir (AY m. 46/3)."
  - on: "Taksitlerde ve ödenmemiş bedellerde hangi faiz?"
    arka: "Kamu alacakları için öngörülen en yüksek faiz (AY m. 46/4). Kanuni faiz değildir."
  - on: "Kamulaştırma ile devletleştirme farkı?"
    arka: "AY m. 46: özel mülkiyetteki taşınmaz, kamu yararı gerektirir, peşin gerçek karşılık. AY m. 47: kamu hizmeti niteliğindeki özel teşebbüs, kamu yararı zorunlu kılar, gerçek karşılık."
  - on: "Kamulaştırmasız el atmada hangi ilke ihlal edilir?"
    arka: "Kanuni dayanak olmadığı için kanunilik ilkesi baştan ihlal edilir; diğer ölçütlere geçilmez. Aleyhe gider bedeli eritirse gerçek karşılık güvencesi de ihlal olur."
  - on: "Bedelin enflasyonla erimesinde AYM'nin yaklaşımı?"
    arka: "Kamulaştırma, el atma bedellerinin ve kamu alacaklarının enflasyonla önemli ölçüde erimesi şahsi olarak aşırı ve olağan dışı külfettir. Özel alacaklarda AY m. 35 ile bağlantılı AY m. 40 ihlali bulunup pilot karar usulü uygulanmıştır."
