  - 📌 Mülk yalnız tapulu taşınmaz değildir: alacak, fikrî hak ve sınırlı ayni haklar da mülktür; **kesinleşmiş alacak mülktür**.
  - 📌 AYM AY m. 35'ten **üç kural** çıkarır: barışçıl yararlanma, yoksun bırakma, kullanımın kontrolü.
