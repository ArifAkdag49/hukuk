  - ⚠️ Kamu yararına uygunsuzluğu **iddia eden ispat eder**; kamu yararında takdir geniştir.
  - 📌 AY m. 46: kamulaştırma yalnız **özel mülkiyetteki taşınmaz** için, Devlet ve kamu tüzel kişilerince yapılır; **gerçek karşılığın peşin ödenmesi** şarttır.
  - 📌 Taksit yalnız sayılan amaçlarda (tarım reformu, büyük enerji ve sulama, iskân, yeni orman, kıyı, turizm); süre **en çok 5 yıl**, taksitler **eşit**.
  - 📌 Toprağı doğrudan işleten **küçük çiftçinin bedeli her hâlde peşin** ödenir.
  - ⚠️ Faiz: AY m. 46/4 "kamu alacakları için öngörülen en yüksek faiz" der; kanuni faiz demez.
