  - ⚠️ Yabancılar yalnız **Türk vatandaşlarına tanınan haklar** bakımından başvuramaz; diğer haklarda başvurabilir (6216 sayılı Kanun m. 46/3).
  - ⚠️ Yasama işlemleri ve düzenleyici idari işlemlere karşı **doğrudan** başvuru yapılamaz; uygulandığı somut işlem üzerinden başvurulabilir (6216 sayılı Kanun m. 45/3).
  - ⚠️ Kanun yolunda gözetilmesi gereken hususlar incelenemez; bireysel başvuru "dördüncü derece" yargılama değildir (AY m. 148/4; 6216 sayılı Kanun m. 49/6).
  - 📌 Mahkeme kararından kaynaklanan ihlalde dosya **yeniden yargılama** için mahkemeye gönderilir; yerindelik denetimi ve idari işlem niteliğinde karar yasaktır (6216 sayılı Kanun m. 50/1-2).
  - 📌 Kabul edilemezlik kararları kesindir (6216 sayılı Kanun m. 48/4); AYM kararları herkesi bağlar (AY m. 153).
  - 💡 Önemli zarar şartı: önem taşımama **ve** önemli zarara uğramama birlikte aranır (6216 sayılı Kanun m. 48/2).
doktrin: |
  ### Kanun hükmünden doğan ihlaller
  6216 sayılı Kanun m. 45/3 yasama işlemlerine karşı doğrudan başvuruyu kapatır; bölümlerin kanunu iptal yetkisi de yoktur. İhlal doğrudan kanunun kendisinden doğuyorsa, yani araya uygulamada takdir payı bırakan bir işlem girmiyorsa, sistemin bir boşluğu ortaya çıkar. Bir görüşe göre bu hâllerde AYM ihlali tespit etmekle yetinmeli ve sorunun çözümünü kanun koyucuya bırakmalıdır; karşı görüş ise ihlalin giderilmesi için normun iptali yolunun daha etkili olacağını savunur. Uygulamada ihlal tespit edilince karar örneğinin yasama organına bildirilmesi gibi yollar gündeme gelmektedir. Bu tartışma sınavda sonuç olarak değil, sistemin sınırı olarak anlatılmalıdır.

  ### Kamu tüzel kişilerinin başvuru ehliyeti
  6216 sayılı Kanun m. 46/2 kamu tüzel kişilerini topluca dışarıda bırakır. Bir görüşe göre üniversite, belediye ya da meslek kuruluşu gibi kamu tüzel kişileri, devletin karşısında kendi mülkiyet veya adil yargılanma haklarını korumak isterlerse yine de başvurabilmelidir; çünkü bu alanda devletle kişi arasındaki hak dengesi aynıdır. Karşı görüş, kanun metninin açık olduğunu ve kamu gücü kullanan kurumların temel hak öznesi olarak görülemeyeceğini ileri sürer. Kanun lafzı gereği kamu tüzel kişileri başvuru yapamaz; sınavda kural bu biçimde yazılmalıdır.

  ### Ortak koruma alanı
  Anayasa'daki hakların yalnız Sözleşme ile kesişen kısmının incelenmesi, bazı hakların (örneğin Anayasa'da bulunup Sözleşme'de karşılığı olmayan sosyal haklar) koruma dışında kalması sonucunu doğurur. Bir görüşe göre bu sınırlama, Anayasa'nın bağımsız bir koruma sistemi kurmasının önünde engeldir; diğer görüş ise sistemin Sözleşme standardıyla uyumlu işlemesi için bu daraltmanın bilinçli olduğunu belirtir. Uygulamada AYM, hakkın bir yönü ortak alanda kalıyorsa o yönüyle incelemeye gider.
sozluk:
  - terim: Bireysel başvuru
    tanim: "Temel hakkı kamu gücü tarafından ihlal edilen kişinin olağan yolları tükettikten sonra Anayasa Mahkemesine yaptığı başvuru (AY m. 148/3)."
  - terim: Ortak koruma alanı
    tanim: "Hem Anayasa'da hem de Sözleşme ve Türkiye'nin taraf olduğu ek protokollerde güvence altına alınmış hakların kesişimi."
  - terim: İkincillik
    tanim: "Önce derece mahkemelerinin hakkı korumasını, AYM'nin ancak yolların tüketilmesinden sonra devreye girmesini ifade eden ilke."
  - terim: Kanun yolu denetimi yasağı
    tanim: "AYM'nin delil takdiri, kanun yorumu gibi kanun yolunda gözetilecek hususları incelememesi (AY m. 148/4)."
  - terim: Komisyon
    tanim: "Kabul edilebilirliği inceleyen ve oy birliğiyle kabul edilemezlik kararı verebilen AYM birimi."
  - terim: Bölüm
    tanim: "Oy birliği sağlanamayan dosyaları kabul edilebilirlik yönünden, kabul edilen başvuruları ise esas yönünden inceleyen AYM birimi."
  - terim: Önemli zarar
    tanim: "Önem taşımayan başvuruların kabul edilemez bulunabilmesi için başvurucunun uğramadığı aranan zarar eşiği (6216 sayılı Kanun m. 48/2)."
  - terim: Açıkça dayanaktan yoksunluk
    tanim: "Başvurunun ilk bakışta temel hak ihlali ortaya koymayacak nitelikte olması; kabul edilemezlik sebebidir."
  - terim: Tedbir
    tanim: "Esas inceleme sırasında bölümlerin başvurucunun haklarını korumak için verdiği geçici karar; 6 ayda esas karar verilmezse kalkar."
  - terim: Yeniden yargılama
    tanim: "İhlal mahkeme kararından kaynaklanıyorsa dosyanın ihlalin sonuçlarını gidermek üzere ilgili mahkemeye gönderilmesi (6216 sayılı Kanun m. 50/2)."
  - terim: Yerindelik denetimi
    tanim: "İdarenin takdir yetkisinin uygunluğuna ilişkin denetim; AYM bunu yapamaz (6216 sayılı Kanun m. 50/1)."
kararlar:
  - id: "1071283800"
    ozet: |
      Bir şirkette işçi, performans düşüklüğü gerekçesiyle iş sözleşmesinin feshedildiğini ileri sürerek işe iade davası açmış; ilk derece mahkemesi davayı kabul etmiş, istinaf başvurusu esastan reddedilmiş, Yargıtay 9. Hukuk Dairesi ise 04.03.2020 tarihli kararla istinaf kararını ortadan kaldırıp davayı reddetmiştir. İşçinin bireysel başvurusu üzerine AYM, 27.02.2024 tarihli kararında feshin geçerli nedenine ilişkin iddiaların yeterince karşılanmaması nedeniyle AY m. 36 kapsamındaki gerekçeli karar hakkının ihlal edildiğine karar vermiş ve dosyayı yeniden yargılama için Daireye göndermiştir. Daire 04.07.2024 tarihli kararında, ihlal kendi kararından kaynaklandığı için önce o kararı ortadan kaldırmış, ardından istinaf kararını onamıştır. Karar, 6216 sayılı Kanun m. 50/2 uyarınca gönderilen dosyada mahkemenin önce ihlale yol açan kararı kaldırıp sonra yeni karar kurduğunu gösterir.
  - id: "1097059200"
    ozet: |
      İşe iade davasında istinaf başvurusu esastan reddedilen davalı, bölge adliye mahkemesinin gerekçeli kararında temyiz süresinin hatalı biçimde "tebliğden itibaren iki hafta" gösterilmesine güvenmiş; oysa karar tarihinde yasal süre sekiz gündür. Yargıtay 9. Hukuk Dairesi temyiz dilekçesini 11.12.2018 tarihinde süreden reddetmiştir. Bireysel başvuru üzerine AYM 13.01.2022 tarihli kararında, kanun yolu süresinin hatalı gösterilmesinin sonuçlarının başvurucuya yüklenmesini orantısız bularak mahkemeye erişim hakkının (AY m. 36) ihlal edildiğine karar vermiş ve dosyayı Daireye göndermiştir. Daire 10.10.2024 tarihli kararında önceki ret kararını ortadan kaldırmış, temyizi süresinde kabul edip istinaf kararını onamıştır. Karar, AYM ihlal kararının derece mahkemesince uygulanışını gösterir.
sorular:
  - soru: |
      Anayasa Mahkemesine bireysel başvuruda konu bakımından aranan "ortak koruma alanı" aşağıdakilerden hangisini ifade eder?
    siklar:
      - "Hem Anayasa'da hem de Avrupa İnsan Hakları Sözleşmesi ile Türkiye'nin taraf olduğu ek protokollerde güvence altına alınmış hakları"
      - "Yalnızca Anayasa'nın ikinci kısmında yer alan sosyal ve ekonomik hakları"
      - "Yalnızca Sözleşme'de güvence altına alınmış, Anayasa'da yer almayan hakları"
      - "Anayasa'da yer alan bütün hak ve özgürlükleri"
    dogru: 0
    aciklama: |
      6216 sayılı Kanun m. 45/1 ve AY m. 148/3, başvurunun Anayasa'da güvence altına alınmış hakların Sözleşme ve Türkiye'nin taraf olduğu ek protokoller kapsamındaki herhangi birinin ihlali iddiasıyla yapılmasını arar. Yani hak iki katalogun kesişiminde olmalıdır. Yalnız Anayasa'da ya da yalnız Sözleşme'de yer alan hak tek başına yeterli değildir.
  - soru: |
      Bireysel başvuru süresiyle ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Başvuru yollarının tüketildiği tarihten itibaren 60 gün içinde yapılmalıdır."
      - "Başvuru yollarının tüketildiği tarihten itibaren 30 gün içinde yapılmalıdır."
      - "Karar kesinleştikten sonra süre sınırı yoktur."
      - "Başvuru yollarının tüketildiği tarihten itibaren 15 gün içinde yapılmalıdır."
    dogru: 1
    aciklama: |
      6216 sayılı Kanun m. 47/5'e göre bireysel başvuru, başvuru yollarının tüketildiği tarihten; başvuru yolu öngörülmemişse ihlalin öğrenildiği tarihten itibaren otuz gün içinde yapılmalıdır. Onbeş gün, haklı mazeretin kalkmasından sonraki ek süredir.
  - soru: |
      Aşağıdakilerden hangisi bireysel başvurunun kabul edilebilirlik incelemesine ilişkin doğru bir bilgidir?
    siklar:
      - "Kabul edilebilirliği bölümler inceler ve oy çokluğuyla kabul edilemezlik kararı verir."
      - "Komisyon, kabul edilemezlik kararını salt çoğunlukla verir ve karar kesin değildir."
      - "Kabul edilebilirliği komisyonlar inceler; kabul edilemezlik kararı oy birliğiyle verilir, oy birliği yoksa dosya bölümlere havale edilir."
      - "Kabul edilebilirliği doğrudan Genel Kurul inceler."
    dogru: 2
    aciklama: |
      6216 sayılı Kanun m. 48/3'e göre kabul edilebilirlik incelemesi komisyonlarca yapılır; şartları taşımadığına oy birliğiyle karar verilen başvurularda kabul edilemezlik kararı verilir, oy birliği sağlanamayan dosyalar bölümlere havale edilir. Kabul edilemezlik kararları kesindir (6216 sayılı Kanun m. 48/4).
  - soru: |
      Bölümler esas incelemede başvurucunun haklarının korunması için tedbir kararı vermişse aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Esas hakkındaki kararın en geç üç ay içinde verilmesi gerekir."
      - "Esas hakkındaki kararın en geç altı ay içinde verilmesi gerekir; aksi hâlde tedbir kendiliğinden kalkar."
      - "Tedbir kararı bir yıl sonra kendiliğinden kalkar."
      - "Tedbir kararına süre sınırı yoktur."
    dogru: 1
    aciklama: |
      6216 sayılı Kanun m. 49/5: Tedbire karar verilmesi hâlinde esas hakkındaki karar en geç altı ay içinde verilmelidir, aksi takdirde tedbir kararı kendiliğinden kalkar.
  - soru: |
      Aşağıdakilerden hangisi bireysel başvuruya doğrudan konu edilebilir?
    siklar:
      - "Bir kanunun Anayasa'ya aykırı olduğu iddiası"
      - "Belediyenin kendi mülkiyetine ilişkin kesinleşmiş mahkeme kararı"
      - "Anayasa Mahkemesinin verdiği bir karar"
      - "Bir mahkeme kararının adil yargılanma hakkını ihlal ettiği iddiası"
    dogru: 3
    aciklama: |
      Mahkeme kararları, ortak koruma alanındaki hakları ihlal ettiği iddiasıyla ve diğer şartlar sağlanırsa bireysel başvuruya konu olabilir. Yasama işlemleri ve AYM kararları 6216 sayılı Kanun m. 45/3 uyarınca konu olamaz; belediye ise kamu tüzel kişisi olduğundan 6216 sayılı Kanun m. 46/2 gereği başvuru yapamaz.
  - soru: |
      Z Derneği, üyelerinin ifade özgürlüğünün ihlal edildiğini ileri sürerek üyeler adına bireysel başvuruda bulunmuştur. Başvuru hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Özel hukuk tüzel kişisi olduğu için üyeler adına serbestçe başvurabilir."
      - "Dernek yalnız tüzel kişiliğine ait hakların ihlali gerekçesiyle başvurabilir; üyelerin kişisel hakları için başvurusu kabul edilemez."
      - "Dernek kamu tüzel kişisi sayıldığından hiç başvuramaz."
      - "Dernek yalnız yabancı üyeleri adına başvurabilir."
    dogru: 1
    aciklama: |
      6216 sayılı Kanun m. 46/2: Özel hukuk tüzel kişileri sadece tüzel kişiliğe ait haklarının ihlal edildiği gerekçesiyle başvurabilir. Başvuru hakkı ayrıca güncel ve kişisel olarak doğrudan etkilenene aittir (6216 sayılı Kanun m. 46/1); dernek üyelerinin kişisel hakları adına başvuramaz.
  - soru: |
      Yabancı uyruklu P, milletvekili seçimlerinde oy kullanamadığı gerekçesiyle bireysel başvuruda bulunmuştur. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Seçme hakkı AY m. 67'de vatandaşlara tanındığından yabancı P'nin bu yönden başvurusu 6216 sayılı Kanun m. 46/3 gereği kabul edilemez."
      - "Yabancılar hiçbir hakkı için bireysel başvuru yapamaz."
      - "Yabancı P, seçme hakkı yönünden Türk vatandaşlarıyla aynı şekilde başvurabilir."
      - "P'nin başvurusu yalnız süre nedeniyle reddedilir."
    dogru: 0
    aciklama: |
      6216 sayılı Kanun m. 46/3'e göre yalnızca Türk vatandaşlarına tanınan haklarla ilgili olarak yabancılar başvuru yapamaz. Seçme hakkı AY m. 67'de vatandaşlar için güvence altına alınmıştır. Yabancılar herkese tanınan haklar bakımından ise başvurabilir.
  - soru: |
      Ali'nin aleyhine verilen istinaf kararı kesinleşmiş ve başvuru yolları tükenmiştir. Ali, kararı beğenmeyip AYM'den delillerin yeniden değerlendirilmesini ve davanın kendisi lehine sonuçlandırılmasını istemektedir. AYM bu talep karşısında nasıl davranır?
    siklar:
      - "Delilleri yeniden değerlendirir ve davayı yeniden karara bağlar."
      - "Delil değerlendirmesi kanun yolunda gözetilecek bir husus olduğundan inceleme yapamaz; ancak temel hak ihlali iddiasını inceleyebilir."
      - "Başvuruyu doğrudan Yargıtay'a gönderir."
      - "Başvuru hakkını kötüye kullanma sayarak ceza verir."
    dogru: 1
    aciklama: |
      AY m. 148/4 ve 6216 sayılı Kanun m. 49/6'ya göre kanun yolunda gözetilmesi gereken hususlarda inceleme yapılamaz. AYM yalnız bir temel hakkın ihlal edilip edilmediğini ve ihlalin nasıl giderileceğini inceler. Delil takdiri bu kapsamda değildir.
  - soru: |
      Mehmet'in kesinleşen kararı 3 Mart'ta başvuru yollarının tüketildiğini gösterecek şekilde tebliğ edilmiştir. Mehmet 5 Mart'ta ağır bir trafik kazası geçirmiş, 20 Nisan'a kadar hastanede yatmış ve 28 Nisan'da raporlarıyla birlikte başvuruda bulunmuştur. Başvuru süresi bakımından hangisi doğrudur?
    siklar:
      - "Ana süre 3 Mart'ta başladığı için başvuru her hâlde süresizdir."
      - "Mazeret 20 Nisan'da kalktığından 15 gün içinde (28 Nisan'da) belgeleriyle yapılan başvuru, mazeret geçerli görülürse süresindedir."
      - "Haklı mazeret hâlinde süre 6 aya uzar."
      - "Mazeret süresi 30 gündür."
    dogru: 1
    aciklama: |
      6216 sayılı Kanun m. 47/5: Haklı mazereti nedeniyle süresinde başvuramayanlar mazeretin kalktığı tarihten itibaren onbeş gün içinde ve mazeretlerini belgeleyen delillerle birlikte başvurabilir. AYM önce mazeretin geçerli görülüp görülmediğini inceler. Mazeret 20 Nisan'da kalkmış ve başvuru 8 gün sonra yapılmıştır.
  - soru: |
      AYM, işe iade davasında gerekçeli karar hakkının ihlal edildiğini tespit etmiş ve dosyayı karar veren Yargıtay dairesine göndermiştir. Dairenin yapması gereken aşağıdakilerden hangisidir?
    siklar:
      - "AYM'nin ihlal tespitine direnerek önceki kararında ısrar etmek."
      - "Tarafların yargılamanın iadesi davası açmasını beklemek."
      - "İhlali ve sonuçlarını ortadan kaldıracak şekilde, mümkünse dosya üzerinden yeniden yargılama yapıp karar vermek."
      - "Dosyayı AYM'ye iade etmek."
    dogru: 2
    aciklama: |
      6216 sayılı Kanun m. 50/2'ye göre ihlal bir mahkeme kararından kaynaklanmışsa dosya yeniden yargılama yapılmak üzere ilgili mahkemeye gönderilir; mahkeme AYM'nin açıkladığı ihlali ve sonuçlarını ortadan kaldıracak şekilde mümkünse dosya üzerinden karar verir. AYM kararları ayrıca AY m. 153 gereği yargı organlarını bağlar.
  - soru: |
      Aşağıdakilerden hangisi bireysel başvurunun kabul edilemezlik sebebi olarak 6216 sayılı Kanun m. 48/2'de yer alır?
    siklar:
      - "Başvurucunun avukatla temsil edilmemesi"
      - "Başvurunun Anayasa'nın uygulanması ve yorumu bakımından önem taşımaması ve başvurucunun önemli bir zarara uğramaması"
      - "Başvurunun ikinci kez yapılması"
      - "Başvurucunun yurt dışında yaşaması"
    dogru: 1
    aciklama: |
      6216 sayılı Kanun m. 48/2: Anayasa'nın uygulanması ve yorumlanması veya temel hakların kapsamının ve sınırlarının belirlenmesi açısından önem taşımayan ve başvurucunun önemli bir zarara uğramadığı başvurular ile açıkça dayanaktan yoksun başvurular kabul edilemez bulunabilir. Avukat zorunluluğu yoktur; avukatla temsilde vekâletname sunulur (6216 sayılı Kanun m. 47/4).
  - soru: |
      AYM'nin bireysel başvuruda verdiği ihlal kararıyla ilgili aşağıdakilerden hangisi yanlıştır?
    siklar:
      - "Yerindelik denetimi yapılamaz."
      - "İdari eylem ve işlem niteliğinde karar verilemez."
      - "İhlal mahkeme kararından kaynaklanıyorsa yeniden yargılama için dosya mahkemeye gönderilir."
      - "AYM ihlal kararı ile derece mahkemesinin kararını doğrudan kaldırıp yerine esasa ilişkin yeni hüküm kurar."
    dogru: 3
    aciklama: |
      6216 sayılı Kanun m. 50/1 yerindelik denetimini ve idari işlem niteliğinde karar vermeyi yasaklar; 6216 sayılı Kanun m. 50/2 ihlal mahkeme kararından kaynaklanıyorsa dosyanın yeniden yargılama için mahkemeye gönderilmesini düzenler. Esasa ilişkin yeni hükmü, yeniden yargılamayı yapan mahkeme kurar; AYM kurmaz.
olaylar:
  - olay: |
      (X) Büyükşehir Belediyesi, taşınmazının Hazine adına tesciline ilişkin kesinleşmiş mahkeme kararına karşı bireysel başvuruda bulunmuştur. Yabancı uyruklu (Y), milletvekili seçimlerinde oy kullandırılmadığı gerekçesiyle ayrıca bireysel başvuruda bulunmuştur. Vatandaş (Z) ise başvuru yollarının tüketildiğini gösteren kesinleşmiş kararın kendisine 01.04.2025 tarihinde tebliğ edilmesinden sonra 10.04.2025'te ağır kaza geçirmiş, 20.05.2025'e kadar yoğun bakımda kalmış ve 28.05.2025'te raporlarıyla birlikte başvuruda bulunmuştur.

      1. (X) Büyükşehir Belediyesi'nin başvurusunu değerlendiriniz.
      2. (Y)'nin başvurusunu değerlendiriniz.
      3. (Z)'nin başvurusunun süre bakımından durumunu değerlendiriniz.
    olcut:
      - {tespit: "Belediyenin kamu tüzel kişisi olması ve bireysel başvuru yapamaması", puan: 25, madde: "6216 sayılı Kanun m. 46/2"}
      - {tespit: "Seçme hakkının yalnız vatandaşlara tanınması ve yabancının bu yönden başvuramaması", puan: 25, madde: "6216 sayılı Kanun m. 46/3"}
      - {tespit: "Seçme hakkının AY m. 67'de vatandaşlara tanındığının gösterilmesi", puan: 10, madde: "AY m. 67"}
      - {tespit: "Ana başvuru süresinin 30 gün olması", puan: 15, madde: "6216 sayılı Kanun m. 47/5"}
      - {tespit: "Haklı mazeretin kalktığı 20.05.2025'ten itibaren 15 gün içinde belgelerle başvurunun süresinde olması ve mazeretin AYM'ce geçerli görülmesi gerektiği", puan: 25, madde: "6216 sayılı Kanun m. 47/5"}
    cozum: |
      **Nitelendirme:** Olay, AYM'ye bireysel başvuruda başvuru ehliyeti (kişi bakımından yetki) ve başvuru süresi ile ilgilidir. Üç ayrı başvurucu, üç ayrı kabul edilebilirlik sorunu ortaya koyar.

      **Hukuki sorunlar:** (1) Kamu tüzel kişisi bir belediye bireysel başvuru yapabilir mi? (2) Yalnız vatandaşlara tanınan bir hak yönünden yabancı başvurabilir mi? (3) Haklı mazeret hâlinde süre nasıl işler?

      **İlgili hükümler:** 6216 sayılı Kanun m. 46/2'ye göre kamu tüzel kişileri bireysel başvuru yapamaz; özel hukuk tüzel kişileri yalnız tüzel kişiliğe ait haklarının ihlali gerekçesiyle başvurabilir. 6216 sayılı Kanun m. 46/3'e göre yalnızca Türk vatandaşlarına tanınan haklarla ilgili olarak yabancılar başvuramaz. AY m. 67, seçme hakkını vatandaşlara tanır. 6216 sayılı Kanun m. 47/5'e göre başvuru, yolların tüketildiği tarihten itibaren otuz gün içinde yapılır; haklı mazereti nedeniyle süresi içinde başvuramayanlar, mazeretin kalktığı tarihten itibaren onbeş gün içinde ve mazeretlerini belgeleyen delillerle birlikte başvurabilir; Mahkeme önce mazeretin geçerli olup olmadığını inceler.

      **Değerlendirme:** (1) Büyükşehir Belediyesi bir kamu tüzel kişisidir. Mülkiyet hakkını ileri sürmesi bu sonucu değiştirmez; 6216 sayılı Kanun m. 46/2 ayrım yapmadan kamu tüzel kişilerini başvurudan dışlar. Başvuru ehliyet yokluğundan kabul edilemez. (2) Seçme hakkı AY m. 67 uyarınca vatandaşlara tanınmış bir haktır. (Y) yabancı olduğundan 6216 sayılı Kanun m. 46/3 gereği bu hak bakımından başvuru yapamaz; başvuru kişi bakımından yetkisizlik nedeniyle kabul edilemez. (3) (Z)'nin ana otuz günlük süresi 01.04.2025'te işlemeye başlamıştır. 10.04.2025'te geçirdiği ağır kaza ve yoğun bakımda kalışı süresinde başvurmasına engel olan, belgelenebilir bir mazerettir. Mazeret 20.05.2025'te kalkmış, (Z) 28.05.2025'te, yani onbeş gün içinde ve raporlarıyla birlikte başvurmuştur. Mahkeme önce mazeretin geçerli olup olmadığını inceleyecek; mazeret geçerli görülürse başvuru süresindedir.

      **Sonuç:** (X) ve (Y)'nin başvuruları kabul edilemez; (Z)'nin başvurusu, mazeretin geçerli görülmesi şartıyla süresindedir ve diğer kabul edilebilirlik şartları da sağlanıyorsa esasa geçilir.
  - olay: |
      İşçi (İ), işe iade davasını Yargıtay dairesinin kararıyla kaybetmiştir. Karar, ilk derece ve istinaf kararlarını ortadan kaldırarak davayı reddetmiş, ancak fesih sebebini gerekçeli biçimde karşılamamıştır. İ, başvuru yollarının tamamını tükettikten sonra süresi içinde AYM'ye bireysel başvuruda bulunmuş ve hem gerekçeli karar hakkının ihlal edildiğini hem de AYM'nin davayı doğrudan kendi lehine sonuçlandırmasını talep etmiştir. AYM, gerekçeli karar hakkının (AY m. 36) ihlal edildiğine karar vermiş ve dosyayı yeniden yargılama yapılmak üzere Yargıtay dairesine göndermiştir. Davalı işveren vekili, dairenin AYM kararına direnebileceğini ve İ'nin ayrıca yargılamanın iadesi davası açması gerektiğini ileri sürmüştür.

      1. İ'nin AYM'den davayı doğrudan kendi lehine sonuçlandırmasını istemesini değerlendiriniz.
      2. AYM'nin dosyayı Yargıtay dairesine göndermesinin hukuki dayanağı nedir?
      3. Davalı vekilinin iddialarını değerlendiriniz.
    olcut:
      - {tespit: "Kanun yolunda gözetilmesi gereken hususların incelenemeyeceği ve AYM'nin davanın esasını kendi lehine karara bağlamayacağı", puan: 20, madde: "AY m. 148"}
      - {tespit: "Bölümlerin incelemesinin ihlalin tespiti ve giderilme biçimiyle sınırlı olması", puan: 15, madde: "6216 sayılı Kanun m. 49"}
      - {tespit: "İhlal mahkeme kararından kaynaklandığı için dosyanın yeniden yargılama yapılmak üzere ilgili mahkemeye gönderilmesi", puan: 25, madde: "6216 sayılı Kanun m. 50"}
      - {tespit: "Mahkemenin ihlali ve sonuçlarını ortadan kaldıracak şekilde mümkünse dosya üzerinden karar vermesi", puan: 15, madde: "6216 sayılı Kanun m. 50"}
      - {tespit: "AYM kararlarının yargı organlarını bağlaması; dairenin ihlal tespitine direnememesi", puan: 25, madde: "AY m. 153"}
    cozum: |
      **Nitelendirme:** Olay, bireysel başvuruda AYM'nin inceleme sınırı ve ihlal kararının sonuçları (yeniden yargılama) ile ilgilidir.

      **Hukuki sorunlar:** (1) AYM davanın esasını kendi lehine karara bağlayabilir mi? (2) İhlal bir mahkeme kararından kaynaklandığında sonuç nedir? (3) Mahkeme AYM kararına direnebilir mi, ayrıca yargılamanın iadesi gerekir mi?

      **İlgili hükümler:** AY m. 148/4'e göre bireysel başvuruda kanun yolunda gözetilmesi gereken hususlarda inceleme yapılamaz. 6216 sayılı Kanun m. 49/6 bölümlerin incelemesini, bir temel hakkın ihlal edilip edilmediğinin ve ihlalin nasıl ortadan kaldırılacağının belirlenmesiyle sınırlar. 6216 sayılı Kanun m. 50/1 yerindelik denetimini ve idari işlem niteliğinde karar vermeyi yasaklar. 6216 sayılı Kanun m. 50/2'ye göre ihlal bir mahkeme kararından kaynaklanmışsa dosya, ihlali ve sonuçlarını ortadan kaldırmak için yeniden yargılama yapmak üzere ilgili mahkemeye gönderilir; mahkeme, AYM'nin ihlal kararında açıkladığı ihlali ve sonuçlarını ortadan kaldıracak şekilde mümkünse dosya üzerinden karar verir. AY m. 153'e göre AYM kararları yasama, yürütme ve yargı organlarını bağlar.

      **Değerlendirme:** (1) İ'nin AYM'den davayı kendi lehine sonuçlandırmasını istemesi, esasa ilişkin bir kanun yolu değerlendirmesi istemektir. AYM yalnız gerekçeli karar hakkının ihlal edilip edilmediğini ve ihlalin nasıl giderileceğini inceler; fesih sebebinin geçerli olup olmadığına dair maddi uyuşmazlığı kendisi karara bağlamaz. (2) İhlal Yargıtay dairesinin kararından kaynaklandığı için dosya 6216 sayılı Kanun m. 50/2 uyarınca daireye gönderilmiştir. Daire, ihlale yol açan kararını ortadan kaldırıp gerekçeli bir karar kurmak zorundadır. (3) Davalının direnme iddiası yerinde değildir; AYM kararları AY m. 153 gereği yargı organlarını bağlar ve daire ihlal tespitine direnemez. İ'nin ayrıca bir yargılamanın iadesi davası açması da gerekmez; çünkü yeniden yargılama, 6216 sayılı Kanun m. 50/2 uyarınca dosyanın gönderilmesiyle doğrudan yapılır.

      **Sonuç:** İ'nin AYM'nin davayı doğrudan kendi lehine sonuçlandırma talebi yerinde değildir; AYM ihlali tespit etmiş ve dosya yeniden yargılama için daireye gönderilmiştir. Daire AYM kararına direnemez, ihlale yol açan kararı ortadan kaldırıp ihlali giderecek şekilde, mümkünse dosya üzerinden yeniden karar verir.
kartlar:
  - on: "Bireysel başvuru hangi maddelerde düzenlenir?"
    arka: "AY m. 148/3-5 ve 6216 sayılı Kanun m. 45-51. Bu maddeler 6216 sayılı Kanun m. 76/1-a uyarınca 23/9/2012'de yürürlüğe girmiştir."
  - on: "Ortak koruma alanı nedir?"
    arka: "Hakkın hem Anayasa'da hem de Sözleşme ve Türkiye'nin taraf olduğu ek protokollerde güvence altında olması (6216 sayılı Kanun m. 45/1)."
  - on: "Bireysel başvurunun konusu olamayan işlemler?"
    arka: "Yasama işlemleri, düzenleyici idari işlemler, AYM kararları ve Anayasa'nın yargı denetimi dışında bıraktığı işlemler (6216 sayılı Kanun m. 45/3)."
  - on: "Kamu tüzel kişileri başvurabilir mi?"
    arka: "Hayır. Özel hukuk tüzel kişileri ise yalnız tüzel kişiliğe ait hakları için başvurabilir (6216 sayılı Kanun m. 46/2)."
  - on: "Yabancılar bireysel başvuruda hangi sınıra tabidir?"
    arka: "Yalnız Türk vatandaşlarına tanınan haklarla ilgili olarak başvuru yapamazlar (6216 sayılı Kanun m. 46/3)."
  - on: "Başvuru süresi nedir?"
    arka: "Yollar tüketildiği tarihten (yol yoksa ihlalin öğrenildiği tarihten) itibaren 30 gün (6216 sayılı Kanun m. 47/5)."
  - on: "Haklı mazeret hâlinde süre?"
    arka: "Mazeretin kalktığı tarihten itibaren 15 gün içinde, belgeleriyle başvurulur (6216 sayılı Kanun m. 47/5)."
  - on: "Evrak eksikliğinde verilecek süre?"
    arka: "15 günü geçmemek üzere süre verilir; tamamlanmazsa başvuru reddedilir (6216 sayılı Kanun m. 47/6)."
  - on: "Kabul edilebilirliği kim inceler?"
    arka: "Komisyonlar. Kabul edilemezlik oy birliğiyle verilir; oy birliği yoksa dosya bölümlere havale edilir; karar kesindir (6216 sayılı Kanun m. 48/3-4)."
  - on: "Önemli zarar ölçütü nasıl işler?"
    arka: "Önem taşımayan ve başvurucunun önemli bir zarara uğramadığı başvurular kabul edilemez bulunabilir; iki unsur birlikte aranır (6216 sayılı Kanun m. 48/2)."
  - on: "Tedbir kararında esas karar süresi?"
    arka: "En geç 6 ay; aksi hâlde tedbir kendiliğinden kalkar (6216 sayılı Kanun m. 49/5)."
  - on: "İhlal mahkeme kararından kaynaklanırsa ne olur?"
    arka: "Dosya yeniden yargılama için ilgili mahkemeye gönderilir; mahkeme mümkünse dosya üzerinden ihlali gideren karar verir. Yerindelik denetimi yapılamaz (6216 sayılı Kanun m. 50/1-2)."
