  - ⚠️ Sınırlama sebepleri: AY m. 33'te "başkalarının hürriyetleri", AY m. 34 ve AY m. 51'de "başkalarının hak ve özgürlükleri". "Kamu güvenliği" yalnız AİHS'in 11. maddesinin ikinci fıkrasındadır.
  - 📌 Dernek kurmak ve sendika kurmak için önceden izin gerekmez (AY m. 33/1, AY m. 51/1). Kimse üye olmaya ya da üye kalmaya zorlanamaz.
