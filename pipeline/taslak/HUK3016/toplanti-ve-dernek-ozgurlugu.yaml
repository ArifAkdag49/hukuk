  - ⚠️ Men kararı 24 saat içinde hâkime sunulur; hâkim 48 saat içinde açıklamazsa karar kendiliğinden yürürlükten kalkar. Süreleri ters yazma.
  - 📌 Silahlı Kuvvetler ve kolluk için kanunla sınırlama getirilebilir; Devlet memurları için "görevlerinin gerektirdiği ölçüde" (AY m. 33/6). AY m. 33 hükümleri vakıflara da uygulanır.
