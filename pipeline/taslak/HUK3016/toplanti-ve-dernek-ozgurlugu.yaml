doktrin: |
  ### Bildirimin niteliği ve bildirimsiz toplantının dağıtılması
  Bir görüşe göre kanundaki bildirim yükümlülüğüne uyulmaması toplantıyı kanuna aykırı hâle getirir ve kolluk toplantıyı dağıtabilir. Karşı görüşe göre (AYM ve AİHM'in tutumu) bildirim yalnız idareye önlem alma imkânı vermek içindir; barışçıl bir toplantı sırf bildirim yok diye dağıtılamaz, ama bildirim şartının kendisi Anayasa'ya aykırı değildir. Tamamen barışçıl, ani tepki niteliğindeki ve yalnız bildirim yokluğu yüzünden dağıtılan toplantı AYM'de ölçüsüz sayılmıştır. Bunun dışındaki hâller olaya göre tartılır.

  ### Toplantı yerlerinin idarece belirlenmesi
  Bir görüş, idarenin kamu düzeni gereği toplantı alanlarını sınırlı tutabileceğini söyler. Diğer görüşe göre mekân ifadenin parçasıdır ve sembolik bir yeri kategorik olarak yasaklamak ölçüsüzdür. AYM bu konuda farklı olaylarda farklı sonuçlara varmıştır; bu nedenle genel bir kural olaydan olaya değişir.

  ### Kamu görevlilerinin grev hakkı
  AİHM, kamu görevlilerinin grevine getirilen genel yasağı Enerji Yapı-Yol Sen kararında AİHS'in 11. maddesine aykırı bulmuştur. İç hukukta bunun kapsamı tartışmalıdır; konu iş hukukuna da taşar.

  ### Emeklilerin sendika hakkı
  AYM AY m. 51'in "çalışanlar" ölçütünü esas almıştır. Karşı görüş uluslararası çalışma standartlarına dayanarak emeklilere de sendika hakkı tanınmasını savunur.
sozluk:
  - terim: Bildirim
    tanim: "Toplantının yapılacağını düzenleme kurulunun valilik veya kaymakamlığa önceden duyurması; izin değil, bilgilendirmedir."
  - terim: Barışçıllık
    tanim: "Toplantı hakkının koruma şartı; katılımcıların silahsız ve saldırısız olması."
  - terim: Pozitif yükümlülük
    tanim: "Devletin yalnız müdahale etmemesi değil, hakkın etkili kullanılması için önlem alma ve özel kişilerin müdahalesine karşı korumasıdır."
  - terim: Negatif dernek özgürlüğü
    tanim: "Kimsenin bir derneğe üye olmaya veya üye kalmaya zorlanamaması (AY m. 33/2)."
  - terim: Faaliyetten men
    tanim: "Gecikmede sakınca varsa kanunla yetkili merciin derneği geçici olarak çalışmaktan alıkoyması; 24 saatte hâkime sunulur."
  - terim: Kapatma
    tanim: "Derneğin sona erdirilmesi; yalnız hâkim kararıyla yapılabilir."
  - terim: Sendikal tazminat
    tanim: "Sendikal nedenle işten çıkarma ya da ayrım yapılması hâlinde işçiye en az bir yıllık ücret tutarında ödenen tazminat (STİSK m. 25/4)."
  - terim: Sendikal ayrımcılık
    tanim: "İşçinin sendikaya üye olması, olmaması veya sendikal faaliyette bulunması nedeniyle farklı işleme tabi tutulması (STİSK m. 25)."
  - terim: Üst kuruluş
    tanim: "Sendikaların bir araya gelerek oluşturduğu federasyon ve konfederasyon gibi örgütler (AY m. 51/1)."
  - terim: Suç odağı
    tanim: "Derneğin tekrarlanan suç faaliyetinin kaynağı hâline gelmesi; kapatmanın ölçülü sayılabileceği durum."
kararlar:
  - id: "d337c2e4-6dd6-05b9-6040-dc7b448e3f01"
    ozet: |
      KESK ve Eğitim-Sen, "4+4+4" kanun teklifini protesto için 28-29 Mart 2012'de Ankara'da basın açıklaması duyurdu; Ankara Valiliği her türlü toplantıyı yasakladı. Eğitim-Sen İzmir Şubesi üyesi öğretmenlerin ve bir eğitim müfettişinin de aralarında olduğu başvurucuların grubu İzmir'den çıkarken engellendi; gece yolu kısa süre trafiğe kapatıp oturma eylemi yaptı ve polis biber gazı ve copla müdahale etti. Ertesi gün Valilik binasına yürüyen yaklaşık 800 kişilik grubun bir kısmı bariyerleri sopayla yıkmaya çalıştı; polis tazyikli su, boyalı su, biber gazı ve TOMA kullandı. AYM Genel Kurulu, birinci eylem bakımından tüm başvurucular için AY m. 34'ün ihlal edildiğine oy çokluğuyla karar verdi. İkinci eylemde bariyerleri yıkıp polise saldıran başvurucu yönünden ihlal yoktur (oy birliği); barikatı aşmaya çalıştıklarına dair emare bulunmayan, yaralanan veya önceden ihtar yapılmadan gaza maruz kalan başvurucular yönünden ihlal bulunmuştur. Karar şu ilkeleri koyar: bildirimsiz toplantı barışçıl niteliğini kaybetmez, bir kısım katılımcının şiddeti barışçıl kalanlara müdahaleyi meşrulaştırmaz, biber gazı önceden ihtar yapılmadan kullanılamaz.
  - id: "962d1ab5-9191-845b-a1e5-cb7451f7a3ca"
    ozet: |
      Manisa'da özel bir şirkette çalışan başvurucular, 7/2/2013'te "performans düşüklüğü" gerekçesiyle çıkarıldı. Petrol-İş Sendikası işyerinde örgütleniyordu; başvurucular henüz üye değildi ama sendikanın mesai dışı toplantılarına katılıyordu. Tanıklar işten atılmalarının sendikaya üye olmayı düşünmelerinden kaynaklandığını söyledi; İş Teftiş Kurulu raporu işveren vekilinin sendikal baskısını tespit etti; işyerinden toplam 1151 işçi çıkarıldı. Manisa 1. İş Mahkemesi feshin sendikal nedenle yapıldığını kabul ederek bir yıllık brüt ücret tutarında sendikal tazminata hükmetti. Yargıtay 22. Hukuk Dairesi sendikal nedenin ispatlanamadığı gerekçesiyle bu kısmı bozdu. AYM, uyuşmazlık özel kişiler arasında olduğundan devletin pozitif yükümlülükleri açısından inceleme yaptı; sendika hakkının üyelikten önceki ikna ve bilgilendirme sürecini de koruduğunu, Dairenin Mahkemenin dayandığı delilleri tartışmadan gerekçesiz bozmasının usule ilişkin güvencelerle bağdaşmadığını belirtti. AY m. 51 oy birliğiyle ihlal edildi; yeniden yargılama için dosya Yargıtay 22. Hukuk Dairesine gönderildi.
  - id: "ff3c3670-c719-383b-8725-71129a9d6228"
    ozet: |
      Düzce'deki Hint Aseel Hayvanları Koruma ve Geliştirme Derneği'nin tüzüğünde horoz müsabakası düzenlemek yer alıyordu. Doğa Koruma ve Millî Parklar Genel Müdürlüğü, hayvan dövüştürmenin yasak olduğu gerekçesiyle müsabaka başvurusunu reddetti. Polis 2013'te dernek binasında üç kez horoz dövüşü yapıldığını raporladı. Asliye Ceza Mahkemesi dernek başkanı ve üç arkadaşına Dernekler Kanununa muhalefetten onar ay hapis ve 820 TL adli para cezası verdi, hükmün açıklanmasını geri bıraktı ve derneğin feshine karar verdi; Ağır Ceza Mahkemesi itirazı reddetti. AYM, müdahalenin kanuni dayanağı olduğunu ve meşru amacın suç işlenmesinin önlenmesi olduğunu belirtti. Kapatmanın ağır bir müdahale olduğunu, ama derneğin suçun kaynağı veya odağı hâline gelmesi durumunda mümkün olduğunu, kapatmanın üyelerin mahkûmiyetinden hukuken bağımsız olduğunu ve ek ceza sayılmadığını ifade etti; dernek faaliyetinin ifade özgürlüğüyle ya da korunan başka bir hakla ilgisi yoktu. AY m. 33 ihlal edilmemiştir; karar oy birliğiyle verilmiştir.
sorular:
  - soru: |
      Toplantı ve gösteri yürüyüşü hakkıyla ilgili hangisi doğrudur?
    siklar:
      - "Hak, valiliğin vereceği izne bağlıdır."
      - "Hak, önceden izin almadan; silahsız ve saldırısız kullanılır."
      - "Hak yalnız vatandaşlara tanınmıştır ve kanunla sınırlanamaz."
      - "Hak, toplantıdan yedi gün önce mahkemeye başvurmayı gerektirir."
    dogru: 1
    aciklama: |
      AY m. 34/1'e göre herkes önceden izin almadan, silahsız ve saldırısız toplantı ve gösteri yürüyüşü düzenleme hakkına sahiptir. Hak, AY m. 34/2'deki amaçlarla ve kanunla sınırlanabilir. Kanunun aradığı bildirim izin değildir.
  - soru: |
      Aşağıdakilerden hangisi AY m. 34/2'deki toplantı ve gösteri yürüyüşü hakkının sınırlama amaçları arasında **yer almaz**?
    siklar:
      - "Genel sağlığın korunması"
      - "Suç işlenmesinin önlenmesi"
      - "Başkalarının hak ve özgürlüklerinin korunması"
      - "Kamu güvenliğinin korunması"
    dogru: 3
    aciklama: |
      AY m. 34/2 millî güvenlik, kamu düzeni, suç işlenmesinin önlenmesi, genel sağlık ve genel ahlak ile başkalarının hak ve özgürlüklerinin korunmasını sayar; "kamu güvenliği" AY'da yoktur. AİHS'in 11. maddesinin ikinci fıkrasında ise kamu güvenliği ayrıca sayılmıştır.
  - soru: |
      Bir kaymakam, derneğin binasında suç işlendiği ihbarı üzerine, gecikmede sakınca bulunduğunu belirterek kanunun verdiği yetkiyle derneği kapatmıştır. Hangisi doğrudur?
    siklar:
      - "Kaymakam gecikmede sakınca varsa derneği kapatabilir."
      - "Kaymakam derneği kapatamaz; kapatma yalnız hâkim kararıyla olur, merci en fazla faaliyetten men edebilir."
      - "Kapatma kararı 7 gün içinde Danıştay'a bildirilmelidir."
      - "Kaymakamın kararı 24 saat içinde kesinleşir."
    dogru: 1
    aciklama: |
      AY m. 33/5'e göre dernekler hâkim kararıyla kapatılır. Gecikmede sakınca varsa kanunla yetkili merci yalnız derneği faaliyetten men edebilir; bu karar 24 saat içinde görevli hâkimin onayına sunulur ve hâkim 48 saatte açıklamazsa kendiliğinden kalkar.
  - soru: |
      AY m. 33/5'e göre, derneği faaliyetten men eden merciin kararı 24 saat içinde hâkimin onayına sunulmuş, ancak hâkim 48 saat içinde kararını açıklamamıştır. Sonuç nedir?
    siklar:
      - "Karar kendiliğinden yürürlükten kalkar."
      - "Karar kesinleşir."
      - "Dernek kendiliğinden kapanır."
      - "Süre bir kez 48 saat daha uzar."
    dogru: 0
    aciklama: |
      AY m. 33/5: "Hâkim, kararını kırksekiz saat içinde açıklar; aksi halde, bu idarî karar kendiliğinden yürürlükten kalkar." Ayrıca bir iptal kararına gerek yoktur.
  - soru: |
      Mahalleli 60 kişi, belediye meclisinin kararına tepki olarak aynı akşam bildirimde bulunmadan parkta pankartla toplanmıştır. Kimse silahlı değildir, kimse saldırmamıştır. Kolluk bir kez anons yapıp 3 dakika sonra, zor kullanılacağını ihtar etmeden biber gazı sıkarak grubu dağıtmıştır. AYM içtihadına göre hangisi doğrudur?
    siklar:
      - "Bildirim yapılmadığı için toplantı barışçıl sayılmaz ve dağıtma meşrudur."
      - "Biber gazı kullanımı her koşulda Anayasa'ya aykırıdır."
      - "Tamamen barışçıl ve ani tepki niteliğindeki toplantıyı yalnız bildirim yok diye ihtarsız gazla dağıtmak ölçüsüzdür."
      - "Ani tepki toplantılarına AY m. 34 uygulanmaz."
    dogru: 2
    aciklama: |
      Bildirimsiz toplantı bu yüzden barışçıl niteliğini kaybetmez; ani tepki niteliğindeki barışçıl eylemi yalnız bildirim yok diye dağıtmak ölçüsüzdür. Biber gazı da tek başına ihlal değildir, ama önceden ihtar yapılması gerekir (Ali Rıza Özer).
  - soru: |
      Bir gösteride yaklaşık yüz kişi barışçıl biçimde yürürken iki kişi polise taş atmıştır. Polis, taş atanlarla birlikte tüm grubu dağıtmıştır. AYM'nin Ali Rıza Özer kararındaki ilkelerine göre hangisi doğrudur?
    siklar:
      - "Bir kısım katılımcının şiddeti, barışçıl kalanlara müdahaleyi meşrulaştırır."
      - "Şiddete başvuranların varlığı, bütün toplantıyı korumadan çıkarır."
      - "Bir kısım katılımcının şiddeti, barışçıl kalanlara yönelik müdahaleyi meşrulaştırmaz."
      - "Bu hâlde AY m. 34 uygulanmaz."
    dogru: 2
    aciklama: |
      AYM'ye göre bir kısım katılımcının şiddeti barışçıl kalanlara müdahaleyi meşrulaştırmaz. Şiddet niyetli katılımcı ise korumanın dışında kalır; sopayla bariyerleri yıkıp polise saldıran başvurucu yönünden ihlal bulunmamıştır.
  - soru: |
      Hangisi AY m. 33 ve AY m. 51'de ortak bir güvence olarak bulunur?
    siklar:
      - "Kimse derneğe veya sendikaya üye olmaya ya da üyelikten ayrılmaya zorlanamaz."
      - "Hak yalnız işçilere tanınmıştır."
      - "Kapatma kararı yalnız valilik tarafından verilir."
      - "Kurma önceden bakanlık iznine bağlıdır."
    dogru: 0
    aciklama: |
      AY m. 33/2'ye göre kimse derneğe üye olmaya ve üye kalmaya, AY m. 51/1'e göre sendikaya üye olmaya ya da üyelikten ayrılmaya zorlanamaz. Her iki hak da önceden izin almaksızın kullanılır.
  - soru: |
      Mehmet 10 Mart'ta e-Devlet üzerinden sendikasına çekilme bildiriminde bulunmuştur. STİSK m. 19/3'e göre çekilmesi ne zaman geçerlilik kazanır?
    siklar:
      - "Bildirimin yapıldığı gün"
      - "Bildirim tarihinden itibaren bir ay sonra"
      - "Bildirim tarihinden itibaren otuz gün sonra, sendikanın kabulüyle"
      - "Sendikanın genel kurulu çekilmeyi kabul ettiğinde"
    dogru: 1
    aciklama: |
      STİSK m. 19/3: "Çekilme, sendikaya bildirim tarihinden itibaren bir ay sonra geçerlilik kazanır." Çekilme sendikanın kabulüne bağlı değildir. Otuz günlük süre üyelik başvurusunun reddi içindir (STİSK m. 17/5).
  - soru: |
      Zeynep, sendikanın mesai sonrası bilgilendirme toplantılarına katılmıştır ancak henüz üye değildir. İşveren bir hafta sonra "verim düşüklüğü" gerekçesiyle iş sözleşmesini feshetmiştir. Zeynep, feshin sendikal nedene dayandığını ileri sürmektedir. Hangisi doğrudur?
    siklar:
      - "Zeynep üye olmadığı için STİSK m. 25 koruması uygulanmaz."
      - "Feshin nedenini işveren ispatlar; feshin ileri sürülen nedene dayanmadığını söyleyen Zeynep, sendikal nedeni ispatlamakla yükümlüdür."
      - "Sendikal nedeni ispat yükü tamamen işverendedir."
      - "Sendikal tazminat ancak işçi işe iade edilirse verilir."
    dogru: 1
    aciklama: |
      STİSK m. 25/3 iş saatleri dışında sendikal faaliyete katılma nedeniyle işten çıkarmayı yasaklar; STİSK m. 25/6'ya göre feshin nedenini işveren ispatlar, işçi sendikal nedeni ispatlar. Sendikal tazminat işe başlatma şartına bağlı değildir (STİSK m. 25/5).
  - soru: |
      STİSK m. 25'e göre sendikal tazminatla ilgili hangisi doğrudur?
    siklar:
      - "Sendikal tazminat altı aylık ücretten az olamaz."
      - "Sendikal tazminat işçinin bir yıllık ücret tutarından az olmamak üzere hükmedilir."
      - "Sendikal tazminat yalnız işe iade davası kazanılırsa istenebilir."
      - "Sendikal tazminat iki yıllık ücret tutarında sabittir."
    dogru: 1
    aciklama: |
      STİSK m. 25/4: işçinin bir yıllık ücret tutarından az olmamak üzere sendikal tazminata hükmedilir. STİSK m. 25/5'e göre işçinin işe iade davası açmaması sendikal tazminat talebini engellemez.
  - soru: |
      AYM'nin Anıl Pınar ve Ömer Bilge kararına göre hangisi doğrudur?
    siklar:
      - "Sendika hakkı yalnız üyelik kazanıldıktan sonra korunur."
      - "Özel işverenin müdahalesinde devletin sendika hakkını koruma yükümlülüğü yoktur."
      - "Sendika hakkı üyelikten önceki ikna ve bilgilendirme faaliyetlerine katılımı da korur."
      - "Yargıtay'ın gerekçesiz bozması ihlal oluşturmaz."
    dogru: 2
    aciklama: |
      AYM, sendika hakkının üyelikten önceki ikna ve bilgilendirme sürecini de koruduğunu ve devletin özel işverene karşı da pozitif yükümlülüğü bulunduğunu belirtmiştir. Mahkemenin dayandığı delilleri tartışmadan gerekçesiz bozma, usule ilişkin güvencelerle bağdaşmadığından AY m. 51 ihlal bulunmuştur.
  - soru: |
      AYM'nin Hint Aseel kararına göre hangisi doğrudur?
    siklar:
      - "Dernek kapatılması hiçbir hâlde AY m. 33'e uygun olamaz."
      - "Kapatma, üyelerin mahkûmiyetine bağlıdır ve onlara ek ceza sayılır."
      - "Derneğin suç odağı hâline gelmesi durumunda mahkeme kararıyla kapatılması AY m. 33'ün ihlali sayılmamıştır."
      - "Dernek faaliyeti ifade özgürlüğü kapsamında olduğu için kapatma ihlal oluşturmuştur."
    dogru: 2
    aciklama: |
      AYM, kapatmanın ağır bir müdahale olduğunu, ama derneğin suçun kaynağı veya odağı hâline gelmesi hâlinde mümkün olduğunu belirtmiş, kapatmanın üyelerin mahkûmiyetinden bağımsız olduğunu ve ek ceza sayılmadığını ifade etmiştir. Dernek faaliyetinin ifade özgürlüğüyle ilgisi bulunmamıştır; AY m. 33 ihlal edilmemiştir.
olaylar:
  - olay: |
      Bir belediye meclisi, mahalledeki parkın otoparka çevrilmesine karar verir. Kararın açıklandığı akşam 60 mahalleli, hiçbir bildirim yapmadan parkta pankart açarak toplanır. Kimse silah taşımaz, kimse kimseye saldırmaz; slogan atılır ve belediyeden karardan dönmesi talep edilir. Kolluk "Bildirim yapılmadığı için toplantı yasadışıdır" diye bir kez anons yapar ve zor kullanılacağına dair hiçbir ihtarda bulunmadan üç dakika sonra biber gazı sıkarak grubu dağıtır. Katılımcılardan Zeynep gazdan etkilenerek hastaneye kaldırılır. Zeynep ve diğer mahalleliler, iç hukuk yollarını tükettikten sonra Anayasa Mahkemesine bireysel başvuru yaparlar.

      1. Mahallelilerin kullandığı hak hangisidir ve bu hakkın kullanılması için izin gerekir mi?
      2. Kolluğun dağıtması bir müdahale midir?
      3. Toplantı, bildirim yapılmadığı için barışçıl niteliğini kaybetmiş midir?
      4. Önceden ihtar yapılmadan biber gazı kullanılmasının hukuki sonucu nedir?
      5. İnceleme sonucunda AYM'nin ulaşacağı sonuç nedir?
    olcut:
      - {tespit: "Toplantı ve gösteri yürüyüşü düzenleme hakkı önceden izin almadan kullanılır; bildirim izin değildir", puan: 15, madde: "AY m. 34/1"}
      - {tespit: "Dağıtma, hakka yönelik müdahaledir; sınırlama yalnız kanunla ve sebeplere bağlı olarak yapılabilir", puan: 15, madde: "AY m. 13"}
      - {tespit: "Silahsız ve saldırısız katılımcılar barışçıldır; bildirimsizlik barışçıllığı ortadan kaldırmaz", puan: 20, madde: "AY m. 34/1"}
      - {tespit: "Ani tepki niteliğindeki barışçıl eylemi yalnız bildirim yokluğu nedeniyle dağıtmak ölçüsüzdür; kolluktan sabır beklenir", puan: 20, madde: "AY m. 13"}
      - {tespit: "Biber gazı tek başına ihlal değildir ama önceden ihtar yapılmalıdır; ihtarsız kullanım ihlale yol açar", puan: 15, madde: "AY m. 34/2"}
      - {tespit: "Sonuç: AY m. 34 ihlali", puan: 15, madde: "AY m. 34"}
    cozum: |
      **Nitelendirme:** Olay, ani tepki niteliğindeki barışçıl bir toplantının bildirim yapılmadığı gerekçesiyle zor kullanılarak dağıtılmasına ilişkindir. İlgili hak toplantı ve gösteri yürüyüşü düzenleme hakkıdır (AY m. 34).

      **Hukuki sorunlar:** (1) Barışçıl nitelik; (2) müdahalenin varlığı; (3) kanunilik, meşru amaç ve ölçülülük; (4) ihtarsız gaz kullanımı.

      **İlgili hükümler:** AY m. 34/1 hakkı "önceden izin almadan, silahsız ve saldırısız" kullanma imkânı verir. AY m. 34/2, hakkın ancak sayılan amaçlarla ve kanunla sınırlanabileceğini; AY m. 34/3 şekil, şart ve usulün kanunda gösterileceğini söyler. 2911 sayılı Kanun m. 10 bildirimi, toplantıdan en az kırksekiz saat önce yapılacak bir yükümlülük olarak düzenler. AY m. 13 ise sınırlamanın özüne dokunamayacağını ve ölçülülük ilkesine aykırı olamayacağını belirtir.

      **Değerlendirme:** Katılımcıların silah taşımaması ve saldırmaması barışçıl niteliklerini gösterir. Bildirimin yapılmamış olması bu niteliği ortadan kaldırmaz; bildirim, idareye önlem alma imkânı vermeyi amaçlayan bir usul kuralıdır ve AY m. 34/1'e göre hakkın kullanılması izne bağlı değildir. Kolluğun dağıtması, toplantı sırasındaki müdahaledir ve sınırlama sayılır. Müdahalenin meşru amacı kamu düzeninin korunması olarak ileri sürülebilir; ama ölçülülük bakımından toplantı, belediye kararına karşı ani tepki niteliğindedir ve önceden bildirim imkânı yoktur. AYM'nin yaklaşımına göre bu tür bir eylemi yalnız bildirimin yapılmaması gerekçesiyle dağıtmak ölçüsüzdür; kolluktan hoşgörü ve sabır beklenir. Ayrıca biber gazı kullanımı kendi başına ihlal değildir, ama zor kullanımından önce ihtar yapılması gerekir. Somut olayda yalnızca bir anons yapılmış, zor kullanılacağı ihtar edilmemiştir. Katılımcıların bir kısmının şiddetine ilişkin de hiçbir veri yoktur.

      **Sonuç:** Müdahale demokratik toplumda gerekli ve ölçülü değildir; AYM'nin yerleşik yaklaşımına göre AY m. 34 ihlal edilmiştir.
  - olay: |
      X Tekstil A.Ş.'de çalışan Zeynep, bir işçi sendikasının mesai sonrası düzenlediği bilgilendirme toplantılarına katılmaktadır, ancak henüz sendikaya üye değildir. İşveren, toplantılara katılımdan bir hafta sonra Zeynep'in iş sözleşmesini "verim düşüklüğü" gerekçesiyle feshetmiştir. Verim düşüklüğüne ilişkin hiçbir belge yoktur. Aynı hafta toplantılara katılan 30 işçi daha işten çıkarılmıştır. Zeynep işe iade davası açmayıp doğrudan sendikal tazminat davası açar. İş mahkemesi, delilleri değerlendirerek feshin sendikal nedenle yapıldığını kabul eder ve sendikal tazminata hükmeder. Yargıtay dairesi ise, mahkemenin dayandığı tanık beyanları ve toplu çıkarma olgusunu tartışmadan, sendikal nedenin ispatlanamadığı gerekçesiyle bu kısmı bozar. Zeynep Anayasa Mahkemesine bireysel başvuru yapar.

      1. Zeynep üye olmadığı hâlde sendikal faaliyete katıldığı için korunur mu?
      2. İspat yükü nasıl dağılır?
      3. Sendikal tazminatın alt sınırı nedir ve işe başlatma şartı aranır mı?
      4. Zeynep işe iade davası açmamışsa sendikal tazminat isteyebilir mi?
      5. Yargıtay'ın gerekçesiz bozması bakımından AYM hangi sonuca ulaşır?
    olcut:
      - {tespit: "Sendika hakkı özel işverene karşı da korunur; üyelikten önceki ikna ve bilgilendirme sürecine katılım da güvence altındadır", puan: 20, madde: "AY m. 51/1"}
      - {tespit: "İşçi, iş saatleri dışında sendikal faaliyete katıldığı için işten çıkarılamaz", puan: 15, madde: "STİSK m. 25/3"}
      - {tespit: "Feshin nedenini işveren, feshin sendikal nedene dayandığını işçi ispatlar", puan: 15, madde: "STİSK m. 25/6"}
      - {tespit: "Sendikal tazminat işçinin bir yıllık ücret tutarından az olamaz", puan: 15, madde: "STİSK m. 25/4"}
      - {tespit: "Sendikal tazminat işe başlatma şartına bağlı değildir; işe iade davası açılmamış olması tazminat talebini engellemez", puan: 15, madde: "STİSK m. 25/5"}
      - {tespit: "Mahkemenin dayandığı delilleri tartışmadan gerekçesiz bozma, devletin pozitif yükümlülüğü bakımından AY m. 51 ihlali oluşturur", puan: 20, madde: "AY m. 51"}
    cozum: |
      **Nitelendirme:** Olay, özel işverenin sendikal nedenle iş sözleşmesini feshetmesi ve yargı yolunda gerekçesiz bozma nedeniyle sendika hakkının ihlal edilip edilmediğine ilişkindir. Uyuşmazlık iki özel kişi arasında olduğundan AYM, devletin pozitif yükümlülükleri açısından inceleme yapar.

      **Hukuki sorunlar:** (1) Üye olmayan işçinin korunması; (2) ispat yükü; (3) sendikal tazminatın miktarı ve şartları; (4) Yargıtay'ın bozma gerekçesi.

      **İlgili hükümler:** AY m. 51/1, çalışanlara önceden izin almaksızın sendika kurma, serbestçe üye olma ve çekilme haklarını verir. STİSK m. 25/3'e göre işçiler, iş saatleri dışında veya işverenin izniyle iş saatleri içinde sendikal faaliyete katılmaları nedeniyle işten çıkarılamaz. STİSK m. 25/4'e göre aykırılıkta işçinin bir yıllık ücret tutarından az olmamak üzere sendikal tazminata hükmedilir. STİSK m. 25/5'e göre sendikal tazminat, işe başlatma şartına bağlı değildir ve işçinin işe iade davası açmaması bu talebi engellemez. STİSK m. 25/6'ya göre feshin nedenini ispat yükü işverendedir; feshin sendikal nedene dayandığını iddia eden işçi bunu ispatlar.

      **Değerlendirme:** Zeynep henüz üye olmasa da sendika hakkı, üyelikten önceki ikna ve bilgilendirme faaliyetlerine katılımı da korur; dolayısıyla STİSK m. 25/3'ün korumasından yararlanır. İşveren "verim düşüklüğü" iddiasını belge ile ispatlayamamıştır; Zeynep'in sendikal nedeni göstermesi gerekir ve tanık beyanları ile aynı hafta çıkarılan 30 işçi bu bağlamda önemli olgulardır. Sendikal tazminat alt sınırı bir yıllık ücrettir, işe başlatma şartı aranmaz ve işe iade davası açılmaması engel değildir. Yargıtay dairesi, ilk derece mahkemesinin dayandığı bu delilleri hiç tartışmadan sendikal nedenin ispatlanamadığını söylerse, ilgili karar "konuyla ilgili ve yeterli gerekçe" ölçütünü karşılamaz. Devlet, özel işverenin müdahalesine karşı caydırıcı yaptırımlar öngörmek ve mahkemelerin yeterli gerekçeyle karar vermesini sağlamakla yükümlüdür.

      **Sonuç:** AYM'nin Anıl Pınar ve Ömer Bilge kararındaki yaklaşımına göre AY m. 51 ihlal edilmiştir; dosya yeniden yargılama için Yargıtay'a gönderilir.
kartlar:
  - on: "AY m. 34/1'e göre toplantı hakkı nasıl kullanılır?"
    arka: "Önceden izin almadan, silahsız ve saldırısız. Bildirim kanundan gelir ve izin değildir."
  - on: "2911 sayılı Kanun m. 10'a göre bildirim ne zaman ve kime verilir?"
    arka: "Toplantıdan en az kırksekiz saat önce ve çalışma saatleri içinde, toplantı yerinin bağlı olduğu valilik veya kaymakamlığa; düzenleme kurulu üyelerinin tamamı imzalar."
  - on: "AY m. 33, AY m. 34 ve AY m. 51'de sınırlama sebeplerinin farkı nedir?"
    arka: "Liste aynıdır (millî güvenlik, kamu düzeni, suç, genel sağlık, genel ahlak). Fark: AY m. 33'te 'başkalarının hürriyetleri', AY m. 34 ve AY m. 51'de 'hak ve özgürlükleri'. 'Kamu güvenliği' yalnız AİHS'in 11. maddesinin ikinci fıkrasındadır."
  - on: "Negatif dernek özgürlüğü nedir?"
    arka: "Kimsenin bir derneğe üye olmaya ve dernekte üye kalmaya zorlanamaması (AY m. 33/2). Sendikada AY m. 51/1 aynı güvenceyi verir."
  - on: "Dernek kim tarafından kapatılabilir?"
    arka: "Yalnız hâkim kararıyla. İdari merci gecikmede sakınca varsa yalnız faaliyetten men edebilir (AY m. 33/5)."
  - on: "Faaliyetten men kararında 24 ve 48 saat kuralı nedir?"
    arka: "Merci kararı 24 saat içinde hâkimin onayına sunar; hâkim 48 saat içinde açıklamazsa karar kendiliğinden yürürlükten kalkar (AY m. 33/5)."
  - on: "AY m. 33/6 kimlere sınırlama getirilmesine izin verir?"
    arka: "Silahlı Kuvvetler ve kolluk mensuplarına; Devlet memurlarına ise 'görevlerinin gerektirdiği ölçüde'."
  - on: "Sendika hakkı kimlere tanınmıştır?"
    arka: "Çalışanlara ve işverenlere (AY m. 51/1). Dernek hakkı ise herkese tanınmıştır."
  - on: "Üyelikten çekilme ne zaman geçerli olur?"
    arka: "Sendikaya bildirim tarihinden itibaren bir ay sonra (STİSK m. 19/3)."
  - on: "Sendikal tazminatın alt sınırı ve şartları nelerdir?"
    arka: "İşçinin bir yıllık ücret tutarından az olamaz; işe başlatma şartına bağlı değildir; işe iade davası açılmamış olması engel değildir (STİSK m. 25/4 ve 25/5)."
  - on: "Sendikal fesihte ispat yükü kimdedir?"
    arka: "Feshin nedenini işveren ispatlar; feshin ileri sürülen nedene dayanmadığını söyleyen işçi, sendikal nedeni ispatlar (STİSK m. 25/6)."
  - on: "Ali Rıza Özer kararının temel ilkeleri nelerdir?"
    arka: "Bildirimsiz toplantı barışçıl niteliğini kaybetmez; bir kısım katılımcının şiddeti barışçıl kalanlara müdahaleyi meşrulaştırmaz; biber gazı önceden ihtar yapılarak kullanılabilir."
