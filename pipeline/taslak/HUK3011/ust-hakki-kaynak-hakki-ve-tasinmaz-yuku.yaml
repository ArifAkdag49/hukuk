    tanim: "Ayrı sayfaya taşınmaz olarak kaydedilebilen hak. Süreklilik için hak süresiz veya en az otuz yıl süreli olmalı; en az otuz yıl için kurulan üst hakkı süreklidir (TMK m. 998/3, TMK m. 826/3)."
  - terim: Ayrı sayfaya kayıt
    tanim: "Bağımsız ve sürekli hakkın tapu kütüğünde taşınmaz olarak ayrı bir sayfaya yazılması. Hak sahibinin istemiyle yapılır (TMK m. 826/3, TMK m. 704)."
  - terim: Süresinden önce devir
    tanim: "Üst hakkı sahibi ağır aykırılıkta bulunursa malikin hakkın kendisine devrini istemesi. Uygun bedel karşılığındadır (TMK m. 831 ve TMK m. 832)."
  - terim: Uygun bedel
    tanim: "Erken devirde malikin, kendisine geçecek yapılar için ödeyeceği karşılık. Üst hakkı sahibinin kusuru indirim sebebi olabilir (TMK m. 832/1)."
  - terim: Bedel ipoteği
    tanim: "Süre sonunda ödenmeyen bedel için, terkin edilen hak yerine aynı derecede ve sırada üç ay içinde tescil edilen ipotek (TMK m. 829/2-3)."
  - terim: İrat güvencesi ipoteği
    tanim: "Üst hakkı karşılığı irat borçlanılmışsa malikin isteyebileceği, en çok üç yıllık irat için kanunî ipotek (TMK m. 834)."
  - terim: Kaynak hakkı
    tanim: "Başkasının arazisindeki kaynak üzerinde kurulan ve o arazinin malikini suyun alınmasına ve akıtılmasına katlanmakla yükümlü kılan irtifak (TMK m. 837/1)."
  - terim: Taşınmaz yükü
    tanim: "Malikin yalnız taşınmazla sorumlu olmak üzere bir şey vermek veya yapmakla yükümlü olduğu, tescille kurulan ayni hak (TMK m. 839/1, TMK m. 840/1)."
  - terim: Yükten kurtarma
    tanim: "Taşınmaz yükünün, sicilde gösterilen miktar üzerinden ortadan kaldırılması. Alacaklı veya yükümlü, kanundaki hallerde isteyebilir (TMK m. 844 - TMK m. 846)."
  - terim: Kamu hukukuna ilişkin taşınmaz yükü
    tanim: "Kamu hukukundan doğan yük. Aksine hüküm yoksa tescili gerekmez (TMK m. 841/1)."
  - terim: İrat senedi
    tanim: "Taşınmaz üzerinde taşınmaz yükü şeklinde kurulmuş bir alacak hakkı meydana getiren senet. Kişisel borç doğurmaz (TMK m. 903)."
  - terim: Yenilik doğuran hak
    tanim: "Tek taraflı bir beyanla hukuki durumu değiştiren hak. Yargıtay bir kararında malikin erken devir hakkını bu biçimde nitelendirmiştir."

kararlar:
  - id: "869787000"
    ozet: |
      Hazine adına kayıtlı iki parsel, mevzi imar planıyla turistik tesis alanında kalmış; taşınmazlar davalı şirkete kiraya verilmiş ve 2005 tarihli resmî senetle şirket lehine 49 yıllık, bağımsız ve sürekli üst hakkı kurulmuştur. İmar planı ve kiraya verme işlemi sonradan idari yargıda iptal edilmiş, Hazine üst hakkının terkini ile bedel ve cezai şartı, şirket ise karşı davada peşin bedelin iadesini, muhdesat bedelini ve kâr kaybını istemiştir. Yargıtay 7. Hukuk Dairesi, Hazine'nin temyizini reddedip şirketin temyizini kabul ederek hükmü oy birliğiyle bozmuştur. Gerekçede TMK m. 828-830'un sona ermenin sonuçlarını düzenlediği, sebeplerini saymadığı ve irtifakın genel sona erme sebeplerinin kıyasen uygulandığı belirtilmiştir. TMK m. 831 emredici sayılmış; erken devir ağır ihlale bağlanmış ve TMK m. 2 ile TMK m. 4 çerçevesinde hâkimce değerlendirileceği ifade edilmiştir. Kararın bu bölümü tek kararın gerekçesidir: Erken devir hakkı yenilik doğuran hak, TMK m. 832'deki bedelin ödenmesi bir def'i, bedel ise tazminat değil yapıların karşılığı sayılmıştır. İptal geriye etkili olduğundan şirket, ilk yıl bedelini ve bir parseldeki imalatın değerini sebepsiz zenginleşmeye göre isteyebilir; kâr kaybı isteyemez.
  - id: "928021200"
    ozet: |
      Devlet ormanından ayrılan geniş bir alan ihdasen Hazine adına tescil edilmiş, aynı senetle davalı şirket lehine 49 yıllık üst hakkı kurulmuş ve bu hak bağımsız ve sürekli hak olarak ayrı sayfaya kaydedilmiştir. Sonradan bu hak üzerinde kat irtifakı kurulmuş, bağımsız bölümlerde üçüncü kişiler lehine intifa hakları tesis edilmiştir. Davacı idare bunların yolsuz tescil sayılıp terkinini istemiş, şirket davayı kabul etmiştir. İlk derece mahkemesi davayı kabul etmiş, istinaf mahkemesi ayrı sayfadaki hakkın TMK anlamında taşınmaz sayılsa da Kat Mülkiyeti Kanunu anlamında taşınmaz olmadığını belirterek istinafı reddetmiştir. Yargıtay 7. Hukuk Dairesi, oy çokluğuyla ve usul sebepleriyle (bağımsız bölümlerdeki ipotek, haciz gibi hak sahiplerinin davaya dahil edilmesi, infaza elverişli hüküm, harç, asli müdahale taleplerinin incelenmesi) istinaf kararını kaldırmış ve ilk derece kararını bozmuştur. Gerekçede ayrı sayfaya kaydın TMK m. 704, TMK m. 826 ve TMK m. 998'e göre mümkün olduğu, otuz yılın süreklilik, devrin kısıtlanmamasının bağımsızlık için gerekli olduğu, resmî senet kayıtlarının ayni etkili olduğu belirtilmiş; üst hakkı üzerinde kat irtifakı kurulup kurulamayacağına esastan cevap verilmemiştir.
  - id: "1180984700"
    ozet: |
      Davacı şirket lehine 2015 tarihli sözleşme ve 2020 tarihli ek protokolle 20 yıllık üst hakkı kurulmuş ve ticari bina yapılmıştır. Davacı beklediği faydayı bulamayınca 2020'de sözleşmeyi feshedip taşınmazı teslim etmiş; TMK m. 832'nin emredici olduğunu ileri sürerek yapı bedelini ve üst hakkı şerhinin terkinini istemiştir. Davalı, erken devir hakkının malike tanındığını ve sözleşmedeki bedelsizlik kaydını savunmuştur. İlk derece ve istinaf mahkemeleri davayı reddetmiş, Yargıtay 7. Hukuk Dairesi duruşmalı inceleme sonunda oy birliğiyle onamıştır. İlk derece mahkemesi, üst hakkı sahibinin sözleşmeyi süresinden önce haklı sebeple sona erdirmesine ilişkin kanunda bir düzenleme bulunmadığını, sözleşmenin 16. maddesinde erken fesihte yapının bedelsiz olarak arsa malikine bırakılacağının kararlaştırıldığını, tacir olan davacının işlem temelinin çöktüğünü ispatlayamadığını ve önce uyarlama istemesi gerektiğini belirtmiştir. İstinaf mahkemesi de bu kaydın emredici hükümlere aykırı olmadığını ve TBK m. 138'deki şartların gerçekleşmediğini kabul etmiştir. Hak 20 yıllık olduğundan otuz yıllık süreklilik eşiğinin altındadır; kararda da "üst irtifak hakkı şerhi"nden söz edilir. Karar, üst hakkı sahibinin erken çıkışında sözleşmedeki bedelsizlik kaydının geçerli sayıldığı bir örnektir.

sorular:
  - soru: |
      Türk Medeni Kanunu'na göre üst hakkının konusu hangisidir?
    siklar:
      - "Başkasının arazisinde bulunan kaynaktan su almak"
      - "Başkasının arazisinin altında veya üstünde yapı yapmak ya da mevcut bir yapıyı muhafaza etmek"
      - "Başkasının binasında yaşadığı sürece oturmak"
      - "Taşınmazın değeriyle güvenceli bir edimi yerine getirmek"
    dogru: 1
    aciklama: |
      TMK m. 826/1'e göre üst hakkı, malikin üçüncü kişi lehine arazisinin altında veya üstünde yapı yapmak veya mevcut bir yapıyı muhafaza etmek yetkisi veren irtifaktır. Su alma kaynak hakkının (TMK m. 837), oturma oturma hakkının (TMK m. 823), edim yükümlülüğü ise taşınmaz yükünün (TMK m. 839) konusudur.

  - soru: |
      Köy derneği lehine, başkasının arsasında futbol sahası olarak kullanılmak üzere irtifak hakkı kurulmuştur. Sözleşmede devirle ilgili bir hüküm yoktur. Dernek hakkı bir spor kulübüne devretmek istemektedir. Hangisi doğrudur?
    siklar:
      - "Devredemez; aksi kararlaştırılmadıkça bu irtifaklar devredilmez ve mirasçılara geçmez."
      - "Devredebilir; bütün irtifaklar aksi kararlaştırılmadıkça devredilebilir."
      - "Yalnız malikin yazılı onayıyla devredebilir; onay yoksa devir geçersizdir."
      - "Devredebilir; ancak devir tapuya tescil edilmedikçe geçerli olmaz ve hak sona erer."
    dogru: 0
    aciklama: |
      Futbol sahası olarak kullanma, TMK m. 838/1'de örnek verilen "diğer irtifak haklarındandır". TMK m. 838/2'ye göre bu haklar, aksi kararlaştırılmadıkça başkasına devredilemez ve mirasçılara geçmez. Üst hakkı ve kaynak hakkında kural tersidir (TMK m. 826/2 ve TMK m. 837/2); yaygın yanılgı bu kuralı bütün irtifaklara genellemektir.

  - soru: |
      Ayten, arsası üzerinde Barış lehine 25 yıllık üst hakkı kurar. Barış, hakkın ayrı sayfaya taşınmaz olarak kaydedilmesini ister. Hangisi doğrudur?
    siklar:
      - "Kayıt yapılabilir; üst hakkı süresi ne olursa olsun ayrı sayfaya kaydedilebilir."
      - "Kayıt yapılamaz; ayrı sayfa için hakkın en az otuz yıl süreli olması gerekir, ancak 25 yıllık üst hakkı geçerli bir irtifaktır."
      - "Kayıt yapılamaz; 25 yıllık üst hakkı hiç kurulamaz."
      - "Kayıt yapılabilir; ancak yalnız Ayten'in istemiyle."
    dogru: 1
    aciklama: |
      TMK m. 826/3'e göre ayrı sayfaya kayıt için hakkın bağımsız ve sürekli olması gerekir; en az otuz yıl için kurulan üst hakkı sürekli sayılır (ayrıca TMK m. 998/3). 25 yıllık hak bu eşiğin altındadır, ama üst hakkı olarak geçerlidir. Kayıt, üst hakkı sahibinin istemi üzerine yapılır; malikin istemi aranmaz.

  - soru: |
      Üst hakkının tapu kütüğüne ayrı sayfada taşınmaz olarak kaydedilmesiyle ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Kayıt, üst hakkı kurulurken resen yapılır; hak sahibinin istemine gerek yoktur."
      - "Kayıt zorunludur; kayıt yapılmazsa üst hakkı doğmaz."
      - "Kayıt, hak sahibinin istemi üzerine yapılan bir imkândır; ayrı sayfası olmayan üst hakkı da geçerlidir."
      - "Kayıt yalnız kamu tüzel kişileri lehine kurulan haklar için mümkündür."
    dogru: 2
    aciklama: |
      TMK m. 826/3, bağımsız ve sürekli üst hakkının "üst hakkı sahibinin istemi üzerine" taşınmaz olarak kaydedilebileceğini söyler. Kayıt zorunlu değildir. Üst hakkı irtifak olarak tescille kurulur (TMK m. 780/1); ayrı sayfa yalnız hakkı taşınmaz gibi işlem görebilir hâle getirir (TMK m. 704).

  - soru: |
      Mehmet'in arsası üzerinde bir vakıf lehine 49 yıllık üst hakkı kurulmuş ve vakıf, hakka dayanarak arsada hastane inşa etmiştir. Hastane binasının mülkiyeti 49 yıl boyunca kime aittir?
    siklar:
      - "Arsa maliki Mehmet'e; çünkü yapı arazinin bütünleyici parçasıdır ve üst hakkı bunu değiştirmez."
      - "Vakfa; üst irtifakına dayalı olarak sürekli kalmak üzere yapılan yapının mülkiyeti irtifak hakkı sahibine aittir."
      - "Mehmet ve vakfa paylı mülkiyet olarak."
      - "Hastane binası mülkiyet konusu olamaz; yalnız kullanım hakkı vardır."
    dogru: 1
    aciklama: |
      TMK m. 726/1'e göre üst irtifakına dayalı olarak başkasına ait arazinin altında veya üstünde sürekli kalmak üzere inşa edilen yapıların mülkiyeti irtifak hakkı sahibine aittir. Yapının arazinin bütünleyici parçası olması kuralı süre bitince geri döner (TMK m. 828/1). Paylı mülkiyet kanunda öngörülen bir sonuç değildir.

  - soru: |
      Kat mülkiyeti kurulmuş bir apartmanda 5 numaralı dairenin maliki Ali, daire üzerinde Burak lehine üst hakkı kurmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Kurulabilir; üst hakkı her taşınmaz üzerinde kurulur."
      - "Kurulamaz; bağımsız bölümler üzerinde ayrıca üst hakkı kurulamaz."
      - "Kurulabilir; yalnız kat maliklerinin oybirliği gerekir."
      - "Kurulabilir; ancak en çok otuz yıl için."
    dogru: 1
    aciklama: |
      TMK m. 726/3 açıktır: Bağımsız bölümler üzerinde ayrıca üst hakkı kurulamaz. Bu, üst hakkı üzerinde kat irtifakı kurulup kurulamayacağı sorusundan farklıdır; o soru tartışmalıdır, ama bağımsız bölüm üzerinde üst hakkı kurulamaması tartışmasızdır.

  - soru: |
      Zeynep'in arazisindeki üst hakkının resmî senedinde yapının yalnız konut olarak kullanılacağı yazılıdır. Hak sahibi Mehmet, hakkı Kemal'e devretmiştir. Kemal, "Bu kayıt Mehmet'le Zeynep'in kişisel anlaşmasıdır" diyerek binayı otel yapmak istiyor. Hangisi doğrudur?
    siklar:
      - "Kayıt yalnız Mehmet'i bağlar; Kemal serbesttir."
      - "Kayıt, tapuya şerh edilmedikçe Kemal'i bağlamaz."
      - "Resmî senetteki özgülenme amacına ilişkin sözleşme kayıtları herkes için bağlayıcıdır; Kemal de bağlıdır."
      - "Özgülenme amacı kaydı geçersizdir; üst hakkı sahibi yapıyı diledikçe kullanabilir."
    dogru: 2
    aciklama: |
      TMK m. 827'ye göre üst hakkının içerik ve kapsamıyla ilgili olarak resmî senette yer alan, özellikle yapının konumuna, şekline, niteliğine, boyutlarına, özgülenme amacına ve boş alandan faydalanmaya ilişkin sözleşme kayıtları herkes için bağlayıcıdır. Hakkı devralan da bunlara uymak zorundadır.

  - soru: |
      Ali, arsası üzerinde 40 yıllık bir üst hakkı kurmuştur; sözleşmede bedel konusunda hüküm yoktur. Süre dolduğunda Ali'nin durumu nedir?
    siklar:
      - "Yapılar Ali'ye kalır ve arazinin bütünleyici parçası olur; Ali, aksi kararlaştırılmadıkça yapılar için bedel ödemez."
      - "Yapılar üst hakkı sahibinde kalır; Ali yalnız arazinin mülkiyetini korur."
      - "Yapılar Ali'ye kalır; Ali, yapıların gerçek değerini ödemek zorundadır."
      - "Yapılar yıkılır ve arazi ilk hâline getirilir."
    dogru: 0
    aciklama: |
      TMK m. 828/1'e göre üst hakkı sona erince yapılar arazi malikine kalır ve arazinin bütünleyici parçası olur. TMK m. 829/1'e göre malik, aksi kararlaştırılmadıkça kendisine kalan yapılar için üst hakkı sahibine bedel ödemez. Bedel ancak kararlaştırılmışsa ödenir; yaygın yanılgı, bedelin kanunen her zaman gerektiğini sanmaktır.

  - soru: |
      Ayrı sayfaya kayıtlı bir üst hakkı üzerinde Y Bankası lehine ipotek bulunmaktadır. Üst hakkı süresinin dolmasıyla sona ererse ipoteğin durumu ne olur?
    siklar:
      - "İpotek arazi üzerine geçer ve malikin taşınmazı ipotekli kalır."
      - "İpotek, ayrı sayfa kapatılınca sona erer; bedele ilişkin hükümler saklıdır."
      - "İpotek yalnız bankanın rızasıyla sona erer."
      - "İpotek, yapıyla birlikte malike geçer ve alacaklı malike başvurabilir."
    dogru: 1
    aciklama: |
      TMK m. 828/2'ye göre ayrı sayfaya kaydedilmiş üst hakkı sona erince sayfa kapatılır; taşınmaz olarak kaydedilmiş üst hakkı üzerindeki rehin hakları ve diğer bütün hak, kısıtlama ve yükümlülükler de sayfanın kapatılmasıyla sona erer. Bedele ilişkin hükümler saklıdır; bedel kararlaştırılmışsa rehin alacaklısının güvencesidir (TMK m. 829/1).

  - soru: |
      Üst hakkı sona erdiği için kararlaştırılan bedelin ödenmemesi ya da güvence altına alınmaması hâlinde, üst hakkı sahibi veya rehin alacaklısı terkin edilen üst hakkı yerine aynı derecede ve sırada bir ipotek tescilini isteyebilir. Bu ipotek hangi süre içinde tescil edilir?
    siklar:
      - "Üst hakkının sona ermesinden başlayarak üç ay içinde"
      - "Üst hakkının sona ermesinden başlayarak bir yıl içinde"
      - "Üst hakkının sona ermesinden başlayarak üç yıl içinde"
      - "Süre sınırı yoktur; üst hakkı devam ettiği sürece her zaman"
    dogru: 0
    aciklama: |
      TMK m. 829/3: Bu ipotek, üst hakkının sona ermesinden başlayarak üç ay içinde tescil edilir. "Her zaman tescil edilebilir" kuralı ise irat güvencesi ipoteği içindir (TMK m. 835/1); ikisini karıştırmak sık yapılan hatadır.

  - soru: |
      Mehmet, Zeynep'in arazisindeki üst hakkının sahibidir. Resmî senet binanın yalnız konut olarak kullanılacağını öngörmektedir. Mehmet binanın tamamını izinsiz biçimde eğlence merkezine çevirir ve uyarılara rağmen sürdürür. Aykırılığın ağır olduğu kabul edilirse Zeynep hangi hakka sahiptir?
    siklar:
      - "Hakkı bedelsiz olarak süresinden önce kendisine devretmeyi isteyebilir."
      - "Hakkın süresinden önce kendisine devrini, yapılar için uygun bedel ödemek kaydıyla isteyebilir; devir bedelin ödenmesine veya güvenceye bağlıdır."
      - "Hiçbir hak yoktur; üst hakkı süresi bitene kadar beklenmelidir."
      - "Yalnız yapının yıkılmasını isteyebilir."
    dogru: 1
    aciklama: |
      TMK m. 831'e göre üst hakkı sahibi yetkilerinin sınırını ağır şekilde aşar veya sözleşmeden doğan yükümlülüklerine önemli ölçüde aykırı davranırsa malik, hakkın süresinden önce kendisine devrini isteyebilir. Malik kendisine geçecek yapılar için uygun bir bedel öder; hak sahibinin kusuru indirim sebebi olabilir ve devir bedelin ödenmesine veya güvence altına alınmasına bağlıdır (TMK m. 832). Devir "bedelsiz" değildir.

  - soru: |
      Süresinden önce devir istemine ilişkin TMK m. 831'le ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Bu isteme hem malik hem üst hakkı sahibi sahiptir."
      - "İstem hakkı yalnız malike tanınmıştır."
      - "İstem hakkı yalnız üst hakkı üzerinde rehin hakkı bulunan alacaklıya tanınmıştır."
      - "İstem hakkı yalnız üst hakkı ayrı sayfaya kaydedilmişse doğar."
    dogru: 1
    aciklama: |
      TMK m. 831 bu isteme hakkını yalnız malike tanımıştır. Üst hakkı sahibinin kendi isteğiyle hakkından çıkması bu hükmün konusu değildir. Hükmün uygulanması hakkın ayrı sayfaya kaydedilmiş olmasına bağlı değildir.

  - soru: |
      Üst hakkı karşılığında malike yıllık irat ödenmesi kararlaştırılmıştır. Malik, bu iradı güvence altına almak için ayrı sayfaya kayıtlı üst hakkının ipotek edilmesini istemektedir. En çok kaç yıllık irat için bu ipotek istenebilir?
    siklar:
      - "Bir yıllık"
      - "Üç yıllık"
      - "Beş yıllık"
      - "Süre sınırı yoktur; borcun tamamı için"
    dogru: 1
    aciklama: |
      TMK m. 834/1'e göre malik, üst hakkı karşılığı irat biçiminde borçlanılan edimleri güvence altına almak amacıyla o tarihteki üst hakkı sahibinden en çok üç yıllık irat için, taşınmaz olarak kaydedilmiş üst hakkının ipotek edilmesini isteyebilir. Bu ipotek icra yoluyla satışta terkin olunmaz (TMK m. 835/1).

  - soru: |
      Ayşe, arazisinde Mehmet lehine 60 yıllık üst hakkı kurmuştur. Taraflar süreyi uzatmak istemektedir. Uzatma en erken ne zaman yapılabilir?
    siklar:
      - "Hak kurulduğu anda, sözleşmeye eklenecek bir hükümle"
      - "Sürenin yarısı dolduktan sonra"
      - "Sürenin dörtte üçü, yani 45 yıl dolduktan sonra"
      - "Yalnız süre tamamen dolduktan sonra"
    dogru: 2
    aciklama: |
      TMK m. 836/2'ye göre üst hakkı, süresinin dörtte üçü dolduktan sonra, kurulması için öngörülen şekle uyularak her zaman en çok yüz yıllık yeni bir süre için uzatılabilir. Önceden yapılan taahhüt bağlayıcı değildir. 60 yılın dörtte üçü 45 yıl eder (kendi hesabımız).

  - soru: |
      Ahmet, Fatma'nın arazisindeki kaynaktan 35 yıl süreyle su alma hakkı kazanmıştır; hak bağımsız niteliktedir. Hangisi doğrudur?
    siklar:
      - "Kaynak hakkı hiçbir hâlde ayrı sayfaya kaydedilemez."
      - "Hak, bağımsız nitelikte ve en az otuz yıl için kurulduğundan tapu kütüğüne taşınmaz olarak kaydedilebilir."
      - "Kaynak hakkı ancak en az yüz yıl için kurulmuşsa kaydedilebilir."
      - "Aksi kararlaştırılmadıkça kaynak hakkı devredilemez ve mirasçılara geçmez."
    dogru: 1
    aciklama: |
      TMK m. 837/3: Kaynak hakkı, bağımsız nitelikte ve en az otuz yıl için kurulmuş ise tapu kütüğüne taşınmaz olarak kaydedilebilir. Aksi kararlaştırılmadıkça devredilebilir ve mirasçıya geçer (TMK m. 837/2); son şık diğer irtifaklara ilişkin kuralı (TMK m. 838/2) yanlış yere taşır.

  - soru: |
      Ayşe'nin tarlası üzerinde komşu değirmenin maliki lehine yıllık edimi 20.000 TL olan dönemsel bir taşınmaz yükü kurulacaktır. Taraflar sicile yazılacak değer konusunda ayrı bir şey kararlaştırmamıştır. Tescilde gösterilecek miktar ne olur?
    siklar:
      - "20.000 TL"
      - "60.000 TL"
      - "200.000 TL"
      - "400.000 TL"
    dogru: 3
    aciklama: |
      TMK m. 840/2'ye göre dönemsel edimlerde sicilde gösterilecek miktar, aksi kararlaştırılmış değilse, yıllık edimlerin yirmi katıdır. 20.000 x 20 = 400.000 TL (kendi hesabımız). Üç yıl kuralı (60.000 TL'nin kaynağı) başka kurumlara aittir (TMK m. 844 ve TMK m. 848/2).

  - soru: |
      Ayşe'nin tarlası üzerinde kurulu ve tescilli bir taşınmaz yükü vardır. Ayşe tarlayı Can'a satıp devreder. Can, yükü kuran sözleşmenin tarafı olmadığını ileri sürerek edimleri vermeyi reddetmektedir. Hangisi doğrudur?
    siklar:
      - "Can, sözleşmeye taraf olmadığından yükümlü değildir; yükün devrinin ayrıca kabulü gerekir."
      - "Yük, Ayşe'nin kişisel borcudur ve Can'a geçmez."
      - "Yeni malik Can, başka bir işleme gerek bulunmaksızın taşınmaz yükünün yükümlüsü olur."
      - "Can yalnız alacaklıya bildirimde bulunduğunda yükümlü olur."
    dogru: 2
    aciklama: |
      TMK m. 849/1'e göre taşınmaz maliki değişirse yeni malik, başka bir işleme gerek bulunmaksızın taşınmaz yükünün yükümlüsü olur. Taşınmaz yükü kişisel borç değildir; sorumluluk malik sıfatına ve yalnız taşınmaza bağlıdır (TMK m. 839/1 ve TMK m. 848/1).

  - soru: |
      Taşınmaz yükünün zamanaşımıyla ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Taşınmaz yükü, kurulduktan on yıl sonra zamanaşımına uğrar."
      - "Taşınmaz yükü zamanaşımına tabi değildir; muaccel edimler ise borçlunun kişisel borcu hâline geldiği tarihten başlayarak zamanaşımına tabi olur."
      - "Muaccel edimler de hiçbir şekilde zamanaşımına tabi değildir."
      - "Taşınmaz yükü yalnız alacaklının ölümüyle zamanaşımına uğrar."
    dogru: 1
    aciklama: |
      TMK m. 847/1: Taşınmaz yükü zamanaşımına tabi değildir. TMK m. 847/2: Muaccel olan edimler, borçlunun kişisel borcu hâline geldiği tarihten başlayarak zamanaşımına tabi olur. Her edim muacceliyetten üç yıl sonra kişisel borca dönüşür (TMK m. 848/2). Kişisel borca uygulanacak süre bu notun konusu dışındadır.

  - soru: |
      Ayşe'nin tarlası üzerindeki taşınmaz yükünde, tarlanın yeni maliki Can birbiri ardına üç yılın edimlerini yerine getirmemiştir. Alacaklı ne yapabilir?
    siklar:
      - "Hiçbir şey yapamaz; taşınmaz yükünde alacaklıya yükten kurtarma yetkisi tanınmamıştır."
      - "Kanunda sayılan sebeplerden biri gerçekleştiğinden Can'dan yükten kurtarmayı isteyebilir."
      - "Yalnız Can'ın başka mallarına icra yoluyla başvurabilir."
      - "Yükün kendiliğinden sona erdiğini kabul etmek zorundadır."
    dogru: 1
    aciklama: |
      TMK m. 844/3'e göre malik birbiri ardına üç yılın edimlerini yerine getirmemişse alacaklı yükten kurtarmayı isteyebilir. Taşınmaz yükü kişisel alacak vermediğinden (TMK m. 848/1) alacaklı kural olarak malikin diğer mallarına başvuramaz. Yük kendiliğinden sona ermez; sona erme için terkin gerekir (TMK m. 843).

  - soru: |
      Yapma borçlarının irtifakla ve taşınmaz yüküyle ilişkisi bakımından hangisi doğrudur?
    siklar:
      - "Yapma borcu irtifakın asıl konusu olabilir; taşınmaz yükünde olamaz."
      - "Yapma borcu ne irtifakın ne taşınmaz yükünün konusu olabilir."
      - "Yapma borcu irtifaka ancak yan edim olarak bağlanabilir; taşınmaz yükünde ise asıl edim vermek veya yapmak olabilir."
      - "Yapma borcu yalnız üst hakkında asıl edim olabilir."
    dogru: 2
    aciklama: |
      TMK m. 779/2: Yapma borçları irtifaka başlı başına konu olamaz; ona ancak yan edim olarak bağlanabilir. TMK m. 839/1'e göre taşınmaz yükü, malikini diğer bir kimseye bir şey vermek veya yapmakla yükümlü kılar. İkisi arasındaki en belirgin fark budur.

olaylar:
  - olay: |
      Arsa maliki Ali, 2026 yılında X Otelcilik A.Ş. lehine resmî senetle 40 yıl süreli bir üst hakkı kurar. Hak, devri kısıtlanmamış ve bağımsız niteliktedir; senette bedel konusunda hüküm yoktur. Şirket arsada otel inşa eder ve hakkın ayrı sayfaya taşınmaz olarak kaydedilmesini ister. Sözleşmeyi tapuda resmî senetle yapan taraflar, otelin işletilmesi için başka bir kısıtlama da öngörmemiştir.

      Şirket, otel inşaatı için Y Bankası'ndan kredi alır ve banka kredinin güvencesi olarak üst hakkının ipotek edilmesini ister. Ali ile şirket, sözleşmeye "süre bitince üst hakkı 40 yıl daha uzatılacaktır" hükmünü de koymuşlardır.

      Yıllar sonra 40 yıllık süre dolar. Bu arada otel işletmesi sürmüş, şirketin Y Bankası'na kredi borcu da henüz tam ödenmemiştir.

      1. Üst hakkı ayrı sayfaya kaydedilebilir mi?
      2. Şirket üst hakkını Y Bankası'na ipotek edebilir mi?
      3. Sözleşmedeki "40 yıl daha uzatılacaktır" hükmü bağlayıcı mıdır? Uzatma ne zaman ve nasıl yapılabilirdi?
      4. 40 yıllık süre dolunca otel binası kime kalır, ayrı sayfa ve ipotek ne olur, Ali şirkete bedel öder mi?
    olcut:
      - {tespit: "Üst hakkının tanımı: Ali'nin şirket lehine kurduğu hak, arsada yapı yapma yetkisi veren irtifaktır; yapının mülkiyeti süre boyunca üst hakkı sahibine aittir", puan: 10, madde: "TMK m. 826"}
      - {tespit: "Ayrı sayfaya kayıt şartları: hak bağımsız ve sürekli (40 yıl, en az otuz yıl), şirket istemiş; hak taşınmaz olarak kaydedilebilir", puan: 20, madde: "TMK m. 998"}
      - {tespit: "Ayrı sayfadaki hakkın taşınmaz sayılması ve rehin hakkının konusu olabilmesi; Y Bankası lehine ipotek", puan: 15, madde: "TMK m. 704"}
      - {tespit: "Önceden yapılan uzatma taahhüdünün bağlayıcı olmaması; uzatmanın sürenin dörtte üçü dolduktan sonra, kuruluş şekline uyularak, en çok yüz yıllık yeni süre için yapılabilmesi", puan: 25, madde: "TMK m. 836"}
      - {tespit: "Süre dolunca yapıların malike kalması ve arazinin bütünleyici parçası olması; ayrı sayfanın kapanması ve ipoteğin sona ermesi", puan: 20, madde: "TMK m. 828"}
      - {tespit: "Bedelin kararlaştırılmaması nedeniyle malikin bedel ödememesi", puan: 10, madde: "TMK m. 829"}
    cozum: |
      **Nitelendirme:** Ali ile X Otelcilik A.Ş. arasında kurulan hak, TMK m. 826/1 anlamında bir **üst hakkıdır**. Arsa maliki Ali, şirket lehine arsasının üstünde yapı yapma yetkisi veren bir irtifak kurmuştur. İrtifak olarak tescille kurulur (TMK m. 780/1) ve kurma sözleşmesi resmî şekilde yapılmıştır (TMK m. 781). Otel binası, üst irtifakına dayalı olarak sürekli kalmak üzere yapıldığı için süre boyunca şirkete aittir (TMK m. 726/1).

      **Hukuki sorunlar:** (1) Ayrı sayfaya kayıt; (2) hakkın ipoteklenmesi; (3) uzatma taahhüdünün değeri ve uzatmanın şartları; (4) sürenin dolmasının sonuçları ve bedel.

      **İlgili hükümler:** TMK m. 826/1-3, TMK m. 998/3, TMK m. 704, TMK m. 828-829, TMK m. 836.

      **Değerlendirme:**

      *1. Ayrı sayfaya kayıt:* Üst hakkı, bağımsız ve sürekli nitelikteyse üst hakkı sahibinin istemi üzerine tapu kütüğüne taşınmaz olarak kaydedilebilir. En az otuz yıl için kurulan üst hakkı süreklidir (TMK m. 826/3). TMK m. 998/3 de süreklilik için hakkın süresiz veya en az otuz yıl süreli olmasını arar. Hak 40 yıllıktır, yani otuz yılı aşmaktadır. İstemi hak sahibi olan şirket yapmıştır. Olayda hakkın bağımsız nitelikte olduğu ve devrinin kısıtlanmadığı açıkça verilmiştir; Yargıtay'ın incelediğimiz bir kararında da bağımsızlık için hakkın devrinin taraflarca kısıtlanmamış olması aranmıştır. Dolayısıyla ayrı sayfaya kayıt mümkündür. Kayıt zorunlu olmadığı için şirket istemeseydi hak, tescille kurulmuş bir irtifak olarak varlığını sürdürürdü.

      *2. İpotek:* Ayrı sayfaya kaydedilen bağımsız ve sürekli haklar taşınmaz mülkiyetinin konusudur (TMK m. 704/2). Kanun da taşınmaz olarak kaydedilmiş üst hakkı üzerindeki rehin haklarından söz eder (TMK m. 828/2) ve bu hakkın ipotek edilmesini öngörür (TMK m. 834/1). Bu nedenle şirket, kayıt yapıldıktan sonra üst hakkını Y Bankası'na ipotek edebilir.

      *3. Uzatma:* TMK m. 836/2'ye göre üst hakkı, süresinin dörtte üçü dolduktan sonra, kurulması için öngörülen şekle uyularak her zaman en çok yüz yıllık yeni bir süre için uzatılabilir. Bu konuda önceden yapılan taahhüt bağlayıcı değildir. Sözleşmedeki "40 yıl daha uzatılacaktır" hükmü bu nedenle bağlayıcı olmaz; Ali kuruluş sırasında verdiği bu sözle bağlı kalmaz. Uzatma, 40 yılın dörtte üçü olan 30 yıl dolduktan sonra yapılabilir (kendi hesabımız) ve kuruluş şekline, yani resmî şekle uyulmalıdır. Yeni süre en çok yüz yıl olabilir; ayrıca yüz yıl bağımsız hak olarak azami süredir (TMK m. 836/1).

      *4. Sürenin dolması:* Üst hakkı sona erince yapılar arazi malikine kalır ve arazinin bütünleyici parçası olur (TMK m. 828/1). Otel Ali'nindir. Ayrı sayfa kapatılır; sayfadaki rehin hakları da sayfanın kapatılmasıyla sona erer (TMK m. 828/2), yani Y Bankası'nın ipoteği sona erer. Bankanın şirketten alacağı varsa bu, şirketle olan kişisel ilişkisinin konusu olur. Sözleşmede bedel konusunda hüküm bulunmadığı için Ali, kendisine kalan yapılar için bedel ödemez (TMK m. 829/1).

      **Sonuç:**
      - Ayrı sayfaya kayıt mümkündür: Hak 40 yıllık, devri kısıtlanmamış ve şirket istemiştir.
      - Şirket, kaydedilen üst hakkını Y Bankası'na ipotek edebilir.
      - "40 yıl uzatılacaktır" taahhüdü bağlayıcı değildir; uzatma ancak sürenin dörtte üçü dolduktan sonra, resmî şekilde ve en çok yüz yıllık yeni süre için yapılabilir.
      - Süre dolunca otel Ali'ye kalır, ayrı sayfa kapanır ve ipotek sona erer; bedel kararlaştırılmadığından Ali bedel ödemez.

  - olay: |
      Zeynep'in İstanbul'daki arazisinde Mehmet lehine, resmî senetle 60 yıllık, ayrı sayfaya kayıtlı bir üst hakkı kurulmuştur. Resmî senette yapının yalnız konut olarak kullanılacağı yazılıdır. Mehmet arazide apartman yaptırmış ve bir süre sonra binanın tamamını izinsiz biçimde eğlence merkezine çevirmiştir. Zeynep'in birçok uyarısına rağmen Mehmet bu kullanımı yıllardır sürdürmektedir.

      Mehmet, hakkı Kemal'e devretmek ister. Kemal, "Senetteki konut kaydı Mehmet'le Zeynep'in kişisel anlaşmasıdır, beni bağlamaz" diyerek binayı eğlence merkezi olarak kullanmayı sürdürecektir.

      Sözleşmede ayrıca, Mehmet'in yükümlülüklerine aykırı davranması hâlinde Zeynep'in üst hakkını süresinden önce sona erdirme veya devrini isteme yetkisi saklı tutulmuştur. Üst hakkı, A Bankası'na rehinlidir. Senette süre sonunda Zeynep'in Mehmet'e belirli bir bedel ödeyeceği de kararlaştırılmıştır.

      1. Senetteki özgülenme kaydı Kemal'i bağlar mı?
      2. Zeynep hakkı süresinden önce kendisine geçirebilir mi? Şartları nelerdir?
      3. Zeynep bu devri bedelsiz isteyebilir mi? Mehmet'in kusuru nasıl değerlendirilir?
      4. Sözleşmede saklı tutulan yetki hangi hükümlere tabidir?
      5. Süre sonunda ödenecek bedel A Bankası'nın rızası olmadan Mehmet'e ödenebilir mi?
    olcut:
      - {tespit: "Yapının mülkiyetinin üst hakkı sahibine ait olması; üst hakkının devredilebilir olması", puan: 5, madde: "TMK m. 726"}
      - {tespit: "Resmî senetteki özgülenme amacına ilişkin kayıtların herkes için bağlayıcı olması; Kemal'in bağlı olması", puan: 20, madde: "TMK m. 827"}
      - {tespit: "Erken devir şartları: yetki sınırının ağır şekilde aşılması veya yükümlülüklere önemli ölçüde aykırılık; istem hakkının malike ait olması", puan: 20, madde: "TMK m. 831"}
      - {tespit: "Erken devirde malikin uygun bedel ödemesi; hak sahibinin kusurunun indirim sebebi olabilmesi; devrin bedelin ödenmesine veya güvenceye bağlı olması", puan: 20, madde: "TMK m. 832"}
      - {tespit: "Sözleşmede saklı tutulan sona erdirme veya devir isteme yetkisinin erken devir hükümlerine tabi olması", puan: 15, madde: "TMK m. 833"}
      - {tespit: "Kararlaştırılan bedelin rehin alacaklılarının güvencesi olması ve rızaları olmaksızın üst hakkı sahibine ödenmemesi", puan: 20, madde: "TMK m. 829"}
    cozum: |
      **Nitelendirme:** Zeynep'in arazisinde Mehmet lehine kurulan hak, ayrı sayfaya kayıtlı bir **üst hakkıdır** (TMK m. 826). Mehmet'in yaptırdığı apartmanın mülkiyeti, üst irtifakına dayalı yapı olduğu için ona aittir (TMK m. 726/1). Aksi kararlaştırılmadıkça üst hakkı devredilebilir ve mirasçılara geçer (TMK m. 826/2); sözleşmede devri engelleyen bir kayıt yoktur. Uyuşmazlık, üst hakkı sahibinin senetteki özgülenme amacına aykırı davranmasından doğmaktadır.

      **Hukuki sorunlar:** (1) Senetteki kaydın hakkı devralan Kemal'i bağlaması; (2) malikin süresinden önce devir isteme hakkı; (3) devirde bedel; (4) sözleşmede saklı tutulan yetki; (5) rehinli hakta bedelin ödenmesi.

      **İlgili hükümler:** TMK m. 826/2, TMK m. 827, TMK m. 831, TMK m. 832, TMK m. 833, TMK m. 829/1.

      **Değerlendirme:**

      *1. Kaydın Kemal'i bağlaması:* TMK m. 827'ye göre üst hakkının içerik ve kapsamıyla ilgili olarak resmî senette yer alan, özellikle yapının niteliğine ve özgülenme amacına ilişkin sözleşme kayıtları herkes için bağlayıcıdır. Yapının yalnız konut olarak kullanılacağı kaydı özgülenme amacına ilişkindir ve resmî senette yer almaktadır. Kemal, hakkı devralan olarak bu kayda bağlıdır; "kişisel anlaşma" savunması dinlenmez. Yargıtay'ın incelediğimiz bir kararında da bu kayıtların aşılmasının malikin mülkiyetine haksız el atma sayıldığı belirtilmiştir.

      *2. Erken devir:* Mehmet'in izinsiz biçimde yapıyı tamamen eğlence merkezine çevirmesi ve uyarılara rağmen sürdürmesi, bu haktan doğan yetkilerin sınırını ağır şekilde aşması veya sözleşmeden doğan yükümlülüklere önemli ölçüde aykırı davranması anlamına gelebilir. Bu şartlar gerçekleşirse malik, üst hakkının ona bağlı bütün hak ve yükümlülükleriyle birlikte süresinden önce kendisine devrini isteyebilir (TMK m. 831). İstem hakkı yalnız malike aittir. Şartların gerçekleşip gerçekleşmediği hâkimce değerlendirilir; Yargıtay'ın bir kararında erken devrin, ilişkinin malik için çekilmez hâle geldiği ağır ihlale bağlı olduğu ve TMK m. 2 ile TMK m. 4 çerçevesinde değerlendirileceği belirtilmiştir. Olayda aykırılığın yıllardır sürmesi bu yöndedir.

      *3. Bedel:* Zeynep devri bedelsiz isteyemez. Malik, kendisine geçecek yapılar için uygun bir bedel ödemek kaydıyla devri ister. Mehmet'in kusuru, bedelin belirlenmesinde indirim sebebi olarak göz önüne alınabilir. Devir, bedelin ödenmesine veya güvence altına alınmış olmasına bağlıdır (TMK m. 832). Kusur, bedelin tamamen ortadan kalkması sonucunu doğurmaz; kanun yalnızca "indirim" der.

      *4. Saklı yetki:* Sözleşmede malik lehine saklı tutulan, hakkı süresinden önce sona erdirme veya devrini isteme yetkisi, süresinden önce devire ilişkin hükümlere tabidir (TMK m. 833). Zeynep bu yetkiyi kullansa da TMK m. 831 ve TMK m. 832'deki şart ve bedel kuralları geçerli olmaya devam eder; sözleşme bu kuralları ortadan kaldıramaz.

      *5. Rehinli hakta bedel:* Senette süre sonunda ödenmesi kararlaştırılan bedel, üst hakkı kendileri için rehnedilmiş alacaklıların henüz ödenmemiş alacaklarının güvencesini oluşturur ve rızaları olmaksızın üst hakkı sahibine ödenmez (TMK m. 829/1). Bu nedenle bedel, A Bankası'nın rızası olmadan Mehmet'e ödenemez.

      **Sonuç:**
      - Kemal, senetteki özgülenme kaydına bağlıdır.
      - Şartlar gerçekleşirse yalnız Zeynep, hakkın süresinden önce kendisine devrini isteyebilir.
      - Devir bedelsiz değildir; Zeynep uygun bedel öder, Mehmet'in kusuru indirim sebebi olabilir, devir bedelin ödenmesine veya güvenceye bağlıdır.
      - Saklı tutulan yetki de erken devir hükümlerine tabidir.
      - Süre sonu bedeli A Bankası'nın rızası olmadan Mehmet'e ödenmez.

  - olay: |
      Ayşe'nin buğday tarlası üzerinde, komşu un değirmeninin bulunduğu taşınmazın maliki lehine her yıl 5 ton buğday verme yükümlülüğü taşınmaz yükü olarak tescil edilmiştir. Taraflar yılda 5 ton buğdayın değerini 100.000 TL kabul etmişler, tescilde sicile yazılacak değer konusunda ise ayrıca bir şey kararlaştırmamışlardır.

      Ayşe tarlayı Can'a satar ve devreder. Can, yük sözleşmesinin tarafı olmadığını ileri sürerek buğday vermeyi reddeder. Can, birbiri ardına üç yıl boyunca buğdayı vermez.

      Değirmen maliki (alacaklı), üç yılın sonunda bunun üzerine Can'dan yükten kurtarma ister. Can ise sicildeki miktar kendisine fazla gelirse gerçek değerin daha düşük olduğunu ispatlamak istemektedir. Alacaklı ayrıca Can'ın diğer mallarına da başvurmak niyetindedir. Can, tarlayı Ayşe'den tapuda satın almıştır ve kendisine yükü bildiren bir sözleşme imzalamamıştır.

      1. Yükün konusu geçerli bir taşınmaz yükü konusu mudur?
      2. Sicile hangi değer yazılmalıdır?
      3. Can yükten sorumlu mudur?
      4. Alacaklı ne isteyebilir? Kurtarma hangi miktar üzerinden yapılır?
      5. Alacaklı Can'ın diğer mallarına başvurabilir mi?
    olcut:
      - {tespit: "Taşınmaz yükünün tanımı: malikin yalnız o taşınmazla sorumlu olmak üzere vermek veya yapmakla yükümlü olması; hak sahibinin başka bir taşınmazın maliki olarak gösterilebilmesi; edimin yüklü taşınmazın ekonomik niteliğinden doğması", puan: 15, madde: "TMK m. 839"}
      - {tespit: "Tescilin yükün kurulması için şart olması; dönemsel edimde sicil değerinin yıllık edimin yirmi katı olması (100.000 x 20 = 2.000.000 TL)", puan: 15, madde: "TMK m. 840"}
      - {tespit: "Yeni malikin başka bir işleme gerek olmaksızın yükümlü olması", puan: 15, madde: "TMK m. 849"}
      - {tespit: "Birbiri ardına üç yılın edimlerinin yerine getirilmemesi nedeniyle alacaklının yükten kurtarmayı isteyebilmesi", puan: 20, madde: "TMK m. 844"}
      - {tespit: "Yükten kurtarmanın sicildeki miktar üzerinden yapılması; daha düşük gerçek değeri ispat hakkının saklı olması", puan: 15, madde: "TMK m. 846"}
      - {tespit: "Taşınmaz yükünün kişisel alacak sağlamaması; alacaklının Can'ın diğer mallarına kural olarak başvuramaması; her edimin muacceliyetten üç yıl sonra kişisel borca dönüşmesi", puan: 20, madde: "TMK m. 848"}
    cozum: |
      **Nitelendirme:** Olaydaki yükümlülük, tarlanın malikini yalnız o taşınmazla sorumlu olmak üzere her yıl 5 ton buğday vermekle yükümlü kılan bir **taşınmaz yüküdür** (TMK m. 839/1). Hak sahibi olarak değirmenin bulunduğu taşınmazın maliki gösterilmiştir; kanun buna imkân verir (TMK m. 839/2). Bu bir irtifak değildir: Burada asıl edim bir "vermek"tir (TMK m. 779/2 ile karşılaştır).

      **Hukuki sorunlar:** (1) Yükün konusu; (2) sicil değeri; (3) yeni malikin sorumluluğu; (4) yükten kurtarma ve miktar; (5) sorumluluğun kapsamı.

      **İlgili hükümler:** TMK m. 839, TMK m. 840, TMK m. 844, TMK m. 846, TMK m. 848, TMK m. 849.

      **Değerlendirme:**

      *1. Konu:* İrat senedi ve kamu hukukuna ilişkin yükler saklı kalmak kaydıyla, yükün konusu ancak yüklü taşınmazın ekonomik niteliğinden doğan veya yararlanan taşınmazın ekonomik ihtiyaçlarını karşılayan bir edim olabilir (TMK m. 839/3). Buğday, buğday tarlasının ürünüdür; tarlanın ekonomik niteliğinden doğar ve bir un değirmeninin ihtiyacına hizmet eder. Konu geçerlidir.

      *2. Sicil değeri:* Taşınmaz yükünün kurulması için tescil şarttır (TMK m. 840/1). Tescilde yükün değeri olarak Türk parası veya yabancı para ile belirlenmiş bir miktar gösterilir. Dönemsel edimlerde sicilde gösterilecek miktar, aksi kararlaştırılmış değilse, yıllık edimlerin yirmi katıdır (TMK m. 840/2). Yıllık edim 100.000 TL ise sicile 100.000 x 20 = 2.000.000 TL yazılmalıdır (kendi hesabımız). Taraflar sicil değeri konusunda ayrıca bir şey kararlaştırmadığından tapu kütüğünde yükün değeri olarak bu miktar gösterilir.

      *3. Can'ın sorumluluğu:* Taşınmaz maliki değişirse yeni malik, başka bir işleme gerek bulunmaksızın taşınmaz yükünün yükümlüsü olur (TMK m. 849/1). Can'ın sözleşmenin tarafı olmadığı savunması bu nedenle sonuç doğurmaz: Yük taşınmaza bağlıdır, kişiye değil.

      *4. Yükten kurtarma:* Malik birbiri ardına üç yılın edimlerini yerine getirmemişse alacaklı yükten kurtarmayı isteyebilir (TMK m. 844/3). Olayda Can üç yıl üst üste vermediği için bu sebep gerçekleşmiştir. Yükten kurtarma, gerçek değerinin daha düşük olduğunu ispat etme hakkı saklı kalmak kaydıyla, yükün değeri olarak tapu kütüğünde gösterilen miktar üzerinden, yani 2.000.000 TL üzerinden gerçekleştirilir (TMK m. 846). Can, gerçek değerin daha düşük olduğunu ispatlama hakkını kullanabilir; yalnızca "fazla geliyor" demek yetmez, ispat gerekir. Yükten kurtarma sonrasında malik, hak sahibinden terkini isteyebilir (TMK m. 843/2).

      *5. Sorumluluğun kapsamı:* Taşınmaz yükü alacaklıya yükümlüye karşı hiçbir kişisel alacak hakkı sağlamaz; sadece alacağını yüklü taşınmazın değerinden elde etme yetkisi verir (TMK m. 848/1). Alacaklı bu nedenle kural olarak Can'ın diğer mallarına başvuramaz. Ayrıca her edim, muaccel olmasından başlayarak üç yıl sonra kişisel borç hâline gelir ve taşınmaz bu borcun güvencesi olmaktan çıkar (TMK m. 848/2). Muacceliyetinden üç yıl geçen edim varsa o edim kişisel borca döner ve taşınmaz onun güvencesi olmaktan çıkar; kişisel borç olan edimler zamanaşımına tabidir (TMK m. 847/2).

      **Sonuç:**
      - Yükün konusu geçerlidir; hak sahibi bir taşınmazın maliki olarak gösterilebilir.
      - Sicile yıllık edimin yirmi katı, yani 2.000.000 TL yazılmalıdır.
      - Can, yeni malik olarak başka bir işleme gerek olmaksızın yükümlüdür.
      - Alacaklı, üç yıllık edimsizlik nedeniyle yükten kurtarmayı isteyebilir; kurtarma sicildeki miktar (2.000.000 TL) üzerinden yapılır, Can daha düşük gerçek değeri ispat edebilir.
      - Alacaklı Can'ın diğer mallarına kural olarak başvuramaz; edimler muacceliyetten üç yıl sonra kişisel borca dönüşür.

kartlar:
  - on: "Üst hakkı nedir? (TMK m. 826/1)"
    arka: "Malikin üçüncü kişi lehine arazisinin altında veya üstünde yapı yapma ya da mevcut yapıyı muhafaza etme yetkisi veren irtifakıdır."
  - on: "Üst hakkına dayanılarak yapılan yapının mülkiyeti kime aittir? (TMK m. 726/1)"
    arka: "Sürekli kalmak üzere yapılan yapının mülkiyeti irtifak hakkı sahibine aittir."
  - on: "Bağımsız bölüm üzerinde üst hakkı kurulabilir mi? (TMK m. 726/3)"
    arka: "Hayır. Bağımsız bölümler üzerinde ayrıca üst hakkı kurulamaz."
  - on: "Üst hakkı ve kaynak hakkı ile diğer irtifakların devredilebilirlik farkı?"
    arka: "Üst hakkı ve kaynak hakkı aksi kararlaştırılmadıkça devredilir ve mirasçılara geçer (TMK m. 826/2, TMK m. 837/2). Diğer irtifaklar ise aksi kararlaştırılmadıkça devredilmez ve mirasçılara geçmez (TMK m. 838/2)."
  - on: "Üst hakkı ayrı sayfaya hangi şartlarla kaydedilir? (TMK m. 826/3)"
    arka: "Bağımsız ve sürekli olmalı ve üst hakkı sahibi istemelidir. En az otuz yıl için kurulan hak süreklidir. Kayıt zorunlu değil, imkândır."
  - on: "Otuz yıl ile yüz yıl farkı?"
    arka: "Otuz yıl ayrı sayfaya kayıt için süreklilik eşiğidir (TMK m. 826/3, TMK m. 998/3). Yüz yıl bağımsız hak olarak azami süredir (TMK m. 836/1)."
  - on: "Üst hakkı süresi nasıl uzatılır? (TMK m. 836/2)"
    arka: "Sürenin dörtte üçü dolduktan sonra, kuruluş şekline uyularak, en çok yüz yıllık yeni süre için. Önceden verilen taahhüt bağlayıcı değildir."
  - on: "Resmî senet kayıtları kimi bağlar? (TMK m. 827)"
    arka: "Yapının konumu, şekli, niteliği, boyutları, özgülenme amacı ve boş alandan yararlanmaya ilişkin kayıtlar herkes için bağlayıcıdır."
  - on: "Üst hakkı sona erince yapılar ne olur? (TMK m. 828/1)"
    arka: "Arazi malikine kalır ve arazinin bütünleyici parçası olur."
  - on: "Ayrı sayfadaki üst hakkı sona erince ne olur? (TMK m. 828/2)"
    arka: "Sayfa kapatılır. Üzerindeki rehin ve diğer bütün hak, kısıtlama ve yükümlülükler sona erer. Bedele ilişkin hükümler saklıdır."
  - on: "Süre sonunda malik bedel öder mi? (TMK m. 829/1)"
    arka: "Aksi kararlaştırılmadıkça hayır. Bedel kural değil istisnadır. Kararlaştırılmışsa rehin alacaklılarının rızası olmadan üst hakkı sahibine ödenmez."
  - on: "Bedel ipoteği hangi sürede tescil edilir? (TMK m. 829/3)"
    arka: "Üst hakkının sona ermesinden başlayarak üç ay içinde."
  - on: "Süresinden önce devir isteminin şartı ve sahibi? (TMK m. 831)"
    arka: "Yetki sınırının ağır şekilde aşılması veya yükümlülüklere önemli ölçüde aykırılık. İstem hakkı yalnız malike aittir."
  - on: "Erken devirde bedel? (TMK m. 832)"
    arka: "Malik, yapılar için uygun bedel öder. Hak sahibinin kusuru indirim sebebi olabilir. Devir bedelin ödenmesine veya güvenceye bağlıdır."
  - on: "İrat güvencesi ipoteğinin kapsamı? (TMK m. 834-835)"
    arka: "En çok üç yıllık irat için, ayrı sayfadaki üst hakkı üzerinde. Hak devam ettiği sürece her zaman tescil edilebilir ve icra satışında terkin olunmaz."
  - on: "Kaynak hakkı ne zaman ayrı sayfaya kaydedilir? (TMK m. 837/3)"
    arka: "Bağımsız nitelikte ve en az otuz yıl için kurulmuşsa. Metin 'sürekli' sözcüğünü kullanmaz."
  - on: "TMK m. 838'deki diğer irtifakların özellikleri?"
    arka: "Atış eğitimi, spor alanı, geçit gibi belirli yararlanma için kurulur. Aksi kararlaştırılmadıkça devredilmez ve mirasçılara geçmez. Kapsam olağan ihtiyaçlara göre belirlenir."
  - on: "Taşınmaz yükü nedir? (TMK m. 839/1)"
    arka: "Malikin yalnız o taşınmazla sorumlu olmak üzere bir şey vermek veya yapmakla yükümlü olmasıdır. Kişisel alacak sağlamaz (TMK m. 848/1)."
  - on: "Taşınmaz yükü nasıl kurulur ve sicile ne yazılır? (TMK m. 840)"
    arka: "Tescille kurulur. Dönemsel edimde, aksi kararlaştırılmadıkça, yıllık edimin yirmi katı sicile yazılır."
  - on: "Yeni malik taşınmaz yükünden sorumlu olur mu? (TMK m. 849/1)"
    arka: "Evet. Başka bir işleme gerek olmaksızın taşınmaz yükünün yükümlüsü olur."
  - on: "Taşınmaz yükü zamanaşımına tabi midir? (TMK m. 847)"
    arka: "Yükün kendisi tabi değildir. Muaccel edimler, kişisel borç hâline geldikleri tarihten başlayarak zamanaşımına tabidir."
  - on: "Taşınmaz yükünde 'üç yıl' nerede geçer?"
    arka: "Alacaklının yükten kurtarma sebebi: üç yılın edimlerinin yerine getirilmemesi (TMK m. 844/3). Edimin muacceliyetten üç yıl sonra kişisel borca dönüşmesi (TMK m. 848/2)."
  - on: "Yükümlünün yükten kurtarma isteme yetkisi? (TMK m. 845)"
    arka: "Sözleşmeyle yetkiliyse, alacaklı yükü kuran sözleşmeye uymuyorsa veya yükün kurulmasının üzerinden otuz yıl geçmişse istenebilir. Otuz yıl geçtikten sonra alacaklıya bir yıl önceden bildirmek şarttır."
  - on: "İrtifak ile taşınmaz yükü farkı?"
    arka: "İrtifakta yapma borcu yalnız yan edim olabilir (TMK m. 779/2). Taşınmaz yükünde asıl edim vermek veya yapmaktır (TMK m. 839/1)."
