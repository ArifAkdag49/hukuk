sorular:
  - soru: |
      TMK m. 779/1'e göre taşınmaz irtifakı hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yararlanan taşınmazın malikine, yüklü taşınmazı devralma hakkı verir."
      - "Yüklü malike yalnız bir şey yapma borcu yükleyen kişisel bir haktır."
      - "Bir taşınmaz üzerinde başka bir taşınmaz lehine konulmuş yüktür; yüklü malik ya kaçınmaya ya da katlanmaya mecbur kalır."
      - "Bir taşınmaz üzerinde belirli bir kişi lehine kurulan ve devredilemeyen bir haktır."
    dogru: 2
    aciklama: |
      TMK m. 779/1 irtifakı, bir taşınmaz üzerinde diğer bir taşınmaz lehine konulmuş yük olarak tanımlar; yük, yüklü malikin bazı yetkileri kullanmaktan kaçınması veya yararlanan malikin kullanımına katlanması biçimindedir. Kişi lehine kurulan, devredilemeyen irtifaklar TMK m. 838 kapsamındadır; yapma borcu ise yalnız yan edim olabilir (TMK m. 779/2).

  - soru: |
      TMK m. 779/2'ye göre aşağıdakilerden hangisi mümkündür?
    siklar:
      - "Yüklü malikin her kış yolun karını temizleme borcunun tek başına irtifak olarak kurulması"
      - "Geçit irtifakına, yüklü malikin kış aylarında yolun karını temizlemesinin yan edim olarak bağlanması"
      - "Yapma borçlarının irtifaka hiçbir biçimde bağlanamaması"
      - "Yapma borcunun irtifakın asıl ve tek konusu yapılması"
    dogru: 1
    aciklama: |
      Yapma borçları irtifaka başlı başına konu olamaz; ancak yan edim olarak bağlanabilir (TMK m. 779/2). Bu nedenle kar temizleme tek başına irtifak olamaz, geçit irtifakının yanında yan edim olabilir. Yaygın yanılgı, yapma borçlarının irtifaka hiç bağlanamayacağını sanmaktır.

  - soru: |
      Ceren ile Doğan, Doğan'ın parseli üzerinde Ceren'in parseli lehine geçit irtifakı kurmak için tapu müdürlüğünde resmî senet düzenlemiştir. Ancak tescil henüz yapılmamıştır. Hangisi doğrudur?
    siklar:
      - "İrtifak, resmî senedin imzalandığı anda doğmuştur; tescil yalnız açıklayıcıdır."
      - "İrtifak, Ceren'in geçidi kullanmaya başlamasıyla doğar."
      - "İrtifak, tapu müdürlüğünün senedi onaylamasıyla doğar."
      - "Tescil yapılıncaya kadar ayni hak olarak irtifak doğmamıştır."
    dogru: 3
    aciklama: |
      İrtifak hakkının kurulması için tapu kütüğüne tescil şarttır (TMK m. 780/1). Kurulması tescile tâbi ayni haklar tescil edilmedikçe varlık kazanamaz (TMK m. 1021). Resmî senet geçerli sözleşme şartıdır (TMK m. 781) ama irtifakı tek başına doğurmaz. Tescil bu hâlde kurucudur, açıklayıcı değildir.

  - soru: |
      Eda ile Fatih, Fatih'in parseli üzerinde Eda'nın parseli lehine geçit irtifakı kurmak için adi yazılı bir sözleşme imzalamış ve Eda bu sözleşmeye dayanarak tapuda tescil istemiştir. Tapu memuru ne yapmalıdır?
    siklar:
      - "Tescili yapmalıdır; irtifak sözleşmesi şekle tabi değildir."
      - "Tescili yapmalıdır; ancak irtifak yalnız beş yıl süreyle doğar."
      - "İstemi reddetmelidir; hukuki sebep geçerlilik şekline uygun belgelenmemiştir."
      - "Tescili yapmalıdır; adi yazılı şekil ispat için yeterlidir."
    dogru: 2
    aciklama: |
      İrtifak kurmaya ilişkin sözleşmenin geçerliliği resmî şekilde düzenlenmesine bağlıdır (TMK m. 781). Tescil istemi için hukuki sebebin geçerliliği için gerekli şekle uyulduğunun ispatı gerekir (TMK m. 1015/3). Adi yazılı sözleşme bu şartı karşılamaz. Yaygın yanılgı, adi yazılı şeklin en azından ispat için yeterli olduğunu sanmaktır; burada şekil geçerlilik şartıdır.

  - soru: |
      Aras Tekstil A.Ş., işletmesine su getiren, komşu arazinin üzerinden geçen ve dışarıdan görülen bir boru hattını arazi maliki ile noterde yapılan sözleşmeye dayanarak kurmuştur. Tapuya tescil yapılmamıştır. TMK m. 727/3'e göre hangisi doğrudur?
    siklar:
      - "İrtifak, tescil yapılmadığı için hiçbir hâlde doğmamıştır."
      - "İrtifak ancak adi yazılı sözleşme ile doğabilirdi; noter sözleşmesi geçersizdir."
      - "Yalnız kişisel hak doğmuştur; ayni irtifak için tescil şarttır."
      - "İrtifak, mecra dışarıdan görüldüğü için noterce düzenlenen sözleşmeye dayanılarak mecranın yapılmasıyla doğmuştur."
    dogru: 3
    aciklama: |
      Mecra irtifakı, mecra dışarıdan görülmüyorsa tapu kütüğüne tesciliyle, dışarıdan görülüyorsa noterce düzenlenecek sözleşmeye dayanılarak mecranın yapılmasıyla doğar (TMK m. 727/3). TMK m. 780/1'deki tescil kuralına bu istisna "aksi öngörülmedikçe" kaydıyla yer bırakır.

  - soru: |
      Müteahhit Emre, birbirine komşu iki parselin de maliki olup arkadaki parseli satmadan önce, onun lehine öndeki parsel üzerinde geçit irtifakı kurmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Kurabilir; malik kendisine ait iki taşınmazdan biri üzerinde diğeri lehine irtifak kurabilir."
      - "Kuramaz; kimse kendi malı üzerinde sınırlı ayni hak kuramaz."
      - "Kurabilir ama tescil gerekmez, çünkü iki taşınmaz da aynı kişiye aittir."
      - "Kurabilir, ancak parseller önce birleştirilirse."
    dogru: 0
    aciklama: |
      TMK m. 782 uyarınca malik, kendisine ait iki taşınmazdan biri üzerinde diğerinin lehine irtifak hakkı kurabilir. Sınırlı ayni hakların başkasına ait eşya üzerinde olması gerektiği düşüncesi bu kurum için geçerli değildir. İrtifak, kuruluşta yine tescille doğar (TMK m. 780/1).

  - soru: |
      TMK m. 783'e göre aşağıdakilerden hangisi irtifak hakkının sona erme sebebi olarak açıkça sayılmıştır?
    siklar:
      - "Yararlanan taşınmaz malikinin ölümü"
      - "Yüklü taşınmazın başkasına satılması"
      - "Yararlanan taşınmazın yok olması"
      - "Hak sahibinin irtifakı uzun süre kullanmaması"
    dogru: 2
    aciklama: |
      TMK m. 783'e göre irtifak, tescilin terkini veya yüklü ya da yararlanan taşınmazın yok olmasıyla sona erer. Maliklerin değişmesi ya da ölümü ayni hakkı etkilemez; kullanılmama ise metinde sayılmamıştır. Süre dolması gibi sebepler uygulamada ve öğretide anılsa da kanun metninde yer almaz.

  - soru: |
      Hakan, hem geçit irtifakıyla yüklü A parselinin hem de lehine geçit bulunan B parselinin maliki olmuş, terkin yaptırmamıştır. Sonra B'yi Irmak'a satar. Irmak geçidi kullanmak isteyince Hakan, "taşınmazlar bende birleşince irtifak sona erdi" diye itiraz eder. Hangisi doğrudur?
    siklar:
      - "Hakan haklıdır; birleşmeyle irtifak kendiliğinden sona ermiştir."
      - "Irmak ancak yeni bir irtifak sözleşmesi yapılırsa geçidi kullanabilir."
      - "İrtifak ancak mahkeme kararıyla sona ererdi; Hakan terkin ettiremezdi."
      - "İrtifak terkin edilmedikçe ayni hak olarak sürdüğünden Hakan'ın itirazı yerinde değildir."
    dogru: 3
    aciklama: |
      Yüklü ve yararlanan taşınmazlara aynı kimse malik olursa bu kişi irtifakı terkin ettirebilir, ama terkin edilmedikçe irtifak ayni hak olarak varlığını sürdürür (TMK m. 784). Birleşme irtifakı kendiliğinden bitirmez; Hakan terkin ettirebilirdi ama etmediği için hak sürer. Mahkeme kararı gerekmez, terkin yazılı beyanla yapılır (TMK m. 1014).

  - soru: |
      Aşağıdakilerden hangisi TMK m. 785/2'nin düzenlediği hâlle ilgili olarak doğrudur?
    siklar:
      - "Terkini yalnız yararlanan malik isteyebilir; yüklü malikin böyle bir istemi yoktur."
      - "Yüküne oranla çok az yarar sağlayan irtifakın bedel karşılığında kısmen veya tamamen terkini istenebilir."
      - "Terkin ancak irtifakın sağladığı yararın tamamen kalkması hâlinde istenebilir."
      - "Terkin her hâlde bedelsiz ve yalnız tamamen yapılır."
    dogru: 1
    aciklama: |
      TMK m. 785/2 yüküne oranla çok az yarar sağlayan bir irtifakın bedel karşılığında kısmen veya tamamen terkininin istenebileceğini söyler. İstemde bulunan yüklü taşınmazın malikidir (TMK m. 785/1 ile birlikte). Yararın tamamen kalkması ise birinci fıkradaki hâldir; "bedel" ibaresi yalnız ikinci fıkrada geçer.

  - soru: |
      Zerrin, Burak'ın parseli lehine kendi parselinde kurulu rızai geçit irtifakının TMK m. 785 uyarınca kaldırılmasını istemektedir. Burak, geçide hâlâ ihtiyaç duyduğunu söylemektedir. Yargıtay'ın yerleşik uygulamasına göre ispat yükü kimdedir?
    siklar:
      - "Burak, geçitten yararlanmaya devam ettiğini ispat etmelidir."
      - "Zerrin, ihtiyacın sona erdiğini veya irtifakın yüküne oranla çok az yarar sağladığını ispat etmelidir."
      - "İspat yükü hâkime aittir; taraflar ispat etmek zorunda değildir."
      - "Taraflardan hiçbiri ispatla yükümlü değildir; irtifak kendiliğinden kalkar."
    dogru: 1
    aciklama: |
      Yargıtay uygulamasında kaldırma isteyen yüklü malik, ihtiyacın sona erdiğini ya da irtifakın yüküne oranla çok az yarar sağladığını ispatla yükümlüdür. Bir hakkın sona erdiğini ileri süren, bu sonucu doğuran olguları kanıtlar. Burak'ın yararlanmaya devam ettiğini ispatı gerekmez.

  - soru: |
      Yargıtay Hukuk Genel Kurulu'nun TMK m. 785/2'ye ilişkin genel açıklamasına göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yararın biraz azalması terkin için yeterlidir."
      - "Yalnız yükün artması, hak sahibinin yararı aynı kalsa da terkin sebebidir."
      - "Terkin için yarar ile yük arasında aşırı oransızlık gerekir; yararın kısmen azalması yetmez."
      - "Terkin ancak yararlanan malikin rızasıyla mümkündür."
    dogru: 2
    aciklama: |
      Hukuk Genel Kurulu, TMK m. 785/2 için yararın kısmen azalmasının yetmediğini, yarar ile yük arasında aşırı oransızlık gerektiğini belirtmiştir. Hak sahibinin yararı aynı kalırken yalnız yükün artması da sona erme sebebi değildir. Rıza yoksa mahkemeye gidilir; terkin rızaya bağlı bırakılmamıştır.

  - soru: |
      Leyla, Mehmet'in parseli üzerinden geçit hakkına sahiptir. Yolun çamurlanması üzerine yola mıcır döker. Mehmet de yolun girişine anahtarı yalnız kendisinde bulunan kilitli bir kapı koyar. TMK m. 786'ya göre hangisi doğrudur?
    siklar:
      - "Leyla gerekli önlemi alabilir; Mehmet ise irtifakın kullanılmasını zorlaştıran kapıyı koyamaz."
      - "Leyla mıcır döküp yolu değiştiremez; Mehmet ise mülkiyet hakkı gereği kapıyı koyabilir."
      - "Her ikisi de mülkiyet yetkisine dayanarak istediklerini yapabilir."
      - "İkisi de yasaktır; irtifak sahibi önlem alamaz, yüklü malik de tesis kuramaz."
    dogru: 0
    aciklama: |
      Hak sahibi hakkının korunması ve kullanılması için gerekli önlemleri alabilir, yeter ki yüklü malike en az zarar verecek biçimde kullansın (TMK m. 786/1). Yüklü malik ise irtifakın kullanılmasını engelleyecek ya da zorlaştıracak davranışlarda bulunamaz (TMK m. 786/2). Kilitli kapı kullanımı zorlaştırır.

  - soru: |
      Tapuda irtifak "3 metre genişliğinde yaya geçidi" olarak tescilli iken, yararlanan parselin maliki Selim on beş yıldır kendi aracını bu yoldan geçirmekte, yüklü malik Nurcan ise sessiz kalmaktadır. Sonunda Nurcan araç geçişine karşı çıkar. TMK m. 787'ye göre hangisi doğrudur?
    siklar:
      - "Uzun süreli kullanma tescile üstündür; irtifak artık araç geçidini de kapsar."
      - "Tescil kapsamı açıkça belirlediğinden kapsam tescile göredir; uzun süre araç geçirmek kapsamı genişletmez."
      - "Nurcan'ın sessiz kalması irtifakı kendiliğinden araç geçidine dönüştürür."
      - "Kapsam, taraflardan hangisi daha güçlüyse onun lehine belirlenir."
    dogru: 1
    aciklama: |
      İrtifaktan doğan yetki ve yükümlülükleri açıkça belirlediği ölçüde tescil kapsamın esasıdır (TMK m. 787/1). Kullanış biçimi ancak tescilden kapsam açıkça anlaşılmıyorsa ve tescilin sınırları içinde dikkate alınır (TMK m. 787/2). "Uzun süre kullandı, kapsam genişledi" yaygın bir yanılgıdır.

  - soru: |
      Tarım arazisine hizmet eden bir tarla yolu irtifakından yararlanan Ayşe, arazisinde ağır tonajlı araçların sürekli geçeceği bir üretim tesisi kurmuş ve yüklü malikten yolu buna göre kullanmasına katlanmasını istemiştir. TMK m. 788'e göre hangisi doğrudur?
    siklar:
      - "Yararlanan taşınmazın ihtiyaçları değiştiği için yüklü malik artan yüke katlanmak zorundadır."
      - "İrtifak ihtiyaç arttığında kendiliğinden genişler."
      - "Yararlanan taşınmazın ihtiyaçlarındaki değişiklik, yüklü taşınmazın irtifaktan doğan yükünü ağırlaştıramaz."
      - "Yüklü malik yalnız bedel ödenirse artan yüke katlanmak zorunda kalır."
    dogru: 2
    aciklama: |
      Yararlanan taşınmazın ihtiyaçlarındaki değişiklik, yüklü taşınmazın irtifaktan doğan yükünü ağırlaştıramaz (TMK m. 788). İhtiyacın artması irtifakı genişletmez. Kanun metninde artan yük için bedel karşılığında katlanma gibi bir imkân öngörülmemiştir.

  - soru: |
      Ali'nin parseli lehine Bora'nın parselinde kurulmuş geçide, kullanımı kolaylaştırmak için parke taşı döşenmiştir. Bora da aynı yolu kendi ahırına ulaşmak için kullanmaktadır. Parkenin bakım giderleri TMK m. 790'a göre nasıl karşılanır?
    siklar:
      - "Tamamını Bora karşılar; çünkü yük onun taşınmazındadır."
      - "Tamamını Ali karşılar; çünkü tesis yararlanan taşınmaza aittir ve Bora'nın yararı önemsizdir."
      - "Bakım yükü kanunda düzenlenmemiştir; mahkeme eşit paylaştırır."
      - "Bakım kural olarak Ali'ye aittir; tesis Bora'ya da yararlı olduğundan her ikisi yararları oranında katılır."
    dogru: 3
    aciklama: |
      Tesislerin bakımı yararlanan taşınmaz malikine aittir; tesisler yüklü malike de yararlıysa giderlere her iki malik yararları oranında katılır (TMK m. 790). Yaygın yanılgı, bakım yükünü yüklü malike yüklemektir; kural tam tersidir.

  - soru: |
      TMK m. 791'e göre irtifakın başka yere nakli konusunda aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İrtifakın kullanılacağı yer tapuda belirtilmişse yüklü malik nakil isteyemez."
      - "Nakil giderlerini her hâlde yararlanan malik üstlenir."
      - "Yüklü malik, menfaatini ispat edip giderleri üstlenmek kaydıyla, irtifakın kullanılmasını güçleştirmeyecek biçimde nakil isteyebilir."
      - "İrtifak taşınmazın tamamı üzerinde olsa da nakil istenebilir."
    dogru: 2
    aciklama: |
      Yüklü malik, menfaatini ispat etmek ve giderleri üstlenmek kaydıyla irtifakın, kullanmayı güçleştirmeyecek biçimde taşınmazın başka bir yerine naklini isteyebilir (TMK m. 791/1). Yer tapuda belirtilmiş olsa bile bu yetki kullanılabilir (TMK m. 791/2). Kural, irtifakın taşınmazın yalnız belli bir kısmının kullanılması koşuluyla kurulmuş olmasını arar.

  - soru: |
      Mehmet'in M parseli lehine Zeynep'in Z parselinde araç geçidi irtifakı vardır. Mehmet M'yi M1, M2 ve M3 parsellerine ayırmıştır; durum ve koşullara göre geçit yalnız M1'in yararına kullanılabilmektedir. Zeynep ne yapabilir?
    siklar:
      - "Hiçbir şey yapamaz; irtifak bölünmeden sonra her parsel yararına devam eder ve terkin istenemez."
      - "M2 ve M3 için terkin isteyebilir; tapu sicil memuru istemi irtifak sahibine bildirir ve bir ay içinde itiraz edilmezse terkin eder."
      - "Tapu memuruna başvurup irtifakı kendiliğinden tamamen kaldırabilir."
      - "Otuz gün içinde mahkemede terkin davası açmak zorundadır; memur bu işlemi yapamaz."
    dogru: 1
    aciklama: |
      Yararlanan taşınmaz bölünürse kural irtifakın her parsel yararına devam etmesidir, ancak irtifak yalnız bir parselin yararına kullanılabiliyorsa yüklü malik diğer parseller için terkin isteyebilir (TMK m. 792/1-2). Tapu sicil memuru istemi hak sahibine bildirir ve bir ay içinde itiraz edilmezse terkin eder (TMK m. 792/3). Süre otuz gün değil bir aydır ve bu terkin için dava şart değildir.

  - soru: |
      Yüklü A parseli K1, K2 ve K3 olarak üç parsele bölünmüştür. Geçit yalnız K1 üzerinde kullanılmaktadır ve durum ve koşullara göre K3 üzerinde kullanılamayacaktır. K3'ün maliki Ece ne isteyebilir?
    siklar:
      - "Hiçbir şey; irtifak bölünmede mutlaka her parsel üzerinde sürer."
      - "K3 üzerindeki irtifakın terkinini; tapu sicil memuru bunu hak sahibine bildirir ve bir ay içinde itiraz gelmezse terkin eder."
      - "Yalnız K1'in maliki terkin isteyebilir."
      - "Terkini ancak yararlanan malikin yazılı beyanı olduğunda ve mahkeme kararıyla isteyebilir."
    dogru: 1
    aciklama: |
      Yüklü taşınmaz bölünürse kural irtifakın her parsel üzerinde devamıdır; ancak irtifak belirli parseller üzerinde kullanılmıyorsa ve durum ve koşullara göre de kullanılamayacaksa, bu parsellerin maliklerinden her biri kendi taşınmazı üzerindeki irtifakın terkinini isteyebilir (TMK m. 793/1-2). Usul TMK m. 792'deki gibidir: bildirim ve bir aylık itiraz süresi (TMK m. 793/3).

  - soru: |
      Arda, geçit irtifakıyla yüklü parseli sattıktan sonra alıcıya irtifakı kaldırtmayı taahhüt etmiştir. Arda irtifakın kaldırılması için dava açmak istemektedir. Yargıtay'ın bu konudaki yaklaşımına göre hangisi doğrudur?
    siklar:
      - "Arda açabilir; çünkü taahhüdü ona dava hakkı verir."
      - "Dava, yararlanan taşınmazın eski maliki tarafından açılmalıdır."
      - "Arda açamaz; terkin davasını mülkiyeti kısıtlanan yüklü taşınmazın kayıt maliki açar."
      - "Dava yalnız tapu sicil memuru tarafından açılabilir."
    dogru: 2
    aciklama: |
      Yargıtay, terkin davasını yüklü taşınmazın kayıt malikinin açabileceğini; taşınmazı satan önceki maliklerin terkin taahhüdünün onlara dava hakkı vermediğini, hukuki yararları ve aktif dava ehliyetleri bulunmadığını belirtmiştir. TMK m. 785/1 de terkin istemini yüklü taşınmazın malikine tanır. Tapu memurunun re'sen hâkime başvurması ise TMK m. 1026/3'e dayanan ayrı bir yoldur.

  - soru: |
      İdare, bir taşınmazın mülkiyetini kamulaştırmak yerine yalnız yüksek gerilim hattının geçtiği şerit için kamulaştırma yoluyla irtifak kurmak istemektedir. 2942 sayılı Kanun m. 4'e göre hangisi doğrudur?
    siklar:
      - "Kamulaştırma yoluyla irtifak kurulamaz; idare yalnız mülkiyeti kamulaştırabilir."
      - "İdare yalnız taşınmazın tamamı için irtifak kurabilir."
      - "Amaç için yeterliyse taşınmazın belirli kesimi, yüksekliği, derinliği veya kaynak üzerinde kamulaştırma yoluyla irtifak kurulabilir."
      - "İdare yalnız taşınmazın altında irtifak kurabilir; yüksekliği kapsayamaz."
    dogru: 2
    aciklama: |
      2942 sayılı Kanun m. 4/1, mülkiyetin kamulaştırılması yerine, amaç için yeterliyse taşınmazın belirli kesimi, yüksekliği, derinliği veya kaynak üzerinde kamulaştırma yoluyla irtifak hakkı kurulabileceğini söyler. Şerit üzerinde irtifak bu hükme uygundur; mülkiyet malikte kalır.

olaylar:
  - olay: |
      Ali'nin A parselinin genel yola çıkışı Bora'nın B parselinden geçmektedir. 2023'te Ali ile Bora aralarında adi yazılı bir "geçit sözleşmesi" imzalamış, tapuya gitmemiştir. 2024'te tapu müdürlüğünde resmî senet düzenlenmiş ve B parseli aleyhine, A parseli lehine "3 metre genişliğinde yaya geçidi" olarak irtifak tescil edilmiştir.

      2026'da Ali, A parseline bir atölye kurmuş ve geçitten kamyon geçirmek istemektedir. Bora, tescilde yalnız yaya geçidi yazdığını ileri sürerek buna karşı çıkmaktadır. Ali ayrıca geçide kullanımı kolaylaştırmak için parke taşı döşetmiştir. Bora da bu parkeli yolu kendi ahırına ulaşmak için kullanmaktadır. Parkenin onarım gereği doğunca Ali, "yük senin taşınmazında, masrafı sen karşıla" demiş, Bora ise "tamamını sen karşılarsın" cevabını vermiştir.

      1. 2023 tarihli sözleşme irtifak doğurmuş mudur?
      2. İrtifak hangi tarihte ve hangi işlemle doğmuştur? Resmî senedi kim düzenler?
      3. Ali geçitten kamyon geçirebilir mi?
      4. Parkenin bakım giderlerini kim, hangi oranda karşılar?
    olcut:
      - {tespit: "2023 tarihli adi yazılı sözleşmenin resmî şekle uymadığı için geçersiz olması ve irtifak doğurmaması", puan: 20, madde: "TMK m. 781"}
      - {tespit: "İrtifakın tescille doğması; etkisinin yevmiye kaydından başlaması", puan: 15, madde: "TMK m. 780"}
      - {tespit: "Resmî senedin tapu sicil müdürlüğünce düzenlenmesi", puan: 10, madde: "2644 sayılı Kanun m. 26"}
      - {tespit: "Kapsamın tescile göre belirlenmesi; tescilde yaya geçidi yazdığı için kamyon geçişinin kapsam dışı olması", puan: 20, madde: "TMK m. 787"}
      - {tespit: "Yararlanan taşınmazın ihtiyaçlarındaki değişikliğin yükü ağırlaştıramaması", puan: 15, madde: "TMK m. 788"}
      - {tespit: "Bakımın kural olarak yararlanan malike ait olması; tesis yüklüye de yararlı olduğundan giderlerin yararları oranında paylaşılması", puan: 20, madde: "TMK m. 790"}
    cozum: |
      **Nitelendirme:** Ali'nin A parseli lehine, Bora'nın B parseli üzerinde bir geçit irtifakı kurulmuştur. Yararlanan taşınmaz A, yüklü taşınmaz B'dir; yük, Bora'nın Ali'nin geçmesine katlanması biçimindedir (TMK m. 779/1).

      **Hukuki sorunlar:** (1) 2023 sözleşmesinin geçerliliği; (2) irtifakın doğuş anı ve resmî senedi düzenleyen makam; (3) kapsamın belirlenmesi ve ihtiyaç değişikliği; (4) bakım giderleri.

      **İlgili hükümler:** TMK m. 779, 780, 781, 787, 788, 790, 1015, 1021 ve 1022; 2644 sayılı Kanun m. 26.

      **Değerlendirme:**

      *1. 2023 sözleşmesi:* İrtifak kurmaya ilişkin sözleşmenin geçerliliği resmî şekilde düzenlenmesine bağlıdır (TMK m. 781). Hukuki sebebin geçerliliği için gerekli şekle uyulduğunun ispatı tescil için aranır (TMK m. 1015/3). Adi yazılı sözleşme bu şekil şartını karşılamadığından geçersizdir; ayrıca tescil de yapılmadığı için irtifak doğmamıştır (TMK m. 780/1; TMK m. 1021).

      *2. Doğuş anı:* İrtifak hakkının kurulması için tescil şarttır (TMK m. 780/1). Ayni haklar kütüğe tescille doğar ve etki, belgeler isteme eklenmişse yevmiye defterine yapılan kayıt tarihinden başlar (TMK m. 1022/1-2). Bu nedenle irtifak 2024'te, resmî senedin düzenlenip tescil istemiyle yevmiyeye kaydedildiği anda başlayan tescille doğmuştur. Mülkiyete ve sınırlı ayni haklara ilişkin resmî senetleri tapu sicil müdürü veya tapu sicil görevlileri düzenler (2644 sayılı Kanun m. 26).

      *3. Kamyon geçişi:* Kapsam, tescil irtifaktan doğan yetki ve yükümlülükleri açıkça belirlediği ölçüde tescile göre tayin edilir (TMK m. 787/1). Tescil "3 metre genişliğinde yaya geçidi" demektedir; kapsam açık olduğundan kullanış biçimine veya kazanma sebebine başvurulmaz (TMK m. 787/2). Ayrıca yararlanan taşınmazın ihtiyaçlarındaki değişiklik, yüklü taşınmazın yükünü ağırlaştıramaz (TMK m. 788). Atölye kurulması ihtiyacı değiştirmiş olsa da Bora kamyon geçişine katlanmak zorunda değildir.

      *4. Bakım:* İrtifakın kullanılması için gerekli tesislerin bakımı kural olarak yararlanan taşınmaz malikine, yani Ali'ye aittir (TMK m. 790/1). Ancak tesis yüklü taşınmazın malikine de yararlı ise, giderlere her iki malik yararları oranında katılır (TMK m. 790/2). Bora parkeli yolu ahırına gitmek için kullandığından giderin tamamını Ali'ye yükleyemez; Ali de "tamamı yüklü malike ait" diyemez.

      **Sonuç:**
      - 2023 sözleşmesi geçersizdir; irtifak 2024'teki tescille doğmuştur.
      - Resmî senet tapu sicil müdürlüğünde düzenlenir.
      - Ali kamyon geçiremez; kapsam tescile göredir ve ihtiyaç değişikliği yükü artıramaz.
      - Parke giderlerine kural olarak Ali katılır; Bora yararı oranında paylaşır.

  - olay: |
      Zeynep'in Z parselinin ortasından, Mehmet'in M parseli lehine bir araç geçidi irtifakı geçmektedir. Güzergâh tapudaki krokide gösterilmiştir. Zeynep parselin ortasına ev yapmak istemekte, geçidi aynı uzunlukta ve aynı genişlikte olmak üzere parselin doğu sınırına kaydırmayı önermekte ve masrafların kendisine ait olacağını söylemektedir. Mehmet, "yer tapuda yazılı" diyerek karşı çıkmaktadır.

      Bir süre sonra Mehmet, M parselini üç parsele (M1, M2, M3) ayırır. M2 ve M3 kendi cephelerinden doğrudan genel yola bağlanmaktadır. Durum ve koşullara göre geçit yalnız M1'in yararına kullanılabilmektedir. Zeynep, geçidin M2 ve M3 bakımından kaldırılmasını istemektedir.

      1. Zeynep geçidin yerinin değiştirilmesini isteyebilir mi? Mehmet'in "yer tapuda yazılı" itirazı yerinde midir?
      2. Nakil bakımından hangi şartlar aranır, giderleri kim üstlenir?
      3. Mehmet'in parseli bölününce irtifakın durumu ne olur?
      4. Zeynep M2 ve M3 için ne isteyebilir, usul nasıl işler?
    olcut:
      - {tespit: "İrtifakın taşınmazın belli bir kısmıyla sınırlı olması ve nakil isteminin kanuni dayanağı", puan: 15, madde: "TMK m. 791"}
      - {tespit: "Nakil şartları: menfaatin ispatı, giderlerin yüklü malik tarafından üstlenilmesi, kullanmanın güçleşmemesi", puan: 25, madde: "TMK m. 791"}
      - {tespit: "Yerin tapuda belirtilmiş olmasının nakle engel olmaması", puan: 15, madde: "TMK m. 791"}
      - {tespit: "Yararlanan taşınmaz bölününce kural olarak irtifakın her parsel yararına devam etmesi", puan: 15, madde: "TMK m. 792"}
      - {tespit: "Geçit yalnız M1'in yararına kullanılabildiğinden yüklü malikin diğer parseller için terkin isteyebilmesi", puan: 15, madde: "TMK m. 792"}
      - {tespit: "Tapu sicil memurunun istemi hak sahibine bildirmesi ve bir ay içinde itiraz edilmezse terkin etmesi; dava açmanın şart olmaması", puan: 15, madde: "TMK m. 792"}
    cozum: |
      **Nitelendirme:** Z parseli yüklü, M parseli yararlanan taşınmazdır. İrtifak, Z'nin yalnız belli bir kısmının (güzergâhın) kullanılması koşuluyla kurulmuş bir araç geçidi irtifakıdır. Uyuşmazlık iki konuda toplanır: irtifakın yerinin değiştirilmesi ve yararlanan taşınmazın bölünmesi.

      **Hukuki sorunlar:** (1) Nakil istemi ve şartları; (2) tapuda yerin belirtilmesinin etkisi; (3) yararlanan taşınmaz bölününce irtifakın akıbeti; (4) terkin usulü.

      **İlgili hükümler:** TMK m. 791, 792 ve 779.

      **Değerlendirme:**

      *1-2. Nakil:* İrtifak yüklü taşınmazın yalnız belli bir kısmının kullanılması koşuluyla kurulmuşsa, yüklü taşınmazın maliki menfaatini ispat etmek ve giderleri üstlenmek kaydıyla irtifakın, hakkın kullanılmasını güçleştirmeyecek biçimde taşınmazın başka bir yerine naklini isteyebilir (TMK m. 791/1). Dört şart vardır: belli kısımla sınırlı irtifak, menfaatin ispatı, giderlerin yüklü malike ait olması ve kullanmanın güçleşmemesi. Olayda güzergâh taşınmazın belli bir kısmıdır; Zeynep ev yapma menfaatini ispat etmeli, masrafları üstlenmeli ve yeni güzergâhın aynı uzunlukta ve genişlikte olması nedeniyle kullanmayı güçleştirmediğini göstermelidir. Olguda kullanmanın güçleştiğine dair bir bilgi yoktur.

      *Tapudaki yer:* İrtifak hakkının kullanılacağı yer tapu kütüğünde belirtilmiş olsa bile yüklü malik bu yetkiyi kullanabilir (TMK m. 791/2). Mehmet'in "yer tapuda yazılı" itirazı bu nedenle nakle engel değildir. İtiraz, ancak şartlardan biri gerçekleşmediği gerekçesine dayanırsa dinlenir.

      *3. Bölünme:* Yararlanan taşınmaz parsellere bölünürse kural irtifakın her parsel yararına devam etmesidir (TMK m. 792/1). Bu nedenle M1, M2 ve M3 kural olarak irtifaktan yararlanmaya devam eder.

      *4. Terkin:* Durum ve koşullara göre irtifak yalnız bir parselin yararına kullanılabiliyorsa, yüklü taşınmazın maliki diğer parseller için terkin isteyebilir (TMK m. 792/2). Olayda geçit yalnız M1'in yararına kullanılabildiğinden Zeynep M2 ve M3 için terkin isteyebilir. Tapu sicil memuru bu istemi irtifak hakkı sahibine bildirir ve onun bir ay içinde itiraz etmemesi hâlinde irtifak hakkını terkin eder (TMK m. 792/3). Terkin için dava açmak şart değildir; süre otuz gün değil bir aydır.

      **Sonuç:**
      - Zeynep, şartları sağlarsa nakil isteyebilir; yerin tapuda yazılı olması engel değildir.
      - Bölünme sonrası irtifak kural olarak her parsel yararına sürer.
      - Zeynep M2 ve M3 için terkin isteyebilir; memur bildirir, bir ay içinde itiraz gelmezse terkin eder.

  - olay: |
      Ayşe, lehine geçit irtifakı bulunan Y parselini ve bu geçitle yüklü X parselini ayrı ayrı satın almıştır. Terkin yaptırmamıştır. Daha sonra Y parselini tapuda Can'a satmış ve devretmiştir. Bir süre sonra X parselini de Deniz'e satmıştır.

      Sonradan imar uygulamasıyla Y parseline doğrudan genel yola cephe verilmiş ve geçidin Y'ye hiçbir yararı kalmamıştır. Deniz, X üzerindeki geçit irtifakının kaldırılmasını istemekte, Can ise buna rıza göstermemektedir.

      1. Ayşe iki parsele birlikte malikken irtifak sona ermiş midir? Ne yapabilirdi?
      2. Can, imar uygulamasından önce geçidi kullanabilir mi?
      3. Deniz hangi hükme dayanarak ne ister? Neyi ispat etmelidir?
      4. Terkin için rıza gerekli midir? Rıza yoksa hangi yola gidilir ve davada kimler taraf olmalıdır?
    olcut:
      - {tespit: "İki taşınmaza aynı kişinin malik olmasının irtifakı kendiliğinden bitirmemesi; malikin terkin ettirebilmesi", puan: 20, madde: "TMK m. 784"}
      - {tespit: "Terkin edilmediği için irtifakın ayni hak olarak sürmesi; Can'ın hakkı kullanabilmesi", puan: 15, madde: "TMK m. 784"}
      - {tespit: "Y için hiçbir yarar kalmadığından yüklü malikin terkin isteyebilmesi", puan: 25, madde: "TMK m. 785"}
      - {tespit: "Kaldırmayı isteyen yüklü malikin yararın kalmadığını ispat etmesi", puan: 10, madde: "TMK m. 785"}
      - {tespit: "Terkinin kaydın hak sağladığı kişinin yazılı beyanıyla yapılması; rıza yoksa mahkemeye gidilmesi", puan: 15, madde: "TMK m. 1014"}
      - {tespit: "Kaldırma davasında yararlanan ve yüklü taşınmaz maliklerinin tamamının taraf olması", puan: 15, madde: "TMK m. 785"}
    cozum: |
      **Nitelendirme:** Y parseli yararlanan, X parseli yüklü taşınmazdır; aralarındaki ilişki geçit irtifakıdır (TMK m. 779/1). Olay, taşınmazların bir süre aynı malikte birleşmesini, yararlanan taşınmazın devrini ve yararın sonradan ortadan kalkmasını içerir.

      **Hukuki sorunlar:** (1) Birleşmenin sonucu; (2) devirden sonra irtifakın durumu; (3) yararın kalmaması hâlinde terkin ve ispat; (4) rıza, dava ve taraflar.

      **İlgili hükümler:** TMK m. 783, 784, 785 ve 1014.

      **Değerlendirme:**

      *1. Birleşme:* Yüklü ve yararlanan taşınmazlara aynı kimse malik olursa bu kişi irtifak hakkını terkin ettirebilir; ancak terkin edilmedikçe irtifak ayni hak olarak varlığını sürdürür (TMK m. 784). Ayşe terkin yaptırmadığı için irtifak kendiliğinden sona ermemiştir. İrtifak, tescilin terkini veya taşınmazın yok olmasıyla sona erer (TMK m. 783); olayda bunlar gerçekleşmemiştir.

      *2. Devir:* İrtifak sicilde durmaktadır ve yararlanan taşınmazla birlikte Can'a geçmiştir. Bu nedenle Can, imar uygulamasından önce geçidi kullanabilir. Hakkın yararlanan taşınmaza bağlı olması, irtifakın öğretideki temel özelliğidir.

      *3. Terkin:* Lehine irtifak kurulan taşınmaz için bu hakkın sağladığı hiçbir yarar kalmamışsa yüklü taşınmazın maliki hakkın terkinini isteyebilir (TMK m. 785/1). Y'ye doğrudan genel yola cephe verildiğinden geçidin Y'ye hiçbir yararı kalmamıştır. Deniz, yüklü X parselinin yeni maliki olarak istemde bulunabilir. Yargıtay uygulamasına göre kaldırmayı isteyen yüklü malik, yararın kalmadığını ispat etmelidir; bu, imar planı, tapu ve keşifle gösterilebilir.

      *4. Rıza ve dava:* Tescilin terkini ancak kaydın kendilerine hak sağladığı kimselerin yazılı beyanı üzerine yapılabilir (TMK m. 1014); burada hak sahibi yararlanan malik Can'dır. Can rıza göstermediği için Deniz'in dava yoluna gitmesi gerekir. Yargıtay, kaldırma davalarında yararlanan ve yüklü taşınmazların maliklerinin tamamının taraf olmasını aramaktadır. Dava Can'a ve gerekli diğer maliklere yöneltilmelidir.

      **Sonuç:**
      - Ayşe'nin malikliği sırasında irtifak sona ermemiştir; Ayşe terkin ettirebilirdi.
      - Can imar uygulamasından önce geçidi kullanabilir.
      - Deniz, hiçbir yarar kalmadığını ispat ederek TMK m. 785/1'e dayanıp terkin isteyebilir.
      - Can rıza göstermediğinden dava gerekir; ilgili tüm malikler taraf olmalıdır.

kartlar:
  - on: "Taşınmaz irtifakının tanımı? (TMK m. 779/1)"
    arka: "Bir taşınmaz üzerinde başka bir taşınmaz lehine konulmuş yük. Yüklü malik ya kaçınmaya ya da katlanmaya mecburdur."
  - on: "Olumlu ve olumsuz irtifak?"
    arka: "Olumsuz: yüklü malik bazı yetkileri kullanmaktan kaçınır (yapı yapmama). Olumlu: yararlanan malikin kullanımına katlanır (geçit). Adlandırma öğretiye aittir."
  - on: "Yapma borcu irtifakın konusu olabilir mi? (TMK m. 779/2)"
    arka: "Başlı başına konu olamaz; ancak yan edim olarak irtifaka bağlanabilir."
  - on: "İrtifak ne zaman kurulur? (TMK m. 780/1)"
    arka: "Kural olarak tapu kütüğüne tescille. Kurulması tescile tâbi ayni hak, tescil edilmedikçe varlık kazanamaz (TMK m. 1021). İstisna: dışarıdan görülen mecra irtifakı (TMK m. 727/3)."
  - on: "İrtifak sözleşmesinin şekli? (TMK m. 781)"
    arka: "Geçerlilik resmî şekle bağlıdır. Resmî senedi tapu sicil müdürlüğü düzenler (2644 sayılı Kanun m. 26). Adi yazılı sözleşme geçersizdir."
  - on: "Dışarıdan görülen mecra irtifakı nasıl doğar? (TMK m. 727/3)"
    arka: "Noterce düzenlenen sözleşmeye dayanılarak mecranın yapılmasıyla; tescil şart değildir. Dışarıdan görülmüyorsa tesciliyle doğar."
  - on: "Malik irtifakı nedir? (TMK m. 782)"
    arka: "Malikin kendisine ait iki taşınmazdan biri üzerinde diğeri lehine kurduğu irtifak."
  - on: "İrtifak hangi hâllerde sona erer? (TMK m. 783)"
    arka: "Tescilin terkini veya yüklü ya da yararlanan taşınmazın yok olmasıyla. Terkin yararlanan malikin yazılı beyanıyla yapılır (TMK m. 1014)."
  - on: "İki taşınmaz aynı kişiye geçerse irtifak ne olur? (TMK m. 784)"
    arka: "Kendiliğinden sona ermez. Malik terkin ettirebilir; terkin edilmedikçe irtifak ayni hak olarak sürer."
  - on: "TMK m. 785/1 ile 785/2 farkı?"
    arka: "785/1: hakkın sağladığı hiçbir yarar kalmamış. 785/2: yüküne oranla çok az yarar var; terkin bedel karşılığında kısmen veya tamamen istenir. İstemde bulunan yüklü malikidir."
  - on: "TMK m. 785 davasında ispat yükü kimdedir?"
    arka: "Yargıtay uygulamasına göre kaldırma isteyen yüklü malik, ihtiyacın sona erdiğini veya çok az yarar kaldığını ispat eder. Davada ilgili tüm malikler taraf olmalıdır."
  - on: "Terkin davasını kim açar?"
    arka: "Yüklü taşınmazın kayıt maliki. Taşınmazı satmış önceki malikin terkin taahhüdü ona dava hakkı vermez."
  - on: "Hak sahibinin ve yüklü malikin yetkileri? (TMK m. 786)"
    arka: "Hak sahibi gerekli önlemleri alır ama yüklü malike en az zarar verir. Yüklü malik kullanımı engelleyemez veya zorlaştıramaz."
  - on: "Kapsam hangi sırayla belirlenir? (TMK m. 787)"
    arka: "Önce tescil. Tescil açık değilse tescilin sınırları içinde kazanma sebebi veya uzun süreli, davasız, iyiniyetli kullanış biçimi."
  - on: "Yararlanan taşınmazın ihtiyacı artarsa? (TMK m. 788)"
    arka: "Yüklü taşınmazın yükü ağırlaştırılamaz."
  - on: "Geçit hakları ve benzerlerinde kapsam için hangi sıra? (TMK m. 789)"
    arka: "Önce taraflar arasındaki anlaşma veya özel kanun hükümleri; yoksa yerel âdet."
  - on: "Bakım giderlerini kim karşılar? (TMK m. 790)"
    arka: "Kural olarak yararlanan malik. Tesis yüklü malike de yararlıysa her ikisi yararları oranında katılır."
  - on: "İrtifakın nakli için şartlar? (TMK m. 791)"
    arka: "İrtifak taşınmazın belli bir kısmıyla sınırlı; yüklü malik menfaatini ispat eder, giderleri üstlenir; kullanma güçleşmez. Yer tapuda yazılı olsa da nakil istenebilir."
  - on: "TMK m. 746 ile TMK m. 791'de nakil giderleri?"
    arka: "TMK m. 791'de giderleri yüklü malik üstlenir. Mecra naklinde (TMK m. 746) giderler kural olarak mecra hakkı sahibine aittir."
  - on: "Yararlanan veya yüklü taşınmaz bölünürse irtifak? (TMK m. 792 ve TMK m. 793)"
    arka: "Kural olarak her parsel yararına veya üzerinde devam eder. Kullanılmayan parseller için terkin istenirse tapu sicil memuru bildirir; bir ay içinde itiraz yoksa terkin eder."
  - on: "TMK m. 785 ile TMK m. 1026 farkı?"
    arka: "TMK m. 785: hak mahkeme kararıyla sona erdirilir. TMK m. 1026: hak zaten sona ermiş ve kayıt değerini yitirmiştir; yüklü malik terkin ister, ilgili tebliğden itibaren otuz gün içinde dava açabilir."
  - on: "Taşınmaz irtifakı ile TMK m. 838 irtifakı?"
    arka: "Taşınmaz irtifakı başka taşınmaz lehinedir. TMK m. 838 irtifakı kişi veya topluluk lehinedir; aksi kararlaştırılmadıkça devredilemez, mirasçılara geçmez. Taşınmaz irtifakı hükümleri ona da uygulanır (TMK m. 838/3)."
  - on: "Kamulaştırma yoluyla irtifak? (2942 sayılı Kanun m. 4)"
    arka: "Mülkiyet yerine, amaç için yeterliyse taşınmazın belirli kesimi, yüksekliği, derinliği veya kaynak üzerinde irtifak kurulabilir."
