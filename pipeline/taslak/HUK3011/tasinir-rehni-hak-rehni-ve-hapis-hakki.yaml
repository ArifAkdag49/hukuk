  - id: "570928500"
    ozet: |
      Davacı banka ile bir kömür şirketi arasında 3 Nisan 2007'de menkul rehni sözleşmesi yapılmış ve bankadan kullanılan kredilerden doğan borçların güvencesi olarak kömür birinci sırada rehnedilmiştir. Banka aynı gün kömürü yediemin teslim ve tesellüm tutanağıyla davalı gerçek kişiye teslim etmiş; davalı şirket de antrepo senedi başlıklı belgeyle kömürün banka adına ayrı bir bölmede tutulduğunu kabul etmiş, davalılar kömürü bankanın yazılı muvafakati olmadan kimseye teslim etmeyeceklerini taahhüt etmiştir. Kredi ödenmeyince banka kömürü istemiş, kömür hazır edilmemiş ve banka şimdilik 100.000 USD tazminat istemiştir. Davalılar kömürün bankanın bilgisiyle sürekli satılıp yenilendiğini savunmuştur. İlk derece mahkemesi rehnin bu nedenle sona erdiği gerekçesiyle davayı reddetmiş, Yargıtay 11. Hukuk Dairesi bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu, davalılarla yapılan sözleşmeleri yediemine tevdi değil genel saklama (vedia) sözleşmesi olarak nitelendirmiş ve bunların rehin sözleşmesinden bağımsız olduğunu, davanın bu sözleşmelere dayandığını belirtmiştir. Kurul ayrıca taşınırın rehin alacaklısı adına üçüncü kişiye teslimiyle geçerli taşınır rehninin kurulduğunu, üçüncü kişinin rehin borçlusunun denetim ve gözetim işini yapmasının ya da rehinli bölme dışındaki bazı yerlerin borçlu tarafından kullanılmasının kuruluşa engel olmadığını belirtmiştir. Bankanın kömürün çıkarılmasını bildiğini ve itiraz etmediğini ispat yükü davalılardadır. Direnme kararı genişletilmiş gerekçeyle oybirliğiyle bozulmuştur. Konuya katkısı: Karar madde numarası anmaz; ancak teslime bağlı rehinde zilyetliğin alacaklı adına malı tutan üçüncü kişiye devredilebildiğini, yeter ki malın fiilen yalnız rehnedenin hâkimiyetinde kalmamasını gösterir (TMK m. 939).
  - id: "84469500"
    ozet: |
      Davacı alacaklı, borçlunun davalı bankadaki hesaplarına haciz müzekkeresi göndermiş; banka hesapta 19.478,86 TL bulunduğunu, ancak kredi sözleşmeleri gereği borçlunun bütün hak ve alacaklarının bankaya rehinli olduğunu bildirerek istihkak iddiasında bulunmuştur. Banka, Genel Kredi Sözleşmesi ve 20.000 TL'lik nakit teminat için bloke ve rehin talimat mektubuna dayanmıştır. İcra hukuk mahkemesi, para üzerinde rehin ve hapis hakkı kurulamayacağı ve bankanın muaccel alacağı bulunmadığı gerekçesiyle istihkak iddiasının reddini kabul etmiştir. Yargıtay 17. Hukuk Dairesi bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu, hapis hakkını alıkoyma ve paraya çevirme yetkisi veren bir ayni hak olarak tanımlamış, çek mevzuatının bankaya yüklediği yasal ödeme yükümlülüğü nedeniyle mevduatın her çek yaprağı için yasal sorumluluk miktarıyla sınırlı olarak banka lehine rehinli sayılması gerektiğini ve rehin sözleşmede de yer aldığından bankanın bunu istihkak iddiası olarak ileri sürebileceğini kabul etmiştir. Direnme kararı oybirliğiyle bozulmuştur. Konuya katkısı: Banka hesabındaki alacak üzerinde sözleşmeyle kurulan rehnin haciz eden alacaklıya karşı ileri sürülebileceğini gösterir; "para üzerinde rehin kurulamaz" gerekçesi benimsenmemiştir. Gerekçe çek mevzuatına ve sözleşmeye dayandığından kararı mevduat rehni için genel bir kural olarak okumamak gerekir.
  - id: "1145668000"
    ozet: |
      Bir geminin kiracısı olan alacaklı, borçludan navlun sözleşmesinden doğan 56.812,50 USD navlun ve demuraj alacağını tahsil edememiştir. Alacaklı TTK m. 1201'e dayanarak, donatanı üçüncü kişi olan başka bir gemideki, borçluya ait farklı bir yük üzerinde hapis hakkı kullanılması ve defter tutulması için icra müdürlüğüne başvurmuş, müdürlük istemi reddetmiştir. İcra hukuk mahkemesi, müdürlüğün hapis hakkının şartlarını değerlendirme yetkisi bulunmadığı gerekçesiyle şikâyeti kabul etmiş, bölge adliye mahkemesi istinafı esastan reddetmiştir. Yargıtay 12. Hukuk Dairesi, TMK m. 950/1'e göre hapis hakkının doğumu ve kullanılması için alacaklının zilyetliğinin gerektiğini, teslime bağlı rehin hükümlerinin yapılarına aykırı düşmedikçe hapis hakkına da uygulandığını (TMK m. 953/1) ve zilyetlikten çıkma ile geri alamamanın hakkı sona erdirdiğini (TMK m. 943) belirtmiştir. Dolaylı yoldan bile zilyetlikte bulunmayan yük üzerinde hapis hakkı yoktur; icra müdürlüğü hakkın devamını resen inceleyebilir. İstinaf kararı kaldırılmış, ilk derece kararı oybirliğiyle bozulmuştur. Konuya katkısı: Zilyetliğin hapis hakkının hem doğum hem devam şartı olduğunu gösterir.

sorular:
  - soru: |
      TMK m. 939/1'e göre, kanunda öngörülen ayrık durumlar dışında bir taşınır nasıl rehnedilebilir?
    siklar:
      - "Yalnız yazılı bir rehin sözleşmesi yapılarak"
      - "Zilyetliğin alacaklıya devri suretiyle"
      - "Rehnin tapu siciline şerh verilmesiyle"
      - "Rehin sözleşmesinin noterde düzenleme şeklinde yapılmasıyla"
    dogru: 1
    aciklama: |
      Ayrık durumlar dışında taşınırlar ancak zilyetliğin alacaklıya devri suretiyle rehnedilebilir (TMK m. 939/1); rehnin adı da buradan gelir: teslime bağlı rehin. Yazılı sözleşme tek başına rehin kurmaz. Tapu siciline şerh ve noter düzenlemesi taşınır rehninin kuruluş şartı değildir.

  - soru: |
      Mehmet, Ayşe'den aldığı 60.000 TL borca karşılık kol saatini rehnetmek üzere Ayşe ile yazılı sözleşme imzalar. Saat, sözleşmeden sonra da Mehmet'in elinde kalır ve onu takmaya devam eder. Hangisi doğrudur?
    siklar:
      - "Rehin sözleşmenin imzalandığı anda doğar; teslim yalnız ispat içindir."
      - "Rehin doğar, ancak yalnız üçüncü kişilere karşı ileri sürülemez."
      - "Taşınır fiilen yalnız rehnedenin hâkimiyetinde kaldığı sürece rehin hakkı doğmaz."
      - "Rehin doğar, ama hükümleri askıda kalır."
    dogru: 2
    aciklama: |
      TMK m. 939/3'e göre taşınır fiilen yalnız rehnedenin hâkimiyetinde kaldığı sürece rehin hakkı doğmaz; yazılı sözleşme bunu değiştirmez. Hükümlerin askıda kalması, rehin kurulduktan sonra şeyin alacaklının rızasıyla rehnedenin hâkimiyetine geçmesine ilişkindir (TMK m. 943/2). Burada rehin hiç doğmamıştır.

  - soru: |
      Aşağıdakilerden hangisi TMK m. 940 hakkında doğrudur?
    siklar:
      - "TMK m. 940 mülga edilmiştir; bugün zilyetlik devredilmeden taşınır rehni kurulamaz."
      - "Yetkili makamlarca izin verilen kuruluşlar ve kooperatifler lehine hayvanlar üzerinde, zilyetlik devredilmeden icra dairesindeki özel sicile yazılarak rehin kurulabilir."
      - "Kanunen sicile tescili zorunlu taşınır mallar, her durumda ancak zilyetliğin alacaklıya devriyle rehnedilebilir."
      - "Hayvan rehni, ancak hayvanın alacaklıya teslimi hâlinde ve noterde düzenleme şeklindeki sözleşmeyle kurulabilir."
    dogru: 1
    aciklama: |
      TMK m. 940/1, izinli kuruluşlar ve kooperatifler lehine hayvanlar üzerinde zilyetlik devredilmeden icra dairesinde tutulacak özel sicile yazılarak rehin kurulmasına izin verir. TMK m. 940/2 ise kanun gereği sicile tescili zorunlu taşınırlarda malın kayıtlı olduğu sicile yazılarak rehin kurulmasını öngörür. Madde mülga değildir; yalnız "tüzükle" ibareleri 700 sayılı KHK ile "Cumhurbaşkanınca çıkarılan yönetmelikle" olmuştur.

  - soru: |
      Ali, 60.000 TL borcuna karşılık kol saatini Ayşe'ye rehin teslim etmiştir. Ali, başka bir borcu için aynı saat üzerinde Burak lehine art rehin kurmak istemektedir. Kanunun art rehnin kurulması için aradığı şey nedir?
    siklar:
      - "Saatin Burak'a teslim edilmesi"
      - "Rehinli alacaklı Ayşe'nin yazılı rızası"
      - "Alacağı ödenince saatin Burak'a teslim edileceğinin Ayşe'ye yazılı olarak bildirilmesi"
      - "Art rehnin Rehinli Taşınır Siciline tescili"
    dogru: 2
    aciklama: |
      Rehnedilen taşınırın maliki onun üzerinde art rehin kurabilir; bunun için alacağı ödenince rehnedilen taşınırın sonraki alacaklıya teslim edilmesinin rehinli alacaklıya yazılı olarak bildirilmesi gerekir (TMK m. 941). Rehinli alacaklının rızası aranmaz; rıza şartı alt rehne aittir (TMK m. 942). Saat Ayşe'de kalır, Burak'a teslim edilmez.

  - soru: |
      Alacaklı Ayşe, rehinli saati rehneden Mehmet'e sormadan kendi borcu için Can'a rehin olarak teslim eder. Hangisi doğrudur?
    siklar:
      - "Alacaklı rehinli taşınırı dilediği gibi rehnedebilir; rehnedene bildirim yeterlidir."
      - "Alt rehin ancak rehnedenin rızasıyla yapılabilir; rızasız yapan alacaklı bundan doğan bütün zararlardan sorumlu olur."
      - "Alt rehin, rehinli alacağın yazılı bildirimiyle geçerli olur; rehnedenin rızası aranmaz."
      - "Alacaklı kusursuzluğunu ispat ederse zararlardan sorumlu olmaz."
    dogru: 1
    aciklama: |
      Alacaklı rehinli taşınırı ancak rehnedenin rızasıyla bir başkasına rehnedebilir (TMK m. 942). Rehinli taşınırı kendiliğinden başkasına devir veya rehneden alacaklı, bundan doğan bütün zararlardan sorumlu olur (TMK m. 945/2). Yazılı bildirim şartı art rehne ilişkindir; kusursuzluğun ispatı ise TMK m. 945/1'deki kayıp ve değer azalması sorumluluğuna aittir.

  - soru: |
      TMK m. 943/1'e göre taşınır rehni hangi durumda sona erer?
    siklar:
      - "Alacaklının zilyetliği herhangi bir sebeple kaybettiği anda"
      - "Alacaklının zilyet olmaktan çıkması ve onu zilyet olan üçüncü kişiden geri alamaz hâle gelmesiyle"
      - "Rehnedenin rehinli şeyi bir süreliğine alacaklının rızasıyla kullanmasıyla"
      - "Rehinli şeyin değerinin alacaktan fazla olmasıyla"
    dogru: 1
    aciklama: |
      TMK m. 943/1, alacaklının zilyet olmaktan çıkmasını ve onu zilyet olan üçüncü kişiden geri alamaz hâle gelmesini birlikte arar. Zilyetlik kaybı tek başına yetmez; alacaklı şeyi geri alabildiği sürece rehin sürer. Alacaklının rızasıyla şeyin rehnedenin hâkimiyetine geçmesi rehni sona erdirmez, hükümlerini askıya alır (TMK m. 943/2).

  - soru: |
      Ali, rehinli tabloyu alacaklısının yazılı izniyle bir sergi için bir aylığına geri alır ve bu süre boyunca tablo yalnız Ali'nin hâkimiyetindedir. Hangisi doğrudur?
    siklar:
      - "Rehin kendiliğinden sona erer ve tablo kesin olarak Ali'ye döner."
      - "Rehin hiç doğmamış sayılır."
      - "Rehin sona ermez; tablo yalnız Ali'nin hâkimiyetinde bulunduğu sürece rehnin hükümleri askıda kalır."
      - "Rehin tam olarak işler; alacaklı bu süre içinde tablonun paraya çevrilmesini isteyebilir."
    dogru: 2
    aciklama: |
      Taşınır alacaklının rızasıyla fiilen yalnız rehnedenin hâkimiyeti altında bulunduğu sürece rehnin hükümleri askıda kalır (TMK m. 943/2). Rehin sona ermez; sona erme TMK m. 943/1'deki iki şartın birlikte gerçekleşmesine bağlıdır. Rehnin hiç doğmaması ise şeyin baştan beri yalnız rehnedende kalması hâlidir (TMK m. 939/3).

  - soru: |
      Zeynep, 100.000 TL borcuna karşılık altın bileziğini ve altın kolyesini alacaklısı Ali'ye rehin teslim etmiştir. Borcun 70.000 TL'sini öder ve kolyeyi geri ister. Hangisi doğrudur?
    siklar:
      - "Ali ödenen oran kadar rehinli şeyi geri vermek zorundadır."
      - "Ali, alacağının tamamını almadıkça rehinli şeyi veya bir kısmını geri vermek zorunda değildir."
      - "Kısmi ödeme rehni kendiliğinden sona erdirir."
      - "Kolyenin değeri kalan borçtan düşükse Ali kolyeyi geri vermelidir."
    dogru: 1
    aciklama: |
      Alacaklı, alacağının tamamını almadıkça rehinli taşınırı veya onun bir kısmını geri vermek zorunda değildir (TMK m. 944/2). Rehin, kalan alacak için tamamı üzerinde sürer. Kısmi ödeme rehni sona erdirmez ve oranlı iade doğurmaz.

  - soru: |
      TMK m. 946/2'ye göre taşınır rehni alacaklıya hangi alacakların güvencesini sağlar?
    siklar:
      - "Yalnız asıl alacağın; faiz ve giderler rehin kapsamı dışındadır."
      - "Asıl alacakla birlikte sözleşme faizlerinin, takip giderlerinin ve gecikme faizinin"
      - "Asıl alacakla birlikte yalnızca iflasın açıldığı tarihe kadar muaccel olmuş üç yıllık faizin"
      - "Asıl alacak ile sözleşme faizinin; takip giderleri ve gecikme faizi kapsam dışıdır."
    dogru: 1
    aciklama: |
      TMK m. 946/2'ye göre rehin hakkı asıl alacakla birlikte sözleşme faizlerinin, takip giderlerinin ve gecikme faizinin güvencesini sağlar. "Üç yıllık faiz" sınırı taşınmaz rehnine özgüdür (TMK m. 875/3); taşınır rehninde böyle bir yıl sınırı yoktur.

  - soru: |
      TMK m. 949'a göre aşağıdakilerden hangisi geçersizdir?
    siklar:
      - "Rehin sözleşmesinin tamamı"
      - "Borcun ödenmemesi hâlinde rehinli taşınırın mülkiyetinin alacaklıya geçmesini öngören sözleşme hükmü"
      - "Alacaklının rehnin paraya çevrilmesini isteme hakkı"
      - "Rehinli taşınırın zilyetliğinin alacaklıya devri"
    dogru: 1
    aciklama: |
      TMK m. 949, borcun ödenmemesi hâlinde rehinli taşınırın mülkiyetinin alacaklıya geçmesini öngören sözleşme hükmünü geçersiz sayar (lex commissoria yasağı). Alacaklının yolu, rehnin paraya çevrilmesini istemektir (TMK m. 946/1). Zilyetlik devri ise rehnin kuruluş şartıdır.

  - soru: |
      Tacir olmayan Ayten, dizüstü bilgisayarını X Bilişim Ltd. Şti.'ne tamire bırakmıştır. 8.000 TL tamir bedeli muaccel olduğu hâlde ödenmemiştir. Hangisi doğrudur?
    siklar:
      - "Ayten tacir olmadığı için bağlantı karinesi işlemez ve şirketin hapis hakkı doğmaz."
      - "Şirket, bilgisayarı ancak mahkemeden hapis kararı alarak alıkoyabilir."
      - "Şirket, borç ödenmezse bilgisayarın mülkiyetini kendiliğinden kazanır."
      - "Şirket, bilgisayarı borç ödeninceye kadar hapsedebilir; tamir alacağı ile bilgisayar arasında niteliği itibarıyla bağlantı vardır."
    dogru: 3
    aciklama: |
      Hapis hakkı için borçluya ait şeyin borçlunun rızasıyla alacaklının zilyetliğinde bulunması, borcun muaccel olması ve niteliği itibarıyla bağlantı gerekir (TMK m. 950/1). Tamir alacağı ile tamir edilen şey arasında bağlantı bu niteliği gereği vardır. Tacirler arasındaki bağlantı karinesi (TMK m. 950/2) yalnız karine kuran bir kuraldır; bağlantının bulunması için karineye başvurmak gerekmez. Alacaklının mülkiyeti kendiliğinden kazanması ise kanunen öngörülemez (TMK m. 949).

  - soru: |
      Terzi Hale, Nuri'nin sipariş ettiği takım elbiseyi dikmiş, bedelini almadan Nuri'ye teslim etmiştir. Nuri bedeli muacceliyet tarihinde ödemez. Hale, elbise üzerinde hapis hakkı kullanabilir mi?
    siklar:
      - "Evet; alacak muaccel olduğu için teslimden sonra da kullanabilir."
      - "Hayır; elbise artık Hale'nin zilyetliğinde olmadığı için hapis hakkı kullanılamaz."
      - "Evet; teslimden sonra otuz gün içinde mahkemeye başvurmak şartıyla."
      - "Evet; çünkü hapis hakkı alacak ödenene kadar şey kimde olursa olsun sürer."
    dogru: 1
    aciklama: |
      Hapis hakkı alacaklının zilyetliğine dayanır: Zilyetlik hem doğum hem devam şartıdır. Teslimle zilyetlik kaybedildiğinden Hale hapis hakkını kullanamaz (TMK m. 950/1; TMK m. 943/1). Teslimden sonra otuz günlük sürenin tanındığı hâl taşıyanın hapis hakkıdır ve özel bir hükme dayanır (TTK m. 1201).

  - soru: |
      Aşağıdakilerden hangisinde alacaklı, TMK m. 951'e göre hapis hakkını kullanamaz?
    siklar:
      - "Tamir edilen elektronik cihaz üzerinde, ücret muaccel olduğu hâlde ödenmemişse"
      - "Borcu muaccel olan borçluya ait kıymetli evrak üzerinde, alacakla bağlantı varsa"
      - "Yalnız sahibi için duygusal değeri olan, satılması mümkün olmayan kişisel mektuplar ve günlük üzerinde"
      - "Tacir borçlunun tacir alacaklıya ticarî ilişki içinde teslim ettiği mal üzerinde, borç muaccelse"
    dogru: 2
    aciklama: |
      Nitelikleri itibarıyla paraya çevrilmeye elverişli olmayan taşınırlar üzerinde hapis hakkı kullanılamaz (TMK m. 951/1). Kişisel mektup ve günlük bunun örneğidir. Diğer seçeneklerde TMK m. 950'nin şartları gerçekleşmiştir ve bir engel yoktur.

  - soru: |
      Terzi Elif, Kaan'ın ceketinde değişiklik yapmış; ücret ay sonunda ödenecektir ve henüz muaccel olmamıştır. Ceket hâlâ Elif'in elindedir. Bu sırada Kaan'ın ödemeden aciz durumuna düştüğü ortaya çıkar. Hangisi doğrudur?
    siklar:
      - "Ücret muaccel olmadığı için Elif ceketi hapsedemez."
      - "Elif ancak Kaan güvence gösterirse ceketi hapsedebilir; aciz bunu etkilemez."
      - "Elif, Kaan'ın ödemeden acze düşmesi nedeniyle alacağı muaccel olmasa bile hapis hakkını kullanabilir."
      - "Elif, ceketin mülkiyetini kendiliğinden kazanır."
    dogru: 2
    aciklama: |
      Alacaklı, borçlunun ödemeden acze düşmesi hâlinde alacağı muaccel olmasa bile hapis hakkını kullanabilir (TMK m. 952/1). Hapis hakkının diğer şartları (Kaan'a ait taşınır, rızayla zilyetlik, bağlantı) gerçekleşmiştir. Mülkiyetin kendiliğinden geçmesi hukuken söz konusu olamaz (TMK m. 949 mantığı).

  - soru: |
      TMK m. 953/1'e göre hapsedilen şeylerin paraya çevrilmesini istemek için hangisi gerekir?
    siklar:
      - "Borçlunun önceden bildirilmeksizin şeyin doğrudan satılması"
      - "Borcun yerine getirilmemesi, yeterli güvence gösterilmemesi ve borçluya daha önce bildirimde bulunulması"
      - "Hapis hakkının yargı kararıyla tespit edilmesi"
      - "Alacaklının şeyin mülkiyetini kazandığını borçluya bildirmesi"
    dogru: 1
    aciklama: |
      Borç yerine getirilmez ve yeterli güvence de gösterilmezse alacaklı, borçluya daha önce bildirimde bulunarak hapsettiği şeylerin teslime bağlı rehin hükümleri uyarınca paraya çevrilmesini isteyebilir (TMK m. 953/1). Önceden bildirim şarttır; mülkiyet kazanımı ise TMK m. 949 nedeniyle söz konusu olamaz.

  - soru: |
      Selin, Deniz'den olan ve senede bağlanmamış 200.000 TL satış bedeli alacağını bankaya rehnetmek için bankayla yazılı rehin sözleşmesi imzalar. Rehin Deniz'e ihbar edilmemiştir. Hangisi doğrudur?
    siklar:
      - "İhbar yapılmadıkça alacak rehni kurulmaz."
      - "Senet düzenlenip teslim edilmedikçe senetsiz alacak rehnedilemez."
      - "Yazılı rehin sözleşmesi yapıldığı için alacak rehni kurulmuştur; ihbar kuruluş şartı değildir."
      - "Alacak rehni ancak alacağın bankaya noterde devriyle kurulabilir."
    dogru: 2
    aciklama: |
      Senede bağlanmış olan veya olmayan alacakların rehni için rehin sözleşmesinin yazılı yapılması gerekir; senede bağlı alacaklarda ayrıca senet teslim edilir (TMK m. 955/1). Alacaklı veya rehneden rehni borçluya ihbar "edebilir" (TMK m. 955/2); ihbar kuruluş şartı değildir, etkisi borçlunun ödeme rejimindedir (TMK m. 961/2).

  - soru: |
      Hamile yazılı senetlerle diğer kıymetli evrakın rehni hakkında TMK m. 956'ya göre hangisi doğrudur?
    siklar:
      - "Her iki türde de yalnız yazılı rehin sözleşmesi yeterlidir."
      - "Hamile yazılı senedin rehni için ciro gerekir; diğer kıymetli evrakta teslim yeterlidir."
      - "Hamile yazılı senetlerin rehni için teslim yeterlidir; diğer kıymetli evrakta ciro ya da yazılı devir beyanıyla teslim gerekir."
      - "Her iki türde de rehnin Sicile tescili gerekir."
    dogru: 2
    aciklama: |
      Hamile yazılı senetlerin rehni için senetlerin rehin alacaklısına teslimi yeterlidir; diğer kıymetli evrakın rehni için senedin ciro edilmiş veya yazılı devir beyanı yapılmış olarak teslimi gerekir (TMK m. 956). Sicile tescil 6750 sayılı Kanun rejimine aittir.

  - soru: |
      Selin'in Deniz'den olan alacağı bankaya rehnedilmiş ve rehin Deniz'e ihbar edilmiştir. Deniz borcunu Selin'e ödemek ister, ancak banka buna rıza göstermez. Deniz ne yapmalıdır?
    siklar:
      - "Selin asıl alacaklı olduğu için borcu serbestçe Selin'e ödeyerek kurtulur."
      - "Borcu yalnız bankaya ödemek zorundadır; Selin'in rızası aranmaz."
      - "Rıza bulunmadığından borcunu tevdi etmekle yükümlüdür."
      - "Borcun ödenmesini Rehinli Taşınır Siciline bildirmelidir."
    dogru: 2
    aciklama: |
      Rehin kendisine ihbar edilmiş olan borçlu, borcunu asıl alacaklıya veya rehin alacaklısına ancak diğerinin rızasıyla ödeyebilir; bu rızanın bulunmaması hâlinde borçlu borcunu tevdi etmekle yükümlüdür (TMK m. 961/2-3). Sicile bildirim 6750 sayılı Kanun rejiminde söz konusudur ve burada yeri yoktur.

  - soru: |
      Tacir mobilya üreticisi Hakan Ltd., bankadan kredi alırken fabrikasındaki stoklarını bankaya teslim etmeden rehnetmek ister ve imzaları noterce onaylı yazılı rehin sözleşmesi yapar. 6750 sayılı Kanun m. 4/1'e göre rehin hakkı ne zaman kurulur?
    siklar:
      - "İmzaların noterce onaylandığı anda"
      - "Stokların bankaya fiilen teslim edildiği anda"
      - "Rehin sözleşmesinin Rehinli Taşınır Siciline tescil edilmesiyle"
      - "Sözleşmenin ticaret siciline bildirilmesiyle"
    dogru: 2
    aciklama: |
      Rehin hakkı, rehin sözleşmesinin Sicile tescil edilmesiyle kurulur (6750 sayılı Kanun m. 4/1) ve yine tescille üçüncü kişilere karşı hüküm ifade eder (6750 sayılı Kanun m. 9/1). Noter onayı tescil için gereken şekil şartıdır (6750 sayılı Kanun m. 4/4); kuruluş anı değildir. Zilyetliğin devri bu rejimde aranmaz.

  - soru: |
      6750 sayılı Kanunda hüküm bulunmayan hâllerde hangi hükümler uygulanır?
    siklar:
