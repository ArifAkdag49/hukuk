  - terim: Rehneden
    tanim: "Rehin hakkını kuran, yani malı güvence olarak veren kişi."
  - terim: Rehinli alacaklı
    tanim: "Alacağı rehinle güvence altına alınmış, rehin hakkı kendisine ait kişi."
  - terim: Art rehin
    tanim: "Rehinli şey üzerinde malikin, sonraki bir alacaklı lehine kurduğu rehin. Rehinli alacaklıya yazılı bildirim gerekir (TMK m. 941)."
  - terim: Alt rehin
    tanim: "Rehinli alacaklının elindeki şeyi başkasına rehnetmesi. Rehnedenin rızası gerekir (TMK m. 942)."
  - terim: Lex commissoria
    tanim: "Borç ödenmezse rehinli şeyin mülkiyetinin alacaklıya geçeceğine dair anlaşma. Taşınır rehninde sözleşme hükmü geçersizdir (TMK m. 949)."
  - terim: Hapis hakkı
    tanim: "Alacaklının, borçluya ait ve rızasıyla zilyedi olduğu şeyi borç ödeninceye kadar alıkoyma ve gerektiğinde paraya çevirtme yetkisi (TMK m. 950-953)."
  - terim: Ödemeden aciz
    tanim: "Borçlunun borçlarını ödeyemez duruma düşmesi. Hapis hakkında muacceliyet şartını kaldırır (TMK m. 952)."
  - terim: Paraya çevirme
    tanim: "Rehinli ya da hapsedilen şeyin satışıyla alacağın tahsil edilmesi (TMK m. 946/1 ve m. 953/1)."
  - terim: Alacak rehni
    tanim: "Devredilebilen alacak ve hakların rehni. Teslime bağlı rehin hükümleri aksine hüküm yoksa uygulanır (TMK m. 954)."
  - terim: Hamile yazılı senet
    tanim: "Alacaklısı belli bir isme değil, senedi elinde bulunduran kişiye yazılı senet. Rehni için teslim yeterlidir (TMK m. 956/1)."
  - terim: Tevdi
    tanim: "Borçlunun, rıza bulunmaması gibi bir sebeple borcunu doğrudan alacaklıya ödemek yerine yetkili yere bırakarak ifa etmesi (TMK m. 961/3)."
  - terim: Ayrık durum
    tanim: "Taşınırın zilyetlik devredilmeden rehnedilebildiği, kanunda öngörülen özel haller (TMK m. 939/1 ve m. 940)."
  - terim: Rehinli Taşınır Sicili
    tanim: "6750 sayılı Kanun kapsamındaki teslimsiz rehinlerin tescil edildiği merkezî ve aleni sicil (6750 sayılı Kanun m. 2/1-k)."

