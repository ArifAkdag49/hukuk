ozet: |
  **Bu konu neyi cevaplıyor?** Bir malın birden çok maliki varsa bu birliktelik nasıl işler ve nasıl sona erdirilir? İki soru var: **elbirliği mülkiyeti** nedir ve paylı ya da elbirliği hâlindeki bir mal nasıl **paylaşılır** (ortaklığın giderilmesi, eski adıyla *izale-i şuyu*)?

  - **Elbirliği mülkiyeti (TMK m. 701):** Kanun ya da kanunda öngörülen bir sözleşmeyle kurulan bir topluluk yüzünden mallara birlikte malik olunur. Ortakların **belirlenmiş payı yoktur**; her birinin hakkı malların tamamına yayılır.
  - **Kaynakları:** Kanundan doğan miras ortaklığı (TMK m. 640). Sözleşmeden doğan mal ortaklığı (TMK m. 256-257), aile malları ortaklığı (TMK m. 373-376) ve adi ortaklık (TBK m. 638/1).
  - **Hükümleri (TMK m. 702):**
    - Aksine hüküm yoksa yönetim ve tasarruf için **oybirliği** gerekir.
    - Sözleşmeden doğan topluluk sürdükçe paylaşma istenemez, paya tasarruf edilemez.
    - Her ortak, topluluğun haklarını tek başına koruyabilir ve korumadan herkes yararlanır.
  - **Miras ortaklığı:** Mirasçılar birlikte tasarruf eder. Sulh mahkemesi paylaşmaya kadar temsilci atayabilir (TMK m. 640/3). Miras payının üçüncü kişiye devri noterlikçe düzenlenen sözleşmeyle olur ve bu kişiye paylaşmaya katılma hakkı vermez (TMK m. 677/2).
  - **Sona erme (TMK m. 703):** Malın devri, topluluğun dağılması ya da paylı mülkiyete geçilmesi. Paylı mülkiyete dönüştürme sulh hâkimince yapılabilir (TMK m. 644). Paylaştırma, aksine hüküm yoksa paylı mülkiyet kurallarına göre yapılır.
  - **Paylaşma istemi (TMK m. 698):** Her paydaş isteyebilir. Üç sınır var: hukuki işlemle devam yükümlülüğü (en çok **10 yıl**; taşınmazda resmî şekil, şerh verilebilir), malın **sürekli bir amaca özgülenmesi** ve **uygun olmayan zaman**.
  - **Paylaşma biçimi (TMK m. 699):** Anlaşma yoksa hâkim önce **aynen bölmeye** bakar, değer farkını para (**ivaz**) ile denkleştirir. Bölme uygun değilse, özellikle mal önemli bir değer kaybına uğrayacaksa **açık artırmayla satış** kararı verir. Satışın paydaşlar arasında artırmayla yapılması **bütün paydaşların rızasına** bağlıdır.
  - **Dava:** Görevli mahkeme sulh hukuk (HMK m. 4/1-b), taşınmazda yetkili mahkeme taşınmazın bulunduğu yer mahkemesidir ve bu yetki kesindir (HMK m. 12/1). Bütün paydaşlar davada yer almak zorundadır. Dava iki taraflıdır: davalı da aynen bölme isteyebilir.
  - 📌 **Arabuluculuk (HUAK m. 18/B):** 01.09.2023'ten beri dava açmadan önce arabulucuya başvurmak **dava şartıdır**. Başvurmadan açılan dava usulden reddedilir.
  - 📌 **2026 değişikliği (İİK m. 114):** Bütün malikleri mirasçı olan taşınmazın satışında birinci artırma yalnız mirasçılar arasında yapılır.
  - **Dağıtım:** Satış bedeli paylı mülkiyette tapudaki paylara, elbirliğinde mirasçılık belgesindeki paylara göre dağıtılır.

anlatim: |
  ## 0. Konunun haritası

  Bir önceki konuda **paylı mülkiyeti** gördük: her paydaşın belli, soyut bir payı vardır ve bu payı devredebilir (TMK m. 688/3). Bu konuda iki şeyi tamamlıyoruz: birlikte mülkiyetin ikinci türü olan **elbirliği mülkiyeti** ve iki türde de ortaklığın **paylaşmayla** nasıl sona erdirildiği.

  | Soru | Paylı mülkiyet | Elbirliği mülkiyeti |
  |---|---|---|
  | Pay var mı? | Var, belli (m. 688) | Yok, hak bütüne yaygın (m. 701/2) |
  | Tasarruf | Pay serbestçe | Kural olarak oybirliği (m. 702/2) |
  | Paylaşma | Her paydaş ister (m. 698) | Topluluğun kuralına göre (m. 702-703) |

  > 💡 **Püf nokta:** Olay sorusunda ilk soru hep şudur: **Tapuda "paylı" mı yazıyor, "elbirliği (iştirak hâlinde)" mi?** Cevap; kimin tek başına ne yapabileceğini, alacaklının hangi yolu izleyeceğini ve satış bedelinin neye göre dağıtılacağını belirler.

  ## 1. Elbirliği mülkiyeti

  ### 1.1 Kavram (TMK m. 701)
  **Elbirliği mülkiyeti**, kanun ya da kanunda öngörülen bir sözleşme uyarınca kurulan bir topluluk yüzünden mallara birlikte malik olunmasıdır (m. 701/1). Belirleyici özellik şudur: ortakların **belirlenmiş payları yoktur** ve her birinin hakkı ortaklığa giren malların **tamamına yaygındır** (m. 701/2).

  Yargıtay bu yapıyı şöyle özetler: elbirliği mülkiyetinde malikler paydaş değil **ortaktır**. Ortaklığın tüzel kişiliği yoktur; hak sahibi topluluk değil, bir bütün hâlinde birlikte hareket etmek zorunda olan ortakların kendisidir.

  > **Örnek:** Hasan ölünce Kadıköy'deki dairesi üç çocuğuna geçer. Tapuda "elbirliği" kaydı vardır. Ali "dairenin üçte biri benim" diyemez. Üç kardeş dairenin tamamına birlikte maliktir.

  ### 1.2 Kaynakları: sınırlı sayı
  Elbirliği mülkiyeti ancak kanunun öngördüğü topluluklarda doğar. Taraflar istedikleri gibi bir elbirliği yaratamaz.
  - **Kanundan doğan:** **Miras ortaklığı.** Birden çok mirasçı varsa mirasın geçmesiyle paylaşmaya kadar terekedeki bütün hak ve borçları kapsayan bir ortaklık doğar (TMK m. 640/1). Uygulamada en sık karşılaşılan elbirliği budur.
  - **Kanunda öngörülen sözleşmelerden doğan:**
    - **Mal ortaklığı:** Eşler, noterde düzenlenen ya da onaylanan mal rejimi sözleşmesiyle (TMK m. 205) bu rejimi seçerse, ortaklık mallarına bölünmemiş bir bütün olarak sahip olurlar. Hiçbir eş ortaklık payı üzerinde tek başına tasarruf edemez (TMK m. 257/2-3).
    - **Aile malları ortaklığı:** Hısımlar, kendilerine geçen mirasla ya da başka mallar koyarak kurar (TMK m. 373). Sözleşme resmî şekilde yapılır (TMK m. 374). Ortaklar, ortaklık sürdükçe paylarını isteyemez ve paylarına tasarruf edemez (TMK m. 376/3).
    - **Adi ortaklık:** Ortaklık için edinilen ya da ortaklığa devredilen şeyler, alacaklar ve ayni haklar, sözleşme çerçevesinde elbirliği hâlinde bütün ortaklara ait olur (TBK m. 638/1).

  > ⚠️ **Sınavda dikkat:** Üç arkadaş bir yazlığı birlikte satın alıp tapuya 1/3'er payla kaydettirmişse ortada **paylı** mülkiyet vardır. Payları yazılmamışsa da paylar eşit sayılır (TMK m. 688/2). "Birlikte aldılar, elbirliğidir" cevabı yanlıştır.

  ### 1.3 Hükümleri (TMK m. 702)
  - **Kurucu kural belirler:** Ortakların hak ve yükümlülükleri topluluğu doğuran kanun ya da sözleşme ile belirlenir (m. 702/1).
  - **Oybirliği:** Kanunda ya da sözleşmede aksine hüküm yoksa hem yönetim hem tasarruf işlemleri için ortakların oybirliğiyle karar vermesi gerekir (m. 702/2). Paylı mülkiyetteki çoğunluk kuralları burada uygulanmaz.
  - **Sözleşmeden doğan toplulukta paylaşma ve pay tasarrufu yasağı:** Topluluk sürdükçe paylaşma yapılamaz ve bir pay üzerinde tasarrufta bulunulamaz (m. 702/3). Bu yasak, kanundan doğan miras ortaklığında aynı biçimde geçerli değildir. Mirasçı her zaman paylaşma isteyebilir (TMK m. 642/1).
  - **Koruma:** Ortaklardan her biri topluluğa giren hakların korunmasını tek başına sağlayabilir ve bu korumadan bütün ortaklar yararlanır (m. 702/4; mirasçılar için TMK m. 640/4).

  ### 1.4 Miras ortaklığına özgü kurallar
  - **Birlikte tasarruf:** Mirasçılar terekeye elbirliğiyle sahip olur ve sözleşmeden ya da kanundan doğan temsil veya yönetim yetkisi saklı kalmak üzere bütün haklar üzerinde birlikte tasarruf eder (TMK m. 640/2).
  - **Temsilci:** Mirasçılardan birinin istemi üzerine **sulh mahkemesi**, miras ortaklığına paylaşmaya kadar bir temsilci atayabilir (TMK m. 640/3).
  - **Dava açma:** Yargıtay'a göre bir kısım mirasçı tereke hakkı için dava açarsa bu davayı tek başına yürütemez. Mahkeme, öbür mirasçıların davaya katılması ya da yazılı muvafakat vermesi için, olmazsa terekeye temsilci atattırılması için süre verir. Temsilci davaya icazet vermezse ya da süre boşa geçerse dava reddedilir. Temsilci atandıktan sonra davayı mirasçılar değil temsilci takip eder.
  - **Borçlar:** Mirasçılar tereke borçlarından müteselsilen sorumludur (TMK m. 641/1).
  - **Miras payının devri (TMK m. 677):** Belirli bir tereke malındaki "payın" satışı tapuda yapılamaz, ama miras payı üzerinde sözleşme yapılabilir. Mirasçılar arasındaki sözleşme **yazılı** şekle tabidir. Üçüncü kişiyle yapılan sözleşme ise **noterlikçe düzenlenmelidir** ve bu kişiye paylaşmaya katılma yetkisi vermez. Üçüncü kişi yalnız paylaşma sonunda mirasçıya düşen payın kendisine verilmesini isteyebilir.

  > **Örnek:** Ali, miras payını arkadaşı Kerem'e noterde düzenlenen bir sözleşmeyle satar. Kerem ortaklığın giderilmesi davasına taraf olamaz. Paylaşma sonunda Ali'ye düşen parayı ya da malı Ali'den ister.

  - **Önalım:** Yasal önalım hakkı, paylı mülkiyette payın üçüncü kişiye satışında tanınmıştır (TMK m. 732). Elbirliği mülkiyetinde bu hak yoktur; ayrıntısı ayrı konuda.
  - **Alacaklının yolu (İİK m. 121):** Borçlu mirasçının belirli bir tereke malında satılabilecek bir payı yoktur. Bu yüzden İİK m. 121 uyarınca icra memuru satışın nasıl yapılacağını icra mahkemesine sorar. Yargıtay'a göre alacaklı, icra mahkemesinden alacağı **yetki belgesiyle** elbirliği hâlindeki taşınmaz için ortaklığın giderilmesi davası açabilir. Belge yoksa dava hemen reddedilmez, belge alması için süre verilir. **Paylı mülkiyette** ise borçlunun payı doğrudan satılabildiği için alacaklının bu davayı açmakta hukuki yararı yoktur.

  ### 1.5 Sona erme (TMK m. 703)
  Elbirliği mülkiyeti üç yolla sona erer (m. 703/1):
  1. **Malın devri:** Ortaklar malı birlikte bir üçüncü kişiye satar.
  2. **Topluluğun dağılması:** Örneğin mal ortaklığının boşanmayla sona ermesi ya da adi ortaklığın dağılması. Adi ortaklıkta tasfiye bütün ortaklarca elbirliğiyle yapılır (TBK m. 644/1).
  3. **Paylı mülkiyete geçiş:**
     - Mirasçılar paylaşma sözleşmesiyle bunu kabul edebilir (TMK m. 676/2). Paylaşma sözleşmesi **yazılı** şekle tabidir (TMK m. 676/3).
     - Bir mirasçının istemiyle **sulh hâkimi** de dönüştürebilir (TMK m. 644). Hâkim öbür mirasçılara çağrıda bulunur ve itirazlarını bildirmeleri için süre verir. Elbirliğinin devamını haklı kılacak bir itiraz gelmezse ya da süre içinde mirasçılardan biri paylaşma davası açmazsa, mal üzerindeki elbirliği mülkiyeti paylı mülkiyete dönüştürülür.

  Paylaştırma, aksine bir hüküm yoksa **paylı mülkiyet hükümlerine göre** yapılır (m. 703/2). Yani TMK m. 698-699 elbirliğine de uygulanır. Miras ortaklığında TMK m. 642 ve devamındaki özel kurallar saklıdır.

  > ⚠️ **Sınavda dikkat:** Paylı mülkiyete dönüştürme, ortaklığı **sona erdirmez**, yalnız türünü değiştirir. Malın tek kişiye geçmesi için ayrıca paylaşma gerekir. Ama dönüşümden sonra her mirasçının satılabilir, haczedilebilir bir payı olur (TMK m. 688/3).

  ## 2. Paylaşma istemi (TMK m. 698)

  ### 2.1 Kural
  Paydaşlardan her biri malın paylaşılmasını isteyebilir (m. 698/1). Payı ne kadar küçük olursa olsun bu hak her paydaşındır ve kanun bunun için bir süre öngörmez. Mirasçılar için kanun bunu açıkça söyler: sözleşme ya da kanun gereği ortaklığı sürdürme yükümlülüğü yoksa mirasçı **her zaman** paylaşma isteyebilir (TMK m. 642/1).

  ### 2.2 Üç sınır
  1. **Hukuki işlemle devam yükümlülüğü:** Paydaşlar paylaşma istemeyeceklerini kararlaştırabilir. Ama bu sınırlama **en çok on yıl** süreyle yapılabilir. Taşınmazlarda paylı mülkiyetin devamına ilişkin sözleşme **resmî şekle** bağlıdır ve tapu kütüğüne **şerh verilebilir** (m. 698/2).
  2. **Sürekli bir amaca özgülenme:** Paylı mal sürekli bir amaca ayrılmışsa ortaklık sürdürülür (m. 698/1). Yargıtay, bir sitenin sosyal tesis alanı olarak ayrılmış parselinde, taşınmazın kooperatifin amacı doğrultusunda üyelerin ortak kullanımına özgülenip özgülenmediğinin araştırılmasını istemiştir. Özgüleme varsa dava reddedilir.
  3. **Uygun olmayan zaman:** Paylaşma uygun olmayan zamanda istenemez (m. 698/3). Bu, istemi ortadan kaldıran değil, ileriye bırakan geçici bir engeldir.

  > **Örnek:** Ayşe, Burak ve Cem 2020'de bir arsa için resmî senetle "sekiz yıl paylaşma istemeyeceğiz" diye anlaşır ve bunu tapuya şerh ettirir. Ayşe 2025'te paylaşma davası açarsa dava reddedilir. 2028'den sonra her biri dava açabilir.

  ### 2.3 Özel durumlar
  - **Paya intifa hakkı kurulması (TMK m. 700):** Bir paydaş kendi payı üzerinde intifa hakkı kurarsa ve öbür paydaşlardan biri bunun kendisine tebliğinden başlayarak **üç ay içinde** paylaşma isterse, satış yoluyla paylaşmada intifa hakkı o paya düşecek bedel üzerinde devam eder.
  - **Mirasta erteleme:** Paylaşmanın hemen yapılması malın ya da terekenin değerini önemli ölçüde azaltacaksa, sulh hâkimi bir mirasçının istemiyle paylaşmayı erteleyebilir (TMK m. 642/3). Mirasçı olabilecek bir **cenin** varsa paylaşma doğuma kadar ertelenir (TMK m. 643).
  - **Aile konutu:** Taşınmazda aile konutu şerhi (TMK m. 194) bulunması davayı engeller mi? Yargıtay'ın ve Anayasa Mahkemesi'nin yaklaşımları için doktrin bölümüne bak.

  ## 3. Paylaşma biçimi (TMK m. 699)

  ### 3.1 Anlaşmayla paylaşma
  Paylaşma ya malın **aynen bölüşülmesiyle** ya da malın pazarlık veya artırmayla satılıp **bedelinin bölüşülmesiyle** olur (m. 699/1). Paydaşlar bunlardan birinde anlaşırsa mahkemeye gerek kalmaz. Mirasçılar arasında payların oluşturulup fiilen alınması ya da yazılı paylaşma sözleşmesi mirasçıları bağlar (TMK m. 676/1, 676/3).

  ### 3.2 Hâkimin paylaştırması: önce aynen bölme
  Anlaşma yoksa, paydaşlardan birinin istemiyle hâkim **malın aynen bölünerek** paylaştırılmasına karar verir. Parçaların değerleri denk değilse eksik değerdeki parçaya **para eklenerek** denkleştirme yapılır (m. 699/2). Bu paraya uygulamada **ivaz** denir.

  Yargıtay Hukuk Genel Kurulunun da benimsediği ilkeler şunlardır:
  - Aynen bölme için taşınmazın **yüzölçümü, niteliği, pay ve paydaş sayısı** ile **imar mevzuatı** araştırılır.
  - Taşınmaz önemli bir değer kaybına uğrayacaksa aynen bölmeye karar verilemez.
  - Paydaşlar rıza göstermedikçe taşınmazın bir bölümü paylı bırakılamaz.
  - Paydaşlar anlaşmadıkça hâkim kendiliğinden bazı taşınmazları bir kısım paydaşlara, kalanını öbürlerine vererek paylaştıramaz. Bazı paydaşların payını azaltıp başkalarına ekleyerek ve karşılığında para ödeterek "aynen bölme" yapılamaz.
  - Teknik bilirkişiye **ifraz (bölme) projesi** hazırlatılır. Taşınmaz belediye ya da mücavir alan sınırları içindeyse belediye encümeninden, dışındaysa il idare kurulundan bölmenin imar mevzuatına uygun olup olmadığı sorulur.
  - Kimin hangi parçayı alacağında anlaşma olmazsa hâkim huzurunda **kura** çekilir.
  - Onay makamından olumsuz cevap gelirse ortaklık **satış** yoluyla giderilir.

  > **Örnek:** Yüzölçümü 3.000 m² olan imarlı bir arsa üç kardeşe 1/3'er paylıdır. Bilirkişi üç parsellik bir ifraz projesi hazırlar ve belediye encümeni onaylar. Köşe parselin değeri daha yüksek çıkar. Köşe parseli alan kardeş, öbürlerine aradaki farkı para olarak öder.

  ### 3.3 Satış ve paydaşlar arasında artırma
  - Bölme istemi durum ve koşullara uygun görülmezse, özellikle mal önemli bir değer kaybına uğramadan bölünemiyorsa **açık artırmayla satışa** hükmolunur (m. 699/3).
  - Satışın yalnız **paydaşlar arasında artırmayla** yapılmasına karar verilmesi **bütün paydaşların rızasına** bağlıdır (m. 699/3).
  - Taşınırlar da aynı kurala tabidir. İki ortağın birlikte aldığı otomobil aynen bölünemez ve satılır.

  > ⚠️ **Sınavda dikkat:** Bir bağımsız bölüm (daire) kural olarak aynen bölünemez. Daireyi ikiye bölmek değerini önemli ölçüde düşürür ve imar mevzuatına da aykırı olur. Bu yüzden tek daire üzerindeki ortaklık çoğunlukla satışla giderilir.

  ### 3.4 Aynen bölmenin özel biçimleri ve sınırları
  - **Kat mülkiyeti kurarak paylaşma (KMK m. 10):** Kat mülkiyetine elverişli bir taşınmazda mirasçılardan ya da ortak maliklerden biri isterse hâkim, taşınmazın kanunda sayılan belgelere dayanılarak kat mülkiyetine çevrilmesine ve paylar denkleştirilerek bağımsız bölümlerin ortaklara ayrı ayrı verilmesine **karar verebilir**. Kanun "verebilir" der; bu bir takdir yetkisidir. Kat mülkiyetinin kuruluşu ayrı konuda.
  - **Tarım arazileri (5403 sayılı Kanun m. 8):** Asgari tarımsal arazi büyüklüğüne ulaşmış araziler **bölünemez eşya** sayılır. Tarım arazileri bakanlığın belirlediği büyüklüklerin altında ifraz edilemez, hisselendirilemez, pay ve paydaş adedi artırılamaz. Kanun dar bir istisna tanır: tarım dışı kullanım izni verilen alanlarda ya da çay, fındık, zeytin gibi özel iklim ve toprak ihtiyacı olan bitkilerin yetiştiği alanlarda Bakanlığın uygun görüşüyle daha küçük parsel oluşturulabilir. Asgari büyüklük mutlak, marjinal ve özel ürün arazilerinde 2 hektardan, dikili tarım arazilerinde 0,5 hektardan, örtü altı tarımı yapılan arazilerde 0,3 hektardan küçük belirlenemez. Ayrıca tarım arazilerinde ifraz, pay temliki, elbirliğinin paylıya dönüştürülmesi ve taksim işlemleri bakanlığın izniyle yapılır (5403 sayılı Kanun m. 8/B). Asgari büyüklüğün altında parça doğuracak aynen bölme bu yüzden, istisna şartları yoksa, mümkün değildir.
  - **Mirasın paylaşılmasındaki fark (TMK m. 642/2):** Her mirasçı terekedeki belirli malların aynen, olanak yoksa satış yoluyla paylaştırılmasını sulh mahkemesinden isteyebilir. Ama bir mirasçı terekenin bütününün paylaşılmasını isterse, hâkim bütün tereke mallarını birlikte gözetir ve olanak varsa **taşınmazlardan her birinin tamamını bir mirasçıya vererek** paylaştırma yapar. Aradaki değer farkı para ödenmesiyle denkleştirilir.

  | | Ortaklığın giderilmesi | Mirasın paylaşılması |
  |---|---|---|
  | Konu | Tek tek mallar | Terekenin bütünü |
  | Taşınmazı bir kişiye verme | Anlaşma yoksa yapılamaz | Olanak varsa yapılır (m. 642/2) |

  ## 4. Ortaklığın giderilmesi davası

  ### 4.1 Görev ve yetki
  - **Görev:** Taşınır ve taşınmaz mal ya da hakkın paylaştırılmasına ve ortaklığın giderilmesine ilişkin davalara, dava değerine bakılmaksızın **sulh hukuk mahkemesi** bakar (HMK m. 4/1-b).
  - **Yetki:** Paylaşma ayni hak sahipliğini değiştirdiği için taşınmazın bulunduğu yer mahkemesi **kesin yetkilidir** (HMK m. 12/1). Dava birden çok taşınmazla ilgiliyse biri için yetkili mahkemede öbürleri için de açılabilir (HMK m. 12/3).

  ### 4.2 📌 Arabuluculuk dava şartı (HUAK m. 18/B)
  28.03.2023 tarihli ve 7445 sayılı Kanunla eklenen HUAK m. 18/B, **taşınır ve taşınmazların paylaştırılmasına ve ortaklığın giderilmesine ilişkin uyuşmazlıklarda** dava açılmadan önce arabulucuya başvurulmasını dava şartı yaptı. Hüküm **01.09.2023**'te yürürlüğe girdi. Bu tarihte ilk derece mahkemelerinde, bölge adliye mahkemelerinde ve Yargıtay'da görülmekte olan davalara uygulanmaz (HUAK'ın geçici 3. maddesi).

  Süreç dava şartı arabuluculuğun genel hükmüne (HUAK m. 18/A) tabidir:
  - **Başvuru yeri:** Uyuşmazlığın konusuna göre yetkili mahkemenin bulunduğu yerin arabuluculuk bürosu. Taşınmazda bu, taşınmazın bulunduğu yerdir.
  - **Süre:** Arabulucu başvuruyu görevlendirildiği tarihten itibaren **üç hafta** içinde sonuçlandırır. Zorunlu hâllerde bu süre en fazla **bir hafta** uzatılabilir.
  - **Davaya etkisi:** Davacı, anlaşamama son tutanağını dava dilekçesine ekler. Eklemezse **bir haftalık kesin süre** verilir, süre içinde sunmazsa dava usulden reddedilir. Arabulucuya **hiç başvurulmadan** dava açıldığı anlaşılırsa süre verilmez, dava başka işlem yapılmadan dava şartı yokluğundan **usulden reddedilir**.
  - **İlk toplantıya gelmeyen taraf:** Geçerli mazereti olmadan ilk toplantıya katılmayan taraf, davada haklı çıksa bile yargılama giderlerinin tamamından sorumlu tutulur ve lehine vekâlet ücretine hükmedilmez.
  - **Süreler:** Arabuluculuk bürosuna başvurudan son tutanağa kadar zamanaşımı durur, hak düşürücü süre işlemez.

  Anlaşma olursa (HUAK m. 18/B):
  - Anlaşma belgesi, taşınmazla ilgili kanuni sınırlamalar ve usuller gözetilerek düzenlenir.
  - Belge için **icra edilebilirlik şerhi** alınması zorunludur. Taşınmaza ilişkin belgelerde şerh, taşınmazın bulunduğu yer sulh hukuk mahkemesinden alınır. Mahkeme anlaşmanın arabuluculuğa ve cebri icraya elverişli olup olmadığını ve kanuni sınırlamalara uyulup uyulmadığını denetler, gerekirse duruşma açar.
  - 7531 sayılı Kanunla 14.11.2024'ten itibaren eklenen fıkraya göre, taşınmazın devrine ya da üzerinde sınırlı ayni hak kurulmasına ilişkin anlaşma belgesinin taraflarından biri, şerh verildikten sonra tapu müdürlüğünden tescil isteyebilir. Tapu müdürlüğü gerekli incelemeyi yapar ve **resmî senet düzenlemeden** tescil eder.

  > **Örnek:** Zeynep, kardeşleriyle elbirliği hâlinde malik olduğu daire için 2025'te doğrudan sulh hukuk mahkemesinde dava açar. Mahkeme, arabulucuya hiç başvurulmadığını görünce davayı usulden reddeder. Zeynep önce arabuluculuk bürosuna başvurmalıdır.

  ### 4.3 Taraflar
  - **Bütün paydaşlar:** Paylaşma bütün maliklerin hakkını değiştirdiği için davacı dışındaki bütün paydaşlar davalı olarak davada yer almalıdır. Aralarında **mecburi dava arkadaşlığı** vardır (HMK m. 59, HMK m. 60). Ölen paydaşın mirasçıları, ayrıca Hazine gibi kamu tüzel kişisi paydaşlar da davaya katılır. Taraf teşkili eksik bırakılarak verilen karar bozulur.
  - **Elbirliğinde mirasçılık belgesi:** Elbirliği hâlindeki taşınmazda ortakların payları tapudan değil mirasçılık belgesinden anlaşılır. Bu yüzden belge dosyaya getirilir. Önce paylı mülkiyete dönüştürme şart değildir.
  - **İki taraflı dava:** Ortaklığın giderilmesi davasında davalı da davacıyla aynı haklara sahiptir. Davacının satış istemesi, davalının aynen bölme istemesine engel değildir.

  ### 4.4 Muhdesat
  **Muhdesat**, arazi üzerine sonradan yapılan bina, tesis ve dikilen ağaç gibi bütünleyici parçalardır. Kural olarak arzla birlikte satılır. Yargıtay'ın yaklaşımı şöyledir:
  - Muhdesatın bir kısım paydaşa ait olduğu tapuda **şerhliyse** ya da bütün paydaşlar bunda **birleşiyorsa** ve muhdesat arzın değerini artırıyorsa, dava tarihi itibarıyla arzın ve muhdesatın değerleri ayrı ayrı belirlenir. Satış bedeli bu oranlara göre bölünür: muhdesata düşen kısım muhdesat sahibine, kalan kısım paylar oranında bütün paydaşlara verilir.
  - Muhdesatın kime ait olduğu tartışmalıysa ve bir paydaş önce bunun çözülmesini isterse, aidiyet davası açması için süre verilir. Dava açılırsa sonucu beklenir, açılmazsa uyuşmazlık yokmuş gibi davaya devam edilir.
  - Muhdesat arzın paydaşı olmayan bir üçüncü kişiye aitse, bu kişi davaya katılamaz ve satış bedelinden pay alamaz.

  Paydaşın yaptığı yapının mülkiyet bakımından durumu ayrı konuda.

  ### 4.5 Satış ve bedelin dağıtılması
  - **Kesinleşme:** Taşınmaz mal ile ilgili ayni haklara ilişkin kararlar kesinleşmedikçe yerine getirilemez (HMK m. 350/2, HMK m. 367/2). Bu yüzden satış, karar kesinleştikten sonra yapılır.
  - **Satış usulü:** Satış, İİK'daki açık artırma kurallarına göre yapılır (İİK m. 114).
  - 📌 **2026 değişikliği:** 16.07.2026 tarihli ve 7589 sayılı Kanun İİK m. 114'ü değiştirdi. Değişiklik 31.07.2026'da yürürlüğe girdi.
    - Taşınmazın bütün malikleri onu miras yoluyla edinmişse ve mirasçılar dışında hiç kimsenin mülkiyet hakkı yoksa, ortaklığın satışla giderilmesinde **birinci artırma yalnız malik mirasçılar arasında** yapılır. Bu usul **bir defaya mahsus** uygulanır.
    - Bu birinci artırmada teklif **muhammen kıymetin yüzde yüzünü**, ikinci artırmada ise **yüzde ellisini** (ya da rüçhanlı alacaklar toplamını, hangisi fazlaysa) ve masrafları geçmelidir.
    - İhale bedelini süresinde yatırmayan alıcının teminatı iade edilmez. Satış masrafları düşüldükten sonra paydaşlara payları oranında ödenir. Bedeli yatırmayan bir paydaşsa teminatın tamamı öbür paydaşlara payları oranında verilir. Ayrıca alıcıya teklifinin **yüzde beşi** oranında idari para cezası verilir.
  - **Dağıtım:** Satış bedeli ve harç, **paylı** mülkiyette tapudaki paylar oranında, **elbirliği** mülkiyetinde mirasçılık belgesindeki paylar oranında dağıtılır. İkisi birlikte varsa her ikisi dikkate alınır. Hüküm fıkrası satışın nasıl yapılacağını ve bedelin nasıl dağıtılacağını göstermelidir.

  > ⚠️ **Sınavda dikkat:** TMK m. 699/3'teki "paydaşlar arasında artırma" bütün paydaşların rızasına bağlıdır. İİK m. 114/2'deki mirasçılar arası birinci artırma ise rıza aramaz, kanun gereği uygulanır; ama yalnız bütün malikleri mirasçı olan taşınmazlarda ve bir kez.

  ## 5. Denetim şeması

  1. **Mülkiyet türü:** Paylı mı, elbirliği mi? Elbirliğiyse kaynağı nedir: miras mı, sözleşme mi?
  2. **Kim ne yapabilir?** Elbirliğinde tasarruf ve yönetim oybirliğiyle; koruma tek başına (TMK m. 702). Mirasta temsilci (TMK m. 640/3). Miras payının devri (TMK m. 677).
  3. **Paylaşma istenebilir mi?** Sözleşmeden doğan elbirliği sürüyor mu (TMK m. 702/3)? Paylaşmama sözleşmesi (en çok 10 yıl), sürekli amaca özgülenme, uygun olmayan zaman (TMK m. 698)? Erteleme ya da cenin (TMK m. 642/3, 643)?
  4. **Dava şartları:** 📌 Arabulucuya başvuruldu mu (HUAK m. 18/B)? Sulh hukuk mahkemesi, taşınmazın yeri (HMK m. 4, HMK m. 12)? Bütün paydaşlar davada mı? Alacaklıysa yetki belgesi var mı (İİK m. 121)?
  5. **Paylaşma biçimi:** Aynen bölme mümkün mü (yüzölçümü, nitelik, pay ve paydaş sayısı, imar, tarım arazisi sınırı)? İvazla denkleştirme, kura. Kat mülkiyeti kurarak paylaşma (KMK m. 10). Değilse satış (TMK m. 699).
  6. **Satış:** Paydaşlar arası artırma (bütün paydaşların rızası) ya da mirasçılar arası birinci artırma (📌 İİK m. 114/2). Muhdesat varsa bedelin oranlanması.
  7. **Dağıtım:** Tapudaki paylar ya da mirasçılık belgesi.

kritik: |
  - 📌 TMK m. 701: Elbirliği mülkiyetinde belirlenmiş pay yoktur; her ortağın hakkı malların tamamına yaygındır. Kaynağı ancak kanun ya da kanunda öngörülen sözleşmedir.
  - 📌 Elbirliği örnekleri: miras ortaklığı (TMK m. 640), mal ortaklığı (TMK m. 257), aile malları ortaklığı (TMK m. 373-376), adi ortaklık (TBK m. 638/1).
  - 📌 TMK m. 702/2: Aksine hüküm yoksa yönetim ve tasarruf oybirliğiyle. Koruma ise her ortağın tek başına yapabileceği bir iştir ve herkese yarar (TMK m. 702/4).
  - ⚠️ TMK m. 702/3'teki "topluluk sürdükçe paylaşma yok" kuralı sözleşmeden doğan topluluklar içindir. Mirasçı her zaman paylaşma isteyebilir (TMK m. 642/1).
  - 📌 TMK m. 677: Miras payının devri mirasçılar arasında yazılı, üçüncü kişiyle noterlikçe düzenlenen sözleşmeyle olur. Üçüncü kişi paylaşmaya katılamaz.
  - 📌 TMK m. 640/3: Miras ortaklığına temsilciyi sulh mahkemesi atar. Temsilci atanınca davayı mirasçılar değil temsilci takip eder.
  - 📌 TMK m. 698/2: Paylaşma hakkı hukuki işlemle en çok 10 yıl sınırlanabilir. Taşınmazda bu sözleşme resmî şekle bağlıdır, tapuya şerh verilebilir.
  - ⚠️ Paylaşmanın üç engeli: devam sözleşmesi, sürekli amaca özgülenme, uygun olmayan zaman (TMK m. 698). Ayrıca mirasta erteleme ve cenin (TMK m. 642/3, 643).
  - 📌 TMK m. 699: Önce aynen bölme ve ivaz; uygun değilse açık artırmayla satış. Paydaşlar arasında artırma bütün paydaşların rızasına bağlıdır.
  - ⚠️ Hâkim, anlaşma yoksa bazı paydaşların payını azaltıp başkalarına ekleyerek ya da taşınmazları kişilere dağıtarak aynen bölme yapamaz. Terekenin bütününün paylaşılmasında ise bir taşınmazın tamamı bir mirasçıya verilebilir (TMK m. 642/2).
  - 📌 Görev sulh hukuk (HMK m. 4/1-b); taşınmazda kesin yetki taşınmazın bulunduğu yer (HMK m. 12/1). Bütün paydaşlar mecburi dava arkadaşıdır.
  - 📌 HUAK m. 18/B: 01.09.2023'ten beri arabuluculuk dava şartıdır. Hiç başvurulmadan açılan dava süre verilmeden usulden reddedilir; görülmekte olan eski davalara uygulanmaz.
  - 📌 Arabulucu üç haftada sonuçlandırır, en çok bir hafta uzatılabilir. Taşınmaza ilişkin anlaşmada icra edilebilirlik şerhi zorunludur ve taşınmazın bulunduğu yer sulh hukuk mahkemesinden alınır.
  - 📌 İİK m. 121: Elbirliği hâlinde ortak olan borçlunun alacaklısı, icra mahkemesinden yetki belgesi alarak ortaklığın giderilmesi davası açar. Paylı mülkiyette pay doğrudan satılabildiği için bu davayı açamaz.
  - 📌 2026: Bütün malikleri mirasçı olan taşınmazın satışında birinci artırma yalnız mirasçılar arasında ve bir kez yapılır (İİK m. 114/2). Satış bedeli elbirliğinde mirasçılık belgesindeki paylara göre dağıtılır.

doktrin: |
  ### Aile konutu şerhi ortaklığın giderilmesine engel mi?
  Eşlerin paylı malik olduğu ve üzerinde aile konutu şerhi bulunan taşınmazlarda, o dönemde bu davalara bakan Yargıtay 14. Hukuk Dairesi, evlilik sürdükçe şerhin ortaklığın giderilmesine engel olduğunu kabul etti; şerh terkin edilmedikçe davanın reddedilmesi gerektiğini söyledi. Şerh yoksa ve konutun aile konutu olduğu da ileri sürülmemişse, boşanma davasının sürmesi tek başına engel sayılmadı. Bu yaklaşım öğretide tartışıldı. Anayasa Mahkemesi de, belediyenin parselasyonuyla oluşan bir paylı mülkiyette, şerh başka bir paydaşın payında bulunduğu için davanın reddedilmesini mülkiyet hakkının ihlali saydı. Mahkemeye göre aile konutu korumasına mutlak üstünlük tanınamaz. Şerhli payın sahibi mülkünden mahrum kalmaz, payının bedelini alır ve ihaleye katılabilir. Paylaşma talebinin reddi ise öbür paydaşlara orantısız bir külfet yükler. Kısacası sonuç somut olaya göre değişebilir. Sınavda bu noktayı iki yaklaşımıyla birlikte anmak gerekir.

  ### Çok paydaşlı uyuşmazlıkta arabuluculuk
  HUAK m. 18/B ortaklığın giderilmesini dava şartı arabuluculuğa bağladı, ama bu davaların özelliklerine uygun ayrı kurallar koymadı. Dava bütün paydaşlara karşı açılmak zorundadır; bu yüzden arabuluculuğa da bütün paydaşların çağrılması gerektiği düşünülebilir. Paylaşma da ancak bütün paydaşların katıldığı bir anlaşmayla mümkündür. Arabuluculuğa bir paydaşın çağrılmamasının sonucu ve ilk toplantıya katılmayan paydaşlara gider yaptırımının nasıl uygulanacağı kanunda açıkça çözülmüş değildir. İİK m. 121 uyarınca yetki belgesi alan alacaklının açtığı dava için kanun bir ayrık hâl öngörmediğinden, bu davanın da arabuluculuğa tabi olduğu sonucuna varılabilir. Bu sorularda yerleşmiş bir Yargıtay içtihadı henüz yoktur. Kesin olan şudur: hiç başvurulmadan açılan dava usulden reddedilir.

  ### Elbirliği mülkiyetinde "pay" var mı?
  TMK m. 701/2 belirlenmiş pay olmadığını söyler; buna karşılık mirasçılık belgesinde her mirasçının miras payı yazar. Bu iki şey çelişmez. Miras payı terekenin bütünü üzerindeki soyut bir orandır ve TMK m. 677 uyarınca devredilebilir. Ancak tek tek tereke mallarında mirasçının ayrıca devredilebilir ya da haczedilebilir bir payı yoktur. Bu yüzden alacaklı İİK m. 121 yoluna gider. Satış bedelinin dağıtılmasında ise miras payları ölçü olarak kullanılır. Yargıtay da elbirliği ortaklığının tüzel kişiliği olmadığını, hak sahibinin birlikte hareket etmek zorunda olan ortakların kendisi olduğunu vurgular.

sozluk:
  - terim: "Elbirliği (iştirak hâlinde) mülkiyeti"
    tanim: "Kanun ya da kanunda öngörülen sözleşmeyle kurulan bir topluluk yüzünden, belirlenmiş paylar olmaksızın mallara birlikte malik olunması (TMK m. 701)."
  - terim: "Paylı mülkiyet"
    tanim: "Birden çok kişinin, maddi olarak bölünmemiş bir şeyin tamamına belli paylarla malik olması; pay devredilebilir ve haczedilebilir (TMK m. 688)."
  - terim: "Ortaklığın giderilmesi (izale-i şuyu)"
    tanim: "Paylı ya da elbirliği hâlindeki bir malda birlikte mülkiyeti sona erdirip ferdi mülkiyete geçmeyi sağlayan paylaşma; dava yoluyla istenir (TMK m. 698-699)."
  - terim: "Aynen taksim"
    tanim: "Malın fiziken bölünüp parçaların paydaşlara verilmesi suretiyle paylaştırılması (TMK m. 699/2)."
  - terim: "İvaz"
    tanim: "Aynen bölmede değerleri denk olmayan parçalar arasındaki farkı gidermek için eksik değerdeki parçaya eklenen para."
  - terim: "Satış suretiyle giderme"
    tanim: "Aynen bölme uygun değilse malın açık artırmayla satılıp bedelinin paylara göre dağıtılması (TMK m. 699/3)."
  - terim: "Miras ortaklığı (miras şirketi)"
    tanim: "Birden çok mirasçı varsa mirasın geçmesiyle paylaşmaya kadar terekedeki bütün hak ve borçları kapsayan, kanundan doğan elbirliği topluluğu (TMK m. 640)."
  - terim: "Tereke (miras ortaklığı) temsilcisi"
    tanim: "Bir mirasçının istemiyle sulh mahkemesince paylaşmaya kadar miras ortaklığını temsil etmek üzere atanan kişi (TMK m. 640/3)."
  - terim: "Mirasçılık belgesi"
    tanim: "Mirasçıları ve miras paylarını gösteren belge; elbirliği hâlindeki malda satış bedeli bu belgedeki paylara göre dağıtılır."
  - terim: "Muhdesat"
    tanim: "Arazi üzerine sonradan yapılan bina ve tesisler ile dikilen ağaçlar gibi bütünleyici parçalar."
  - terim: "Mecburi dava arkadaşlığı"
    tanim: "Bir hakkın birden çok kişi tarafından ya da birden çok kişiye karşı birlikte ileri sürülmesi ve tek hüküm verilmesi gereken durum (HMK m. 59)."
  - terim: "İki taraflı dava"
    tanim: "Davalının da davacı gibi aynı haklara sahip olduğu dava; ortaklığın giderilmesinde davalı da aynen bölme ya da satış isteyebilir."
  - terim: "Yetki belgesi (İİK m. 121)"
    tanim: "Elbirliği hâlinde ortak olan borçlunun alacaklısına, ortaklığın giderilmesi davası açabilmesi için icra mahkemesinden verilen belge."
  - terim: "İcra edilebilirlik şerhi"
    tanim: "Arabuluculuk anlaşma belgesine ilam niteliği kazandıran şerh; taşınmaza ilişkin belgelerde taşınmazın bulunduğu yer sulh hukuk mahkemesinden alınır (HUAK m. 18/B)."

kararlar:
  - id: "115753900"
    ozet: |
      Akhisar Sulh Hukuk Mahkemesi, bir taşınmazdaki ortaklığın giderilmesi davasında, paydaşlardan Hazine ile bir kişinin paylarını azaltıp diğer paydaşlara ekleyerek ve karşılığında para ödenmesine hükmederek aynen taksime karar vermiştir. Yargıtay 6. Hukuk Dairesi kararı bozmuştur. Gerekçeye göre ortaklığın giderilmesi davası iki taraflıdır ve davacının satış istemesi davalının aynen bölme istemesine engel değildir. Aynen bölme için yüzölçümü, nitelik, pay ve paydaş sayısı ile imar mevzuatı araştırılır; önemli değer kaybı varsa aynen bölme yapılamaz, rıza olmadan taşınmazın bir bölümü paylı bırakılamaz ve anlaşma yoksa hâkim taşınmazları bir kısım paydaşlara vererek paylaştıramaz. Bilirkişiye ifraz projesi hazırlatılıp belediye encümeninin ya da il idare kurulunun görüşü alınır, kimin neresini alacağı anlaşılamazsa kura çekilir, onay çıkmazsa satışa karar verilir. Somut olayda harita mühendisi raporuna göre aynen bölme mümkün değildi ve bazı paydaşların payları başkalarına eklenerek bölme yapılamazdı. Mahkeme direnmiş, Hukuk Genel Kurulu Özel Daire bozmasını benimseyerek direnme kararını oybirliğiyle bozmuştur. Konuya katkısı: TMK m. 699'daki aynen bölme önceliğinin Yargıtay'daki şartlarını ve usulünü gösterir.
  - id: "501200900"
    ozet: |
      Davacı, bir parseldeki ortaklığın satış yoluyla giderilmesini istemiş, sulh hukuk mahkemesi davayı kabul etmiştir. Taşınmazda paylı mülkiyet ile elbirliği mülkiyeti bir arada bulunduğu hâlde mahkeme, satış bedelinin dağıtımını ve yargılama giderlerini yalnız tapudaki paylara göre belirlemiştir. Yargıtay 14. Hukuk Dairesi, ortaklığın giderilmesi davalarının paylı ya da elbirliği mülkiyetine konu mallarda birlikte mülkiyeti sona erdirip ferdi mülkiyete geçmeyi sağlayan iki taraflı davalar olduğunu vurgulamıştır. Satış kararında satışın nasıl yapılacağı, bedelin nasıl dağıtılacağı ve harcın hangi oranlarda alınacağı gösterilmelidir: paylı mülkiyette tapudaki paylar, elbirliği mülkiyetinde mirasçılık belgesindeki paylar, ikisi birlikte varsa her ikisi esas alınır. Daire, bu eksiklik yeniden yargılama gerektirmediği için hüküm fıkrasına "tapu kaydındaki ve mirasçılık belgesindeki" ibaresini ekleyerek kararı düzeltip oybirliğiyle onamıştır. Konuya katkısı: elbirliği hâlindeki malda paylaştırmanın mirasçılık belgesine dayandığını gösterir.
  - id: "1210695200"
    ozet: |
      Davacı bir taşınmazdaki ortaklığın aynen, olmazsa satış yoluyla giderilmesini istemiştir. Daire önce taraf teşkili sağlanmadan karar verildiği gerekçesiyle hükmü bozmuş, mahkeme bozmaya uyarak davayı kısmen kabul etmiştir. Bir kısım davalılar, taşınmazdaki yapıların kendilerine ait olduğunu ve tapunun beyanlar hanesinde muhdesat şerhleri bulunduğunu, bunların değerlendirilmediğini ileri sürerek temyiz etmiştir. Yargıtay 7. Hukuk Dairesi'ne göre muhdesatın aidiyeti tartışmalıysa ve bir paydaş önce bu uyuşmazlığın çözülmesini isterse dava açması için süre verilmelidir. Muhdesat kural olarak arzla birlikte satılır; ancak bir kısım paydaşa ait olduğu tapuda şerhliyse ya da bütün paydaşlar bunda birleşiyorsa, arzın ve muhdesatın değeri ayrı ayrı belirlenip oranlanır ve satış bedeli bu oranlara göre dağıtılır. Muhdesat üçüncü kişiye aitse bu kişi davaya katılamaz. Keşifte beş yığma kargir bina görüldüğü, tapuda muhdesat şerhleri bulunduğu ve bilirkişi raporlarının taraflara tebliğ edilmediği anlaşıldığından karar oybirliğiyle bozulmuştur. Konuya katkısı: satış yoluyla gidermede muhdesatın bedelin dağıtımına etkisini gösterir.

sorular:
  - soru: |
      Aşağıdakilerden hangisinde mal üzerinde **elbirliği mülkiyeti değil, paylı mülkiyet** vardır?
    siklar:
      - "Ölen babalarından kalan ve henüz paylaşılmamış daire üzerinde üç kardeşin mülkiyeti"
      - "Mal ortaklığı rejimini seçmiş eşlerin ortaklık malı olan ev"
      - "Üç arkadaşın birlikte satın alıp tapuya 1/3'er payla kaydettirdiği yazlık"
      - "Adi ortaklık sözleşmesiyle ortaklık için edinilen kamyonet"
    dogru: 2
    aciklama: |
      Elbirliği mülkiyeti ancak kanunla ya da kanunda öngörülen bir sözleşmeyle kurulan bir topluluk yüzünden doğar (TMK m. 701/1). Miras ortaklığı kanundan (TMK m. 640), mal ortaklığı (TMK m. 257) ve adi ortaklık (TBK m. 638/1) kanunda öngörülen sözleşmelerden doğar. Belli paylarla tapuya kaydedilen yazlıkta ise her arkadaşın belli bir payı vardır; bu paylı mülkiyettir (TMK m. 688).

  - soru: |
      TMK m. 702'ye göre kanunda veya sözleşmede aksine hüküm yoksa elbirliği hâlindeki bir mal hakkında yönetim ve tasarruf işlemleri nasıl yapılır?
    siklar:
      - "Ortakların sayı ve pay çoğunluğuyla"
      - "Ortakların oybirliğiyle"
      - "Ortaklardan herhangi birinin tek başına"
      - "Sulh hâkiminin izniyle ve salt çoğunlukla"
    dogru: 1
    aciklama: |
      Aksine hüküm yoksa gerek yönetim gerek tasarruf işlemleri için ortakların oybirliğiyle karar vermesi gerekir (TMK m. 702/2). Çoğunluk kuralları paylı mülkiyete aittir. Ortakların tek başına yapabileceği iş, topluluğa giren hakların korunmasıdır (TMK m. 702/4).

  - soru: |
      Mirasbırakan Hasan'ın üç mirasçısından Ali, terekedeki daire için "payımı satıyorum" diyerek arkadaşı Kerem'le adi yazılı bir sözleşme yapar ve bedeli alır. Bu sözleşme hakkında hangisi doğrudur?
    siklar:
      - "Geçerlidir; Kerem tapuda Ali'nin yerine elbirliği ortağı olarak tescil edilir."
      - "Geçerlidir; Kerem ortaklığın giderilmesi davasını Ali yerine kendisi açabilir."
      - "Miras payının üçüncü kişiye devri noterlikçe düzenlenmeyi gerektirdiği için geçersizdir; geçerli olsaydı bile Kerem paylaşmaya katılamazdı."
      - "Diğer mirasçılar önalım hakkını kullanarak Kerem'in yerine geçebilir."
    dogru: 2
    aciklama: |
      Bir mirasçının miras payının devri konusunda üçüncü kişiyle yaptığı sözleşme noterlikçe düzenlenmedikçe geçerli olmaz (TMK m. 677/2). Geçerli bir sözleşme de üçüncü kişiye paylaşmaya katılma yetkisi vermez; o yalnız paylaşma sonunda mirasçıya düşen payın kendisine verilmesini isteyebilir. Yasal önalım hakkı paylı mülkiyette payın satışına bağlanmıştır (TMK m. 732); elbirliğinde yoktur.

  - soru: |
      Miras ortaklığına temsilci atanması hakkında hangisi doğrudur?
    siklar:
      - "Temsilciyi mirasçıların oybirliğiyle noterde yapacakları sözleşme belirler; mahkeme atayamaz."
      - "Mirasçılardan birinin istemi üzerine sulh mahkemesi paylaşmaya kadar bir temsilci atayabilir."
      - "Temsilci ancak mirasçılardan biri ödemeden aciz hâlindeyse atanabilir."
      - "Temsilciyi asliye hukuk mahkemesi, bütün mirasçıların istemiyle atar."
    dogru: 1
    aciklama: |
      TMK m. 640/3'e göre mirasçılardan birinin istemi yeter; sulh mahkemesi miras ortaklığına paylaşmaya kadar bir temsilci atayabilir. Bir mirasçının ödemeden aciz hâli ayrı bir hükme konudur: öbür mirasçılar haklarının korunması için gerekli önlemlerin alınmasını isteyebilir (TMK m. 640/5).

  - soru: |
      Elif ve Kaan, babalarından kalan dükkânın elbirliği hâlindeki malikleridir. Kiracı aylardır kira ödememektedir. Elif, Kaan'a sormadan arabulucuya başvurur, anlaşma sağlanamayınca kiracıya karşı tereke alacağının tamamı için dava açar. Yargıtay uygulamasına göre mahkeme ne yapmalıdır?
    siklar:
      - "Elbirliği ortağı tek başına dava açamayacağı için davayı hemen usulden reddetmelidir."
      - "Elif'in miras payı oranındaki alacak için davayı kabul edip geri kalanını reddetmelidir."
      - "Kaan'ın davaya katılması ya da muvafakat vermesi, olmazsa terekeye temsilci atattırılması için Elif'e süre vermelidir."
      - "Kaan'ı resen davalı yaparak yargılamaya devam etmelidir."
    dogru: 2
    aciklama: |
      Tereke alacağı üzerinde mirasçıların elbirliği mülkiyeti vardır ve mirasçılar birlikte hareket eder (TMK m. 640/2). Yargıtay, bir kısım mirasçının açtığı davada öbür mirasçıların katılımının ya da yazılı muvafakatinin sağlanması, olmazsa TMK m. 640/3 uyarınca terekeye temsilci atattırılması için süre verilmesini ister. Süre boşa geçerse ya da temsilci davaya icazet vermezse dava reddedilir. Hemen ret ise eksik usuldür.

  - soru: |
      TMK m. 698'e göre paylaşma isteme hakkının hukuki işlemle sınırlandırılması bakımından hangisi doğrudur?
    siklar:
      - "Paylaşma hakkı süresiz olarak kaldırılabilir; taşınmazlarda adi yazılı sözleşme yeterlidir."
      - "Paylaşma hakkı en çok on yıl sınırlandırılabilir; taşınmazlarda sözleşme resmî şekle bağlıdır ve tapuya şerh verilebilir."
      - "Paylaşma hakkı en çok beş yıl sınırlandırılabilir; şerh zorunludur."
      - "Paylaşma hakkı hukuki işlemle sınırlandırılamaz, yalnız hâkim erteleyebilir."
    dogru: 1
    aciklama: |
      TMK m. 698/2'ye göre paylaşmayı isteme hakkı hukuki bir işlemle en çok on yıl süreyle sınırlandırılabilir. Taşınmazlarda paylı mülkiyetin devamına ilişkin sözleşmeler resmî şekle bağlıdır ve tapu kütüğüne şerh verilebilir. Kanun "verilebilir" der; şerh geçerlilik şartı değildir.

  - soru: |
      Bir sitenin kooperatif üyelerine ferdileşme sonucu paylı olarak geçen ve tapuda "sosyal tesis" niteliğiyle kayıtlı parselinde bir paydaş ortaklığın satış yoluyla giderilmesini ister. Bir kısım paydaş parselin site sakinlerinin ortak kullanımına ayrıldığını savunur. Mahkeme ne yapmalıdır?
    siklar:
      - "Paylaşma her paydaşın hakkı olduğu için savunmayı dinlemeden satışa karar vermelidir."
      - "Parselin kooperatifin amacı doğrultusunda üyelerin ortak kullanımına özgülenip özgülenmediğini araştırmalı, özgüleme varsa davayı reddetmelidir."
      - "Paydaşların oybirliği olmadığı için davayı usulden reddetmelidir."
      - "Davayı arabuluculuğa göndermeli ve sonucuna göre resen karar vermelidir."
    dogru: 1
    aciklama: |
      Paylı malın sürekli bir amaca özgülenmiş olması, paylı mülkiyeti sürdürme yükümlülüğü doğurur ve paylaşma istemine engel olur (TMK m. 698/1). Yargıtay bu tür bir olayda kooperatif kayıtları ve imar planı getirtilerek özgüleme olup olmadığının araştırılmasını, özgüleme varsa davanın reddini istemiştir. Paylaşma istemi için paydaşların oybirliği aranmaz.

  - soru: |
      Hâkim, anlaşma olmayan bir ortaklığın giderilmesi davasında TMK m. 699'a göre hangi sırayı izler?
    siklar:
      - "Önce açık artırmayla satış; satış olmazsa aynen bölme"
      - "Önce paydaşlar arasında artırma; rıza aranmaz"
      - "Önce aynen bölme ve gerekirse parayla denkleştirme; bölme uygun değilse açık artırmayla satış"
      - "Önce taşınmazın en büyük paydaşa verilmesi; kalanlara para ödenmesi"
    dogru: 2
    aciklama: |
      Uyuşma sağlanamazsa hâkim malın aynen bölünerek paylaştırılmasına, değerler denk değilse eksik değerdeki parçaya para eklenerek denkleştirmeye karar verir (TMK m. 699/2). Bölme durum ve koşullara uygun değilse, özellikle mal önemli bir değer kaybına uğramadan bölünemiyorsa açık artırmayla satışa hükmolunur (TMK m. 699/3). Paydaşlar arası artırma bütün paydaşların rızasına bağlıdır.

  - soru: |
      Dört paydaşlı bir arsada aynen bölme mümkün görünmemektedir. Mahkeme, iki paydaşın paylarını azaltıp öbür iki paydaşa ekler, payı azalanlara para ödenmesine hükmederek "aynen taksim" kararı verir. Bu karar hakkında hangisi doğrudur?
    siklar:
      - "Doğrudur; değer farkı parayla giderildiği için paylar denkleştirilmiştir."
      - "Yanlıştır; anlaşma olmadıkça bazı paydaşların payları başkalarına eklenerek aynen bölme yapılamaz, aynen bölme mümkün değilse satışa karar verilmelidir."
      - "Doğrudur; hâkim aynen bölmede tam bir takdir yetkisine sahiptir."
      - "Yanlıştır; çünkü ortaklığın giderilmesinde para ile denkleştirme hiçbir hâlde yapılamaz."
    dogru: 1
    aciklama: |
      Yargıtay Hukuk Genel Kurulunun benimsediği ilkeye göre paydaşlar arasında anlaşma olmadıkça hâkim bazı paydaşların paylarını azaltıp başkalarına ekleyerek aynen bölme yapamaz. Aynen bölme mümkün değilse ortaklık satışla giderilir (TMK m. 699/3). Para ile denkleştirme (ivaz) ise gerçek bir aynen bölmede değerleri denk olmayan parçalar arasında yapılır (TMK m. 699/2).

  - soru: |
      Ortaklığın satış yoluyla giderilmesine karar verilen bir taşınmazın yalnız paydaşlar arasında artırmayla satılması için ne gerekir? (Taşınmazın paydaşları miras dışında bir yolla malik olmuştur.)
    siklar:
      - "Paydaşların pay çoğunluğunun istemi"
      - "Davacının istemi"
      - "Bütün paydaşların rızası"
      - "Hâkimin bunu hakkaniyete uygun bulması"
    dogru: 2
    aciklama: |
      Satışın paydaşlar arasında artırmayla yapılmasına karar verilmesi bütün paydaşların rızasına bağlıdır (TMK m. 699/3). İİK m. 114/2'deki mirasçılar arası birinci artırma ise yalnız bütün maliklerin taşınmazı miras yoluyla edindiği hâllerde uygulanır; soruda bu şart yoktur.

  - soru: |
      Bursa'daki bir taşınmazın paydaşları İstanbul'da oturmaktadır. Taşınmaz üzerindeki ortaklığın giderilmesi davası hangi mahkemede açılmalıdır?
    siklar:
      - "Davalıların yerleşim yeri olan İstanbul'daki asliye hukuk mahkemesinde"
      - "Bursa'daki sulh hukuk mahkemesinde; bu yetki kesindir"
      - "Dava değeri yüksekse Bursa asliye hukuk mahkemesinde, düşükse sulh hukuk mahkemesinde"
      - "Taraflar anlaşırsa İstanbul'daki sulh hukuk mahkemesinde de açılabilir"
    dogru: 1
    aciklama: |
      Ortaklığın giderilmesi davalarına dava değerine bakılmaksızın sulh hukuk mahkemesi bakar (HMK m. 4/1-b). Ayni hak sahipliğinde değişikliğe yol açabilecek davalarda taşınmazın bulunduğu yer mahkemesi kesin yetkilidir (HMK m. 12/1). Kesin yetki olduğu için taraflar başka bir yer mahkemesini yetkili kılamaz.

  - soru: |
      Burcu, kardeşiyle paylı malik olduğu arsa için 10 Mart 2025'te ortaklığın giderilmesi davası açar. Arabulucuya hiç başvurmamıştır. Mahkeme ne yapar?
    siklar:
      - "Burcu'ya arabulucuya başvurması için bir haftalık kesin süre verir."
      - "Davayı karşı tarafa tebliğ eder ve ön inceleme duruşmasında taraflara arabuluculuğu önerir."
      - "Arabulucuya başvurulmadan dava açıldığı için davayı dava şartı yokluğundan usulden reddeder."
      - "Ortaklığın giderilmesi davaları arabuluculuğa tabi olmadığı için yargılamaya devam eder."
    dogru: 2
    aciklama: |
      01.09.2023'ten beri taşınmazların paylaştırılmasına ve ortaklığın giderilmesine ilişkin uyuşmazlıklarda dava açılmadan önce arabulucuya başvurmak dava şartıdır (HUAK m. 18/B). Arabulucuya başvurulmadan dava açıldığı anlaşılırsa herhangi bir işlem yapılmadan dava usulden reddedilir (HUAK m. 18/A). Bir haftalık kesin süre, arabulucuya başvurulmuş ama son tutanak dilekçeye eklenmemişse verilir.

  - soru: |
      Ortaklığın giderilmesi davası Mart 2022'de açılmış ve Eylül 2023'te hâlâ ilk derece mahkemesinde görülmektedir. Davalı, Ekim 2023'te "arabuluculuk dava şartı yerine getirilmedi" diye itiraz eder. Hangisi doğrudur?
    siklar:
      - "İtiraz yerindedir; dava şartı her aşamada gözetilir ve dava usulden reddedilir."
      - "İtiraz yerinde değildir; HUAK m. 18/B, yürürlüğe girdiği tarihte görülmekte olan davalara uygulanmaz."
      - "Mahkeme davacıya arabulucuya başvurması için süre vermeli, sonucuna göre karar vermelidir."
      - "Davalı itirazı ancak ilk itiraz olarak cevap dilekçesinde ileri sürebilirdi."
    dogru: 1
    aciklama: |
      HUAK m. 18/B 01.09.2023'te yürürlüğe girmiştir. HUAK'ın geçici 3. maddesine göre bu maddenin dava şartı arabuluculuğa ilişkin hükümleri, yürürlük tarihinde ilk derece mahkemelerinde, bölge adliye mahkemelerinde ve Yargıtay'da görülmekte olan davalara uygulanmaz.

  - soru: |
      Ortaklığın giderilmesi için arabuluculukta anlaşan paydaşlar, taşınmazın paydaşlardan birine devrini kararlaştırmıştır. Anlaşma belgesi hakkında hangisi doğrudur?
    siklar:
      - "İcra edilebilirlik şerhi isteğe bağlıdır; belge tek başına ilam niteliğindedir."
      - "İcra edilebilirlik şerhi zorunludur ve taşınmazın bulunduğu yer sulh hukuk mahkemesinden alınır; şerhten sonra tapu müdürlüğünden resmî senet düzenlenmeksizin tescil istenebilir."
      - "Şerh, arabulucunun görev yaptığı yer asliye hukuk mahkemesinden alınır ve tescil için ayrıca resmî senet gerekir."
      - "Taşınmaza ilişkin anlaşmalar arabuluculukta yapılamaz; paydaşlar noterde resmî senet düzenlemelidir."
    dogru: 1
    aciklama: |
      HUAK m. 18/B'ye göre bu kapsamdaki anlaşma belgesi için icra edilebilirlik şerhi alınması zorunludur; taşınmazla ilgili belgelerde şerh taşınmazın bulunduğu yer sulh hukuk mahkemesinden alınır ve mahkeme kanuni sınırlamalara uyulup uyulmadığını denetler. 7531 sayılı Kanunla eklenen fıkraya göre taşınmazın devrine ilişkin anlaşma belgesinin taraflarından biri şerhten sonra tapu müdürlüğünden tescil isteyebilir; tescil resmî senet düzenlenmeksizin yapılır.

  - soru: |
      Beş paydaşlı bir taşınmazda paydaş Can, ortaklığın giderilmesi davasını yalnız üç paydaşa karşı açmıştır; dördüncü paydaş yargılama sırasında ölmüştür, mirasçıları davaya katılmamıştır. Mahkeme satışa karar verir. Kararın akıbeti ne olur?
    siklar:
      - "Onanır; davaya katılmayan paydaşlar satış bedelinden paylarını sonradan isteyebilir."
      - "Bozulur; bütün paydaşlar ve ölen paydaşın mirasçıları davada yer almadan karar verilemez."
      - "Onanır; ortaklığın giderilmesi davasında paydaşların çoğunluğunun davada olması yeterlidir."
      - "Yalnız davaya katılmayan paydaşların payları bakımından bozulur, gerisi onanır."
    dogru: 1
    aciklama: |
      Paylaşma bütün maliklerin hakkını değiştirdiği için tek hüküm verilmesi gerekir ve paydaşlar arasında mecburi dava arkadaşlığı vardır (HMK m. 59, HMK m. 60). Davacı dışındaki bütün paydaşlar davalı olmalı, ölen paydaşın mirasçıları davaya katılmalıdır. Taraf teşkili sağlanmadan verilen karar bozulur.

  - soru: |
      Davacı paydaş, taşınmazın satılarak ortaklığın giderilmesini istemiştir. Davalı paydaş ise aynen bölme talep eder. Hangisi doğrudur?
    siklar:
      - "Mahkeme davacının talebiyle bağlıdır; yalnız satışa karar verebilir."
      - "Davalı aynen bölme isteyemez; bunun için karşı dava açmalıdır."
      - "Dava iki taraflıdır; davalı da aynen bölme isteyebilir ve mahkeme aynen bölme imkânını araştırır."
      - "Davalının talebi davacının talebinin reddi anlamına gelir; dava reddedilir."
    dogru: 2
    aciklama: |
      Yargıtay'a göre ortaklığın giderilmesi davaları iki taraflı, taraflar için benzer sonuçlar doğuran davalardır; davalı da davacı gibi aynı haklara sahiptir. Davacının satış istemesi davalının aynen bölme istemesine engel değildir. Kanun da önce aynen bölme imkânının araştırılmasını öngörür (TMK m. 699/2).

  - soru: |
      Bir parselde Ayşe ve Burak tapuda 1/2'şer paylı maliktir. Ayşe'nin payı, onun ölümüyle mirasçıları Cem ve Deniz'e elbirliği hâlinde geçmiştir. Parsel satışla paylaştırılırsa bedel nasıl dağıtılır?
    siklar:
      - "Tapudaki paylara göre; Burak'a 1/2, Ayşe'nin mirasçılarına toplu olarak 1/2 verilir ve aralarındaki dağıtım mahkemeyi ilgilendirmez."
      - "Tapu kaydındaki ve mirasçılık belgesindeki paylar birlikte dikkate alınarak; Burak'a tapudaki payı, Cem ve Deniz'e Ayşe'nin payından mirasçılık belgesindeki oranlarda."
      - "Kişi sayısına göre; Burak, Cem ve Deniz'e üçte birer."
      - "Elbirliği bulunduğu için önce paylı mülkiyete dönüştürme yapılmadan satış kararı verilemez."
    dogru: 1
    aciklama: |
      Yargıtay'a göre satış bedeli ve harç paylı mülkiyette tapudaki paylara, elbirliği mülkiyetinde mirasçılık belgesindeki paylara göre dağıtılır; ikisi bir arada ise ikisi de dikkate alınır ve hüküm fıkrası bunu göstermelidir. Elbirliği hâlindeki malda ortaklığın giderilmesi davası açılabilir; önce paylı mülkiyete dönüştürme şart değildir.

  - soru: |
      Banka, borçlusu Kaan'ın babasından kalan ve kardeşiyle elbirliği hâlinde malik olduğu tarla üzerinden alacağını almak istemektedir. Hangisi doğrudur?
    siklar:
      - "Banka, Kaan'ın tarladaki yarı payını doğrudan haczettirip sattırabilir."
      - "Banka, icra mahkemesinden alacağı yetki belgesiyle tarla için ortaklığın giderilmesi davası açabilir."
      - "Banka hiçbir şekilde tereke mallarına başvuramaz; paylaşmayı beklemek zorundadır."
      - "Banka, Kaan'ın kardeşinin rızası olmadan ancak kendi alacağı oranında tarlayı aynen bölebilir."
    dogru: 1
    aciklama: |
      Elbirliği mülkiyetinde ortağın belirli bir malda satılabilecek payı yoktur (TMK m. 701/2). İİK m. 121 uyarınca icra mahkemesi satışın nasıl yapılacağını belirler. Yargıtay'a göre alacaklı, icra mahkemesinden alacağı yetki belgesine dayanarak ortaklığın giderilmesi davası açabilir. Paylı mülkiyette ise borçlunun payı doğrudan satılabildiği için alacaklının bu davayı açmakta hukuki yararı yoktur.

  - soru: |
      Babaları 2025'te ölen Selin, Mert ve Okan, İzmir'deki daireye elbirliği hâlinde maliktir; dairede başka malik yoktur. Ortaklığın satış yoluyla giderilmesine karar verilmiş ve karar kesinleşmiştir. Satış Ekim 2026'da yapılacaktır. Hangisi doğrudur?
    siklar:
      - "Birinci artırma yalnız Selin, Mert ve Okan arasında yapılır; bunun için üçünün rızası aranmaz."
      - "Birinci artırma ancak üç mirasçının rızasıyla kendi aralarında yapılabilir; aksi hâlde artırma herkese açıktır."
      - "Artırmalar her zaman yalnız mirasçılar arasında yapılır; üçüncü kişiler hiçbir artırmaya katılamaz."
      - "Mirasçılar arası artırmada teklifin muhammen kıymetin yüzde ellisini geçmesi yeterlidir."
    dogru: 0
    aciklama: |
      7589 sayılı Kanunla değişen ve 31.07.2026'da yürürlüğe giren İİK m. 114/2'ye göre bütün maliklerin miras yoluyla edindiği ve mirasçılar dışında kimsenin mülkiyet hakkı bulunmayan taşınmazlarda ortaklığın satışla giderilmesinde birinci artırma yalnız malik mirasçılar arasında yapılır ve bu usul bir defaya mahsus uygulanır. Bu artırmada teklif muhammen kıymetin yüzde yüzünü geçmelidir (İİK m. 114). Rıza şartı, TMK m. 699/3'teki paydaşlar arası artırmaya ilişkindir.

  - soru: |
      Bir mirasçı, terekedeki bir taşınmaz üzerindeki elbirliği mülkiyetinin paylı mülkiyete dönüştürülmesini sulh hâkiminden ister. TMK m. 644'e göre hâkim ne yapar?
    siklar:
      - "İstemi doğrudan kabul eder; öbür mirasçıların görüşü alınmaz."
      - "Öbür mirasçıları çağırıp itirazları için süre verir; haklı bir itiraz gelmez ya da süre içinde paylaşma davası açılmazsa dönüştürmeye karar verir."
      - "Ancak bütün mirasçılar istemişse dönüştürmeye karar verebilir."
      - "Dönüştürme yalnız noterde yapılan paylaşma sözleşmesiyle mümkün olduğu için istemi reddeder."
    dogru: 1
    aciklama: |
      TMK m. 644'e göre sulh hâkimi öbür mirasçılara çağrıda bulunarak belirleyeceği süre içinde itirazlarını bildirmeye davet eder. Elbirliğinin devamını haklı kılacak bir itiraz ileri sürülmezse ya da mirasçılardan biri süre içinde paylaşma davası açmazsa dönüştürmeye karar verilir. Mirasçılar dönüştürmeyi yazılı paylaşma sözleşmesiyle de kabul edebilir (TMK m. 676/2-3).

  - soru: |
      Eşler Murat ve Selin, noterde yaptıkları sözleşmeyle genel mal ortaklığını seçmiştir. Evlilik sürerken Selin, ortaklık malı olan evdeki "yarı payını" kız kardeşine satmak ve ayrıca evin paylaşılmasını istemektedir. Hangisi doğrudur?
    siklar:
      - "Selin yarı payını serbestçe satabilir, çünkü her eşin belli bir payı vardır."
      - "Selin ortaklık payı üzerinde tek başına tasarruf edemez; sözleşmeden doğan topluluk sürdükçe paylaşma da isteyemez."
      - "Selin payını satamaz ama her zaman paylaşma isteyebilir."
      - "Selin, Murat'ın rızası olmasa da sulh hâkiminin izniyle payını satabilir."
    dogru: 1
    aciklama: |
      Genel mal ortaklığında eşler ortaklık mallarına bölünmemiş bir bütün olarak sahiptir ve hiçbir eş ortaklık payı üzerinde tek başına tasarruf hakkına sahip değildir (TMK m. 257/2-3). Sözleşmeden doğan topluluk devam ettiği sürece paylaşma yapılamaz ve bir pay üzerinde tasarrufta bulunulamaz (TMK m. 702/3).

  - soru: |
      Üç paydaşa paylı olarak ait, 3 hektar büyüklüğündeki mutlak tarım arazisinde asgari tarımsal arazi büyüklüğünün 2 hektar olduğu belirlenmiştir. Arazide buğday ekilmektedir; tarım dışı kullanım izni yoktur. Paydaşlardan biri arazinin üç parçaya aynen bölünmesini ister. Hangisi doğrudur?
    siklar:
      - "Aynen bölme mümkündür; her paydaşa 1 hektar verilir ve değer farkı parayla giderilir."
      - "Aynen bölme mümkün değildir; tarım arazileri belirlenen asgari büyüklüğün altında ifraz edilemez."
      - "Aynen bölme yalnız paydaşların oybirliğiyle mümkündür; bakanlık izni aranmaz."
      - "Tarım arazileri hiçbir şekilde ortaklığın giderilmesine konu olamaz."
    dogru: 1
    aciklama: |
      5403 sayılı Kanun m. 8'e göre tarım arazileri bakanlıkça belirlenen büyüklüklerin altında ifraz edilemez ve hisselendirilemez; asgari büyüklüğe ulaşmış araziler bölünemez eşya sayılır. Üç parçaya bölmek 2 hektarın altında parçalar doğurur; kanundaki istisna (tarım dışı kullanım izni ya da çay, fındık, zeytin gibi özel bitki alanları) olayda yoktur. Ayrıca tarım arazilerinde ifraz ve taksim bakanlığın izniyle yapılır (5403 sayılı Kanun m. 8/B). Ortaklık bu durumda satışla giderilebilir.

  - soru: |
      Paylı bir taşınmazda paydaş Hakan'ın payı üzerinde tapuda "muhdesat (iki katlı ev) Hakan'a aittir" şerhi vardır. Ortaklık satışla giderilecektir. Satış bedeli nasıl dağıtılır?
    siklar:
      - "Bedelin tamamı tapudaki paylara göre dağıtılır; muhdesat arzın bütünleyici parçası olduğundan dikkate alınmaz."
      - "Arzın ve muhdesatın değeri ayrı ayrı belirlenip oranlanır; muhdesata düşen kısım Hakan'a, kalan kısım bütün paydaşlara payları oranında verilir."
      - "Ev satıştan çıkarılır; yalnız arsa satılır."
      - "Bedelin tamamı Hakan'a verilir; öbür paydaşlar Hakan'dan arsa payı bedelini ayrıca dava eder."
    dogru: 1
    aciklama: |
      Yargıtay'a göre muhdesat kural olarak arzla birlikte satılır. Muhdesatın bir paydaşa ait olduğu tapuda şerhliyse ya da bütün paydaşlar bunda birleşiyorsa ve muhdesat arzın değerini artırıyorsa, dava tarihi itibarıyla arzın ve muhdesatın değerleri ayrı ayrı belirlenir ve oranlanır. Satış bedeli bu oranlara göre bölünür: muhdesat payı sahibine, kalanı payları oranında paydaşlara.

olaylar:
  - olay: |
      Hasan Yılmaz 3 Şubat 2025'te ölür. Mirasçılık belgesine göre mirasçıları eşi Fatma ile çocukları Ali, Zeynep ve Mehmet'tir ve her birinin miras payı 1/4'tür. Terekede Kadıköy'de, tapuda Hasan adına kayıtlı tek bir daire vardır. Dairede başka malik yoktur. Mirasçılar daireyi henüz paylaşmamıştır; tapu kaydı elbirliği hâlindedir.

      Mart 2025'te Ali, arkadaşı Kerem'e "dairedeki 1/4 payımı" 1.500.000 TL'ye sattığını belirten adi yazılı bir sözleşme imzalar ve parayı alır. Kerem, Ali'nin yerine dairenin paylaşılmasına katılmak istediğini söyler.

      Haziran 2025'te Zeynep, Kadıköy Sulh Hukuk Mahkemesinde ortaklığın giderilmesi davası açar. Davayı yalnız Ali ve Mehmet'e karşı açmıştır; annesi Fatma'yı "zaten bana destek veriyor" diye davalı göstermemiştir. Arabulucuya da başvurmamıştır.

      Zeynep usule uygun olarak yeniden başlattığı süreçte dava sonunda mahkeme, tek bağımsız bölümden oluşan dairenin aynen bölünemeyeceğini belirleyip satışa karar verir ve karar kesinleşir. Satış Kasım 2026'ya planlanmıştır. Mehmet, "Daire babamızın hatırası, önce biz aramızda artıralım" der. Fatma buna karşı çıkar.

      1. Mirasçıların daire üzerindeki mülkiyetini nitelendiriniz. Ali ile Kerem arasındaki sözleşme Kerem'e ne sağlar?
      2. Zeynep'in Haziran 2025'te açtığı dava hakkında mahkeme nasıl karar vermelidir?
      3. Daire neden satılmaktadır? Satış Fatma'nın itirazına rağmen önce mirasçılar arasında yapılabilir mi?
      4. Satış bedeli nasıl dağıtılır?
    olcut:
      - {tespit: "Miras ortaklığı ve elbirliği mülkiyeti; belirli malda devredilebilir pay olmaması", puan: 15, madde: "TMK m. 640"}
      - {tespit: "Miras payının üçüncü kişiye devrinde noterlikçe düzenleme şartı ve Kerem'in paylaşmaya katılamaması", puan: 20, madde: "TMK m. 677"}
      - {tespit: "Arabuluculuk dava şartının yokluğu ve süre verilmeden usulden ret", puan: 20, madde: "HUAK m. 18/B"}
      - {tespit: "Bütün mirasçıların davada yer alması gereği (mecburi dava arkadaşlığı)", puan: 10, madde: "HMK m. 59"}
      - {tespit: "Daire aynen bölünemediği için açık artırmayla satış", puan: 10, madde: "TMK m. 699"}
      - {tespit: "Mirasçılar arası birinci artırmanın rıza aranmaksızın ve bir kez uygulanması; paydaşlar arası artırmadan farkı", puan: 15, madde: "İİK m. 114"}
      - {tespit: "Satış bedelinin mirasçılık belgesindeki paylara göre dağıtılması", puan: 10, madde: "TMK m. 703"}
    cozum: |
      **Nitelendirme:** Hasan'ın ölümüyle birden çok mirasçı bulunduğu için mirasçılar arasında terekedeki bütün hak ve borçları kapsayan bir **miras ortaklığı** doğmuştur (TMK m. 640/1). Mirasçılar daireye **elbirliğiyle** maliktir. Belirlenmiş payları yoktur; her birinin hakkı dairenin tamamına yaygındır (TMK m. 701).

      **Hukuki sorunlar:** (1) Ali'nin "payını" satmasının sonucu. (2) Zeynep'in davasının dava şartları ve taraf teşkili. (3) Paylaşma biçimi ve satış usulü. (4) Bedelin dağıtılması.

      **İlgili hükümler:** TMK m. 640, m. 677, m. 699, m. 701-703; HUAK m. 18/A, HUAK m. 18/B; HMK m. 4, HMK m. 12, HMK m. 59, HMK m. 60; İİK m. 114.

      **Değerlendirme:**
      - *Ali ile Kerem:* Elbirliği mülkiyetinde Ali'nin daireye ilişkin, tapuda devredilebilecek bir 1/4 payı yoktur. Sözleşme en iyi ihtimalle miras payının devri olarak nitelenebilir. Bir mirasçının üçüncü kişiyle yaptığı böyle bir sözleşme noterlikçe düzenlenmedikçe geçerli olmaz (TMK m. 677/2). Adi yazılı sözleşme geçersizdir; Kerem ödediği parayı genel hükümlere göre geri isteyebilir. Sözleşme geçerli olsaydı bile Kerem'e paylaşmaya katılma yetkisi vermezdi; Kerem yalnız paylaşma sonunda Ali'ye düşen payın kendisine verilmesini isteyebilirdi.
      - *Haziran 2025 davası:* Görevli mahkeme sulh hukuk mahkemesidir (HMK m. 4/1-b) ve Kadıköy'deki taşınmaz için Kadıköy mahkemesi kesin yetkilidir (HMK m. 12/1). Ancak 01.09.2023'ten beri ortaklığın giderilmesi uyuşmazlıklarında dava açılmadan önce arabulucuya başvurmak dava şartıdır (HUAK m. 18/B). Zeynep hiç başvurmadığı için mahkeme süre vermeden, dava şartı yokluğundan davayı **usulden reddetmelidir** (HUAK m. 18/A). Ayrıca paylaşma bütün maliklerin hakkını değiştirdiği için mirasçılar mecburi dava arkadaşıdır (HMK m. 59, HMK m. 60). Fatma'nın Zeynep'i desteklemesi onu davadan çıkarmaz; o da davada yer almalıdır. Yeniden başlayan süreçte arabuluculuğa ve davaya bütün mirasçılar katılmalıdır.
      - *Satış:* Paylaştırma paylı mülkiyet kurallarına göre yapılır (TMK m. 703/2). Hâkim önce aynen bölmeye bakar (TMK m. 699/2). Tek bağımsız bölümden oluşan daire önemli değer kaybı olmadan bölünemeyeceği için açık artırmayla satışa karar verilmiştir (TMK m. 699/3). Karar kesinleşmiş, satış Kasım 2026'ya planlanmıştır. Bu tarihte, 31.07.2026'da yürürlüğe giren İİK m. 114/2 uygulanır. Dairenin bütün malikleri onu miras yoluyla edinmiştir ve mirasçılar dışında kimsenin mülkiyet hakkı yoktur. Bu yüzden **birinci artırma yalnız malik mirasçılar arasında** yapılır. Bu usul kanun gereği uygulanır ve Fatma'nın rızasına bağlı değildir. TMK m. 699/3'teki, bütün paydaşların rızasını arayan paydaşlar arası artırma ile karıştırılmamalıdır. Birinci artırmada teklif muhammen kıymetin yüzde yüzünü geçmelidir. Satış olmazsa ikinci artırma herkese açık yapılır; bu usul bir defaya mahsustur.
      - *Dağıtım:* Elbirliği hâlindeki malda satış bedeli mirasçılık belgesindeki paylara göre dağıtılır. Fatma, Ali, Zeynep ve Mehmet her biri bedelin 1/4'ünü alır. Ali'ye düşen pay, geçerli bir sözleşme olmadığı için Ali'ye ödenir.

      **Sonuç:** Kerem paylaşmaya katılamaz; sözleşme şekil eksikliği yüzünden geçersizdir. Zeynep'in ilk davası usulden reddedilir; dava bütün mirasçılarla ve arabuluculuktan sonra açılmalıdır. Daire satılır, birinci artırma Fatma'nın rızası aranmadan yalnız mirasçılar arasında yapılır. Bedel dörde eşit bölünür.

  - olay: |
      Ayşe (1/2), Burak (1/4) ve Cem (1/4), 2019'da Bodrum'da 3.000 m² yüzölçümlü imarlı bir arsayı birlikte satın alıp tapuya paylı olarak kaydettirir. 15 Ocak 2020'de tapu müdürlüğünde düzenlenen resmî senetle sekiz yıl boyunca paylaşma istemeyeceklerini kararlaştırır ve bunu tapuya şerh ettirirler. Cem, öbürlerinin bilgisiyle arsanın bir köşesine iki katlı bir ev yaptırır. Paydaşların hepsi evin Cem'e ait olduğunu kabul eder; tapuda da bu yönde muhdesat şerhi vardır.

      Ayşe, Mart 2025'te gerekli arabuluculuk sürecinden sonra ortaklığın giderilmesi davası açar. Dava sonuçlanır.

      2028'in sonunda Burak, arabuluculuk görüşmelerinde anlaşma sağlanamayınca Bodrum Sulh Hukuk Mahkemesinde yeni bir dava açar ve arsanın satılmasını ister. Cem ise aynen bölme talep eder. Bilirkişi üç parsellik bir ifraz projesi hazırlar, ama belediye encümeni projenin imar mevzuatına uygun olmadığını bildirir. Ayşe bunun üzerine "satış yalnız aramızda olsun" önerisinde bulunur; Burak kabul etmez.

      1. Ayşe'nin Mart 2025'teki davası hakkında mahkeme nasıl karar vermelidir?
      2. Burak'ın davasında Cem'in aynen bölme talebi dinlenebilir mi? Mahkeme hangi yolu izlemelidir?
      3. Satış nasıl yapılır? Ayşe'nin önerisi uygulanabilir mi?
      4. Cem'in yaptığı ev satış bedelinin dağıtımını nasıl etkiler?
    olcut:
      - {tespit: "Paylaşmama sözleşmesinin 10 yıl sınırı içinde, resmî şekilde yapılmış olması ve 2025 davasının reddi", puan: 20, madde: "TMK m. 698"}
      - {tespit: "Sürenin dolmasıyla paylaşma isteminin yeniden doğması; görev ve kesin yetki", puan: 10, madde: "HMK m. 12"}
      - {tespit: "Davanın iki taraflı olması; davalının aynen bölme isteyebilmesi", puan: 15, madde: "TMK m. 699"}
      - {tespit: "Aynen bölme araştırması, ifraz projesi ve onay makamının olumsuz cevabı üzerine satış", puan: 20, madde: "TMK m. 699"}
      - {tespit: "Paydaşlar arası artırmanın bütün paydaşların rızasına bağlı olması; mirasçılar arası artırma kuralının uygulanmaması", puan: 15, madde: "TMK m. 699"}
      - {tespit: "Muhdesat şerhi ve paydaşların ittifakı nedeniyle arz ve muhdesat değerlerinin oranlanarak dağıtım", puan: 20, madde: "TMK m. 699"}
    cozum: |
      **Nitelendirme:** Ayşe, Burak ve Cem arsaya belli paylarla maliktir; ortada **paylı mülkiyet** vardır (TMK m. 688). Uyuşmazlık, paylı mülkiyetin paylaşma yoluyla sona erdirilmesine, yani **ortaklığın giderilmesine** ilişkindir.

      **Hukuki sorunlar:** (1) Paylaşmama sözleşmesinin etkisi. (2) Davanın niteliği ve aynen bölme imkânı. (3) Satış usulü. (4) Muhdesatın dağıtıma etkisi.

      **İlgili hükümler:** TMK m. 698, m. 699; HMK m. 4, HMK m. 12; HUAK m. 18/B.

      **Değerlendirme:**
      - *2025 davası:* Paydaşların her biri paylaşma isteyebilir, ama bu hak hukuki bir işlemle en çok on yıl sınırlandırılabilir (TMK m. 698/2). Paydaşlar sekiz yıllık bir süre kararlaştırmıştır; süre sınırın içindedir. Taşınmaza ilişkin bu sözleşme resmî şekle bağlıdır ve tapu müdürlüğünde resmî senetle yapılmıştır; ayrıca tapuya şerh verilmiştir. Sözleşme geçerlidir ve 15 Ocak 2028'e kadar paydaşları bağlar. Ayşe'nin Mart 2025'teki davası paylı mülkiyeti sürdürme yükümlülüğü nedeniyle **reddedilmelidir**.
      - *2028 davası:* Süre dolduğu için paylaşma istemi önünde engel kalmamıştır. Arabuluculuk dava şartı yerine getirilmiştir (HUAK m. 18/B). Görevli mahkeme sulh hukuk mahkemesi (HMK m. 4/1-b), kesin yetkili mahkeme taşınmazın bulunduğu Bodrum mahkemesidir (HMK m. 12/1). Ayşe ve Cem davalı olarak davada yer alır.
      - *Aynen bölme talebi:* Ortaklığın giderilmesi davası iki taraflıdır; davalı da davacı gibi aynı haklara sahiptir. Burak'ın satış istemesi Cem'in aynen bölme istemesine engel değildir. Kanun da önce aynen bölmeyi öngörür (TMK m. 699/2). Mahkeme yüzölçümü, nitelik, pay ve paydaş sayısı ile imar mevzuatını araştırır, ifraz projesi hazırlatır ve belediye encümeninin görüşünü alır. Encümen projenin imar mevzuatına uygun olmadığını bildirdiği için aynen bölme yapılamaz. Hâkim, anlaşma olmadıkça arsanın bir bölümünü paylı bırakarak ya da payları değiştirerek başka bir bölme de yapamaz. Bu durumda ortaklık **açık artırmayla satış** yoluyla giderilir (TMK m. 699/3).
      - *Ayşe'nin önerisi:* Satışın paydaşlar arasında artırmayla yapılması bütün paydaşların rızasına bağlıdır (TMK m. 699/3). Burak kabul etmediği için artırma herkese açık yapılır. İİK m. 114/2'deki mirasçılar arası birinci artırma da uygulanmaz; çünkü paydaşlar arsayı miras yoluyla değil satın alarak edinmiştir. Satış karar kesinleştikten sonra yapılır (HMK m. 367/2).
      - *Ev:* Ev kural olarak arsanın bütünleyici parçasıdır ve arzla birlikte satılır. Ancak tapuda evin Cem'e ait olduğuna ilişkin muhdesat şerhi vardır ve bütün paydaşlar da bunu kabul etmektedir. Yargıtay'ın yerleşik uygulamasına göre bu durumda dava tarihi itibarıyla arzın ve evin değerleri ayrı ayrı belirlenir ve toplam değerde her birinin oranı bulunur. Satış bedelinin evin oranına düşen kısmı Cem'e verilir; arza düşen kısım ise Ayşe'ye 1/2, Burak ve Cem'e 1/4'er oranında dağıtılır. Paydaşın yaptığı yapının mülkiyet bakımından durumu ayrı konuda incelenir.

      **Sonuç:** 2025 davası reddedilir. 2028 davasında Cem'in aynen bölme talebi dinlenir, ama onay makamının olumsuz cevabı üzerine ortaklık herkese açık artırmayla satış yoluyla giderilir. Bedelden önce evin payı Cem'e ayrılır, kalan bedel tapudaki paylara göre dağıtılır.

  - olay: |
      Osman Kaya 2024'te ölür. Mirasçılık belgesine göre mirasçıları çocukları Elif ve Kaan'dır; her birinin payı 1/2'dir. Terekede iki taşınmaz vardır: Ankara'da yapı kullanma izni alınmış, kat mülkiyetine elverişli ama kat mülkiyeti kurulmamış, iki eşdeğer daireden oluşan bir bina ve Konya'da bir dükkân. Taşınmazlar tapuda elbirliği hâlinde kayıtlıdır. Elif ve Kaan miras ortaklığına bir temsilci atanmasını istememiştir.

      Dükkânın kiracısı Osman'ın ölümünden bu yana kira ödememektedir. Elif, Kaan'a haber vermeden arabulucuya başvurur; anlaşma sağlanamayınca kiracıya karşı birikmiş kiraların tamamı için dava açar.

      Kaan'ın alacaklısı X Ltd. Şti., Kaan aleyhine kesinleşmiş bir icra takibine dayanarak "Kaan'ın dükkândaki yarı payının" haczedilip satılmasını icra dairesinden ister.

      Elif, bina için yapılan arabuluculuk görüşmelerinden sonuç alamayınca ortaklığın giderilmesi davası açar ve paylaşmanın kat mülkiyeti kurularak her mirasçıya bir daire verilmesi suretiyle yapılmasını ister. Kaan binanın satılmasını savunur.

      Kaan ayrıca dükkân üzerindeki elbirliği mülkiyetinin paylı mülkiyete dönüştürülmesini sulh hâkiminden ister.

      1. Elif'in kira davasında mahkeme ne yapmalıdır?
      2. X Ltd. Şti.'nin istemi hakkında icra dairesi ne yapar? X Ltd. Şti. alacağını tereke mallarından hangi yolla alabilir?
      3. Elif'in bina için talebini değerlendiriniz.
      4. Kaan'ın dönüştürme istemi nasıl sonuçlanır ve bunun X Ltd. Şti.'ye etkisi nedir?
    olcut:
      - {tespit: "Tereke alacağında elbirliği; tek mirasçının davayı yalnız yürütememesi, katılım/muvafakat ya da temsilci için süre", puan: 20, madde: "TMK m. 640"}
      - {tespit: "Elbirliğinde belirli malda haczedilebilir pay olmaması; icra mahkemesine sorulması", puan: 15, madde: "İİK m. 121"}
      - {tespit: "Alacaklının yetki belgesiyle ortaklığın giderilmesi davası açabilmesi", puan: 15, madde: "İİK m. 121"}
      - {tespit: "Kat mülkiyeti kurularak paylaşma talebi ve hâkimin takdir yetkisi; aynen bölme önceliği", puan: 20, madde: "KMK m. 10"}
      - {tespit: "TMK m. 644'teki çağrı, itiraz ve paylaşma davası usulü", puan: 15, madde: "TMK m. 644"}
      - {tespit: "Dönüşümden sonra Kaan'ın payının haczedilip satılabilmesi", puan: 15, madde: "TMK m. 688"}
    cozum: |
      **Nitelendirme:** Osman'ın ölümüyle Elif ve Kaan arasında bir **miras ortaklığı** doğmuştur (TMK m. 640/1). Bina, dükkân ve birikmiş kira alacağı tereke malıdır; mirasçılar bunlar üzerinde **elbirliği** hâlinde hak sahibidir (TMK m. 701).

      **Hukuki sorunlar:** (1) Bir mirasçının tereke alacağı için tek başına dava açması. (2) Elbirliği hâlindeki malda alacaklının yolu. (3) Kat mülkiyeti kurularak paylaşma. (4) Paylı mülkiyete dönüştürme ve sonuçları.

      **İlgili hükümler:** TMK m. 640, m. 644, m. 688, m. 699, m. 701-703; İİK m. 121; KMK m. 10.

      **Değerlendirme:**
      - *Kira davası:* Mirasçılar terekeye ait bütün haklar üzerinde birlikte tasarruf eder (TMK m. 640/2). Kira alacağı da tereke alacağıdır. Yargıtay'a göre bir mirasçının açtığı böyle bir davada mahkeme hemen ret kararı vermemeli, Kaan'ın davaya katılması ya da yazılı muvafakat vermesi için, bu sağlanamazsa TMK m. 640/3 uyarınca sulh mahkemesinden terekeye temsilci atattırılması için Elif'e süre vermelidir. Temsilci atanır ve davaya icazet verirse davayı temsilci takip eder. Kesin süre boşa geçerse ya da temsilci icazet vermezse dava reddedilir.
      - *Haciz istemi:* Elbirliği mülkiyetinde Kaan'ın dükkânda belirlenmiş bir payı yoktur (TMK m. 701/2). Bu yüzden "yarı pay" doğrudan satılamaz. İcra memuru satışın nasıl yapılacağını icra mahkemesine sorar (İİK m. 121). Yargıtay'a göre X Ltd. Şti., icra mahkemesinden alacağı **yetki belgesine** dayanarak dükkân için ortaklığın giderilmesi davası açabilir ve dava sonunda Kaan'a düşecek bedelden alacağını alır. Belge olmadan dava açılırsa belge alması için süre verilir. HUAK m. 18/B alacaklının açtığı davayı ayrık tutmadığından, X Ltd. Şti.'nin dava açmadan önce arabulucuya başvurması ihtiyatlı ve kanunun lafzına uygun yoldur.
      - *Bina:* Paylaştırma paylı mülkiyet kurallarına göre yapılır (TMK m. 703/2) ve hâkim önce aynen bölmeye bakar (TMK m. 699/2). Kaan'ın satış istemesi Elif'in aynen paylaşma talebine engel değildir; dava iki taraflıdır. Kat mülkiyetine elverişli bir taşınmazda mirasçılardan biri paylaşmanın kat mülkiyeti kurularak ve bağımsız bölümlerin tahsisiyle yapılmasını isterse hâkim, kanunda sayılan belgelere dayanarak kat mülkiyetine çevirmeye ve payları denkleştirerek bağımsız bölümleri ortaklara ayrı ayrı vermeye **karar verebilir** (KMK m. 10). Bina kat mülkiyetine elverişlidir, iki eşdeğer daireden oluşur ve iki mirasçının payları eşittir. Bu durumda değer kaybı olmaksızın aynen paylaşma mümkün görünmektedir; hâkimin bu yola gitmesi kanunun aynen bölme önceliğine uygundur. Dairelerden hangisinin kime verileceğinde anlaşma olmazsa kura çekilir. Hâkim kanunda gerekli belgelerin bulunmadığını ya da yolun uygun olmadığını tespit ederse satışa karar verir (TMK m. 699/3).
      - *Dönüştürme:* Kaan'ın istemi üzerine sulh hâkimi Elif'e çağrıda bulunur ve itirazlarını bildirmesi için süre belirler. Elbirliğinin devamını haklı kılacak bir itiraz ileri sürülmezse ya da Elif bu süre içinde paylaşma davası açmazsa, dükkân üzerindeki elbirliği mülkiyeti paylı mülkiyete dönüştürülür (TMK m. 644). Dönüşümden sonra Kaan'ın dükkânda 1/2 oranında belli bir payı olur. Pay devredilebilir, rehnedilebilir ve alacaklılar tarafından haczettirilebilir (TMK m. 688/3). X Ltd. Şti. artık bu payı doğrudan haczettirip sattırabilir. Yargıtay'a göre paylı mülkiyette alacaklının ortaklığın giderilmesi davası açmakta hukuki yararı da yoktur.

      **Sonuç:** Kira davasında Elif'e Kaan'ın katılımı ya da temsilci atanması için süre verilmelidir. X Ltd. Şti. elbirliği sürdükçe yalnız yetki belgesiyle ortaklığın giderilmesi yoluna gidebilir. Bina, kat mülkiyeti kurularak iki mirasçı arasında aynen paylaştırılabilir. Dükkân paylı mülkiyete dönüşürse Kaan'ın payı doğrudan haczedilip satılabilir.

kartlar:
  - on: "Elbirliği mülkiyetinin ayırt edici özelliği nedir? (TMK m. 701)"
    arka: "Ortakların belirlenmiş payı yoktur; her birinin hakkı ortaklığa giren malların tamamına yaygındır."
  - on: "Elbirliği mülkiyeti hangi kaynaklardan doğar?"
    arka: "Kanundan (miras ortaklığı, TMK m. 640) ve kanunda öngörülen sözleşmelerden: mal ortaklığı, aile malları ortaklığı, adi ortaklık (TBK m. 638/1)."
  - on: "Elbirliğinde yönetim ve tasarruf nasıl yapılır?"
    arka: "Kanunda ya da sözleşmede aksine hüküm yoksa oybirliğiyle (TMK m. 702/2)."
  - on: "Elbirliği ortağı tek başına ne yapabilir?"
    arka: "Topluluğa giren hakların korunmasını sağlayabilir; bu korumadan bütün ortaklar yararlanır (TMK m. 702/4, TMK m. 640/4)."
  - on: "Sözleşmeden doğan elbirliğinde paylaşma istenebilir mi?"
    arka: "Topluluk sürdükçe hayır; paya tasarruf da edilemez (TMK m. 702/3). Mirasçı ise her zaman paylaşma isteyebilir (TMK m. 642/1)."
  - on: "Miras ortaklığına temsilciyi kim atar?"
    arka: "Mirasçılardan birinin istemi üzerine sulh mahkemesi, paylaşmaya kadar (TMK m. 640/3)."
  - on: "Bir mirasçı tereke alacağı için tek başına dava açarsa?"
    arka: "Yargıtay'a göre öbür mirasçıların katılımı ya da muvafakati, olmazsa temsilci atanması için süre verilir; sağlanamazsa dava reddedilir."
  - on: "Miras payının üçüncü kişiye devrinin şekli ve etkisi?"
    arka: "Noterlikçe düzenlenmelidir. Üçüncü kişi paylaşmaya katılamaz; yalnız mirasçıya düşen payın kendisine verilmesini ister (TMK m. 677/2)."
  - on: "Elbirliği mülkiyeti nasıl sona erer? (TMK m. 703)"
    arka: "Malın devri, topluluğun dağılması ya da paylı mülkiyete geçilmesiyle. Paylaştırma, aksine hüküm yoksa paylı mülkiyet hükümlerine göre yapılır."
  - on: "Sulh hâkimi elbirliğini paylı mülkiyete nasıl dönüştürür? (TMK m. 644)"
    arka: "Öbür mirasçıları çağırıp itiraz için süre verir. Haklı itiraz yoksa ya da süre içinde paylaşma davası açılmazsa dönüştürür."
  - on: "Paylaşma hakkı hukuki işlemle ne kadar sınırlanabilir?"
    arka: "En çok on yıl. Taşınmazda sözleşme resmî şekle bağlıdır ve tapuya şerh verilebilir (TMK m. 698/2)."
  - on: "Paylaşma isteminin üç engeli nedir? (TMK m. 698)"
    arka: "Hukuki işlemle devam yükümlülüğü, malın sürekli bir amaca özgülenmesi ve uygun olmayan zaman."
  - on: "Hâkim paylaşmada hangi sırayı izler? (TMK m. 699)"
    arka: "Önce aynen bölme ve gerekirse para ile denkleştirme; bölme uygun değilse, özellikle önemli değer kaybı varsa açık artırmayla satış."
  - on: "Paydaşlar arasında artırma için ne gerekir?"
    arka: "Bütün paydaşların rızası (TMK m. 699/3)."
  - on: "Aynen bölmede imar uygunluğunu kim inceler?"
    arka: "Belediye ya da mücavir alan sınırları içinde belediye encümeni, dışında il idare kurulu. Kimin neresini alacağı anlaşılamazsa kura çekilir."
  - on: "Kat mülkiyeti kurarak paylaşma mümkün mü?"
    arka: "Evet. Elverişli taşınmazda bir ortak isterse hâkim kat mülkiyetine çevirip bağımsız bölümleri paylar denkleştirilerek dağıtmaya karar verebilir (KMK m. 10)."
  - on: "Ortaklığın giderilmesinde görevli ve yetkili mahkeme?"
    arka: "Sulh hukuk mahkemesi (HMK m. 4/1-b). Taşınmazda taşınmazın bulunduğu yer mahkemesi kesin yetkilidir (HMK m. 12/1)."
  - on: "📌 Ortaklığın giderilmesinde arabuluculuk ne zamandan beri dava şartı?"
    arka: "01.09.2023'ten beri (HUAK m. 18/B). Hiç başvurulmadan açılan dava usulden reddedilir; o tarihte görülmekte olan davalara uygulanmaz."
  - on: "Arabuluculuk süresi ne kadardır?"
    arka: "Arabulucu görevlendirildiği tarihten itibaren üç hafta içinde sonuçlandırır; zorunlu hâllerde en fazla bir hafta uzatılabilir (HUAK m. 18/A)."
  - on: "Ortaklığın giderilmesi davasında kimler taraf olmalıdır?"
    arka: "Bütün paydaşlar; ölen paydaşın mirasçıları da. Aralarında mecburi dava arkadaşlığı vardır (HMK m. 59-60)."
  - on: "Elbirliği hâlinde ortak olan borçlunun alacaklısı ne yapar?"
    arka: "İcra mahkemesinden yetki belgesi alarak ortaklığın giderilmesi davası açar (İİK m. 121). Paylı mülkiyette pay doğrudan satılır."
  - on: "📌 Bütün malikleri mirasçı olan taşınmazın satışında 2026 kuralı?"
    arka: "Birinci artırma yalnız malik mirasçılar arasında ve bir kez yapılır; teklif muhammen kıymetin yüzde yüzünü geçmelidir (İİK m. 114)."
  - on: "Satış bedeli neye göre dağıtılır?"
    arka: "Paylı mülkiyette tapudaki paylara, elbirliğinde mirasçılık belgesindeki paylara; ikisi bir aradaysa ikisine birden."
  - on: "Muhdesat satış bedelini nasıl etkiler?"
    arka: "Bir paydaşa ait olduğu tapuda şerhliyse ya da bütün paydaşlar kabul ediyorsa arz ve muhdesat değerleri ayrı belirlenip oranlanır; muhdesat payı sahibine verilir."
