  - id: "592578500"
    ozet: |
      Ressam davacı, 33 yağlı boya tablosunu 1996'da geçici çıkışla yurt dışına çıkarmış, 1998'de geri getirmiştir. Süre aşıldığı için tablolar gümrükte alıkonulmuş; teslim kararı verilmiş ama ardiye ücreti istenmiştir. Ücret ödenmeyince tablolar gümrükte kalan eşya sayılarak 1998 sonunda bedelsiz biçimde Kültür Bakanlığına devredilmiş ve sonradan bir üniversite müzesinde sergilenmeye başlanmıştır. Davacı 2016'da istihkak davası açmış; ilk derece mahkemesi, 1998-2010 arasında talep yapılmadığı için tabloların fiziki mülkiyeti bakımından TMK m. 777'deki beş yıllık zamanaşımının dolduğu gerekçesiyle davayı reddetmiştir. Yargıtay 4. Hukuk Dairesi kararı oybirliğiyle bozmuştur: Malın malik sıfatıyla, nizasız ve fasılasız elde bulundurulması TMK m. 777'nin en önemli şartıdır. Eserlere davacının rızası dışında el konulmuş, idare de kendisinin malik sıfatıyla zilyet olmadığını teyit etmiş ve taraflar arasında süregelen bir anlaşmazlık bulunmuştur. Bu yüzden zamanaşımı şartları oluşmamıştır. Uyuşmazlığın özü ardiye alacağıdır; salt bu alacak yüzünden mülkiyetin idareye geçtiğini kabul etmek mülkiyet hakkına ölçüsüz bir müdahaledir. Karar, malik sıfatıyla ve nizasız zilyetlik olmadıkça süre ne kadar uzarsa uzasın TMK m. 777 ile kazanma olmayacağını gösterir.
  - id: "17115900"
    ozet: |
      Davacı, evlilik bağı nedeniyle davalı kocanın elinde kalan ev eşyalarının ve ziynet eşyalarının aynen iadesini, olmazsa 7.000 TL bedelin tahsilini istemiştir. Mahkeme davayı reddetmiş, davacı vekili temyiz etmiştir. Yargıtay 6. Hukuk Dairesi, ziynet eşyası yönünden delillerin takdirinde isabetsizlik görmemiş; ev eşyaları yönünden ise kararı oybirliğiyle bozmuştur. Dairenin gerekçesine göre eşya aynen mevcutsa dava mülkiyete dayanır ve TMK m. 777 ile TMK m. 778'deki (eski Kanundaki 701. ve 702. maddelerdeki) şartlar oluşmadıkça zamanaşımına uğramaz. İstihkak davası ayni hak olan mülkiyete dayanan tipik bir ayın davasıdır; bu yüzden zamanaşımından söz edilemez. "Aynen olmazsa bedeli" ibaresi asıl istemin uzantısı ve ikamesidir, davanın niteliğini değiştirmez; davanın esasına girilmeliydi. Karar, taşınırdaki istihkak davasının zamanaşımına uğramadığını, hakkı ancak başkasının kazanmasının (TMK m. 777) ya da terkin (TMK m. 778) sona erdirdiğini gösterir.

sorular:
  - soru: |
      Zeynep eski koltuğunu "isteyen alsın" notuyla sokağa bırakır. Koltuğu fark eden Okan onu alıp evine götürür. Hangisi doğrudur?
    siklar:
      - "Koltuk kaybedilmiş eşya sayılır; Okan bildirim yükümlülüğüne tabidir ve beş yıl sonra malik olur."
      - "Zeynep koltuğu terk etmiştir; koltuk sahipsiz hâle gelmiş ve Okan malik olmak iradesiyle zilyetliğe geçirdiği için malik olmuştur."
      - "Zilyetlik kaybedildiği için Zeynep'in mülkiyeti kendiliğinden sona ermiştir; koltuk devletin olur."
      - "Okan ancak beş yıl davasız ve aralıksız zilyet kalırsa malik olabilir."
    dogru: 1
    aciklama: |
      Mülkiyet, malik tarafından terk edilmedikçe yalnız zilyetliğin kaybıyla sona ermez (TMK m. 778). Zeynep bırakma iradesiyle koltuğu sokağa koyduğundan terk vardır; sahipsiz taşınırı malik olmak iradesiyle zilyetliğine geçiren kimse malik olur (TMK m. 767). Yaygın yanılgı, terk ile kaybetmeyi karıştırmaktır; kaybedilmiş eşyada TMK m. 769-771 işler, terkte işlemez.

  - soru: |
      Avcı Kerem'in tuttuğu keklik kafesten kaçar. Kerem kekliği gecikmeksizin ve ara vermeksizin aramaz ve yeniden tutmak için uğraşmaz. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Keklik sahipsiz duruma gelir; onu tutan kişi malik olmak iradesiyle zilyetliğe geçirirse malik olur."
      - "Keklik hâlâ Kerem'indir; yalnız beş yıl sonra sahipsiz olur."
      - "Keklik kaybolmuş eşya sayılır; bulan TMK m. 771 gereği beş yıl bildirim süresini beklemek zorundadır."
      - "Keklik, yaban hayvanı olduğu için doğrudan devletin olur."
    dogru: 0
    aciklama: |
      Tutulan av hayvanları yeniden serbest kalır ve sahipleri onları gecikmeksizin ve ara vermeksizin aramaz ve tekrar tutmak için uğraşmazsa sahipsiz duruma gelirler (TMK m. 768/1). Sahipsiz taşınırı malik olmak iradesiyle zilyetliğine geçiren malik olur (TMK m. 767). Beş yıllık süre bulunmuş eşyaya aittir (TMK m. 771/1), sahipsiz hayvana değil.

  - soru: |
      Arı oğuluyla ilgili aşağıdaki ifadelerden hangisi doğrudur?
    siklar:
      - "Başkasının taşınmazına uçan arı oğulu hemen sahipsiz olur ve ilk tutan malik olur."
      - "Başkasının kovanına göçen arı oğulu, bedel ödenmesi gerekmeksizin kovan malikinin olur."
      - "Başkasının kovanına göçen arı oğulu, ancak eski sahibine bedel ödenirse kovan malikinin olur."
      - "Arı oğulu hiçbir hâlde mülkiyet konusu olamaz."
    dogru: 1
    aciklama: |
      Başkasının kovanına göçen arı oğulu bir bedel ödenmesi gerekmeksizin kovan malikinin olur (TMK m. 774/2). Arı oğulu başkasının taşınmazına uçmuş olmakla ise sahipsiz duruma gelmez (TMK m. 768/3). Oğul bu hâlde hâlâ eski sahibinindir.

  - soru: |
      Fırtınada Ahmet'in balkonundan uçan halı komşusu Elif'in bahçesine düşer. Hangisi doğrudur?
    siklar:
      - "Halı sahipsiz duruma gelir; Elif onu hemen sahiplenerek malik olur."
      - "Elif, kaybolan eşyayı bulanın haklarına sahip ve yükümlülüklerine tabi olur."
      - "Elif halıyı ancak Ahmet'e ödül ödeyerek elinde tutabilir."
      - "Halı kendiliğinden Elif'in malı olur, çünkü bahçe onun taşınmazıdır."
    dogru: 1
    aciklama: |
      Doğal güçlerin etkisiyle ya da rastlantı sonucunda taşınır mallar kimin egemenlik alanına girerse o kimse kaybolan eşyayı bulanın haklarına sahip ve yükümlülüklerine tabi olur (TMK m. 774/1). Halı sahipsiz olmamıştır; kaybedilmiş eşya gibi değerlendirilir. Elif'in bildirim, koruma gibi yükümlülükleri vardır, arazi maliki olarak aranıp alınmasına da izin vermelidir (TMK m. 752).

  - soru: |
      Deniz bir kafede masanın altında bir cüzdan bulur. Cüzdanın sahibi bilinmemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Deniz, cüzdanı kendi evinde saklayarak beş yıl sonra malik olur."
      - "Deniz, cüzdanı kafenin sahibine ya da kiracısına teslim etmek zorundadır; işletmeci bulan sayılır ama ödül isteyemez."
      - "Kafenin işletmecisi cüzdanı bulan sayılır ve malikine geri verirse uygun ödül isteyebilir."
      - "Deniz, cüzdanı yalnız kolluğa bildirmek zorundadır; işletmeciye teslim edemez."
    dogru: 1
    aciklama: |
      Oturulan bir evde, işyerinde ya da kamu hizmeti görülen yerde bir şey bulan kimse bunu yer sahibine, kiracıya veya denetim ve gözetim görevlilerine teslim etmek zorundadır (TMK m. 769/3). Yer sahibi, kiracı veya kurum şeyi bulan sayılır; ancak bunlar ödül isteyemez (TMK m. 771/3).

  - soru: |
      TMK m. 770/2'ye göre bulunan şeyin satılabilmesi için aşağıdaki sebeplerden hangisi **yeterli değildir**?
    siklar:
      - "Korunmasının aşırı gider gerektirmesi"
      - "Şeyin çabuk bozulabilir nitelikte olması"
      - "Kolluk kuvvetleri veya kamu kurumu tarafından bir yıldan fazla saklanmış olması"
      - "Bulanın şeyi satmak istemesi"
    dogru: 3
    aciklama: |
      TMK m. 770/2 üç satış sebebi sayar: aşırı gider, çabuk bozulma ve kolluk/kamu kurumunca bir yıldan fazla saklanma. Bulanın satma isteği bunlardan değildir. Satış gerektiğinde ilânla açık artırma yoluyla yapılır ve satış bedeli şeyin yerine geçer (TMK m. 770/3).

  - soru: |
      Ahmet 2 Mart'ta bir yüzük bulur ve 20 Mart'ta kolluk kuvvetlerine bildirir. TMK m. 771/1'deki beş yıllık süre hangi tarihten itibaren işlemeye başlar?
    siklar:
      - "2 Mart'tan, yani buluş tarihinden"
      - "20 Mart'tan, yani bildirim tarihinden"
      - "Sahibinin yüzüğü kaybettiği tarihten"
      - "Yüzüğün satıldığı tarihten"
    dogru: 1
    aciklama: |
      Bulunan şeyin maliki, ilân veya kolluk kuvvetlerine ya da muhtara bildirme tarihinden başlayarak beş yıl içinde ortaya çıkmazsa bulan kimse mülkiyeti kazanır (TMK m. 771/1). Süre buluş gününden değil, ilân ya da bildirim tarihinden işler.

  - soru: |
      Mert, parkta çok değerli bir altın kolye bulur. Bildirmez, araştırmaz ve kimseye haber vermeden kolyeyi altı yıl boyunca kullanır. Hangisi doğrudur?
    siklar:
      - "Buluştan beş yıl geçtiği için TMK m. 771/1'e göre kolyenin maliki olmuştur."
      - "Yükümlülüklerini yerine getirmediği için TMK m. 771/1'deki şartlar oluşmamıştır; ayrıca şikâyet üzerine TCK m. 160 gündeme gelir."
      - "Bildirim yükümlülüğü yalnız yer sahibine karşıdır, bu yüzden Mert'in bir sorumluluğu yoktur."
      - "Mert, bildirim yapmadığı için kolyeyi derhâl sahibine iade etmek zorundadır ve ödül isteyemez; bu sonucu kanun açıkça belirtir."
    dogru: 1
    aciklama: |
      Değerli şeyde kolluğa ya da muhtara bildirim her hâlde gereklidir (TMK m. 769/2) ve mülkiyetin kazanılması, bulanın yükümlülüklerini yerine getirmiş olmasına bağlıdır (TMK m. 771/1). Ayrıca kaybedilmiş eşyayı iade etmeksizin ya da yetkili mercileri haberdar etmeksizin malik gibi tasarruf eden kişi şikâyet üzerine cezalandırılır (TCK m. 160/1). Son şıktaki kesin sonuç kanun metninde yazılı değildir.

  - soru: |
      Ali, komşusu Can'ın izniyle Can'ın bahçesinde ağaç dikerken toprak altında bir kutu bulur. Kutuda çok eski altın paralar vardır; bilirkişiye göre eşya çok zaman önce gömülmüş, malikinin artık bulunmadığı kesindir ve kültür varlığı niteliğinde de değildir. Hangisi doğrudur?
    siklar:
      - "Altınlar Ali'nin olur; Can yalnız uygun ödül isteyebilir."
      - "Altınlar bahçenin maliki Can'ın olur; Ali değerinin yarısını aşmamak üzere uygun ödül isteyebilir."
      - "Altınlar Devletin olur; Ali ve Can hiçbir hak talep edemez."
      - "Altınlar Ali ile Can'ın yarı yarıya paylı malikiyetinde olur."
    dogru: 1
    aciklama: |
      Eşya define niteliğindedir (TMK m. 772/1). Define, içinde bulunduğu taşınmaz veya taşınır malın malikinin olur (TMK m. 772/2). Bulan ise değerinin yarısını aşmamak üzere uygun bir ödül isteyebilir (TMK m. 772/3). Devlet malı niteliği ancak eşya kültür varlığı ise söz konusudur (2863 sayılı Kanun m. 5/1); olayda bu nitelik yoktur.

  - soru: |
      Ödül bakımından bulunmuş eşya ile define arasındaki fark hangi seçenekte doğru gösterilmiştir?
    siklar:
      - "Bulunmuş eşyada ödül değerin yarısını aşamaz; definede üst sınır yoktur."
      - "Her ikisinde de ödülün oranı kanunda yüzde olarak belirlenmiştir."
      - "Definede ödül değerin yarısını aşmamak üzere uygun ödüldür; bulunmuş eşyada kanun üst sınır ya da oran vermez, yalnız uygun ödül der."
      - "Her ikisinde de bulan ödül isteyemez."
    dogru: 2
    aciklama: |
      Defineyi bulan, değerinin yarısını aşmamak üzere uygun bir ödül isteyebilir (TMK m. 772/3). Bulunan şey malikine geri verilirse bulan giderlerin ödenmesini ve uygun bir ödül verilmesini isteyebilir (TMK m. 771/2); bu hükümde üst sınır ya da yüzde yoktur. Ödülün oranını kesin bir yüzde olarak ezberlemek yanlıştır.

  - soru: |
      Hasan bir bahçede kazı yaparken içinde birkaç yıl önce gömüldüğü ve sahibinin araştırılarak bulunabileceği anlaşılan bir kutu bulur. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Eşya define sayılır; bahçenin maliki malik olur."
      - "Eşya define sayılmaz, bulunmuş eşyadır; TMK m. 769-771'deki yükümlülükler ve beş yıllık süre uygulanır."
      - "Eşya sahipsizdir; Hasan hemen malik olur."
      - "Eşya Devlet malıdır."
    dogru: 1
    aciklama: |
      Define için eşyanın bulunmalarından çok zaman önce gömülmüş olması ve malikinin artık bulunmadığının kesin olarak anlaşılması gerekir (TMK m. 772/1). Burada sahibi araştırılabildiğinden bu şartlar oluşmamıştır. Eşya bulunmuş eşyadır; bulan bildirim yükümlülüğüne tabidir (TMK m. 769) ve malik beş yıl içinde çıkmazsa bulan malik olur (TMK m. 771/1).

  - soru: |
      Bir kişi toprağı kazarken, antik döneme ait ve korunması gerekli nitelikte sikkeler bulur. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "TMK m. 772 uygulanır; sikkeler taşınmaz malikinin olur."
      - "TMK m. 773 gereği 2863 sayılı Kanun uygulanır; bulan en geç üç gün içinde bildirmek zorundadır."
      - "Sikkeler sahipsiz sayılır; ilk bulan malik olur."
      - "Bildirim için süre yoktur; beş yıl içinde bildirmesi yeterlidir."
    dogru: 1
    aciklama: |
      Bilimsel değeri olan sahipsiz doğal şeyler ile eski eserlerin bulunması hâlinde özel kanun hükümleri uygulanır (TMK m. 773). Bulanlar bunu en geç üç gün içinde en yakın müze müdürlüğüne, köyde muhtara ya da diğer yerlerde mülki idare amirlerine bildirmeye mecburdur (2863 sayılı Kanun m. 4/1). Korunması gerekli taşınır kültür varlıkları Devlet malıdır (2863 sayılı Kanun m. 5/1), taşınmaz malikinin olmaz.

  - soru: |
      Leyla, 2.000 TL değerindeki kumaşı kendi kumaşı sanarak iyiniyetle işler ve bilirkişiye göre emeğinin değeri 15.000 TL olan bir elbise diker. Kumaş aslında Fatma'ya aittir. Hangisi doğrudur?
    siklar:
      - "Elbise Fatma'nındır; Leyla yalnız emeğinin bedelini isteyebilir."
      - "Elbise Leyla ile Fatma'nın değerleri oranında paylı mülkiyetindedir."
      - "Emeğin değeri kumaşın değerinden fazla olduğu için elbise işleyen Leyla'nındır; Fatma tazminat ve sebepsiz zenginleşme isteminde bulunabilir."
      - "Hâkim, iyiniyetli olsa bile elbiseyi mutlaka Fatma'ya bırakır."
    dogru: 2
    aciklama: |
      Emeğin değeri o şeyin değerinden fazlaysa yeni şey işleyenin olur (TMK m. 775/1). Tazminat ve sebepsiz zenginleşmeden doğan istem hakları saklıdır (TMK m. 775/3). Hâkimin yeni şeyi malike bırakabilmesi yalnız iyiniyetli olmayan işleyen için söz konusudur (TMK m. 775/2).

  - soru: |
      TMK m. 775/2'ye göre iyiniyetli olmayan bir kimse başkasına ait malzemeyi işler ve emeğinin değeri malzemenin değerinden daha fazladır. Hangisi doğrudur?
    siklar:
      - "Yeni şey kanun gereği her hâlde malikin olur."
      - "Hâkim, yeni şeyi malike bırakabilir."
      - "Yeni şey kanun gereği iyiniyetsiz olsa da işleyenin olur."
      - "Yeni şey malik ile işleyen arasında yarı yarıya paylaştırılır."
    dogru: 1
    aciklama: |
      İşleyen iyiniyetli değilse, emeğin değeri işlenen şeyin değerinden daha fazla olsa bile hâkim yeni şeyi malike bırakabilir (TMK m. 775/2). Hükmün ifadesi "bırakabilir"dir; hâkime takdir verilmiştir. Zorunlu sonuç ("her hâlde malikin olur") yazılı değildir.

  - soru: |
      Fatma ve Gül'ün 100'er litre zeytinyağı, bir depodaki hata yüzünden aynı tankta ayrılamaz biçimde karışır. Fatma'nın yağı çok daha yüksek kaliteli olduğundan değeri Gül'ün yağının değerinden fazladır. Hangisi doğrudur?
    siklar:
      - "Miktarlar eşit olduğundan her biri yarı yarıya paylı malik olur."
      - "Fatma ve Gül, karışma zamanındaki değerleri oranında paylı malik olur."
      - "Tank, daha değerli yağın maliki Fatma'nın olur."
      - "Karışma sebebiyle tankın mülkiyeti sahipsiz hâle gelir."
    dogru: 1
    aciklama: |
      Ayrılamayacak biçimde karışan taşınırların malikleri, yeni şey üzerinde kendi taşınırlarının karışma zamanındaki değerleri oranında paylı mülkiyete sahip olur (TMK m. 776/1). Ölçüt miktar değil değerdir; bu yüzden eşit litre eşit pay doğurmaz. Tazminat ve sebepsiz zenginleşme istemleri ayrıca saklıdır (TMK m. 776/3).

  - soru: |
      Başkasına ait bir vida, Can'ın motosikletine ikincil nitelikte bütünleyici parça olacak şekilde takılır. Hangisi doğrudur?
    siklar:
      - "Vida sahibi ile Can, değerleri oranında paylı malik olur."
      - "Vida sahibi vidayı her zaman söktürüp geri alabilir."
      - "Motosikletin tamamı ana parçanın maliki Can'a ait olur; vida sahibi tazminat ya da sebepsiz zenginleşme isteyebilir."
      - "Motosiklet sahipsiz hâle gelir."
    dogru: 2
    aciklama: |
      Bir taşınır diğer bir taşınırla onun ikincil nitelikte bütünleyici parçası olacak şekilde birleşirse eşyanın tamamı ana parçanın malikine aittir (TMK m. 776/2). Bu hâlde paylı mülkiyet doğmaz. Tazminat ve sebepsiz zenginleşmeden doğan istem hakları saklıdır (TMK m. 776/3).

  - soru: |
      Veli, Murat'tan bir kamera kiralar. Kira süresi bittikten sonra da kamerayı iade etmeyip sekiz yıl boyunca davasız ve aralıksız elinde tutar. Veli TMK m. 777'ye göre malik olabilir mi?
    siklar:
      - "Evet, beş yıl dolduğu için malik olur."
      - "Evet, ancak yalnız Murat dava açmamışsa."
      - "Hayır; Veli kamerayı malik sıfatıyla zilyet olarak elinde tutmamıştır, bu nedenle süre ne kadar uzarsa uzasın TMK m. 777'nin şartları oluşmaz."
      - "Hayır; kazandırıcı zamanaşımı için on yıl gerekir."
    dogru: 2
    aciklama: |
      TMK m. 777/1 malik sıfatıyla zilyetliği arar. Kiracı gibi fer'î zilyet malik sıfatıyla zilyet değildir (TMK m. 974/2). Bu yüzden süre uzasa da kazanma gerçekleşmez. Taşınırda tek süre beş yıldır; on yıl taşınmazdaki olağan zamanaşımı süresidir (TMK m. 712).

  - soru: |
      Hakan, iyiniyetle ve malik sıfatıyla bir saati zilyetliğinde bulundurmaktadır. Dört yıl sonra saat Hakan'ın isteği dışında kaybolur; Hakan saatin yerini sekiz ay içinde bulup geri alır. Kazandırıcı zamanaşımı bakımından hangisi doğrudur?
    siklar:
      - "Zilyetlik kaybedildiği için süre başa döner."
      - "Hakan bir yıl içinde eşyayı ele geçirdiğinden zamanaşımı kesilmiş olmaz."
      - "Hakan'ın dört yılı geçersiz sayılır; yeniden beş yıl dolması gerekir."
      - "Hakan'ın geri alması için mutlaka dava açması gerekir."
    dogru: 1
    aciklama: |
      Zilyetliğin irade dışı kaybedilmesi hâlinde zilyet, bir yıl içinde eşyayı ele geçirir veya açacağı bir dava yoluyla onu yeniden elde ederse kazandırıcı zamanaşımı kesilmiş olmaz (TMK m. 777/2). Eşyayı ele geçirmek yeterlidir; dava açma zorunluluğu yoktur.

  - soru: |
      Taşınır üzerindeki istihkak davası ile ilgili Yargıtay'ın yerleşik uygulamasına göre hangisi doğrudur?
    siklar:
      - "Taşınırdaki istihkak davası on yıllık zamanaşımına tabidir."
      - "Taşınırdaki istihkak davası beş yıllık zamanaşımına tabidir."
      - "İstihkak davası zamanaşımına uğramaz; malikin hakkını ancak başkasının kazanması (ör. TMK m. 777 şartlarının gerçekleşmesi) ya da terk sona erdirir."
      - "İstihkak davası, zilyetlik bir yıl kesintiye uğrayınca kendiliğinden düşer."
    dogru: 2
    aciklama: |
      Yargıtay'a göre aynen mevcut eşya için açılan istihkak davası ayni hak olan mülkiyete dayanır ve TMK m. 777-778'deki şartlar oluşmadıkça zamanaşımına uğramaz. Mülkiyeti sona erdiren, sürenin geçmesi değil, başkasının eşyayı kazanması ya da malikin onu terk etmesidir (TMK m. 778).

  - soru: |
      Selin'in saati 2017'de çalınır. Hakan saati Mart 2018'de bir tanıdığından satın alır; çalıntı olduğunu bilmesini gerektiren bir durum yoktur. Hakan saati o günden beri malik sıfatıyla, davasız ve aralıksız kullanır. Selin Haziran 2025'te istihkak davası açar. Hangisi doğrudur?
    siklar:
      - "Selin'in mülkiyeti sonsuza dek devam ettiğinden davayı mutlaka kazanır."
      - "Hakan iyiniyetli olduğu ve beş yıl davasız ve aralıksız malik sıfatıyla zilyet kaldığı için TMK m. 777/1 gereği malik olmuştur; dava reddedilir."
      - "Hakan saati yalnız kolluğa bildirmişse malik olabilir."
      - "Saat çalıntı olduğundan TMK m. 777 hiçbir hâlde uygulanamaz."
    dogru: 1
    aciklama: |
      Başkasının taşınırını davasız ve aralıksız beş yıl iyiniyetle ve malik sıfatıyla zilyetliğinde bulunduran kimse zamanaşımı yoluyla malik olur (TMK m. 777/1). İyiniyet karinesi işler (TMK m. 3). Selin'in davası açıldığında beş yıl dolmuştur. Hakan saatin çalıntı olduğunu bilseydi iyiniyet şartı eksik kalır ve önceki zilyet her zaman dava açabilirdi (TMK m. 991/1).

olaylar:
  - olay: |
      Ayşe, 10.03.2020'de bir mahalle parkında değerli bir altın bilezik bulur. 12.03.2020'de en yakın karakola giderek bileziği bildirir ve teslim eder. Bileziğin sahibi ortaya çıkmaz. Bilezik karakolda iki yıl saklanır.

      Ayşe'nin arkadaşı Burak, "Bildirmesen de olurdu, nasıl olsa beş yıl sonra senin olurdu" der. Ayşe ise bileziği bildirmiş olmaktan memnundur ve şunları merak eder.

      1. Ayşe'nin karakola bildirimi yeterli midir? Bilezik satılabilir mi?
      2. Ayşe ne zaman malik olur? Beş yıllık sürenin başlangıcı hangi tarihtir?
      3. Bileziğin sahibi ortaya çıkarsa Ayşe'nin hakları nelerdir?
      4. Ayşe bileziği kafede bulsaydı hukuki durum nasıl olurdu?
      5. Ayşe bileziği bildirmeyip kendi takısı olarak kullansaydı sonuç ne olurdu?
    olcut:
      - {tespit: "Değerli şeyde kolluğa ya da muhtara bildirimin her hâlde zorunlu olması ve Ayşe'nin bunu yapmış olması", puan: 15, madde: "TMK m. 769"}
      - {tespit: "Kolluk tarafından bir yıldan fazla saklanması nedeniyle satış imkânı; açık artırma ve satış bedelinin şeyin yerine geçmesi", puan: 15, madde: "TMK m. 770"}
      - {tespit: "Beş yıllık sürenin bildirim tarihinden (12.03.2020) başlaması; malik çıkmazsa Ayşe'nin mülkiyeti kazanması", puan: 20, madde: "TMK m. 771"}
      - {tespit: "Malik çıkarsa eşyanın iadesi; Ayşe'nin giderlerini ve uygun ödülü isteyebilmesi; ödül oranının kanunda yazılı olmaması", puan: 15, madde: "TMK m. 771"}
      - {tespit: "Kafede bulunursa işletmeciye teslim yükümlülüğü; işletmecinin bulan sayılması ama ödül isteyememesi", puan: 20, madde: "TMK m. 769"}
      - {tespit: "Bildirmeyen bulanın yükümlülüklerini yerine getirmemesi nedeniyle mülkiyeti kazanamaması ve TCK m. 160 bağlantısı", puan: 15, madde: "TCK m. 160"}
    cozum: |
      **Nitelendirme:** Olay, kaybedilmiş bir eşyanın bulunmasına ilişkindir. Bilezik sahipsiz değildir; terk edilmemiş, kaybedilmiştir (TMK m. 778). Bu yüzden sahiplenme değil, bulunmuş eşya hükümleri uygulanır.

      **Hukuki sorunlar:** (1) Bulanın bildirim yükümlülüğü ve bileziğin satılabilmesi, (2) mülkiyetin kazanılması ve sürenin başlangıcı, (3) malik çıkarsa bulanın hakları, (4) yer sahibi hâli, (5) bildirmemenin sonuçları.

      **İlgili hükümler:** TMK m. 769, 770, 771, 778; TCK m. 160.

      **Değerlendirme:**

      *1. Bildirim ve satış:* Bulunan şey önemli ölçüde değerliyse kolluk kuvvetlerine veya muhtara bildirmek her hâlde gerekir (TMK m. 769/2). Ayşe 12.03.2020'de karakola bildirmiş ve bileziği teslim ettiğinden yükümlülüğünü yerine getirmiştir. Bilezik kolluk tarafından bir yıldan fazla saklandığı için satılabilir (TMK m. 770/2). Satış gerektiğinde önceden ilân edilerek açık artırma yoluyla yapılır ve satış bedeli bileziğin yerine geçer (TMK m. 770/3). Kanun "satılabilir" der; satış zorunlu değildir.

      *2. Mülkiyetin kazanılması:* Bulunan şeyin maliki ilân veya kolluk kuvvetlerine ya da muhtara bildirme tarihinden başlayarak beş yıl içinde ortaya çıkmazsa, bulan kimse yükümlülüklerini yerine getirmiş olmak koşuluyla mülkiyeti kazanır (TMK m. 771/1). Süre buluş tarihinden (10.03.2020) değil, bildirim tarihinden (12.03.2020) işler. Malik bu süre içinde çıkmazsa Ayşe bileziğin maliki olur.

      *3. Malik çıkarsa:* Bilezik malikine geri verilirse Ayşe yaptığı giderlerin ödenmesini ve uygun bir ödül verilmesini isteyebilir (TMK m. 771/2). Ödülün oranı kanunda yazılı olmadığı için bir yüzde vermek doğru olmaz; miktarı uygun ödül ölçüsüyle belirlenir.

      *4. Kafede bulunsaydı:* Oturulan bir evde, işyerinde ya da kamu hizmeti görülen yerde bir şey bulan kimse bunu yer sahibine veya kiracıya teslim etmek zorundadır (TMK m. 769/3). Yer sahibi, kiracı veya kurum şeyi bulan sayılır, ancak ödül isteyemez (TMK m. 771/3). Metin yalnız ödülü dışlar.

      *5. Bildirmeseydi:* Mülkiyetin kazanılması bulanın yükümlülüklerini yerine getirmesine bağlıdır (TMK m. 771/1). Ayşe bildirmeyip bileziği kullansaydı beş yıl geçse de bu yoldan malik olamazdı. Kaybedilmiş eşya üzerinde iade etmeksizin ya da yetkili mercileri haberdar etmeksizin malik gibi tasarruf eden kişi şikâyet üzerine bir yıla kadar hapis veya adlî para cezasıyla cezalandırılırdı (TCK m. 160/1).

      **Sonuç:**
      - Ayşe'nin bildirimi yeterlidir; bilezik bir yıldan fazla saklandığı için satılabilir.
      - Ayşe, malik 12.03.2020'den başlayarak beş yıl içinde çıkmazsa malik olur.
      - Malik çıkarsa Ayşe giderlerini ve uygun ödülü isteyebilir.
      - Kafede bulunsaydı işletmeciye teslim edilir, işletmeci bulan sayılır ama ödül isteyemezdi.
      - Bildirmese mülkiyeti kazanamaz, TCK m. 160 gündeme gelirdi.

  - olay: |
      Ali, komşusu Can'ın izniyle Can'ın bahçesinde ağaç dikerken toprağın altında bir kutu bulur. Kutunun içinde altın paralar ve mücevherler vardır. Ali kutuyu Can'a gösterir; ikisi de eşyanın kime ait olduğunu tartışır. Ali "Ben buldum, hepsi benim" der. Can ise "Bahçe benim, hepsi benim" der.

      Bir bilirkişi eşyayı inceler: Eşya çok uzun zaman önce gömülmüştür, malikinin artık bulunmadığı kesin olarak anlaşılmaktadır ve eşyada kültür varlığı niteliği yoktur.

      Can daha sonra "Ya eşya birkaç yıl önce gömülmüş olsaydı, ya da antik sikkeler çıksaydı?" diye sorar.

      1. Bilirkişi raporuna göre eşya kime aittir? Ali'nin bir talebi var mıdır?
      2. Eşyanın birkaç yıl önce gömüldüğü ve sahibinin araştırılabileceği anlaşılırsa hukuki durum nasıl olur?
      3. Kutudan antik dönemden kalma ve korunması gerekli sikkeler çıksaydı sonuç ne olurdu? Bildirim süresi ve ikramiye nasıldır?
    olcut:
      - {tespit: "Bilirkişi raporundaki özelliklerle eşyanın define sayılması", puan: 15, madde: "TMK m. 772"}
      - {tespit: "Define mülkiyetinin içinde bulunduğu taşınmazın maliki Can'a ait olması", puan: 20, madde: "TMK m. 772"}
      - {tespit: "Ali'nin değerin yarısını aşmamak üzere uygun ödül isteyebilmesi", puan: 15, madde: "TMK m. 772"}
      - {tespit: "Sahibi araştırılabilen eşyada define şartlarının bulunmaması; bulunmuş eşya hükümlerinin uygulanması", puan: 15, madde: "TMK m. 769"}
      - {tespit: "Antik sikkelerde TMK m. 773 gereği özel kanunun uygulanması; üç gün içinde bildirim yükümlülüğü", puan: 15, madde: "2863 sayılı Kanun m. 4"}
      - {tespit: "Korunması gerekli kültür varlığının Devlet malı olması ve Can'ın malik olmaması", puan: 10, madde: "2863 sayılı Kanun m. 5"}
      - {tespit: "Başkasının mülkünde bulunan varlıkta takdir olunacak bedelin %80'inin bulan ile mülk sahibi arasında yarı yarıya paylaştırılması", puan: 10, madde: "2863 sayılı Kanun m. 64"}
    cozum: |
      **Nitelendirme:** Olay bir hazine buluntusunun mülkiyetine ilişkindir. Önce eşyanın define mi, bulunmuş eşya mı, yoksa kültür varlığı mı olduğu belirlenmelidir; her üç ihtimalin sonucu farklıdır.

      **Hukuki sorunlar:** (1) Define koşulları ve mülkiyet, (2) bulanın ödül hakkı, (3) koşulların eksik olduğu hâlde eşyanın bulunmuş eşya sayılması, (4) kültür varlığı olduğunda özel kanunun uygulanması.

      **İlgili hükümler:** TMK m. 769, 771, 772, 773; 2863 sayılı Kanun m. 3, 4, 5, 64.

      **Değerlendirme:**

      *1. Define:* Bulunmalarından çok zaman önce gömülmüş veya saklanmış olan ve duruma göre artık malikinin bulunmadığı kesin olarak anlaşılan değerli şeyler define sayılır (TMK m. 772/1). Bilirkişi raporu bu üç unsuru (değerli olma, çok zaman önce gömülme, malikin bulunmadığının kesin olması) doğrulamaktadır. Eşyada bilimsel değer ya da kültür varlığı niteliği de yoktur. Bu durumda define, içinde bulunduğu taşınmaz veya taşınır malın malikinin olur (TMK m. 772/2). Mülkiyet bulana değil, bahçenin maliki Can'a geçer. Ali'nin "ben buldum" savı mülkiyet bakımından sonuç vermez. Ancak defineyi bulan kimse, değerinin yarısını aşmamak üzere uygun bir ödül isteyebilir (TMK m. 772/3). Ali'nin talebi mülkiyet değil ödüldür.

      *2. Birkaç yıl önce gömülmüşse:* Define için malikin artık bulunmadığının kesin olarak anlaşılması aranır (TMK m. 772/1). Sahibi araştırılabiliyorsa bu şart yoktur; eşya bulunmuş eşyadır. Ali bildirim yükümlülüğüne tabi olur: Eşya önemli ölçüde değerli olduğundan kolluk kuvvetlerine ya da muhtara bildirim her hâlde gereklidir (TMK m. 769/2). Malik bildirim tarihinden başlayarak beş yıl içinde çıkmazsa Ali yükümlülüklerini yerine getirmişse mülkiyeti kazanır (TMK m. 771/1). Burada mülkiyet define kuralıyla (TMK m. 772/2) kendiliğinden Can'a geçmez; bulunmuş eşya hükümleri uygulanır, fark budur.

      *3. Antik sikkeler:* Bilimsel değeri olan sahipsiz doğal şeyler ile eski eserlerin bulunması hâlinde özel kanun hükümleri uygulanır (TMK m. 773). Özel kanun 2863 sayılı Kanundur. Kültür varlıkları bu kanunun tanımına girer (2863 sayılı Kanun m. 3/a-1). Ali en geç üç gün içinde en yakın müze müdürlüğüne, köyde muhtara ya da diğer yerlerde mülki idare amirine bildirmek zorundadır (2863 sayılı Kanun m. 4/1). Korunması gerekli taşınır kültür varlıkları Devlet malıdır (2863 sayılı Kanun m. 5/1); Can malik olmaz. Süresinde bildirim yapılırsa varlık başkasının mülkü içinde bulunduğundan Kültür ve Turizm Bakanlığınca takdir olunacak bedelin %80'i ikramiye olarak bulan ile mülk sahibi arasında yarı yarıya paylaştırılır (2863 sayılı Kanun m. 64/b). Yani Ali ve Can'ın her birine bedelin %40'ı düşer; bu basit bir hesaptır.

      **Sonuç:**
      - Bilirkişi raporuna göre eşya define olup Can'ındır; Ali değerin yarısını aşmamak üzere uygun ödül isteyebilir.
      - Eşyanın sahibi araştırılabiliyorsa define şartları yoktur; bulunmuş eşya hükümleri ve beş yıllık süre uygulanır.
      - Antik sikkelerde 2863 sayılı Kanun uygulanır; üç gün içinde bildirim zorunludur, sikkeler Devlet malıdır, ikramiye yarı yarıya paylaşılır.

  - olay: |
      Heykeltıraş Emre, Burak'la ortak kullandığı atölyede duran mermer bloğu kendi bloğu sanarak iyiniyetle işler ve bir heykel yapar. Bloğun değeri 5.000 TL'dir. Bilirkişi Emre'nin emeğinin değerini 40.000 TL olarak belirler. Burak heykelin kendisine ait olduğunu iddia eder.

      Aynı atölyenin depo bölümünde Fatma'nın 30.000 TL değerindeki zeytinyağı ile Gül'ün 20.000 TL değerindeki zeytinyağı, depodaki bir hata yüzünden aynı tankta ayrılamaz biçimde karışır. Fatma tankın tamamının kendisine ait olduğunu söyler.

      Üçüncü olarak, Selin'in saati 2017'de çalınır. Hakan saati Mart 2018'de bir tanıdığından satın alır; çalıntı olduğunu bilmesi için bir sebep yoktur. Hakan o günden beri saati malik sıfatıyla, davasız ve aralıksız kullanır. Selin Haziran 2025'te istihkak davası açar.

      1. Heykelin mülkiyeti kime aittir? Emre bloğun Burak'a ait olduğunu bilseydi sonuç değişir miydi? Burak'ın başka bir hakkı var mıdır?
      2. Zeytinyağı tankı kime aittir?
      3. Selin'in davası kabul edilir mi? Hakan saatin çalıntı olduğunu bilseydi sonuç ne olurdu?
    olcut:
      - {tespit: "Emeğin değerinin malzemeden fazla olması nedeniyle yeni şeyin (heykelin) işleyen Emre'ye ait olması", puan: 20, madde: "TMK m. 775"}
      - {tespit: "İyiniyetsiz işleyende hâkimin yeni şeyi malike bırakabilmesi; sonucun zorunlu değil, takdire bağlı olması", puan: 10, madde: "TMK m. 775"}
      - {tespit: "Burak'ın tazminat ve sebepsiz zenginleşme istemlerinin saklı olması", puan: 10, madde: "TBK m. 77"}
      - {tespit: "Ayrılamaz karışmada tarafların paylı malik olması ve payların karışma zamanındaki değerlere göre belirlenmesi; Fatma'nın tankın tamamını isteyememesi", puan: 25, madde: "TMK m. 776"}
      - {tespit: "Hakan'ın iyiniyetli, malik sıfatıyla, davasız ve aralıksız beş yıl zilyetliği nedeniyle malik olması; davanın reddi", puan: 25, madde: "TMK m. 777"}
      - {tespit: "Kötüniyetli zilyede karşı önceki zilyedin her zaman dava açabilmesi", puan: 10, madde: "TMK m. 991"}
    cozum: |
      **Nitelendirme:** Üç ayrı taşınır mülkiyeti kazanma yolu söz konusudur: işleme, karışma ve kazandırıcı zamanaşımı. Her birinde sorun, eşyanın kime ait olduğudur.

      **Hukuki sorunlar:** (1) İşleme sonucu yeni şeyin maliki, (2) ayrılamaz karışmada mülkiyet biçimi ve pay oranı, (3) çalıntı saatte zamanaşımı ile mülkiyet kazanımı.

      **İlgili hükümler:** TMK m. 775, 776, 777, 3, 974, 991; TBK m. 77, 49.

      **Değerlendirme:**

      *1. İşleme:* Bir kimse başkasına ait bir şeyi işler veya başka bir şekle sokarsa, emeğin değerinin o şeyin değerinden fazla olması hâlinde yeni şey işleyenin, aksi hâlde malikin olur (TMK m. 775/1). Emre mermeri işlemiş ve yeni bir şey (heykel) ortaya çıkarmıştır. Emeğin değeri 40.000 TL, malzemenin değeri 5.000 TL olduğundan emeğin değeri fazladır; heykel Emre'nindir. Emre bloğun Burak'a ait olduğunu bilseydi iyiniyetli olmayan işleyen konumunda olurdu. Bu hâlde, emeğin değeri daha fazla olsa bile hâkim yeni şeyi malike bırakabilirdi (TMK m. 775/2). Dikkat: Kanun "bırakabilir" der; heykelin zorunlu olarak Burak'a geçeceği söylenemez. Burak mülkiyeti kaybetse de tazminat ve sebepsiz zenginleşmeden doğan istem hakları saklıdır (TMK m. 775/3); sebepsiz zenginleşme için TBK m. 77/1, tazminat için TBK m. 49/1 gündeme gelir.

      *2. Karışma:* Birden çok kişinin taşınır malları önemli bir zarara uğratılmadan veya aşırı emek ve para harcanmadan ayrılmayacak şekilde karışmışsa, bu kişiler yeni şey üzerinde kendi taşınırlarının karışma zamanındaki değerleri oranında paylı mülkiyete sahip olur (TMK m. 776/1). Zeytinyağları tankta ayrılamaz biçimde karışmıştır. Fatma tankın tamamının kendisine ait olduğunu söyleyemez; Fatma ve Gül paylı maliktir. Payların oranı karışma zamanındaki değerlere göredir: 30.000 TL ve 20.000 TL değerleri oranında, yani 3/5 ve 2/5 (bu oran basit bir hesaptır). Tazminat ve sebepsiz zenginleşme istemleri ayrıca saklıdır (TMK m. 776/3).

      *3. Kazandırıcı zamanaşımı:* Başkasının taşınır malını davasız ve aralıksız beş yıl iyiniyetle ve malik sıfatıyla zilyetliğinde bulunduran kimse zamanaşımı yoluyla malik olur (TMK m. 777/1). Hakan saati satın aldığı için malik sıfatıyla zilyettir (TMK m. 974/2); çalıntı olduğunu bilmesi için bir sebep olmadığından iyiniyetlidir ve iyiniyetin varlığı asıldır (TMK m. 3). Mart 2018'den Haziran 2025'e kadar yedi yılı aşkın süre davasız ve aralıksız zilyetlik vardır; beş yıllık süre dolmuştur. Hakan malik olmuştur; Selin'in istihkak davası reddedilir. Burada çalınan eşyada dava hakkının süresi ile TMK m. 777'nin ilişkisi doktrinde tartışmalıdır; ancak olayın tarihleri hangi başlangıç alınırsa alınsın beş yılın dolduğunu göstermektedir. Hakan saatin çalıntı olduğunu bilseydi iyiniyet şartı olmayacak, TMK m. 777 işlemeyecekti. İyiniyetle edinmemiş kimseye karşı önceki zilyet her zaman taşınır davası açabilir (TMK m. 991/1); Selin'in davası kabul edilirdi.

      **Sonuç:**
      - Heykel Emre'nindir. Emre kötüniyetli olsaydı hâkim heykeli Burak'a bırakabilirdi. Burak'ın tazminat ve sebepsiz zenginleşme istemleri saklıdır.
      - Tank Fatma ve Gül'ün paylı mülkiyetindedir; pay oranı değerlerine göredir.
      - Hakan TMK m. 777/1 gereği malik olmuştur, Selin'in davası reddedilir. Hakan saatin çalıntı olduğunu bilseydi Selin dava açabilir ve davası kabul edilirdi.

kartlar:
  - on: "Sahiplenmenin unsurları nelerdir? (TMK m. 767)"
    arka: "Sahipsiz bir taşınır ve onu malik olmak iradesiyle zilyetliğe geçirme. Bu iki unsur varsa zilyet malik olur."
  - on: "Terk ile kayıp arasındaki fark?"
    arka: "Terk edilen taşınır sahipsiz olur, TMK m. 767 ile sahiplenilebilir. Kaybedilen eşya sahipsiz değildir; bulan TMK m. 769-771'e tabidir (TMK m. 778)."
  - on: "Av hayvanı hangi hâlde sahipsiz olur?"
    arka: "Yeniden serbest kalır ve sahibi onu gecikmeksizin ve ara vermeksizin aramaz ve tekrar tutmak için uğraşmazsa (TMK m. 768/1)."
  - on: "Arı oğulunda iki ayrı kural?"
    arka: "Başkasının taşınmazına uçan oğul sahipsiz olmaz (TMK m. 768/3). Başkasının kovanına göçen oğul bedelsiz kovan malikinin olur (TMK m. 774/2)."
  - on: "TMK'nın bulunmuş eşya başlığı?"
    arka: "Kanun başlığı 'Bulunmuş eşya'dır. 'Buluntu' TMK metninde geçmeyen, öğretide kullanılan terimdir."
  - on: "Bulanın bildirim yükümlülüğü? (TMK m. 769/1)"
    arka: "Sahibine, bilmiyorsa kolluğa (köylerde muhtara) bildirmek VEYA araştırma yapmak ve gerektiğinde ilân etmek. Seçimlik yoldur."
  - on: "Önemli ölçüde değerli şey bulunursa?"
    arka: "Kolluk kuvvetlerine ya da muhtara bildirim her hâlde gereklidir (TMK m. 769/2)."
  - on: "Ev, işyeri ya da kamu hizmeti yerinde bulunan şey?"
    arka: "Yer sahibine, kiracıya veya görevlilere teslim edilir (TMK m. 769/3). Yer sahibi, kiracı veya kurum bulan sayılır ama ödül isteyemez (TMK m. 771/3)."
  - on: "Bulunan şey hangi hâllerde satılabilir?"
    arka: "Aşırı gider, çabuk bozulma ya da kolluk/kamu kurumunca bir yıldan fazla saklanma. Satış bedeli şeyin yerine geçer (TMK m. 770/2-3)."
  - on: "Bulan ne zaman malik olur? (TMK m. 771/1)"
    arka: "Malik, ilân veya bildirim tarihinden başlayarak beş yıl içinde çıkmazsa, bulan yükümlülüklerini yerine getirmişse malik olur."
  - on: "Beş yıl hangi tarihten işler?"
    arka: "İlân veya kolluğa/muhtara bildirme tarihinden; buluş gününden değil (TMK m. 771/1)."
  - on: "Eşya malikine verilirse bulanın hakkı?"
    arka: "Giderlerin ödenmesini ve uygun bir ödül istemek (TMK m. 771/2). Ödül oranı kanunda yazılı değildir."
  - on: "Define nedir? (TMK m. 772/1)"
    arka: "Bulunmalarından çok zaman önce gömülmüş ya da saklanmış, malikinin artık bulunmadığı kesin olarak anlaşılan değerli şeylerdir."
  - on: "Define kimin olur, bulan ne ister?"
    arka: "İçinde bulunduğu taşınmaz ya da taşınır malın malikinin olur (TMK m. 772/2). Bulan değerin yarısını aşmamak üzere uygun ödül isteyebilir (TMK m. 772/3)."
  - on: "Eski eser ve bilimsel değerli şeyde hangi kanun uygulanır?"
    arka: "TMK m. 773 gereği özel kanun, yani 2863 sayılı Kanun. Bildirim en geç üç gün içinde (2863 sayılı Kanun m. 4/1); korunması gerekli varlıklar Devlet malı (2863 sayılı Kanun m. 5/1)."
  - on: "Başkasının mülkünde bulunan kültür varlığında ikramiye?"
    arka: "Takdir olunacak bedelin %80'i bulan ile mülk sahibi arasında yarı yarıya paylaştırılır. Devlet arazisinde bedelin %40'ı bulana verilir (2863 sayılı Kanun m. 64/b-c)."
  - on: "Doğal güçlerle egemenlik alanına giren taşınır? (TMK m. 774/1)"
    arka: "O alanın sahibi, kaybolan eşyayı bulanın haklarına sahip ve yükümlülüklerine tabi olur."
  - on: "İşlemede yeni şey kimin olur? (TMK m. 775/1)"
    arka: "Emeğin değeri şeyin değerinden fazlaysa işleyenin, aksi hâlde (eşitlik dahil) malikin olur."
  - on: "İyiniyetsiz işleyende hâkimin yetkisi?"
    arka: "Emeğin değeri daha fazla olsa bile hâkim yeni şeyi malike bırakabilir (TMK m. 775/2). 'Bırakabilir'; zorunlu değildir."
  - on: "Karışmada paylı mülkiyet oranı neye göre?"
    arka: "Ayrılamayacak biçimde karışan taşınırların malikleri, karışma zamanındaki değerleri oranında paylı malik olur. Miktara değil değere bakılır (TMK m. 776/1)."
  - on: "İkincil bütünleyici parça olacak şekilde birleşme?"
    arka: "Eşyanın tamamı ana parçanın malikine ait olur; paylı mülkiyet doğmaz (TMK m. 776/2)."
  - on: "İşleme ve karışmada saklı haklar?"
    arka: "Tazminat ve sebepsiz zenginleşmeden doğan istem hakları saklıdır (TMK m. 775/3 ve TMK m. 776/3)."
  - on: "Taşınırda kazandırıcı zamanaşımı şartları? (TMK m. 777/1)"
    arka: "Başkasının taşınırı; davasız ve aralıksız beş yıl; iyiniyet; malik sıfatıyla zilyetlik. Olağan/olağanüstü ayrımı yoktur."
  - on: "Zilyetliğin irade dışı kaybında zamanaşımı?"
    arka: "Zilyet bir yıl içinde eşyayı ele geçirir veya dava yoluyla yeniden elde ederse zamanaşımı kesilmiş olmaz (TMK m. 777/2)."
  - on: "Taşınır istihkak davası zamanaşımına uğrar mı?"
    arka: "Hayır. Malikin hakkını başkasının kazanması (TMK m. 777) ya da terk (TMK m. 778) sona erdirir."
