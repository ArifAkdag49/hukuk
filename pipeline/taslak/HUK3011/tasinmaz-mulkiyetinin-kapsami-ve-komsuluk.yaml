  - id: "1183073000"
    ozet: |
      Davacılar, konut nitelikli bağımsız bölümlerin maliki; davalı ise komşu parselde bitişik nizam inşaat başlatan maliktir. Davacılar, inşaat yüzünden zemin ve birinci kattaki pencerelerin açılamadığını, ışık ve havanın engellendiğini, küf ve rutubet oluştuğunu, pansiyon olarak kiralanan bölümlerin bir yaz sezonu kiraya verilemediğini ve değer kaybı doğduğunu ileri sürerek tazminat ve yapının katlanılabilir duruma getirilmesini istemiştir. Davalı, imar planı, proje ve ruhsata uygun yaptığını savunmuştur. İlk derece mahkemesi parapet duvarın alçaltılmasına ve paravan yapılmasına, ayrıca maddi tazminatın kısmen kabulüne karar vermiş; bölge adliye mahkemesi iki tarafın istinaf başvurusunu esastan reddetmiştir. Yargıtay davacıların temyizini reddetmiş, davalının temyizini kabul ederek bölge adliye mahkemesi kararını kaldırmış ve ilk derece kararını bozmuştur. Gerekçesine göre komşuluk hukuku ilkeleri çerçevesinde aykırılığın giderilmesine hükmedildiğinden ayrıca değer kaybına hüküm kurulması doğru değildir; gelir kaybı da belgeyle ispatlanamamıştır. Konuya katkısı: Hâkim hoşgörü sınırının aşılıp aşılmadığını olayın özelliklerine göre saptar ve zararı gideren en uygun önlemi seçer. Aykırılığın önlemle giderilmesine hükmedilmişse ayrıca değer kaybı verilmez; kazanç kaybı ise ispat gerektirir.
  - id: "1109364500"
    ozet: |
      Davalı, otelinin üzerine ruhsatsız iki kat eklemiştir. Başka bir parseldeki bağımsız bölümün maliki olan davacı, boğaz manzarasının ve ferahlığın kaybolduğunu, değer kaybı doğduğunu ileri sürerek katların yıkılmasını, klima ünitelerinin kaldırılmasını ve tazminat ödenmesini istemiştir. Davalı, istinaf aşamasında aradaki mesafeyi ve çevredeki binaları öne sürmüş, manzaranın bulunmadığını savunmuştur. İlk derece mahkemesi el atmanın önlenmesine ve kâle karar vermiş, tazminat istemlerini reddetmiştir. Bölge adliye mahkemesi ise yapının yalnız ruhsatsız ya da imara aykırı olmasının yetmediğini, salt imara aykırılığın idari mercilerin konusu olduğunu belirterek davayı reddetmiştir. Yargıtay bu karara bozma kararı vermiştir. Taşınmazlar arasındaki mesafenin, çevre binaların ve davacının taşınmazından görülen manzaranın değerlendirilerek ruhsatsız katların ve klima ünitelerinin tahammül ve hoşgörü sınırını aşıp aşmadığının keşif sonrası uzman bilirkişilerden alınacak ek raporla belirlenmesi gerekir. Konuya katkısı: Komşuluk davasında belirleyici olan yapının imara aykırı olması değil, komşu üzerindeki etkisinin hoşgörü sınırını aşıp aşmadığıdır; manzara ve ferahlık kaybı TMK m. 737 kapsamında incelenebilir.
  - id: "1221183300"
    ozet: |
      Davacı, mazbut bir vakıf adına kayıtlı parsele komşu parselde yapılan kazı çalışmaları sırasında camiye zarar verildiğini ileri sürerek, aralarında bir limited şirketin de bulunduğu birden çok davalıdan tazminat istemiştir. İlk derece mahkemesi, davanın komşuluk hukukundan doğan zararın tazminine ilişkin olduğunu ve HUAK m. 18/B/1-ç uyarınca komşu hakkı uyuşmazlıklarında 1 Eylül 2023'ten itibaren arabulucuya başvurmanın dava şartı olduğunu belirtmiş, HUAK m. 18/A/2'nin son cümlesi gereği davayı usulden reddetmiştir. Bölge adliye mahkemesi istinaf başvurusunu esastan reddetmiştir. Temyizde davacı, bazı davalıların komşu sayılamayacak tüzel kişiler olduğunu ve sorumluluklarının farklı kaynaklı olduğunu ileri sürmüş; Yargıtay temyiz sebeplerini bozma nedeni görmeyerek kararı oybirliğiyle onamıştır. Konuya katkısı: Komşu taşınmazdaki kazıdan doğan zararın tazmini istemi komşu hakkından kaynaklanan uyuşmazlık sayılır; 1 Eylül 2023'ten sonra arabulucuya başvurmadan açılan dava usulden reddedilir.

sorular:
  - soru: |
      Burak'ın evinin bulunduğu arsanın 3.000 metre üzerinden yolcu uçakları geçmektedir. Burak, arazi maliki olduğunu belirterek uçuşların durdurulmasını ister. TMK m. 718/1'e göre hangisi doğrudur?
    siklar:
      - "Arazi mülkiyeti hava sahasının sınırsız yüksekliğini kapsadığından Burak uçuşları durdurabilir."
      - "Hava katmanları hiçbir hâlde arazi mülkiyetine dâhil olmadığından Burak'ın isteği baştan haksızdır."
      - "Mülkiyet, kullanılmasında yarar olduğu ölçüde hava katmanını kapsar; Burak'ın bu yükseklikte yararı bulunmadığından isteği yerinde değildir."
      - "Burak ancak uçuşun kendisine zarar verdiğini ispatlarsa bu hava katmanına malik sayılır."
    dogru: 2
    aciklama: |
      TMK m. 718/1'e göre arazi mülkiyeti, kullanılmasında yarar olduğu ölçüde üstündeki hava ve altındaki arz katmanlarını kapsar. Ölçü malikin yararıdır; mülkiyet sınırsız yüksekliğe uzanmaz. Ama hava katmanları da tümüyle kapsam dışı değildir: Kanun hava katmanlarını yarar ölçüsünde mülkiyete dâhil eder. 3.000 metrede Burak'ın kullanma yararı yoktur.

  - soru: |
      Selin, arsasında açtırdığı kuyudan çıkan yeraltı suyunun, arsanın maliki olması nedeniyle kendisine ait olduğunu söylemektedir. Hangisi doğrudur?
    siklar:
      - "Yeraltı suları arazinin bütünleyici parçası olduğundan Selin'in mülkiyetindedir."
      - "Yeraltı suları kamu yararına ait sulardandır; arza malik olmak altındaki yeraltı sularına malik olmak sonucunu doğurmaz."
      - "Selin suyu kendi çıkardığı için yeraltı suyuna da malik olur."
      - "Yeraltı suyuna malik olunabilmesi için arsanın tapuda su hakkı kaydı taşıması gerekir."
    dogru: 1
    aciklama: |
      TMK m. 756/3'e göre yeraltı suları kamu yararına ait sulardandır ve arza malik olmak, altındaki yeraltı sularına da malik olmak sonucunu doğurmaz. Yanılgı, kaynağı (TMK m. 756/1: arazinin bütünleyici parçası) yeraltı suyuyla karıştırmaktır. Yararlanma biçimi ve ölçüsüne ilişkin özel kanun hükümleri saklıdır (TMK m. 756/4). Aynı mantık tabii servetler için de geçerlidir: AY m. 168 uyarınca bunlar Devletin hüküm ve tasarrufu altındadır, TMK m. 718/2'deki "yasal sınırlamalar" budur.

  - soru: |
      Tapu planındaki sınır ile arazideki sınır işaretleri birbirini tutmamaktadır. Yetkili makamlarca heyelan bölgesi olduğu belirlenmiş bir yörede değil, sıradan bir yörede bulunan taşınmazın sınırı hangisine göre belirlenir?
    siklar:
      - "Arazideki işaretlere göre, çünkü fiilî durum tescilden üstündür."
      - "Plan ile işaretin tam ortasından geçen hatta göre."
      - "Zilyetliğin fiilen sürdüğü hatta göre."
      - "Tapu planındaki sınıra göre."
    dogru: 3
    aciklama: |
      TMK m. 719/2'ye göre tapu planları ile arz üzerindeki işaretler birbirini tutmazsa asıl olan plandaki sınırdır. Bu kural yetkili makamlarca heyelan bölgesi olduğu belirlenen yörelerde uygulanmaz; soruda taşınmaz böyle bir yörede olmadığından kural işler. Yaygın yanılgı, arazideki kazık ya da çiti esas almaktır.

  - soru: |
      Hasan ile Fatma'nın bitişik tarlalarının sınırı arazide belirsizdir. Hasan sınır işaretleri konulmasını ister; Fatma "tapuda yazıyor, bana ne" diyerek ilgilenmez. Hangisi doğrudur?
    siklar:
      - "Sınır tapuda yazılı olduğundan Fatma'nın katkıda bulunma yükümlülüğü yoktur."
      - "Fatma, ancak Hasan mahkemeden karar almışsa katkıda bulunmak zorundadır."
      - "Fatma, komşusunun istemi üzerine belli olmayan sınırların belirlenmesine katkıda bulunmakla yükümlüdür."
      - "Yükümlülük yalnız iki parsel aynı malikin eski parselinden ayrılmışsa doğar."
    dogru: 2
    aciklama: |
      TMK m. 720'ye göre her arazi maliki, komşusunun istemi üzerine belli olmayan sınırların belirlenmesi için tapu planlarının düzeltilmesine veya arz üzerine sınır işaretleri konulmasına katkıda bulunmakla yükümlüdür. Yükümlülüğün doğması için mahkeme kararı ya da parsellerin ortak kökeni aranmaz.

  - soru: |
      İki komşu parselin arasındaki eski taş duvarın kime ait olduğu tapu kayıtlarından anlaşılmamaktadır ve taraflardan hiçbiri mülkiyeti ispat edememektedir. Hangisi doğrudur?
    siklar:
      - "Duvar, daha eski tarihli tapuya sahip komşunun malıdır."
      - "Duvar, aksi ispat edilmedikçe iki komşunun paylı malı sayılır."
      - "Duvar sahipsizdir ve Hazine adına tescil edilir."
      - "Duvar, iç yüzü görünen taraftaki komşunun malıdır."
    dogru: 1
    aciklama: |
      TMK m. 721'e göre iki taşınmazı birbirinden ayırmaya yarayan duvar, parmaklık, çit gibi sınırlıklar, aksi ispat edilmedikçe her iki komşunun paylı malı sayılır. Bu çürütülebilir bir karinedir; hiçbir taraf aksini ispat edemediği için karine geçerlidir.

  - soru: |
      Hasan, tarlasını tamamen kendi parseli içinde kalacak biçimde telle çevirtir ve giderin yarısı olan 12.000 TL'yi komşusu Fatma'dan ister. Paylı sınırlık iddiası yoktur. Hangisi doğrudur?
    siklar:
      - "Her arazi maliki kendi taşınmazının sınırının çevrilmesi için yapılan giderleri karşılar; Hasan'ın isteği kural olarak yerinde değildir."
      - "Fatma, komşuluk gereği her çit giderinin yarısını karşılamak zorundadır."
      - "Fatma, çit nedeniyle komşunun taşınmazının değeri artacağı için giderin tamamını öder."
      - "Çit gideri, çiti ilk yaptıran tarafından bütün komşulara eşit olarak bölüştürülür."
    dogru: 0
    aciklama: |
      TMK m. 749/1'e göre paylı mülkiyete ilişkin hükümler saklı kalmak üzere her arazi maliki, taşınmazının sınırının çit veya duvar gibi sınırlıklarla çevrilmesi için yapılan giderleri karşılar. Tel çit tamamen Hasan'ın parseli içindedir; gideri kural olarak Hasan'a aittir.

  - soru: |
      TMK m. 731'e göre hangisi doğrudur?
    siklar:
      - "Kanundan doğan kısıtlamalar, tapu siciline tescil edilmedikçe üçüncü kişilere karşı etkili olmaz."
      - "Kamu yararı için konulan kısıtlamalar, adi yazılı sözleşmeyle kaldırılabilir."
      - "Taşınmaz mülkiyetinin kanundan doğan kısıtlamaları, tapu siciline tescil edilmeksizin etkili olur."
      - "Kanuni kısıtlamanın kaldırılması için yalnız tapu kütüğüne şerh verilmesi yeterlidir."
    dogru: 2
    aciklama: |
      TMK m. 731/1'e göre taşınmaz mülkiyetinin kanundan doğan kısıtlamaları tapu siciline tescil edilmeksizin etkili olur. Kısıtlamaların kaldırılması veya değiştirilmesi, sözleşmenin resmî şekilde düzenlenmesine ve tapu kütüğüne şerh verilmesine bağlıdır (TMK m. 731/2); yalnız şerh yetmez. Kamu yararı için konulan kısıtlamalar ise kaldırılamaz ve değiştirilemez (TMK m. 731/3).

  - soru: |
      Mehmet, komşusu Elif'in evinin yanındaki taşınmazında mevzuatın yasakladığı biçimde yanıcı madde depolamaktadır. Henüz yangın çıkmamıştır, ama Elif'in evi ciddi bir tehlike altındadır. Hangisi doğrudur?
    siklar:
      - "Elif, zarar doğmasını beklemeden TMK m. 730/1'e göre tehlikenin giderilmesini dava edebilir."
      - "Elif, yangın çıkıp zarar doğmadıkça dava açamaz."
      - "Elif yalnız TBK m. 49'a dayanabilir ve Mehmet'in kusurunu ispatlamak zorundadır."
      - "Elif'in dava açabilmesi için Mehmet'in ayrıca kötüniyetli olması gerekir."
    dogru: 0
    aciklama: |
      TMK m. 730/1, mülkiyet hakkının yasal kısıtlamalara aykırı kullanılması sonucunda zarar gören veya zarar tehlikesi ile karşılaşan kimseye durumun eski hâline getirilmesini, tehlikenin ve zararın giderilmesini dava etme hakkı verir. Zararın doğması şart değildir. TMK m. 730'da kusur ve kötüniyet de aranmaz.

  - soru: |
      Bir köyde, yerel âdete uygun olarak ve kaçınılması mümkün olmayan biçimde her yıl yapılan harman işi sırasında yayılan toz, komşu Zeynep'in bahçesindeki ürüne zarar vermiştir. TMK m. 730/2'ye göre hangisi doğrudur?
    siklar:
      - "Hâkim, taşkınlık ne olursa olsun eski hâle getirmeye karar vermek zorundadır."
      - "Yerel âdete uygun olduğundan Zeynep hiçbir surette zararının karşılanmasını isteyemez."
      - "Hâkim, ancak malik kusurluysa denkleştirmeye karar verebilir."
      - "Hâkim, yerel âdete uygun ve kaçınılmaz taşkınlıktan doğan zararın uygun bir bedelle denkleştirilmesine karar verebilir."
    dogru: 3
    aciklama: |
      TMK m. 730/2'ye göre hâkim, yerel âdete uygun ve kaçınılmaz taşkınlıklardan doğan zararların uygun bir bedelle denkleştirilmesine karar verebilir. Aynı ilke TMK m. 737/3'te de saklı tutulmuştur. Kural yasak değil, katlanma ve bedel dengesidir; kusur aranmaz.

  - soru: |
      TMK m. 737/2'ye göre komşuya karşı yasak olan rahatsızlığın ölçütü hangisidir?
    siklar:
      - "Komşunun kişisel duyarlılığına göre rahatsızlık duymuş olması."
      - "Taşınmazın durumuna, niteliğine ve yerel âdete göre komşular arasında hoş görülebilecek dereceyi aşması."
      - "Rahatsızlığı çıkaran kişinin kusurlu olması."
      - "Rahatsızlığın komşuda maddi bir zarar doğurmuş olması."
    dogru: 1
    aciklama: |
      TMK m. 737/2, taşınmazın durumuna, niteliğine ve yerel âdete göre komşular arasında hoş görülebilecek dereceyi aşan duman, buğu, kurum, toz, koku, gürültü ve sarsıntıyı yasaklar. Kusur ölçüt değildir; zarar doğması da yasağın şartı değildir.

  - soru: |
      TMK m. 730 ile TBK m. 49 arasındaki ilişkiye dair hangisi doğrudur?
    siklar:
      - "İkisi de aynı şartlara tabi olup yalnız dava yolları farklıdır."
      - "TMK m. 730'da kusur aranır, TBK m. 49'da aranmaz."
      - "TMK m. 730'da kusur aranmaz; ölçü, mülkiyet hakkının yasal kısıtlamalara aykırı kullanılmasıdır. TBK m. 49 ise kusurlu ve hukuka aykırı fiil arar."
      - "TMK m. 730 yalnız tazminat davası açılmasına imkân verir."
    dogru: 2
    aciklama: |
      TMK m. 730/1 şart olarak mülkiyet hakkının yasal kısıtlamalara aykırı kullanılmasını arar; kusur şartı yoktur. TBK m. 49 ise kusurlu ve hukuka aykırı fiil şartını koyar. TMK m. 730 yalnız tazminat değil, eski hâle getirme ve tehlikenin giderilmesini de dava imkânı verir.

  - soru: |
      Duman, buğu, kurum, toz, koku, gürültü ve sarsıntıyı sayan TMK m. 737/2 hükmündeki sayım hakkında hangisi doğrudur?
    siklar:
      - "Sayım örnekleyicidir; hüküm bunları 'özellikle' sayar."
      - "Sayım sınırlıdır; sayılmayan hiçbir etki TMK m. 737 kapsamında incelenemez."
      - "Sayım yalnız işletme faaliyetini sürdüren taşınmaz malikleri için geçerlidir."
      - "Sayım yalnız gürültü ve kokuyu kapsar."
    dogru: 0
    aciklama: |
      TMK m. 737/2 sayıma "özellikle" sözcüğüyle başlar; bu nedenle sayım örnekleyicidir. TMK m. 737/1 ise "herkes"e hitap eder ve yalnız işletme faaliyetini değil, taşınmaz mülkiyetinden doğan yetkilerin her türlü kullanımını kapsar.

  - soru: |
      Davalı, otelinin üzerine ruhsatsız iki kat eklemiştir. Başka bir parseldeki bağımsız bölümün maliki olan davacı, manzara kaybı ve değer kaybı ileri sürmektedir. Davalı, ruhsat sorununun yalnız idareyi ilgilendirdiğini savunmaktadır. Yargıtay uygulamasına göre mahkeme ne yapmalıdır?
    siklar:
      - "Ruhsatsız yapı kendiliğinden TMK m. 737'ye aykırı olduğundan doğrudan yıkıma karar vermelidir."
      - "Ruhsatsızlık idari konu olduğundan hiçbir araştırma yapmadan davayı reddetmelidir."
      - "Yapının komşuya etkisine bakmaksızın tazminata hükmetmelidir."
      - "Yapının etkisinin tahammül ve hoşgörü sınırını aşıp aşmadığını, gerekirse keşif ve uzman bilirkişi ile somut olarak belirlemelidir."
    dogru: 3
    aciklama: |
      Yargıtay'a göre komşuluk davasında belirleyici olan yapının imara aykırı olması değil, komşu üzerindeki etkisinin hoşgörü sınırını aşıp aşmadığıdır; bu keşif ve uzman bilirkişi ile somut olarak saptanır. Salt imara aykırılık tek başına yıkım için yetmez, ama davanın baştan reddi için de gerekçe olmaz. Manzara ve ferahlık kaybı da TMK m. 737 kapsamında incelenebilir.

  - soru: |
      Komşu parseldeki büyük bir reklam tabelası davacının manzarasını, ışığını ve güneşini kapatmakta ve hoşgörü sınırını aşmaktadır. Davacı tabelanın kaldırılmasını istemektedir. Yargıtay uygulamasına göre hangisi doğrudur?
    siklar:
      - "Aykırılık saptanınca yapının tamamen yıkılması zorunludur."
      - "Hâkim, aykırılığı gidermeye yeten en uygun ölçülü önlemi seçebilir; kâl her zaman tam söküm anlamına gelmez."
      - "Komşuluk hukukunda kâl istenemez, yalnız tazminat verilebilir."
      - "Önlemi her durumda davalı seçer; hâkim ölçülü önlem belirleyemez."
    dogru: 1
    aciklama: |
      Yargıtay'a göre hâkim, somut olayın özelliklerini gözeterek aykırılığı giderecek en uygun önlemi seçer. Komşuluk uyuşmazlıklarında tabelanın küçültülmesi, parapet duvarın alçaltılması ve paravan yapılması gibi ölçülü çözümler uygulanmıştır. Bu yüzden kâl her zaman tam yıkım ya da söküm değildir. Aykırılık önlemle giderilmişse ayrıca değer kaybı tazminatı da verilmez.

  - soru: |
      Ayşe, komşusu Ali aleyhine taşkın kullanım nedeniyle 12 Ağustos 2023'te asliye hukuk mahkemesinde dava açmıştır; dava 1 Eylül 2023 tarihinde de ilk derece mahkemesinde görülmektedir. Ali, arabulucuya başvurulmadığı için davanın usulden reddini istemektedir. Hangisi doğrudur?
    siklar:
      - "Dava usulden reddedilmelidir, çünkü komşu hakkı uyuşmazlıklarında arabuluculuk her dava için dava şartıdır."
      - "Mahkeme davacıya kesin süre verir; arabulucuya başvurmazsa davayı usulden reddeder."
      - "HUAK'ın geçici 3. maddesi uyarınca 18/B'nin dava şartı hükümleri, yürürlük tarihinde ilk derecede görülmekte olan bu davaya uygulanmaz."
      - "Dava esastan reddedilmelidir, çünkü arabulucuya başvurmamak hakkı sona erdirir."
    dogru: 2
    aciklama: |
      HUAK m. 18/B/1-ç komşu hakkından kaynaklanan uyuşmazlıklarda arabuluculuğu dava şartı yapar; ancak HUAK'ın geçici 3. maddesine göre bu hükümler, yürürlüğe girdiği tarih itibarıyla ilk derece mahkemeleri, bölge adliye mahkemeleri ve Yargıtayda görülmekte olan davalara uygulanmaz. Dava şartı yokluğunda ise zaten kesin süre verilmeden, herhangi bir işlem yapılmaksızın usulden ret kararı verilir (HUAK m. 18/A/2); ret esastan olmaz.

  - soru: |
      Hasan ve Fatma'nın tarlalarını sulayan ortak kanalın temizliği 10.000 TL tutmuştur. Kanalın sulama yararının %70'ini Hasan'ın, %30'unu Fatma'nın tarlası sağlamaktadır. Hasan, giderin yarısını Fatma'dan istemektedir. TMK m. 750'ye göre hangisi doğrudur?
    siklar:
      - "Her malik gerekli işlerin giderlerine kendi yararlanması oranında katılır; Fatma yarı yarıya katılmak zorunda değildir."
      - "Giderler yarı yarıya paylaşılır, çünkü komşuluk ilişkisinde yararlanma oranı aranmaz."
      - "Giderin tamamını kanalı temizleten Hasan öder."
      - "Giderin tamamını daha az yararlanan Fatma öder, çünkü kanal onun sınırındadır."
    dogru: 0
    aciklama: |
      TMK m. 750'ye göre her taşınmaz maliki, komşuluk hukukundan doğan yetkilerin kullanılması için gerekli işlere ve giderlere kendi yararlanması oranında katılır. Katılma eşit değil orantılıdır; olayda Fatma %30'luk payına katılır.

  - soru: |
      Emre, yetkili makamların bitki örtüsünü korumak amacıyla yasaklamadığı özel bir ormana girip yerel âdetin izin verdiği ölçüde mantar toplamıştır. Ahmet ise aynı ormanda sahibinin izni olmadan avlanmak istemektedir. TMK m. 751'e göre hangisi doğrudur?
    siklar:
      - "Emre'nin mantar toplaması serbesttir; Ahmet'in avlanmak için girmesi ise özel kanun hükümlerine tabidir."
      - "İkisi de serbesttir, çünkü orman ve meraya herkes girebilir."
      - "İkisi de yasaktır, çünkü başkasının ormanına izinsiz girilemez."
      - "Emre'nin toplaması yasaktır; Ahmet'in avlanması yabani ürün toplamaktan daha geniş yetki verdiği için serbesttir."
    dogru: 0
    aciklama: |
      TMK m. 751/1'e göre yetkili makamlarca yasaklanmadıkça herkes başkasının orman ve merasına girebilir ve yerel âdetlerin izin verdiği ölçüde yabani meyve, mantar ve benzeri şeyleri toplayabilir. Avlanmak ve balık tutmak için başkasının arazisine girme ise özel kanun hükümlerine tabidir (TMK m. 751/2).

  - soru: |
      Selde Mehmet'in bal kovanları, Zeynep'in arazisine sürüklenmiştir. Zeynep, girişe izin vermeyeceğini ve kovanları da bedel ödenmeden vermeyeceğini söylemektedir. TMK m. 752'ye göre hangisi doğrudur?
    siklar:
      - "Zeynep hem girişi engelleyebilir hem de kovanları hapsedebilir."
      - "Zeynep izin vermek zorundadır ve zararı için hiçbir istemde bulunamaz."
      - "Kovanlar sahipsiz sayıldığından Zeynep'in malı olur."
      - "Zeynep aranıp alınmasına izin vermek zorundadır; ancak uğradığı zararın denkleştirilmesini isteyebilir ve bedel ödenene kadar kovanları hapsedebilir."
    dogru: 3
    aciklama: |
      TMK m. 752/1'e göre doğal güçlerle sürüklenen şeylerin hak sahipleri tarafından aranıp alınmasına arazi maliki izin vermek zorundadır. Malik bu yüzden uğradığı zararın denkleştirilmesini isteyebilir ve denkleştirme bedeli ödeninceye kadar o şeyleri hapsedebilir (TMK m. 752/2). Hapis hakkı girişi engelleme yetkisi vermez.

  - soru: |
      Zeynep'in komşusunun ahırı yanmaktadır. Hayvanları kurtarmak isteyenler, başka yoldan zamanında ulaşılamadığı için Zeynep'in 8.000 TL değerindeki çitini keserek geçerler. Ahırdaki hayvanların değeri 600.000 TL'dir. TMK m. 753'e göre hangisi doğrudur?
    siklar:
      - "Önlenen zarar müdahale zararından önemli ölçüde büyük olduğundan Zeynep katlanmak zorundadır; hakkaniyete uygun denkleştirme bedeli isteyebilir."
      - "Zeynep her koşulda müdahaleyi engelleyebilir; zorunluluk hâli taşınmaz maliki karşısında geçerli değildir."
      - "Zeynep katlanmak zorundadır ve çit için hiçbir bedel isteyemez."
      - "Zeynep ancak müdahale edenler kusurluysa katlanmak zorundadır."
    dogru: 0
    aciklama: |
      TMK m. 753/1'e göre bir zarar ya da tehlike ancak başkasının taşınmazına müdahale ile önlenebiliyor ve bu zarar ya da tehlike müdahaleden doğacak zarardan önemli ölçüde büyükse malik buna katlanmak zorundadır. Burada 600.000 TL'lik zarar, 8.000 TL'lik çit zararından önemli ölçüde büyüktür. Malik bu yüzden uğradığı zarar için hakkaniyete uygun bir denkleştirme bedeli isteyebilir (TMK m. 753/2).

  - soru: |
      Mehmet, komşu parselde yapılan kazı çalışmaları sırasında evine zarar verildiğini ileri sürerek 2025'te doğrudan asliye hukuk mahkemesinde tazminat davası açmıştır; arabulucuya başvurmamıştır. Mahkeme ne yapar?
    siklar:
      - "Davayı esastan reddeder."
      - "Davacıya arabulucuya başvurması için kesin süre verir."
      - "Davayı usulden reddeder, çünkü komşu hakkından kaynaklanan uyuşmazlıkta arabulucuya başvurmak dava şartıdır."
      - "Davayı sulh hukuk mahkemesine gönderir, çünkü komşuluk davaları sulh hukukun görevindedir."
    dogru: 2
    aciklama: |
      HUAK m. 18/B/1-ç komşu hakkından kaynaklanan uyuşmazlıklarda dava açılmadan önce arabulucuya başvurmayı dava şartı yapar. Arabulucuya başvurulmadan dava açıldığının anlaşılması hâlinde herhangi bir işlem yapılmaksızın dava, dava şartı yokluğu sebebiyle usulden reddedilir (HUAK m. 18/A/2). Komşuluk davaları HMK m. 4'te sulh hukukun görevleri arasında sayılmaz.

olaylar:
  - olay: |
      Ali, Üsküdar'da konut yapılaşmasının hâkim olduğu bir mahallede bulunan arsasına, 2025 baharında sanayi tipi bir ekmek fırını kurar. Fırın her gün 03.00'te çalışmaya başlar; yoğun kurum, duman ve gürültü bitişik parselde oturan Ayşe'nin evine ulaşır. Ayşe geceleri uyuyamaz, balkonu ve çamaşırları kurumla kaplanır; evde ayrıca kurum birikmesi nedeniyle temizlik gideri doğar.

      Ali, fırının ekmek ihtiyacını karşıladığını, kusurunun bulunmadığını, en pahalı filtreyi taktığını ve filtreden sonra da duman çıkıyorsa bunun kendi hatası olmadığını savunur. Mahallede daha önce fırın bulunmamaktadır.

      İki parsel arasında eski bir taş duvar vardır. Tapu kayıtlarında duvarın kime ait olduğuna dair bir açıklama yoktur ve iki taraf da başka delil sunamamaktadır. Ayşe duvarın tamamen kendisine ait olduğunu söylemektedir.

      Ayşe, durumu bir an önce çözmek için Eylül 2025'te Ali aleyhine doğrudan asliye hukuk mahkemesinde dava açmayı düşünmektedir. Ayşe arabulucuya başvurmamıştır.

      1. Ayşe hangi hükümlere dayanabilir ve taşkınlığın ölçütü nedir?
      2. Ayşe ne isteyebilir? Ali'nin "kusurum yok, en iyi filtreyi taktım" savunması sonucu değiştirir mi?
      3. Duvar kimin malı sayılır?
      4. Ayşe'nin doğrudan dava açması hâlinde ne olur?
    olcut:
      - {tespit: "Aşırı kullanma yasağı ve ölçüt: Taşınmazın durumu, niteliği ve yerel âdete göre komşular arasında hoş görülebilecek dereceyi aşan kurum, duman ve gürültü; konut bölgesinde bu yoğunluğun hoşgörü sınırını aşması", puan: 20, madde: "TMK m. 737"}
      - {tespit: "Malikin sorumluluğu davası: Zarar gören veya zarar tehlikesi ile karşılaşan kimsenin eski hâle getirme, tehlikenin ve zararın giderilmesi istemleri", puan: 20, madde: "TMK m. 730"}
      - {tespit: "Kusur aranmaması: Ali'nin kusursuzluk ve filtre savunmasının sonucu değiştirmemesi; TBK m. 49'dan fark", puan: 15, madde: "TMK m. 730"}
      - {tespit: "Yerel âdete uygun ve kaçınılmaz taşkınlık olmaması; denkleştirmenin değil giderim ve önlem isteminin öne çıkması", puan: 10, madde: "TMK m. 737"}
      - {tespit: "Duvarın aksi ispat edilmedikçe iki komşunun paylı malı sayılması; karinenin çürütülebilir olması", puan: 15, madde: "TMK m. 721"}
      - {tespit: "Komşu hakkı uyuşmazlığında arabulucuya başvurmanın dava şartı olması; başvurmadan açılan davanın usulden reddi", puan: 20, madde: "HUAK m. 18/B"}
    cozum: |
      **Nitelendirme:** Uyuşmazlık, bir taşınmaz malikinin faaliyeti nedeniyle komşusuna ulaşan taşkınlıktan doğmaktadır; komşuluk hukukuna ve TMK m. 730 davasına girer. Duvar sorunu ise sınırlığın mülkiyetine ilişkin ayrı bir meseledir.

      **Hukuki sorunlar:** (1) Taşkınlığın ölçütü ve Ayşe'nin dayanağı; (2) istemler ve kusursuzluk savunması; (3) duvarın mülkiyeti; (4) arabuluculuk dava şartı.

      **İlgili hükümler:** TMK m. 737/1-2, TMK m. 730/1, TBK m. 49, TMK m. 721, HUAK m. 18/B/1-ç, HUAK m. 18/A/2.

      **Değerlendirme:**

      *1. Dayanak ve ölçüt:* TMK m. 737/1 herkesi, taşınmaz mülkiyetinden doğan yetkileri kullanırken ve özellikle işletme faaliyetini sürdürürken komşuları olumsuz etkileyecek taşkınlıktan kaçınmakla yükümlü kılar. TMK m. 737/2 ölçüyü verir: Taşınmazın durumuna, niteliğine ve yerel âdete göre komşular arasında hoş görülebilecek dereceyi aşan duman, kurum, koku ve gürültü yasaktır. Olayda mahalle konut yapılaşmasına hâkimdir ve daha önce fırın yoktur. Gece 03.00'te başlayan yoğun kurum ve gürültü, taşınmazın niteliğine ve yerel durumuna göre hoş görülebilecek dereceyi aşar. Ayşe'nin kısıtlamaya aykırı kullanımdan zarar görmüş olması TMK m. 730/1 davasının şartını karşılar.

      *2. İstemler ve kusursuzluk savunması:* TMK m. 730/1'e göre Ayşe durumun eski hâline getirilmesini, tehlikenin giderilmesini ve uğradığı zararın (temizlik giderleri gibi) giderilmesini dava edebilir. Hâkim zararı giderecek en uygun ölçülü önlemi seçer; bu, fırının tamamen kapatılması olabileceği gibi çalışma saatlerinin ve emisyonun sınırlanması da olabilir. TMK m. 730'da kusur aranmaz; ölçü, mülkiyet hakkının yasal kısıtlamalara aykırı kullanılmasıdır. TBK m. 49 ise kusurlu ve hukuka aykırı fiil arar. Ali'nin filtre takması ve kusuru bulunmaması bu yüzden sonucu değiştirmez; filtreye rağmen hoşgörü sınırı aşılıyorsa sorumluluk sürer. Taşkınlık yerel âdete uygun ve kaçınılmaz da olmadığından TMK m. 730/2 ve TMK m. 737/3'teki denkleştirme sorunu öne çıkmaz.

      *3. Duvar:* TMK m. 721'e göre iki taşınmazı ayıran duvar, aksi ispat edilmedikçe her iki komşunun paylı malı sayılır. Tapu kayıtları açıklama içermediği ve hiçbir taraf aksini ispatlayamadığı için duvar paylı maldır. Ayşe'nin "duvar tamamen benim" savı, ispatlanmadıkça karineyi yıkmaz.

      *4. Doğrudan dava:* Ayşe'nin davası komşu hakkından kaynaklanan bir uyuşmazlıktır. HUAK m. 18/B/1-ç'ye göre dava açılmadan önce arabulucuya başvurulmuş olması dava şartıdır. Dava 2025'te açıldığından HUAK'ın geçici 3. maddesindeki geçiş hükmü de uygulanmaz. Arabulucuya başvurulmadan dava açıldığının anlaşılması hâlinde herhangi bir işlem yapılmaksızın dava, dava şartı yokluğu sebebiyle usulden reddedilir (HUAK m. 18/A/2). Ayşe önce arabulucuya başvurmalıdır.

      **Sonuç:**
      - Ayşe TMK m. 737/2'ye aykırı kullanıma dayanarak TMK m. 730/1'e göre eski hâle getirme, tehlikenin ve zararın giderilmesini isteyebilir.
      - Ali'nin kusursuzluk savunması sonucu değiştirmez; TMK m. 730'da kusur aranmaz.
      - Duvar aksi ispat edilmedikçe paylı mal sayılır (TMK m. 721).
      - Arabulucuya başvurmadan açılacak dava usulden reddedilir (HUAK m. 18/B/1-ç ve HUAK m. 18/A/2).

  - olay: |
      Mehmet'in Fethiye'deki bahçesinde üç kovan arı ve ahşap bir kayık vardır. Bir sağanak sırasında taşan dere, kovanları ve kayığı Zeynep'in bitişik arazisine sürükler. Kovanların ve kayığın değeri toplam 20.000 TL'dir. Mehmet ertesi sabah almak için Zeynep'in arazisine girmek ister. Zeynep, "Bahçeme izinsiz giremezsin, ayrıca zararımı ödemeden kovanları vermem" der. Mehmet yine de girer ve çalışırken Zeynep'in birkaç fidanını ezer; fidanların zararı 5.000 TL'dir.

      Bir hafta sonra Zeynep'in komşusunun ahırında yangın çıkar. İçerideki hayvanları kurtarmak isteyen komşular, başka yoldan zamanında ulaşmanın mümkün olmadığını görünce Zeynep'in bahçe çitini keserek geçer. Çitin değeri 8.000 TL, ahırdaki hayvanların değeri 600.000 TL'dir. Zeynep, çitinin kesilemeyeceğini, komşuların kendi mülkünü kurtarmak için başkasının malına zarar veremeyeceğini söyler ve olay sırasında müdahaleye karşı çıkar. Yangın birkaç dakikada ahırın büyük bölümüne yayılmış, itfaiyenin gelmesi ise yarım saati bulmuştur. Zeynep daha sonra çitin zararı için bedel de istemektedir.

      1. Zeynep Mehmet'in arazisine girmesini engelleyebilir mi?
      2. Zeynep fidan zararı ve kovanlar bakımından hangi haklara sahiptir?
      3. Zeynep çitin kesilmesine katlanmak zorunda mıdır? Bir bedel isteyebilir mi?
      4. Bu ikinci olayın çözümünde TBK m. 64/2'nin yeri nedir?
    olcut:
      - {tespit: "Sürüklenen şeylerin aranıp alınmasına arazi malikinin izin vermek zorunda olması; Zeynep'in girişi engelleyememesi", puan: 25, madde: "TMK m. 752"}
      - {tespit: "Arazi malikinin uğradığı zararın denkleştirilmesini istemesi ve bedel ödeninceye kadar kovanları ve kayığı hapsedebilmesi; hapis hakkının girişi engelleme yetkisi vermemesi", puan: 20, madde: "TMK m. 752"}
      - {tespit: "Zorunluluk hâlinin şartları: Zarar ya da tehlikenin ancak taşınmaza müdahale ile önlenebilmesi ve müdahale zararından önemli ölçüde büyük olması; Zeynep'in katlanma yükümlülüğü", puan: 25, madde: "TMK m. 753"}
      - {tespit: "Malikin hakkaniyete uygun denkleştirme bedeli isteyebilmesi; Zeynep'in müdahaleye karşı çıkmasına rağmen bedel isteminin yerinde olması", puan: 15, madde: "TMK m. 753"}
      - {tespit: "Zorunluluk hâlinde fiilin hukuka aykırı sayılmaması ve TBK m. 64/2'nin 'önemli ölçüde büyük' ölçütü taşımayan genel hakkaniyet kuralı olarak karşılaştırılması", puan: 15, madde: "TBK m. 64"}
    cozum: |
      **Nitelendirme:** İlk olay, doğal güçlerle başkasının arazisine sürüklenen şeylerin geri alınması; ikinci olay, zorunluluk hâlinde başkasının taşınmazına müdahaledir. İkisi de malikin katlanma yükümlülüğü ile denkleştirme hakkını düzenleyen TMK hükümlerine girer.

      **Hukuki sorunlar:** (1) Girişin engellenip engellenemeyeceği; (2) malikin zararı ve hapis hakkı; (3) zorunluluk hâlinde katlanma; (4) denkleştirme bedeli ve TBK ile ilişki.

      **İlgili hükümler:** TMK m. 752/1-2, TMK m. 753/1-2, TBK m. 63/2, TBK m. 64/2.

      **Değerlendirme:**

      *1. Giriş:* Su ve benzeri doğal güçlerin etkisiyle başkasının arazisine sürüklenen veya düşen şeylerin hak sahipleri tarafından aranıp alınmasına arazi maliki izin vermek zorundadır (TMK m. 752/1). Selde sürüklenen kovanlar ve kayık bu kapsama girer; kanun ayrıca arı oğulu gibi hayvanların da alınmasını sayar. Bu nedenle Zeynep Mehmet'in girişini engelleyemez. "Bahçeme izinsiz giremezsin" savı hukuken dinlenmez.

      *2. Zarar ve hapis hakkı:* Arazi maliki, bu yüzden uğradığı zararın denkleştirilmesini isteyebilir ve denkleştirme bedeli ödeninceye kadar o şeyleri hapsedebilir (TMK m. 752/2). Mehmet'in girişi sırasında ezilen fidanların zararı (5.000 TL) bu kapsamdadır. Zeynep kovanları ve kayığı bedel ödenene kadar alıkoyabilir. Ancak bu hak girişe izin vermemeyi haklı kılmaz: Zeynep önce izin verir, sonra hapis hakkını kullanır.

      *3. Zorunluluk hâli:* Çitin kesilmesi, başkasının taşınmazına müdahaledir. TMK m. 753/1'e göre bir kimse kendisini veya başkasını tehdit eden bir zararı ya da o anda mevcut bir tehlikeyi ancak başkasının taşınmazına müdahale ile önleyebilecek ve bu zarar ya da tehlike müdahaleden doğacak zarardan önemli ölçüde büyükse malik buna katlanmak zorundadır. Olayda yangın o anda mevcut bir tehlikedir; hayvanlara ancak çitin kesilmesiyle zamanında ulaşılabilir. Önlenen zarar 600.000 TL, müdahalenin doğurduğu zarar 8.000 TL'dir; birincisi ikincisinden önemli ölçüde büyüktür. Bu nedenle Zeynep katlanmak zorundadır.

      *4. Bedel:* Katlanma yükümlülüğü Zeynep'in bedelsiz kaldığı anlamına gelmez. Malik, bu yüzden uğradığı zarar için hakkaniyete uygun bir denkleştirme bedeli isteyebilir (TMK m. 753/2). Zeynep'in müdahaleye karşı çıkması katlanma yükümlülüğünü ortadan kaldırmaz; ama bedel istemi yerindedir. Burada hakkaniyete uygun bedel, çitin zararı üzerinden belirlenir.

      *5. TBK ile ilişki:* Zorunluluk hâlinde fiilin hukuka aykırı sayılmayacağı TBK m. 63/2'de yer alır. TBK m. 64/2 ise kendisini veya başkasını açık ya da yakın bir zarar tehlikesinden korumak için diğer bir kişinin mallarına zarar verenin giderim yükümlülüğünü hâkimin hakkaniyete göre belirleyeceğini söyler. TMK m. 753'teki "önemli ölçüde büyük" şartı TBK m. 64/2 metninde yoktur; TMK m. 753 taşınmaza müdahaleye özgü, malike katlanma yükümlülüğü yükleyen hükümdür.

      **Sonuç:**
      - Zeynep sürüklenen kovanların ve kayığın alınmasına izin vermek zorundadır (TMK m. 752/1).
      - Fidan zararının denkleştirilmesini isteyebilir ve bedel ödenene kadar kovanları ve kayığı hapsedebilir (TMK m. 752/2).
      - Yangında önlenen zarar önemli ölçüde büyük olduğundan çitin kesilmesine katlanmak zorundadır (TMK m. 753/1).
      - Çit için hakkaniyete uygun denkleştirme bedeli isteyebilir (TMK m. 753/2).

  - olay: |
      Hasan ile Fatma'nın bitişik tarlaları arasındaki sınırda eski kazıklar vardır. Kazıklar, tapu planında gösterilen sınır hattından yaklaşık üç metre içeride durmaktadır. Hasan ekimini kazıkların gösterdiği hatta göre yapmıştır. Fatma ise tapu planındaki sınırın geçerli olduğunu söylemektedir. Bölge, yetkili makamlarca heyelan bölgesi olarak belirlenmemiştir. Arazi, yıllardır aynı biçimde kullanılmakta; ekim, kazıkların gösterdiği hatta göre sürdürülmektedir. Fatma ilk kez bu sezon tapu planıyla uyuşmazlığı fark etmiş ve Hasan'a bildirmiştir.

      Hasan sınırın arazide netleşmesini ister; Fatma bu işle ilgilenmek istemez ve "tapuda yazıyor, ben bir şey yapmam" der. Daha sonra Hasan kendi tarlasını tamamen kendi parseli içinde kalacak biçimde telle çevirtir ve 24.000 TL tutan çit giderinin yarısını Fatma'dan ister.

      İki tarlayı da sulayan ortak su kanalının temizliği ise 10.000 TL tutmuştur. Kanal üzerinde paylı mülkiyet yoktur; iki malik kanalı komşuluk hukukundan doğan su yararlanması için kullanmaktadır. Kanalın sulama yararının %70'ini Hasan'ın, %30'unu Fatma'nın tarlası sağlamaktadır. Hasan bu giderin de yarısını Fatma'dan ister. Fatma, giderin yararlanma oranına göre paylaşılması gerektiğini söyler.

      1. Hangi sınır esastır?
      2. Fatma sınırın belirlenmesine katkıda bulunmaktan kaçınabilir mi?
      3. Hasan çit giderinin yarısını Fatma'dan isteyebilir mi?
      4. Kanal temizliği giderleri nasıl paylaşılır?
    olcut:
      - {tespit: "Tapu planı ile arazideki işaretler çelişince plandaki sınırın esas olması; bölge heyelan bölgesi olmadığından istisnanın uygulanmaması", puan: 20, madde: "TMK m. 719"}
      - {tespit: "Fatma'nın komşusunun istemi üzerine belli olmayan sınırların belirlenmesine (plan düzeltilmesi veya sınır işareti konulması) katkıda bulunmakla yükümlü olması", puan: 20, madde: "TMK m. 720"}
      - {tespit: "Kendi taşınmazının çevrilmesi giderinin kural olarak malikine ait olması; Hasan'ın çit giderinin yarısını isteyememesi", puan: 20, madde: "TMK m. 749"}
      - {tespit: "Sınırlıklar için paylı mülkiyet karinesinin saklı olması; kendi parseli içindeki çitte karinenin uygulanmaması", puan: 10, madde: "TMK m. 721"}
      - {tespit: "Komşuluk hukukundan doğan yetkilerin kullanılması için gerekli işlerin giderlerine kendi yararlanma oranında katılınması; Fatma'nın payının %30 olması, yarı yarıya olmaması", puan: 30, madde: "TMK m. 750"}
    cozum: |
      **Nitelendirme:** Olay üç ayrı sorun içerir: sınırın belirlenmesi, sınırlığın gideri ve komşuluk hukukundan doğan işlerin giderlerine katılma.

      **Hukuki sorunlar:** (1) Plan ile arazi işareti çelişince hangisi esas; (2) komşunun sınır belirlemeye katkı yükümlülüğü; (3) tel çit gideri; (4) kanal temizliği gideri.

      **İlgili hükümler:** TMK m. 719/1-2, TMK m. 720, TMK m. 721, TMK m. 749/1, TMK m. 750.

      **Değerlendirme:**

      *1. Esas sınır:* Taşınmazın sınırları tapu planları ve arz üzerindeki sınır işaretleriyle belirlenir. Plan ile işaret birbirini tutmazsa asıl olan plandaki sınırdır (TMK m. 719/1-2). Bu kural yalnız yetkili makamlarca heyelan bölgesi olduğu belirlenen yörelerde uygulanmaz; olayda böyle bir belirleme yoktur. Kazıklar plandan üç metre içeride durduğundan Hasan'ın kazıklara dayanarak yaptığı ekim sınırı belirlemez; esas plandaki sınırdır.

      *2. Sınır belirlemeye katkı:* Her arazi maliki, komşusunun istemi üzerine belli olmayan sınırların belirlenmesi için tapu planlarının düzeltilmesine veya arz üzerine sınır işaretleri konulmasına katkıda bulunmakla yükümlüdür (TMK m. 720). Sınırın arazide net olmaması ve Hasan'ın istemi nedeniyle Fatma'nın "tapuda yazıyor" savı yükümlülüğü ortadan kaldırmaz. Yükümlülük komşunun istemiyle doğar; mahkeme kararı beklenmez.

      *3. Çit gideri:* Paylı mülkiyete ilişkin hükümler saklı kalmak üzere her arazi maliki, taşınmazının sınırının çit veya duvar gibi sınırlıklarla çevrilmesi için yapılan giderleri karşılar (TMK m. 749/1). Çit tamamen Hasan'ın parseli içinde kalmaktadır. Bu nedenle ortak bir sınırlık söz konusu değildir ve TMK m. 721'deki paylı mülkiyet karinesi de devreye girmez. Hasan'ın 24.000 TL'lik çit giderinin yarısını Fatma'dan isteyebilmesi için bir dayanak yoktur; gider kural olarak kendisine aittir.

      *4. Kanal temizliği:* Her taşınmaz maliki, komşuluk hukukundan doğan yetkilerin kullanılması için gerekli işlere ve bunların giderlerine kendi yararlanması oranında katılmakla yükümlüdür (TMK m. 750). Katılma yarı yarıya değil, orantılıdır. Fatma'nın tarlası sulamanın %30'unu sağladığından Fatma 10.000 TL'nin yararlanma oranına düşen kısmına, yani 3.000 TL'ye katılır; Hasan 7.000 TL'yi karşılar. Hasan'ın yarısını isteme savı yerinde değildir.

      **Sonuç:**
      - Esas olan tapu planındaki sınırdır; heyelan bölgesi istisnası uygulanmaz (TMK m. 719/2).
      - Fatma, Hasan'ın istemi üzerine sınırın belirlenmesine katkıda bulunmak zorundadır (TMK m. 720).
      - Hasan'ın kendi parseli içindeki çit giderini Fatma'dan istemesi yerinde değildir (TMK m. 749/1).
      - Kanal temizliği giderlerine her malik kendi yararlanması oranında katılır (TMK m. 750).

kartlar:
  - on: "Arazi mülkiyetinin dikey kapsamı? (TMK m. 718/1)"
    arka: "Kullanılmasında yarar olduğu ölçüde üstündeki hava ve altındaki arz katmanlarını kapsar. Ölçü malikin yararıdır; kapsam sınırsız değildir."
  - on: "Yapı, bitki ve kaynaklar mülkiyetin kapsamına girer mi? (TMK m. 718/2)"
    arka: "Evet, ancak yasal sınırlamalar saklı kalmak üzere."
  - on: "Arza malik olan yeraltı suyuna da malik olur mu?"
    arka: "Hayır. Yeraltı suları kamu yararına ait sulardandır (TMK m. 756/3). Kaynak ise arazinin bütünleyici parçasıdır (TMK m. 756/1)."
  - on: "Tabii servetler ve kaynaklar kimin hüküm ve tasarrufu altındadır?"
    arka: "Devletin (AY m. 168). TMK m. 718/2'deki yasal sınırlamalara örnektir."
  - on: "Taşınmazın sınırı neyle belirlenir? (TMK m. 719/1)"
    arka: "Tapu planları ve arz üzerindeki sınır işaretleriyle."
  - on: "Plan ile arazideki işaret çelişirse hangisi esastır?"
    arka: "Plandaki sınır (TMK m. 719/2). Yetkili makamlarca heyelan bölgesi olduğu belirlenen yörelerde bu kural uygulanmaz."
  - on: "Komşunun sınır belirleme istemi karşısında malik ne yapmak zorundadır? (TMK m. 720)"
    arka: "Belli olmayan sınırların belirlenmesi için tapu planlarının düzeltilmesine veya arz üzerine sınır işaretleri konulmasına katkıda bulunmak."
  - on: "Duvar, parmaklık, çit gibi sınırlıkların mülkiyeti? (TMK m. 721)"
    arka: "Aksi ispat edilmedikçe her iki komşunun paylı malı sayılır. Çürütülebilir karinedir."
  - on: "Sınırın çit ve duvarla çevrilmesi giderlerini kim karşılar? (TMK m. 749/1)"
    arka: "Paylı mülkiyet hükümleri saklı kalmak üzere her arazi maliki kendi taşınmazının sınırını çevirme giderini karşılar."
  - on: "TMK m. 730/1'e göre dava eden kim ve ne ister?"
    arka: "Yasal kısıtlamalara aykırı kullanım yüzünden zarar gören veya zarar tehlikesi ile karşılaşan kimse; eski hâle getirmeyi, tehlikenin ve zararın giderilmesini ister."
  - on: "TMK m. 730'da zararın doğması şart mıdır?"
    arka: "Hayır. Zarar tehlikesiyle karşılaşan da dava açabilir (TMK m. 730/1). Ancak taşkınlık ve etkisi somut olarak ispat edilmelidir."
  - on: "TMK m. 730'da kusur aranır mı?"
    arka: "Hayır. Ölçü yasal kısıtlamalara aykırı kullanımdır. TBK m. 49 ise kusurlu ve hukuka aykırı fiil arar."
  - on: "TMK m. 730/2 ne diyor?"
    arka: "Hâkim, yerel âdete uygun ve kaçınılmaz taşkınlıklardan doğan zararların uygun bir bedelle denkleştirilmesine karar verebilir. Aynı ilke TMK m. 737/3'te de saklıdır."
  - on: "TMK m. 737/2'nin ölçütü?"
    arka: "Taşınmazın durumuna, niteliğine ve yerel âdete göre komşular arasında hoş görülebilecek dereceyi aşan rahatsızlık yasaktır. Sayım örnekleyicidir."
  - on: "Yargıtay'a göre salt imara aykırılık komşuluk davasını haklı kılar mı?"
    arka: "Hayır. Belirleyici olan etkinin hoşgörü sınırını aşıp aşmadığıdır; keşif ve uzman bilirkişi ile somut olarak belirlenir."
  - on: "Kâl her zaman tam yıkım mıdır?"
    arka: "Hayır. Hâkim aykırılığı gideren en uygun ölçülü önlemi seçer (örnek: tabelanın küçültülmesi, parapetin alçaltılması). Önlemle giderilen aykırılık için ayrıca değer kaybı verilmez."
  - on: "Kanundan doğan mülkiyet kısıtlamaları tescil gerektirir mi? (TMK m. 731)"
    arka: "Hayır, tescilsiz etkili olur. Kaldırılmaları resmî şekil ve şerh ister; kamu yararı kısıtlamaları kaldırılamaz."
  - on: "TMK m. 750'de giderlere nasıl katılınır?"
    arka: "Kendi yararlanması oranında. Yarı yarıya değildir."
  - on: "TMK m. 751/1'e göre orman ve meraya girme?"
    arka: "Yasaklanmadıkça herkes girebilir; yabani meyve, mantar ve benzerlerini yerel âdetlerin izin verdiği ölçüde toplayabilir. Avlanma ve balık tutma özel kanunlara tabidir (TMK m. 751/2)."
  - on: "Sürüklenen şeyler ve giren hayvanlar için malikin yükümlülüğü ve hakkı? (TMK m. 752)"
    arka: "Aranıp alınmasına izin vermek zorundadır. Zararın denkleştirilmesini isteyebilir ve bedel ödenene kadar şeyleri hapsedebilir."
  - on: "TMK m. 753'te malik ne zaman katlanır?"
    arka: "Önlenen zarar ya da tehlike müdahaleden doğacak zarardan önemli ölçüde büyükse. Karşılığında hakkaniyete uygun denkleştirme bedeli isteyebilir."
  - on: "Komşu hakkı uyuşmazlıklarında arabuluculuğun yeri? (HUAK m. 18/B/1-ç)"
    arka: "Dava şartıdır. Başvurulmadan açılan dava herhangi bir işlem yapılmaksızın usulden reddedilir (HUAK m. 18/A/2). Yürürlük tarihinde görülmekte olan davalara uygulanmaz (HUAK'ın geçici 3. maddesi)."
