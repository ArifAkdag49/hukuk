ozet: |
  **Bu konu neyi cevaplıyor?** Kat mülkiyeti kurulduktan sonra bina nasıl yönetilir, malikler birbirine ve binaya karşı hangi borçlarla bağlıdır, borçlarını ihlal edenin başına ne gelir? (Malikin hakları KMK m. 15-16'dandır ve bir önceki konunun içindedir: haklar m. 15-16, borçlar m. 18 vd.)

  - **Genel borç (KMK m. 18):** doğruluk kurallarına uyma, birbirini rahatsız etmeme, yönetim planına uyma. Borçlar kiracıyı ve devamlı yararlananı da bağlar; bunlar malikle müteselsil sorumludur.
  - **Bakım ve değişiklik (KMK m. 19):** ortak yerde inşaat, onarım, tesis ve değişik renkte dış boya için bütün kat maliklerinin **beşte dördünün yazılı rızası** gerekir. Malik kusuruyla verdiği zarardan sorumludur.
  - **Ortak giderler (KMK m. 20-22):** personel giderleri ve avansı eşit, diğer giderler arsa payı oranında paylaşılır. Gecikme tazminatı geciken günler için **aylık yüzde beş**tir. Kiracının sorumluluğu kira miktarıyla sınırlıdır. Mahkemece tespit edilen borç için diğer malikler lehine **kanuni ipotek** tescil edilir; bundan önceden feragat geçersizdir.
  - **Katlanma ve yasaklar (KMK m. 23-24):** başka bölüme girmek gerekirse katlanılır; klinik gibi yerler kurulamaz; meskende lokanta, dükkân gibi yerler ancak **oybirliğiyle** açılır.
  - **Çıkarma (KMK m. 25):** çekilmez hâle gelen malikin bölümü, değeri ödenerek diğerlerine devredilir. Dava kararı **sayı ve arsa payı çoğunluğuyla** alınır; dava hakkı öğrenmeden 6 ay, her hâlde 5 yıl içinde kullanılır.
  - **Yönetim planı (KMK m. 28):** sözleşme hükmündedir; değiştirmek için bütün maliklerin **beşte dördünün oyu** şarttır.
  - **Kurul (KMK m. 29-32):** yılda en az bir toplantı; olağanüstü toplantıyı yönetici, denetçi veya maliklerin üçte biri ister; çağrı en az 15 gün önce yapılır. Toplantı yeter sayısı sayı ve arsa payı bakımından yarıdan fazladır. İkinci toplantıda katılanların salt çoğunluğu yeter. Her malikin bir oyu vardır.
  - **İptal davası (KMK m. 33):** aykırı oy veren karar tarihinden, katılmayan öğrenmeden itibaren **bir ay**; her hâlde karar tarihinden **altı ay**. Sulh hukuk mahkemesinde ve arabuluculuktan sonra açılır. Yok ve mutlak butlan hâllerinde süre aranmaz.
  - **Yönetici (KMK m. 34-41):** sekiz veya daha fazla bağımsız bölümde zorunludur; sayı ve arsa payı çoğunluğuyla, her yıl atanır. Vekil gibi sorumludur.
  - 📌 **7579 sayılı Kanun (RG 22/5/2026):** avans, işletme projesi onaylanıncaya kadar toplanır (KMK m. 35/1-d); işletme projesini kat malikleri genel kurulu onaylar, geçici proje bedelinde yeniden değerleme tavanı vardır (KMK m. 37). Ana yapıda plan değişikliği hâlâ beşte dörttür.
  - **Usul:** görevli mahkeme sulh hukuk mahkemesi (Kat Mülkiyeti Kanunu'nun ek 1. maddesi ve HMK m. 4/1-ç); dava şartı arabuluculuk (HUAK m. 18/B/1-c).

anlatim: |
  ## 0. Konunun haritası

  Önceki konuda kat mülkiyetinin kuruluşunu gördük. Bu konuda binanın **yaşayan hâlini** inceliyoruz: malik borçları ve ortak giderler (KMK m. 18-24), çıkarma (KMK m. 25-26), kurul ve yönetim planı (KMK m. 27-33), yönetici (KMK m. 34-41). Malikin hakları KMK m. 15 ve KMK m. 16'dadır: Malik kendi bağımsız bölümünde, Kanunun ilgili hükümleri saklı kalmak şartıyla, TMK'nın maliklere tanıdığı yetkilere sahiptir; ortak yerlerde arsa payı oranında paylı malik olur ve kullanma hakkı vardır. 

  > 💡 **Püf nokta:** Bu konu **sayılarla** doludur: beşte dört, oybirliği, sayı ve arsa payı çoğunluğu, bir ay, altı ay. Hangi işte hangi nisabın arandığını bölüm 5.4'teki tablodan ezberle.

  ## 1. Genel borç ve bakım yükümlülüğü

  ### 1.1 Doğruluk kuralları (KMK m. 18)
  KMK m. 18/1'e göre malikler bağımsız bölümleri, eklentileri ve ortak yerleri kullanırken **doğruluk kurallarına uymakla**, özellikle birbirini rahatsız etmemekle, birbirinin haklarını çiğnememekle ve yönetim planına uymakla karşılıklı yükümlüdür. İkinci fıkra borçları genişletir: malik borçları **kiracılara, oturma hakkı sahiplerine ve devamlı yararlananlara** da uygulanır; bunlar malikle birlikte **müteselsil** sorumlu olur.

  > **Örnek:** Ali'nin dairesindeki kiracı Mehmet gece yarılarına kadar yüksek sesli müzik yaparsa komşular KMK m. 18'e dayanarak yalnız Ali'ye değil Mehmet'e de başvurabilir; ikisi birlikte sorumludur.

  ### 1.2 Mimari durumu koruma ve ortak yerlerde değişiklik (KMK m. 19)
  Malikler anagayrimenkulün mimari durumunu, güzelliğini ve sağlamlığını titizlikle korumaya mecburdur (KMK m. 19/1). İkinci fıkranın kuralları:
  - Bir malik, bütün kat maliklerinin **beşte dördünün yazılı rızası** olmadıkça ortak yerlerde **inşaat, onarım ve tesis** ile **değişik renkte dış badana veya boya** yaptıramaz.
  - **İstisna:** Ortak yer ve tesislerdeki bir bozukluğun anayapıya veya bağımsız bölüme zarar verdiği ve acilen onarılması gerektiği ya da anayapının güçlendirilmesinin zorunlu olduğu **mahkemece tespit edilmişse**, projeye ve tekniğe uygun onarım ve güçlendirmede maliklerin rızası aranmaz.
  - Malik kendi bölümünde de **anayapıya zarar verecek** onarım, tesis ve değişiklik yapamaz.
  - Malik, **kusuruyla** verdiği zarardan diğer maliklere karşı sorumludur (KMK m. 19/3).

  > **Örnek:** Zeynep dış cepheyi kendi katında pembeye boyatmak ister. 20 bölümlü binada bunun için bütün maliklerin beşte dördünün (kendi hesabımızla 16 malikin) **yazılı** rızası gerekir; toplantıda el kaldırmak yazılı rızanın yerini tutmaz.

  > ⚠️ **Sınavda dikkat:** Burada beşte dört **yazılı rıza** nisabıdır ve **bütün** maliklere göre hesaplanır; yönetim planı değişikliğindeki beşte dört ise **oy** nisabıdır (KMK m. 28/3).

  ## 2. Ortak giderler (KMK m. 20-22)

  ### 2.1 Kim, ne kadar öder? (KMK m. 20/1)
  Kural **"aralarında başka türlü anlaşma olmadıkça"** uygulanır:
  - **Eşit:** kapıcı, kaloriferci, bahçıvan, bekçi giderleri ve bunların avansı (KMK m. 20/1-a).
  - **Arsa payı oranında:** sigorta primi, bakım, koruma, güçlendirme, onarım, yönetici aylığı, ortak tesis işletmesi ve avans (KMK m. 20/1-b).
  - **Faydalanma oranında:** faydalı yeniliklerin gideri (KMK m. 42/3).

  KMK m. 20/1-c kaçış yolunu kapatır: Malik, ortak yer veya tesisler üzerindeki **kullanma hakkından vazgeçerek** ya da kendi bölümünün durumu nedeniyle **faydalanmaya lüzum ve ihtiyaç bulunmadığını** ileri sürerek gider ve avans payını ödemekten kaçınamaz.

  ### 2.2 Ödemeyen malik: dava, takip ve gecikme tazminatı (KMK m. 20/2)
  Gider veya avans payını ödemeyen malik hakkında diğer maliklerden her biri ya da yönetici **dava açabilir, icra takibi yapabilir**. Ödemeyen malik, geciktiği günler için **aylık yüzde beş** hesabıyla **gecikme tazminatı** öder. Bu oran 5711 sayılı Kanunla yüzde ondan yüzde beşe indirilmiştir. Gidere birinin **kusurlu hareketi** sebep olmuşsa ödeyenler ona **rücu** edebilir (KMK m. 20/3).

  ### 2.3 Sigorta (KMK m. 21)
  Anagayrimenkulün sigorta edilmesi **kat malikleri kurulunca kararlaştırılabilir**; sigorta yapılırsa giderlere arsa payı oranında katılınır. Yapı tamamen harap olursa sigorta bedeli aksine sözleşme yoksa arsa payı oranında paylaştırılır; kısmi hasarda bedel onarıma harcanır.

  ### 2.4 Borcun güvencesi (KMK m. 22)
  **Kiracı ve devamlı yararlananlar.** Gider, avans ve gecikme tazminatı borcundan bölümde kira, oturma hakkı ya da başka bir sebeple devamlı yararlananlar da **müştereken ve müteselsilen** sorumludur. Ancak **kiracının sorumluluğu ödemekle yükümlü olduğu kira miktarıyla sınırlıdır** ve yaptığı ödeme kira borcundan düşer (KMK m. 22/1). 

  > ⚠️ **Sınavda dikkat:** KMK m. 18/2'deki müteselsil sorumluluk **davranış borçları** (rahatsız etmeme gibi) içindir; ortak gider borcunda kiracının sorumluluğu KMK m. 22/1 ile **kira bedeliyle sınırlanmıştır**.

  **Kanuni ipotek.** Borç kiracı ya da diğer sorumlulardan da alınamazsa, **mahkemece tespit edilen** borcunu ödemeyen malikin bağımsız bölümü üzerine, varsa yöneticinin yoksa maliklerden birinin **yazılı istemiyle**, bu borç tutarı için diğer kat malikleri lehine **kanuni ipotek** tescil edilir (KMK m. 22/2). İki şart birlikte aranır:
  1. Borç, diğer sorumlulardan **"bu yolla da alınamamış"** olmalı.
  2. Borç, **mahkemece tespit edilmiş** olmalı.

  Aynı fıkra TMK m. 893'ün son fıkrasını uygulanır kılar: Alacaklıların kanuni ipotek hakkından **önceden feragat etmeleri geçerli değildir**; plana "ipotek istenemez" yazılsa bile geçersizdir. Maliklerin bu alacakları ayrıca **önceliklidir** (KMK m. 22/3).

  > **Örnek:** Burcu üç yıldır aidat ödemiyor. Yönetici Ali dava açar, borç mahkemece tespit edilir. Burcu yine ödemezse Ali yazılı istemle Burcu'nun dairesine kanuni ipotek tescil ettirir.

  ## 3. Katlanma yükümlülüğü ve yasak işler

  ### 3.1 Başka bölüme girme (KMK m. 23)
  Bir bağımsız bölümde meydana gelen hasarın onarımı, tesislerin yeniden yapılması ya da yapı güvenliğiyle ilgili **teknik incelemeler** için başka bölüme girmek gerekiyorsa, o bölümün maliki ve orada oturanlar **giriş müsaadesi vermeye ve işlerin yapılmasına katlanmaya** mecburdur. Harap olan kısmın yeniden yapımı için sağlam bölümlerden yararlanılmasına da katlanılır. Doğan zararı **lehine müsaade verilen bölümün malikleri derhal öder**.

  > **Örnek:** Kemal'in tesisatını onarmak için Selin'in evine girilmesi gerekir; Selin katlanır, doğan zararı Kemal derhal öder.

  ### 3.2 Yasak işler (KMK m. 24)
  Bu madde kütükteki kayda göre iki ayrı rejim kurar:
  - **Mesken, iş veya ticaret yeri** olarak kayıtlı bölümde hastane, dispanser, klinik, poliklinik, ecza laboratuvarı gibi müesseseler **kurulamaz**; maliklerin buna aykırı sözleşmeleri hükümsüzdür. Klinik niteliğinde olmayan **muayenehaneler** yasağın dışındadır (KMK m. 24/1).
  - Yalnız **mesken** olarak kayıtlı bölümde eğlence ve toplantı yerleri, fırın, lokanta, pastahane gibi gıda yerleri, imalathane, dükkân, galeri, çarşı gibi yerler ancak kurulun **oybirliğiyle** vereceği kararla açılabilir; karar istem üzerine bütün bölümlerin kütük sayfalarına **şerh** verilir (KMK m. 24/2).

  > ⚠️ **Sınavda dikkat:** Klinik yasağı oybirliğiyle bile aşılamaz. Lokanta ve dükkân yasağı yalnız mesken kayıtlı bölümde geçerlidir ve oybirliğiyle aşılır.

  KMK m. 24/3'teki avukatlık ve mali müşavirlik bürolarına ilişkin geçiş hükmü bu notta işlenmez; güncel durumunu mevzuattan kontrol et.

  ## 4. Mülkiyetin devri mecburiyeti: çıkarma (KMK m. 25)

  ### 4.1 Şartlar
  Kat maliklerinden biri Kanunun yüklediği borç ve yükümleri yerine getirmeyerek diğerlerinin haklarını **onlar için çekilmez hâle gelecek derecede** ihlal ederse, diğerleri onun bağımsız bölümü üzerindeki mülkiyetin **kendilerine devredilmesini hâkimden isteyebilir** (KMK m. 25/1). Bu **devir (çıkarma) davasıdır**; bölüm bedelsiz alınmaz, değeri ödenir.

  ### 4.2 Dava kararı ve usul (KMK m. 25/2)
  - Bölümün **hükme en yakın tarihteki değeri** malike ödenerek arsa payları oranında devir istenir.
  - Davanın açılması, aksi kararlaştırılmamışsa, diğer maliklerin **sayı ve arsa payı çoğunluğuyla** verecekleri karara bağlıdır. Karara rağmen bir kısım malik davayı açmak istemezse **davayı öteki malikler açar**.
  - Hâkim, hüküm vermeden önce devir bedelinin **bankada üçer aylık vadeli hesaba yatırılması** için süre verir.
  - Dava kabul edilirse bölüm **davayı açmış olan** maliklere arsa payları oranında devredilir; bedel işlemiş faiziyle davalıya ödenir.

  ### 4.3 Çekilmezliğin var sayıldığı haller (KMK m. 25/3)
  Aşağıdaki hâllerde çekilmezlik **her halde mevcut farz edilir**:
  - **(a)** Ortak gider ve avans borcunu ödemediği için **iki takvim yılı içinde üç defa** icra veya dava takibi yapılmasına sebep olunması.
  - **(b)** Sulh hâkiminin KMK m. 33 gereğince verdiği emre rağmen **devamlı olarak bir yıl ısrar** edilmesi.
  - **(c)** Bölümün randevu evi, kumarhane veya benzeri yer olarak kullanılması.

  > ⚠️ **Sınavda dikkat:** KMK m. 25/3 yalnız **çekilmezliği var sayar**; ayrı bir oy oranı koymaz. Dava kararı, üç hâlde de KMK m. 25/2'deki **sayı ve arsa payı çoğunluğuyla** alınır. Kanunda "üçte iki oy" ya da davadan önce "süreli ihtar" şartı yoktur. Noter ihtarı KMK m. 26/2'de ve KMK m. 40/2'de geçer.

  ### 4.4 Dava hakkının düşmesi (KMK m. 25/4)
  Dava hakkı, devir konusunda kat maliklerince alınan dava açma kararının **öğrenilmesi tarihinden başlayarak altı ay** ve her halde dava hakkının **doğumundan başlayarak beş yıl** içinde kullanılmazsa ya da dava sebebi ortadan kalkmışsa düşer. Yargıtay'ın onadığı kararlarda, dava açma kararına karşı ayrı bir iptal veya tespit davasında hukuki yarar bulunmadığı, çekilmezliğin devir davasında inceleneceği kabul edilmiştir.

  > **Örnek:** Tolga 2024 ve 2025'te aidat yüzünden üç kez icra takibine sebep olmuştur. Çekilmezlik var sayılır, ama diğer malikler sayı ve arsa payı çoğunluğuyla dava açma kararı almadıkça dava açılamaz.

  ### 4.5 Kat irtifakında karşılığı (KMK m. 26)
  Kat irtifakı sahipleri yapının tamamlanması için borçlarını vaktinde yerine getirmekle yükümlüdür (KMK m. 26/1). Borcunu **noter aracılığıyla yapılan ihtara rağmen ihtar tarihinden başlayarak iki ay içinde** yerine getirmeyen irtifak sahibinin payı, diğerlerinin yazılı istemiyle, hükme en yakın tarihteki değeri karşılığında diğer paydaşlara devredilir (KMK m. 26/2). **Noter ihtarı ve iki aylık süre** burada vardır, KMK m. 25'te yoktur.

  ## 5. Kurul ve yönetim planı

  ### 5.1 Kurul ve yönetim planı (KMK m. 27-28)
  Anagayrimenkul **kat malikleri kurulunca** yönetilir; yönetim tarzı, kanunların emredici hükümleri saklı kalmak şartıyla kurulca kararlaştırılır (KMK m. 27). **Yönetim planı** yönetim tarzını, kullanma şeklini, yönetici ve denetçilerin ücretini düzenler ve bütün kat maliklerini bağlayan bir **sözleşme hükmündedir** (KMK m. 28/1). Planda hüküm yoksa Kanun ve genel hükümler uygulanır (KMK m. 28/2).

  - **Değişiklik:** Bütün kat maliklerinin **beşte dördünün oyu** şarttır; maliklerin KMK m. 33'e göre mahkemeye başvurma hakları saklıdır (KMK m. 28/3).
  - **Bağlayıcılık ve tapu:** Plan, maliklerin **külli ve cüzi haleflerini** ile yönetici ve denetçileri de bağlar; tarihi kütüğün **beyanlar** hanesinde gösterilir (KMK m. 28/4-5).

  > **Örnek:** 20 bölümlü binada plan değişikliği teklifi toplantıda 11 oy almıştır. Çoğunluk olsa da beşte dört gerektiğinden değişiklik gerçekleşmez.

  ### 5.2 Toplantı ve yeter sayı (KMK m. 29-30)
  - **Olağan toplantı:** Yılda en az bir kez; planda zaman yoksa **her takvim yılının ilk ayı içinde** (KMK m. 29/1).
  - **Olağanüstü toplantı:** Önemli sebeple **yöneticinin, denetçinin veya maliklerin üçte birinin** istemiyle, toplantıdan **en az onbeş gün önce**, imzalattırılacak çağrı veya taahhütlü mektupla, sebep bildirilerek yapılır (KMK m. 29/2).
  - **İkinci toplantı:** İlk çağrıda ikinci toplantının yeri ve tarihi de bildirilir; iki toplantı arası **yedi günden az** olamaz (KMK m. 29/3).
  - **Toplantı nisabı:** Kurul, maliklerin **sayı ve arsa payı bakımından yarısından fazlasıyla** toplanır (KMK m. 30/1). İlk toplantı yapılamazsa ikinci toplantı **en geç onbeş gün sonra** yapılır; karar yeter sayısı **katılanların salt çoğunluğudur** (KMK m. 30/2).
  - **Özel nisaplar saklıdır** (KMK m. 30/3): beşte dört, oybirliği gibi nisaplar ikinci toplantıda da aranır.

  ### 5.3 Oy ve karar (KMK m. 31-32)
  - Her malikin arsa payı oranına bakılmaksızın **bir tek oy** hakkı vardır; birden çok bölümü olanın toplam oyu **bütün oyların üçte birinden fazla olamaz** (KMK m. 31/1-2).
  - Karar doğrudan **kendini ilgilendiren malik** görüşmede bulunabilir ama **oya katılamaz** (KMK m. 31/4). Kendi ibrası görüşülen yönetici-malik oy kullanamaz.
  - Bir kişi oy sayısının **yüzde beşinden fazlasını** kullanmak üzere vekil tayin edilemez; **kırk ve daha az** bölümlü yapıda bir kişi **en fazla iki kişiye** vekâlet edebilir (KMK m. 31/5).
  - Kararlar **noter mühürlü, sayfaları numaralı deftere** yazılıp imzalanır; karara **aykırı oy verenler sebebini belirterek** imza koyar (KMK m. 32).

  ### 5.4 Nisap karşılaştırma tablosu
  | İş | Nisap | Madde |
  |---|---|---|
  | Ortak yerde inşaat, dış boya | Beşte dört yazılı rıza | KMK m. 19/2 |
  | Yönetim planı değişikliği | Beşte dört oy | KMK m. 28/3 |
  | Meskende lokanta, dükkân | Oybirliği | KMK m. 24/2 |
  | Faydalı yenilik | Sayı ve arsa payı çoğunluğu | KMK m. 42/1 |
  | Kat ilavesi | Oybirliği | KMK m. 44 |
  | Temliki tasarruf, reklam kirası | Oybirliği | KMK m. 45 |
  | Çıkarma davası kararı | Sayı ve arsa payı çoğunluğu | KMK m. 25/2 |
  | Yönetici ve denetçi atama | Sayı ve arsa payı çoğunluğu | KMK m. 34, KMK m. 41 |
  | Olağanüstü toplantı istemi | Maliklerin üçte biri | KMK m. 29/2 |

  Isı yalıtımı ve ısınma sisteminin dönüşümü sayı ve arsa payı çoğunluğuyla yapılır; toplam inşaat alanı ikibin metrekare ve üzeri binalarda merkezi sistemden ferdi sisteme geçiş ise **oybirliğini** ister (KMK m. 42/4).

  ## 6. Kurul kararının iptali ve hâkimin müdahalesi (KMK m. 33)

  ### 6.1 İptal davası
  Kurul kararlarına karşı **anagayrimenkulün bulunduğu yerdeki sulh mahkemesinde** iptal davası açılır. Süreler:
  - **Aykırı oy veren** (KMK m. 32'ye uygun): karar tarihinden itibaren **bir ay**.
  - Toplantıya **katılmayan:** kararı öğrenmesinden itibaren **bir ay**.
  - Her iki hâlde **en geç karar tarihinden altı ay**.

  Kurul kararlarının **yok veya mutlak butlanla hükümsüz** sayıldığı durumlarda süre koşulu aranmaz (KMK m. 33/1). Yargıtay bu süreleri **hak düşürücü** süre sayar; süre geçince kararlar tek tek yokluk ve mutlak butlan yönünden incelenir. Kanun hangi kararların bu kapsamda olduğunu saymaz (doktrin). Dava kat maliklerini temsilen **yöneticiye** husumet yöneltilerek açılabilir; karar iptal edilirse yargılama giderleri **ortak giderlerden** karşılanır (KMK m. 38/2).

  > **Örnek:** Kurul 14 Ocak'ta karar almıştır. Aykırı oy veren Zeynep karar tarihinden itibaren bir ay içinde dava açmalıdır. Toplantıya katılmayan Can kararı öğrendiği günden bir ay içinde, her halde 14 Ocak'tan itibaren altı ay içinde açabilir.

  ### 6.2 Hâkimin müdahalesi
  Malikin ya da devamlı yararlananın **borç ve yükümlerini yerine getirmemesi yüzünden zarar gören** malikler **hâkimin müdahalesini** isteyebilir (KMK m. 33/1). Hâkim Kanuna ve plana, bunlarda hüküm yoksa genel hükümlere ve **hakkaniyet kurallarına** göre derhâl karar verir (KMK m. 33/2). Süresinde uymayana **idari para cezası** verilir; KMK m. 25 hükmü saklıdır (KMK m. 33/3). Emre rağmen bir yıl ısrar edilirse çekilmezlik var sayılır (KMK m. 25/3-b): Hâkimin müdahalesi çıkarma davasının bir basamağıdır.

  ## 7. Yönetici (KMK m. 34-41)

  ### 7.1 Atanması (KMK m. 34)
  - Yönetim bir **yöneticiye** ya da **üç kişilik kurula** verilebilir.
  - **Sekiz veya daha fazla** bağımsız bölüm varsa yönetici atanması **mecburidir**. Bütün bölümler tek kişinin mülkiyetindeyse malik kanunen yönetici durumundadır.
  - Yönetici maliklerin **hem sayı hem arsa payı bakımından çoğunluğu** tarafından atanır ve **her yıl** yeniden atanır; eski yönetici tekrar atanabilir.
  - Malikler anlaşamazsa bir malikin başvurusuyla **sulh mahkemesi** yönetici atar. Bu yönetici **altı ay geçmedikçe** kurulca değiştirilemez; haklı sebep varsa mahkeme izin verebilir.
  - Yöneticinin ad ve adresi binaya asılmalıdır; asılmazsa idari para cezası verilir.

  ### 7.2 Görevleri (KMK m. 35-37)
  Plan aksini söylemedikçe yönetici (KMK m. 35/1) kararları yerine getirir, bakım ve onarım tedbirlerini alır, sigorta ettirir, **avans toplar**, giderleri öder, borcunu ödemeyenlere **dava ve icra takibi yapar ve kanuni ipoteği tescil ettirir**, topladığı paraları **yönetici sıfatı gösterilerek açtırdığı banka hesabında** tutar, kurulu toplantıya çağırır ve asansör bakımlarını yaptırır. Yönetici atanması zorunlu olduğu hâlde atanmamışsa bu işlerden **kat malikleri müştereken sorumludur** (KMK m. 35 son fıkra). Yönetici kararları ve giderleri karar defterine yazar; defteri **her takvim yılının bitiminden itibaren bir ay içinde** notere kapattırır (KMK m. 36).

  **İşletme projesi (KMK m. 37).** Bir yıllık yönetim için tahmini gelir ve giderleri, her malike düşecek tahmini gider payını ve avans tutarını gösterir. Kesinleşen işletme projeleri ve kurulun işletme giderlerine ilişkin kararları **İİK m. 68/1'deki belgelerden sayılır** (KMK m. 37/4); alacaklı bu belgeye dayanan takipte itirazın kaldırılmasını, itirazın tebliğinden itibaren altı ay içinde isteyebilir (İİK m. 68/1). 📌 Bu bölüm 7579 sayılı Kanunla değişmiştir (bölüm 9).

  ### 7.3 Sorumluluk, hesap, haklar ve denetim (KMK m. 38-41)
  - **Sorumluluk:** Yönetici maliklere karşı **aynen bir vekil gibi** sorumludur (KMK m. 38/1).
  - **Hesap:** Planda gösterilen zamanda, yoksa her takvim yılının birinci ayında kurula verilir; maliklerin **yarısı** isterse ayrıca da istenebilir (KMK m. 39).
  - **Haklar:** Yönetici vekilin haklarına sahiptir; malikler borçlarını **noter ihtarına** rağmen yerine getirmezse tazminat ödemeden çekilebilir. Malikler arasından seçilen yönetici, aksine karar yoksa **normal yönetim giderlerinin yarısına katılmaz** (KMK m. 40).
  - **Denetim:** Kurul yöneticiyi sürekli denetler ve **haklı sebep** çıkarsa onu her zaman değiştirebilir. Hesap denetimi planda zaman yoksa **her üç ayda bir** yapılır; denetçi **sayı ve arsa payı çoğunluğuyla** seçilir (KMK m. 41).

  ### 7.4 Personel konutu
  Sözleşmesi sona eren kapıcı, bahçıvan, bekçi gibi görevliler ve dışarıdan atanan yönetici, tahsis edilen yeri **onbeş gün içinde** boşaltır; boşaltmazsa mülki amirin kararıyla zabıtaca boşalttırılır (Kat Mülkiyeti Kanunu'nun ek 2. maddesi).

  ## 8. Usul: mahkeme ve arabuluculuk

  - **Görevli mahkeme:** Kat Mülkiyeti Kanunu'nun ek 1. maddesine göre bu Kanunun uygulanmasından doğan her türlü anlaşmazlık **sulh mahkemelerinde** çözümlenir. HMK m. 4/1-ç de kanunların sulh hukuk mahkemesine verdiği davaları sulh hukuk mahkemesine bırakır.
  - **Dava şartı arabuluculuk:** HUAK m. 18/B/1-c'ye göre 634 sayılı Kat Mülkiyeti Kanunundan kaynaklanan uyuşmazlıklarda dava açılmadan önce **arabulucuya başvurulmuş olması dava şartıdır**. Bu hüküm 28/3/2023 tarihli 7445 sayılı Kanunla eklenmiştir ve 1/9/2023'te yürürlüğe girmiştir. HUAK'ın geçici 3. maddesine göre o tarihte görülmekte olan davalara uygulanmaz. Yargıtay'a göre kurul kararının iptali davası bu kapsamdadır; arabuluculuk yoksa dava usulden reddedilir.
  - **Anlaşma belgesi:** Taşınmazın devrine ilişkin arabuluculuk anlaşma belgesi icra edilebilirlik şerhi aldıktan sonra tapu müdürlüğünden tescil istenebilir ve tescil resmî senet düzenlenmeksizin yapılır (HUAK m. 18/B/5; 7531 sayılı Kanunla eklenmiştir).

  ## 9. 📌 Güncel değişiklikler: 7579 sayılı Kanun

  7579 sayılı Kanun **22 Mayıs 2026** tarihli Resmî Gazete'de yayımlanmıştır; KMK değişiklikleri yayım tarihinde yürürlüğe girmiştir.

  - **Avans (KMK m. 35/1-d).** Yönetici, planda gösterilen zamanda ya da her takvim yılının ilk ayında, işletme projesi onaylanıncaya kadar avans toplar.
  - **İşletme projesi (KMK m. 37).** İşletme projesi **kat malikleri genel kurulunda onaylanır**. Kurulca kabul edilmiş proje yoksa yönetici gecikmeksizin **geçici bir işletme projesi** yapar. Proje bildirilir ve en geç üç ay içinde aynen veya değiştirilerek kabulüne yönelik genel kurulda karar alınır (KMK m. 37/3).
  - **Artış tavanı.** Mevcut işletme projesi varsa geçici proje için öngörülen bedel, yürürlükteki proje bedeli esas alınarak, her yıl bir önceki yıla ilişkin olarak Vergi Usul Kanunu'nun mükerrer 298. maddesine göre ilan edilen **yeniden değerleme oranından fazla olmamak** kaydıyla belirlenir ve kurula sunulur.
  - **Toplu yapı.** Aynı Kanun, KMK'nın 70. maddesinde (toplu yapı) plan değişikliği nisabını beşte dörtten üçte ikiye indirmiştir; toplu yapı bu konunun dışındadır.

  > ⚠️ **Sınavda dikkat:** Üçte ikiye düşüş **yalnız toplu yapıdadır**. Ana yapıda yönetim planının değiştirilmesi için bütün kat maliklerinin **beşte dördünün oyu** hâlâ şarttır (KMK m. 28/3).

  > ⚠️ **Sınavda dikkat:** 7579 sayılı Kanun için ayrı bir geçiş hükmü bulunamamıştır; önceki işletme projelerine etkisi bu notta kesin yazılmamıştır.

  ## 10. Olay çözerken denetim şeması
  1. **Kişi ve konu:** Malik mi, kiracı mı? Bakım ve değişiklik, gider, katlanma, yasak iş, çıkarma ya da kurul kararı mı? (KMK m. 18-25, KMK m. 33)
  2. **Nisap:** Beşte dört, oybirliği ya da sayı ve arsa payı çoğunluğu (bölüm 5.4)? İkinci toplantıda özel nisap saklı mı? (KMK m. 30/3)
  3. **Toplantı:** Çağrı ve süreler (en az 15 gün; iki toplantı arası en az 7 gün), oy kullanamayanlar (KMK m. 29-31).
  4. **Yol:** İptal davası (bir ay ve altı ay), hâkimin müdahalesi, çıkarma davası; sulh hukuk mahkemesi, önce arabuluculuk, husumet yöneticiye.
  5. **Güncelleme:** Avans ve işletme projesi için 7579 sayılı Kanun sonrası metin.

kritik: |
  - 📌 Kat malikinin hakları KMK m. 15-16'dadır; borçları KMK m. 18'den başlar. Borçlar kiracıyı ve devamlı yararlananı da bağlar; bunlar malikle müteselsil sorumludur (KMK m. 18/2).
  - 📌 Ortak yerde inşaat, onarım, tesis ve değişik renkte dış boya için **bütün maliklerin beşte dördünün yazılı rızası** gerekir (KMK m. 19/2). Mahkemece tespit edilen acil onarım ve zorunlu güçlendirmede rıza aranmaz.
  - 📌 Kapıcı, kaloriferci, bahçıvan ve bekçi giderleri ile avansı **eşit**; sigorta, bakım, onarım, güçlendirme ve yönetici aylığı gibi giderler **arsa payı oranında** paylaşılır (KMK m. 20/1). Kullanmama ya da ihtiyaç olmaması gider payını ödememe sebebi olmaz (KMK m. 20/1-c).
  - 📌 Gecikme tazminatı geciken günler için **aylık yüzde beş**tir (KMK m. 20/2). Eski yüzde on 5711 sayılı Kanunla indirilmiştir.
  - ⚠️ Kiracının ortak gider sorumluluğu **kira miktarıyla sınırlıdır** ve ödemesi kira borcundan düşer (KMK m. 22/1).
  - 📌 Kanuni ipotek için borç **mahkemece tespit edilmiş** ve diğer sorumlulardan alınamamış olmalı; yazılı istemi varsa yönetici yoksa maliklerden biri yapar. Önceden feragat geçersizdir (KMK m. 22/2; TMK m. 893).
  - ⚠️ Klinik, poliklinik gibi yerler oybirliğiyle bile kurulamaz (KMK m. 24/1); meskende lokanta, pastane, dükkân ancak **oybirliğiyle** açılır (KMK m. 24/2).
  - ⚠️ Çıkarma davası kararı **sayı ve arsa payı çoğunluğuyla** alınır (KMK m. 25/2). KMK m. 25/3'te "üçte iki oy" ya da "süreli ihtar" şartı yoktur; m. 25/3 yalnız çekilmezliği var sayar.
  - 📌 KMK m. 25/3-a: iki takvim yılı içinde üç defa icra veya dava takibine sebep olmak. Dava hakkı kararın öğrenilmesinden **6 ay**, her hâlde doğumundan **5 yıl** içinde kullanılır (KMK m. 25/4).
  - 📌 Yönetim planı sözleşme hükmündedir; değiştirmek için bütün maliklerin **beşte dördünün oyu** şarttır (KMK m. 28/1, KMK m. 28/3). Ana yapıda bu nisap 7579 sayılı Kanunla değişmemiştir.
  - 📌 Olağanüstü toplantıyı yönetici, denetçi veya maliklerin **üçte biri** ister; çağrı en az **15 gün** önce yapılır. İki toplantı arası en az **7 gün**, ikinci toplantı en geç 15 gün sonra, karar yeter sayısı katılanların **salt çoğunluğu** (KMK m. 29, KMK m. 30/2).
  - 📌 Her malikin bir oyu vardır; çok bölümlü malikin oyu bütün oyların üçte birini aşamaz. Kararla ilgili malik oy kullanamaz. Kırk ve daha az bölümlü yapıda bir kişi en fazla iki kişiye vekâlet edebilir (KMK m. 31).
  - 📌 İptal davası sulh mahkemesindedir: aykırı oy veren karar tarihinden, katılmayan öğrenmeden itibaren **bir ay**; her hâlde karar tarihinden **altı ay**. Yok ve mutlak butlanda süre aranmaz (KMK m. 33/1).
  - 📌 Sekiz veya daha fazla bölümde yönetici zorunludur; sayı ve arsa payı çoğunluğuyla ve her yıl atanır (KMK m. 34). Yönetici vekil gibi sorumludur, iptal davası yöneticiye husumet yöneltilerek açılabilir (KMK m. 38).
  - 📌 Dava şartı arabuluculuk (HUAK m. 18/B/1-c); görevli mahkeme sulh hukuk mahkemesidir. 7579 sayılı Kanunla (22/5/2026) avans işletme projesi onaylanıncaya kadar toplanır ve projeyi genel kurul onaylar (KMK m. 35/1-d, KMK m. 37).

doktrin: |
  ### Hangi kurul kararı yok ya da mutlak butlanla hükümsüzdür?
  KMK m. 33/1 yok ve mutlak butlan hâllerinde süre koşulu aramaz ama bu hâlleri saymaz. Bir görüşe göre toplantı yapılmadan defter üzerinde alınan kararlar ve kurulun yetkisi dışındaki konulardaki kararlar yok sayılmalı; emredici nisaba aykırı kararlar (örneğin salt çoğunlukla yönetim planının değiştirilmesi) mutlak butlanla hükümsüz kabul edilmelidir. Karşı görüşe göre nisap eksikliği yalnız iptal sebebidir ve süreye bağlıdır. Yargıtay ise bu ayrımı toptan yapmaz; süre geçtiğinde her kararın tek tek yokluk ve mutlak butlan yönünden incelenmesini ister. Sınavda iki görüşü yaz, olayda süre geçmemişse tartışmaya girmeden iptal davasıyla çöz.

  ### KMK m. 25/3'teki karinenin niteliği
  Kanun, sayılan üç hâlde çekilmezliğin "her halde mevcut farz edileceğini" söyler. Bir görüş bunu kesin karine sayar ve aksinin ispatına izin vermez. Karşı görüş, KMK m. 25/4'teki "dava sebebinin ortadan kalkması" kuralına ve dürüstlük kuralına dayanarak esnek yorum ister. Metne bağlı kal: karine vardır, ama dava kararı KMK m. 25/2'deki çoğunlukla verilmeden dava açılamaz.

  ### Gecikme tazminatının niteliği
  Aylık yüzde beşlik tazminatın faiz mi yoksa götürü bir kanuni tazminat mı olduğu, ayrıca yanında faiz istenip istenemeyeceği tartışmalıdır. Kanun yalnız oranı verir. Sınavda oranı ve geciken günler için işlediğini yaz, niteliği "tartışmalıdır" diye işaretle.

  ### Toplantıdaki "oy çokluğu"
  KMK m. 30/1 toplantı nisabını açıkça sayı ve arsa payı bakımından yarıdan fazla olarak koyar; bu konuda tartışma yoktur. Karar için "oy çokluğu" ifadesinin katılanların çokluğu mu yoksa sayı ve arsa payı çoğunluğu mu anlamına geldiği ise tartışmalıdır. Özel nisap aranan işlerde bu tartışma önemini yitirir.

  ### Ev hayvanı ve yönetim planı
  Yönetim planında hayvan yasağı varsa bunun tek başına yeterli olup olmadığı yoksa KMK m. 18 anlamında somut bir rahatsızlığın aranıp aranmayacağı tartışmalıdır. Bu konuda karar okunmamıştır; bu notta bir sonuç verilmemiştir.

  ### Olumlu oy veren malik
  KMK m. 33/1, iptal davası açabilenler olarak toplantıya katılıp aykırı oy kullananı ve katılmayanı sayar; karara olumlu oy veren malikin durumu metinde yoktur. Yok veya mutlak butlan iddiası bakımından bu malikin dava açıp açamayacağı bu notta kesin olarak yazılmamıştır.

sozluk:
  - terim: Kat malikleri kurulu
    tanim: "Anagayrimenkulün yönetim organı; bütün kat maliklerinden oluşur ve kanunun emredici hükümleri saklı kalmak şartıyla yönetim tarzını kararlaştırır (KMK m. 27)."
  - terim: Yönetim planı
    tanim: "Yönetim tarzını, kullanma şeklini ve yönetime ait diğer hususları düzenleyen, bütün maliklere ve haleflerine bağlayıcı sözleşme niteliğindeki belge. Değiştirmek için bütün maliklerin beşte dördünün oyu gerekir (KMK m. 28)."
  - terim: Gecikme tazminatı
    tanim: "Gider ve avans payını ödemeyen malikin ödemede geciktiği günler için ödediği, aylık yüzde beş hesaplanan tazminat (KMK m. 20/2)."
  - terim: Avans
    tanim: "Ortak giderler için kat maliklerinden toplanan ön ödeme. 7579 sayılı Kanundan sonra işletme projesi onaylanıncaya kadar toplanır (KMK m. 35/1-d)."
  - terim: Kanuni ipotek
    tanim: "Mahkemece tespit edilen ve başka yoldan alınamayan ortak gider borcu için borçlu malikin bağımsız bölümü üzerine diğer malikler lehine tescil edilen ipotek (KMK m. 22/2)."
  - terim: Çekilmezlik
    tanim: "Maliklerden birinin borçlarını ihlalinin diğerleri için katlanılamaz hâle gelmesi; bu durumda bölümünün devri istenebilir (KMK m. 25)."
  - terim: Devir (çıkarma) davası
    tanim: "Çekilmez malikin bölümünün, hükme en yakın tarihteki değeri ödenerek davacı maliklere arsa payları oranında devrini isteyen dava (KMK m. 25/2)."
  - terim: Hâkimin müdahalesi
    tanim: "Borç ve yükümlerini yerine getirmeyen malik veya yararlanan yüzünden zarar görenlerin sulh mahkemesinden istediği, hakkaniyete göre derhâl verilen karar (KMK m. 33)."
  - terim: İptal davası
    tanim: "Kat malikleri kurulu kararının sulh mahkemesinde ortadan kaldırılmasını isteyen, bir ay ve altı ay süreye bağlı dava (KMK m. 33/1)."
  - terim: Yok ve mutlak butlan
    tanim: "Kurul kararının en ağır sakatlıkları; bu hâllerde iptal davasının süre koşulu aranmaz (KMK m. 33/1). Hangi kararların bu kapsamda olduğu kanunda sayılmamıştır."
  - terim: Yönetici
    tanim: "Anagayrimenkulün yönetimini üstlenen kimse; sekiz veya daha fazla bölümde atanması zorunludur ve maliklere karşı vekil gibi sorumludur (KMK m. 34, KMK m. 38)."
  - terim: İşletme projesi
    tanim: "Bir yıllık yönetimin tahmini gelir ve giderlerini ve her malike düşen payı ile avansı gösteren plan. Kesinleşen proje İİK m. 68/1'deki belgelerden sayılır (KMK m. 37)."
  - terim: Katlanma yükümlülüğü
    tanim: "Başka bölümdeki onarım ve teknik inceleme için giriş müsaadesi verme ve işlerin yapılmasına razı olma borcu; doğan zararı lehine izin verilenler öder (KMK m. 23)."
  - terim: Toplu yapı
    tanim: "Birden çok yapıdan oluşan site; bu notun kapsamı dışındadır. KMK'nın 70. maddesindeki plan değişikliği nisabı 7579 sayılı Kanunla beşte dörtten üçte ikiye indirilmiştir."

kararlar:
  - id: "1231257000"
    ozet: |
      On dört bölümlü bir apartmanda 28.03.2019 tarihli olağanüstü toplantı yapılmış, davacı kat maliki toplantının usulsüz çağrıyla yapıldığını ileri sürerek toplantının ve KMK m. 25'e ilişkin kararın iptalini istemiştir. Davacı toplantıda vekili aracılığıyla hazır bulunmuştur. İlk derece sulh hukuk mahkemesi davayı kabul etmiş, bölge adliye mahkemesi kararı kaldırarak davayı reddetmiştir. Gerekçesine göre çağrı usulü sıkı şekle bağlı olsa da toplantıya katılan malikin çağrı usulsüzlüğüne dayanması iyiniyetle bağdaşmaz; KMK m. 25'in şartları ve çekilmezlik de ancak yönetimin açacağı devir davasında tartışılabilir. Yargıtay 5. Hukuk Dairesi, toplantının olağanüstü toplantı olduğunu ve alınan kararın usulüne uygun bulunduğunu belirterek değişik gerekçeyle verilen ret kararında isabetsizlik görmemiş ve kararı oybirliğiyle onamıştır. Konuya katkısı: Onanan bölge adliye mahkemesi gerekçesine göre toplantıya katılan malik çağrı usulsüzlüğünü iptal sebebi yapamaz; çıkarma davası açma kararına karşı ayrı iptal davasında hukuki yarar yoktur.
  - id: "1228329700"
    ozet: |
      Yedi bölümlü bir yapıda 09.12.2016'da güçlendirme kararı alınmıştır. Davacı, kararın 5/7 oyla alındığını, beşte dört gerektiğini ve kararın yok hükmünde olduğundan süre sınırı bulunmadığını ileri sürmüş, ancak dava öncesinde arabulucuya başvurmamıştır. İlk derece sulh hukuk mahkemesi, uyuşmazlığın dava şartı arabuluculuğa tabi olduğunu ve eksikliğin sonradan giderilemeyeceğini belirterek davayı usulden reddetmiştir. Bölge adliye mahkemesi ise kat mülkiyetinin kurulduğunu ve KMK'nin uygulanacağını belirterek davacının istinaf başvurusunu esastan reddetmiştir. Yargıtay 5. Hukuk Dairesi kararı oybirliğiyle onamıştır. Konuya katkısı: Kurul kararının iptali davası HUAK m. 18/B/1-c kapsamındadır; arabuluculuk yoksa dava usulden reddedilir. Yokluk iddiası Yargıtayca ayrıca tartışılmamıştır, bu yüzden karar bu yönden genişletilmemelidir.
  - id: "659514200"
    ozet: |
      Davacı, 30.09.2011 tarihli toplantıda yeter sayının bulunmadığını, sahte imza atıldığını ve çağrı tebligatlarının yapılmadığını ileri sürmüş, dava 04.06.2012'de açılmıştır. Sulh hukuk mahkemesi toplantının ve kararların iptaline karar vermiştir. Yargıtay 5. Hukuk Dairesi, KMK m. 33/1'deki bir ay ve altı aylık sürelerin hak düşürücü olduğunu, süre geçtiğinde yalnız yok veya mutlak butlanla sakat kararların incelenebileceğini belirtmiş ve her kararın bu yönden ayrı ayrı değerlendirilmesi gerekirken eksik incelemeyle kabul kararı verildiği gerekçesiyle kararı oybirliğiyle bozmuştur. Konuya katkısı: İptal davası süreleri hak düşürücüdür; süre geçtikten sonra her karar tek tek yokluk ve mutlak butlan yönünden incelenir.

sorular:
  - soru: |
      Aralarında başka türlü anlaşma bulunmayan bir apartmanda kapıcı, kaloriferci, bahçıvan ve bekçi giderleri ile bunlar için toplanacak avans kat maliklerince nasıl paylaşılır?
    siklar:
      - "Eşit olarak"
      - "Arsa payı oranında"
      - "Faydalanma oranında"
      - "Bağımsız bölümün büyüklüğüne göre kurulun belirleyeceği oranda"
    dogru: 0
    aciklama: |
      KMK m. 20/1-a, personel giderlerini ve bunların avansını eşit paylaştırır. Sigorta, bakım, onarım, güçlendirme ve yönetici aylığı gibi diğer giderler ise arsa payı oranında paylaşılır (KMK m. 20/1-b). Faydalanma oranı faydalı yeniliklerin giderinde söz konusudur (KMK m. 42/3).
  - soru: |
      Aşağıdakilerden hangisi bir kat malikinin ortak yerlerde inşaat yaptırabilmesi ya da dış cepheyi değişik renkte boyatabilmesi için aranan şarttır?
    siklar:
      - "Bütün kat maliklerinin oybirliğiyle verdiği karar"
      - "Bütün kat maliklerinin beşte dördünün yazılı rızası"
      - "Toplantıya katılanların beşte dördünün sözlü onayı"
      - "Sayı ve arsa payı çoğunluğunun kararı"
    dogru: 1
    aciklama: |
      KMK m. 19/2'ye göre ortak yerlerde inşaat, onarım, tesis ve değişik renkte dış badana veya boya için bütün kat maliklerinin beşte dördünün yazılı rızası gerekir. Nisap toplantıya katılanlara göre değil bütün maliklere göre hesaplanır ve rıza yazılı olmalıdır.
  - soru: |
      Yönetim planında ve malikler arasında gider paylaşımına ilişkin özel bir hüküm yoktur. Zemin kattaki dükkânın maliki Nilay, asansörü hiç kullanmamaktadır ve bu yüzden asansörün bakım giderine katılmayacağını söylemektedir. Nilay'ın durumu için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Dükkânı asansörden faydalanmadığı için gidere katılmaz"
      - "Yalnız kullanma hakkından yazılı olarak vazgeçerse katılmaz"
      - "Gidere arsa payı oranında katılmak zorundadır"
      - "Gidere yarı oranında katılır"
    dogru: 2
    aciklama: |
      Asansör bakımı ortak yerlere ilişkin bir bakım giderine girer ve arsa payı oranında paylaşılır (KMK m. 20/1-b). KMK m. 20/1-c uyarınca malik, kullanma hakkından vazgeçerek ya da kendi bölümünün durumu nedeniyle faydalanmaya lüzum olmadığını ileri sürerek gider payını ödemekten kaçınamaz.
  - soru: |
      Ortak gider ve avans payını ödemeyen kat malikinin ödemede geciktiği günler için ödemekle yükümlü olduğu gecikme tazminatı oranı aşağıdakilerden hangisidir?
    siklar:
      - "Aylık yüzde on"
      - "Yıllık yüzde beş"
      - "Aylık yüzde beş"
      - "Yalnızca yasal faiz"
    dogru: 2
    aciklama: |
      KMK m. 20/2'ye göre gider ve avans payını ödemeyen malik ödemede geciktiği günler için aylık yüzde beş hesabıyla gecikme tazminatı öder. Yüzde on oranı 5711 sayılı Kanundan önceki metindeydi, değiştirilmiştir.
  - soru: |
      Yönetici Ali, aidat borcunu ödemeyen Burcu'nun bağımsız bölümü üzerine diğer kat malikleri lehine kanuni ipotek tescil ettirmek istemektedir. Bunun için aşağıdakilerden hangisi aranır?
    siklar:
      - "Kurulun oybirliğiyle ipotek kararı vermesi"
      - "Borcun mahkemece tespit edilmiş olması ve bu yolla da alınamaması"
      - "Borçluya noter aracılığıyla iki aylık süreli ihtar çekilmesi"
      - "İki takvim yılı içinde üç kez icra takibi yapılmış olması"
    dogru: 1
    aciklama: |
      KMK m. 22/2'ye göre kanuni ipotek, borç kiracı ve diğer sorumlulardan alınamazsa ve borç mahkemece tespit edilmişse, yöneticinin yazılı istemiyle tescil edilir. Noter ihtarı ve iki ay KMK m. 26/2'ye (kat irtifakı), iki yılda üç takip ise KMK m. 25/3-a'ya (çekilmezlik karinesi) aittir.
  - soru: |
      Kiracı Mehmet'in oturduğu dairenin maliki ortak gider borcunu ödememiştir. Mehmet'in bu borçtan sorumluluğu hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Mehmet hiç sorumlu değildir; borç yalnız malikindir"
      - "Mehmet sınırsız ve tek başına sorumludur"
      - "Mehmet, malikle müteselsil sorumludur; ancak sorumluluğu ödemekle yükümlü olduğu kira miktarıyla sınırlıdır"
      - "Mehmet yalnızca yönetici kendisine ihtar çekmişse sorumludur"
    dogru: 2
    aciklama: |
      KMK m. 22/1 gider, avans ve gecikme tazminatı borcundan kiracı gibi devamlı yararlananların da müştereken ve müteselsilen sorumlu olduğunu, ancak kiracının sorumluluğunun ödemekle yükümlü olduğu kira miktarıyla sınırlı olduğunu ve yaptığı ödemenin kira borcundan düşeceğini söyler.
  - soru: |
      Binanın kütükte mesken olarak kayıtlı zemin kat bölümünde lokanta açılması için aşağıdakilerden hangisi gerekir?
    siklar:
      - "Kat malikleri kurulunun sayı ve arsa payı çoğunluğuyla karar vermesi"
      - "Bütün kat maliklerinin beşte dördünün yazılı rızası"
      - "Kat malikleri kurulunun oybirliğiyle karar vermesi"
      - "İzin gerekmez; lokanta açılması serbesttir"
    dogru: 2
    aciklama: |
      KMK m. 24/2'ye göre kütükte mesken olarak gösterilen bölümde fırın, lokanta, pastahane gibi gıda yerleri ancak kat malikleri kurulunun oybirliğiyle vereceği kararla açılabilir. Beşte dört KMK m. 19/2 ve KMK m. 28/3'ün nisabıdır.
  - soru: |
      Dr. Kemal, kütükte ticaret yeri olarak kayıtlı bir bağımsız bölümde poliklinik açmak istemektedir. Bütün kat malikleri buna yazılı olarak izin vermektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Bütün maliklerin izni olduğu için poliklinik açılabilir"
      - "Kurul sayı ve arsa payı çoğunluğuyla izin verirse açılabilir"
      - "Poliklinik kurulamaz; buna aykırı sözleşmeler hükümsüzdür"
      - "Poliklinik ancak sulh hâkiminin kararıyla açılabilir"
    dogru: 2
    aciklama: |
      KMK m. 24/1'e göre kütükte mesken, iş veya ticaret yeri olarak gösterilen bölümde hastane, dispanser, klinik, poliklinik gibi müesseseler kurulamaz ve kat maliklerinin buna aykırı sözleşmeleri hükümsüzdür. Oybirliği bu yasağı aşmaz; oybirliği ile aşılabilen yasak, meskene ilişkin KMK m. 24/2'dir. Yalnızca klinik niteliğinde olmayan muayenehaneler bu yasağın dışındadır.
  - soru: |
      Kat maliki Tolga'nın bağımsız bölümünün diğer maliklere devrini isteyen dava için kat maliklerince alınması gereken karar hangi çoğunlukla verilir?
    siklar:
      - "Bütün kat maliklerinin oybirliğiyle"
      - "Diğer kat maliklerinin üçte iki oyuyla"
      - "Bütün kat maliklerinin beşte dördüyle"
      - "Aksi kararlaştırılmadıkça diğer kat maliklerinin sayı ve arsa payı çoğunluğuyla"
    dogru: 3
    aciklama: |
      KMK m. 25/2'ye göre davanın açılması, aksi kararlaştırılmış olmadıkça, diğer kat maliklerinin sayı ve arsa payı çoğunluğuyla karar vermesine bağlıdır. KMK m. 25/3'teki hâller çekilmezliği var sayar ama başka bir oy oranı öngörmez.
  - soru: |
      Kat maliki Tolga, 2024 ve 2025 takvim yıllarında aidat borcunu ödemediği için üç kez icra takibine sebep olmuştur. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Çekilmezlik var sayılır; dava açılması için ayrıca süreli ihtar çekilmesi şarttır"
      - "Çekilmezlik var sayılır; davanın açılması diğer maliklerin sayı ve arsa payı çoğunluğuyla vereceği karara bağlıdır"
      - "Çekilmezlik ancak üç yıl üst üste takip yapılırsa var sayılır"
      - "Tolga'nın bölümü kendiliğinden diğer maliklere geçer"
    dogru: 1
    aciklama: |
      KMK m. 25/3-a'ya göre ortak gider ve avans borcunu ödemediği için iki takvim yılı içinde üç defa icra veya dava takibi yapılmasına sebep olunması hâlinde çekilmezlik her halde mevcut farz edilir. Dava açmak için kanunda süreli ihtar aranmaz; karar KMK m. 25/2'ye göre sayı ve arsa payı çoğunluğuyla alınır. Mülkiyet kendiliğinden geçmez, hâkim kararıyla devredilir.
  - soru: |
      KMK m. 25'e dayanan çıkarma davası hakkı hangi sürelerin geçmesiyle düşer?
    siklar:
      - "Dava açma kararının öğrenilmesinden bir ay, her hâlde altı ay"
      - "Dava açma kararının öğrenilmesinden altı ay, her hâlde dava hakkının doğumundan beş yıl"
      - "Dava açma kararının öğrenilmesinden iki ay, her hâlde bir yıl"
      - "Karar tarihinden on yıl"
    dogru: 1
    aciklama: |
      KMK m. 25/4 dava hakkının, dava açma kararının öğrenilmesi tarihinden başlayarak altı ay ve her halde dava hakkının doğumundan başlayarak beş yıl içinde kullanılmaması hâlinde ya da dava sebebinin ortadan kalkması hâlinde düştüğünü söyler. Bir ay ve altı ay ise kurul kararının iptal davası sürelerinin (KMK m. 33/1) karşılığıdır.
  - soru: |
      Kat irtifakı sahibi bir paydaşın borcunu yerine getirmemesi hâlinde diğer paydaşların onun payının devrini isteyebilmesi için aşağıdakilerden hangisi aranır?
    siklar:
      - "Noter aracılığıyla ihtar yapılması ve ihtar tarihinden başlayarak iki ay içinde borcun yerine getirilmemesi"
      - "İki takvim yılında üç icra takibi"
      - "Kurulun üçte iki oyla karar vermesi"
      - "Sulh hâkiminin bir yıl süreli emrine uyulmaması"
    dogru: 0
    aciklama: |
      KMK m. 26/2'ye göre kat irtifakı sahibi, noter aracılığıyla yapılan ihtara rağmen ihtar tarihinden başlayarak iki ay içinde borcunu yerine getirmezse diğerlerinin yazılı istemiyle hâkim payın devrine karar verir. İki yılda üç takip ve bir yıllık ısrar kat mülkiyetindeki KMK m. 25/3 hâlleridir.
  - soru: |
      Gül Apartmanı 20 bölümlüdür ve toplu yapı değildir. İlk toplantı yeter sayı sağlanamadığı için yapılamamış, ikinci toplantıya katılan 9 malikten 6'sı yönetim planının değiştirilmesi yönünde oy kullanmıştır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Karar geçerlidir; ikinci toplantıda katılanların salt çoğunluğu yeter"
      - "Karar geçerlidir; çünkü karar sayı çoğunluğuyla alınmıştır"
      - "Plan değişikliği için bütün kat maliklerinin beşte dördünün oyu gerekir; 6 oy bu nisabı karşılamaz"
      - "Plan değişikliği için hiçbir nisap aranmaz"
    dogru: 2
    aciklama: |
      KMK m. 28/3 yönetim planının değiştirilmesi için bütün kat maliklerinin beşte dördünün oyunu şart koşar. İkinci toplantıdaki salt çoğunluk (KMK m. 30/2) genel kural olup Kanundaki özel yeter sayılar saklıdır (KMK m. 30/3). Bu nedenle 20 bölümlü binada 6 oy yeterli değildir.
  - soru: |
      İlk toplantı yeter sayının sağlanamaması nedeniyle yapılamayan bir kat malikleri kurulunda ikinci toplantı ve karar yeter sayısı için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İki toplantı arasında en az yedi gün bırakılır; ikinci toplantı en geç onbeş gün sonra yapılır ve karar yeter sayısı katılanların salt çoğunluğudur"
      - "İki toplantı arasında en az onbeş gün bırakılır; karar için bütün maliklerin yarısı gerekir"
      - "İkinci toplantı bir ay sonra yapılır; katılanların beşte dördü gerekir"
      - "İkinci toplantı aynı gün yapılabilir; oybirliği gerekir"
    dogru: 0
    aciklama: |
      KMK m. 29/3 ilk ve ikinci toplantı arasında yedi günden az zaman bırakılamayacağını söyler. KMK m. 30/2'ye göre ikinci toplantı en geç onbeş gün sonra yapılır ve karar yeter sayısı katılanların salt çoğunluğudur. Kanundaki özel yeter sayılar bu kuraldan etkilenmez.
  - soru: |
      Kat malikleri kurulu, malik sıfatıyla yönetici de olan Murat'ın geçmiş dönem hesaplarının kabulü ve kendisinin ibrası konusunu görüşmektedir. Murat'ın bu oylamadaki durumu için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Görüşmede bulunabilir ve oy kullanabilir"
      - "Görüşmede bulunamaz ve oy kullanamaz"
      - "Görüşmede bulunabilir ancak oya katılamaz"
      - "Yalnız oyu ikiye bölünerek sayılır"
    dogru: 2
    aciklama: |
      KMK m. 31/4'e göre alınacak karar doğrudan doğruya kendini ilgilendiren kat maliki görüşmelerde hazır bulunabilir ama oya katılamaz.
  - soru: |
      36 bağımsız bölümlü bir apartmanda Fatma, toplantıda oy kullanmak üzere birçok komşusundan vekâlet toplamak istemektedir. Fatma en fazla kaç kişiye vekâlet edebilir?
    siklar:
      - "Yalnız bir kişiye"
      - "En fazla iki kişiye"
      - "En fazla beş kişiye"
      - "Sınırsız sayıda kişiye"
    dogru: 1
    aciklama: |
      KMK m. 31/5'e göre bir kişi oy sayısının yüzde beşinden fazlasını kullanmak üzere vekil tayin edilemez; ancak kırk ve daha az sayıdaki kat mülkiyetine tabi taşınmazlarda bir kişi en fazla iki kişiye vekâlet edebilir.
  - soru: |
      Kat malikleri kurulu 5 Mart'ta bir karar almıştır. Toplantıya katılmayan Can kararı 20 Mart'ta öğrenmiştir. Can'ın iptal davası açabileceği süre için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Karar tarihinden itibaren bir ay içinde"
      - "Öğrenmeden itibaren altı ay içinde"
      - "Öğrenmeden itibaren bir ay ve her halde karar tarihinden itibaren altı ay içinde"
      - "Süre sınırı yoktur"
    dogru: 2
    aciklama: |
      KMK m. 33/1'e göre toplantıya katılmayan malik kararı öğrenmesinden başlayarak bir ay içinde ve her halde karar tarihinden başlayarak altı ay içinde sulh mahkemesine iptal davası açabilir. Aykırı oy veren ise karar tarihinden itibaren bir ay içinde açar. Süre koşulu yalnız yok veya mutlak butlanla hükümsüz sayılan kararlarda aranmaz.
  - soru: |
      Kat malikleri kurulu kararının iptali için dava açacak malik için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Asliye hukuk mahkemesine doğrudan dava açabilir"
      - "Arabulucuya başvurmadan sulh hukuk mahkemesine dava açabilir"
      - "Önce arabulucuya başvurmuş olması gerekir; dava sulh mahkemesinde açılır"
      - "Önce kat maliklerinin oybirliği kararı alınması gerekir"
    dogru: 2
    aciklama: |
      Kat Mülkiyeti Kanunu'nun ek 1. maddesi ve HMK m. 4/1-ç uyarınca görevli mahkeme sulh hukuk mahkemesidir. HUAK m. 18/B/1-c ise 634 sayılı Kat Mülkiyeti Kanunundan kaynaklanan uyuşmazlıklarda dava açılmadan önce arabulucuya başvurulmasını dava şartı yapar; Yargıtay iptal davasını bu kapsamda sayar.
  - soru: |
      Dokuz bağımsız bölümlü bir apartmanda hiç yönetici atanmamıştır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yönetici atanması isteğe bağlıdır; hiçbir sonuç doğmaz"
      - "Yönetici atanması mecburidir; atanmamışsa yöneticinin yapması gereken işlerin yaptırılmasından kat malikleri müştereken sorumludur"
      - "Yönetici ancak sekiz bölümden fazla yapılarda zorunludur ve atamayı noter yapar"
      - "Yönetici yalnız arsa payı çoğunluğuyla atanır ve atanmamışsa bina kurul tarafından yönetilmez"
    dogru: 1
    aciklama: |
      KMK m. 34/2'ye göre sekiz veya daha fazla bağımsız bölüm varsa yönetici atanması mecburidir. KMK m. 35'in son fıkrası, bu şartlar varken yönetici atanmamışsa yöneticinin görevi sayılan işlerin yaptırılmasından kat maliklerinin müştereken sorumlu olduğunu söyler. Yönetici hem sayı hem arsa payı çoğunluğuyla atanır, anlaşılamazsa sulh mahkemesi atar.
  - soru: |
      7579 sayılı Kanun (RG 22/5/2026) ile Kat Mülkiyeti Kanunu'nda yapılan değişikliklerle ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Ana yapıda yönetim planının değiştirilmesi için aranan nisap beşte dörtten üçte ikiye indirilmiştir"
      - "Gecikme tazminatı aylık yüzde ona çıkarılmıştır"
      - "İşletme projesini kat malikleri genel kurulu onaylar ve avans işletme projesi onaylanıncaya kadar toplanır"
      - "Kurul kararlarının iptali davası artık asliye hukuk mahkemesinde açılır"
    dogru: 2
    aciklama: |
      KMK m. 35/1-d avansın işletme projesi onaylanıncaya kadar toplanmasını söyler; KMK m. 37/1 ise işletme projesinin kat malikleri genel kurulunda onaylanacağını belirtir. Beşte dörtten üçte ikiye düşüş yalnız toplu yapıya ilişkindir; ana yapıda KMK m. 28/3 değişmemiştir. Gecikme tazminatı aylık yüzde beştir (KMK m. 20/2) ve görevli mahkeme sulh hukuk mahkemesidir.

olaylar:
  - olay: |
      Papatya Apartmanı 12 bağımsız bölümlüdür ve yönetici Ali tarafından yönetilmektedir. Ayşe, 3 numaralı dairesini aylık 20.000 TL kira bedeliyle Mehmet'e kiralamıştır. Ayşe aylık aidatlarını ödemediği için 2024 ve 2025 takvim yıllarında toplam üç kez icra takibine sebep olmuştur. Ali, 2026 yılı aidat borcu için de bir ödeme alamamıştır; aylık aidat 3.000 TL'dir. Ali borcun tahsili için kiracı Mehmet'e de başvurmuş, Mehmet "ben yalnız kira öderim, aidat malikin borcudur" demiştir. Ayşe, daha önceki takiplerde de ödemeyi hep son anda ve icra baskısıyla yapmıştır. Diğer malikler, Ayşe'nin bu tutumunu artık sürdürmesini istememekte ve bölümünün kendilerine devredilmesini konuşmaktadır.

      1. Ayşe'nin ve Mehmet'in ortak gider borcundan sorumluluğu ile gecikme tazminatı hakkında ne söylenebilir?
      2. Ali, borcun güvencesi olarak Ayşe'nin dairesi üzerine hangi hakkı tescil ettirebilir? Şartları nelerdir?
      3. Diğer malikler Ayşe'nin dairesinin kendilerine devrini isteyebilir mi? Dava hangi çoğunlukla ve hangi süre içinde açılır, nasıl bir yol izlenir?
      4. Görevli mahkeme hangisidir ve dava öncesinde ne yapılmalıdır?
    olcut:
      - {tespit: "Ayşe'nin ve kiracı Mehmet'in müteselsil sorumluluğu; Mehmet'in sorumluluğunun ödemekle yükümlü olduğu kira miktarıyla sınırlı olması ve ödemesinin kira borcundan düşmesi", puan: 20, madde: "KMK m. 22/1"}
      - {tespit: "Gecikme tazminatının geciken günler için aylık yüzde beş olması", puan: 10, madde: "KMK m. 20/2"}
      - {tespit: "Kanuni ipoteğin şartları: mahkemece tespit edilmiş ve diğer yollarla alınamayan borç, yöneticinin yazılı istemi; feragatin geçersizliği", puan: 20, madde: "KMK m. 22/2"}
      - {tespit: "İki takvim yılı içinde üç takip nedeniyle çekilmezliğin her halde var sayılması", puan: 15, madde: "KMK m. 25/3"}
      - {tespit: "Dava açma kararının sayı ve arsa payı çoğunluğuyla alınması; bedelin hükme en yakın değeri üzerinden üç aylık vadeli hesaba yatırılması ve arsa payları oranında devir", puan: 15, madde: "KMK m. 25/2"}
      - {tespit: "Dava hakkının öğrenmeden altı ay ve her halde beş yıl içinde kullanılması", puan: 5, madde: "KMK m. 25/4"}
      - {tespit: "Sulh hukuk mahkemesinin görevi ve dava şartı arabuluculuk", puan: 15, madde: "HUAK m. 18/B"}
    cozum: |
      **Nitelendirme:** Olay, ortak gider borcunun ödenmemesi, bu borcun kiracıya ve bölüm üzerine yansıması ve borçlarını ihlal eden malikin bölümünün çıkarılması (KMK m. 25) sorunlarını içerir.

      **Hukuki sorunlar:** (1) Kimin, hangi ölçüde ve hangi tazminatla sorumlu olduğu; (2) kanuni ipotek; (3) çıkarma davasının şartları, çoğunluğu ve süresi; (4) görev ve arabuluculuk.

      **İlgili hükümler:** KMK m. 20/2, 22/1-2, 25/2-4, 26 ile karşılaştırma; TMK m. 893; HMK m. 4/1-ç; HUAK m. 18/B/1-c; Kat Mülkiyeti Kanunu'nun ek 1. maddesi.

      **Değerlendirme:**

      *1. Sorumluluk ve gecikme tazminatı:* Ortak giderler malikin borcudur. Ancak bölümde kira akdine dayanarak devamlı yararlanan kiracı da gider, avans ve gecikme tazminatı borcundan malikle müştereken ve müteselsilen sorumludur. Kiracının sorumluluğu ödemekle yükümlü olduğu kira miktarıyla sınırlıdır ve yaptığı ödeme kira borcundan düşer (KMK m. 22/1). Mehmet'in "aidat yalnız malikin borcudur" savunması bu yüzden yerinde değildir: Mehmet de sorumludur; ancak sorumluluğu ödemekle yükümlü olduğu kira miktarıyla sınırlıdır ve Ali'ye yaptığı ödeme kira borcundan düşer. Ayşe ise borcun asıl sorumlusudur. Ödemede geciktiği her gün için aylık yüzde beş hesabıyla gecikme tazminatı da öder (KMK m. 20/2). Gidere birinin kusurlu hareketi sebep olmuşsa rücu da mümkündür (KMK m. 20/3).

      *2. Kanuni ipotek:* Borç kiracıdan da alınamazsa ve borç mahkemece tespit edilmişse, yöneticinin yazılı istemiyle Ayşe'nin bağımsız bölümü üzerine borç tutarı için diğer malikler lehine kanuni ipotek tescil edilir (KMK m. 22/2). İki şart birliktedir: borç diğer yollarla da alınamamış olmalı ve mahkemece tespit edilmiş olmalıdır. Bu ipotekten önceden feragat geçersizdir (TMK m. 893 son fıkra). Maliklerin gider alacağı ayrıca önceliklidir (KMK m. 22/3). Ali yönetici sıfatıyla dava ve icra takibini yapmaya ve ipoteği tescil ettirmeye yetkilidir (KMK m. 35/1-i).

      *3. Çıkarma:* Ayşe iki takvim yılı içinde ortak gider borcunu ödemediği için üç kez icra takibine sebep olmuştur. Bu durumda çekilmezlik her halde mevcut farz edilir (KMK m. 25/3-a). Ancak bu yalnız çekilmezliği var sayar; davanın açılması, aksi kararlaştırılmış olmadıkça, diğer malikler arasında sayı ve arsa payı çoğunluğuyla alınan karara bağlıdır (KMK m. 25/2). Burada kanunda üçte iki oy ya da süreli ihtar yoktur. Karara rağmen bir kısım malik dava açmak istemezse dava öteki malikler tarafından açılır. Bölümün hükme en yakın tarihteki değeri Ayşe'ye ödenerek devir istenir; hâkim hüküm vermeden önce bedelin bankada üçer aylık vadeli hesaba yatırılması için süre verir ve dava kabul edilirse bölüm davayı açan maliklere arsa payları oranında devredilir, bedel işlemiş faiziyle Ayşe'ye ödenir. Dava hakkı, dava açma kararının öğrenilmesinden itibaren altı ay ve her halde hakkın doğumundan itibaren beş yıl içinde kullanılmalıdır (KMK m. 25/4).

      *4. Usul:* Görevli mahkeme sulh hukuk mahkemesidir (Kat Mülkiyeti Kanunu'nun ek 1. maddesi; HMK m. 4/1-ç). Kat Mülkiyeti Kanunundan kaynaklanan uyuşmazlıklarda dava açılmadan önce arabulucuya başvurulması dava şartıdır (HUAK m. 18/B/1-c).

      **Sonuç:**
      - Ayşe asıl sorumludur; Mehmet müteselsil sorumludur ama kira miktarıyla sınırlıdır; gecikme tazminatı aylık yüzde beştir.
      - Ali, borç mahkemece tespit edilip başka yoldan alınamazsa yazılı istemle kanuni ipotek tescil ettirebilir; feragat geçersizdir.
      - Çekilmezlik var sayılır; dava için sayı ve arsa payı çoğunluğuyla karar gerekir; süre altı ay ve beş yıldır.
      - Önce arabuluculuk, sonra sulh hukuk mahkemesi.

  - olay: |
      Gül Apartmanı 20 bağımsız bölümlüdür ve toplu yapı değildir. Yönetim planının değiştirilmesi için toplanan kat malikleri kurulunun ilk toplantısı 10 Ocak 2026'da yeter sayı sağlanamadığı için yapılamamıştır. Çağrıda ikinci toplantının tarihi 14 Ocak 2026 olarak gösterilmiştir. Bu toplantıya 9 malik katılmış ve 6 malik oyuyla yönetim planında değişiklik yapılmıştır. Zeynep toplantıya katılmış, değişikliğe aykırı oy vermiş ve gerekçesini karar defterine yazarak imza koymuştur. Toplantıya katılmayan Can ise kararı 1 Şubat 2026'da öğrenmiştir. Çağrı yönetici Selma tarafından bütün maliklere imza karşılığı yapılmıştır. Değişiklik, planın ortak yerlerin kullanım şekline ilişkin maddesinde yapılmış ve karar defterine yazılmıştır. Zeynep 3 Şubat 2026'da, Can 10 Şubat 2026'da dava açmak istemektedir; ikisi de daha önce arabulucuya başvurmamıştır.

      1. Toplantının yapılma biçimi (süreler) kanuna uygun mudur?
      2. Planın bu şekilde değiştirilmesi mümkün müdür? İkinci toplantıda salt çoğunluk yeter mi?
      3. Zeynep ve Can hangi mahkemede, hangi süre içinde ve kimi hasım göstererek dava açabilir? Önce ne yapmalıdır?
      4. Dava kabul edilirse yargılama giderlerini kim öder?
    olcut:
      - {tespit: "İlk ve ikinci toplantı arasında en az yedi gün bırakılması gerektiği; dört günün kanuna uygun olmaması", puan: 15, madde: "KMK m. 29/3"}
      - {tespit: "İkinci toplantıda genel karar yeter sayısının katılanların salt çoğunluğu olduğu, ancak özel yeter sayıların saklı olması", puan: 15, madde: "KMK m. 30/2"}
      - {tespit: "Yönetim planı değişikliği için bütün kat maliklerinin beşte dördünün oyunun şart olması; 6 oyun yetmemesi", puan: 25, madde: "KMK m. 28/3"}
      - {tespit: "Aykırı oy veren ve katılmayan malikin iptal davası süreleri; sulh mahkemesinin görevi", puan: 20, madde: "KMK m. 33/1"}
      - {tespit: "Davanın yöneticiye husumet yöneltilerek açılması ve iptal hâlinde yargılama giderlerinin ortak giderlerden karşılanması", puan: 10, madde: "KMK m. 38/2"}
      - {tespit: "Dava açılmadan önce arabulucuya başvurulmasının dava şartı olması", puan: 15, madde: "HUAK m. 18/B"}
    cozum: |
      **Nitelendirme:** Uyuşmazlık, bir kat malikleri kurulu kararının (yönetim planı değişikliği) toplantı ve nisap bakımından sakat olup olmadığına ve bu karara karşı iptal davasının nasıl açılacağına ilişkindir.

      **Hukuki sorunlar:** (1) Toplantı aralığı; (2) karar yeter sayısı ve plan değişikliği nisabı; (3) iptal davasının mahkemesi, süresi, hasmı ve dava şartı; (4) yargılama giderleri.

      **İlgili hükümler:** KMK m. 28/3, 29/3, 30/2-3, 33/1, 38/2; HUAK m. 18/B/1-c; Kat Mülkiyeti Kanunu'nun ek 1. maddesi.

      **Değerlendirme:**

      *1. Toplantı aralığı:* İlk çağrı yapılırken ikinci toplantının yeri ve tarihi de bildirilebilir; ancak ilk toplantı ile ikinci toplantı arasında bırakılacak süre yedi günden az olamaz (KMK m. 29/3). Burada 10 Ocak ile 14 Ocak arasında yalnızca dört gün vardır. Çağrı bu yönden kanuna aykırıdır. Ancak Zeynep toplantıya katıldığı için bu usulsüzlüğe dayanmasının sonucu tartışmalı olabilir; Yargıtay bir kararda, toplantıya katılan malikin çağrı usulsüzlüğüne dayanan iptal istemini reddeden kararı onamıştır. Bu yüzden asıl dayanak nisap olmalıdır.

      *2. Nisap:* İkinci toplantıda karar yeter sayısı genel olarak katılanların salt çoğunluğudur (KMK m. 30/2). Fakat Kanunda yeter sayı için ayrıca konulmuş hükümler saklıdır (KMK m. 30/3). Yönetim planının değiştirilmesi için bütün kat maliklerinin beşte dördünün oyu şarttır (KMK m. 28/3). Bina 20 bölümlü olduğundan kendi hesabımızla 16 oy gerekir; kararda yalnızca 6 oy vardır. Bu nedenle ikinci toplantı olması planın değiştirilmesi için yeterli çoğunluğu sağlamaz. Nisaba aykırı kararın yalnız iptal edilebilir mi yoksa mutlak butlanla mı sakat sayılacağı tartışmalıdır (doktrin); süresinde açılan iptal davası her hâlde yoldur.

      *3. İptal davası:* Zeynep toplantıya katılıp KMK m. 32'ye uygun olarak aykırı oy kullandığından karar tarihinden itibaren bir ay içinde dava açabilir; 3 Şubat bu süre içindedir. Can toplantıya katılmadığından kararı öğrenmesinden itibaren bir ay ve her halde karar tarihinden itibaren altı ay içinde dava açabilir (KMK m. 33/1); 1 Şubat'ta öğrenen Can için 10 Şubat bu süre içindedir. Dava anagayrimenkulün bulunduğu yerdeki sulh mahkemesinde açılır (KMK m. 33/1; Kat Mülkiyeti Kanunu'nun ek 1. maddesi). Dava kat maliklerini temsilen yöneticiye husumet yöneltilerek açılabilir (KMK m. 38/2). Dava öncesinde arabulucuya başvurulması dava şartıdır (HUAK m. 18/B/1-c); arabulucuya gitmeden doğrudan dava açılırsa dava usulden reddedilir. Bu yüzden Zeynep ve Can belirttikleri tarihlerde önce arabulucuya başvurmalıdır. Arabuluculuk bürosuna başvurudan son tutanağın düzenlendiği tarihe kadar hak düşürücü süre işlemez (HUAK m. 18/A/15); arabuluculukta anlaşma olmazsa ikisi de kalan süre içinde dava açabilir.

      *4. Yargılama giderleri:* Kurul kararının iptali hâlinde bu konudaki yargılama giderleri ortak giderlerden karşılanır (KMK m. 38/2).

      **Sonuç:**
      - İkinci toplantı için yedi günden az süre bırakılması kanuna aykırıdır (KMK m. 29/3).
      - Plan değişikliği için bütün maliklerin beşte dördünün oyu gerekir; 6 oyla değişiklik yapılamaz.
      - Zeynep karar tarihinden, Can öğrenmeden itibaren bir ay içinde (her halde altı ay içinde) sulh mahkemesinde, yöneticiye husumet yönelterek ve önce arabuluculuğa başvurarak dava açar; arabuluculuk süresince hak düşürücü süre işlemez.
      - Karar iptal edilirse yargılama giderleri ortak giderlerden karşılanır.

  - olay: |
      Bina 10 bağımsız bölümlüdür ve hiç yönetici atanmamıştır. Hasan, kütükte mesken olarak kayıtlı zemin kat bölümünde pastane açmak istemiş; kat malikleri kurulu toplantısında konu 9'a 1 oyla kabul edilmiştir. Hasan ayrıca, kimseye danışmadan, binanın ortak yer niteliğindeki dış cephesini, kendi balkonu hizasında turuncuya boyatmıştır. Bu boyanın yapılması için diğer maliklerin yazılı rızası alınmamıştır. Komşular Hasan'ı uyarmış, ancak Hasan hem pastaneyi işletmeye hem boyayı korumaya devam etmektedir. Pastanenin fırın kokusu ve gürültüsü diğer maliklerin kullanımını da zorlaştırmaktadır; bölüm kütükte hâlâ mesken olarak görünmektedir. Komşular, durumun çözümü için neler yapabileceklerini ve bir noktada Hasan'ın bölümünün kendilerine devrini isteyip isteyemeyeceklerini sormaktadır.

      1. Kurulun 9'a 1 oyla verdiği izin, pastane açılması için yeterli midir?
      2. Dış cephenin turuncuya boyatılması hukuka uygun mudur?
      3. Komşular uyuşmazlığı nasıl çözebilir? Hâkim karara rağmen Hasan davranışını sürdürürse ne olur?
      4. Binada yönetici bulunmaması hukuken nasıl değerlendirilir?
    olcut:
      - {tespit: "Meskende pastane açılması için kurulun oybirliğiyle karar vermesinin şart olması; 9'a 1 oyun yetmemesi", puan: 25, madde: "KMK m. 24/2"}
      - {tespit: "Ortak yerde değişik renkte dış boya için bütün kat maliklerinin beşte dördünün yazılı rızasının gerekmesi", puan: 20, madde: "KMK m. 19/2"}
      - {tespit: "Borç ve yükümlerini yerine getirmeyen malik yüzünden zarar görenlerin sulh mahkemesinden hâkimin müdahalesini isteyebilmesi; hâkimin derhal karar vermesi ve süresinde uymayana idari para cezası verilmesi", puan: 20, madde: "KMK m. 33"}
      - {tespit: "Sulh hâkiminin emrine rağmen bir yıl ısrar edilmesi hâlinde çekilmezliğin var sayılması", puan: 15, madde: "KMK m. 25/3"}
      - {tespit: "Sekiz veya daha fazla bölümlü binada yönetici atanmasının zorunlu olması ve yönetici atanmamışsa işlerden maliklerin müştereken sorumlu olması", puan: 20, madde: "KMK m. 34"}
    cozum: |
      **Nitelendirme:** Olay, bir malikin kendi bölümünü yasak ya da şarta bağlı bir amaçla kullanması, ortak yerde izinsiz değişiklik yapması ve binada yönetici bulunmaması sorunlarını içerir.

      **Hukuki sorunlar:** (1) Meskende gıda yeri açma nisabı; (2) ortak yerde dış boya; (3) hâkimin müdahalesi ve çekilmezlik; (4) yönetici zorunluluğu.

      **İlgili hükümler:** KMK m. 24/2, 19/2, 33/1-3, 25/3-b, 34/2, 35 son fıkra.

      **Değerlendirme:**

      *1. Pastane:* Kütükte mesken olarak gösterilen bağımsız bölümde fırın, lokanta, pastahane gibi gıda yerleri ancak kat malikleri kurulunun oybirliği ile vereceği kararla açılabilir (KMK m. 24/2). 9'a 1 oy oybirliği değildir; bu yüzden kurulun izni pastane açılması için yeterli değildir. Bölüm kütükte mesken olarak kayıtlı olduğundan klinik gibi oybirliğiyle bile açılamayan yerler (KMK m. 24/1) değil, oybirliğiyle açılabilen yerler söz konusudur; dolayısıyla tek eksik nisaptır.

      *2. Dış boya:* Bir kat maliki, bütün kat maliklerinin beşte dördünün yazılı rızası olmadıkça ortak yerlerde değişik renkte dış badana veya boya yaptıramaz (KMK m. 19/2). Dış cephe ortak yer olduğundan Hasan'ın yazılı rıza olmadan yaptığı turuncu boya KMK m. 19/2'ye aykırıdır. Aynı hüküm, Hasan'ın mimari durumu ve güzelliği koruma borcunun da ihlali anlamına gelir (KMK m. 19/1).

      *3. Yol:* Hasan, borç ve yükümlerini yerine getirmediği için zarar gören malikler, anagayrimenkulün bulunduğu yerin sulh mahkemesine başvurarak hâkimin müdahalesini isteyebilir (KMK m. 33/1). Hâkim ilgilileri dinledikten sonra Kanuna, yönetim planına, bunlarda hüküm yoksa genel hükümlere ve hakkaniyet kurallarına göre derhal kararını verir ve kısa bir süre belirler (KMK m. 33/2). Bu süre içinde kararı yerine getirmeyene idari para cezası verilir; KMK m. 25 hükmü saklıdır (KMK m. 33/3). Hasan hâkimin emrine rağmen bir yıl devamlı ısrar ederse çekilmezlik her halde mevcut farz edilir (KMK m. 25/3-b). Bu durumda diğer malikler, sayı ve arsa payı çoğunluğuyla dava açma kararı alıp çıkarma davası açabilir (KMK m. 25/2). Kanunda süreli ihtar şartı yoktur. Uyuşmazlıkta dava açılmadan önce arabuluculuk dava şartıdır (HUAK m. 18/B/1-c).

      *4. Yönetici:* Bina 10 bağımsız bölümlü olduğundan yönetici atanması mecburidir (KMK m. 34/2). Maliklerin anlaşamaması hâlinde bir malikin başvurusuyla sulh mahkemesi yönetici atar (KMK m. 34). Atanmamışsa KMK m. 35'te sayılan işlerin yaptırılmasından kat malikleri müştereken sorumludur.

      **Sonuç:**
      - Pastane için oybirliği gerekir; 9'a 1 oy yetmez.
      - Boya için bütün maliklerin beşte dördünün yazılı rızası gerekir; yoktur, boya hukuka aykırıdır.
      - Sulh hâkiminin müdahalesi istenir; uyulmazsa idari para cezası verilir; emre rağmen bir yıl ısrar çekilmezliği var sayar.
      - Yönetici atanması zorunludur; atanmamışsa malikler müştereken sorumludur.

kartlar:
  - on: "Kat maliklerinin hakları ve borçları hangi maddelerde yer alır?"
    arka: "Haklar KMK m. 15 (bağımsız bölüm) ve m. 16 (ortak yerler); borçlar KMK m. 18 ve devamındadır. Hakların ayrıntısı önceki konudadır."
  - on: "KMK m. 18/2'ye göre malik borçlarından kimler de sorumludur?"
    arka: "Kiracılar, oturma hakkı sahipleri ve devamlı yararlananlar; borcu yerine getirmeyenler malikle müteselsil sorumludur (KMK m. 18/2)."
  - on: "Ortak yerde inşaat veya değişik renkte dış boya için hangi nisap aranır?"
    arka: "Bütün kat maliklerinin beşte dördünün yazılı rızası (KMK m. 19/2). Mahkemece tespit edilen acil onarım ve zorunlu güçlendirmede rıza aranmaz."
  - on: "Personel giderleri ile diğer ortak giderler nasıl paylaşılır?"
    arka: "Kapıcı, kaloriferci, bahçıvan, bekçi giderleri ve avansı eşit; sigorta, bakım, onarım, güçlendirme ve yönetici aylığı arsa payı oranında (KMK m. 20/1)."
  - on: "Gecikme tazminatı oranı nedir?"
    arka: "Ödemede geciktiği günler için aylık yüzde beş (KMK m. 20/2). 5711 sayılı Kanundan önce yüzde ondu."
  - on: "Kiracının ortak gider sorumluluğu nasıldır?"
    arka: "Malikle müteselsil sorumludur ama ödemekle yükümlü olduğu kira miktarıyla sınırlıdır; ödemesi kira borcundan düşer (KMK m. 22/1)."
  - on: "Kanuni ipotek (KMK m. 22/2) için hangi şartlar aranır?"
    arka: "Borç diğer yollarla alınamamış ve mahkemece tespit edilmiş olmalı; varsa yöneticinin yoksa bir malikin yazılı istemi gerekir. Önceden feragat geçersizdir (TMK m. 893)."
  - on: "Başka bölüme girmek gerekirse ne olur?"
    arka: "O bölümün maliki veya oturanlar giriş müsaadesi verir ve işlere katlanır; doğan zararı lehine izin verilenler derhal öder (KMK m. 23)."
  - on: "KMK m. 24/1 ile 24/2 arasındaki fark nedir?"
    arka: "24/1: mesken, iş veya ticaret yerinde hastane, klinik gibi yerler kurulamaz (oybirliğiyle bile). 24/2: yalnız meskende lokanta, dükkân gibi yerler kurulun oybirliğiyle açılabilir."
  - on: "KMK m. 25/3'teki çekilmezlik hâlleri nelerdir?"
    arka: "(a) iki takvim yılında üç icra veya dava takibi; (b) sulh hâkiminin emrine rağmen bir yıl ısrar; (c) bölümün randevu evi, kumarhane gibi kullanılması."
  - on: "Çıkarma davası kararı hangi çoğunlukla alınır?"
    arka: "Aksi kararlaştırılmadıkça diğer maliklerin sayı ve arsa payı çoğunluğuyla (KMK m. 25/2). KMK m. 25/3'te üçte iki oy ya da süreli ihtar yoktur."
  - on: "KMK m. 25 davasında hakkın düşme süreleri?"
    arka: "Dava açma kararının öğrenilmesinden 6 ay; her halde dava hakkının doğumundan 5 yıl (KMK m. 25/4)."
  - on: "Yönetim planı nasıl değiştirilir?"
    arka: "Bütün kat maliklerinin beşte dördünün oyuyla (KMK m. 28/3). Plan sözleşme hükmündedir; haleflerini de bağlar. Ana yapıda 7579 sayılı Kanun bu nisabı değiştirmemiştir."
  - on: "Olağanüstü toplantıyı kimler ister, çağrı süresi nedir?"
    arka: "Yönetici, denetçi veya maliklerin üçte biri; toplantıdan en az 15 gün önce çağrı veya taahhütlü mektupla (KMK m. 29/2)."
  - on: "İkinci toplantıda süre ve karar yeter sayısı?"
    arka: "İki toplantı arası en az 7 gün; ikinci toplantı en geç 15 gün sonra; karar yeter sayısı katılanların salt çoğunluğu, özel nisaplar saklı (KMK m. 29/3, KMK m. 30)."
  - on: "KMK m. 31'de oyla ilgili temel kurallar?"
    arka: "Her malikin bir oyu; çok bölümlü malikin oyu bütün oyların üçte birini aşamaz; ilgili malik oya katılamaz; 40 ve daha az bölümde bir kişi en fazla iki kişiye vekâlet eder."
  - on: "Kurul kararına karşı iptal davası süreleri?"
    arka: "Aykırı oy veren: karar tarihinden 1 ay. Katılmayan: öğrenmeden 1 ay. Her halde karar tarihinden 6 ay. Sulh mahkemesinde. Yok ve mutlak butlanda süre aranmaz (KMK m. 33/1)."
  - on: "İptal davasında kime husumet yöneltilir ve giderleri kim öder?"
    arka: "Kat maliklerini temsilen yöneticiye yöneltilebilir; karar iptal edilirse yargılama giderleri ortak giderlerden karşılanır (KMK m. 38/2)."
  - on: "Yönetici ne zaman zorunludur ve nasıl atanır?"
    arka: "Sekiz veya daha fazla bağımsız bölümde zorunludur; sayı ve arsa payı çoğunluğuyla ve her yıl atanır (KMK m. 34)."
  - on: "Kesinleşen işletme projesi neden önemlidir?"
    arka: "İİK m. 68/1'deki belgelerden sayılır; aidat takibinde itirazın kaldırılması istenebilir (KMK m. 37/4)."
  - on: "7579 sayılı Kanunla KMK m. 35 ve 37'de ne değişti?"
    arka: "Avans işletme projesi onaylanıncaya kadar toplanır (m. 35/1-d); işletme projesini kat malikleri genel kurulu onaylar ve geçici proje bedeline yeniden değerleme tavanı konur (m. 37). RG 22/5/2026."
  - on: "Kat mülkiyeti uyuşmazlıklarında görevli mahkeme ve dava şartı nedir?"
    arka: "Sulh hukuk mahkemesi (Kat Mülkiyeti Kanunu'nun ek 1. maddesi, HMK m. 4/1-ç); dava açmadan önce arabulucuya başvurmak dava şartıdır (HUAK m. 18/B/1-c)."
