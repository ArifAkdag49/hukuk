  - id: "1178749300"
    ozet: |
      İzmir Konak'taki beş bağımsız bölümlü yapıda kat irtifakı kurulmuş ve her bölüme eşit 2/10 arsa payı verilmiştir. 4 numaralı bölümün malikleri, bölümlerinin daha büyük ve konumunun farklı olmasına rağmen düşük pay aldıklarını ileri sürerek arsa paylarının düzeltilmesini istemiştir; yapı riskli yapı olarak 6306 sayılı Kanun kapsamında yıkılacaktır. İlk derece mahkemesi, kuruluşta yalnız sayı hesabıyla eşit pay verildiği, konum, cephe, teras ve iklim gibi etkenlerin gözetilmediği gerekçesiyle davayı kabul ederek payları 9/44, 10/44, 10/44, 10/44 ve 5/44 olarak düzeltmiştir. Bölge adliye mahkemesi, bina istinaf aşamasında yıkıldığından KMK m. 47/1 gereği kat mülkiyetinin kendiliğinden sona erdiğini belirterek davanın konusuz kaldığına hükmetmiş; Yargıtay 5. Hukuk Dairesinin bozmasına rağmen direnmiştir. Hukuk Genel Kurulu direnme kararını oy çokluğuyla bozmuştur. Bina yıkılmış olsa da taraf iradesiyle yeni arsa payları belirlenerek kat irtifakı veya kat mülkiyeti kurulmamıştır; arsa hâline gelen taşınmazda kat malikleri arsa payı oranında ortak mülkiyet esaslarına göre malik olacağından hukuki yarar sürer. Arsa payının belirlenmesinde bölümlerin kat irtifakının kurulduğu tarihteki değerini etkileyen bütün unsurlar incelenmelidir. Konuya katkısı: Düzeltme davasında değerin kuruluş tarihine göre belirlendiğini ve yıkımın bu davayı kendiliğinden konusuz bırakmadığını gösterir.
  - id: "686216900"
    ozet: |
      İzmir Karşıyaka'daki iki paydaşlı taşınmazda davacı satış yoluyla ortaklığın giderilmesini istemiş; davalı, taraflar arasındaki mal paylaşımı ve miras taksim sözleşmesine göre yapının 1. katının birine, 2. katının diğerine geçirileceğini belirterek kat mülkiyeti kurulması suretiyle aynen taksim talep etmiştir. İlk derece mahkemesi, eski meskenlerin yapı kullanma izni bulunmadığı ve ikinci katın imara aykırı yapıldığı gerekçesiyle kat mülkiyeti kurulamayacağını belirterek satışa karar vermiştir. Özel Daire bozmuş, mahkeme direnmiş, Hukuk Genel Kurulu direnme kararını oybirliğiyle bozmuştur. Kat mülkiyeti kurularak ortaklığın giderilmesi için ortaklardan birinin istemi, yapının kat mülkiyetine elverişli olması, bağımsız bölümler içermesi, her paydaşa en az bir bağımsız bölüm düşmesi ve KMK m. 12'deki belgelerin ibrazı gerekir; tümü kârgir olma şartı da aranır (KMK m. 50/2). Eksikler giderilebilecek nitelikteyse hemen kurulamaz sonucuna varılmamalı, mahkeme tamamlatma yoluna gitmelidir. Konuya katkısı: Kat mülkiyeti kurularak ortaklığın giderilmesinin şartlarını ve belge eksikliğinde önce tamamlatma gerektiğini gösterir.
  - id: "1005532600"
    ozet: |
      Konya Selçuklu'daki kat irtifaklı ana taşınmazda bağımsız bölüm malikleri, mevcut kat irtifakının fiilî duruma uymadığını ileri sürerek fiilî duruma uygun yeni kat irtifakının tespitini ve tescilini, olmazsa ortaklığın kat mülkiyetine geçilerek, o da olmazsa satış yoluyla giderilmesini istemiştir. Davalı, yeni kat irtifakına ancak belirli şartlarla muvafakat edeceğini bildirmiştir. İlk derece mahkemesi davayı reddetmiş, bölge adliye mahkemesi istinaf başvurusunu esastan reddetmiştir. Yargıtay 5. Hukuk Dairesi kararı oybirliğiyle onamıştır. Mevcut kat irtifakının yerine fiilî duruma uygun kat irtifakı kurulması kat maliklerinin oybirliğiyle yapacakları bir işlemdir; mahkeme maliklerin iradesinin yerine geçip onay vermiş sayılmalarına karar veremez. Satış talebi yönünden de KMK m. 7 gereği kat mülkiyetine ya da kat irtifakına tabi taşınmazda ortaklığın giderilmesi istenemez, yalnız bağımsız bölümlerde istenebilir. Konuya katkısı: KMK m. 7'deki yasağın kat irtifakı kurulu taşınmazı da kapsadığını ve kat irtifakının değiştirilmesinde hâkim kararının oybirliğinin yerini tutmadığını gösterir.

sorular:
  - soru: |
      KMK m. 1'e göre kat mülkiyeti ile kat irtifakı arasındaki temel fark hangi seçenekte doğru verilmiştir?
    siklar:
      - "Kat mülkiyeti sözleşmeyle, kat irtifakı tescille doğar."
      - "Kat mülkiyeti tamamlanmış yapının bağımsız bölümleri üzerinde, kat irtifakı yapılmakta olan veya ileride yapılacak yapının bölümleri için kurulur."
      - "Kat mülkiyeti yalnız konutlarda, kat irtifakı yalnız iş yerlerinde kurulur."
      - "Kat mülkiyeti tek malikli arsada, kat irtifakı yalnız paylı mülkiyetli arsada kurulabilir."
    dogru: 1
    aciklama: |
      KMK m. 1/1 tamamlanmış yapının bölümleri üzerinde bağımsız mülkiyet hakları kurulabileceğini, KMK m. 1/2 ise yapılmakta veya ileride yapılacak yapının bölümleri için irtifak hakları kurulabileceğini söyler. İkisi de resmî senetle ve tescille doğar (KMK m. 10/1); bölüm türü (kat, daire, iş bürosu, dükkân gibi) fark ölçütü değildir ve kuruluşu arsanın maliki ya da ortak malikleri yapar.

  - soru: |
      Hasan, kat mülkiyeti kurulu binadaki 5 numaralı dairesini Selin'e satarken arsa payını kendisinde bırakıp yalnız daireyi devretmek istemektedir. Hangisi doğrudur?
    siklar:
      - "Taraflar anlaşırsa arsa payı bölümden ayrı olarak Hasan'da bırakılabilir."
      - "Arsa payı ancak noter onaylı bir şerhle bölümden ayrılabilir."
      - "Arsa payı bölüme bağlı olduğundan daireyle birlikte Selin'e geçer; ayrı bırakılamaz."
      - "Arsa payı ayrı bırakılabilir, ancak Selin'e önalım hakkı doğar."
    dogru: 2
    aciklama: |
      Kat mülkiyetinin devri hâlinde ona bağlı arsa payı da birlikte geçer; arsa payı kat mülkiyetinden veya kat irtifakından ayrı olarak devredilemez ve başka bir hakla kayıtlanamaz (KMK m. 5/1). Ayrıca anagayrimenkulde kat mülkiyetine bağlanmamış arsa payı bırakılamaz (KMK m. 5/2). Taraf anlaşması bu emredici bağlantıyı değiştirmez.

  - soru: |
      Kat mülkiyeti kurulurken zemin kattaki dükkâna değerine uygun arsa payı verilmiştir. Yıllar sonra bir imar değişikliği binanın önündeki yolu genişletmiş ve dükkânın değeri iki katına çıkmıştır. Diğer kat malikleri dükkânın arsa payının artırılmasını ister. Hangisi doğrudur?
    siklar:
      - "Tahsis edilen arsa payı, bölümün değerinde sonradan meydana gelen artış sebebiyle değiştirilemez."
      - "Değer artışı olduğundan arsa payı kendiliğinden artar ve tapuda resen düzeltilir."
      - "Her kat maliki, sonradan artan değere göre arsa paylarının yeniden düzenlenmesi için mahkemeye başvurabilir."
      - "Dükkân maliki talep ederse tapu müdürlüğü payı yeniden belirler."
    dogru: 0
    aciklama: |
      KMK m. 3/2'ye göre bağımsız bölümlere tahsis edilen arsa payı, o bölümlerin değerinde sonradan meydana gelen çoğalma veya azalma sebebiyle değiştirilemez; kat ilavesi gibi KMK m. 44'ün kapsadığı hâller saklıdır. Mahkemeye başvuru hakkı, payın kuruluşta bölümlerin değerleriyle oranlı tahsis edilmediği hâllere ilişkindir. Sonradan oluşan değer farkı bu başvurunun konusu olamaz.

  - soru: |
      Yargıtay Hukuk Genel Kurulu'na göre arsa payı düzeltme davasında bağımsız bölümlerin değeri hangi tarihe göre belirlenir?
    siklar:
      - "Dava tarihine göre"
      - "Kat irtifakının (doğrudan kat mülkiyeti kurulmuşsa o kuruluşun) kurulduğu tarihe göre"
      - "Yapı kullanma izin belgesinin düzenlendiği tarihe göre"
      - "Bilirkişi raporunun düzenlendiği tarihe göre"
    dogru: 1
    aciklama: |
      Hukuk Genel Kurulu, arsa payının belirlenmesinde bağımsız bölümlerin kat irtifakının kurulduğu tarihteki değerini etkileyen bütün unsurların incelenmesi gerektiğini kabul etmiştir. Bu, KMK m. 3/2'deki ilkenin sonucudur: Pay kuruluşta değerle oranlı tahsis edilir, sonradan değişen değer payı değiştirmez. Dava veya rapor tarihindeki güncel değer ölçüt değildir.

  - soru: |
      KMK m. 4'e göre aşağıdakilerden hangisi kanun gereği her hâlde ortak yer sayılır?
    siklar:
      - "Yalnız 3 numaralı daireye tahsis edilmiş, dairenin dışındaki kömürlük"
      - "Bir bağımsız bölümün içinde bulunan mutfak ve banyo"
      - "Bir malikin kendi bölümünde bulunan şömine"
      - "Taşıyıcı sistemi oluşturan kolon ve perde duvarlar"
    dogru: 3
    aciklama: |
      KMK m. 4/a temeller, ana duvarlar ve taşıyıcı sistemi oluşturan kiriş, kolon ve perde duvarlarla taşıyıcı sistemin parçası diğer elemanları her hâlde ortak yer sayar. Doğrudan bir bölüme tahsis edilen kömürlük ortak yer değil, o bölümün eklentisidir (KMK m. 2/a, m. 6/1). Bölümün kendi içindeki mutfak, banyo ve şömine ise bağımsız bölümün parçasıdır.

  - soru: |
      Elif'in 1 numaralı dairesine, bodrumdaki iki kömürlükten biri projede doğrudan tahsis edilmiş ve beyanlar hanesine yazılmıştır. Elif dairesini Burak'a satar; senette kömürlükten ayrıca söz edilmez. Hangisi doğrudur?
    siklar:
      - "Kömürlük eklenti olduğundan bağımsız bölümün devriyle kendiliğinden Burak'a geçer."
      - "Kömürlük ortak yer olduğundan bütün kat malikleri arsa payı oranında maliktir ve Burak'a geçmez."
      - "Kömürlük ancak ayrıca resmî senetle devredilirse Burak'a geçer."
      - "Kömürlük taşınır eşya olduğundan ancak zilyetliğin devriyle Burak'a geçer."
    dogru: 0
    aciklama: |
      Doğrudan bir bölüme tahsis edilen kömürlük eklentidir; bölümün bütünleyici parçası sayılır ve bölüm maliki eklentinin de tek başına malikidir (KMK m. 6/1). Bağımsız bölümün devri hâlinde eklentiler kendiliğinden devredilmiş olur (KMK m. 6/4). Taşınır olma özelliği TMK m. 686'daki eklentiye aittir; KMK'deki eklenti bir yerdir ve bölümle birlikte kendiliğinden geçer.

  - soru: |
      Mehmet, Zeynep ve Can'ın paylı malik oldukları arsada üç daireli bir bina için kat irtifakı kurulmuştur. Can, aralarındaki anlaşmazlık yüzünden taşınmazın satılması suretiyle ortaklığın giderilmesini ister. Hangisi doğrudur?
    siklar:
      - "Ortaklığın giderilmesi istenebilir, çünkü yasak yalnız kat mülkiyetini kapsar."
      - "Ortaklığın giderilmesi istenebilir, ancak yapı tamamlanmadığı için satış yerine aynen taksim yapılır."
      - "Kat irtifakına tabi gayrimenkulde ortaklığın giderilmesi istenemez."
      - "Ortaklığın giderilmesi yalnız diğer paydaşlar kabul ederse istenebilir."
    dogru: 2
    aciklama: |
      Kat mülkiyetine veya kat irtifakına tabi olan gayrimenkulde ortaklığın giderilmesi istenemez (KMK m. 7/1). Yargıtay yasağın kat irtifakı kurulu taşınmazı da kapsadığını kabul etmektedir. Bu yasak anagayrimenkule yöneliktir; bir bağımsız bölümün paydaşları arasında ortaklığın giderilmesi istenebilir (KMK m. 7/2).

  - soru: |
      Ayşe, kat mülkiyeti kurulu binadaki 4 numaralı dairesini Okan'a satar. Aynı binada oturan kat maliki Ali, "komşu ve kat maliki olarak önalım hakkım var" diyerek dava açar. Kuruluş senedinde önalıma ilişkin bir hüküm yoktur. Hangisi doğrudur?
    siklar:
      - "Ali arsa paylı paydaş olduğundan önalım hakkı vardır."
      - "Diğer kat maliklerinin önalım hakkı yoktur; Ali'nin istemi reddedilir."
      - "Önalım hakkı vardır, ancak yalnız aynı katta oturan maliklere tanınır."
      - "Önalım hakkı vardır, ancak yalnız bedel gerçek değerinin altında gösterilmişse doğar."
    dogru: 1
    aciklama: |
      KMK m. 8/1'e göre bağımsız bölümlerden birinin satılması hâlinde diğer kat maliklerinin öncelikle satın alma hakkı yoktur. Önalım hakkı, ancak bir bağımsız bölümün paydaşları arasında doğar (KMK m. 8/2). Sözleşmede bu hükmün aksi kararlaştırılabilir (KMK m. 8/3); olayda böyle bir hüküm bulunmadığı için Ali'nin istemi yerinde değildir.

  - soru: |
      Kat mülkiyeti ve kat irtifakı hangi anda doğar?
    siklar:
      - "Arsa malikleri arasında noterde bir sözleşme yapıldığında"
      - "Yönetim planı imzalandığında"
      - "Resmî senetle ve tapu siciline tescille"
      - "Yapı kullanma izin belgesi düzenlendiğinde"
    dogru: 2
    aciklama: |
      KMK m. 10/1'e göre kat mülkiyeti ve kat irtifakı resmî senetle ve tapu siciline tescil ile doğar. Tapu memurunun düzenlediği resmî sözleşme aynı zamanda tescil istemi sayılır (KMK m. 13/1). Yönetim planı ve yapı kullanma izin belgesi kuruluşun belgeleridir (KMK m. 12); kuruluşu tek başlarına sağlamaz.

  - soru: |
      Zeynep, on daireli ve tümü kârgir bir binanın yalnız zemin kattaki dükkânını bağımsız bölüm olarak kat mülkiyetine bağlatıp diğer bölümlerde bunu yaptırmak istememektedir. Hangisi doğrudur?
    siklar:
      - "Dükkân için kat mülkiyeti kurulabilir, kalan bölümler adi mülkiyet olarak kalır."
      - "Dükkân malikinin tek başına istemi yeterlidir, diğer maliklerin katılımı gerekmez."
      - "Dükkân için ancak üst hakkı kurularak aynı sonuç sağlanabilir."
      - "Anagayrimenkulün tümü kat mülkiyetine çevrilmeden yalnız bir veya birkaç bölüm üzerinde kat mülkiyeti kurulamaz."
    dogru: 3
    aciklama: |
      KMK m. 10/2'ye göre anagayrimenkulün tümünün mülkiyeti kat mülkiyetine çevrilmeden o gayrimenkulün yalnız bir veya birkaç bölümü üzerinde kat mülkiyeti kurulamaz. Bina bütünüyle kat mülkiyetine geçer ya da hiç geçmez. Toplu yapılarda tamamlanan yapıların ayrı ayrı çevrilebilmesi (KMK m. 66) ayrı bir kuraldır ve tek bir binadaki kısmi çevirmeyi mümkün kılmaz.

  - soru: |
      Kat irtifakı kurulması için tapu idaresine verilecek belgeler hakkında hangisi doğrudur?
    siklar:
      - "Maliklerin imzalarıyla onaylanan proje ile yönetim planı verilir; yapı kullanma izin belgesi aranmaz."
      - "Yapı kullanma izin belgesi, proje ve yönetim planı birlikte aranır."
      - "Yalnız yönetim planı yeterlidir, proje aranmaz."
      - "Yalnız bağımsız bölümlerin listesi aranır."
    dogru: 0
    aciklama: |
      KMK m. 14/1'e göre kat irtifakı için arsanın maliki veya bütün paydaşları, KMK m. 12/1-a'ya uygun, maliklerin imzalarıyla onaylanıp elektronik ortamda gönderilen proje ile KMK m. 12/1-b'deki yönetim planını verir. Yapı kullanma izin belgesi, tamamlanmış yapı için aranan kat mülkiyeti belgesidir (KMK m. 12/1-a). Eski kaynaklardaki bağımsız bölüm listesi anlatımı güncel metne uymaz; arsa payları artık mimari projede gösterilir.

  - soru: |
      Ali ve Ayşe yarı yarıya paylı malik oldukları arsada sekiz daireli bir apartman yaptırmak için kat irtifakı kurdurmak ister. Ali, Ayşe'nin imzası olmadan proje ve yönetim planıyla tek başına tapu müdürlüğüne başvurur. Olayda yüklenici yoktur. Hangisi doğrudur?
    siklar:
      - "Ali'nin payı yarı olduğundan istem geçerlidir ve kat irtifakı kurulur."
      - "İstem arsanın malikinin veya bütün paydaşlarının olmalı ve proje bütün paydaşların imzalarıyla onaylanmalıdır; Ali tek başına kuramaz."
      - "Ali tek başına başvurabilir; Ayşe'nin imzası tescilden sonra mahkemece tamamlatılır."
      - "Paydaşların çoğunluğunun istemi yeterlidir ve çoğunluk Ali'dedir."
    dogru: 1
    aciklama: |
      KMK m. 14/1'e göre kat irtifakı için arsanın maliki veya bütün paydaşları istemde bulunur ve projeyi maliklerin imzalarıyla onaylatır (KMK m. 12/1-a). Ali ile Ayşe'nin payları eşittir, ama çoğunluk ölçütü zaten aranmaz. Yüklenici talebiyle idarece tesis (KMK m. 10/5) farklı bir yoldur ve olayda yüklenici bulunmadığından uygulanmaz.

  - soru: |
      Mehmet, Zeynep ve Can'ın kat irtifakı kurulu arsası üzerindeki bina tamamlanmış ve yapının tamamı için yapı kullanma izin belgesi alınmıştır. Mehmet tek başına kat mülkiyetine geçilmesini ister; Zeynep ve Can karşı çıkar. Hangisi doğrudur?
    siklar:
      - "Geçiş yapı kullanma izin belgesine dayanılarak ortak maliklerden birinin istemiyle dahi yapılabilir; ayrıca yönetim planı istenmez."
      - "Geçiş için kat irtifakı sahiplerinin tamamının oybirliği gerekir."
      - "Geçiş için kat irtifakı sahiplerinin beşte dördünün kararı gerekir."
      - "Geçiş yalnız yapı kullanma izin belgesi bulunmayan binalarda mümkündür."
    dogru: 0
    aciklama: |
      KMK m. 3/3'e göre kat irtifakı, yapının tamamı için düzenlenecek yapı kullanma izin belgesine dayalı olarak kat mülkiyetine resen çevrilir; bu işlem arsa malikinin veya kat irtifakına sahip ortak maliklerden birinin istemiyle dahi yapılabilir. Kat mülkiyetine geçişte ayrıca yönetim planı istenmez (KMK m. 14/1). Oybirliği veya beşte dört aranmaz; yapı kullanma izin belgesi de geçişin dayanağıdır, yokluğu şart değildir.

  - soru: |
      7327 sayılı Kanunla yeniden yazılan KMK m. 10/6'ya göre hangisi doğrudur?
    siklar:
      - "Cins değişikliği ve kat mülkiyetine geçiş yalnız malikin yazılı başvurusu üzerine yapılır."
      - "Kat mülkiyetine geçişte yeniden yönetim planı düzenlenmesi zorunludur."
      - "Yapı kullanma izin belgesi düzenlenen yapılarda cins değişikliği resen yapılır; taşınmaz kat irtifaklıysa resmî senede ve KMK m. 12'deki belgelere dayanılarak başkaca belge aranmaksızın resen kat mülkiyetine çevrilir."
      - "Bu işlemler için döner sermaye hizmet bedeli alınır."
    dogru: 2
    aciklama: |
      KMK m. 10/6'ya göre yapı kullanma izin belgesi düzenlenen tüm yapıların cins değişikliği işlemleri resen yapılır; cins değişikliği yapılmış taşınmaz kat irtifaklıysa, kat irtifakının tesciline ait resmî senede ve KMK m. 12'deki belgelere dayalı olarak başkaca belge aranmaksızın resen kat mülkiyetine çevrilir. Bu işlemler döner sermaye hizmet bedelinden muaftır. Geçişte ayrıca yönetim planı istenmez (KMK m. 14/1).

  - soru: |
      Kat irtifaklı 12 daireli bir binada yapı fiilen tamamlanmış ve 9 daire kullanılmaya başlanmıştır; kat mülkiyetine geçilmemiştir. Hangisi doğrudur?
    siklar:
      - "Kat mülkiyeti kendiliğinden doğmuştur; taşınmaz artık kat irtifaklı statüsünde değildir."
      - "Yönetim hükümlerinin uygulanması için bütün bağımsız bölümlerin kullanılmaya başlanması gerekir."
      - "Kat irtifakı sahipleri yönetici atayamaz; yönetici ancak kat mülkiyetinden sonra atanabilir."
      - "Kat mülkiyetine geçilmemiş olsa dahi anagayrimenkulün yönetiminde kat mülkiyeti hükümleri uygulanır."
    dogru: 3
    aciklama: |
      KMK m. 17/3'e göre kat irtifakı kurulmuş gayrimenkulde yapı fiilen tamamlanmış ve bağımsız bölümlerin üçte ikisi fiilen kullanılmaya başlanmışsa, kat mülkiyetine geçilmemiş olsa dahi yönetimde kat mülkiyeti hükümleri uygulanır. Olayda 12 bölümün üçte ikisi olan sekizden fazlası kullanılmaktadır. Bu hüküm mülkiyet statüsünü değiştirmez; üstelik kat irtifakı sahipleri yapının tamamlanması için zaten yönetici tayin edebilir (KMK m. 17/2).

  - soru: |
      Kat irtifakı sahiplerinin, yapının sözleşmede yazılı süre içinde başlaması ve tamamlanması için kendilerine düşen borçların yerine getirilmesini karşılıklı olarak isteme ve dava etme hakkı hangi hükümde düzenlenmiştir?
    siklar:
      - "KMK m. 17/1"
      - "KMK m. 26/2"
      - "KMK m. 14/1"
      - "KMK m. 10/6"
    dogru: 0
    aciklama: |
      Tamamlanmayı karşılıklı olarak isteme ve dava etme hakkı KMK m. 17/1'dedir. KMK m. 26 ise kat irtifakı sahiplerinin borçlarını düzenler ve borcunu noter ihtarından sonra iki ay içinde yerine getirmeyenin payının devrini öngörür (KMK m. 26/2). KMK m. 14/1 kuruluşun belgelerini, KMK m. 10/6 yapı kullanma izin belgesine dayalı resen geçişi düzenler.

  - soru: |
      Kat irtifakı sahibi Okan, payına düşen inşaat bedelini ödememiştir. Diğer kat irtifakı sahipleri noterden ihtar çeker; Okan ihtar tarihinden başlayarak iki ay içinde de borcunu yerine getirmez. Diğerleri yazılı istemde bulunur. Hangisi doğrudur?
    siklar:
      - "Okan'ın arsa payı kendiliğinden diğer paydaşlara geçer."
      - "Hâkim, Okan'ın arsa payının ve kat irtifakının hükme en yakın tarihteki değeri karşılığında öteki paydaşlara arsa payları oranında devrine karar verir."
      - "Hâkim yalnız alacağın tahsiline karar verebilir; payın devri istenemez."
      - "Devir, kat irtifakının kurulduğu tarihteki değer üzerinden yapılır."
    dogru: 1
    aciklama: |
      KMK m. 26/2'ye göre borcunu noter aracılığıyla yapılan ihtara rağmen ihtar tarihinden başlayarak iki ay içinde yerine getirmeyen kat irtifakı sahibinin arsa payı ve kat irtifakı, diğerlerinin yazılı istemi üzerine hâkim kararıyla, hükme en yakın tarihteki değeri karşılığında öteki paydaşlara arsa payları oranında devredilir. Devir kendiliğinden olmaz, hâkim kararı gerekir ve değer kuruluş tarihine göre değil hükme en yakın tarihe göre belirlenir.

  - soru: |
      2019'da bir arsa üzerinde kat irtifakı kurulmuş, kuruluş sırasında verilen plana göre hiçbir yapı yapılmamıştır. 2025'te maliklerden Selim durumun çözülmesini ister. Hangisi doğrudur?
    siklar:
      - "Beş yıl dolduğu için kat irtifakı kendiliğinden sona ermiştir ve kayıt tapu müdürlüğünce re'sen silinir."
      - "Süreyi uzatma yetkisi tapu müdürüne aittir."
      - "Maliklerden birinin istemi üzerine sulh hâkimi, duruma göre kat irtifakının sona ermesine veya belli bir süre için uzatılmasına karar verir."
      - "Kat irtifakı yalnız maliklerin yazılı beyanıyla sona erdirilebilir; hâkimden bu yönde istem yapılamaz."
    dogru: 2
    aciklama: |
      KMK m. 49/3'e göre kat irtifakının kurulması sırasında verilen plana göre beş yıl içinde yapı yapılmazsa maliklerden birinin istemi üzerine sulh hâkimi, gerektiğinde ilgilileri dinleyerek, duruma göre sona ermeye veya belli bir süre için uzatmaya karar verir. Beş yılın dolması irtifakı kendiliğinden bitirmez. Kendiliğinden sona erme yalnız arsanın yok olması, üzerinde yapı yapılamaz hâle gelmesi veya kamulaştırılması hâllerindedir (KMK m. 49/2); maliklerin yazılı beyanıyla sona erdirme (KMK m. 49/1) ise ek bir yoldur.

  - soru: |
      Mirasçılar Elif ve Burak, babalarından kalan, tümü kârgir, iki daireli ve kat mülkiyeti kurulmamış binada paylı maliktir. Burak satış yoluyla ortaklığın giderilmesini, Elif kat mülkiyeti kurularak her birine bir daire verilmesini ister. Hangisi doğrudur?
    siklar:
      - "Satış yoluyla giderme esastır; kat mülkiyeti kurulması için bütün ortakların rızası şarttır."
      - "Bina daha önce kat mülkiyetine çevrilmediği için kat mülkiyeti kurularak paylaşma yoluna gidilemez."
      - "Kat mülkiyeti kurulabilir, ancak bağımsız bölümler tahsis edilemez; ortaklık satışla giderilir."
      - "Ortaklardan biri isterse hâkim, KMK m. 12'deki belgelere dayanarak kat mülkiyetine çevirmeye ve paylar denkleştirilerek bağımsız bölümleri ortaklara tahsis etmeye karar verebilir."
    dogru: 3
    aciklama: |
      KMK m. 10/7'ye göre kat mülkiyetine konu olmaya elverişli bir gayrimenkulde ortaklığın giderilmesi davasında mirasçılardan veya ortak maliklerden biri isterse hâkim, mülkiyetin KMK m. 12'deki belgelere dayanılarak kat mülkiyetine çevrilmesine ve payları denkleştirerek bağımsız bölümlerin ortaklara ayrı ayrı tahsisine karar verebilir. Bütün ortakların rızası aranmaz. Uygulamada bu yol, kat mülkiyeti kurularak aynen taksim diye anılır; olayda tümü kârgir olma şartı da sağlanmıştır (KMK m. 50/2).

  - soru: |
      KMK'deki eklenti ile TMK m. 686'daki eklenti arasındaki fark hangi seçenekte doğru gösterilmiştir?
    siklar:
      - "TMK'da eklenti asıl şeye sürekli özgülenen taşınır maldır; KMK'de eklenti bağımsız bölümün dışında olup doğrudan o bölüme tahsis edilmiş yerdir ve bölümün bütünleyici parçası sayılır."
      - "TMK'da eklenti taşınmazdır; KMK'de eklenti taşınırdır."
      - "KMK'de eklenti bütün kat maliklerinin ortak malıdır; TMK'da tek malikin malıdır."
      - "Fark yoktur; her iki kanunda da eklenti asıl şeyden ayrı bir bağımsız mülkiyet konusudur."
    dogru: 0
    aciklama: |
      TMK m. 686/2'ye göre eklenti, asıl şeyin işletilmesi, korunması veya yarar sağlaması için ona sürekli olarak özgülenen ve ona bağlı kılınan taşınır maldır. KMK m. 2/a ve m. 6/1'deki eklenti ise bir bağımsız bölüme doğrudan tahsis edilmiş yerdir (kömürlük, garaj, tuvalet gibi); bölümün bütünleyici parçası sayılır, bölüm maliki tek başına maliktir. Bütün kat maliklerinin payı bulunan yerler eklenti değil ortak yerdir.

olaylar:
  - olay: |
      Ali ile Ayşe, İstanbul Beylikdüzü'nde bulunan bir arsanın yarı yarıya paylı malikleridir. Arsada sekiz daireli, tümü kârgir bir apartman yaptırmak için mimara proje hazırlatmışlardır. Projede sekiz daireye de eşit 1/8 arsa payı verilmiştir; oysa 1 numaralı zemin kat daire bahçe kullanımıyla diğerlerinin yaklaşık iki katı büyüklüktedir ve çok daha değerlidir. Projede bodrumdaki sığınak "9 numaralı bağımsız bölüm (depo)" olarak gösterilmiştir.

      Ali, Ayşe'nin imzasını almadan proje ve yönetim planıyla tapu müdürlüğüne başvurup arsa üzerinde kat irtifakı kurulmasını ister. Ayşe imza atmayı reddeder. Ali ayrıca, kat irtifakı kurulabilmesi için yapı kullanma izin belgesi alınması gerekip gerekmediğini sormaktadır.

      Bir süre sonra Ayşe de projeyi imzalar ve kat irtifakı projedeki hâliyle kurulur. Üç yıl sonra bina tamamlanır, yapının tamamı için yapı kullanma izin belgesi düzenlenir, ama taşınmaz hâlâ kat irtifaklıdır. Ali kat mülkiyetine geçilmesini ister. Ayşe, "Yeni bir yönetim planı yapılmadıkça ve ben imzalamadıkça geçiş olmaz" der.

      1. Ali tek başına kat irtifakı kurdurabilir mi? Kat irtifakı için yapı kullanma izin belgesi aranır mı?
      2. Projedeki eşit arsa payları sorun doğurur mu? Payın ölçütü nedir, oransızlık varsa ne yapılabilir ve sonradan değer artışı payı etkiler mi?
      3. Sığınağın kanuna göre niteliği nedir?
      4. Ali'nin kat mülkiyetine geçiş isteminin Ayşe'nin itirazı karşısındaki durumu nedir?
    olcut:
      - {tespit: "Kat irtifakı isteminin arsa malikinden veya bütün paydaşlardan gelmesi; projenin bütün paydaşların imzalarıyla onaylanması; Ali'nin tek başına kuramaması", puan: 20, madde: "KMK m. 14"}
      - {tespit: "Kat irtifakında yapı kullanma izin belgesi aranmaması; proje ve yönetim planının verilmesi", puan: 10, madde: "KMK m. 14"}
      - {tespit: "Arsa payının bölümün konum ve büyüklüğüne göre hesaplanan değerle oranlı olması; değerleri çok farklı bölümlere eşit pay verilmesinin ölçüte uymaması", puan: 15, madde: "KMK m. 3"}
      - {tespit: "Oransızlıkta her kat maliki veya kat irtifakı sahibinin mahkemeye başvurabilmesi; kanunda süre öngörülmemesi; sonradan değer artışının payı değiştirmemesi", puan: 15, madde: "KMK m. 3"}
      - {tespit: "Sığınağın kanun gereği her hâlde ortak yer sayılması", puan: 10, madde: "KMK m. 4"}
      - {tespit: "Kat irtifakının yapının tamamı için düzenlenen yapı kullanma izin belgesine dayalı olarak resen kat mülkiyetine çevrilmesi; ortak maliklerden birinin istemiyle dahi yapılabilmesi; Ayşe'nin imzasının gerekmemesi", puan: 20, madde: "KMK m. 3"}
      - {tespit: "Geçişte ayrıca yönetim planı istenmemesi; 7327 sayılı Kanunla yeniden yazılan hükme göre başkaca belge aranmaksızın resen çevirme", puan: 10, madde: "KMK m. 10"}
    cozum: |
      **Nitelendirme:** Olayın ilk bölümü yapı henüz yapılmamış bir arsada kat irtifakının kuruluşuna, ikinci bölümü arsa payının ölçütüne, son bölümü kat irtifakından kat mülkiyetine geçişe ilişkindir.

      **Hukuki sorunlar:** (1) Kat irtifakı isteminin kimden geleceği ve hangi belgelerin aranacağı; (2) arsa paylarının ölçütü ve düzeltilmesi; (3) sığınağın niteliği; (4) geçiş için gerekli belge, istem ve ortak malik itirazının etkisi.

      **İlgili hükümler:** KMK m. 1, m. 2/c, m. 3/2-3, m. 4/a, m. 10/6, m. 12/1-a-b, m. 14/1.

      **Değerlendirme:**

      *1. Kuruluş:* Henüz yapı yapılmamış arsada kat irtifakı kurulabilir (KMK m. 1/2). Bunun için arsanın maliki veya bütün paydaşları istemde bulunur ve KMK m. 12/1-a'ya uygun, maliklerin imzalarıyla onaylanan projeyle KMK m. 12/1-b'deki yönetim planını tapu idaresine verir (KMK m. 14/1). Ali ile Ayşe paylı maliktir ve Ayşe imza atmamıştır; bu nedenle Ali tek başına kat irtifakı kurduramaz. Yüklenici talebiyle idarece yapılan tesis yolu (KMK m. 10/5) olayda uygulanamaz, çünkü yüklenici yoktur. Ali'nin sorusunun cevabı da olumsuzdur: Kat irtifakı için yapı kullanma izin belgesi aranmaz, yalnız proje ile yönetim planı verilir (KMK m. 14/1); izin belgesi tamamlanmış yapı için kat mülkiyetinde aranan belgedir (KMK m. 12/1-a).

      *2. Arsa payı:* Kat irtifakı, bağımsız bölümlerin konum ve büyüklüklerine göre hesaplanan değerleriyle oranlı olarak projede tahsis edilen arsa payının açıkça gösterilmesiyle kurulur (KMK m. 3/2). Bahçeli ve iki kat büyük 1 numaralı daireye diğerleriyle eşit 1/8 pay verilmesi değerle oranlılık ölçütüne uymaz. Paylar oransız tahsis edilmişse her kat maliki veya kat irtifakı sahibi, arsa paylarının yeniden düzenlenmesi için mahkemeye başvurabilir; kanunda bu başvuru için süre öngörülmemiştir. Hukuk Genel Kurulu'na göre değer, kat irtifakının kurulduğu tarihteki değeri etkileyen bütün unsurlara bakılarak belirlenir. Yıllar sonra bölümün değeri artsa ya da azalsa bile tahsis edilen arsa payı bu sebeple değiştirilemez (KMK m. 3/2).

      *3. Sığınak:* Sığınaklar KMK m. 4/a gereği her hâlde ortak yerdir. Projede "bağımsız bölüm (depo)" diye gösterilmesinin sonuçları ise tartışmalıdır; bu olayda yalnız kanuna göre niteliği sorulmuştur ve cevabı ortak yer olmasıdır.

      *4. Geçiş:* Kat irtifakı, yapının tamamı için düzenlenecek yapı kullanma izin belgesine dayalı olarak kat mülkiyetine resen çevrilir; bu işlem kat irtifakına sahip ortak maliklerden birinin istemiyle dahi gerçekleştirilebilir (KMK m. 3/3). 7327 sayılı Kanunla yeniden yazılan KMK m. 10/6'ya göre yapı kullanma izin belgesi düzenlenen yapılarda cins değişikliği resen yapılır; taşınmaz kat irtifaklıysa kat irtifakının tesciline ait resmî senede ve KMK m. 12'deki belgelere dayalı olarak başkaca belge aranmaksızın resen kat mülkiyetine çevrilir. Kat mülkiyetine geçişte ayrıca yönetim planı istenmez (KMK m. 14/1). Ayşe'nin yeni plan ve imza şartı bu nedenle dayanaksızdır.

      **Sonuç:**
      - Ali tek başına kat irtifakı kurduramaz; kuruluşta bütün paydaşların istemi ve imzası gerekir. Kat irtifakı için yapı kullanma izin belgesi aranmaz.
      - Eşit pay değerle oranlılık ölçütüne uymaz; oransızlıkta mahkemeye başvurulabilir, sonradan değer değişikliği payı etkilemez.
      - Sığınak kanun gereği her hâlde ortak yerdir.
      - Yapının tamamı için yapı kullanma izin belgesi alındığından Ali'nin istemiyle, Ayşe'nin imzası ve yeni yönetim planı aranmaksızın kat mülkiyetine geçilir.

  - olay: |
      Mehmet, Zeynep ve Can birlikte malik oldukları arsada üç daireli bir bina yaptırmak için kat irtifakı kurmuş, her biri bir bağımsız bölüme bağlı arsa payına sahip olmuştur. Bina projeye uygun tamamlanmış, yapının tamamı için yapı kullanma izin belgesi alınmıştır. Kat irtifakı kat mülkiyetine çevrilmemiştir.

      Mehmet, kat mülkiyetine geçilmesini tek başına ister. Zeynep ile Can, "Hepimizin imzası ve yeni bir yönetim planı şart" diyerek karşı çıkar. Bu arada Zeynep, 3 numaralı bölüme bağlı kat irtifakı ve arsa payını Ahmet'e satar. Mehmet ile Can bu satışa karşı "Öncelikle satın alma hakkımız var" der. Zeynep daha önce, satıştan önce "arsa payını bölümden ayırıp kendime bırakacağım, yalnız bölümü satacağım" fikrini de ortaya atmış, ama bundan vazgeçmiştir.

      Can, bütün bu karışıklıktan bıkarak ortaklığın giderilmesi davası açar ve taşınmazın satılmasını ister.

      1. Mehmet kat mülkiyetine geçişi tek başına isteyebilir mi? Yeni yönetim planı gerekir mi?
      2. Mehmet ve Can'ın önalım hakkı var mıdır?
      3. Zeynep arsa payını bölümden ayırıp kendisinde tutabilir miydi?
      4. Can'ın davası hakkında ne söylenebilir?
    olcut:
      - {tespit: "Kat irtifakının yapının tamamı için yapı kullanma izin belgesine dayalı olarak resen kat mülkiyetine çevrilmesi; ortak maliklerden birinin istemiyle dahi yapılabilmesi", puan: 25, madde: "KMK m. 3"}
      - {tespit: "Yapı kullanma izin belgesi düzenlenen yapıda başkaca belge aranmaksızın resen çevirme; geçişte ayrıca yönetim planı istenmemesi", puan: 15, madde: "KMK m. 10"}
      - {tespit: "Kat irtifakı bağlanmış arsa payının satışında diğer irtifak sahiplerinin önalım hakkının bulunmaması; sözleşmede aksinin kararlaştırılabilmesi", puan: 20, madde: "KMK m. 8"}
      - {tespit: "Arsa payının kat irtifakından veya kat mülkiyetinden ayrı devredilememesi ve başka bir hakla kayıtlanamaması", puan: 15, madde: "KMK m. 5"}
      - {tespit: "Kat irtifakına tabi gayrimenkulde ortaklığın giderilmesinin istenememesi; yasağın bağımsız bölüm için geçerli olmaması", puan: 25, madde: "KMK m. 7"}
    cozum: |
      **Nitelendirme:** Olay, tamamlanmış yapıdaki kat irtifakının kat mülkiyetine geçişine, kat irtifakına bağlı arsa payının satışına ve kat irtifakı kurulu taşınmazda ortaklığın giderilmesi talebine ilişkindir.

      **Hukuki sorunlar:** (1) Geçiş isteminin tek malik tarafından yapılması ve gerekli belgeler; (2) arsa payı satışında önalım hakkı; (3) arsa payının bölümden ayrılması; (4) ortaklığın giderilmesi yasağı.

      **İlgili hükümler:** KMK m. 3/3, m. 5/1, m. 7, m. 8, m. 10/6, m. 14/1.

      **Değerlendirme:**

      *1. Geçiş:* Kat irtifakı arsa payına bağlı bir irtifak çeşididir ve yapının tamamı için düzenlenecek yapı kullanma izin belgesine dayalı olarak kat mülkiyetine resen çevrilir. Bu işlem, arsa malikinin veya kat irtifakına sahip ortak maliklerden birinin istemi ile dahi gerçekleştirilebilir (KMK m. 3/3). Olayda yapının tamamı için izin belgesi vardır, bu nedenle Mehmet tek başına istemde bulunabilir; Zeynep ile Can'ın imzası şart değildir. 7327 sayılı Kanunla yeniden yazılan KMK m. 10/6'ya göre izin belgesi düzenlenen yapılarda taşınmaz kat irtifaklıysa, kat irtifakının tesciline ait resmî senede ve KMK m. 12'deki belgelere dayalı olarak başkaca belge aranmaksızın resen kat mülkiyetine çevrilir. Kat mülkiyetine geçişte ayrıca yönetim planı istenmediğinden (KMK m. 14/1) yeni plan şartı da yersizdir.

      *2. Önalım:* Kat irtifakı bağlanmış arsa payının satılması hâlinde diğer kat maliklerinin veya irtifak hakkı sahiplerinin öncelikle satın alma hakkı yoktur (KMK m. 8/1). Mehmet ve Can, Zeynep'in payı satışında önalım hakkı kullanamaz. Sözleşmede bu maddenin aksine hüküm konulabilir (KMK m. 8/3); olayda böyle bir hüküm anlatılmamıştır. Önalım hakkı ancak bir bağımsız bölümün paydaşları arasında doğar (KMK m. 8/2) ve olayda 3 numaralı bölümün paydaşı yoktur.

      *3. Arsa payının ayrılması:* Arsa payı, kat mülkiyetinden veya kat irtifakından ayrı olarak devredilemez ve başka bir hakla kayıtlanamaz (KMK m. 5/1). Ayrıca kat mülkiyetine bağlanmamış veya lehine kat irtifakı kurulmamış arsa payı bırakılamaz (KMK m. 5/2). Zeynep'in fikri bu yüzden hukuken gerçekleştirilemezdi; satış, kat irtifakı ve ona bağlı arsa payıyla birlikte Ahmet'e geçer.

      *4. Ortaklığın giderilmesi:* Kat mülkiyetine veya kat irtifakına tabi olan gayrimenkulde ortaklığın giderilmesi istenemez (KMK m. 7/1). Yargıtay, yasağın kat irtifakı kurulmuş taşınmazı da kapsadığını kabul etmektedir. Can'ın satış talebi bu yüzden kabul edilemez. Ortaklığın giderilmesi yalnız bir bağımsız bölümün paydaşları arasında istenebilir (KMK m. 7/2); olayda bölümlerin paydaşı yoktur.

      **Sonuç:**
      - Mehmet kat mülkiyetine geçişi tek başına isteyebilir; yeni yönetim planı aranmaz.
      - Mehmet ve Can'ın önalım hakkı yoktur.
      - Zeynep arsa payını bölümden ayıramaz.
      - Can'ın ortaklığın giderilmesi talebi, taşınmaz kat irtifakına tabi olduğu için kabul edilemez.

  - olay: |
      Mirasçılar Elif ve Burak, babaları Fikret'ten kalan, tümü kârgir, iki katlı ve iki daireli bir binanın eşit paylı maliklerdir. Binada kat mülkiyeti kurulmamıştır. Mimari proje vardır; ancak yapı kullanma izin belgesi alınmamıştır ve ikinci katta projeye aykırı bir uygulama vardır. Bodrumda iki kömürlük bulunmakta, bunlardan biri projede doğrudan 1 numaralı daireye tahsis edilmiştir. Diğeri bütün binanın ortak kullanımına açıktır.

      Burak, binanın satılarak ortaklığın giderilmesini ister. Elif ise bir dairenin kendisine, diğerinin Burak'a verilmesini sağlayacak şekilde kat mülkiyeti kurularak paylaşma yapılmasını talep eder. Burak, "Yapı kullanma izin belgesi olmadığı için kat mülkiyeti kurulamaz" diye karşı çıkar. Dairelerin değeri tam olarak eşit olmadığından 1 numaralı dairenin değeri biraz yüksektir.

      1. Hâkim kat mülkiyeti kurarak paylaştırabilir mi? Hangi şartlar aranır?
      2. Yapı kullanma izin belgesinin bulunmaması ve projeye aykırılık ne sonuç doğurur?
      3. Kömürlüklerin hukuki durumu nedir? 1 numaralı daire devredilirse kömürlükler ne olur?
      4. Davanın açılmasından önce yapılması gereken bir işlem var mıdır?
    olcut:
      - {tespit: "Ortaklardan biri isterse hâkimin KMK m. 12'deki belgelere dayanarak mülkiyeti kat mülkiyetine çevirebilmesi ve paylar denkleştirilerek bağımsız bölümleri ortaklara tahsis edebilmesi; Burak'ın satış istemiyle bağlı olmaması", puan: 25, madde: "KMK m. 10"}
      - {tespit: "Aranan şartlar: elverişlilik, bağımsız bölümler, her paydaşa en az bir bölüm, tümü kârgir olma", puan: 20, madde: "KMK m. 50"}
      - {tespit: "KMK m. 12 belgelerinin ibrazı; giderilebilir eksiklikte isteyen tarafa yetki ve süre verilmesi; giderilemezse satış", puan: 20, madde: "KMK m. 12"}
      - {tespit: "Doğrudan 1 numaralı daireye tahsisli kömürlüğün eklenti, bütünleyici parça ve beyanlar hanesine yazılan yer olması; genel kömürlüğün ortak yer olması", puan: 15, madde: "KMK m. 6"}
      - {tespit: "Bağımsız bölümün devriyle eklentinin kendiliğinden devredilmiş sayılması; ortak yerin arsa payı oranında paylı olması", puan: 10, madde: "KMK m. 16"}
      - {tespit: "Ortaklığın giderilmesi uyuşmazlığında dava öncesi arabulucuya başvurunun dava şartı olması", puan: 10, madde: "HUAK m. 18/B"}
    cozum: |
      **Nitelendirme:** Olayda, kat mülkiyetine konu olmaya elverişli bir binada paylı mülkiyetin kat mülkiyeti kurularak giderilmesi (aynen taksim) ile satış yoluyla giderilmesi talepleri çatışmaktadır. Kömürlükler bakımından eklenti ve ortak yer ayrımı da söz konusudur.

      **Hukuki sorunlar:** (1) Hâkimin kat mülkiyeti kurma yetkisi ve şartları; (2) KMK m. 12 belgelerinin eksikliği; (3) eklenti ve ortak yer; (4) dava şartı.

      **İlgili hükümler:** KMK m. 6/1-2-4, m. 10/7, m. 12, m. 16/1, m. 50/2; HUAK m. 18/B.

      **Değerlendirme:**

      *1. Hâkimin yetkisi:* Kat mülkiyetine konu olmaya elverişli bir gayrimenkul üzerindeki ortaklığın giderilmesi davasında mirasçılardan veya ortak maliklerden biri paylaşmanın kat mülkiyeti kurulması ve bağımsız bölümlerin tahsisi suretiyle yapılmasını isterse hâkim, mülkiyetin KMK m. 12'deki belgelere dayanılarak kat mülkiyetine çevrilmesine ve paylar denkleştirilerek bağımsız bölümlerin ortaklara ayrı ayrı tahsisine karar verebilir (KMK m. 10/7). Elif'in istemi bu hükmün kapsamındadır; Burak'ın satış talebi hâkimi bağlamaz. Uygulamada bu yol, kat mülkiyeti kurularak aynen taksim diye anılır. Hukuk Genel Kurulu'na göre aranan şartlar şunlardır: ortaklardan birinin istemi, yapının kat mülkiyetine elverişli olması, bağımsız bölümler içermesi, her paydaşa en az bir bağımsız bölüm düşmesi ve KMK m. 12'deki belgelerin ibrazı. Tümü kârgir olma şartı da aranır (KMK m. 50/2); binanın tümü kârgir olduğundan sorun yoktur. Dairelerin değeri farklı olduğundan paylar denkleştirilir (KMK m. 10/7).

      *2. Eksik belgeler:* Yapı kullanma izin belgesi, KMK m. 12/1-a'daki projeyle birlikte aranan belgedir. Burak'ın "izin belgesi olmadığı için kat mülkiyeti kurulamaz" savunması, Hukuk Genel Kurulu'nun kabul ettiği yerleşik uygulama karşısında doğrudan sonuç vermez: Projeye aykırılık veya projesizlik gibi eksiklikler giderilebiliyorsa hemen kurulamaz sonucuna varılmaz, isteyen tarafa eksikleri tamamlaması için yetki ve süre verilir. Eksiklikler giderilemezse ya da süre içinde giderilmezse satış yoluyla ortaklığın giderilmesine karar verilir. Olayda ikinci kattaki aykırılığın giderilebilir olup olmadığı araştırılmalıdır.

      *3. Kömürlükler:* Kat mülkiyeti henüz kurulmadığından bugün bina TMK'ya göre paylı mülkiyettedir; aşağıdaki sonuçlar, kat mülkiyetinin bu proje esas alınarak kurulması hâlinde doğar. Projede doğrudan 1 numaralı daireye tahsis edilen kömürlük eklentidir. Eklenti, bağımsız bölümün bütünleyici parçası sayılır ve bölüm maliki eklentinin tek başına malikidir (KMK m. 6/1); kömürlük kat mülkiyeti kütüğünün beyanlar hanesine kaydedilir (KMK m. 6/2). Bütün binanın ortak kullanımına açık olan diğer kömürlük ise ortak yerdir; kat malikleri ona arsa payları oranında ortak mülkiyet hükümlerine göre malik olur (KMK m. 16/1). 1 numaralı daire devredilirse eklenti kendiliğinden devredilmiş olur (KMK m. 6/4).

      *4. Dava öncesi:* Taşınır ve taşınmazların paylaştırılmasına ve ortaklığın giderilmesine ilişkin uyuşmazlıklarda dava açılmadan önce arabulucuya başvurulmuş olması dava şartıdır (HUAK m. 18/B).

      **Sonuç:**
      - Ortaklardan biri istediği için hâkim, KMK m. 12 belgelerine dayanarak kat mülkiyeti kurup payları denkleştirerek daireleri tahsis edebilir; tümü kârgir şartı sağlanmıştır.
      - Eksikler giderilebilir nitelikteyse tamamlatma için yetki ve süre verilir; giderilemezse satışa karar verilir.
      - Kat mülkiyeti kurulursa 1 numaralı daireye tahsisli kömürlük eklentidir ve daireyle birlikte devredilir; diğer kömürlük ortak yerdir.
      - Dava öncesi arabulucuya başvuru dava şartıdır.

kartlar:
  - on: "Kat mülkiyeti ile kat irtifakının temel farkı? (KMK m. 1)"
    arka: "Kat mülkiyeti tamamlanmış yapının bağımsız bölümleri üzerinde, kat irtifakı yapılmakta veya ileride yapılacak yapının bölümleri için kurulur. İkisinde de bölüm ayrı ayrı ve başlı başına kullanılmaya elverişli olmalıdır."
  - on: "Bağımsız bölüm, eklenti, ortak yer: tanımlar? (KMK m. 2)"
    arka: "Bağımsız bölüm: ayrı ayrı ve başlı başına kullanılmaya elverişli bölüm. Eklenti: bölümün dışında olup doğrudan o bölüme tahsis edilmiş yer. Ortak yer: bölümler dışında kalıp korunma ve ortaklaşa kullanma veya faydalanmaya yarayan yer."
  - on: "Kat mülkiyeti nasıl bir mülkiyettir? (KMK m. 3/1)"
    arka: "Arsa payı ve anagayrimenkuldeki ortak yerlerle bağlantılı özel bir mülkiyettir. Tescil edilen her bağımsız bölüm ayrı bir gayrimenkuldür (KMK m. 13/4)."
  - on: "Arsa payının ölçütü nedir? (KMK m. 3/2)"
    arka: "Bağımsız bölümün konum ve büyüklüğüne göre hesaplanan değeriyle oranlı olmalıdır. Oransızlıkta her kat maliki veya kat irtifakı sahibi mahkemeye başvurabilir."
  - on: "Değer sonradan artarsa arsa payı değişir mi?"
    arka: "Hayır. Tahsis edilen arsa payı, bölümün değerinde sonradan meydana gelen çoğalma veya azalma sebebiyle değiştirilemez (KMK m. 3/2). KMK m. 44 saklıdır."
  - on: "Arsa payı düzeltme davasında değer hangi tarihe göre belirlenir?"
    arka: "Hukuk Genel Kurulu'na göre kat irtifakının (doğrudan kat mülkiyeti kurulmuşsa o tarihin) kuruluş tarihindeki değere göre. Kanunda süre öngörülmemiştir."
  - on: "Arsa payı hangi bakımdan bölüme bağlıdır? (KMK m. 5)"
    arka: "Bölümden ayrı devredilemez, miras yoluyla ayrı geçmez, başka bir hakla kayıtlanamaz. Bağlanmamış arsa payı bırakılamaz. Kat mülkiyetini kayıtlayan haklar arsa payını da kayıtlar."
  - on: "Her hâlde ortak yer sayılanlara örnekler? (KMK m. 4)"
    arka: "Temeller, ana duvarlar, taşıyıcı sistem elemanları, çatılar, asansörler, merdivenler, kapıcı daire veya odaları, sığınaklar, ortak tesisat ve şebekeler. Sayılanlar dışında ortak kullanım için zorunlu yerler de ortak yerdir."
  - on: "KMK'deki eklenti ile TMK m. 686'daki eklenti farkı?"
    arka: "TMK'da eklenti asıl şeye özgülenen taşınır maldır. KMK'de eklenti bağımsız bölüme tahsis edilmiş bir yerdir; bölümün bütünleyici parçasıdır, beyanlar hanesine yazılır, bölümle birlikte devredilir."
  - on: "Kat mülkiyetine veya kat irtifakına tabi taşınmazda ortaklığın giderilmesi istenebilir mi? (KMK m. 7)"
    arka: "Hayır. Anagayrimenkulde istenemez; bağımsız bölümlerde (paydaşlar arasında) istenebilir. Yasak kat irtifakı kurulu taşınmazı da kapsar."
  - on: "Bağımsız bölüm satışında önalım hakkı? (KMK m. 8)"
    arka: "Diğer kat maliklerinin ve irtifak sahiplerinin önalım hakkı yoktur. Bir bağımsız bölümün paydaşları arasında vardır. Sözleşmeyle aksi kararlaştırılabilir."
  - on: "Kat mülkiyeti ve kat irtifakı ne zaman doğar? (KMK m. 10/1)"
    arka: "Resmî senetle ve tapu siciline tescil ile. Resmî sözleşme aynı zamanda tescil istemi sayılır (KMK m. 13/1)."
  - on: "Yalnız bir bölümde kat mülkiyeti kurulabilir mi?"
    arka: "Hayır. Anagayrimenkulün tümü kat mülkiyetine çevrilmeden yalnız bir veya birkaç bölüm üzerinde kurulamaz (KMK m. 10/2). Tümü kârgir olmayan yapıda da kurulamaz (KMK m. 50/2)."
  - on: "Kat mülkiyeti kurulması için hangi belgeler gerekir? (KMK m. 12)"
    arka: "İstem malik veya bütün paydaşlardan gelir. Maliklerin imzalarıyla onaylı mimari proje ile yapı kullanma izin belgesi ve imzalanmış yönetim planı verilir."
  - on: "Kat irtifakı için hangi belgeler gerekir? (KMK m. 14/1)"
    arka: "Arsa maliki veya bütün paydaşlarının istemi, maliklerin imzalarıyla onaylı proje ve yönetim planı. Yapı kullanma izin belgesi aranmaz."
  - on: "Kat irtifakında arsa payları nerede gösterilir? (KMK m. 14/2)"
    arka: "Arsanın kayıtlı olduğu kütüğün beyanlar hanesinde. Kat mülkiyetinde ise her bölüm kat mülkiyeti kütüğünün ayrı sayfasına arsa payıyla tescil edilir (KMK m. 13)."
  - on: "Kat irtifakından kat mülkiyetine geçiş hangi maddelerdedir?"
    arka: "KMK m. 3/3 ve KMK m. 10/6. Yapının tamamı için yapı kullanma izin belgesine dayalı olarak resen çevrilir; ortak maliklerden birinin istemi de yeter. KMK m. 14 kuruluşu düzenler."
  - on: "📌 7327 sayılı Kanunla KMK m. 10/6 ne getirdi?"
    arka: "Yapı kullanma izin belgesi düzenlenen yapılarda cins değişikliği resen yapılır; kat irtifaklı taşınmaz resmî senet ve KMK m. 12 belgelerine dayanılarak başkaca belge aranmaksızın resen kat mülkiyetine çevrilir. İşlemler döner sermaye hizmet bedelinden muaftır."
  - on: "7327 sayılı Kanunun diğer değişiklikleri?"
    arka: "KMK m. 10/5'te ibare değişikliği (cins değişikliği ifadesi çıkarıldı), KMK m. 14/3'ün mülga edilmesi ve Kat Mülkiyeti Kanunu'nun geçici 1. maddesinin değişmesi."
  - on: "Kat irtifakı sahibinin tamamlanmayı isteme hakkı hangi maddede? (m. 26 değil)"
    arka: "KMK m. 17/1: sözleşmede yazılı sürede yapının başlaması ve tamamlanması için borçların yerine getirilmesini karşılıklı isteme ve dava etme hakkı. KMK m. 26 borçları düzenler."
  - on: "Kat irtifakında yapı fiilen tamamlanmışsa yönetim nasıl işler? (KMK m. 17/3)"
    arka: "Yapı fiilen tamamlanmış ve bağımsız bölümlerin üçte ikisi kullanılmaya başlanmışsa kat mülkiyetine geçilmemiş olsa dahi yönetimde kat mülkiyeti hükümleri uygulanır. Mülkiyet statüsü değişmez."
  - on: "Kat irtifakı sahibi borcunu ödemezse ne olur? (KMK m. 26/2)"
    arka: "Noter ihtarından başlayarak iki ay içinde yerine getirmezse diğerlerinin yazılı istemiyle hâkim, payın hükme en yakın tarihteki değeri karşılığında öteki paydaşlara arsa payları oranında devrine karar verir."
  - on: "Kat irtifakı beş yıl içinde yapı yapılmazsa ne olur? (KMK m. 49/3)"
    arka: "Verilen plana göre beş yıl içinde yapı yapılmazsa maliklerden birinin istemiyle sulh hâkimi kat irtifakının sona ermesine veya belli bir süre için uzatılmasına karar verir. Kendiliğinden sona ermez."
  - on: "Ortaklığın giderilmesi davasında kat mülkiyeti kurulabilir mi? (KMK m. 10/7)"
    arka: "Evet. Ortaklardan biri isterse hâkim, KMK m. 12 belgelerine dayanarak kat mülkiyetine çevirmeye ve paylar denkleştirilerek bölümleri ortaklara tahsise karar verebilir. Belge eksikliği giderilebilir nitelikteyse önce tamamlatılır."
