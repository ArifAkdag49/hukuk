  - id: "1231013600"
    ozet: |
      Bir belediye, meclis kararına dayanarak bir arsayı ihaleyle davalılardan birine satmış, arsa on iki parsele ayrılmıştır. Meclis kararı idare mahkemesince iptal edilip Danıştay incelemesinden geçerek kesinleşince belediye, ilk alıcı, ara malikler ve son kayıt maliki aleyhine tapu iptali ve tescil davası açmıştır. Dava konusu parsel kısa aralıklarla, akit tablosunda birkaç bin liralık bedellerle ve aynı emlakçı ya da onunla bağlantılı kişilerin vekâletiyle el değiştirmiştir. İptal kararı da ara maliklere yapılan satışlardan önce yerel basında yer almıştır. İlk derece mahkemesi davayı reddetmiş, bölge adliye mahkemesi kabul etmiştir. Yargıtay 1. Hukuk Dairesinin birbirine zıt iki bozmasından sonra bölge adliye mahkemesi davayı kabul etmiş, dosya temyiz üzerine Hukuk Genel Kurulu'na gelmiştir. Kurul oy çokluğuyla kabul kararını onamıştır. Gerekçeye göre dayanağı iptal edilen tescil yolsuzdur. İyiniyet karine olsa da sık el değiştirme ve düşük bedel gibi fiilî karineler kötüniyeti gösterebilir. Bedel ödenmesi tek başına yetmez, önemli olan alıcının durumu bilip bilmediği ya da özen gösterse bilebilecek olup olmadığıdır. Ara malikler ve son malik bilmesi gereken kişi sayılmış, TMK m. 1023 korumasından yararlandırılmamıştır. Konuya katkısı: yolsuzluğun sonradan da doğabileceğini ve iyiniyetin fiilî karinelerle nasıl çürütüldüğünü gösterir.
  - id: "1228761400"
    ozet: |
      Davacının dairesi, kendisi adına verilmiş bir vekâletnameyle 2014'te bir şirkete satılmış, şirket sekiz gün sonra daireyi bir banka lehine ipotek etmiştir. Davacı daha sonra kısıtlanmış, satış ehliyetsizlik nedeniyle yolsuz tescil sayılarak iptal edilmiş ve tapu kaydı düzeltilmiştir. Bu davada davacı, şirket malikken konulan ipotek ve haciz şerhlerinin terkinini istemiştir. İlk derece mahkemesi davayı kabul etmiş, bölge adliye mahkemesi banka yönünden reddetmiştir. Yargıtay 7. Hukuk Dairesi bütün şerhlerin kaldırılması gerektiği gerekçesiyle bozmuş, bölge adliye mahkemesi direnmiştir. Hukuk Genel Kurulu oy çokluğuyla direnme kararını onamıştır. İpotek, kısıtlama kararından ve iptal davasındaki ihtiyati tedbirin tapuya işlenmesinden önce kurulmuştur. Bankanın ehliyetsizliği bildiği ya da bilmesi gerektiği ispatlanamadığından ipotek TMK m. 1023 gereği korunur. Tedbir şerhinden sonra konulan hacizlerin terkini ise yerindedir, çünkü sicildeki şerhi kimse bilmediğini ileri süremez. Karşı oya göre ehliyetsizlikte kayıt baştan hükümsüz olduğundan TMK m. 1023 uygulanmamalıydı. Konuya katkısı: güven ilkesinin ipotek gibi sınırlı ayni haklarda da işlediğini, şerhin önemini ve ehliyetsizlik tartışmasını gösterir.
  - id: "638269300"
    ozet: |
      Mirasbırakan baba, bir taşınmazdaki iki daireye karşılık gelen arsa payını 1997'de tek erkek çocuğu olan davalıya satış göstererek devretmiştir. Ölen kızının mirasçıları, devrin mirasçılardan mal kaçırmak amacıyla yapılmış muvazaalı bir bağış olduğunu ileri sürerek miras payları oranında tapu iptali ve tescil istemiştir. İlk derece mahkemesi, gösterilen bedel ile gerçek değer arasında yaklaşık on beş katlık fark bulunduğunu, mirasbırakanın geliri ve başka taşınmazları olduğu için satmaya ihtiyacı olmadığını, bedelin ödendiğinin kanıtlanamadığını belirterek davayı kabul etmiştir. Yargıtay 1. Hukuk Dairesi bedel farkının tek başına muvazaayı kanıtlamadığı gerekçesiyle bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu oy çokluğuyla direnme kararını onamıştır. Gerekçeye göre muris muvazaasının dayanağı 1974 tarihli İçtihadı Birleştirme Kararıdır. Kabul için mal kaçırma amacı şarttır ve ispat yükü davacıdadır. Mirasçılar sözleşmenin dışında oldukları için her türlü delile dayanabilir. Bedel farkı tek başına yetmez, ama satış ihtiyacının yokluğu ve aile ilişkileriyle birlikte muvazaanın göstergesidir. Konuya katkısı: muris muvazaasının şartlarını ve ispatta kullanılan ölçütleri gösterir.

sorular:
  - soru: |
      TMK m. 1024/2'ye göre aşağıdaki tescillerden hangisi **yolsuzdur**?
    siklar:
      - "Resmî şekilde yapılmış geçerli bir satış sözleşmesine dayanılarak alıcı adına yapılan tescil"
      - "Ayırt etme gücü bulunmayan malikin yaptığı satışa dayanılarak alıcı adına yapılan tescil"
      - "Kesinleşmiş bir mahkeme kararına dayanılarak yapılan tescil"
      - "Mirasçılık belgesine dayanılarak mirasçılar adına yapılan tescil"
    dogru: 1
    aciklama: |
      Ayırt etme gücü bulunmayan kimsenin fiilleri hukuki sonuç doğurmaz (TMK m. 15). Bu satışa dayanan tescil hukuki sebepten yoksundur ve TMK m. 1024/2 uyarınca yolsuzdur. Geçerli satış, kesinleşmiş mahkeme kararı ve mirasçılık belgesi ise geçerli hukuki sebeplerdir.

  - soru: |
      TMK m. 1023'ün koruduğu kişi aşağıdakilerden hangisidir?
    siklar:
      - "Yolsuz tescilin lehine yapıldığı kişi, iyiniyetli olması şartıyla"
      - "Malikle resmî satış vaadi sözleşmesi yapmış ama henüz adına tescil yapılmamış alıcı"
      - "Tapu kütüğündeki tescile iyiniyetle dayanarak mülkiyet veya başka bir ayni hak kazanan üçüncü kişi"
      - "Yolsuz kaydı mirasbırakanından miras yoluyla edinen mirasçı"
    dogru: 2
    aciklama: |
      TMK m. 1023, tapu kütüğündeki tescile iyiniyetle dayanarak mülkiyet veya başka bir ayni hak kazanan üçüncü kişiyi korur. Yolsuz tescilin lehtarı (ilk el) üçüncü kişi değildir. Satış vaadi alıcısının henüz yalnız kişisel hakkı vardır. Mirasçı ise mirasbırakanın yerine geçer, kayda güvenerek hak kazanmış sayılmaz.

  - soru: |
      Yolsuz tescile dayanan bir tapu iptali davasında son kayıt malikinin **kötüniyetli olduğunu** kim ispatlar?
    siklar:
      - "Son kayıt maliki, iyiniyetli olduğunu ispat etmek zorundadır."
      - "İyiniyet karine olduğundan kötüniyeti iddia eden davacı ispatlar. Bunun için fiilî karinelerden yararlanabilir."
      - "Tapu müdürlüğü, işlem dosyasını sunarak ispatlar."
      - "Kimse ispat yükü taşımaz; hâkim yalnız bedelin ödenip ödenmediğine bakar."
    dogru: 1
    aciklama: |
      Kanunun iyiniyete sonuç bağladığı durumlarda asıl olan iyiniyetin varlığıdır (TMK m. 3/1). Bu yüzden kötüniyeti iddia eden ispatlar. Kötüniyeti ispat zor olduğundan sık el değiştirme ya da çok düşük bedel gibi fiilî karinelerden yararlanılır. Bedelin ödenmesi tek başına iyiniyeti göstermez.

  - soru: |
      Yurt dışında yaşayan Murat adına sahte imzalı bir vekâletname düzenlenmiş ve Murat'ın dairesi bu vekâletnameyle Okan'a satılmıştır. Okan bedeli tam olarak ödemiştir ve sahtecilikten haberi yoktur. Daire hâlâ Okan adına kayıtlıdır. Murat'ın açtığı tapu iptali ve tescil davası hakkında hangisi doğrudur?
    siklar:
      - "Okan bedeli ödediği ve iyiniyetli olduğu için TMK m. 1023 gereği korunur, dava reddedilir."
      - "Okan yolsuz işlemin tarafı (ilk el) olduğundan TMK m. 1023'ten yararlanamaz, kayıt iptal edilir."
      - "Dava ancak sahtecilik nedeniyle ceza mahkûmiyeti kesinleşirse kabul edilebilir."
      - "Murat yalnız Devlete karşı tazminat isteyebilir, kaydın iptalini isteyemez."
    dogru: 1
    aciklama: |
      Sahte vekâletnameyle yapılan devir Murat'ın iradesine dayanmaz, tescil yolsuzdur (TMK m. 1024/2). TMK m. 1023 sicile güveneni korur. Okan ise sicile değil sahte vekâletnameye güvenmiştir ve yolsuz kaydın bizzat lehtarıdır. İlk elin iyiniyeti araştırılmaz. Taşınmaz Okan'da olduğu için kayıt iptal edilir. Okan ödediği bedeli sahtecilik faillerinden ister.

  - soru: |
      Hakan, Selin aleyhine tapu iptali ve tescil davası açmış, mahkemenin kararıyla dava taşınmazın tapu kaydına şerh edilmiştir. Selin iki ay sonra taşınmazı Ece'ye satmıştır. Ece, şerhi fark etmediğini ve iyiniyetli olduğunu ileri sürmektedir. Hangisi doğrudur?
    siklar:
      - "Ece iyiniyetli olduğu için TMK m. 1023 gereği korunur."
      - "Kimse sicildeki bir kaydı bilmediğini ileri süremeyeceğinden ve şerh sonradan hak kazananlara karşı ileri sürülebildiğinden Ece iyiniyet iddiasında bulunamaz."
      - "Şerh yalnız Selin'i bağlar, Ece'yi bağlamaz."
      - "Ece'nin iyiniyetli olmadığını Hakan ayrıca tanıkla ispat etmelidir."
    dogru: 1
    aciklama: |
      Kimse tapu sicilindeki bir kaydı bilmediğini ileri süremez (TMK m. 1020/3). Çekişmeli hakların korunmasına ilişkin mahkeme kararları şerh verilmekle taşınmaz üzerinde sonradan hak kazananlara karşı ileri sürülebilir (TMK m. 1010/2). Bu yüzden şerhten sonra alan Ece'nin ayrıca kötüniyetli olduğunun ispatına gerek yoktur. Hakan davaya Ece'ye karşı devam edebilir (HMK m. 125/1).

  - soru: |
      Evli olmayan ve çocuğu bulunmayan Kemal'in ana ve babası ondan önce ölmüştür. Tek yasal mirasçısı kardeşi Nur'dur. Kemal sağlığında, Nur'dan mal kaçırmak amacıyla tapulu evini komşusu Tarık'a satış göstererek bağışlamıştır. Kemal'in ölümünden sonra Nur'un açacağı dava hakkında hangisi doğrudur?
    siklar:
      - "Kardeşlerin saklı payı bulunmadığından Nur hiçbir dava açamaz."
      - "Nur yalnız tenkis davası açabilir."
      - "Muris muvazaasında saklı payı olsun olmasın miras hakkı çiğnenen her yasal mirasçı dava açabileceğinden Nur tapu iptali ve tescil isteyebilir."
      - "Nur ancak Kemal'in sağlığında dava açmış olsaydı bu istemde bulunabilirdi."
    dogru: 2
    aciklama: |
      Kardeşlerin saklı payı yoktur (TMK m. 506'nın 3. bendi 2007'de yürürlükten kaldırıldı). Bu yüzden tenkis isteyemez (TMK m. 560). Ama 1974 tarihli İçtihadı Birleştirme Kararına göre, mirasçıdan mal kaçırmak amacıyla satış gibi gösterilen bağışlamada, saklı payı olsun olmasın miras hakkı çiğnenen bütün mirasçılar görünüşteki satışın muvazaalı, gizli bağışın da şekilden yoksun olduğunu ileri sürerek dava açabilir. Dava mirasın açılmasından sonra açılır.

  - soru: |
      Muris muvazaasına dayanan tapu iptali ve tescil davasının açılma süresi hakkında hangisi doğrudur?
    siklar:
      - "Mirasın açılmasından itibaren bir yıl içinde açılmalıdır."
      - "Öğrenmeden itibaren bir yıl, her hâlde mirasın açılmasından itibaren on yıl içinde açılmalıdır."
      - "Herhangi bir zamanaşımı ya da hak düşürücü süreye bağlı değildir."
      - "Temlik tarihinden itibaren on yıl içinde açılmalıdır."
    dogru: 2
    aciklama: |
      Muris muvazaasında işlem geçersizdir ve tescil yolsuzdur. Yargıtay'a göre yolsuz tescile dayanan dava süreye bağlı değildir. Bir yıl ve on yıllık süreler tenkis davasına aittir (TMK m. 571/1), tenkis ise geçerli tasarruflara karşı açılır.

  - soru: |
      Muris muvazaasına dayanan bir davanın kabul edilebilmesi için aşağıdakilerden hangisi **mutlaka** gereklidir?
    siklar:
      - "Mirasbırakanın gerçek amacının mirasçılarından mal kaçırmak olması"
      - "Tapuda gösterilen bedelin rayiç değerin altında olması"
      - "Davacının saklı pay sahibi olması"
      - "Taşınmazı devralanın mirasçı olmayan bir yabancı olması"
    dogru: 0
    aciklama: |
      Muris muvazaasını diğer muvazaa türlerinden ayıran unsur mirasçıları aldatma, yani mal kaçırma amacıdır. Bu amaç yoksa 1974 tarihli İBK uygulanmaz. Bedel farkı önemli bir göstergedir ama tek başına yetmez. Saklı pay şartı yoktur. Devralan çoğu zaman mirasçılardan biridir (ör. kayırılan çocuk).

  - soru: |
      Selin, malik Tuncay ile noterde resmî şekilde taşınmaz satış vaadi sözleşmesi yapmış, bedeli ödemiştir. Tuncay devirden kaçınmaktadır ve tapu kaydı Tuncay adına doğru biçimde durmaktadır. Selin hangi davayı açmalıdır?
    siklar:
      - "TMK m. 1025'e dayanan tapu sicilinin düzeltilmesi davası"
      - "TMK m. 716'ya dayanan tescile zorlama (mülkiyetin hükmen geçirilmesi) davası"
      - "TMK m. 1026'ya dayanan terkine karşı dava"
      - "TMK m. 1027'ye dayanan sicildeki yanlışlığın düzeltilmesi davası"
    dogru: 1
    aciklama: |
      Ortada yolsuz bir tescil yoktur, kayıt doğrudur. Selin'in ayni hakkı değil, tescil istemeye yönelik kişisel hakkı vardır. Malik kaçınırsa hâkimden mülkiyetin hükmen geçirilmesini ister (TMK m. 716/1). TMK m. 1025 davası ayni hakkı zedelenen kişiye aittir.

  - soru: |
      İzmir'deki bir dairenin sahte vekâletnameyle satıldığını ileri süren Aylin, Ankara'da oturan son kayıt maliki aleyhine tapu iptali ve tescil davası açacaktır. Yetkili mahkeme hangisidir?
    siklar:
      - "Davalının yerleşim yeri olan Ankara mahkemesi"
      - "Davacının yerleşim yeri mahkemesi"
      - "Taşınmazın bulunduğu İzmir mahkemesi, kesin yetkili olarak"
      - "Tarafların sözleşmeyle belirleyeceği herhangi bir yer mahkemesi"
    dogru: 2
    aciklama: |
      Taşınmaz üzerindeki ayni hakka ilişkin ya da ayni hak sahipliğinde değişikliğe yol açabilecek davalarda taşınmazın bulunduğu yer mahkemesi kesin yetkilidir (HMK m. 12/1). Kesin yetki nedeniyle yetki sözleşmesi yapılamaz. Görevli mahkeme asliye hukuk mahkemesidir (HMK m. 2/1).

  - soru: |
      Oya, kardeşi Taner'e karşı muris muvazaasına dayanan tapu iptali davası açmıştır. Tapuya şerh verilmemiştir. Taner yargılama sürerken taşınmazı üçüncü bir kişiye satmıştır. Oya'nın HMK m. 125'e göre seçebileceği yollar hangisinde doğru verilmiştir?
    siklar:
      - "Dava konusuz kalır ve düşer, Oya ayrı bir dava açmalıdır."
      - "Oya ya davaya devralana karşı devam eder ya da davasını Taner hakkında tazminat davasına dönüştürür."
      - "Oya yalnız Taner'e karşı davaya aynen devam eder, devralan davadan etkilenmez."
      - "Devralan kendiliğinden davalı olur, Oya'nın seçim hakkı yoktur."
    dogru: 1
    aciklama: |
      HMK m. 125/1'e göre davalı dava konusunu üçüncü kişiye devrederse davacı ya devralana karşı davaya devam eder ya da davasını devreden hakkında tazminat davasına dönüştürür. Şerh bulunmadığından devralan TMK m. 1023'e dayanabilir. Bu yüzden devralan iyiniyetliyse tazminat yolu Oya için daha güvenlidir.

  - soru: |
      TMK m. 712'ye göre geçerli bir hukuki sebep olmaksızın tapuya malik olarak yazılan kişinin mülkiyetine hangi durumda artık itiraz edilemez?
    siklar:
      - "Kayıt tarihinden itibaren beş yıl geçince"
      - "Zilyetliğini davasız ve aralıksız olarak on yıl süreyle ve iyiniyetle sürdürünce"
      - "Taşınmazı yirmi yıl malik sıfatıyla kullanınca, iyiniyet aranmaksızın"
      - "Vergi kaydını kendi adına çıkarınca"
    dogru: 1
    aciklama: |
      Olağan kazandırıcı zamanaşımında, geçerli bir hukuki sebep olmaksızın malik yazılan kişi zilyetliğini davasız, aralıksız ve iyiniyetle on yıl sürdürürse mülkiyetine itiraz edilemez (TMK m. 712). Bu, iptal davasının süresizliğine önemli bir sınırdır. Yirmi yıllık süre olağanüstü zamanaşımına aittir ve tapusuz taşınmazlarla ilgilidir.

  - soru: |
      TMK m. 1026'ya göre tapu memurunun sona eren bir ayni hakkı terkin etmesi üzerine ilgililer terkine karşı hangi süre içinde dava açabilir?
    siklar:
      - "Terkin tarihinden itibaren bir yıl"
      - "İşlemin kendisine tebliği tarihinden itibaren otuz gün"
      - "Öğrenmeden itibaren iki ay, her hâlde bir yıl"
      - "Süre yoktur, her zaman açılabilir"
    dogru: 1
    aciklama: |
      TMK m. 1026/2'ye göre tapu memuru terkin istemini yerine getirirse her ilgili, bu işlemin kendisine tebliği tarihinden başlayarak otuz gün içinde terkine karşı dava açabilir. Bu süre, süreye bağlı olmayan yolsuz tescil davasıyla karıştırılmamalıdır.

  - soru: |
      Tapu sicilinde basit yazı yanlışlığı **dışında** kalan bir yanlışlık bulunduğunda, ilgililerin yazılı rızası yoksa tapu memuru bunu nasıl düzeltebilir?
    siklar:
      - "Tapu müdürünün onayıyla"
      - "Kadastro müdürlüğünün yazısıyla"
      - "Ancak mahkeme kararıyla"
      - "Malikin tek taraflı dilekçesiyle"
    dogru: 2
    aciklama: |
      İlgililerin yazılı rızaları olmadıkça tapu memuru sicildeki yanlışlığı ancak mahkeme kararıyla düzeltebilir (TMK m. 1027/1). Basit yazı yanlışlıklarını ise Cumhurbaşkanınca çıkarılan yönetmelik uyarınca re'sen düzeltir (TMK m. 1027/3).

  - soru: |
      Gül, tarlasını satması için yeğeni Can'a özel yetkili vekâletname vermiştir. Can tarlayı piyasa değerinden, kendisiyle hiçbir ilişkisi olmayan ve durumu bilmesine imkân bulunmayan Mert'e satmış, ama bedeli Gül'e vermeyip harcamıştır. Hangisi doğrudur?
    siklar:
      - "Vekâlet kötüye kullanıldığı için satış her durumda Gül'ü bağlamaz, tapu iptal edilir."
      - "Mert iyiniyetli olduğundan satış geçerlidir ve Gül'ü bağlar. Gül, Can'dan zararını ister."
      - "Satış ancak Gül onaylarsa geçerli olur."
      - "Mert, bedeli bir kez de Gül'e ödemek zorundadır."
    dogru: 1
    aciklama: |
      Can'ın satış yetkisi vardır (TBK m. 504/3). Yetki kötüye kullanılmış olsa da karşı taraf iyiniyetliyse, yani kötüye kullanmayı bilmiyor ve özen gösterse de bilemiyorsa sözleşme vekâlet vereni bağlar. Sorun vekille vekâlet veren arasında kalır. Gül, sadakat ve özen borcuna aykırı davranan Can'dan zararını ister (TBK m. 506/2).

  - soru: |
      Leyla, oğlu Kaan'a yalnız kira sözleşmelerini yapma ve kira tahsil etme yetkisi veren bir vekâletname vermiştir. Vekâletnamede taşınmaz satma yetkisi yoktur. Kaan bu vekâletnameyle Leyla'nın dairesini Berk'e satmış, satış tapuda yapılmıştır. Leyla satışı onaylamamaktadır. Hangisi doğrudur?
    siklar:
      - "Vekâletname noterde düzenlendiği için satış geçerlidir."
      - "Taşınmaz devri özel yetki gerektirdiğinden satış yetkisiz temsildir. Leyla onaylamadıkça onu bağlamaz ve tescil yolsuzdur."
      - "Berk iyiniyetliyse TMK m. 1023 gereği her durumda korunur."
      - "Satış geçerlidir, Leyla yalnız Kaan'dan tazminat isteyebilir."
    dogru: 1
    aciklama: |
      Vekil, özel olarak yetkili kılınmadıkça taşınmazı devredemez (TBK m. 504/3). Yetkisiz temsilcinin yaptığı işlem ancak temsil olunan onaylarsa onu bağlar (TBK m. 46/1). Dayanak işlem Leyla'yı bağlamadığından tescil yolsuzdur. Berk ilk el olduğu için TMK m. 1023'ten yararlanamaz.

  - soru: |
      Aşağıdakilerden hangisi, son kayıt malikinin **kötüniyetli** olduğuna ilişkin bir fiilî karine **sayılmaz**?
    siklar:
      - "Taşınmazın birkaç ay içinde art arda birçok kez el değiştirmesi"
      - "Satış bedelinin rayiç değerin çok altında gösterilmesi"
      - "Bütün devirlerin aynı emlakçının vekâletiyle yapılması"
      - "Alıcının tapu kaydını inceleyip taşınmazı yerinde görmesi ve bedeli banka aracılığıyla ödemesi"
    dogru: 3
    aciklama: |
      Kısa aralıklarla el değiştirme, çok düşük bedel ve aynı vekil ya da emlakçı zinciri Yargıtay'ın kötüniyet göstergesi saydığı fiilî karinelerdendir. Kaydı incelemek, yeri görmek ve bedeli bankadan ödemek ise beklenen özenin gösterildiğine işaret eder (TMK m. 3/2). Tek başına iyiniyeti kanıtlamasa da kötüniyet karinesi değildir.

  - soru: |
      Yargıtay İçtihatları Birleştirme Büyük Genel Kurulu'nun 2025 tarihli kararına göre, arsa payı karşılığı inşaat sözleşmesi geriye etkili feshedildiğinde yükleniciden bağımsız bölüm satın alan üçüncü kişinin durumu nedir?
    siklar:
      - "Devirler avans niteliğinde sayıldığından iyiniyet savunması dinlenmez."
      - "İyiniyet savunması dinlenir. İyiniyetli ise kazanımı TMK m. 1023 gereği korunur, kötüniyetini arsa sahibi ispatlar."
      - "Üçüncü kişi her durumda korunur, kötüniyet araştırılmaz."
      - "Üçüncü kişi ancak bedelin tamamını arsa sahibine de ödemişse korunur."
    dogru: 1
    aciklama: |
      2025 tarihli İBK, yükleniciden hak kazanan üçüncü kişilerin iyiniyet savunmasını dinlemeyen eski içtihattan dönmüştür. İyiniyetli üçüncü kişinin kazanımı TMK m. 1023 gereği korunur. İyiniyetli olmadığı anlaşılırsa taşınmaz arsa sahibine döner. Bunu ispat yükü arsa sahibindedir.

  - soru: |
      Adli Tıp Kurumu raporuna göre Recep, evini Kaan'a sattığı gün ayırt etme gücüne sahip değildir. Recep o tarihte kısıtlı değildir, sonradan kısıtlanmıştır. Kaan, Recep'in görünüşte sağlıklı olduğunu, tam bedel ödediğini ve iyiniyetli olduğunu ileri sürmektedir. Ev hâlâ Kaan adına kayıtlıdır. Recep'in vasisinin açtığı tapu iptali ve tescil davası hakkında hangisi doğrudur?
    siklar:
      - "Kaan iyiniyetli olduğu için TMK m. 1023 gereği korunur."
      - "Satış hukuki sonuç doğurmadığından tescil yolsuzdur. Kaan ilk el olduğu için iyiniyeti onu korumaz ve kayıt iptal edilir."
      - "Satış tarihinde kısıtlama kararı bulunmadığından satış geçerlidir."
      - "Satış iptal edilebilir niteliktedir, vasi bir yıl içinde bildirimde bulunmamışsa dava reddedilir."
    dogru: 1
    aciklama: |
      Ayırt etme gücü bulunmayan kimsenin fiilleri hukuki sonuç doğurmaz (TMK m. 15). Satış baştan hükümsüzdür ve tescil yolsuzdur (TMK m. 1024/2). Kaan sicile değil Recep'in imzasına güvenmiştir, yolsuz işlemin tarafıdır. TMK m. 1023 ilk eli korumaz. Kısıtlama kararının yokluğu sonucu değiştirmez, belirleyici olan işlem anındaki ayırt etme gücüdür. TBK m. 39'daki bir yıllık süre iptal edilebilir işlemlere ilişkindir.

  - soru: |
      TMK m. 1024/3'e göre bir tescil yüzünden ayni hakkı zedelenen kimse, tescilin yolsuz olduğunu iyiniyetli olmayan üçüncü kişilere karşı nasıl ileri sürebilir?
    siklar:
      - "Önce ilk el aleyhine dava açıp kazanmak şartıyla"
      - "Doğrudan doğruya"
      - "Yalnız tazminat istemi yoluyla"
      - "Ancak tapu müdürlüğüne itiraz ettikten sonra"
    dogru: 1
    aciklama: |
      TMK m. 1024/3'e göre yolsuz tescil yüzünden ayni hakkı zedelenen kimse, tescilin yolsuz olduğunu iyiniyetli olmayan üçüncü kişilere karşı doğrudan doğruya ileri sürebilir. Aradaki malikleri tek tek dava etmesi gerekmez, son malikin kaydının iptalini ister.

olaylar:
  - olay: |
      Almanya'da yaşayan Murat, İstanbul'da iki dairenin (A ve B) malikidir. Selim, Murat'ın kimlik bilgileriyle üzerinde kendi fotoğrafı bulunan sahte bir kimlik kartı hazırlatır ve bir noterlikte Murat adına vekâletname düzenletir. Mart 2024'te bu vekâletnameyle iki daireyi, piyasa değerine yakın bir bedelle Okan'a satar. Okan bedeli Selim'e ödemiştir ve sahtecilikten haberi olmadığını söylemektedir.

      Okan Haziran 2024'te A dairesini, kendisiyle hiçbir yakınlığı bulunmayan Deniz'e piyasa değerinden satar. Deniz satıştan önce tapu kaydını incelemiş, daireyi gezmiş ve bedeli banka aracılığıyla ödemiştir. Kayıtta hiçbir şerh yoktur.

      Murat Ocak 2025'te durumu öğrenir ve Okan aleyhine B dairesi için tapu iptali ve tescil davası açar. Mahkeme, davanın B dairesinin tapu kaydına şerh edilmesine karar verir ve şerh işlenir. Okan Mart 2025'te B dairesini Ece'ye satar. Ece şerhi gördüğünü, ama Okan'ın "dava boş, kazanacağım" sözüne güvendiğini söylemektedir.

      1. Okan adına yapılan tescillerin niteliği nedir? Okan iyiniyet savunmasıyla korunur mu?
      2. Murat, A dairesi için Deniz'e karşı tapu iptali ve tescil isteyebilir mi?
      3. B dairesinin Ece'ye satışı Murat'ın davasını nasıl etkiler? Murat hangi yollara başvurabilir?
      4. Murat, A dairesi bakımından uğradığı zarar için kime başvurabilir?
    olcut:
      - {tespit: "Sahte vekâletnameyle yapılan devrin Murat'ın iradesine dayanmadığı ve Okan adına tescillerin yolsuz olduğu", puan: 20, madde: "TMK m. 1024"}
      - {tespit: "Okan'ın yolsuz işlemin tarafı (ilk el) olduğu ve iyiniyetinin onu korumadığı", puan: 20, madde: "TMK m. 1023"}
      - {tespit: "Deniz'in tescile iyiniyetle dayanan üçüncü kişi olarak korunması ve A için iptal isteminin sonuçsuz kalması", puan: 15, madde: "TMK m. 1023"}
      - {tespit: "Dava şerhinden sonra alan Ece'nin iyiniyet iddiasında bulunamaması", puan: 15, madde: "TMK m. 1010"}
      - {tespit: "Dava konusunun devrinde davacının devralana karşı devam etme ya da tazminata dönüştürme seçimi", puan: 15, madde: "HMK m. 125"}
      - {tespit: "A dairesi için tazminat istemlerinin saklı olması: Selim'e karşı haksız fiil, şartları varsa Devlete karşı istem", puan: 15, madde: "TMK m. 1025"}
    cozum: |
      **Nitelendirme:** Uyuşmazlık, sahtecilikten doğan yolsuz tescile ve bu tescile dayanarak hak kazanan üçüncü kişilerin korunup korunmayacağına ilişkindir. Uygulanacak hükümler TMK m. 1023, TMK m. 1024 ve TMK m. 1025 ile HMK m. 125'tir.

      **1. Okan adına tescil:** Vekâletname sahte kimlikle düzenlenmiştir. Murat'ın iradesine dayanan bir temsil yetkisi hiç doğmamıştır. Satış Murat'ı bağlamaz, Okan adına yapılan tesciller bağlayıcı olmayan bir işleme dayandığından yolsuzdur (TMK m. 1024/2). Okan, bedeli ödediğini ve sahteciliği bilmediğini ileri sürmektedir. Ama TMK m. 1023 tapu kütüğündeki tescile güveneni korur. Satış anında sicil doğruydu ve daireleri Murat adına gösteriyordu. Okan sicile değil, sahte vekâletnameye güvenmiştir ve yolsuz kaydın bizzat lehtarıdır. Yargıtay'ın yerleşik uygulamasına göre ilk elin iyiniyeti araştırılmaz. Okan korunmaz. Ödediği bedeli Selim'den ister.

      **2. A dairesi ve Deniz:** Deniz, kütükte malik görünen Okan'dan satış yoluyla mülkiyet kazanmış ve adına tescil yapılmıştır. Okan'la hiçbir yakınlığı yoktur, piyasa değerini ödemiş, kaydı incelemiş, daireyi görmüştür ve kayıtta şerh yoktur. Kötüniyete işaret eden bir fiilî karine bulunmamaktadır. İyiniyet asıl olduğundan (TMK m. 3/1) ve aksi ispatlanamadığından Deniz'in kazanımı TMK m. 1023 gereği korunur. Murat'ın Deniz'e karşı tapu iptali ve tescil istemi reddedilir (TMK m. 1025/2).

      **3. B dairesi ve Ece:** Dava, mahkeme kararıyla B dairesinin kaydına şerh edilmiştir. Çekişmeli hakların korunmasına ilişkin mahkeme kararları şerh verilmekle sonradan hak kazananlara karşı ileri sürülebilir (TMK m. 1010/1 ve TMK m. 1010/2). Kimse sicildeki bir kaydı bilmediğini ileri süremez (TMK m. 1020/3). Ece şerhi gördüğünü kendisi de kabul etmektedir. Okan'ın "kazanacağım" sözüne güvenmesi, yolsuzluğu bilen ya da bilmesi gereken kişi olmasını değiştirmez (TMK m. 1024/1). Okan dava konusunu yargılama sırasında devrettiği için Murat HMK m. 125/1 uyarınca iki yoldan birini seçebilir:
      - davaya Ece'ye karşı devam eder. Ece iyiniyet iddiasında bulunamayacağından kaydın iptali ve Murat adına tescil sağlanır. Dava Murat lehine sonuçlanırsa Okan ve Ece yargılama giderlerinden müteselsilen sorumlu olur.
      - davasını Okan hakkında tazminat davasına dönüştürür.

      Şerh bulunduğu için Murat açısından doğru yol, davaya Ece'ye karşı devam etmektir. Böylece daireyi geri alır.

      **4. A dairesi için tazminat:** TMK m. 1025/2 iyiniyetli üçüncü kişilerin haklarını ve her türlü tazminat istemini saklı tutar. Murat, sahteciliği yapan Selim'den haksız fiil hükümlerine göre zararını isteyebilir (TBK m. 49/1). Zarar tapu sicilinin tutulmasından doğmuşsa Devletin sorumluluğu da gündeme gelir (TMK m. 1007). Bu yolun şartları ve davalısı ayrı konuda işlenir.

      **Sonuç:**
      - Okan adına tesciller yolsuzdur ve Okan ilk el olduğu için korunmaz.
      - Deniz iyiniyetli üçüncü kişi olarak A dairesinin mülkiyetini korur.
      - Ece, şerhten sonra aldığı için iyiniyet iddiasında bulunamaz. Murat davaya Ece'ye karşı devam ederek B dairesini geri alabilir.
      - Murat A dairesi için Selim'den, şartları varsa Devletten tazminat ister.

  - olay: |
      Hüseyin 2024'te ölmüştür. Eşini 2015'te kaybetmiştir. Yasal mirasçıları oğlu Ahmet ve kızları Ayşe ile Elif'tir. Hüseyin 2018'de Bursa'daki iki dairesini (X ve Y) tapuda "satış" göstererek Ahmet'e devretmiştir. Tapuda gösterilen bedel, her dairenin o tarihteki değerinin yaklaşık onda biridir. Hüseyin'in emekli maaşı ve başka kira gelirleri vardır, borcu bulunmamaktadır. Terekesinde satış bedeline rastlanmamıştır.

      Ahmet babasıyla aynı evde yaşamaktadır. Hüseyin'in kızlarıyla arası, onların evliliklerine karşı çıktığı için yıllardır soğuktur. Ahmet 2023'te Y dairesini, kendisiyle hiçbir ilişkisi olmayan Barış'a piyasa değerinden satmıştır. Bedel bankadan ödenmiş, Barış satıştan önce daireyi görmüştür. X dairesi hâlâ Ahmet adına kayıtlıdır.

      Ayşe Eylül 2026'da dava açmak istemektedir. Elif ise "babamın malıydı, istediğine verir" diyerek davaya katılmak istememektedir. Ahmet, davanın geç kaldığını ve satışların gerçek olduğunu savunacağını söylemektedir.

      1. 2018'deki işlemleri nitelendiriniz. Ayşe hangi hukuki sebebe dayanabilir?
      2. Ayşe tek başına dava açabilir mi? Neyi isteyebilir?
      3. Ahmet'in "dava geç kaldı" savunması yerinde midir? Bu dava tenkis davasından nasıl ayrılır?
      4. Ayşe, Y dairesi için Barış'a karşı başarılı olabilir mi? Olamazsa ne isteyebilir?
      5. Ayşe neyi ispat etmelidir? Hangi olgular onun lehinedir?
    olcut:
      - {tespit: "Muris muvazaası nitelendirmesi: görünüşte satış, gerçekte bağış; görünüşteki işlemin muvazaalı, gizli bağışın resmî şekilden yoksun olması", puan: 20, madde: "TBK m. 19"}
      - {tespit: "Ayşe'nin tek başına ve miras payı (1/3) oranında X dairesi için iptal ve tescil isteyebilmesi; Elif'in katılmamasının engel olmaması", puan: 15, madde: "TMK m. 495"}
      - {tespit: "Dava için hak düşürücü sürenin bulunmaması ve tenkisle farkı (geçerli tasarruf, saklı pay, 1 yıl ve 10 yıl)", puan: 15, madde: "TMK m. 571"}
      - {tespit: "Barış'ın iyiniyetli üçüncü kişi olarak korunması", puan: 15, madde: "TMK m. 1023"}
      - {tespit: "Y dairesi için Ahmet'ten tazminat istenebilmesi", puan: 15, madde: "TMK m. 1025"}
      - {tespit: "Mal kaçırma amacının ispatı; bedel farkı, satış ihtiyacının yokluğu, bedelin terekede olmaması ve aile ilişkilerinin birlikte değerlendirilmesi, bedel farkının tek başına yetmemesi", puan: 20, madde: "TMK m. 6"}
    cozum: |
      **Nitelendirme:** Hüseyin, tapulu iki dairesini oğluna satış göstererek devretmiştir. Olgular, gerçek amacın bedel karşılığı satış değil, kızlarından mal kaçırmak için yapılan bir bağış olduğunu düşündürmektedir. Bu, muris muvazaası iddiasıdır. Dayanağı 1974 tarihli İçtihadı Birleştirme Kararıdır.

      **1. İşlemlerin niteliği:** Görünüşteki satış, tarafların gerçek ve ortak iradesine uymadığı için muvazaalıdır ve hüküm doğurmaz (TBK m. 19/1). Gizlenen bağış ise taşınmaz bağışlama sözü için aranan resmî şekle uyulmadan yapılmıştır. Tapudaki resmî senet bir satışı belgeler, bağışı değil. Bu yüzden bağış da geçersizdir (TBK m. 288/2, TMK m. 706/1). İki işlem de geçersiz olduğundan Ahmet adına tescil yolsuzdur (TMK m. 1024/2). Ayşe muris muvazaası hukuki sebebine dayanarak tapu iptali ve tescil isteyebilir (TMK m. 1025/1).

      **2. Ayşe'nin dava hakkı:** Muris muvazaasında miras hakkı çiğnenen her yasal mirasçı dava açabilir. Mirasçılar tek başına ve kendi miras payları oranında istemde bulunabilir. Hüseyin'in eşi ondan önce öldüğü için mirasçılar üç çocuğudur ve eşit pay alırlar (TMK m. 495/2). Ayşe, X dairesinin tapu kaydının 1/3 oranında iptalini ve adına tescilini isteyebilir. Elif'in davaya katılmak istememesi Ayşe'nin davasına engel değildir. Elif'in kendi payı bakımından dava hakkı da süreye bağlı olmadığından saklı kalır.

      **3. Süre ve tenkisten farkı:** Muris muvazaasına dayanan dava yolsuz tescile dayanır. Yargıtay'ın yerleşik uygulamasına göre zamanaşımına ya da hak düşürücü süreye tabi değildir. Ahmet'in "geç kaldı" savunması yerinde değildir. Tenkis davası ise geçerli bir tasarrufun saklı payı aşan kısmına yöneliktir. Yalnız saklı pay sahiplerince (TMK m. 560/1) ve öğrenmeden itibaren bir yıl, her hâlde mirasın açılmasından itibaren on yıl içinde açılır (TMK m. 571/1). Muris muvazaasında işlem geçersizdir, saklı pay şartı ve süre yoktur.

      **4. Y dairesi ve Barış:** Barış, kütükte malik görünen Ahmet'ten satış yoluyla mülkiyet kazanmıştır. Ahmet'le ilişkisi yoktur, piyasa değerini bankadan ödemiş ve daireyi görmüştür. Kötüniyete işaret eden bir olgu yoktur. İyiniyet asıl olduğundan (TMK m. 3/1) Barış'ın kazanımı TMK m. 1023 gereği korunur. Ayşe Barış'a karşı başarılı olamaz. Ancak TMK m. 1025/2 her türlü tazminat istemini saklı tuttuğundan Ayşe, muvazaalı işlemin tarafı olan Ahmet'ten Y dairesi için miras payı oranında tazminat isteyebilir.

      **5. İspat:** İspat yükü, temlikin mal kaçırma amacıyla yapıldığını ileri süren Ayşe'dedir (TMK m. 6). Ayşe sözleşmenin dışında olduğu için tanık dahil her türlü delile dayanabilir. Lehine olan olgular şunlardır:
      - gösterilen bedelin gerçek değerin onda biri olması,
      - Hüseyin'in yeterli geliri bulunması ve satmak için bir ihtiyacının olmaması,
      - satış bedelinin terekede bulunmaması,
      - Hüseyin'in kızlarıyla arasının soğuk, oğluyla birlikte yaşaması.

      Bedel farkı tek başına muvazaayı kanıtlamaz. Ama bu olgularla birlikte değerlendirildiğinde mal kaçırma amacını güçlü biçimde gösterir. Ahmet ise bedeli gerçekten ödediğini ya da babasının satış için makul bir nedeni bulunduğunu kanıtlayarak bu kanaati çürütmeye çalışabilir.

      **Sonuç:**
      - 2018 işlemleri muris muvazaası niteliğindedir ve Ahmet adına tescil yolsuzdur.
      - Ayşe tek başına, X dairesinin 1/3 payı için iptal ve tescil isteyebilir.
      - Dava süreye bağlı değildir.
      - Barış iyiniyetli olduğu için Y dairesi geri alınamaz, Ayşe Ahmet'ten tazminat ister.

  - olay: |
      78 yaşındaki Gül, Antalya'daki iki tarlasının (T1 ve T2) satışı için yeğeni Can'a noterde vekâletname verir. Vekâletnamede Can'a tarlaları "dilediği kişiye, dilediği bedelle satma" yetkisi açıkça tanınmıştır. Bilirkişiye göre her tarlanın değeri 5.000.000 TL'dir.

      Can, vekâletnameden on gün sonra iki tarlayı, iş ortağı ve yakın arkadaşı Burak'a toplam 1.000.000 TL bedelle satar. Bu paranın Gül'e ödendiğine dair hiçbir kayıt yoktur. Burak bir ay sonra T1'i, kendisiyle hiçbir ilişkisi olmayan Cem'e 4.900.000 TL'ye satar. Cem tapu kaydını incelemiş, tarlayı yerinde görmüş ve bedeli bankadan ödemiştir. T2 hâlâ Burak adına kayıtlıdır.

      Gül durumu altı yıl sonra öğrenir ve dava açmak ister. Burak, vekâletnamenin geçerli olduğunu, satışın tapuda yapıldığını ve iyiniyetli olduğunu söylemektedir. Ayrıca davanın çok geç açıldığını ileri sürmektedir.

      1. Can'ın yaptığı satış Gül'ü bağlar mı?
      2. Gül, T2 için Burak'a karşı hangi davayı açabilir? Burak'ın savunmaları yerinde midir?
      3. Gül, T1 için Cem'e karşı başarılı olabilir mi?
      4. Gül'ün T1'deki kaybı için başvurabileceği yollar nelerdir?
    olcut:
      - {tespit: "Can'ın taşınmaz satışı için özel yetkisinin bulunduğu, sorunun yetkisizlik değil yetkinin kötüye kullanılması olduğu", puan: 15, madde: "TBK m. 504"}
      - {tespit: "Vekilin sadakat ve özen borcu; değerin beşte birine satış, bedelin Gül'e ulaşmaması ve alıcının vekilin ortağı olması nedeniyle kötüye kullanmanın varlığı", puan: 20, madde: "TBK m. 506"}
      - {tespit: "Vekille çıkar ve işbirliği içindeki Burak'la yapılan satışın Gül'ü bağlamaması ve tescilin yolsuz olması", puan: 20, madde: "TMK m. 2"}
      - {tespit: "T2 için Burak'a karşı tapu iptali ve tescil davası; davanın süreye bağlı olmaması", puan: 15, madde: "TMK m. 1025"}
      - {tespit: "Cem'in iyiniyetli üçüncü kişi olarak korunması", puan: 15, madde: "TMK m. 1023"}
      - {tespit: "T1 için Can ve Burak'tan tazminat istenebilmesi", puan: 15, madde: "TMK m. 1025"}
    cozum: |
      **Nitelendirme:** Uyuşmazlık, vekâlet görevinin kötüye kullanılmasına dayanan tapu iptali ve tescil istemine ve sonraki edinenin iyiniyetine ilişkindir. Uygulanacak hükümler TBK m. 504, TBK m. 506, TMK m. 2, TMK m. 1023 ve TMK m. 1025'tir.

      **1. Satışın Gül'ü bağlayıp bağlamadığı:** Vekil, özel olarak yetkili kılınmadıkça taşınmaz devredemez (TBK m. 504/3). Can'a satış yetkisi açıkça verilmiştir. Bu yüzden sorun yetkisizlik değil, yetkinin kötüye kullanılmasıdır. Vekil işi, vekâlet verenin haklı menfaatlerini gözeterek sadakat ve özenle yürütmek zorundadır (TBK m. 506/2). "Dilediği bedelle satma" yetkisi bile bu borcu ortadan kaldırmaz.

      Can tarlaları değerlerinin beşte birine, vekâletnameden on gün sonra, iş ortağı ve yakın arkadaşı Burak'a satmış, bedel de Gül'e ulaşmamıştır. Bu olgular yetkinin Gül'ün zararına kötüye kullanıldığını açıkça gösterir.

      Yargıtay'ın yerleşik uygulamasına göre karşı taraf iyiniyetliyse sözleşme vekâlet vereni bağlar. Karşı taraf vekille çıkar ve işbirliği içindeyse ya da kötüye kullanmayı biliyor veya bilmesi gerekiyorsa, dürüstlük kuralı gereği vekâlet veren sözleşmeyle bağlı sayılmaz (TMK m. 2). Hâkim bunu kendiliğinden gözetir. Burak, Can'ın iş ortağı ve yakın arkadaşıdır. Taşınmazları değerinin çok altında almıştır. Yolsuzluğu bilen ya da en azından bilmesi gereken kişidir. Satış Gül'ü bağlamaz, Burak adına tescil yolsuzdur (TMK m. 1024/2).

      **2. T2 için dava:** Gül, ayni hakkı zedelenen malik olarak T2'nin Burak adına olan kaydının iptalini ve kendi adına tescilini isteyebilir (TMK m. 1025/1). Dava, taşınmazın bulunduğu Antalya'da asliye hukuk mahkemesinde açılır (HMK m. 2/1, HMK m. 12/1).
      - *İyiniyet savunması:* Burak'ın "vekâletname geçerliydi, satış tapuda yapıldı" savunması sonucu değiştirmez. Vekâletnamenin geçerliliği ve işlemin resmî şekilde yapılmış olması kötüye kullanmayı ortadan kaldırmaz. Burak işbirliği içindedir ve iyiniyet iddiasında bulunamaz (TMK m. 3/2).
      - *Süre savunması:* Yargıtay'a göre vekâlet görevinin kötüye kullanılmasına dayanan tapu iptali davaları zamanaşımına ya da hak düşürücü süreye bağlı değildir. Altı yıl geçmiş olması sonucu etkilemez. Burak T2'ye iyiniyetle on yıl zilyet olmadığı için TMK m. 712 de uygulanamaz.

      **3. T1 ve Cem:** Cem, kütükte malik görünen Burak'tan satış yoluyla mülkiyet kazanmıştır. Burak'la ilişkisi yoktur, piyasa değerine yakın bedeli bankadan ödemiş, kaydı incelemiş ve tarlayı görmüştür. Kötüniyete işaret eden bir fiilî karine yoktur. İyiniyet asıl olduğundan (TMK m. 3/1) Cem'in kazanımı TMK m. 1023 gereği korunur. Gül'ün Cem'e karşı iptal istemi reddedilir (TMK m. 1025/2).

      **4. T1 için tazminat:** TMK m. 1025/2 her türlü tazminat istemini saklı tutar. Gül, sadakat ve özen borcuna aykırı davranan vekil Can'dan zararını isteyebilir (TBK m. 506/2). Can'la işbirliği içinde hareket ederek zarara katılan Burak'tan da tazminat isteyebilir. Zararın hesabında T1'in gerçek değeri ile Gül'e ulaşan bedel karşılaştırılır. Olayda Gül'e hiçbir bedel ulaşmamıştır.

      **Sonuç:**
      - Can yetkisini kötüye kullanmıştır. Burak işbirliği içinde olduğundan satış Gül'ü bağlamaz.
      - Gül, T2 için Burak'a karşı tapu iptali ve tescil davası açabilir. Burak'ın iyiniyet ve süre savunmaları yerinde değildir.
      - Cem iyiniyetli üçüncü kişi olduğu için T1 geri alınamaz.
      - Gül T1 için Can'dan ve Burak'tan tazminat ister.

kartlar:
  - on: "Yolsuz tescil nedir? (TMK m. 1024/2)"
    arka: "Bağlayıcı olmayan bir hukuki işleme dayanan ya da hukuki sebepten yoksun tescil. Kayıt gerçek hak durumuna uymaz."
  - on: "TMK m. 1023 kimi korur?"
    arka: "Tapudaki tescile iyiniyetle dayanarak mülkiyet ya da başka bir ayni hak kazanan üçüncü kişiyi."
  - on: "İlk el iyiniyetliyse korunur mu?"
    arka: "Hayır. Yolsuz işlemin tarafı sicile değil işleme güvenmiştir. İyiniyeti araştırılmaz, kayıt iptal edilir."
  - on: "Kötüniyeti kim ispatlar?"
    arka: "Kötüniyeti iddia eden. İyiniyet karinedir (TMK m. 3/1). Özen göstermeyen iyiniyet iddia edemez (TMK m. 3/2)."
  - on: "Kötüniyetin fiilî karinelerine örnek?"
    arka: "Kısa aralıklarla el değiştirme, rayiç değerin çok altında bedel, yakınlık ve aynı vekil ya da emlakçı zinciri, taşınmazı görmeden alma."
  - on: "Bedel ödemek iyiniyeti kanıtlar mı?"
    arka: "Tek başına kanıtlamaz. Belirleyici olan, alıcının yolsuzluğu bilip bilmediği ya da özen gösterse bilebilecek olup olmadığıdır."
  - on: "Kötüniyet iddiasının usuldeki niteliği?"
    arka: "İtirazdır. Hâkim kendiliğinden gözetir ve iddianın genişletilmesi yasağına tabi olmadan ileri sürülebilir (1951 ve 1991 tarihli İBK'lar)."
  - on: "Şerhten sonra alan kişi iyiniyet iddia edebilir mi?"
    arka: "Hayır. Kimse sicildeki kaydı bilmediğini ileri süremez (TMK m. 1020/3). Şerh sonradan hak kazananlara karşı ileri sürülür (TMK m. 1010/2)."
  - on: "TMK m. 1024/3 neyi sağlar?"
    arka: "Ayni hakkı zedelenen kişi, yolsuzluğu iyiniyetli olmayan üçüncü kişilere karşı doğrudan doğruya ileri sürer."
  - on: "Tapu iptali ve tescil davasını kim açar?"
    arka: "Ayni hakkı zedelenen kişi (TMK m. 1025/1). Kişisel hak sahibi tescile zorlama davası açar (TMK m. 716)."
  - on: "Tapu iptali davasında görev ve yetki?"
    arka: "Asliye hukuk mahkemesi (HMK m. 2). Taşınmazın bulunduğu yer mahkemesi kesin yetkili (HMK m. 12/1)."
  - on: "Yolsuz tescile dayanan iptal davasında süre var mı?"
    arka: "Yargıtay'a göre yok. Sınırlar: TMK m. 712 (10 yıl iyiniyetli zilyetlik), kadastroda 10 yıl (3402 sayılı Kanun m. 12/3), iptal edilebilir işlemlerde TBK m. 39."
  - on: "Davalı dava konusunu devrederse? (HMK m. 125)"
    arka: "Davacı ya devralana karşı davaya devam eder ya da davasını devreden hakkında tazminat davasına dönüştürür."
  - on: "Muris muvazaası nedir?"
    arka: "Mirasbırakanın mirasçılarından mal kaçırmak için gerçekte bağışladığı tapulu taşınmazı satış ya da ölünceye kadar bakma gibi göstermesi (1974 tarihli İBK)."
  - on: "Muris muvazaasında kim, ne kadarını ister?"
    arka: "Saklı paylı olsun olmasın miras hakkı çiğnenen her yasal mirasçı, tek başına ve miras payı oranında. Süre yoktur."
  - on: "Muris muvazaası ile tenkis farkı?"
    arka: "Muris muvazaasında işlem geçersizdir, her mirasçı açar, süre yoktur. Tenkis geçerli tasarrufa karşıdır, yalnız saklı pay sahipleri 1 yıl ve 10 yıl içinde açar (TMK m. 571)."
  - on: "Vekâletin kötüye kullanılmasında işlem ne zaman vekâlet vereni bağlamaz?"
    arka: "Karşı taraf vekille çıkar ve işbirliği içindeyse ya da kötüye kullanmayı biliyor veya bilmesi gerekiyorsa (TMK m. 2, TBK m. 506/2)."
  - on: "Vekil taşınmaz satabilmek için neye ihtiyaç duyar?"
    arka: "Özel yetkiye (TBK m. 504/3). Yetki yoksa işlem yetkisiz temsildir, onay olmadıkça bağlamaz (TBK m. 46/1)."
  - on: "Terkine karşı dava süresi? (TMK m. 1026)"
    arka: "İşlemin ilgiliye tebliğinden itibaren otuz gün."
  - on: "Sicildeki yanlışlık nasıl düzeltilir? (TMK m. 1027)"
    arka: "İlgililerin yazılı rızası yoksa ancak mahkeme kararıyla. Basit yazı yanlışlıkları tapu memurunca re'sen düzeltilir."
  - on: "2025 tarihli İBK neyi değiştirdi?"
    arka: "Arsa payı karşılığı inşaatta yükleniciden iyiniyetle ayni hak kazanan üçüncü kişinin savunması artık dinlenir ve kazanımı korunur. Kötüniyeti arsa sahibi ispatlar."
