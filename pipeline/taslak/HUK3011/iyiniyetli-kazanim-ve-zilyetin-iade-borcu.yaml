  - id: "402665200"
    ozet: |
      Davalı-karşı davacı, adına kayıtlı minibüsü ve ruhsatını 22.10.2004'te noterde yapılmayan bir satış sözleşmesiyle, kendini başka bir adla tanıtan alıcıya teslim etmiş; karşılığında 13.000 TL peşin, kalanı için bono almıştır. Ardından malik adına düzenlenen sahte sürücü belgesiyle araç noterde davacılardan birine, o da 12.04.2005'te diğer davacıya satmış; araca 04.05.2005'te çalıntı iddiasıyla el konulmuştur. Davacılar müdahalenin önlenmesi, aracın teslimi ve tescili; eski malik karşı davayla trafik kaydının iptali, tescil ve teslim istemiştir. İlk derece mahkemesi davacıları iyiniyetli saymayarak asıl davayı reddetmiş, karşı davayı kısmen kabul etmiştir. 4. Hukuk Dairesi, aracın malikin rızasıyla elinden çıktığını ve davacıların iyiniyetli olduğunu, ama malikin ikinci alıcının ödediği 26.000 TL noter satış bedelini ödeyerek aracı geri alabileceğini belirterek bozmuş; mahkeme direnmiştir. Hukuk Genel Kurulu oy birliğiyle, aracın rızayla çıkması nedeniyle olayın TMK m. 988'e göre çözülmesi gerektiğini, beklenen özeni gösteren davacıların iyiniyetli üçüncü kişiler olarak mülkiyeti kazandığını kabul etmiştir. Kurul'a göre ödenen bedelin geri verilmesi koşulu yalnız irade dışında çıkan ve açık artırmadan, pazardan ya da benzeri eşya satandan edinilen eşyaya özgüdür. Kurul, trafik kaydına tescil kararı verilemeyeceğini ve mülkiyetin tespitiyle yetinilmesi gerektiğini de belirterek Daire'nin bedel koşulunu kararından çıkarmış ve direnme kararını değişik gerekçeyle bozmuştur. Konuya katkısı: TMK m. 988 ile TMK m. 989/2 arasındaki sınırı gösterir. Motorlu araçlar bakımından Kurul 2021'de farklı bir yaklaşım benimsemiştir.
  - id: "685807200"
    ozet: |
      Araç kiralama işiyle uğraşan davacı, adına kayıtlı aracı kendini başka bir adla tanıtan bir kişiye kiralamış; araç süresinde geri getirilmemiş ve davacının kimlik bilgileri kullanılarak düzenlenen sahte vekâletnameyle, bu kişiyle birlikte hareket eden bir başkası tarafından noterde davalıya satılmıştır. Davacı satışın geçersizliğinin tespitini, iptalini ve trafik kaydının adına tescilini istemiştir. İlk derece mahkemesi davalının iyiniyetli olduğunu, ancak sahte vekâletnameyle yapılan satışın mülkiyeti geçirmediğini kabul ederek davayı kabul etmiştir. 4. Hukuk Dairesi, aracın malikin rızasıyla kiracıya verildiğini ve davalının iyiniyetli olduğunu belirterek davanın ancak davalının ödediği bedelin iadesi koşuluyla kabul edilebileceğini ve trafik kaydına tescil kararı verilemeyeceğini söyleyerek bozmuş; mahkeme direnmiştir. Hukuk Genel Kurulu oy birliğiyle, ödenen bedelin geri verilmesi koşulunun TMK m. 989/2'deki hâle özgü olduğunu hatırlatmıştır. Kurul'a göre noter satışı araç sahibi adına düzenlenmiş tescil belgesi veya trafik kayıtları esas alınarak yapılacağından emin sıfatıyla zilyet geçerli bir devir sözleşmesi yapamaz; bu yüzden motorlu araç mülkiyeti TMK m. 988'e göre iyiniyetle kazanılamaz ve trafik siciline güven koruması da yoktur. Davalı iyiniyetli olsa da malik olmadığından bedel iadesi koşulu aranmamış, bu yöndeki direnme genişletilmiş gerekçeyle onanmıştır. Tescil talebi bakımından ise trafik tescilinin idari bir işlem olduğu ve mahkemenin yalnız mülkiyetin tespitine karar verebileceği gerekçesiyle direnme kararı bozulmuştur. Konuya katkısı: Yargıtay'ın motorlu araçları TMK m. 988 korumasının dışında tutan güncel yaklaşımının temel kararıdır.
  - id: "862333000"
    ozet: |
      Alıcı, resmî şekle uyulmadan yapılan bir taşınmaz satış sözleşmesinden sonra taşınmazın zilyetliğini satıcıdan teslim almış, 25.300 TL ödemiş ve taşınmaza giderler yapmıştır. Alıcının tapu iptali ve tescil davası, sözleşme kanuni şekle uymadığı için reddedilmiş ve 10.11.2011'de kesinleşmiştir. Malikin 06.01.2014'te açtığı el atmanın önlenmesi ve tahliye davasına verdiği cevapla alıcı, öncelikle tapu iptali ve tescil, olmazsa ödediği bedelin ve zorunlu ve yararlı giderlerinin tahsilini istemiş; gider talebini ıslahla 16.100 TL'ye çıkarmıştır. Ayrılarak görülen bu davada ilk derece mahkemesi tescil istemini kesin hüküm nedeniyle reddetmiş, 25.300 TL'ye ve önceki tapu davasında alınan 09.06.2010 tarihli raporda belirlenen 8.460 TL gidere hükmetmiştir. Yargıtay 3. Hukuk Dairesi, geçersiz satışta alıcının iyiniyetli zilyet olduğunu ve TMK m. 994'e göre zorunlu ve yararlı giderlerin tazminini isteyip bunlar ödeninceye kadar şeyi geri vermekten kaçınabileceğini belirtmiş; nitekim el atma davasında alıcıya ödemeleri ve giderleri karşılanıncaya kadar hapis hakkı tanındığını ve bu kararın kesinleştiğini vurgulamıştır. Daire'ye göre mahkeme, davanın açıldığı 06.01.2014 tarihine göre imalatlardan zorunlu ve yararlı olanların bedelini bilirkişiyle belirlemeli ve taşınmaza zarar verilmeden sökülüp götürülebilecek olanlar dışındakilerin bedeline hükmetmeliydi. Eski raporla yetinilmesi bozma sebebi sayılmış ve karar alıcı yararına oy birliğiyle bozulmuştur. Konuya katkısı: TMK m. 994'ün taşınmazlarda da uygulandığını ve gider hesabının nasıl yapılacağını gösterir.

sorular:
  - soru: |
      TMK m. 988'e göre iyiniyetli edinen hangi durumda korunur?
    siklar:
      - "Taşınırı emin sıfatıyla zilyetten, onun tasarruf yetkisi olmasa bile iyiniyetle edinmişse"
      - "Taşınırı hırsızdan iyiniyetle edinmiş ve üzerinden iki ay geçmişse"
      - "Taşınırı kim olursa olsun bir zilyetten bedel ödeyerek edinmişse"
      - "Taşınırı emin sıfatıyla zilyetten edinmiş ve malike ayrıca bir bedel ödemişse"
    dogru: 0
    aciklama: |
      TMK m. 988, emin sıfatıyla zilyetten iyiniyetle mülkiyet veya sınırlı ayni hak edinenin ediniminin, zilyedin tasarruf yetkisi olmasa bile korunacağını söyler. Hırsızdan edinmede eşya irade dışında çıkmıştır ve TMK m. 989 uygulanır; iki aylık süre zilyetlik davalarına ilişkindir (TMK m. 984). Bedel ödemek tek başına koruma sağlamaz; malike ayrıca bir ödeme yapılması da kanunda aranmaz.

  - soru: |
      Aşağıdakilerden hangisi emin sıfatıyla zilyettir?
    siklar:
      - "Eşyayı sahibinin evinden çalan kişi"
      - "Eşyayı sahibinden kiralamış olan kiracı"
      - "Sahibinin parkta unuttuğu eşyayı bulan kişi"
      - "Eşyayı sahibinin elinden zorla alan kişi"
    dogru: 1
    aciklama: |
      Emin sıfatıyla zilyet, zilyetliği önceki zilyedin iradesiyle elde etmiş kişidir; kiracı eşyayı malikin rızasıyla almıştır. Hırsızlık, unutulan eşyanın bulunması ve zorla alma, eşyanın zilyedin iradesi dışında elinden çıktığı hâllerdir ve TMK m. 989 kapsamına girer.

  - soru: |
      Hakan, dizüstü bilgisayarını onarım için servis sahibi İlker'e bırakır. İlker bilgisayarı kendi malıymış gibi, piyasa fiyatına Melis'e satıp teslim eder. Melis'in şüphelenmesini gerektiren bir durum yoktur. Hakan'ın Melis'e karşı açtığı geri verme davasında hangisi doğrudur?
    siklar:
      - "Hakan beş yıl içinde dava açtığı için bilgisayarı bedelsiz geri alır."
      - "Hakan, Melis'in ödediği bedeli vererek bilgisayarı geri alabilir."
      - "Melis bilgisayarın maliki olmuştur; dava reddedilir."
      - "Melis ancak beş yıllık kazandırıcı zamanaşımı dolunca malik olur; o zamana kadar bilgisayarı geri vermelidir."
    dogru: 2
    aciklama: |
      Bilgisayar Hakan'ın iradesiyle İlker'e bırakılmıştır; İlker emin sıfatıyla zilyettir. Melis iyiniyetle edindiği için TMK m. 988 uyarınca malik olur (TMK m. 763/2). Beş yıllık dava süresi ve bedel koşulu irade dışında elden çıkan eşyaya ilişkindir (TMK m. 989). Kazandırıcı zamanaşımı beklemeye gerek yoktur; edinim teslimle korunur.

  - soru: |
      Taşınırı çalınan zilyet, o şeyi elinde bulunduran herkese karşı hangi süre içinde taşınır davası açabilir?
    siklar:
      - "Fiili ve faili öğrenmeden başlayarak iki ay ve her hâlde fiilden başlayarak bir yıl"
      - "Beş yıl"
      - "On yıl"
      - "Süre sınırı olmaksızın her zaman"
    dogru: 1
    aciklama: |
      TMK m. 989/1'e göre taşınırı çalınan, kaybolan ya da iradesi dışında başka bir şekilde elinden çıkan zilyet, o şeyi elinde bulunduran herkese karşı beş yıl içinde taşınır davası açabilir. İki ay ve bir yıllık süreler gasp ve saldırı davalarına aittir (TMK m. 984). Her zaman dava açılabilmesi ise yalnız iyiniyetsiz edinene karşı söz konusudur (TMK m. 991/1).

  - soru: |
      Sinan, kamp ekipmanını bir haftalığına Ozan'a kiralar. Ekipman Ozan'ın arabasından çalınır. Hırsız ekipmanı kendi malıymış gibi, tanıdığı Pelin'e elden satar; Pelin iyiniyetlidir. Hangisi doğrudur?
    siklar:
      - "Sinan ekipmanı güvenerek kiraya verdiği için TMK m. 988 uygulanır ve Pelin malik olur."
      - "Pelin iyiniyetli olduğu için ekipmanı hiçbir durumda geri vermek zorunda değildir."
      - "Ekipman zilyet Ozan'ın iradesi dışında elden çıkmıştır; Pelin'e karşı beş yıl içinde taşınır davası açılabilir ve Pelin ödediği bedeli davacıdan isteyemez."
      - "Dava yalnız Sinan tarafından ve hırsızlığın öğrenilmesinden başlayarak iki ay içinde açılabilir."
    dogru: 2
    aciklama: |
      Sinan ekipmanı iradesiyle Ozan'a vermiştir; ama ekipman Ozan'ın elinden çalınmıştır. İradi teslim zinciri kopmuştur ve TMK m. 989/1 uygulanır; kanun "zilyet" der, bu yüzden dolaysız zilyet Ozan'ın elinden çıkış belirleyicidir. Pelin eşyayı açık artırmadan, pazardan ya da benzeri eşya satandan almadığı için bedel koşulu yoktur (TMK m. 989/2). İki aylık süre zilyetlik davalarına aittir.

  - soru: |
      Taner'in bisikleti çalınır. Hırsız bisikleti ikinci el bisiklet alıp satan bir dükkâna satar; dükkân da bisikleti 25.000 TL'ye iyiniyetli Efe'ye satar. Taner bir yıl sonra bisikleti Efe'de bulur. Hangisi doğrudur?
    siklar:
      - "Taner bisikleti ancak Efe'nin ödediği 25.000 TL'yi geri vererek alabilir."
      - "Efe iyiniyetli olduğu için malik olmuştur; dava reddedilir."
      - "Taner bisikleti bedelsiz geri alır; dükkândan alınmış olması önemsizdir."
      - "Taner iki aylık süre geçtiği için dava açamaz."
    dogru: 0
    aciklama: |
      Bisiklet irade dışında elden çıkmıştır ve beş yıllık süre dolmamıştır (TMK m. 989/1). Efe bisikleti benzeri eşya satan birinden iyiniyetle aldığı için taşınır davası ancak ödenen bedelin geri verilmesi koşuluyla açılabilir (TMK m. 989/2). Efe malik olmamıştır; korunan yalnız ödediği bedeldir. Taner bu tutarı hırsızdan isteyebilir (TBK m. 49).

  - soru: |
      Kiracı Rıza, kiraladığı jeneratörü kendi malıymış gibi iyiniyetli Tekin'e satıp teslim eder. Malik, Tekin'in ödediği bedeli kendisine vermeyi önererek jeneratörü geri ister. Hangisi doğrudur?
    siklar:
      - "Bedel önerildiği için Tekin jeneratörü geri vermek zorundadır."
      - "Tekin malik olduğundan bedel önerilse bile jeneratörü geri vermek zorunda değildir."
      - "Malik beş yıl içinde dava açarsa jeneratörü bedelsiz geri alır."
      - "Tekin jeneratör üzerinde yalnız hapis hakkı kazanmıştır."
    dogru: 1
    aciklama: |
      Jeneratör malikin iradesiyle kiracıya verilmiştir; Rıza emin sıfatıyla zilyettir ve iyiniyetli Tekin TMK m. 988 uyarınca malik olur. Hukuk Genel Kurulu'na göre ödenen bedelin geri verilmesi koşulu yalnız irade dışında çıkan ve açık artırmadan, pazardan ya da benzeri eşya satandan edinilen eşyaya özgüdür (TMK m. 989/2). Emin sıfatıyla zilyetten edinen malik olduğundan eski malik bedel önererek eşyayı geri alamaz.

  - soru: |
      Bir hırsız, Nermin'in evinden çaldığı 30.000 TL ile bir mobilya mağazasından koltuk satın alır. Mağaza sahibi paranın çalıntı olduğunu bilmemektedir. Nermin'in mağaza sahibine karşı hakkı nedir?
    siklar:
      - "Para irade dışında çıktığı için beş yıl içinde banknotları geri isteyebilir."
      - "Mağaza sahibine koltuğun bedelini ödeyerek parayı geri alabilir."
      - "Para iradesi dışında çıkmış olsa bile iyiniyetli edinene karşı taşınır davası açamaz."
      - "Para iradesi dışında çıktığından her zaman dava açabilir."
    dogru: 2
    aciklama: |
      TMK m. 990'a göre zilyet, iradesi dışında elinden çıkmış olsa bile para ve hamile yazılı senetleri iyiniyetle edinmiş olan kimseye karşı taşınır davası açamaz. Beş yıllık süre ve bedel koşulu (TMK m. 989) paraya uygulanmaz. Her zaman dava açılabilmesi iyiniyetsiz edinene karşıdır (TMK m. 991/1). Nermin zararını hırsızdan ister.

  - soru: |
      Ahmet, çalıntı olduğunu bildiği bir saati hırsızdan satın alır. Malik saati yedi yıl sonra Ahmet'te bulur. Hangisi doğrudur?
    siklar:
      - "Beş yıl geçtiği için malik taşınır davası açamaz."
      - "Ahmet kazandırıcı zamanaşımıyla saatin maliki olmuştur."
      - "Malik saati ancak Ahmet'in ödediği bedeli vererek geri alabilir."
      - "Ahmet saati iyiniyetle edinmediğinden malik ona karşı her zaman taşınır davası açabilir."
    dogru: 3
    aciklama: |
      Bir taşınırın zilyetliğini iyiniyetle edinmemiş olan kimseye karşı önceki zilyet her zaman taşınır davası açabilir (TMK m. 991/1). Beş yıllık süre iyiniyetli edinenleri korur (TMK m. 989/1). Ahmet iyiniyetli olmadığından kazandırıcı zamanaşımından da yararlanamaz (TMK m. 777/1). Bedel koşulu yalnız iyiniyetli edinene tanınır (TMK m. 989/2).

  - soru: |
      Hırsız Ferhan, çaldığı kolyeyi çalıntı olduğunu söyleyerek arkadaşı Burak'a verir. Kolyeyi daha sonra Cem, Burak'ın evinden çalar. Burak, Cem'e karşı taşınır davası açar. Hangisi doğrudur?
    siklar:
      - "Kolye Burak'ın iradesi dışında çıktığından Burak beş yıl içinde taşınır davasıyla kolyeyi geri alır."
      - "Burak zilyetliği iyiniyetle edinmediğinden Cem'e karşı taşınır davası açamaz."
      - "Burak her zaman taşınır davası açabilir."
      - "Cem'in eylemi nedeniyle kolyenin maliki Burak olur."
    dogru: 1
    aciklama: |
      TMK m. 991/2'ye göre önceki zilyet de zilyetliği iyiniyetle edinmemişse sonraki zilyede karşı taşınır davası açamaz. Burak kolyenin çalıntı olduğunu bilerek almıştır. Bu kural, gerçek malikin Burak'a ve Cem'e karşı haklarını etkilemez. Burak'ın süresi içinde zilyetliğin gaspı nedeniyle açabileceği zilyetlik davası (TMK m. 982) ayrı bir konudur.

  - soru: |
      TMK m. 988 uygulanırken edinenin iyiniyeti hakkında hangisi doğrudur?
    siklar:
      - "Edinen iyiniyetini her durumda yazılı belgeyle ispatlamalıdır."
      - "İyiniyet dava tarihinde aranır; edinen dava açılana kadar şüphelenmemişse korunur."
      - "İyiniyet karinedir; ancak durumun gerektirdiği özeni göstermeyen kişi iyiniyet iddiasında bulunamaz."
      - "Edinen yalnız devredenin tasarruf yetkisini noterden araştırmışsa iyiniyetli sayılır."
    dogru: 2
    aciklama: |
      Kanunun iyiniyete sonuç bağladığı durumlarda asıl olan iyiniyetin varlığıdır; kötüniyeti geri isteyen ispatlar (TMK m. 3/1). Ancak durumun gereklerine göre kendisinden beklenen özeni göstermeyen kimse iyiniyet iddiasında bulunamaz (TMK m. 3/2). İyiniyet edinme anında aranır, dava tarihinde değil. Noterden araştırma gibi genel bir şart yoktur.

  - soru: |
      Deniz, emin sıfatıyla zilyet olan Can'dan bir halıyı iyiniyetle satın alıp teslim alır. Bir ay sonra Can'ın halının sahibi olmadığını öğrenir. Deniz'in durumu nedir?
    siklar:
      - "Kazanımı korunur; iyiniyet zilyetliğin devralındığı anda aranır."
      - "Gerçeği öğrendiği an kazanımı geçmişe etkili olarak ortadan kalkar."
      - "Halıyı malike bedelsiz geri vermek zorundadır."
      - "Halının maliki olmak için beş yıl daha beklemesi gerekir."
    dogru: 0
    aciklama: |
      TMK m. 988'de iyiniyet, edinme anında, yani zilyetliğin devralındığı anda aranır. Deniz o anda iyiniyetli olduğundan malik olmuştur (TMK m. 763/2). Sonradan öğrenmek kazanımı bozmaz. Beş yıllık süre irade dışında çıkan eşyaya ilişkindir (TMK m. 989/1).

  - soru: |
      TMK m. 988'deki koruma hangi eksikliği tamamlar?
    siklar:
      - "Devredenin ayırt etme gücünün yokluğunu"
      - "Edinenin iyiniyetsizliğini"
      - "Kanunun öngördüğü şeklin yokluğunu"
      - "Yalnız devredenin tasarruf yetkisinin yokluğunu"
    dogru: 3
    aciklama: |
      TMK m. 988 yalnız devredenin tasarruf yetkisinin olmamasını tamamlar. Hukuk Genel Kurulu'nun da belirttiği gibi edinimde tasarruf yetkisi dışındaki diğer geçerlilik unsurları mevcut olmalıdır. Ayırt etme gücünün ya da kanuni şeklin yokluğu gibi eksiklikleri bu hüküm gidermez; iyiniyetsiz edinen ise hiç korunmaz (TMK m. 991/1).

  - soru: |
      Gül, çalıntı olduğunu bilmeden satın aldığı bisikleti iki yıl kullanır. Bu sürede bisiklet, Gül'ün kusuru olmadan bir fırtınada hasar görür. Malik beş yıllık süre içinde açtığı davayla bisikleti geri alır. Gül'ün sorumluluğu nedir?
    siklar:
      - "Gül kullanma için tazminat ödemez ve hasardan sorumlu değildir."
      - "Gül kullanma bedelini öder, ama hasardan sorumlu değildir."
      - "Gül hasarı öder, ama kullanma için tazminat ödemez."
      - "Gül hem kullanma bedelini hem hasarı öder."
    dogru: 0
    aciklama: |
      İyiniyetli zilyet, şeyi karineyle mevcut hakkına uygun şekilde kullandığı için geri vermekle yükümlü olduğu kimseye tazminat ödemez (TMK m. 993/1). Şeyin kaybedilmesinden, yok olmasından veya hasara uğramasından da sorumlu olmaz (TMK m. 993/2). Bu hükümler TMK m. 989/3 yoluyla çalıntı eşyayı iyiniyetle edinen kişiye de uygulanır.

  - soru: |
      İyiniyetli zilyet, zorunlu ve yararlı giderleri için hangi hakka sahiptir?
    siklar:
      - "Yalnız zorunlu giderleri ister; yararlı giderler için hakkı yoktur."
      - "Giderlerin tazminini ister ve tazminat ödeninceye kadar şeyi geri vermekten kaçınabilir."
      - "Giderler için ayrı dava açmalıdır; şeyi derhâl geri vermek zorundadır."
      - "Giderlerin yarısını ister; kalanını hâkim hakkaniyete göre belirler."
    dogru: 1
    aciklama: |
      TMK m. 994/1'e göre iyiniyetli zilyet, geri vermeyi isteyen kimseden şey için yaptığı zorunlu ve yararlı giderleri tazmin etmesini isteyebilir ve bu tazminat ödeninceye kadar şeyi geri vermekten kaçınabilir. Yalnız hak sahibi için de zorunlu olan giderlerle sınırlı talep iyiniyetsiz zilyede aittir (TMK m. 995/2).

  - soru: |
      Ferhat, çalıntı olduğunu bilmeden aldığı antika bir cep saatine kendi zevkine göre, saatin değerini artırmayan ve zararsızca sökülebilen bir zincir taktırmıştır. Malik saati geri alırken zincir için hiçbir karşılık önermemektedir. Hangisi doğrudur?
    siklar:
      - "Ferhat zincirin bedelini ister ve ödeninceye kadar saati geri vermekten kaçınabilir."
      - "Zincir saatin parçası olmuştur; Ferhat hiçbir şey isteyemez ve zinciri sökemez."
      - "Ferhat zincir için para isteyemez; ama saati geri vermeden önce zinciri söküp alabilir."
      - "Ferhat zincir bedelinin yarısını isteyebilir."
    dogru: 2
    aciklama: |
      Zincir kişisel zevk için yapılmış, değer artışı sağlamayan bir giderdir. TMK m. 994/2'ye göre iyiniyetli zilyet diğer giderler için tazminat isteyemez. Ancak şeyin geri verilmesinden önce bu giderler için tazminat önerilmezse, şeyle birleştirdiği ve zararsızca ayrılabilen eklemeleri geri vermeden önce ayırıp alabilir. Geri vermekten kaçınma hakkı yalnız zorunlu ve yararlı giderler içindir (TMK m. 994/1).

  - soru: |
      TMK m. 994/3'e göre iyiniyetli zilyedin elde ettiği ürünler hakkında hangisi doğrudur?
    siklar:
      - "Ürünler, zilyedin yaptığı giderlerden doğan alacaklarına mahsup edilir."
      - "Ürünler hesaba katılmaz; gider alacağı tam olarak ödenir."
      - "Zilyet ürünlerin değerinin iki katını öder."
      - "Ürünler Devlete geçer."
    dogru: 0
    aciklama: |
      TMK m. 994/3'e göre zilyedin elde ettiği ürünler, yaptığı giderler sebebiyle doğan alacaklarına mahsup edilir. Yani hak sahibi gider alacağını öderken zilyedin elde ettiği ürünleri hesaba katar. Ürünleri tazmin etme yükümlülüğü iyiniyetsiz zilyede aittir (TMK m. 995/1).

  - soru: |
      Kaan, başkasına ait olduğunu bilerek elinde tuttuğu atın hastalığı için tedavi gideri (hak sahibi için de zorunlu) ve atın değerini artıran özel eğitim gideri (yararlı) yapmıştır. At geri istendiğinde Kaan, TMK m. 995'e göre hangi giderleri isteyebilir?
    siklar:
      - "Her iki giderin tamamını"
      - "Tedavi giderini ve eğitimin geri verme anında mevcut olan değer artışını"
      - "Hiçbir gideri isteyemez"
      - "Yalnız tedavi giderini"
    dogru: 3
    aciklama: |
      İyiniyetli olmayan zilyet, yaptığı giderlerden ancak hak sahibi için de zorunlu olanların tazmin edilmesini isteyebilir (TMK m. 995/2). Tedavi bu niteliktedir; yararlı eğitim gideri istenemez. Mevcut değer artışının istenebilmesi, kötüniyetli zenginleşene ilişkin TBK m. 80/2'nin çözümüdür; zilyedin sorumluluğunda böyle bir hak yoktur.

  - soru: |
      TMK m. 995/1'e göre iyiniyetli olmayan zilyedin hak sahibine karşı sorumluluğu neyi kapsar?
    siklar:
      - "Yalnız elde ettiği ürünleri"
      - "Haksız alıkoymanın verdiği zararları ve elde ettiği veya elde etmeyi ihmal ettiği ürünleri"
      - "Yalnız kasten verdiği zararları"
      - "Şeyin değerinin yarısını"
    dogru: 1
    aciklama: |
      TMK m. 995/1'e göre iyiniyetli olmayan zilyet, geri vermekle yükümlü olduğu şeyi haksız alıkoyması yüzünden hak sahibine verdiği zararlar ile elde ettiği veya elde etmeyi ihmal ettiği ürünler karşılığında tazminat öder. Sorumluluğun kusurlu zararlarla sınırlanması yalnız zilyedin şeyi kime vereceğini bilmediği dönem içindir (TMK m. 995/3).

  - soru: |
      Kemal, elindeki valizin kendisine ait olmadığını bilmektedir; ama gerçek hak sahibinin kim olduğunu bilmemektedir. Bu sırada valiz, Kemal'in hiçbir kusuru olmadan hasar görür. Kemal'in sorumluluğu nedir?
    siklar:
      - "İyiniyetsiz zilyet olduğu için bu hasarı, kusuru bulunmasa bile ve kime vereceğini bilmese de her durumda öder."
      - "Hasarın yarısını öder; kalan yarısına hak sahibi katlanır."
      - "Şeyi kime geri vereceğini bilmediği sürece yalnız kusuruyla verdiği zararlardan sorumlu olduğundan bu hasardan sorumlu değildir."
      - "Hasarı öder, çünkü kusur yalnız iyiniyetli zilyedin sorumluluğunda aranır."
    dogru: 2
    aciklama: |
      TMK m. 995/3'e göre iyiniyetli olmayan zilyet, şeyi kime geri vereceğini bilmediği sürece ancak kusuruyla verdiği zararlardan sorumlu olur. Kemal'in kusuru olmadığından bu hasardan sorumlu tutulamaz. TMK m. 995/1'deki geniş sorumluluk, zilyedin geri vereceği kişiyi bildiği dönem için geçerlidir.

  - soru: |
      Ece, kazandırıcı zamanaşımının şartlarını taşıyarak (iyiniyetle ve malik sıfatıyla, davasız ve aralıksız) bir heykelin üç yıl zilyedi olmuş, sonra heykeli Filiz'e devretmiştir. Filiz de iyiniyetli ve malik sıfatıyla zilyettir. Hangisi doğrudur?
    siklar:
      - "Filiz, Ece'nin üç yıllık zilyetliğini kendi süresine ekleyebilir."
      - "Filiz'in süresi baştan başlar; önceki zilyetlik hiçbir durumda eklenmez."
      - "Ece'nin süresi ancak Filiz onun mirasçısıysa eklenir."
      - "Ece'nin süresinin yalnız yarısı eklenir."
    dogru: 0
    aciklama: |
      TMK m. 996'ya göre kazandırıcı zamanaşımından yararlanma hakkına sahip olan zilyet, zilyetliği kendisine devreden aynı yetkiye sahip idiyse onun zilyetlik süresini kendi süresine ekleyebilir. Ece de iyiniyetli ve malik sıfatıyla zilyet olduğundan bu şart gerçekleşmiştir. Ece kötüniyetli olsaydı süresi eklenemezdi.

  - soru: |
      Tamirci Sedat, onarım için kendisine bırakılan bir antika saati kendi borcuna karşılık alacaklısı Oya'ya rehin olarak teslim eder. Oya saatin Sedat'a ait olduğuna iyiniyetle inanmaktadır. Hangisi doğrudur?
    siklar:
      - "Malik rıza göstermediği için rehin kesin hükümsüzdür ve Oya hiçbir hak kazanmaz."
      - "Oya rehin hakkını kazanır; malik saati Oya'dan rehinden kurtulmuş olarak isteyemez."
      - "Oya rehin hakkını ancak beş yıl sonra kazanır."
      - "Oya saatin maliki olur."
    dogru: 1
    aciklama: |
      Saat malikin iradesiyle tamirciye verilmiştir; Sedat emin sıfatıyla zilyettir. TMK m. 988 iyiniyetle sınırlı ayni hak edinmeyi de korur. TMK m. 939/2'ye göre rehnedende tasarruf yetkisi olmasa bile rehin konusu taşınıra iyiniyetle zilyet olan kimse, zilyetlik hükümlerine göre edinimi korunduğu ölçüde rehin hakkı kazanır. Oya mülkiyet değil rehin hakkı edinmek istediği için malik olmaz.

olaylar:
  - olay: |
      Fotoğrafçı Kerem, profesyonel fotoğraf makinesini 01.02.2026'da bir düğün çekimi için meslektaşı Barış'a iki haftalığına ödünç verir. Borç sıkıntısındaki Barış makineyi kutusu ve aksesuarlarıyla birlikte, kendi malıymış gibi bir ikinci el ilanıyla satışa çıkarır ve 10.02.2026'da piyasa değerine yakın bir bedel olan 85.000 TL'ye Ceren'e satıp teslim eder. Ceren'in Barış'tan şüphelenmesini gerektiren bir durum yoktur.

      Kerem'in yol bisikleti ise 10.03.2024'te evinin önünden çalınmıştır. Hırsız bisikleti ikinci el bisiklet alıp satan X Bisiklet'e satmış, dükkân da bisikleti 20.05.2024'te 32.000 TL'ye Deniz'e satmıştır. Deniz bisikletin çalıntı olduğunu bilmemektedir. Aynı gün Kerem'in cüzdanındaki 15.000 TL de çalınmış; hırsız bu parayla bir elektronik mağazasından kulaklık almıştır. Mağaza sahibi paranın çalıntı olduğunu bilmemektedir.

      Kerem 01.09.2026'da makinenin geri verilmesi için Ceren'e, bisikletin geri verilmesi için Deniz'e dava açar ve mağaza sahibinden 15.000 TL'yi ister. Deniz, bisikleti ancak ödediği bedel karşılığında vereceğini söyler.

      1. Kerem fotoğraf makinesini Ceren'den geri alabilir mi? Ceren'in makinenin Kerem'e ait olduğunu bildiği varsayılırsa sonuç değişir mi?
      2. Bisiklet için açılan dava süresinde midir? Deniz'in savunması yerinde midir?
      3. Kerem 15.000 TL'yi mağaza sahibinden isteyebilir mi?
    olcut:
      - {tespit: "Makinenin Kerem'in iradesiyle Barış'a bırakılması; Barış'ın emin sıfatıyla zilyet olması ve tek eksikliğin tasarruf yetkisi olması", puan: 25, madde: "TMK m. 988"}
      - {tespit: "Ceren'in iyiniyet karinesinden yararlanması ve mülkiyeti kazanması; Kerem'in davasının reddi", puan: 10, madde: "TMK m. 3"}
      - {tespit: "Kötüniyet varsayımında Kerem'in Ceren'e karşı her zaman taşınır davası açabilmesi", puan: 10, madde: "TMK m. 991"}
      - {tespit: "Bisikletin irade dışında elden çıkması; beş yıllık sürenin dolmamış olması", puan: 20, madde: "TMK m. 989"}
      - {tespit: "Benzeri eşya satandan iyiniyetle edinme; Kerem'in ancak 32.000 TL'yi geri vererek bisikleti alabilmesi ve bu tutarı hırsızdan isteyebilmesi", puan: 20, madde: "TMK m. 989"}
      - {tespit: "Çalınan paranın iyiniyetli mağaza sahibinden istenememesi", puan: 15, madde: "TMK m. 990"}
    cozum: |
      **Nitelendirme:** Olayda üç ayrı taşınır için iyiniyetli kazanım sorunu vardır: emin sıfatıyla zilyetten satın alınan makine, çalınıp benzeri eşya satan bir dükkân aracılığıyla satılan bisiklet ve çalınan para.

      **Hukuki sorunlar:** Makine Kerem'in iradesiyle mi elden çıkmıştır ve Ceren malik olmuş mudur? Bisiklet için beş yıllık süre dolmuş mudur, bedel koşulu var mıdır? Çalınan para iyiniyetli üçüncü kişiden istenebilir mi?

      **İlgili hükümler:** TMK m. 3, 763, 988, 989, 990, 991; TBK m. 49.

      **Değerlendirme:**
      - *Makine (TMK m. 988):* Kerem makineyi kendi iradesiyle ödünç olarak Barış'a vermiştir. Barış emin sıfatıyla zilyettir. Makinenin maliki olmadığı için tasarruf yetkisi yoktur; satış ve teslim ise başka bir sebeple sakat değildir. Ceren'in iyiniyeti karinedir (TMK m. 3/1). Fiyat piyasa değerine yakındır ve şüphe uyandıran bir işaret yoktur; Kerem aksini ispatlayamamaktadır. Ceren zilyetliği iyiniyetle ve malik olmak üzere devraldığından makinenin maliki olmuştur (TMK m. 763/2, TMK m. 988). Kerem'in taşınır davası da istihkak davası da sonuç vermez. Kerem zararını Barış'tan sözleşmeye aykırılık, haksız fiil (TBK m. 49) ya da elde ettiği satış bedeli için sebepsiz zenginleşme hükümlerine göre ister.
      - *Kötüniyet varsayımı (TMK m. 991/1):* Ceren makinenin Kerem'e ait olduğunu bilseydi zilyetliği iyiniyetle edinmemiş olurdu. Bu durumda Kerem ona karşı her zaman taşınır davası açabilir ve makineyi geri alırdı.
      - *Bisiklet, süre (TMK m. 989/1):* Bisiklet çalınmıştır, yani Kerem'in iradesi dışında elinden çıkmıştır. Kerem onu elinde bulunduran herkese karşı, iyiniyetli olsa bile, beş yıl içinde taşınır davası açabilir. Hırsızlık 10.03.2024'te olmuştur; 01.09.2026'da açılan dava süresindedir.
      - *Bisiklet, bedel (TMK m. 989/2):* Deniz bisikleti ikinci el bisiklet alıp satan bir dükkândan, yani benzeri eşya satan birinden iyiniyetle edinmiştir. Bu durumda taşınır davası ancak ödenen bedelin geri verilmesi koşuluyla açılabilir. Deniz'in savunması yerindedir. Deniz malik olmamıştır; korunan yalnız ödediği 32.000 TL'dir. Kerem bu tutarı ödeyerek bisikleti alır ve ödediği tutarı hırsızdan haksız fiil hükümlerine göre ister (TBK m. 49).
      - *Para (TMK m. 990):* Zilyet, iradesi dışında elinden çıkmış olsa bile parayı iyiniyetle edinen kimseye karşı taşınır davası açamaz. Mağaza sahibi parayı satış bedeli olarak iyiniyetle almıştır. Kerem'in talebi yerinde değildir; zararını hırsızdan ister.

      **Sonuç:**
      - Ceren makinenin maliki olmuştur; Kerem'in davası reddedilir. Ceren kötüniyetli olsaydı Kerem makineyi her zaman geri isteyebilirdi.
      - Bisiklet davası süresindedir; ancak Kerem bisikleti Deniz'in ödediği 32.000 TL'yi geri vererek alabilir.
      - Kerem 15.000 TL'yi mağaza sahibinden isteyemez. Bütün zararları için Barış'a ve hırsıza başvurabilir.

  - olay: |
      Mehmet'in yazlığındaki antika piyano 01.06.2023'te çalınır. Hırsız piyanoyu kendi malıymış gibi, bir tanıdığı aracılığıyla 15.08.2023'te piyasa değeri olan 300.000 TL'ye piyano öğretmeni Selin'e satar. Selin piyanonun çalıntı olduğunu bilmemekte ve bilmesini gerektiren bir durum da bulunmamaktadır.

      Selin piyanoyu derslerinde kullanır ve 2024 yılı içinde şu giderleri yapar:
      - kırık çekiç mekanizmasının onarımı: 20.000 TL (zorunlu),
      - yeni pedal sistemi: 30.000 TL (bilirkişiye göre piyanonun değerini aynı tutarda artırmıştır),
      - kendi zevkine göre, piyanoya zarar vermeden sökülebilen dekoratif pirinç aksesuarlar: 10.000 TL.

      Mart 2024'te üst kattaki dairede patlayan borudan sızan su, Selin'in hiçbir kusuru olmadan piyanoya 25.000 TL'lik zarar verir.

      Mehmet piyanonun yerini öğrenir; polis tutanağını da eklediği ihtarname 12.02.2025'te Selin'e tebliğ edilir. Selin buna rağmen 20.02.2025'te ev taşırken piyanoyu uzman olmayan arkadaşlarına taşıtır ve piyano 15.000 TL hasar görür. 01.03.2025'te piyanonun nemden bozulmaması için zorunlu olan bir nem giderme düzeneği (5.000 TL) taktırır, ayrıca kendi zevkine göre piyanoyu yeniden cilalatır (8.000 TL).

      Mehmet 10.03.2025'te dava açarak piyanonun geri verilmesini, Selin'in piyanoyu kullandığı süre için tazminat ve bütün hasarların ödenmesini ister. Selin, 300.000 TL kendisine ödenmeden piyanoyu vermeyeceğini ve bütün giderlerinin ödenmesini ister. Mehmet aksesuarlar için hiçbir karşılık önermemektedir.

      1. Mehmet piyanoyu geri alabilir mi? Selin 300.000 TL'yi Mehmet'ten isteyebilir mi?
      2. Kullanma ve hasarlar için Selin'in sorumluluğunu değerlendiriniz.
      3. Selin hangi giderleri isteyebilir? Piyanoyu geri vermekten kaçınabilir mi?
    olcut:
      - {tespit: "Piyanonun irade dışında elden çıkması; beş yıl içinde herkese, iyiniyetli Selin'e de karşı taşınır davası açılabilmesi", puan: 20, madde: "TMK m. 989"}
      - {tespit: "Piyanonun açık artırmadan, pazardan ya da benzeri eşya satandan alınmaması; 300.000 TL bedel koşulunun bulunmaması", puan: 15, madde: "TMK m. 989"}
      - {tespit: "İyiniyetli dönemde kullanma için tazminat ve su hasarı için sorumluluk bulunmaması", puan: 15, madde: "TMK m. 993"}
      - {tespit: "Zorunlu ve yararlı giderlerin (50.000 TL) istenebilmesi ve ödeninceye kadar geri vermekten kaçınma", puan: 20, madde: "TMK m. 994"}
      - {tespit: "Lüks aksesuarlar için tazminat istenememesi; karşılık önerilmediğinden söküp alınabilmesi", puan: 10, madde: "TMK m. 994"}
      - {tespit: "İhtarla iyiniyetin sona ermesi; taşıma hasarından sorumluluk, nem düzeneği giderinin istenebilmesi, cila giderinin istenememesi", puan: 20, madde: "TMK m. 995"}
    cozum: |
      **Nitelendirme:** Piyano Mehmet'in elinden hırsızlıkla, yani iradesi dışında çıkmıştır. Selin çalıntı eşyayı iyiniyetle edinmiş bir zilyettir. Mehmet'in taşınır davası TMK m. 989'a, geri verme sırasındaki hesaplaşma TMK m. 993-995'e göre çözülür.

      **Hukuki sorunlar:** Selin piyanoyu geri vermek zorunda mıdır ve ödediği bedeli isteyebilir mi? İyiniyetli dönemdeki kullanma ve su hasarı için sorumlu mudur? Hangi giderleri isteyebilir ve geri vermekten kaçınabilir mi? İhtardan sonraki hasar ve giderler nasıl değerlendirilir?

      **İlgili hükümler:** TMK m. 3, 989, 993, 994, 995.

      **Değerlendirme:**
      - *Geri verme (TMK m. 989/1):* Taşınırı çalınan zilyet, onu elinde bulunduran herkese karşı beş yıl içinde taşınır davası açabilir. Hırsızlık 01.06.2023'te, dava 10.03.2025'te olmuştur; süre dolmamıştır. Selin'in iyiniyetli olması geri verme borcunu ortadan kaldırmaz.
      - *Bedel (TMK m. 989/2):* Bedel koşulu yalnız açık artırmadan, pazardan ya da benzeri eşya satandan edinmede vardır. Selin piyanoyu bir tanıdık aracılığıyla, sıradan bir kişiden almıştır. 300.000 TL'yi Mehmet'ten isteyemez; satıcıya (hırsıza) başvurur.
      - *İyiniyetli dönem (TMK m. 989/3, TMK m. 993):* Diğer konularda iyiniyetli zilyedin hakları uygulanır. Selin 15.08.2023'ten ihtarın tebliğ edildiği 12.02.2025'e kadar iyiniyetlidir (TMK m. 3/1). Piyanoyu kendi malı sanarak kullandığı için bu döneme ilişkin kullanma tazminatı ödemez (TMK m. 993/1). Su hasarı bu dönemde gerçekleşmiştir; iyiniyetli zilyet hasardan sorumlu olmadığından 25.000 TL'yi ödemez (TMK m. 993/2).
      - *Giderler (TMK m. 994/1):* Çekiç onarımı piyanoyu korumak için gereklidir (zorunlu, 20.000 TL). Pedal sistemi piyanonun değerini artırmıştır (yararlı, 30.000 TL). Bu giderler Selin iyiniyetliyken yapılmıştır. Selin toplam 50.000 TL'yi ister ve bu tutar ödeninceye kadar piyanoyu geri vermekten kaçınabilir. Kanun bu hakkı zaten geri vermeyi isteyen kişiye karşı tanıdığından, gerçeği geri verme istemiyle öğrenmiş olması hakkı ortadan kaldırmaz.
      - *Aksesuarlar (TMK m. 994/2):* Kişisel zevk için yapılmıştır; tazminatı istenemez. Mehmet karşılık önermediğinden Selin, zararsızca sökülebilen aksesuarları piyanoyu geri vermeden önce söküp alabilir.
      - *İhtardan sonra (TMK m. 995):* Polis tutanağını içeren ihtarla Selin piyanonun çalıntı olduğunu ve onu Mehmet'e vermesi gerektiğini öğrenmiştir; artık iyiniyetli değildir. Şeyi kime vereceğini bildiğinden TMK m. 995/3'teki sınırlama uygulanmaz. Hasar, piyanoyu uzman olmayan kişilere taşıtmasıyla, yani kendi kusuruyla doğmuştur; kusursuz sorumluluğun sınırı tartışmalı olsa da burada sonuç değişmez. Selin 15.000 TL hasardan sorumludur (TMK m. 995/1). Bu dönemde yapılan giderlerden yalnız hak sahibi için de zorunlu olanları isteyebilir (TMK m. 995/2): nem düzeneği (5.000 TL) bu niteliktedir, kendi zevkine göre yaptırdığı cila (8.000 TL) değildir. İhtardan sonraki kullanım için Mehmet'in talebi TMK m. 995/1 çerçevesinde değerlendirilir; kullanım karşılığı tazminatın ayrıntısı 8. konuda.

      **Sonuç:**
      - Mehmet piyanoyu geri alır; Selin 300.000 TL'yi Mehmet'ten isteyemez.
      - Selin iyiniyetli döneme ait kullanma için tazminat ve 25.000 TL su hasarı ödemez; ihtardan sonraki 15.000 TL taşıma hasarını öder.
      - Selin 50.000 TL zorunlu ve yararlı gideri ister ve ödeninceye kadar piyanoyu geri vermekten kaçınabilir. Nem düzeneği için 5.000 TL'yi de ister; aksesuarları söküp alabilir, cila bedelini isteyemez. Karşılıklı alacaklar ayrıca hesaplaşılır.

  - olay: |
      Ayşe, antika pırlanta yüzüğünü 05.01.2025'te temizlik ve taş tespiti için kuyumcu Bora'ya bırakır. Mali sıkıntıdaki Bora, 15.01.2025'te Cengiz'den aldığı 150.000 TL borca karşılık yüzüğü Cengiz'e rehin olarak teslim eder. Bora yüzüğü dükkânının malı olarak göstermiştir ve Cengiz'in aksini bilmesini gerektiren bir durum yoktur. Bora borcunu ödemez ve ortadan kaybolur.

      Ayşe'nin altın kolyesi 01.04.2025'te evinden Ferit tarafından çalınır. Ferit kolyeyi, çalıntı olduğunu açıkça söyleyerek sevgilisi Gül'e hediye eder. Haziran 2025'te Hasan kolyeyi Gül'ün evinden çalar. Gül, Hasan'a karşı TMK m. 989'a dayanarak taşınır davası açar.

      Ferit aynı hırsızlıkta Ayşe'nin evinden 50.000 TL nakit de almış ve bu parayla bir telefon mağazasından telefon satın almıştır. Mağaza sahibi paranın çalıntı olduğunu bilmemektedir.

      Ayşe, yüzüğün rehinden kurtulmuş olarak kendisine verilmesi için Cengiz'e, kolyenin geri verilmesi için Hasan'a dava açar ve mağaza sahibinden 50.000 TL'yi ister.

      1. Cengiz yüzük üzerinde bir hak kazanmış mıdır? Ayşe'nin Cengiz'e karşı davasını değerlendiriniz.
      2. Gül'ün Hasan'a karşı açtığı davayı ve Ayşe'nin Hasan'a karşı açtığı davayı değerlendiriniz.
      3. Ayşe 50.000 TL'yi mağaza sahibinden isteyebilir mi?
    olcut:
      - {tespit: "Yüzüğün Ayşe'nin iradesiyle Bora'ya bırakılması; Bora'nın emin sıfatıyla zilyet olması ve tasarruf yetkisinin bulunmaması", puan: 15, madde: "TMK m. 988"}
      - {tespit: "Cengiz'in zilyetliği iyiniyetle devralarak rehin hakkını kazanması", puan: 20, madde: "TMK m. 939"}
      - {tespit: "Ayşe'nin malik kalması ama yüzüğü rehinden kurtulmuş olarak isteyememesi; Bora'ya karşı taleplerinin saklı olması", puan: 10, madde: "TBK m. 49"}
      - {tespit: "Gül'ün zilyetliği iyiniyetle edinmemiş olması nedeniyle Hasan'a karşı taşınır davası açamaması", puan: 20, madde: "TMK m. 991"}
      - {tespit: "Ayşe'nin iyiniyetsiz Hasan'a karşı her zaman taşınır davası açabilmesi; ayrıca istihkak davası imkânı", puan: 15, madde: "TMK m. 991"}
      - {tespit: "Çalınan paranın iyiniyetli mağaza sahibinden istenememesi", puan: 20, madde: "TMK m. 990"}
    cozum: |
      **Nitelendirme:** Olayda üç ayrı durum vardır: emin sıfatıyla zilyetin malik olmadığı bir taşınırı rehnetmesi, çalınan eşyanın iyiniyetsiz zilyetler arasında el değiştirmesi ve çalınan paranın iyiniyetli bir üçüncü kişiye ödenmesi.

      **Hukuki sorunlar:** Cengiz rehin hakkını iyiniyetle kazanmış mıdır? Gül, Hasan'a karşı taşınır davası açabilir mi? Ayşe kolyeyi Hasan'dan isteyebilir mi? Para mağazadan istenebilir mi?

      **İlgili hükümler:** TMK m. 3, 683, 939, 988, 989, 990, 991; TBK m. 49.

      **Değerlendirme:**
      - *Yüzük (TMK m. 988):* Ayşe yüzüğü temizlik için kendi iradesiyle Bora'ya bırakmıştır. Bora emin sıfatıyla zilyettir; yüzüğün maliki olmadığından onu rehnetme yetkisi yoktur. TMK m. 988 yalnız mülkiyeti değil, iyiniyetle sınırlı ayni hak edinmeyi de korur.
      - *Rehin hakkı (TMK m. 939/2):* Rehnedende tasarruf yetkisi olmasa bile rehin konusu taşınıra iyiniyetle zilyet olan kimse, zilyetlik hükümlerine göre edinimi korunduğu ölçüde rehin hakkı kazanır. Taşınır rehni zilyetliğin alacaklıya devriyle kurulur (TMK m. 939/1) ve yüzük Cengiz'e teslim edilmiştir. Cengiz'in iyiniyeti karinedir (TMK m. 3/1) ve aksini gösteren bir durum yoktur. Cengiz 150.000 TL alacağı için rehin hakkını kazanmıştır.
      - *Ayşe'nin davası:* Ayşe yüzüğün maliki olmaya devam eder, çünkü Cengiz mülkiyet değil rehin hakkı edinmiştir. Ancak Cengiz'in rehin hakkı korunduğundan Ayşe yüzüğü rehinden kurtulmuş olarak isteyemez; bu talep reddedilir. Rehnin paraya çevrilmesi ve sona ermesi rehin konusundadır. Ayşe, Bora'ya karşı sözleşmeye aykırılık ve haksız fiil (TBK m. 49) hükümlerine göre tazminat isteyebilir.
      - *Gül'ün davası (TMK m. 991/2):* Kolye Gül'ün elinden çalınmıştır; TMK m. 989 ilk bakışta Gül'e dava hakkı veriyor gibi görünür. Ancak önceki zilyet de zilyetliği iyiniyetle edinmemişse sonraki zilyede karşı taşınır davası açamaz. Gül kolyenin çalıntı olduğunu bilerek almıştır. Gül'ün taşınır davası reddedilir. Gül'ün süresi içinde gasp nedeniyle zilyetlik davası (TMK m. 982) açması ayrı bir konudur.
      - *Ayşe'nin Hasan'a karşı davası (TMK m. 991/1):* Hasan kolyeyi hırsızlıkla edinmiştir; iyiniyetli değildir. İyiniyetle edinmemiş kimseye karşı önceki zilyet her zaman taşınır davası açabilir. Kolye Ayşe'nin iradesi dışında elinden çıktığından beş yıllık süre (TMK m. 989/1) de dolmamıştır. Ayşe ayrıca malik olarak istihkak davası açabilir (TMK m. 683). Kolye Ayşe'ye geri verilir.
      - *Para (TMK m. 990):* Zilyet, iradesi dışında elinden çıkmış olsa bile parayı iyiniyetle edinmiş olan kimseye karşı taşınır davası açamaz. Mağaza sahibi parayı telefonun bedeli olarak iyiniyetle almıştır. Ayşe'nin talebi reddedilir; zararını Ferit'ten ister (TBK m. 49).

      **Sonuç:**
      - Cengiz yüzük üzerinde rehin hakkı kazanmıştır; Ayşe yüzüğü rehinden kurtulmuş olarak isteyemez, Bora'dan tazminat ister.
      - Gül'ün Hasan'a karşı taşınır davası reddedilir. Ayşe'nin Hasan'a karşı davası kabul edilir ve kolye Ayşe'ye verilir.
      - Ayşe 50.000 TL'yi mağaza sahibinden isteyemez; zararını Ferit'ten ister.

kartlar:
  - on: "TMK m. 988 ne der?"
    arka: "Bir taşınırın emin sıfatıyla zilyedinden iyiniyetle mülkiyet veya sınırlı ayni hak edinenin edinimi, zilyedin tasarruf yetkisi olmasa bile korunur."
  - on: "Emin sıfatıyla zilyet kimdir?"
    arka: "Eşyanın zilyetliğini önceki zilyedin iradesiyle elde etmiş kişi: kiracı, ödünç alan, saklayan, tamirci, komisyoncu, rehin alacaklısı."
  - on: "TMK m. 988'in şartları nelerdir?"
    arka: "Taşınır; emin sıfatıyla zilyetten edinme; tek eksikliğin tasarruf yetkisi olması; üçüncü kişinin ayni hak edinmesi; zilyetliğin devri; edinenin iyiniyeti."
  - on: "TMK m. 988'de iyiniyet hangi anda aranır?"
    arka: "Zilyetliğin devralındığı, yani edinme anında. Sonradan öğrenmek kazanımı bozmaz."
  - on: "TMK m. 763/2'nin bu konuyla bağlantısı nedir?"
    arka: "Zilyetliği iyiniyetle ve malik olmak üzere devralan, devredenin yetkisi olmasa bile zilyetlik hükümlerine göre kazanmanın korunduğu hâllerde malik olur."
  - on: "Kiracının elinden çalınan eşya hangi maddeye tabidir?"
    arka: "TMK m. 989. İradi teslim zinciri kopmuştur; kanun 'malik' değil 'zilyet' der."
  - on: "TMK m. 989/1'deki dava süresi ve davalı kimdir?"
    arka: "Beş yıl; eşyayı elinde bulunduran herkes, iyiniyetli olsa bile."
  - on: "TMK m. 989/2'deki bedel koşulu ne zaman uygulanır?"
    arka: "İrade dışında çıkan eşya açık artırmadan, pazardan ya da benzeri eşya satandan iyiniyetle edinilmişse. Dava ancak ödenen bedel geri verilerek açılır."
  - on: "TMK m. 989/2'de edinen malik olur mu?"
    arka: "Hayır. Korunan yalnız ödediği bedeldir. Malik bedeli öder, eşyayı alır, bedeli hırsızdan ister."
  - on: "Emin sıfatıyla zilyetten iyiniyetle edinene karşı malik bedel önererek eşyayı geri alabilir mi?"
    arka: "Hayır. Edinen malik olmuştur; bedel koşulu yalnız irade dışında çıkan eşyaya özgüdür (Hukuk Genel Kurulu)."
  - on: "TMK m. 990 ne der?"
    arka: "Zilyet, iradesi dışında elinden çıkmış olsa bile para ve hamile yazılı senetleri iyiniyetle edinene karşı taşınır davası açamaz."
  - on: "Elden çıkan poliçe ve çekte yeni hamil ne zaman geri verir?"
    arka: "Kural olarak senedi kötüniyetle edinmişse veya edinmesinde ağır kusuru varsa (TTK m. 686/2, TTK m. 792)."
  - on: "İyiniyetsiz edinene karşı taşınır davası ne zaman açılır? (TMK m. 991/1)"
    arka: "Her zaman. Beş yıllık süre ve bedel koşulu iyiniyetsiz edineni korumaz."
  - on: "TMK m. 991/2 ne der?"
    arka: "Önceki zilyet de zilyetliği iyiniyetle edinmemişse sonraki zilyede karşı taşınır davası açamaz."
  - on: "Taşınır davası ile istihkak davasının farkı nedir?"
    arka: "Taşınır davası önceki zilyetliğe dayanır, mülkiyet ispatı gerekmez (TMK m. 988-991). İstihkak davası mülkiyete dayanır (TMK m. 683)."
  - on: "İyiniyetli zilyet kullanma ve hasar için sorumlu mudur? (TMK m. 993)"
    arka: "Hayır. Kullanma için tazminat ödemez; kayıp, yok olma ve hasardan sorumlu değildir."
  - on: "İyiniyetli zilyedin gider hakları nelerdir? (TMK m. 994)"
    arka: "Zorunlu ve yararlı giderleri ister ve ödeninceye kadar geri vermekten kaçınır. Diğer giderleri isteyemez; karşılık önerilmezse zararsızca ayrılabilen eklemeleri söküp alır."
  - on: "İyiniyetli zilyedin elde ettiği ürünler ne olur? (TMK m. 994/3)"
    arka: "Yaptığı giderlerden doğan alacaklarına mahsup edilir."
  - on: "İyiniyetsiz zilyet neyi tazmin eder? (TMK m. 995/1)"
    arka: "Haksız alıkoymanın verdiği zararları ve elde ettiği veya elde etmeyi ihmal ettiği ürünleri."
  - on: "İyiniyetsiz zilyet hangi giderleri ister? (TMK m. 995/2)"
    arka: "Yalnız hak sahibi için de zorunlu olanları. Yararlı ve lüks giderleri isteyemez."
  - on: "TMK m. 995/3 ne der?"
    arka: "İyiniyetsiz zilyet, şeyi kime geri vereceğini bilmediği sürece ancak kusuruyla verdiği zararlardan sorumludur."
  - on: "TMK m. 996 ne der?"
    arka: "Kazandırıcı zamanaşımından yararlanabilecek zilyet, kendisine devreden de aynı yetkiye sahipse onun zilyetlik süresini kendi süresine ekler."
  - on: "Yargıtay'a göre trafikte kayıtlı araç TMK m. 988 ile iyiniyetle kazanılabilir mi?"
    arka: "Hukuk Genel Kurulu 2021 ve sonraki kararlar: hayır; noter satışı malikle yapılmalı ve trafik siciline güven koruması yok (KTK m. 20). Konu tartışmalıdır."
