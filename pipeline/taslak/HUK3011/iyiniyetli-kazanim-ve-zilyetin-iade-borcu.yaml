    tanim: "Eşyanın zilyetliğini önceki zilyedin iradesiyle, güvene dayanarak elde etmiş kişi: kiracı, ödünç alan, saklayan, tamirci, komisyoncu (TMK m. 988)."
  - terim: Tasarruf yetkisi
    tanim: "Bir hak üzerinde devir, rehin gibi işlemler yapabilme yetkisi. Malik olmayan emin sıfatıyla zilyette bu yetki yoktur."
  - terim: İyiniyetli kazanım
    tanim: "Tasarruf yetkisi olmayan kişiden iyiniyetle ayni hak edinilmesi ve bu edinimin kanunca korunması (TMK m. 763/2, TMK m. 988)."
  - terim: Taşınır davası
    tanim: "Önceki zilyedin taşınırı şimdiki zilyetten geri istediği, zilyetliğe dayanan hak davası; mülkiyetin ispatını gerektirmez (TMK m. 988-991)."
  - terim: İrade dışında elden çıkma
    tanim: "Eşyanın çalınma, kaybolma, unutma, zorla alınma gibi yollarla zilyedin rızası olmadan elinden çıkması (TMK m. 989)."
  - terim: Benzeri eşya satan
    tanim: "Aynı türden eşyayı mesleki olarak satan kişi; ondan iyiniyetle alınan çalıntı eşya ancak ödenen bedel geri verilerek istenebilir (TMK m. 989/2)."
  - terim: Hamile yazılı senet
    tanim: "Senedi elinde bulunduranı hak sahibi sayan kıymetli evrak; para gibi, iyiniyetli edinenden istenemez (TMK m. 990)."
  - terim: İyiniyetli zilyet
    tanim: "Zilyetliğe hakkı olduğuna inanan, şeyi geri vermekle yükümlü olduğunu bilmeyen ve bilmesi de gerekmeyen zilyet (TMK m. 993-994)."
  - terim: İyiniyetsiz zilyet
    tanim: "Şeyi geri vermekle yükümlü olduğunu bilen ya da bilmesi gereken zilyet (TMK m. 995)."
  - terim: Zorunlu gider
    tanim: "Şeyin varlığını ve değerini korumak için gereken harcama."
  - terim: Yararlı gider
    tanim: "Şeyin değerini veya verimini artıran harcama."
  - terim: Diğer (lüks) gider
    tanim: "Kişisel zevk için yapılan, değer artışı sağlamayan harcama; iyiniyetli zilyet bile tazminini isteyemez (TMK m. 994/2)."
  - terim: Ayırıp alma hakkı
    tanim: "Karşılık önerilmezse iyiniyetli zilyedin, şeyle birleştirdiği ve zararsızca ayrılabilen eklemeleri geri vermeden önce sökerek alması (TMK m. 994/2)."
  - terim: Geri vermekten kaçınma hakkı
    tanim: "İyiniyetli zilyedin, zorunlu ve yararlı giderleri ödeninceye kadar şeyi geri vermeyebilmesi (TMK m. 994/1)."
  - terim: Zilyetliklerin eklenmesi
    tanim: "Kazandırıcı zamanaşımından yararlanabilecek zilyedin, aynı yetkiye sahip devredenin zilyetlik süresini kendi süresine katması (TMK m. 996)."

