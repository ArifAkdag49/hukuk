  - id: "1230103000"
    ozet: |
      Davacının kimlik bilgilerini ve fotoğrafını ele geçiren kişiler, bir dublör kullanarak onun adına yeni nüfus cüzdanı çıkarmış, aynı gün bu cüzdanla noterde satış vekâletnamesi düzenletmiş ve davacının çok sayıda taşınmazını rayiç değerin altında satmıştır. Davacının açtığı tapu iptali ve tescil davasında taşınmazları sonradan edinen bazı kişiler iyiniyetli kabul edildiğinden üç parsel yönünden dava reddedilmiş, davacı bu parseller için TMK m. 1007'ye dayanarak Hazine'den tazminat istemiştir. Bölge adliye mahkemesi, illiyet bağının noterin ve sahte vekilin eylemleriyle kesildiğini kabul ederek davayı reddetmiş ve Yargıtay 5. Hukuk Dairesinin bozma kararına direnmiştir. Hukuk Genel Kurulu oy birliğiyle direnme kararını bozmuştur: Devletin sorumluluğu kusursuzdur, tapu memurunun kusurlu olup olmaması önem taşımaz; illiyet bağının üçüncü kişinin eylemiyle kesildiğini Hazine ispatlamalıdır ve bu iddia dar yorumlanır. Noter ve sahte vekil kusurlu olsa da eylemleri tapudaki işlem ile zarar arasındaki uygun illiyet bağını kesmez; aynı gün kimlik ve vekâletname çıkarılması ve rayiç altı çok sayıda satış da açıkça şüphe uyandırıcıdır. Konuya katkısı: güven ilkesi yüzünden taşınmazını iyiniyetli üçüncü kişiye kaptıran gerçek malikin zararını Devletin karşıladığını ve illiyet bağının kesilmesinin dar yorumlandığını gösterir.
  - id: "421512500"
    ozet: |
      Davacıların taşınmazının tapu kaydı, Hazine'nin açtığı davada taşınmazın kıyı kenar çizgisi içinde kaldığı gerekçesiyle iptal edilmiş, karar 16.01.2007'de kesinleşmiş ve davacılar 01.12.2008'de TMK m. 1007'ye dayanarak tazminat davası açmıştır. Yerel mahkeme sorumluluğu haksız fiil sorumluluğu sayarak mülga Borçlar Kanunu'ndaki bir yıllık zamanaşımının kesinleşmeden itibaren dolduğunu kabul etmiş ve Yargıtay 5. Hukuk Dairesinin bozma kararına direnmiştir. Hukuk Genel Kurulu, gerekçeyi düzelterek direnme kararını oy çokluğuyla bozmuştur. Kurul'a göre TMK m. 1007'deki sorumluluk objektif-kusursuz bir tehlike sorumluluğudur ve haksız fiil sorumluluğuyla ilgisi yoktur; kanunda ayrı bir süre de bulunmadığından on yıllık genel zamanaşımı (bugünkü TBK m. 146) uygulanır ve iptal kararının kesinleşmesinden itibaren bu süre dolmamıştır. Azınlık, haksız fiil zamanaşımının uygulanması gerektiğini savunmuştur. Konuya katkısı: TMK m. 1007 davasında zamanaşımının türünü ve sürenin başlangıcında kesinleşme tarihinin önemini gösterir.
  - id: "1140759200"
    ozet: |
      1955 kadastrosuyla tarla olarak tescil edilen taşınmaz 1966'da davacının murisine geçmiş, kayda 1991'de taşınmazın orman tahdit sınırları içinde kaldığına ilişkin şerh konulmuştur; 2015'te taşınmaz üç mirasçıya 1/3'er payla intikal etmiş ve davacı aynı gün diğer iki mirasçının paylarını satın almıştır. Taşınmazın bir bölümü 2019'da kesinleşen kararla orman vasfıyla Hazine adına tescil edilince davacı bütün paylar için TMK m. 1007'ye dayanarak tazminat istemiş; ilk derece mahkemesi davayı kabul etmiş ve Yargıtay 5. Hukuk Dairesinin satın alınan paylar yönünden verdiği bozma kararına direnmiştir. Hukuk Genel Kurulu oy çokluğuyla direnme kararını bozmuştur. Kurul'a göre kadastro işlemlerindeki hatalar da TMK m. 1007 kapsamındadır ve mirasla gelen pay için tazminat gerekir; ancak TMK m. 1020/3 uyarınca kimse sicildeki kaydı bilmediğini ileri süremeyeceğinden, orman şerhini görerek pay satın alan davacı bu paylar bakımından iyiniyetli sayılmaz ve zararı ile sicil arasında illiyet bağı kurulamaz. Azınlık, önceki maliklerin tazminat hakkının kötüniyeti ispatlanmamış yeni malike de geçmesi gerektiğini ve illiyet bağını kesecek ağır bir kusur bulunmadığını savunmuştur. Konuya katkısı: açıklık ilkesinin Devletin sorumluluğunu nasıl sınırladığını gösterir.

sorular:
  - soru: |
      TMK m. 997'ye göre tapu sicilini oluşturan unsurlar arasında **yer almayan** hangisidir?
    siklar:
      - "Tapu kütüğü"
      - "Kat mülkiyeti kütüğü"
      - "Yevmiye defteri ve planlar"
      - "Belediyedeki emlak vergisi kayıtları"
    dogru: 3
    aciklama: |
      TMK m. 997/2'ye göre tapu sicili, tapu kütüğü ve kat mülkiyeti kütüğü ile bunları tamamlayan yevmiye defteri, belgeler ve planlardan oluşur. Vergi kayıtları sicilin parçası değildir ve ayni hakkı göstermez.

  - soru: |
      TMK m. 998'e göre tapu siciline **taşınmaz olarak** kaydedilenler arasında **sayılmayan** hangisidir?
    siklar:
      - "Arazi"
      - "Taşınmazlar üzerindeki bağımsız ve sürekli haklar"
      - "Kat mülkiyetine konu bağımsız bölümler"
      - "Bir tarımsal işletmenin eklentisi olan tarım makineleri"
    dogru: 3
    aciklama: |
      TMK m. 998/1 taşınmaz olarak arazi, bağımsız ve sürekli haklar ile bağımsız bölümleri sayar. Eklentiler taşınmaz olarak kaydedilmez. Malikin isteğiyle yalnız beyanlar sütununa yazılabilir (TMK m. 1000/4).

  - soru: |
      Nermin, arsası üzerinde X A.Ş. lehine 25 yıl süreli ve devredilebilir bir üst hakkı kurmuştur. X A.Ş. bu hakkın tapu kütüğünde ayrı bir sayfaya taşınmaz olarak kaydedilmesini istemektedir. Hangisi doğrudur?
    siklar:
      - "Hak devredilebilir olduğu için ayrı sayfaya kaydedilir."
      - "Süreklilik için hakkın süresiz ya da en az otuz yıl süreli olması gerektiğinden, 25 yıllık hak ayrı sayfaya kaydedilemez."
      - "Üst hakkı hiçbir koşulda ayrı sayfaya kaydedilemez."
      - "Nermin'in rızasıyla süre şartı aranmaksızın kaydedilir."
    dogru: 1
    aciklama: |
      Bağımsız ve sürekli hakların kaydı için süreklilik şartı aranır. Hak süresiz ya da en az otuz yıl süreli olmalıdır (TMK m. 998/3). Üst hakkı bağımsız ve sürekliyse hak sahibinin istemiyle taşınmaz olarak kaydedilebilir (TMK m. 826/3). 25 yıl bu şartı karşılamaz. Malikin rızası da kanuni şartın yerini tutmaz.

  - soru: |
      Özel mülkiyete tabi olmayan ve kamunun yararlanmasına ayrılan taşınmazlar hakkında TMK m. 999'a göre hangisi doğrudur?
    siklar:
      - "Her durumda kütüğe kaydedilir."
      - "Tescili gerekli bir ayni hakkın kurulması söz konusu olmadıkça kütüğe kaydedilmez."
      - "Yalnız belediye adına kaydedilir."
      - "Hiçbir durumda kaydedilmez ve üzerlerinde hiçbir ayni hak kurulamaz."
    dogru: 1
    aciklama: |
      TMK m. 999/1'e göre bu taşınmazlar, kendilerine ilişkin tescili gerekli bir ayni hakkın kurulması söz konusu olmadıkça kütüğe kaydedilmez. Bu istisna kaydı mümkün kılar. Kayıtlı bir taşınmaz kayda tabi olmayan bir taşınmaza dönüşürse ise sicilden çıkarılır (TMK m. 999/2).

  - soru: |
      Bir köyde yapılan kadastro çalışmasında aşağıdakilerden hangisi bir kamu tüzel kişisi adına **tespit edilir**?
    siklar:
      - "Köyün merası"
      - "Köy yolu"
      - "Köydeki ilkokul binası"
      - "Köyün yakınındaki dağ ve kayalık alan"
    dogru: 2
    aciklama: |
      3402 sayılı Kanun m. 16'ya göre okul gibi kamu hizmetinde kullanılan binalar ilgili kamu tüzel kişisi adına tespit edilir. Mera gibi orta malları sınırlandırılıp özel siciline yazılır ve bu tescil sayılmaz. Yol haritasında gösterilir. Tarıma elverişsiz dağ ve kayalar ise tescil ve sınırlandırmaya tabi değildir.

  - soru: |
      TMK m. 1000'e göre tapu kütüğünün özel sütunlarına **tescil edilen** haklar arasında yer almayan hangisidir?
    siklar:
      - "Mülkiyet"
      - "İrtifak hakları ve taşınmaz yükü"
      - "Rehin hakları"
      - "Taşınmaz satış vaadinden doğan hak"
    dogru: 3
    aciklama: |
      TMK m. 1000/3'e göre özel sütunlara mülkiyet, irtifaklar ile taşınmaz yükü ve rehin hakları tescil edilir. Satış vaadinden doğan hak kişisel bir haktır. Tescil edilmez, kütüğe şerh verilebilir (TMK m. 1009/1).

  - soru: |
      Hakan'ın aynı ilçede birbirine bitişik olmayan üç tarlası, isteği üzerine kütükte ortak bir sayfaya kaydedilmiş ve bu sayfaya Banka lehine ipotek tescil edilmiştir. Daha sonra Hakan'ın istemiyle tarlalardan biri ortak sayfadan çıkarılmıştır. Hangisi doğrudur?
    siklar:
      - "Sayfadan çıkarılan tarla ipotekten kurtulur."
      - "İpotek, sayfadan çıkarılan tarlada da saklı kalır."
      - "Tarlalardan biri çıkarılınca ipotek bütün tarlalar için sona erer."
      - "Ortak sayfa yalnız bitişik taşınmazlar için mümkün olduğundan kayıt baştan geçersizdir."
    dogru: 1
    aciklama: |
      TMK m. 1000/5'e göre aynı malikin taşınmazları sınırları bitişik olmasa bile ortak sayfaya kaydedilebilir. Bu sayfaya yapılan rehin tescilleri bütün taşınmazları bağlar. Taşınmazlardan biri sayfadan çıkarılırsa, üzerinde tescil edilmiş haklar saklı kalır.

  - soru: |
      Malikin isteğiyle beyanlar sütununa yazılan **eklenti kaydı** nasıl silinebilir?
    siklar:
      - "Malikin tek taraflı istemiyle"
      - "Kütükte hak sahibi olarak görünenlerin rızasıyla"
      - "Tapu memurunun kendiliğinden vereceği kararla"
      - "Yalnız sulh hukuk mahkemesinin kararıyla"
    dogru: 1
    aciklama: |
      TMK m. 1000/4'e göre eklentilere ilişkin kayıt ancak kütükte hak sahibi olarak görünenlerin rızasıyla silinebilir (aynı yönde TMK m. 1012/1). Örneğin ipotek alacaklısı, güvencenin eklentileri de kapsadığına güvenmiştir. Malik bu güvenceyi tek başına daraltamaz.

  - soru: |
      TMK m. 1002'ye göre tapu kütüğüne yönelik tescil istemleri yevmiye defterine nasıl yazılır?
    siklar:
      - "Tapu memurunun belirlediği öncelik sırasına göre, hafta sonunda toplu olarak"
      - "İsteyenin kimliği ve istemin konusu belirtilerek, istem sırasına göre derhâl"
      - "Yalnız tescil işlemi tamamlandıktan sonra"
      - "Taşınmazın değerine göre önem sırasıyla"
    dogru: 1
    aciklama: |
      TMK m. 1002/1'e göre tescil istemleri, isteyenin kimliği ve istemin konusu belirtilerek istem sırasına göre derhâl yevmiye defterine yazılır. Tesciller de istem tarihine ve sırasına göre yapılır (TMK m. 1017/1).

  - soru: |
      Heyelan bölgesi olmayan bir yerde, bir parselin tapu planındaki sınırı ile arazideki sınır taşları birbirini tutmamaktadır. Hangisi esas alınır?
    siklar:
      - "Arazideki sınır taşları"
      - "Plandaki sınır"
      - "Komşuların ortak beyanı"
      - "Malikin fiilen kullandığı alan"
    dogru: 1
    aciklama: |
      Taşınmazın kütüğe kaydında ve belirlenmesinde resmî ölçüme dayanan plan esastır (TMK m. 1003/1). Tapu planları ile arazideki işaretler birbirini tutmazsa asıl olan plandaki sınırdır. Bu kural yalnız yetkili makamlarca heyelan bölgesi olduğu belirlenen yörelerde uygulanmaz (TMK m. 719/2).

  - soru: |
      Bir şirketin çiftliğinin %70'i Silivri'de, %30'u Çatalca'dadır. Şirket çiftlik üzerinde ipotek kurdurmak istemektedir. İstem nereye yapılır?
    siklar:
      - "Her iki tapu idaresine ayrı ayrı; her bölgede ayrı bir ipotek kurulur."
      - "Silivri'deki tapu idaresine; yapılan tescil Çatalca'ya bildirilir."
      - "Şirket merkezinin bulunduğu yerdeki tapu idaresine."
      - "Çatalca'ya; çünkü küçük kısmın sicili esas sicildir."
    dogru: 1
    aciklama: |
      Birden çok bölgede bulunan taşınmaz her bölgedeki sicile ayrı ayrı kaydedilir (TMK m. 1005/1). Ancak tescil istemleri ve tescil işlemleri taşınmazın büyük kısmının bulunduğu bölgede yapılır. Yapılan tescil diğer bölgedeki tapu idaresine bildirilir (TMK m. 1005/2).

  - soru: |
      TMK m. 1020/2'ye göre tapu kütüğündeki ilgili sayfanın ve belgelerin gösterilmesini kim isteyebilir?
    siklar:
      - "Yalnız malik ve onun yazılı izin verdiği kişiler"
      - "İlgisini inanılır kılan herkes"
      - "Gerekçe göstermeksizin herkes"
      - "Yalnız mahkemeler ve kamu kurumları"
    dogru: 1
    aciklama: |
      Sicil herkese açıktır (TMK m. 1020/1). Ama ilgili sayfanın ve belgelerin gösterilmesini ya da örneklerinin verilmesini, ilgisini inanılır kılan kişi isteyebilir (TMK m. 1020/2). İspat gerekmez, inanılır kılmak yeter. Malikin izni aranmaz. Salt merak ise ilgi sayılmaz.

  - soru: |
      Elif, üzerinde Deniz lehine kira şerhi bulunan bir daireyi tapu kaydına bakmadan satın almıştır. Deniz kira sözleşmesini Elif'e karşı ileri sürünce Elif "şerhten haberim yoktu" savunmasında bulunur. Hangisi doğrudur?
    siklar:
      - "Elif kaydı fiilen görmediği için iyiniyetlidir; şerh ona karşı ileri sürülemez."
      - "Kimse tapu sicilindeki bir kaydı bilmediğini ileri süremeyeceğinden Elif'in savunması dinlenmez."
      - "Satıcı şerhi Elif'e bildirmediyse şerh Elif'e karşı hükümsüzdür."
      - "Şerh ancak tapu memuru Elif'e sözlü olarak bildirmişse ileri sürülebilir."
    dogru: 1
    aciklama: |
      TMK m. 1020/3'e göre kimse tapu sicilindeki bir kaydı bilmediğini ileri süremez. Şerh verilen kira hakkı, taşınmaz üzerinde sonradan hak kazanan Elif'e karşı ileri sürülebilir (TMK m. 1009/2). Kaydı incelemeyen alıcı durumun gerektirdiği özeni de göstermemiştir (TMK m. 3/2).

  - soru: |
      TMK m. 1007'deki Devletin sorumluluğunun niteliği hakkında Yargıtay'ın yerleşik görüşüne göre hangisi doğrudur?
    siklar:
      - "Kusur sorumluluğudur; tapu memurunun kusuru ispatlanmalıdır."
      - "Kusursuz sorumluluktur; memurun kusuru aranmaz, yalnız Devletin görevliye rücuunda önem taşır."
      - "Fer'i sorumluluktur; zarar gören önce yolsuz tescilden yararlanan kişiden tahsil yolunu tüketmelidir."
      - "Hakkaniyet sorumluluğudur; hâkim dilerse tazminata hükmeder."
    dogru: 1
    aciklama: |
      Yargıtay, Devletin sorumluluğunu kusursuz (tehlike) sorumluluğu ve asli bir sorumluluk olarak kabul eder. Hukuka aykırı sicil işlemi, zarar ve uygun illiyet bağı yeterlidir. Kusur, Devletin kusurlu görevliye rücuunda önem taşır (TMK m. 1007/2). Zarar gören doğrudan Devlete başvurabilir.

  - soru: |
      Tapu memuru Okan'ın dikkatsizliği yüzünden sahte kimlik kullanan biri Ayla'nın taşınmazını satmış, taşınmaz iyiniyetli bir üçüncü kişiye geçmiştir. Ayla doğrudan Okan aleyhine tazminat davası açmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Açabilir; çünkü zarara doğrudan Okan sebep olmuştur."
      - "Açamaz; dava Devlete, yani Hazine'ye karşı açılır ve Devlet kusurlu görevliye rücu eder."
      - "Ancak Okan ceza mahkemesinde mahkûm olursa açabilir."
      - "Davayı Okan ile tapu müdürlüğüne birlikte açmak zorundadır."
    dogru: 1
    aciklama: |
      Kamu görevlilerinin yetkilerini kullanırken işledikleri kusurlardan doğan tazminat davaları, kendilerine rücu edilmek kaydıyla ancak idare aleyhine açılabilir (AY m. 129/5). TMK m. 1007 de sorumluluğu Devlete yükler ve kusurlu görevliye yalnız Devletin rücu edeceğini söyler. Tapu müdürlüğünün ayrı bir tüzel kişiliği yoktur.

  - soru: |
      TMK m. 1007'ye dayanan tazminat davası hangi yer mahkemesinde görülür?
    siklar:
      - "Davacının yerleşim yeri mahkemesinde"
      - "Hazine'nin merkezinin bulunduğu Ankara'da"
      - "Tapu sicilinin bulunduğu yer mahkemesinde; Yargıtay bunu kesin yetki sayar"
      - "Zarara yol açan sahtecinin yerleşim yeri mahkemesinde"
    dogru: 2
    aciklama: |
      TMK m. 1007/3'e göre Devletin sorumluluğuna ilişkin davalar tapu sicilinin bulunduğu yer mahkemesinde görülür. Yargıtay bu kuralı kesin yetki olarak uygular. Bu yüzden başka bir yerde açılan davada mahkeme yetkisizliği kendiliğinden gözetir.

  - soru: |
      Yargıtay Hukuk Genel Kurulunun benimsediği görüşe göre TMK m. 1007'ye dayanan tazminat davası hangi zamanaşımına tabidir?
    siklar:
      - "Öğrenmeden itibaren iki yıl, her hâlde fiilden itibaren on yıllık haksız fiil zamanaşımına"
      - "On yıllık genel zamanaşımına; süre, zararın doğduğu kesinleşme tarihinden işler"
      - "Bir yıllık hak düşürücü süreye"
      - "Hiçbir zamanaşımına tabi değildir"
    dogru: 1
    aciklama: |
      Hukuk Genel Kurulu'na göre TMK m. 1007'deki sorumluluk objektif-kusursuz bir sorumluluktur ve haksız fiil sorumluluğu değildir. Kanunda özel bir süre de yoktur. Bu yüzden on yıllık genel zamanaşımı (TBK m. 146) uygulanır. Süre, zararın doğduğu, tapu kaydına ilişkin kararın kesinleştiği tarihten işler. TBK m. 72'nin uygulanması gerektiğini savunan görüş azınlıkta kalmıştır.

  - soru: |
      2644 sayılı Kanunun ek 2. maddesine göre, Devletin ödediği tazminat için **ihmali bulunan** tapu personeline karşı rücu istemi hangi sürelerde zamanaşımına uğrar?
    siklar:
      - "Ödeme tarihinden itibaren iki yıl ve her hâlde zarara yol açan işlemin gerçekleştirildiği tarihten itibaren on yıl"
      - "Ödeme tarihinden itibaren bir yıl ve her hâlde beş yıl"
      - "Zararın öğrenilmesinden itibaren on yıl"
      - "Rücu istemi zamanaşımına tabi değildir"
    dogru: 0
    aciklama: |
      2644 sayılı Kanunun ek 2. maddesine göre tapu ve kadastro işlemleriyle ilgili olarak Devletin kusursuz sorumluluğu sebebiyle yapılan ödemeler dolayısıyla ihmali bulunan personele karşı rücu istemi, ödeme tarihinden itibaren iki yıl ve her hâlde zarara yol açan işlemin gerçekleştirildiği tarihten itibaren on yıl geçmekle zamanaşımına uğrar. Ağır kusurlu personel için TBK m. 73 saklıdır.

  - soru: |
      Sahteciler, Melek adına sahte nüfus cüzdanı çıkarıp noterde satış vekâletnamesi düzenletmiş ve taşınmazı satmıştır. Taşınmaz iyiniyetli Okay'a geçtiği için Melek tapu iptali davasını kaybetmiştir. Melek'in TMK m. 1007 davasında Hazine, "zarara noter ve sahteciler yol açtı, illiyet bağı kesildi" diye savunmaktadır. Yargıtay Hukuk Genel Kurulunun yaklaşımına göre hangisi doğrudur?
    siklar:
      - "Üçüncü kişilerin her kusuru illiyet bağını keser; Hazine sorumlu değildir."
      - "İlliyet bağının kesildiğini Hazine ispatlamalıdır; bu iddia dar yorumlanır ve noterin ve sahtecilerin kusuru tek başına uygun illiyet bağını kesmez."
      - "Noter de kamu görevi yaptığı için dava yalnız noterliğe karşı açılabilir."
      - "Melek önce sahtecilerden tahsil yolunu tüketmeden dava açamaz."
    dogru: 1
    aciklama: |
      Hukuk Genel Kurulu'na göre illiyet bağı mücbir sebep, zarar görenin ya da üçüncü kişinin ağır kusuruyla kesilebilir. Ancak bunu Hazine ispatlamalıdır ve iddia dar yorumlanır. Sahte vekâletname olayında noterin ve sahtecilerin kusuru, tapudaki işlem ile zarar arasındaki uygun illiyet bağını kesmez. Devletin sorumluluğu asli olduğundan önce sahtecilere gitme zorunluluğu da yoktur (TMK m. 1007).

  - soru: |
      1980'de kadastroyla Cem adına tescil edilen bir taşınmazın kıyı kenar çizgisi içinde kaldığı sonradan anlaşılmış, Hazine'nin açtığı dava sonucunda tapu kaydı iptal edilmiştir. Kayıtta bu konuda daha önce hiçbir şerh ya da beyan yoktur. Hazine "kıyılar özel mülkiyete konu olamaz, tazminat ödenmez" savunmasında bulunur. Hangisi doğrudur?
    siklar:
      - "Savunma yerindedir; kamu malının tapusu iptal edilince tazminat istenemez."
      - "Kişi adına tutulamayacak kaydı Devlet oluşturmuş ve yıllarca tutmuştur; Cem'in zararı TMK m. 1007 kapsamındadır."
      - "Cem yalnız kamulaştırma bedeli isteyebilir ve bunun için idari yargıya gitmelidir."
      - "Cem yalnız tapu harcının iadesini isteyebilir."
    dogru: 1
    aciklama: |
      Kıyılar Devletin hüküm ve tasarrufu altındadır (AY m. 43). Bu yüzden kıyıda kalan bir yerin kişi adına tescili hatalıdır. Ancak bu kaydı kadastroyla oluşturan ve tutan Devlettir. Yargıtay'a göre kadastro işlemleri de tapu sicilinin tutulması kapsamındadır ve tapusu bu sebeple iptal edilen malikin zararı TMK m. 1007'ye göre adli yargıda Hazine'den istenir.

  - soru: |
      TMK m. 1019'a göre tapu memurunun, ilgililerin bilgisi dışında yaptığı işlemler hakkında hangisi doğrudur?
    siklar:
      - "Bildirim zorunlu değildir; ilgililer sicili kendileri izlemelidir."
      - "Tapu memuru bu işlemleri ilgililere tebliğ etmekle yükümlüdür; itiraz süresi tebliğ tarihinden işler."
      - "İtiraz süresi her durumda işlemin yevmiye tarihinden işler."
      - "Tebliğ yalnız malik önceden yazılı olarak istemişse yapılır."
    dogru: 1
    aciklama: |
      TMK m. 1019/1'e göre tapu memuru, ilgililerin bilgisi dışında yaptığı işlemleri onlara tebliğ etmekle yükümlüdür. TMK m. 1019/2'ye göre ilgililerin itiraz süresi, kendilerine yapılan tebliğ tarihinden işlemeye başlar.

olaylar:
  - olay: |
      Zeynep, Bodrum'da kayıtlı bir arsanın malikidir. Mart 2022'de Zeynep'in kimlik bilgilerini ele geçiren bir çete, Zeynep'e benzeyen bir kadını kullanarak onun adına yeni bir nüfus cüzdanı çıkarır. Aynı gün bu cüzdanla bir noterlikte çete üyesi Tarık'a satış yetkisi veren bir vekâletname düzenletilir. Ertesi gün Tarık, Bodrum Tapu Müdürlüğünde arsayı piyasa değerinin yarısı kadar bir bedelle çete üyesi Levent'e satar. Tapu memuru Okan, arşivdeki fotoğrafı ve imza örneğini karşılaştırmadan işlemi yapar. Levent iki hafta sonra arsayı gerçek değeriyle, durumdan habersiz olan Gizem'e satar.

      Zeynep'in açtığı tapu iptali ve tescil davasında mahkeme, Gizem'in iyiniyetli olduğunu ve TMK m. 1023 uyarınca korunması gerektiğini kabul ederek davayı reddeder. Karar 10.02.2025'te kesinleşir. Çete üyeleri sahtecilik ve dolandırıcılıktan mahkûm olur, ama haczedilebilir malları yoktur.

      Zeynep 15.09.2025'te, oturduğu İstanbul'daki asliye hukuk mahkemesinde Hazine'ye karşı tazminat davası açar ve tapu memuru Okan'ı da davalı gösterir. Hazine şunları savunur: (a) mahkeme yetkisizdir; (b) zarara noter ve sahteciler yol açmıştır, illiyet bağı kesilmiştir; (c) tapu memurunun kusuru yoktur; (d) Zeynep önce sahtecilerden tahsil yoluna gitmelidir.

      1. Zeynep'in istemi hangi hükme dayanır ve bu sorumluluğun niteliği nedir?
      2. Okan'a karşı açılan davayı ve Hazine'nin (a)-(d) savunmalarını değerlendiriniz.
      3. Tazminat neye göre belirlenir? Dava süresinde açılmış mıdır?
      4. Hazine ödeme yaparsa Okan'a başvurabilir mi?
    olcut:
      - {tespit: "Gerçek malikin, iyiniyetli üçüncü kişinin korunması sonucu hakkını yitirmesi; istemin TMK m. 1007'ye dayanması ve sorumluluğun kusursuz, asli niteliği", puan: 20, madde: "TMK m. 1007"}
      - {tespit: "Tapu memuruna doğrudan dava açılamaması; davalının Hazine olması", puan: 10, madde: "AY m. 129"}
      - {tespit: "Tapu sicilinin bulunduğu Bodrum mahkemesinin kesin yetkili olması; yetki savunmasının yerinde olması", puan: 10, madde: "TMK m. 1007"}
      - {tespit: "İlliyet bağının kesilmesinin dar yorumlanması, ispatın Hazine'de olması; noter ve sahtecilerin kusurunun uygun illiyet bağını kesmemesi", puan: 20, madde: "TMK m. 1007"}
      - {tespit: "Kusur yokluğu ve önce sahtecilere başvurma savunmalarının reddi", puan: 10, madde: "TMK m. 1007"}
      - {tespit: "Gerçek zarar ilkesi: arsanın, zararın doğduğu kesinleşme tarihindeki değeri ve faiz", puan: 10, madde: "TMK m. 1007"}
      - {tespit: "Davanın süresinde olması: genel on yıllık süre, karşı görüşte de sonucun değişmemesi", puan: 10, madde: "TBK m. 146"}
      - {tespit: "Kusurlu görevliye rücu ve süreleri; ağır kusurda TBK m. 73", puan: 10, madde: "2644 sayılı Kanun, ek 2. madde"}
    cozum: |
      **Nitelendirme:** Arsa, sahte kimlik ve bu kimlikle alınan vekâletname kullanılarak satılmıştır. Levent adına yapılan tescil hukuki sebepten yoksun, yani yolsuzdur. Ancak arsa iyiniyetli Gizem'e geçmiş, mahkeme Gizem'in kazanımını TMK m. 1023 uyarınca korumuş ve karar kesinleşmiştir. Zeynep mülkiyetini sicilin hukuka aykırı tutulması yüzünden kesin olarak yitirmiştir. İstemi TMK m. 1007'ye dayanır.

      **Hukuki sorunlar:** Sorumluluğun niteliği ve tarafları; yetki; illiyet bağı, kusur ve "önce sahteciye git" savunmaları; tazminatın kapsamı ve zamanaşımı; rücu.

      **İlgili hükümler:** TMK m. 1007, 1015, 1023; AY m. 129/5; TBK m. 146, 72, 73; 2644 sayılı Kanunun ek 2. maddesi.

      **Değerlendirme:**
      - *Niteliği:* Devletin sorumluluğu kusursuz ve asli bir sorumluluktur. Tapu memuru, işlem yapan kişinin sicilde hak sahibi görünen kişinin temsilcisi olduğunu denetlemekle yükümlüdür (TMK m. 1015/2). Sahte kimliğe ve vekâletnameye dayanan bir devri tescil etmek, sicilin hukuka aykırı tutulmasıdır. Zeynep'in zararı bu işlemden doğmuştur.
      - *Okan'a karşı dava:* Kamu görevlisinin yetkisini kullanırken işlediği kusurdan doğan tazminat davası ancak idareye karşı açılabilir (AY m. 129/5). TMK m. 1007/2 de görevliye yalnız Devletin rücu edeceğini söyler. Okan'a karşı dava husumet yokluğundan reddedilmelidir. Davalı, Devleti temsilen Hazine'dir.
      - *(a) Yetki:* Dava tapu sicilinin bulunduğu yer mahkemesinde görülür (TMK m. 1007/3) ve Yargıtay bunu kesin yetki sayar. Arsa Bodrum'da kayıtlı olduğundan İstanbul'daki mahkeme yetkisizlik kararı vermelidir. Bu savunma yerindedir.
      - *(b) İlliyet bağı:* İlliyet bağını ancak mücbir sebep ya da zarar görenin veya üçüncü kişinin ağır kusuru keser. Bunu Hazine ispatlamalıdır ve iddia dar yorumlanır. Hukuk Genel Kurulu'na göre sahte nüfus cüzdanıyla noterde vekâletname düzenleten sahtecilerin ve noterin kusuru, tapudaki işlem ile zarar arasındaki uygun illiyet bağını kesmez. Olayda kimliğin ve vekâletnamenin aynı gün alınması ve ertesi gün piyasa değerinin yarısına satış yapılması açık şüphe işaretleridir. Savunma yerinde değildir.
      - *(c) Kusur yokluğu:* Kusur Devletin sorumluluğunun şartı değildir, yalnız rücuda önem taşır. Kaldı ki Okan'ın fotoğraf ve imzayı karşılaştırmaması bir ihmaldir.
      - *(d) Önce sahtecilere başvurma:* Sorumluluk asli ve doğrudandır. Zeynep sahtecilere haksız fiil hükümlerine göre de başvurabilir, ama bu bir ön şart değildir.
      - *Tazminat:* Amaç gerçek zararın giderilmesidir. Zarar, kaydın düzeltilmesi imkânının ortadan kalktığı 10.02.2025'te, yani ret kararının kesinleşmesiyle doğmuştur. Yargıtay'ın güncel uygulamasına göre arsanın bu tarihteki gerçek değeri emsal satışlarla belirlenir ve faiz bu tarihten işletilir.
      - *Süre:* Hukuk Genel Kurulu on yıllık genel süreyi (TBK m. 146) uygular. Dava kesinleşmeden yedi ay sonra açıldığı için süresindedir. Haksız fiil zamanaşımını (TBK m. 72) uygulayan görüşe göre de sonuç değişmez. İki yıllık süre en erken zararın doğduğu kesinleşmeden işler, on yıllık üst süre de 2022'deki işlemden bu yana dolmamıştır.
      - *Rücu:* Okan kusurlu olduğu için Devlet ona rücu edebilir (TMK m. 1007/2). Kusuru ihmal düzeyindeyse rücu istemi ödemeden itibaren iki yıl ve her hâlde Mart 2022'deki işlemden itibaren on yıl içinde ileri sürülmelidir (2644 sayılı Kanunun ek 2. maddesi). Kusuru ağırsa TBK m. 73 uygulanır.

      **Sonuç:**
      - Zeynep zararını TMK m. 1007'ye göre Hazine'den isteyebilir. Okan'a karşı dava husumetten reddedilir.
      - Bodrum mahkemesi kesin yetkili olduğundan İstanbul'daki mahkeme yetkisizlik kararı verir.
      - Hazine'nin illiyet, kusur ve "önce sahteciye git" savunmaları reddedilir.
      - Tazminat arsanın kesinleşme tarihindeki gerçek değeridir. Dava süresindedir.
      - Hazine ödeme yaparsa Okan'a rücu edebilir.

  - olay: |
      1978'de yapılan arazi kadastrosunda Milas'taki bir zeytinlik, tarla vasfıyla Hüseyin adına tescil edilir. 2009'da yapılan orman kadastrosundan sonra tapu kaydının beyanlar hanesine "orman sınırları içindedir" kaydı düşülür. Hüseyin 2017'de ölür ve taşınmaz oğlu Kemal ile kızı Nazlı'ya 1/2'şer payla intikal eder. Aynı yıl Kemal, Nazlı'nın payını, kayıttaki orman kaydını görerek ve bu nedenle değerinin çok altında bir bedelle satın alır.

      Açılan bir dava sonucunda taşınmazın orman olduğu belirlenir. Tapu kaydı iptal edilir ve taşınmaz orman vasfıyla Hazine adına tescil edilir. Karar 06.03.2024'te kesinleşir. Kemal 12.11.2024'te Milas'taki asliye hukuk mahkemesinde, Hazine'ye ve Orman Bölge Müdürlüğüne karşı, taşınmazın tamamının değeri için TMK m. 1007'ye dayanarak dava açar.

      Hazine şunları savunur: (a) ormanlar özel mülkiyete konu olamayacağından iptal edilen bir tapu için tazminat ödenmez; (b) hata kadastro ekibinindir, kadastro işlemleri "tapu sicilinin tutulması" sayılmaz; (c) Kemal orman kaydını bildiği için hiçbir pay bakımından tazminat isteyemez.

      1. Kemal'in istemini davalılar ve yetki bakımından değerlendiriniz.
      2. Hazine'nin (a) ve (b) savunmalarını değerlendiriniz.
      3. (c) savunması karşısında Kemal hangi pay için tazminat alabilir? Tazminat nasıl hesaplanır?
    olcut:
      - {tespit: "Özel mülkiyete konu olamayan yerin kişi adına tescilinin hatalı olduğu, ama bu kaydı oluşturan ve tutan Devletin TMK m. 1007'ye göre sorumlu olduğu; (a) savunmasının reddi", puan: 20, madde: "TMK m. 1007"}
      - {tespit: "Kadastro işlemlerinin de tapu sicilinin tutulması kapsamında olduğu; (b) savunmasının reddi", puan: 15, madde: "TMK m. 1007"}
      - {tespit: "Davalının Hazine olduğu, Orman Bölge Müdürlüğüne husumet düşmediği; Milas mahkemesinin kesin yetkili olduğu", puan: 15, madde: "TMK m. 1007"}
      - {tespit: "Mirasla gelen 1/2 pay için tazminat istenebileceği", puan: 15, madde: "TMK m. 1007"}
      - {tespit: "Orman kaydını görerek satın alınan pay için kimsenin kaydı bilmediğini ileri sürememesi ve özen eksikliği nedeniyle tazminat istenemeyeceği; karşı görüş", puan: 20, madde: "TMK m. 1020"}
      - {tespit: "Gerçek zarar ilkesi: tarım arazisinde net gelir yöntemi, kesinleşme tarihindeki değer ve bu tarihten faiz", puan: 15, madde: "TMK m. 1007"}
    cozum: |
      **Nitelendirme:** Taşınmaz 1978 kadastrosuyla Hüseyin adına tarla olarak tescil edilmiş, sonradan orman olduğu anlaşılınca kaydı iptal edilmiştir. Kemal mülkiyetini bu iptal yüzünden yitirmiş ve zararını TMK m. 1007'ye göre istemektedir. Kemal'in payının yarısı mirasla, yarısı orman kaydı sicildeyken yapılan satın almayla gelmiştir.

      **Hukuki sorunlar:** Davalı ve yetki; özel mülkiyete konu olamayan bir yerin kaydının iptalinde Devletin sorumluluğu; kadastro işlemlerinin kapsamı; mirasla gelen ve satın alınan payların durumu; tazminatın hesabı ve süre.

      **İlgili hükümler:** TMK m. 1007, 1012, 1020; TMK m. 3; TBK m. 52, 146.

      **Değerlendirme:**
      - *Davalılar ve yetki:* Sorumluluk Devlete aittir ve dava Hazine'ye karşı açılır. Uygulamada orman idaresine yöneltilen istem husumet yokluğundan reddedilir. Dava, tapu sicilinin bulunduğu Milas'ta açılmıştır (TMK m. 1007/3). Bu kesin yetki kuralına uygundur.
      - *(a) "Orman özel mülkiyete konu olamaz":* Ormanın kişi adına tescili hatalıdır ve kaydın iptali doğrudur. Ancak bu kaydı oluşturan ve yıllarca tutan Devlettir. Yargıtay'a göre Devletin verdiği bir tapunun karşılık ödenmeden iptali hukuki güvenlik ve hukuk devleti ilkesiyle bağdaşmaz. Bu yüzden zarar TMK m. 1007 kapsamındadır. Savunma yerinde değildir.
      - *(b) Kadastro işlemleri:* Kütük kadastroyla oluşur. Kadastro ve tapu işlemleri bir bütündür. Yargıtay Hukuk Genel Kurulu'na göre kadastro görevlilerinin gerçek duruma uymayan kayıtlar düzenlemesi ve taşınmazın niteliğinde yanlışlık yapması da Devletin sorumluluğu kapsamındadır. Savunma yerinde değildir.
      - *(c) Mirasla gelen pay:* Hüseyin adına kayıt 1978'de, hiçbir kısıtlama kaydı yokken oluşmuştur. Kemal bu payı mirasla, kendi tercihine dayanan bir satın alma olmadan edinmiştir. Hukuk Genel Kurulu benzer bir olayda mirasla gelen pay için tazminatı kabul etmiştir. Kemal bu pay için tazminat alabilir.
      - *(c) Satın alınan pay:* Kemal bu payı orman kaydı sicilde açıkça görünürken, kaydı görerek ve düşük bir bedelle almıştır. Kimse tapu sicilindeki bir kaydı bilmediğini ileri süremez (TMK m. 1020/3). Yargıtay, beyanlar hanesindeki bu tür kamu hukuku kısıtlamalarına da bu kuralı uygular (TMK m. 1012/2). Durumun gerektirdiği özeni göstermeyen iyiniyet iddiasında da bulunamaz (TMK m. 3/2). Yargıtay'a göre bu durumda zarar sicilin yanlış tutulmasından doğmuş sayılmaz ve illiyet bağı yoktur. Bu pay için tazminat istenemez. Hukuk Genel Kurulu'ndaki karşı görüş, zarar görenin kusuru ağır değilse yalnız TBK m. 52'ye göre indirim yapılmasını savunur. Ancak Kemal riski bilerek ve buna göre indirimli bir bedelle üstlenmiştir. Zarar görenin zarar doğuran duruma razı olması, TBK m. 52'de tazminatın kaldırılmasına bile imkân veren bir sebeptir.
      - *Hesap:* Amaç gerçek zarardır. Taşınmaz zeytinlik, yani tarım arazisidir. Yargıtay uygulamasına göre değeri net gelir yöntemiyle, iptal kararının kesinleştiği 06.03.2024 tarihine göre belirlenir ve faiz bu tarihten işletilir. Zamanaşımı sorulmamakla birlikte, Hukuk Genel Kurulu'nun uyguladığı on yıllık genel süre (TBK m. 146) kesinleşmeden itibaren dolmamıştır.

      **Sonuç:**
      - Davalı Hazine'dir; Orman Bölge Müdürlüğüne karşı dava husumetten reddedilir. Milas mahkemesi yetkilidir.
      - Hazine'nin (a) ve (b) savunmaları reddedilir.
      - Kemal, mirasla gelen 1/2 pay için taşınmazın kesinleşme tarihindeki net gelire göre belirlenen değerinin yarısını faiziyle alabilir.
      - Orman kaydını görerek satın aldığı 1/2 pay için Yargıtay uygulamasına göre tazminat alamaz.

  - olay: |
      Gökhan, Bursa'nın Nilüfer ilçesinde bir daireyi malik Sinan'dan piyasa değeriyle satın alır. Satıştan önce tapu kaydına bakmamıştır. Tapuda düzenlenen resmî senette dairenin X Bankası lehine ipotekli olduğu yazılıdır, ama Gökhan senedi okumadan imzalamıştır. Birkaç ay sonra Sinan kredi borcunu ödemez ve banka ipoteğin paraya çevrilmesi için takip başlatır.

      Gökhan ipoteğin dayanağı olan resmî senedi ve ipotek tutarını görmek için Nilüfer Tapu Müdürlüğüne başvurur. Tapu memuru "Bu belgeler banka ile eski malik arasındadır, size gösterilemez" diyerek başvuruyu reddeder.

      Gökhan şunları ileri sürer: (a) İpotekten haberi olmadığı için banka ipoteği kendisine karşı ileri süremez. (b) Satış sırasında tapu memuru ipoteği ayrıca anlatıp kendisini uyarmamıştır, bu yüzden zararını TMK m. 1007'ye göre Devlet ödemelidir.

      Öte yandan Gökhan'ın ortağı olduğu Y Ltd. Şti.'nin Mudanya'da birbirine bitişik olmayan iki tarlası vardır. Şirket bu iki tarlayı tek bir ipotekle bankaya güvence göstermek, ileride de tarlalardan birini satabilmek istemektedir. Şirketin ayrıca büyük kısmı Mudanya'da, küçük kısmı Nilüfer'de bulunan bir arazisi vardır. Bu arazi üzerinde komşu bir parsel lehine geçit irtifakı kurulacaktır.

      1. Tapu memurunun ret işlemini değerlendiriniz.
      2. Gökhan'ın (a) ve (b) iddialarını değerlendiriniz.
      3. Şirketin planları sicil kuralları bakımından nasıl gerçekleştirilebilir? İstemler hangi tapu idaresine yapılır?
    olcut:
      - {tespit: "Malikin ilgisinin açık olduğu; ilgili sayfanın ve dayanak belgelerin gösterilmesi gerektiği; ret işleminin hukuka aykırılığı", puan: 15, madde: "TMK m. 1020"}
      - {tespit: "Kimsenin sicildeki kaydı bilmediğini ileri sürememesi; ipoteğin devirle etkilenmeyip yeni malike karşı da ileri sürülmesi", puan: 20, madde: "TMK m. 1020"}
      - {tespit: "Özen göstermeyenin iyiniyet iddia edememesi; satıcıya karşı hakların saklı olması", puan: 10, madde: "TMK m. 3"}
      - {tespit: "Sicil doğru tutulduğu için hukuka aykırı sicil işlemi ve illiyet bağı bulunmaması; TMK m. 1007 isteminin reddi", puan: 20, madde: "TMK m. 1007"}
      - {tespit: "Bitişik olmayan tarlaların malikin istemiyle ortak sayfaya kaydı; ipoteğin hepsini bağlaması ve sayfadan çıkarılan tarlada saklı kalması", puan: 20, madde: "TMK m. 1000"}
      - {tespit: "Birden çok bölgedeki arazinin her bölgede kaydı; istemin Mudanya'ya yapılıp Nilüfer'e bildirilmesi; irtifakın iki taşınmazın sayfasına da yazılması", puan: 15, madde: "TMK m. 1005"}
    cozum: |
      **Nitelendirme:** Olayda üç sicil sorunu vardır: sicile erişim ve kaydın bilinmesi (açıklık), sicil doğru tutulduğu hâlde Devletin sorumluluğuna başvurma ve şirketin güvence planı bakımından ortak sayfa ile birden çok bölgede bulunan taşınmaz kuralları.

      **Hukuki sorunlar:** Memurun reddinin hukuka uygunluğu; Gökhan'ın ipoteği bilmediğini ileri sürüp süremeyeceği; TMK m. 1007'nin şartlarının oluşup oluşmadığı; ortak sayfa ve sicil bölgesi kuralları.

      **İlgili hükümler:** TMK m. 1020, 3, 888, 1007, 1000, 1005, 1018.

      **Değerlendirme:**
      - *1. Ret işlemi:* İlgisini inanılır kılan herkes, kütükteki ilgili sayfanın ve belgelerin tapu memuru önünde kendisine gösterilmesini ya da örneklerinin verilmesini isteyebilir (TMK m. 1020/2). Gökhan dairenin malikidir. Kendi taşınmazı üzerindeki ipoteğin dayanağı olan belgelerde ilgisi açıktır. Kanun "sayfa ve belgeler" dediği için ipoteğin dayanağı olan resmî senet de kapsamdadır. Memurun reddi hukuka aykırıdır.
      - *2(a) "Haberim yoktu":* Kimse tapu sicilindeki bir kaydı bilmediğini ileri süremez (TMK m. 1020/3). Durumun gereklerine göre beklenen özeni göstermeyen kişi iyiniyet iddiasında bulunamaz (TMK m. 3/2). Gökhan ne kaydı incelemiş ne de ipoteği açıkça gösteren resmî senedi okumuştur. İpotek ayni bir haktır. İpotekli taşınmazın devri güvencede bir değişiklik meydana getirmez (TMK m. 888/1). Banka ipoteği paraya çevirebilir. Gökhan'ın satıcı Sinan'a karşı borçlar hukukundan doğan hakları ise saklıdır.
      - *2(b) TMK m. 1007:* Devletin sorumluluğu, sicilin hukuka aykırı tutulmasından doğan zararlar içindir. Olayda ipotek usulüne uygun tescil edilmiştir ve resmî senette de yazılıdır. Sicil doğrudur. Gökhan'ın zararı kaydı ve senedi incelememesinden ve satıcının borcunu ödememesinden doğmuştur. Hukuka aykırı bir sicil işlemi ve bununla zarar arasında illiyet bağı yoktur. Ayrıca TMK m. 1020/3 karşısında Gökhan kaydı bilmediğini ileri süremez. Memurun satıştan sonra belgeleri göstermemesi hukuka aykırıdır, ama ipotekten doğan zararın sebebi değildir. İstem reddedilir.
      - *3. Ortak sayfa:* Aynı malike ait birden çok taşınmaz, sınırları bitişik olmasa bile malikin istemiyle ortak bir sayfaya kaydedilebilir (TMK m. 1000/5). Şirketin Mudanya'daki iki tarlası ortak sayfaya alınabilir. Bu sayfaya yapılan ipotek tescili iki tarlayı birden bağlar. Şirket ileride tarlalardan birini sayfadan çıkarırsa, o tarladaki ipotek saklı kalır. Tarlayı alacak kişi ipotekli bir tarla alır.
      - *3. Birden çok bölge:* Büyük kısmı Mudanya'da, küçük kısmı Nilüfer'de olan arazi, diğer sicile de kayıtlı olduğu belirtilerek her iki bölgenin siciline ayrı ayrı kaydedilir (TMK m. 1005/1). Geçit irtifakının tescil istemi büyük kısmın bulunduğu Mudanya'daki tapu idaresine yapılır. Yapılan tescil Nilüfer'deki tapu idaresine bildirilir (TMK m. 1005/2). İrtifak taşınmaz lehine kurulduğu için hem yüklü arazinin hem de yararlanan komşu parselin sayfasına kaydedilir (TMK m. 1018).

      **Sonuç:**
      - Memurun reddi hukuka aykırıdır. Gökhan malik olarak ilgili sayfa ve belgeleri görebilir.
      - Gökhan ipoteği bilmediğini ileri süremez. Banka ipoteği ona karşı da ileri sürer. Satıcıya karşı hakları saklıdır.
      - Sicil doğru tutulduğu için TMK m. 1007'ye dayanan istem reddedilir.
      - Şirket iki tarlayı ortak sayfaya kaydettirip tek ipotek kurdurabilir. Çıkarılan tarlada ipotek sürer.
      - Arazi iki bölgede kayıtlı olur. İrtifak istemi Mudanya'ya yapılır, tescil Nilüfer'e bildirilir.

kartlar:
  - on: "Tapu sicilinin unsurları nelerdir? (TMK m. 997)"
    arka: "Tapu kütüğü ve kat mülkiyeti kütüğü ile bunları tamamlayan yevmiye defteri, belgeler ve planlar."
  - on: "Tapu kütüğünün özel sütunlarına hangi haklar tescil edilir? (TMK m. 1000/3)"
    arka: "Mülkiyet; irtifaklar ve taşınmaz yükü; rehin hakları. Kişisel haklar şerh, eklentiler beyan olarak yazılır."
  - on: "Ortak sayfanın sonucu nedir? (TMK m. 1000/5)"
    arka: "Aynı malikin bitişik olmayan taşınmazları da malikin istemiyle tek sayfaya yazılabilir. Bu sayfadaki rehin hepsini bağlar; sayfadan çıkarılan taşınmazdaki haklar saklı kalır."
  - on: "Eklenti beyanı nasıl silinir?"
    arka: "Yalnız kütükte hak sahibi olarak görünenlerin rızasıyla (TMK m. 1000/4)."
  - on: "Tapu siciline taşınmaz olarak ne kaydedilir? (TMK m. 998)"
    arka: "Arazi, taşınmazlar üzerindeki bağımsız ve sürekli haklar ve kat mülkiyetine konu bağımsız bölümler."
  - on: "Bağımsız ve sürekli hakta süreklilik koşulu nedir?"
    arka: "Hakkın süresiz ya da en az otuz yıl süreli olması (TMK m. 998/3)."
  - on: "Kamunun yararlanmasına ayrılan taşınmazlar kaydedilir mi? (TMK m. 999)"
    arka: "Kural olarak hayır. Üzerlerinde tescili gerekli bir ayni hak kurulacaksa kaydedilir. Kayıtlı taşınmaz kayda tabi olmayana dönüşürse sicilden çıkarılır."
  - on: "Plan ile zemindeki sınır işaretleri çelişirse hangisi esastır?"
    arka: "Plandaki sınır (TMK m. 719/2). Yetkili makamlarca heyelan bölgesi olduğu belirlenen yerlerde bu kural uygulanmaz."
  - on: "Birden çok bölgede bulunan taşınmaz nasıl kaydedilir? (TMK m. 1005)"
    arka: "Her bölgenin siciline ayrı ayrı. İstem ve tescil büyük kısmın bulunduğu bölgede yapılır, diğer bölgelere bildirilir."
  - on: "Tapu sicilini kim görebilir? (TMK m. 1020/2)"
    arka: "İlgisini inanılır kılan herkes, ilgili sayfa ve belgeleri tapu memuru önünde görebilir ya da örnek alabilir. İspat gerekmez, malik izni aranmaz, salt merak yetmez."
  - on: "TMK m. 1020/3 ne der?"
    arka: "Kimse tapu sicilindeki bir kaydı bilmediğini ileri süremez. Kaydı görmemiş olmak mazeret değildir."
  - on: "TMK m. 1020/3 ile TMK m. 1023 arasındaki fark?"
    arka: "m. 1020/3 kaydı incelemeyenin 'bilmiyordum' savunmasını keser. m. 1023 sicile iyiniyetle güvenerek hak kazananı korur."
  - on: "TMK m. 1007'deki sorumluluğun niteliği?"
    arka: "Kusursuz (tehlike), asli ve doğrudan sorumluluk. Memurun kusuru aranmaz; yalnız rücuda önem taşır."
  - on: "TMK m. 1007'nin şartları nelerdir?"
    arka: "Tapu sicilinin tutulmasına ilişkin hukuka aykırı işlem (kadastro dahil), zarar ve uygun illiyet bağı."
  - on: "İlliyet bağını hangi sebepler keser?"
    arka: "Mücbir sebep, zarar görenin ağır kusuru, üçüncü kişinin ağır kusuru. Yargıtay dar yorumlar; ispat Hazine'dedir."
  - on: "Sahte vekâletnamede noterin kusuru Devleti kurtarır mı?"
    arka: "Hukuk Genel Kurulu'na göre hayır. Noterin ve sahtecilerin kusuru tapudaki işlem ile zarar arasındaki uygun illiyet bağını kesmez."
  - on: "Orman kaydını görerek pay satın alan tazminat isteyebilir mi?"
    arka: "Yargıtay'a göre hayır: TMK m. 1020/3 nedeniyle iyiniyetli değildir ve illiyet bağı yoktur. Mirasla gelen pay için ise tazminat kabul edilir."
  - on: "1007 davasında davalı kimdir? Tapu memuruna dava açılabilir mi?"
    arka: "Davalı Devlet adına Hazine'dir. Görevliye doğrudan dava açılamaz (AY m. 129/5); Devlet kusurlu görevliye rücu eder."
  - on: "1007 davasında yetkili mahkeme?"
    arka: "Tapu sicilinin bulunduğu yer mahkemesi (TMK m. 1007/3). Yargıtay bunu kesin yetki sayar."
  - on: "1007 davasında zamanaşımı nedir? (Yargıtay Hukuk Genel Kurulu)"
    arka: "On yıllık genel zamanaşımı (TBK m. 146). Süre, tapu kaydına ilişkin kararın kesinleşmesiyle, yani zararın doğduğu andan işler."
  - on: "Tazminat hangi tarihteki değere göre belirlenir?"
    arka: "Yargıtay'ın güncel uygulamasında kararın kesinleştiği tarihteki gerçek değer; faiz de bu tarihten işler. Arsada emsal, tarım arazisinde net gelir yöntemi."
  - on: "Devletin rücu hakkı hangi sürelere tabidir?"
    arka: "İhmali bulunan personele: ödemeden itibaren 2 yıl, her hâlde işlemden itibaren 10 yıl (2644 sayılı Kanunun ek 2. maddesi). Ağır kusurda TBK m. 73."
