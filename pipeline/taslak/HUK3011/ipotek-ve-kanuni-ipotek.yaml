    ozet: |
      Davalı, satın aldığı taşınmaz için bankadan konut kredisi kullanmış ve taşınmaz üzerine ipotek kurdurmuştu. Taşınmazı 2013'te davacıya sattı; resmî senette alıcının "ipoteğin bütün hukuki vecibelerini kabul ederek" takyidatlarla satışı kabul ettiği yazılıydı. Davalı krediyi ödemeyince banka hem davalı hem davacı hakkında ipoteğin paraya çevrilmesi yoluyla takip başlattı; davacı satışı önlemek için 94.483 TL ödedi ve davalıya karşı başlattığı takibe itiraz edilince itirazın iptali davası açtı. İlk derece mahkemesi davayı kabul etmiş, bölge adliye mahkemesi ise senetteki ibare nedeniyle alıcının ipotek borcundan sorumlu olduğunu kabul edip davayı reddetmişti; Özel Daire bozmuş, bölge adliye mahkemesi direnmiştir. Hukuk Genel Kurulu direnme kararını oy çokluğuyla bozmuştur. Gerekçeye göre devirle ipotek üçüncü kişi ipoteğine dönüşür; aksi kararlaştırılmadıkça kişisel borçlu sorumlu kalır, yeni malik yalnız taşınmazın cebri satışına katlanır (TMK m. 888/1). Senetteki ibare borcun şahsen üstlenildiğini göstermez; borcu ödeyen malik TMK m. 884 gereği kanuni halefiyetle alacaklının yerine geçerek kişisel borçluya başvurur. Karar ayrıca TMK m. 888/2 ve TMK m. 890'daki borç yüklenmede alacaklının rızasının aranmadığını ve ipotek takibinde asıl borçlu ile ipotek veren üçüncü kişi arasında zorunlu takip arkadaşlığı bulunduğunu belirtir.
  - id: "1084458500"
    ozet: |
      Davacı şirket, bir akaryakıt istasyonunun yapım işini yükleniciden alt yüklenici olarak üstlenmişti; hakedişler ödenmeyince iş geçici kabul aşamasında durdu. Davacı, 2008'de TMK m. 893/3 ve TMK m. 895'e dayanarak taşınmaz maliki, intifa hakkı sahibi ve yüklenici aleyhine yapı alacaklısı ipoteği tescili davası açtı; alacak, alt yüklenici ile yüklenici arasındaki davada ticaret mahkemesi kararıyla belirlenmişti. Dava sürerken taşınmaz ifraz edilmiş ve bir parsel iki kez üçüncü kişilere satılmıştı. İlk derece mahkemesi malikin sözleşme tarafı olmadığı ve alacağı kabul etmediği gerekçesiyle davayı reddetmiş, iki bozma üzerine ise iki parsel üzerine kanuni ipotek tesciline karar vermiştir. Yargıtay 6. Hukuk Dairesi, intifa hakkı sahibinin ihtarnamesini davacının en geç öğrendiği tarihi üç aylık sürenin başlangıcı sayıp davanın süre içinde açıldığını ve yasal koşulların oluştuğunu kabul etmiş, yalnız yargılama giderleri yönünden düzelterek oy birliğiyle onamıştır. Kararda aktarılan ve mahkemece uyulan ilk bozma kararına göre alt yüklenicinin hakkı yüklenicinin hakkından bağımsızdır, aynı taşınmaz üzerinde iki ayrı kanuni ipotek mümkündür ve dava taşınmaz malikine yöneltilir; malik dışındakilerin pasif husumeti yoktur. Üç aylık sürenin dava açmakla korunması tartışmalı bir noktadır; karar bunu somut olayda kabul etmiştir.
  - id: "1158427400"
    ozet: |
      Alacaklı şirket lehine, borçlu şirketin bonodan doğan borcunun teminatı olarak bir kişinin taşınmaz hissesi üzerinde 7.090.000 TL'lik ipotek kurulmuştu. Hisse, takipten önce ipotekle yükümlü olarak başka bir şirkete satıldı. Alacaklı ipoteğin paraya çevrilmesi yoluyla ilamsız takip başlatıp eski maliki ipotek veren sıfatıyla borçlu gösterdi; borçlular itiraz edince itirazın kaldırılmasını istedi. İcra mahkemesi istemi reddetmiş, bölge adliye mahkemesi ise 7.090.000 TL için itirazın kaldırılmasına karar vermişti. Yargıtay 12. Hukuk Dairesi alacaklının temyizini reddetmiş, eski malikin temyizini kabul ederek bölge adliye mahkemesi kararını oy çokluğuyla bozmuştur. Gerekçeye göre İİK m. 149 ve TMK m. 887 uyarınca asıl borçlu ile ipotek veren üçüncü kişi arasında zorunlu takip arkadaşlığı vardır; ancak ipotekli hissesini takipten önce devreden kişinin takipte borçlu sıfatı kalmaz ve ona karşı takip yapılamaz. Karar, ödeme isteminin kime yöneltileceği ve devir sonrası takip tarafı sorunu bakımından önemlidir.

sozluk:
  - terim: İpotek
    tanim: "Bir alacağı güvence altına almak için taşınmazın rehin edilmesi. Borç ödenmezse alacaklı taşınmazın paraya çevrilmesini isteyebilir."
  - terim: Üçüncü kişi ipoteği
    tanim: "Taşınmazı borçluya ait olmayan kişinin başkasının borcu için kurduğu ipotek. Malik yalnız taşınmazıyla sorumludur (TMK m. 881/2)."
  - terim: Ana para ipoteği
    tanim: "Doğmuş ve belirli bir alacak için kurulan ipotek. Güvencenin faiz ve giderlere uzanması TMK m. 875'e göre belirlenir."
  - terim: Üst sınır (limit) ipoteği
    tanim: "Miktarı belli olmayan veya değişebilen alacak için taşınmazın güvence altına alacağı üst sınırın belirtildiği ipotek (TMK m. 851/1). Tescilden sonra alacak miktarındaki değişmelere bakılmaksızın sırasını korur (TMK m. 882/1)."
  - terim: İpotek belgesi
    tanim: "Tapu memurunun istem üzerine alacaklıya verdiği, yalnız tescilin yapıldığını ispata yarayan belge. Kıymetli evrak değildir (TMK m. 882/2)."
  - terim: Süreli ipotek
    tanim: "Belirli bir süre için kurulan ipotek. Süre bitince otuz gün içinde İİK m. 150/c şerhi konulmazsa malikin talebiyle tapu müdürlüğünce terkin edilir (TMK m. 883/2)."
  - terim: Borçtan şahsen sorumlu olmayan malik
    tanim: "İpotekli taşınmazın maliki olduğu hâlde borçlu olmayan kişi. Üçüncü kişi ipotekçisi veya borcu yüklenmeyen yeni malik olabilir."
  - terim: Kanuni halefiyet
    tanim: "Borcu ödeyen malikin kanun gereği, ayrıca devir sözleşmesi olmadan alacaklının yerine geçmesi (TMK m. 884/2; TBK m. 127/1)."
  - terim: İpotekten kurtarma
    tanim: "Değerini aşan borçla ipotekli taşınmazı edinen ve borçtan sorumlu olmayan kişinin, takipten önce altı ay önce yazılı ihbarla satın alma bedelini ödeyerek taşınmazı kurtarması (TMK m. 885)."
  - terim: Saklı tutma bildirimi
    tanim: "Yeni malik borcu yüklenince alacaklının, başvurma hakkını sakladığını bir yıl içinde yazılı olarak önceki borçluya bildirmesi. Bildirmezse önceki borçlu kurtulur (TMK m. 888/2)."
  - terim: Kanuni ipotek
    tanim: "Kanundan doğan ipotek. Tescile tabi olmayanlar (TMK m. 892) ve tescile tabi olanlar (TMK m. 893) vardır."
  - terim: Yapı alacaklısı
    tanim: "Alt yüklenici veya zanaatkâr olarak emek sarf eden ve malik veya yükleniciden alacaklı olan kişi. Kanuni ipotek tescilini isteyebilir (TMK m. 893/1-3, TMK m. 895)."
  - terim: Zorunlu takip arkadaşlığı
    tanim: "İpoteğin paraya çevrilmesi takibinde asıl borçlu ile ipotek veren üçüncü kişinin birlikte taraf olması zorunluluğu (İİK m. 149; TMK m. 887)."

sorular:
  - soru: |
      Ayşe, kardeşi Mehmet'in banka kredisini güvence altına almak için kendi evini banka lehine ipotek ettirmiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İpotek geçersizdir, çünkü ipoteğe konu taşınmaz borçlunun mülkiyetinde olmalıdır."
      - "İpotek geçerlidir; ipoteğe konu taşınmazın borçlunun mülkiyetinde bulunması gerekmez."
      - "İpotek geçerlidir; ama Ayşe, Mehmet'in borcunun tamamından kişisel olarak da sorumlu olur."
      - "İpotek yalnız Ayşe ile Mehmet birinci derece yakın olduğu için geçerlidir."
    dogru: 1
    aciklama: |
      TMK m. 881/2'ye göre ipoteğe konu olacak taşınmazın borçlunun mülkiyetinde bulunması gerekmez; üçüncü kişi ipoteği geçerlidir. Ayşe borçtan şahsen sorumlu değildir, yalnız taşınmazıyla sorumludur. Yakınlık bir geçerlilik şartı değildir.

  - soru: |
      X Ltd. Şti.'nin bankayla genel kredi sözleşmesine dayanan, kullanıma göre sürekli değişen borcu için 5.000.000 TL üst sınırlı ipotek tescil edilmiştir. Borç sonradan azalıp artmaktadır. İpoteğin sırası bakımından hangisi doğrudur?
    siklar:
      - "Her değişiklikte yeni tescil gerektiğinden banka sırasını kaybeder."
      - "Alacak miktarındaki her artış, ayrı bir sıra doğurur."
      - "İpotek ancak ana para ipoteğine çevrilirse sırasını korur."
      - "Alacak miktarında meydana gelen değişmelere bakılmaksızın banka tescil tarihindeki derecesini korur."
    dogru: 3
    aciklama: |
      TMK m. 882/1'e göre miktarı belirli olmayan veya değişebilen alacaklar da belli rehin derecesine yerleştirilir ve tescilden sonra alacak miktarındaki değişmelere bakılmaksızın sırasını korur. Güvence, tapudaki üst sınırla sınırlıdır (TMK m. 851/1). Ana para ipoteğine çevirme şartı yoktur.

  - soru: |
      Tapu memurunun ipotek tescilinden sonra alacaklıya verdiği ipotek belgesi hakkında hangisi doğrudur?
    siklar:
      - "Kıymetli evraktır; devri alacağı da devralana geçirir."
      - "Yalnız tescilin yapıldığını ispata yarar, kıymetli evrak niteliği taşımaz."
      - "İpoteğin kuruluşu için belgenin alacaklıya verilmesi şarttır."
      - "Belge, ipotekli borç senedi ile aynı hukuki niteliktedir."
    dogru: 1
    aciklama: |
      TMK m. 882/2'ye göre ipotek belgesi sadece tescilin yapıldığını ispata yarar ve kıymetli evrak niteliği taşımaz. İpotek tescille kurulur; belge kuruluş şartı değildir. Kıymetli evrak olan ipotekli borç senediyle karıştırılmamalıdır.

  - soru: |
      Ali konut kredisinin son taksitini ödemiş, ipotek süreli değildir. Banka, ipoteğin terkini için tapuya bir yazı göndermemektedir. Ali ne yapabilir?
    siklar:
      - "Hiçbir şey yapamaz; ipotek ancak bankanın isteğiyle terkin edilebilir."
      - "Tapu müdürlüğüne başvurup alacaklının beyanı olmaksızın kendiliğinden terkin ettirebilir."
      - "Malik olarak alacaklıdan ipoteği terkin ettirmesini isteyebilir; alacaklı kaçınırsa dava açabilir."
      - "Beş yıl bekler; ipotek bu sürenin sonunda kendiliğinden sona erer."
    dogru: 2
    aciklama: |
      TMK m. 883/1'e göre alacak sona erince ipotekli taşınmazın maliki alacaklıdan ipoteği terkin ettirmesini isteyebilir. Terkin için kural olarak kaydın hak sağladığı kişinin yazılı beyanı gerekir (TMK m. 1014); alacaklı vermezse dava yolu açıktır. Alacaklı beyanı olmadan tapudan terkin yolu TMK m. 883/2'deki süreli ipotek için öngörülmüştür, süresiz ipotek için değil. Bekleme süresi diye bir kural yoktur.

  - soru: |
      Banka lehine 31 Aralık 2025'e kadar süreli bir ipotek kurulmuştur. Sürenin bitiminden itibaren otuz gün geçmiştir ve bu süre içinde ipotekli taşınmaz üzerinde İİK m. 150/c şerhi konulmamıştır. Malik tapu müdürlüğüne başvurmuştur. Sonuç ne olur?
    siklar:
      - "Müdürlük, bankanın yazılı terkin beyanı olmadıkça işlem yapamaz."
      - "İpotek yalnız mahkeme kararıyla terkin edilebilir."
      - "İpotek malikin talebiyle tapu müdürlüğünce terkin edilir."
      - "İpotek süre bitiminde kendiliğinden kalkar; malikin başvurmasına gerek yoktur."
    dogru: 2
    aciklama: |
      TMK m. 883/2'ye göre süreli ipotekte sürenin bitiminden itibaren otuz gün içinde İİK m. 150/c şerhinin konulmaması hâlinde ipotek, malikin talebiyle tapu müdürlüğünce terkin edilir. Alacaklının ayrıca terkin beyanı gerekmez ve mahkeme kararı şart değildir. Terkin kendiliğinden olmaz, malikin talebi gerekir.

  - soru: |
      TMK m. 883'e süreli ipotekte tapuca terkini düzenleyen ikinci fıkra hangi kanunla eklenmiş ve ne zaman yürürlüğe girmiştir?
    siklar:
      - "7099 sayılı Kanunla; 2018 yılında."
      - "7181 sayılı Kanunla; 1/1/2020 tarihinde."
      - "7292 sayılı Kanunla; 2021 yılında."
      - "Fıkra TMK'nın ilk metninde de yer almaktadır; sonradan eklenmemiştir."
    dogru: 1
    aciklama: |
      TMK m. 883'ün ikinci fıkrası, 4/7/2019 tarihli 7181 sayılı Kanunla eklenmiş ve 1/1/2020'de yürürlüğe girmiştir. Eskiden m. 883 yalnız birinci fıkradan ibaretti. 7099 sayılı Kanun ise 2644 sayılı Kanun m. 26'daki kredi sözleşmesine dayalı ipotek tescilini düzenleyen fıkrayı değiştirmiş, 7292 sayılı Kanun aynı maddeye tasarruf finansman şirketleri için yeni bir fıkra eklemiştir.

  - soru: |
      Bir banka, Selim'in kullandığı krediye karşılık gösterilen daire üzerinde ipotek tescili için taraflarca imzalanan kredi sözleşmesine dayanmak istemektedir; taraflar da bunu istemektedir. Hangisi doğrudur?
    siklar:
      - "Banka kredilerinde ipotek yalnız tapu görevlisi önünde düzenlenen ayrı bir resmî senetle kurulabilir."
      - "Kredi sözleşmesi imzalanmakla ipotek tapuya tescil edilmeden de doğar."
      - "Tarafların istemi hâlinde ipotek işlemi, imzalanan kredi sözleşmesine istinaden tapu müdürlüğünde tescil edilebilir."
      - "Kredi sözleşmesine dayalı tescil yalnız kamu kurumlarının kredilerinde mümkündür."
    dogru: 2
    aciklama: |
      2644 sayılı Kanun m. 26'ya göre kredi kuruluşları ve bankalar gibi sayılan kuruluşlarca açılmış veya açılacak kredilere karşılık teminat gösterilen taşınmazların ipotek işlemleri, tarafların istemi hâlinde, imzalanan kredi veya borç sözleşmesine istinaden tapu müdürlüklerinde tescil olunur. İpotek yine tescille kurulur. Kapsam kamu kurumlarıyla sınırlı değildir; bankalar da sayılmıştır.

  - soru: |
      Ali'nin banka kredisi için ipotekli dairesini Zeynep satın almış, borcu üstlenmemiştir. Ali ödemeyince Zeynep bankaya borcu ödemiş ve ipoteğin kaldırılmasını istemiştir. Zeynep'in Ali karşısındaki durumu nedir?
    siklar:
      - "Alacak ödeme ile sona erdiğinden Zeynep'in Ali'ye başvurma hakkı yoktur."
      - "Alacak kanun gereği Zeynep'e geçer; Zeynep ayrıca bir devir sözleşmesi yapmadan Ali'ye başvurabilir."
      - "Zeynep ödeme yaptığı için borcu üstlenmiş sayılır ve Ali borçtan kurtulur."
      - "Alacak ancak banka ile Zeynep arasında yazılı devir sözleşmesi yapılırsa Zeynep'e geçer."
    dogru: 1
    aciklama: |
      TMK m. 884/2'ye göre borcu ödeyen malike alacak geçer. Yargıtay Hukuk Genel Kurulu bunu kanunla düzenlenmiş halefiyet hâllerinden sayar ve ayrıca bir işlem aranmadığını belirtir; genel kural TBK m. 127/1'dedir. Ödeme, borcun şahsen üstlenildiği anlamına gelmez.

  - soru: |
      Mehmet'in değeri 2.000.000 TL olan arsası, Ayşe'nin 3.000.000 TL'lik borcu için ipoteklidir. Arsayı 2.000.000 TL'ye satın alan Can borçtan şahsen sorumlu değildir ve henüz icra takibi başlamamıştır. Can'ın ipotekten kurtulması bakımından hangisi doğrudur?
    siklar:
      - "Can arsayı ancak borcun tamamı olan 3.000.000 TL'yi ödeyerek ipotekten kurtarabilir."
      - "Can, alacaklılara altı ay önce yazılı ihbarda bulunarak satın alma bedeli olan 2.000.000 TL'yi ödeyip arsayı ipotekten kurtarabilir."
      - "Can ipotekten kurtarma hakkını ihbarsız, doğrudan tapu müdürlüğüne başvurarak kullanabilir."
      - "Kurtarma yalnız alacaklıların tamamının yazılı onayıyla mümkündür."
    dogru: 1
    aciklama: |
      TMK m. 885/1'e göre değerini aşan borç için ipotekli taşınmazı edinen ve borçtan şahsen sorumlu olmayan kişi, icra takibine başlanmadan önce satın alma bedelini ödeyerek taşınmazı ipotekten kurtarabilir. Hak, alacaklılara altı ay önce yapılacak yazılı ihbarla kullanılır (TMK m. 885/2). Alacaklıların onayı aranmaz; alacaklılar yalnız bir ay içinde açık artırma isteyebilir (TMK m. 886). Borcun tamamının ödenmesi TMK m. 884'teki yoldur ve tek yol değildir.

  - soru: |
      Can, ipotekten kurtarma ihbarını yapmış; alacaklı banka ihbarın tebliğinden itibaren bir ay içinde giderleri peşin ödeyerek açık artırma istemiştir. Açık artırmada elde edilen miktar, Can'ın ödemeyi önerdiği bedelden fazla çıkmıştır. Açık artırma giderlerini kim yüklenir?
    siklar:
      - "Açık artırmayı isteyen banka."
      - "Giderler alacaklılar arasında eşit paylaştırılır."
      - "Açık artırmayı yapan icra dairesi kendi bütçesinden karşılar."
      - "Taşınmazın maliki Can."
    dogru: 3
    aciklama: |
      TMK m. 886/3'e göre artırma bedelinin fazla olduğu hâllerde açık artırma giderleri malike, aksi hâlde açık artırmayı isteyen alacaklıya aittir. Artırmada elde edilen fazla miktar ipotekten kurtarma bedeli sayılır. Burada artırma bedeli fazla çıktığı için gider Can'ındır.

  - soru: |
      Aşağıdaki eşleştirmelerden hangisi doğrudur?
    siklar:
      - "İpotekten kurtarma ihbarı altı ay önce; alacaklıların açık artırma istemi ihbarın tebliğinden itibaren bir ay; önceki borçluyu kurtaran saklı tutma bildirimi bir yıl."
      - "İpotekten kurtarma ihbarı bir ay önce; açık artırma istemi altı ay; saklı tutma bildirimi bir yıl."
      - "İpotekten kurtarma ihbarı altı ay önce; açık artırma istemi bir yıl; saklı tutma bildirimi bir ay."
      - "İpotekten kurtarma ihbarı üç ay önce; açık artırma istemi bir ay; saklı tutma bildirimi üç ay."
    dogru: 0
    aciklama: |
      TMK m. 885/2 altı ay önce yazılı ihbar ister; TMK m. 886/1 alacaklılara ihbarın tebliğinden itibaren bir ay verir; TMK m. 888/2 ve TMK m. 890 saklı tutma bildirimi için bir yıl öngörür. Üç ay ise kanuni ipotek tescil süreleridir (TMK m. 894 ve TMK m. 895/2).

  - soru: |
      Banka, ipotekli daireyi Ali'den satın alan Zeynep'e hiçbir bildirimde bulunmadan yalnız Ali'ye ödeme isteminde bulunmuştur. Zeynep borcu şahsen üstlenmemiştir. Bu istemin Zeynep'e karşı etkisi nedir?
    siklar:
      - "Zeynep taşınmazın maliki olduğundan Ali'ye yapılan istem Zeynep'e karşı da etkilidir."
      - "İstem yalnız malike yöneltildiğinde etkili olur; Ali'ye yöneltilmesi gerekmez."
      - "İstem Zeynep'e karşı etkili değildir; borçtan şahsen sorumlu olmayan malik bakımından istemin hem borçluya hem malike yapılması gerekir."
      - "Zeynep devirle borçlu sıfatını kazandığından ayrıca bildirim yapılmasına gerek yoktur."
    dogru: 2
    aciklama: |
      TMK m. 887'ye göre malik borçtan şahsen sorumlu değilse alacaklının ödeme isteminin ona karşı etkili olması, istemin hem borçluya hem kendisine yapılmış olmasına bağlıdır. Takip hukukundaki karşılığı İİK m. 149/1'dir. Devir, aksi kararlaştırılmadıkça Zeynep'i borçlu yapmaz (TMK m. 888/1).

  - soru: |
      Ali dairesini Zeynep'e sattı. Senette Zeynep'in borcu üstlendiğine dair bir kayıt yoktur ve başka bir anlaşma da yapılmamıştır. Ali'nin kredisi ödenmediği için banka ipoteğin paraya çevrilmesi yoluyla takip başlatmıştır. Zeynep'in durumu hakkında hangisi doğrudur?
    siklar:
      - "Zeynep devirle birlikte borçlu olur ve Ali borçtan kurtulur."
      - "Zeynep borcun tamamından şahsen sorumludur, çünkü ipotek taşınmazı takip eder."
      - "Zeynep borçtan şahsen sorumlu değildir; yalnız taşınmazın cebri satışına katlanır, Ali ise sorumlu kalır."
      - "Zeynep ancak banka yazılı rıza verirse malik sıfatıyla takibe katlanır."
    dogru: 2
    aciklama: |
      TMK m. 888/1'e göre ipotekli taşınmazın devri, aksi kararlaştırılmadıkça borçlunun sorumluluğunda ve güvencede bir değişiklik meydana getirmez. Yargıtay Hukuk Genel Kurulu'na göre ipotek üçüncü kişi ipoteğine dönüşür; yeni malik yalnız taşınmazın cebri satışına katlanır. Bankanın rızası aranmaz; ipotek malike karşı kendiliğinden geçerlidir.

  - soru: |
      Ali'nin banka kredisi için ipotekli dairesini satın alan Zeynep, borcu yüklenmiştir. Tapu idaresi bunu bankaya bildirmiş ve bildirim bankaya tebliğ edilmiştir. Banka, tebliğden itibaren bir yıl içinde Ali'ye yazılı olarak "başvurma hakkımı saklı tutuyorum" bildirimi yapmamıştır. Sonuç nedir?
    siklar:
      - "Ali borçtan kurtulur."
      - "Ali sorumlu kalır, çünkü TBK'ya göre borcun üstlenilmesi bankanın açık rızasına bağlıdır."
      - "Zeynep'in borçlu sıfatı ortadan kalkar ve yalnız Ali borçlu kalır."
      - "Ali ancak iki yıl sonra borçtan kurtulur."
    dogru: 0
    aciklama: |
      TMK m. 888/2'ye göre yeni malik borcu yüklenirse alacaklı, başvurma hakkını saklı tuttuğunu bir yıl içinde yazılı olarak önceki borçluya bildirmezse borçlu borcundan kurtulur. Süre tapu idaresinin bildiriminin tebliğinden işler (TMK m. 890). TBK m. 204 bu özel hükmü saklı tutar; alacaklının rızası aranmaz. Zeynep'in borcu yüklenmesi bankanın susmasıyla ortadan kalkmaz.

  - soru: |
      Selim'in banka lehine ipotekli tarlası ikiye ifraz edilmiş ve parsellerden biri Hasan'a satılmıştır. Taraflar arasında rehnin dağıtımına ilişkin bir anlaşma yoktur. Rehin bakımından hangisi doğrudur?
    siklar:
      - "Rehin, tapu idaresince parsellere değerleri oranında re'sen dağıtılır."
      - "Rehin yalnız satılmayan parselde kalır; satılan parsel ipotekten kurtulur."
      - "Rehin parsellere eşit olarak dağıtılır."
      - "Rehnin dağıtılabilmesi için bankanın yazılı onayı şarttır."
    dogru: 0
    aciklama: |
      TMK m. 889/1'e göre ipotekli taşınmazın bölünmesi veya bir kısmının devri hâlinde, aksine bir anlaşma yoksa, rehin taşınmazlara değerleri oranında tapu idaresince re'sen dağıtılır. Dağıtımı kabul etmeyen alacaklı ancak sonradan bildirim yaparak alacağın ödenmesini isteyebilir (TMK m. 889/2). Onay şartı ve eşit bölüşüm kuralı yoktur.

  - soru: |
      Banka, ipotekle güvence altına alınmış alacağını yazılı sözleşmeyle bir varlık yönetim şirketine devretmiştir. Devir tapu kütüğüne tescil edilmemiştir. Hangisi doğrudur?
    siklar:
      - "Devir tescil edilmedikçe geçersizdir."
      - "Devir resmî şekilde yapılmadığı için geçersizdir."
      - "Devir geçerlidir; ipotek bağlı hak olarak yeni alacaklıya geçer."
      - "Alacak geçer ama ipotek bankada kalır."
    dogru: 2
    aciklama: |
      TMK m. 891'e göre ipotekle güvence altına alınmış alacağın devrinin geçerli olması tapu kütüğüne tescile bağlı değildir. Devir TBK m. 184'e göre yazılı şekilde yapılır ve bağlı haklar, yani ipotek de devralana geçer (TBK m. 189/1).

  - soru: |
      Hasan taşınmazını Elif'e satıp tapuda devretmiş; satış bedelinin 500.000 TL'si ödenmemiştir. Sözleşmede "Hasan kanuni ipotek hakkından vazgeçmiştir" yazmaktadır. Hasan, devirden iki ay sonra satılan taşınmaz üzerinde kanuni ipoteğin tescilini istemiş ve tescil yapılmıştır. Elif ipoteğin feragat nedeniyle geçersiz olduğunu savunmaktadır. Hangisi doğrudur?
    siklar:
      - "Feragat geçerlidir; Hasan'ın tescil isteme hakkı yoktur."
      - "Önceden feragat geçerli değildir ve tescil, mülkiyetin naklini izleyen üç ay içinde yapıldığı için Hasan'ın hakkı korunmuştur."
      - "Feragat geçersizdir, ancak tescil için süre sınırı bulunmadığından Hasan istediği zaman tescil ettirebilir."
      - "Feragat geçersizdir, ancak süre yüklenilen işin tamamlanmasından başladığı için Hasan'ın hakkı düşmüştür."
    dogru: 1
    aciklama: |
      TMK m. 893/1-1 satıcıya, satıştan doğan alacağı için satılan taşınmaz üzerinde kanuni ipotek tescilini isteme hakkı verir. Alacaklıların bu hakkından önceden feragat etmeleri geçerli değildir (TMK m. 893 son fıkra). Satıcının kanuni ipoteği mülkiyetin naklini izleyen üç ay içinde tescil edilmiş olmalıdır (TMK m. 894); iki ay bu süre içindedir. "İşin tamamlanması" ölçütü yapı alacaklıları içindir (TMK m. 895/2).

  - soru: |
      Alt yüklenici Y Ltd. Şti., yüklenici Z A.Ş.'den olan 800.000 TL'lik alacağını mahkeme kararıyla belirletmiştir. Taşınmaz maliki bu alacağı kabul etmemekte ve güvence de göstermemektedir. Tescil, işin tamamlanmasından başlayarak üç ay içinde yapılmıştır. Y'nin kanuni ipotek bakımından durumu nedir?
    siklar:
      - "Malik alacağı kabul etmediği için tescil istenemez."
      - "Alacağın hem malikçe kabul edilmesi hem de mahkemece karara bağlanması şarttır; biri eksik olduğundan tescil yapılamaz."
      - "Kanuni ipotek yalnız asıl yükleniciye tanınmıştır; alt yüklenici bu haktan yararlanamaz."
      - "Alacak mahkemece karara bağlandığı için malikin kabulü aranmaz; malik yeterli güvence göstermedikçe kanuni ipotek tescili istenebilir."
    dogru: 3
    aciklama: |
      TMK m. 893/1-3 alt yüklenici ve zanaatkârlara kanuni ipotek tescilini isteme hakkı tanır. TMK m. 895/3'e göre tescil için alacağın malikçe kabul edilmiş veya mahkemece karara bağlanmış olması şarttır; ikisi birlikte aranmaz. Malik yeterli güvence gösterirse tescil istenemez (TMK m. 895/4).

  - soru: |
      Zanaatkâr Usta Kemal 3 Mart'ta, alt yüklenici Y Ltd. Şti. ise 20 Nisan'da, aynı taşınmaz üzerindeki yapı alacakları için kanuni ipotek tescil ettirmiştir. İkisinin kanuni ipotekten yararlanma sırası nasıldır?
    siklar:
      - "Usta Kemal önce tescil ettirdiği için önceki sıradadır."
      - "Y Ltd. alacağı daha yüksek olduğu için önceki sıradadır."
      - "Y Ltd. sonra tescil ettirdiği için Usta Kemal'in ardındaki sıradadır, ama kısmen paylaşır."
      - "Tescil tarihleri farklı olsa da kendi aralarında aynı sıradadırlar."
    dogru: 3
    aciklama: |
      TMK m. 896'ya göre hakları değişik tarihlerde tescil edilmiş olsa bile zanaatkârlar ve yükleniciler, kanuni ipotekten yararlanma bakımından kendi aralarında aynı sırada sayılırlar. Tescil tarihi ya da alacak tutarı sıra belirlemez.

  - soru: |
      Bir zanaatkârın bildirimi üzerine işe başlandığı tapu kütüğünün beyanlar sütununa yazılmıştır. Tescil süresi sona ermeden taşınmaz maliki Selim, bir bankaya karşı ipotekli borç senedi çıkartıp bunu taşınmaz üzerine tescil ettirmek istemektedir. Hangisi doğrudur?
    siklar:
      - "İpotekli borç senedi tescil edilebilir; yapı alacaklıları yalnız sıra bakımından korunur."
      - "Taşınmaz üzerinde hiçbir rehin hakkı, ipotek de dahil, tescil edilemez."
      - "Yalnız irat senedi tescil edilebilir."
      - "Tescilin yapılabileceği sürenin sonuna kadar taşınmaz üzerinde ipotekten başka türde rehin tescil edilemez; ipotekli borç senedi tescil edilemez."
    dogru: 3
    aciklama: |
      TMK m. 897/3'e göre işe başlandığı beyanlar sütununa yazıldıktan sonra, tescilin yapılabileceği sürenin sonuna kadar taşınmaz üzerinde ipotekten başka türde rehin tescil edilemez. İpotekli borç senedi ipotek dışındaki bir rehin türüdür (TMK m. 850); bu yüzden tescil edilemez, ipotek ise edilebilir.

olaylar:
  - olay: |
      Ali, X Bankası'ndan 1.000.000 TL konut kredisi kullanmış ve kredinin güvencesi olarak Kadıköy'deki dairesi banka lehine ipotek edilmiştir (ana para ipoteği). Ali, 2024'te daireyi Zeynep'e satar ve tapuda devreder. Satış resmî senedinde Zeynep'in kredi borcunu yüklendiğine dair bir kayıt yoktur; ayrıca başka bir anlaşma da yapılmamıştır.

      Ali taksitleri ödemez. X Bankası, ipoteğin paraya çevrilmesi yoluyla takip başlatır ve ödeme istemini yalnız Ali'ye gönderir. Zeynep, daireyi kaybetmemek için bankaya borcun tamamını öder ve ipoteğin kaldırılmasını ister.

      Ayrı bir olayda Mehmet'in X Bankası kredisi için ipotekli dairesini Can satın alır ve bu kez Can borcu yüklenir. Tapu müdürlüğü bunu bankaya bildirir ve bildirim tebliğ edilir. Banka tebliğden itibaren bir yıl boyunca Mehmet'e hiçbir yazılı bildirim yapmaz.

      1. Zeynep, Ali'nin kredi borcundan şahsen sorumlu mudur? Zeynep'in durumunu nitelendiriniz.
      2. X Bankası'nın yalnız Ali'ye gönderdiği ödeme istemi Zeynep'e karşı etkili midir?
      3. Zeynep borcu ödediğinde hukuki durumu nedir?
      4. Mehmet ve Can bakımından varyantı değerlendiriniz.
    olcut:
      - {tespit: "Devrin, aksi kararlaştırılmadıkça borçlunun sorumluluğunu ve güvenceyi değiştirmemesi; Zeynep'in borçtan şahsen sorumlu olmayıp yalnız taşınmazın cebri satışına katlanması", puan: 25, madde: "TMK m. 888"}
      - {tespit: "Zeynep'in durumunun borçtan sorumlu olmayan malik (üçüncü kişi ipoteği) niteliği taşıması", puan: 10, madde: "TMK m. 881"}
      - {tespit: "Ödeme isteminin borçluya ve malike yapılması zorunluluğu; yalnız Ali'ye yapılan istemin Zeynep'e karşı etkili olmaması", puan: 20, madde: "TMK m. 887"}
      - {tespit: "Zeynep'in borcu ödeyerek ipoteğin kaldırılmasını isteyebilmesi, alacağın kanun gereği ona geçmesi ve Ali'ye başvurabilmesi", puan: 20, madde: "TMK m. 884"}
      - {tespit: "Varyantta borç yüklenildiği ve tapu bildirimi yapıldığı için bir yıllık sürenin tebliğden başlaması; saklı tutma bildirimi yapılmadığından önceki borçlunun kurtulması", puan: 15, madde: "TMK m. 890"}
      - {tespit: "Alacaklının rızasının aranmaması; TBK'daki genel borç üstlenmeden farkın TBK m. 204 ile açıklanması", puan: 10, madde: "TBK m. 204"}
    cozum: |
      **Nitelendirme:** Ali ile X Bankası arasında kredi ilişkisi, banka lehine kurulmuş bir ana para ipoteği vardır. Daire devredilmiş, böylece Zeynep ipotekli taşınmazın borçtan şahsen sorumlu olmayan maliki olmuştur.

      **Hukuki sorunlar:** (1) Devirle borcun ve güvencenin akıbeti; (2) ödeme isteminin muhatabı; (3) borcu ödeyen malikin durumu; (4) varyantta borcun yüklenilmesi ve önceki borçlunun kurtulması.

      **İlgili hükümler:** TMK m. 881/2, 884, 887, 888, 890; TBK m. 127/1, 204; İİK m. 149.

      **Değerlendirme:**

      *1. Zeynep'in sorumluluğu:* İpotekli taşınmazın devri, aksi kararlaştırılmış olmadıkça borçlunun sorumluluğunda ve güvencede bir değişiklik meydana getirmez (TMK m. 888/1). Senette borcun yüklenildiğine dair kayıt yoktur; Zeynep'in borcu şahsen üstlendiği söylenemez. Ali kredi borçlusu olarak sorumluluğunu korur. Zeynep ise yalnız daireyle ve dairenin cebri satışına katlanmakla sorumludur; kişisel malvarlığı takibe konu olamaz. Zeynep, borcun şahsen sorumlusu olmadığı için TMK m. 881/2'deki üçüncü kişi ipotekçisine benzer bir konumdadır. Yargıtay Hukuk Genel Kurulu da devirle ipoteğin üçüncü kişi ipoteğine dönüştüğünü kabul eder.

      *2. Ödeme istemi:* Malik borçtan şahsen sorumlu değilse alacaklının ödeme isteminin ona karşı etkili olması, istemin hem borçluya hem malike yapılmasına bağlıdır (TMK m. 887). İcra emri de ipotekli taşınmazın mülkiyeti üçüncü şahsa geçmişse ayrıca ona gönderilir (İİK m. 149/1). Banka istemi yalnız Ali'ye yaptığı için Zeynep'e karşı etkili değildir; takibin Zeynep'e karşı ilerleyebilmesi için ona da ödeme istemi gönderilmelidir. Asıl borçlu ile malik arasında zorunlu takip arkadaşlığı bulunduğu da unutulmamalıdır.

      *3. Zeynep'in ödemesi:* Borçtan şahsen sorumlu olmayan rehinli taşınmaz maliki, borçluya ait koşullar içinde borcu ödeyerek ipoteğin kaldırılmasını isteyebilir ve alacak borcu ödeyen malike geçer (TMK m. 884). Yargıtay Hukuk Genel Kurulu bunu kanuni halefiyet sayar; ayrıca devir sözleşmesi gerekmez. Genel kural TBK m. 127/1'dir. Zeynep bankanın yerine geçtiğinden ödediği tutar için Ali'ye başvurabilir. Ödeme, Zeynep'in borcu üstlendiği anlamına gelmez.

      *4. Varyant:* Can, Mehmet'in borcunu yüklenmiştir. Tapu idaresi bunu alacaklıya bildirir ve alacaklıya tanınan bir yıllık beyan süresi bildirimin tebliği tarihinden işler (TMK m. 890). Alacaklı bu süre içinde kendisine başvurma hakkını saklı tuttuğunu önceki borçluya yazılı olarak bildirmezse önceki borçlu, yani Mehmet, borcundan kurtulur (TMK m. 888/2). Genel kural olan TBK m. 196'da borçlu değişikliği alacaklıyla yapılan sözleşmeyle olur; oysa TBK m. 204 rehinli taşınmazların devrinde borç üstlenmeye ilişkin özel hükümleri saklı tutar ve TMK m. 888/2 ile TMK m. 890 bunlardır. Bu yüzden bankanın rızası aranmaz, susması önceki borçluyu kurtarır. Can borçlu olarak kalır.

      **Sonuç:**
      - Zeynep borçtan şahsen sorumlu değildir; yalnız dairenin cebri satışına katlanır.
      - Yalnız Ali'ye gönderilen ödeme istemi Zeynep'e karşı etkili değildir.
      - Zeynep borcu öderse alacak ona geçer; ipoteğin kaldırılmasını ister ve Ali'ye başvurur.
      - Varyantta banka bir yıl içinde saklı tutma bildirimi yapmadığından Mehmet borçtan kurtulur.

  - olay: |
      Mehmet'in değeri 2.000.000 TL olan arsası, Ayşe'nin Z Bankası'na olan 3.000.000 TL'lik kredi borcu için banka lehine ipotek edilmiştir. Arsa, 2025'te Can'a 2.000.000 TL bedelle satılmış ve tapuda devredilmiştir. Can borcu yüklenmemiştir. Z Bankası henüz icra takibi başlatmamıştır.

      Can, arsayı ipotek yükünden kurtarmak ister ve alacaklılara yazılı bir ihbar göndermeyi planlar. Z Bankası ihbarın tebliğinden itibaren bir ay içinde giderleri peşin ödeyerek ipotekli arsanın açık artırma yoluyla satılmasını ister. İcra dairesince yapılan açık artırmada arsa, Can'ın ödemeyi önerdiği bedelden fazlaya satılır. Arsa üzerinde başka bir ipotek alacaklısı yoktur.

      Başka bir varyantta Can arsayı Mehmet'ten bağış yoluyla edinmiştir ve Z Bankası henüz takip başlatmamıştır.

      1. Mehmet'in ipoteğinin niteliği nedir? Can'ın hukuki durumunu nitelendiriniz.
      2. Can, arsayı hangi koşullarla ve hangi bedeli ödeyerek ipotekten kurtarabilir? Usul nedir?
      3. Banka hangi hakkı kullanabilir? Artırma sonucunda ne olur ve giderleri kim yüklenir?
      4. Bağış varyantında Can ne öder? Z Bankası takibe başlasaydı sonuç ne olurdu?
    olcut:
      - {tespit: "Mehmet'in üçüncü kişi ipotekçisi olması; Can'ın borçtan şahsen sorumlu olmayan ipotekli taşınmaz edinicisi sayılması", puan: 15, madde: "TMK m. 881"}
      - {tespit: "İpotekten kurtarma koşulları: değerini aşan borç, edinenin borçtan şahsen sorumlu olmaması, takibe başlanmamış olması; ödenecek bedelin satın alma bedeli (2.000.000 TL) olması", puan: 25, madde: "TMK m. 885"}
      - {tespit: "Alacaklılara altı ay önce yapılacak yazılı ihbar zorunluluğu", puan: 15, madde: "TMK m. 885"}
      - {tespit: "Alacaklıların ihbarın tebliğinden itibaren bir ay içinde, giderleri peşin ödeyerek açık artırma isteyebilmesi", puan: 15, madde: "TMK m. 886"}
      - {tespit: "Artırma bedelinin fazla olması hâlinde fazlanın kurtarma bedeli sayılması ve giderlerin malike (Can'a) ait olması", puan: 10, madde: "TMK m. 886"}
      - {tespit: "Kurtarma bedelinin alacaklılar arasında sıralarına göre dağıtılması; TMK m. 884'teki borcun tamamının ödenmesi yolunun ayrı olduğunun belirtilmesi", puan: 5, madde: "TMK m. 884"}
      - {tespit: "Bağış varyantında karşılıksız edinenin takdir edeceği bedeli ödemesi; takip başlamışsa yolun kapanması", puan: 15, madde: "TMK m. 885"}
    cozum: |
      **Nitelendirme:** Mehmet, Ayşe'nin borcu için arsasını ipotek ettirmiş bir üçüncü kişi ipotekçisidir; Can ise ipotekli arsayı borcu yüklenmeden edinen kişidir. Konu, ipotekten kurtarma kurumudur.

      **Hukuki sorunlar:** (1) Can'ın sorumluluk durumu; (2) ipotekten kurtarmanın koşulları, bedeli ve usulü; (3) alacaklıların açık artırma hakkı; (4) bağış varyantı ve takip başlamasının etkisi.

      **İlgili hükümler:** TMK m. 881/2, 884, 885, 886, 888/1.

      **Değerlendirme:**

      *1. Nitelendirme:* İpoteğe konu taşınmazın borçlunun mülkiyetinde bulunması gerekmediğinden (TMK m. 881/2) Mehmet'in Ayşe'nin borcu için kurduğu ipotek geçerlidir. İpotekli arsayı borcu yüklenmeden edinen Can, borçtan şahsen sorumlu değildir; devir borçlunun sorumluluğunu değiştirmez (TMK m. 888/1). Can yalnız arsanın cebri satışına katlanır.

      *2. Kurtarma koşulları ve usul:* TMK m. 885/1'e göre değerini aşan bir borç için ipotek edilmiş taşınmazı edinen kimse, borçtan şahsen sorumlu değilse, icra takibine başlanmadan önce satın alma bedelini ödeyerek taşınmazı ipotekten kurtarabilir. Burada borç (3.000.000 TL) arsanın değerini (2.000.000 TL) aşmaktadır; Can borçlu değildir; takip başlamamıştır. Can bu nedenle satın alma bedeli olan 2.000.000 TL'yi ödeyerek kurtarabilir. Hak, alacaklılara altı ay önce yapılacak yazılı ihbarla kullanılır (TMK m. 885/2). Ödenen kurtarma bedeli alacaklılar arasında sıralarına göre dağıtılır (TMK m. 885/3). Can isterse bunun yerine TMK m. 884'e göre borcun tamamını (3.000.000 TL) borçluya ait koşullar içinde ödeyip ipoteğin kaldırılmasını isteyebilir ve alacağa halef olur; ancak bu yol borcun tamamını gerektirir ve ayrıdır.

      *3. Açık artırma:* İhbar karşısında alacaklılar, ihbarın tebliğinden başlayarak bir ay içinde giderleri peşin ödeyerek ipotekli arsanın açık artırma yoluyla satılmasını isteyebilir; satış icra dairesince İİK hükümlerine göre yapılır (TMK m. 886/1-2). Banka bu hakkı süresi içinde kullanmıştır. Açık artırmada elde edilen miktar satış bedelinden veya malikin takdir ettiği bedelden fazlaysa bu miktar ipotekten kurtarma bedeli sayılır; artırma bedelinin fazla olduğu hâllerde açık artırma giderleri malike ait olur (TMK m. 886/3). Olayda artırma bedeli fazla çıktığından giderleri Can yüklenir. Bedel fazla çıkmasaydı giderleri artırmayı isteyen banka karşılardı.

      *4. Bağış varyantı:* Taşınmazı karşılıksız olarak edinen kimse de takdir edeceği bedeli ödeyerek ipotekten kurtarma hakkını kullanabilir (TMK m. 885/1). Dolayısıyla Can bu durumda kendi takdir edeceği bedeli öder; burada satın alma bedeli yoktur. Yine altı ay önce yazılı ihbar gerekir. Z Bankası takibe başlamış olsaydı, TMK m. 885/1 icra takibine başlanmadan önce kullanılabilecek bir yol olduğundan ipotekten kurtarma hakkı artık kullanılamazdı.

      **Sonuç:**
      - Can borçtan şahsen sorumlu değildir; kurtarma şartları gerçekleşmiştir ve satın alma bedeli olan 2.000.000 TL'yi ödeyerek altı ay önce yazılı ihbarla arsayı kurtarabilir.
      - Banka ihbarın tebliğinden itibaren bir ay içinde giderleri peşin ödeyerek açık artırma isteyebilir; artırma bedeli fazla çıktığı için fazla miktar kurtarma bedeli sayılır ve giderler Can'a aittir.
      - Bağış varyantında Can takdir ettiği bedeli öder; takip başlamışsa kurtarma yolu kapanır.

  - olay: |
      Hasan, Bakırköy'deki taşınmazını Elif'e 2.500.000 TL'ye satar ve taşınmaz tapuda Elif adına tescil edilir. Elif, bedelin 500.000 TL'sini ödemez. Satış sözleşmesinde "Hasan, kanuni ipotek hakkından vazgeçmiştir" kaydı yer almaktadır. Hasan, devirden iki ay sonra taşınmaz üzerinde kanuni ipoteğin tescilini sağlar.

      Elif, aynı taşınmaz üzerinde bir apartman inşa ettirmektedir. Alt yüklenici Y Ltd. Şti., yüklenici Z A.Ş.'den olan 800.000 TL'lik alacağını mahkeme kararıyla belirletmiştir. İş 1 Mart'ta tamamlanmıştır. Y Ltd., işin tamamlanmasından başlayarak üç ay içinde Elif'in taşınmazı üzerinde kanuni ipotek tescilini istemiş ve tescil bu süre içinde yapılmıştır. Elif, alacağı kabul etmediğini bildirir; güvence de göstermemiştir. Ayrıca Usta Ömer adlı zanaatkâr da aynı taşınmaz için kanuni ipoteğini daha sonra tescil ettirmiştir.

      1. Hasan'ın hakkı nedir? Satış sözleşmesindeki feragat kaydı ve tescil süresi bakımından değerlendiriniz.
      2. Y Ltd.'nin kanuni ipotek tescili bakımından durumunu değerlendiriniz.
      3. Elif'in alacağı kabul etmemesi ve güvence göstermemesi tescile engel midir?
      4. Y Ltd. ile Usta Ömer'in sıra bakımından ilişkisi nedir?
    olcut:
      - {tespit: "Satıcının satılan taşınmaz üzerinde, satıştan doğan ödenmemiş bedel alacağı için kanuni ipotek tescilini isteyebilmesi", puan: 15, madde: "TMK m. 893"}
      - {tespit: "Satıcının kanuni ipoteğinin mülkiyetin naklini izleyen üç ay içinde tescil edilmiş olması gerektiği; iki ayda yapılan tescilin süreye uygun olması", puan: 15, madde: "TMK m. 894"}
      - {tespit: "Kanuni ipotek hakkından önceden feragatin geçersiz olması", puan: 15, madde: "TMK m. 893"}
      - {tespit: "Alt yüklenicinin TMK m. 893/1-3 kapsamında kanuni ipotek tescilini isteyebilen hak sahibi olması", puan: 10, madde: "TMK m. 893"}
      - {tespit: "Alacağın mahkemece karara bağlanmış olması nedeniyle malikin kabulünün aranmaması; işin tamamlanmasından başlayan üç aylık süre", puan: 20, madde: "TMK m. 895"}
      - {tespit: "Malik yeterli güvence gösterirse tescil istenemeyeceği; Elif'in bunu göstermemiş olması", puan: 10, madde: "TMK m. 895"}
      - {tespit: "Zanaatkâr ve yüklenicilerin değişik tarihlerde tescil etmiş olsalar bile kendi aralarında aynı sırada sayılması", puan: 15, madde: "TMK m. 896"}
    cozum: |
      **Nitelendirme:** Olayda iki ayrı tescile tabi kanuni ipotek vardır: satıcı Hasan'ın satış bedeli alacağına dayanan kanuni ipotek ve alt yüklenici Y Ltd.'nin yapı alacağına dayanan kanuni ipotek. Her ikisi de TMK m. 893'ün kapsamındadır ve tescil gerektirir; TMK m. 892 gibi tescilsiz doğan kanuni ipotek söz konusu değildir.

      **Hukuki sorunlar:** (1) Satıcının kanuni ipoteği, feragat ve süre; (2) yapı alacaklısı ipoteğinin şartları; (3) malikin güvence göstermesi; (4) hak sahipleri arasındaki sıra.

      **İlgili hükümler:** TMK m. 893/1-1, 893/1-3, 893 son fıkra, 894, 895/2-4, 896.

      **Değerlendirme:**

      *1. Hasan:* Satıştan doğan alacağı için satılan taşınmaz üzerinde satıcı, kanuni ipotek hakkının tescilini isteyebilir (TMK m. 893/1-1). Ödenmeyen 500.000 TL, satıştan doğan alacaktır. Satış sözleşmesindeki "kanuni ipotek hakkından vazgeçmiştir" kaydı geçerli değildir; çünkü alacaklıların bu hakkından önceden feragat etmeleri geçerli değildir (TMK m. 893 son fıkra). Satıcıların kanuni ipotek haklarının, mülkiyetin naklini izleyen üç ay içinde tapu kütüğüne tescil edilmiş olması gerekir (TMK m. 894). Tescil devirden iki ay sonra yapılmıştır; süre içindedir. Hasan'ın ipoteği geçerlidir.

      *2. Y Ltd.:* Alt yüklenici, malzeme vererek veya vermeden emek sarf ettiği için malik veya yükleniciden alacaklı olduğunda kanuni ipotek tescilini isteyebilir (TMK m. 893/1-3). Y Ltd. alt yüklenicidir; hakkı tartışmasızdır. Zanaatkârların ve yüklenicilerin kanuni ipotek hakları çalışmayı yüklendikleri andan başlayarak tescil olunabilir; tescilin yüklenilen işin tamamlanmasından başlayarak üç ay içinde yapılmış olması gerekir (TMK m. 895/1-2). İş 1 Mart'ta tamamlanmış ve tescil üç ay içinde yapılmıştır. Tescil için alacağın malik tarafından kabul edilmiş veya mahkemece karara bağlanmış olması şarttır (TMK m. 895/3); burada alacak mahkeme kararıyla belirlendiğinden Elif'in kabul etmemesi tescile engel değildir. Yargıtay uygulamasında yapı alacaklısı ipoteği davası taşınmaz malikine, yani Elif'e yöneltilir.

      *3. Güvence:* Malik yeterli güvence gösterirse tescil istenemez (TMK m. 895/4). Elif alacağı kabul etmediğini bildirmiş ama güvence göstermemiştir; bu nedenle tescile engel olamaz.

      *4. Sıra:* Hakları değişik tarihlerde tescil edilmiş olsa bile zanaatkârlar ve yükleniciler kanuni ipotekten yararlanma bakımından kendi aralarında aynı sırada sayılırlar (TMK m. 896). Usta Ömer zanaatkâr, Y Ltd. alt yüklenicidir; Ömer daha sonra tescil ettirmiş olsa da ikisi aynı sıradadır. Satış bedeli alacaklarını karşılamazsa TMK m. 897/1'deki öncelik kuralı devreye girer: Kalan kısım, önceki sıradaki ipotek alacaklılarının payına düşen satış bedelinden arsa değeri çıkarıldıktan sonra artan parayla karşılanır; bu, yüklerin yapı alacaklılarının zararına olacağının önceki alacaklılarca bilinebilir olmasına bağlıdır.

      **Sonuç:**
      - Hasan, satış bedeli alacağı için kanuni ipotek isteyebilir; önceden feragat geçersizdir ve iki ay içinde yapılan tescil üç aylık süreye uygundur.
      - Y Ltd. alt yüklenici olarak tescil isteyebilir; mahkeme kararı malikin kabulü yerine geçer, süre işin tamamlanmasından üç ay içinde korunmuştur.
      - Elif güvence göstermediği için tescil engellenemez.
      - Y Ltd. ile Usta Ömer kendi aralarında aynı sıradadır.

kartlar:
  - on: "Hangi alacaklar ipotekle güvence altına alınabilir? (TMK m. 881/1)"
    arka: "Hâlen mevcut olanlar ile henüz doğmamış olmakla birlikte doğması kesin veya olası olanlar."
  - on: "İpoteğe konu taşınmaz borçlunun mülkiyetinde olmak zorunda mıdır?"
    arka: "Hayır. Başkasının borcu için kendi taşınmazını ipotek eden üçüncü kişi, yalnız taşınmazıyla sorumludur (TMK m. 881/2)."
  - on: "Miktarı değişen alacakta ipoteğin sırası nasıl korunur? (TMK m. 882/1)"
    arka: "Alacak belli rehin derecesine yerleşir ve tescilden sonraki miktar değişmelerine bakılmaksızın sırasını korur. Üst sınırı taraflar belirler (TMK m. 851/1)."
  - on: "İpotek belgesi nedir? (TMK m. 882/2)"
    arka: "Tapu memurunun alacaklıya verdiği, yalnız tescilin yapıldığını ispata yarayan belge. Kıymetli evrak değildir."
  - on: "2644 sayılı Kanun m. 26 ile ipotek tescilinde ne değişti?"
    arka: "Bankalar ve sayılan kuruluşların kredilerine karşılık ipotek, tarafların istemi hâlinde imzalanan kredi sözleşmesine dayanılarak tapu müdürlüğünde tescil edilebilir (7099 ve 7292 sayılı Kanunlar)."
  - on: "Alacak sona erince malik ne isteyebilir? (TMK m. 883/1)"
    arka: "Alacaklıdan ipoteği terkin ettirmesini. Terkin için kural olarak alacaklının yazılı beyanı gerekir (TMK m. 1014)."
  - on: "Süreli ipoteğin tapuca terkini nasıl olur? (TMK m. 883/2)"
    arka: "Sürenin bitiminden itibaren otuz gün içinde İİK m. 150/c şerhi konulmazsa malikin talebiyle tapu müdürlüğü terkin eder. 7181 sayılı Kanun, yürürlük 1/1/2020."
  - on: "Borcu ödeyen borçlu olmayan malike ne olur? (TMK m. 884)"
    arka: "İpoteğin kaldırılmasını isteyebilir ve alacak kanun gereği ona geçer; kişisel borçluya başvurabilir (TBK m. 127/1)."
  - on: "İpotekten kurtarmanın şartları nelerdir? (TMK m. 885)"
    arka: "Değerini aşan borçla ipotekli taşınmazı edinmek, borçtan şahsen sorumlu olmamak, icra takibine başlanmamış olması ve alacaklılara altı ay önce yazılı ihbar. Ödenen bedel satın alma bedeli (karşılıksız edinmede takdir edilen bedel)."
  - on: "İhbar üzerine alacaklıların hakkı nedir? (TMK m. 886)"
    arka: "İhbarın tebliğinden itibaren bir ay içinde giderleri peşin ödeyerek açık artırma isteyebilirler."
  - on: "Açık artırma giderlerini kim öder? (TMK m. 886/3)"
    arka: "Artırma bedeli fazlaysa malik; aksi hâlde artırmayı isteyen alacaklı."
  - on: "Borçlu olmayan malike karşı ödeme istemi nasıl yapılır? (TMK m. 887)"
    arka: "İstemin hem borçluya hem malike yapılması gerekir (İİK m. 149/1)."
  - on: "İpotekli taşınmazın devri borcu değiştirir mi? (TMK m. 888/1)"
    arka: "Aksi kararlaştırılmadıkça hayır. Borçlunun sorumluluğu ve güvence değişmez; yeni malik borcu şahsen üstlenmiş sayılmaz."
  - on: "Yeni malik borcu yüklenirse önceki borçlu ne zaman kurtulur? (TMK m. 888/2)"
    arka: "Alacaklı bir yıl içinde saklı tutma bildirimini önceki borçluya yazılı yapmazsa. Süre tapu idaresinin bildiriminin tebliğinden işler (TMK m. 890)."
  - on: "Bölünmede ipotek nasıl dağıtılır? (TMK m. 889)"
    arka: "Aksine anlaşma yoksa taşınmazlara değerleri oranında tapu idaresince re'sen dağıtılır."
  - on: "İpotekli alacağın devri tescile bağlı mıdır? (TMK m. 891)"
    arka: "Hayır. Devir yazılı yapılır (TBK m. 184) ve ipotek bağlı hak olarak geçer (TBK m. 189/1)."
  - on: "Tescilsiz doğan kanuni ipotek var mıdır? (TMK m. 892)"
    arka: "Evet; kanuni ipoteklerin doğumu, kanunda aksi öngörülmedikçe tescile bağlı değildir. Ama TMK m. 893'teki üç hâl tescile tabidir."
  - on: "TMK m. 893'teki üç hak sahibi kimdir?"
    arka: "Satıcı; birlikte mirasçılar ve diğer elbirliği ortakları; malik veya yükleniciden alacaklı alt yüklenici ve zanaatkârlar."
  - on: "Kanuni ipotek hakkından önceden feragat geçerli midir?"
    arka: "Hayır, geçersizdir (TMK m. 893 son fıkra). Kural kat malikleri ipoteğinde de uygulanır (KMK m. 22/2)."
  - on: "Satıcı, mirasçı ve elbirliği ortaklarının tescil süresi nedir? (TMK m. 894)"
    arka: "Mülkiyetin naklini izleyen üç ay."
  - on: "Yapı alacaklısı ipoteğinde süre ve şart nedir? (TMK m. 895)"
    arka: "İşin tamamlanmasından başlayarak üç ay. Alacak malikçe kabul edilmiş veya mahkemece karara bağlanmış olmalı; malik yeterli güvence gösterirse tescil istenemez."
  - on: "Zanaatkâr ve yükleniciler arasında sıra nasıl belirlenir? (TMK m. 896)"
    arka: "Değişik tarihlerde tescil etseler bile kendi aralarında aynı sıradadırlar."
  - on: "İşe başlandığı beyanlar sütununa yazılırsa ne olur? (TMK m. 897/3)"
    arka: "Tescil süresinin sonuna kadar taşınmaz üzerinde ipotekten başka türde rehin tescil edilemez."
  - on: "İpotekli taşınmazı takipten önce devreden kişi takipte borçlu mudur?"
    arka: "Hayır; borçlu sıfatı kalmaz, takip yeni malike yöneltilmelidir (İİK m. 149/1; İİK m. 150/c)."
