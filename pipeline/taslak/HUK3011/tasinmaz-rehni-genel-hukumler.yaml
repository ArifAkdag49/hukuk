  - id: "588166400"
    ozet: |
      Paylı bir dubleks meskenin yarı payı davacıya, yarı payı başka bir paydaşa aittir. Diğer paydaş 2006'da yalnız kendi payı üzerine dava dışı bir kişi lehine 130.000 Euro'luk, birinci derece, bir yıl süreli, faizsiz ipotek kurmuş; iki ay sonra kendi adına ve davacıya vekâleten taşınmazın tamamı üzerine davalı lehine 755.000 TL'lik, ikinci dereceli, süreli bir ipotek daha kurmuştur (kararda ipoteğin "serbest dereceden istifade" kayıtlı olduğu belirtilir). Davacı yıllar sonra TMK m. 857/2'ye aykırılık nedeniyle kendi payı üzerindeki ikinci dereceli ipoteğin kaldırılmasını istemiştir. İlk derece mahkemesi ipoteğin TMK m. 857/2'ye aykırı olduğunu kabul etmiş, ama davacının işleme taraf olduğunu ve uzun süre sessiz kaldığını belirterek hakkın kötüye kullanılması nedeniyle davayı reddetmiş; bölge adliye mahkemesi ise kuralın emredici olduğunu belirterek kararı kaldırıp ipoteği davacının payı üzerinden kaldırmıştır. Yargıtay 14. Hukuk Dairesi oybirliğiyle kararı bozmuştur: Rehnin güvencesi tescildeki derece ile sınırlıdır (TMK m. 870); bu nedenle pay rehninden sonra taşınmazın tamamı üzerinde sonraki derecelerde ipotek kurulabilir, farklı derecelerde kurulan ipotekler TMK m. 857/2 kapsamında değildir. Bu dar yorum tek bir daire kararıdır; yerleşik içtihat sayılmamalıdır. Karar ayrıca sabit derece mantığını gösterdiği için öğreticidir.
  - id: "1191466100"
    ozet: |
      Ticari ilişki sonunda imzalanan protokole göre borçlu şirketin 701.204,00 TL borcu bulunmakta, borca istinaden davacının bir taşınmazdaki 58/2400 payı davalıya devredilecek ve çeklerden biri ödenmezse icra takibine geçilecektir; protokolü borçlu şirket adına bir yetkili, müteselsil kefil olarak da davacı imzalamıştır. Pay, protokolden kısa süre sonra satış yoluyla ve 75.000,00 TL bedelle davalıya devredilmiştir. Davacı, devrin gerçek bir satış olmadığını, borca karşılık teminat olduğunu, borç tasfiye edildiği hâlde çeklerle takip başlatıldığını ve baskı, tehdit ile irade fesadı bulunduğunu ileri sürerek tapu iptali ve tescil istemiştir. İlk derece mahkemesi, protokolde borcun ödenmemesi hâlinde taşınmazın devredileceğinin kararlaştırılmadığını, payın borca mahsuben devredildiğini ve bu nedenle protokolün TMK m. 873/2'deki lex commissoria yasağına aykırı olmadığını belirterek, irade sakatlığı da ispatlanamadığından davayı reddetmiştir. Bölge adliye mahkemesi esastan ret kararı vermiş, Yargıtay 1. Hukuk Dairesi de oybirliğiyle onamıştır. Yargıtay TMK m. 873/2 hakkında kendi gerekçesini yazmamıştır; ayrım ilk derece mahkemesinin gerekçesidir ve borcun ödenmemesi şartına bağlı devir ile borca mahsuben devrin ayrı değerlendirildiğini gösterir.
  - id: "1190859300"
    ozet: |
      İpotek borçlusu şirket, ipotekli taşınmazı tapuya şerhli bir kira sözleşmesiyle şikâyetçi şirkete restoran olarak kiralamıştır. Kiracı, ek sözleşme ve protokollerle 2021-2027 arası kiraların sekiz bonoyla peşin ödendiğini, kira borcu kalmadığını ileri sürmüştür. Kendisine 3.10.2022'de İİK m. 150/b muhtırası tebliğ edilmiş, o da icra müdürlüğünün 27.9.2022 tarihli kararının iptali için şikâyete başvurmuştur. Karşı oydan anlaşıldığına göre şikâyet sonunda bu muhtıranın iptaline karar verilmiş; Yargıtay 12. Hukuk Dairesi bölge adliye mahkemesi kararını oy çokluğuyla onamıştır. Çoğunluk kararı kısadır; bölge adliye mahkemesinin gerekçelerine atıfla onama yapılmış, hukuki tartışma çoğunluk kararında yer almamıştır. Karşı oy yazısı ise TMK m. 863/1-3 ve İİK m. 150/b'yi aktararak protokollerin adi yazılı olduğunu, bonoların ve dekontların resmî belge sayılamayacağını ve peşin ödemelerin malikin henüz muaccel olmamış kira bedelleri üzerinde yaptığı hukuki işlem niteliğinde olup rehinli alacaklıya karşı geçerli olmadığını savunmuş; muhtıranın işleyecek kiraların icraya ödenmesine ilişkin olduğunu, iptalinin gerekmediğini belirterek bozma görüşü bildirmiştir. TMK m. 863/3'ün tartışması yalnız karşı oydadır. Bu nedenle karardan, peşin ödemenin rehinli alacaklıya karşı geçerli olduğuna ilişkin bir Yargıtay ilkesi çıkarılamaz.

sorular:
  - soru: |
      TMK m. 850'ye göre taşınmaz rehni hangi şekillerde kurulabilir?
    siklar:
      - "Yalnız ipotek ve zilyetliğin devrine bağlı rehin şeklinde"
      - "İpotek, rehin senedi ve ticari işletme rehni şeklinde"
      - "İpotek, ipotekli borç senedi veya irat senedi şeklinde"
      - "Taraflar, ihtiyaçlarına uygun gördükleri herhangi bir rehin türünü serbestçe kurabilir"
    dogru: 2
    aciklama: |
      TMK m. 850, taşınmaz rehninin "ancak" ipotek, ipotekli borç senedi veya irat senedi şeklinde kurulabileceğini söyler. Sayım sınırlıdır; taraflar yeni bir tür yaratamaz. Taşınmaz rehninde zilyetliğin devri bir kuruluş şekli değildir ve ticari işletme rehni bu sayımda yer almaz.

  - soru: |
      Ayşe, Euro cinsinden kredi veren bir bankanın alacağını güvence altına almak için arsası üzerinde ipotek kurmak istiyor. Banka, tek derecede hem 100.000 Euro hem de 3.000.000 TL yazılmasını talep ediyor. Hangisi doğrudur?
    siklar:
      - "Yabancı para üzerinden ipotek hiçbir hâlde kurulamaz; ipotek yalnız Türk parası üzerinden kurulur."
      - "Euro kredisini güvence altına almak için yabancı para üzerinden ipotek kurulabilir, ancak aynı derecede birden fazla para türü kullanılamaz."
      - "Aynı derecede iki para türü birlikte yazılabilir, yeter ki toplam tutar kredi tutarını aşmasın."
      - "Yabancı para ipoteği ancak malikin yabancı para cinsinden geliri varsa kurulabilir."
    dogru: 1
    aciklama: |
      Yabancı para üzerinden rehin, kredi kuruluşlarınca yabancı para üzerinden veya yabancı para ölçüsüyle verilen kredileri güvence altına almak için kurulabilir; ancak aynı derecede birden fazla para türü kullanılarak rehin kurulamaz (TMK m. 851/2). Bu nedenle Euro ve TL'nin aynı dereceye yazılması mümkün değildir. Malikin geliri bu bakımdan aranmaz.

  - soru: |
      TMK m. 851/4'e göre hangi yabancı paralar üzerinden rehin kurulabileceğini kim belirler ve derecelerin karşılıkları hangi kurla hesaplanır?
    siklar:
      - "Cumhurbaşkanı belirler; hesap günündeki Merkez Bankası döviz alış kuru esas alınır."
      - "Bakanlar Kurulu belirler; hesap günündeki Merkez Bankası döviz satış kuru esas alınır."
      - "Tapu ve Kadastro Genel Müdürlüğü belirler; serbest piyasa kuru esas alınır."
      - "Taraflar sözleşmeyle belirler; tescil tarihindeki efektif satış kuru esas alınır."
    dogru: 0
    aciklama: |
      Karşılıkların hesabında hesap günündeki Türkiye Cumhuriyet Merkez Bankasının döviz alış kuru esas alınır; rehin haklarının hangi yabancı paralar üzerinden kurulabileceğini Cumhurbaşkanı belirler (TMK m. 851/4). Eski metindeki "Bakanlar Kurulu" ibaresi 2018'de 700 sayılı Kanun Hükmünde Kararname ile "Cumhurbaşkanınca" olarak değiştirilmiştir.

  - soru: |
      Kemal, 20 yıldır kullandığı ve tapu kütüğünde kaydı bulunmayan bir arazi parçası üzerinde bankadan kredi almak için ipotek kurmak istiyor. Hangisi doğrudur?
    siklar:
      - "Uzun süreli kullanım nedeniyle zilyetlik devredilerek rehin kurulabilir."
      - "Köy muhtarının düzenleyeceği belgeyle ipotek kurulabilir."
      - "Kullanım hakkı şerh edildikten sonra ipotek kurulabilir."
      - "Rehin hakkı ancak tapuya kayıtlı taşınmazlar üzerinde kurulabildiği için bu parça üzerinde ipotek kurulamaz."
    dogru: 3
    aciklama: |
      Rehin hakkı ancak tapuya kayıtlı taşınmazlar üzerinde kurulabilir (TMK m. 853). Kullanım süresinin uzunluğu, muhtar belgesi veya şerh bu şartın yerini tutmaz.

  - soru: |
      Ali ve Burak'ın birbirinden ayrı birer dükkânı vardır. İkisi de dükkânlarının, üçüncü bir kişinin bankaya olan tek borcu için rehnedilmesine razıdır; Ali ile Burak borçtan müteselsilen sorumlu değildir. Hangisi doğrudur?
    siklar:
      - "Rehin kurulabilir; ancak her taşınmazın alacağın ne miktarı için güvence oluşturduğu rehin kurulurken belirtilir."
      - "Farklı maliklere ait taşınmazlar aynı borç için hiçbir hâlde rehnedilemez."
      - "Rehin kurulabilir; her dükkân alacağın tamamı için ayrı ayrı güvence oluşturur ve miktar belirtmeye gerek yoktur."
      - "Rehin kurulabilir; ancak yalnız ilk derecede kurulabilir."
    dogru: 0
    aciklama: |
      Aynı alacak için birden çok taşınmazın rehnedildiği diğer hâllerde, her taşınmazın alacağın ne miktarı için güvence oluşturduğu rehin kurulurken belirtilir (TMK m. 855/2). Aksine anlaşma yoksa tapu idaresi güvenceyi taşınmazların her birine değeri oranında dağıtır (TMK m. 855/3). Derece sınırlaması kanunda yer almaz.

  - soru: |
      Burak, annesinden kalan ve üç kardeşin elbirliği mülkiyetiyle sahip olduğu evdeki "kendi payını" bankaya ipotek etmek istiyor. Hangisi doğrudur?
    siklar:
      - "Burak payını diğer kardeşlerin rızası olmadan rehnedebilir."
      - "Burak payını rehnedebilir, ancak bunun için mahkemeden izin alması gerekir."
      - "Elbirliği mülkiyetine tabi taşınmaz ancak bütün olarak ve maliklerin tamamı adına rehnedilebilir; pay rehni mümkün değildir."
      - "Burak payını rehnedebilir, ancak evin tamamını rehnedemez."
    dogru: 2
    aciklama: |
      Paylı mülkiyette paydaş kendi payını rehnedebilir; elbirliği mülkiyetine tabi taşınmaz ise ancak bütün olarak ve maliklerin tamamı adına rehnolunabilir (TMK m. 857/1 ve TMK m. 857/3). Pay rehni paylı mülkiyetin kuralıdır ve elbirliğine uygulanmaz.

  - soru: |
      Taşınmaz rehninin kurulmasına ilişkin hangi ifade doğrudur?
    siklar:
      - "Rehin, taraflar arasında yazılı sözleşme yapılmasıyla kurulur; tescil yalnız açıklayıcıdır."
      - "Rehin tescille kurulur; sözleşme için herhangi bir şekil aranmaz."
      - "Rehin, alacaklıya taşınmazın zilyetliğinin devriyle kurulur; tescil şerh niteliğindedir."
      - "Rehin tapu kütüğüne tescille kurulur; rehnin kurulmasına ilişkin sözleşmenin geçerliliği resmî şekilde yapılmasına bağlıdır."
    dogru: 3
    aciklama: |
      Taşınmaz rehni tapu kütüğüne tescil ile kurulur ve kurma sözleşmesinin geçerliliği resmî şekilde yapılmasına bağlıdır (TMK m. 856). Resmî senet tapu sicil müdürü veya görevlilerince düzenlenir (2644 sayılı Kanun m. 26). Tescil kurucudur, açıklayıcı değildir.

  - soru: |
      TMK m. 858'e göre taşınmaz rehni hangi sebeple sona erer?
    siklar:
      - "Borç ödendiği anda, tapuda terkin edilmese bile kendiliğinden sona erer."
      - "Tescilin terkiniyle veya taşınmazın tamamen yok olmasıyla sona erer."
      - "Malikin tek taraflı dilekçesiyle sona erer."
      - "Taşınmazın başkasına devredilmesiyle sona erer."
    dogru: 1
    aciklama: |
      Taşınmaz rehni tescilin terkini veya taşınmazın tamamen yok olmasıyla sona erer (TMK m. 858). Terkin için kural olarak kaydın kendilerine hak sağladığı kişilerin yazılı beyanı gerekir (TMK m. 1014); bu nedenle malikin tek taraflı dilekçesi yetmez. Taşınmazın devri rehni sona erdirmez.

  - soru: |
      Zeynep otel binasını bankaya ipotek ederken mutfak makinelerini açıkça eklenti olarak gösterdi ve bu kayıt tapuda beyanlar sütununa yazıldı. Takipte banka makinelerin de rehnin kapsamında olduğunu ileri sürüyor; Zeynep ise "makineler taşınırdır, ipotek binayla sınırlıdır" diyor. Hangisi doğrudur?
    siklar:
      - "Makineler taşınır oldukları için ipotek kapsamına giremez."
      - "Beyan, makineleri bütünleyici parça yapar; bu nedenle aksi ispat edilemez."
      - "Makineler, kanuna göre eklenti olamayacakları ispat edilmedikçe eklenti sayılır ve rehnin kapsamına girer."
      - "Makineler rehne ancak ayrıca taşınır rehni kurulursa girer."
    dogru: 2
    aciklama: |
      Rehin, taşınmazı bütünleyici parçaları ve eklentileriyle birlikte yükümlü kılar (TMK m. 862/1). Rehnin kuruluşunda açıkça eklenti gösterilen ve beyanlar sütununa yazılan makine gibi şeyler, kanuna göre bu nitelikte olamayacakları ispat edilmedikçe eklenti sayılır (TMK m. 862/2). Bu bir karinedir; aksi ispat edilebilir. Eklenti taşınır olmasına rağmen asıl şeyle birlikte rehin kapsamındadır.

  - soru: |
      Kiraya verilmiş taşınmaz üzerindeki rehinde kira bedelleri rehnin kapsamına hangi andan itibaren girer?
    siklar:
      - "Rehnin paraya çevrilmesi yoluyla takibe başlanmasından veya iflasın ilanından başlayarak paraya çevirme anına kadar işleyen kira bedelleri girer."
      - "İpoteğin tescil edildiği andan itibaren işleyen bütün kira bedelleri girer."
      - "Borcun muaccel olduğu andan itibaren işleyen kira bedelleri girer."
      - "Kira sözleşmesinin yapıldığı andan itibaren işleyen bütün kira bedelleri girer."
    dogru: 0
    aciklama: |
      TMK m. 863/1'e göre kapsama, rehnin paraya çevrilmesi yoluyla takibe başlanmasından veya borçlunun iflasının ilanından başlayarak paraya çevirme anına kadar işleyen kira bedelleri girer. Rehnin kurulduğu an, borcun muaccel olduğu an ya da kira sözleşmesinin tarihi başlangıç noktası değildir.

  - soru: |
      X Bankası, ipotekli binanın kiracısı Y Ltd. Şti.'ye karşı rehin hakkını ne zaman ileri sürebilir?
    siklar:
      - "İpotek tescil edildiği anda, kiracı bilmese de."
      - "Paraya çevirme takibi kiracıya bildirildikten sonra."
      - "Yalnız takip kesinleştikten sonra; kesinleşmeden kiracıya bildirim yapılamaz."
      - "Takip talebi icra dairesine verildiği anda, kiracıya bildirim yapılmasa da."
    dogru: 1
    aciklama: |
      Rehin hakkı, kiracılara karşı ancak cebrî icra yoluyla takibin kendilerine bildirilmesi veya iflas kararının ilanından sonra ileri sürülebilir (TMK m. 863/2). İİK m. 150/b'ye göre icra memuru, alacaklının talebi üzerine takibin kesinleşmesini beklemeden kiracıları da takipten haberdar eder; bu nedenle kesinleşme beklenmez.

  - soru: |
      Bir ana para ipoteği 2015'te tescil edilmiştir ve borçlu aynı zamanda taşınmazın malikidir. TMK m. 864'e göre hangisi doğrudur?
    siklar:
      - "Alacak için zamanaşımı, alacağın muaccel olduğu tarihten itibaren işlemez."
      - "Alacak için zamanaşımı, rehin sözleşmesinin imzalandığı tarihten itibaren işlemez."
      - "Alacak için zamanaşımı, ipotek takibinin başladığı tarihten itibaren işlemez."
      - "Rehnin tapu kütüğüne tescil edilmesinden sonra alacak için zamanaşımı işlemez."
    dogru: 3
    aciklama: |
      TMK m. 864 şöyle der: Rehnin tapu kütüğüne tescil edilmesinden sonra alacak için zamanaşımı işlemez. Başlangıç noktası rehin sözleşmesinin tarihi, muacceliyet ya da takip tarihi değil tescildir. Kuralın üst sınır ipoteği ve borçlu olmayan malik gibi hâllerdeki kapsamı tartışmalıdır; bu soru en yalın kurguyu sorar.

  - soru: |
      Zeynep'in rehinli binasının taşıyıcı kolonlarını izinsiz kesmeye başlaması üzerine çökme tehlikesi doğuyor. Hâkimden yetki almaya zaman olmadığı için banka acil destek kolonları yaptırıyor. Hangisi doğrudur?
    siklar:
      - "Banka hâkimden yetki almadan hiçbir önlem alamaz."
      - "Banka masraflar için Zeynep'e şahsen başvurur; taşınmaz üzerinde hiçbir hak doğmaz."
      - "Gecikmesinde tehlike bulunduğundan banka yetki almadan önlem alabilir; masrafları için tescile gerek olmaksızın ve tescilli diğer yüklerden önce gelen bir rehin hakkı doğar."
      - "Banka önlem alabilir; ancak masraflar için rehin hakkı yalnız tescille doğar ve sırada sona kalır."
    dogru: 2
    aciklama: |
      Gecikmesinde tehlike bulunan hâllerde alacaklı, yetki verilmeden de gerekli önlemleri kendiliğinden alabilir; giderler için taşınmaz üzerinde tescile gerek olmaksızın ve tescil edilmiş diğer yüklerden önce gelen bir rehin hakkı doğar (TMK m. 865).

  - soru: |
      Fatma'nın arsası 1.000.000 TL'lik alacak için ipotekli. Fatma, 40.000 TL değerindeki bir şeridi komşusuna satıyor. Banka şerit üzerindeki rehnin kaldırılmasına karşı çıkabilir mi?
    siklar:
      - "Parça alacağın yirmide birinden az değerli olduğundan, orantılı ödeme yapılırsa veya kalan kısım yeterli güvence oluşturuyorsa banka rehni kaldırmaktan kaçınamaz."
      - "İpotek bölünemez; banka her hâlde karşı çıkabilir."
      - "Banka rızası olmadan rehinli taşınmazın hiçbir parçası devredilemez."
      - "Banka, ancak devredilen parça alacağın yirmide birinden fazlaysa rehni kaldırmak zorundadır."
    dogru: 0
    aciklama: |
      Malik, güvence altına alınan alacağın yirmide birinden az değeri olan bir parçayı devrederse alacaklı, bu parça ile orantılı bir ödeme yapıldığı veya geri kalan kısım yeterli güvence oluşturduğu takdirde o parça üzerindeki rehni kaldırmaktan kaçınamaz (TMK m. 868). 1.000.000 TL'nin yirmide biri 50.000 TL'dir; 40.000 TL bunun altındadır. "Yirmide birinden fazla" ifadesi ise TMK m. 861'in kuralıdır.

  - soru: |
      İpotek tescilinden sonra malik, komşusu lehine geçit irtifakı kurmuştur. Banka "ipotekli taşınmazda sonradan irtifak kurulamaz" diyor. Hangisi doğrudur?
    siklar:
      - "Kurulamaz; malik yeni sınırlı aynî hak kurmayacağını taahhüt etmese bile kanun bunu yasaklar."
      - "İrtifak kurulabilir; malikin yeni sınırlı aynî hak kurmama taahhüdü geçersizdir, ancak paraya çevirmede önceki rehinli alacaklılara zarar veren irtifaklar terkin edilir."
      - "İrtifak kurulabilir ve her hâlde rehinden önce gelir."
      - "Malikin kurmama taahhüdü geçerlidir; ihlal hâlinde irtifak geçersiz olur."
    dogru: 1
    aciklama: |
      Malikin rehinli taşınmaz üzerinde yeni sınırlı aynî haklar kurmayacağını taahhüt etmesi geçerli değildir (TMK m. 869/1). Eski tarihli rehin, alacaklının izni olmadan sonradan kurulan irtifaklardan önce gelir ve paraya çevirmede önceki rehinli alacaklılara zarar veren irtifaklar terkin edilir (TMK m. 869/2). "Rehinli taşınmaza irtifak kurulamaz" demek yanlıştır.

  - soru: |
      Ahmet'in taşınmazında 1. derecede A Bankası, 2. derecede B, 3. derecede C ipoteği vardır. Ahmet A'ya borcunu ödeyip 1. derece ipoteği terkin ettirmiş, B ise "artık 1. derecedeyim" demiştir. Hangisi doğrudur?
    siklar:
      - "B terkinle birlikte kendiliğinden 1. dereceye geçer."
      - "B ve C birlikte birer derece ilerler."
      - "Terkin edilen derece ortadan kalkar; yerine yeni rehin kurulamaz."
      - "B boşalan dereceye geçme hakkı kazanmaz; Ahmet boşalan dereceye yeni bir rehin kurabilir."
    dogru: 3
    aciklama: |
      Bir rehnin terkini, sonraki sırada yer alan rehinli alacaklıya boşalan dereceye geçme hakkı vermez; terkin edilen rehin yerine yeni bir rehin hakkı kurulabilir (TMK m. 871/1 ve TMK m. 871/2). Bu, sabit dereceler sistemidir.

  - soru: |
      Sonraki sıradaki rehinli alacaklılara boşalan dereceye geçme hakkı veren sözleşme bakımından hangisi doğrudur?
    siklar:
      - "Adi yazılı sözleşme hem geçerlilik hem aynî etki için yeterlidir."
      - "Geçerlilik tescile, aynî etki resmî şekle bağlıdır."
      - "Geçerliliği resmî şekilde yapılmasına, aynî etki sağlaması ise tapu kütüğüne şerh verilmesine bağlıdır."
      - "Geçerliliği resmî şekilde yapılmasına bağlıdır; şerh gerekmez, sözleşme kendiliğinden aynî etki doğurur."
    dogru: 2
    aciklama: |
      İlerleme hakkı veren sözleşmelerin geçerliliği resmî şekilde yapılmalarına, aynî etki sağlamaları ise tapu kütüğüne şerh verilmelerine bağlıdır (TMK m. 871/3). İki şart ayrıdır: Resmî şekil eksikse sözleşme geçersizdir; şerh eksikse sözleşme aynî etki doğurmaz.

  - soru: |
      Bir taşınmazda 1. derece ipotek terkin edilmiş ve yerine yeni rehin kurulmamıştır; 2. derecede Mehmet, 3. derecede Zeynep lehine ipotek vardır. Taşınmaz paraya çevrilirse satış bedeli nasıl dağıtılır?
    siklar:
      - "Boş 1. derece için bir pay ayrılır ve bu pay malike ödenir."
      - "Boş derece hesaba katılmaksızın satış bedeli sonraki alacaklılara sıralarına göre dağıtılır."
      - "Satış bedeli, Mehmet ve Zeynep'e alacakları oranında eşit sırada dağıtılır."
      - "Dağıtım, boş derece yeni bir rehinle doldurulduktan sonra yapılabilir."
    dogru: 1
    aciklama: |
      Önce gelen rehin mevcut değilse taşınmazın paraya çevrilmesinde satış bedeli, boş derece hesaba katılmaksızın sonraki alacaklılara sıralarına göre dağıtılır (TMK m. 872). Bu kural yalnız dağıtım içindir; Mehmet'in tapuda 1. dereceye yükseldiği anlamına gelmez (TMK m. 871/1).

  - soru: |
      Mehmet, Ali'ye olan borcu için dükkânını ipotek etmiştir. Resmî senette "Borç vadesinde ödenmezse dükkânın mülkiyeti Ali'ye geçer" kaydı vardır. Borç ödenmemiştir. Hangisi doğrudur?
    siklar:
      - "Mülkiyetin geçeceğine ilişkin hüküm geçersizdir; Ali alacağını satış bedelinden elde etme hakkına sahiptir."
      - "Hüküm resmî senette yer aldığı için geçerlidir; Ali borç ödenmeyince malik olur."
      - "Hüküm geçerlidir, ancak mülkiyetin geçmesi için ayrıca tescil gerekir."
      - "Hüküm, yalnız dükkânın değeri borçtan fazlaysa geçersizdir."
    dogru: 0
    aciklama: |
      Borcun ödenmemesi hâlinde rehinli taşınmazın mülkiyetinin alacaklıya geçeceğine ilişkin sözleşme hükmü geçersizdir (TMK m. 873/2). Alacaklı, alacağını rehinli taşınmazın satış bedelinden elde etme hakkına sahiptir (TMK m. 873/1). Resmî şekil bu hükmü geçerli kılmaz ve değer karşılaştırması aranmaz.

  - soru: |
      TMK m. 875'e göre rehnin güvencesine giren faizi doğru gösteren ifade hangisidir?
    siklar:
      - "Rehin tescilinden itibaren işleyen bütün faizler, süre ve miktar sınırı olmaksızın."
      - "Yalnız takip talebinden önceki son bir yıllık faiz."
      - "Zamanaşımına uğramamış bütün faizler; üç yıl zamanaşımı süresidir."
      - "İflasın açıldığı veya rehnin paraya çevrilmesinin istendiği tarihe kadar muaccel olmuş üç yıllık faiz ile son vadeden başlayarak işleyen faiz."
    dogru: 3
    aciklama: |
      Güvenceye ana para, takip giderleri ve gecikme faizi ile iflasın açıldığı veya rehnin paraya çevrilmesinin istendiği tarihe kadar muaccel olmuş üç yıllık faiz ve son vadeden başlayarak işleyen faiz girer (TMK m. 875). Üç yıllık süre güvencenin kapsamını sınırlar, zamanaşımı değildir. Daha önce belirlenen faiz oranı sonradan gelen alacaklıların zararına artırılamaz.

olaylar:
  - olay: |
      Ahmet'in Üsküdar'daki dairesi üzerinde şu ipotekler tescillidir: 1. derecede A Bankası lehine 1.000.000 TL, 2. derecede Bahar lehine 500.000 TL, 3. derecede Cemal lehine 300.000 TL. Ahmet, 2025 yılının başında A Bankası'na olan borcunu ödeyerek 1. derece ipoteği tapudan terkin ettirir.

      Bahar, terkinin ardından Ahmet'e giderek "Artık birinci derece alacaklısı benim, tapuda da öyle işlensin" der ve Ahmet'e adi yazılı bir kâğıt imzalatır. Kâğıtta Ahmet'in, boşalan dereceye Bahar'ın geçeceğini kabul ettiği yazılıdır. Kâğıt tapuya şerh edilmez.

      Birkaç hafta sonra Ahmet, Dilek'ten kredi alır ve boşalan 1. dereceye Dilek lehine 800.000 TL'lik yeni bir ipotek kurdurur. Ahmet borçlarını ödeyemez ve daire paraya çevrilir.

      1. Bahar, 1. derece alacaklısı olduğunu ileri sürebilir mi?
      2. Bahar ile Ahmet arasındaki adi yazılı kâğıdın durumu nedir? Geçerli olabilmesi için ne gerekirdi?
      3. Dilek'in ipoteği geçerli midir ve hangi derecededir?
      4. Dilek lehine ipotek kurulmamış olsaydı ve daire 1. derece boşken satılsaydı, satış bedeli nasıl dağıtılırdı?
    olcut:
      - {tespit: "Rehnin güvencesinin tescildeki derece ile sınırlı olması; sonraki derecede rehnin önceki miktarın tescilde belirtilmesiyle kurulması", puan: 10, madde: "TMK m. 870"}
      - {tespit: "Terkinin sonraki rehinli alacaklıya boşalan dereceye geçme hakkı vermemesi; Bahar'ın birinci derece iddiasının yerinde olmaması", puan: 25, madde: "TMK m. 871"}
      - {tespit: "İlerleme sözleşmesinin geçerliliğinin resmî şekle, aynî etkisinin tapu kütüğüne şerhe bağlı olması; adi yazılı kâğıdın geçersizliği ve şerh eksikliği", puan: 25, madde: "TMK m. 871"}
      - {tespit: "Terkin edilen rehin yerine yeni rehin kurulabilmesi; Dilek'in rehninin boşalan 1. derecede tescil sırasına göre yer alması", puan: 20, madde: "TMK m. 1022"}
      - {tespit: "Paraya çevirmede boş derece hesaba katılmaksızın satış bedelinin sonraki alacaklılara sıralarına göre dağıtılması; sıra gözetilerek dağıtım", puan: 20, madde: "TMK m. 872"}
    cozum: |
      **Nitelendirme:** Olay, aynı taşınmaz üzerindeki birden çok ipoteğin dereceleri arasındaki ilişkiye, yani sabit dereceler sistemine ve boşalan derecenin akıbetine ilişkindir.

      **Hukuki sorunlar:** (1) Terkin sonrası sonraki alacaklının ilerleyip ilerlemeyeceği; (2) ilerleme sözleşmesinin geçerliliği; (3) boşalan dereceye yeni rehin kurulabilmesi ve sırası; (4) boş derece varken paraya çevirmede dağıtım.

      **İlgili hükümler:** TMK m. 870, TMK m. 871, TMK m. 872, TMK m. 874, TMK m. 1022.

      **Değerlendirme:**

      *1. Bahar'ın iddiası:* Rehnin sağladığı güvence tescilde belirtilen rehin derecesi ile sınırlıdır (TMK m. 870/1). Farklı sıralarda kurulmuş rehinlerden birinin terkin edilmesi, sonraki sırada yer alan rehinli alacaklıya boşalan dereceye geçme hakkı vermez (TMK m. 871/1). Bu nedenle A Bankası'nın ipoteği terkin edildiği için Bahar kendiliğinden 1. dereceye geçmiş olmaz; Bahar 2. dereceli alacaklı olarak kalır. Tapuda kendi lehine birinci derece işlenmesini isteyemez.

      *2. Adi yazılı kâğıt:* Sonraki sıradaki rehinli alacaklılara boşalan dereceye geçme hakkı veren sözleşmelerin geçerliliği resmî şekilde yapılmalarına, aynî etki sağlamaları ise tapu kütüğüne şerh verilmelerine bağlıdır (TMK m. 871/3). Bahar ile Ahmet arasındaki kâğıt adi yazılıdır; resmî şekil geçerlilik şartı olduğundan kâğıt geçersizdir. Şerh de verilmediğinden aynî etkisi de yoktur. Kâğıdın geçerli olması için sözleşmenin resmî şekilde (2644 sayılı Kanun m. 26) yapılması, aynî etki için ayrıca tapu kütüğüne şerh verilmesi gerekirdi.

      *3. Dilek'in ipoteği:* Terkin edilen rehin yerine yeni bir rehin hakkı kurulabilir (TMK m. 871/2). Ahmet boşalan dereceye Dilek lehine yeni ipotek kurabilir. Rehinler sıralarını ve tarihlerini tescile göre alır (TMK m. 1022/1); Dilek'in ipoteği boşalan 1. derecede, 800.000 TL'lik miktarla yer alır. Bahar'ın adi yazılı kâğıdı bu işlemi engellemez. Bahar'ın şerhli ve resmî bir ilerleme sözleşmesi olmadığı için Dilek'e karşı ileri sürülebilecek aynî bir hakkı yoktur.

      *4. Dilek'in ipoteği olmasaydı:* Ahmet 1. dereceye yeni rehin kurmasaydı, önce gelen rehin mevcut olmayacağından taşınmazın paraya çevrilmesinde satış bedeli, boş derece hesaba katılmaksızın sonraki alacaklılara sıralarına göre dağıtılırdı (TMK m. 872 ve TMK m. 874). Yani önce Bahar, sonra Cemal alacağını alırdı; boş 1. derece için bir pay ayrılmazdı. Bu, Bahar'ın tapuda 1. dereceye yükseldiği anlamına gelmez; TMK m. 871/1 rehinler ayaktayken geçme hakkını reddeder, TMK m. 872 ise yalnız dağıtım kuralıdır.

      **Sonuç:**
      - Bahar 1. derece alacaklısı olduğunu ileri süremez.
      - Adi yazılı kâğıt geçersizdir; geçerlilik için resmî şekil, aynî etki için şerh gerekirdi.
      - Dilek'in 800.000 TL'lik ipoteği geçerlidir ve boşalan 1. derecede yer alır.
      - Dilek'in rehni olmasaydı satış bedeli boş derece gözetilmeden Bahar'a, sonra Cemal'e sırasıyla dağıtılırdı.

  - olay: |
      Zeynep, Bodrum'daki otel binasını 2024'te X Bankası lehine ipotek etmiştir. İpotek kurulurken otelin mutfak makineleri ile otel döşeme eşyası açıkça eklenti olarak gösterilmiş ve tapu kütüğünde beyanlar sütununa yazılmıştır.

      Zeynep, binayı 2025'te Y Ltd. Şti.'ye aylık kira karşılığı kiraya vermiştir. 2026 yılının başında Zeynep, binanın taşıyıcı kolonlarında izinsiz tadilat yaptırmaya başlamıştır. Bu tadilat nedeniyle binanın değeri düşmekte ve çökme tehlikesi doğmaktadır. Hâkimden yetki almaya zaman bulunmadığı için X Bankası, kendi masrafıyla geçici destek kolonları yaptırmıştır.

      Borç ödenmeyince X Bankası, rehnin paraya çevrilmesi yoluyla takip başlatmıştır. Banka, takipte mutfak makinelerini de satışa dahil etmek istemektedir; Zeynep ise "makineler taşınırdır" diye itiraz etmektedir. Ayrıca Y Ltd. Şti., takipten haberi olmadığını ve kirayı Zeynep'e ödemeye devam edeceğini söylemektedir.

      1. Mutfak makineleri ve döşeme eşyası rehnin kapsamında mıdır? Zeynep'in itirazını değerlendiriniz.
      2. Banka, hâkimden yetki almadan önlem alabilir mi? Destek kolonlarının masrafları için bankanın hangi hakkı vardır?
      3. Kira bedelleri hangi tarihten itibaren rehnin kapsamına girer? X Bankası rehin hakkını Y Ltd. Şti.'ye karşı ne zaman ileri sürebilir?
      4. Binanın değeri düştüğüne göre banka Zeynep'ten ne isteyebilir?
    olcut:
      - {tespit: "Rehnin bütünleyici parça ve eklentileri kapsaması; açıkça gösterilip beyanlara yazılan makinelerin aksi ispat edilmedikçe eklenti sayılması, Zeynep'in itirazının taşınır olmakla sonuç vermemesi", puan: 20, madde: "TMK m. 862"}
      - {tespit: "Gecikmesinde tehlike bulunduğunda alacaklının hâkimden yetki almadan gerekli önlemleri alabilmesi", puan: 15, madde: "TMK m. 865"}
      - {tespit: "Önlem giderleri için tescile gerek olmaksızın ve tescilli diğer yüklerden önce gelen rehin hakkı doğması", puan: 15, madde: "TMK m. 865"}
      - {tespit: "Kira bedellerinin takibe başlanmasından paraya çevirme anına kadar işleyen kısmının rehin kapsamına girmesi", puan: 15, madde: "TMK m. 863"}
      - {tespit: "Rehnin kiracıya karşı ancak takibin kendisine bildirilmesinden sonra ileri sürülebilmesi; icra memurunun kiracıyı takipten haberdar edip kiraların icra dairesine ödenmesini emretmesi", puan: 20, madde: "İİK m. 150/b"}
      - {tespit: "Değer düşmesinde alacaklının başka güvence veya eski hâle getirme isteyebilmesi; güvence süresinde verilmezse eksik kısmın ödenmesini isteyebilmesi", puan: 15, madde: "TMK m. 866"}
    cozum: |
      **Nitelendirme:** Olay, ipoteğin kapsamı (eklenti ve kira bedelleri) ile alacaklıyı koruma hükümlerine ilişkindir.

      **Hukuki sorunlar:** (1) Eklenti karinesi; (2) alacaklının önlem alma yetkisi ve giderlerin güvencesi; (3) kira bedellerinin kapsama girmesi ve kiracıya karşı ileri sürülebilirlik; (4) değer düşmesinde alacaklının istemleri.

      **İlgili hükümler:** TMK m. 684, TMK m. 686, TMK m. 862, TMK m. 863, TMK m. 865, TMK m. 866; İİK m. 150/b.

      **Değerlendirme:**

      *1. Eklentiler:* Rehin, taşınmazı bütünleyici parçaları ve eklentileri ile birlikte yükümlü kılar (TMK m. 862/1). Eklenti, asıl şeye sürekli olarak özgülenen ve ona bağlı kılınan taşınır maldır (TMK m. 686/2). Rehnin kuruluşu sırasında makine, otel döşeme eşyası gibi açıkça eklenti olarak gösterilen ve tapu kütüğünde beyanlar sütununa yazılan şeyler, kanuna göre bu nitelikte olamayacakları ispat edilmedikçe eklenti sayılır (TMK m. 862/2). Mutfak makineleri ve döşeme eşyası bu iki şartı karşılar. Zeynep'in "taşınırdır" itirazı sonuç vermez, çünkü eklentinin kendisi zaten taşınır maldır. Zeynep'in kurtulması için bu eşyanın eklenti olamayacağını ispat etmesi gerekir; karine aksi ispat edilebilir ama ispat yükü ona düşer.

      *2. Önlem ve giderler:* Malik değeri düşüren davranışlarda bulunursa alacaklı hâkimden yasaklanmasını isteyebilir; gecikmesinde tehlike bulunan hâllerde ise böyle bir yetki verilmeden de gerekli önlemleri kendiliğinden alabilir (TMK m. 865). Olayda çökme tehlikesi ve zamanın darlığı bulunduğundan banka kendiliğinden destek kolonlarını yaptırabilir. Giderler için banka, taşınmaz üzerinde tescile gerek olmaksızın ve tescil edilmiş diğer yüklerden önce gelen bir rehin hakkına sahip olur (TMK m. 865/3).

      *3. Kira:* Kiraya verilmiş taşınmaz üzerindeki rehnin kapsamına, rehnin paraya çevrilmesi yoluyla takibe başlanmasından itibaren paraya çevirme anına kadar işleyen kira bedelleri girer (TMK m. 863/1). Rehin kurulduğu andan itibaren değil, takibin başlamasından itibaren. Rehin hakkı kiracılara karşı ancak takibin kendilerine bildirilmesinden sonra ileri sürülebilir (TMK m. 863/2). İcra memuru alacaklının talebi üzerine takibin kesinleşmesini beklemeden kiracıyı takipten haberdar eder ve işleyecek kiraların icra dairesine ödenmesini emreder (İİK m. 150/b). Bu bildirim ve emir üzerine Y Ltd. Şti. işleyecek kiraları icra dairesine ödemelidir.

      *4. Değer düşmesi:* Değer düşmüşse alacaklı borçludan başka güvence göstermesini veya taşınmazın eski hâle getirilmesini isteyebilir (TMK m. 866/1). Yeterli güvence hâkimin belirlediği sürede verilmezse banka güvence eksiğini karşılayacak miktardaki alacak kısmının ödenmesini isteyebilir (TMK m. 866/3). Düşme Zeynep'in kusuruyla gerçekleştiğinden TMK m. 867'deki tazminatla sınırlama burada gündeme gelmez.

      **Sonuç:**
      - Makineler ve döşeme eşyası, aksi ispat edilmedikçe eklenti sayılır ve rehnin kapsamındadır.
      - Banka hâkimden yetki almadan önlem alabilir; masrafları için tescilsiz ve diğer yüklerden önce gelen bir rehin hakkı doğar.
      - Kiralar takibin başlamasından itibaren kapsamdadır; rehin Y Ltd. Şti.'ye karşı takip kendisine bildirildikten sonra ileri sürülür.
      - Banka başka güvence veya eski hâle getirme isteyebilir; süresinde verilmezse eksik kısmın ödenmesini ister.

  - olay: |
      Mehmet, Ali'ye olan 2.000.000 TL borcu için kendisine ait iki dükkân üzerine Ali lehine ipotek verir. Resmî senede şu kayıt konulmuştur: "Borç vadesinde ödenmezse dükkânların mülkiyeti Ali'ye geçer." Senette ayrıca faiz oranı da belirlenmiştir. İpotek iki dükkânın tapu kaydına tescil edilir.

      Aradan zaman geçtikten sonra Mehmet, aynı dükkânların ikinci derecesine Can lehine ipotek kurdurur. Ardından Ali ile Mehmet bir ek anlaşma yaparak Ali'nin ipoteğinin faiz oranını yükseltir. Ek anlaşmadan Can'a haber verilmez.

      Borç ödenmez. Ali, Mehmet aleyhine doğrudan haciz yoluyla ilamsız icra takibi başlatmak istemektedir. Ali ayrıca, kendisi iki dükkândan yalnız birinin satışını yeterli görmekte, ancak hangi usulle ilerleyeceğini bilmemektedir.

      1. Mülkiyetin Ali'ye geçeceğine ilişkin kayıt geçerli midir? Ali'nin hakkı nedir?
      2. İki dükkân tek borç için rehnedilebilir mi?
      3. Ali, paraya çevirmeyi hangi taşınmaz için ister ve icra dairesi nasıl davranır?
      4. Yükseltilen faiz oranını Ali, Can'a karşı ileri sürebilir mi? Güvenceye hangi faiz girer?
      5. Ali doğrudan haciz yoluyla takip yapabilir mi?
    olcut:
      - {tespit: "Borcun ödenmemesi hâlinde mülkiyetin alacaklıya geçeceğine ilişkin sözleşme hükmünün geçersizliği (lex commissoria yasağı)", puan: 20, madde: "TMK m. 873"}
      - {tespit: "Alacaklının hakkının alacağını rehinli taşınmazın satış bedelinden elde etmek olması", puan: 10, madde: "TMK m. 873"}
      - {tespit: "İki dükkânın aynı malike ait olması nedeniyle aynı borç için rehnedilebilmesi", puan: 10, madde: "TMK m. 855"}
      - {tespit: "Paraya çevirme isteminin taşınmazların tamamı hakkında yapılması; icra dairesinin yalnız gerektiği kadarını paraya çevirmesi", puan: 15, madde: "TMK m. 873"}
      - {tespit: "Daha önce belirlenmiş faiz oranının sonradan gelen alacaklının zararına artırılamaması; Can'a karşı ileri sürülememesi", puan: 20, madde: "TMK m. 875"}
      - {tespit: "Güvenceye giren faizin muaccel üç yıllık faiz ile son vadeden işleyen faizle sınırlı olması", puan: 10, madde: "TMK m. 875"}
      - {tespit: "Rehinle güvenceli alacakta kural olarak yalnız rehnin paraya çevrilmesi yoluyla takip yapılabilmesi; rehin yetmezse kalan için haciz veya iflas", puan: 15, madde: "İİK m. 45"}
    cozum: |
      **Nitelendirme:** Olay, iki taşınmaz üzerinde kurulan ipoteğin paraya çevrilmesine, mülkiyet geçirme kaydının geçersizliğine ve sonradan gelen alacaklı karşısında faiz artırımının sınırına ilişkindir.

      **Hukuki sorunlar:** (1) Lex commissoria yasağı; (2) birden çok taşınmazın rehni; (3) paraya çevirmenin kapsamı; (4) faiz oranının artırılması ve güvencenin kapsamı; (5) takip yolu.

      **İlgili hükümler:** TMK m. 855, TMK m. 873, TMK m. 874, TMK m. 875; İİK m. 45, İİK m. 148, İİK m. 149, İİK m. 150/c.

      **Değerlendirme:**

      *1. Mülkiyet kaydı:* Borcun ödenmemesi hâlinde rehinli taşınmazın mülkiyetinin alacaklıya geçeceğine ilişkin sözleşme hükmü geçersizdir (TMK m. 873/2). Senedin resmî olması bu hükmü geçerli kılmaz. Ali'nin hakkı, alacağını rehinli taşınmazın satış bedelinden elde etmektir (TMK m. 873/1); dükkânların maliki olamaz. Kanun yalnız bu hükmün geçersiz olduğunu söyler.

      *2. İki dükkân:* Birden çok taşınmazın aynı borç için rehnedilmesi, taşınmazların aynı malike veya borçtan müteselsilen sorumlu olan maliklere ait olmalarına bağlıdır (TMK m. 855/1). İki dükkân da Mehmet'e aittir; bu şart sağlanmıştır.

      *3. Paraya çevirme:* Aynı alacak için birden çok taşınmaz rehnedilmişse rehnin paraya çevrilmesi istemi taşınmazların tamamı hakkında yapılır; ancak icra dairesi onlardan yalnız gerektiği kadarını paraya çevirir (TMK m. 873/3). Ali bu nedenle istemi iki dükkân için birlikte yapar. İcra dairesi bir dükkânın satışıyla alacak karşılanıyorsa diğerini paraya çevirmez. Takip talebi icra dairesine verilir (İİK m. 148); icra emrinde borcun otuz gün içinde ödenmesi istenir (İİK m. 149) ve takibin başladığı tapuya bildirilerek şerh verilir (İİK m. 150/c). Satış bedeli alacaklılara sıralarına göre dağıtılır (TMK m. 874): önce Ali, kalan olursa Can.

      *4. Faiz:* Daha önce belirlenmiş olan faiz oranı, sonradan gelen alacaklıların zararına olarak artırılamaz (TMK m. 875 son fıkra). Can sonradan gelen alacaklıdır; Mehmet ile Ali arasındaki artırım Can'a karşı ileri sürülemez. Güvenceye giren faiz ayrıca TMK m. 875/3 ile sınırlıdır: Rehnin paraya çevrilmesinin istendiği tarihe kadar muaccel olmuş üç yıllık faiz ile son vadeden başlayarak işleyen faiz.

      *5. Takip yolu:* Rehinle temin edilmiş alacağın borçlusu iflasa tabi olsa bile alacaklı yalnız rehnin paraya çevrilmesi yoluyla takip yapabilir; ancak rehnin tutarı borcu ödemeye yetmezse kalan alacağını iflas veya haciz yoluyla takip edebilir (İİK m. 45/1). Bu nedenle Ali önce rehnin paraya çevrilmesi yolunu izler; doğrudan haciz yoluna kural olarak gidemez.

      **Sonuç:**
      - Mülkiyetin Ali'ye geçeceğine ilişkin kayıt geçersizdir; Ali satış bedelinden alacağını alabilir.
      - İki dükkân aynı malike ait olduğundan aynı borç için rehnedilebilir.
      - Paraya çevirme istemi iki dükkân için birlikte yapılır; icra dairesi gerektiği kadarını satar.
      - Artırılan faiz Can'a karşı ileri sürülemez; güvence kapsamı TMK m. 875/3 ile sınırlıdır.
      - Ali kural olarak önce rehnin paraya çevrilmesi yoluyla takip yapmalıdır.

kartlar:
  - on: "Taşınmaz rehni hangi şekillerde kurulabilir? (TMK m. 850)"
    arka: "Ancak ipotek, ipotekli borç senedi veya irat senedi şeklinde. Sayım sınırlıdır."
  - on: "Taşınmaz rehni hangi alacak için kurulur? (TMK m. 851/1)"
    arka: "Miktarı Türk parası ile gösterilen belli bir alacak için. Miktar belli değilse taraflar alacaklının bütün istemlerini karşılayacak üst sınırı belirtir."
  - on: "Yabancı para üzerinden rehin hangi alacaklar için kurulabilir?"
    arka: "Yalnız kredi kuruluşlarınca yabancı para üzerinden veya yabancı para ölçüsüyle verilen krediler için. Aynı derecede birden fazla para türü kullanılamaz (TMK m. 851/2)."
  - on: "TMK m. 851/4'te yabancı para cinslerini kim belirler?"
    arka: "Cumhurbaşkanı. Eskiden Bakanlar Kurulu'ydu; 2018'de 700 sayılı Kanun Hükmünde Kararname ile değişti. Hesapta Merkez Bankası döviz alış kuru esastır."
  - on: "Rehnin hangi taşınmazlar üzerinde kurulabilmesi aranır? (TMK m. 853 ve TMK m. 854)"
    arka: "Tapuya kayıtlı taşınmazlar üzerinde. Bölünen taşınmazın parselleri ayrı ayrı kaydedilmedikçe rehne konu olamaz."
  - on: "Birden çok taşınmaz tek borç için nasıl rehnedilir? (TMK m. 855)"
    arka: "Aynı malike veya müteselsil sorumlu maliklere aitse birlikte. Diğer hâllerde her taşınmazın alacağın ne miktarı için güvence olduğu belirtilir; anlaşma yoksa tapu idaresi değer oranında dağıtır."
  - on: "Taşınmaz rehni nasıl kurulur? (TMK m. 856)"
    arka: "Tescille. Kurma sözleşmesinin geçerliliği resmî şekilde yapılmasına bağlıdır. Resmî senedi tapu sicil görevlileri düzenler (2644 sayılı Kanun m. 26)."
  - on: "Paylı ve elbirliği mülkiyetinde rehin? (TMK m. 857)"
    arka: "Paylı mülkiyette paydaş kendi payını rehnedebilir. Elbirliğinde pay rehni yoktur; taşınmaz ancak bütün olarak ve maliklerin tamamı adına rehnedilir."
  - on: "Taşınmaz rehni nasıl sona erer? (TMK m. 858)"
    arka: "Tescilin terkini veya taşınmazın tamamen yok olmasıyla. Terkin için kaydın hak sağladığı kişilerin yazılı beyanı gerekir (TMK m. 1014)."
  - on: "Rehin neleri kapsar? (TMK m. 862)"
    arka: "Taşınmazı, bütünleyici parçaları ve eklentileriyle birlikte. Açıkça eklenti gösterilip beyanlara yazılan şeyler, aksi ispat edilmedikçe eklenti sayılır."
  - on: "Eklenti sayılmak için beyan şart mıdır?"
    arka: "Hayır. TMK m. 686'daki tanıma uyan şey zaten eklentidir. Beyan yalnız TMK m. 862/2'deki karineyi doğurur."
  - on: "Kira bedelleri rehin kapsamına ne zaman girer? (TMK m. 863/1)"
    arka: "Paraya çevirme takibine başlanmasından veya iflasın ilanından başlayarak paraya çevirme anına kadar işleyen kira bedelleri."
  - on: "Rehin hakkı kiracıya karşı ne zaman ileri sürülür? (TMK m. 863/2)"
    arka: "Takibin kendisine bildirilmesinden veya iflas kararının ilanından sonra. İcra memuru takibin kesinleşmesini beklemeden kiracıyı haberdar eder (İİK m. 150/b)."
  - on: "TMK m. 864'ün kuralı nedir?"
    arka: "Rehnin tapu kütüğüne tescilinden sonra alacak için zamanaşımı işlemez. Başlangıç tescildir; kapsamı tartışmalıdır."
  - on: "Gecikmesinde tehlike varsa alacaklı ne yapabilir? (TMK m. 865)"
    arka: "Hâkimden yetki almadan gerekli önlemleri kendiliğinden alabilir. Giderler için tescilsiz ve tescilli diğer yüklerden önce gelen rehin hakkı doğar."
  - on: "Değer düşmesinde alacaklı ne isteyebilir? (TMK m. 866 ve TMK m. 867)"
    arka: "Başka güvence veya eski hâle getirme; süresinde verilmezse eksik kısmın ödenmesi. Değer kusursuz düşmüşse malikin aldığı tazminatla sınırlı."
  - on: "Yirmide bir kuralı iki yerde nasıl işler?"
    arka: "TMK m. 861: bedel alacağın yirmide birinden fazlaysa rızasız ödenemez. TMK m. 868: devredilen parça yirmide birinden az değerliyse alacaklı rehni kaldırmaktan kaçınamaz."
  - on: "Malik rehinli taşınmaza irtifak kurabilir mi? (TMK m. 869)"
    arka: "Evet; kurmama taahhüdü geçersizdir. Ama paraya çevirmede önceki rehinli alacaklılara zarar veren irtifak terkin edilir."
  - on: "Rehnin güvencesi neyle sınırlıdır? (TMK m. 870)"
    arka: "Tescilde belirtilen rehin derecesiyle. Sonraki derecede rehin, önceki derecenin miktarı tescilde belirtilerek kurulur."
  - on: "Önceki derece terkin edilince sonraki alacaklı ilerler mi? (TMK m. 871)"
    arka: "Hayır; boşalan dereceye geçme hakkı yoktur. Yerine yeni rehin kurulabilir."
  - on: "İlerleme sözleşmesinin iki şartı? (TMK m. 871/3)"
    arka: "Geçerlilik için resmî şekil, aynî etki için tapu kütüğüne şerh."
  - on: "Boş derece paraya çevirmede nasıl işlenir? (TMK m. 872)"
    arka: "Boş derece hesaba katılmaksızın satış bedeli sonraki alacaklılara sıralarına göre dağıtılır."
  - on: "Lex commissoria yasağı nedir? (TMK m. 873/2)"
    arka: "Borcun ödenmemesi hâlinde rehinli taşınmazın mülkiyetinin alacaklıya geçeceğine ilişkin sözleşme hükmü geçersizdir. Alacaklı satış bedelinden alma hakkına sahiptir."
  - on: "Üç yıllık faiz neyi anlatır? (TMK m. 875)"
    arka: "Zamanaşımını değil, güvencenin kapsamını: İflasın açıldığı veya paraya çevirmenin istendiği tarihe kadar muaccel üç yıllık faiz ile son vadeden işleyen faiz. Oran sonradan gelen alacaklının zararına artırılamaz."
