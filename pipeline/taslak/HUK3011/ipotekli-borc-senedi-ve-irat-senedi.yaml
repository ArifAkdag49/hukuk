  - id: "1060119500"
    ozet: |
      Bir borçlunun dava dışı üçüncü kişiye karşı doğmuş ve doğacak borçları için 27.01.2016 tarihli resmî senetle o kişi lehine 600.000 TL'lik ipotek kurulmuş, ipotek 19.07.2016'da alacaklıya devredilmiştir. Alacaklı noter ihtarından sonra ipoteğin paraya çevrilmesi yoluyla ilamsız takip başlatmış, borçlunun itirazı üzerine itirazın kaldırılmasını istemiştir. İlk derece mahkemesi ipotek resmî senedini yeterli belge saymış, itirazı kısmen kaldırmış; bölge adliye mahkemesi iki tarafın başvurusunu esastan reddetmiştir. Yargıtay 12. Hukuk Dairesi alacaklının temyizini reddetmiş, borçlunun temyizini kabul ederek bölge adliye mahkemesi kararını kaldırmış ve ilk derece mahkemesi kararını bozmuştur. Gerekçeye göre ipotek alacağa bağlı fer'i sınırlı ayni haktır; ipotek senedi, ipotekli borç senedi ve irat senedinden farklı olarak alacağın varlığını göstermez, yalnız rehin hakkını ispata yarar. İpotek kesin borç ipoteği değildir, senette alacağı gösteren bir ibare yoktur ve temlik belgesi sunulmamıştır; yalnız ipoteğin devri alacağın temliki anlamına gelmez ve takip hakkı vermez. Konuya katkısı: ipotek belgesi ile iki senet arasındaki farkı, yani senetlerin alacağı da göstermesini ortaya koyar.
  - id: "1040131000"
    ozet: |
      Davacı alıcı, vekili aracılığıyla 08.04.2015 tarihli resmî senetle davalıdan mesken nitelikli bir bağımsız bölüm satın almış; bedelin bir kısmı peşin ödenmiş (davalının savunmasına göre 7.000 TL), kalan 95.000 TL için satıcı lehine ipotek kurulmuştur. Davalı ipoteğin paraya çevrilmesi yoluyla takipte 05.11.2015'te ödeme emri gönderince davacı, belgeyi "resmi ipotekli borç senedi" diye nitelemiş, vekilin ipotek kurma yetkisi bulunmadığını ileri sürerek ipoteğin fekki, menfi tespit, takibin iptali ve tazminat istemiştir. Dava ilk derece mahkemesince vekilin özel yetkisi bulunmadığı gerekçesiyle kabul edilmiş; sonraki aşamalardan sonra yeniden kabul kararı verilince davalı temyiz etmiş, Yargıtay 7. Hukuk Dairesi kararı bozmuştur. Daire, ilgili hukukun TMK m. 893 ve TBK m. 504 olduğunu belirtmiş; ipoteğin satış bedelinin ödenmeyen kısmının karşılığı olduğunu, taşınmazı satın almaya yetkili vekilin bedelin ödenmesi konusunda da yetkili olduğunu ve ödenmeyen kısım için kanuni ipotek tesis edebileceğini kabul etmiştir. Konuya katkısı: taraflar belgeyi "ipotekli borç senedi" diye adlandırsa da uyuşmazlık satıcı ipoteği ve vekâlet hükümleriyle çözülmüştür. Karar belgenin ipotekli borç senedi olmadığını açıkça tespit etmemiştir; yalnız adlandırmanın gevşek kullanılabildiğini düşündürür ve TMK m. 898 vd. uygulanmamıştır.
  - id: "356104700"
    ozet: |
      21.10.2011'de banka lehine, açılmış ve açılacak kredilerden doğmuş ve doğacak borçların 83.520 TL'ye kadarki kısmı için ipotek kurulmuş; taşınmaz 08.02.2013'te 45.000 TL'ye alacağa mahsuben bankaya ihale edilmiş ve 06.05.2013'te 21.834,91 TL bakiye için İİK m. 152 kapsamında rehin açığı belgesi düzenlenmiştir. Aynı dosyada sonraki bazı haciz talepleri yerine getirilmiş, 22.04.2016 tarihli talep ise reddedilerek dosyanın rehin açığı belgesiyle kapatılmasına karar verilmiştir. İcra mahkemesi alacaklının şikâyetini reddetmiş, Yargıtay 12. Hukuk Dairesi önce bu kararı onamış; alacaklının karar düzeltme istemi üzerine onamayı kaldırıp icra mahkemesi kararını oybirliğiyle bozmuştur. Dairenin ilkesi şudur: İİK m. 152, satışın kesinleşmesinden itibaren bir yıl içinde olmak kaydıyla alacaklıya aynı dosyadan yeniden icra emri düzenletmeden haciz yapma veya ayrı haciz takibinde icra ve ödeme emri göndermeden devam etme kolaylığı tanır. Karar ipotekle ilgilidir ve irat senedine değinmez; 22.04.2016 tarihli talebin süre bakımından nasıl değerlendirildiği de karardan açık çıkmamaktadır. Konunun bağlantısı yalnız şudur: Kararın aktardığı İİK m. 152/2 rehin açığı için haciz veya iflas yolunu alacağı irat senedinden doğmayan alacaklıya tanır; bu, TMK m. 903/3'ün icra hukukundaki yansımasıdır (bu bağlantı metinlerin birlikte okunmasıdır, kararın sözü değildir).

sorular:
  - soru: |
      İpotekli borç senedi hakkında TMK m. 898'e göre hangisi doğrudur?
    siklar:
      - "Yalnız rehin hakkını doğurur; alacak ayrıca ve senet dışında ispat edilir."
      - "Taşınmaz yükü şeklinde kurulmuş, kişisel borç doğurmayan bir alacak hakkıdır."
      - "Taşınmaz rehniyle güvence altına alınmış kişisel bir alacak meydana getirir."
      - "Tescil edilmeden düzenlenen senetle kurulur; tescil yalnız bilgi verir."
    dogru: 2
    aciklama: |
      TMK m. 898'e göre ipotekli borç senedi, taşınmaz rehniyle güvence altına alınmış kişisel bir alacak meydana getirir; alacak ve rehin aynı işlemle doğar. Taşınmaz yükü şeklindeki, kişisel borç doğurmayan hak irat senedidir (TMK m. 903). Senedin sonuçları ise tescil tarihinden doğar (TMK m. 911/2); tescil yalnız bilgi veren bir kayıt değildir.

  - soru: |
      Mert'in dükkânına tapu idaresince resmen 1.000.000 TL değer biçilmiştir. Mert, ipotekli borç senedi yoluyla 1.200.000 TL'lik rehin kurmak istemektedir. Hangisi doğrudur?
    siklar:
      - "1.200.000 TL'nin tamamı için kurulabilir; değer biçme yalnız bilgi amaçlıdır."
      - "Rehin, biçilmiş değeri aşan miktar için kurulamaz; 1.000.000 TL'ye kadar kurulabilir."
      - "Değer taraflarca serbestçe belirlenir, bu nedenle sınır yoktur."
      - "Senet, biçilen değerin beşte üçüne kadar düzenlenebilir."
    dogru: 1
    aciklama: |
      TMK m. 899/2'ye göre biçilmiş değeri aşan miktar için ipotekli borç senedi yoluyla rehin kurulamaz. Değeri tapu idaresi resmen biçer (TMK m. 899/1), taraflar belirlemez. Beşte üç oranı irat senedine aittir (TMK m. 904/1); ipotekli borç senedine taşınamaz.

  - soru: |
      TMK m. 900'e göre, aksi kararlaştırılmadıkça ipotekli borç senedindeki alacak nasıl muaccel olur?
    siklar:
      - "Faizlerin ödenmesi gereken tarihte; bu tarihten en az altı ay önce alacaklı veya borçlu tarafından diğer tarafa yapılacak bildirimle."
      - "Her altı yıllık dönemin sonunda, bir yıl önce yapılan bildirimle."
      - "Senedin düzenlendiği tarihten itibaren on yıl geçmekle kendiliğinden."
      - "Yalnız alacaklının noter aracılığıyla yaptığı ihtarla ve ihtardan hemen sonra."
    dogru: 0
    aciklama: |
      TMK m. 900 yedek hüküm olarak alacağın faiz ödeme tarihinde, bu tarihten en az altı ay önce yapılan bildirimle muaccel olacağını söyler. Bildirimi alacaklı da borçlu da yapabilir. Altı yıllık dönem ve bir yıllık bildirim, irat senedinde malikin yükten kurtarmasına ilişkindir (TMK m. 906/1).

  - soru: |
      Borçtan kişisel olarak sorumlu olmayan rehinli taşınmaz maliki hakkında TMK m. 901'e göre hangisi doğrudur?
    siklar:
      - "Malik de borçlu gibi kişisel olarak ve bütün malvarlığıyla sorumlu olur."
      - "Hiçbir hüküm uygulanmaz; malik alacaklıya karşı sorumsuzdur."
      - "Malik yalnız kendi kişisel def'ilerini ileri sürebilir; borçlunun def'ilerini ileri süremez."
      - "İpoteğe ilişkin hükümler uygulanır ve malik alacaklıya karşı borçluya ait bütün def'ileri ileri sürebilir."
    dogru: 3
    aciklama: |
      TMK m. 901/1, borçtan kişisel sorumlu olmayan malik hakkında ipotek hükümlerinin uygulanacağını; TMK m. 901/2 ise malikin borçluya ait bütün def'ileri ileri sürebileceğini söyler. Malik yalnız taşınmazıyla sorumlu olduğundan kişisel sorumluluk yoktur. Bu hükmün TMK m. 927 ile ilişkisi doktrinde tartışılır; soru yalnız madde lafzına dayanır.

  - soru: |
      İrat senedi hakkında TMK m. 903'e göre hangisi doğrudur?
    siklar:
      - "Taşınmaz yükü şeklinde kurulmuş bir alacak hakkı doğurur; kişisel borç doğurmaz ve borcun sebebini göstermez."
      - "Taşınmaz rehniyle güvenceli kişisel bir alacak doğurur."
      - "Güvencesini yalnız bina yapılmış arsalar oluşturabilir; tarım arazisi olamaz."
      - "Alacağın ödenmesi karşı edimin yerine getirilmesi koşuluna bağlanabilir."
    dogru: 0
    aciklama: |
      TMK m. 903/1 irat senedini taşınmaz yükü şeklinde kurulmuş bir alacak hakkı olarak tanımlar; TMK m. 903/3'e göre kişisel borç doğurmaz ve borcun sebebini göstermez. Kişisel alacak doğuran ipotekli borç senedidir. Güvence tarım arazisi, konut veya bina yapılabilecek arsa olabilir (TMK m. 903/2). Koşul ve karşı edim kaydı iki senette de yasaktır (TMK m. 909).

  - soru: |
      Zeynep'in tarım arazisinin gelir değeri tapu idaresince 500.000 TL olarak belirlenmiştir. Bu arazi üzerinde irat senedi ile en çok ne kadarlık alacak güvence altına alınabilir?
    siklar:
      - "250.000 TL"
      - "400.000 TL"
      - "300.000 TL"
      - "500.000 TL"
    dogru: 2
    aciklama: |
      TMK m. 904/1'e göre tarım arazisinde alacak miktarı arazinin gelir değerinin beşte üçünü aşamaz. 500.000 TL'nin beşte üçü 300.000 TL'dir. Değer tapu idaresince resmen belirlenir (TMK m. 904/2); taraflar sınırı kendileri artıramaz.

  - soru: |
      Değer sınırı bakımından aşağıdaki eşleştirmelerden hangisi doğrudur?
    siklar:
      - "İki senet için de sınır, taşınmazın biçilmiş değerinin beşte üçüdür."
      - "İpotekli borç senedi: tapu idaresince biçilmiş değer; irat senedi: gelir değerine dayalı hesabın beşte üçü."
      - "İpotekli borç senedi: gelir değerinin beşte üçü; irat senedi: tapu idaresince biçilmiş değer."
      - "İki senet için de kanunda bir değer sınırı yoktur; taraflar serbestçe belirler."
    dogru: 1
    aciklama: |
      İpotekli borç senedinde biçilmiş değeri aşan miktar için rehin kurulamaz (TMK m. 899/2). İrat senedinde alacak, tarım arazisinde gelir değerinin, diğer taşınmazlarda gelir değeri ile bina ve arsa değerleri ortalamasının beşte üçünü aşamaz (TMK m. 904/1). İki ölçüt birbirine taşınmaz.

  - soru: |
      TMK m. 905'e göre irat senedi bakımından değer biçilirken gereken özenin gösterilmemesinden doğan sorumluluk hakkında hangisi doğrudur?
    siklar:
      - "Yalnız değer biçen memur kişisel olarak sorumludur; Devlet sorumlu tutulamaz."
      - "Sorumluluk, değer biçilmesini isteyen malike aittir."
      - "Değer biçmesi kesin ve bağlayıcıdır; hiç kimse sorumlu tutulamaz."
      - "Devlet sorumludur; kusuru olan memurlara rücu edebilir."
    dogru: 3
    aciklama: |
      TMK m. 905'e göre değer biçilmesinde gereken özenin gösterilmemesinden Devlet sorumludur ve kusuru olan memurlara rücu edebilir. Tapu sicilinin tutulmasından doğan zararlara ilişkin genel hüküm TMK m. 1007'dedir.

  - soru: |
      Zeynep'in arazisi üzerinde Can lehine irat senedi vardır; sözleşmede malikin yükten kurtarma için iki yıl önceden bildirimde bulunacağı kararlaştırılmıştır. Araziyi satın alan Burak yükten kurtarma istemektedir. TMK m. 906/1'e göre hangisi doğrudur?
    siklar:
      - "Sözleşmedeki daha uzun süre Burak'ı bağlamaz; her altı yıllık dönem sonu için bir yıl önce bildirip bedelini ödeyerek yükten kurtarma isteyebilir."
      - "İki yıllık süre bağlayıcıdır; Burak daha kısa süreyle bildirim yapamaz."
      - "Burak her on yıllık dönem sonu için altı ay önce bildirimle yükten kurtarma isteyebilir."
      - "Yükten kurtarma yalnız alacaklı Can'ın rızasıyla mümkündür; malik bunu isteyemez."
    dogru: 0
    aciklama: |
      TMK m. 906/1'e göre malik, sözleşmeyle daha uzun bir bildirim süresi kabul edilmiş olsa bile, her altı yıllık dönemin sonu için bir yıl önce bildirmek ve bedelini ödemek koşuluyla taşınmazın yükten kurtarılmasını isteyebilir. On yıllık dönem alacaklının ödeme istemine ilişkindir (TMK m. 906/2). Burak taşınmazı edindiği için irat senedinin borçlusu olmuştur (TMK m. 907/2).

  - soru: |
      Zeynep, üzerinde Can lehine irat senedi bulunan tarım arazisini Burak'a satmış ve tescil yapılmıştır. Hangisi doğrudur?
    siklar:
      - "Zeynep, Can'ın bir yıl içinde saklı tutma bildirimi yapmaması hâlinde borçtan kurtulur."
      - "Zeynep ve Burak, Can'a karşı birlikte ve müteselsilen borçlu olur."
      - "Burak irat senedinin borçlusu olur; Zeynep başka bir işleme gerek kalmaksızın borcundan kurtulur."
      - "Borç Burak'a geçmez; Can'ın yazılı rızası olmadıkça Zeynep borçlu kalır."
    dogru: 2
    aciklama: |
      TMK m. 907/1-2'ye göre irat senedinin borçlusu yüklü taşınmazın malikidir; taşınmazı edinen borçlu olur ve eski malik başka bir işleme gerek kalmaksızın kurtulur. Alacaklının bir yıl içindeki saklı tutma bildirimine bağlı kurtulma, ipotekte yeni malikin borcu yüklenmesi hâline ilişkindir (TMK m. 888/2).

  - soru: |
      Yüklü taşınmaz parsellere bölünmüş ve borcun parsellere dağıtımı kesinleşmiştir. İrat senedinin alacaklısı TMK m. 908/3'e göre ne yapabilir?
    siklar:
      - "Dağıtımın kesinleşmesinden başlayarak bir ay içinde yapacağı bildirimle bir yıl içinde alacağın ödenmesini borçludan isteyebilir."
      - "Dağıtımın kesinleşmesinden başlayarak bir ay içinde yapacağı bildirimle bir yıl içinde irat senedinin satın alınmasını isteyebilir."
      - "Altı ay içinde bildirimde bulunarak bütün parsellerden müteselsilen ödeme isteyebilir."
      - "Hiçbir istemde bulunamaz; dağıtım alacaklıyı bağlar."
    dogru: 1
    aciklama: |
      TMK m. 908/3'e göre alacaklı, dağıtımın kesinleşmesinden başlayarak bir ay içinde yapacağı bildirimle bir yıl içinde irat senedinin satın alınmasını isteyebilir. Bir yıl içinde alacağın ödenmesinin istenmesi, ipotekli taşınmazın bölünmesinde geçerli olan kuraldır (TMK m. 889/2). Süreler aynıdır, istenen şey farklıdır.

  - soru: |
      Selin Hanım, ipotekli borç senedine "alacaklı malı teslim ederse ödenecektir" kaydının konulmasını istemektedir. TMK m. 909'a göre hangisi doğrudur?
    siklar:
      - "Koşul kaydı konabilir, karşı edim kaydı konamaz."
      - "Tapu memurunun onayıyla bu kayıt konabilir."
      - "Kayıt yalnız irat senedinde yasaktır; ipotekli borç senedinde serbesttir."
      - "İpotekli borç senedi koşul ve karşı edim kaydı içeremez; bu kayıt konamaz."
    dogru: 3
    aciklama: |
      TMK m. 909, ipotekli borç senedinin ve irat senedinin koşul ve karşı edim kaydı içeremeyeceğini söyler. "Alacaklı malı teslim ederse ödenecektir" kaydı hem koşul hem karşı edim niteliği taşır. Yasak iki senet için de geçerlidir; tapu memurunun onayı yasağı ortadan kaldırmaz.

  - soru: |
      İpotekli borç senedi düzenlendiğinde, dayanak olan borç ilişkisi TMK m. 910'a göre ne olur?
    siklar:
      - "Yenileme yoluyla sona erer; aksine yapılan sözleşme yalnız tarafları ve iyiniyetli olmayan üçüncü kişileri etkiler."
      - "Aynen varlığını sürdürür; senet yalnız bir ispat aracıdır."
      - "Baştan itibaren hükümsüz sayılır."
      - "Ancak taraflar açıkça yenilemeyi kararlaştırırsa sona erer; senet düzenlenmesi tek başına yenileme sayılmaz."
    dogru: 0
    aciklama: |
      TMK m. 910/1'e göre senedin düzenlenmesiyle dayanak borç ilişkisi yenileme yoluyla sona erer; aksine sözleşme yalnız tarafları ve iyiniyetli olmayan üçüncü kişileri etkiler (TMK m. 910/2). Yenilemeyi açık iradeye bağlayan şık TBK m. 133'teki genel kuralı yansıtır: yenileme için açık irade gerekir ve yeni alacak senedi düzenlenmesi açık irade olmadıkça yenileme sayılmaz. TMK m. 910 ise yenileme sonucunu kanundan bağlar. Hükmün niteliği doktrinde tartışmalıdır, ama soru yalnız madde metnine dayanır.

  - soru: |
      Bir ipotekli borç senedi için rehin 1 Mart'ta tescil edilmiş, senet ise 15 Mart'ta düzenlenmiştir. Senedin hukuki sonuçları TMK m. 911/2'ye göre hangi tarihten başlar?
    siklar:
      - "15 Mart"
      - "Senedin alacaklıya teslim edildiği tarih"
      - "1 Mart"
      - "İlk faiz ödeme tarihi"
    dogru: 2
    aciklama: |
      TMK m. 911/2'ye göre senet daha sonra düzenlenmiş olsa bile hukuki sonuçlarını tescil tarihinden başlayarak doğurur. Burada tescil tarihi 1 Mart'tır. Senedin düzenlenme veya teslim tarihi sonucun başlangıcını belirlemez.

  - soru: |
      İpotekli borç senedi ve irat senedinin düzenlenmesi ve alacaklıya verilmesi hakkında TMK m. 912'ye göre hangisi doğrudur?
    siklar:
      - "Senedi noter düzenler; tapu memurunun imzası gerekmez."
      - "Senedi tapu memuru düzenler; üzerinde tapu memuru ile yetkili Hazine temsilcisinin imzaları bulunur ve alacaklıya ancak borçlunun ve malikin yazılı rızasıyla verilir."
      - "Senedi taraflar adi yazılı şekilde düzenler; tapu memuru yalnız onaylar."
      - "Senedi tapu memuru düzenler; imza yalnız tapu memurundadır ve senet alacaklıya yalnız malikin rızasıyla verilir."
    dogru: 1
    aciklama: |
      TMK m. 912'ye göre senetleri tapu memuru düzenler; senetler üzerinde tapu memuru ile yetkili Hazine temsilcisinin imzaları bulunur; senetler alacaklıya veya temsilcisine ancak borçlunun ve yüklü taşınmazın malikinin yazılı rızaları üzerine verilebilir. Hazine temsilcisinin imzası ve hem borçlunun hem malikin rızası eksik olmamalıdır.

  - soru: |
      Alacaklı Hasan İzmir'de, borçlu Ayşe Ankara'da oturmaktadır. Hamile yazılı ipotekli borç senedinden aksi anlaşılmamaktadır. Ayşe ödemelerini nerede yapmak zorundadır?
    siklar:
      - "Ankara'da, kendi yerleşim yerinde; çünkü senet hamile yazılıdır."
      - "Senedi elinde bulunduranın bulunduğu yerde."
      - "Rehnin tescil edildiği tapu müdürlüğünün bulunduğu yerde."
      - "Alacaklının yerleşim yeri olan İzmir'de."
    dogru: 3
    aciklama: |
      TMK m. 916/1'e göre senetten aksi anlaşılmadıkça, senet hamile yazılı olsa bile borçlu bütün ödemelerini alacaklının yerleşim yerinde yapmak zorundadır. Hamile yazılı olması ödeme yerini borçlunun lehine değiştirmez.

  - soru: |
      Mehmet, hamile yazılı ipotekli borç senedinin alacağını Ali'den devralmıştır; devir borçlu Ayşe'ye bildirilmemiştir. Ayşe ana paranın bir kısmını eski alacaklı Ali'ye öder. TMK m. 917'ye göre bu ana para ödemesi hakkında hangisi doğrudur?
    siklar:
      - "Geçerlidir; devir kendisine bildirilmedikçe eski alacaklıya yapılan her ödeme borçluyu kurtarır."
      - "Geçerli değildir; ana para ödemesi ancak ödeme zamanında kendisinin alacaklı olduğunu ispat eden kimseye yapılırsa geçerlidir."
      - "Geçerlidir; çünkü senet hamile yazılıdır ve ödeme alacaklının yerleşim yerinde yapılmıştır."
      - "Yalnız tapu müdürlüğünde yapılmışsa geçerlidir."
    dogru: 1
    aciklama: |
      TMK m. 917/1'deki kolaylık yalnız kupona bağlı olmayan faiz ve yıllık edimler içindir. Ana paranın tamamen veya kısmen ödenmesi ise ancak ödeme zamanında kendisinin alacaklı olduğunu ispat eden kimseye yapılmışsa geçerlidir (TMK m. 917/2). Ali ödeme zamanında alacaklı olmadığından ödeme geçerli değildir. Ödeme yerinin alacaklının yerleşim yeri olması (TMK m. 916/1) ayrı bir kuraldır ve ödemenin kime yapılacağını belirlemez.

  - soru: |
      Elif, ipotekli borç senedi borcunun tamamını ödemiştir. Senet ve tescil bakımından TMK m. 919 ve TMK m. 928'e göre hangisi doğrudur?
    siklar:
      - "Elif senedin iptal edilmemiş olarak geri verilmesini isteyebilir; tescil ancak tarafların veya mahkemenin rehin senedini iptal etmesi üzerine terkin edilebilir."
      - "Tam ödemeyle tescil kendiliğinden sona erer ve tapu memuru kaydı re'sen siler."
      - "Elif, malik sıfatıyla tek başına başvurarak terkin ettirebilir; senedin iptali gerekmez."
      - "Senet süreli kurulmuşsa sürenin bitiminden itibaren otuz gün içinde şerh konulmazsa malikin talebiyle terkin edilir."
    dogru: 0
    aciklama: |
      TMK m. 928'e göre borcun tamamını ödeyen borçlu, senedin iptal edilmemiş olarak geri verilmesini isteyebilir; TMK m. 919'a göre tescil ancak tarafların veya mahkemenin rehin senedini iptal etmesi üzerine terkin edilebilir. Süreli kuruluşa bağlı otuz günlük kural ipoteğe özgüdür (TMK m. 883/2); ipotekli borç senedi için terkin kuralı TMK m. 919'dur.

  - soru: |
      Selin, hamile yazılı bir ipotekli borç senedini iyiniyetle devralmıştır. Senette 300.000 TL, tapu kütüğünde ise 250.000 TL yazmaktadır. TMK m. 922'ye göre hangisi doğrudur?
    siklar:
      - "Senet esas alınır; Selin 300.000 TL'yi isteyebilir."
      - "Alacak tamamen düşer ve Selin hiçbir istemde bulunamaz."
      - "Kütük esas alınır; Selin tapu kütüğüne ilişkin hükümler uyarınca tazminat isteyebilir."
      - "Hâkim senet ile kütükten borçlu lehine olanı serbestçe seçer."
    dogru: 2
    aciklama: |
      TMK m. 922'ye göre senetteki yazı kütükteki tescile uymazsa kütük esas alınır; senedi iyiniyetle edinen kimse tapu kütüğüne ilişkin hükümler uyarınca tazminat isteyebilir. Soru yalnız bu hükmün açık lafzına dayanır.

  - soru: |
      Ayşe, hamile yazılı ipotekli borç senedinin alacağını Mehmet'e devretmek istemektedir. TMK m. 923 ve TMK m. 924'e göre devir hangi koşula bağlıdır?
    siklar:
      - "Devir yalnız adi yazılı sözleşmeyle yapılır; senedin teslimi gerekmez."
      - "Devir rehin senedinin teslim edilmesine bağlıdır; alacak senet üzerindeki zilyetlikle birlikte devredilir."
      - "Devir yalnız tapuda resmî şekilde yapılır ve tapu memurunun onayıyla geçerli olur."
      - "Devir borçlunun ve malikin yazılı rızasına bağlıdır."
    dogru: 1
    aciklama: |
      TMK m. 923/1'e göre senetteki alacak ancak senet üzerindeki zilyetlikle birlikte devredilebilir; TMK m. 924/1'e göre devir rehin senedinin teslim edilmesine bağlıdır. Borçlunun ve malikin yazılı rızası senedin alacaklıya ilk verilişinde aranır (TMK m. 912/3). Adi yazılı devir sözleşmesi tek başına yeterli değildir; ipotekteki alacağın devri ise ayrıdır (TMK m. 891 ve TBK m. 184).

olaylar:
  - olay: |
      Ali, Ayşe'den 400.000 TL borç alır. Ali'nin taşınmazına tapu idaresince resmen 600.000 TL değer biçilir. Taraflar hamile yazılı ipotekli borç senedi düzenletir; rehin tescil edilir. Ödünç ilişkisinin ayrıca süreceğine dair aralarında bir anlaşma yoktur. Senet tapu memuru tarafından düzenlenir, üzerinde tapu memuru ile yetkili Hazine temsilcisinin imzaları bulunur ve Ali'nin yazılı rızasıyla Ayşe'ye verilir.

      Ayşe senedi Mehmet'e teslim ederek alacağı devreder. Mehmet devirden önce Ali'nin Ayşe'ye ana paradan 100.000 TL ödediğini bilmemektedir; bu ödeme ne tapu kütüğüne ne senede işlenmiştir. Mehmet, Ali'den 400.000 TL ister. Ali, 100.000 TL'yi Ayşe'ye zaten ödediğini, bu yüzden en çok 300.000 TL borcu bulunduğunu savunur. Mehmet ise ödemeyi senetten ya da tapu kaydından öğrenemediğini, devir sırasında Ayşe'nin de kendisine bundan söz etmediğini söyler. Ali, kısmi ödemenin tapuya işlenmesi için herhangi bir başvuru yapmadığını kabul etmektedir.

      1. Ali ile Ayşe arasındaki hakkın niteliği nedir? Ödünç ilişkisine ne olmuştur?
      2. Ayşe'nin Mehmet'e devri geçerli midir?
      3. Ali, 100.000 TL'lik ödemeyi Mehmet'e karşı ileri sürebilir mi?
      4. Ali ne yapmalıydı? Taşınmaz için ilk aşamada 700.000 TL'lik senet düzenlenebilir miydi?
    olcut:
      - {tespit: "Senedin rehinle güvenceli kişisel alacak doğurması; dayanak ödünç ilişkisinin yenileme yoluyla sona ermesi", puan: 15, madde: "TMK m. 898"}
      - {tespit: "Biçilmiş değeri aşan miktar için rehin kurulamaması; 700.000 TL'lik senedin düzenlenememesi", puan: 15, madde: "TMK m. 899"}
      - {tespit: "Senedin tapu memurunca, Hazine temsilcisinin imzasıyla düzenlenmesi ve borçlu ile malikin rızasıyla verilmesi", puan: 10, madde: "TMK m. 912"}
      - {tespit: "Alacağın senet üzerindeki zilyetlikle birlikte, senedin teslimiyle devredilmesi", puan: 20, madde: "TMK m. 924"}
      - {tespit: "Tescil edilmeyen ana para ödemesinin iyiniyetle kazanan Mehmet'e karşı ileri sürülememesi", puan: 25, madde: "TMK m. 929"}
      - {tespit: "Def'i sınırı: ödemenin ne tescilden veya senetten doğan def'i ne de Mehmet'e karşı kişisel def'i olması", puan: 10, madde: "TMK m. 927"}
      - {tespit: "Ali'nin kısmi ödemeyi kütüğe tescil ettirip senede yazdırması gerekirdi", puan: 5, madde: "TMK m. 929"}
    cozum: |
      **Nitelendirme:** Taraflar, taşınmaz rehninin ipotek dışındaki türü olan ipotekli borç senedini kullanmıştır (TMK m. 850). Ali'nin taşınmazı güvence, Ayşe alacaklı, Ali hem borçlu hem maliktir. Senet hamile yazılıdır (TMK m. 914/1) ve Ayşe'den Mehmet'e devredilmiştir.

      **Hukuki sorunlar:** (1) Senedin niteliği ve dayanak borca etkisi; (2) rehin miktarının sınırı; (3) devrin geçerliliği; (4) tescil edilmeyen kısmi ödemenin iyiniyetli kazanana karşı ileri sürülmesi.

      **İlgili hükümler:** TMK m. 898, TMK m. 899, TMK m. 910, TMK m. 911, TMK m. 912, TMK m. 923, TMK m. 924, TMK m. 927, TMK m. 929.

      **Değerlendirme:**

      *1. Hakkın niteliği:* İpotekli borç senedi, taşınmaz rehniyle güvence altına alınmış kişisel bir alacak meydana getirir (TMK m. 898). Senedin düzenlenmesiyle dayanak olan ödünç ilişkisi yenileme yoluyla sona erer (TMK m. 910/1). Tarafların aksine bir sözleşmesi olmadığı için bu sonuç doğmuştur. Senet usulüne uygundur: Tapu memuru düzenlemiş, Hazine temsilcisi imzalamış, Ali'nin yazılı rızasıyla verilmiştir (TMK m. 912). Hukuki sonuçlar tescil tarihinden başlar (TMK m. 911/2).

      *2. Değer sınırı:* Tapu idaresi taşınmaza 600.000 TL değer biçmiştir. Biçilen değeri aşan miktar için ipotekli borç senedi yoluyla rehin kurulamaz (TMK m. 899/2). Bu nedenle 700.000 TL'lik bir senet düzenlenemezdi; 400.000 TL'lik alacak için kurulan rehin değer sınırı içindedir.

      *3. Devir:* Nama veya hamile yazılı senetteki alacak ancak senet üzerindeki zilyetlikle birlikte devredilebilir (TMK m. 923/1). Alacağın devri senedin teslim edilmesine bağlıdır (TMK m. 924/1). Ayşe senedi Mehmet'e teslim ettiği için devir geçerlidir; Mehmet alacaklı olmuştur.

      *4. Kısmi ödeme:* Ali, Mehmet'e karşı kendi aleyhine bir değişikliği ileri sürmek ister. Borçlu yalnız tescilden veya senetten doğan def'ileri ve istemde bulunan alacaklıya karşı sahip olduğu kişisel def'ileri ileri sürebilir (TMK m. 927). 100.000 TL'lik ödeme ne tescilde ne senette görünür; ayrıca Mehmet'e karşı Ali'nin kişisel bir def'isi de değildir. Ana paranın kısmen ödenmesi gibi değişiklikler tescil edilmemişse, senette yazılı yıllık edimlerin ödenmiş olması dışında, senedi iyiniyetle kazanan kimseye karşı ileri sürülemez (TMK m. 929/3). Mehmet ödemeyi bilmediğinden iyiniyetlidir. Bu yüzden Ali, ödemeyi Mehmet'e karşı ileri süremez ve Mehmet 400.000 TL'yi isteyebilir. Ali'nin Ayşe ile arasındaki ilişkiden doğan hakları ayrıca değerlendirilir. Ali, kısmi ödemeyi kütüğe tescil ettirip senede yazdırmalıydı; tapu memuru bu tür değişiklikleri senet üzerine de yazar (TMK m. 929/1-2).

      **Sonuç:**
      - Senet rehinle güvenceli kişisel alacak doğurur; ödünç ilişkisi yenileme yoluyla sona ermiştir.
      - 700.000 TL'lik senet düzenlenemezdi; sınır biçilmiş değerdir.
      - Devir senedin teslimiyle geçerlidir.
      - Tescil edilmeyen 100.000 TL'lik ödeme iyiniyetli Mehmet'e karşı ileri sürülemez.

  - olay: |
      Zeynep'in Ankara'daki tarım arazisi üzerinde Can lehine irat senedi kurulacaktır. Tapu idaresi arazinin gelir değerini resmen 500.000 TL olarak belirler. Taraflar senedi 350.000 TL'lik alacak için düzenletmek ister. Sözleşmede ayrıca, malikin yükten kurtarma için iki yıl önceden bildirimde bulunacağı kararlaştırılır.

      Bir süre sonra Zeynep araziyi Burak'a satar ve tescil yapılır. Burak, irat senedinin yükünden kurtulmak ister ve bunun için sözleşmedeki iki yıllık bildirim süresini beklemek zorunda olup olmadığını sorar. Burak yükten kurtarma bedelini ödemeye hazırdır. Zeynep ise satıştan sonra kendisinin hâlâ borçlu sayılıp sayılmayacağını merak etmektedir. Satış sözleşmesinde irat senedine ilişkin ayrıca bir düzenleme yoktur. Can ise ana alacağı için Burak'ın yüklü taşınmaz dışındaki malvarlığına da başvurmak istediğini söyler.

      1. İrat senedinin güvencesi tarım arazisi olabilir mi? Alacak 350.000 TL olarak yazılabilir mi?
      2. Satıştan sonra irat senedinin borçlusu kimdir?
      3. Burak yükten kurtarma için sözleşmedeki iki yıllık bildirim süresine bağlı mıdır?
      4. Can, ana alacak için Burak'ın kişisel malvarlığına başvurabilir mi?
    olcut:
      - {tespit: "İrat senedinin taşınmaz yükü şeklinde alacak hakkı olması; tarım arazisinin güvence olabilmesi", puan: 15, madde: "TMK m. 903"}
      - {tespit: "Alacağın tarım arazisinde gelir değerinin beşte üçünü aşamaması; 500.000 x 3/5 = 300.000 TL; 350.000 TL'nin yazılamaması", puan: 25, madde: "TMK m. 904"}
      - {tespit: "Değerlendirmenin tapu idaresince resmen yapılması; taraflarca belirlenememesi", puan: 5, madde: "TMK m. 904"}
      - {tespit: "Taşınmazı edinen Burak'ın borçlu olması; Zeynep'in başka işleme gerek kalmaksızın kurtulması", puan: 20, madde: "TMK m. 907"}
      - {tespit: "Sözleşmedeki daha uzun sürenin malikin yükten kurtarma hakkını engellememesi; altı yıllık dönem sonu için bir yıl önce bildirim ve bedelin ödenmesi", puan: 20, madde: "TMK m. 906"}
      - {tespit: "İrat senedinin kişisel borç doğurmaması; Can'ın yalnız yüklü taşınmaza başvurabilmesi", puan: 15, madde: "TMK m. 903"}
    cozum: |
      **Nitelendirme:** Zeynep'in tarım arazisi üzerinde Can lehine kurulacak irat senedi, taşınmaz yükü şeklinde kurulmuş bir alacak hakkıdır (TMK m. 903/1). Taşınmaz rehninin ipotek ve ipotekli borç senedi dışındaki üçüncü türüdür (TMK m. 850).

      **Hukuki sorunlar:** (1) Güvence olabilecek taşınmaz ve alacağın üst sınırı; (2) satıştan sonra borçlunun kimliği; (3) malikin yükten kurtarma hakkı ve sözleşmedeki süre; (4) kişisel sorumluluk.

      **İlgili hükümler:** TMK m. 903, TMK m. 904, TMK m. 906, TMK m. 907.

      **Değerlendirme:**

      *1. Konu ve sınır:* İrat senedinin güvencesini ancak tarım arazisi, konutlar ve üzerinde bina yapılabilecek arsalar oluşturabilir (TMK m. 903/2). Zeynep'in arazisi tarım arazisidir, dolayısıyla güvence olabilir. İrat senetlerindeki alacak miktarı tarım arazisinde arazinin gelir değerinin beşte üçünü aşamaz (TMK m. 904/1). Gelir değeri 500.000 TL olduğundan sınır 500.000 × 3/5 = 300.000 TL'dir. Taraflar 350.000 TL yazdırmak istedikleri için fazla olan kısım yazılamaz. Değerlendirmeler tapu idaresince resmen yapıldığından (TMK m. 904/2) taraflar sınırı kendi aralarında artıramaz.

      *2. Borçlu:* İrat senedinin borçlusu yüklü taşınmazın malikidir (TMK m. 907/1). Yüklü taşınmazı edinen kimse irat senedinin borçlusu olur ve eski malik başka bir işleme gerek kalmaksızın borcundan kurtulur (TMK m. 907/2). Burak araziyi edindiği ve tescil yapıldığı için borçlu olur; Zeynep kurtulur. Can'ın ayrıca bir bildirim yapmasına ya da onay vermesine gerek yoktur.

      *3. Yükten kurtarma:* Malik, sözleşmeyle daha uzun bir bildirim süresi kabul edilmiş olsa bile, her altı yıllık dönemin sonu için bir yıl önce bildirmek ve bedelini ödemek koşuluyla taşınmazın yükten kurtarılmasını isteyebilir (TMK m. 906/1). Burak da malik olarak bu haktan yararlanır; sözleşmedeki iki yıllık süre kanuna göre onun hakkını sınırlamaz. Hakkı kullanmak için bildirimde bulunması ve bedeli ödemesi şarttır. Alacaklının ödeme isteme hakkı ise ayrı olup her on yıllık dönem sonu için bir yıl önce bildirimle kullanılır (TMK m. 906/2).

      *4. Kişisel sorumluluk:* İrat senedi kişisel borç doğurmaz ve borcun sebebini de göstermez (TMK m. 903/3). Alacaklı Can'ın güvencesi yüklü taşınmazdır (ana alacak bakımından); ana alacak için Burak'ın yüklü taşınmaz dışındaki malvarlığına başvurma isteği bu nedenle yerinde değildir. Bu, icra hukukunda da görünür: Rehin açığı için haciz veya iflas yoluna alacağı irat senedinden doğmayan alacaklı gidebilir (İİK m. 152/2). Bu bağlantı metinlerin birlikte okunmasından çıkar.

      **Sonuç:**
      - Tarım arazisi irat senedinin güvencesi olabilir; alacak en çok 300.000 TL olabilir.
      - Burak borçlu olur, Zeynep kurtulur.
      - Burak, her altı yıllık dönem sonu için bir yıl önce bildirip bedeli ödeyerek yükten kurtarma isteyebilir.
      - Can, ana alacak için Burak'ın kişisel malvarlığına başvuramaz.

  - olay: |
      Elif'in taşınmazında Kemal lehine nama yazılı ipotekli borç senedi vardır. Senet Kemal'in evinden çalınır. Kemal, Elif'ten borcun ödenmesini ister. Elif ise borcun tamamını ödemeye hazırdır ve senedin kendisine geri verilmesini, ardından tapu kaydının sildirilmesini istemektedir.

      Başka bir dosyada Hasan'ın taşınmazı üzerinde hamile yazılı bir irat senedi bulunmaktadır. Senedin alacaklısının kim olduğu on bir yıldır bilinmemekte ve bu sürede faiz ödenmesi de istenmemiştir. Hasan taşınmazı satmak için kaydı temizlemek istemektedir. Elif ile Kemal, senedin düzenlenmesi sırasında senedin kaybına ilişkin ayrıca bir düzenleme yapmamıştır. Hasan, alacaklının ortaya çıkması hâlinde alacağı ödemeye hazırdır. Kemal çalıntıyı fark edince hemen mahkemeye başvurmayı düşünmektedir; Elif ise senedin kendisine geri verilmesi mümkün olmazsa tapu kaydının nasıl silineceğini öğrenmek ister.

      1. Kemal çalınan senedi nasıl işlerse alacağına kavuşabilir? Hangi süre geçerlidir?
      2. Elif borcu tamamen öderse neyi isteyebilir? Tapu kaydı nasıl silinir?
      3. Hasan ne yapabilir? Sonuçları nelerdir?
    olcut:
      - {tespit: "Senedin irade dışında elden çıkması; Kemal'in senedi mahkemeye iptal ettirip ödeme, alacak muaccel değilse yeni senet isteyebilmesi", puan: 20, madde: "TMK m. 925"}
      - {tespit: "İptalin hamile yazılı kıymetli evrakın iptali hükümlerine göre verilmesi; ibraz süresinin bir yıl olması", puan: 15, madde: "TMK m. 925"}
      - {tespit: "Borcun tamamını ödeyen borçlunun senedin iptal edilmemiş olarak geri verilmesini isteyebilmesi", puan: 20, madde: "TMK m. 928"}
      - {tespit: "Tescilin ancak tarafların veya mahkemenin rehin senedini iptal etmesi üzerine terkin edilebilmesi", puan: 15, madde: "TMK m. 919"}
      - {tespit: "On yıl bilinmezlik ve faiz istenmemesi şartlarının birlikte gerçekleşmesi; maliki ilan isteyebilmesi", puan: 20, madde: "TMK m. 926"}
      - {tespit: "Alacaklı çıkmaz ve alacağın büyük olasılıkla mevcut olmadığı anlaşılırsa senedin iptali ve rehin derecesinin boşalması", puan: 10, madde: "TMK m. 926"}
    cozum: |
      **Nitelendirme:** Kemal'in senedi nama yazılı ipotekli borç senedidir (TMK m. 914/1). Hasan'ın senedi ise hamile yazılı irat senedidir. İki olayda da sorun senedin kaybı, borcun sona ermesi ve alacaklının bilinmemesine ilişkindir. Bu konular iki senet türüne ortak hükümlerdedir.

      **Hukuki sorunlar:** (1) Çalınan senedin iptali ve alacağın istenmesi; (2) borcun ödenmesi hâlinde senet ve tescilin akıbeti; (3) alacaklısı bilinmeyen senet için ilan ve iptal.

      **İlgili hükümler:** TMK m. 925, TMK m. 926, TMK m. 919, TMK m. 928.

      **Değerlendirme:**

      *1. Kayıp senet:* Rehin senedi irade dışında elden çıkmışsa alacaklı, senedi mahkeme kararıyla iptal ettirerek borçludan borcunu ödemesini ve alacak henüz muaccel değilse yeni bir rehin senedi düzenlenmesini isteyebilir (TMK m. 925/1). Senet çalındığı için irade dışında elden çıkmıştır. Kemal mahkemeye başvurarak iptal kararı almalıdır. İptal kararı, hamile yazılı kıymetli evrakın iptaline ilişkin hükümler gereğince verilir; ancak ibraz süresi bir yıldır (TMK m. 925/2). Genel hamile yazılı senetteki en az altı ay kuralı (TTK m. 663) yerine bu özel süre uygulanır.

      *2. Ödeme ve terkin:* Borcun tamamını ödeyen borçlu, alacaklıdan senedin iptal edilmemiş olarak geri verilmesini isteyebilir (TMK m. 928). Senet çalınmış olduğundan geri verilemiyorsa Elif, ödenmiş olmasına rağmen geri verilmemiş senet için aynı hükümler uyarınca iptal isteyebilir (TMK m. 925/3). Tapu kaydının silinmesi ise ödemeyle kendiliğinden olmaz: Tescil ancak tarafların veya mahkemenin rehin senedini iptal etmesi üzerine terkin edilebilir (TMK m. 919). Elif'in bu yüzden kaydı silmek için senedin iptalini sağlaması gerekir.

      *3. Alacaklısı bilinmeyen senet:* Alacaklının kim olduğu on yıldan beri bilinmiyor ve bu süre içinde faiz ödenmesi de istenmemişse, rehinli taşınmazın maliki gaipliğe ilişkin hükümlere göre ilan yapılmasını hâkimden isteyebilir (TMK m. 926/1). Hasan'ın olayında iki şart birlikte gerçekleşmiştir: on bir yıldır alacaklı bilinmemektedir ve faiz istenmemiştir. Hasan ilan isteyebilir. Alacaklı ortaya çıkmaz ve yapılan araştırma sonunda büyük bir olasılıkla alacağın artık mevcut olmadığı anlaşılırsa hâkim senedin iptaline karar verir ve bu kararla rehin derecesi boşalır (TMK m. 926/2). Alacaklı ortaya çıkarsa senet iptal edilmez.

      **Sonuç:**
      - Kemal çalınan senedi mahkemeye iptal ettirerek borçludan ödeme, alacak muaccel değilse yeni senet isteyebilir; ibraz süresi bir yıldır.
      - Elif senedin iptal edilmemiş olarak geri verilmesini ister; kayıt ancak senedin iptali üzerine silinir.
      - Hasan ilan isteyebilir; alacaklı çıkmazsa senet iptal edilir ve derece boşalır.

kartlar:
  - on: "Taşınmaz rehni hangi türlerde kurulabilir? (TMK m. 850)"
    arka: "Yalnız ipotek, ipotekli borç senedi veya irat senedi şeklinde."
  - on: "İpotekli borç senedi ne doğurur? (TMK m. 898)"
    arka: "Taşınmaz rehniyle güvence altına alınmış kişisel bir alacak. Alacak ve rehin aynı işlemle birlikte doğar."
  - on: "İpotekli borç senedinde rehin miktarının sınırı nedir? (TMK m. 899)"
    arka: "Tapu idaresince resmen biçilen değer. Biçilmiş değeri aşan miktar için bu yolla rehin kurulamaz."
  - on: "İpotekli borç senedinde alacak ne zaman muaccel olur? (TMK m. 900)"
    arka: "Aksi kararlaştırılmadıkça faizlerin ödenmesi gereken tarihte; bu tarihten en az altı ay önce alacaklı veya borçlunun yaptığı bildirimle."
  - on: "Borçtan kişisel sorumlu olmayan malik hakkında hangi hükümler uygulanır? (TMK m. 901)"
    arka: "İpotek hükümleri. Malik, alacaklıya karşı borçluya ait bütün def'ileri ileri sürebilir."
  - on: "İrat senedi ne doğurur? (TMK m. 903)"
    arka: "Taşınmaz yükü şeklinde kurulmuş bir alacak hakkı. Kişisel borç doğurmaz, borcun sebebini göstermez."
  - on: "İrat senedinin güvencesi hangi taşınmazlar olabilir? (TMK m. 903/2)"
    arka: "Tarım arazisi, konutlar ve üzerinde bina yapılabilecek arsalar."
  - on: "İrat senedinde alacağın üst sınırı nedir? (TMK m. 904)"
    arka: "Tarım arazisinde gelir değerinin; diğer taşınmazlarda gelir değeri ile bina ve arsa değerleri ortalamasının beşte üçü."
  - on: "Değer biçmede özensizlikten kim sorumludur? (TMK m. 905)"
    arka: "Devlet. Kusuru olan memurlara rücu edebilir."
  - on: "Malik irat senedinden hangi süreyle kurtulabilir? (TMK m. 906/1)"
    arka: "Her altı yıllık dönem sonu için bir yıl önce bildirip bedeli ödeyerek; sözleşmede daha uzun süre kararlaştırılmış olsa bile."
  - on: "İrat senedi alacaklısı ne zaman ödeme isteyebilir? (TMK m. 906/2)"
    arka: "Kanundaki hâller dışında, her on yıllık dönem sonu için bir yıl önce bildirimle."
  - on: "İrat senedinin borçlusu kimdir? (TMK m. 907)"
    arka: "Yüklü taşınmazın malikidir. Taşınmazı edinen borçlu olur, eski malik başka işleme gerek kalmaksızın kurtulur."
  - on: "Bölünmede ipotek ile irat senedi alacaklısının istemi nasıl ayrılır?"
    arka: "İkisinde de bir ay içinde bildirim, bir yıl içinde istem: ipotekte alacağın ödenmesi (TMK m. 889/2), irat senedinde senedin satın alınması (TMK m. 908/3)."
  - on: "Senede koşul veya karşı edim kaydı konabilir mi? (TMK m. 909)"
    arka: "Hayır. İpotekli borç senedi ve irat senedi koşul ve karşı edim kaydı içeremez."
  - on: "Senet düzenlenince dayanak borç ilişkisine ne olur? (TMK m. 910)"
    arka: "Yenileme yoluyla sona erer. Aksine sözleşme yalnız tarafları ve iyiniyetli olmayan üçüncü kişileri etkiler."
  - on: "Senedi kim düzenler, kimler imzalar? (TMK m. 912)"
    arka: "Tapu memuru düzenler; üzerinde tapu memuru ile yetkili Hazine temsilcisinin imzası bulunur. Alacaklıya borçlunun ve malikin yazılı rızasıyla verilir."
  - on: "Senedin sonuçları hangi tarihten başlar? (TMK m. 911/2)"
    arka: "Senet sonradan düzenlenmiş olsa bile tescil tarihinden."
  - on: "Ödeme nerede yapılır? (TMK m. 916/1)"
    arka: "Aksi anlaşılmadıkça, senet hamile yazılı olsa bile alacaklının yerleşim yerinde."
  - on: "Devirden sonra ana para kime ödenir? (TMK m. 917/2)"
    arka: "Ancak ödeme zamanında kendisinin alacaklı olduğunu ispat eden kimseye yapılırsa geçerlidir."
  - on: "Borcu ödeyince tescil kendiliğinden silinir mi? (TMK m. 919 ve TMK m. 928)"
    arka: "Hayır. Borçlu senedin iptal edilmemiş olarak geri verilmesini ister; tescil ancak rehin senedinin iptali üzerine terkin edilir."
  - on: "TMK m. 883/2'deki otuz günlük terkin kuralı senetler için geçerli midir?"
    arka: "Hayır. Süreli ipotekte sürenin bitiminden itibaren otuz gün içinde icra şerhi konulmazsa malikin talebiyle terkin, ipoteğe özgüdür. Senet türlerinde terkin kuralı TMK m. 919'dur."
  - on: "Senet ile kütük çelişirse hangisi esas alınır? (TMK m. 922)"
    arka: "Kütük. Senedi iyiniyetle edinen tapu kütüğüne ilişkin hükümler uyarınca tazminat isteyebilir."
  - on: "Alacak nasıl devredilir? (TMK m. 923 ve TMK m. 924)"
    arka: "Senet üzerindeki zilyetlikle birlikte, rehin senedinin teslimiyle. Nama yazılıda devralanın adı ve devir senede yazılır."
  - on: "Kayıp senedin iptalinde ibraz süresi nedir? (TMK m. 925/2)"
    arka: "Bir yıl. Genel hamile yazılı senette süre en az altı ay belirlenir (TTK m. 663)."
  - on: "TMK m. 926'daki ilan yolunun şartları nelerdir?"
    arka: "Alacaklı on yıldan beri bilinmemeli ve bu süre içinde faiz ödenmesi de istenmemiş olmalı. İki şart birlikte aranır; alacaklı çıkmazsa senet iptal edilir, derece boşalır."
