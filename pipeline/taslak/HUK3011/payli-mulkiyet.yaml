  - id: "232790300"
    ozet: |
      Davacılar, bir taşınmazda paydaşları olan davalının yükümlülüklerini yerine getirmediğini, aile şirketlerinin işleyişine engel olduğunu ve ortaklığın giderilmesi davası açarak paylı mülkiyet ilişkisini çekilmez hâle getirdiğini ileri sürerek davalının paydaşlıktan çıkarılmasını istemiştir. Sulh hukuk mahkemesi asliye hukuk mahkemesinin görevli olduğu gerekçesiyle görevsizlik kararı vermiş, Yargıtay 6. Hukuk Dairesi bu kararı oyçokluğuyla bozmuş, mahkeme önceki kararında direnmiştir. Hukuk Genel Kurulu oyçokluğuyla direnme kararını bozmuştur. Gerekçeye göre paydaşlıktan çıkarma davası, payın aynen ayrılması, isteyen paydaşa devri ve açık artırmayla satışı aşamalarıyla ortaklığın giderilmesi davasına benzer; daha kapsamlı olan ortaklığın giderilmesi davasında görevli sulh hukuk mahkemesi, daha dar kapsamlı çıkarma davasında da görevlidir. Karşı oy, görevin ancak kanunla belirlenebileceğini ve kıyasla görev tayin edilemeyeceğini savunmuştur. Konuya katkısı: TMK m. 696'daki üç basamaklı sonuç düzenini ve uygulamadaki görev tartışmasını gösterir; davanın esası bu kararda incelenmemiştir.
  - id: "828271700"
    ozet: |
      Davacı paydaş, paydaşı olduğu iki tarlada davalı paydaşın kullanımına engel olduğunu ileri sürerek payına elatmanın önlenmesini ve TMK m. 693 uyarınca kullanma şeklinin hâkimce belirlenmesini istemiştir. Davalı, paydaşlar arasında fiili taksim bulunduğunu ve bütün paydaşların davaya katılması gerektiğini savunmuştur. İlk derece mahkemesinin kabul kararı, diğer paydaşlar taraf gösterilmeden onların haklarını etkileyen kullanma şekli belirlenemeyeceği gibi gerekçelerle Yargıtay 8. Hukuk Dairesince bozulmuş; bozmaya uyan mahkeme davayı kısmen kabul ederek taşınmazların belirli bölümlerini paydaşların kullanımına bırakmıştır. Yargıtay 7. Hukuk Dairesi bu kararı da bozmuştur. Gerekçeye göre hâkim keşif yapmalı, taşınmazın konumunu, niteliğini, yöresel âdetleri ve tarafların ihtiyaçlarını gözeten, zaman ve yer itibarıyla bölünmeye ilişkin çeşitli seçenekler içeren uzman bilirkişi raporu almalıdır; kullanma şekli taşınmazların sürekli özgülenmesi biçiminde belirlenemez. Ayrıca davalının fiili taksim savunması ve tanıkları incelenmeden karar verilmesi eksik incelemedir. Konuya katkısı: TMK m. 693/2'deki hâkim belirlemesinin bir paylaşma olmadığını ve nasıl yapılacağını gösterir.
  - id: "609240700"
    ozet: |
      Davacı, tarla niteliğindeki paylı taşınmazda fiili taksimle kendisine düşen bölüme tel çit çektiğini, davalı paydaşın hayvan otlatmak için ayrılan kısımdaki tel örgüyü ve çok sayıda ağacı söktüğünü, iş makinesiyle kanal açtığını ileri sürerek elatmanın önlenmesini ve eski hâle getirmeyi istemiştir. Davalı, fiili taksim bulunduğunu ama davacının kullandığı yere müdahale etmediğini savunmuştur. Mahkemenin kabul kararı, taşınmazın bütünü bakımından tüm paydaşları bağlayan bir fiili kullanma biçimi araştırılmadığı için Yargıtay 1. Hukuk Dairesince bozulmuş; bozmaya uyulduktan sonra verilen yeni kabul kararı da Yargıtay 8. Hukuk Dairesince yeterli araştırma yapılmadığı gerekçesiyle bozulmuştur. Daireye göre payından yararlanamayan paydaş, engel olan paydaştan payına elatmanın önlenmesini her zaman isteyebilir; ancak payına karşılık çekişmesiz kullandığı bir yer varsa bu dava dinlenmez ve payından az yer kullandığını ileri süren paydaş ortaklığın giderilmesi yoluna gitmelidir. Paydaşlar arası elatma davalarında önce bütün paydaşları bağlayan harici taksim, özel parselasyon planı ya da fiili kullanma biçimi araştırılmalı, tanıklar taşınmaz başında dinlenmeli ve kullanım krokisi düzenletilmelidir. Konuya katkısı: paydaşlar arası elatma davasının sınırlarını ve fiili kullanmanın önemini gösterir.

sorular:
  - soru: |
      Paylı mülkiyette bir paydaşın hakkı hakkında hangisi doğrudur?
    siklar:
      - "Maddi olarak bölünmemiş şeyin tamamına belli bir payla maliktir."
      - "Şeyin kendisine düşen belirli bir bölümünün tek malikidir."
      - "Belirlenmiş bir payı yoktur, hakkı malın tamamına yaygındır."
      - "Payını diğer paydaşların izni olmadan devredemez."
    dogru: 0
    aciklama: |
      TMK m. 688/1'e göre paydaşlar, maddi olarak bölünmemiş bir şeyin tamamına belli paylarla maliktir. Pay soyuttur, belirli bir bölümü göstermez. Belirlenmiş pay bulunmaması elbirliği mülkiyetinin özelliğidir (TMK m. 701/2). Pay, diğerlerinin izni olmadan devredilebilir (TMK m. 688/3).

  - soru: |
      Paylı mülkiyette bir paydaşın, diğer paydaşların katılımı olmadan **yapamayacağı** işlem hangisidir?
    siklar:
      - "Payını üçüncü kişiye satmak"
      - "Payını rehnetmek"
      - "Taşınmazın tamamı üzerinde ipotek kurmak"
      - "Payını bağışlamak"
    dogru: 2
    aciklama: |
      Paydaş kendi payı üzerinde malik gibi tasarruf eder; payını satabilir, bağışlayabilir, rehnedebilir (TMK m. 688/3). Malın tamamı üzerinde tasarruf ise, oybirliğiyle aksi kararlaştırılmadıkça bütün paydaşların kabulüne bağlıdır (TMK m. 692/1).

  - soru: |
      Paydaşların yararlanma, kullanma ve yönetim konularında kanun hükümlerinden farklı bir düzen kurabilmesi için hangisi gerekir?
    siklar:
      - "Pay ve paydaş çoğunluğuyla karar"
      - "Paydaşların oybirliğiyle anlaşması"
      - "Payların üçte ikisine sahip paydaşların kararı"
      - "Sulh hukuk hâkiminin onayı"
    dogru: 1
    aciklama: |
      TMK m. 689/1'e göre paydaşlar kendi aralarında **oybirliğiyle** anlaşarak yararlanma, kullanma ve yönetime ilişkin konularda kanundan farklı bir düzenleme yapabilir. Pay ve paydaş çoğunluğu önemli yönetim işleri için aranır (TMK m. 691); mahkeme onayı gerekmez.

  - soru: |
      TMK m. 689'a göre paydaşların anlaşmasıyla bile **kaldırılamayan** yetki hangisidir?
    siklar:
      - "Küçük onarımları tek başına yaptırma yetkisi"
      - "Kiraya verme kararının pay ve paydaş çoğunluğuyla alınmasını isteme yetkisi"
      - "Eşyayı zarar tehlikesinden korumak için derhâl alınması gereken önlemleri bütün paydaşlar hesabına alma yetkisi"
      - "Paylı maldan yılın her döneminde yararlanma yetkisi"
    dogru: 2
    aciklama: |
      TMK m. 689/1-2, acil koruma önlemlerini bütün paydaşlar hesabına alma yetkisinin anlaşmayla kaldırılamayacağını ve sınırlandırılamayacağını söyler. Olağan yönetim yetkisi çoğunluk kararıyla bile farklı düzenlenebilir (TMK m. 690/2). Önemli yönetimdeki çoğunluk ve kullanma düzeni ise oybirliğiyle yapılan anlaşmayla değiştirilebilir (TMK m. 689/1).

  - soru: |
      Paydaşların bir taşınmaza ilişkin kullanma anlaşmasının tapu kütüğüne şerh verilebilmesi için hangisi gerekir?
    siklar:
      - "Anlaşmanın tapu müdürlüğünde resmî senetle yapılması ve bütün paydaşların birlikte başvurması"
      - "İmzaların noterlikçe onaylanması ve paydaşlardan birinin başvurusu"
      - "Anlaşmanın sulh hukuk mahkemesince onaylanması"
      - "Adi yazılı anlaşmanın yeterli olması ve tapu müdürlüğünün şerhi kendiliğinden yapması"
    dogru: 1
    aciklama: |
      TMK m. 689/3'e göre taşınmazlarla ilgili anlaşmalar, imzalarının noterlikçe onaylanması koşuluyla paydaşlardan birinin başvurusu üzerine tapu kütüğüne şerh verilebilir. Resmî senet, mahkeme onayı ya da bütün paydaşların başvurusu aranmaz.

  - soru: |
      Ahmet, Burcu ve Cem'in paylı malik olduğu evde mutfak musluğu bozulur. Paydaşlar arasında yönetime ilişkin bir anlaşma yoktur. Ahmet diğerlerine sormadan tesisatçı çağırarak musluğu değiştirir. Hangisi doğrudur?
    siklar:
      - "Küçük onarım olağan yönetim işi olduğundan Ahmet tek başına yapmaya yetkilidir."
      - "Onarım için pay ve paydaş çoğunluğu gerekir; Ahmet yetkisiz davranmıştır."
      - "Her onarım malın tamamını ilgilendirdiği için bütün paydaşların kabulü gerekir."
      - "Ahmet ancak mahkemeden izin alarak onarım yaptırabilirdi."
    dogru: 0
    aciklama: |
      TMK m. 690/1'e göre paydaşlardan her biri olağan yönetim işlerini, özellikle küçük onarımları yaptırmaya yetkilidir. Pay ve paydaş çoğunluğu olağan yönetimi aşan büyük onarımlar için (TMK m. 691/2), bütün paydaşların kabulü ise olağanüstü işler için (TMK m. 692) aranır.

  - soru: |
      Bir dükkânda Selin 5/8, Tuna 2/8 ve Umut 1/8 paya sahiptir. Aralarında yönetime ilişkin bir anlaşma yoktur. Tuna ve Umut dükkânı kiraya vermeye karar verir, Selin karşı çıkar. Hangisi doğrudur?
    siklar:
      - "Paydaş çoğunluğu sağlandığı için kiraya verme kararı alınmıştır."
      - "Kiraya verme olağan yönetim işi olduğundan Tuna tek başına da karar verebilirdi."
      - "Pay çoğunluğu sağlanmadığı için kiraya verme kararı alınamaz."
      - "Kiraya verme malın tamamı üzerinde tasarruf olduğundan bütün paydaşların kabulü gerekir."
    dogru: 2
    aciklama: |
      Kira sözleşmesi yapmak önemli yönetim işidir ve pay **ve** paydaş çoğunluğu ister (TMK m. 691/1). Tuna ve Umut üç paydaştan ikisidir ama payları toplamı 3/8'dir; yarıdan fazla değildir. İki çoğunluk birlikte sağlanmadığı için karar alınamaz. Kiraya verme ne olağan yönetim ne de tasarruftur.

  - soru: |
      Kardeşler Can ve Ece, bir dükkâna 1/2'şer paylı maliktir. Can dükkânı kiraya vermek istemekte, Ece buna karşı çıkmaktadır. Can'ın başvurabileceği yol hangisidir?
    siklar:
      - "Hâkimden, bütün paydaşların menfaatini gözeterek hakkaniyete uygun bir karar vermesini isteyebilir."
      - "Payların eşit olması nedeniyle dükkân kiraya verilemez; tek yol ortaklığın giderilmesidir."
      - "Can tek başına kiraya verirse sözleşme Ece'yi de bağlar."
      - "Ece'nin paydaşlıktan çıkarılmasını isteyebilir."
    dogru: 0
    aciklama: |
      TMK m. 691/3'e göre pay ve paydaşların eşitliği hâlinde hâkim, paydaşlardan birinin istemi üzerine bütün paydaşların menfaatini gözeterek hakkaniyete uygun bir karar verir ve gerekirse kayyım atar. Tek başına yapılan kira sözleşmesi Ece'yi bağlamaz. Bir yönetim kararına karşı çıkmak ağır ihlal değildir, çıkarma sebebi oluşturmaz (TMK m. 696).

  - soru: |
      Aşağıdakilerden hangisi, oybirliğiyle aksi kararlaştırılmamışsa, **bütün paydaşların kabulünü** gerektirir?
    siklar:
      - "Kira sözleşmesinin feshi"
      - "Paylı konutun lokantaya dönüştürülmesi"
      - "Bahçedeki ağaçların budanması"
      - "Toprağın ıslahı"
    dogru: 1
    aciklama: |
      Paylı malın özgülendiği amacın değiştirilmesi olağanüstü yönetim işidir ve bütün paydaşların kabulüne bağlıdır (TMK m. 692/1). Kira sözleşmesinin feshi ve toprağın ıslahı önemli yönetim işleridir (TMK m. 691/1). Ağaçların budanması olağan bir tarımsal iştir (TMK m. 690/1).

  - soru: |
      Gül ve Hasan bir arsanın 1/2'şer paydaşıdır. Gül'ün payı üzerinde bankası lehine ipotek vardır. Gül ve Hasan, arsanın tamamı üzerinde başka bir banka lehine ipotek kurmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Bütün paydaşlar anlaştığı için ipotek kurulabilir."
      - "Paylardan biri üzerinde taşınmaz rehni bulunduğundan malın tamamı benzer bir hakla kayıtlanamaz."
      - "İpotek kurulabilir; mevcut pay ipoteği bu işlemle kendiliğinden sona erer."
      - "İpotek ancak Gül paydaşlıktan çıkarıldıktan sonra kurulabilir."
    dogru: 1
    aciklama: |
      TMK m. 692/2'ye göre paylar üzerinde taşınmaz rehni veya taşınmaz yükü kurulmuşsa paydaşlar malın tamamını benzer haklarla kayıtlayamaz. Bu yasak paydaşların oybirliğiyle de aşılamaz; amaç pay üzerindeki rehin alacaklısını korumaktır. Pay ipoteği kendiliğinden sona ermez.

  - soru: |
      Paylı bir tarlanın kullanımında anlaşamayan paydaşlardan biri TMK m. 693 uyarınca kullanma şeklinin belirlenmesini istemiştir. Hâkimin yetkisi hakkında hangisi doğrudur?
    siklar:
      - "Tarlayı aynen bölerek her paydaş adına ayrı parsel tescil eder."
      - "Kullanmayı zaman veya yer itibarıyla paydaşlar arasında bölebilir; bu, payları ve tapu kaydını değiştirmez."
      - "Yalnız satış yoluyla ortaklığın giderilmesine karar verebilir."
      - "Paydaşlardan birinin payını diğerine devretmesine karar verir."
    dogru: 1
    aciklama: |
      TMK m. 693/2'ye göre uyuşmazlık hâlinde yararlanma ve kullanma şeklini hâkim belirler; bu, kullanmanın zaman veya yer itibarıyla bölünmesi biçiminde olabilir. Bu bir paylaşma değildir, mülkiyeti değiştirmez. Aynen bölme ve satış ortaklığın giderilmesinin (TMK m. 699), pay devri ise paydaşlıktan çıkarmanın (TMK m. 696) sonucudur.

  - soru: |
      Komşu İlker, Nur'un 1/4 paydaşı olduğu boş arsaya konteyner koyarak burayı depo olarak kullanmaktadır. Diğer paydaşlar dava açmak istemez. Nur'un açacağı dava hakkında Yargıtay uygulamasına göre hangisi doğrudur?
    siklar:
      - "Bütün paydaşlar birlikte dava açmadıkça dava dinlenmez."
      - "Nur tek başına taşınmazın tamamı için elatmanın önlenmesini, ecrimisili ise payı oranında isteyebilir."
      - "Nur yalnız payı oranında elatmanın önlenmesini isteyebilir."
      - "Nur tek başına hem elatmanın önlenmesini hem de ecrimisilin tamamını isteyebilir."
    dogru: 1
    aciklama: |
      Her paydaş ortak menfaatlerin korunmasını diğerlerini temsilen sağlayabilir (TMK m. 693/3). Yargıtay'a göre paydaş, üçüncü kişiye karşı tek başına ve taşınmazın tamamı için elatmanın önlenmesi davası açabilir. Ecrimisil bölünebilir bir para alacağı olduğundan yalnız payı oranında istenebilir.

  - soru: |
      Paylı bir tarlanın paydaşlarından Oya, payına karşılık tarlanın güney kısmını yıllardır çekişmesiz kullanmaktadır. Oya, kullandığı yerin payından küçük olduğunu ve paydaş Rıfat'ın fazla yer kullandığını ileri sürerek Rıfat'a karşı elatmanın önlenmesi davası açar. Yargıtay'ın yerleşik uygulamasına göre hangisi doğrudur?
    siklar:
      - "Dava dinlenmez; payından az yer kullandığını ileri süren paydaş sorununu ortaklığın giderilmesi davasıyla çözmelidir."
      - "Her paydaş payına elatmanın önlenmesini her zaman isteyebileceği için dava kabul edilmelidir."
      - "Oya ancak Rıfat'ın paydaşlıktan çıkarılmasını isteyebilir."
      - "Oya, Rıfat'ın kullandığı fazla yerin tapuda kendi adına tescilini isteyebilir."
    dogru: 0
    aciklama: |
      Yargıtay'a göre payından yararlanamayan paydaş engel olan paydaştan payına elatmanın önlenmesini isteyebilir. Ancak payına karşılık çekişmesiz kullandığı bir yer varsa bu dava dinlenmez; payından az yer kullandığını ileri süren paydaşın yolu ortaklığın giderilmesidir. Fazla yer kullanmak tek başına ağır ihlal değildir; fiili kullanma da tapuda ayrı mülkiyet doğurmaz.

  - soru: |
      Bir binada Okan 1/2, Pelin 1/3 ve Rüya 1/6 paya sahiptir. Aralarında giderlere ilişkin özel bir anlaşma yoktur. Paydaşlar çatının onarılmasına birlikte karar vermiş, 120.000 TL tutan bedelin tamamını Okan ödemiştir. Okan Pelin'den ne kadar isteyebilir?
    siklar:
      - "40.000 TL"
      - "60.000 TL"
      - "30.000 TL"
      - "80.000 TL"
    dogru: 0
    aciklama: |
      Giderler aksine hüküm yoksa payları oranında karşılanır; fazla ödeyen paydaş diğerlerine payları oranında rücu eder (TMK m. 694). Pelin'in payı 1/3 olduğundan payına düşen 40.000 TL'dir. Rücu müteselsil değildir; Okan diğerlerinin toplam payı olan 60.000 TL'yi yalnız Pelin'den isteyemez. Kalan tutarı eşit bölmek de paylara aykırıdır.

  - soru: |
      TMK m. 695'e göre bir taşınmazda paydaşların aldığı kullanma kararının, sonradan pay satın alan kişiyi bağlaması için hangisi gerekir?
    siklar:
      - "Kararın tapu kütüğüne şerh edilmiş olması"
      - "Kararın en az beş yıldır uygulanıyor olması"
      - "Kararın mahkemece onaylanmış olması"
      - "Kararın oybirliğiyle değil pay ve paydaş çoğunluğuyla alınmış olması"
    dogru: 0
    aciklama: |
      TMK m. 695/2'ye göre taşınmazlarda yararlanma, kullanma ve yönetime ilişkin kararların sonradan paydaş olan veya pay üzerinde ayni hak kazananları bağlaması için tapu kütüğüne şerh edilmesi gerekir. Kanun belirli bir uygulama süresi ya da mahkeme onayı aramaz.

  - soru: |
      Paydaş Taner, ortak binada kullandığı bölümü oğluna bırakmıştır. Oğlu aylardır diğer paydaşları tehdit etmekte ve ortak alanlara zarar vermektedir; Taner uyarılara rağmen hiçbir önlem almamaktadır. Diğer paydaşlar gerekli çoğunlukla dava açma kararı almıştır. Taner'in "davranışlar oğlumun, benim değil" savunması hakkında hangisi doğrudur?
    siklar:
      - "Yerindedir; çıkarma yalnız paydaşın kendi davranışlarına dayanabilir."
      - "Yerinde değildir; malın kullanılmasını bıraktığı kişinin davranışları da çıkarma sebebi olabilir."
      - "Yerindedir; bu durumda yalnız oğluna karşı ceza davası açılabilir."
      - "Yerinde değildir; ancak çıkarma için oğlunun da paydaş olması gerekir."
    dogru: 1
    aciklama: |
      TMK m. 696/1, paydaşın kendi davranışlarının yanında malın kullanılmasını bıraktığı ya da fiillerinden sorumlu olduğu kişilerin davranışlarını da çıkarma sebebi sayar. Yükümlülüklerin ağır biçimde çiğnenmesi ve ilişkinin çekilmez hâle gelmesi şartları da aranır. Oğlunun paydaş olması gerekmez.

  - soru: |
      Paydaşlıktan çıkarma davasında çıkarılması istenen paydaşın payı maldan aynen ayrılamamaktadır. Paydaş Ufuk bu payın kendisine devrini istemektedir. Hangisi doğrudur?
    siklar:
      - "Ufuk devir istemini çıkarma istemiyle birlikte ileri sürmelidir; payın dava tarihindeki değeri esas alınır."
      - "Ufuk devir istemini çıkarma kararı kesinleştikten sonra ayrı bir davayla ileri sürer."
      - "Payın değeri karar tarihindeki rayice göre belirlenir."
      - "Pay, bedel ödenmeksizin Ufuk adına tescil edilir."
    dogru: 0
    aciklama: |
      TMK m. 696/4'e göre aynen ayrılamayan payın dava tarihindeki değeriyle kendilerine devrini isteyen paydaşlar bu istemi çıkarma istemiyle birlikte ileri sürmek zorundadır. Hâkim hükümden önce belirlediği sürede pay değerinin ödenmesine veya tevdiine karar verir; dava kabul edilirse pay istemde bulunan adına tescil edilir.

  - soru: |
      Paydaşlıktan çıkarma istemi haklı bulunmuş, pay aynen ayrılamamakta ve payı kendisine devralmak isteyen paydaş da bulunmamaktadır. Hâkim ne yapar?
    siklar:
      - "Davayı reddeder."
      - "Payı diğer paydaşlara payları oranında bedelsiz geçirir."
      - "Davalıya payını devretmesi için süre verir; devredilmezse payın açık artırmayla satışına karar verir."
      - "Taşınmazın tamamının satışıyla ortaklığın giderilmesine karar verir."
    dogru: 2
    aciklama: |
      TMK m. 696/5'e göre bu durumda hâkim davalıya payını devretmesi için bir süre belirler ve bu sürede devredilmeyen payın açık artırmayla satışına karar verir. Satış, cebrî icra yoluyla paraya çevirme hükümlerine göre yapılır. Taşınmazın tamamı satılmaz; yalnız çıkarılan paydaşın payı satılır.

  - soru: |
      Bir paydaşın payı üzerinde intifa hakkı bulunan kişi, diğer paydaşlara karşı ağır ihlallerde bulunmaktadır. TMK m. 697'ye göre, devri caiz olmayan bu hak hakkında hâkim ne karar verir?
    siklar:
      - "Hakkın uygun bir tazminat karşılığında sona ermesine"
      - "Hakkın açık artırmayla başkasına satılmasına"
      - "Hakkın tazminatsız olarak sona ermesine"
      - "İntifa hakkı sahibinin çıkarılamayacağına, yalnız paydaşın çıkarılabileceğine"
    dogru: 0
    aciklama: |
      TMK m. 697'ye göre çıkarma hükümleri pay üzerinde intifa veya diğer ayni ya da şerhli kişisel yararlanma hakkı sahiplerine kıyasen uygulanır. Devri caiz olmayan bir hakkın ise uygun bir tazminat karşılığında sona ermesine karar verilir. İntifa hakkının kendisi devredilemez, yalnız kullanılması devredilebilir (TMK m. 806).

  - soru: |
      Paylı bir dükkânın 1/4 paydaşı Kerem, diğer paydaşlara danışmadan dükkânı kendi adına kiraya verir. Kiracı bir süre sonra "pay ve paydaş çoğunluğu sağlanmadan yapılan sözleşme beni bağlamaz" diyerek kira bedelini ödemeyi keser. Yargıtay uygulamasına göre hangisi doğrudur?
    siklar:
      - "Kiracı haklıdır; sözleşme kesin hükümsüzdür."
      - "Kiracı bu savunmayı ileri süremez; sözleşme Kerem ile kiracı arasında hüküm doğurur, ancak diğer paydaşları bağlamaz."
      - "Sözleşme bütün paydaşları bağlar, çünkü kiraya verme olağan yönetim işidir."
      - "Sözleşme ancak diğer paydaşlar sözleşmeyi onaylarsa kiracıyı bağlar."
    dogru: 1
    aciklama: |
      Kira bir borç sözleşmesidir; kiraya verenin malik olması aranmaz (TBK m. 299). Yargıtay'a göre paydaşlardan birinin kendi adına yaptığı kira sözleşmesinde kiracı, pay ve paydaş çoğunluğu bulunmadığını ileri sürerek sözleşmeyle bağlı olmadığını iddia edemez. Ancak kiraya verme önemli yönetim işi olduğundan (TMK m. 691/1), sözleşmeyi yapmayan paydaşlar bu sözleşmeyle bağlı değildir.

olaylar:
  - olay: |
      İzmir'de üç katlı bir bina, kat mülkiyeti kurulmadan beş kişinin paylı mülkiyetindedir: Necla 1/2, Orhan 1/4, Pınar 1/8, Rıza 1/16 ve Sinan 1/16. Paydaşlar arasında yönetime ve giderlere ilişkin bir anlaşma yoktur.

      Ocak ayında şiddetli yağmur sırasında çatıdan üst kata su sızmaya başlar ve tavanın çökme tehlikesi doğar. Yurt dışındaki Necla'ya ve diğer paydaşlara ulaşamayan Orhan, aynı gün bir ustaya çatıyı onartır ve 40.000 TL öder. Orhan bedeli paylaşmak isteyince Necla "Bana sorulmadı, ödemem" der.

      Necla ve Pınar, zemin kattaki dükkânı X Ltd. Şti.'ne beş yıllığına kiraya vermeye karar verir; sözleşmeyi Necla kiraya veren olarak imzalar. Orhan, Rıza ve Sinan buna karşıdır.

      Necla ayrıca binaya dördüncü kat eklemek istemektedir. Pınar, Rıza ve Sinan bunu destekler, Orhan karşı çıkar.

      Son olarak Pınar, payını diğer paydaşlara haber vermeden tanımadıkları bir kişiye satmayı düşünmektedir.

      1. Orhan çatıyı tek başına onartmaya yetkili miydi? 40.000 TL nasıl paylaşılır?
      2. Dükkânın kiraya verilmesi için gereken karar alınmış mıdır? Necla'nın imzaladığı sözleşmenin sonuçları nelerdir?
      3. Dördüncü kat yapılabilir mi?
      4. Pınar payını satabilir mi; nelere dikkat etmelidir?
    olcut:
      - {tespit: "Çatı onarımının acil koruma önlemi olarak her paydaşça bütün paydaşlar hesabına alınabilmesi", puan: 15, madde: "TMK m. 689"}
      - {tespit: "Masrafın payları oranında dağıtılması ve Orhan'ın her paydaştan ayrı ayrı rücu edeceği tutarlar", puan: 20, madde: "TMK m. 694"}
      - {tespit: "Kiraya vermenin önemli yönetim işi olması; pay çoğunluğunun var, paydaş çoğunluğunun yok olduğunun hesaplanması", puan: 25, madde: "TMK m. 691"}
      - {tespit: "Necla'nın sözleşmesinin Necla ile kiracı arasında hüküm doğurması, diğer paydaşları bağlamaması", puan: 10, madde: "TBK m. 299"}
      - {tespit: "Ek katın ölçüyü aşan yapı işi olarak bütün paydaşların kabulünü gerektirmesi", puan: 15, madde: "TMK m. 692"}
      - {tespit: "Pınar'ın payını izin almadan satabilmesi; resmî şekil ve diğer paydaşların yasal önalım hakkı", puan: 15, madde: "TMK m. 688"}
    cozum: |
      **Nitelendirme:** Bina, kat mülkiyeti kurulmadan beş kişinin paylı mülkiyetindedir (TMK m. 688). Paydaşlar arasında anlaşma bulunmadığı için kanunun kademeli yönetim kuralları uygulanır.

      **Hukuki sorunlar:** (1) Orhan'ın tek başına yaptırdığı onarımın niteliği ve masrafın paylaşımı; (2) dükkânın kiraya verilmesi için gereken çoğunluk ve imzalanan sözleşmenin sonuçları; (3) ek katın hangi kademede olduğu; (4) payın satışı.

      **İlgili hükümler:** TMK m. 688, 689, 691, 692, 694, 706 ve 732; TBK m. 299.

      **Değerlendirme:**

      *1. Çatı onarımı ve masraf:* Su sızması ve tavanın çökme tehlikesi, eşyayı bir zarar tehlikesinden ya da zararın artmasından korumak için **derhâl** önlem alınmasını gerektirir. TMK m. 689/1-2'ye göre her paydaş bu önlemleri **bütün paydaşlar hesabına** alabilir; bu yetki anlaşmayla bile kaldırılamaz. Orhan'ın diğerlerine sormaması bu yüzden sonucu değiştirmez; Necla'nın itirazı yerinde değildir.
      Masraf payları oranında karşılanır (TMK m. 694/1): Necla 20.000 TL, Orhan 10.000 TL, Pınar 5.000 TL, Rıza 2.500 TL, Sinan 2.500 TL. Orhan, kendi payı dışında kalan 30.000 TL'yi her paydaştan ancak onun payına düşen kadarıyla isteyebilir (TMK m. 694/2). Rücu müteselsil değildir; örneğin 30.000 TL'nin tamamını yalnız Necla'dan isteyemez.

      *2. Dükkânın kiraya verilmesi:* Adi kira sözleşmesi yapmak önemli yönetim işidir ve pay **ve** paydaş çoğunluğu gerekir (TMK m. 691/1). Necla ve Pınar'ın payları toplamı 5/8'dir, yani pay çoğunluğu vardır. Ama beş paydaştan yalnız ikisidir; paydaş çoğunluğu yoktur. TMK m. 691/3 hâkime lafzen yalnız pay ve paydaşların eşitliği hâlinde yetki verir; burada eşitlik yoktur, pay çoğunluğu ile paydaş çoğunluğu farklı taraftadır. Bu kilitlenmede hükmün kıyasen uygulanıp uygulanamayacağı tartışmalıdır (bkz. doktrin). Her hâlde paydaşlar adına geçerli bir kiraya verme kararı alınmamıştır. Rıza ya da Sinan'dan biri kararı desteklerse pay toplamı 11/16, paydaş sayısı beşte üç olur ve çoğunluk sağlanır.
      Necla'nın imzaladığı sözleşmeye gelince: kira bir borç sözleşmesidir ve kiraya verenin malik olması aranmaz (TBK m. 299). Sözleşme Necla ile X Ltd. Şti. arasında hüküm doğurur; Yargıtay uygulamasına göre kiracı, çoğunluk bulunmadığını ileri sürerek sözleşmeyle bağlı olmadığını iddia edemez. Buna karşılık sözleşmeyi yapmayan Orhan, Rıza ve Sinan sözleşmenin tarafı değildir ve sözleşmeyle bağlı değildir.

      *3. Dördüncü kat:* Binaya kat eklemek, korumanın veya olağan kullanmanın gerektirdiği ölçüyü aşan bir yapı işidir. TMK m. 692/1'e göre bu iş, oybirliğiyle aksi kararlaştırılmış olmadıkça **bütün paydaşların kabulüne** bağlıdır. Böyle bir oybirliği kararı yoktur ve Orhan karşıdır. Pay ve paydaşların büyük çoğunluğunun desteği yeterli olmadığından ek kat yapılamaz.

      *4. Pınar'ın payı:* Paydaş kendi payını diğerlerinin izni olmadan devredebilir (TMK m. 688/3). Taşınmaz payının devrini amaçlayan sözleşme resmî şekilde yapılmalıdır (TMK m. 706). Pay üçüncü kişiye satılırsa diğer paydaşlar yasal önalım hakkını kullanabilir (TMK m. 732); bildirim, süre ve dava ayrı bir konudur.

      **Sonuç:**
      - Orhan acil koruma önlemi aldığı için yetkilidir; Necla'dan 20.000, Pınar'dan 5.000, Rıza ve Sinan'dan 2.500'er TL isteyebilir.
      - Kiraya verme kararı paydaş çoğunluğu bulunmadığından alınamamıştır. Sözleşme Necla ile kiracı arasında geçerlidir, diğer paydaşları bağlamaz.
      - Ek kat Orhan'ın kabulü olmadan yapılamaz.
      - Pınar payını resmî şekilde satabilir; diğer paydaşların önalım hakkı doğar.

  - olay: |
      Kardeşler Deniz, Emre ve Fatma, Bodrum'daki bahçeli bir yazlığın 1/3'er paylı malikidir. 2021'de imzalarını noterde onaylattıkları bir anlaşmayla her yaz Haziran'da Deniz'in, Temmuz'da Emre'nin, Ağustos'ta Fatma'nın evi kullanmasını kararlaştırmışlardır. Deniz'in başvurusuyla anlaşma tapu kütüğüne şerh edilmiştir.

      2025'te Emre payını tapuda resmî senetle Gökhan'a satar. Gökhan, 2026 Haziran'ının ilk günü eve yerleşir, kapının kilidini değiştirir ve tatile gelen Deniz'i içeri almaz. Deniz'in itirazına "Kardeşlerin anlaşması beni bağlamaz; ben de paydaşım, istediğim zaman kullanırım" diye karşılık verir. Deniz Haziran'ı otelde geçirmek zorunda kalır.

      Bu sırada komşu Hakan, yazlığın bahçesinin arka kısmına izinsiz bir sera kurmuş ve orada sebze yetiştirerek satmaktadır. Deniz ve Gökhan Hakan'a karşı dava açmakla ilgilenmez. Fatma tek başına dava açmak ister.

      1. Gökhan kullanma anlaşmasıyla bağlı mıdır?
      2. Deniz, Gökhan'a karşı hangi yola başvurabilir?
      3. Fatma tek başına Hakan'a karşı dava açabilir mi; ne isteyebilir?
      4. Kardeşler arasında hiçbir anlaşma olmasaydı ve kullanma konusunda uyuşmazlık çıksaydı bu nasıl çözülürdü?
    olcut:
      - {tespit: "Kullanma anlaşmasının oybirliğiyle yapılması ve noter onaylı imzalarla bir paydaşın başvurusu üzerine şerh edilebilmesi", puan: 15, madde: "TMK m. 689"}
      - {tespit: "Şerh edilmiş anlaşmanın sonradan paydaş olan Gökhan'ı bağlaması", puan: 25, madde: "TMK m. 695"}
      - {tespit: "Deniz'in Gökhan'a karşı payına elatmanın önlenmesini isteyebilmesi", puan: 15, madde: "TMK m. 683"}
      - {tespit: "Fatma'nın üçüncü kişiye karşı tek başına ve taşınmazın tamamı için elatmanın önlenmesini isteyebilmesi; ecrimisili yalnız payı oranında isteyebilmesi", puan: 25, madde: "TMK m. 693"}
      - {tespit: "Anlaşma yoksa kullanma şeklini hâkimin zaman veya yer itibarıyla belirlemesi; bunun paylaşma olmaması", puan: 20, madde: "TMK m. 693"}
    cozum: |
      **Nitelendirme:** Yazlık üç kardeşin eşit paylı mülkiyetindedir (TMK m. 688). Kardeşler kullanma konusunda kanundan farklı bir düzen kurmuştur (TMK m. 689). Emre'nin payını satmasıyla Gökhan paydaş olmuştur. Komşu Hakan ise paydaş olmayan üçüncü kişidir.

      **Hukuki sorunlar:** (1) Kullanma anlaşmasının yeni paydaşa karşı bağlayıcılığı; (2) Deniz'in Gökhan'a karşı korunması; (3) bir paydaşın üçüncü kişiye karşı tek başına dava açabilmesi ve isteyebilecekleri; (4) anlaşma yoksa kullanma şeklinin belirlenmesi.

      **İlgili hükümler:** TMK m. 683, 689, 693 ve 695.

      **Değerlendirme:**

      *1. Gökhan'ın bağlılığı:* Paydaşlar oybirliğiyle yararlanma ve kullanma konusunda farklı bir düzen kurabilir (TMK m. 689/1). Üç kardeş bunu yapmış, imzalarını noterde onaylatmış ve paydaşlardan Deniz'in başvurusuyla anlaşmayı tapuya şerh ettirmiştir. Bu, TMK m. 689/3'teki şartlara uygundur. TMK m. 695/1'e göre bu düzenleme sonradan paydaş olanları da bağlar; taşınmazlarda bunun için şerh gerekir (TMK m. 695/2). Şerh bulunduğundan Gökhan anlaşmayla bağlıdır. Emre'nin yerine geçtiği için yazlığı Temmuz'da kullanabilir; Haziran Deniz'in, Ağustos Fatma'nın dönemidir. Gökhan'ın "anlaşma beni bağlamaz" savunması yerinde değildir.

      *2. Deniz'in başvurabileceği yol:* Her paydaş paylı maldan diğerlerinin haklarıyla bağdaştığı ölçüde yararlanır (TMK m. 693/1). Gökhan, Deniz'e bırakılan dönemde evi işgal ederek ve onu içeri almayarak Deniz'in yararlanmasını engellemektedir. Malik her türlü haksız elatmanın önlenmesini isteyebilir (TMK m. 683/2). Yargıtay uygulamasına göre yararlanması engellenen paydaş, engel olan paydaşa karşı **payına elatmanın önlenmesini** isteyebilir. Deniz bu davada şerhli anlaşmaya dayanır. Gökhan'ın Deniz'i eve almaması aynı zamanda yararlanmanın engellenmesi anlamına geldiği için ecrimisil istemi de gündeme gelebilir; ayrıntısı ecrimisil konusundadır.

      *3. Fatma'nın Hakan'a karşı davası:* Her paydaş bölünemeyen ortak menfaatlerin korunmasını diğer paydaşları temsilen sağlayabilir (TMK m. 693/3). Yargıtay'a göre üçüncü kişinin elatmasına karşı paydaşlardan biri, diğerleri katılmasa bile **tek başına** ve **taşınmazın tamamı için** elatmanın önlenmesi davası açabilir. Fatma seranın kaldırılmasını ve elatmanın önlenmesini isteyebilir. Ecrimisil ise bölünebilir bir para alacağıdır; Fatma onu yalnız payı oranında, yani üçte bir oranında isteyebilir.

      *4. Anlaşma olmasaydı:* Paydaşlar kullanma konusunda uyuşamazsa yararlanma ve kullanma şeklini **hâkim** belirler (TMK m. 693/2). Hâkim kullanmayı zaman itibarıyla (yaz aylarını bölmek) ya da yer itibarıyla (evin ve bahçenin bölümlerini ayırmak) paydaşlar arasında bölebilir. Yargıtay'a göre hâkim keşif yapmalı, taşınmazın niteliğini ve paydaşların ihtiyaçlarını gözeten, seçenekler içeren bilirkişi raporu almalı; bütün paydaşlar davada yer almalıdır. Bu belirleme bir paylaşma değildir: kimse belirli bir bölümün maliki olmaz, paylar ve tapu kaydı değişmez, kullanma şekli taşınmazın sürekli özgülenmesi biçiminde belirlenemez.

      **Sonuç:**
      - Anlaşma şerh edildiğinden Gökhan ona uymak zorundadır; Temmuz ayını kullanabilir.
      - Deniz, Gökhan'a karşı payına elatmanın önlenmesini isteyebilir.
      - Fatma tek başına, taşınmazın tamamı için Hakan'a karşı elatmanın önlenmesi davası açabilir; ecrimisili ise payı oranında isteyebilir.
      - Anlaşma olmasaydı kullanma şeklini hâkim zaman ya da yer itibarıyla belirlerdi; mülkiyet değişmezdi.

  - olay: |
      Eskişehir'de iki katlı bir bina ve bahçesi, kat mülkiyeti kurulmadan dört kişinin paylı mülkiyetindedir: Hülya 2/6, İsmail 2/6, Kemal 1/6, Leyla 1/6. Bina imar durumu nedeniyle bölünememektedir.

      Kemal, binada kullandığı bölümü oğlu Mert'e bırakmıştır. Mert iki yıldır geceleri yüksek sesle müzik çalmakta, ortak merdivenin aydınlatmasını ve bahçe kapısını defalarca kırmakta, diğer paydaşları tehdit etmektedir. Hakkında birçok şikâyet ve tutanak vardır. Kemal yazılı uyarılara rağmen hiçbir şey yapmamaktadır. Ayrıca son üç yılın sigorta ve bakım giderlerinin tamamını (72.000 TL) İsmail ödemiştir; Hülya ve Leyla paylarına düşeni İsmail'e vermiş, Kemal vermemiştir.

      Hülya, İsmail ve Leyla, Kemal'in paydaşlıktan çıkarılması için dava açmaya karar verir. Hülya dava dilekçesinde Kemal'in payının kendisine devrini de ister. Kemal "Davranışlar oğlumun, benim değil" ve "Payımın değeri karar tarihine göre belirlenmeli" diye savunma yapar. Payın değeri dava tarihinde 1.800.000 TL'dir; yargılama sırasında 2.300.000 TL'ye çıkmıştır.

      1. Paydaşlıktan çıkarmanın şartları gerçekleşmiş midir? Kemal'in ilk savunmasını değerlendiriniz.
      2. Dava açma kararı için gereken çoğunluk sağlanmış mıdır?
      3. Hâkim Hülya'nın istemi karşısında nasıl karar verir? Kemal'in değer savunması yerinde midir? Hülya devir istememiş olsaydı ne olurdu?
      4. İsmail, Kemal'den ne isteyebilir?
      5. Bu davranışlarda Mert değil de Kemal'in payı üzerinde tapuya tescilli intifa hakkı bulunan annesi Nermin bulunsaydı ne olurdu?
    olcut:
      - {tespit: "Malın kullanılmasını bıraktığı kişinin davranışları nedeniyle ağır ihlal ve çekilmezlik şartlarının gerçekleşmesi; Kemal'in savunmasının yerinde olmaması", puan: 25, madde: "TMK m. 696"}
      - {tespit: "Dava açma kararı için pay ve paydaş çoğunluğunun hesaplanması", puan: 15, madde: "TMK m. 696"}
      - {tespit: "Aynen ayrılamayan payın, birlikte ileri sürülen istem üzerine dava tarihindeki değerle Hülya'ya devri; ödeme veya tevdi için süre ve tescil", puan: 25, madde: "TMK m. 696"}
      - {tespit: "Devir isteyen paydaş yoksa davalıya süre verilmesi ve payın açık artırmayla satışı", puan: 10, madde: "TMK m. 696"}
      - {tespit: "İsmail'in Kemal'den payı oranında 12.000 TL rücu isteyebilmesi", puan: 10, madde: "TMK m. 694"}
      - {tespit: "Çıkarma hükümlerinin pay üzerindeki intifa hakkı sahibine kıyasen uygulanması ve devri caiz olmayan hakkın uygun tazminatla sona ermesi", puan: 15, madde: "TMK m. 697"}
    cozum: |
      **Nitelendirme:** Bina dört kişinin paylı mülkiyetindedir (TMK m. 688). Diğer paydaşlar, Kemal'in sorumlu olduğu davranışlar nedeniyle onun paylı mülkiyet ilişkisinden çıkarılmasını istemektedir (TMK m. 696). Ayrıca ödenmemiş ortak giderler için rücu sorunu vardır (TMK m. 694).

      **Hukuki sorunlar:** (1) Çıkarma şartları ve üçüncü kişinin davranışından sorumluluk; (2) dava açma kararının çoğunluğu; (3) hâkimin vereceği kararın biçimi ve payın değerinin hangi tarihe göre belirleneceği; (4) gider rücuu; (5) pay üzerindeki intifa hakkı sahibinin çıkarılması.

      **İlgili hükümler:** TMK m. 694, 696, 697, 797 ve 806.

      **Değerlendirme:**

      *1. Çıkarma şartları:* TMK m. 696/1'e göre paydaş, kendi davranışlarıyla ya da **malın kullanılmasını bıraktığı** veya fiillerinden sorumlu olduğu kişilerin davranışlarıyla diğer paydaşlara karşı yükümlülüklerini **ağır biçimde** çiğner ve bu yüzden ilişkinin devamını onlar için **çekilmez** hâle getirirse mahkeme kararıyla çıkarılabilir. Kemal kullandığı bölümü Mert'e bırakmıştır; Mert malın kullanılmasının bırakıldığı kişidir. İki yıl süren gece gürültüsü, ortak alanlara tekrarlanan zararlar ve tehditler tek seferlik bir geçimsizlik değil, tutanaklarla belgelenmiş ağır bir ihlaldir. Kemal'in yazılı uyarılara rağmen hiçbir önlem almaması, ilişkinin diğer paydaşlar için çekilmez hâle geldiğini gösterir. Giderlere katılmaması da paydaşlık yükümlülüğünün ihlalidir. Kanun üçüncü kişinin davranışını açıkça paydaşa yüklediği için Kemal'in "davranışlar oğlumun" savunması yerinde değildir.

      *2. Dava açma kararı:* Aksi kararlaştırılmadıkça dava pay ve paydaş çoğunluğuyla açılır (TMK m. 696/2). Hülya, İsmail ve Leyla'nın payları toplamı 5/6'dır; dört paydaştan üçüdür. Kemal hesaba katılsa da katılmasa da (bu durumda üç paydaştan üçü) iki çoğunluk da sağlanmıştır. Davalı paydaşın hesaba katılıp katılmayacağı tartışması bu olayın sonucunu etkilemez.

      *3. Hâkimin kararı:* Bina imar durumu nedeniyle bölünemediğinden Kemal'in payını karşılayacak kısmın aynen ayrılması (TMK m. 696/3) mümkün değildir. Bu durumda payın dava tarihindeki değeriyle kendisine devrini isteyen paydaş, bu istemi çıkarma istemiyle **birlikte** ileri sürmelidir (TMK m. 696/4). Hülya bunu dava dilekçesinde yapmıştır. Hâkim, hüküm vermeden önce re'sen belirleyeceği uygun bir süre içinde pay değerinin ödenmesine veya tevdiine karar verir. Değer **dava tarihindeki** değer, yani 1.800.000 TL'dir; yargılama sırasındaki artış hesaba girmez. Kemal'in değer savunması bu nedenle yerinde değildir. Hülya ödeme ya da tevdi yaparsa ve dava kabul edilirse pay Hülya adına tescil edilir.
      Hülya devir istememiş olsaydı ve başka bir paydaş da bunu istemeseydi, hâkim Kemal'e payını devretmesi için bir süre verir, bu sürede devredilmeyen payın açık artırmayla satışına karar verirdi. Satış, cebrî icra yoluyla paraya çevirme hükümlerine göre yapılırdı (TMK m. 696/5).

      *4. İsmail'in rücuu:* Giderler, aksine hüküm yoksa payları oranında karşılanır ve fazla ödeyen paydaş diğerlerine payları oranında rücu eder (TMK m. 694). Kemal'in payı 1/6 olduğundan 72.000 TL'nin 12.000 TL'si Kemal'e düşer. İsmail bu tutarı Kemal'den isteyebilir.

      *5. Nermin'in durumu:* Çıkarma hükümleri, kıyas yoluyla pay üzerinde intifa hakkı sahiplerine de uygulanır (TMK m. 697). Bu durumda dava intifa hakkı sahibi Nermin'e yöneltilir ve TMK m. 696'daki şartlar onun davranışları bakımından aranır. İntifa hakkı kişiye bağlıdır: gerçek kişide hak sahibinin ölümüyle sona erer (TMK m. 797) ve kanun yalnız hakkın kullanılmasının devrine izin verir (TMK m. 806). Devri caiz olmayan bir hak olduğundan hâkim, hakkın **uygun bir tazminat karşılığında sona ermesine** karar verir.

      **Sonuç:**
      - Çıkarma şartları gerçekleşmiştir; Kemal, oğlunun davranışlarından sorumludur.
      - Dava açma kararı için pay ve paydaş çoğunluğu sağlanmıştır.
      - Pay, Hülya'nın hâkimin belirlediği sürede 1.800.000 TL'yi ödemesi ya da tevdi etmesi üzerine onun adına tescil edilir. Devir istemi olmasaydı süre verilir, sonra açık artırmaya gidilirdi.
      - İsmail, Kemal'den 12.000 TL isteyebilir.
      - İhlalci Nermin olsaydı, intifa hakkı uygun bir tazminat karşılığında sona erdirilirdi.

kartlar:
  - on: "Paylı mülkiyet nedir? (TMK m. 688/1)"
    arka: "Birden çok kişinin, maddi olarak bölünmemiş bir şeyin tamamına belli paylarla malik olması. Pay soyuttur, belirli bir yeri göstermez."
  - on: "Paylar belirlenmemişse ne olur?"
    arka: "Başka türlü belirlenmedikçe paylar eşit sayılır (TMK m. 688/2)."
  - on: "Paydaş kendi payı üzerinde ne yapabilir? (TMK m. 688/3)"
    arka: "Payını devredebilir ve rehnedebilir; pay alacaklılarca haczettirilebilir. Diğer paydaşların izni gerekmez."
  - on: "Kullanma ve yönetim anlaşması hangi çoğunlukla yapılır?"
    arka: "Oybirliğiyle (TMK m. 689/1)."
  - on: "Anlaşmayla kaldırılamayan iki yetki nedir?"
    arka: "Zorunlu yönetim işlerini yapmak ve gerekirse mahkemeden önlem istemek; zarar tehlikesine karşı derhâl gereken önlemleri bütün paydaşlar hesabına almak (TMK m. 689/1)."
  - on: "Taşınmazla ilgili paydaş anlaşması nasıl şerh edilir?"
    arka: "İmzalar noterlikçe onaylanır ve paydaşlardan birinin başvurusuyla tapu kütüğüne şerh verilir (TMK m. 689/3)."
  - on: "Olağan yönetim işlerini kim yapar?"
    arka: "Her paydaş tek başına; özellikle küçük onarımlar ve tarımsal işler (TMK m. 690/1). Paydaşların çoğunluğu bu yetkiyi farklı düzenleyebilir; zorunlu ve ivedi işler saklıdır."
  - on: "Önemli yönetim işleri nelerdir? (TMK m. 691)"
    arka: "İşletme usulü veya tarım türünün değiştirilmesi, adi kira veya ürün kirası sözleşmesinin yapılması ya da feshi, toprağın ıslahı ve değeri korumak için gerekli büyük bakım, onarım ve yapı işleri."
  - on: "Pay ve paydaş çoğunluğu ne demektir?"
    arka: "Kararı destekleyenlerin hem payları toplamının hem de sayılarının yarıdan fazla olması. İkisi birlikte aranır."
  - on: "Pay ve paydaşlar eşitse önemli yönetim kararı nasıl alınır?"
    arka: "Bir paydaşın istemiyle hâkim, bütün paydaşların menfaatini gözeterek hakkaniyete uygun karar verir; kayyım atayabilir (TMK m. 691/3)."
  - on: "Hangi işler bütün paydaşların kabulünü gerektirir? (TMK m. 692)"
    arka: "Amaç değişikliği, korumanın veya olağan kullanımın gerektirdiğini aşan yapı işleri ve malın tamamı üzerinde tasarruf. Oybirliğiyle aksi kararlaştırılabilir."
  - on: "Paylar üzerinde rehin varsa malın tamamına rehin kurulabilir mi?"
    arka: "Hayır. Paylar üzerinde taşınmaz rehni veya taşınmaz yükü varsa malın tamamı benzer haklarla kayıtlanamaz (TMK m. 692/2)."
  - on: "Hâkim kullanma şeklini nasıl belirler? (TMK m. 693/2)"
    arka: "Kullanmayı zaman veya yer itibarıyla paydaşlar arasında bölebilir. Bu paylaşma değildir; mülkiyet ve tapu kaydı değişmez."
  - on: "Üçüncü kişinin elatmasına karşı tek paydaş ne isteyebilir?"
    arka: "Tek başına taşınmazın tamamı için elatmanın önlenmesini; ecrimisili ise yalnız payı oranında (TMK m. 693/3 ve Yargıtay uygulaması)."
  - on: "Payından az yer kullandığını ileri süren paydaşın yolu nedir?"
    arka: "Payına karşılık çekişmesiz kullandığı yer varsa elatma davası dinlenmez; ortaklığın giderilmesi davası açmalıdır (Yargıtay)."
  - on: "Fiili taksim mülkiyeti ayırır mı?"
    arka: "Hayır (TMK m. 706). Ama Yargıtay, uzun süre benimsenmiş fiili kullanma düzenini resmî paylaşma veya imar uygulamasına kadar dürüstlük kuralıyla korur."
  - on: "Paylı maldaki giderler nasıl paylaşılır? (TMK m. 694)"
    arka: "Aksine hüküm yoksa payları oranında. Fazla ödeyen her paydaşa ancak onun payı oranında rücu eder; rücu müteselsil değildir."
  - on: "Paydaş kararları sonradan paydaş olanı bağlar mı? (TMK m. 695)"
    arka: "Evet. Ama taşınmazlarda bunun için kararların tapu kütüğüne şerh edilmesi gerekir."
  - on: "Paydaşlıktan çıkarmanın şartları nelerdir? (TMK m. 696/1)"
    arka: "Paydaşın kendi davranışlarıyla ya da malı bıraktığı veya fiillerinden sorumlu olduğu kişilerin davranışlarıyla yükümlülüklerin ağır biçimde çiğnenmesi, ilişkinin çekilmez hâle gelmesi ve mahkeme kararı."
  - on: "Paydaşlıktan çıkarma davası açma kararı hangi çoğunlukla alınır?"
    arka: "Aksi kararlaştırılmadıkça pay ve paydaş çoğunluğuyla (TMK m. 696/2)."
  - on: "Çıkarma davasında hâkimin üç seçeneği hangi sırayla uygulanır?"
    arka: "Önce aynen ayırma ve parçanın çıkarılana özgülenmesi; olmuyorsa isteyen paydaşa dava tarihindeki değerle devir; isteyen de yoksa davalıya süre ve açık artırma (TMK m. 696/3-5)."
  - on: "Çıkarmada pay değeri hangi tarihe göre belirlenir?"
    arka: "Dava tarihine göre. Devir istemi çıkarma istemiyle birlikte ileri sürülmelidir (TMK m. 696/4)."
  - on: "TMK m. 697 neyi düzenler?"
    arka: "Çıkarma hükümlerinin pay üzerindeki intifa, diğer ayni haklar ve şerhli kişisel yararlanma hakkı sahiplerine kıyasen uygulanmasını. Devri caiz olmayan hak uygun tazminatla sona erdirilir."
  - on: "Paydaşlıktan çıkarma ile ortaklığın giderilmesi farkı nedir?"
    arka: "Çıkarma, ağır ihlal şartıyla ve çoğunluk kararıyla yalnız bir paydaşı ilişkiden uzaklaştırır. Ortaklığın giderilmesini her paydaş sebep göstermeden ister ve paylı mülkiyet tümüyle biter (TMK m. 698)."
