    tanim: "Bir ayni hakkın tapu kütüğüne hak olarak kaydedilmesi. Tescile tabi ayni haklar tescille doğar ve sırasını ondan alır (TMK m. 1022)."
  - terim: Terkin
    tanim: "Kütükteki bir kaydın silinmesi. Kural olarak kaydın kendilerine hak sağladığı kişilerin yazılı beyanına bağlıdır (TMK m. 1014)."
  - terim: Şerh
    tanim: "Kişisel bir hakkın ya da tasarruf kısıtlamasının, taşınmaz üzerinde sonradan hak kazananlara karşı ileri sürülebilmesi için kütüğe yazılması."
  - terim: Tasarruf yetkisi kısıtlaması
    tanim: "Malikin taşınmaz üzerindeki tasarruflarının mahkeme kararı, haciz, iflas veya kanunda öngörülen bir işlemle sınırlandırılması (TMK m. 1010)."
  - terim: Geçici tescil şerhi
    tanim: "İddia edilen bir ayni hakkın ya da sonradan tamamlanacak bir belgenin sırasını önceden güvenceye alan şerh (TMK m. 1011)."
  - terim: Beyan
    tanim: "Taşınmazın hukuki durumu hakkında bilgi veren ve kendiliğinden hak doğurmayan kayıt (TMK m. 1012)."
  - terim: Tescil istemi
    tanim: "Tescilin yapılması için tapu memuruna yöneltilen yazılı açıklama. Kural olarak malik tarafından yapılır (TMK m. 1013)."
  - terim: Tasarruf yetkisi
    tanim: "Bir hak üzerinde tasarruf edebilme yetkisi. Tapuda, sicilde hak sahibi görünen kişi ya da onun temsilcisi olunduğu ispat edilerek belgelenir (TMK m. 1015/2)."
  - terim: Hukuki sebep
    tanim: "Tescili haklı kılan temel işlem ya da olay: satış, bağışlama, irtifak sözleşmesi, mahkeme kararı, miras."
  - terim: Resmî senet
    tanim: "Mülkiyete ve sınırlı ayni haklara ilişkin işlemler için kural olarak tapu sicil müdürlüğünde düzenlenen resmî belge (2644 sayılı Kanun m. 26)."
  - terim: Yevmiye defteri
    tanim: "Tescil istemlerinin geliş sırasına göre derhâl yazıldığı defter. Tescilin etkisi buradaki kayıt tarihinden başlar (TMK m. 1002 ve 1022)."
  - terim: Kurucu ve açıklayıcı tescil
    tanim: "Kurucu tescil ayni hakkı doğurur (TMK m. 1021). Tescilsiz kazanma hâllerinde tescil yalnız açıklayıcıdır, ama tasarruf için gereklidir (TMK m. 705/2)."
  - terim: Aile konutu şerhi
    tanim: "Malik olmayan eşin tapu müdürlüğünden isteyebildiği ve taşınmazın aile konutu olduğunu gösteren şerh (TMK m. 194/3)."
  - terim: Taşınmaz satış vaadi
    tanim: "Taraflara ileride taşınmaz satış sözleşmesi yapma borcu yükleyen, resmî şekle bağlı sözleşme (TBK m. 237/2). Mülkiyeti geçirmez, şerh edilebilir."

kararlar:
  - id: "113418900"
    ozet: |
      Taşınmazlarda payı bulunan bir borçlu, 2009'da noterde yapılan satış vaadi sözleşmesiyle paylarını şikâyetçiye satmayı vaat etmiş ve sözleşme aynı yıl tapuya şerh edilmiştir. 2011'de başka bir alacaklının takibinde bu paylara haciz konulunca vaat alacaklısı, şerhten sonra konulan haczin kaldırılması için icra mahkemesine şikâyette bulunmuş; ayrıca tapu iptali ve tescil davası açmıştır. İcra mahkemesi istemi reddetmiş, Yargıtay 12. Hukuk Dairesi şikâyetçinin aktif husumet ehliyeti bulunduğu gerekçesiyle bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu direnme kararını oybirliğiyle onamıştır. Gerekçeye göre satış vaadi şerhle ayni etkinlik ve aleniyet kazanır, ama bu etki önleyici değildir: Vaat alacaklısı taşınmazın devrini, ipotek edilmesini ya da haczini engelleyemez. Şerh, icra satışında mükellefiyetler listesinde yer alacağından vaat alacaklısı hakkını yeni malike karşı ileri sürebilir; icra dosyasının tarafı ve taşınmazın maliki olmadığı için şikâyet yoluna başvuramaz. Konuya katkısı: şerhin sonraki hak sahiplerine karşı ileri sürülebilirlik sağladığını, tasarrufu ise yasaklamadığını gösterir.
  - id: "289501700"
    ozet: |
      Davalıların murisi, 2002'de noterde yapılan satış vaadi sözleşmesiyle bir taşınmazdaki payını davacıya satmayı vaat etmiş ve sözleşme üç gün sonra tapuya şerh edilmiştir. Şerhten beş yılı aşkın süre sonra, 2007'de pay, şerh sicilde dururken bir konut yapı kooperatifine devredilmiş; davacı TMK m. 716'ya dayanarak tapu iptali ve tescil davası açmıştır. İlk derece mahkemesi, beş yıl içinde satış yapılmayan şerhin re'sen terkin olunması gerektiği ve bundan sonra hak kazananlara karşı ileri sürülemeyeceği gerekçesiyle davayı reddetmiş; Yargıtay 14. Hukuk Dairesi oy çokluğuyla bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu direnme kararını oy çokluğuyla bozmuştur. Gerekçeye göre 2644 sayılı Kanun m. 26'daki beş yıl kuralı tapu memuruna kendiliğinden terkin yetkisi vermez, şerhin malikin istemiyle terkin edilebileceği anlamına gelir; terkin edilmeyen şerh etkisini sürdürür ve şerhi görerek payı satın alan kooperatif iyiniyet iddiasında bulunamaz (TMK m. 1020 ve 1023). Karşı oy, beş yılın dolmasıyla şerhin üçüncü kişiler bakımından değerini yitirdiğini ve alıcının iyiniyetli olduğunu savunmuştur. Konuya katkısı: şerhin etkisini ve beş yıllık sürenin tartışmalı yorumunu gösterir.
  - id: "1228761400"
    ozet: |
      Davacıya ait bağımsız bölüm, davacı henüz kısıtlanmadan, Ocak 2014'te vekil aracılığıyla bir şirkete satılmış; şirket birkaç gün sonra kredisi için bir banka lehine ipotek kurdurmuştur. Davacının kısıtlılığı Mayıs 2014'te kesinleşmiş, açılan tapu iptali ve tescil davasında verilen ihtiyati tedbir Haziran 2014'te tapuya işlenmiş, şirketin alacaklıları ise Aralık 2014 ve Aralık 2015'te haciz koydurmuştur. Ehliyetsizlik nedeniyle kaydın iptaline ilişkin karar 2017'de kesinleşince davacı kayıttaki ipotek ve hacizlerin terkinini istemiştir. İlk derece mahkemesi davayı kabul etmiş; bölge adliye mahkemesi bankanın TMK m. 1023 korumasından yararlandığını kabul ederek ipotek yönünden davayı reddetmiş, hacizlerin terkinine karar vermiş; Yargıtay 7. Hukuk Dairesi bütün şerhlerin kaldırılması gerektiği gerekçesiyle bozmuş, bölge adliye mahkemesi direnmiştir. Hukuk Genel Kurulu direnme kararını oy çokluğuyla onamıştır. Gerekçeye göre tasarruf yetkisi kısıtlamaları şerh verilmekle sonradan hak kazananlara karşı ileri sürülebilir ve kimse kütükteki şerhi bilmediğini ileri süremez; bu nedenle kısıtlılığın kesinleşmesinden ve tedbir şerhinden sonra konulan hacizler terkin edilmeli, bunlardan önce kurulan ve kötüniyeti ispatlanamayan bankanın ipoteği korunmalıdır. Konuya katkısı: şerhin etkisinin tarih sırasına göre belirlendiğini gösterir; yolsuz tescil ve iyiniyetli üçüncü kişinin korunması ayrı konudadır.

sorular:
  - soru: |
      TMK m. 1008'e göre tapu kütüğüne **tescil** edilen haklar hangi seçenekte doğru olarak verilmiştir?
    siklar:
      - "Mülkiyet, irtifak hakları ve taşınmaz yükleri, rehin hakları"
      - "Mülkiyet, kira hakkı ve rehin hakları"
      - "Mülkiyet, satış vaadinden doğan hak ve irtifak hakları"
      - "Yalnız mülkiyet; diğer bütün haklar şerh edilir"
    dogru: 0
    aciklama: |
      TMK m. 1008 tescil edilecek hakları mülkiyet, irtifak hakları ve taşınmaz yükleri ile rehin hakları olarak sayar. Kira ve satış vaadi kişisel haktır; tescil edilmez, ancak şerh edilebilir (TMK m. 1009). İrtifak ve rehin de ayni haktır ve tescille doğar.

  - soru: |
      Aşağıdakilerden hangisi TMK m. 1009'a göre tapu kütüğüne şerh edilebilecek kişisel haklar arasında **sayılmamıştır**?
    siklar:
      - "Arsa payı karşılığı inşaat sözleşmesinden doğan hak"
      - "Kira sözleşmesinden doğan hak"
      - "Geri alım sözleşmesinden doğan hak"
      - "Ödünç sözleşmesinden doğan geri ödeme alacağı"
    dogru: 3
    aciklama: |
      TMK m. 1009/1, arsa payı karşılığı inşaat, taşınmaz satış vaadi, kira, alım, önalım ve geri alım sözleşmelerinden doğan haklar ile şerhine kanunda açıkça izin verilen diğer hakları sayar. Ödünç alacağı ne bu listede ne de şerhe izin veren bir kanun hükmünde yer alır. Ödünç veren, ancak icra takibinde haciz koydurarak bir tasarruf kısıtlaması şerhi sağlayabilir (TMK m. 1010).

  - soru: |
      Ayten, dairesini noterde yapılan satış vaadi sözleşmesiyle Barış'a satmayı vaat eder ve sözleşme 5 Mayıs 2025'te tapuya şerh edilir. Ayten 1 Şubat 2026'da daireyi tapuda Cenk'e satar. Cenk, şerhi gördüğünü ama vaadin yalnız Ayten'i bağladığını savunur. Hangisi doğrudur?
    siklar:
      - "Satış vaadi kişisel hak doğurduğu için Barış yalnız Ayten'den tazminat isteyebilir."
      - "Şerh nedeniyle Barış hakkını şerhten sonra malik olan Cenk'e karşı ileri sürebilir; Cenk iyiniyet iddiasında bulunamaz."
      - "Şerh Barış'ı malik yapmıştır; Cenk adına yapılan tescil kendiliğinden hükümsüzdür."
      - "Barış hakkını Cenk'e karşı ancak Cenk'in kötüniyetini ayrıca ispatlarsa ileri sürebilir."
    dogru: 1
    aciklama: |
      TMK m. 1009/2'ye göre şerh verilen kişisel hak, taşınmaz üzerinde sonradan kazanılan hakların sahiplerine karşı ileri sürülebilir. Kimse tapu sicilindeki bir kaydı bilmediğini ileri süremeyeceğinden (TMK m. 1020/3) Barış'ın ayrıca kötüniyet ispatlamasına gerek yoktur. Şerh hakkı ayni hakka dönüştürmez; Barış malik değildir ve tescil için dava açmalıdır (TMK m. 716). Şerhten itibaren beş yıl da dolmamıştır (2644 sayılı Kanun m. 26).

  - soru: |
      Kişisel bir hakkın tapuya şerh edilmesinin sonucu hakkında hangisi doğrudur?
    siklar:
      - "Hak ayni hakka dönüşür ve herkese karşı ileri sürülebilir."
      - "Hak, şerhten önce taşınmaz üzerinde kurulmuş haklara karşı da öncelik kazanır."
      - "Hak kişisel kalır, ancak taşınmaz üzerinde sonradan hak kazananların sahiplerine karşı ileri sürülebilir."
      - "Şerhten sonra malik taşınmazı geçerli olarak devredemez ve rehnedemez."
    dogru: 2
    aciklama: |
      TMK m. 1009/2'ye göre şerh, kişisel hakkı yalnız şerhten sonra hak kazananlara karşı ileri sürülebilir kılar. Şerhten önce tescil edilen bir ipotek önceliğini korur. Yargıtay Hukuk Genel Kurulu'na göre şerh önleyici değildir; malik taşınmazı devredebilir ve rehnedebilir, ama sonraki hak sahipleri şerhli hakkı kabul etmek zorundadır.

  - soru: |
      Yargıtay Hukuk Genel Kurulu'na göre lehine satış vaadi şerhi bulunan kişinin, şerhten sonra başka bir alacaklının takibinde taşınmaza konulan haciz karşısındaki durumu nedir?
    siklar:
      - "Şerh tasarrufu yasakladığından haciz kendiliğinden geçersizdir ve tapuya işlenemez."
      - "Şerh önleyici değildir; vaat alacaklısı haczi engelleyemez ve şikâyet yoluyla kaldırtamaz, ama hakkını taşınmazı edinecek yeni malike karşı ileri sürebilir."
      - "Vaat alacaklısı icra dosyasının tarafı sayıldığından şikâyet yoluyla haczi kaldırtabilir."
      - "Haciz şerhten sonra konulsa bile vaat alacaklısının hakkını ortadan kaldırır."
    dogru: 1
    aciklama: |
      Hukuk Genel Kurulu'na göre satış vaadi şerhle ayni etkinlik ve aleniyet kazanır, ama bu etki önleyici değildir; vaat alacaklısı taşınmazın devrini, ipotek edilmesini ya da haczini engelleyemez. İcra dosyasının tarafı ve malik olmadığı için şikâyet yoluna başvuramaz. Şerh icra satışında mükellefiyetler listesinde yer alacağından hakkını yeni malike karşı ileri sürebilir (TMK m. 1009/2).

  - soru: |
      2644 sayılı Kanun m. 26'ya göre noterce düzenlenen taşınmaz satış vaadi sözleşmesi tapuya şerh edildikten sonra hangi süre içinde satış yapılmazsa şerh re'sen terkin olunur?
    siklar:
      - "Bir yıl"
      - "Beş yıl"
      - "On yıl"
      - "Yirmi yıl"
    dogru: 1
    aciklama: |
      2644 sayılı Kanun m. 26'ya göre şerhten itibaren beş yıl içinde satış yapılmaz veya irtifak hakkı kurulup tescil edilmezse şerh re'sen terkin olunur. On yıllık süre, sözleşmeden doğan önalım, alım ve geri alım şerhlerinin etkisine ilişkindir (TMK m. 735 ve 736). Süre dolduğu hâlde terkin edilmemiş şerhin etkisi tartışmalıdır; Hukuk Genel Kurulu çoğunluğu terkin edilmedikçe etkisinin sürdüğünü kabul etmiştir.

  - soru: |
      2644 sayılı Kanun m. 26'ya göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Mülkiyete ve sınırlı ayni haklara ilişkin resmî senetleri tapu sicil müdürü veya tapu sicil görevlileri düzenler."
      - "Taşınmaz satışına ilişkin resmî senedi yalnız taraflar imzalar; tapu görevlisinin imzası gerekmez."
      - "Bankaların kredilerine karşılık ipotekler ancak noterde düzenlenen resmî senetle tescil edilebilir."
      - "Taraflar farklı tapu müdürlüklerinin bulunduğu yerlerdeyse taşınmaz devri sözleşmesi yapılamaz."
    dogru: 0
    aciklama: |
      2644 sayılı Kanun m. 26'ya göre resmî senetleri tapu sicil müdürü veya tapu sicil görevlileri düzenler. Senedi taraflar ve hazırlayan görevliler imzalar, müdür ya da görevlendirilen memur onaylar. Banka ve kredi kuruluşu ipotekleri tarafların istemiyle kredi veya borç sözleşmesine dayanılarak tescil olunur. Taraflar farklı tapu müdürlüklerindeyse iradeleri ayrı ayrı alınarak sözleşme tamamlanabilir. Ayrıca 1512 sayılı Kanun m. 61/A taşınmaz satış sözleşmesinin noterlerce de yapılabilmesini öngörür.

  - soru: |
      Aşağıdakilerden hangisi TMK m. 1010'a göre **tasarruf yetkisinin kısıtlanması şerhi** olarak tapuya yazılan sebeplerden biri **değildir**?
    siklar:
      - "Çekişmeli hakların korunmasına ilişkin mahkeme kararı"
      - "Haciz"
      - "Artmirasçı atanması"
      - "Kira sözleşmesi"
    dogru: 3
    aciklama: |
      TMK m. 1010/1 üç grup sayar: çekişmeli hakların korunmasına ilişkin mahkeme kararları; haciz, iflas kararı veya konkordato ile verilen süre; aile yurdu kurulması ve artmirasçı atanması gibi şerh verilmesi kanunen öngörülen işlemler. Kira sözleşmesinden doğan hak bir kişisel haktır ve TMK m. 1009'a göre şerh edilir.

  - soru: |
      Selin, Kaan aleyhine açtığı tapu iptali ve tescil davasında taşınmazın devrinin önlenmesine ilişkin ihtiyati tedbir kararı alır; tedbir 2 Nisan'da tapuya şerh edilir. Kaan 10 Nisan'da taşınmazı X Bankası lehine ipotek ettirir. Banka, tedbiri bilmediğini savunur. Hangisi doğrudur?
    siklar:
      - "Banka tapuya güvendiği için ipoteği her durumda Selin'e karşı korunur."
      - "Tedbir şerhi, şerhten sonra hak kazanan bankaya karşı ileri sürülebilir; banka şerhi bilmediğini ileri süremez."
      - "İhtiyati tedbir kararları tapuya şerh edilemez, yalnız davanın tarafları arasında hüküm doğurur."
      - "Banka, ancak Selin bankanın kötüniyetini ayrıca ispatlarsa bu şerhten etkilenir."
    dogru: 1
    aciklama: |
      Çekişmeli hakların korunmasına ilişkin mahkeme kararları tasarruf yetkisi kısıtlaması olarak şerh verilebilir (TMK m. 1010/1-1). Şerh verilen kısıtlama, taşınmaz üzerinde sonradan kazanılan hakların sahiplerine karşı ileri sürülebilir (TMK m. 1010/2). Kimse tapu sicilindeki bir kaydı bilmediğini ileri süremeyeceğinden (TMK m. 1020/3) ayrıca kötüniyet ispatı gerekmez. Hukuk Genel Kurulu da tedbir şerhinden sonra konulan hacizlerin terkinini kabul etmiştir.

  - soru: |
      İİK m. 28'e göre bir taşınmaz davasında ilk derece mahkemesi davacı lehine hüküm verdiğinde hangisi gerçekleşir?
    siklar:
      - "Hüküm kesinleşmeden tapuya hiçbir bildirim yapılamaz."
      - "Mahkeme, davacının talebine gerek olmadan hüküm özetini tapu sicil dairesine bildirir; bu şerh TMK m. 1010/2 hükmüne tabidir."
      - "Tapu memuru taşınmazı hemen davacı adına tescil eder."
      - "Davacı, hükmü tapuya şerh ettirmek için ayrı bir dava açmalıdır."
    dogru: 1
    aciklama: |
      İİK m. 28'e göre taşınmaz davalarında davacı lehine hüküm verilirse mahkeme, davacının talebine gerek kalmadan hükmün tefhimiyle birlikte özetini tapu sicil dairesine bildirir ve daire bunu taşınmazın kaydına şerh verir. Kanun bu şerhi açıkça TMK m. 1010/2'ye tabi kılar; şerhten sonra hak kazananlar ona bağlıdır. Taşınmaz mal ile ilgili ayni haklara ilişkin kararlar ise kesinleşmedikçe yerine getirilemez (HMK m. 350/2 ve HMK m. 367/2); tescil bu yüzden hemen yapılmaz. Karar sonradan davacı aleyhine kesinleşirse mahkeme bunu da tapuya bildirir.

  - soru: |
      TMK m. 194'e göre aile konutu şerhi hakkında hangisi doğrudur?
    siklar:
      - "Aile konutu şerhini yalnız konutun maliki olan eş isteyebilir."
      - "Malik olmayan eş şerhi tapu müdürlüğünden isteyebilir; açık rıza şartı şerhten değil doğrudan kanundan doğar."
      - "Şerh verilmedikçe diğer eşin açık rızası hiçbir durumda aranmaz."
      - "Şerh ancak boşanma davası açıldıktan sonra mahkeme kararıyla verilebilir."
    dogru: 1
    aciklama: |
      TMK m. 194/3'e göre aile konutu olarak özgülenen taşınmazın maliki olmayan eş, gerekli şerhin verilmesini tapu müdürlüğünden isteyebilir; dava açması gerekmez. Diğer eşin açık rızası şartı TMK m. 194/1'den doğar ve şerh bulunmasa da eşler arasında geçerlidir. Şerhin yokluğu yalnız üçüncü kişinin iyiniyet savunmasını gündeme getirir; Hukuk Genel Kurulu'na göre şerh yoksa iyiniyetli üçüncü kişi TMK m. 1023 korumasından yararlanır.

  - soru: |
      Usta Kemal'in üstlendiği tadilat 1 Haziran'da biter. Malik alacağı tanımayınca Kemal kanuni ipoteğinin tescili için dava açar ve 15 Haziran'da hâkim kararıyla geçici tescil şerhi verilir. Malik 1 Temmuz'da taşınmazı bankaya ipotek eder. Kemal davayı kazanır ve ipoteği 25 Ağustos'ta tescil edilir. Hangisi doğrudur?
    siklar:
      - "Kemal'in ipoteği Ağustos'ta tescil edildiği için Temmuz'daki banka ipoteğinden sonra gelir."
      - "Kemal'in hakkı, geçici tescil şerhinin verildiği 15 Haziran'dan başlayarak üçüncü kişilere karşı ileri sürülebilir; banka ipoteği ona üstün gelmez."
      - "Geçici tescil şerhi yalnız malik ile Kemal arasında hüküm doğurur."
      - "Banka ipoteği geçici tescil şerhine rağmen kurulduğu için geçersizdir ve kendiliğinden silinir."
    dogru: 1
    aciklama: |
      TMK m. 1011/2'ye göre geçici tescil şerhinin konusu olan hak sonradan gerçekleşirse, şerh tarihinden başlayarak üçüncü kişilere karşı ileri sürülebilir. Şerh, malikin sonradan ipotek kurmasını engellemez; banka ipoteği geçerlidir, ama Kemal'in hakkına üstün gelmez. Yapı alacaklısının ipoteği için üç aylık süre ile alacağın kabul edilmesi ya da mahkemece karara bağlanması şartı (TMK m. 895) bu yüzden önem taşır: Geçici tescil şerhi, dava sürerken alacaklının sırasını korur. Olayda ipotek, işin tamamlandığı 1 Haziran'dan itibaren üç ay içinde tescil edilmiştir (TMK m. 895/2).

  - soru: |
      TMK m. 1012'ye göre aşağıdakilerden hangisi tapu kütüğünün **beyanlar** sütununa yazılır?
    siklar:
      - "Malikin istemi üzerine taşınmazın eklentileri"
      - "Kira sözleşmesinden doğan hak"
      - "İpotek"
      - "Haciz"
    dogru: 0
    aciklama: |
      TMK m. 1012/1'e göre taşınmazın eklentileri malikin istemi üzerine beyanlar sütununa yazılır; kamu hukuku kısıtlamaları ve diğer hususlar yönetmelikle belirlenir (TMK m. 1012/2). Kira kişisel hak olarak şerh edilir (TMK m. 1009), ipotek rehin hakkı olarak tescil edilir (TMK m. 1008), haciz ise tasarruf yetkisi kısıtlaması olarak şerh verilir (TMK m. 1010).

  - soru: |
      Otel sahibi Can, otelini bankaya ipotek ederken mutfak ekipmanlarını ve oda mobilyalarını açıkça eklenti olarak gösterip beyanlar sütununa yazdırır. Daha sonra Can, bu eşyaların eklenti olmadığını ve ipoteğin onları kapsamadığını ileri sürer. Hangisi doğrudur?
    siklar:
      - "Beyan hiçbir sonuç doğurmadığından eşyaların eklenti olduğunu banka ispat etmelidir."
      - "Beyanlar sütununa yazılan bu şeyler, kanuna göre eklenti olamayacakları ispat edilmedikçe eklenti sayılır ve ipoteğin kapsamına girer."
      - "Eşyalar tapuya yazıldığı için taşınmaz niteliği kazanmış ve bütünleyici parça olmuştur."
      - "Can beyanı tek başına sildirerek eşyaları ipoteğin kapsamından çıkarabilir."
    dogru: 1
    aciklama: |
      TMK m. 862/2'ye göre rehnin kuruluşu sırasında makine, otel döşeme eşyası gibi açıkça eklenti olarak gösterilen ve beyanlar sütununa yazılan şeyler, kanuna göre bu nitelikte olamayacakları ispat edilmedikçe eklenti sayılır. İspat yükü Can'dadır. Eklenti taşınır mal olarak kalır (TMK m. 686/2). Eklenti kaydının terkini, kütükte hak sahibi görünen bütün ilgililerin, burada bankanın rızasına bağlıdır (TMK m. 1012/1).

  - soru: |
      Zeynep, Ali aleyhine açtığı tescile zorlama davasını kazanır ve karar kesinleşir. Ali tapuya gelip beyanda bulunmayı reddeder. Hangisi doğrudur?
    siklar:
      - "Ali'nin yazılı beyanı olmadan tescil yapılamaz; Zeynep yeni bir dava açmalıdır."
      - "Kesinleşmiş mahkeme kararına dayanan Zeynep için malikin beyanına gerek yoktur; Zeynep tescili kararla isteyebilir."
      - "Tescil için Ali'nin noterde onaylı muvafakatnamesi gerekir."
      - "Zeynep, Ali'yi tapuda beyana zorlamak için icra dairesine başvurmalıdır."
    dogru: 1
    aciklama: |
      TMK m. 1013/1'e göre tescil kural olarak malikin yazılı beyanı üzerine yapılır. Ancak edinen kişi kesinleşmiş mahkeme kararına dayanıyorsa bu beyana gerek yoktur (TMK m. 1013/2). Mahkeme kararına dayanarak mülkiyeti kazanan kişi tescili doğrudan doğruya yaptırabilir (TMK m. 716/2).

  - soru: |
      Selim ile Deniz bir tarlanın 2.000.000 TL'ye satışını adi yazılı bir sözleşmeyle yapar ve tapu müdürlüğüne başvurarak Deniz adına tescil ister. Tapu memuru ne yapmalıdır?
    siklar:
      - "Malik Selim'in yazılı beyanı bulunduğundan tescili yapmalıdır."
      - "Hukuki sebebin geçerlilik şekline uyulduğu belgelenmediğinden istemi reddetmelidir."
      - "Belgeler tamamlanıncaya kadar geçici tescil şerhi vermelidir."
      - "Sözleşmeyi beyanlar sütununa yazmalıdır."
    dogru: 1
    aciklama: |
      Hukuki sebebin belgelenmesi, bu sebebin geçerliliği için gerekli şekle uyulduğunun ispatıyla olur (TMK m. 1015/3). Taşınmaz mülkiyetinin devrini amaçlayan sözleşmeler resmî şekilde düzenlenmedikçe geçerli değildir (TMK m. 706/1; TBK m. 237/1). Belgeler tamam değilse istem reddedilir (TMK m. 1016/1). Geçici tescil şerhi, hukuki sebep belgeleri tam olup yalnız tasarruf yetkisi belgesinin tamamlanması gerektiğinde verilebilir (TMK m. 1016/2).

  - soru: |
      Ayşe, kardeşi Burak'a noterden "her türlü işlerimi takip etmeye" yetki veren genel bir vekâletname verir. Burak bu vekâletnameyle Ayşe'nin tarlasını satmak için tapu müdürlüğüne başvurur. Hangisi doğrudur?
    siklar:
      - "Genel vekâletname her türlü hukuki işlemi kapsadığından satış yapılabilir."
      - "Vekil özel olarak yetkili kılınmadıkça taşınmazı devredemez; tasarruf yetkisi belgelenmediğinden istem reddedilir."
      - "Burak'ın Ayşe'nin kardeşi olması temsil yetkisi için yeterlidir."
      - "Satış yapılır; Ayşe sonradan onaylamazsa tescil kendiliğinden terkin edilir."
    dogru: 1
    aciklama: |
      İstemde bulunan, sicilde hak sahibi görünen kişinin temsilcisi olduğunu ispat ederek tasarruf yetkisini belgeler (TMK m. 1015/2). Vekil özel olarak yetkili kılınmadıkça taşınmazı devredemez ve bir hakla sınırlandıramaz (TBK m. 504/3); tapuda işlem gerektiren vekâletname de noterde düzenleme şeklinde yapılır (1512 sayılı Kanun m. 89). Tasarruf yetkisi belgelenmediğinden istem reddedilir (TMK m. 1016/1). Kardeşlik temsil yetkisi vermez.

  - soru: |
      TMK m. 1022/2'ye göre kanunen gerekli belgeler isteme eklenmişse tescilin etkisi hangi andan başlar?
    siklar:
      - "Kütüğe kaydın yapıldığı tarihten"
      - "İstemin yevmiye defterine kaydedildiği tarihten"
      - "Borçlandırıcı sözleşmenin yapıldığı tarihten"
      - "Tescilin ilgililere tebliğ edildiği tarihten"
    dogru: 1
    aciklama: |
      TMK m. 1022/2'ye göre tescilin etkisi, kanunen öngörülen belgeler isteme eklenmiş ya da geçici tescil hâlinde belgeler uygun zamanda tamamlanmışsa yevmiye defterine yapılan kayıt tarihinden başlar. Kütüğe yazmanın sonradan yapılması bu tarihi değiştirmez. Tebliğ zorunluluğu (TMK m. 1019) itiraz süresiyle ilgilidir, etkinin başlangıcıyla değil.

  - soru: |
      Kerem, babası Fikret'in ölümüyle tek mirasçı olur. Fikret'in tarlası tapuda hâlâ Fikret adına kayıtlıdır. Kerem tarlayı hemen satmak ister. Hangisi doğrudur?
    siklar:
      - "Kerem mirasla mülkiyeti kazanmıştır, ama tarla üzerinde tasarruf edebilmesi için önce mülkiyetin kendi adına tescil edilmesi gerekir."
      - "Kerem tescil yapılıncaya kadar malik değildir."
      - "Kerem tescil yaptırmadan tarlayı alıcıya doğrudan devredebilir."
      - "Mirasçı tescili ancak mahkeme kararıyla isteyebilir."
    dogru: 0
    aciklama: |
      Mirasçılar mirasbırakanın ölümüyle mirası kanun gereği kazanır (TMK m. 599). Miras, mülkiyetin tescilden önce kazanıldığı hâllerdendir; ama malikin tasarruf işlemi yapabilmesi mülkiyetin tapuya tescil edilmesine bağlıdır (TMK m. 705/2). Kerem, sulh mahkemesinden ya da noterden alacağı mirasçılık belgesiyle (TMK m. 598) tescili kendisi isteyebilir (TMK m. 1013/3); mahkeme kararı gerekmez.

  - soru: |
      Burak ile komşusu Elif, Elif'in arsası üzerinde Burak'ın arsası lehine resmî şekilde geçit irtifakı sözleşmesi yapar, ama irtifak tapuya tescil edilmez. Elif arsasını Hakan'a satar. Hangisi doğrudur?
    siklar:
      - "Sözleşme resmî şekilde yapıldığı için geçit irtifakı doğmuştur ve Hakan'ı bağlar."
      - "İrtifak tescil edilmedikçe doğmaz; Burak Hakan'a karşı ayni bir hak ileri süremez, Elif'e karşı ise sözleşmeden doğan kişisel haklarını kullanabilir."
      - "Hakan'ın sözleşmeyi bilmesi tek başına irtifakı doğurur."
      - "Resmî şekilde yapılan sözleşme kendiliğinden beyanlar sütununa yazılır ve ayni etki kazanır."
    dogru: 1
    aciklama: |
      İrtifak hakkının kurulması için tapu kütüğüne tescil şarttır (TMK m. 780/1). Kurulması tescile tabi ayni haklar tescil edilmedikçe varlık kazanamaz (TMK m. 1021). Resmî şekil (TMK m. 781) yalnız sözleşmenin geçerliliğini sağlar ve Elif'e karşı bir borç doğurur. Hakan'ın bilgisi ayni hakkı doğurmaz; sözleşme de kendiliğinden kütüğe yazılmaz.

olaylar:
  - olay: |
      Ali, Ataşehir'deki dairesini 10 Mart 2025'te noterde düzenleme şeklinde yapılan satış vaadi sözleşmesiyle Zeynep'e 4.000.000 TL'ye satmayı vaat eder. Zeynep bedelin tamamını aynı gün öder. Sözleşmeye göre tapudaki devir 1 Eylül 2025'te yapılacaktır. Sözleşme, Zeynep'in istemi üzerine 11 Mart 2025'te tapu kütüğüne şerh verilir. Dairenin tapu kaydında 2023'ten beri Ali'nin kredisi için X Bankası lehine tescil edilmiş bir ipotek bulunmaktadır.

      Ali 1 Eylül'de devri yapmaz. Ali'nin alacaklısı Y Ltd. Şti., Ali aleyhine başlattığı icra takibinde 10 Kasım 2025'te daireye haciz koydurur. Zeynep, şerhten sonra konulan bu haczin kaldırılması için icra mahkemesine şikâyette bulunur.

      Ali 15 Ocak 2026'da daireyi tapuda Mehmet'e 4.500.000 TL'ye satar. Mehmet tapu kaydını incelediğini ve şerhi gördüğünü kabul eder, ama şöyle savunur: "Satış vaadi yalnız Ali'yi bağlar. Ben bedeli ödedim, tapuya güvendim, iyiniyetliyim."

      1. Zeynep'in Ali'ye karşı hakkının niteliği nedir? Şerh bu hakka ne kazandırmıştır?
      2. Zeynep Mehmet'e karşı ne isteyebilir? Mehmet'in savunmasını değerlendiriniz.
      3. X Bankası'nın ipoteği Zeynep'in durumunu nasıl etkiler?
      4. Zeynep'in şikâyeti ve haczin onun hakkına etkisi hakkında ne söylenebilir?
    olcut:
      - {tespit: "Satış vaadinin noterde resmî şekilde yapılmakla geçerli olması, kişisel hak doğurması ve mülkiyeti geçirmemesi", puan: 15, madde: "TBK m. 237"}
      - {tespit: "Satış vaadinin şerh edilebilen haklardan olması ve şerhin hakkı sonradan hak kazananlara karşı ileri sürülebilir kılması; beş yıllık sürenin dolmamış olması", puan: 20, madde: "TMK m. 1009"}
      - {tespit: "Mehmet'in şerhten sonra hak kazanması ve sicildeki kaydı bilmediğini ileri sürememesi; iyiniyet savunmasının dinlenmemesi", puan: 15, madde: "TMK m. 1020"}
      - {tespit: "Zeynep'in kayıt maliki Mehmet'e karşı mülkiyetin hükmen geçirilmesini (tapu iptali ve tescil) isteyebilmesi", puan: 15, madde: "TMK m. 716"}
      - {tespit: "Şerhten önce tescil edilen ipoteğin önceliği; Zeynep'in daireyi ipotekle yüklü olarak kazanması", puan: 15, madde: "TMK m. 1022"}
      - {tespit: "Şerhin önleyici olmaması; vaat alacaklısının haczi engelleyememesi ve şikâyet yetkisinin bulunmaması, ama şerhten sonraki haczin şerhli hakka üstün gelmemesi", puan: 20, madde: "TMK m. 1009"}
    cozum: |
      **Nitelendirme:** Ali ile Zeynep arasında bir taşınmaz satış vaadi sözleşmesi vardır. Bu sözleşme Ali'ye daireyi Zeynep'e devretme borcu yükler, ama mülkiyeti kendiliğinden geçirmez. Sözleşmeden doğan hak kişisel bir haktır ve tapuya şerh edilmiştir.

      **Hukuki sorunlar:** (1) Satış vaadinin geçerliliği ve şerhin etkisi; (2) şerhten sonra malik olan Mehmet'e karşı hakkın ileri sürülmesi; (3) şerhten önceki ipoteğin durumu; (4) şerhten sonra konulan haciz ve şikâyet yolu.

      **İlgili hükümler:** TBK m. 237/2; 1512 sayılı Kanun m. 60; 2644 sayılı Kanun m. 26; TMK m. 1009, 1020/3, 1022/1, 716/1.

      **Değerlendirme:**

      *1. Hakkın niteliği ve şerh:* Taşınmaz satışı vaadi resmî şekilde düzenlenmedikçe geçerli olmaz (TBK m. 237/2). Noterde düzenleme şeklinde yapılan sözleşme bu şartı karşılar; satış vaadi sözleşmesi yapmak noterin görevleri arasındadır (1512 sayılı Kanun m. 60). Sözleşme Zeynep'e, Ali'den mülkiyetin devrini isteme konusunda kişisel bir hak verir; Ali'nin borcu 1 Eylül 2025'te muaccel olmuştur. Kişisel hak kural olarak yalnız Ali'ye karşı ileri sürülür. Ancak satış vaadinden doğan hak şerh edilebilecek haklar arasında sayılmıştır (TMK m. 1009/1) ve noterce düzenlenen satış vaadi taraflardan birinin istemiyle şerh verilir (2644 sayılı Kanun m. 26). Şerh hakkı ayni hakka dönüştürmez, ama onu taşınmaz üzerinde sonradan hak kazananlara karşı ileri sürülebilir kılar (TMK m. 1009/2). Şerh 11 Mart 2025 tarihlidir ve beş yıllık süre dolmamıştır.

      *2. Mehmet'e karşı istem:* Mehmet daireyi şerhten sonra edinmiştir. Bu nedenle Zeynep hakkını Mehmet'e karşı da ileri sürebilir. Kimse tapu sicilindeki bir kaydı bilmediğini ileri süremez (TMK m. 1020/3); Mehmet şerhi gördüğünü de kabul etmektedir. "Tapuya güvendim" savunması, kütükte açıkça görünen şerh karşısında dinlenmez; Yargıtay Hukuk Genel Kurulu da şerhi görerek taşınmazı alan kişinin iyiniyet iddiasında bulunamayacağını kabul eder. Bedeli ödemiş ve borcu muaccel olan Zeynep, TMK m. 716/1'e dayanarak mülkiyetin hükmen geçirilmesini, yani tapu iptali ve tescil davasıyla dairenin kendi adına tescilini isteyebilir. Tapu kaydının iptali istendiği için dava, şerhten sonra kayıt maliki olan Mehmet'e karşı yöneltilir. Mehmet'in ödediği bedel için Ali'ye başvurması, kendi aralarındaki sözleşmeye ilişkin ayrı bir sorundur.

      *3. İpotek:* İpotek bir rehin hakkı olarak 2023'te tescil edilmiştir (TMK m. 1008). Ayni haklar sıralarını ve tarihlerini tescile göre alır (TMK m. 1022/1). Şerhin etkisi yalnız sonradan kazanılan haklara yöneliktir; şerhten önce kurulan ipotek Zeynep'e karşı da geçerlidir. Zeynep daireyi ipotekle yüklü olarak kazanır. Borç ödenmezse banka daireyi paraya çevirtebilir. Zeynep'in bu konudaki istemleri yalnız Ali'ye karşıdır.

      *4. Haciz ve şikâyet:* Yargıtay Hukuk Genel Kurulu'na göre satış vaadi şerhi önleyici değildir; vaat alacaklısı taşınmazın devrini, ipotek edilmesini ya da haczini engelleyemez. Bu yüzden haczin konulması hukuka aykırı değildir. Zeynep icra dosyasının tarafı ve taşınmazın maliki olmadığından şikâyet yoluyla haczin kaldırılmasını isteyemez; şikâyeti takip yetkisi yokluğundan reddedilir. Bu, Zeynep'in hakkını kaybettiği anlamına gelmez. Haciz şerhten sonra konulduğu için şerhli hak hacze karşı da ileri sürülebilir (TMK m. 1009/2). Hukuk Genel Kurulu'nun belirttiği gibi taşınmaz icra yoluyla satılsa bile şerh mükellefiyetler listesinde yer alır ve Zeynep hakkını yeni malike karşı ileri sürebilir. Zeynep korumayı tescil davasında arar.

      **Sonuç:**
      - Zeynep'in hakkı kişisel bir haktır; şerh onu sonradan hak kazananlara karşı ileri sürülebilir kılmıştır.
      - Zeynep, Mehmet'e karşı tapu iptali ve tescil davası açabilir; Mehmet iyiniyet savunmasında bulunamaz.
      - Şerhten önce tescil edilen ipotek Zeynep'e karşı da geçerlidir; Zeynep daireyi ipotekli olarak kazanır.
      - Zeynep haczi şikâyet yoluyla kaldırtamaz, ama şerhten sonra konulan haciz onun hakkına üstün gelmez.

  - olay: |
      İzmir'de yaşayan Ayşe, Bodrum'daki tarlasını Cem'e 3.000.000 TL'ye satmak ister.

      (a) Ayşe, kardeşi Burak'a noterden "her türlü işlerimi takip etmeye ve beni temsile" yetki veren genel bir vekâletname verir. Burak bu vekâletnameyle Bodrum Tapu Müdürlüğüne başvurarak satışı ister. Tapu memuru istemi reddeder.

      (b) Bunun üzerine Ayşe ve Cem, satış bedelini ve tarlayı gösteren adi yazılı bir sözleşme imzalayıp tapu müdürlüğüne verir ve Cem adına tescil ister. Bu istem de reddedilir.

      (c) Sonunda 3 Mart 2026'da Ayşe İzmir'deki bir tapu müdürlüğünde, Cem ise Bodrum'da iradesini açıklayarak resmî senet düzenletirler. İstem bütün belgeleriyle birlikte 3 Mart'ta saat 10.15'te yevmiye defterine yazılır; tapu kütüğüne kayıt teknik bir arıza yüzünden 5 Mart'ta yapılır. Ayşe'nin alacaklısı olan bankanın icra takibinde gönderilen haciz müzekkeresi 4 Mart'ta tapu müdürlüğüne ulaşır. Banka, kayıt 5 Mart'a kadar Ayşe adına göründüğü için haczin konulması gerektiğini savunur.

      (d) Cem ayrıca, babası Fikret'in 10 Ocak 2026'daki ölümüyle tek mirasçı olarak kazandığı ve tapuda hâlâ Fikret adına kayıtlı olan başka bir tarlayı Zeynep'e hemen satmak istemektedir.

      1. (a) ve (b)'deki ret kararları yerinde midir?
      2. (c)'de Cem mülkiyeti hangi tarihte kazanmıştır? Haciz Cem'e karşı ileri sürülebilir mi?
      3. (d)'de Cem tarlayı hemen satabilir mi? Ne yapması gerekir?
    olcut:
      - {tespit: "Tasarruf yetkisinin belgelenmesi; genel vekâletnamenin taşınmaz devri için yetmemesi, özel yetki ve düzenleme şeklinde vekâletname gerekmesi; istemin reddi", puan: 25, madde: "TBK m. 504"}
      - {tespit: "Hukuki sebebin geçerlilik şekline uygun belgelenmesi; adi yazılı satışın geçersizliği ve istemin reddi; geçici tescil şerhinin bu duruma uygulanmaması", puan: 20, madde: "TMK m. 1015"}
      - {tespit: "Resmî senedin tapu görevlilerince düzenlenmesi ve farklı tapu müdürlüklerinde iradelerin ayrı ayrı alınabilmesi; malikin yazılı istemi", puan: 10, madde: "2644 sayılı Kanun m. 26"}
      - {tespit: "Tescilin etkisinin yevmiye defterine kayıt tarihinden başlaması; Cem'in 3 Mart'ta malik olması", puan: 20, madde: "TMK m. 1022"}
      - {tespit: "İstem sırası ilkesi; sonra gelen haczin Cem'e ait taşınmaza Ayşe'nin borcu için konulamaması", puan: 10, madde: "TMK m. 1017"}
      - {tespit: "Mirasçının mülkiyeti tescilden önce kazanması; tasarruf için önce tescil gerekmesi; mirasçılık belgesiyle tescil istemi", puan: 15, madde: "TMK m. 705"}
    cozum: |
      **Nitelendirme:** Uyuşmazlıklar, taşınmaz mülkiyetinin hukuki işlemle devrinde tescilin şartlarına ve tescilin etkisinin başladığı ana ilişkindir. (d)'de ise tescilsiz kazanılmış bir mülkiyet üzerinde tasarruf sorunu vardır.

      **Hukuki sorunlar:** (1) Genel vekâletnameyle tasarruf yetkisi belgelenebilir mi? (2) Adi yazılı satış sözleşmesi hukuki sebep belgesi olur mu? (3) Mülkiyet hangi tarihte geçti, sonra gelen haciz etkili mi? (4) Mirasçı tescil yaptırmadan tasarruf edebilir mi?

      **İlgili hükümler:** TMK m. 1013, 1015, 1016, 1017, 1022, 706, 705, 599, 598; TBK m. 237, 504; 1512 sayılı Kanun m. 89; 2644 sayılı Kanun m. 26.

      **Değerlendirme:**

      *(a) Vekâletname:* Tescil için istemde bulunan kişi tasarruf yetkisini belgelemelidir. Bu, sicilde hak sahibi görünen kişi ya da onun temsilcisi olunduğunun ispatıyla olur (TMK m. 1015/2). Burak malik değildir, temsilci sıfatıyla gelmiştir. Ancak vekil, özel olarak yetkili kılınmadıkça taşınmazı devredemez ve bir hakla sınırlandıramaz (TBK m. 504/3). "Her türlü işlerimi takip etmeye" yetkisi veren genel vekâletname, taşınmaz satışı için gerekli özel yetkiyi içermez. Tapuda işlem yapılmasını gerektiren vekâletnamelerin ayrıca noterde düzenleme şeklinde yapılması gerekir (1512 sayılı Kanun m. 89). Tasarruf yetkisi belgelenmediği için istemin reddi yerindedir (TMK m. 1016/1). Ayşe, Burak'a taşınmaz satışı için özel yetki veren, düzenleme şeklinde bir vekâletname verirse Burak satışı yapabilir.

      *(b) Adi yazılı sözleşme:* Hukuki sebebin belgelenmesi, geçerliliği için gerekli şekle uyulduğunun ispatıyla olur (TMK m. 1015/3). Taşınmaz mülkiyetinin devrini amaçlayan sözleşmeler resmî şekilde düzenlenmedikçe geçerli değildir (TMK m. 706/1; TBK m. 237/1). Adi yazılı sözleşme bu şartı karşılamaz; hukuki sebep belgesi eksik olduğundan istem reddedilir (TMK m. 1016/1). Geçici tescil şerhi de verilemez, çünkü TMK m. 1016/2 yalnız hukuki sebep belgeleri tamken tasarruf yetkisini gösteren belgenin tamamlanması gereken hâller içindir.

      *(c) Mülkiyetin geçtiği an:* Resmî senet tapu görevlilerince düzenlenmiştir. Taraflar farklı tapu müdürlüklerinde bulunduğundan iradelerinin ayrı ayrı alınarak sözleşmenin tamamlanması 2644 sayılı Kanun m. 26'ya uygundur. Malik Ayşe'nin yazılı istemi de vardır (TMK m. 1013/1). Tescilin etkisi, kanunen gerekli belgeler isteme eklenmişse yevmiye defterine kayıt tarihinden başlar (TMK m. 1022/2). Bu nedenle Cem, kütüğe kaydın yapıldığı 5 Mart'ta değil, istemin yevmiyeye yazıldığı 3 Mart'ta malik olmuştur. Kütüğe tesciller istem tarihine ve sırasına göre yapılır (TMK m. 1017/1). Haciz müzekkeresi Cem'in isteminden sonra, 4 Mart'ta gelmiştir. O tarihte taşınmaz artık Ayşe'nin değil Cem'in malıdır; Ayşe'nin borcu için konulmak istenen haciz Cem'e karşı ileri sürülemez. Bankanın "kayıt 5 Mart'a kadar Ayşe adınaydı" savunması, etkinin yevmiye tarihinden başladığı kuralı karşısında dinlenmez.

      *(d) Miras kalan tarla:* Mirasçılar mirasbırakanın ölümüyle mirası kanun gereği kazanır (TMK m. 599). Miras, mülkiyetin tescilden önce kazanıldığı hâllerdendir; ama bu hâllerde malikin tasarruf işlemi yapabilmesi mülkiyetin tapuya tescil edilmesine bağlıdır (TMK m. 705/2). Cem 10 Ocak 2026'dan beri maliktir, ancak kayıt Fikret adına durdukça tarlayı satamaz. Cem, sulh mahkemesinden ya da noterden alacağı mirasçılık belgesiyle (TMK m. 598) tescili kendisi isteyebilir (TMK m. 1013/3). İntikal tescilinden sonra tarlayı Zeynep'e resmî senetle satar.

      **Sonuç:**
      - (a) ve (b)'deki ret kararları yerindedir: İlkinde tasarruf yetkisi, ikincisinde hukuki sebep belgelenmemiştir.
      - Cem 3 Mart'ta, yevmiye tarihinde malik olmuştur; 4 Mart'ta gelen haciz ona karşı ileri sürülemez.
      - Cem önce mirasçılık belgesiyle tarlayı kendi adına tescil ettirmeli, sonra satmalıdır.

  - olay: |
      Mert, Kadıköy'de Nesrin adına kayıtlı bir daireyi satın almak istemektedir. Dairenin kat mülkiyeti kütüğündeki kayıtlar şöyledir:

      - **Rehinler:** 2 Şubat 2023'te tescil edilmiş, Y Bankası lehine birinci derece ipotek.
      - **Şerhler:** Nesrin'in kardeşi Ozan lehine resmî şekilde yapılmış sözleşmeden doğan ve şerhte altı yıllık süre gösterilen alım hakkı (3 Nisan 2024); Nesrin'in eşi Okan'ın tapu müdürlüğüne başvurarak koydurduğu aile konutu şerhi (10 Ocak 2025); bir icra dairesinin Nesrin'in borcu nedeniyle bildirdiği haciz (20 Haziran 2025).
      - **Beyanlar:** Yönetim planının tarihi.

      Daire, Nesrin ile Okan'ın birlikte oturdukları evdir. Nesrin, Mert'e şöyle der: "Bunların hepsi kâğıt üstünde. Satıştan sonra tapuya bir dilekçe verip hepsini sildiririm. Okan'a da sormamıza gerek yok, daire benim adıma kayıtlı." Mert ise "Satıştan sonra bir sorun çıkarsa bu kayıtları görmediğimi söylerim" diye düşünmektedir.

      1. Kayıtların her birini nitelendiriniz.
      2. Mert daireyi satın alırsa ipotek, alım hakkı, haciz ve yönetim planı kendisine karşı hangi sonuçları doğurur?
      3. Okan'ın rızası olmadan satış yapılabilir mi? Aile konutu şerhi bulunmasaydı Mert'in durumu nasıl değerlendirilirdi?
      4. Nesrin'in ve Mert'in düşüncelerini değerlendiriniz.
    olcut:
      - {tespit: "Kayıtların nitelendirilmesi: ipotek tescil, alım hakkı kişisel hak şerhi, aile konutu şerhi, haciz tasarruf yetkisi kısıtlaması şerhi, yönetim planı tarihi beyan", puan: 20, madde: "TMK m. 1008"}
      - {tespit: "İpoteğin ayni hak olarak Mert'i bağlaması ve sıranın tescil tarihine göre belirlenmesi", puan: 10, madde: "TMK m. 1022"}
      - {tespit: "Alım hakkı şerhinin şerhte belirtilen süre içinde her malike karşı kullanılabilmesi ve on yıllık üst sınır", puan: 15, madde: "TMK m. 736"}
      - {tespit: "Haciz şerhinin satışı kendiliğinden engellememesi, ama şerhten sonra hak kazanan Mert'e karşı ileri sürülebilmesi", puan: 15, madde: "TMK m. 1010"}
      - {tespit: "Aile konutunun devrinde diğer eşin açık rızasının gerekmesi; şerh varken iyiniyet iddiasının dinlenmemesi; şerh yoksa Hukuk Genel Kurulu'na göre iyiniyetli üçüncü kişinin korunması ve bunun sınırı", puan: 20, madde: "TMK m. 194"}
      - {tespit: "Yönetim planının cüzi halefleri bağlaması; beyanın bildirici niteliği", puan: 10, madde: "KMK m. 28"}
      - {tespit: "Kayıtların hak sahiplerinin beyanı olmadan silinememesi; kimsenin sicildeki kaydı bilmediğini ileri sürememesi", puan: 10, madde: "TMK m. 1020"}
    cozum: |
      **Nitelendirme:** Uyuşmazlık, satın alınmak istenen bir dairenin kütüğündeki tescil, şerh ve beyanların sonraki malike etkisine ilişkindir.

      **Hukuki sorunlar:** Kayıtların türü; her kaydın Mert'e etkisi; aile konutunda açık rıza ve şerhin rolü; kayıtların silinmesi ve "bilmiyordum" savunması.

      **İlgili hükümler:** TMK m. 194, 1008, 1009, 1010, 1012, 1014, 1020, 1022, 736; İİK m. 91; KMK m. 28.

      **Değerlendirme:**

      *1. Nitelendirme:* İpotek bir rehin hakkıdır ve tescil edilir (TMK m. 1008). Alım hakkı sözleşmeden doğan kişisel bir haktır ve şerh edilmiştir (TMK m. 1009/1). Haciz, tasarruf yetkisinin kısıtlanması şerhidir (TMK m. 1010/1-2; İİK m. 91). Aile konutu şerhi TMK m. 194/3'e dayanır; malik olmayan eş Okan onu doğrudan tapu müdürlüğünden istemiştir. Yönetim planının tarihi ise bir beyandır (KMK m. 28/5; TMK m. 1012).

      *2. Mert'e etkileri:*
      - *İpotek:* Ayni haklar sıralarını tescile göre alır (TMK m. 1022/1). Mert daireyi ipotekle yüklü olarak edinir; ipotekle güvence altına alınan borç ödenmezse banka daireyi paraya çevirtebilir.
      - *Alım hakkı:* Şerh verilen alım hakkı, şerhte belirtilen süre içinde her malike karşı kullanılabilir (TMK m. 736/1). Ozan, şerhteki altı yıllık süre içinde, yani 3 Nisan 2030'a kadar hakkını kullanırsa Mert daireyi ona devretmek zorunda kalır. Şerhin etkisi her durumda on yılda sona erer (TMK m. 736/2); altı yıllık süre bu sınırın içindedir.
      - *Haciz:* Haciz şerhi satışı kendiliğinden yasaklamaz; kanun da hacizli taşınmazın el değiştirebileceğini öngörür (İİK m. 91/3). Ancak tasarruf yetkisi kısıtlaması şerhten sonra hak kazananlara karşı ileri sürülebilir (TMK m. 1010/2). Mert daireyi haczi taşıyan bir taşınmaz olarak alır ve icra takibi daire üzerinden yürüyebilir.
      - *Yönetim planı:* Yönetim planı ve değişiklikleri bütün kat maliklerini ve onların külli ve cüzi haleflerini bağlar (KMK m. 28/4). Bağlayıcılık kanundan doğar; beyan yalnız planın varlığını ve tarihini gösterir.

      *3. Aile konutu:* Eşlerden biri diğer eşin açık rızası olmadıkça aile konutunu devredemez (TMK m. 194/1). Bu şart şerhten değil doğrudan kanundan doğar; dairenin Nesrin adına kayıtlı olması rızayı gereksiz kılmaz. Okan'ın açık rızası alınmadan yapılacak satış TMK m. 194/1'e aykırıdır. Şerh bulunduğundan Mert, dairenin aile konutu olduğunu bilmediğini ileri süremez (TMK m. 1020/3) ve tapu siciline güven korumasından yararlanamaz. Rıza sağlanamaz ya da haklı bir sebep olmadan verilmezse Nesrin hâkimin müdahalesini isteyebilir (TMK m. 194/2). Şerh bulunmasaydı Yargıtay Hukuk Genel Kurulu'na göre dairenin aile konutu olduğunu bilmeyen ve bilmesi de gerekmeyen Mert, tapu siciline güvenden (TMK m. 1023) yararlanabilirdi. Ancak Nesrin ile Okan'ın evde birlikte oturduğunu görmesi gibi olgular, gerekli özeni gösterseydi durumu bilebileceğini ortaya koyacağından iyiniyetini ortadan kaldırabilirdi.

      *4. Nesrin ve Mert:* Bir kaydın terkini ya da değiştirilmesi, ancak kaydın kendilerine hak sağladığı kişilerin yazılı beyanı üzerine yapılabilir (TMK m. 1014). İpoteğin terkini bankanın, alım hakkı şerhinin Ozan'ın, aile konutu şerhinin Okan'ın beyanına ya da bir mahkeme kararına bağlıdır; haciz kalkarsa bu da icra dairesince tapuya bildirilir (İİK m. 91/2). Nesrin'in tek taraflı bir dilekçeyle bu kayıtları sildirmesi mümkün değildir. Mert'in düşüncesi de sonuç vermez: Kimse tapu sicilindeki bir kaydı bilmediğini ileri süremez (TMK m. 1020/3).

      **Sonuç:**
      - İpotek tescil; alım hakkı kişisel hak şerhi; aile konutu şerhi TMK m. 194/3'e dayanan şerh; haciz tasarruf yetkisi kısıtlaması şerhi; yönetim planı tarihi beyandır.
      - Mert ipotekle, alım hakkıyla ve hacizle yüklü olarak malik olur; yönetim planı onu da bağlar.
      - Okan'ın açık rızası olmadan satış TMK m. 194/1'e aykırıdır; şerh nedeniyle Mert iyiniyet iddia edemez.
      - Kayıtlar Nesrin'in tek taraflı istemiyle silinemez; Mert "bilmiyordum" diyemez.

kartlar:
  - on: "Tapu kütüğüne hangi haklar tescil edilir? (TMK m. 1008)"
    arka: "Mülkiyet; irtifak hakları ve taşınmaz yükleri; rehin hakları. Kişisel haklar tescil edilmez, en fazla şerh edilir."
  - on: "Hangi kişisel haklar şerh edilebilir? (TMK m. 1009)"
    arka: "Arsa payı karşılığı inşaat, taşınmaz satış vaadi, kira, alım, önalım, geri alım sözleşmelerinden doğan haklar ve şerhine kanunda açıkça izin verilen diğer haklar."
  - on: "Şerhin etkisi nedir?"
    arka: "Şerhli hak ya da kısıtlama, taşınmaz üzerinde sonradan hak kazananlara karşı ileri sürülebilir (TMK m. 1009/2, m. 1010/2). Hak kişisel kalır; şerhten önceki haklar önceliğini korur."
  - on: "Satış vaadi şerhi malikin tasarrufunu engeller mi?"
    arka: "Hayır. Hukuk Genel Kurulu'na göre şerh önleyici değildir; devir, ipotek ve haciz yapılabilir, ama şerhli hak bunlara karşı ileri sürülür."
  - on: "Satış vaadi şerhinin süresi?"
    arka: "Şerhten itibaren beş yıl içinde satış yapılmazsa şerh re'sen terkin olunur (2644 sayılı Kanun m. 26)."
  - on: "Beş yılı geçmiş ama terkin edilmemiş satış vaadi şerhi?"
    arka: "Hukuk Genel Kurulu çoğunluğuna göre etkisi sürer, şerhi görerek alan iyiniyetli sayılmaz. Karşı görüşe göre beş yılla değerini yitirir. Tartışmalıdır."
  - on: "Sözleşmeden doğan önalım, alım ve geri alım şerhinin üst sınırı?"
    arka: "Şerhte belirtilen süre içinde her malike karşı kullanılır; şerhin etkisi her durumda şerh tarihinden itibaren on yılda sona erer (TMK m. 735 ve 736)."
  - on: "Kira sözleşmesinin şerhinin dayanağı?"
    arka: "Sözleşmeyle kararlaştırılabilir (TBK m. 312; TMK m. 1009). Kiralanan el değiştirirse yeni malik zaten sözleşmenin tarafı olur (TBK m. 310)."
  - on: "Tasarruf yetkisi kısıtlaması şerhinin sebepleri? (TMK m. 1010)"
    arka: "Çekişmeli hakların korunmasına ilişkin mahkeme kararları; haciz, iflas kararı, konkordato süresi; aile yurdu, artmirasçı atanması gibi kanunda öngörülen işlemler."
  - on: "Tedbir şerhinden sonra hak kazanan 'bilmiyordum' diyebilir mi?"
    arka: "Hayır. Kısıtlama şerhten sonra hak kazananlara karşı ileri sürülür (TMK m. 1010/2) ve kimse sicildeki kaydı bilmediğini ileri süremez (TMK m. 1020/3)."
  - on: "İİK m. 28'deki şerh nedir?"
    arka: "Taşınmaz davasında davacı lehine hüküm verilince mahkemenin talep beklemeden hüküm özetini tapuya bildirmesiyle verilen şerh. TMK m. 1010/2'ye tabidir."
  - on: "Geçici tescil şerhi hangi hâllerde verilir? (TMK m. 1011)"
    arka: "İddia edilen bir ayni hakkın güvenceye alınması gerekiyorsa ya da kanun, tasarruf yetkisi belgelerindeki eksikliğin sonradan tamamlanmasına izin veriyorsa."
  - on: "Geçici tescil şerhine kim karar verir, etkisi nedir?"
    arka: "Bütün ilgililerin rızası ya da hâkim kararı gerekir. Hak gerçekleşirse şerh tarihinden başlayarak üçüncü kişilere karşı ileri sürülür."
  - on: "Aile konutu şerhini kim, nereden ister?"
    arka: "Aile konutunun maliki olmayan eş, doğrudan tapu müdürlüğünden (TMK m. 194/3). Açık rıza şartı kanundan doğar (TMK m. 194/1)."
  - on: "Aile konutu şerhi yoksa üçüncü kişi korunur mu?"
    arka: "Hukuk Genel Kurulu'na göre konutun aile konutu olduğunu bilmeyen ve bilmesi gerekmeyen üçüncü kişi TMK m. 1023'ten yararlanır; bilen ya da bilebilecek olan korunmaz."
  - on: "Beyanlar sütununa neler yazılır? (TMK m. 1012)"
    arka: "Malikin istemiyle eklentiler; kamu hukuku kısıtlamaları ve yönetmelikte belirtilen diğer hususlar. Özel kanun hükümleri saklıdır."
  - on: "Eklenti beyanının rehinde etkisi?"
    arka: "Rehnin kuruluşunda açıkça eklenti gösterilip beyanlar sütununa yazılan şeyler, aksi ispat edilmedikçe eklenti sayılır (TMK m. 862/2)."
  - on: "Tescilin üç şartı?"
    arka: "İstem (TMK m. 1013); tasarruf yetkisinin belgelenmesi ve hukuki sebebin geçerlilik şekline uygun belgelenmesi (TMK m. 1015)."
  - on: "Malikin yazılı beyanı ne zaman gerekmez?"
    arka: "Edinen kanun hükmüne, kesinleşmiş mahkeme kararına ya da buna eşdeğer bir belgeye dayanıyorsa (TMK m. 1013/2)."
  - on: "Bir kaydın terkini kimin beyanıyla olur?"
    arka: "Kaydın kendilerine hak sağladığı kişilerin yazılı beyanıyla (TMK m. 1014); örneğin ipotekte bankanın."
  - on: "Belgeler eksikse tapu memuru ne yapar?"
    arka: "İstemi reddeder (TMK m. 1016/1). Hukuki sebep belgeleri tam, yalnız tasarruf yetkisi belgesi eksikse malikin rızası ya da hâkim kararıyla geçici tescil şerhi verilebilir (TMK m. 1016/2)."
  - on: "Tescilin etkisi ne zaman başlar?"
    arka: "Belgeler tamsa yevmiye defterine kayıt tarihinden (TMK m. 1022/2). Kütüğe sonradan yazılması sonucu değiştirmez."
  - on: "Tescilsiz kazanan malik tasarruf edebilir mi?"
    arka: "Hayır. Miras, mahkeme kararı gibi hâllerde mülkiyet tescilden önce kazanılır, ama tasarruf için önce tescil gerekir (TMK m. 705/2)."
  - on: "HUAK m. 18/B'deki 2024 yeniliği?"
    arka: "Bu maddeye tabi uyuşmazlıklarda icra edilebilirlik şerhi verilmiş anlaşma belgesine dayanılarak resmî senet düzenlenmeden tescil istenebilir."
