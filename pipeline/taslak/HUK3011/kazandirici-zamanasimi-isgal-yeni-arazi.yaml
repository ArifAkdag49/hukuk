  - id: "76501600"
    ozet: |
      Afyonkarahisar'da bir belediyenin Zafer ve Hisar mahallelerindeki dört taşınmaz, kadastroda sit alanında kaldığı gerekçesiyle Hazine adına tespit edilmiştir. Davacı, kazandırıcı zamanaşımı zilyetliğine dayanarak tespite itiraz etmiş, kadastro mahkemesi davayı kabul etmiştir. Yargıtay 16. Hukuk Dairesi, belgesizden tescil edilen taşınmazların toplamının 100 dönümü geçtiğini, başka tespitlerin de araştırılıp aşan kısım için zilyede tercih hakkı tanınması gerektiğini belirterek bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu oy birliğiyle direnme kararını onamıştır. Gerekçeye göre 3402 sayılı Kanun m. 4/1 uyarınca belediye sınırları içindeki her mahalle ayrı bir kadastro çalışma alanıdır ve 3402 sayılı Kanun m. 14'teki 100 dönüm sınırı her mahalle için ayrı gözetilir. Zafer Mahallesi'ndeki taşınmazlar 76.998,32 m², Hisar Mahallesi'ndekiler 51.649,27 m² olduğundan sınır aşılmamıştır. Konuya katkısı: miktar sınırının hangi alan içinde hesaplandığını gösterir.
  - id: "626051500"
    ozet: |
      Kadastroda yol olarak tespit harici bırakılan bir yerin zilyetliğe dayanılarak davacı adına tescili istenmiştir. İlk derece mahkemesi, komşu parsellerin tutanaklarının kesinleşmesinden beş yıl sonra açılan davanın makul süreyi aştığı ve kadastrodan itibaren yirmi yılın dolmadığı gerekçesiyle davayı reddetmiş, Yargıtay bu kararı bozmuştur. İlk bozmaya göre tescil harici bırakılan yerler için kadastro öncesi sebeplere dayanarak dava açmayı sınırlayan bir süre yoktur; kesinleşen tutanaklarda bile 3402 sayılı Kanun m. 12/3'teki on yıl içinde dava açılabilmektedir. Hazine ve ilgili kamu tüzel kişileri yasal hasım olduğundan belediyenin de davaya katılması gerekir. Mahkeme bozmaya uyup davayı kabul etmiş, Hazine temyiz etmiştir. Yargıtay 16. Hukuk Dairesi hükmü oy birliğiyle yeniden bozmuştur: TMK m. 713'te öngörülen yerel ve gazete ilanları yapılmadan ve itiraz süresi beklenmeden hüküm kurulamaz. Konuya katkısı: tescil harici yerlerde süre sorununu, husumeti ve ilanın zorunluluğunu gösterir.
  - id: "837967200"
    ozet: |
      Davacı, kendi parsellerinin uzantısı olan yaklaşık 20 dekarlık yerin zilyetliğini 1974'te önceki maliklerinden devraldığını, taşınmazın kadastroda Menderes Nehri altında kaldığı için tescil harici bırakıldığını, nehrin yatak değiştirmesinden sonra yirmi yılı aşkın süre malik sıfatıyla zilyet olduğunu ileri sürerek tescil istemiştir. Hazine ve belediye, yeri nehrin yatak değiştirmesiyle oluşan ve Devlete ait olan arazi olarak nitelendirip davanın reddini savunmuştur. İlk derece mahkemesi davayı kabul etmiş, bölge adliye mahkemesi istinafı reddetmiştir. Yargıtay 7. Hukuk Dairesi oy birliğiyle bölge adliye mahkemesi kararını kaldırıp ilk derece hükmünü bozmuştur. Gerekçeye göre TMK m. 708/1 yeni araziyi açıkça Devlete verdiğinden bu yer TMK m. 713 ya da 3402 sayılı Kanun m. 14 ve m. 17 ile kazanılamaz. Terk edilmiş dere yatağı gibi yerler ancak imar-ihya ile, ham toprak gibi yerler basit ameliyeyle kazanılabilir. Taşınmaz 1959 tarihli hava fotoğrafında nehir yatağında görünürken 1964 fotoğrafında kısmen tarla olarak kullanılmaya başlandığından, daha eski hava fotoğrafları getirilip uzman raporuyla yerin yeni arazi olup olmadığı kuşkuya yer bırakmadan belirlenmelidir. Konuya katkısı: yeni arazi ile zilyetlikle kazanım arasındaki sınırı çizer.

sorular:
  - soru: |
      Olağan kazandırıcı zamanaşımı (TMK m. 712) bakımından aşağıdakilerden hangisi **aranmaz**?
    siklar:
      - "Kişinin tapu kütüğüne malik olarak yazılmış olması"
      - "Zilyetliğin davasız ve aralıksız on yıl sürmesi"
      - "Zilyedin iyiniyetli olması"
      - "Tescil davası açılması ve davanın ilan edilmesi"
    dogru: 3
    aciklama: |
      TMK m. 712'de kişi zaten tapuda malik olarak yazılıdır. Şartlar yolsuz tescil, on yıl davasız ve aralıksız zilyetlik ve iyiniyettir. Süre dolunca mülkiyete itiraz edilemez; ayrıca tescil davası açmaya ve ilana gerek yoktur. Dava ve ilan olağanüstü zamanaşımına özgüdür (TMK m. 713/3-5).

  - soru: |
      Görünüşte sağlıklı olan, ama ayırt etme gücü bulunmayan Veli 15.03.2014'te dairesini tapuda Ali'ye satmıştır. Ali satıcının durumunu bilmiyordu ve bilmesi için hiçbir belirti yoktu. Ali o tarihten beri dairede oturmaktadır. Veli'nin vasisi 2026'da tapu iptali ve tescil davası açar. Hangisi doğrudur?
    siklar:
      - "Ali, TMK m. 1023'e göre iyiniyetli üçüncü kişi olarak devir anında korunmuştur."
      - "Ali'nin tescili yolsuzdur, ama on yıl davasız, aralıksız ve iyiniyetli zilyetlikle mülkiyetine artık itiraz edilemez."
      - "Tapulu taşınmaz zilyetlikle hiçbir zaman kazanılamayacağından dava kabul edilir."
      - "Ali, yirmi yıl dolmadan mülkiyeti kazanamayacağından dava kabul edilir."
    dogru: 1
    aciklama: |
      Ayırt etme gücü bulunmayanın işlemi hukuki sonuç doğurmaz (TMK m. 15); Ali'nin tescili yolsuzdur (TMK m. 1024/2). Ali işlemin tarafıdır, tapuya güvenen üçüncü kişi değildir; TMK m. 1023 ona uygulanmaz. Ancak Ali tapuda malik olarak yazılıdır ve zilyetliğini 2014'ten beri davasız, aralıksız ve iyiniyetle sürdürmüştür. On yıl 2024'te dolduğundan mülkiyetine itiraz edilemez (TMK m. 712). Yirmi yıllık süre olağanüstü zamanaşımına aittir.

  - soru: |
      Ayırt etme gücü bulunmayan Hakan 2022'de arsasını Ayşe'ye satmış ve tescil yapılmıştır. Ayşe 2023'te arsayı, satışın geçersizliğini bilmeyen ve bilmesi de gerekmeyen Burak'a satmıştır. Hakan'ın vasisi 2025'te Burak'a karşı tapu iptali davası açar. Hangisi doğrudur?
    siklar:
      - "Burak'ın kazanımı, tapudaki tescile iyiniyetle dayandığı için korunur."
      - "Burak da korunmak için on yıllık olağan zamanaşımının dolmasını beklemelidir."
      - "Burak, kendi zilyetliği yirmi yıl sürmedikçe korunmaz."
      - "Ayşe'nin tescili yolsuz olduğundan Burak hiçbir durumda korunamaz."
    dogru: 0
    aciklama: |
      Tapu kütüğündeki tescile iyiniyetle dayanarak mülkiyet kazanan üçüncü kişinin kazanımı korunur (TMK m. 1023). Burak, yolsuz işlemin tarafı değil, Ayşe'nin tapudaki görünüşüne güvenen üçüncü kişidir; korunması için süre gerekmez. On yıllık süre (TMK m. 712) yolsuz işlemin tarafı olan Ayşe için önem taşırdı. Yolsuz tescili bilen ya da bilmesi gereken üçüncü kişi ise korunmazdı (TMK m. 1024/1).

  - soru: |
      Tapusuz bir taşınmazın olağanüstü kazandırıcı zamanaşımıyla kazanılması için hangisi doğrudur?
    siklar:
      - "Zilyedin on yıl iyiniyetle zilyet olması yeterlidir."
      - "Zilyedin yirmi yıl davasız, aralıksız ve malik sıfatıyla zilyet olması gerekir; iyiniyet aranmaz."
      - "Zilyedin yirmi yıl zilyet olması ve taşınmazın başkasına ait olduğunu bilmemesi gerekir."
      - "Zilyetliğin niteliği önemli değildir; kira ilişkisine dayanan zilyetlik de yeterlidir."
    dogru: 1
    aciklama: |
      TMK m. 713/1, tapusuz taşınmazı davasız ve aralıksız yirmi yıl malik sıfatıyla zilyetliğinde bulunduran kişiye tescil isteme hakkı verir. Hükümde iyiniyet şartı yoktur; iyiniyet olağan zamanaşımının (TMK m. 712) şartıdır. Kiracı fer'i zilyettir ve malik sıfatı taşımaz (TMK m. 974).

  - soru: |
      Bir tarla tapuda 1995'te ölen Rıza adına kayıtlıdır. Rıza'nın mirasçıları bellidir, ama intikal yaptırmamışlardır. Komşu Kadir 2000'den beri tarlayı malik sıfatıyla, davasız ve aralıksız eker ve 2026'da TMK m. 713/2'ye dayanarak tescil davası açar. Hangisi doğrudur?
    siklar:
      - "Malik yirmi yıldan önce öldüğü için Kadir tescil isteyebilir."
      - "Kadir, olağan zamanaşımına dayanarak on yıl sonunda mülkiyeti kazanmıştır."
      - "Malikin yirmi yıl önce ölmüş olması Anayasa Mahkemesinin iptal kararından sonra tescil sebebi değildir; malik tapudan anlaşılabildiği ve gaiplik kararı da olmadığı için dava reddedilir."
      - "Mirasçılar intikal yaptırmadığı için taşınmaz tapusuz sayılır ve TMK m. 713/1 uygulanır."
    dogru: 2
    aciklama: |
      TMK m. 713/2'deki "ölmüş ya da" ibaresi Anayasa Mahkemesince 2011'de iptal edilmiştir. Bugün tapulu taşınmazda bu yol yalnız malik tapudan anlaşılamıyorsa ya da hakkında yirmi yıl önce gaiplik kararı verilmişse açıktır. Mirasçılar mirası ölümle kazanır (TMK m. 599); intikal yapılmaması taşınmazı tapusuz yapmaz. Kadir tapuda yazılı olmadığından TMK m. 712 de uygulanmaz.

  - soru: |
      Bir taşınmaz tapuda "Ahmet oğlu Mustafa Kara" adına kayıtlıdır; kayıtta doğum yeri ve tarihi de yazılıdır. Zilyet Selim, Mustafa'nın mirasçılarının adreslerini bulamadığını, bu yüzden malikin "tapu kütüğünden anlaşılamadığını" ileri sürer. Yargıtay uygulamasına göre hangisi doğrudur?
    siklar:
      - "Mirasçıların adreslerine ulaşılamaması malikin tapudan anlaşılamaması anlamına gelir; dava Hazineye karşı açılır."
      - "Kimlik ve adres bilgisine ulaşılamaması malikin tapudan anlaşılamaması değildir; mirasçılar araştırılmalı ve dava onlara yöneltilmelidir."
      - "Tapulu taşınmazda TMK m. 713 hiçbir koşulda uygulanmaz."
      - "Selim'in iyiniyetli olması hâlinde malikin kim olduğu önem taşımaz."
    dogru: 1
    aciklama: |
      Yargıtay'a göre "maliki tapu kütüğünden anlaşılamayan" kişi ile kayıt malikinin ya da mirasçılarının kimlik ve adres bilgilerine ulaşılamaması farklı durumlardır. Kayıt maliki belli olduğunda mirasçılık belgesi alınmalı ve dava mirasçılara karşı açılmalıdır (TMK m. 713/3). TMK m. 713/2, belli koşullarda tapulu taşınmazda da tescile imkân verir; iyiniyet ise bu hükümde şart değildir.

  - soru: |
      Tapusuz bir taşınmaz için TMK m. 713/1'e dayanan tescil davası kime karşı açılır?
    siklar:
      - "Yalnız taşınmazı daha önce kullanan kişilere"
      - "Hazineye ve ilgili kamu tüzel kişilerine"
      - "Yalnız tapu müdürlüğüne"
      - "Davalı gösterilmez; dava çekişmesiz yargı işi olarak görülür."
    dogru: 1
    aciklama: |
      TMK m. 713/3'e göre tescil davası Hazineye ve ilgili kamu tüzel kişilerine ya da varsa tapuda malik görünen kişinin mirasçılarına karşı açılır. Tapusuz taşınmazda tapuda malik görünen yoktur; davalılar Hazine ile taşınmazın bulunduğu yerdeki belediye veya köy gibi kamu tüzel kişileridir. Tapu müdürlüğü davada taraf değildir.

  - soru: |
      TMK m. 713'e göre tescil davasında ilan ve itiraz hakkında hangisi doğrudur?
    siklar:
      - "Dava bir gazetede bir defa ilan edilir; itiraz süresi ilandan itibaren bir aydır."
      - "Dava bir gazete ve bir internet haber sitesinde ve taşınmazın bulunduğu yerde en az üç defa ilan edilir; itiraz süresi son ilandan başlayarak üç aydır."
      - "İlan yalnız taşınmazın bulunduğu köyde yapılır; itiraz süresi otuz gündür."
      - "İlan mahkemenin takdirine bırakılmıştır; itiraz karar kesinleşinceye kadar yapılabilir."
    dogru: 1
    aciklama: |
      TMK m. 713/4'e göre davanın konusu bir gazete ve bir internet haber sitesinde ve ayrıca taşınmazın bulunduğu yerde uygun araç ve aralıklarla en az üç defa ilan olunur. Gazete kısmı 13.10.2022 tarihli ve 7418 sayılı Kanunla değişmiştir (yürürlük 01.04.2023); eski metin "gazeteyle bir defa ve ayrıca taşınmazın bulunduğu yerde ... en az üç defa" diyordu. Son ilandan başlayarak üç ay içinde yerinde bir itiraz çıkmaz ve iddia ispatlanırsa hâkim tescile karar verir (TMK m. 713/5). Otuz günlük ilan kadastrodaki askı ilanıdır (3402 sayılı Kanun m. 11).

  - soru: |
      Olağanüstü kazandırıcı zamanaşımında mülkiyet ne zaman kazanılmış olur?
    siklar:
      - "Tescil kararının kesinleşmesiyle"
      - "Tapuya tescil yapıldığı anda"
      - "TMK m. 713/1'deki koşulların gerçekleştiği anda; ancak tasarruf işlemi için tescil gerekir"
      - "Son ilandan itibaren üç ay geçtiği anda"
    dogru: 2
    aciklama: |
      TMK m. 713/5'e göre mülkiyet, birinci fıkrada öngörülen koşulların gerçekleştiği anda kazanılmış olur. Mahkeme kararı mülkiyeti tespit eder ve tescili sağlar. Tescilden önce mülkiyet kazanan kişinin tasarruf işlemleri yapabilmesi ise tescile bağlıdır (TMK m. 705/2).

  - soru: |
      Kemal, tapusuz bir tarlayı 01.05.2003'ten beri malik sıfatıyla, davasız ve aralıksız eker. 2012'de tarlayı Selin'e teslim eder; Selin de o tarihten beri tarlayı malik sıfatıyla, davasız ve aralıksız kullanır. Selin 2025'te tescil davası açar. Hangisi doğrudur?
    siklar:
      - "Selin'in kendi zilyetliği on üç yıl olduğundan yirmi yıl dolmamıştır."
      - "Selin, aynı yetkiye sahip olan Kemal'in süresini kendi süresine ekleyebilir; yirmi yıllık süre dolmuştur."
      - "Süre eklenmesi yalnız mirasçılar için mümkündür."
      - "Zilyetlik el değiştirdiği için süre kesilmiş ve 2012'de yeniden başlamıştır."
    dogru: 1
    aciklama: |
      Kazandırıcı zamanaşımından yararlanma hakkına sahip zilyet, zilyetliği kendisine devreden aynı yetkiye sahip idiyse onun süresini kendi süresine ekleyebilir (TMK m. 996). Kemal de malik sıfatıyla zilyetti. 01.05.2003'ten başlayan süre 2023'te dolmuştur. Mirasçıların zilyetliği doğrudan kazanması (TMK m. 599/2) ayrı bir kuraldır; ekleme yalnız onlara özgü değildir.

  - soru: |
      Hüseyin, 1998'den beri tapusuz bir tarlayı köylü Hamdi'den kiralayarak eker ve her yıl kira öder. Hamdi 2024'te ölür; Hüseyin 2025'te yirmi yıldan fazla zilyet olduğunu ileri sürerek tescil davası açar. Hangisi doğrudur?
    siklar:
      - "Hüseyin yirmi yılı doldurduğu için tescil isteyebilir."
      - "Hüseyin fer'i zilyettir, malik sıfatıyla zilyetliği yoktur; tescil isteyemez."
      - "Hamdi öldüğü için Hüseyin'in zilyetliği kendiliğinden asli zilyetliğe dönüşmüş ve süre 1998'den hesaplanır."
      - "Hüseyin iyiniyetli olduğu sürece zilyetliğin niteliği önemsizdir."
    dogru: 1
    aciklama: |
      Şeyi kira gibi kişisel bir hakkın kullanılması için elinde tutan fer'i zilyettir; malik sıfatıyla zilyet asli zilyettir (TMK m. 974). TMK m. 713/1 malik sıfatıyla zilyetlik arar. Kira ödeyen Hüseyin'in zilyetliği süre ne kadar uzun olursa olsun mülkiyet kazandırmaz. Kiraya verenin ölümü de geçmiş zilyetliğin niteliğini değiştirmez.

  - soru: |
      Aşağıdaki taşınmazlardan hangisi zilyetliğe dayanarak mülkiyet kazanılmasına elverişlidir?
    siklar:
      - "Köy halkının kadimden beri hayvan otlattığı mera"
      - "Devlet ormanından açılarak tarlaya dönüştürülmüş alan"
      - "Deniz kıyısında kalan kumsal"
      - "Orman sayılmayan, kamu hizmetine tahsis edilmemiş ve emekle tarıma elverişli hâle getirilmiş taşlık Devlet arazisi"
    dogru: 3
    aciklama: |
      Orman sayılmayan, Devletin hüküm ve tasarrufu altında bulunan ve kamu hizmetine tahsis edilmeyen arazi, masraf ve emekle imar ve ihya edilerek tarıma elverişli hâle getirilmişse, 3402 sayılı Kanun m. 14'teki şartlar varsa imar ve ihya eden adına tespit edilir (3402 sayılı Kanun m. 17). Meraya zamanaşımı uygulanamaz (4342 sayılı Kanun m. 4/3). Devlet ormanları zamanaşımıyla mülk edinilemez ve açılan yerler kişiler adına tescil edilemez (AY m. 169, 6831 sayılı Kanun m. 17/2). Kıyılar Devletin hüküm ve tasarrufu altındadır (AY m. 43).

  - soru: |
      3402 sayılı Kanun m. 14'e göre tapusuz taşınmazların belge aranmaksızın zilyet adına tespit edilebileceği üst sınır hangisidir?
    siklar:
      - "Aynı çalışma alanında toplam sulu toprakta 40, kuru toprakta 100 dönüm"
      - "Her parsel için ayrı ayrı sulu toprakta 100, kuru toprakta 40 dönüm"
      - "Türkiye genelinde kişi başına toplam 100 dönüm"
      - "Sınır yoktur; yirmi yıllık zilyetlik yeterlidir."
    dogru: 0
    aciklama: |
      3402 sayılı Kanun m. 14/1, aynı çalışma alanı içinde bulunan ve toplam yüzölçümü sulu toprakta 40, kuru toprakta 100 dönüme kadar (40 ve 100 dahil) bir ya da birden çok taşınmazın zilyet adına tespitine izin verir. Sınır parsel başına değil, aynı çalışma alanındaki toplam üzerinden hesaplanır. Sınırı aşan kısım için zilyetliğin kanunda sayılan belgelerden birine dayanması gerekir (3402 sayılı Kanun m. 14/4).

  - soru: |
      Bir belediyenin sınırları içinde Ali, Yeni Mahalle'de 70 dönüm, Eski Mahalle'de 60 dönüm kuru tarlada yirmi beş yıldır belgesiz olarak malik sıfatıyla zilyettir. Kadastroda bu tarlalar için 3402 sayılı Kanun m. 14 uygulanacaktır. Hangisi doğrudur?
    siklar:
      - "Toplam 130 dönüm olduğundan 30 dönüm Hazine adına tespit edilir."
      - "Her mahalle ayrı çalışma alanı olduğundan 100 dönüm sınırı her mahallede ayrı hesaplanır ve aşılmamıştır."
      - "Belediye sınırları tek çalışma alanı olduğundan Ali yalnız bir mahalledeki tarlayı seçebilir."
      - "Kuru toprakta sınır 40 dönüm olduğundan iki tarlanın büyük kısmı Hazine adına tespit edilir."
    dogru: 1
    aciklama: |
      Her köy ile belediye sınırları içindeki mahallelerin her biri ayrı bir kadastro çalışma alanıdır (3402 sayılı Kanun m. 4/1). M. 14'teki sınır "aynı çalışma alanı" içinde hesaplandığından Hukuk Genel Kurulu sınırı her mahalle için ayrı gözetir. 70 ve 60 dönüm ayrı ayrı 100 dönümün altındadır. Kuru toprak için sınır 100, sulu toprak için 40 dönümdür.

  - soru: |
      Zeynep, adına tapulu bahçeyi 2008'de adi yazılı bir sözleşmeyle Murat'a satıp teslim etmiştir. Murat o tarihten beri bahçeyi malik sıfatıyla, çekişmesiz ve aralıksız kullanır. Köyde 2024'te kadastro çalışması yapılmaktadır. Hangisi doğrudur?
    siklar:
      - "Satış resmî şekilde yapılmadığından bahçe her durumda Zeynep adına tespit edilir."
      - "Murat, tapu dışı yolla kazandığını ispat eder ve en az on yıl zilyet olduğu için bahçe onun adına tespit edilir."
      - "Tapulu taşınmaz için Murat'ın en az yirmi yıl zilyet olması gerekir."
      - "Murat ancak olağan zamanaşımına (TMK m. 712) dayanabilir."
    dogru: 1
    aciklama: |
      Kadastroda tapulu taşınmazın kayıt sahibinden başkası zilyetse ve zilyet taşınmazı kayıt malikinden tapu dışı bir yolla kazandığını beyan, belge, bilirkişi ya da tanıkla ispat eder ve en az on yıl çekişmesiz, aralıksız ve malik sıfatıyla zilyet bulunursa taşınmaz zilyet adına tespit edilir (3402 sayılı Kanun m. 13). Kadastro dışında bu satış geçersiz olurdu (TMK m. 706). Murat tapuda yazılı olmadığından TMK m. 712 uygulanmaz.

  - soru: |
      Nehrin yatak değiştirmesiyle sahipsiz bir yerde yararlanmaya elverişli yeni bir arazi oluşmuştur. Hangisi doğrudur?
    siklar:
      - "Arazi, bitişik arazinin malikine kendiliğinden geçer."
      - "Arazi Devlete aittir; Devlet kamusal sakınca yoksa öncelikle arazisi kayba uğrayana ya da bitişik malike devredebilir."
      - "Araziyi yirmi yıl malik sıfatıyla kullanan kişi olağanüstü zamanaşımıyla kazanır."
      - "Arazi, ilk işgal eden kişinin mülkiyetine geçer."
    dogru: 1
    aciklama: |
      Birikme, dolma, toprak kayması ya da kamuya ait suların yatağında veya seviyesinde değişme gibi sebeplerle sahipsiz yerlerde oluşan yararlanmaya elverişli arazi Devlete aittir (TMK m. 708/1). Devlet, kamusal sakınca yoksa öncelikle arazisi kayba uğrayana ya da bitişik malike devredebilir (m. 708/2); bu bir takdir yetkisidir. Yargıtay'a göre bu arazi zilyetlikle kazanılamaz. Tapusuz taşınmaz işgalle de kazanılamaz (TMK m. 707/2).

  - soru: |
      Toprak parçalarının kendi arazisinden koptuğunu ispat eden malik, bunları hangi süre içinde geri alabilir?
    siklar:
      - "Durumu öğrendiği tarihten başlayarak bir ve her hâlde oluşumun gerçekleştiği tarihten başlayarak on yıl içinde"
      - "Durumu öğrendiği tarihten başlayarak iki ve her hâlde on yıl içinde"
      - "Oluşumun gerçekleştiği tarihten başlayarak yirmi yıl içinde"
      - "Süresiz olarak, mülkiyet hakkı zamanaşımına uğramadığı için"
    dogru: 0
    aciklama: |
      TMK m. 708/3'e göre toprak parçalarının kendi arazisinden koptuğunu ispat eden malik, bunları durumu öğrendiği tarihten başlayarak bir ve her hâlde oluşumun gerçekleştiği tarihten başlayarak on yıl içinde geri alabilir. Süreler birlikte işler; hangisi önce dolarsa geri alma imkânı sona erer.

  - soru: |
      Yoğun yağış sonrası Okan'ın tarlasının bir bölümü kayarak komşu Fatma'nın tarlasının üzerine geçmiştir. Bölge heyelan bölgesi olarak belirlenmemiştir. Hangisi doğrudur?
    siklar:
      - "Kayan kısım Fatma'nın tarlasına katılır ve sınır yeni duruma göre değişir."
      - "Arazi kayması sınır değişikliğini gerektirmez; geçen parçalar hakkında sürüklenen şeylere ve karışmaya ilişkin hükümler uygulanır."
      - "Kayan kısım sahipsiz yerde oluşmuş yeni arazi olarak Devlete ait olur."
      - "Okan kayan kısmı ancak yirmi yıl içinde dava açarak geri alabilir."
    dogru: 1
    aciklama: |
      Arazi kayması sınır değişikliğini gerektirmez; bir taşınmazdan diğerine geçen arazi parçaları ve diğer cisimler hakkında sürüklenen şeylere ve karışmaya ilişkin hükümler uygulanır (TMK m. 709). Fatma, sürüklenen şeylerin aranıp alınmasına izin vermek zorundadır ve zararının denkleştirilmesini isteyebilir (TMK m. 752). TMK m. 708 yalnız sahipsiz yerlerde oluşan araziye ilişkindir. Sınırın değişmemesi ilkesi heyelan bölgesi olarak belirlenen yörelerde uygulanmaz (TMK m. 710).

  - soru: |
      İşgal yoluyla taşınmaz mülkiyetinin kazanılması hakkında hangisi doğrudur?
    siklar:
      - "Tapusuz taşınmazlar işgal yoluyla kazanılır; tapulu taşınmazlar kazanılamaz."
      - "Tapulu taşınmaz ancak kaydı malikin istemiyle terkin edilmişse işgalle kazanılabilir; tapusuz taşınmazlar üzerinde işgalle mülkiyet kazanılamaz."
      - "Hem tapulu hem tapusuz taşınmazlar on yıllık işgalle kazanılır."
      - "İşgal yalnız taşınırlar için öngörülmüştür; taşınmazlarda hiç uygulanmaz."
    dogru: 1
    aciklama: |
      TMK m. 707/1'e göre tapulu bir taşınmazın işgal yoluyla kazanılması, ancak kaydının malikin istemiyle terkin edilmiş olmasına bağlıdır. TMK m. 707/2'ye göre tapuya kayıtlı olmayan taşınmazlar üzerinde işgal yoluyla mülkiyet kazanılamaz. İşgal, TMK m. 705/2'de tescilsiz kazanma hâlleri arasında sayılır; yani taşınmazlarda da öngörülmüştür.

  - soru: |
      Kazandırıcı zamanaşımı sürelerinin hesaplanması, kesilmesi ve durması hakkında hangisi doğrudur?
    siklar:
      - "Bu konuda TMK'da ayrıntılı ve kendine özgü hükümler vardır; Borçlar Kanunu uygulanmaz."
      - "Borçlar Kanunu'nun zamanaşımına ilişkin hükümleri kıyas yoluyla uygulanır."
      - "Kazandırıcı zamanaşımı hiçbir sebeple kesilmez ve durmaz."
      - "Süreler hesaplanırken zilyetliğin başladığı gün de sayılır."
    dogru: 1
    aciklama: |
      TMK m. 714'e göre kazandırıcı zamanaşımı sürelerinin hesaplanmasında, kesilmesinde ve durmasında Borçlar Kanunu'nun zamanaşımına ilişkin hükümleri kıyas yoluyla uygulanır. Buna göre başlangıç günü sayılmaz ve süre son gün de geçince dolar (TBK m. 151); durma ve kesilme sebepleri (TBK m. 153, TBK m. 154) kıyasen uygulanır.

olaylar:
  - olay: |
      Yeşilköy'de 2025'te ilk kez kadastro çalışması yapılmaktadır. Köyde şu durumlar vardır:

      Murat'ın babası Hasan, köyün batısındaki 60 dönümlük ve doğusundaki 55 dönümlük iki tapusuz kuru tarlayı 1995'ten beri malik sıfatıyla eker. Hasan 2008'de ölmüş, tek mirasçısı Murat tarlaları aynı biçimde ekmeye devam etmiştir. Tarlaların zilyetliğine kimse itiraz etmemiştir. Murat'ın bu tarlalarla ilgili vergi kaydı ya da başka bir belgesi yoktur.

      Murat ayrıca 2000'den beri, doğudaki tarlaya bitişik ve köy halkının eskiden beri hayvan otlattığı 5 dönümlük alanı sürüp ekmektedir.

      Köyün içindeki 10 dönümlük bahçe tapuda Zeynep adına kayıtlıdır. Zeynep 2009'da bahçeyi adi yazılı bir sözleşmeyle Murat'a satmış ve teslim etmiştir. Murat o tarihten beri bahçeyi malik sıfatıyla, çekişmesiz ve aralıksız kullanır. Zeynep satışı inkâr etmemektedir.

      1. Murat'ın babasından kalan iki tapusuz tarla kimin adına ve hangi ölçüde tespit edilir?
      2. Mera olarak kullanılan 5 dönümlük alan Murat adına tespit edilebilir mi?
      3. Zeynep adına tapulu bahçe kimin adına tespit edilir? Kadastro yapılmasaydı sonuç ne olurdu?
      4. Tespitler hangi usulle kesinleşir ve kesinleşmeden sonra kadastro öncesi sebebe dayanan bir dava hangi süre içinde açılabilir?
    olcut:
      - {tespit: "Tapusuz taşınmazın en az yirmi yıl çekişmesiz, aralıksız ve malik sıfatıyla zilyetliği ispatlayan adına tespit edildiği; mirasçının mirasbırakanın zilyetliğini doğrudan kazandığı", puan: 20, madde: "3402 sayılı Kanun m. 14"}
      - {tespit: "Aynı çalışma alanında kuru toprakta 100 dönüm sınırı; 115 dönümün 100 dönümünün Murat, belgesi olmadığından 15 dönümünün Hazine adına tespit edileceği", puan: 20, madde: "3402 sayılı Kanun m. 18"}
      - {tespit: "Meraya zamanaşımı uygulanamayacağı ve orta malının zilyetlikle kazanılamayacağı", puan: 15, madde: "4342 sayılı Kanun m. 4"}
      - {tespit: "Tapulu bahçenin tapu dışı yolla kazanma ve en az on yıllık zilyetlik nedeniyle Murat adına tespit edileceği", puan: 20, madde: "3402 sayılı Kanun m. 13"}
      - {tespit: "Kadastro dışında adi yazılı satışın geçersiz olduğu ve tapulu taşınmazın zilyetlikle kazanılamayacağı; TMK m. 712'nin uygulanmadığı", puan: 10, madde: "TMK m. 706"}
      - {tespit: "Otuz günlük askı ilanı, ilan süresinde dava açılmazsa kesinleşme ve kesinleşmeden itibaren on yıllık hak düşürücü süre", puan: 15, madde: "3402 sayılı Kanun m. 12"}
    cozum: |
      **Nitelendirme:** Uyuşmazlık, ilk kez kadastro yapılan bir köyde zilyetliğe dayanan tespitlere ilişkindir. TMK m. 713'teki tescil davası değil, 3402 sayılı Kanun'un tespit kuralları uygulanır.

      **Hukuki sorunlar:** Tapusuz taşınmazda zilyetlikle kazanım ve miktar sınırı; meranın kazanılıp kazanılamayacağı; tapulu taşınmazın kadastroda zilyet adına tespiti; kesinleşme ve süre.

      **İlgili hükümler:** 3402 sayılı Kanun m. 4, 11, 12, 13, 14, 16, 18; 4342 sayılı Kanun m. 4; TMK m. 599, TMK m. 706, TMK m. 712.

      **Değerlendirme:**

      *1. Tapusuz tarlalar.* Tapuda kayıtlı olmayan taşınmaz, çekişmesiz ve aralıksız en az yirmi yıldan beri malik sıfatıyla zilyetliğini belge, bilirkişi ya da tanıkla ispatlayan zilyet adına tespit edilir (3402 sayılı Kanun m. 14/1). Hasan 1995'ten beri malik sıfatıyla zilyettir. Murat mirasçı olarak babasının zilyetliğini doğrudan kazanmıştır (TMK m. 599/2); zilyetlik kesintisiz devam etmiş ve 2025'teki tespitte otuz yılı bulmuştur. Ancak belgesiz kazanım, aynı çalışma alanında kuru toprakta toplam 100 dönümle sınırlıdır. Köy tek bir çalışma alanıdır (3402 sayılı Kanun m. 4/1) ve iki tarla toplam 115 dönümdür. Murat'ın vergi kaydı gibi bir belgesi olmadığından aşan kısım onun adına tespit edilemez (3402 sayılı Kanun m. 14/4). 100 dönüm Murat, 15 dönüm Hazine adına tespit edilir (3402 sayılı Kanun m. 18/1). Uygulamada aşan kısmın hangi taşınmazdan ayrılacağı konusunda zilyedin tercihi sorulur.

      *2. Mera.* Köy halkının eskiden beri hayvan otlattığı alan meradır. Mera, yaylak ve kışlaklar özel mülkiyete geçirilemez ve bunlara zamanaşımı uygulanamaz (4342 sayılı Kanun m. 4/3). Bu tür orta malları sınırlandırılıp özel siciline yazılır (3402 sayılı Kanun m. 16) ve tapulu olsun olmasın kazandırıcı zamanaşımıyla kazanılamaz (3402 sayılı Kanun m. 18/2). Murat'ın yirmi beş yıllık zilyetliği sonuç doğurmaz; alan Murat'ın 100 dönümlük hesabına da girmez.

      *3. Bahçe.* Taşınmaz tapuda Zeynep adına kayıtlıdır ve Murat zilyettir. Kadastroda zilyet, taşınmazı kayıt malikinden tapu dışı bir yolla kazandığını ispat eder ve en az on yıl çekişmesiz, aralıksız ve malik sıfatıyla zilyet bulunursa taşınmaz onun adına tespit edilir (3402 sayılı Kanun m. 13). Satış hem Zeynep'in beyanı hem adi yazılı sözleşmeyle ispatlanmıştır ve zilyetlik on altı yıldır sürmektedir. Bahçe Murat adına tespit edilir. Kadastro yapılmasaydı sonuç farklı olurdu: taşınmaz mülkiyetinin devrini amaçlayan sözleşme resmî şekilde yapılmadıkça geçersizdir (TMK m. 706) ve tapulu taşınmaz kural olarak zilyetlikle kazanılamaz. Murat tapuda malik olarak yazılı olmadığından olağan zamanaşımına (TMK m. 712) da dayanamazdı.

      *4. Kesinleşme ve süre.* Tespitler askı cetvelleriyle 30 gün ilan edilir; itirazı olan bu sürede kadastro mahkemesinde dava açar (3402 sayılı Kanun m. 11). Dava açılmayan tutanaklar ilan süresinin bitiminde kesinleşir ve tapuya kaydedilir (3402 sayılı Kanun m. 12/1-2). Kesinleşmeden itibaren on yıl geçtikten sonra kadastrodan önceki hukuki sebeplere dayanarak itiraz olunamaz ve dava açılamaz (3402 sayılı Kanun m. 12/3).

      **Sonuç:** İki tarladan 100 dönüm Murat, 15 dönüm Hazine adına tespit edilir. Mera Murat adına tespit edilemez. Bahçe Murat adına tespit edilir. Tutanaklar otuz günlük ilan süresinde dava açılmazsa kesinleşir; kadastro öncesi sebebe dayanan dava kesinleşmeden itibaren on yıl içinde açılabilir.

  - olay: |
      Ayırt etme gücü bulunmayan, ama günlük hayatta bu durumu dışarıya belli etmeyen Veli, 10.02.2014'te tapuda dairesini 2.000.000 TL'ye Ali'ye satmıştır. Satış bedeli piyasa değerine uygundur. Ali, Veli'yi daha önce tanımıyordu ve Veli'nin sağlık durumunu gösteren hiçbir belirti yoktu. Ali 2014'ten beri dairede oturmuş; yalnız 2018'de iş nedeniyle bir yıl yurt dışında bulunmuş ve bu sürede daireyi kiraya vermiştir.

      Veli aynı gün tapuda bir arsasını da Cem'e satmıştır. Cem, Veli'nin akrabasıdır ve onun yıllardır ağır bir akıl hastalığı nedeniyle tedavi gördüğünü bilmektedir. Cem 2016'da arsayı, durumu bilmeyen ve bilmesi de gerekmeyen Deniz'e satmış, tescil yapılmıştır.

      Veli 2025'te kısıtlanmış ve vasisi 2026'da Ali ve Deniz'e karşı tapu iptali ve tescil davaları açmıştır.

      1. Ali'nin ve Cem'in tescilleri geçerli midir?
      2. Ali tapuya güven ilkesinden yararlanabilir mi?
      3. Ali'ye karşı açılan dava kabul edilir mi? Yurt dışında geçen yılın ve kiraya vermenin etkisi nedir?
      4. Deniz'e karşı açılan dava kabul edilir mi?
    olcut:
      - {tespit: "Ayırt etme gücü bulunmayanın işleminin hukuki sonuç doğurmadığı; Ali ve Cem lehine tescillerin yolsuz olduğu", puan: 15, madde: "TMK m. 1024"}
      - {tespit: "Ali'nin işlemin tarafı olduğu, tapuya güvenen üçüncü kişi sayılmadığı", puan: 15, madde: "TMK m. 1023"}
      - {tespit: "Olağan zamanaşımının şartları: tapuya yolsuz malik olarak yazılma, on yıl davasız ve aralıksız zilyetlik, iyiniyet; Ali'nin iyiniyeti", puan: 25, madde: "TMK m. 712"}
      - {tespit: "Kiraya vermenin asli ve dolaylı zilyetliği sona erdirmediği; on yıllık sürenin 2024'te dolduğu ve Ali'ye karşı davanın reddi", puan: 15, madde: "TMK m. 974"}
      - {tespit: "Deniz'in tapudaki tescile iyiniyetle dayanan üçüncü kişi olarak korunduğu ve davanın reddi; Cem'in iyiniyetsizliğinin Deniz'i etkilemediği", puan: 20, madde: "TMK m. 1023"}
      - {tespit: "Cem'in iyiniyetli olmadığı için TMK m. 712'den yararlanamayacağı ve Veli'nin tazminat isteminin saklı olduğu", puan: 10, madde: "TMK m. 1025"}
    cozum: |
      **Nitelendirme:** Ayırt etme gücü bulunmayan kişinin yaptığı satışlar nedeniyle yolsuz hâle gelen tescillerin düzeltilmesi istenmektedir (TMK m. 1025). Sorun, kimin hangi hükümle korunduğudur.

      **Hukuki sorunlar:** Tescillerin yolsuzluğu; tapuya güven ilkesinin kapsamı; olağan kazandırıcı zamanaşımının şartları; iyiniyetli üçüncü kişinin korunması.

      **İlgili hükümler:** TMK m. 3, 15, 712, 974, 976, 1023, 1024, 1025.

      **Değerlendirme:**

      *1. Tescillerin durumu.* Ayırt etme gücü bulunmayan kimsenin fiilleri hukuki sonuç doğurmaz (TMK m. 15). Veli'nin iki satışı da geçersizdir. Bağlayıcı olmayan bir hukuki işleme dayanan tescil yolsuzdur (TMK m. 1024/2); Ali ve Cem lehine yapılan tesciller yolsuzdur.

      *2. Ali ve tapuya güven.* TMK m. 1023, tapu kütüğündeki tescile iyiniyetle dayanarak hak kazanan üçüncü kişiyi korur. Ali ise geçersiz işlemin doğrudan tarafıdır; daireyi Veli'nin tapudaki görünüşüne değil, Veli'yle yaptığı geçersiz sözleşmeye dayanarak kazanmıştır. Ali bu hükümden yararlanamaz.

      *3. Ali ve olağan zamanaşımı.* Geçerli bir hukuki sebep olmaksızın tapuya malik olarak yazılan kişi, zilyetliğini davasız ve aralıksız on yıl süreyle ve iyiniyetle sürdürürse mülkiyetine itiraz edilemez (TMK m. 712). Ali tapuda maliktir ve tescilin hukuki sebebi geçersizdir. Ali, Veli'yi tanımamaktadır, bedel piyasa değerine uygundur ve Veli'nin durumunu gösteren bir belirti yoktur. Ali beklenen özeni göstermiştir ve iyiniyetlidir (TMK m. 3). Ali 2018'de daireyi kiraya vermiştir; kiraya veren asli ve dolaylı zilyet olarak zilyetliğini korur, kiracı fer'i zilyet olur (TMK m. 974). Yurt dışında bulunması da zilyetliği kesmez (TMK m. 976). Bu süre içinde zilyetliğe karşı dava açılmamıştır. On yıllık süre 10.02.2014'ten başlar ve 2024 Şubat'ında dolar. Dava 2026'da açıldığında Ali'nin mülkiyetine artık itiraz edilemez; dava reddedilir.

      *4. Deniz.* Cem, Veli'nin hastalığını bildiği için iyiniyetli değildir. Cem tapuda on yıl kalmış olsaydı bile TMK m. 712'den yararlanamazdı. Ancak arsa artık Deniz adınadır. Deniz, Cem'in tapudaki görünüşüne güvenerek ve durumu bilmeden ve bilmesi gerekmeden kazanmıştır. Tapu kütüğündeki tescile iyiniyetle dayanarak mülkiyet kazanan üçüncü kişinin kazanımı korunur (TMK m. 1023); bunun için süre geçmesi gerekmez. Yolsuz tescili bilen ya da bilmesi gereken üçüncü kişi korunmazdı (TMK m. 1024/1), ama Deniz bu durumda değildir. Cem'in iyiniyetsizliği Deniz'e yansımaz. Dava reddedilir. İyiniyetli üçüncü kişinin kazanımı ve her türlü tazminat istemi saklıdır (TMK m. 1025/2); Veli'nin Cem'e karşı tazminat isteme imkânı vardır.

      **Sonuç:** İki tescil de yolsuzdur. Ali TMK m. 1023'e değil, TMK m. 712'ye dayanarak korunur ve ona karşı dava reddedilir. Deniz TMK m. 1023 gereğince korunur ve ona karşı dava da reddedilir. Veli'nin Cem'e karşı tazminat istemi saklıdır.

  - olay: |
      Ayvalı köyünde kadastro 1985'te yapılmıştır. Kadastro ekibi, Fatma'nın tapulu tarlasına bitişik 12 dönümlük kuru alanı yanlışlıkla köy yolu sanarak tescil harici bırakmıştır. Alan gerçekte ham topraktır ve Fatma 2000'den beri burayı malik sıfatıyla, davasız ve aralıksız ekmektedir.

      Köyün yanından geçen nehir 2006'da yatak değiştirmiş ve Fatma'nın tarlasının güneyinde, önceden nehir yatağı olan sahipsiz yerde 6 dönümlük ekilebilir bir arazi ortaya çıkmıştır. Fatma 2007'den beri burayı da eker.

      Fatma ayrıca 2001'den beri, tarlasının kuzeyindeki Devlet ormanından ağaçları sökerek açtığı 3 dönümlük alanı ekmektedir.

      Fatma 2026'da 21 dönümlük alanın tamamı için yalnız Hazineye karşı tescil davası açar. Mahkeme keşif yapar ve tanıkları dinler, ama ilan yaptırmadan davayı kabul eder.

      1. Tescil harici bırakılan 12 dönümlük alan için Fatma'nın davası hangi hükme dayanır? Kadastronun üzerinden kırk yıl geçmiş olması davayı engeller mi?
      2. Nehrin yatak değiştirmesiyle oluşan 6 dönümlük alanı Fatma zilyetlikle kazanabilir mi? Fatma'nın başka bir imkânı var mıdır?
      3. Orman açması 3 dönüm hakkında ne söylenir?
      4. Mahkemenin izlediği usulde hata var mıdır? Fatma 12 dönümlük alanın mülkiyetini ne zaman kazanmıştır?
    olcut:
      - {tespit: "Tescil harici yerin tescilinin olağanüstü zamanaşımına dayandığı ve yirmi yıllık malik sıfatıyla, davasız ve aralıksız zilyetliğin 2020'de dolduğu", puan: 20, madde: "TMK m. 713"}
      - {tespit: "Tescil harici bırakılan yerlerde on yıllık hak düşürücü sürenin işlemediği", puan: 10, madde: "3402 sayılı Kanun m. 12"}
      - {tespit: "Yeni arazinin Devlete ait olduğu, zilyetlikle kazanılamayacağı ve Devletin bitişik malike devrinin takdire bağlı olduğu", puan: 20, madde: "TMK m. 708"}
      - {tespit: "Devlet ormanının ve ormandan açılan yerlerin zamanaşımıyla kazanılamayacağı", puan: 15, madde: "AY m. 169"}
      - {tespit: "Davanın Hazine yanında ilgili kamu tüzel kişisine de yöneltilmesi; en az üç ilan ve son ilandan üç aylık itiraz süresi beklenmeden hüküm kurulamayacağı", puan: 25, madde: "TMK m. 713"}
      - {tespit: "Mülkiyetin koşulların gerçekleştiği anda kazanıldığı, tasarruf için tescil gerektiği", puan: 10, madde: "TMK m. 705"}
    cozum: |
      **Nitelendirme:** Fatma, üç farklı nitelikteki tapusuz alan için zilyetliğe dayanan tescil davası açmıştır. Her alanın özel mülkiyete elverişli olup olmadığı ve usul ayrı ayrı incelenmelidir.

      **Hukuki sorunlar:** Tescil harici yerin zilyetlikle kazanılması ve süre sorunu; yeni arazinin hukuki durumu; orman; tescil davasında husumet, ilan ve mülkiyetin kazanılma anı.

      **İlgili hükümler:** TMK m. 705, 708, 713, 715; 3402 sayılı Kanun m. 12, 14, 17; AY m. 169; 6831 sayılı Kanun m. 17.

      **Değerlendirme:**

      *1. Tescil harici 12 dönüm.* Kadastroda tescil harici bırakılan yer tapuya kaydedilmemiştir. Zilyetliğe dayanan tescili TMK m. 713/1'e göre istenir; uygulamada 3402 sayılı Kanun m. 14 ve m. 17 de birlikte gözetilir. Alan ham topraktır, basit ameliyeyle işlenebilir ve özel mülkiyete elverişlidir; 12 dönüm miktar sınırının da altındadır. Fatma 2000'den beri malik sıfatıyla, davasız ve aralıksız zilyettir; yirmi yıllık süre 2020'de dolmuştur. Kesinleşen kadastro tutanaklarına karşı kadastro öncesi sebeplere dayanan dava on yıllık hak düşürücü süreye tabidir (3402 sayılı Kanun m. 12/3). Ancak bu süre tutanakla tespit edilen yerler içindir. Yargıtay'a göre tescil harici bırakılan yerler için dava açmayı sınırlayan bir süre yoktur. Kırk yıl geçmiş olması davayı engellemez.

      *2. Yeni arazi.* Kamuya ait suların yatağında değişme sonucu sahipsiz yerde oluşan yararlanmaya elverişli arazi Devlete aittir (TMK m. 708/1). Yargıtay'a göre bu arazi TMK m. 713 ya da 3402 sayılı Kanun m. 14 ve m. 17 ile zilyetlikle kazanılamaz. Fatma'nın on dokuz yıllık zilyetliği sonuç doğurmaz; süre yirmi yılı bulsaydı da durum değişmezdi. Fatma bitişik malik olarak Devletten devir isteyebilir. Devlet, kamusal bir sakınca yoksa öncelikle arazisi kayba uğrayana ya da bitişik malike devredebilir (TMK m. 708/2), ama devretmek zorunda değildir.

      *3. Orman açması.* Devlet ormanları zamanaşımı ile mülk edinilemez (AY m. 169/2). Ormanların açılmasıyla elde edilen yerler kişiler adına tapuya tescil olunamaz ve orman idaresince el konulur (6831 sayılı Kanun m. 17/2). İmar-ihya kuralı da orman sayılan yerlere uygulanmaz (3402 sayılı Kanun m. 17). Bu kısım için dava reddedilir.

      *4. Usul ve mülkiyetin kazanılma anı.* Tescil davası Hazineye ve ilgili kamu tüzel kişilerine karşı açılır (TMK m. 713/3); köy tüzel kişiliği de davaya katılmalıdır. Davanın konusu bir gazete ve bir internet haber sitesinde ve ayrıca taşınmazın bulunduğu yerde en az üç defa ilan edilmelidir (TMK m. 713/4). Hâkim, son ilandan başlayarak üç ay içinde yerinde bir itiraz çıkmaz ve iddia ispatlanırsa tescile karar verir (TMK m. 713/5). Mahkeme taraf teşkilini sağlamadan ve ilan yaptırmadan hüküm kurduğu için karar usule aykırıdır. Şartlar ispatlanırsa Fatma 12 dönümlük alanın mülkiyetini yirmi yılın dolduğu 2020'de kazanmıştır (TMK m. 713/5). Karar bu kazanımı tespit eder. Fatma alanı satabilmek ya da ipotek edebilmek için tescil ettirmelidir (TMK m. 705/2).

      **Sonuç:** 12 dönüm için dava, taraf teşkili ve ilan tamamlandıktan sonra kabul edilmelidir. 6 dönümlük yeni arazi ve 3 dönümlük orman açması için dava reddedilmelidir. İlan yapılmadan verilen karar bozulmalıdır.

kartlar:
  - on: "Olağan kazandırıcı zamanaşımının şartları nelerdir? (TMK m. 712)"
    arka: "Geçerli hukuki sebep olmadan tapuya malik olarak yazılma, zilyetliğin davasız ve aralıksız on yıl sürmesi ve iyiniyet. Süre dolunca mülkiyete itiraz edilemez."
  - on: "TMK m. 712 ile TMK m. 1023 farkı nedir?"
    arka: "TMK m. 1023 tapuya güvenen iyiniyetli üçüncü kişiyi hemen korur. TMK m. 712 geçersiz işlemin tarafını on yıl iyiniyetli zilyetlikten sonra korur."
  - on: "Olağanüstü zamanaşımı hangi taşınmazlarda uygulanır? (TMK m. 713)"
    arka: "Tapusuz taşınmaz; maliki tapu kütüğünden anlaşılamayan ya da yirmi yıl önce hakkında gaiplik kararı verilmiş kişi adına kayıtlı taşınmaz."
  - on: "Olağanüstü zamanaşımında süre ve zilyetliğin nitelikleri nelerdir?"
    arka: "Yirmi yıl, davasız, aralıksız ve malik sıfatıyla zilyetlik. İyiniyet aranmaz (TMK m. 713/1)."
  - on: "TMK m. 713/2'deki 'ölmüş' malik hâline ne oldu?"
    arka: "'Ölmüş ya da' ibaresi Anayasa Mahkemesince 2011'de iptal edildi. Malikin yirmi yıl önce ölmüş olması artık tescil sebebi değildir."
  - on: "TMK m. 713 davası kime karşı açılır?"
    arka: "Hazineye ve ilgili kamu tüzel kişilerine ya da varsa tapuda malik görünenin mirasçılarına (TMK m. 713/3)."
  - on: "TMK m. 713 davasında ilan ve itiraz nasıldır?"
    arka: "Bir gazete ve bir internet haber sitesinde ve taşınmazın bulunduğu yerde en az üç defa ilan (gazete kısmı 7418 sayılı Kanunla değişti, yürürlük 01.04.2023). İtiraz: son ilandan başlayarak üç ay."
  - on: "Olağanüstü zamanaşımında mülkiyet ne zaman kazanılır?"
    arka: "Koşulların gerçekleştiği anda (TMK m. 713/5). Tasarruf işlemi için tescil gerekir (TMK m. 705/2)."
  - on: "Önceki zilyedin süresi ne zaman eklenir? (TMK m. 996)"
    arka: "Devreden de kazandırıcı zamanaşımından yararlanma yetkisine sahipse. Mirasçı mirasbırakanın zilyetliğini doğrudan kazanır (TMK m. 599/2)."
  - on: "Kiracı yirmi yıl sonra taşınmazı zamanaşımıyla kazanabilir mi?"
    arka: "Hayır. Kiracı fer'i zilyettir, malik sıfatı yoktur (TMK m. 974)."
  - on: "Kazandırıcı zamanaşımında sürelerin hesabı, kesilmesi ve durması hangi hükümlere tabidir?"
    arka: "Borçlar Kanunu'nun zamanaşımı hükümleri kıyasen uygulanır (TMK m. 714). Başlangıç günü sayılmaz (TBK m. 151)."
  - on: "Taşınırda kazandırıcı zamanaşımı süresi nedir?"
    arka: "Beş yıl; davasız, aralıksız, iyiniyetli ve malik sıfatıyla zilyetlik (TMK m. 777). Ayrıntısı konu 19'da."
  - on: "Zamanaşımıyla kazanılamayan yerlere örnek verin."
    arka: "Devlet ormanları (AY m. 169), kıyılar (AY m. 43), mera, yaylak, kışlak (4342 sayılı Kanun m. 4), orta ve hizmet malları (3402 sayılı Kanun m. 18/2)."
  - on: "İmar-ihya nedir? (3402 sayılı Kanun m. 17)"
    arka: "Orman sayılmayan, tahsis edilmemiş Devlet arazisini emek ve masrafla tarıma elverişli hâle getirme. 3402 sayılı Kanun m. 14 şartları varsa ihya eden adına tespit edilir."
  - on: "3402 sayılı Kanun m. 14'teki miktar sınırı nedir?"
    arka: "Aynı çalışma alanında toplam sulu toprakta 40, kuru toprakta 100 dönüm. Fazlası için belge gerekir (ör. 31.12.1981 veya önceki vergi kaydı)."
  - on: "Kadastro çalışma alanı nedir? (3402 sayılı Kanun m. 4)"
    arka: "Her köy ile belediye sınırları içindeki her mahalle. Miktar sınırı her çalışma alanı için ayrı hesaplanır."
  - on: "Kadastroda tapulu taşınmaz zilyet adına tespit edilebilir mi?"
    arka: "Evet. Zilyet kayıt malikinden tapu dışı yolla kazandığını ispatlar ve en az on yıl malik sıfatıyla, çekişmesiz, aralıksız zilyetse (3402 sayılı Kanun m. 13)."
  - on: "Kadastro tutanağı kesinleştikten sonra kadastro öncesi sebebe dayanan dava ne zamana kadar açılabilir?"
    arka: "Kesinleşmeden itibaren on yıl (3402 sayılı Kanun m. 12/3). Tescil harici bırakılan yerler için böyle bir süre yoktur."
  - on: "Taşınmaz işgalle kazanılabilir mi? (TMK m. 707)"
    arka: "Tapulu taşınmaz ancak kaydı malikin istemiyle terkin edilmişse. Tapusuz taşınmaz işgalle kazanılamaz."
  - on: "Yeni arazi kime aittir? (TMK m. 708)"
    arka: "Devlete. Devlet, kamusal sakınca yoksa öncelikle arazisi kayba uğrayana ya da bitişik malike devredebilir. Zilyetlikle kazanılamaz."
  - on: "Kopan toprağı geri alma süresi nedir?"
    arka: "Öğrenmeden başlayarak bir yıl ve her hâlde oluşumdan başlayarak on yıl (TMK m. 708/3)."
  - on: "Arazi kayması sınırı değiştirir mi?"
    arka: "Hayır (TMK m. 709). Geçen parçalara sürüklenen şeyler ve karışma hükümleri uygulanır. Heyelan bölgesi olarak belirlenen yörelerde bu ilke uygulanmaz (TMK m. 710)."
  - on: "Heyelan bölgesi tapuda nasıl gösterilir ve sınır nasıl düzeltilir?"
    arka: "Beyanlar sütununa yazılır (TMK m. 710/3). Sınır gerçeği yansıtmıyorsa yeniden belirlenir; fazlalık ve eksiklikler denkleştirilir (TMK m. 711)."
