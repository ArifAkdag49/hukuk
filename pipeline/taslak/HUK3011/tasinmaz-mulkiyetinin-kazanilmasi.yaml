    ozet: |
      Tüketici davacı, 2015'te bir yapsatçı inşaat şirketinden, kat mülkiyetine tabi olarak inşa edilen projedeki bir bağımsız bölümü adi yazılı sözleşmeyle satın almış ve bedelin bir kısmını ödemiştir. Şirket bölümü teslim etmemiş, 2016'da tapuda başka birine satmış; davacı devrin muvazaalı olduğunu ileri sürerek tescil, olmazsa bedel istemiştir. Bölge adliye mahkemesi, bölüm teslim edilmediği için 1988 tarihli İBK'nin şartlarının oluşmadığını belirterek tescil istemini reddetmiş, Yargıtay 7. Hukuk Dairesi muvazaanın araştırılması gerektiği gerekçesiyle bozmuş, bölge adliye mahkemesi direnmiştir. Hukuk Genel Kurulu direnme kararını değişik gerekçeyle ve oyçokluğuyla bozmuştur. Gerekçeye göre sözleşme ön ödemeli konut satışıdır; satıcı şekle aykırılığı tüketici aleyhine ileri süremeyeceğinden (6502 sayılı Kanun m. 41/1) uyuşmazlık İBK'ye göre değil bu Kanun'a göre çözülmelidir. Dava açılmadan önce taşınmazı iyiniyetle kazanan üçüncü kişi korunur ve şerh edilmemiş kişisel hak ona karşı ileri sürülemez; ancak devir muvazaalıysa ya da zarar vermek için bilerek yapılmışsa durum farklıdır, bu yüzden muvazaa araştırılmalıdır. Konuya katkısı: harici satışın kuralını, İBK istisnasını ve tüketici satışındaki kanuni istisnayı bir arada gösterir.
  - id: "1226984400"
    ozet: |
      Taraflar 2005'te noterde düzenleme şeklinde, sonradan birden çok parsele ifraz edilen bir taşınmazdaki ev ve arsasına ilişkin satış vaadi sözleşmesi yapmıştır. Davacı bedeli ödediğini ve yerin teslim edildiğini ileri sürerek tescil, olmazsa tazminat istemiş, davalı zamanaşımı def'inde bulunmuştur. İlk derece mahkemesi zilyetliğin teslim edilmediğini ve on yıllık sürenin geçtiğini kabul ederek davayı reddetmiş, bölge adliye mahkemesi istinafı esastan reddetmiştir. Yargıtay 7. Hukuk Dairesi 2026'da bölge adliye mahkemesi kararını kaldırıp ilk derece kararını bozmuştur. Gerekçeye göre sözleşmede yerin o günden itibaren vaat alana ait olacağı ve bütün yükümlülükleri onun karşılayacağı yazılı olduğundan hukuki teslim yapılmıştır; bu durumda zamanaşımı def'i TMK m. 2'deki dürüstlük ilkesiyle bağdaşmaz. Mahkeme ev ve arsanın hangi parselde kaldığını keşifle belirlemeli, parsel vaat borçlusu adına kayıtlıysa tescile karar vermeli, kayıtlı değilse kayıt malikine dahili davalı yoluyla husumet yöneltilemeyeceğini gözeterek tazminat istemini incelemelidir. Konuya katkısı: tescile zorlama davasında zamanaşımı, teslim ve davalı sıfatını gösterir.
  - id: "610940600"
    ozet: |
      Paydaş olan taraflar, davalının birkaç parseldeki payını davacıya satması için anlaşmış, bir parsel dışındakilerin devri tapuda yapılmıştır. Devri yapılmayan parsel için davacı bedeli ödediğini ve karşılığında davalıdan senet aldığını ileri sürerek tescil, olmazsa bedel istemiştir. Mahkeme, devir resmî görevli önünde yapılmadığı için tescil istemini reddetmiş ve yalnız muhdesat bedeline hükmetmiştir. Yargıtay 8. Hukuk Dairesi tescil istemine ilişkin temyiz itirazlarını reddetmiş, bedel yönünden kararı bozmuştur. Gerekçeye göre geçersiz taşınmaz satışlarında herkes verdiğini geri alır. Alıcı, 1939 ve 1940 tarihli İçtihadı Birleştirme Kararları uyarınca satış senedinde yazan bedeli isteyebilir ve bu bedel denkleştirici adalet ilkesiyle dava tarihine kadar güncellenir. Mahkeme önce senetteki imza ve yazının davalıya ait olup olmadığını incelemeli, sonra uzman bilirkişi kurulundan güncel değer raporu almalıdır. Konuya katkısı: harici satışın sonucunu ve iadede güncellemenin nasıl yapıldığını gösterir.

sorular:
  - soru: |
      TMK m. 705/2'ye göre aşağıdakilerden hangisinde taşınmaz mülkiyeti **tescilden önce kazanılmaz**?
    siklar:
      - "Mirasbırakanın ölümüyle mirasçıların kazanması"
      - "Cebrî icrada taşınmazın ihale edildiği alıcının kazanması"
      - "Kamulaştırma ile idarenin kazanması"
      - "Tapuda resmî senetle yapılan satışta alıcının kazanması"
    dogru: 3
    aciklama: |
      Resmî senetle satış, tescille kazanmanın tipik örneğidir. Alıcı tescille malik olur (TMK m. 705/1). Miras, cebrî icra ve kamulaştırma ise TMK m. 705/2'de sayılan tescilsiz kazanma hâlleridir.

  - soru: |
      Ahmet 2025'te ölmüştür. Tek mirasçısı oğlu Can'dır. Can, mirasçılık belgesini alıp Ahmet adına kayıtlı daireyi tapuda Deniz'e satmak için başvurur. Daire henüz Can adına tescil edilmemiştir. Hangisi doğrudur?
    siklar:
      - "Can henüz malik değildir; mülkiyet ancak intikal ile kazanılacağından daireyi kiraya da veremez."
      - "Can ölümle malik olmuştur, ama daireyi satabilmesi için mülkiyetin önce kendi adına tescil edilmesi gerekir."
      - "Can malik olduğundan ve miras tescilsiz kazanma hâli olduğundan tescil yaptırmadan satış yapabilir."
      - "Can ancak ölümden itibaren on yıl geçince malik olur."
    dogru: 1
    aciklama: |
      Mirasçı mirası ölümle kazanır (TMK m. 599/1) ve mülkiyet tescilden önce geçer (TMK m. 705/2). Ancak aynı fıkraya göre tescilsiz kazanan malik, tescil yaptırmadan tasarruf işlemi yapamaz. Satış bir tasarruf işlemidir. Kiraya vermek ise borç doğuran bir işlemdir ve bu sınırın dışındadır.

  - soru: |
      Aşağıdakilerden hangisi TMK m. 704'e göre **taşınmaz mülkiyetinin konusu değildir**?
    siklar:
      - "Arazi"
      - "Tapu kütüğünde ayrı sayfaya kaydedilmiş bağımsız ve sürekli üst hakkı"
      - "Kat mülkiyeti kütüğüne kayıtlı bağımsız bölüm"
      - "Tapuya şerh edilmiş kira sözleşmesinden doğan hak"
    dogru: 3
    aciklama: |
      TMK m. 704 arazi, ayrı sayfaya kaydedilen bağımsız ve sürekli haklar ve kat mülkiyeti kütüğüne kayıtlı bağımsız bölümleri sayar. Şerh edilen kira hakkı kişisel bir haktır. Şerh ona sonraki maliklere karşı ileri sürülebilme gücü verir (TMK m. 1009/2), ama onu taşınmaz yapmaz.

  - soru: |
      TMK m. 1022/2'ye göre tescilin etkisi, belgeler tamsa, hangi tarihten başlar?
    siklar:
      - "Yevmiye defterine yapılan kayıt tarihinden"
      - "Satış bedelinin tamamen ödendiği tarihten"
      - "Taşınmazın alıcıya teslim edildiği tarihten"
      - "Tapu senedinin malike verildiği tarihten"
    dogru: 0
    aciklama: |
      Tescilin etkisi, kanunen öngörülen belgeler isteme eklenmişse yevmiye defterine yapılan kayıt tarihinden başlar (TMK m. 1022/2). Bedelin ödenmesi ve teslim mülkiyeti geçirmez. Tapu senedinin verilmesi de yalnız bir belge teslimidir.

  - soru: |
      Selim, tapulu tarlasını 2021'de muhtar yanında imzalanan adi yazılı sözleşmeyle Okan'a 400.000 TL'ye satar. Okan bedelin tamamını öder, tarlayı teslim alır ve dört yıl eker. Selim tapuda devirden kaçınınca Okan, TMK m. 716'ya dayanarak tescil davası açar. Sonuç ne olur?
    siklar:
      - "Okan bedelin tamamını ödeyip zilyet olduğundan, dürüstlük kuralı gereği dava kabul edilir."
      - "Sözleşme resmî şekilde yapılmadığından geçersizdir; tescil istemi reddedilir, Okan ödediği bedelin iadesini isteyebilir."
      - "Adi yazılı sözleşme satış vaadi sayılır; Okan bakiye bedeli depo ederse tescile karar verilir."
      - "Sözleşme geçerlidir, ama Okan tescil yerine yalnız elatmanın önlenmesi davası açabilir."
    dogru: 1
    aciklama: |
      Taşınmaz satışı resmî şekilde yapılmadıkça geçerli olmaz (TMK m. 706, TBK m. 237/1). Geçersiz sözleşmeye dayanan tescil davası kural olarak kabul edilemez. 1988 tarihli İBK'nin TMK m. 2 istisnası yalnız kat mülkiyetine tabi inşaattan bağımsız bölüm satışı içindir; tarla bu kapsamda değildir. Satış vaadi de noterde düzenleme şeklinde yapılmalıdır. Okan, ödediğini sebepsiz zenginleşme hükümlerine göre geri ister (TBK m. 77).

  - soru: |
      Yargıtay'ın yerleşik uygulamasına göre geçersiz bir harici taşınmaz satışında bedeli ödeyen alıcı neyi isteyebilir?
    siklar:
      - "Taşınmazın dava tarihindeki rayiç değerini"
      - "Ödediği bedeli, denkleştirici adalet ilkesiyle dava tarihine kadar güncellenmiş olarak"
      - "Yalnız ödediği nominal tutarı, hiçbir güncelleme yapılmadan"
      - "Hiçbir şey; geçersiz sözleşmeye bilerek giren kişi korunmaz"
    dogru: 1
    aciklama: |
      Geçersiz sözleşmede herkes verdiğini geri alır (TBK m. 77). Yargıtay, alıcının taşınmazın değerini değil ödediği bedeli isteyebileceğini, bu bedelin de denkleştirici adalet ilkesiyle enflasyon, kur ve ücret artışları gözetilerek güncelleneceğini kabul eder. Taşınmazın değeri, geçerli bir sözleşmenin ihlalinde istenebilecek ifa menfaatidir.

  - soru: |
      1988 tarihli İçtihadı Birleştirme Kararı'na göre harici satışta TMK m. 2 gözetilerek tescil davasının kabul edilebilmesi için aşağıdakilerden hangisi **aranmaz**?
    siklar:
      - "Bağımsız bölümün, kat mülkiyetine tabi olmak üzere yapımına başlanan bir binada bulunması"
      - "Alıcının bütün borçlarını yerine getirmiş olması"
      - "Bölümün alıcıya teslim edilmiş olması ve alıcının onu malik gibi kullanması"
      - "Sözleşmedeki imzaların noterce onaylanmış olması"
    dogru: 3
    aciklama: |
      İBK'nin istisnası, kat mülkiyetine tabi olarak yapımına başlanan binadan bağımsız bölüm satışında alıcının bütün borçlarını ödemesini, bölümün teslim edilmesini ve alıcının onu malik gibi kullanmasını arar. İmza onayı aranmaz. Zaten imza onayı resmî şekil yerine geçmez.

  - soru: |
      Tüketici Elif, yapı ruhsatı alınmış bir projeden X İnşaat A.Ş.'nin satışa çıkardığı konutu, bedelini taksitle önceden ödemek üzere adi yazılı bir sözleşmeyle satın alır. Konut fiyatları artınca şirket, sözleşmenin resmî şekilde yapılmadığını ve geçersiz olduğunu ileri sürerek devirden kaçınır. Şirketin bu savunması hakkında hangisi doğrudur?
    siklar:
      - "Savunma yerindedir; sözleşme kesin hükümsüzdür ve Elif yalnız ödediğini geri isteyebilir."
      - "Savunma dinlenmez; ön ödemeli konut satışında satıcı, şekle aykırılığı tüketicinin aleyhine ileri süremez."
      - "Savunma dinlenmez, çünkü tüketici sözleşmelerinde taşınmaz satışı şekle bağlı değildir."
      - "Savunma yerindedir, ancak şirket Elif'e ayrıca cezai şart ödemek zorundadır."
    dogru: 1
    aciklama: |
      6502 sayılı Kanun m. 41/1'e göre ön ödemeli konut satışının tapuya tescili, satış vaadinin ise noterde düzenleme şeklinde yapılması zorunludur. Aksi hâlde satıcı, sözleşmenin geçersizliğini sonradan tüketicinin aleyhine ileri süremez. Şekil şartı kalkmamıştır; yalnız satıcının ona dayanması yasaklanmıştır.

  - soru: |
      Taşınmaz satış vaadi sözleşmesinin geçerliliği için hangi şekil gerekir?
    siklar:
      - "Adi yazılı şekil yeterlidir, çünkü vaat mülkiyeti geçirmez."
      - "Noterde imzaların onaylanması (onaylama şekli) yeterlidir."
      - "Noterde düzenleme şeklinde yapılması gerekir."
      - "Hiçbir şekle bağlı değildir; şekil yalnız asıl satış için aranır."
    dogru: 2
    aciklama: |
      Taşınmaz satışı vaadi resmî şekilde düzenlenmedikçe geçerli olmaz (TBK m. 237/2). Önsözleşme ileride kurulacak sözleşmenin şekline tabidir (TBK m. 29/2). Satış vaadi noterlerin görevidir ve düzenleme şeklinde yapılır (1512 sayılı Kanun m. 60/3 ve m. 89). İmza onayı resmî şekil sayılmaz.

  - soru: |
      Aşağıdaki sözleşmelerden hangisinin geçerliliği için **yazılı şekil yeterlidir**?
    siklar:
      - "Taşınmaz satış vaadi sözleşmesi"
      - "Alım sözleşmesi"
      - "Geri alım sözleşmesi"
      - "Önalım sözleşmesi"
    dogru: 3
    aciklama: |
      TBK m. 237/2 satış vaadi, geri alım ve alım sözleşmelerini resmî şekle bağlar. Önalım sözleşmesi için ise yazılı şekil yeterlidir (TBK m. 237/3). Bu fark sınavda sık sorulur.

  - soru: |
      Nuri, evini kızı Ece'ye bağışlayacağını adi yazılı ve imzalı bir belgeyle taahhüt eder, evin anahtarlarını da Ece'ye verir. Ece iki yıldır evde oturmaktadır. Nuri tapuda devirden vazgeçer. Ece'nin durumu hakkında hangisi doğrudur?
    siklar:
      - "Bağışlama sözü için yazılı şekil yeterli olduğundan Ece tescil davası açabilir."
      - "Söz yerine getirildiği için elden bağışlama hükmünde sayılır ve Ece malik olmuştur."
      - "Taşınmaz bağışlama sözü resmî şekilde yapılmadığından geçersizdir ve teslim bu eksikliği gidermez; Ece tescil isteyemez."
      - "Aile içi bağışlamalar şekle bağlı olmadığından Ece kendiliğinden malik olmuştur."
    dogru: 2
    aciklama: |
      Taşınmazın bağışlanması sözü ancak resmî şekilde yapılırsa geçerlidir (TBK m. 288/2). Geçersiz bağışlama sözünün yerine getirilmesiyle elden bağışlama hükmüne ulaşılması, geçerliliği resmî şekle bağlı bağışlamalarda uygulanmaz (TBK m. 288/3). Ayrıca taşınmazda mülkiyet teslimle değil tescille geçer (TMK m. 705/1).

  - soru: |
      Noterde yapılan taşınmaz satışı hakkında hangisi doğrudur?
    siklar:
      - "Noterde yapılan satış resmî şekil sayılmaz; ayrıca tapuda resmî senet düzenlenmesi gerekir."
      - "Sözleşmeyi noter yapar; taşınmazın alıcı adına tapu siciline tescilini tapu müdürlüğü sağlar."
      - "Noter, satış sözleşmesiyle birlikte tapu sicilini de kendisi tutar ve tescili kendisi yapar."
      - "Noterde yalnız satış vaadi yapılabilir, satış sözleşmesi yapılamaz."
    dogru: 1
    aciklama: |
      1512 sayılı Kanun m. 61/A'ya göre taşınmaz satış sözleşmesi noterlerce de yapılabilir. Noter sözleşmeyi imza anında yevmiye numarası alarak tapu bilişim sistemine kaydeder, tescili ise tapu müdürlüğü sağlar. Mülkiyet yine tescille geçer (TMK m. 705/1).

  - soru: |
      Noterde düzenlenen bir taşınmaz satış vaadi sözleşmesi tapuya şerh edilmiştir. 2644 sayılı Kanun m. 26'ya göre şerhten itibaren hangi süre içinde satış yapılmazsa şerh terkin olunur?
    siklar:
      - "Bir yıl"
      - "Üç yıl"
      - "Beş yıl"
      - "On yıl"
    dogru: 2
    aciklama: |
      2644 sayılı Kanun m. 26'ya göre şerhten itibaren beş yıl içinde satış yapılmaz ya da irtifak hakkı kurulup tescil edilmezse şerh terkin olunur. On yıl, önalım, alım ve geri alım haklarının kararlaştırılabileceği en uzun süredir; bunu satış vaadi şerhiyle karıştırmamak gerekir.

  - soru: |
      TMK m. 716/1'e göre tescile zorlama davasını açan kişi hangi hakka dayanır?
    siklar:
      - "Taşınmaz üzerindeki mülkiyet hakkına"
      - "Malikten mülkiyetin kendi adına tescilini isteme konusundaki kişisel hakkına"
      - "Taşınmaz üzerindeki zilyetliğine"
      - "Şerh edilmesiyle ayni hakka dönüşen vaat hakkına"
    dogru: 1
    aciklama: |
      TMK m. 716/1 davacıyı, hukuki sebebe dayanarak malikten tescil isteme konusunda **kişisel hakka** sahip olan kişi olarak tanımlar. Davacı henüz malik değildir. Şerh kişisel hakkı ayni hakka dönüştürmez, yalnız sonradan hak kazananlara karşı ileri sürülebilir kılar (TMK m. 1009/2).

  - soru: |
      Zehra, 2013'te noterde düzenleme şeklinde yaptığı satış vaadiyle dükkânını Ferhat'a satmayı vaat eder. Ferhat bedelin tamamını öder, dükkân aynı gün Ferhat'a teslim edilir ve Ferhat o tarihten beri dükkânı işletir. Ferhat 2026'da tescil davası açar, Zehra zamanaşımı def'inde bulunur. Yargıtay'ın yerleşik uygulamasına göre sonuç nedir?
    siklar:
      - "On yıllık zamanaşımı dolduğu için dava reddedilir."
      - "Dükkân vaat alacaklısına teslim edildiğinden zamanaşımı def'i dürüstlük kuralıyla bağdaşmaz ve dinlenmez."
      - "Tescil davaları hiçbir zaman zamanaşımına uğramadığından def'i baştan geçersizdir."
      - "Zamanaşımı beş yıldır ve şerh tarihinden başlar; şerh olmadığından süre işlememiştir."
    dogru: 1
    aciklama: |
      Satış vaadine dayanan tescil davası kişisel hakka dayanır ve on yıllık zamanaşımına tabidir (TBK m. 146). Ancak Yargıtay'a göre taşınmaz vaat alacaklısına teslim edilmişse vaat borçlusunun zamanaşımı def'i TMK m. 2'deki dürüstlük kuralıyla bağdaşmaz. "Tescil davaları zamanaşımına uğramaz" genellemesi yanlıştır; zamanaşımı bakımından farklı olan, malikin ayni hakkına dayanarak yolsuz tescilin düzeltilmesini istediği davadır (ayrıntısı ayrı konuda).

  - soru: |
      Arif, dairesini önce Banu'ya adi yazılı sözleşmeyle satar ve bedelini alır. Bir ay sonra aynı daireyi tapuda resmî senetle Cem'e satar ve daire Cem adına tescil edilir. Cem, Banu ile yapılan sözleşmeden habersizdir. Hangisi doğrudur?
    siklar:
      - "Banu daireyi önce satın aldığı için maliktir; Cem'in tescili iptal edilir."
      - "Cem malik olmuştur; Banu, Arif'e ödediği bedelin iadesi için başvurabilir."
      - "İki satış da geçerlidir; malik, bedeli önce ödeyendir."
      - "Cem'in tescili yolsuzdur; Banu TMK m. 1025'e göre sicilin düzeltilmesini dava edebilir."
    dogru: 1
    aciklama: |
      Banu ile yapılan sözleşme resmî şekilde yapılmadığından geçersizdir (TMK m. 706). Cem ise malikten geçerli bir resmî senetle almış ve tescille malik olmuştur (TMK m. 705/1). Cem'in tescili yolsuz değildir; Banu'nun bir ayni hakkı da yoktur. Banu yalnız Arif'e karşı verdiğini geri ister (TBK m. 77).

  - soru: |
      Hakan, noterde düzenlenen satış vaadiyle arsasını Leyla'ya satmayı vaat eder. Sözleşme tapuya şerh edilmez. Daha sonra Hakan arsayı tapuda gerçek bir satışla Mert'e satar ve tescil yapılır. Mert'in vaatten haberi yoktur, devirde muvazaa da yoktur. Leyla'nın durumu nedir?
    siklar:
      - "Leyla'nın hakkı noterde düzenlendiği için herkese karşı ileri sürülebilir; Mert'e karşı tescil ister."
      - "Önce yapılan sözleşme üstün olduğundan Mert'in tescili kendiliğinden geçersizdir."
      - "Leyla şerh edilmemiş kişisel hakkını Mert'e karşı ileri süremez; Hakan'dan borca aykırılık nedeniyle tazminat isteyebilir."
      - "Leyla yalnız sözleşmeyi düzenleyen noterden tazminat isteyebilir."
    dogru: 2
    aciklama: |
      Satış vaadi yalnız kişisel hak doğurur. Kişisel hak ancak şerh verilirse taşınmaz üzerinde sonradan hak kazananlara karşı ileri sürülebilir (TMK m. 1009/2). Şerh olmadığından ve devir muvazaalı olmadığından Mert'in mülkiyeti korunur. Leyla, ifa edilmeyen borç nedeniyle Hakan'dan tazminat ister (TBK m. 112).

  - soru: |
      Borçlu Murat'ın haczedilen dükkânı icra dairesinin ihalesinde Selin'e ihale edilir ve Selin bedeli öder. İhaleden iki gün sonra, ihalenin feshi için şikâyet süresi dolmadan Selin, dükkânı bankaya ipotek ettirmek için tapuya başvurur. Hangisi doğrudur?
    siklar:
      - "Selin ancak tapuya tescille malik olacağından henüz hiçbir hakkı yoktur."
      - "Selin mülkiyeti ihale ile kazanmıştır, ama ipotek gibi tasarruf işlemleri için mülkiyetin adına tescil edilmesi gerekir."
      - "Selin hem malik olmuştur hem de tescil olmadan ipotek kurabilir."
      - "Selin ihaleden itibaren bir yıl geçmedikçe malik olamaz."
    dogru: 1
    aciklama: |
      Taşınmaz kendisine ihale edilen alıcı mülkiyeti kazanmış olur (İİK m. 134/1). Bu, TMK m. 705/2'deki cebrî icra yoluyla tescilsiz kazanmadır. Ancak tescilsiz malik tescil olmadan tasarruf işlemi yapamaz. Tapuya tescil bildirimi de şikâyet süresi geçtikten ya da şikâyeti sonuçlandıran karar kesinleştikten sonra yapılır (İİK m. 134).

  - soru: |
      Kemal, resmî vasiyetnamesiyle bir arsasını yeğeni Oya'ya bırakmıştır (belirli mal bırakma). Kemal'in ölümünden sonra mirasçılar mirası kabul etmiş, ama arsanın Oya adına tescilinden kaçınmaktadır. Oya ne yapabilir?
    siklar:
      - "Oya ölümle arsanın maliki olmuştur; tescili mirasçılara sormadan doğrudan yaptırır."
      - "Oya mirasçılara karşı kişisel istem hakkına sahiptir; onlar kaçınırsa mülkiyetin hükmen geçirilmesini dava edebilir."
      - "Oya mirasçı sayılır ve arsada mirasçılarla birlikte elbirliği maliki olur."
      - "Vasiyetname resmî senetle yapılmadığı için geçersizdir; Oya hiçbir şey isteyemez."
    dogru: 1
    aciklama: |
      Vasiyet alacaklısı, mirasçılara karşı kişisel bir istem hakkına sahip olur ve vasiyet edilen hakkın devrini dava edebilir (TMK m. 600). Bu kişisel hak, TMK m. 716/1 anlamında tescil isteme hakkıdır. Ölüme bağlı tasarruflar kendilerine özgü şekle tabidir (TMK m. 706/2); resmî vasiyetname geçerli bir şekildir.

  - soru: |
