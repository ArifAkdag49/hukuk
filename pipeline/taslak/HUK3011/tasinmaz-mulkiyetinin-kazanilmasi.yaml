olaylar:
  - olay: |
      Hasan, Sakarya'daki tapulu fındık bahçesini 2018'de köy kahvesinde, iki tanığın da imzaladığı bir "harici satış senedi" ile komşusu Kemal'e 500.000 TL'ye satar. Kemal bedelin tamamını aynı gün öder, bahçeyi teslim alır ve yedi yıl boyunca ürününü toplar. Hasan tapudaki devri "vergiler düşünce yaparız" diyerek sürekli erteler.

      Hasan Mart 2025'te ölür. Mirasçıları eşi Nermin ve kızı Pınar'dır. Nermin ve Pınar, noterden mirasçılık belgesi alır ve bahçeyi Levent'e satmak için tapu müdürlüğüne başvurur. Müdürlük, önce bahçenin mirasçılar adına tescil edilmesi gerektiğini bildirir. Bunu duyan Kemal, "Bahçe benim, yedi yıldır ben işletiyorum, parasını da ödedim" diyerek avukata başvurur.

      1. Hasan ile Kemal arasındaki sözleşme geçerli midir? Kemal, mirasçılara karşı bahçenin kendi adına tescilini isteyebilir mi?
      2. Kemal'in mirasçılara karşı başka hangi istemi vardır ve bu istemin tutarı nasıl belirlenir?
      3. Nermin ve Pınar bahçenin maliki midir? Tapu müdürlüğü neden önce kendi adlarına tescil istemiştir?
      4. Bahçe tapuda Levent'e satılıp onun adına tescil edilirse Kemal'in Levent'e karşı bir hakkı olur mu?
    olcut:
      - {tespit: "Sözleşmenin resmî şekle aykırılık nedeniyle geçersiz olması", puan: 20, madde: "TMK m. 706"}
      - {tespit: "Geçersiz sözleşmeye dayanan tescil isteminin reddi; İBK istisnasının yalnız kat mülkiyetine tabi inşaattaki bağımsız bölüme ilişkin olması", puan: 20, madde: "TMK m. 2"}
      - {tespit: "Ödenen bedelin sebepsiz zenginleşme hükümlerine göre, denkleştirici adaletle güncellenerek mirasçılardan istenmesi", puan: 20, madde: "TBK m. 77"}
      - {tespit: "Mirasçıların ölümle, tescilden önce bahçenin elbirliği maliki olması", puan: 15, madde: "TMK m. 599"}
      - {tespit: "Tescilsiz malikin tasarruf için önce kendi adına tescil yaptırması gereği", puan: 10, madde: "TMK m. 705"}
      - {tespit: "Levent'in tescille malik olması ve Kemal'in ona karşı ileri sürebileceği bir hakkının bulunmaması", puan: 15, madde: "TMK m. 705"}
    cozum: |
      **Nitelendirme:** Olay, tapulu bir taşınmazın resmî şekle uyulmadan satılmasına (harici satış), satıcının ölümüyle mirasçıların tescilsiz kazanmasına ve taşınmazın üçüncü kişiye satılmasına ilişkindir.

      **Hukuki sorunlar:** Harici satışın geçerliliği ve sonuçları; tescile zorlama davasının şartları; mirasçıların mülkiyeti ve tasarruf yetkisi; Levent'in kazanımı.

      **İlgili hükümler:** TMK m. 705, TMK m. 706, TMK m. 716, TMK m. 599, TMK m. 2, TBK m. 237, TBK m. 77.

      **Değerlendirme:**

      *1. Sözleşme ve tescil istemi:* Taşınmaz mülkiyetinin devrini amaçlayan sözleşme ancak resmî şekilde yapılırsa geçerlidir (TMK m. 706/1, TBK m. 237/1). Köy kahvesinde tanıklar huzurunda imzalanan senet resmî şekil değildir. Tanıkların imzası da sonucu değiştirmez. Sözleşme hüküm doğurmaz (TBK m. 12/2) ve hâkim bunu re'sen gözetir. Tescile zorlama davası, mülkiyetin kazanılmasına esas olacak **geçerli** bir hukuki sebep ister (TMK m. 716/1). Bu nedenle Kemal tescil isteyemez. 1988 tarihli İBK'nin TMK m. 2'ye dayanan istisnası, kat mülkiyetine tabi olarak yapımına başlanan binadan bağımsız bölüm satışına ilişkindir. Fındık bahçesi bu kapsamda değildir. Kemal'in yedi yıllık zilyetliği de sonucu değiştirmez. Taşınmaz tapuda Hasan adına kayıtlı ve maliki belli olduğundan, ayrı konuda göreceğimiz olağanüstü kazandırıcı zamanaşımı da Kemal'e yol açmaz (TMK m. 713).

      *2. İade istemi:* Kemal'in ödediği 500.000 TL geçerli olmayan bir sebebe dayanmaktadır. Kemal bunu sebepsiz zenginleşme hükümlerine göre geri ister (TBK m. 77). Hasan'ın borcu ölümüyle mirasçılarına geçmiştir; mirasçılar mirasbırakanın borçlarından kişisel olarak sorumludur (TMK m. 599/2). Yargıtay'ın yerleşik uygulamasına göre Kemal bahçenin bugünkü değerini isteyemez, ödediği bedeli ister. Ama bu bedel, denkleştirici adalet ilkesiyle 2018'den dava tarihine kadar enflasyon, altın ve döviz kurları ile ücret artışları gözetilerek güncellenir. Buna karşılık Kemal de teslim aldığı bahçeyi geri vermekle yükümlüdür.

      *3. Mirasçıların durumu:* Mirasçılar mirası mirasbırakanın ölümüyle bir bütün olarak kazanır ve ayni haklar doğrudan onlara geçer (TMK m. 599). Miras, tescilsiz kazanma hâlidir (TMK m. 705/2). Nermin ve Pınar, Mart 2025'ten beri bahçenin elbirliği malikidir. Ancak aynı hükme göre tescilsiz kazanan malik, mülkiyet tapuya tescil edilmedikçe tasarruf işlemi yapamaz. Satış bir tasarruf işlemidir. Tapu memuru da tasarruf yetkisini sicilde hak sahibi görünmeye bakarak belirler (TMK m. 1015/2). Bu yüzden müdürlük önce intikal istemiştir. Mirasçılar mirasçılık belgesiyle tescili doğrudan yaptırabilir (TMK m. 716/2).

      *4. Levent'in durumu:* İntikalden sonra mirasçılar gerçek malik olarak resmî senetle satış yaparsa Levent tescille malik olur (TMK m. 705/1). Kemal'in elinde geçerli bir sözleşme, dolayısıyla Levent'e karşı ileri sürülebilecek bir kişisel hak bile yoktur. Levent'in Kemal'le yapılan senetten haberdar olması da bu sonucu değiştirmez.

      **Sonuç:**
      - Harici satış geçersizdir. Kemal tescil isteyemez.
      - Kemal, ödediği bedelin denkleştirici adaletle güncellenmiş tutarını mirasçılardan isteyebilir, bahçeyi de iade eder.
      - Nermin ve Pınar ölümle maliktir, ama satış için önce intikal yaptırmalıdır.
      - Levent tescille malik olur ve Kemal'in ona karşı bir hakkı yoktur.

  - olay: |
      Ayşe, İzmir Karşıyaka'daki dairesini 10.03.2015 tarihinde noterde düzenleme şeklinde yapılan bir satış vaadi sözleşmesiyle Ali'ye 1.200.000 TL'ye satmayı vaat eder. Sözleşmeye göre Ali 900.000 TL'yi peşin öder; kalan 300.000 TL tapuda devir sırasında ödenecektir. Daire aynı gün Ali'ye teslim edilir ve Ali o tarihten beri ailesiyle dairede oturmaktadır. Sözleşme tapuya şerh edilmemiştir.

      Ali, 2018'de daireye kendi parasıyla yeni bir mutfak yaptırmış; site aidatlarını da 2015'ten beri kendisi ödemektedir. Ali bugüne kadar dava açmamış, Ayşe'ye yazılı bir ihtar da göndermemiştir. Daire fiyatları yükselince Ayşe, Şubat 2026'da tapuya gelmeyeceğini bildirir ve "Aradan on yıldan fazla geçti, borcum zamanaşımına uğradı" der. Ali, Ayşe'nin daireyi kardeşi Burak'a satmak için tapudan randevu aldığını öğrenir. Ali İstanbul'da, Ayşe Ankara'da oturmaktadır.

      1. Ali hangi davayı, kime karşı ve hangi yer mahkemesinde açmalıdır? Bu davanın dayandığı hak nedir?
      2. Ayşe'nin zamanaşımı def'i dinlenir mi?
      3. Ödenmemiş 300.000 TL tescil istemini nasıl etkiler?
      4. Ali, dava sürerken dairenin Burak'a devrini önlemek için ne yapabilir? Daire dava açılmadan önce Burak'a satılıp tescil edilmiş olsaydı Ali'nin durumu ne olurdu?
    olcut:
      - {tespit: "Noterde düzenleme şeklindeki satış vaadinin geçerli olması ve Ali'ye kişisel hak doğurması", puan: 15, madde: "TBK m. 237"}
      - {tespit: "Ayşe'ye karşı tescile zorlama davası; dairenin bulunduğu İzmir'deki mahkemenin kesin yetkisi", puan: 20, madde: "TMK m. 716"}
      - {tespit: "On yıllık zamanaşımına rağmen daire teslim edildiği için def'in dürüstlük kuralıyla bağdaşmaması", puan: 20, madde: "TMK m. 2"}
      - {tespit: "Kalan bedelin depo ettirilerek tescile karar verilmesi", puan: 15, madde: "TBK m. 97"}
      - {tespit: "İhtiyati tedbir ve tasarruf yetkisi kısıtlamasının tapuya şerhi", puan: 10, madde: "TMK m. 1010"}
      - {tespit: "Şerh yokken gerçek satışla alan Burak'a karşı tescil istenememesi ve Ayşe'den tazminat; devir muvazaalıysa Burak'a karşı da ileri sürülebilmesi", puan: 20, madde: "TMK m. 1009"}
    cozum: |
      **Nitelendirme:** Taraflar arasında noterde düzenlenmiş bir taşınmaz satış vaadi vardır. Vaat eden Ayşe devirden kaçınmaktadır. Ali'nin istemi tescile zorlama davasıyla ileri sürülür.

      **Hukuki sorunlar:** Sözleşmenin geçerliliği ve Ali'nin hakkının niteliği; davanın tarafları ve yetkili mahkeme; zamanaşımı; bakiye bedel; üçüncü kişiye devir riski.

      **İlgili hükümler:** TBK m. 237/2, TBK m. 29/2, TMK m. 716/1, HMK m. 12/1, TBK m. 146, TMK m. 2, TBK m. 97, TMK m. 1009, TMK m. 1010, TBK m. 112.

      **Değerlendirme:**

      *1. Dava, taraflar ve yetki:* Taşınmaz satışı vaadi resmî şekilde düzenlenmedikçe geçerli olmaz (TBK m. 237/2). Sözleşme noterde düzenleme şeklinde yapıldığı için geçerlidir. Satış vaadi mülkiyeti geçirmez. Ali'ye yalnız Ayşe'den devri isteme konusunda **kişisel bir hak** verir. Malik kaçındığı için Ali, TMK m. 716/1'e göre mülkiyetin hükmen geçirilmesini dava eder. Davalı, kayıt maliki ve vaat borçlusu olan Ayşe'dir. Dava, ayni hak sahipliğinde değişikliğe yol açabileceği için dairenin bulunduğu yer olan **İzmir (Karşıyaka)** mahkemesinde açılmalıdır; bu yetki kesindir (HMK m. 12/1). Tarafların İstanbul ve Ankara'da oturması bunu değiştirmez.

      *2. Zamanaşımı:* Dava kişisel hakka dayandığı için on yıllık zamanaşımına tabidir (TBK m. 146). Süre, borcun muaccel olduğu 10.03.2015'te başlamış ve 2025'te dolmuştur (TBK m. 149/1). Ancak daire sözleşme günü Ali'ye teslim edilmiş ve Ali o tarihten beri dairede oturmaktadır. Yargıtay'ın yerleşik uygulamasına göre taşınmaz vaat alacaklısına teslim edilmişse vaat borçlusunun zamanaşımı def'i dürüstlük kuralıyla bağdaşmaz (TMK m. 2). Ayşe'nin def'i dinlenmez.

      *3. Bakiye bedel:* Satış vaadi karşılıklı borç doğurur. İfa isteyen, kendi borcunu ifa etmiş ya da ifasını önermiş olmalıdır (TBK m. 97). Ali'nin 300.000 TL'yi ödemesi devir anına bağlanmıştır. Mahkeme bu tutarın depo edilmesini sağlayarak ve hak sahibine ödenmesine karar vererek tescile hükmeder. Ali'nin bedeli depo etmemesi, tescil isteminin reddine yol açabilir.

      *4. Burak'a devir:* Sözleşme şerh edilmediği için Ali'nin hakkı yalnız Ayşe'ye karşı ileri sürülebilir. Ali dava açarken **ihtiyati tedbir** istemeli ve tedbir kararını tapuya şerh ettirmelidir. Çekişmeli hakların korunmasına ilişkin mahkeme kararlarına dayanan tasarruf yetkisi kısıtlamaları şerh edilebilir ve şerhten sonra hak kazananlara karşı ileri sürülebilir (TMK m. 1010). Böylece daire şerhten sonra Burak'a devredilse bile Ali, dava sonunda alacağı hükmü Burak'a karşı da ileri sürebilir.

      Daire dava açılmadan Burak'a satılıp tescil edilmiş olsaydı iki ihtimal vardır:
      - Burak daireyi **gerçek bir satışla** almışsa malik olur. Şerh edilmemiş kişisel hak, taşınmazda sonradan ayni hak kazanan kişiye karşı ileri sürülemez; şerh bu yüzden önemlidir (TMK m. 1009/2). Ali, Ayşe'den borca aykırılık nedeniyle tazminat ister (TBK m. 112).
      - Satış **muvazaalıysa**, yani Ayşe ile Burak gerçekte satış yapmayıp daireyi Ali'den kaçırmak için anlaşmışlarsa, Yargıtay'a göre Ali kişisel hakkını Burak'a karşı da ileri sürebilir ve muvazaayı ispatlayarak tapu iptali ve tescil isteyebilir. Kardeşler arasındaki devir bu yönden araştırılmalıdır.

      **Sonuç:**
      - Ali, Ayşe'ye karşı İzmir'de tescile zorlama davası açmalıdır. Dayanağı satış vaadinden doğan kişisel haktır.
      - Daire teslim edildiği için zamanaşımı def'i dinlenmez.
      - Kalan 300.000 TL depo ettirilerek tescile karar verilir.
      - Ali tedbir şerhiyle devri önlemelidir. Şerhsiz bir dönemde gerçek satış olmuşsa Ali yalnız tazminat isteyebilir; muvazaa varsa Burak'a karşı da dava açabilir.

  - olay: |
      Murat'ın üç taşınmazı ve ortağı olduğu bir şirket vardır.

      (A) Bursa'daki dükkân: Murat'ın borcu nedeniyle haczedilmiş ve 05.05.2026'da icra dairesinin ihalesinde Selin'e ihale edilmiştir. Selin bedeli ödemiştir. İhaleden iki gün sonra, ihalenin feshi için şikâyet süresi dolmadan Selin dükkânı bankaya ipotek ettirip kredi almak ister.

      (B) Mudanya'daki kıyı parseli: Yıllar içinde deniz kıyıyı aşındırmış ve parselin tamamı kalıcı olarak deniz altında kalmıştır.

      (C) Kırsaldaki zeytinlik: Murat, bakımı zor olduğu için mülkiyetten vazgeçtiğini tapu müdürlüğüne yazılı olarak bildirmiş ve kaydın terkinini istemiştir. Kayıt terkin edilmiştir.

      (D) Murat'ın ortağı olduğu X Ltd. Şti., Y A.Ş. ile birleşmiş ve birleşme ticaret siciline tescil edilmiştir. X'e ait bir depo tapuda hâlâ X adına görünmektedir. Y A.Ş. depoyu satmak istemektedir.

      1. Selin dükkânın maliki midir, hangi andan beri? Bankaya ipotek verebilir mi? İhale sonradan feshedilirse ne olur?
      2. Kıyı parseli ve zeytinlik bakımından Murat'ın mülkiyeti devam ediyor mu?
      3. Y A.Ş. depoyu satabilir mi? Bunun için ne yapmalıdır?
    olcut:
      - {tespit: "Selin'in mülkiyeti ihale ile, tescilden önce kazanması", puan: 20, madde: "İİK m. 134"}
      - {tespit: "İpotek için önce Selin adına tescil gereği; tescil bildiriminin şikâyet süresinden sonra yapılması", puan: 15, madde: "TMK m. 705"}
      - {tespit: "İhalenin feshi hâlinde Selin'in kazanımının dayanaksız kalması", puan: 10, madde: "İİK m. 134"}
      - {tespit: "Kıyı parselinin tamamen yok olmasıyla mülkiyetin sona ermesi", puan: 15, madde: "TMK m. 717"}
      - {tespit: "Zeytinlikte malikin yazılı istemiyle yapılan terkinle mülkiyetin sona ermesi", puan: 15, madde: "TMK m. 717"}
      - {tespit: "Birleşmeyle deponun tescilsiz olarak Y A.Ş.'ye geçmesi ve satıştan önce adına tescil yaptırması gereği", puan: 25, madde: "TTK m. 153"}
    cozum: |
      **Nitelendirme:** Olay, tescilsiz kazanma hâllerini (cebrî icra ve şirket birleşmesi), tescilsiz malikin tasarruf sınırını ve taşınmaz mülkiyetinin sona ermesini (terkin ve tamamen yok olma) bir arada sorar.

      **Hukuki sorunlar:** İhalede mülkiyetin geçiş anı ve tasarruf yetkisi; ihalenin feshinin etkisi; mülkiyetin kaybı; birleşmede taşınmazların geçişi.

      **İlgili hükümler:** TMK m. 705, TMK m. 717, TMK m. 1013, TMK m. 1014, TMK m. 1015, İİK m. 134, TTK m. 153.

      **Değerlendirme:**

      *1. Dükkân:* İcra dairesince taşınmaz kendisine ihale edilen alıcı, o taşınmazın mülkiyetini kazanmış olur (İİK m. 134/1). Cebrî icra, TMK m. 705/2'de sayılan tescilsiz kazanma hâllerindendir. Selin 05.05.2026'da, ihale ile maliktir. Ancak tescilsiz kazanan malik, mülkiyet tapuya tescil edilmedikçe tasarruf işlemi yapamaz (TMK m. 705/2). İpotek kurmak bir tasarruf işlemidir. Tapuya tescil için yapılacak bildirim de ihalenin feshi için şikâyet süresi geçtikten ya da şikâyeti sonuçlandıran karar kesinleştikten sonra gönderilir (İİK m. 134). Bu yüzden Selin, ihaleden iki gün sonra ipotek veremez. Önce bu aşamaların tamamlanması ve dükkânın onun adına tescil edilmesi gerekir. İhale şikâyet üzerine feshedilirse Selin'in kazanımının dayanağı ortadan kalkar ve dükkân Murat'ın mülkiyetinde kalmış olur. Ödediği bedel Selin'e iade edilir.

      *2. Kıyı parseli ve zeytinlik:* Taşınmaz mülkiyeti terkin ya da taşınmazın tamamen yok olmasıyla sona erer (TMK m. 717/1).
      - Kıyı parselinin tamamı kalıcı olarak deniz altında kalmıştır. Taşınmaz tamamen yok olduğundan Murat'ın mülkiyeti sona ermiştir. Parselin yalnız bir kısmı kaybolsaydı mülkiyet kalan kısımda sürerdi.
      - Zeytinlikte Murat, kaydın kendisine hak sağladığı kişi olarak yazılı beyanla terkin istemiştir (TMK m. 1014). Terkin geçerli bir istem üzerine yapıldığından Murat'ın mülkiyeti sona ermiştir. Kaydı malikin istemiyle terkin edilen taşınmaz işgalle kazanılabilir (TMK m. 707/1); bunun ayrıntısı ayrı konuda.

      *3. Depo:* Birleşmenin ticaret siciline tescili anında devrolunan şirketin bütün aktif ve pasifi kendiliğinden devralan şirkete geçer (TTK m. 153/1). Bu, TMK m. 705/2'deki "kanunda öngörülen diğer hâllerden" biridir. Depo, tapuda X adına görünse de birleşmenin tescil anında Y A.Ş.'nin mülkiyetine geçmiştir. Ancak Y A.Ş. tescil yaptırmadan satış gibi bir tasarruf işlemi yapamaz (TMK m. 705/2). Tapu memuru tasarruf yetkisini sicilde hak sahibi görünmeye göre belirler (TMK m. 1015/2). Y A.Ş., birleşmenin tescilini gösteren belgelerle tapuya başvurup depoyu doğrudan kendi adına tescil ettirmeli (TMK m. 1013/3), sonra satmalıdır.

      **Sonuç:**
      - Selin ihale ile maliktir, ama tescilden önce ipotek veremez. İhale feshedilirse kazanımı ortadan kalkar.
      - Kıyı parselinde tamamen yok olma, zeytinlikte terkin nedeniyle Murat'ın mülkiyeti sona ermiştir.
      - Y A.Ş. deponun tescilsiz malikidir. Satmadan önce depoyu kendi adına tescil ettirmelidir.

kartlar:
  - on: "Taşınmaz mülkiyeti kural olarak ne zaman geçer?"
    arka: "Tapu kütüğüne tescille (TMK m. 705/1). Tescilin etkisi yevmiye defterine kayıt tarihinden başlar (TMK m. 1022/2)."
  - on: "Taşınmaz mülkiyetinin konusu nedir? (TMK m. 704)"
    arka: "Arazi, tapu kütüğünde ayrı sayfaya kaydedilen bağımsız ve sürekli haklar ve kat mülkiyeti kütüğüne kayıtlı bağımsız bölümler."
  - on: "Bağımsız ve sürekli hakta süreklilik şartı nedir?"
    arka: "Hakkın süresiz ya da en az otuz yıllık olması (TMK m. 998/3)."
  - on: "Tescilsiz kazanma hâlleri nelerdir?"
    arka: "Miras, mahkeme kararı, cebrî icra, işgal, kamulaştırma ve kanunda öngörülen diğer hâller (TMK m. 705/2)."
  - on: "Tescilsiz kazanan malik neyi yapamaz?"
    arka: "Mülkiyet adına tescil edilmedikçe satış, ipotek gibi tasarruf işlemlerini (TMK m. 705/2)."
  - on: "Önalım sözleşmesinin şekli nedir?"
    arka: "Yazılı şekil. Satış vaadi, alım ve geri alım ise resmî şekle tabidir (TBK m. 237)."
  - on: "Taşınmaz bağışlama sözünün şekli nedir? Şekle aykırı söz ifa edilirse geçerli olur mu?"
    arka: "Resmî şekil (TBK m. 288/2). Geçerliliği resmî şekle bağlı bağışlamalarda ifa, sözü elden bağışlamaya dönüştürmez (TBK m. 288/3)."
  - on: "Satış vaadi hangi şekilde yapılır?"
    arka: "Noterde düzenleme şeklinde (TBK m. 237/2, 1512 sayılı Kanun m. 89). İmza onayı yetmez."
  - on: "Noterde taşınmaz satışı yapılabilir mi?"
    arka: "Evet, 2022'de eklenen hükme göre (1512 sayılı Kanun m. 61/A). Noter sözleşmeyi yapar, tescili tapu müdürlüğü sağlar; mülkiyet tescille geçer."
  - on: "Harici satışın sonucu nedir?"
    arka: "Kesin hükümsüzdür. Tescil istenemez, herkes verdiğini sebepsiz zenginleşme hükümlerine göre geri ister (TBK m. 12/2, TBK m. 77)."
  - on: "Harici satışta ödenen bedel nasıl iade edilir?"
    arka: "Yargıtay'a göre denkleştirici adalet ilkesiyle, ödeme tarihinden dava tarihine kadar güncellenerek. Taşınmazın bugünkü değeri istenemez."
  - on: "1988 tarihli İBK'nin harici satış istisnasının şartları nelerdir?"
    arka: "Kat mülkiyetine tabi inşaattan bağımsız bölüm, alıcının bütün borçlarını ödemesi, teslim ve malik gibi kullanma, satıcının devre yanaşmaması. Hâkim TMK m. 2'yi gözetir."
  - on: "Ön ödemeli konut satışında şekle aykırılığı kim ileri süremez?"
    arka: "Satıcı, tüketicinin aleyhine olacak şekilde (6502 sayılı Kanun m. 41/1)."
  - on: "Tescile zorlama davasının dayanağı ve davalısı kimdir?"
    arka: "Dayanak, tescil isteme konusundaki kişisel haktır. Davalı borçlu kayıt malikidir, ölmüşse mirasçılarıdır (TMK m. 716/1)."
  - on: "Tescile zorlama davası hangi zamanaşımına tabidir?"
    arka: "On yıl (TBK m. 146). Taşınmaz vaat alacaklısına teslim edilmişse Yargıtay zamanaşımı def'ini dürüstlüğe aykırı sayar (TMK m. 2)."
  - on: "Satış vaadinde bedelin bir kısmı ödenmemişse tescil istenebilir mi?"
    arka: "Evet; ödenmeyen bedel depo ettirilerek tescile karar verilir (TBK m. 97)."
  - on: "Tescile zorlama davasında yetkili mahkeme hangisidir?"
    arka: "Taşınmazın bulunduğu yer mahkemesi; yetki kesindir (HMK m. 12/1)."
  - on: "Şerh edilmemiş satış vaadi, taşınmazı gerçek satışla alan üçüncü kişiye karşı ileri sürülebilir mi?"
    arka: "Kural olarak hayır. Vaat alacaklısı vaat edenden tazminat ister (TBK m. 112). Devir muvazaalıysa üçüncü kişiye karşı da ileri sürülebilir."
  - on: "Cebrî icrada alıcı mülkiyeti ne zaman kazanır?"
    arka: "İhale ile (İİK m. 134/1). Tescil bildirimi ise şikâyet süresi geçince ya da şikâyet kararı kesinleşince yapılır."
  - on: "Mirasçılar taşınmazın mülkiyetini ne zaman kazanır?"
    arka: "Mirasbırakanın ölümüyle (TMK m. 599). Satış için önce intikal, yani kendi adlarına tescil gerekir (TMK m. 705/2)."
  - on: "Şirket birleşmesinde devrolunan şirketin taşınmazları ne zaman geçer?"
    arka: "Birleşmenin ticaret siciline tescili anında, kendiliğinden (TTK m. 153/1). Tapuda tescil açıklayıcıdır."
  - on: "Taşınmaz mülkiyeti nasıl sona erer? (TMK m. 717)"
    arka: "Terkin ya da taşınmazın tamamen yok olmasıyla. Kamulaştırmada sona erme anını özel kanun belirler."
  - on: "Yolsuz terkin mülkiyeti sona erdirir mi?"
    arka: "Hayır. Zarar gören sicilin düzeltilmesini dava eder (TMK m. 1025)."
