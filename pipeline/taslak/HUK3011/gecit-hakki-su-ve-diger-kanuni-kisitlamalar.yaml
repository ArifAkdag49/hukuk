ozet: |
  **Bu konu neyi cevaplıyor?** Komşu malikler birbirinin taşınmazına kazı, yapı, dal ve kök, su, boru-kablo ve yol yoluyla "dokunduğunda" kanun hangi şartlarla katlanma yükümlülüğü yükler, hangi bedeli öngörür, hak nasıl kurulur?

  - **Ortak çerçeve:** Taşınmaz mülkiyetinin kanundan doğan kısıtlamaları tescil edilmeksizin etkili olur; kamu yararı için konulanlar kaldırılamaz ve değiştirilemez (TMK m. 731/1 ve TMK m. 731/3).
  - **Kazı ve yapı (TMK m. 738 ve TMK m. 739):** Komşunun toprağını sarsmak, tehlikeye düşürmek ya da tesislerini etkilemek suretiyle zarar vermekten kaçınılır. Komşuluk hukukuna aykırı yapılara taşkın yapı hükümleri uygulanır. Ayrıntılı kurallar özel kanunlara bırakılmıştır.
  - **Bitkiler (TMK m. 740 ve TMK m. 741):** Zarar veren dal ve kök için önce **istem**, sonra **uygun süre**; süre geçerse komşu keser ve kendi mülkiyetine geçirir. Taşmaya katlanan komşu meyveleri toplar. Komşu ormanlar istisnadır.
  - **Su (TMK m. 742 ve TMK m. 743):** Üstteki arazinin doğal suyuna katlanılır; akış komşunun zararına değiştirilemez; üstteki malik suyu yalnız kendi taşınmazı için zorunlu ölçüde tutabilir. Öteden beri alta akan arazide boşaltılan fazla suya tazminatsız katlanılır, ama zarar varsa gideri üsttekine ait mecra istenebilir.
  - **Mecra (TMK m. 744, TMK m. 745 ve TMK m. 746):** Başka yerden geçirilmesi olanaksız ya da aşırı masraflıysa ve zararın **tamamı önceden ödenirse** katlanılır. Kamulaştırmaya bağlı mecrada komşuluk hükümleri uygulanmaz. Mecra hakkı istem üzerine tescil edilir. Olağanüstü durumda satın alma isteği yükümlü malike, nakil gideri kural olarak mecra hakkı sahibine aittir.
  - **Zorunlu geçit (TMK m. 747):** Genel yola yeterli geçidi olmayan malik **tam bedelle** geçit ister; istem önce önceki mülkiyet ve yol durumuna göre en uygun komşuya, sonra en az zarar görecek olana yöneltilir. Yargıtay bedelin hükümden önce depo edilmesini ve yüklü taşınmazı bölmeyen güzergâhı arar.
  - **Diğer geçitler (TMK m. 748):** Geçici girme, tarla yolu, kış geçidi gibi geçitler özel kanuna, yoksa yerel âdete tâbidir. Doğrudan kanundan doğan geçitler tescilsiz doğar; sürekli olanlar beyanlar sütununda gösterilir.
  - **İyileştirme (TMK m. 755):** Arazinin yarısından fazlasına sahip maliklerin üçte ikisinin kararı diğerlerini bağlar.
  - **Kaynaklar (TMK m. 756 - TMK m. 761):** Kaynak arazinin bütünleyici parçasıdır; başkasının arazisindeki kaynakta hak tescille kurulan irtifaktır; yeraltı suları kamu yararınadır. Kaynağı kesen ya da kirleten zararı giderir (TMK m. 757); içme-kullanma suyu kaynaklarında eski duruma getirme istenebilir (TMK m. 758). Aynı ana kaynaktan beslenenler yararlanma oranında paylaşır (TMK m. 759). Susuz kalan malik, tam bedelle **zorunlu su irtifakı** isteyebilir (TMK m. 761).
  - 📌 **Yeni:** 1/9/2023'ten sonra açılan zorunlu geçit davasında önceden arabulucuya başvurmak dava şartıdır (HUAK m. 18/B/1-ç); dava açıldıktan sonra başvuru eksikliği gidermez. 7531 sayılı Kanunla 2024'te HUAK m. 18/B'ye eklenen fıkra, icra edilebilirlik şerhli anlaşma belgesiyle resmî senet düzenlenmeden tescil istenmesine imkân verir.

anlatim: |
  ## 0. Konunun haritası

  Önceki konularda komşuluk hukukunun genel ilkesini gördük (taşkınlık yasağı, TMK m. 737; malikin sorumluluğu, TMK m. 730). Burada **somut müdahale tiplerini** tek tek inceliyoruz. Her biri için sorular aynıdır: Komşu bunu hangi şartlarla hoş görmek zorundadır, karşılığında ne alır, hak tapuya nasıl yansır?

  | Başlık | Madde | Özü |
  |---|---|---|
  | Kazı ve yapı | TMK m. 738-739 | Komşuya zarar verme yasağı |
  | Bitkiler | TMK m. 740-741 | Dal ve kök: istem, süre, kesme |
  | Su akışı | TMK m. 742-743 | Doğal akışa katlanma |
  | Mecra | TMK m. 744-746 | Boru ve kablo geçişi, zarar önceden ödenir |
  | Geçit | TMK m. 747-748 | Yeterli geçit yoksa tam bedelle geçit |
  | Kaynaklar | TMK m. 756-761 | Kaynak, yeraltı suyu, zorunlu su |

  **Ortak mantık.** Taşınmaz mülkiyetinin kanundan doğan kısıtlamaları tapu siciline tescil edilmeksizin etkili olur (TMK m. 731/1). Kamu yararı için konulan kısıtlamalar kaldırılamaz ve değiştirilemez (TMK m. 731/3). Bu, "her komşuluk talebi tescilsiz hak doğurur" demek değildir: mecra hakkı istem üzerine tescil edilir (TMK m. 744/3), başkasının arazisindeki kaynakta hak tescille kurulur (TMK m. 756/2).

  > ⚠️ **Sınavda dikkat:** Geçit, mecra ve zorunlu su üçü de "komşudan bir şeye katlanmasını isteme" gibi görünür, ama konuları ve bedel ifadeleri farklıdır. **Geçit** yol içindir ve "tam bir bedel" öder (TMK m. 747/1). **Mecra** boru, kanal, hat ve kablo içindir; zararın tamamı **önceden** ödenir (TMK m. 744/1). **Zorunlu su**, komşunun ihtiyaç fazlası suyunu almak için kurulan irtifaktır ve yine tam bedelle olur (TMK m. 761/1).

  ## 1. Kazı ve yapılar (TMK m. 738 ve TMK m. 739)

  TMK m. 738/1'e göre malik, kazı ve yapı yaparken komşu taşınmazlara, **topraklarını sarsmak veya tehlikeye düşürmek ya da üzerlerindeki tesisleri etkilemek** suretiyle zarar vermekten kaçınmak zorundadır. Hükümde üç ayrı davranış vardır:
  1. Komşunun toprağını sarsmak,
  2. Komşunun toprağını tehlikeye düşürmek,
  3. Komşunun taşınmazındaki tesisleri etkilemek.

  > **Örnek:** Mehmet derin bir temel kazısı açar; komşusu Ali'nin bahçesindeki istinat duvarı çatlar ve toprak kaymaya başlar. Mehmet, komşunun toprağını tehlikeye düşürdüğü ve tesisini etkilediği için TMK m. 738/1'i ihlal etmiştir. Dava yolu malikin sorumluluğuna ilişkin TMK m. 730'dur (ayrıntısı başka konuda).

  TMK m. 738/2, komşuluk hukuku kurallarına aykırı yapılar hakkında **taşkın yapılara ilişkin hükümlerin** uygulanacağını söyler (TMK m. 725; ayrıntısı taşkın yapı konusunda). Yani komşu araziye taşan yapı, kendi hukuki rejimine bağlanır.

  TMK m. 739 ise kazı ve yapılarda uyulacak kuralların **özel kanunlarla** belirleneceğini bildirir. Medeni Kanun yalnız genel yasağı koyar; "ayrıntılı kurallar özel kanunlara bırakılmıştır (TMK m. 739)" demek sınavda yeterlidir. Bitkilerde de kurgu aynıdır: kural TMK m. 740'ta, ayrıntı TMK m. 741 yoluyla özel kanunlardadır.

  ## 2. Bitkiler (TMK m. 740 ve TMK m. 741)

  ### 2.1 Taşan dal ve kökler
  TMK m. 740/1: Komşunun arazisine **taşarak zarar veren** dal ve kökler, komşunun istemi üzerine **uygun bir süre içinde kaldırılmazsa**, komşu bu dal ve kökleri kesip **kendi mülkiyetine geçirebilir**. Üç şart vardır:
  1. Dal veya kök komşu arazisine taşmış ve **zarar vermelidir** (zarar vermeyen taşma için bu hak doğmaz).
  2. Komşu, bitki malikinden **kaldırmasını istemelidir**.
  3. Bitki maliki, **uygun bir süre** içinde kaldırmamış olmalıdır. Kanun süreyi gün olarak göstermez; olayın şartlarına göre belirlenir.

  Bu şartlar gerçekleşince komşunun **kesme hakkı** doğar; kesilen dal ve kökler onun mülkiyetine geçer. Kesme haktır, yükümlülük değil.

  > **Örnek:** Zeynep'in ceviz ağacının dalları komşusu Mehmet'in sera camlarına değip zarar vermektedir. Mehmet, Zeynep'e "dalları ay sonuna kadar kaldır" diye yazılı bildirimde bulunur. Süre dolar, Zeynep kaldırmaz; Mehmet dalları keser ve dallar onun mülkiyetine geçer. Bildirimde bulunmadan kesseydi TMK m. 740/1'in şartları gerçekleşmemiş olurdu.

  > ⚠️ **Sınavda dikkat:** "Zarar veriyorsa hemen keser" cevabı yanlıştır. Sıra şöyledir: **zarar → istem → uygun süre → kesme ve mülkiyete geçirme.**

  ### 2.2 Meyveler
  TMK m. 740/2: **Ekilmiş veya üzerine yapı yapılmış** arazisine dalların taşmasına **katlanan** komşu, bu dallarda yetişen meyveleri toplama hakkına sahip olur. Kanun hakkı "katlanan komşuya" verir; yani komşu dalları kestirmek yerine hoş görürse, meyveden yararlanır.

  > **Örnek:** Aynı olayda Mehmet'in bahçesi ekilidir. Mehmet dalların taşmasına katlanmaya karar verirse, taşan dallardaki cevizleri toplayabilir.

  ### 2.3 Orman istisnası ve özel kanunlar
  TMK m. 740/3'e göre bu hükümler **komşu ormanlar hakkında uygulanmaz.** Bitki dikerken uyulacak kurallar ise özel kanunlara bırakılmıştır (TMK m. 741).

  ## 3. Su: doğal akış ve fazla su (TMK m. 742 ve TMK m. 743)

  ### 3.1 Doğal olarak akan su (TMK m. 742)
  TMK m. 742'nin üç kuralı vardır:
  1. **Katlanma:** Malik, üst taraftaki araziden kendi arazisine **doğal olarak** akan suların (özellikle yağmur, kar ve tutulmamış kaynak sularının) akışına katlanmak zorundadır (m. 742/1).
  2. **Değiştirme yasağı:** Komşulardan hiçbiri bu suların akışını diğerinin zararına değiştiremez (m. 742/2). Yasak üst malik kadar alt malik için de geçerlidir.
  3. **Tutma sınırı:** Üstteki malik, alttaki taşınmaza gerekli olan suyu ancak **kendi taşınmazı için zorunlu olduğu ölçüde** tutabilir (m. 742/3).

  > **Örnek:** Kemal, üstteki parselinde yaptığı setle yağmur sularını tamamen tutar; alttaki Selim'in bahçesi susuz kalır. Kemal, suyu yalnız kendi parseli için zorunlu ölçüde tutabilirdi (TMK m. 742/3). Selim de yağmur sularının akışını kendi arazisinde değiştirip Kemal'in zararına yönlendiremez (TMK m. 742/2).

  ### 3.2 Fazla suyun akıtılması (TMK m. 743)
  Bir arazinin suyu **öteden beri** alt taraftaki araziye doğal şekilde akmaktaysa, alttaki malik üst taraftan **fazla suyun boşaltılması** sırasında da bu suları **tazminat isteme hakkı olmaksızın** kabul etmek zorundadır (m. 743/1). Buna karşılık boşaltmadan zarar görüyorsa, **gideri üstteki arazi malikine ait olmak üzere**, kendi arazisinde yapılacak mecrayla suyun akıtılmasını isteyebilir (m. 743/2). Bataklıkların kurutulmasına ilişkin özel kanun hükümleri saklıdır (m. 743/3).

  > **Örnek:** Zeynep göletini boşaltır; su, öteden beri doğal olarak Mehmet'in arazisine akmaktadır. Mehmet fidelerinin zarar görmesi için tazminat isteyemez (TMK m. 743/1). Ancak gideri Zeynep'e ait olmak üzere kendi arazisinde suyu akıtacak bir mecra yapılmasını isteyebilir (TMK m. 743/2).

  > ⚠️ **Sınavda dikkat:** TMK m. 742 doğal akışı, TMK m. 743 malikin boşalttığı fazla suyu düzenler. "Tazminatsız katlanma" zararı yok saymaz: alttaki malik **mecra isteyebilir**, gideri üsttekine aittir.

  ## 4. Mecra geçirilmesi (TMK m. 744, TMK m. 745 ve TMK m. 746)

  **Mecra**, su yolu, kurutma kanalı, gaz ve benzeri boru hatları ile elektrik hat ve kablolarının geçtiği tesistir.

  ### 4.1 Katlanma yükümlülüğü (TMK m. 744)
  Her taşınmaz maliki, **uğrayacağı zararın tamamının önceden ödenmesi koşuluyla**, bu tesislerin kendi arazisinin altından veya üstünden geçirilmesine katlanır; ancak mecranın **başka yerden geçirilmesi olanaksız veya aşırı ölçüde masraflı** olmalıdır (m. 744/1). Şartlar:
  1. Mecra türü: su yolu, kanal, boru, hat veya kablo,
  2. Başka yerden geçirmenin olanaksızlığı veya aşırı masrafı,
  3. Zararın **tamamının** önceden ödenmesi.

  İki ayrıntı sık sorulur:
  - Mecra geçirilmesi **kamulaştırma kurallarına bağlıysa** TMK'nın mecralara ilişkin komşuluk hükümleri uygulanmaz (m. 744/2). Yargıtay Hukuk Genel Kurulu, kamulaştırmayla kurulan enerji hattı irtifakının terkininde de TMK m. 785 yerine kamulaştırma mevzuatını esas almıştır (kararlar bölümüne bak).
  - Mecra hakkı, **hak sahibinin istemi üzerine ve giderleri ödemesi koşuluyla** tapu kütüğüne tescil edilir (m. 744/3).

  > **Örnek:** Ahmet'in fabrikasına çekilecek kablo Selin'in arazisinden başka yerden geçirilemiyor. Selin, zararı önceden tamamen ödenirse katlanır (TMK m. 744/1). Ahmet isterse hak, giderleri kendisine ait olmak üzere tescil edilir (TMK m. 744/3).

  **TMK m. 727 ile fark.** Komşuluk hukukunun gerektirdiği hâller dışında bir taşınmazın mecra ile ayni hak olarak yüklenmesi ancak **iradi bir irtifak** kurulmasıyla olur (TMK m. 727/2-3). TMK m. 744 ise anlaşma olmasa da komşuluktan doğan **katlanma yükümlülüğünü** düzenler.

  ### 4.2 Yükümlü malikin korunması (TMK m. 745)
  Yükümlü malik, menfaatinin **hakkaniyete uygun biçimde** gözetilmesini isteyebilir (m. 745/1). Arazinin üzerinden geçecek mecralarda **olağanüstü durumlar** varsa mecranın geçeceği arazi parçasının uygun bir kısmının, zararını tam karşılayacak bedelle **satın alınmasını** isteyebilir (m. 745/2). Bu istem **yükümlü malike** aittir; mecra hakkı sahibi malikin parçasını satın almaya zorlayamaz.

  > **Örnek:** Boru hattı Selin'in arazisinde bir şeridi kullanılamaz kıldı. Selin, o parçanın uygun kısmının zararını tam karşılayacak bedelle satın alınmasını isteyebilir.

  ### 4.3 Durumun değişmesi (TMK m. 746)
  Durum değişirse yükümlü malik, mecranın **kendi yararına** başka bir yere nakledilmesini isteyebilir (m. 746/1). Yer değiştirme giderleri **kural olarak mecra hakkı sahibine** aittir (m. 746/2). Özel durumlar haklı gösterirse malik de giderlerin uygun bir kısmına katılmakla yükümlü tutulabilir (m. 746/3).

  > **Örnek:** Selin yapı yapacağı için kablonun nakledilmesini ister; giderler kural olarak Ahmet'e aittir.

  ## 5. Geçit hakları (TMK m. 747 ve TMK m. 748)

  ### 5.1 Zorunlu geçit (TMK m. 747)
  **Zorunlu geçit**, taşınmazından genel yola çıkmak için yeterli geçidi bulunmayan malikin, komşularından **tam bir bedel karşılığında** geçit hakkı tanınmasını isteyebilmesidir (m. 747/1).

  **Şartlar.**
  1. İstemde bulunan taşınmazın maliki olmalıdır.
  2. Taşınmazın genel yola çıkışı için **yeterli geçidi** bulunmamalıdır. Yargıtay iki ihtiyacı ayırır: **mutlak ihtiyaç** (hiç geçit bulunmaması) ve **nispi ihtiyaç** (var olan geçidin yetersiz kalması). Kanun "yeterli geçit" dediği için ikisi de kapsama girer. İhtiyaç objektif ölçülerle belirlenir.
  3. Karşılığında **tam bedel** ödenmelidir.

  **Kime karşı?** İstem sırayla yöneltilir (m. 747/2): önce, geçidin kendisinden istenmesi **önceki mülkiyet ve yol durumuna göre en uygun düşen komşuya**; sonra bundan **en az zarar görecek olana** karşı.

  **Güzergâh nasıl belirlenir?** Zorunlu geçit **iki tarafın menfaati gözetilerek** belirlenir (m. 747/3). Hukuk Genel Kurulu'nun benimsediği ölçüler şunlardır:
  - Seçenekler arasında davacı için en kısa ve en ucuz olan değil, **yüklü taşınmaz bakımından objektif olarak en az külfet doğuran** seçilir.
  - Yüklü taşınmazı bölen güzergâh ancak zorunluysa ve gerekçesi gösterilerek seçilir.
  - Fiilî bir yol, üçüncü kişilerin haksız işgaliyle açılmışsa tek başına yeterli değildir; taşınmazın ileride nasıl kullanılacağı da gözetilir.
  - Güzergâh genel yola kesintisiz bağlantıyı sağlamalıdır.

  **Bedel.** Kanun "tam bir bedel" der. Yargıtay uygulamasında bedel bilirkişiyle saptanır ve **hükümden önce depo ettirilir**. Bu, kanun metninde yazılı bir kural değildir; TMK m. 744/1'deki "önceden ödenmesi" ifadesi geçit hükmünde yoktur.

  **Genişlik.** Yargıtay tarım arazisinde geçit genişliğini emsaline göre 2,5-3 metre olarak uygulamıştır. Bu, **Yargıtay'ın ölçüsüdür, kanun kuralı değildir.**

  **Dava.** Görevli mahkeme **asliye hukuk mahkemesidir** (HMK m. 2); geçit davası HMK m. 4'teki sulh hukuk işleri arasında yer almaz (usul ayrıntısı bölüm 8). Yargıtay uygulamasında hükümde geçidin tapu kütüğünde özel sütuna tescili de karara bağlanır. Geçidin ne zaman doğduğu ve bu uygulamanın dayanağı tartışmalıdır (doktrin bölümüne bak).

  > **Örnek:** Ali'nin tarlası eskiden kardeşi Ayşe'yle ortaktı; paylaşmada yola bakan kısım Ayşe'ye kaldı, tarla artık dört yandan çevrili. Ali "en kısa yol Mehmet'in bahçesinden geçiyor" diyerek Mehmet'e dava açmak ister. Kanundaki sıralama gereği istem önce **önceki mülkiyet ve yol durumuna göre en uygun düşen komşuya** (burada Ayşe'ye) yöneltilir; "en kısa yol" tek başına belirleyici değildir (TMK m. 747/2-3).

  ### 5.2 Diğer geçit hakları (TMK m. 748)
  TMK m. 748/1 şu hakları **özel kanun hükümlerine** bırakır: taşınmazı işletme, iyileştirme veya yapı yapma amacıyla komşu taşınmaza **geçici olarak girme hakkı**; **tarla yolu, hayvan sulama yolu, kış geçidi, tomruk kaydırma yolu ve oluğu** ve benzeri geçitler. **Özel kanun hükmü yoksa yerel âdet uygulanır** (m. 748/2).

  TMK m. 748/3: **Doğrudan doğruya kanundan kaynaklanan geçit hakları**, tapu kütüğüne tescil edilmeksizin doğar. Ancak bunlardan **sürekli nitelikte olanlar beyanlar sütununda gösterilir** (beyanlar için TMK m. 1012).

  | | TMK m. 747 | TMK m. 748 |
  |---|---|---|
  | Konu | Genel yola çıkış | Tarla yolu, kış geçidi, geçici girme |
  | Dayanak | Kanunun kendi hükmü, tam bedel | Özel kanun, yoksa yerel âdet |
  | Kayıt | Tartışmalı (doktrin) | Sürekli olanlar beyanlar sütununda |

  > ⚠️ **Sınavda dikkat:** "Tescilsiz doğar" kuralı TMK m. 748/3'te **doğrudan kanundan doğan** geçitler için yazılıdır. Zorunlu geçidi (TMK m. 747) tek cümleyle "tescilsiz doğar" diye bağlama; bu nokta tartışmalıdır. Kuralı hükmün lafzıyla yaz, tartışmayı doktrin kısmında anlat.

  ## 6. Kaynaklar ve yeraltı suları (TMK m. 756 - TMK m. 761)

  ### 6.1 Kaynağın hukuki durumu (TMK m. 756)
  - **Kaynak**, arazinin **bütünleyici parçasıdır**; mülkiyeti ancak kaynadığı arazinin mülkiyetiyle birlikte kazanılabilir (m. 756/1). Bütünleyici parça kavramı için TMK m. 684, mülkiyetin kapsamı için TMK m. 718/2.
  - **Başkasının arazisindeki kaynak** üzerindeki hak, **irtifak** olarak tapu kütüğüne **tescille** kurulur (m. 756/2). Kaynak hakkı bağımsız nitelikte ve en az otuz yıl için kurulmuşsa taşınmaz olarak kaydedilebilir (TMK m. 837/3).
  - **Yeraltı suları** kamu yararına ait sulardandır; arza malik olmak, altındaki yeraltı sularına da malik olmak sonucunu doğurmaz (m. 756/3). 167 sayılı Kanun m. 1'e göre yeraltı suları umumi sular meyanında olup Devletin hüküm ve tasarrufu altındadır. Yararlanma biçimi ve ölçüsü özel kanunlara tâbidir.

  | | Kaynak | Yeraltı suyu |
  |---|---|---|
  | Hukuki durum | Arazinin bütünleyici parçası | Kamu yararına ait su |
  | Mülkiyet | Arazi malikinde | Arza malik olmakla kazanılmaz |

  Yargıtay ayrıca yalnız o taşınmazın ihtiyacına yeten **özel su** ile sınırı aşan, ihtiyaç fazlası ya da tapusuz yerden çıkan **genel su** ayrımını yapar; bu ölçüt kanunda yazılı değildir. TMK m. 715/2'ye göre yararı kamuya ait sular ile tarıma elverişli olmayan yerler ve bunlardan çıkan kaynaklar, aksi ispatlanmadıkça, özel mülkiyete konu olamaz.

  ### 6.2 Kaynaklara zarar (TMK m. 757 ve TMK m. 758)
  **Tazminat (TMK m. 757/1).** Önemli ölçüde yararlanılan veya yararlanmak amacıyla suyu biriktirilen kaynakları ya da kuyuları kazı, yapı veya benzeri faaliyetler yüzünden **kısmen olsun keserek ya da kirleterek** malikine veya hak sahibine zarar veren, zararı gidermekle yükümlüdür. Zarar **kasten veya ihmal yoluyla verilmemişse** ya da zarar görenin de kusuru varsa hâkim, tazminatın gerekip gerekmediğini, gerekiyorsa miktar ve türünü **takdir eder** (m. 757/2).

  **Eski duruma getirme (TMK m. 758).** Bir taşınmazda **oturmak, onu işletmek veya bir yerin içme ya da kullanma suyunu sağlamak** için gerekli kaynaklar kesilir ve kirletilirse, kaynağın olabildiği ölçüde eski duruma getirilmesi istenebilir (m. 758/1). Diğer hâllerde eski duruma getirme ancak **özel hâller haklı gösterirse** istenebilir (m. 758/2).

  > **Örnek:** Hasan'ın evinin içme suyunu sağlayan kaynak, komşu X İnşaat'ın temel kazısıyla kısmen kesilir. X zararı gidermekle yükümlüdür (TMK m. 757/1); içme suyu kaynağı olduğundan eski duruma getirme de istenebilir (TMK m. 758/1). X kasten veya ihmalle davranmamışsa tazminatın gerekip gerekmediğini hâkim takdir eder (TMK m. 757/2).

  > 💡 **Püf nokta:** TMK m. 757 **tazminat**, TMK m. 758 **eski duruma getirme**; eskisi her kaynak için değil, oturma, işletme ve içme-kullanma suyu kaynakları için kolayca istenir.

  ### 6.3 Aynı yataktan beslenen kaynaklar (TMK m. 759)
  Değişik maliklere ait komşu kaynaklar ortak bir ana kaynaktan beslenirse, maliklerden her biri kaynakların **birlikte tutulmasını** ve suyun hak sahiplerine **o zamana kadarki yararlanmaları oranında** dağıtılmasını isteyebilir (m. 759/1). Ortak tesis masrafları da **yararlanma oranında** üstlenilir (m. 759/2). Biri karşı çıkarsa diğeri, öbür kaynaklarda su azalacak olsa bile, gerekli işleri yapabilir; kendi kaynağına gelen su çoğalırsa yalnız bu çoğalma oranında bir bedel öder (m. 759/3).

  > **Örnek:** Can ve Deniz'in çeşmeleri aynı ana kaynaktan beslenir. Su azalınca her ikisi de suyun o güne kadarki kullanım oranlarına göre dağıtılmasını isteyebilir.

  ### 6.4 Özel kanun ve yerel âdet (TMK m. 760)
  Özel mülkiyetteki kaynak, kuyu ve derelerden başkalarının su içme, su alma, hayvan sulama gibi yollarla yararlanması **özel kanun hükümlerine**, yoksa **yerel âdete** tâbidir.

  ### 6.5 Zorunlu su (TMK m. 761)
  Evi, arazisi veya işletmesi için gerekli sudan yoksun olup bunu **aşırı zahmet ve gidere katlanmaksızın başka yoldan sağlayamayan** malik, komşusundan **onun ihtiyacından fazla olan suyu tam bedel karşılığında** almasını sağlayacak bir **irtifak** kurulmasını isteyebilir (m. 761/1). Kurulurken **öncelikle kaynak sahibinin menfaati** gözetilir (m. 761/2). Durum değişirse irtifakın değiştirilmesi veya kaldırılması istenebilir (m. 761/3).

  Şartlar: su yoksunluğu; başka yoldan aşırı zahmet ve gidersiz sağlayamama; komşunun ihtiyaç fazlası suyu; tam bedel.

  | | TMK m. 756/2 ve TMK m. 837 | TMK m. 761 |
  |---|---|---|
  | Hak türü | Kaynak irtifakı (iradi) | Zorunlu su irtifakı |
  | Kuruluş | Sözleşme ve tescil | Kurulmasını isteme hakkı |
  | Konu | Kaynak üzerinde hak | Komşunun ihtiyaç fazlası su |

  > **Örnek:** Fatma'nın evi aşırı zahmet ve gider olmadan başka yoldan su bulamıyor; komşu Hasan'ın kaynağında ihtiyacından fazla su var. Fatma tam bedelle irtifak kurulmasını isteyebilir; Hasan'ın menfaati öncelikle gözetilir.

  ## 7. Kamu hukuku kısıtlamaları ve ortak iyileştirme (TMK m. 754 ve TMK m. 755)

  TMK m. 754'e göre yapı, yangın, afet ve sağlık kolluğuna, nirengi noktalarına, toprağın iyileştirilmesine, eski eserlere, **maden ve kaynak sularının korunmasına** ilişkin mülkiyet kısıtlamaları **özel kanun hükümlerine** tâbidir.

  TMK m. 755 ortak girişimle yapılabilecek iyileştirme işlerini (su yollarını düzeltme, sulama, bataklık kurutma, yol açma, orman yetiştirme, arazi toplulaştırma gibi) düzenler. Karar için iki ölçü birlikte aranır: **arazinin yarısından fazlasına sahip bulunmak koşuluyla maliklerin üçte ikisi** karar vermelidir. Diğer malikler de karara uymak zorundadır. Karar beyanlar sütununda gösterilir.

  > **Örnek:** Bir köyde 30 arazi maliki var. Bunlardan 20'si (üçte ikisi) arazinin yarısından fazlasına sahipse ve toplulaştırma kararı alırsa, diğer 10 malik de uymak zorundadır (TMK m. 755/1). Aynı 20 kişi arazinin yalnız %40'ına sahip olsaydı karar bağlamazdı.

  > ⚠️ **Sınavda dikkat:** TMK m. 755 kişi çoğunluğuyla **arazi çoğunluğunu** birlikte arar. Paylı mülkiyetteki çoğunluk kurallarıyla karıştırma.

  ## 8. Usul: görev ve arabuluculuk

  **Görev.** Asliye hukuk mahkemesi (HMK m. 2); geçit davası HMK m. 4'te sayılan sulh hukuk işlerinde yer almaz.

  **Dava şartı olarak arabuluculuk.** HUAK m. 18/B/1-ç'ye göre "komşu hakkından kaynaklanan uyuşmazlıklarda" dava açılmadan önce arabulucuya başvurulmuş olması **dava şartıdır**. Arabulucuya başvurulmadan dava açıldığının anlaşılması hâlinde herhangi bir işlem yapılmaksızın dava, dava şartı yokluğu sebebiyle **usulden reddedilir** (HUAK m. 18/A/2).
  - 📌 **Yürürlük:** HUAK m. 18/B'ye ilişkin 7445 sayılı Kanun değişikliği için resmî metindeki değişiklik tablosunda 1/9/2023 tarihi yer alır. HUAK'ın geçici 3. maddesine göre, yürürlük tarihinde ilk derece mahkemesinde, bölge adliye mahkemesinde ve Yargıtay'da görülmekte olan davalara uygulanmaz.
  - **Zorunlu geçit:** Yargıtay 7. Hukuk Dairesi, zorunlu geçit davasını "komşu hakkından kaynaklanan uyuşmazlık" sayar. Arabulucuya başvurmadan açılan dava usulden reddedilir. Dava açıldıktan sonra arabulucuya başvurmak bu eksikliği gidermez; HMK m. 115/2'deki gibi eksikliğin tamamlanması için süre de verilmez.
  - **Diğer uyuşmazlıklar:** Dal-kök, su akıtma, mecra, kaynak ve zorunlu su davalarının 18/B kapsamına girip girmediği tartışmalıdır; bu konuda bir Yargıtay kararı tespit edilememiştir (doktrin bölümü).
  - 📌 **Anlaşma belgesi:** 7531 sayılı Kanunla 2024'te HUAK m. 18/B'ye eklenen 5. fıkraya göre, taşınmaz üzerinde sınırlı ayni hak kurulmasına ilişkin anlaşma belgesinin taraflarından biri, icra edilebilirlik şerhi verildikten sonra tapu müdürlüğünden tescil isteyebilir; tapu müdürlüğü gerekli incelemeyi yaptıktan sonra **resmî senet düzenlenmeksizin** tescil talebini yerine getirir. Bunun bir geçit irtifakına da uygulanabileceği metinden çıkarımdır; bu konuda karar okunmamıştır.

  ## 9. Denetim şeması (olay çözerken)

  1. **Müdahale tipi:** kazı-yapı, dal-kök, su akışı, mecra, geçit, kaynak/zorunlu su.
  2. **Madde ve şartlar:** hükmün şartlarını tek tek say.
  3. **Bedel:** fazla suda tazminatsız katlanma; mecrada zararın tamamı önceden; geçit ve zorunlu suda tam bedel.
  4. **Kime karşı:** geçitte önceki mülkiyet ve yol durumuna göre en uygun komşu, sonra en az zarar görecek olan.
  5. **Kütük:** mecra hakkı istemle tescil; kaynak irtifakı tescille; doğrudan kanundan doğan geçit tescilsiz, sürekli olanlar beyanlar sütununda.
  6. **Usul:** asliye hukuk; zorunlu geçitte önceden arabuluculuk.

kritik: |
  - 📌 Kazı ve yapıda komşunun toprağını sarsmak, tehlikeye düşürmek ya da tesislerini etkilemek suretiyle zarar vermek yasaktır; komşuluk hukukuna aykırı yapılara taşkın yapı hükümleri uygulanır (TMK m. 738).
  - 📌 Kazı, yapı ve bitki dikimi bakımından ayrıntılı kurallar özel kanunlara bırakılmıştır (TMK m. 739 ve TMK m. 741).
  - ⚠️ Dal ve kök: zarar, istem, uygun süre; ancak bundan sonra kesip kendi mülkiyetine geçirir. "Zarar veriyorsa hemen keser" yanlıştır (TMK m. 740/1).
  - 📌 Ekilmiş veya üzerine yapı yapılmış arazisine dalların taşmasına katlanan komşu meyveleri toplar; komşu ormanlara bu hükümler uygulanmaz (TMK m. 740/2-3).
  - 📌 Doğal akan suya alttaki malik katlanır; akış komşunun zararına değiştirilemez; üstteki malik suyu yalnız kendi taşınmazı için zorunlu ölçüde tutabilir (TMK m. 742).
  - ⚠️ Fazla suya, suyu öteden beri alta akan arazide tazminatsız katlanılır; ama zarar varsa gideri üsttekine ait mecra istenebilir (TMK m. 743).
  - 📌 Mecraya katlanma: başka yerden geçirilmesi olanaksız veya aşırı masraflı olmalı ve zararın tamamı önceden ödenmelidir; kamulaştırmaya bağlı mecrada komşuluk hükümleri uygulanmaz; tescil hak sahibinin istemi ve giderleri üzerinedir (TMK m. 744).
  - ⚠️ Olağanüstü durumda parçanın satın alınmasını yükümlü malik ister; nakil giderleri kural olarak mecra hakkı sahibine aittir (TMK m. 745/2 ve TMK m. 746/2).
  - 📌 Zorunlu geçit: genel yola yeterli geçit yok, tam bedel; istem önce önceki mülkiyet ve yol durumuna göre en uygun komşuya, sonra en az zarar görecek olana; iki tarafın menfaati gözetilir (TMK m. 747).
  - ⚠️ Geçit bedelinin hükümden önce depo edilmesi ve tarım arazisinde 2,5-3 m genişlik Yargıtay uygulamasıdır; kanun metninde yoktur.
  - ⚠️ "Tescilsiz doğar" kuralı TMK m. 748/3'te doğrudan kanundan doğan geçitler içindir; sürekli olanlar beyanlar sütununda gösterilir. Zorunlu geçide mekanik olarak uygulama.
  - 📌 Kaynak arazinin bütünleyici parçasıdır; başkasının arazisindeki kaynakta hak tescille kurulan irtifaktır; arza malik olmak yeraltı suyuna malik olmayı sağlamaz (TMK m. 756 ve 167 sayılı Kanun m. 1).
  - ⚠️ TMK m. 757 tazminat, TMK m. 758 eski duruma getirme; kast veya ihmal yoksa tazminatı hâkim takdir eder. Eski duruma getirme oturma, işletme, içme-kullanma suyu kaynaklarında doğrudan istenebilir.
  - 📌 Zorunlu su: su yoksunluğu, başka yoldan aşırı zahmet ve gidersiz sağlayamama, komşunun ihtiyaç fazlası su, tam bedel; öncelikle kaynak sahibinin menfaati gözetilir (TMK m. 761).
  - 📌 Zorunlu geçit davasında 1/9/2023'ten sonra önceden arabulucuya başvurmak dava şartıdır; dava sonrası başvuru eksikliği gidermez; görevli mahkeme asliye hukuktur (HUAK m. 18/B/1-ç, HUAK m. 18/A/2, HMK m. 2).

doktrin: |
  ### Zorunlu geçit ne zaman doğar?
  Kanun, TMK m. 747'de geçidin doğrudan doğacağını söylemez; malik geçit hakkı "tanınmasını isteyebilir". Bu yüzden hakkın niteliği ve doğduğu an tartışmalıdır.
  - **Bir görüş:** TMK m. 747 doğrudan geçit doğurmaz, irtifak kurulmasını isteme hakkı verir (dolaylı kanuni kısıtlama). Hak tescille ya da mahkeme kararıyla doğar; TMK m. 748/3 yalnız doğrudan kanundan doğan geçitler içindir.
  - **Diğer görüş:** Mahkeme kararıyla kurulan geçit, TMK m. 780/2'nin yollamasıyla taşınmaz mülkiyetinin kazanılmasına ilişkin kurallara tâbidir; bu nedenle karar kesinleşince tescilden önce doğar.
  - **Yargıtay:** Hükümde geçidin tapu kütüğünde özel sütuna tescilini karara bağlar ve bunu TMK m. 748/3 ile TMK m. 1012'ye dayandırır. Bu bağlantı metinle tam örtüşmez, çünkü TMK m. 748/3 doğrudan kanundan doğan geçitlerden söz eder.

  ### Tam bedel nasıl ödenir?
  Bir görüş bedelin bir defada ve peşin ödenmesi gerektiğini savunur. Diğer görüşe göre dönemsel ödeme de mümkündür. Yargıtay uygulaması bedelin hükümden önce depo edilmesidir.

  ### Kendi eylemiyle geçitsiz kalan malik
  TMK m. 747/2'deki "önceki mülkiyet ve yol durumu" ölçütü, isteği önce eski bütünden ayrılan komşuya yöneltir. Geçitsiz kalmasında kendi payı olan malikin istemi dürüstlük kuralına (TMK m. 2) aykırı sayılır mı? Bu nokta tartışmalıdır.
  - **Bir görüş:** Geçitsizliği kendi eylemiyle yaratan malikin istemi, hakkın açıkça kötüye kullanılması niteliğinde olabilir (TMK m. 2/2).
  - **Diğer görüş:** Kanun bu durumu "önceki mülkiyet ve yol durumu" ölçütüyle zaten düzenlemiştir; malikin payı istemi ortadan kaldırmaz, yalnız istemin kime yöneltileceğini belirler.

  ### Arabuluculuğun kapsamı
  HUAK m. 18/B/1-ç "komşu hakkından kaynaklanan uyuşmazlıkları" sayar. Bir görüş bu ifadenin komşular arasındaki bütün kanuni kısıtlamaları kapsadığını söyler. Diğer görüşe göre kaynaklara ilişkin hükümler (TMK m. 756 - TMK m. 761) sistematik olarak "komşu hakkı" ayırımının dışındadır ve zorunlu su ile kaynak uyuşmazlıkları kapsama girmez. Bu konuda bir Yargıtay kararı tespit edilememiştir. Zorunlu geçit için ise Yargıtay'ın tutumu nettir.

  ### TMK m. 757'nin niteliği
  Bir görüşe göre hüküm kusursuz sorumluluk getirir. Diğer görüşe göre kusur sorumluluğu ile hakkaniyet sorumluluğunun birleşimidir. Metin, kast veya ihmal yoksa tazminatın gerekip gerekmediğini hâkimin takdirine bırakır; sınavda önce metni yaz, sonra görüşleri ekle.

  ### Özel su ve genel su
  Yargıtay uygulaması özel su (yalnız taşınmazın ihtiyacına yeten su) ile genel su (sınırı aşan, ihtiyaç fazlası ya da tapusuz yerden çıkan su) ayrımını yapar. Ölçüt kanunda yazılı değildir; sınır uyuşmazlıkta bilirkişiyle belirlenir.

sozluk:
  - terim: Komşu hakkı
    tanim: "Komşu taşınmaz malikleri arasında mülkiyetin kullanımını sınırlayan kanuni kısıtlamalar (taşkınlık, kazı, bitki, su, mecra, geçit gibi). HUAK m. 18/B/1-ç bu kavramı dava şartı olarak arabuluculukta kullanır."
  - terim: Mecra
    tanim: "Su yolu, kurutma kanalı, gaz ve benzeri borular ile elektrik hat ve kablolarının geçtiği tesis (TMK m. 744)."
  - terim: Yükümlü malik
    tanim: "Taşınmazı mecra, geçit veya zorunlu su irtifakıyla yüklenen komşu malik."
  - terim: Zorunlu geçit
    tanim: "Genel yola çıkmak için yeterli geçidi olmayan malikin, tam bedelle komşulardan isteyebildiği geçit hakkı (TMK m. 747)."
  - terim: Mutlak ve nispi ihtiyaç
    tanim: "Yargıtay'ın zorunlu geçitte ayırımı: geçit yoksunluğu (mutlak) ve var olan geçidin yetersizliği (nispi)."
  - terim: Tam bedel
    tanim: "Zorunlu geçit ve zorunlu suda kanunun aradığı karşılık. Uygulamada miktarı bilirkişiyle belirlenir; Yargıtay uygulamasında hükümden önce depo edilir."
  - terim: Taşan dal ve kök
    tanim: "Komşu arazisine taşarak zarar veren bitki kısımları. İstem ve uygun süreden sonra komşu keser ve mülkiyetine geçirir (TMK m. 740/1)."
  - terim: Kaynak
    tanim: "Arazinin bütünleyici parçası olan doğal su çıkışı. Mülkiyeti arazi mülkiyetiyle birlikte kazanılır (TMK m. 756/1)."
  - terim: Yeraltı suyu
    tanim: "Kamu yararına ait sulardan olan, arz katmanının altındaki su. Arza malik olmak yeraltı suyuna malik olmayı sağlamaz (TMK m. 756/3)."
  - terim: Özel su ve genel su
    tanim: "Yargıtay ayırımı: özel su yalnız taşınmazın ihtiyacına yeten sudur ve malikindir; sınırı aşan, ihtiyaç fazlası ya da tapusuz yerden çıkan su genel sudur. Ölçüt kanunda yazılı değildir."
  - terim: Zorunlu su irtifakı
    tanim: "Susuz kalan malikin, komşusunun ihtiyaç fazlası suyunu tam bedelle almasını sağlayan irtifak (TMK m. 761)."
  - terim: Eski duruma getirme
    tanim: "Kesilen ya da kirletilen kaynağın olabildiği ölçüde eski hâline döndürülmesi. Oturma, işletme, içme-kullanma suyu kaynaklarında doğrudan istenebilir (TMK m. 758)."
  - terim: Beyanlar sütunu
    tanim: "Tapu kütüğünde hak doğurmayan, bilgi veren kayıtların yer aldığı sütun. Doğrudan kanundan doğan sürekli geçitler ve ortak iyileştirme kararı burada gösterilir (TMK m. 748/3 ve TMK m. 755)."
  - terim: Dava şartı olarak arabuluculuk
    tanim: "Dava açılmadan önce arabulucuya başvurulmuş olmasının aranması. Eksikse dava usulden reddedilir (HUAK m. 18/A/2)."

kararlar:
  - id: "1039017400"
    ozet: |
      Sivas'ta bir parselin maliki, genel yola ulaşmak için Hazineye ait komşu parsel üzerinden bedel karşılığı geçit istemiştir. Hazine, parselin köye ağaçlandırma için tahsis edildiğini, üzerindeki fiilî yolun üçüncü kişinin haksız işgaliyle açıldığını ve TMK m. 747/2'nin şartlarının bulunmadığını savunmuştur. Asliye hukuk mahkemesi davayı kabul etmiş, kapatılan 14. Hukuk Dairesi güzergâh davalı parseli üçe böldüğü ve geçidin kütükte özel sütuna tescili hükme bağlanmadığı için bozmuştur. Mahkeme bozmaya uyup yeniden keşif yapmış, yine bölen güzergâhı seçmiş (eğimi farklı kısımların ekonomik bütünlük oluşturmadığı gerekçesiyle); 7. Hukuk Dairesi bozma gereği yapılmadığı için yeniden bozunca mahkeme direnmiştir. Hukuk Genel Kurulu direnme kararını oy çokluğuyla bozmuştur. Gerekçede Dairenin şu ilkeleri benimsenmiştir: mutlak ve nispi ihtiyaç ayrımı, ihtiyacın objektif ölçülerle belirlenmesi, yüklü taşınmazın bölünmemesi ve genel yola kesintisiz bağlantı, bedelin bilirkişiyle belirlenip hükümden önce depo ettirilmesi, geçidin TMK m. 748/3, TMK m. 1012 ve Tapu Sicili Tüzüğü'nün 30. maddesi uyarınca özel sütuna tescili, tarım alanında emsaline göre 2,5-3 metre genişlik (Yargıtay ölçüsü, kanun kuralı değil). Seçenekler arasında davacı için en kısa ve en ucuz olan değil, yüklü taşınmaz bakımından objektif olarak en az külfet doğuran seçilmelidir; fiilî yolun varlığı ve bölünen kısmın tarla olarak kullanılması üçüncü kişilerin işgaline dayandığından yeterli değildir, taşınmazın gelecekteki kullanımı da gözetilmelidir. Karşı oy, mahkemenin bozmaya uygun inceleme yaptığını, eğim ve fiilî kullanıma göre en makul yolu belirlediğini savunmuştur. Konuya katkısı: güzergâhın, lehine geçit kurulanın ihtiyacı kadar yüklü taşınmazın külfetine göre de belirlendiğini gösterir.
  - id: "1169456500"
    ozet: |
      İki parselin malikleri köy yoluna ulaşamadıklarını ileri sürerek 21 Aralık 2023'te geçit davası açmış, arabuluculuğa dava açıldıktan sonra başvurmuşlardır. İlk derece mahkemesi, zorunlu geçit istemi TMK'nın "komşu hakkı" başlığı altındaki m. 747'de düzenlendiğinden HUAK m. 18/B/1-ç uyarınca davayı usulden reddetmiş; bölge adliye mahkemesi istinaf başvurusunu esastan reddetmiştir. Yargıtay 7. Hukuk Dairesi, komşu hakkına ilişkin zorunlu arabuluculuğun HMK m. 115/2 bakımından sonradan tamamlanabilecek bir dava şartı olmadığını, tamamlama için süre verilmeyeceğini belirtmiş; esasa girildiği ve eksikliğin hüküm anında giderildiği yönündeki temyiz sebeplerini reddederek oy birliğiyle onamıştır. Konuya katkısı: zorunlu geçit davasının "komşu hakkından kaynaklanan uyuşmazlık" olduğunu ve arabulucuya önceden başvurmadan açılan davanın usulden reddedileceğini gösterir.
  - id: "1226404400"
    ozet: |
      İstanbul'da iki parsel üzerinde 1968'de TCDD lehine enerji nakil hattı için kamulaştırma yoluyla irtifak kurulmuş, hat 2012'de yer altına alınıp söküldükten sonra malikler 24 Aralık 2018'de bedelsiz terkin istemiştir. İdare ihtiyacın kalmadığını kabul etmiş, ancak terkinin rıza ve bedele bağlı olduğunu savunmuştur. İlk derece mahkemesi bedelsiz terkine karar vermiş, bölge adliye mahkemesi istinafı reddetmiş; Yargıtay 5. Hukuk Dairesi, 2942 sayılı Kanun m. 22'ye 6552 sayılı Kanunla eklenen beş yıllık sınır geçtiği ve taraflar anlaşamadığı için bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu TMK m. 785'in iki fıkrasını açıklamış (yarar tamamen kalkarsa terkin, çok az yarar varsa bedelle terkin, yükün artması tek başına terkin sebebi değil); ancak irtifak kamulaştırmayla kurulduğundan bu hükmün uygulanmayacağını, dava 11 Eylül 2014'ten sonra açıldığı ve beş yıl geçtiği için reddedilmesi gerektiğini belirterek direnme kararını oy çokluğuyla bozmuştur. Karşı oy, hat irtifakının TMK m. 838 kapsamında bir "diğer irtifak" olduğunu, Kamulaştırma Kanunu'nda terkin hükmü bulunmadığından TMK m. 783, TMK m. 785 ve TMK m. 838/3'e göre terkin edilebileceğini savunmuştur. Konuya katkısı: kamulaştırmayla kurulan mecra irtifakının terkininin TMK m. 785'e göre değil kamulaştırma mevzuatına göre çözüldüğünü gösterir; TMK m. 744/2'nin mantığıyla uyumludur (Genel Kurul bu hükmü adıyla anmamıştır).

sorular:
  - soru: |
      TMK m. 738/1'e göre malik, kazı ve yapı yaparken komşu taşınmazlara karşı hangi yükümlülük altındadır?
    siklar:
      - "Komşu taşınmazların topraklarını sarsmak veya tehlikeye düşürmek ya da üzerlerindeki tesisleri etkilemek suretiyle zarar vermekten kaçınmak"
      - "Kazıya başlamadan önce bütün komşulardan yazılı onay almak"
      - "Kazı ve yapının ayrıntılarını tapu kütüğünün beyanlar sütununa yazdırmak"
      - "Yapıyı komşu sınırından en az üç metre geri çekmek"
    dogru: 0
    aciklama: |
      TMK m. 738/1, malikin kazı ve yapı yaparken komşunun toprağını sarsmak, tehlikeye düşürmek ya da tesislerini etkilemek suretiyle zarar vermekten kaçınmasını öngörür. Komşu onayı, beyan kaydı veya sabit bir geri çekme mesafesi bu hükümde yoktur; ayrıntılı kurallar özel kanunlara bırakılmıştır (TMK m. 739).

  - soru: |
      Zeynep'in bahçesindeki ceviz ağacının dalları komşusu Mehmet'in arazisine taşmış ve Mehmet'in serasının camlarına zarar vermektedir. Mehmet, Zeynep'e hiçbir bildirimde bulunmadan dalları kesmek istemektedir. TMK m. 740/1'e göre hangisi doğrudur?
    siklar:
      - "Zarar verdiği için Mehmet dalları derhâl kesebilir; kesilen dalları Zeynep'e iade etmek zorundadır."
      - "Mehmet önce Zeynep'ten dalların kaldırılmasını istemelidir; uygun süre içinde kaldırılmazsa dalları kesip kendi mülkiyetine geçirebilir."
      - "Mehmet dalları ancak mahkemeden kesme izni aldıktan sonra kesebilir."
      - "Mehmet dalları kesebilir, ancak kesilen dallar Zeynep'in mülkiyetinde kalır."
    dogru: 1
    aciklama: |
      TMK m. 740/1'e göre komşunun arazisine taşarak zarar veren dal ve kökler, komşunun istemi üzerine uygun bir süre içinde kaldırılmazsa komşu bunları kesip kendi mülkiyetine geçirebilir. Önce istem ve uygun süre gerekir; mahkeme izni aranmaz, kesilen dallar da kesenin mülkiyetine geçer. Yaygın yanılgı, zarar vermeyi hemen kesme hakkı sanmaktır.

  - soru: |
      Ali'nin tarlasına komşu ormandaki ağaçların dalları taşmakta ve ekinlere zarar vermektedir. Ali, TMK m. 740'a dayanarak komşu ormanın yönetimine bildirimde bulunup uygun süre verdikten sonra dalları kesip mülkiyetine geçirmek istemektedir. Hangisi doğrudur?
    siklar:
      - "Orman da komşu taşınmaz olduğundan Ali, istem ve uygun süre şartıyla dalları kesip mülkiyetine geçirebilir."
      - "Ali istem ve uygun süre şartını yerine getirdiği için dalları kesebilir, ancak kesilen dallar ormanın malikinin mülkiyetinde kalır."
      - "Ali, orman söz konusu olduğunda süre vermeksizin dalları derhâl kesebilir."
      - "TMK m. 740'taki hükümler komşu ormanlar hakkında uygulanmaz; Ali bu hükme dayanarak dalları kesip mülkiyetine geçiremez."
    dogru: 3
    aciklama: |
      TMK m. 740/3, dal ve kök hükümlerinin komşu ormanlar hakkında uygulanmayacağını söyler. Bu yüzden Ali, TMK m. 740/1'e dayanarak kesme ve mülkiyete geçirme hakkı kazanmaz. Yaygın yanılgı, orman istisnasını "süre şartı kalkar" diye anlamaktır; istisna hükmün kendisini uygulama dışı bırakır.

  - soru: |
      Üst parseldeki Kemal, yağmur sularını setle tamamen tutmuş, alttaki komşusu Selim'in bahçesi susuz kalmıştır. TMK m. 742'ye göre Kemal'in suyu tutma yetkisinin sınırı hangisidir?
    siklar:
      - "Suyu ancak kendi taşınmazı için zorunlu olduğu ölçüde tutabilir."
      - "Yağmur suyu kimsenin malı olmadığından tutmanın bir sınırı yoktur."
      - "Hiçbir miktarda su tutamaz; akış her koşulda aynen sürmelidir."
      - "Alttaki Selim'e tazminat öderse dilediği kadar tutabilir."
    dogru: 0
    aciklama: |
      TMK m. 742/3'e göre üstteki arazi maliki, alt taraftaki taşınmaza gerekli olan suyu ancak kendi taşınmazı için zorunlu olduğu ölçüde tutabilir. Hiç tutamaz demek de, sınırsız tutabilir demek de metne aykırıdır. Tazminat karşılığı sınır aşma imkânı kanunda yoktur. Akışı komşunun zararına değiştirmek ayrıca yasaktır (TMK m. 742/2).

  - soru: |
      Zeynep göletini boşaltmıştır. Su, öteden beri Zeynep'in arazisinden Mehmet'in arazisine doğal olarak akmakta ve Mehmet'in fidelerine zarar vermektedir. TMK m. 743'e göre Mehmet'in durumu nedir?
    siklar:
      - "Zararın tamamı için Zeynep'ten tazminat isteyebilir; suların akışına katlanmak zorunda değildir."
      - "Boşaltılan sulara tazminat isteme hakkı olmaksızın katlanmak zorundadır, ancak zarar görüyorsa gideri Zeynep'e ait olmak üzere kendi arazisinde bir mecra yapılmasını isteyebilir."
      - "Sulara katlanır ve mecra da isteyemez; çünkü akış doğaldır."
      - "Mecra isteyebilir, ancak mecranın giderini kendisi üstlenmek zorundadır."
    dogru: 1
    aciklama: |
      TMK m. 743/1, suyu öteden beri alttaki araziye doğal olarak akan arazide alttaki malikin fazla suyun boşaltılması sırasında da bu sulara tazminat isteme hakkı olmaksızın katlanacağını söyler. Boşaltmadan zarar görüyorsa gideri üstteki arazi malikine ait olmak üzere kendi arazisinde mecra yapılmasını isteyebilir (TMK m. 743/2). Yaygın yanılgı, tazminatsız katlanmayı zararın tamamen yok sayılması sanmaktır.

  - soru: |
      TMK m. 744/1'e göre taşınmaz maliki, arazisinin altından veya üstünden mecra geçirilmesine hangi şartlarla katlanmak zorundadır?
    siklar:
      - "Mecra hakkı sahibinin kamu kurumu olması ve zararın dava sonunda hükümle ödenmesi"
      - "Mecranın tapuya önceden tescil edilmiş olması ve komşunun rızası"
      - "Başka yerden geçirilmesinin olanaksız veya aşırı ölçüde masraflı olması ve uğrayacağı zararın tamamının önceden ödenmesi"
      - "Mecranın yararının yükümlü malikin zararından fazla olması ve zararın yarısının önceden ödenmesi"
    dogru: 2
    aciklama: |
      TMK m. 744/1 iki şartı birlikte arar: mecranın başka yerden geçirilmesi olanaksız veya aşırı ölçüde masraflı olmalı; yükümlü malik de zararın tamamının önceden ödenmesi koşuluyla katlanır. Tescil mecra hakkı sahibinin istemi üzerine yapılır (TMK m. 744/3), katlanmanın şartı değildir. Zararın yarısı veya dava sonunda ödenmesi gibi seçenekler metinde yoktur.

  - soru: |
      Bir kamu kuruluşu, enerji nakil hattını Selin'in arazisinden kamulaştırma yoluyla irtifak kurarak geçirecektir. Selin, TMK'nın mecra geçirilmesine ilişkin komşuluk hükümlerine (örneğin zararın önceden ödenmesi) dayanmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Komşuluk hükümleri kamulaştırmada da aynen uygulanır; Selin zararının önceden ödenmesini bu hükümlere dayanarak isteyebilir."
      - "Komşuluk hükümleri yalnızca kamulaştırma bedelinin düşük kaldığı hâllerde ek olarak uygulanır."
      - "Kamulaştırmaya bağlı mecralarda komşuluk hükümleri uygulanır; yalnız tescil kuralı uygulanmaz."
      - "Mecra geçirilmesi kamulaştırma kurallarına bağlı olduğundan TMK'nın mecralara ilişkin komşuluk hükümleri uygulanmaz."
    dogru: 3
    aciklama: |
      TMK m. 744/2 açıktır: mecra geçirilmesi kamulaştırma kurallarına bağlı olduğu hâlde bu Kanunun mecralara ilişkin komşuluk hükümleri uygulanmaz. Selin'in hakları kamulaştırma mevzuatına göre belirlenir. Komşuluk hükümlerinin kısmen veya ek olarak uygulandığı yönündeki seçenekler metinde dayanak bulmaz.

  - soru: |
      Ahmet'in Selin'in arazisinin üzerinden geçen boruları arazide bir şeridi kullanılamaz hâle getirmiş ve olağanüstü bir durum doğurmuştur. TMK m. 745/2'ye göre hangisi doğrudur?
    siklar:
      - "Selin, mecranın geçtiği arazi parçasının uygun bir kısmının, zararını tam olarak karşılayacak bedelle satın alınmasını isteyebilir."
      - "Ahmet, Selin'i o parçayı kendisine satmaya zorlayabilir."
      - "Selin yalnız boruların kaldırılmasını isteyebilir; satın alma isteme hakkı kanunda yoktur."
      - "Hem Ahmet hem Selin satın almayı eşit olarak isteyebilir."
    dogru: 0
    aciklama: |
      TMK m. 745/2'ye göre olağanüstü durumlar varsa yükümlü malik, mecraların geçirileceği arazi parçasının uygun bir kısmının zararını tam olarak karşılayacak bedelle satın alınmasını isteyebilir. Satın alma istemi yükümlü malike aittir; mecra hakkı sahibinin malikin parçasını satın almaya zorlama hakkı yoktur.

  - soru: |
      Aşağıdakilerden hangisi TMK m. 747/1'e uygundur?
    siklar:
      - "Zorunlu geçit yalnız taşınmazın genel yola hiç bağlantısı bulunmadığında istenebilir; var olan ama yetersiz geçit bu hükmün dışındadır."
      - "Taşınmazından genel yola çıkmak için yeterli geçidi bulunmayan malik, tam bir bedel karşılığında bir geçit hakkı tanınmasını komşularından isteyebilir."
      - "Geçit, komşuluk hukukunun gereği olduğundan bedelsiz istenebilir."
      - "Zorunlu geçit yalnız kamuya ait komşu taşınmazlara karşı istenebilir."
    dogru: 1
    aciklama: |
      TMK m. 747/1, genel yola çıkmak için yeterli geçidi bulunmayan malike tam bedel karşılığında geçit isteme hakkı verir. Hükümdeki ölçüt "yeterli geçit"tir; Yargıtay bu çerçevede mutlak (geçit yoksunluğu) ve nispi (geçit yetersizliği) ihtiyacı ayırır. Geçit bedelsiz değildir ve yalnız kamuya ait taşınmazlara karşı istenmez.

  - soru: |
      Ali'nin tarlası eskiden kardeşi Ayşe'yle ortak olan arazinin paylaşımıyla ayrılmış, yola bakan kısım Ayşe'ye kalmıştır. Tarla her yönden komşu parsellerle çevrilidir. Ali, "en kısa yol" gerekçesiyle Mehmet'in parselinden geçit istemek istemektedir. TMK m. 747/2'ye göre hangisi doğrudur?
    siklar:
      - "Ali istediği komşuyu serbestçe seçebilir; en kısa yol tek ölçüttür."
      - "Ali önce geçidi en az zarar görecek komşudan istemelidir; bu mümkün değilse önceki mülkiyet ve yol durumuna uygun komşudan."
      - "İstem önce, önceki mülkiyet ve yol durumuna göre en uygun düşen komşuya (burada Ayşe'ye), sonra bundan en az zarar görecek olana karşı kullanılır."
      - "Ali bütün komşulardan aynı anda geçit isteyip bedeli aralarında paylaştırmak zorundadır."
    dogru: 2
    aciklama: |
      TMK m. 747/2 sırayı belirler: hak ilk önce, kendisinden bu geçidin istenmesi önceki mülkiyet ve yol durumuna göre en uygun düşen komşuya, daha sonra bundan en az zarar görecek olana karşı kullanılır. Olayda yola bakan kısım Ayşe'ye kaldığından önce Ayşe düşünülür. "En kısa yol" tek başına belirleyici değildir; geçit iki tarafın menfaati gözetilerek belirlenir (TMK m. 747/3). Sıranın tersine çevrilmesi metne aykırıdır.

  - soru: |
      TMK m. 748/3'e göre doğrudan doğruya kanundan kaynaklanan geçit hakları hakkında hangisi doğrudur?
    siklar:
      - "Tapu kütüğüne tescille doğar; tescilsiz hiçbir sonuç doğurmaz."
      - "Noterce düzenlenen sözleşmeyle doğar ve kütüğe şerh verilir."
      - "Tescil edilmeksizin doğar; bunlardan geçici nitelikte olanlar beyanlar sütununda gösterilir."
      - "Tapu kütüğüne tescil edilmeksizin doğar; ancak bunlardan sürekli nitelikte olanlar beyanlar sütununda gösterilir."
    dogru: 3
    aciklama: |
      TMK m. 748/3: doğrudan doğruya kanundan kaynaklanan geçit hakları tapu kütüğüne tescil edilmeksizin doğar; bunlardan sürekli nitelikte olanlar beyanlar sütununda gösterilir. Beyana yazılan geçici değil, sürekli olanlardır. Hükmün konusu yalnız doğrudan kanundan doğan geçitlerdir.

  - soru: |
      Köylü Hasan, hayvanlarını sulamak için yıllardır komşusu Osman'ın tarlasının kenarındaki patikayı kullanmaktadır. Osman bu kullanımı yasaklamıştır. Hasan'ın bu hayvan sulama yolu bakımından hangi hükme bakılmalıdır?
    siklar:
      - "TMK m. 748/1-2'ye göre özel kanun hükümlerine; özel kanun hükmü yoksa yerel âdete."
      - "Yalnız TMK m. 747'ye; Hasan tam bedelle zorunlu geçit isteyebilir."
      - "Yalnız yerel âdete; özel kanun hükümleri bu yollara uygulanmaz."
      - "Yıllardır kullandığı için kendiliğinden irtifak hakkı doğmuştur; tescil gerekmez."
    dogru: 0
    aciklama: |
      TMK m. 748/1, tarla yolu, hayvan sulama yolu, kış geçidi gibi geçitleri özel kanun hükümlerine bırakır; özel kanun hükmü yoksa yerel âdet uygulanır (TMK m. 748/2). Bu yollar TMK m. 747'nin tam bedelli zorunlu geçidi değildir. Yıllarca kullanmak tek başına bir irtifak doğurmaz; iradi irtifak tescille kurulur (TMK m. 780/1). Hasan'ın bir geçit hakkı varsa bu, özel kanundan ya da yerel âdetten doğar; doğrudan kanundan kaynaklanan böyle bir geçit tescilsiz doğar, sürekli nitelikteyse beyanlar sütununda gösterilir (TMK m. 748/3).

  - soru: |
      Bir köyde 30 arazi maliki vardır. Bunlardan 20'si arazileri toplulaştırma kararı almıştır; ancak bu 20 malik toplam arazinin yalnız %40'ına sahiptir. TMK m. 755'e göre hangisi doğrudur?
    siklar:
      - "Karar diğer malikleri bağlar; çünkü maliklerin üçte ikisi karar vermiştir."
      - "Karar diğer malikleri bağlamaz; çünkü kararı verenler arazinin yarısından fazlasına sahip değildir."
      - "Karar, beyanlar sütununa yazılırsa diğer malikleri bağlar."
      - "Bu tür iyileştirme kararları yalnız bütün maliklerin oybirliğiyle alınabilir."
    dogru: 1
    aciklama: |
      TMK m. 755/1, ortak girişimle yapılabilecek iyileştirme işlerinde arazinin yarısından fazlasına sahip bulunmak koşuluyla maliklerin üçte ikisinin karar vermesini arar. Burada malik sayısı (20/30) yeterlidir ama kararı verenler arazinin yalnız %40'ına sahip olduğundan koşul gerçekleşmemiştir. Beyan kaydı bağlayıcılığı sağlamaz; kararın alınmış olması gerekir. Oybirliği de aranmaz.

  - soru: |
      Murat, Hasan'ın arazisindeki kaynaktan su almak için Hasan'la adi yazılı bir anlaşma yapmış, ancak tescil yapılmamıştır. TMK m. 756'ya göre hukuki durum nedir?
    siklar:
      - "Adi yazılı anlaşmayla irtifak kurulmuştur; tescil yalnız açıklayıcıdır."
      - "Murat kaynağın mülkiyetini araziden ayrı olarak kazanmıştır."
      - "Başkasının arazisinde bulunan kaynak üzerindeki hak irtifak olarak tapu kütüğüne tescille kurulur; tescil olmadığından Murat lehine irtifak hakkı doğmamıştır."
      - "Anlaşma tescil edilmese de tescil edilmiş gibi bütün üçüncü kişilere karşı ileri sürülebilir."
    dogru: 2
    aciklama: |
      TMK m. 756/2'ye göre başkasının arazisindeki kaynak üzerindeki hak, bir irtifak olarak tapu kütüğüne tescille kurulur. Tescil yapılmadığından irtifak doğmamıştır. Kaynağın mülkiyeti ancak kaynadığı arazinin mülkiyetiyle birlikte kazanılabileceği için (TMK m. 756/1) Murat araziden bağımsız olarak kaynağın maliki de olamaz.

  - soru: |
      Emre, arazisinde sondaj yaparak yeraltı suyu çıkarmış ve "arazimin maliki olduğum için altındaki suyun da maliki olurum" demektedir. TMK m. 756'ya göre hangisi doğrudur?
    siklar:
      - "Emre arazisinin altındaki yeraltı sularının mülkiyetini arazisiyle birlikte kazanır."
      - "Yeraltı suları da kaynak gibi arazinin bütünleyici parçasıdır."
      - "Yeraltı suları ancak tescille özel mülkiyete geçer."
      - "Yeraltı suları kamu yararına ait sulardandır; arza malik olmak, altındaki yeraltı sularına da malik olmak sonucunu doğurmaz."
    dogru: 3
    aciklama: |
      TMK m. 756/3: yeraltı suları kamu yararına ait sulardandır ve arza malik olmak, altındaki yeraltı sularına da malik olmak sonucunu doğurmaz. 167 sayılı Kanun m. 1 de yeraltı sularının umumi sular meyanında olup Devletin hüküm ve tasarrufu altında bulunduğunu söyler. Bütünleyici parça kuralı kaynaklar içindir (TMK m. 756/1).

  - soru: |
      Hasan'ın evinin içme suyunu sağlayan, önemli ölçüde yararlanılan kaynağını komşu X İnşaat'ın temel kazısı kısmen kesmiştir. Bilirkişi, X'in kazıyı kasten yapmadığını ve ihmali bulunmadığını belirtmiştir. TMK m. 757'ye göre hangisi doğrudur?
    siklar:
      - "X, kast ve ihmal bulunmadığı için hiçbir koşulda sorumlu tutulamaz."
      - "Zarar kasten veya ihmal yoluyla verilmemişse hâkim, tazminatın gerekip gerekmediğini, gerekiyorsa miktar ve türünü takdir eder."
      - "X her hâlde zararın tamamını ödemekle yükümlüdür; hâkimin takdir yetkisi yoktur."
      - "Hasan yalnız kaynağın eski hâle getirilmesini isteyebilir; tazminat isteyemez."
    dogru: 1
    aciklama: |
      TMK m. 757/1 kaynağı kazı veya yapı yüzünden kısmen olsun keserek ya da kirleterek zarar veren kimseyi zararı gidermekle yükümlü kılar. Zarar kasten veya ihmal yoluyla verilmemişse hâkim tazminatın gerekip gerekmediğini, gerekiyorsa miktar ve türünü takdir eder (TMK m. 757/2). Sorumluluğun tümüyle ortadan kalktığı ya da hâkimin takdirinin bulunmadığı yönündeki seçenekler metne uymaz. Eski duruma getirme ayrıca TMK m. 758 kapsamındadır.

  - soru: |
      TMK m. 758'e göre kesilen veya kirletilen kaynağın olabildiği ölçüde eski duruma getirilmesi, hangi kaynak bakımından doğrudan istenebilir?
    siklar:
      - "Önemli ölçüde yararlanılıp yararlanılmadığına bakılmaksızın her kaynak bakımından"
      - "Yalnız kamuya ait kaynaklar bakımından"
      - "Bir taşınmazda oturmak, onu işletmek veya bir yerin içme ya da kullanma suyunu sağlamak için gerekli olan kaynak bakımından"
      - "Yalnız tescille irtifak konusu yapılmış kaynak bakımından"
    dogru: 2
    aciklama: |
      TMK m. 758/1 oturma, işletme ya da içme veya kullanma suyunu sağlama için gerekli kaynaklar kesilir ve kirletilirse kaynağın olabildiği ölçüde eski duruma getirilmesinin istenebileceğini söyler. Bunlar dışında eski duruma getirme ancak özel hâller haklı gösterirse istenebilir (TMK m. 758/2); yani her kaynak için doğrudan istenmez.

  - soru: |
      Can ve Deniz'in komşu çeşmeleri aynı ortak ana kaynaktan beslenmektedir ve su azalınca anlaşmazlık çıkmıştır. TMK m. 759'a göre hangisi doğrudur?
    siklar:
      - "Maliklerden her biri kaynakların birlikte tutulmasını ve suyun hak sahiplerine o zamana kadarki yararlanmaları oranında dağıtılmasını isteyebilir; ortak tesis masrafları da yararlanma oranında üstlenilir."
      - "Su, malikler arasında eşit paylarla bölüştürülür; masraflar da eşit karşılanır."
      - "Yalnız arazisi daha büyük olan malik su isteyebilir."
      - "Ana kaynak, ilk tescil edilen çeşmenin sahibine aittir."
    dogru: 0
    aciklama: |
      TMK m. 759/1'e göre ortak ana kaynaktan beslenen komşu kaynakların maliklerinden her biri, kaynakların birlikte tutulmasını ve suyun o zamana kadarki yararlanmaları oranında dağıtılmasını isteyebilir. Ortak tesis masrafları da yararlanma oranında üstlenilir (TMK m. 759/2). Eşit bölüşme, arazi büyüklüğü ya da tescil sırası ölçütü metinde yoktur.

  - soru: |
      Fatma, evi için gerekli suyu başka yoldan aşırı zahmet ve gidere katlanmaksızın sağlayamamaktadır. Komşusu Hasan'ın kaynağında Hasan'ın ihtiyacından fazla su vardır. Fatma ne isteyebilir?
    siklar:
      - "Hasan'ın kaynağının mülkiyetinin tam bedelle kendisine devrini"
      - "Hasan'ın kendi ihtiyacı için gerekli suyun da bedelsiz paylaşılmasını"
      - "Hasan'ın ihtiyacından fazla olan suyu tam bedel karşılığında almasını sağlayacak bir irtifak (zorunlu su irtifakı) kurulmasını; kurulurken öncelikle kaynak sahibinin menfaati gözetilir"
      - "Komşuluk hükümleri gereği bedelsiz ve süresiz su kullanma hakkını"
    dogru: 2
    aciklama: |
      TMK m. 761/1, gerekli sudan yoksun olan ve bunu aşırı zahmet ve gidere katlanmadan başka yoldan sağlayamayan malike, komşusunun ihtiyacından fazla olan suyu tam bedel karşılığında almasını sağlayacak bir irtifak kurulmasını isteme hakkı verir. Öncelikle kaynak sahibinin menfaati gözetilir (TMK m. 761/2). Kaynağın mülkiyetinin devri, bedelsiz kullanım veya komşunun kendi ihtiyacı olan suya el koyma hükümde yer almaz.

  - soru: |
      Ali ve Burak'ın tarlaları genel yola çıkış bakımından yetersizdir. 2025'te arabulucuya başvurmadan komşu Cem aleyhine asliye hukuk mahkemesinde zorunlu geçit davası açmışlar; dava sürerken arabulucuya başvurmak için mahkemeden süre istemektedirler. Mahkeme ne yapar?
    siklar:
      - "Davayı görevsizlik nedeniyle sulh hukuk mahkemesine gönderir."
      - "HMK m. 115/2 gereği kesin süre verir; süre içinde son tutanak sunulursa davaya devam eder."
      - "Arabuluculuk dava şartı olmadığı için esasa girer."
      - "Arabulucuya başvurulmadan dava açıldığı için dava şartı yokluğu sebebiyle usulden reddeder."
    dogru: 3
    aciklama: |
      HUAK m. 18/B/1-ç, komşu hakkından kaynaklanan uyuşmazlıklarda dava açılmadan önce arabulucuya başvurulmasını dava şartı sayar; başvurulmadan dava açıldığı anlaşılırsa dava usulden reddedilir (HUAK m. 18/A/2). Yargıtay 7. Hukuk Dairesi zorunlu geçit davasını bu kapsamda sayar ve komşu hakkına ilişkin zorunlu arabuluculuğun HMK m. 115/2 anlamında sonradan tamamlanabilecek bir dava şartı olmadığını, süre verilmeyeceğini kabul eder. Görevli mahkeme de zaten asliye hukuktur (HMK m. 2).

olaylar:
  - olay: |
      Sakarya'da Ali'nin tarlası dört yandan komşu parsellerle çevrilidir ve genel yola çıkış için kullanabileceği bir geçidi yoktur. Tarla eskiden Ali ile kız kardeşi Ayşe'nin ortak arazisinin parçasıydı. Ortak arazi paylaşılırken yola bakan kısım Ayşe'ye, içerideki kısım Ali'ye verilmiştir. Genel yol ile Ali'nin tarlası arasında Ayşe'nin parseli ve Mehmet'in bahçesi bulunmaktadır. Mehmet'in bahçesinden geçen güzergâh genel yola en kısa ulaşımı sağlamaktadır.

      Ali, 2025 yılında, önce arabulucuya başvurmadan, "en kısa ve en ucuz yol Mehmet'in bahçesinden geçiyor" diyerek Mehmet aleyhine asliye hukuk mahkemesinde tam bedel karşılığı geçit hakkı tanınması için dava açar. Mehmet cevap dilekçesinde, önce Ayşe'ye başvurulması gerektiğini, ayrıca Ali'nin arabulucuya başvurmadığını ileri sürer. Ali, mahkemeden arabulucuya başvurup son tutanağı sunmak için süre verilmesini ister.

      1. Ali'nin dayanabileceği hüküm nedir ve şartları nelerdir?
      2. Geçit isteminin hangi komşuya yöneltileceği bakımından Mehmet'in itirazını değerlendiriniz. "En kısa yol" gerekçesi yeterli midir?
      3. Arabulucuya başvurulmamış olması davanın akıbetini nasıl etkiler? Ali, dava sürerken eksikliği giderebilir mi?
      4. Davada görevli mahkeme hangisidir?
    olcut:
      - {tespit: "Zorunlu geçidin şartları: genel yola yeterli geçit bulunmaması ve tam bedel; Ali'nin bu hükme dayanabilmesi", puan: 20, madde: "TMK m. 747"}
      - {tespit: "İstemin önce önceki mülkiyet ve yol durumuna göre en uygun düşen komşuya (Ayşe), sonra en az zarar görecek olana yöneltilmesi", puan: 25, madde: "TMK m. 747"}
      - {tespit: "Geçidin iki tarafın menfaati gözetilerek belirlenmesi; en kısa yolun tek başına belirleyici olmaması", puan: 10, madde: "TMK m. 747"}
      - {tespit: "Zorunlu geçit davasının komşu hakkından kaynaklanan uyuşmazlık olması ve arabulucuya başvurmanın dava şartı olması", puan: 15, madde: "HUAK m. 18/B"}
      - {tespit: "Arabulucuya başvurulmadan açılan davanın usulden reddedilmesi; dava açıldıktan sonra başvurunun eksikliği gidermemesi ve süre verilmemesi", puan: 20, madde: "HUAK m. 18/A"}
      - {tespit: "Görevli mahkemenin asliye hukuk mahkemesi olması", puan: 10, madde: "HMK m. 2"}
    cozum: |
      **Nitelendirme:** Ali, taşınmazından genel yola çıkış için yeterli geçidi olmayan bir maliktir ve komşu taşınmaz üzerinden bedel karşılığı geçit istemektedir. Olay, zorunlu geçit (TMK m. 747) ile bu davanın usul şartı olan arabuluculuğu birleştirir.

      **Hukuki sorunlar:** (1) Zorunlu geçidin şartları, (2) geçit isteminin hangi komşuya yöneltileceği, (3) arabulucuya başvurulmamasının sonucu, (4) görevli mahkeme.

      **İlgili hükümler:** TMK m. 747/1-3; HUAK m. 18/B/1-ç ve HUAK m. 18/A/2; HMK m. 2, HMK m. 4 ve HMK m. 115/2.

      **Değerlendirme:**

      *1. Zorunlu geçit:* TMK m. 747/1'e göre taşınmazından genel yola çıkmak için yeterli geçidi bulunmayan malik, tam bir bedel karşılığında bir geçit hakkı tanınmasını komşularından isteyebilir. Ali'nin tarlasının dört yandan çevrili olması ve kullanabileceği bir geçidinin bulunmaması, hükmün aradığı durumdur. Karşılığında tam bedel ödemesi gerekir. Yargıtay uygulamasında bedel bilirkişiyle belirlenir ve hükümden önce depo ettirilir; bu, kanun metninde yazılı bir kural değildir.

      *2. Kime karşı?* TMK m. 747/2'ye göre hak, ilk önce, kendisinden bu geçidin istenmesi önceki mülkiyet ve yol durumuna göre en uygun düşen komşuya, daha sonra bundan en az zarar görecek olana karşı kullanılır. Ali'nin tarlası eskiden Ayşe'yle ortak arazinin parçası olup yola bakan kısım paylaşmada Ayşe'ye kalmıştır; önceki mülkiyet ve yol durumu bakımından önce Ayşe'nin parseli düşünülmelidir. Ali'nin yalnız "en kısa ve en ucuz" olduğu gerekçesiyle Mehmet'i seçmesi kanundaki sıraya uygun değildir. Ayrıca zorunlu geçit iki tarafın menfaati gözetilerek belirlenir (TMK m. 747/3); Yargıtay Hukuk Genel Kurulu da davacı için en kısa ve en ucuz olanı değil, yüklü taşınmaz bakımından objektif olarak en az külfet doğuran seçeneği arar. Bu bakımdan Mehmet'in itirazı kanundaki sıralamaya dayanır. Ancak dava aşağıdaki usul engeline takılacağı için esas incelemeye gelmeyecektir.

      *3. Arabuluculuk:* HUAK m. 18/B/1-ç, komşu hakkından kaynaklanan uyuşmazlıklarda dava açılmadan önce arabulucuya başvurulmuş olmasını dava şartı sayar. Yargıtay 7. Hukuk Dairesi zorunlu geçit davasını bu kapsamda değerlendirir. Ali 2025'te dava açtığı için, 1/9/2023'ten önce açılmış davalara ilişkin geçiş hükmü de söz konusu değildir. Arabulucuya başvurulmadan dava açıldığının anlaşılması hâlinde herhangi bir işlem yapılmaksızın dava, dava şartı yokluğu sebebiyle usulden reddedilir (HUAK m. 18/A/2). Yargıtay, komşu hakkına ilişkin zorunlu arabuluculuğun HMK m. 115/2 bakımından sonradan tamamlanabilecek bir dava şartı olmadığını kabul eder; tamamlama için süre verilmez. Ali'nin dava sürerken arabulucuya başvurup son tutanağı sunması eksikliği gidermez.

      *4. Görev:* Malvarlığı haklarına ilişkin davalarda aksine düzenleme bulunmadıkça görevli mahkeme asliye hukuk mahkemesidir (HMK m. 2). Geçit davası HMK m. 4'te sayılan sulh hukuk işleri arasında yer almaz. Ali'nin dava açtığı mahkeme görevlidir.

      **Sonuç:**
      - Ali, TMK m. 747'ye dayanarak tam bedelle geçit isteyebilir.
      - İstem önce önceki mülkiyet ve yol durumuna göre en uygun düşen komşuya (Ayşe), sonra en az zarar görecek olana yöneltilir; en kısa yol tek ölçüt değildir.
      - Arabulucuya başvurulmadan açıldığı için dava usulden reddedilir; sonradan başvuru eksikliği gidermez.
      - Görevli mahkeme asliye hukuktur.

  - olay: |
      Zeynep ile Mehmet komşu bahçe sahibidir. Zeynep'in bahçesindeki ceviz ağacının dalları Mehmet'in ekili bahçesine taşmış, dallar Mehmet'in serasının camlarına değip camları kırmaktadır. Mehmet, Zeynep'e noter aracılığıyla "dalları iki ay içinde kaldır" ihtarı gönderir; Zeynep hiçbir şey yapmaz. Süre dolunca Mehmet dalları keser. Ayrıca Mehmet'in bahçesinin diğer sınırında bir orman bulunmaktadır; ormandaki ağaçların dalları da Mehmet'in bahçesine taşmaktadır ve Mehmet aynı yöntemle bunları da kesmeyi düşünmektedir.

      Aynı yaz Zeynep, arazisindeki göleti boşaltır. Gölet suyu öteden beri Zeynep'in arazisinden Mehmet'in arazisine doğal olarak akan bir yoldan boşalmakta ve Mehmet'in fidelerine zarar vermektedir. Zeynep ayrıca üstteki arazisine set yaparak yağmur sularını tamamen tutmayı da düşünmektedir.

      1. Mehmet'in ceviz dallarını kesmesi hukuka uygun mudur? Kesilen dallar kimin olur?
      2. Mehmet dalların taşmasına katlanmaya karar verseydi cevizler bakımından durum ne olurdu?
      3. Mehmet ormandaki ağaçlar bakımından aynı hakkı kullanabilir mi?
      4. Göletten boşaltılan sular bakımından Mehmet tazminat isteyebilir mi? Başka ne isteyebilir?
      5. Zeynep'in yağmur sularını setle tamamen tutma planı hakkında ne söylenebilir?
    olcut:
      - {tespit: "Dal ve kök kesmenin şartları: zarar, komşunun istemi, uygun süre; şartların gerçekleşmesi ve kesmenin hukuka uygunluğu", puan: 25, madde: "TMK m. 740"}
      - {tespit: "Kesilen dal ve köklerin kesen komşunun mülkiyetine geçmesi", puan: 10, madde: "TMK m. 740"}
      - {tespit: "Ekilmiş veya üzerine yapı yapılmış arazisine dalların taşmasına katlanan komşunun meyveleri toplama hakkı", puan: 15, madde: "TMK m. 740"}
      - {tespit: "Komşu ormanlar hakkında dal-kök hükümlerinin uygulanmaması", puan: 10, madde: "TMK m. 740"}
      - {tespit: "Öteden beri alta doğal akan suyun fazla boşaltılmasına tazminat isteme hakkı olmaksızın katlanılması", puan: 15, madde: "TMK m. 743"}
      - {tespit: "Zarar görülüyorsa gideri üstteki malike ait mecra isteme hakkı", puan: 15, madde: "TMK m. 743"}
      - {tespit: "Üstteki malikin suyu yalnız kendi taşınmazı için zorunlu ölçüde tutabilmesi", puan: 10, madde: "TMK m. 742"}
    cozum: |
      **Nitelendirme:** Olay iki ayrı komşuluk ilişkisini içerir: taşan bitki kısımları (TMK m. 740) ve su (TMK m. 742 ve TMK m. 743). İki grup da ilgili hükümlerin şartlarının sırayla denetlenmesini gerektirir. Camların zararının tazmini ayrı bir sorundur ve bu notun konusu dışındadır (genel komşuluk sorumluluğu için TMK m. 730).

      **Hukuki sorunlar:** (1) Dalların kesilmesi ve mülkiyetine geçmesi, (2) meyve hakkı, (3) komşu orman, (4) fazla suyun boşaltılması, (5) suyun tutulması.

      **İlgili hükümler:** TMK m. 740/1-3; TMK m. 742/2-3; TMK m. 743/1-2.

      **Değerlendirme:**

      *1. Dalların kesilmesi:* TMK m. 740/1'e göre komşunun arazisine taşarak zarar veren dal ve kökler, komşunun istemi üzerine uygun bir süre içinde kaldırılmazsa komşu bunları kesip kendi mülkiyetine geçirebilir. Olayda dallar taşmış ve zarar vermektedir (camlar kırılmıştır); Mehmet noter ihtarıyla kaldırılmasını istemiş ve iki aylık süre vermiştir. Kanun süreyi gün olarak belirlemediğinden iki ayın uygun olup olmadığı olayın şartlarına göre değerlendirilir; iki ayın uygun olmadığını gösteren bir olgu yoktur. Süre geçtiği ve Zeynep dalları kaldırmadığı için Mehmet'in kesmesi hukuka uygundur. Kesilen dallar Mehmet'in mülkiyetine geçer.

      *2. Meyve hakkı:* TMK m. 740/2'ye göre ekilmiş veya üzerine yapı yapılmış arazisine dalların taşmasına katlanan komşu, bu dallarda yetişen meyveleri toplama hakkına sahip olur. Mehmet'in bahçesi ekilidir; dalların taşmasına katlanmayı seçseydi taşan dallardaki cevizleri toplayabilirdi.

      *3. Orman:* TMK m. 740/3'e göre dal ve kök hükümleri komşu ormanlar hakkında uygulanmaz. Mehmet, ormandaki ağaçların dalları için TMK m. 740'a dayanarak istem ve süre yoluyla kesme ve mülkiyete geçirme hakkı kazanamaz.

      *4. Fazla su:* Gölet suyu öteden beri Mehmet'in arazisine doğal olarak aktığı için Mehmet, fazla suyun boşaltılması sırasında da bu sulara tazminat isteme hakkı olmaksızın katlanmak zorundadır (TMK m. 743/1). Fidelerine zarar verdiği için tazminat isteyemez. Ancak boşaltma dolayısıyla zarar gördüğünden, gideri Zeynep'e ait olmak üzere kendi arazisinde yapılacak mecrayla suyun akıtılmasını isteyebilir (TMK m. 743/2).

      *5. Yağmur suları:* TMK m. 742/1'e göre alttaki malik üstteki araziden doğal olarak akan yağmur, kar ve tutulmamış kaynak sularının akışına katlanır; komşulardan hiçbiri bu suların akışını diğerinin zararına değiştiremez (TMK m. 742/2). Üstteki malik, alttaki taşınmaza gerekli olan suyu ancak kendi taşınmazı için zorunlu olduğu ölçüde tutabilir (TMK m. 742/3). Zeynep'in yağmur sularını tamamen tutması bu sınırı aşıyorsa hukuka aykırıdır.

      **Sonuç:**
      - Mehmet'in dalları kesmesi hukuka uygundur; kesilen dallar onun mülkiyetine geçer.
      - Katlansaydı ekili arazisine taşan dallardaki cevizleri toplayabilirdi.
      - Ormanın dalları için TMK m. 740 uygulanmaz.
      - Fazla suya tazminatsız katlanılır, ama gideri Zeynep'e ait mecra istenebilir.
      - Zeynep yağmur sularını yalnız kendi taşınmazı için zorunlu ölçüde tutabilir.

  - olay: |
      Hasan'ın arazisinde bulunan doğal kaynak, evinin tek içme suyu kaynağıdır ve yıllardır önemli ölçüde yararlanılmaktadır. Komşu X İnşaat Ltd. Şti., kendi arsasında temel kazısı yaparken bu kaynağı kısmen keser. Hasan'ın kaynaktan aldığı su azalır. Bilirkişi raporunda, X'in kazıyı kasten yapmadığı ve ihmalinin bulunmadığı, ancak kazının kaynağı kısmen kestiği belirtilir.

      Hasan ayrıca, X'in kendi arsasında açtığı sondaj kuyusundan çıkan suyun Hasan'ın arazisinin de altından geçtiğini, arazisinin maliki olduğu için kuyudaki suyun kendisine ait olduğunu ve X'in suyu kullanamayacağını ileri sürmektedir. Fatma bu tartışmadan bağımsız olarak, Hasan'ın kaynağından su alabilmek için hukuki bir yol aramaktadır.

      Hasan'ın komşusu Fatma'nın evi için gerekli suyu başka yoldan aşırı zahmet ve gidere katlanmadan sağlama imkânı yoktur. Hasan'ın kaynağında kendi ihtiyacından fazla su bulunmaktadır ve Fatma bu fazla suyu almak istemektedir.

      1. Kaynak kimin mülkiyetindedir? X İnşaat'ın sorumluluğu nedir?
      2. Hasan kaynağın eski duruma getirilmesini isteyebilir mi?
      3. Hasan'ın sondaj kuyusundaki suya ilişkin iddiasını değerlendiriniz.
      4. Fatma ne isteyebilir? Hangi şartlar aranır ve kimin menfaati öncelikle gözetilir?
    olcut:
      - {tespit: "Kaynağın arazinin bütünleyici parçası olması ve mülkiyetinin Hasan'da bulunması", puan: 15, madde: "TMK m. 756"}
      - {tespit: "Önemli ölçüde yararlanılan kaynağı kazıyla kısmen kesenin zararı gidermekle yükümlü olması", puan: 20, madde: "TMK m. 757"}
      - {tespit: "Kast veya ihmal yoksa tazminatın gerekip gerekmediğini, miktar ve türünü hâkimin takdir etmesi", puan: 15, madde: "TMK m. 757"}
      - {tespit: "İçme suyunu sağlayan kaynak bakımından olabildiği ölçüde eski duruma getirme isteme hakkı", puan: 15, madde: "TMK m. 758"}
      - {tespit: "Yeraltı sularının kamu yararına ait olması; arza malik olmanın yeraltı suyuna malik olmayı sağlamaması", puan: 15, madde: "TMK m. 756"}
      - {tespit: "Zorunlu su irtifakının şartları: su yoksunluğu, başka yoldan aşırı zahmet ve gidersiz sağlayamama, komşunun ihtiyaç fazlası su, tam bedel", puan: 15, madde: "TMK m. 761"}
      - {tespit: "Zorunlu su irtifakının kurulmasında öncelikle kaynak sahibinin menfaatinin gözetilmesi", puan: 5, madde: "TMK m. 761"}
    cozum: |
      **Nitelendirme:** Olayda üç ayrı sorun vardır: kaynağın hukuki durumu ve kazı yüzünden kesilmesi (TMK m. 756 - TMK m. 758), sondaj kuyusundaki suyun yeraltı suyu olarak niteliği (TMK m. 756/3) ve komşunun susuz kalması hâlinde zorunlu su irtifakı (TMK m. 761).

      **Hukuki sorunlar:** (1) Kaynağın mülkiyeti ve X'in sorumluluğu, (2) eski duruma getirme, (3) Hasan'ın kuyudaki suya ilişkin iddiası, (4) Fatma'nın istemi.

      **İlgili hükümler:** TMK m. 756/1 ve TMK m. 756/3; TMK m. 757; TMK m. 758/1; TMK m. 761/1-2; 167 sayılı Kanun m. 1.

      **Değerlendirme:**

      *1. Mülkiyet ve sorumluluk:* TMK m. 756/1'e göre kaynaklar arazinin bütünleyici parçasıdır ve mülkiyetleri ancak kaynadıkları arazinin mülkiyeti ile birlikte kazanılabilir. Hasan arazinin maliki olduğundan kaynağın da maliki olur. TMK m. 757/1'e göre önemli ölçüde yararlanılan kaynakları kazı, yapı veya benzeri faaliyetler yüzünden kısmen olsun keserek malikine zarar veren kimse zararı gidermekle yükümlüdür. Olayda kaynak kısmen kesilmiş ve yıllardır önemli ölçüde yararlanılan bir kaynaktır. Bilirkişiye göre X kasten veya ihmal yoluyla hareket etmemiştir; bu durumda hâkim, tazminatın gerekip gerekmediğini, gerekiyorsa miktar ve türünü takdir eder (TMK m. 757/2). Kusursuzluk X'i sorumluluktan kendiliğinden kurtarmaz, ama tazminat hâkimin takdirine bağlanır.

      *2. Eski duruma getirme:* Kaynak Hasan'ın evinin içme suyunu sağlamaktadır. TMK m. 758/1'e göre bir yerin içme ya da kullanma suyunu sağlamak için gerekli olan kaynaklar kesilirse, kaynağın olabildiği ölçüde eski duruma getirilmesi istenebilir. Hasan bu istemde bulunabilir.

      *3. Sondaj kuyusu:* TMK m. 756/3'e göre yeraltı suları kamu yararına ait sulardandır ve arza malik olmak, altındaki yeraltı sularına da malik olmak sonucunu doğurmaz. 167 sayılı Kanun m. 1'e göre yeraltı suları umumi sular meyanında olup Devletin hüküm ve tasarrufu altındadır. Hasan arazisinin altından geçtiği gerekçesiyle kuyudaki suyun maliki olduğunu ileri süremez. X'in kuyudan yararlanmasının hukuka uygunluğu ise yeraltı sularına ilişkin özel düzenlemelere bağlıdır; bu bu notun konusu dışındadır.

      *4. Zorunlu su:* TMK m. 761/1'e göre evi, arazisi veya işletmesi için gerekli sudan yoksun olup bunu aşırı zahmet ve gidere katlanmaksızın başka yoldan sağlayamayan malik, komşusundan onun ihtiyacından fazla olan suyu tam bedel karşılığında almasını sağlayacak bir irtifak kurulmasını isteyebilir. Fatma'nın su yoksunluğu ve başka yoldan sağlayamama durumu ile Hasan'ın ihtiyaç fazlası suyunun varlığı şartları karşılar. İrtifak tam bedelle kurulur. Kurulmasında öncelikle kaynak sahibinin, yani Hasan'ın menfaati gözetilir (TMK m. 761/2). Durum değişirse irtifakın değiştirilmesi veya kaldırılması istenebilir (TMK m. 761/3).

      **Sonuç:**
      - Kaynak Hasan'ındır (arazinin bütünleyici parçası).
      - X zararı gidermekle yükümlüdür; kast veya ihmal bulunmadığından tazminatın gerekip gerekmediğini ve miktarını hâkim takdir eder.
      - İçme suyu kaynağı olduğundan eski duruma getirme istenebilir.
      - Hasan'ın kuyudaki sudan mülkiyet iddiası yerinde değildir; yeraltı suları kamu yararınadır.
      - Fatma tam bedelle zorunlu su irtifakı isteyebilir; Hasan'ın menfaati öncelikle gözetilir.

kartlar:
  - on: "TMK m. 738/1'e göre kazı ve yapıda yasak ne?"
    arka: "Komşunun topraklarını sarsmak veya tehlikeye düşürmek ya da üzerlerindeki tesisleri etkilemek suretiyle zarar vermek. Kurallara aykırı yapılara taşkın yapı hükümleri uygulanır (TMK m. 738/2)."
  - on: "Taşan dal ve kökleri komşu hangi şartlarla keser?"
    arka: "Dal ve kök zarar vermeli, komşu kaldırılmasını istemeli, bitki maliki uygun süre içinde kaldırmamış olmalı. Sonra keser ve kendi mülkiyetine geçirir (TMK m. 740/1)."
  - on: "Dallarda yetişen meyveleri kim toplar?"
    arka: "Ekilmiş veya üzerine yapı yapılmış arazisine dalların taşmasına katlanan komşu (TMK m. 740/2)."
  - on: "Dal-kök kuralları komşu ormana uygulanır mı?"
    arka: "Hayır, komşu ormanlar hakkında uygulanmaz (TMK m. 740/3)."
  - on: "Doğal akan suyla ilgili üç kural (TMK m. 742)?"
    arka: "Alttaki malik üstten doğal akan sulara katlanır; akış komşunun zararına değiştirilemez; üstteki malik suyu yalnız kendi taşınmazı için zorunlu ölçüde tutabilir."
  - on: "Fazla suyun boşaltılmasında alttaki malik ne yapabilir?"
    arka: "Suyu öteden beri alta akan arazide tazminatsız katlanır; zarar görüyorsa gideri üsttekine ait mecra isteyebilir (TMK m. 743)."
  - on: "Mecraya katlanmanın şartları (TMK m. 744/1)?"
    arka: "Başka yerden geçirilmesi olanaksız veya aşırı masraflı olmalı; zararın tamamı önceden ödenmelidir."
  - on: "Kamulaştırmaya bağlı mecrada komşuluk hükümleri uygulanır mı?"
    arka: "Hayır, uygulanmaz (TMK m. 744/2)."
  - on: "Mecra hakkı tapuya nasıl yansır?"
    arka: "Hak sahibinin istemi üzerine ve giderleri ödemesi koşuluyla tescil edilir (TMK m. 744/3)."
  - on: "Olağanüstü durumda mecra parçasının satın alınmasını kim ister?"
    arka: "Yükümlü malik, zararını tam karşılayan bedelle (TMK m. 745/2)."
  - on: "Mecranın yer değiştirme gideri kime aittir?"
    arka: "Kural olarak mecra hakkı sahibine; özel durumlar haklı gösterirse malik de uygun kısmına katılır (TMK m. 746)."
  - on: "Zorunlu geçidin şartları (TMK m. 747/1)?"
    arka: "Taşınmazdan genel yola çıkış için yeterli geçit bulunmaması; geçit tam bedel karşılığında istenir."
  - on: "Zorunlu geçit istemi kime yöneltilir?"
    arka: "Önce önceki mülkiyet ve yol durumuna göre en uygun düşen komşuya, sonra bundan en az zarar görecek olana. Geçit iki tarafın menfaati gözetilerek belirlenir (TMK m. 747/2-3)."
  - on: "Geçit bedelinin hükümden önce depo edilmesi kanun kuralı mı?"
    arka: "Hayır, Yargıtay uygulamasıdır. Metinde (TMK m. 744/1'in aksine) 'önceden ödenmesi' ifadesi yoktur. Tarım arazisinde 2,5-3 m genişlik de Yargıtay ölçüsüdür."
  - on: "TMK m. 748/1'deki geçitler hangi hukuka tâbidir?"
    arka: "Geçici girme, tarla yolu, hayvan sulama yolu, kış geçidi, tomruk kaydırma yolu ve benzerleri özel kanun hükümlerine; yoksa yerel âdete (TMK m. 748/1-2)."
  - on: "Doğrudan kanundan doğan geçit hakları tapuda nasıl yer alır?"
    arka: "Tescilsiz doğar; sürekli nitelikte olanlar beyanlar sütununda gösterilir (TMK m. 748/3)."
  - on: "TMK m. 755'te ortak iyileştirme kararı için çoğunluk?"
    arka: "Arazinin yarısından fazlasına sahip bulunmak koşuluyla maliklerin üçte ikisi; diğer malikler de uymak zorundadır, karar beyanlar sütununda gösterilir."
  - on: "Kaynak ile yeraltı suyu farkı?"
    arka: "Kaynak arazinin bütünleyici parçasıdır (TMK m. 756/1); yeraltı suyu kamu yararına ait sudur, arza malik olmak ona malik olmayı sağlamaz (TMK m. 756/3; 167 sayılı Kanun m. 1)."
  - on: "Başkasının arazisindeki kaynakta hak nasıl kurulur?"
    arka: "İrtifak olarak tapu kütüğüne tescille (TMK m. 756/2)."
  - on: "TMK m. 757 ile TMK m. 758 farkı?"
    arka: "TMK m. 757 kaynağı kesen veya kirletenin tazminatı (kast veya ihmal yoksa hâkim takdir eder); TMK m. 758 eski duruma getirme, oturma, işletme, içme-kullanma suyu kaynaklarında doğrudan istenebilir."
  - on: "Ortak ana kaynaktan beslenen kaynaklarda su nasıl dağıtılır?"
    arka: "O zamana kadarki yararlanma oranında; ortak tesis masrafları da yararlanma oranında üstlenilir (TMK m. 759)."
  - on: "Zorunlu su irtifakının şartları (TMK m. 761)?"
    arka: "Su yoksunluğu; başka yoldan aşırı zahmet ve gidersiz sağlayamama; komşunun ihtiyaç fazlası suyu; tam bedel. Öncelikle kaynak sahibinin menfaati gözetilir."
  - on: "Zorunlu geçit davasında arabuluculuk?"
    arka: "Komşu hakkından kaynaklanan uyuşmazlık olduğundan önceden arabulucuya başvurmak dava şartıdır; başvurulmadan açılan dava usulden reddedilir, sonradan başvuru eksikliği gidermez (HUAK m. 18/B/1-ç, HUAK m. 18/A/2)."
  - on: "Zorunlu geçit davasında görevli mahkeme?"
    arka: "Asliye hukuk mahkemesi (HMK m. 2); geçit davası HMK m. 4'te sayılan sulh hukuk işleri arasında yok."
