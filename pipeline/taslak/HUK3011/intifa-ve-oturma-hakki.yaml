  - id: "686358100"
    ozet: |
      Bir belediye, akaryakıt istasyonu bulunan iki taşınmazı üzerinde, %95 payı kendisine ait bir limited şirket lehine 49 yıllığına intifa hakkı kurmuştur. Şirket bu hakka dayanarak davacıyla noterde kira sözleşmeleri yapmış ve kira kayıtları tapuya işlenmiştir; belediye sonradan kuruluş kararını iptal edip şirketi tahliye ettirmiş, intifa ve kira kayıtları terkin edilmiştir. Davacı kiracılığın tespitini, muarazanın giderilmesini ve müdahalenin önlenmesini istemiş; ilk derece mahkemesi belediye yönünden tespiti sıfat yokluğundan reddetmiş, şirket yönünden kabul etmiş, her iki davalı yönünden muarazanın giderilmesine ve müdahalenin önlenmesine karar vermiştir. Özel daire davacının alt kiracı olduğu ve asıl kira ile alt kiranın da sona erdiği gerekçesiyle bozmuş, mahkeme direnmiş, Hukuk Genel Kurulu direnme kararını oy çokluğuyla onamıştır. Genel Kurula göre intifa sonsuz kurulamaz, intifa hakkı devredilemez ve mirasçılara geçmez; TMK m. 806 yalnız kullanımın devrine izin verir ve bu devir ayni hak doğurmaz. İntifa sahibiyle kira yapan kişi alt kiracı değil asıl kiracıdır; intifa sona erse de kira kendiliğinden düşmez, eski kanundaki karşılık kıyasen uygulanarak (güncel karşılığı TBK m. 310) malik kira sözleşmesinin tarafı sayılmıştır. Oy çokluğuyla alındığından bu son nokta tartışmalıdır.
  - id: "492584100"
    ozet: |
      Evli çiftte davalı eş adına kayıtlı taşınmazdaki 1/3 pay üzerinde, davacı lehine 2011'de bedelsiz ve süresiz intifa hakkı kurulmuştur. Boşanma kararı 2013'te kesinleşmiştir. Davacı, davalının taşınmazı kendisine kullandırmadığını ileri sürerek intifaya dayalı elatmanın önlenmesi ve ecrimisil istemiş; davalı karşı davada intifanın evlilik nedeniyle kurulduğunu, boşanmayla sebebin kalktığını ileri sürerek terkin istemiştir. İlk derece mahkemesi asıl davayı reddedip karşı davayı kabul etmiş, 14. Hukuk Dairesi oybirliğiyle bozmuştur. Yargıtay'a göre intifa sebepten bağımsız bir yararlanma hakkıdır; sona erme hâlleri TMK m. 796 ve devamında gösterilmiştir, kurulma amacının ortadan kalkması bunlar arasında değildir. Malik de intifa sahibine karşı haksız kullanan sayılır; bu nedenle elatmanın önlenmesi kabul edilmeli, ecrimisil intifadan men tarihinden başlayarak hesaplatılıp intifa sahibi lehine hükmedilmeli, terkin davası reddedilmelidir.
  - id: "1100171800"
    ozet: |
      Yurt dışında yaşayan davacı, kardeşi olan davalıya ev alması için para göndermiştir. Davacıya göre yanıltılarak imzalattırılan vekâletnameye dayanılarak, davalıların çocuğu vekil sıfatıyla davacının taşınmazı üzerinde davalılar lehine 20.000 TL karşılığında sükna (oturma) hakkı kurmuştur; davacı terkin ve tahliye istemiştir. İlk derece mahkemesi davayı reddetmiş: oturma hakkının sona erme sebepleri ayrıca düzenlenmediğinden intifa hükümleri uygulanır, bu hükümlerde malikin istediği zaman hakkı sona erdirmesi öngörülmemiştir; vekâletin kötüye kullanıldığı da ispatlanamamıştır. Bölge adliye mahkemesi davacının istinafını esastan reddetmiş, davalıların vekâlet ücretine ilişkin istinafını kabul ederek hükmü düzeltmiş ve davayı yine reddetmiş; 7. Hukuk Dairesi bu kararı oybirliğiyle onamıştır. Yargıtay ayrıca gerekçe yazmamış, ilk derece ve istinaf gerekçesini genel bir onamayla benimsemiştir; "oturma hakkının sona ermesinde intifa hükümleri uygulanır, malikin tek taraflı iradesi sona erme sebebi değildir" ilkesi bu onanan gerekçeden çıkar.

sorular:
  - soru: |
      İntifa hakkı hangi konular üzerinde kurulabilir?
    siklar:
      - "Yalnız taşınmazlar üzerinde"
      - "Taşınırlar ve taşınmazlar üzerinde; haklar ve malvarlığı üzerinde kurulamaz"
      - "Taşınırlar, taşınmazlar, haklar veya bir malvarlığı üzerinde"
      - "Yalnız maddi nitelikteki, yani taşınır ve taşınmaz mallar üzerinde"
    dogru: 2
    aciklama: |
      TMK m. 794/1'e göre intifa hakkı taşınırlar, taşınmazlar, haklar veya bir malvarlığı üzerinde kurulabilir. Konunun yalnız taşınmazla ya da yalnız maddi mallarla sınırlandırılması kanuna aykırıdır; alacak ve hisse gibi haklar üzerinde de intifa kurulur. Oturma hakkı ise yalnız binada konut olarak yararlanma sağlar (TMK m. 823/1).
  - soru: |
      Bir alacak üzerinde intifa hakkı hangi yolla kurulur?
    siklar:
      - "Alacağın devri ile"
      - "Tapu kütüğüne tescil ile"
      - "Zilyetliğin devri ile"
      - "Noterde düzenlenen yazılı sözleşmenin borçluya ihbarı ile"
    dogru: 0
    aciklama: |
      TMK m. 795/1'e göre intifa hakkı taşınırlarda zilyetliğin devri, alacaklarda alacağın devri, taşınmazlarda tapu kütüğüne tescil ile kurulur. Tescil taşınmazlara, zilyetliğin devri taşınırlara özgüdür. Borçluya bildirim, alacak intifasında ödeme ve tasarruf işlemleri için önem taşır (TMK m. 820) ama kuruluş yolu değildir.
  - soru: |
      Ahmet, Bursa'daki zeytinliği üzerinde Zeynep lehine intifa hakkı kurmak için tapuda resmî senet düzenletmiştir, ancak tescil henüz yapılmamıştır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Resmî senet düzenlendiği için Zeynep intifa hakkı sahibi olmuştur"
      - "Zeynep zeytinlikte zilyet olduğu anda intifa sahibi olur"
      - "Tescil yapılmadıkça Zeynep'in zeytinlik üzerinde intifa hakkı doğmamıştır"
      - "Tescil yapılmasa da intifa hakkı, Zeynep'in tescil istemini yaptığı anda doğar"
    dogru: 2
    aciklama: |
      Taşınmazda intifa hakkı tapu kütüğüne tescil ile kurulur (TMK m. 795/1). Kurulması tescile tabi ayni hak, tescil edilmedikçe varlık kazanamaz (TMK m. 1021). Resmî senet kuruluş sözleşmesinin şeklini sağlar ama hakkı tek başına doğurmaz. Zilyetlik taşınırlarda kuruluş yoludur, taşınmazda yeterli değildir.
  - soru: |
      Selin, bir tarla üzerinde 30 yıl süreli bir intifa hakkı edinmiştir. Selin 10. yılda ölmüştür. Hukuki durum nedir?
    siklar:
      - "Hak, kalan 20 yıl boyunca Selin'in mirasçılarına geçer"
      - "Hak, gerçek kişide hak sahibinin ölümüyle sona erer; tarla maliki taşınmazda terkini isteme yetkisine sahiptir"
      - "Hak, mirasçıların rızası olmadıkça sona ermez"
      - "Süre kararlaştırıldığından hak 30 yıl dolana kadar devam eder"
    dogru: 1
    aciklama: |
      Gerçek kişilerde intifa hakkı hak sahibinin ölümüyle sona erer (TMK m. 797/1). Süre kararlaştırılmış olması hakkı en geç ölümden sonra sürdürmez. Ölüm, taşınmazlarda malike terkini isteme yetkisi verir (TMK m. 796/2). Mirasçılara geçiş olmaz.
  - soru: |
      Tüzel kişilerin intifa hakkı en çok kaç yıl devam edebilir?
    siklar:
      - "Elli yıl"
      - "Otuz yıl"
      - "Yüz yıl"
      - "Süre sınırı yoktur; tüzel kişilik devam ettiği sürece sürer"
    dogru: 2
    aciklama: |
      TMK m. 797/2'ye göre tüzel kişilerin intifa hakkı en çok yüz yıl devam edebilir. Yüz yıl sınırı yalnız tüzel kişiler içindir; gerçek kişide hak ölümle sona erer (TMK m. 797/1). Sınırsız süreli intifa kurulamaz.
  - soru: |
      Bir anonim şirket lehine süre belirtilmeden tarla üzerinde intifa hakkı kurulmuş ve tescil edilmiştir. Şirket tasfiye edilerek tüzel kişiliği sona ermiştir. İntifa hakkı bakımından sonuç nedir?
    siklar:
      - "Hak, şirketin pay sahiplerine geçer"
      - "Süre kararlaştırılmadığı için hak, kişiliğin ortadan kalkmasıyla sona erer"
      - "Hak, tasfiyeden bağımsız olarak yüz yıl devam eder"
      - "Hak, ancak malikin vazgeçme beyanıyla sona erer"
    dogru: 1
    aciklama: |
      Tüzel kişilerde intifa kararlaştırılan sürenin dolmasıyla, süre kararlaştırılmamışsa kişiliğin ortadan kalkmasıyla sona erer (TMK m. 797/1). Yüz yıl yalnız üst sınırdır; kişilik daha önce sona ererse hak da biter. Pay sahiplerine geçiş öngörülmemiştir.
  - soru: |
      Hasan'ın intifa hakkı sahibi olduğu arsa kamulaştırılmış ve kamulaştırma bedeli ödenmiştir. İntifa hakkı bakımından hangisi doğrudur?
    siklar:
      - "İntifa hakkı, kamulaştırma bedeli üzerinde devam eder"
      - "İntifa hakkı, kamulaştırmayla bedel ödenmeden sona erer ve Hasan hiçbir istemde bulunamaz"
      - "Kamulaştırma bedeli yalnız malike ödenir ve intifa sahibinin hakkı bedele yansımaz"
      - "İntifa hakkı, kamulaştırılan arsanın bulunduğu bölgedeki başka bir arsaya aktarılır"
    dogru: 0
    aciklama: |
      Sigorta ve kamulaştırma gibi durumlarda intifa hakkı, hakkın konusu yerine geçen karşılık üzerinde devam eder (TMK m. 798/2). Bu nedenle bedel malikin elinde intifa sahibinin hakkına tabi kalır.
  - soru: |
      İntifa hakkı sona erdiğinde geri verme anında ileri sürülebilecek istemlerin zamanaşımı bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Malik ve intifa sahibi tarafından ileri sürülebilecek bütün istemler, geri verme anından başlayarak bir yıl geçmekle zamanaşımına uğrar"
      - "Yalnız malikin istemleri bir yılda zamanaşımına uğrar; intifa sahibininki on yıldır"
      - "Zamanaşımı istemin öğrenilmesinden başlayarak iki yıldır"
      - "Zamanaşımı intifa hakkının sona ermesinden başlayarak beş yıldır"
    dogru: 0
    aciklama: |
      TMK m. 802'ye göre geri verme anında malik ve intifa hakkı sahibi tarafından ileri sürülebilecek bütün istem hakları, bu andan başlayarak bir yıl geçmekle zamanaşımına uğrar. Hükümde taraf ayrımı yoktur ve başlangıç geri verme anıdır; öğrenme ya da sona erme değildir.
  - soru: |
      Kerem, bir otomobil üzerinde üç yıl boyunca intifa hakkını kullanmış ve aracı olağan biçimde kullanmıştır. Hak sona erince araç malike geri verilmiş, malik kilometre ve eskime nedeniyle oluşan değer azalması için tazminat istemiştir. Hangisi doğrudur?
    siklar:
      - "Kerem, kusursuzluğunu ispat edememişse olağan kullanımdan doğan değer kaybını da öder"
      - "Kerem, malın olağan kullanılması sonucunda meydana gelen değer azalmalarından sorumlu değildir"
      - "Kerem, değer kaybının tamamından yalnız malik ispat ederse sorumludur"
      - "Kerem, değer azalmasından yalnız aracı başkasına kullandırmışsa sorumludur"
    dogru: 1
    aciklama: |
      TMK m. 800'e göre intifa hakkı sahibi, malın olağan kullanılması sonucunda meydana gelen değer azalmalarından sorumlu değildir. Yok olma veya değer azalmasında ise zararın kendi kusurundan ileri gelmediğini ispat etmek ona düşer; ancak bu ispat yükü olağan kullanımdan doğan azalma için söz konusu olmaz.
  - soru: |
      Süresi 30 Haziran'da sona erecek bir tarla intifasında, buğday 20 Haziran'da olgunlaşmıştır. Ürün kime aittir?
    siklar:
      - "Malike, çünkü hasat intifa bitmeden yapılmamıştır"
      - "Ürün, intifa süresi içinde olgunlaştığı için intifa hakkı sahibine aittir"
      - "Malik ile intifa sahibi eşit paylaşır"
      - "Ürün, intifa sahibine ancak malik izin verirse ait olur"
    dogru: 1
    aciklama: |
      İntifa hakkı süresi içinde olgunlaşan doğal ürünler intifa hakkı sahibine aittir (TMK m. 804/1). Ölçüt olgunlaşma anıdır, toplama anı değildir. Ekim yapan taraf ürünü toplayandan giderleri için ürünün değerini aşmamak üzere uygun bir bedel isteyebilir.
  - soru: |
      Zeynep, zeytinlik üzerinde tescilli intifa hakkı sahibidir. Sözleşmede şahsen kullanma şartı yoktur ve durumdan da böyle bir zorunluluk anlaşılmamaktadır. Zeynep zeytinliği Mehmet'e üç yıllığına kiralamıştır. Hangisi doğrudur?
    siklar:
      - "Kira geçersizdir, çünkü intifa hakkı devredilemez"
      - "Mehmet, kira ile intifa hakkını ayni hak olarak kazanmıştır"
      - "Kullanımın devri mümkündür; malik haklarını Mehmet'e karşı doğrudan ileri sürebilir"
      - "Kira, ancak malikin yazılı rızasıyla ve tapuya tescille geçerli olur"
    dogru: 2
    aciklama: |
      Sözleşmede aksine hüküm yoksa ve şahsen kullanma gerekmiyorsa intifa hakkının kullanılması başkasına devredilebilir; malik de haklarını devralana karşı doğrudan ileri sürebilir (TMK m. 806). İntifa hakkının kendisi devredilmez ama kullanımın devri kanunen mümkündür. Bu devir borçlandırıcıdır; Mehmet ayni hak kazanmaz.
  - soru: |
      İntifa konusu tüketilebilen bir şey ya da kıymetli evrak olduğunda malikin güvence istemesiyle ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Malik, haklarının tehlikeye düştüğünü her hâlde ispat etmek zorundadır"
      - "Malik güvenceyi ancak malı teslim ettikten sonra isteyebilir"
      - "Malik tehlikenin ispatına gerek olmaksızın teslimden önce de güvence isteyebilir"
      - "Güvence, ancak sulh hâkiminin kararıyla istenebilir"
    dogru: 2
    aciklama: |
      Konu tüketilebilen şey veya kıymetli evrak ise malik, tehlikenin ispatına gerek olmaksızın teslimden önce de güvence isteyebilir (TMK m. 808/2). Diğer hâllerde kural, haklarının tehlikeye düştüğünü malikin ispat etmesidir (TMK m. 808/1). Kıymetli evrakın güvenilir bir yere tevdi edilmesi güvence yerine geçer.
  - soru: |
      Mehmet, evini oğlu Emre'ye bağışlarken intifa hakkını kendisinde tutmuştur. Emre, babasından güvence isteyebilir mi?
    siklar:
      - "Evet, malik olarak tehlikeyi ispat etmek koşuluyla"
      - "Evet, tehlikeyi ispat etmesine gerek olmaksızın"
      - "Hayır, intifa hakkı kendisinde kalmak üzere yapılan bağışlamalarda bağışlayandan güvence istenemez"
      - "Hayır, çünkü güvence yalnız tüketilebilen şeylerde istenebilir"
    dogru: 2
    aciklama: |
      İntifa hakkı kendisinde kalmak üzere yapılan bağışlamalarda bağışlayandan güvence istenemez (TMK m. 809). Güvence isteme hakkı kural olarak malikin korunması içindir (TMK m. 808) ama bu özel durumda kanun bağışlayanı güvenceden muaf tutmuştur.
  - soru: |
      Vakıf, tarım arazisi üzerinde intifa sahibidir. Malik, vakfın kullanımının araziye zarar vereceğini belgelerle ispat etmiş ve güvence istemiştir. Vakıf kendisine tanınan uygun süre içinde güvence göstermemiştir. Hangisi doğrudur?
    siklar:
      - "Malik, doğrudan intifa hakkının iptalini isteyebilir; başka bir yol yoktur"
      - "Sulh hâkimi, yeni bir karara kadar zilyetliği kaldırıp araziyi atayacağı bir kayyıma tevdi eder"
      - "Güvence verilmezse intifa hakkı kendiliğinden sona erer"
      - "Malik, araziyi tek başına kendi adına kiraya verebilir"
    dogru: 1
    aciklama: |
      İntifa sahibi uygun süre içinde güvence göstermezse sulh hâkimi, yeni bir karara kadar intifa sahibinin zilyetliğini kaldırarak hakkın konusunu atayacağı bir kayyıma tevdi eder (TMK m. 810). Güvence verilmemesi intifayı kendiliğinden sona erdirmez ve malike tek taraflı tasarruf yetkisi vermez.
  - soru: |
      Bir evin intifa hakkı sahibi Zeynep için aşağıdakilerden hangisi, intifa süresince Zeynep'e ait giderlerdendir?
    siklar:
      - "Malı kökten yenileyen büyük yapısal değişiklik giderleri"
      - "Malikin kendi borçlarına ilişkin diğer bütün yükümlülükler"
      - "Olağan bakım ve işletme giderleri ile vergi ve resimler"
      - "Malik adına yapılan yeni bina inşa giderleri"
    dogru: 2
    aciklama: |
      Olağan bakım ve işletme giderleri, güvencesini oluşturduğu borçların faizleri, vergi ve resimler intifa süresince intifa hakkı sahibine aittir (TMK m. 813/1). Diğer bütün yükümlülükler malike aittir (TMK m. 813/3). Vergiyi malik ödemişse intifa sahibi ona tazmin eder (TMK m. 813/2).
  - soru: |
      Bir tarım arazisinde intifa sahibi olan A Ltd. Şti., araziyi bölüp yarısı üzerine betonarme bir oto yıkama tesisi kurmaya başlamıştır. Tesis, arazinin tarımsal niteliğini malik için önemli zarar verecek şekilde değiştirmektedir. Hangisi doğrudur?
    siklar:
      - "İntifa sahibi tam yararlanma yetkisine sahip olduğundan tesis kurabilir"
      - "Ekonomik özgülenme yönü malike önemli zarar verecek şekilde değiştirilemez; malik itiraz edebilir"
      - "Değişiklik, yalnız malik kayyıma başvurursa yasaktır"
      - "Malik ancak intifa süresi bittikten sonra itiraz edebilir"
    dogru: 1
    aciklama: |
      İntifa sahibi, taşınmazın ekonomik özgülenme yönünü malike önemli zarar verecek şekilde değiştiremez; onu yeni bir şekle dönüştüremez ve onda önemli bir değişiklik yapamaz (TMK m. 817/1). Malik, malın hukuka aykırı ya da niteliğine uygun düşmeyen kullanılış biçimine itiraz edebilir (TMK m. 807). Tam yararlanma yetkisi (TMK m. 794/2) bu sınırlarla birlikte okunur.
  - soru: |
      Oturma hakkı ile ilgili aşağıdaki ifadelerden hangisi doğrudur?
    siklar:
      - "Başkasına devredilebilir ve mirasçılara geçer"
      - "Başkasına devredilemez ve mirasçılara geçmez"
      - "Başkasına devredilebilir ama mirasçılara geçmez"
      - "Başkasına devredilemez ama mirasçılara geçer"
    dogru: 1
    aciklama: |
      TMK m. 823/2'ye göre oturma hakkı başkasına devredilemez ve mirasçılara geçmez. Bu kuralda "aksi kararlaştırılmadıkça" kaydı yoktur. Karıştırılan nokta, üst hakkıdır; o devredilebilir ve mirasçılara geçer (TMK m. 826/2).
  - soru: |
      Fatma, evinin üst katı üzerinde yeğeni Ali lehine ömür boyu oturma hakkı kurmuş ve hak tescil edilmiştir. Senette hakkın şahsa özgülendiği yazılı değildir. Ali eşi ve çocuğuyla taşınmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Ali yalnız tek başına oturabilir; aile bireyleri oturamaz"
      - "Aile bireyleri ancak Fatma'nın yazılı izniyle oturabilir"
      - "Ali ailesi ve ev halkıyla birlikte oturabilir, çünkü hakkın şahsa özgülendiği açıkça belirtilmemiştir"
      - "Ali yalnız eşiyle oturabilir; çocukları oturamaz"
    dogru: 2
    aciklama: |
      Hakkın şahsına özgülendiği açıkça belirtilmedikçe oturma hakkı sahibi, bina veya onun bir bölümünde ailesi ve ev halkı ile birlikte oturabilir (TMK m. 824/2). Kapsam hak sahibinin kişisel ihtiyaçlarına göre belirlenir (TMK m. 824/1). Aile bireyleri için ayrıca malikin izni gerekmez.
  - soru: |
      Ali, evin üst katında oturma hakkına sahiptir ve üst katı yalnız kendisi kullanmaktadır. Üst kattaki tesisatın olağan bakımı için onarım gerekmiştir. Onarım gideri kime aittir?
    siklar:
      - "Malike, çünkü ayni hakta giderler malike aittir"
      - "Oturma hakkı sahibine, çünkü hak bölümün tamamından yararlanma yetkisi vermektedir"
      - "Eşit olarak malik ve oturma hakkı sahibine"
      - "Her durumda belediyeye"
    dogru: 1
    aciklama: |
      Oturma hakkı binanın veya bölümün tamamından yararlanma yetkisi veriyorsa, muhafaza ve olağan bakım için gerekli onarım ve yenileme giderleri oturma hakkı sahibine aittir (TMK m. 825/1). Hak sahibi malikle birlikte kullanıyor olsaydı bakım ve onarım giderleri malike ait olurdu (TMK m. 825/2).
  - soru: |
      Evlilik sırasında davalı eş adına kayıtlı taşınmazın bir payı üzerinde, davacı eş lehine bedelsiz ve süresiz intifa hakkı kurulmuştur. Eşler boşanmış ve malik eş, intifanın evlilik nedeniyle kurulduğunu, boşanmayla sebebinin ortadan kalktığını ileri sürerek terkin istemiştir. Hangisi doğrudur?
    siklar:
      - "Boşanma, intifa hakkını kendiliğinden sona erdirir"
      - "İntifa sebepten bağımsız bir yararlanma hakkıdır; kurulma amacının ortadan kalkması kanundaki sona erme sebepleri arasında değildir, bu nedenle boşanma tek başına intifayı sona erdirmez"
      - "Malik eş, boşanma kararından sonra tek taraflı beyanla intifayı sona erdirebilir"
      - "Bedelsiz kurulan intifa, boşanmada geri alınabilen bir bağışlama olduğu için sona erer"
    dogru: 1
    aciklama: |
      Yargıtay'a göre intifa sebepten ari bir yararlanma hakkıdır; sona erme hâlleri TMK m. 796 ve devamında gösterilmiştir. Kurulma amacının, yani evliliğin ortadan kalkması bu hâller arasında değildir. Bu nedenle terkin davası reddedilmeli, intifa sahibinin elatmanın önlenmesi ve ecrimisil istemleri kabul edilmelidir; malik de intifa sahibine karşı haksız kullanan sayılabilir.

olaylar:
  - olay: |
      Ahmet, Bursa'daki zeytinliği üzerinde arkadaşı Zeynep lehine 10 yıllığına intifa hakkı kurmak için 1 Mart 2019'da tapuda resmî senet düzenletmiş ve hak tapu kütüğüne tescil edilmiştir. Sözleşmede Zeynep'in zeytinliği şahsen kullanması gerektiğine dair bir hüküm yoktur; durum ve koşullardan da böyle bir zorunluluk anlaşılmamaktadır.

      Zeynep, zeytinliği 1 Mart 2020'den 1 Mart 2023'e kadar Mehmet'e kiralamış ve kira süresi dolunca Mehmet zeytinliği Zeynep'e geri vermiştir. Zeynep, kendi isteğiyle ve olağan bakım dışında, zeytinliğe yeni bir damla sulama sistemi ekletmiştir. Zeynep, 14 Ocak 2025'te ölmüştür. Tek mirasçısı Can, zeytinliği 1 Mart 2025'te Ahmet'e geri vermiştir. Ahmet, sulama sistemi için bir bedel ödemeyi reddetmektedir; Can ise sistemi söküp götürebileceğini söylemektedir.

      1. Ahmet'in kurduğu intifa hakkı ne zaman ve nasıl doğmuştur?
      2. Zeynep'in zeytinliği Mehmet'e kiralaması geçerli midir? Ahmet haklarını Mehmet'e karşı ileri sürebilir miydi?
      3. İntifa hakkı Zeynep'in ölümüyle ne olmuştur? Can intifa sahibi olmuş mudur? Ahmet ne isteyebilir?
      4. Sulama sistemi bakımından Can ve Ahmet'in hakları nelerdir?
      5. Taraflar istemlerini hangi süre içinde ileri sürmelidir?
    olcut:
      - {tespit: "Taşınmaz intifasının tapuda resmî senet ve tescille kurulması; mülkiyet hükümlerine yollama ve resmî şekil", puan: 15, madde: "TMK m. 795"}
      - {tespit: "Kullanımın devrinin şahsen kullanma şartı bulunmadığından mümkün olması; malikin haklarını devralana karşı doğrudan ileri sürebilmesi; Mehmet'in ayni hak kazanmaması", puan: 20, madde: "TMK m. 806"}
      - {tespit: "Gerçek kişide intifanın hak sahibinin ölümüyle sona ermesi; Can'a geçmemesi", puan: 15, madde: "TMK m. 797"}
      - {tespit: "Ölüm hâlinde malike taşınmazda terkini isteme yetkisinin doğması", puan: 10, madde: "TMK m. 796"}
      - {tespit: "Sulama sisteminin yükümlü olunmayan bir ekleme olması; vekâletsiz iş görme hükümlerine göre tazminat; malik kaçınırsa eski hâle getirmek kaydıyla sökme", puan: 20, madde: "TMK m. 801"}
      - {tespit: "Olağan bakım ve onarımın intifa sahibinin kendi yükümlülüğü olduğu; sulama sisteminin bu kapsamda sayılamaması", puan: 10, madde: "TMK m. 812"}
      - {tespit: "Geri verme anından başlayarak bir yıllık zamanaşımı; hem Can'ın hem Ahmet'in istemlerini kapsaması", puan: 10, madde: "TMK m. 802"}
    cozum: |
      **Nitelendirme:** Ahmet'in malik olduğu taşınmaz üzerinde Zeynep lehine sözleşmeyle kurulmuş, süreli bir intifa hakkı vardır. Uyuşmazlık, hakkın kuruluşu, kullanımın devri, ölümle sona erme ve geri vermeden sonraki istemlere ilişkindir.

      **Hukuki sorunlar:** (1) Kuruluş; (2) kullanımın devri; (3) ölümün sonucu; (4) yükümlü olunmayan eklemeler; (5) zamanaşımı.

      **İlgili hükümler:** TMK m. 794, TMK m. 795, TMK m. 706, TMK m. 806, TMK m. 797, TMK m. 796, TMK m. 801, TMK m. 812, TMK m. 813, TMK m. 802.

      **Değerlendirme:**

      *1. Kuruluş:* İntifa hakkı taşınmazlarda tapu kütüğüne tescil ile kurulur (TMK m. 795/1). Kazanma ve tescilde aksine düzenleme olmadıkça mülkiyete ilişkin hükümler uygulanır (TMK m. 795/2); bu yollama nedeniyle taşınmaz mülkiyetinin devrinde olduğu gibi resmî senet gerekir (TMK m. 706). Ahmet ve Zeynep resmî senedi tapuda düzenletmişler ve hak tescil edilmiştir. Bu nedenle hak, tescil anı olan 1 Mart 2019'da doğmuştur; yalnız senet düzenlenmesi yetmezdi (TMK m. 1021).

      *2. Kullanımın devri:* İntifa hakkının kullanılması, sözleşmede aksine hüküm yoksa veya durum ve koşullardan hak sahibince şahsen kullanılması gerektiği anlaşılmıyorsa başkasına devredilebilir (TMK m. 806/1). Sözleşmede şahsen kullanma şartı yoktur ve durumdan da böyle bir zorunluluk anlaşılmamaktadır. Zeynep'in kirası bu nedenle geçerlidir. Hakkın kendisi değil, yalnız kullanımı devredilmiştir; devir borçlandırıcıdır ve Mehmet ayni hak kazanmamıştır. Malik Ahmet haklarını devralana karşı doğrudan ileri sürebilirdi (TMK m. 806/2). Kira Zeynep'in ölümünden önce sona erdiği için kira ilişkisinin intifadan sonra sürüp sürmediği bu olayın konusu değildir.

      *3. Ölüm:* Gerçek kişilerde intifa hakkı hak sahibinin ölümüyle sona erer (TMK m. 797/1). Zeynep 14 Ocak 2025'te ölmüş, 10 yıllık süre dolmamış olsa da hak ölümle sona ermiştir. Hak mirasçıya geçmez; Can intifa sahibi olmamıştır. Ahmet, taşınmazda terkini isteme yetkisine sahiptir (TMK m. 796/2). Hak sahibinin mirasçısı terkine razı olmazsa terkin davasını malik Ahmet açar. Can zeytinliği geri vermekle yükümlüdür (TMK m. 799) ve nitekim 1 Mart 2025'te geri vermiştir.

      *4. Sulama sistemi:* Zeynep'in yükümlü olmadığı hâlde yaptırdığı bu ekleme için hak sona erdiğinde vekâletsiz iş görme hükümlerine göre tazminat istenebilir (TMK m. 801/1). Zeynep'in yerine geçen Can bu tazminatı Ahmet'ten isteyebilir. Ahmet tazminattan kaçınırsa Can, zeytinliği eski hâline getirmek kaydıyla sistemi söküp alabilir (TMK m. 801/2). Olağan bakım ve onarım ise zaten intifa sahibinin yükümlülüğündedir (TMK m. 812/1 ve TMK m. 813/1); sulama sistemi malın muhafazası veya olağan bakımı için gerekli olmadığından bu kapsamda sayılamaz ve Zeynep'in kendi isteğiyle yaptırdığı ekleme sayılır.

      *5. Zamanaşımı:* Geri verme anında malik ve intifa sahibi tarafından ileri sürülebilecek bütün istemler, geri verme anından, yani 1 Mart 2025'ten başlayarak bir yıl geçmekle zamanaşımına uğrar (TMK m. 802). Bu süre hem Can'ın tazminat istemini hem Ahmet'in olası zarar istemlerini kapsar.

      **Sonuç:**
      - İntifa, 1 Mart 2019'da tescille doğmuştur.
      - Kira geçerlidir; yalnız kullanım devredilmiş, Mehmet ayni hak kazanmamıştır.
      - İntifa, Zeynep'in ölümüyle sona ermiş, Can'a geçmemiştir; Ahmet terkini isteyebilir.
      - Sulama sistemi için tazminat ya da eski hâle getirmek kaydıyla sökme hakkı vardır.
      - İstemler geri verme anından başlayarak bir yıl içinde ileri sürülmelidir.

  - olay: |
      Fatma, Kadıköy'deki iki katlı evinin üst katı üzerinde yeğeni Ali lehine ömür boyu oturma hakkı kurmuş ve hak tapuya tescil edilmiştir. Senette hakkın şahsa özgülendiği yazılı değildir. Alt katta Fatma oturmaktadır; ev, iki katın birlikte kullandığı ortak bir bahçeye sahiptir. Üst katı yalnız Ali kullanmaktadır.

      Ali, eşi Merve ve çocuğuyla üst kata taşınmıştır. Ali, üst kattaki odalardan birini muayenehane olarak kullanmak istemektedir. Ayrıca hakkını kardeşi Mert'e 500.000 TL'ye satmayı düşünmektedir. Bu arada üst kattaki tesisatta olağan bir arıza çıkmış ve onarım gerekmiştir. Ali bu masrafın Fatma'ya ait olduğunu söylemektedir.

      Aradan birkaç yıl geçtikten sonra Ali ölmüş ve çocuğu, babasının hakkına dayanarak üst katta oturmaya devam etmek istemiştir.

      1. Oturma hakkının niteliği ve kapsamı nedir? Ali, Merve ve çocuğuyla oturabilir mi? Bahçeden yararlanabilir mi?
      2. Ali üst katın bir odasını muayenehane yapabilir mi?
      3. Ali hakkını Mert'e devredebilir mi?
      4. Tesisat onarımı masrafı kimin üzerindedir?
      5. Ali'nin ölümünden sonra çocuğu oturmaya devam edebilir mi?
    olcut:
      - {tespit: "Oturma hakkının bir binadan veya bölümünden konut olarak yararlanma yetkisi olması; tescille kurulması ve intifa hükümlerine tabi olması", puan: 15, madde: "TMK m. 823"}
      - {tespit: "Hakkın şahsa özgülendiği açıkça belirtilmediğinden Ali'nin ailesi ve ev halkıyla oturabilmesi", puan: 20, madde: "TMK m. 824"}
      - {tespit: "Bölüm üzerinde hak sahibinin ortaklaşa kullanılan bahçeden de yararlanması", puan: 10, madde: "TMK m. 824"}
      - {tespit: "Oturma hakkının konut olarak yararlanma sağlaması; muayenehane gibi işyeri kullanımını kapsamaması", puan: 15, madde: "TMK m. 823"}
      - {tespit: "Oturma hakkının başkasına devredilememesi; Mert'e satışın geçersiz olması", puan: 15, madde: "TMK m. 823"}
      - {tespit: "Bölümün tamamından yararlanan hak sahibinin olağan onarım giderlerini üstlenmesi", puan: 15, madde: "TMK m. 825"}
      - {tespit: "Oturma hakkının mirasçılara geçmemesi; çocuğun hak iddia edememesi", puan: 10, madde: "TMK m. 823"}
    cozum: |
      **Nitelendirme:** Fatma ile Ali arasında, Fatma'nın maliki olduğu binanın bir bölümü (üst kat) üzerinde sözleşmeyle kurulmuş bir oturma hakkı (sükna) vardır. Oturma hakkı sınırlı ayni haktır ve irtifak hakkı niteliğindedir.

      **Hukuki sorunlar:** (1) Hakkın kapsamı ve kimlerin oturabileceği; (2) işyeri kullanımı; (3) devredilebilirlik; (4) giderler; (5) ölümün etkisi.

      **İlgili hükümler:** TMK m. 823, TMK m. 824, TMK m. 825, TMK m. 794, TMK m. 795.

      **Değerlendirme:**

      *1. Kapsam ve aile:* Oturma hakkı, bir binadan veya onun bir bölümünden konut olarak yararlanma yetkisi verir (TMK m. 823/1). Kanunda aksine hüküm bulunmadıkça intifa hakkına ilişkin hükümler oturma hakkına da uygulanır (TMK m. 823/3); bu yollama sonucunda taşınmazda hak tescille kurulur (TMK m. 795/1) ve olayda tescil yapılmıştır. Kapsam hak sahibinin kişisel ihtiyaçlarına göre belirlenir (TMK m. 824/1). Hakkın şahsa özgülendiği açıkça belirtilmedikçe hak sahibi ailesi ve ev halkı ile birlikte oturabilir (TMK m. 824/2). Senette şahsa özgülenme yazılı olmadığından Ali, eşi Merve ve çocuğuyla birlikte oturabilir. Bölüm üzerinde hakkı olan, ortaklaşa kullanıma özgülenen yerlerden de yararlanabileceğinden (TMK m. 824/3) Ali ortak bahçeyi kullanabilir.

      *2. Muayenehane:* Oturma hakkı yalnız konut olarak yararlanma sağlar (TMK m. 823/1). Muayenehane bir işyeri kullanımıdır ve hakkın kapsamına girmez. Ali odayı bu amaçla kullanırsa hakkın kapsamını aşmış olur; malik Fatma, malın hukuka aykırı ya da niteliğine uygun düşmeyen kullanılış biçimine itiraz edebilir (TMK m. 807; intifa hükümlerinin uygulanması TMK m. 823/3 gereğidir).

      *3. Devir:* Oturma hakkı başkasına devredilemez ve mirasçılara geçmez (TMK m. 823/2). Bu kuralda "aksi kararlaştırılmadıkça" kaydı yoktur. Ali'nin hakkı kardeşi Mert'e 500.000 TL'ye satması hukuken mümkün değildir; Mert hak sahibi olamaz. Hakkın kiraya verilip verilemeyeceği ayrı bir tartışma konusudur; bu olayda sorulmamaktadır.

      *4. Giderler:* Hak, binanın veya bölümün tamamından yararlanma yetkisi veriyorsa, muhafaza ve olağan bakım için gerekli onarım ve yenileme giderleri oturma hakkı sahibine aittir (TMK m. 825/1). Üst katı yalnız Ali kullandığından olağan tesisat onarımı giderini Ali üstlenir; Fatma'ya ait olduğu savunması yerinde değildir. Ali ile Fatma üst katı birlikte kullanıyor olsaydı bakım ve onarım giderleri malike ait olurdu (TMK m. 825/2).

      *5. Ölüm:* Oturma hakkı mirasçılara geçmez (TMK m. 823/2). Ali'nin ölümüyle hak sona ermiştir; çocuğu mirasçı sıfatıyla oturma hakkı iddia edemez. Fatma tapuda terkini isteyebilir (TMK m. 796/2'nin yollamayla uygulanması). Çocuğun oturması ancak Fatma ile yeni bir sözleşmeyle mümkündür.

      **Sonuç:**
      - Ali ailesi ve ev halkıyla üst katta oturabilir, ortak bahçeden yararlanır.
      - Muayenehane kullanımı oturma hakkı kapsamında değildir.
      - Ali hakkını Mert'e devredemez.
      - Olağan tesisat onarımı giderleri Ali'ye aittir.
      - Hak Ali'nin ölümüyle sona erer, çocuğa geçmez.

  - olay: |
      X Vakfı lehine, A'nın Tekirdağ'daki tarım arazisi üzerinde süre belirtilmeden bir intifa hakkı kurulmuş ve tapuya tescil edilmiştir. Vakıf araziyi bölmüş, yarısına betonarme bir oto yıkama tesisi kurmaya başlamıştır. A durumu öğrenince vakfa itiraz etmiş, ama vakıf tesisi kurmaya devam etmiştir. Vakıf ayrıca arazinin kalan kısmında olağan sınırların çok ötesinde yoğun yararlanma yaparak bir ürün elde etmiştir.

      Vakıf yöneticileri ise intifa sahibi olduklarını, araziyi diledikleri gibi kullanabileceklerini savunmaktadır. A ayrıca vakfın borçlarını ödeyemediğini, arazinin bu nedenle zarar görme tehlikesi altında olduğunu banka kayıtlarıyla ve bilirkişi raporuyla ortaya koymuştur. A vakıftan güvence istemiş, vakıf kendisine tanınan uygun süre içinde güvence göstermemiştir.

      1. A, vakfın tesis kurmasına hangi hükümlere dayanarak itiraz edebilir?
      2. A, vakıftan güvence isteyebilir mi? Tehlikenin ispatı kime düşer?
      3. Vakıf güvence göstermez ve hukuka aykırı kullanıma devam ederse ne olur?
      4. Elde edilen yoğun yararlanma ürünü kime aittir?
      5. Süre belirtilmediğine göre bu intifa ne zaman sona erer? Bir üst sınır var mıdır?
    olcut:
      - {tespit: "Malikin hukuka aykırı ya da niteliğine uygun düşmeyen kullanılış biçimine itiraz edebilmesi", puan: 15, madde: "TMK m. 807"}
      - {tespit: "İntifa sahibinin taşınmazın ekonomik özgülenme yönünü malike önemli zarar verecek şekilde değiştirememesi", puan: 20, madde: "TMK m. 817"}
      - {tespit: "Haklarının tehlikeye düştüğünü ispat eden malikin güvence isteyebilmesi; ispat yükünün A'da olması", puan: 15, madde: "TMK m. 808"}
      - {tespit: "Güvence verilmezse veya hukuka aykırı kullanıma devam edilirse sulh hâkiminin zilyetliği kaldırıp araziyi kayyıma tevdi etmesi", puan: 20, madde: "TMK m. 810"}
      - {tespit: "Olağan sınırlar aşılarak elde edilen ürünlerin malike ait olması", puan: 15, madde: "TMK m. 816"}
      - {tespit: "Tüzel kişide süre belirtilmemişse kişiliğin ortadan kalkmasıyla sona erme; en çok yüz yıl sınırı", puan: 15, madde: "TMK m. 797"}
    cozum: |
      **Nitelendirme:** A'nın maliki olduğu tarım arazisi üzerinde, tüzel kişi olan X Vakfı lehine, süre belirtilmeden kurulmuş ve tescil edilmiş bir intifa hakkı vardır. Uyuşmazlık, intifa sahibinin yetkilerinin sınırı, malikin korunma araçları, ürünlerin kime ait olduğu ve tüzel kişinin intifasının süresine ilişkindir.

      **Hukuki sorunlar:** (1) Malikin itiraz hakkı ve ekonomik özgülenme yönü; (2) güvence; (3) güvence verilmemesinin sonucu; (4) olağan sınırı aşan ürünler; (5) sona erme ve üst sınır.

      **İlgili hükümler:** TMK m. 794, TMK m. 795, TMK m. 797, TMK m. 807, TMK m. 808, TMK m. 810, TMK m. 816, TMK m. 817.

      **Değerlendirme:**

      *1. İtiraz:* İntifa hakkı, aksine düzenleme olmadıkça tam yararlanma yetkisi verir (TMK m. 794/2); bu yetki sınırsız değildir. Malik, malın hukuka aykırı ya da niteliğine uygun düşmeyen kullanılış biçimine itiraz edebilir (TMK m. 807). Ayrıca intifa sahibi, taşınmazın ekonomik özgülenme yönünü malike önemli zarar verecek şekilde değiştiremez; onu yeni bir şekle dönüştüremez ve önemli bir değişiklik yapamaz (TMK m. 817/1). Tarım arazisinin yarısının betonarme oto yıkama tesisine dönüştürülmesi, özgülenme yönünde önemli bir değişikliktir. A'nın itirazı bu iki hükme dayanır.

      *2. Güvence:* Haklarının tehlikeye düştüğünü ispat eden malik, intifa sahibinden güvence isteyebilir (TMK m. 808/1). Olayda konu tarım arazisidir; tüketilebilen şey ya da kıymetli evrak olmadığından tehlikenin ispatı kuralı geçerlidir ve ispat yükü A'dadır. A, vakfın borçlarını ödeyemediğini ve arazinin zarar tehlikesi altında olduğunu banka kayıtları ve bilirkişi raporuyla ispat ettiğinden güvence istemekte haklıdır. Bağışlamada intifanın saklı tutulması gibi bir istisna (TMK m. 809) söz konusu değildir.

      *3. Yaptırım:* İntifa sahibi kendisine tanınan uygun süre içinde güvence göstermez ya da malikin itirazına rağmen hukuka aykırı kullanıma devam ederse sulh hâkimi, yeni bir karara kadar intifa sahibinin zilyetliğini kaldırarak hakkın konusunu atayacağı bir kayyıma tevdi eder (TMK m. 810). Vakıf hem güvence göstermemiş hem itiraza rağmen tesisi sürdürdüğünden iki şart da gerçekleşmiştir. A sulh hâkiminden bu yönde karar isteyebilir. Bu tedbir intifayı sona erdirmez, zilyetliği geçici olarak kayyıma verir.

      *4. Ürün:* İntifa sahibi taşınmazda yararlanmanın olağan sınırlar içinde kalmasına özen göstermekle yükümlüdür; bu ölçü aşılarak elde edilen ürünler malike aittir (TMK m. 816). Kalan kısımdan olağan sınırların çok ötesinde yoğun yararlanma ile elde edilen ürün bu nedenle A'ya aittir.

      *5. Sona erme:* X Vakfı tüzel kişi olduğundan intifa, kararlaştırılan sürenin dolmasıyla, süre kararlaştırılmamışsa kişiliğin ortadan kalkmasıyla sona erer; tüzel kişilerin intifa hakkı en çok yüz yıl devam edebilir (TMK m. 797). Olayda süre belirtilmediğinden hak, vakfın kişiliğinin ortadan kalkmasıyla sona erer ve en çok yüz yıl sürer.

      **Sonuç:**
      - A, TMK m. 807 ve TMK m. 817'ye dayanarak tesise itiraz edebilir.
      - A, tehlikeyi ispat ettiği için güvence isteyebilir.
      - Güvence verilmezse veya kullanım sürerse sulh hâkimi araziyi kayyıma tevdi eder.
      - Olağan sınırı aşan yoğun yararlanma ürünü A'ya aittir.
      - İntifa, vakfın kişiliğinin sona ermesiyle biter ve en çok yüz yıl sürer.

kartlar:
  - on: "İntifa hakkı hangi konular üzerinde kurulur? (TMK m. 794)"
    arka: "Taşınırlar, taşınmazlar, haklar veya bir malvarlığı üzerinde. Aksine düzenleme yoksa konusu üzerinde tam yararlanma yetkisi verir."
  - on: "İntifa hakkı nasıl kurulur? (TMK m. 795)"
    arka: "Taşınırda zilyetliğin devri, alacakta alacağın devri, taşınmazda tapu kütüğüne tescil. Kazanma ve tescilde mülkiyet hükümleri uygulanır."
  - on: "Resmî senet düzenlenip tescil yapılmazsa taşınmazda intifa doğar mı?"
    arka: "Hayır. Kurulması tescile tabi ayni hak tescil edilmedikçe doğmaz (TMK m. 795/1 ve TMK m. 1021)."
  - on: "Gerçek kişide intifa ne zaman sona erer? (TMK m. 797)"
    arka: "Hak sahibinin ölümüyle. Süre kararlaştırılmış olsa bile en geç ölümle biter, mirasçılara geçmez."
  - on: "Tüzel kişide intifa ne zaman sona erer, üst sınır nedir?"
    arka: "Kararlaştırılan sürenin dolmasıyla, süre yoksa kişiliğin ortadan kalkmasıyla. En çok yüz yıl sürer (TMK m. 797)."
  - on: "Kamulaştırma veya sigorta hâlinde intifa ne olur? (TMK m. 798/2)"
    arka: "Malın yerine geçen karşılık üzerinde devam eder."
  - on: "Harap olan malı malik yenilemek zorunda mı? (TMK m. 798/1)"
    arka: "Hayır. Yenilerse intifa hakkı yeniden kurulmuş olur."
  - on: "Geri verme anındaki istemler hangi sürede zamanaşımına uğrar?"
    arka: "Geri verme anından başlayarak bir yıl; malik ve intifa sahibinin bütün istemleri için (TMK m. 802)."
  - on: "İntifa sahibi kusuru bakımından nasıl sorumludur? (TMK m. 800)"
    arka: "Kusursuzluğunu ispat edemezse malın yok olmasından ve değer azalmasından sorumludur. Olağan kullanımdan doğan değer azalmasından sorumlu değildir."
  - on: "Yükümlü olmadığı eklemeler için intifa sahibi ne isteyebilir? (TMK m. 801)"
    arka: "Hak sona erince vekâletsiz iş görme hükümlerine göre tazminat. Malik kaçınırsa malı eski hâline getirmek kaydıyla eklemeleri söküp alabilir."
  - on: "Doğal ürünler ve faizler kime aittir? (TMK m. 804 ve TMK m. 805)"
    arka: "İntifa süresi içinde olgunlaşan doğal ürünler ve intifa süresine düşen faiz ile dönemsel gelirler intifa sahibine aittir."
  - on: "İntifa hakkı devredilebilir mi, kullanımı devredilebilir mi?"
    arka: "Hakkın kendisi devredilemez ve mirasçılara geçmez; kullanımı ise şahsen kullanma gerekmiyorsa ve aksi kararlaştırılmamışsa devredilebilir (TMK m. 806). Devir borçlandırıcıdır."
  - on: "Malik, kullanımı devralana karşı haklarını nasıl ileri sürer?"
    arka: "Doğrudan doğruya (TMK m. 806/2)."
  - on: "Güvence ne zaman istenir, kimden istenemez? (TMK m. 808 ve TMK m. 809)"
    arka: "Malik tehlikeyi ispat ederek ister; tüketilebilen şey ve kıymetli evrakta ispat gerekmez. İntifa kendisinde kalmak üzere bağışlayandan istenemez."
  - on: "Güvence verilmezse ne olur? (TMK m. 810)"
    arka: "Sulh hâkimi, yeni bir karara kadar zilyetliği kaldırıp malı atayacağı bir kayyıma tevdi eder."
  - on: "Olağan bakım, işletme, faiz, vergi gideri kimde? (TMK m. 813)"
    arka: "Olağan bakım ve işletme giderleri, malın güvencesini oluşturduğu borçların faizleri, vergi ve resimler intifa süresince intifa sahibinde. Diğer bütün yükümlülükler malike aittir."
  - on: "Taşınmazda intifa sahibine hangi sınır konur? (TMK m. 817)"
    arka: "Ekonomik özgülenme yönünü malike önemli zarar verecek şekilde değiştiremez; yeni şekle dönüştüremez, önemli değişiklik yapamaz."
  - on: "Tüketilebilen şeylerde intifa ne sonuç doğurur? (TMK m. 819)"
    arka: "Mülkiyet, aksi kararlaştırılmadıkça intifa sahibine geçer; geri vermede o günkü değer ödenir."
  - on: "Alacak intifasında devir istemi hangi sürede yapılır? (TMK m. 822)"
    arka: "İntifanın başlangıcını izleyen üç ay içinde; alacağın ve kıymetli evrakın devri istenir, bedel borcu doğar."
  - on: "Oturma hakkı nedir? (TMK m. 823)"
    arka: "Bir binadan veya bölümünden konut olarak yararlanma yetkisi. Devredilemez, mirasçılara geçmez; aksine hüküm yoksa intifa hükümleri uygulanır."
  - on: "Oturma hakkı sahibi kimlerle oturabilir? (TMK m. 824)"
    arka: "Hak şahsa özgülendiği açıkça belirtilmedikçe ailesi ve ev halkıyla birlikte oturabilir; bölümü olanlar ortak yerlerden de yararlanır."
  - on: "Oturma hakkında onarım gideri kimde? (TMK m. 825)"
    arka: "Tamamından yararlanıyorsa muhafaza ve olağan bakım için gerekli onarım, yenileme giderleri oturma hakkı sahibinde; malikle birlikte kullanıyorsa bakım ve onarım giderleri malikte."
  - on: "Evlilik nedeniyle kurulan intifa, boşanmayla sona erer mi?"
    arka: "Hayır. Kurulma amacının kalkması kanuni sona erme sebebi değildir. Malik de intifa sahibine karşı haksız kullanan sayılabilir; intifa sahibi elatmanın önlenmesi ve ecrimisil isteyebilir."
