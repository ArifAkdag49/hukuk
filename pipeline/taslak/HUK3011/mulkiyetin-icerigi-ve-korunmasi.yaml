  - id: "1227159400"
    ozet: |
      Davacı kamu idaresi, bir vakıf adına kayıtlı taşınmazın bir bölümünün davalı belediye tarafından yol olarak açılıp kullanıldığını ileri sürerek ecrimisil istemiş, sonraki dönemler için açtığı davalar da bu davayla birleştirilmiştir. Davalı, yolu kendisinin açmadığını, alanı dava dışı bir şirketin kullandığını savunmuştur. İlk derece mahkemesi davayı kabul etmiş, Yargıtay 1. Hukuk Dairesi yolu kimin açtığının araştırılmadığı gerekçesiyle kararı bozmuştur. Yeniden yapılan yargılamada davanın kısmen kabulüne karar verilmiş, 7. Hukuk Dairesi kararı yine bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu ecrimisili, hak sahibinin kötüniyetli zilyetten isteyebileceği ve en azı kira geliri karşılığı olan özel bir zarar giderim biçimi olarak tanımlamış; 1950 ve 1938 tarihli İçtihadı Birleştirme Kararlarına dayanarak haksız işgalin haksız eylem olduğunu ve beş yıllık sürenin dava tarihinden geriye işlediğini hatırlatmıştır. Kurul, davalının taşınmaza hukuken geçerli bir hakka dayanmadan el attığını davacının ispatlaması gerektiğini, araştırma sonunda yolun davalı tarafından açıldığına dair somut delil bulunmadığını belirterek direnme kararını değişik gerekçeyle ve oy çokluğuyla bozmuş, davanın reddi gerektiğini açıklamıştır. Konuya katkısı: ecrimisilin niteliğini ve haksız elatmayı ispat yükünün davacıda olduğunu gösterir.
  - id: "609295200"
    ozet: |
      Davacı, bir bağımsız bölümde davalıyla yarı yarıya paydaş olduğunu, davalının daireyi tek başına kullandığını ileri sürerek dava tarihinden geriye beş yıllık ecrimisil istemiştir. İlk derece mahkemesi davayı kabul ederek 5.000 TL ecrimisile hükmetmiştir. Yargıtay 8. Hukuk Dairesi, ecrimisilin kötüniyetli zilyetten istenen bir haksız işgal tazminatı olduğunu, 1950 tarihli İçtihadı Birleştirme Kararına göre haksız işgalin kira sözleşmesine benzetilemeyeceğini ve 1938 tarihli İçtihadı Birleştirme Kararına göre beş yıllık sürenin dava tarihinden geriye işlediğini belirtmiştir. Daire, paydaşların kural olarak men edilmedikçe birbirlerinden ecrimisil isteyemeyeceğini, bunun için davacının yararlanma isteğini davalıya bildirmiş olması gerektiğini, bu olgunun her türlü delille ispatlanabileceğini açıklamış ve kiraya verilen ya da doğal ürün veren yerler gibi istisnaları saymıştır. Tanık beyanına göre davalı 2008'den beri daireyi kullanmakta, davacı ise 2010'da kendi evini aldıktan sonra davalıdan evden çıkmasını istemiştir. Daire, intifadan menin 2010'da gerçekleştiğini, ecrimisilin bu tarihle dava tarihi arasındaki dönem için hesaplanması gerektiğini belirterek kararı oy birliğiyle bozmuştur. Konuya katkısı: paydaşlar arasında ecrimisilin intifadan men şartını, istisnalarını ve ispatını gösterir.
  - id: "1152337800"
    ozet: |
      Davacılar, babalarından kalan ve 1941'den beri zilyetliklerinde bulunan 515 m²'lik yerin kadastroda karşı tarafın üzerine yazıldığını ileri sürerek tapu iptali ve tescil istemiştir. Taşınmazın paydaşı olan karşı davacılar ise davacıların taşınmaza elatmasının önlenmesini ve üzerindeki binanın yıkımını istemiştir. İlk derece mahkemesi asıl davayı reddetmiş, karşı davayı kabul ederek elatmanın önlenmesine ve yapının yıkımına karar vermiş, bölge adliye mahkemesi gerekçeyi düzelterek istinafı reddetmiştir. Yargıtay 7. Hukuk Dairesi, bütünleyici parça niteliğindeki bir binanın yıkımında arsanın bütün paydaşlarının davada yer alması gerektiğini, yapı hafif bir yapıysa (TMK m. 728) buna gerek olmadığını belirterek kararı bozmuş, bölge adliye mahkemesi karşı dava yönünden direnmiştir. Hukuk Genel Kurulu, her paydaşın elatmanın önlenmesini kendi payı bakımından tek başına (TMK m. 688/3) ya da diğerlerini temsilen (TMK m. 693/3) isteyebileceğini, ancak yıkım isteminde kural olarak bütün paydaşların taraf olması gerektiğini açıklamıştır. Kurul, 5.730 m²'lik, fiilî bir kullanım biçimi oluşmuş ve gecekondu tipi yapılarla dolmuş taşınmazda, üç katlı betonarme binanın bulunduğu bölümde karşı davacılar dışında kimsenin hak iddia etmediğini belirterek direnmeyi oy çokluğuyla yerinde bulmuş ve diğer temyiz itirazlarının incelenmesi için dosyayı Özel Daireye göndermiştir. Konuya katkısı: paylı taşınmazda elatmanın önlenmesi ile yıkım istemi arasındaki taraf teşkili farkını gösterir.

sorular:
  - soru: |
      TMK m. 683/1'e göre malikin yetkileri hakkında hangisi doğrudur?
    siklar:
      - "Malik, hukuk düzeninin sınırları içinde eşya üzerinde dilediği gibi kullanma, yararlanma ve tasarrufta bulunma yetkisine sahiptir."
      - "Malikin yetkileri kullanma ve yararlanmadan ibarettir; tasarruf yetkisi ayrıca idarenin iznine bağlıdır."
      - "Malik, hiçbir sınırlamaya tabi olmaksızın eşya üzerinde dilediği gibi davranabilir."
      - "Malikin yetkileri, ancak eşyanın zilyedi olduğu sürece vardır."
    dogru: 0
    aciklama: |
      TMK m. 683/1 malike kullanma, yararlanma ve tasarruf yetkisi verir, ama bunu "hukuk düzeninin sınırları içinde" yapar. Mülkiyet sınırsız değildir; AY m. 35 ve TMK m. 2 gibi hükümler sınır çizer. Zilyetliği kaybetmek mülkiyeti sona erdirmez; malik tam da bu durumda istihkak davası açar.

  - soru: |
      Ayşe'nin kendi kullandığı tapulu arsasına komşusu Kemal her gün aracını park etmekte ve arsadan geçit gibi yararlanmaktadır. Ayşe **mülkiyet hakkına dayanarak** hangi davayı açmalıdır?
    siklar:
      - "İstihkak davası"
      - "Elatmanın önlenmesi davası"
      - "Tapu iptali ve tescil davası"
      - "Olağanüstü kazandırıcı zamanaşımına dayalı tescil davası"
    dogru: 1
    aciklama: |
      Arsa Ayşe'nin zilyetliğindedir, ama mülkiyetine sürekli bir müdahale vardır. Bu durumda her türlü haksız elatmanın önlenmesi istenir (TMK m. 683/2). İstihkak, malın malikin elinden çıktığı durumlar içindir. Tapu kaydı zaten Ayşe adına olduğundan tapu iptali ve tescil gerekmez.

  - soru: |
      Mehmet'in motosikleti çalınmıştır. Motosiklet iki ay sonra, onu hırsızdan çalıntı olduğunu bilerek satın alan Cem'in elinde bulunur. Mehmet mülkiyetine dayanarak ne yapabilir?
    siklar:
      - "Yalnız zilyetliğin gasbı davası açabilir; mülkiyete dayanamaz."
      - "Cem'e karşı istihkak davası açarak motosikletin geri verilmesini isteyebilir."
      - "Cem malı satın aldığı için hiçbir dava açamaz, yalnız hırsızdan tazminat isteyebilir."
      - "Yalnız elatmanın önlenmesi davası açabilir, çünkü motosiklet bir taşınırdır."
    dogru: 1
    aciklama: |
      Zilyetliği elinden çıkan malik, malını haksız olarak elinde bulunduran kişiden istihkak davasıyla geri ister (TMK m. 683/2). Cem kötüniyetlidir; iyiniyetli edinime ilişkin koruma ona uygulanmaz. Zilyetlik davası da açılabilir, ama malik mülkiyetine dayanmaktan yoksun bırakılmaz.

  - soru: |
      Elif'in tapulu arsasının 30 m²'lik kısmı, 01.02.2024'te komşusu tarafından çitle komşunun bahçesine katılmıştır. Elif durumu aynı gün öğrenmiştir ve 01.10.2025'te dava açmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Hem zilyetlik hem mülkiyet davasının süresi dolduğu için Elif hiçbir dava açamaz."
      - "Zilyetlik davası hakkı düşmüştür; ancak Elif tapu malikliğine dayanarak elatmanın önlenmesi davası açabilir."
      - "Elatmanın önlenmesi davası da fiilden itibaren bir yıl içinde açılmalıdır; Elif'in hakkı düşmüştür."
      - "Zilyetlik davası her zaman açılabilir, süre yalnız tazminat istemi içindir."
    dogru: 1
    aciklama: |
      Gasp ve saldırıdan doğan dava hakkı, fiilin ve failin öğrenilmesinden itibaren iki ay ve her hâlde fiilden itibaren bir yıl geçmekle düşer (TMK m. 984). Bu süre zilyetlik davalarına özgüdür. Mülkiyete dayanan elatmanın önlenmesi davası süreye bağlı değildir (TMK m. 683/2).

  - soru: |
      Yargıtay'ın 1938 tarihli İçtihadı Birleştirme Kararına dayanan yerleşik içtihadına göre ecrimisil istemi hangi zamanaşımına tabidir?
    siklar:
      - "Öğrenmeden itibaren iki yıl, her hâlde fiilden itibaren on yıl"
      - "Dava tarihinden geriye doğru işleyen beş yıl"
      - "İşgalin başladığı tarihten itibaren on yıl"
      - "Ecrimisil istemi zamanaşımına tabi değildir"
    dogru: 1
    aciklama: |
      25.05.1938 tarihli İçtihadı Birleştirme Kararı ve Yargıtay'ın yerleşik içtihadına göre ecrimisil davaları beş yıllık zamanaşımına tabidir ve süre dava tarihinden geriye doğru işler. İki ve on yıllık süreler haksız fiil ve sebepsiz zenginleşmeye ilişkindir (TBK m. 72, TBK m. 82). Süreye bağlı olmayan, mülkiyete dayalı elatmanın önlenmesi istemidir, ecrimisil değil.

  - soru: |
      Kemal, Ayşe'nin arsasını 2015'ten beri, arsanın Ayşe'ye ait olduğunu bilerek kullanmaktadır. Ayşe 10.03.2026'da dava açıp 2015'ten itibaren ecrimisil ister. Kemal süresinde zamanaşımı def'inde bulunur. Ecrimisil hangi dönem için hüküm altına alınır?
    siklar:
      - "2015'ten dava tarihine kadar, çünkü işgal kesintisiz sürmüştür."
      - "10.03.2021-10.03.2026 dönemi için."
      - "Yalnız dava tarihinden önceki son iki yıl için."
      - "Hiçbir dönem için, çünkü işgalin başlangıcından beri beş yıldan fazla zaman geçmiştir."
    dogru: 1
    aciklama: |
      Ecrimisilde beş yıllık süre dava tarihinden geriye doğru hesaplanır. Dava 10.03.2026'da açıldığı için 10.03.2021'den önceki dönem zamanaşımına uğramıştır. Sürenin işgalin başlangıcından işlediğini düşünmek yaygın bir hatadır; işgal sürdükçe her dönemin ecrimisili ayrı ayrı istenebilir.

  - soru: |
      Önceki sorudaki olayda Kemal zamanaşımı def'inde **bulunmamıştır.** Hangisi doğrudur?
    siklar:
      - "Mahkeme beş yıllık süreyi kendiliğinden uygular."
      - "Zamanaşımı def'i olduğu için hâkim kendiliğinden dikkate alamaz; ispatlanan işgal süresi için talep doğrultusunda ecrimisile hükmedilebilir."
      - "Ecrimisil süresi kamu düzenine ilişkin bir hak düşürücü süredir; mahkeme dosya kapsamından kendiliğinden gözetir."
      - "Kemal zamanaşımını ilk kez temyiz aşamasında ileri sürse de dikkate alınır."
    dogru: 1
    aciklama: |
      Zamanaşımı bir def'idir; borçlu ileri sürmedikçe hâkim kendiliğinden uygulamaz. Yargıtay da beş yıllık sınırı, davalının süresinde zamanaşımı savunmasında bulunduğu davalarda uygular. Hak düşürücü süre olsaydı kendiliğinden gözetilirdi; ecrimisildeki süre ise zamanaşımıdır.

  - soru: |
      08.03.1950 tarihli İçtihadı Birleştirme Kararına göre bir taşınmazın haksız işgali hangi niteliktedir?
    siklar:
      - "Tarafların örtülü iradesiyle kurulmuş bir kira sözleşmesidir."
      - "Kira sözleşmesine benzetilemez; niteliği itibarıyla haksız bir eylemdir."
      - "Vekâletsiz iş görmedir; işgalci malikin işini görmüş sayılır."
      - "Geçersiz bir bağışlama sözleşmesidir."
    dogru: 1
    aciklama: |
      İBK'ya göre fuzuli işgal, tarafların karşılıklı ve birbirine uygun iradeleriyle kurdukları kira sözleşmesine benzetilemez; haksız bir eylemdir ve doğan zararın tazmini gerekir. Bu yüzden ecrimisil "kira bedeli" değil, haksız işgal tazminatıdır.

  - soru: |
      TMK m. 993'e göre iyiniyetli zilyet hakkında hangisi doğrudur?
    siklar:
      - "İyiniyetli zilyet de kullanma karşılığı ecrimisil öder, yalnız miktarı indirilir."
      - "Şeyi karineyle mevcut hakkına uygun şekilde kullanan iyiniyetli zilyet, geri vermekle yükümlü olduğu kişiye bu yüzden tazminat ödemez."
      - "İyiniyetli zilyet, şeyin kendi kusuru olmadan hasara uğramasından da sorumludur."
      - "İyiniyetli zilyet, yaptığı hiçbir gideri isteyemez."
    dogru: 1
    aciklama: |
      TMK m. 993/1 iyiniyetli zilyedi olağan kullanım ve yararlanma için tazminat yükünden kurtarır. Bu yüzden ecrimisil kötüniyetli zilyetten istenir. İyiniyetli zilyet şeyin kaybından, yok olmasından ya da hasarından sorumlu olmaz (TMK m. 993/2). Zorunlu ve yararlı giderlerini isteyebilir (TMK m. 994/1).

  - soru: |
      TMK m. 995'e göre iyiniyetli olmayan zilyet, yaptığı giderlerden hangilerini isteyebilir?
    siklar:
      - "Zorunlu ve yararlı bütün giderleri"
      - "Yalnız hak sahibi için de zorunlu olan giderleri"
      - "Hiçbir gideri"
      - "Zevk ve süs giderleri dahil bütün giderleri"
    dogru: 1
    aciklama: |
      İyiniyetli olmayan zilyet, yaptığı giderlerden ancak hak sahibi için de zorunlu olanların tazminini isteyebilir (TMK m. 995/2). Zorunlu ve yararlı giderlerin tamamını isteme hakkı iyiniyetli zilyede tanınır (TMK m. 994/1).

  - soru: |
      Ali, Veli ve Can bir dairenin eşit paylı malikleridir. Ali 2020'den beri dairede tek başına oturmaktadır. Veli bu süre içinde Ali'ye daireden yararlanmak istediğini hiç bildirmemiştir. Ali, Veli'nin paydaşlığını inkâr etmemekte, daireyi kiraya da vermemektedir. Veli 2026'da dava açıp geriye dönük beş yıllık ecrimisil ister. Hangisi doğrudur?
    siklar:
      - "Veli payı oranında beş yıllık ecrimisil isteyebilir, çünkü Ali daireyi tek başına kullanmıştır."
      - "Paydaşlar arasında ecrimisil için intifadan men gerektiğinden ve böyle bir bildirim bulunmadığından dava tarihinden önceki dönem için ecrimisil istenemez."
      - "Paydaşlar birbirinden hiçbir koşulda ecrimisil isteyemez."
      - "Veli ecrimisili payı oranında değil, dairenin tam kira değeri üzerinden ister."
    dogru: 1
    aciklama: |
      Her paydaş diğerlerinin haklarıyla bağdaştığı ölçüde paylı maldan yararlanabilir (TMK m. 693/1). Yargıtay'ın yerleşik içtihadına göre paydaşlar men edilmedikçe birbirlerinden ecrimisil isteyemez. Kiraya verme, inkâr gibi istisnalar da yoktur. İstisnalar bulunsaydı ya da intifadan men gerçekleşseydi ecrimisil payı oranında istenirdi.

  - soru: |
      Önceki sorudaki paydaşlardan Ali, binanın zemin katındaki ortak dükkânı 2021'den beri bir üçüncü kişiye kiraya vermiş ve kirayı tek başına almaktadır. Veli ihtar çekmeden dava açarak dükkân için payı oranında ecrimisil ister. Hangisi doğrudur?
    siklar:
      - "Kiraya verilerek hukuki semere elde edilen yerlerde intifadan men aranmadığından Veli payı oranında ecrimisil isteyebilir."
      - "İntifadan men her durumda şart olduğundan istem reddedilir."
      - "Veli ancak kiracıya karşı dava açabilir, Ali'ye karşı açamaz."
      - "Veli kira bedelinin tamamını isteyebilir."
    dogru: 0
    aciklama: |
      Yargıtay'a göre işyeri, konut gibi kiraya verilerek hukuki semere elde edilen yerlerde intifadan men koşulu aranmaz. Kira hukuki semeredir ve kirayı tek başına alan paydaş diğerlerinin payına düşen geliri de almış olur. Veli, beş yıllık süre içinde kalan dönem için payı oranında ecrimisil isteyebilir.

  - soru: |
      Paylı bir binada Kaan, diğer paydaşların itirazı olmadan arka bahçedeki depoyu yıllardır payına karşılık kullanmaktadır. Kaan, "Depo küçük, payımdan az yer kullanıyorum" diyerek diğer paydaşlardan ecrimisil ister. Yargıtay'ın yerleşik içtihadına göre hangisi doğrudur?
    siklar:
      - "Kaan, payı ile kullandığı yer arasındaki fark oranında ecrimisil isteyebilir."
      - "Payına karşılık çekişmesiz kullandığı bir yer bulunduğundan Kaan'ın ecrimisil davası dinlenmez; sorununu ortaklığın giderilmesi davasıyla çözmelidir."
      - "Kaan, önce intifadan men ihtarı çekerse farkı ecrimisil olarak isteyebilir."
      - "Kaan'ın davası kabul edilir, çünkü depo bütün binanın değerinden küçüktür."
    dogru: 1
    aciklama: |
      Yargıtay'a göre payına karşılık çekişmesiz olarak kullandığı bir yer bulunan paydaşın açtığı ecrimisil davası dinlenmez. Payından az yer kullandığını ileri süren paydaş sorununu kesin sonuç getiren ortaklığın giderilmesi davasıyla çözmelidir. İhtar çekmek bu sonucu değiştirmez.

  - soru: |
      Paylı mülkiyette paydaşlardan birinin, ortak taşınmaza elatan üçüncü kişiye karşı elatmanın önlenmesi davası açması hakkında hangisi doğrudur?
    siklar:
      - "Önemli yönetim işi olduğundan pay ve paydaş çoğunluğuyla karar alınmadan dava açılamaz."
      - "Bütün paydaşlar davayı birlikte açmak zorundadır."
      - "Her paydaş kendi payı bakımından malik olduğundan ve ortak menfaatleri diğerlerini temsilen koruyabildiğinden davayı tek başına açabilir."
      - "Dava ancak paydaşların oybirliğiyle atanan yönetici tarafından açılabilir."
    dogru: 2
    aciklama: |
      Her paydaş kendi payı bakımından malik hak ve yükümlülüklerine sahiptir (TMK m. 688/3). Ayrıca bölünemeyen ortak menfaatlerin korunmasını diğer paydaşları temsilen sağlayabilir (TMK m. 693/3). Bu yüzden elatmanın önlenmesi davasını tek başına açabilir. Bütün paydaşların katılımı kural olarak bütünleyici parça niteliğindeki yapıların yıkımında aranır.

  - soru: |
      Deniz, Hakan ve Nur'un eşit paylı olduğu bir arsaya, üçüncü kişi Tuncay izinsiz olarak betonarme bir ev yapmıştır. Paydaşlar arasında bir kullanım anlaşması ya da fiilî paylaşım yoktur. Hakan ve Nur evin yıkılmasına karşıdır, evi kiraya vermeyi düşünmektedir. Deniz tek başına evin yıkımını istemektedir. Hangisi doğrudur?
    siklar:
      - "Yıkım da elatmanın önlenmesi gibi tek paydaşça istenebilir; diğer paydaşların davada yer almasına hiçbir durumda gerek yoktur."
      - "Ev arsanın bütünleyici parçası olup bütün paydaşların ortak mülkiyetinde bulunduğundan, yıkım davasında kural olarak bütün paydaşların yer alması gerekir."
      - "Ev Tuncay'a ait olduğundan paydaşların yıkım istemesi mümkün değildir."
      - "Yıkım yalnız belediye tarafından istenebilir; paydaşlar isteyemez."
    dogru: 1
    aciklama: |
      Kalıcı yapı arazinin bütünleyici parçası olur ve arsanın paydaşlarına ait olur (TMK m. 722/1, TMK m. 718/2). Hukuk Genel Kurulu'na göre bu yüzden yıkım istekli davada kural olarak bütün paydaşlar yer almalıdır. İstisna, fiilî kullanım biçimi oluşmuş ve yapının bulunduğu bölümde başka kimsenin hak iddia etmediği durumlardır; olayda bu koşullar yoktur. Hafif bir yapı söz konusu olsaydı (TMK m. 728) diğer paydaşların katılması gerekmezdi.

  - soru: |
      Ankara'da oturan Ayşe, İzmir'deki tapulu arsasına elatan ve İstanbul'da oturan Kemal'e karşı mülkiyetine dayanarak elatmanın önlenmesi davası açacaktır. Hangisi doğrudur?
    siklar:
      - "Dava Kemal'in yerleşim yeri olan İstanbul'da sulh hukuk mahkemesinde açılmalıdır."
      - "Dava İzmir'de asliye hukuk mahkemesinde açılmalıdır; taşınmazın bulunduğu yer mahkemesi kesin yetkilidir."
      - "Taraflar yetki sözleşmesiyle Ankara mahkemelerini yetkili kılabilir."
      - "Dava İzmir'de sulh hukuk mahkemesinde açılmalıdır, çünkü taşınmaz davaları her durumda sulh hukukun görevindedir."
    dogru: 1
    aciklama: |
      Mülkiyete dayalı dava malvarlığı hakkına ilişkin olduğundan asliye hukuk mahkemesinde görülür (HMK m. 2/1). Sulh hukuk yalnız zilyetliğin korunmasına yönelik davalara bakar (HMK m. 4/1-c). Taşınmaz üzerindeki ayni hakka ilişkin davalarda taşınmazın bulunduğu yer mahkemesi kesin yetkilidir (HMK m. 12/1). Kesin yetki bulunan yerde yetki sözleşmesi yapılamaz.

  - soru: |
      Hakan tapulu dairesini adi yazılı bir sözleşmeyle Ece'ye satmış, 2.000.000 TL bedeli almış ve daireyi teslim etmiştir. Hakan daha sonra tapuda devirden kaçınmış ve Ece'ye karşı elatmanın önlenmesi ve ecrimisil davası açmıştır. 10.07.1940 tarihli İçtihadı Birleştirme Kararına göre hangisi doğrudur?
    siklar:
      - "Ece bedeli ödediği için malik olmuştur; dava reddedilir."
      - "Hakan bedeli iade etmedikçe Ece'yi daireyi vermeye zorlayamaz; bedel iade edilinceye kadar Ece ecrimisil ödemekle yükümlü değildir."
      - "Ece teslim tarihinden itibaren ecrimisil öder; bedel ayrıca kendisine iade edilir."
      - "Ece, bedeli ödediği için tapu iptali ve tescil yoluyla daireyi adına tescil ettirebilir."
    dogru: 1
    aciklama: |
      Taşınmaz satışı resmî şekilde yapılmadıkça geçersizdir (TMK m. 706/1, TBK m. 237/1); Ece malik olmamıştır ve geçersiz sözleşmeye dayanarak tescil isteyemez. İBK'ya göre ise satış bedelini geri vermeyen taraf taşınmazın kendisine verilmesi için karşı tarafı zorlayamaz; bedeli geri verilmeyen taraf da parası geri verilinceye kadar ürün ve ecrimisil ödemekle yükümlü değildir.

  - soru: |
      Zeynep, 2020'de kuzeni Ozan'a dairesinde ücretsiz oturma izni vermiştir. Zeynep izni geri aldığını ve daireyi boşaltmasını bildiren ihtarnameyi gönderir; ihtarname 15.01.2024'te Ozan'a tebliğ edilir. Ozan daireyi boşaltmaz. Zeynep 15.01.2026'da dava açarak dava tarihinden geriye beş yıllık ecrimisil ister. Ecrimisil hangi dönem için istenebilir?
    siklar:
      - "15.01.2021-15.01.2026 dönemi için, çünkü beş yıllık süre dava tarihinden geriye işler."
      - "Hiçbir dönem için, çünkü Ozan daireye malikin rızasıyla girmiştir."
      - "İhtarın tebliğ edildiği 15.01.2024'ten dava tarihine kadar."
      - "Yalnız dava tarihinden sonraki dönem için."
    dogru: 2
    aciklama: |
      Malikin rızasına dayanan kullanım haksız işgal değildir; bu dönem için ecrimisil istenemez. Rıza ihtarla geri alındıktan sonra Ozan'ın daireyi elinde tutması haksızdır ve artık daireyi geri vermekle yükümlü olduğunu bilmektedir (TMK m. 995/1). Beş yıllık süre ecrimisilin azami sınırıdır; haksız kullanımın olmadığı dönemlere ecrimisil kazandırmaz.

  - soru: |
      Hazineye ait bir taşınmazı işgal eden kişiden 2886 sayılı Kanun m. 75 uyarınca istenen ecrimisil hakkında hangisi doğrudur?
    siklar:
      - "İdare işgal yüzünden zarara uğradığını ve işgalcinin kusurunu ispatlamalıdır."
      - "İdarenin zarara uğramış olması gerekmez ve işgalcinin kusuru aranmaz; ecrimisil tespit tarihinden geriye beş yılı geçmemek üzere belirlenir."
      - "Ecrimisil yalnız işgalcinin iyiniyetli olmadığı ispatlanırsa ve en fazla iki yıl için istenir."
      - "İdare ecrimisili ancak asliye hukuk mahkemesinde dava açarak isteyebilir."
    dogru: 1
    aciklama: |
      2886 sayılı Kanun m. 75'e göre ecrimisil bir komisyonca tespit tarihinden geriye doğru beş yılı geçmemek üzere belirlenir. Ecrimisil istenebilmesi için idarenin işgalden dolayı zarara uğramış olması gerekmez ve işgalcinin kusuru aranmaz. Özel hukuktaki ecrimisilde ise kötüniyet aranır.

  - soru: |
      Komşu Levent, Deniz'in arsasının bir kısmını, sınırın orada olduğunu sanarak çitle kendi bahçesine katmıştır. Deniz elatmanın önlenmesini ve çitin kaldırılmasını istemektedir. Levent "Sınırı bilmiyordum, kusurum yok" diye savunur. Hangisi doğrudur?
    siklar:
      - "Elatmanın önlenmesi ve çitin kaldırılması için kusur aranmaz; istem kabul edilir. Kusur, ayrıca istenecek tazminat bakımından önem taşır."
      - "Kusuru olmayan kişiye karşı elatmanın önlenmesi istenemez."
      - "Levent iyiniyetli olduğu için arsanın o kısmının mülkiyetini kazanmıştır."
      - "Deniz yalnız tazminat isteyebilir, çitin kaldırılmasını isteyemez."
    dogru: 0
    aciklama: |
      Elatmanın önlenmesi davası mülkiyetin korunmasına yöneliktir ve davalının kusurunu aramaz (TMK m. 683/2). Elatma haksızsa sona erdirilir. Elatma yüzünden uğranılan zararın tazmini ise genel hükümlere göre kusur ister (TBK m. 49). İyiniyet tek başına tapulu taşınmazda mülkiyet kazandırmaz.

olaylar:
  - olay: |
      Ayşe, Bursa'daki boş arsasının tapuda kayıtlı tek malikidir. 2014'te yurt dışına çalışmaya gider. Arsanın karşısında oto tamir atölyesi işleten Kemal, Mart 2015'te arsayı tel çitle çevirir ve hurda araç parkı olarak kullanmaya başlar. Kemal çevredekilere "Arsa Ayşe'nin ama o nasılsa yok, boş durmasın" demektedir. 2016'da arsanın bir köşesine betonarme bir depo yapar, kenarlarına da ceviz fidanları diker.

      Ayşe 05.01.2025'te Türkiye'ye döner ve durumu aynı gün görür. 02.03.2026'da Kemal'e karşı Bursa Asliye Hukuk Mahkemesi'nde dava açarak elatmanın önlenmesini, çitin ve deponun kaldırılmasını, fidanların sökülmesini ve Mart 2015'ten dava tarihine kadar ecrimisil ister.

      Kemal cevap dilekçesinde şunları savunur: (a) "Ayşe durumu bir yılı aşkın süre önce öğrendi, dava hakkı düştü." (b) "Arsayı on yılı aşkın süredir kullanıyorum, istihkak ve elatma istemleri zamanaşımına uğradı, arsa artık benim sayılır." (c) "Ecrimisil istemi de zamanaşımına uğradı." (d) "Depoyu kendi paramla yaptım, depo benimdir."

      1. Ayşe'nin açtığı davayı nitelendiriniz; Kemal'in (a) ve (b) savunmalarını değerlendiriniz.
      2. Depo, çit ve fidanlar hakkında ne karar verilmelidir?
      3. Ecrimisil hangi şartlarla ve hangi dönem için istenebilir? Miktar nasıl belirlenir?
      4. Mahkemenin görevli ve yetkili olup olmadığını değerlendiriniz.
    olcut:
      - {tespit: "Mülkiyete dayalı elatmanın önlenmesi davasının nitelendirilmesi; tapu kaydıyla mülkiyetin ispatı, elatmanın haksızlığı ve kusurun aranmaması", puan: 20, madde: "TMK m. 683"}
      - {tespit: "TMK m. 984'teki sürenin yalnız zilyetlik davalarına ilişkin olduğu, mülkiyet davasını etkilemediği", puan: 10, madde: "TMK m. 984"}
      - {tespit: "Mülkiyete dayalı istemlerin zamanaşımına uğramaması; tapulu taşınmazda olağanüstü kazandırıcı zamanaşımıyla mülkiyet kazanılamaması", puan: 15, madde: "TMK m. 713"}
      - {tespit: "Deponun arazinin bütünleyici parçası olması, giderleri Kemal'e ait olmak üzere kal; kötüniyetli Kemal'in TMK m. 724'ten yararlanamaması; çitin kaldırılması ve fidanların sökülmesi", puan: 20, madde: "TMK m. 722"}
      - {tespit: "Ecrimisilin şartları: haksız kullanım, Kemal'in kötüniyeti, emsal kira ve ÜFE ile hesap", puan: 15, madde: "TMK m. 995"}
      - {tespit: "Beş yıllık sürenin dava tarihinden geriye işlemesi ve def'i: 02.03.2021-02.03.2026 dönemi", puan: 10, madde: "TBK m. 147"}
      - {tespit: "Asliye hukuk mahkemesinin görevi ve taşınmazın bulunduğu yer mahkemesinin kesin yetkisi", puan: 10, madde: "HMK m. 12"}
    cozum: |
      **Nitelendirme:** Ayşe tapuda kayıtlı maliktir. Kemal, arsanın Ayşe'ye ait olduğunu bilerek, hiçbir hukuki dayanak olmadan arsayı çitle çevirmiş, kullanmış, üzerine depo yapmış ve fidan dikmiştir. Dava, mülkiyete dayalı elatmanın önlenmesi, kal, eski hâle getirme ve ecrimisil istemlerini içerir. Taşınmazın tümüyle işgal edildiği bu durum uygulamada elatmanın önlenmesi davası olarak görülür.

      **Hukuki sorunlar:** (1) Davanın şartları ve Kemal'in süre savunmaları; (2) depo, çit ve fidanların akıbeti; (3) ecrimisilin şartları, dönemi ve hesabı; (4) görev ve yetki.

      **İlgili hükümler:** TMK m. 683, TMK m. 7, TMK m. 713, TMK m. 718, TMK m. 722, TMK m. 724, TMK m. 984, TMK m. 995; TBK m. 147; HMK m. 2, HMK m. 12; 25.05.1938 ve 08.03.1950 tarihli İBK'lar.

      **Değerlendirme:**

      *1. Dava ve süre savunmaları:* Malik, her türlü haksız elatmanın önlenmesini dava edebilir (TMK m. 683/2). Tapu kaydı Ayşe'nin mülkiyetini kanıtlar (TMK m. 7/1). Kemal'in malike karşı ileri sürebileceği bir hakkı (kira, rıza, irtifak) yoktur; elatma haksızdır. Bu davada kusur aranmaz.
      - Kemal'in (a) savunması TMK m. 984'e dayanır. Bu madde yalnız gasp ve saldırı nedeniyle açılan **zilyetlik davaları** için iki ay ve bir yıllık süre öngörür. Ayşe mülkiyetine dayandığı için bu süre uygulanmaz.
      - (b) savunması da yerinde değildir. Ayni haklar ilke olarak zamanaşımına uğramaz; mülkiyete dayalı istihkak ve elatmanın önlenmesi istemleri süreye bağlı değildir. Kemal'in on yılı aşan kullanımı ona mülkiyet de kazandırmaz. Olağanüstü kazandırıcı zamanaşımı, tapuya kayıtlı olmayan ya da maliki tapudan anlaşılamayan taşınmazlar için ve yirmi yıllık zilyetlikle mümkündür (TMK m. 713/1-2). Ayşe tapuda kayıtlı ve belli bir maliktir.

      *2. Depo, çit ve fidanlar:* Başkasının arazisindeki yapıda kullanılan malzeme arazinin bütünleyici parçası olur (TMK m. 722/1). Arazi mülkiyeti yapıları ve bitkileri de kapsar (TMK m. 718/2). Bu yüzden (d) savunması dinlenmez. Ayşe, rızası olmadan yapılan yapıdaki malzemenin, gideri yapıyı yaptırana ait olmak üzere sökülüp kaldırılmasını isteyebilir (TMK m. 722/3). Kemal arazinin mülkiyetinin kendisine verilmesini de isteyemez, çünkü TMK m. 724 bu imkânı yalnız iyiniyetli tarafa tanır. Kemal arsanın Ayşe'ye ait olduğunu bilerek yapı yapmıştır. Çitin kaldırılması ve fidanların sökülmesi eski hâle getirme istemi olarak kabul edilir.

      *3. Ecrimisil:* 08.03.1950 tarihli İBK'ya göre haksız işgal kira değil, haksız bir eylemdir. Ecrimisil, hak sahibinin kötüniyetli zilyetten isteyebileceği ve en az kira geliri kadar olan bir tazminattır. Kemal arsanın başkasına ait olduğunu bildiği için kötüniyetlidir. Haksız alıkoyma yüzünden verdiği zararları ve elde ettiği ürünleri tazmin eder (TMK m. 995/1). 25.05.1938 tarihli İBK'ya göre ecrimisilde beş yıllık zamanaşımı uygulanır ve süre dava tarihinden geriye işler (TBK m. 147/1 ile de ilişkilendirilir). Kemal (c) savunmasıyla zamanaşımı def'inde bulunduğu için ecrimisil 02.03.2021-02.03.2026 dönemi için hüküm altına alınır. Mart 2015-Mart 2021 arasına ilişkin istem reddedilir. Miktarı bilirkişi belirler: ilk dönem için arsanın o hâliyle serbest koşullarda getirebileceği kira emsallerle karşılaştırılarak bulunur, sonraki dönemlere ÜFE artışının tamamı yansıtılarak bulunan miktardan az olmamak üzere takdir edilir.

      *4. Görev ve yetki:* Mülkiyete dayalı dava malvarlığı hakkına ilişkindir ve asliye hukuk mahkemesinde görülür (HMK m. 2/1). Taşınmaz üzerindeki ayni hakka ilişkin davalarda taşınmazın bulunduğu yer mahkemesi kesin yetkilidir (HMK m. 12/1). Arsa Bursa'da olduğu için Bursa Asliye Hukuk Mahkemesi görevli ve yetkilidir.

      **Sonuç:**
      - Elatmanın önlenmesine, çitin kaldırılmasına, deponun giderleri Kemal'e ait olmak üzere yıkımına ve fidanların sökülmesine karar verilmelidir.
      - Kemal'in (a), (b) ve (d) savunmaları reddedilir.
      - Ecrimisil 02.03.2021-02.03.2026 dönemi için kabul, öncesi zamanaşımı nedeniyle ret edilir.

  - olay: |
      Murat, Selin ve Kaan, İzmir'deki iki katlı bir binanın eşit paylı (1/3) malikleridir. Binanın zemin katında bir dükkân, birinci katında bir daire, arka bahçede de küçük bir depo vardır.

      Kaan, diğerlerinin itirazı olmadan 2018'den beri depoyu kendi işi için kullanmaktadır. Murat Mayıs 2019'da dükkânı dava dışı Nihat'a kiraya vermiş ve kirayı tek başına almaktadır. Murat ayrıca daireye taşınmış, orada ailesiyle oturmaktadır; Selin'in paydaşlığını hiçbir zaman inkâr etmemiştir. Selin uzun süre ses çıkarmamış, sonunda Murat'a noter ihtarnamesi göndererek daireden de yararlanmak istediğini ve dükkân kirasından payını istediğini bildirmiştir. İhtarname 12.04.2023'te Murat'a tebliğ edilmiş, Murat cevap vermeden daireyi kullanmaya devam etmiştir.

      Mahallede pazar kurulan günlerde tezgâh açan esnaf Oğuz ise paydaşlardan izin almadan binanın bahçesine, sökülüp taşınabilen prefabrik bir depo barakası koymuştur.

      Selin 10.04.2026'da iki dava açar: Murat'a karşı dükkân ve daire için Mayıs 2019'dan itibaren payı oranında ecrimisil ister; Oğuz'a karşı da tek başına elatmanın önlenmesini ve barakanın kaldırılmasını ister. Murat zamanaşımı def'inde bulunur. Oğuz ise "Diğer paydaşlar davada yok, taraf teşkili eksik" diye savunur. Kaan da Murat ve Selin'e karşı ayrı bir dava açarak "Depo küçük, payımdan az yer kullanıyorum" der ve ecrimisil ister.

      1. Selin'in dükkân ve daire için ecrimisil istemlerini dönemleriyle değerlendiriniz.
      2. Selin, Oğuz'a karşı davayı tek başına açabilir mi? Oğuz'un savunmasını değerlendiriniz.
      3. Kaan'ın davası hakkında ne karar verilmelidir?
    olcut:
      - {tespit: "Paydaşın paylı maldan yararlanma hakkı ve paydaşlar arasında ecrimisil için intifadan men kuralı", puan: 15, madde: "TMK m. 693"}
      - {tespit: "Dükkânın kiraya verilmesi: hukuki semere elde edilen yerde intifadan men aranmaması, payı oranında ecrimisil", puan: 20, madde: "TMK m. 693"}
      - {tespit: "Dükkân için beş yıllık sürenin dava tarihinden geriye işlemesi: 10.04.2021-10.04.2026", puan: 10, madde: "TBK m. 147"}
      - {tespit: "Daire için intifadan menin ihtarın tebliğiyle gerçekleşmesi ve ecrimisilin 12.04.2023'ten itibaren istenebilmesi", puan: 15, madde: "TMK m. 693"}
      - {tespit: "Selin'in elatmanın önlenmesini tek başına isteyebilmesi", puan: 15, madde: "TMK m. 688"}
      - {tespit: "Barakanın hafif yapı olarak taşınır sayılması ve bütün paydaşların davada yer almasının gerekmemesi", puan: 10, madde: "TMK m. 728"}
      - {tespit: "Payına karşılık çekişmesiz yer kullanan Kaan'ın ecrimisil davasının dinlenmemesi; ortaklığın giderilmesi ya da kullanım biçiminin belirlenmesi yolu", puan: 15, madde: "TMK m. 693"}
    cozum: |
      **Nitelendirme:** Murat, Selin ve Kaan binanın eşit paylı malikleridir (TMK m. 688/1). Uyuşmazlıklar üç gruptadır: paydaşlar arasında ecrimisil, üçüncü kişinin ortak taşınmaza elatması ve bir paydaşın "payından az yer kullandığı" iddiası.

      **Hukuki sorunlar:** (1) Selin'in dükkân ve daire için ecrimisil hakkı ve dönemleri; (2) Selin'in Oğuz'a karşı tek başına dava açıp açamayacağı ve barakanın niteliği; (3) Kaan'ın ecrimisil davasının dinlenip dinlenemeyeceği.

      **İlgili hükümler:** TMK m. 688, TMK m. 693, TMK m. 728; TBK m. 147; 25.05.1938 tarihli İBK; Yargıtay'ın paydaşlar arası ecrimisile ilişkin yerleşik içtihadı.

      **Değerlendirme:**

      *1. Selin'in ecrimisil istemleri:* Her paydaş, diğerlerinin haklarıyla bağdaştığı ölçüde paylı maldan yararlanabilir (TMK m. 693/1). Bu yüzden Yargıtay'ın yerleşik içtihadına göre paydaşlar kural olarak intifadan men edilmedikçe birbirlerinden ecrimisil isteyemez. İntifadan men, davacının yararlanma isteğini davalı paydaşa bildirmesiyle gerçekleşir.
      - *Dükkân:* Murat dükkânı kiraya vermiş ve kirayı tek başına almaktadır. Kira hukuki semeredir. Kiraya verilerek gelir elde edilen yerlerde intifadan men aranmaz. Selin bu yüzden ihtardan önceki dönem için de payı oranında (1/3) ecrimisil isteyebilir. Ancak Murat zamanaşımı def'inde bulunmuştur. 25.05.1938 tarihli İBK'ya göre beş yıllık süre dava tarihinden geriye işler. Dükkân için ecrimisil 10.04.2021-10.04.2026 dönemi için istenebilir; Mayıs 2019-Nisan 2021 arası reddedilir.
      - *Daire:* Murat daireyi kendisi kullanmaktadır. Daire kiraya verilmemiştir, doğal ürün veren bir yer değildir ve Murat Selin'in paydaşlığını inkâr etmemektedir. Bu nedenle intifadan men aranır. Selin yararlanma isteğini ilk kez ihtarla bildirmiş, ihtar 12.04.2023'te tebliğ edilmiş ve Murat buna rağmen kullanımı sürdürmüştür. İntifadan men bu tarihte gerçekleşmiştir. Selin daire için 12.04.2023-10.04.2026 dönemine ait ecrimisilin 1/3'ünü isteyebilir; öncesi için istem reddedilir.
      - Miktar, bilirkişi incelemesiyle Yargıtay'ın ecrimisil hesap ilkelerine göre belirlenir.

      *2. Oğuz'a karşı dava:* Her paydaş kendi payı bakımından malik hak ve yükümlülüklerine sahiptir (TMK m. 688/3) ve bölünemeyen ortak menfaatleri diğer paydaşları temsilen koruyabilir (TMK m. 693/3). Selin, Oğuz'a karşı elatmanın önlenmesi davasını tek başına açabilir. Bütün paydaşların davada yer alması, kural olarak bütünleyici parça niteliğindeki yapıların yıkımında aranır; çünkü böyle bir yapı arsa paydaşlarının ortak mülkiyetindedir. Sökülüp taşınabilen prefabrik baraka ise kalıcı olması amaçlanmadan yapılmış hafif bir yapıdır. Taşınır mal hükümlerine tabidir ve sahibine aittir (TMK m. 728). Arsa paydaşlarının mülkiyetine girmediği için diğer paydaşların davaya katılması gerekmez. Oğuz'un taraf teşkili savunması yerinde değildir.

      *3. Kaan'ın davası:* Kaan depoyu 2018'den beri, diğerlerinin itirazı olmadan, yani payına karşılık çekişmesiz kullanmaktadır. Yargıtay'a göre payına karşılık çekişmesiz kullandığı bir yer bulunan paydaşın açtığı ecrimisil davası dinlenmez. Payından az yer kullandığını ileri süren paydaş sorununu, kesin sonuç getiren ortaklığın giderilmesi davasıyla çözmelidir. Kullanma biçimi konusunda uyuşmazlık varsa bunun hâkimce belirlenmesini de isteyebilir (TMK m. 693/2; ayrıntısı 10 ve 11. konularda).

      **Sonuç:**
      - Dükkân: 10.04.2021-10.04.2026 dönemi için payı oranında (1/3) ecrimisil kabul; öncesi zamanaşımı nedeniyle ret.
      - Daire: 12.04.2023-10.04.2026 dönemi için payı oranında ecrimisil kabul; öncesi intifadan men bulunmadığı için ret.
      - Selin, Oğuz'a karşı tek başına elatmanın önlenmesini ve barakanın kaldırılmasını isteyebilir. Diğer paydaşların davada yer alması gerekmez.
      - Kaan'ın ecrimisil davası reddedilmelidir.

  - olay: |
      Zeynep, Eskişehir'deki tapulu dairesinin malikidir. 2019'da yurt dışına giderken kuzeni Ozan'a "Ben dönene kadar kira vermeden oturabilirsin" der. Ozan aynı yıl daireye taşınır.

      Zeynep 2023 sonunda kesin olarak Türkiye'ye döner. 10.01.2024'te noter ihtarnamesiyle Ozan'a iznini geri aldığını bildirir ve daireyi boşaltmasını ister. İhtarname 15.01.2024'te Ozan'a tebliğ edilir. Ozan daireyi boşaltmaz. "Zeynep 2022'de telefonda daireyi bana 1.500.000 TL'ye satacağını söylemişti, o günden beri malik gibi davranıyorum" der. Taraflar arasında yazılı bir sözleşme yoktur ve Ozan hiçbir ödeme yapmamıştır.

      Zeynep 15.01.2026'da dava açarak elatmanın önlenmesini ve dairenin tahliyesini, ayrıca dava tarihinden geriye beş yıllık ecrimisil ister. Ozan şu savunmaları yapar: (a) "Zeynep'in izniyle oturdum, ecrimisil ödemem." (b) "Satış vaadi nedeniyle daireyi geri vermek zorunda değilim." (c) "Harici satışta alıcıdan ecrimisil istenemeyeceğine ilişkin İçtihadı Birleştirme Kararı bana da uygulanmalıdır."

      1. Ozan'ın zilyetliğini ve Zeynep'in elatmanın önlenmesi istemini değerlendiriniz.
      2. Ozan'ın (b) ve (c) savunmalarını değerlendiriniz.
      3. Ecrimisil hangi dönem için ve hangi esasa göre istenebilir? Ozan'ın (a) savunması hangi ölçüde haklıdır?
    olcut:
      - {tespit: "Rızaya dayanan kullanımın haksız olmaması ve rızanın ihtarın tebliğiyle geri alınması; bu tarihten sonra zilyetliğin haksız hâle gelmesi", puan: 20, madde: "TMK m. 683"}
      - {tespit: "Zeynep'in tapu kaydıyla malikliği; elatmanın önlenmesi ve tahliye isteminin kabulü", puan: 15, madde: "TMK m. 7"}
      - {tespit: "Sözlü satış vaadinin resmî şekil yokluğundan geçersizliği; mülkiyet ya da tescil isteme hakkı doğurmaması", puan: 20, madde: "TBK m. 237"}
      - {tespit: "1940 tarihli İBK'nın bedel ödenmediği için uygulanmaması; alıkoyma hakkının bulunmaması", puan: 15, madde: "TMK m. 706"}
      - {tespit: "Ecrimisilin 15.01.2024-15.01.2026 dönemi için istenebilmesi, öncesinin reddi; Ozan'ın ihtardan sonra kötüniyetli olması", puan: 20, madde: "TMK m. 995"}
      - {tespit: "Ecrimisilin emsal kira ve ÜFE esasına göre bilirkişiyle hesaplanması", puan: 10, madde: "TMK m. 995"}
    cozum: |
      **Nitelendirme:** Zeynep tapuda kayıtlı maliktir ve tapu kaydı bunu kanıtlar (TMK m. 7/1). Ozan daireye malikin rızasıyla, karşılıksız oturmak üzere girmiştir. Zeynep rızasını geri alıp daireyi geri istemektedir. Dava, mülkiyete dayalı elatmanın önlenmesi (tahliye) ve ecrimisil istemlerini içerir.

      **Hukuki sorunlar:** (1) Ozan'ın zilyetliğinin hangi tarihe kadar haklı olduğu; (2) sözlü satış vaadinin ve harici satışa ilişkin İBK'nın etkisi; (3) ecrimisilin başlangıcı ve hesap esası.

      **İlgili hükümler:** TMK m. 683/2, TMK m. 7, TMK m. 706, TMK m. 995; TBK m. 237; 08.03.1950, 25.05.1938 ve 10.07.1940 tarihli İBK'lar.

      **Değerlendirme:**

      *1. Zilyetlik ve elatmanın önlenmesi:* Ozan'ın 2019'dan itibaren daireyi kullanması Zeynep'in rızasına dayandığı için haksız değildir. Bu rıza, malikin "dönene kadar" verdiği ve geri alabileceği bir izindir. Zeynep ihtarnameyle iznini geri almış, ihtarname 15.01.2024'te tebliğ edilmiştir. Bu tarihten sonra Ozan'ın daireyi elinde tutması malike karşı ileri sürebileceği bir hakka dayanmaz; haksızdır. Malik, malını haksız olarak elinde bulunduran kişiye karşı dava açabilir ve her türlü haksız elatmanın önlenmesini isteyebilir (TMK m. 683/2). Taşınmazın tümüyle işgal edildiği bu durum uygulamada elatmanın önlenmesi ve tahliye davası olarak görülür. İstem kabul edilmelidir.

      *2. Satış vaadi ve İBK savunmaları:* Taşınmaz mülkiyetinin devrini amaçlayan sözleşmeler ancak resmî şekilde düzenlenirse geçerlidir (TMK m. 706/1). Taşınmaz satışı vaadi de resmî şekilde düzenlenmedikçe geçerli olmaz (TBK m. 237/2). Telefonda verilen sözlü vaat geçersizdir. Ozan'a ne mülkiyet ne de tescil isteme hakkı verir. "Malik gibi davranmak" da tapulu taşınmazda mülkiyet kazandırmaz. 10.07.1940 tarihli İBK, harici satıştan dönülmesi hâlinde **ödediği bedel kendisine geri verilmeyen** tarafı korur: bedel iade edilinceye kadar ondan ecrimisil istenmez ve taşınmazı vermeye zorlanamaz. Ozan hiçbir ödeme yapmamıştır. Geri verilmesi gereken bir bedel, dolayısıyla buna bağlı bir alıkoyma hakkı yoktur. İBK bu olaya uygulanmaz; (b) ve (c) savunmaları reddedilmelidir.

      *3. Ecrimisil ve (a) savunması:* 08.03.1950 tarihli İBK'ya göre haksız işgal haksız bir eylemdir. Ecrimisil, hak sahibinin kötüniyetli zilyetten isteyebileceği bir tazminattır. (a) savunması kısmen haklıdır: rızaya dayanan 2019-15.01.2024 döneminde haksız bir işgal yoktur ve Zeynep bu dönem için ecrimisil isteyemez. Ancak Ozan ihtarın tebliğiyle daireyi geri vermekle yükümlü olduğunu öğrenmiştir ve bu tarihten sonra iyiniyetli sayılamaz. İyiniyetli olmayan zilyet, şeyi haksız alıkoyması yüzünden hak sahibine verdiği zararları tazmin eder (TMK m. 995/1). Bu nedenle ecrimisil 15.01.2024-15.01.2026 dönemi için istenebilir. 25.05.1938 tarihli İBK'daki beş yıllık süre ecrimisilin istenebileceği azami geçmişi gösterir; haksız kullanımın bulunmadığı döneme ecrimisil kazandırmaz. Zeynep'in istemi bu dönemi aşan kısım için reddedilir. Miktar bilirkişi incelemesiyle belirlenir: ilk dönem için dairenin serbest koşullarda getirebileceği kira emsallerle karşılaştırılarak bulunur, sonraki döneme ÜFE artışı yansıtılır.

      **Sonuç:**
      - Elatmanın önlenmesine ve dairenin tahliyesine karar verilmelidir.
      - Sözlü satış vaadi geçersizdir. Harici satışa ilişkin İBK, Ozan bedel ödemediği için uygulanmaz.
      - Ecrimisil 15.01.2024-15.01.2026 dönemi için kabul, öncesi için ret edilmelidir.

kartlar:
  - on: "TMK m. 683/1'e göre malikin üç yetkisi nedir?"
    arka: "Kullanma, yararlanma ve tasarruf. Malik bunları hukuk düzeninin sınırları içinde kullanır."
  - on: "İstihkak davası nedir?"
    arka: "Zilyetliği elinden çıkmış malikin, malını haksız olarak elinde bulunduran kişiden geri istemesi (TMK m. 683/2)."
  - on: "Elatmanın önlenmesi davası nedir?"
    arka: "Malikin mülkiyetine yönelen her türlü haksız müdahalenin sona erdirilmesini istemesi (TMK m. 683/2). Kal ve eski hâle getirme bu davanın sonuçlarıdır."
  - on: "Tapulu taşınmazın işgalinde dava uygulamada hangi adla açılır?"
    arka: "Genellikle elatmanın önlenmesi ya da elatmanın önlenmesi ve tahliye davası olarak."
  - on: "İstihkak ve elatmanın önlenmesi istemleri zamanaşımına uğrar mı?"
    arka: "Hayır. Ayni haklar ilke olarak zamanaşımına uğramaz. Yanlarına eklenen ecrimisil ve tazminat ise zamanaşımına tabidir."
  - on: "Zilyetlik davası ile mülkiyet davasının süre ve görev farkı?"
    arka: "Zilyetlik davası 2 ay / her hâlde 1 yıl (TMK m. 984), sulh hukuk (HMK m. 4/1-c). Mülkiyet davası süresiz, asliye hukuk (HMK m. 2)."
  - on: "Elatmanın önlenmesi davasında hangi mahkeme kesin yetkilidir?"
    arka: "Taşınmazın bulunduğu yer mahkemesi (HMK m. 12/1)."
  - on: "Elatmanın önlenmesi ve kal için kusur aranır mı?"
    arka: "Hayır. Kusur yalnız elatma yüzünden uğranılan zararın tazmini için aranır (TBK m. 49)."
  - on: "Paylı mülkiyette elatmanın önlenmesi davasını kim açar?"
    arka: "Her paydaş tek başına (TMK m. 688/3) ve diğerlerini temsilen (TMK m. 693/3). Elbirliğinde her ortak (TMK m. 702/4)."
  - on: "Paylı arsadaki betonarme binanın yıkımında taraf teşkili?"
    arka: "Bina bütünleyici parça olduğundan kural olarak bütün paydaşlar davada yer alır. Fiilî kullanım biçimi varsa ve başka kimse hak iddia etmiyorsa istisna yapılır. Hafif yapılarda (TMK m. 728) gerekmez."
  - on: "Ecrimisil nedir?"
    arka: "Hak sahibinin, taşınmazını haksız olarak kullanan kötüniyetli zilyetten isteyebileceği haksız işgal tazminatı. En az kira geliri kadardır."
  - on: "1950 tarihli İBK haksız işgal hakkında ne der?"
    arka: "Haksız işgal kira sözleşmesine benzetilemez; niteliği itibarıyla haksız bir eylemdir."
  - on: "Ecrimisilde zamanaşımı nasıl işler?"
    arka: "1938 tarihli İBK'ya göre beş yıl, dava tarihinden geriye doğru. Davalı def'i olarak ileri sürmelidir."
  - on: "İyiniyetli zilyet ecrimisil öder mi?"
    arka: "Hayır. Karineyle mevcut hakkına uygun kullanan iyiniyetli zilyet tazminat ödemez (TMK m. 993/1). Kötüniyetli zilyet zarar ve ürünleri öder (TMK m. 995/1)."
  - on: "İntifadan men nedir?"
    arka: "Paydaşın ortak taşınmazdan ya da gelirinden yararlanma isteğini diğer paydaşa bildirmesi. Paydaşlar arası ecrimisil kural olarak bundan sonraki dönem için istenir."
  - on: "İntifadan men nasıl ispatlanır?"
    arka: "Her türlü delille, örneğin noter ihtarnamesi ya da tanıkla."
  - on: "İntifadan menin aranmadığı hâller?"
    arka: "Kiraya verilen ya da doğal ürün veren yer, paydaşlığın inkârı, kullanım anlaşması, önceki dava ya da icra takibi, kamu malı, başlı başına gelir getiren işletme."
  - on: "Payına karşılık çekişmesiz yer kullanan paydaş ecrimisil isteyebilir mi?"
    arka: "Hayır, davası dinlenmez. Payından az kullandığını ileri sürüyorsa ortaklığın giderilmesi davası açmalıdır."
  - on: "Harici satış alıcısından ecrimisil istenebilir mi? (1940 tarihli İBK)"
    arka: "Ödediği bedel kendisine geri verilmeyen alıcı, parası geri verilinceye kadar ürün ve ecrimisil ödemez. Satıcı bedeli vermeden taşınmazı geri almak için onu zorlayamaz."
  - on: "Malikin izniyle oturan kişiden ecrimisil ne zamandan istenir?"
    arka: "İzin dönemi için istenmez. Rıza geri alınınca, uygulamada ihtarın tebliğinden itibaren istenir."
  - on: "Ecrimisil nasıl hesaplanır?"
    arka: "İlk dönem için emsal kira sözleşmeleriyle karşılaştırılarak serbest koşullardaki kira değeri bulunur. Sonraki dönemler ilk döneme ÜFE artışı yansıtılarak bulunan miktardan az olmamak üzere takdir edilir."
  - on: "İdarelerin ecrimisilinde (2886 sayılı Kanun m. 75) özel hukuktan farkı?"
    arka: "İdarenin zarara uğraması gerekmez ve işgalcinin kusuru aranmaz. Komisyon tespit tarihinden geriye en fazla beş yıl için belirler."
