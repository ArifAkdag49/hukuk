ozet: |
  - **Tahkikat:** Ön inceleme tutanağında belirlenen çekişmeli vakıaların delillerle araştırıldığı aşamadır (HMK m. 140/3). Bütün iddia ve savunmalar birlikte incelenir; hâkim muhakemeyi kısaltmak için birini öne alabilir (HMK m. 143).
  - **Tarafların dinlenmesi:** Mahkeme tarafları vakıalar hakkında dinleyebilir; gelmeleri için verilecek süre **iki haftadan az olamaz** (HMK m. 144/2).
  - **Sonradan delil:** Kural yasaktır; delilin sonradan sunulması yargılamayı geciktirme amacı taşımıyorsa **veya** süresinde sunulamaması tarafın kusurundan kaynaklanmıyorsa mahkeme izin verebilir (HMK m. 145).
  - **Duruşmaya davet:** Davetiyede yokluklarında devam edileceği, tahkikatın bittiği duruşmada sözlü yargılamaya geçileceği ve sözlü yargılama için ertelemede ayrıca davetiye gönderilmeyeceği ihtar edilir (HMK m. 147/2).
  - 📌 **Duruşmalar arası süre:** 7589 sayılı Kanunla eklenen HMK m. 147/3'e göre üç aydan uzun olamaz; bilirkişi incelemesinin uzaması veya istinabe gibi zorunlu hâllerde hâkim gerekçesini yazarak daha uzun süre belirleyebilir.
  - **Ses ve görüntü nakli:** Taraf veya vekil için yalnız talep üzerine, tanık, bilirkişi ve uzman için resen veya talep üzerine (HMK m. 149/1-2). 📌 HMK m. 149'a eklenen yeni fıkra 31.10.2026'da yürürlüğe girecektir.
  - **Gelmeme (HMK m. 150):** İşlemden kaldırma; üç ay içinde yenileme; ilk bir ayda yenilemede harç yok, sonra harç var ve karşı tarafa yüklenemez; yenilenmezse sürenin dolduğu gün açılmamış sayılır; ilk yenilemeden sonra bir defadan fazla takipsiz bırakılırsa dava açılmamış sayılır.
  - **Ön sorun (HMK m. 163-164):** Mahkemenin kendi çözdüğü ara mesele. **Bekletici sorun (HMK m. 165):** Hükmün başka bir davaya veya idari makamın tespitine bağlı olması; yargılama bekletilir.
  - **Birleştirme (HMK m. 166):** Aynı yargı çevresinde ilk davanın açıldığı mahkemede; ayrı çevrelerde ikinci davanın mahkemesinden talep üzerine. 📌 İlk mahkeme, birleştirme kararının kesinleşmesinden itibaren bununla bağlıdır.
  - **Ayırma (HMK m. 167)** davanın her aşamasında yapılabilir. 📌 **Kanun yolu (HMK m. 168):** aynı yargı çevresindeki birleştirme kararına karşı sadece istinaf; ilk derece mahkemesinin ayırma kararına karşı istinaf ancak hükümle birlikte.
anlatim: |
  ## 1. Tahkikat nedir, nerede durur?
  Birinci derece yazılı yargılamasının sırası şöyledir: dilekçeler, ön inceleme, **tahkikat**, sözlü yargılama, hüküm. Ön inceleme duruşmasında hâkim tarafların anlaştığı ve anlaşamadığı noktaları tutanağa bağlar; **tahkikat bu tutanak esas alınarak yürütülür** (HMK m. 140/3). Yani tahkikat, çekişmeli vakıaların delillerle araştırıldığı aşamadır.

  Tahkikat, hâkimin delillerin incelenmesinden sonra davanın aydınlandığını görmesi ve tarafların açıklamalarını almasıyla biter. Hâkim bunu taraflara tefhim eder (HMK m. 146 ve HMK m. 184). Tahkikatın bitişi pratikte çok önemlidir, çünkü ıslah gibi bazı işlemler tahkikatın sonuna kadar yapılabilir.

  > 💡 **Püf nokta:** Tahkikatın bittiği duruşmada aynı oturumda sözlü yargılamaya geçilir; ancak taraflardan birinin talebi üzerine duruşma iki haftadan az olmamak üzere ertelenir ve sözlü yargılama için taraflara ayrıca davetiye gönderilmez (HMK m. 186/1). Sözlü yargılamada yeni delil toplanmaz; taraflara son sözleri sorulur ve hüküm verilir.

  ## 2. Tahkikatın konusu: iddia ve savunmaların incelenmesi
  Tarafların ileri sürdüğü **bütün iddia ve savunmalar birlikte incelenir** (HMK m. 143/1). Ancak hâkim, muhakemeyi basitleştirmek veya kısaltmak için, resen ya da bir tarafın talebi üzerine, tahkikatın her aşamasında iddia veya savunmalardan birinin ya da bir kısmının diğerinden önce incelenmesine karar verebilir (HMK m. 143/2).

  > **Örnek:** Davalı, hem borcun var olmadığını hem de zamanaşımına uğradığını savunuyor. Zamanaşımı savunması yerinde çıkarsa esas hakkında uzun bir delil toplamaya gerek kalmaz. Hâkim önce bu savunmayı incelemeye karar verebilir.

  ## 3. Tarafların dinlenmesi
  Mahkeme tahkikatta iki tarafı usulüne uygun davet edip davada ileri sürülen vakıalar hakkında dinleyebilir (HMK m. 144/1). Mahkemeye gelmeleri için tarafa verilecek süre **iki haftadan az olamaz**; bu süre mahkemece resen veya taraflardan birinin talebi üzerine uzatılabileceği gibi kısaltılabilir (HMK m. 144/2).

  > ⚠️ **Sınav kuralı:** Tarafların hâkim tarafından dinlenmesi, teknik anlamda isticvap değildir. İsticvabın ayrı kuralları vardır (HMK m. 169 vd.); gelmemenin "ikrar sayılma" sonucu yalnız isticvapta söz konusudur.

  ## 4. Sonradan delil gösterilmesi
  Taraflar Kanunda belirtilen süreden sonra **delil gösteremezler**. Bu kuralın istisnası HMK m. 145'te yer alır: bir delilin sonradan ileri sürülmesi yargılamayı geciktirme amacı taşımıyorsa **veya** süresinde ileri sürülememesi ilgili tarafın kusurundan kaynaklanmıyorsa mahkeme o delilin gösterilmesine izin verebilir.

  İki şart "veya" ile bağlıdır; ama izin vermek mahkemenin takdirindedir ve kanun "izin verebilir" der. Ayrıca bu madde delille ilgilidir. Yeni vakıa ileri sürmek HMK m. 141'deki iddia ve savunmanın genişletilmesi yasağına tabidir.

  Ön inceleme duruşmasında da bir kesin kural vardır. Dilekçelerinde gösterdikleri belgeleri ihtara rağmen sunmayan veya belgelerin getirtilmesi için gerekli açıklamayı yapmayan taraf, bu delillere dayanmaktan vazgeçmiş sayılır (HMK m. 140/5).

  > **Örnek:** Davalı işveren, cevap dilekçesinde ücret bordrolarına dayanmış, ön inceleme davetiyesindeki ihtara rağmen belgeleri sunmamıştır. Bu delile dayanmaktan vazgeçmiş sayılır (HMK m. 140/5). Yargılamanın çok ileri bir aşamasında, nedenini açıklamadan bordroları sunmak isterse HMK m. 145 şartları da gerçekleşmediği için belgeler dikkate alınmaz.

  ## 5. Duruşmaya davet ve davetiyedeki ihtarlar
  Taraflar ön inceleme tamamlandıktan sonra tahkikat ve sözlü yargılama için duruşmaya davet edilir (HMK m. 147/1). Davetiyede şunlar bildirilir (HMK m. 147/2):
  - Geçerli özrü olmadan gelmezlerse duruşmaya yokluklarında devam edilecek ve yapılan işlemlere itiraz edemeyeceklerdir.
  - Tahkikatın sona erdiği duruşmada sözlü yargılamaya geçilecektir.
  - Sözlü yargılama için duruşma ertelenirse taraflara **ayrıca davetiye gönderilmeyecektir**.
  - HMK m. 150 saklı kalmak kaydıyla yokluklarında hüküm verilebilecektir.

  ### 📌 Duruşmalar arası üç ay sınırı
  7589 sayılı Kanunla (16.07.2026) HMK m. 147'ye üçüncü fıkra eklenmiştir: **duruşmalar arasındaki süre üç aydan daha uzun olamaz.** İşin niteliği gereği bilirkişi incelemesinin uzaması veya istinabe yoluyla tahkikat işlemlerinin yürütülmesi gibi zorunlu hâllerde hâkim gerekçesini belirterek daha uzun bir süre belirleyebilir. Bu hükmün görülmekte olan davalara nasıl uygulanacağına dair geçiş kuralları ayrıca incelenmelidir; bu notta geçiş hükmü hakkında bilgi verilmemiştir.

  ## 6. Ses ve görüntü nakli (e-duruşma)
  Bugün yürürlükte olan HMK m. 149 metni şöyle ayrışır:
  - **Taraf veya vekil:** Mahkeme yalnız **taraflardan birinin talebi üzerine** talep eden tarafın veya vekilinin, aynı anda ses ve görüntü nakli yoluyla bulundukları yerden duruşmaya katılmalarına karar verebilir (HMK m. 149/1). "Verebilir" dendiği için karar mahkemenin takdirindedir.
  - **Tanık, bilirkişi, uzman:** Mahkeme **resen veya talep üzerine** bunların bulundukları yerden dinlenmesine karar verebilir (HMK m. 149/2).
  - Tarafların serbestçe tasarruf edemeyeceği davalarda ilgililerin dinlenmesine resen karar verilebilir (HMK m. 149/3).

  > 📌 **Güncel not:** 7589 sayılı Kanunun 22. maddesiyle HMK m. 149'a üçüncü fıkradan sonra gelmek üzere yeni bir fıkra eklenmiştir. Bu fıkra **31.10.2026'da yürürlüğe girecek** ve henüz resmî metne işlenmemiştir. Fıkranın içeriğini bu nottaki kaynaklardan doğrulayamadık; Resmî Gazete'deki kanun metnine bakmadan içerik yazmayın. Yürürlük tarihinde sonraki fıkraların numarası da kayacaktır.

  ## 7. Duruşmaya gelmeme: HMK m. 150
  Usulüne uygun davet edilen **iki taraf da gelmezse** veya gelip davayı takip etmeyeceğini bildirirse dosya **işlemden kaldırılır** (HMK m. 150/1). Taraflardan biri gelir diğeri gelmezse, gelen tarafın talebi üzerine gelmeyenin yokluğunda devam edilir **veya** dosya işlemden kaldırılır; özürsüz gelmeyen taraf yokluğunda yapılan işlemlere itiraz edemez (HMK m. 150/2). Gün tespiti için tarafların başvurması gereken hâllerde son işlemden itibaren bir ay geçerse de dosya işlemden kaldırılır (HMK m. 150/3).

  ### Yenileme ve harç
  | Durum | Sonuç |
  | --- | --- |
  | Üç ay içinde yenileme | Dava devam eder (HMK m. 150/4) |
  | İlk bir ay içinde yenileme | Yeniden harç alınmaz |
  | Bir ay geçtikten sonra (üç ay içinde) yenileme | Yeniden harç alınır; yenileyen öder, karşı tarafa yüklenemez |
  | Üç ay içinde yenilememe | Sürenin dolduğu gün açılmamış sayılır (HMK m. 150/5) |

  Harç verilerek yenilenen dava eski davanın devamı sayılır. Üç ayda yenilenmeyen davada mahkeme kendiliğinden karar verip kaydı kapatır; bu karar durumu açıklar, hukuki sonuç sürenin dolduğu gün doğmuştur.

  ### Üçüncü takipsizlik
  İşlemden kaldırılıp yenilenmiş dava, **ilk yenilenmeden sonra bir defadan fazla takipsiz bırakılamaz**; aksi hâlde dava açılmamış sayılır (HMK m. 150/6). Hangi sebeple olursa olsun açılmamış sayılan davadaki talep dahi vaki olmamış sayılır (HMK m. 150/7).

  Sayarak gidelim: dava birinci kez işlemden kaldırılır ve yenilenir; ikinci kez işlemden kaldırılabilir ve yine yenilenebilir; **üçüncü kez** takipsiz kalırsa dava açılmamış sayılır. Yargıtay Hukuk Genel Kurulu da bu şekilde uygulamıştır (bkz. kararlar).

  > ⚠️ **Sınav tuzağı:** "İlk yenilemeden sonra bir defadan fazla takipsiz bırakılamaz" cümlesini "dava yalnız bir kez yenilenebilir" diye okumak yanlıştır. İlk işlemden kaldırmadan sonra yenilenen dava bir kez daha takipsiz kalabilir; üçüncü takipsizlik açılmamış sayılma sonucunu doğurur.

  > ⚠️ **İstisna: basit yargılama.** Bu sayım yazılı yargılama usulü içindir. Basit yargılama usulüne tabi davalarda işlemden kaldırılan dosya, yenilenmesinden sonra takipsiz bırakılırsa dava açılmamış sayılır (HMK m. 320/4). Yani orada ikinci takipsizlik yeterlidir.

  ## 8. Ön sorun
  Yargılama sırasında davaya ilişkin bir **ön sorun** ortaya çıkarsa ilgili taraf bunu dilekçeyle veya duruşmada sözlü olarak ileri sürebilir (HMK m. 163). Hâkim sorunu incelemeye değer bulursa belirlediği süre içinde, varsa delilleriyle birlikte cevap vermesi için diğer tarafa tefhim veya tebliğ eder. Taraflar arasında uyuşmazlık varsa gerekirse tarafları dinleyip kararını verir ve kararı tefhim veya tebliğ eder (HMK m. 164).

  Ön sorun, **davaya bakan mahkemenin kendisinin çözdüğü** ara sorundur. Kanun terimi tanımlamaz; öğretideki yaygın kullanımla davanın esasından önce halledilmesi gereken, tali nitelikte usuli veya maddi meselelerdir.

  > **Örnek:** Davalı, davacının dava ehliyeti bulunmadığını ileri sürüyor. Mahkeme bunu kendisi inceler, karşı tarafa cevap süresi verir ve karar verir.

  ## 9. Bekletici sorun
  Bir davada hüküm verilebilmesi başka bir davaya, idari makamın tespitine veya dava konusuyla ilgili bir hukuki ilişkinin mevcut olup olmadığına kısmen veya tamamen bağlıysa mahkeme, o davanın sonuçlanmasına veya idari makamın kararına kadar **yargılamayı bekletebilir** (HMK m. 165/1).

  Çözüm başka bir davanın ya da idari makamın kararına bağlıysa mahkeme ilgili tarafa görevli mahkemeye veya idari makama başvurması için uygun süre verir. Bu süre içinde başvurulmazsa o taraf **bu husustaki iddiasından vazgeçmiş sayılır** ve esas dava hakkında karar verilir (HMK m. 165/2).

  | | Ön sorun | Bekletici sorun |
  | --- | --- | --- |
  | Kim çözer? | Davaya bakan mahkeme | Başka mahkeme veya idari makam |
  | Yargılama? | Devam eder | Beklenir |
  | Madde | HMK m. 163-164 | HMK m. 165 |

  > ⚠️ **Sınav uyarısı:** Başka bir dava açık olsa bile her ilgili dava bekletici sorun yapılmaz; hükmün gerçekten o davanın sonucuna bağlı olması gerekir. Hukuk Genel Kurulu, dava dışı bir şirkete ilişkin davayı bekletici sorun saymamıştır; buna karşılık sonucu hukuk hâkimini bağlayacak ceza yargılamasının sonucunun beklenmesi gerekebilir (bkz. kararlar).

  ## 10. Davaların birleştirilmesi
  **Aynı yargı çevresinde**, aynı düzey ve sıfattaki hukuk mahkemelerinde açılmış davalar, aralarında bağlantı varsa davanın her aşamasında, talep üzerine veya kendiliğinden **ilk davanın açıldığı mahkemede** birleştirilebilir (HMK m. 166/1). Birleştirme kararını ikinci davaya bakan mahkeme verir; karar derhâl ilk davanın açıldığı mahkemeye bildirilir (HMK m. 166/3). 📌 7589 sayılı Kanunla değişen cümleye göre ilk davanın açıldığı mahkeme birleştirme kararının **kesinleşmesinden itibaren** bununla bağlıdır.

  **Ayrı yargı çevrelerinde** ise birleştirme **ikinci davanın açıldığı mahkemeden** talep edilebilir; birinci davanın mahkemesi, talebin kabulü ile birleştirme kararının kesinleşmesinden itibaren bununla bağlıdır (HMK m. 166/2). Birleştirme kararı derhâl ilk davanın mahkemesine bildirilir (HMK m. 166/3).

  **Bağlantı** şu durumlarda vardır: davaların aynı veya birbirine benzer sebeplerden doğması ya da birinde verilecek hükmün diğerini etkileyecek nitelikte olması (HMK m. 166/4). İstinaf incelemesi ayrı dairelerde yapılması gereken davalar da birleştirilebilir; bu durumda istinaf, asıl hukuki ilişkiye ait kararı inceleyen bölge adliye mahkemesi dairesinde yapılır (HMK m. 166/5).

  > **Örnek:** Ali'nin Zeynep'e karşı Ankara'daki 3. Asliye Hukuk Mahkemesinde açtığı alacak davası ile aynı sözleşmeden doğan ve sonradan Ankara'daki 7. Asliye Hukuk Mahkemesinde açılan dava aynı yargı çevresindedir. Birleştirme, hangisi önce açıldıysa o mahkemede yapılır.

  ## 11. Davaların ayrılması
  Mahkeme, yargılamanın iyi bir şekilde yürütülmesini sağlamak için birlikte açılmış veya sonradan birleştirilmiş davaların ayrılmasına davanın her aşamasında, talep üzerine veya kendiliğinden karar verebilir. Ayrılan davalara bakmaya devam eder (HMK m. 167).

  ## 12. 📌 Birleştirme ve ayırma kararlarına karşı kanun yolu
  7589 sayılı Kanunla yeniden düzenlenen HMK m. 168 şöyledir:
  - **Birleştirme:** Aynı yargı çevresinde yer alan aynı düzey ve sıfattaki hukuk mahkemelerinde görülen davalar yönünden verilen birleştirme kararına karşı **sadece istinaf yoluna** başvurulabilir (HMK m. 168/1).
  - **Ayırma:** İlk derece mahkemelerinin ayırma kararlarına karşı istinaf yoluna, bölge adliye mahkemelerinin birleştirme ve ayırma kararları hakkında ise temyiz yoluna **ancak hükümle birlikte** gidilebilir. Bu husus tek başına bölge adliye mahkemesinde hükmün kaldırılmasını, Yargıtayda bozmayı gerektirmez (HMK m. 168/2).

  ## 13. Denetim şeması
  1. Dosya hangi aşamada? Tahkikat bitti mi (HMK m. 146, HMK m. 184)?
  2. Taraflar usulüne uygun davet edildi mi, davetiyede HMK m. 147/2 ihtarları var mı?
  3. Duruşmalar arası süre üç ayı aşıyor mu, aşıyorsa zorunlu hâl gerekçesi yazılmış mı (HMK m. 147/3)?
  4. Gelmeyen varsa HMK m. 150: işlemden kaldırma, yenileme süresi, harç, kaçıncı takipsizlik?
  5. Süreden sonra delil varsa HMK m. 145'in iki şartından biri var mı?
  6. Ara mesele mahkemenin kendisinin çözeceği bir ön sorun mu, başka mercie bağlı bir bekletici sorun mu?
  7. Birleştirme: yargı çevresi aynı mı, hangi mahkeme, bağlantı var mı, kanun yolu nedir?
kritik: |
  - 📌 Tarafları dinlemek için verilecek süre **iki haftadan az olamaz** (HMK m. 144/2).
  - 📌 Duruşmalar arası süre **üç aydan uzun olamaz**; zorunlu hâllerde gerekçeli istisna vardır (HMK m. 147/3, 7589 sayılı Kanun).
  - ⚠️ Sözlü yargılama için duruşma ertelenirse taraflara **ayrıca davetiye gönderilmez** (HMK m. 147/2).
  - 📌 Sonradan delil: geciktirme amacı yoksa **veya** süresinde sunulamaması kusurdan kaynaklanmıyorsa izin verilebilir (HMK m. 145).
  - ⚠️ Taraf/vekilin e-duruşma ile katılımı **yalnız talep üzerine**; tanık, bilirkişi ve uzman için **resen veya talep üzerine** (HMK m. 149/1-2).
  - 📌 HMK m. 149'a eklenen yeni fıkra 31.10.2026'da yürürlüğe girecek; içeriği resmî metne işlenmediği için ayrıca doğrulanmalıdır.
  - 📌 İşlemden kaldırılan dava **üç ay içinde** yenilenir; ilk bir ayda harç yok, sonra harç var ve karşı tarafa yüklenemez (HMK m. 150/4).
  - 📌 Üç ayda yenilenmeyen dava **sürenin dolduğu gün** açılmamış sayılır; mahkeme kendiliğinden karar verir (HMK m. 150/5).
  - ⚠️ İlk yenilemeden sonra bir defadan fazla takipsiz kalırsa (üçüncü takipsizlik) dava açılmamış sayılır; açılmamış sayılan davadaki talep dahi vaki olmamış sayılır (HMK m. 150/6-7). Basit yargılamada yenilemeden sonraki ilk takipsizlik yeterlidir (HMK m. 320/4).
  - ⚠️ **Ön sorunu** davaya bakan mahkeme çözer, **bekletici sorunda** karar başka mahkemeden veya idari makamdan beklenir (HMK m. 163-165).
  - 📌 Bekletici sorunda verilen sürede başvurmayan taraf o husustaki iddiasından vazgeçmiş sayılır (HMK m. 165/2).
  - 📌 Aynı yargı çevresinde birleştirme **ilk davanın mahkemesinde**; ayrı çevrelerde **ikinci davanın mahkemesinden talep üzerine** (HMK m. 166/1-2).
  - 📌 Aynı çevredeki birleştirme kararına karşı **sadece istinaf**; ilk derece ayırma kararına karşı istinaf **ancak hükümle birlikte** (HMK m. 168).
doktrin: |
  ### Ön sorun ile bekletici sorunun sınırı
  Kanun "ön sorun" terimini tanımlamaz. Öğretide ölçüt şudur: sorunu davaya bakan mahkeme kendisi çözebiliyorsa ön sorun, çözüm başka bir mahkemenin veya idari makamın yetkisindeyse bekletici sorundur. HMK m. 165'in metni "hukuki ilişkinin mevcut olup olmadığı"na bağlılığı da saydığı için, bu ayrım uygulamada bazı örneklerde birbirine yaklaşır; sınavda sorun çözüm yetkisini kimin taşıdığına bakılarak ayrılmalıdır.

  ### Bekletici sorun yapmanın ölçüsü
  Başka bir davanın açık olması tek başına yargılamayı bekletmeyi gerektirmez. Yargıtay Hukuk Genel Kurulu, hükmün o davanın sonucuna gerçekten bağlı olup olmadığına bakar. Dava dışı bir şirkete ilişkin davanın eldeki davayı etkilemeyeceği hâllerde bekletmeye gerek görülmemiştir. Ceza yargılamasının sonucunun hukuk hâkimini bağlayacağı durumlarda ise ceza dosyasının sonucu beklenebilir. Hukuk hâkiminin ceza kararlarıyla ne ölçüde bağlı olduğu ise ayrıca değerlendirilen bir konudur.

  ### Ayrı yargı çevrelerindeki birleştirme ve kanun yolu
  HMK m. 168/1 yalnız aynı yargı çevresindeki mahkemelerde görülen davalar yönünden verilen birleştirme kararından söz eder. Ayrı yargı çevreleri için yapılan birleştirme kararına karşı hangi yola gidileceği, bu hükmün kıyasen uygulanıp uygulanmayacağı bakımından tartışmalıdır; bu noktada kesin bir kural öğrenmek yerine metnin sınırını bilmek yeterlidir.

  ### Sonradan delil ve ön inceleme sınırı
  Dilekçede gösterilen belgelerin ihtara rağmen sunulmaması HMK m. 140/5'e göre dayanmaktan vazgeçme sonucunu doğurur. Yargıtay Hukuk Genel Kurulu bu konuda, süresinde sunulması gereken ve baştan beri taraf elinde bulunan belgenin sonradan sunulmasında kusurun taraf ihmalinden kaynaklandığını kabul etmektedir. Bu yüzden HMK m. 145, kural olarak taraf kusurunu örtmek için kullanılamaz. Aynı karardaki karşı oy ise borcu sona erdiren ödeme belgelerinin (makbuz, ibraname gibi) yargılamanın her aşamasında dikkate alınması gerektiğini savunmuştur; ödeme belgeleri bakımından konu tartışmalıdır.

  ### Üçüncü takipsizlik hesabı
  HMK m. 150/6'nın dili ("ilk yenilenmeden sonra bir defadan fazla") sayma konusunda kafa karıştırır. Yargıtay uygulaması davanın en çok iki kez takipsiz bırakılıp yenilenebileceğini, üçüncü takipsizliğin açılmamış sayılma sonucunu doğuracağını kabul etmektedir. Basit yargılama usulünde HMK m. 320/4 daha sıkı bir kural koyar: yenilemeden sonra takipsiz bırakılan dava açılmamış sayılır.
sozluk:
  - terim: Tahkikat
    tanim: "Ön inceleme tutanağında çekişmeli bırakılan vakıaların deliller yoluyla araştırıldığı aşama."
  - terim: İşlemden kaldırma
    tanim: "Taraflar duruşmaya gelmediğinde veya davayı takip etmeyeceklerini bildirdiğinde dosyanın bekletilmesine karar verilmesi; üç ay içinde yenilenebilir."
  - terim: Davanın yenilenmesi
    tanim: "İşlemden kaldırılan davaya dilekçeyle devam edilmesi; bir ay geçtikten sonra yenilemede yeniden harç alınır."
  - terim: Açılmamış sayılma
    tanim: "Yenilenmeyen veya fazla takipsiz bırakılan davanın hiç açılmamış gibi kabul edilmesi; talep dahi vaki olmamış sayılır."
  - terim: Ön sorun
    tanim: "Yargılama sırasında ortaya çıkan ve davaya bakan mahkemenin kendisinin çözdüğü ara mesele."
  - terim: Bekletici sorun
    tanim: "Hükmün başka bir davaya veya idari makamın tespitine bağlı olması nedeniyle yargılamanın beklenmesi."
  - terim: Bağlantı
    tanim: "Davaların aynı veya benzer sebeplerden doğması ya da birinde verilecek hükmün diğerini etkileyecek nitelikte olması."
  - terim: Birleştirme
    tanim: "Bağlantılı davaların tek mahkemede ve tek dosyada görülmesi."
  - terim: Ayırma
    tanim: "Birlikte açılmış veya birleştirilmiş davaların yargılamanın iyi yürütülmesi için ayrı dosyalara bölünmesi."
  - terim: Ses ve görüntü nakli
    tanim: "Taraf, vekil, tanık, bilirkişi veya uzmanın bulunduğu yerden aynı anda ses ve görüntü yoluyla duruşmaya katılması (e-duruşma)."
  - terim: Sonradan delil
    tanim: "Kanunda belirtilen süreden sonra gösterilen delil; yalnız HMK m. 145 şartlarıyla kabul edilebilir."
kararlar:
  - id: "1157369700"
    ozet: |
      Davacı işçi, yurt dışındaki işyerinde çalıştığı dönem için kıdem ve ihbar tazminatı ile fazla çalışma ücreti gibi alacakları istemiştir. Davalı işveren cevap dilekçesinde fazla çalışmanın ücrete dâhil olduğunu savunmuş, bordroları delil olarak göstermiş; dosya bölge adliye mahkemesinin kaldırma kararıyla ilk derece mahkemesine dönünce, dava açıldıktan yaklaşık dört yıl sonra, sunmadığı ödeme belgelerini dilekçe ekinde sunmuştur.

      Hukuki sorun, bu belgelerin sonradan sunulmasına HMK m. 145 uyarınca izin verilip verilemeyeceğidir. Hukuk Genel Kurulu, belgelerin kanundaki sürede ibraz edilmediğini, ayrıca yargılamayı geciktirme amacı taşımamak veya kusursuz olmak şartlarının gerçekleşmediğini belirtmiştir. Baştan beri taraf elinde olması gereken belgeyi sonradan sunmak davalının kendi ihmalinden kaynaklanır ve davayı uzatır.

      Karar, sonradan delil istisnasının sınırlı yorumlanması gerektiğini gösterir; HMK m. 145, tarafın süresinde yapmadığı işlemi telafi etmek için kullanılamaz. Hukuk Genel Kurulu, davalının temyizine ilişkin olarak direnmenin yerinde olduğunu oy çokluğuyla kabul etmiş ve alacak miktarının incelenmesi için dosyayı Özel Daireye göndermiştir; davacının direnme kararına yönelik temyizini ise hukuki yarar yokluğundan reddetmiştir.
  - id: "1200654300"
    ozet: |
      Davacı, hâkimlerin kararları sonucu gözlem altına alındığını ve beş gün hapsedildiğini ileri sürerek Yargıtay 2. Hukuk Dairesinde, ilk derece mahkemesi sıfatıyla bakılan tazminat davası açmıştır. Davacı 24.09.2024 tarihli oturuma gelmemiş, SEGBİS ile katılma talebi reddedilmiş ve davalı Hazinenin davayı takip etmeyeceğini bildirmesi üzerine dosya HMK m. 150/1 uyarınca işlemden kaldırılmıştır. Davacı dosyayı yenilemiş, ikinci oturuma da katılmayınca dosya ikinci kez işlemden kaldırılmış; yeniden yenilenmesinden sonra 10.02.2025 tarihli oturuma da gelmeyince mahkeme SEGBİS talebini HMK m. 149 uyarınca takdiren reddetmiş ve HMK m. 150/6 gereğince davanın açılmamış sayılmasına karar vermiştir.

      Hukuk Genel Kurulu, e-duruşma ile katılmanın teknik ve hukuki şartlar yerine getirilmek kaydıyla hâkimin takdirinde olduğunu, ilk yenilemeden sonra bir defadan fazla takipsiz bırakılan davanın açılmamış sayılmasında yasaya aykırılık bulunmadığını belirterek kararı onamıştır. Karar, HMK m. 150/6'daki sayımı ve açılmamış sayılma sonucunu somutlaştırır.
  - id: "571001300"
    ozet: |
      Davacı, davalı işyerinde 2008 yılının belirli aylarında fiilen çalıştığını ileri sürerek hizmet tespiti istemiştir. Dosyada, çalışmanın gerçekliğine ilişkin ayrı bir ceza yargılaması ve Kurumun başka bir iş mahkemesinde, dava dışı bir şirketle ilgili olarak açtığı istirdat davası bulunmaktadır. Yargıtay Özel Dairesi, bu istirdat davasıyla bağlantının belirgin olduğunu belirterek HMK m. 165 veya m. 166 kapsamında değerlendirme yapılmasını ve eksik araştırmanın tamamlanmasını isteyerek yerel mahkeme kararını bozmuş; yerel mahkeme direnmiştir.

      Hukuk Genel Kurulu, ceza mahkemesinin kararında çalışmanın gerçek ve fiili olduğunun belirlendiğini, bu kararın dava konusu dönemi kapsadığı anlaşılırsa hukuk hâkimini bağlayacağını belirtmiştir. Dava konusu döneme ilişkin başka bir ceza dosyası varsa onun sonucunun bekletici sorun yapılması gerektiğini söylemiştir. Buna karşılık istirdat davasının konusu itibarıyla bu dosyada bekletici sorun yapılmasına gerek bulunmadığını saptamış, Özel Dairenin bu yöndeki gerekçesini isabetsiz bulmuştur. Direnme kararı bu değişik gerekçeyle oy birliğiyle bozulmuştur.
sorular:
  - soru: |
      HMK m. 144/2'ye göre tahkikatta tarafların dinlenilmek üzere mahkemeye gelmeleri için verilecek süre ile ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Süre iki haftadan az olamaz; gerektiğinde uzatılabilir veya kısaltılabilir."
      - "Süre bir haftadan az olamaz ve hiçbir hâlde değiştirilemez."
      - "Süre bir aydan az olamaz; yalnız uzatılabilir."
      - "Süre mahkemenin takdirindedir; alt sınır yoktur."
    dogru: 0
    aciklama: |
      HMK m. 144/2'ye göre süre iki haftadan az olamaz, ancak gerektiğinde mahkemece resen veya taraflardan birinin talebi üzerine uzatılabileceği gibi kısaltılabilir. Bir hafta ve bir ay seçenekleri kanunda yoktur; alt sınırın bulunmadığını söylemek de metne aykırıdır.
  - soru: |
      Duruşmalar arasındaki süreye ilişkin HMK m. 147/3 hükmü ile ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Duruşmalar arasındaki süre üç aydan daha uzun olamaz; zorunlu hâllerde hâkim gerekçesini belirterek daha uzun süre belirleyebilir."
      - "Duruşmalar arasındaki süre iki aydan daha uzun olamaz ve hiçbir istisna yoktur."
      - "Duruşmalar arasındaki süre altı aya kadar serbestçe belirlenebilir."
      - "Süre sınırı yalnız basit yargılama usulünde uygulanır."
    dogru: 0
    aciklama: |
      7589 sayılı Kanunla eklenen HMK m. 147/3'e göre duruşmalar arasındaki süre üç aydan daha uzun olamaz. İşin niteliği gereği bilirkişi incelemesinin uzaması veya istinabe yoluyla tahkikat işlemlerinin yürütülmesi gibi zorunlu hâllerde hâkim gerekçesini belirterek daha uzun süre belirleyebilir. Metinde iki ay veya altı ay ifadesi yoktur; hüküm yalnız basit yargılamaya özgü de değildir.
  - soru: |
      Yazılı yargılama usulüne tabi bir alacak davasında hâkim, tahkikatın bittiği duruşmada hazır bulunan taraflara, sözlü yargılama için duruşmayı ertelediğini bildirmiştir. Davetiyelerdeki ihtarlar HMK m. 147/2'ye uygun hazırlanmıştı. Sözlü yargılama gününe ilişkin hangisi doğrudur?
    siklar:
      - "Sözlü yargılama için taraflara ayrıca davetiye gönderilmez."
      - "Sözlü yargılama için taraflara mutlaka yeniden davetiye gönderilmelidir."
      - "Sözlü yargılamaya yalnız davacı çağrılır."
      - "Sözlü yargılama günü ancak taraflar özel olarak kabul ederse belirlenebilir."
    dogru: 0
    aciklama: |
      HMK m. 147/2'ye göre davetiyede, sözlü yargılama için duruşmanın ertelenmesi hâlinde taraflara ayrıca davetiye gönderilmeyeceği bildirilir; HMK m. 186/1 de hazır bulunsun veya bulunmasın taraflara ayrıca davetiye gönderilmeyeceğini söyler. Bu ihtar yapıldığı için ayrıca davetiye çıkarılması gerekmez. Yeniden davetiye zorunluluğu veya tarafların kabulü şartı kanunda yoktur.
  - soru: |
      HMK m. 145 uyarınca kanundaki süreden sonra delil gösterilmesine izin verilebilmesi bakımından hangisi doğrudur?
    siklar:
      - "Delilin sonradan ileri sürülmesinin yargılamayı geciktirme amacı taşımaması veya süresinde ileri sürülememesinin tarafın kusurundan kaynaklanmaması yeterlidir."
      - "Karşı tarafın açık muvafakati her hâlde zorunludur."
      - "Delil, tahkikat bitmeden önce gösterilmişse süre hiçbir zaman önem taşımaz."
      - "Delil sonradan ancak sözlü yargılamada gösterilebilir."
    dogru: 0
    aciklama: |
      HMK m. 145 mahkemeye, delilin sonradan ileri sürülmesi yargılamayı geciktirme amacı taşımıyorsa veya süresinde ileri sürülememesi ilgili tarafın kusurundan kaynaklanmıyorsa izin verme imkânı tanır. Karşı tarafın muvafakati şart değildir; sözlü yargılamada ise delil toplanmaz.
  - soru: |
      X Ltd. Şti. aleyhine açılan davada taraflar usulüne uygun davet edildikleri hâlde duruşmaya gelmemiş, dosya 3 Mart günü işlemden kaldırılmıştır. Davacı dosyayı 20 Mart günü yenilemek istemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yenileme, işlemden kaldırılmadan itibaren bir ay içinde yapıldığı için yeniden harç alınmaz."
      - "Yenileme için yeniden harç alınır ve davalıdan tahsil edilir."
      - "Dosya bir ay içinde yenilenemez; en az bir ay beklenmelidir."
      - "Yenileme yalnız davalının talebiyle yapılabilir."
    dogru: 0
    aciklama: |
      HMK m. 150/4'e göre dosyanın işlemden kaldırıldığı tarihten itibaren bir ay geçtikten sonra yenileme talebinde bulunulursa yeniden harç alınır. Burada yenileme işlemden kaldırmadan yaklaşık iki hafta sonra yapıldığı için harç alınmaz. Yenileme taraflardan birinin dilekçesiyle yapılabilir; harç alınsa bile yenileyen öder ve karşı tarafa yüklenemez.
  - soru: |
      Dosyası işlemden kaldırılan bir davada taraflar, kaldırma tarihinden itibaren üç ay içinde davayı yenilememiştir. Hangisi doğrudur?
    siklar:
      - "Dava sürenin dolduğu gün itibarıyla açılmamış sayılır ve mahkemece kendiliğinden karar verilerek kayıt kapatılır."
      - "Dava otomatik olarak karşı tarafın lehine sonuçlanır."
      - "Dava ancak davalının talebiyle açılmamış sayılır."
      - "Dava bir yıl daha yenilenebilir."
    dogru: 0
    aciklama: |
      HMK m. 150/5'e göre işlemden kaldırıldığı tarihten başlayarak üç ay içinde yenilenmeyen davalar sürenin dolduğu gün itibarıyla açılmamış sayılır ve mahkemece kendiliğinden karar verilerek kayıt kapatılır. Dava karşı tarafın lehine sonuçlanmaz; ek süre de yoktur.
  - soru: |
      Yazılı yargılama usulüne tabi bir alacak davasında taraflar iki kez usulüne uygun davet edilmesine rağmen gelmemiş, dosya iki kez işlemden kaldırılmış ve her seferinde süresi içinde yenilenmiştir. Dava yenilendikten sonra yapılan duruşmaya da taraflar gelmemiştir. Hangisi doğrudur?
    siklar:
      - "Dava üçüncü kez takipsiz bırakıldığı için açılmamış sayılır; açılmamış sayılan davadaki talep dahi vaki olmamış sayılır."
      - "Dava yeniden işlemden kaldırılır ve yine yenilenebilir."
      - "Davanın esası hakkında davacı aleyhine hüküm verilir."
      - "Mahkeme dosyayı bir yıl süreyle bekletir."
    dogru: 0
    aciklama: |
      HMK m. 150/6'ya göre işlemden kaldırılmasına karar verilmiş ve sonradan yenilenmiş dava, ilk yenilenmeden sonra bir defadan fazla takipsiz bırakılamaz; aksi hâlde dava açılmamış sayılır. Uygulamada bu, üçüncü takipsizlik demektir. HMK m. 150/7'ye göre açılmamış sayılan davadaki talep dahi vaki olmamış sayılır. Basit yargılama usulünde ise yenilemeden sonraki ilk takipsizlik yeterli olurdu (HMK m. 320/4).
  - soru: |
      HMK m. 149'un yürürlükteki 1. ve 2. fıkralarına göre hangisi doğrudur?
    siklar:
      - "Mahkeme, tanığın ses ve görüntü nakledilmesi yoluyla bulunduğu yerden dinlenmesine resen karar verebilir."
      - "Mahkeme, davacı vekilinin e-duruşma ile katılmasına resen karar verebilir."
      - "Taraf lehine e-duruşma kararı verilmesi için karşı tarafın muvafakati şarttır."
      - "Tanık yalnız talep üzerine ses ve görüntü yoluyla dinlenebilir."
    dogru: 0
    aciklama: |
      HMK m. 149/2'ye göre mahkeme resen veya taraflardan birinin talebi üzerine tanığın, bilirkişinin veya uzmanın ses ve görüntü nakli yoluyla dinlenmesine karar verebilir. Taraf veya vekilin katılımı ise HMK m. 149/1'e göre yalnız talep üzerine mümkündür; karşı tarafın muvafakati aranmaz.
  - soru: |
      Bir tazminat davasında hüküm verilebilmesi, bir idari makamın yapacağı tespite bağlıdır. Mahkeme ilgili tarafa idari makama başvurması için uygun süre vermiş, ancak taraf bu süre içinde başvurmamıştır. Hangisi doğrudur?
    siklar:
      - "İlgili taraf bu husustaki iddiasından vazgeçmiş sayılarak esas dava hakkında karar verilir."
      - "Dava otomatik olarak açılmamış sayılır."
      - "Mahkeme yargılamayı süresiz olarak bekletir."
      - "Dava, mahkemece resen idari makama devredilir."
    dogru: 0
    aciklama: |
      HMK m. 165/2'ye göre verilen süre içinde görevli mahkemeye veya idari makama başvurulmazsa ilgili taraf bu husustaki iddiasından vazgeçmiş sayılır ve esas dava hakkında karar verilir. Süresiz bekletme ya da davanın açılmamış sayılması gibi sonuçlar kanunda yoktur.
  - soru: |
      Aşağıdaki durumlardan hangisi HMK m. 165'teki anlamda bekletici sorundur?
    siklar:
      - "Ankara 4. Asliye Hukuk Mahkemesinin, hükmünün başka bir davanın sonucuna bağlı olduğu için yargılamayı o davanın sonuçlanmasına kadar bekletmesi."
      - "Mahkemenin, davalının dava ehliyeti itirazını kendisinin incelemesi ve karara bağlaması."
      - "Hâkimin, zamanaşımı savunmasını diğer savunmalardan önce incelemeye karar vermesi."
      - "Mahkemenin, tarafları dinlemek için iki hafta süre vermesi."
    dogru: 0
    aciklama: |
      Bekletici sorunda hüküm, başka bir davaya veya idari makamın tespitine bağlıdır ve yargılama o davanın veya makamın kararına kadar bekletilebilir (HMK m. 165/1). Mahkemenin bizzat çözdüğü ara meseleler ön sorun kapsamındadır (HMK m. 163-164); savunmaların sıralanması HMK m. 143/2'ye, tarafların dinlenmesi HMK m. 144'e dayanır.
  - soru: |
      Aynı yargı çevresinde, aynı düzey ve sıfattaki iki hukuk mahkemesinde, aralarında bağlantı bulunan iki dava açılmıştır. Birleştirme ile ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Birleştirme davanın her aşamasında, talep üzerine veya kendiliğinden ilk davanın açıldığı mahkemede yapılabilir."
      - "Birleştirme yalnız ikinci davanın mahkemesinde ve yalnız talep üzerine yapılabilir."
      - "Birleştirme tahkikat bittikten sonra yapılamaz."
      - "Birleştirme için taraflardan her ikisinin de muvafakati şarttır."
    dogru: 0
    aciklama: |
      HMK m. 166/1'e göre aynı yargı çevresinde yer alan aynı düzey ve sıfattaki hukuk mahkemelerinde açılmış davalar, bağlantı varsa davanın her aşamasında, talep üzerine veya kendiliğinden ilk davanın açıldığı mahkemede birleştirilebilir. İkinci davanın mahkemesinden talep üzerine birleştirme ise ayrı yargı çevreleri için öngörülmüştür (HMK m. 166/2).
  - soru: |
      Ankara'daki iki asliye hukuk mahkemesinde görülen bağlantılı davalarla ilgili birleştirme kararı verilmiştir. Karara karşı hangi kanun yoluna başvurulabilir?
    siklar:
      - "Aynı yargı çevresinde verilen bu birleştirme kararına karşı sadece istinaf yoluna başvurulabilir."
      - "Birleştirme kararına karşı yalnız hükümle birlikte istinaf yoluna gidilebilir."
      - "Birleştirme kararına karşı doğrudan temyiz yoluna başvurulabilir."
      - "Birleştirme kararına karşı hiçbir kanun yoluna başvurulamaz."
    dogru: 0
    aciklama: |
      7589 sayılı Kanunla yeniden düzenlenen HMK m. 168/1'e göre aynı yargı çevresinde yer alan aynı düzey ve sıfattaki hukuk mahkemelerinde görülen davalar yönünden verilen birleştirme kararına karşı sadece istinaf yoluna başvurulabilir. Hükümle birlikte kanun yoluna gitme şartı, HMK m. 168/2'ye göre ilk derece mahkemesinin ayırma kararı için geçerlidir.
olaylar:
  - olay: |
      Z Ltd. Şti., bir sözleşmeden doğan alacağı için Ahmet'e karşı Ankara'da bir asliye hukuk mahkemesinde yazılı yargılama usulüne tabi bir alacak davası açmıştır. Tahkikat başladıktan sonra usulüne uygun davet edilen taraflar 12 Şubat günkü duruşmaya gelmemiş ve dosya işlemden kaldırılmıştır. Z Ltd. Şti. dosyayı 24 Şubat günü dilekçeyle yenilemiştir. Yenilenen davanın 20 Mayıs günkü duruşmasına da taraflar gelmemiş, dosya ikinci kez işlemden kaldırılmıştır. Z Ltd. Şti. dosyayı bu kez 10 Temmuz günü yenilemiştir. Yenilenen davanın 14 Ekim günkü duruşmasına taraflar usulüne uygun davet edilmelerine rağmen yine gelmemiştir.

      Yargılama devam ederken Ahmet, davacının dava ehliyetinin bulunmadığını ileri sürmüştür. Ayrıca Ahmet, cevap dilekçesinde gösterdiği bir belgeyi sunmamış; tahkikatın ilerlediği bir aşamada bu belgeyi dosyaya sunmak istemiştir.

      1. 12 Şubat ve 24 Şubat günlerindeki işlemleri HMK m. 150 bakımından değerlendiriniz.
      2. 20 Mayıs ve 10 Temmuz günlerindeki işlemleri, harç bakımından değerlendiriniz.
      3. 14 Ekim günündeki duruşma sonucunda davanın akıbeti ne olur?
      4. Ahmet'in dava ehliyeti itirazı ve belgenin sonradan sunulması talebini değerlendiriniz.
    olcut:
      - {tespit: "İki taraf da usulüne uygun davet edildiği hâlde gelmediği için dosya işlemden kaldırılır", puan: 15, madde: "HMK m. 150/1"}
      - {tespit: "İlk yenileme işlemden kaldırmadan sonraki bir ay içinde yapıldığı için yeniden harç alınmaz", puan: 15, madde: "HMK m. 150/4"}
      - {tespit: "İkinci yenileme bir ay geçtikten sonra yapıldığı için yeniden harç alınır, yenileyen öder ve karşı tarafa yüklenemez", puan: 20, madde: "HMK m. 150/4"}
      - {tespit: "Üçüncü takipsizlik nedeniyle dava açılmamış sayılır ve talep dahi vaki olmamış sayılır", puan: 25, madde: "HMK m. 150/6"}
      - {tespit: "Dava ehliyeti itirazı davaya bakan mahkemenin kendisinin çözeceği ön sorun niteliğindedir", puan: 10, madde: "HMK m. 163"}
      - {tespit: "Süresinde sunulmayan belge ancak geciktirme amacı olmaması veya kusursuz sunulamaması hâlinde kabul edilir", puan: 15, madde: "HMK m. 145"}
    cozum: |
      **Nitelendirme:** Olay, tahkikat aşamasında tarafların duruşmaya gelmemesi ve davanın işlemden kaldırılıp yenilenmesine ilişkindir. Bunun yanında ön sorun ve sonradan delil gösterilmesi meseleleri de vardır.

      **Hukuki sorunlar:** (1) İki tarafın gelmemesinin sonucu. (2) Yenilemenin süresi ve harcı. (3) Üçüncü takipsizliğin sonucu. (4) Dava ehliyeti itirazının niteliği ve belgenin sonradan sunulması.

      **İlgili hükümler ve değerlendirme:** Usulüne uygun davet edilen iki taraf da gelmediği için 12 Şubat günü dosya işlemden kaldırılmıştır (HMK m. 150/1). Z Ltd. Şti. 24 Şubat günü, yani işlemden kaldırmadan sonra bir ay geçmeden dosyayı yenilediği için yeniden harç alınmaz. Dosya yenileme dilekçesiyle devam eder ve yenileme süresi üç aydır (HMK m. 150/4).

      20 Mayıs günü dosya ikinci kez işlemden kaldırılmıştır. 10 Temmuz günü yapılan yenileme işlemden kaldırmadan sonra bir ay geçtikten sonra ve üç ay içinde olduğundan geçerlidir; ancak yeniden harç alınır, bu harcı yenileyen Z Ltd. Şti. öder ve karşı tarafa yüklenemez. Harç verilerek yenilenen dava eski davanın devamı sayılır (HMK m. 150/4).

      14 Ekim günü taraflar yine gelmemiştir. İşlemden kaldırılmış ve sonradan yenilenmiş dava, ilk yenilenmeden sonra bir defadan fazla takipsiz bırakılamaz; bu, üçüncü takipsizliktir. Bu durumda dava açılmamış sayılır (HMK m. 150/6). Hangi sebeple olursa olsun açılmamış sayılan davadaki talep dahi vaki olmamış sayılır (HMK m. 150/7).

      Ahmet'in dava ehliyeti itirazı davaya ilişkin bir ara meseledir. Bunu davaya bakan mahkeme kendisi çözer; karşı tarafa cevap süresi verir ve kararını tefhim veya tebliğ eder (HMK m. 163-164). Belgenin sonradan sunulması bakımından ise kanundaki süreden sonra delil gösterilemez. Ancak sunulmasının yargılamayı geciktirme amacı taşımaması veya süresinde sunulamamasının kusurundan kaynaklanmaması hâlinde mahkeme izin verebilir (HMK m. 145). Ahmet belgeyi cevap dilekçesinde göstermiş olduğuna göre neden sunmadığını açıklaması gerekir; ihtara rağmen ön incelemede sunmayan tarafın dayanmaktan vazgeçmiş sayılacağı da unutulmamalıdır (HMK m. 140/5).

      **Sonuç:** İlk iki yenileme geçerlidir, ikincisinde harç alınır; 14 Ekim günü dava açılmamış sayılır ve talep dahi vaki olmamış sayılır. Dava açılmamış sayıldığı için ön sorun ve delil meselelerinin esas bakımından önemi kalmaz.
  - olay: |
      Ankara'da faaliyet gösteren Kaya Ltd. Şti., Mehmet'e karşı Ankara 5. Asliye Hukuk Mahkemesinde bir sözleşmeden doğan alacak davası açmıştır. Aynı sözleşmeden doğan ve sonuç olarak birinin hükmünün diğerini etkileyeceği ikinci bir dava ise daha sonra Ankara 9. Asliye Hukuk Mahkemesinde açılmıştır. Mehmet, iki davanın birleştirilmesini talep etmiştir.

      Ayrıca 5. Asliye Hukuk Mahkemesindeki davada hüküm verilebilmesi, bir idari makamın yapacağı tespite bağlıdır. Mahkeme Kaya Ltd. Şti.'ne idari makama başvurması için uygun süre vermiş, ancak şirket süre içinde başvurmamıştır.

      Son olarak tahkikatın sürdüğü bir sırada, duruşmalar arasındaki süre bilirkişi incelemesinin uzaması nedeniyle üç ayı aşacak biçimde belirlenmek istenmektedir.

      1. Birleştirme talebi hangi mahkemede ve hangi şartlarla karara bağlanır?
      2. Birleştirme kararı verilirse buna karşı hangi kanun yoluna başvurulabilir?
      3. İdari makama başvurulmaması durumunun sonucu nedir?
      4. Duruşmalar arasındaki sürenin üç ayı aşması mümkün müdür?
    olcut:
      - {tespit: "Aynı yargı çevresinde aynı düzey ve sıfattaki mahkemelerde bağlantılı davalar ilk davanın açıldığı mahkemede birleştirilir; kararı ikinci davanın mahkemesi verir ve ilk mahkemeye bildirir", puan: 20, madde: "HMK m. 166/1"}
      - {tespit: "Davaların aynı sözleşmeden doğması ve birinin hükmünün diğerini etkilemesi bağlantı sayılır", puan: 15, madde: "HMK m. 166/4"}
      - {tespit: "Aynı yargı çevresindeki birleştirme kararına karşı sadece istinaf yoluna başvurulabilir", puan: 20, madde: "HMK m. 168/1"}
      - {tespit: "Hükmün idari makamın tespitine bağlı olması bekletici sorun oluşturur", puan: 15, madde: "HMK m. 165/1"}
      - {tespit: "Verilen sürede başvurmayan taraf o husustaki iddiasından vazgeçmiş sayılır", puan: 15, madde: "HMK m. 165/2"}
      - {tespit: "Bilirkişi incelemesinin uzaması zorunlu hâl olup hâkim gerekçesini belirterek üç aydan uzun süre belirleyebilir", puan: 15, madde: "HMK m. 147/3"}
    cozum: |
      **Nitelendirme:** Olay, davaların birleştirilmesi, birleştirme kararına karşı kanun yolu, bekletici sorun ve duruşmalar arası süre meselelerini birlikte içermektedir.

      **Hukuki sorunlar:** (1) Birleştirmenin şartları ve mahkemesi. (2) Birleştirme kararına karşı kanun yolu. (3) Bekletici sorun için verilen sürede başvurulmamasının sonucu. (4) Üç aylık süre sınırının istisnası.

      **İlgili hükümler ve değerlendirme:** Her iki dava da Ankara'daki aynı düzey ve sıfattaki asliye hukuk mahkemelerinde, yani aynı yargı çevresinde açılmıştır. Davalar aynı sözleşmeden doğduğu ve birinde verilecek hüküm diğerini etkileyeceği için aralarında bağlantı vardır (HMK m. 166/4). Bu durumda birleştirme davanın her aşamasında, talep üzerine veya kendiliğinden ilk davanın açıldığı mahkemede, yani Ankara 5. Asliye Hukuk Mahkemesinde yapılabilir (HMK m. 166/1). Birleştirme talebini ikinci davaya bakan Ankara 9. Asliye Hukuk Mahkemesi karara bağlar; karar derhâl Ankara 5. Asliye Hukuk Mahkemesine bildirilir (HMK m. 166/3). Ankara 5. Asliye Hukuk Mahkemesi, 7589 sayılı Kanunla değişen cümle uyarınca, birleştirme kararının kesinleşmesinden itibaren bununla bağlıdır.

      Aynı yargı çevresinde yer alan aynı düzey ve sıfattaki hukuk mahkemelerinde görülen davalar yönünden verilen birleştirme kararına karşı sadece istinaf yoluna başvurulabilir (HMK m. 168/1). Hükümle birlikte gitme şartı, ilk derece mahkemelerinin ayırma kararları için geçerlidir (HMK m. 168/2).

      Hükmün idari makamın tespitine bağlı olması, bekletici sorun oluşturur ve mahkeme yargılamayı idari makamın kararına kadar bekletebilir (HMK m. 165/1). Mahkeme ilgili tarafa idari makama başvurması için uygun süre vermiştir. Süre içinde başvurulmadığından Kaya Ltd. Şti. bu husustaki iddiasından vazgeçmiş sayılır ve esas dava hakkında karar verilir (HMK m. 165/2).

      Duruşmalar arasındaki süre kural olarak üç aydan uzun olamaz. Ancak bilirkişi incelemesinin uzaması gibi zorunlu hâllerde hâkim gerekçesini belirterek daha uzun bir süre belirleyebilir (HMK m. 147/3).

      **Sonuç:** Birleştirme kararını Ankara 9. Asliye Hukuk Mahkemesi verir, davalar Ankara 5. Asliye Hukuk Mahkemesinde birleştirilir ve karara karşı sadece istinaf yoluna gidilebilir. Kaya Ltd. Şti. idari makama başvurmadığı için o husustaki iddiasından vazgeçmiş sayılır. Duruşmalar arasındaki süre, gerekçesi yazılmak şartıyla üç ayı aşabilir.
kartlar:
  - on: "Tahkikat hangi tutanak esas alınarak yürütülür?"
    arka: "Ön inceleme duruşmasında anlaşılan ve anlaşılamayan hususları gösteren tutanak esas alınır (HMK m. 140/3)."
  - on: "Tarafları dinlemek için verilecek davet süresi en az ne kadardır?"
    arka: "İki haftadan az olamaz; gerektiğinde uzatılabilir veya kısaltılabilir (HMK m. 144/2)."
  - on: "Sonradan delil gösterilmesine hangi hâllerde izin verilebilir?"
    arka: "Geciktirme amacı taşımıyorsa veya süresinde ileri sürülememesi tarafın kusurundan kaynaklanmıyorsa (HMK m. 145)."
  - on: "Sözlü yargılama için duruşma ertelenirse davetiye gerekir mi?"
    arka: "Hayır, davetiyedeki ihtar gereği ayrıca davetiye gönderilmez (HMK m. 147/2)."
  - on: "📌 Duruşmalar arası azami süre nedir?"
    arka: "Üç ay; bilirkişi incelemesinin uzaması veya istinabe gibi zorunlu hâllerde gerekçeli istisna vardır (HMK m. 147/3)."
  - on: "E-duruşmada taraf/vekil ile tanık bilirkişi arasındaki fark nedir?"
    arka: "Taraf/vekil için yalnız talep üzerine; tanık, bilirkişi ve uzman için resen veya talep üzerine (HMK m. 149/1-2)."
  - on: "İşlemden kaldırılan dava ne kadar sürede yenilenir, harç ne zaman alınır?"
    arka: "Üç ay içinde yenilenir; bir ay geçtikten sonra yenilemede yeniden harç alınır ve karşı tarafa yüklenemez (HMK m. 150/4)."
  - on: "Dava hangi durumda açılmamış sayılır (HMK m. 150)?"
    arka: "Üç ayda yenilenmezse sürenin dolduğu gün; ilk yenilemeden sonra bir defadan fazla takipsiz kalırsa da (üçüncü takipsizlik) açılmamış sayılır (HMK m. 150/5-6)."
  - on: "Ön sorun ile bekletici sorun arasındaki fark nedir?"
    arka: "Ön sorunu davaya bakan mahkeme çözer (HMK m. 163-164); bekletici sorunda hüküm başka davaya veya idari makamın tespitine bağlıdır (HMK m. 165)."
  - on: "Bekletici sorunda süre içinde başvurmayan taraf ne olur?"
    arka: "O husustaki iddiasından vazgeçmiş sayılır ve esas dava hakkında karar verilir (HMK m. 165/2)."
  - on: "Aynı ve ayrı yargı çevrelerinde birleştirme hangi mahkemede yapılır?"
    arka: "Aynı çevrede ilk davanın mahkemesinde (HMK m. 166/1); ayrı çevrelerde ikinci davanın mahkemesinden talep üzerine (HMK m. 166/2)."
  - on: "📌 Birleştirme ve ayırma kararlarına karşı kanun yolu nedir?"
    arka: "Aynı çevredeki birleştirme kararına karşı sadece istinaf (HMK m. 168/1); ilk derece ayırma kararına karşı istinaf ancak hükümle birlikte (HMK m. 168/2)."
