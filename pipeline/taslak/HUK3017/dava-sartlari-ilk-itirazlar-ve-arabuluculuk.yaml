ozet: |
  - **Dava şartları (HMK m. 114/1):** mahkemenin davanın esasına girebilmesi için aranan şartlardır: yargı hakkı, yargı yolu, görev, kesin yetki, taraf ve dava ehliyeti ile temsil, dava takip yetkisi, vekil ve vekâletname, gider avansı, teminat, hukuki yarar; **olumsuz şartlar** derdestlik ve kesin hükümdür. Diğer kanunlardaki dava şartları saklıdır (HMK m. 114/2).
  - **Resen inceleme (HMK m. 115/1):** mahkeme dava şartlarını davanın her aşamasında kendiliğinden araştırır; taraflar da noksanlığı her zaman ileri sürebilir.
  - **Sonuç (HMK m. 115/2):** noksanlık tespit edilirse dava usulden reddedilir; giderilmesi mümkünse mahkeme **kesin süre** verir, süre içinde giderilmezse usulden ret olur. Noksanlık esasa girilmeden fark edilmemiş, ileri sürülmemiş ve **hüküm anında giderilmişse** dava usulden reddedilemez (HMK m. 115/3).
  - **İlk itirazlar (HMK m. 116):** yalnız iki tanedir: **kesin yetki kuralı bulunmayan hâllerde yetki itirazı** ve **tahkim itirazı**; iş bölümü itirazı mülgadır (7251 sayılı Kanun). Hepsi **cevap dilekçesinde** ileri sürülmek zorundadır, aksi hâlde dinlenemez (HMK m. 117/1). Dava şartlarından **sonra** incelenir ve ön sorun gibi karara bağlanır (HMK m. 117/2-3).
  - **Kesin yetki** dava şartıdır, resen gözetilir (HMK m. 19/1); kesin olmayan yetki ilk itirazdır (HMK m. 19/2).
  - **Dava şartı arabuluculuk:** iş (7036 sayılı Kanun m. 3), ticari para alacağı vb. davalar (TTK m. 5/A), tüketici (TKHK m. 73/A) ve kira, ortaklığın giderilmesi, kat mülkiyeti, komşu hakkı (HUAK m. 18/B). Arabulucuya **hiç başvurulmadan** açılan dava süre verilmeksizin usulden reddedilir; **son tutanak eklenmemişse** bir haftalık kesin süre verilir (HUAK m. 18/A-2).
  - **Süreler:** arabulucu başvuruyu 3 hafta içinde sonuçlandırır, zorunlu hâllerde 1 hafta uzatılabilir (HUAK m. 18/A-9); ticari davalarda 6 hafta + 2 hafta (TTK m. 5/A/2). Başvurudan son tutanağa kadar **zamanaşımı durur, hak düşürücü süre işlemez** (HUAK m. 18/A-15).
  - **📌 İlk toplantıya mazeretsiz katılmama (HUAK m. 18/A-11, 7531 sayılı Kanun, 2024):** katılmayan taraf davada haklı çıksa bile karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin **yarısından** sorumlu olur ve lehine Avukatlık Asgari Ücret Tarifesine göre vekâlet ücretinin **yarısına** hükmedilir. Eski metinde giderin tamamı ve hiç vekâlet ücreti yoktu.
anlatim: |
  ## 1. Dava şartı nedir?

  **Dava şartları**, mahkemenin davanın esası hakkında inceleme yapıp hüküm kurabilmesi için bulunması (veya bulunmaması) gereken kamu düzenine ilişkin usul şartlarıdır. Bunlar dava açmanın değil, esasa girebilmenin şartıdır. Şart eksikse mahkeme esasa girmeden davayı usulden reddeder.

  HMK m. 114/1 şartları şöyle sıralar:

  | Grup | Şart | Bent |
  |---|---|---|
  | Mahkeme | Yargı hakkı, yargı yolu, görev, kesin yetki | a, b, c, ç |
  | Taraflar | Taraf ve dava ehliyeti, temsilcinin niteliği; dava takip yetkisi; vekilin ehliyeti ve vekâletname | d, e, f |
  | Dava ve giderler | Gider avansı, teminat, hukuki yarar | g, ğ, h |
  | Olumsuz şartlar | Derdestlik yokluğu, kesin hüküm yokluğu | ı, i |

  Bu şartlardan **olumlu** olanların bulunması, **olumsuz** olanların (derdestlik ve kesin hüküm) bulunmaması gerekir. HMK m. 114/1'deki şartlar **genel** dava şartlarıdır. Başka kanunlar da belirli davalar için **özel** dava şartı koyabilir ve bunlar saklıdır (HMK m. 114/2). Zorunlu arabuluculuk bunun en güncel örneğidir.

  > **Örnek:** Mehmet, daha önce aynı alacak için açtığı dava hâlâ sürerken aynı davalıya karşı yeni bir dava açarsa derdestlik, daha önce kesin hükme bağlanmış davayı yeniden açarsa kesin hüküm sorunu doğar. İkisinde de dava usulden reddedilir.

  ## 2. Dava şartlarının incelenmesi (HMK m. 115)

  Mahkeme dava şartlarının mevcut olup olmadığını davanın **her aşamasında kendiliğinden** araştırır; taraflar da noksanlığı her zaman ileri sürebilir (HMK m. 115/1). Davalının bunu cevap dilekçesinde söylememesi mahkemeyi bağlamaz.

  Noksanlık tespit edilirse sonuç şöyledir (HMK m. 115/2):

  - Noksanlık **giderilemiyorsa** dava usulden reddedilir. Örnekler: görevsizlik, kesin yetkisizlik, yargı yolunun caiz olmaması, derdestlik, kesin hüküm, hukuki yarar eksikliği.
  - Noksanlık **giderilebiliyorsa** mahkeme **kesin süre** verir; süre içinde giderilmezse dava usulden reddedilir. Örnekler: eksik gider avansı için iki hafta (HMK m. 120/2), teminat gösterilmemesi (HMK m. 88/1), vekâletname eksikliği (HMK m. 77), kanuni temsilci için gereken izin belgesi (HMK m. 54).

  Bir istisna daha vardır: noksanlık esasa girilmeden önce fark edilmemiş, taraflarca ileri sürülmemiş ve **hüküm anında giderilmiş** ise dava, başlangıçtaki eksiklik yüzünden usulden reddedilemez (HMK m. 115/3).

  > **Örnek:** Ayşe vekille dava açtı, vekâletname yoktu; mahkeme fark etmedi, taraflar da ileri sürmedi. Hükümden önce vekâletname dosyaya girdi. Başlangıçtaki eksiklik nedeniyle dava reddedilemez.

  > ⚠️ **Sınavda dikkat:** Usulden ret ile esastan ret farklıdır. Dava şartı noksanlığında mahkeme esasa girmeden usulden reddeder. Taraf sıfatı (husumet) eksikliği ise uygulamada esasa ilişkin sayılır; dava takip yetkisi (HMK m. 53, HMK m. 114/1-e) ise dava şartıdır (bkz. Doktrin).

  ## 3. İlk itirazlar (HMK m. 116-117)

  **İlk itiraz**, davalının dava şartı olmayan, yalnız ileri sürülürse dikkate alınan usul itirazıdır. HMK m. 116/1'e göre ilk itirazlar **yalnız ikidir**:

  1. Kesin yetki kuralının bulunmadığı hâllerde **yetki itirazı**,
  2. Uyuşmazlığın **tahkim yoluyla çözülmesi gerektiği** itirazı.

  İş bölümü itirazı (HMK m. 116/1-c) 22.07.2020 tarihli 7251 sayılı Kanunla mülga edilmiştir. Liste kapalıdır: zamanaşımı gibi maddi hukuk savunmaları HMK m. 116'daki ilk itirazlar arasında sayılmaz.

  Usul kuralları:

  - İlk itirazların hepsi **cevap dilekçesinde** ileri sürülmek zorundadır; aksi hâlde dinlenemez (HMK m. 117/1).
  - Kesin olmayan yetki itirazında davalı **yetkili mahkemeyi de göstermelidir**; birden fazla yetkili mahkeme varsa seçtiğini bildirir. Aksi hâlde itiraz dikkate alınmaz (HMK m. 19/2).
  - Davalı süresinde ve usulüne uygun itiraz etmezse davanın açıldığı mahkeme **yetkili hâle gelir** (HMK m. 19/4).
  - İlk itirazlar **dava şartlarından sonra** incelenir (HMK m. 117/2) ve **ön sorunlar gibi** karara bağlanır (HMK m. 117/3).

  ## 4. Kesin yetki ile kesin olmayan yetki

  | Konu | Kesin yetki | Kesin olmayan yetki |
  |---|---|---|
  | Niteliği | Dava şartı (HMK m. 114/1-ç) | İlk itiraz (HMK m. 116/1-a) |
  | Kim, ne zaman | Mahkeme resen, davanın sonuna kadar; taraflar her zaman (HMK m. 19/1) | Davalı, cevap dilekçesinde (HMK m. 19/2) |
  | İtiraz edilmezse | Mahkeme yine araştırır | Mahkeme yetkili hâle gelir (HMK m. 19/4) |

  > ⚠️ **Sınavda dikkat:** "Her türlü yetki itirazı cevap dilekçesinde ileri sürülmelidir" önermesi yanlıştır. Yalnız kesin olmayan yetkide bu zorunluluk vardır.

  ## 5. Dava şartı olarak arabuluculuk

  Bazı uyuşmazlıklarda **dava açılmadan önce arabulucuya başvurulmuş olması dava şartıdır**. Başlıca alanlar:

  | Alan | Dayanak | Süre |
  |---|---|---|
  | İş uyuşmazlıkları | 7036 sayılı Kanun m. 3/1 | 3 hafta + 1 hafta |
  | Ticari para alacakları | TTK m. 5/A | 6 hafta + 2 hafta |
  | Tüketici mahkemeleri | TKHK m. 73/A | 3 hafta + 1 hafta |
  | Kira, ortaklığın giderilmesi, kat mülkiyeti, komşu hakkı | HUAK m. 18/B | 3 hafta + 1 hafta |

  Alanların ayrıntısı:

  - **İş:** kanuna, bireysel veya toplu iş sözleşmesine dayanan işçi veya işveren alacağı ve tazminatı ile işe iade talebi; bu alacaklarla ilgili itirazın iptali, menfi tespit ve istirdat davaları. **İş kazası ve meslek hastalığından doğan** maddi ve manevi tazminat ile bunlarla ilgili tespit, itiraz ve rücu davaları kapsam dışıdır (7036 sayılı Kanun m. 3/3).
  - **Ticari:** ticari davalardan konusu bir miktar para olan alacak, tazminat, itirazın iptali, menfi tespit ve istirdat davaları (TTK m. 5/A/1).
  - **Tüketici:** tüketici mahkemelerinde görülen uyuşmazlıklar; tüketici hakem heyeti görevindeki uyuşmazlıklar gibi sayılan istisnalar hariç (TKHK m. 73/A/1). HUAK m. 18/A-11 hükmü **tüketici aleyhine uygulanmaz** (TKHK m. 73/A/2).
  - **HUAK m. 18/B:** kira ilişkisinden doğan uyuşmazlıklar (ilamsız icra yoluyla tahliye hariç), taşınır ve taşınmazların paylaştırılması ve ortaklığın giderilmesi, Kat Mülkiyeti Kanunundan doğan uyuşmazlıklar ve komşu hakkı. Bu alanda anlaşma belgesinde **icra edilebilirlik şerhi alınması zorunludur** (HUAK m. 18/B-3).

  Arabuluculuk sürecinin ortak kuralları HUAK m. 18/A'dadır:

  - **Başvuru yeri:** uyuşmazlığın konusuna göre yetkili mahkemenin bulunduğu yer arabuluculuk bürosuna yapılır (HUAK m. 18/A-4). Büronun yetkisine karşı taraf en geç ilk toplantıda itiraz edebilir; sulh hukuk mahkemesi en geç bir hafta içinde kesin karar verir (HUAK m. 18/A-8).
  - **Süre:** arabulucu başvuruyu görevlendirildiği tarihten itibaren üç hafta içinde sonuçlandırır; zorunlu hâllerde arabulucu bu süreyi en fazla bir hafta uzatabilir (HUAK m. 18/A-9). Ticari davalarda altı hafta, en fazla iki hafta uzatma (TTK m. 5/A/2).
  - **Zamanaşımı ve hak düşürücü süre:** büroya başvurudan son tutanağın düzenlendiği tarihe kadar zamanaşımı durur, hak düşürücü süre işlemez (HUAK m. 18/A-15).
  - **Önlemler ve icra:** dava açma süreleri (ihtiyati tedbir ve ihtiyati haciz için) bu dönemde işlemez (HUAK m. 18/A-16). Büroya başvurudan sonra başvuran aleyhine takip yapılırsa, başvuran son tutanaktan itibaren iki hafta içinde İİK m. 72 uyarınca menfi tespit davası açar ve talep ederse İİK m. 72/2 hükmü uygulanır (HUAK m. 18/A-16).
  - **Özel alternatif yollar:** özel kanunlarda tahkim veya başka bir alternatif çözüm yoluna başvuru zorunluluğu ya da tahkim sözleşmesi varsa dava şartı olarak arabuluculuk hükümleri uygulanmaz (HUAK m. 18/A-18).

  ### Başvuru yoksa ve tutanak yoksa sonuç

  Davacı, anlaşmaya varılamadığına ilişkin **son tutanağı** dava dilekçesine eklemek zorundadır. İki durumu ayır:

  | Durum | Sonuç |
  |---|---|
  | Başvuru var, son tutanak dilekçeye eklenmemiş | Bir haftalık **kesin süre**; verilmezse dilekçe tebliğe çıkarılmadan usulden ret |
  | Arabulucuya **hiç başvurulmamış** | Hiçbir işlem yapılmadan, süre verilmeksizin usulden ret |

  Dayanak HUAK m. 18/A-2'dir; iş davaları için aynı kural 7036 sayılı Kanun m. 3/2'de yer alır.

  > ⚠️ **Sınavda dikkat:** "Hiç başvurmadan dava açana mahkeme başvuru için bir hafta süre verir" ifadesi yanlıştır. Bir haftalık süre yalnız **eksik tutanağın sunulması** içindir.

  ### 📌 İlk toplantıya mazeretsiz katılmamanın yaptırımı

  Geçerli bir mazeret göstermeden ilk toplantıya katılmayan taraf son tutanakta belirtilir. **7 Kasım 2024 tarihli 7531 sayılı Kanun** bu hükmü değiştirmiştir:

  - **Yeni hâl:** Bu taraf davada kısmen veya tamamen haklı çıksa bile, karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin **yarısından** sorumlu tutulur; ayrıca lehine Avukatlık Asgari Ücret Tarifesine göre belirlenen vekâlet ücretinin **yarısına** hükmedilir.
  - **Eski hâl (öğrenci eski kaynaklarda görebilir):** yargılama giderinin tamamından sorumlu olur, lehine vekâlet ücretine hükmedilmezdi.
  - İki taraf da ilk toplantıya katılmazsa yargılama giderleri kendi üzerlerinde kalır.

  Aynı kural iş davalarında 7036 sayılı Kanun m. 3/12'de bulunur. Tüketici aleyhine uygulanmaz (TKHK m. 73/A/2).

  > **Örnek:** Kemal, arabuluculuk ilk toplantısına mazeretsiz gelmedi, sonra davada tamamen haklı çıktı. Kemal, karşı tarafın ödemek zorunda olduğu yargılama giderlerinin yarısını üstlenir; lehine vekâlet ücretinin de yalnız yarısı hükmedilir.

  ## 6. Denetim şeması

  1. Mahkemenin yargı hakkı, yargı yolu, görev ve kesin yetkisi var mı?
  2. Taraf ve dava ehliyeti, temsil, dava takip yetkisi, vekâlet tamam mı?
  3. Gider avansı ve gerekirse teminat yatırıldı mı? Hukuki yarar var mı?
  4. Derdestlik veya kesin hüküm engeli var mı?
  5. Dava şartı arabuluculuk alanına giriyor mu? Hiç başvuru yok mu, tutanak mı eksik?
  6. Noksan giderilebilir mi? Kesin süre ver; giderilemiyorsa usulden ret.
  7. Dava şartları tamamsa: davalı cevap dilekçesinde yetki veya tahkim itirazı yaptı mı? Kesin yetki yoksa ve süresinde yapıldıysa incele; yapılmadıysa dinlenemez.
kritik: |
  - 📌 Dava şartları HMK m. 114/1'de a'dan i'ye sayılır; olumsuz şartlar yalnız **derdestlik** (ı) ve **kesin hüküm**dür (i).
  - ⚠️ Diğer kanunlardaki dava şartları saklıdır (HMK m. 114/2): zorunlu arabuluculuk özel dava şartıdır.
  - 📌 Dava şartlarını mahkeme davanın her aşamasında kendiliğinden araştırır; taraflar da her zaman ileri sürebilir (HMK m. 115/1).
  - 📌 Giderilebilen noksanlıkta kesin süre verilir; süre içinde giderilmezse usulden ret (HMK m. 115/2). Eksik gider avansı için süre iki haftadır (HMK m. 120/2).
  - ⚠️ Noksanlık hüküm anında giderilmiş ve esasa girilmeden fark edilmemiş, ileri sürülmemişse dava usulden reddedilemez (HMK m. 115/3).
  - 📌 İlk itirazlar yalnız kesin olmayan yetki itirazı ve tahkim itirazıdır (HMK m. 116/1-a, b); iş bölümü itirazı mülgadır.
  - 📌 İlk itirazların hepsi cevap dilekçesinde ileri sürülür; aksi hâlde dinlenemez (HMK m. 117/1). Dava şartlarından sonra, ön sorun gibi incelenir (HMK m. 117/2-3).
  - ⚠️ Kesin yetki dava şartıdır (resen); kesin olmayan yetki ilk itirazdır. Yetki itirazında yetkili mahkeme gösterilmelidir (HMK m. 19/2).
  - 📌 Dava şartı arabuluculuk: iş (7036 sayılı Kanun m. 3), ticari para alacakları (TTK m. 5/A), tüketici (TKHK m. 73/A), kira-ortaklığın giderilmesi-kat mülkiyeti-komşu hakkı (HUAK m. 18/B).
  - ⚠️ İş kazası ve meslek hastalığından doğan tazminat ve ilgili davalar iş arabuluculuğu kapsamı dışındadır (7036 sayılı Kanun m. 3/3).
  - 📌 Hiç başvuru yoksa süre verilmeden usulden ret; son tutanak eklenmemişse bir haftalık kesin süre (HUAK m. 18/A-2).
  - 📌 Başvurudan son tutanağa kadar zamanaşımı durur, hak düşürücü süre işlemez (HUAK m. 18/A-15).
  - 📌 Mazeretsiz ilk toplantıya katılmayan taraf haklı çıksa da karşı tarafın giderinin yarısından sorumlu olur ve lehine vekâlet ücretinin yarısı hükmedilir (HUAK m. 18/A-11, 7531 sayılı Kanun).
doktrin: |
  ### Taraf sıfatı (husumet) ve dava takip yetkisi
  Dava takip yetkisi, talep sonucu hakkında hüküm alabilme yetkisidir ve maddi hukuktaki tasarruf yetkisine göre belirlenir (HMK m. 53); eksikliği dava şartı noksanlığıdır (HMK m. 114/1-e). Taraf sıfatı ise uyuşmazlık konusu hak ya da borcun gerçekten davacıya veya davalıya ait olup olmadığı sorusudur. Uygulamada bu eksiklik esasa ilişkin sayılır ve dava esastan reddedilir. Doktrinde iki kavramın sınırı her olayda net değildir; bu yüzden "husumet yokluğunda her zaman esastan ret" yerine somut olayda hangi sorunun çözüldüğüne bakmak gerekir.

  ### Zorunlu arabuluculuk ve birden fazla talep
  Bir dilekçede hem arabuluculuğa tabi hem tabi olmayan talepler yığılmışsa (HMK m. 110 bağlamı) ne olacağı tartışmalıdır. Bir görüş, talepler arasında sıkı bağlantı varsa davanın tamamının arabuluculuk şartından kurtulduğunu savunur. Karşı görüş, her talebin kendi kuralına tabi kalması gerektiğini, aksi hâlde dava şartının dolanılabileceğini söyler. Yargıtay Hukuk Genel Kurulunun bu konudaki tutumu burada kesinleştirilmeden bırakılmıştır.

  ### Süre hesabı
  Arabuluculuk sürecinde zamanaşımının durması, başvuru günü ve son tutanak gününün hesaba nasıl katılacağı konusunda uygulamada tek tek günlük hesap farkları görülebilir. Bu nedenle sınavda çözümü gün farkına bağlama.
