    tanim: "Kesin olmayan yetki ve tahkim itirazı; cevap dilekçesinde ileri sürülmek zorunda olan usul itirazı (HMK m. 116-117)."
  - terim: Kesin süre
    tanim: "Verilen sürede işlem yapılmazsa kanunda öngörülen ağır sonucu doğuran, mahkemece verilen süre."
  - terim: Dava şartı arabuluculuk
    tanim: "Dava açılmadan önce arabulucuya başvurulmuş olmasının dava şartı sayıldığı hâller (TTK m. 5/A, 7036 sayılı Kanun m. 3, HUAK m. 18/B)."
  - terim: Son tutanak
    tanim: "Arabuluculuk faaliyetinin sona erdiğini ve anlaşma olup olmadığını gösteren, dava dilekçesine eklenmesi gereken belge (HUAK m. 18/A-2, 18/A-10)."
  - terim: Dava takip yetkisi
    tanim: "Talep sonucu hakkında hüküm alabilme yetkisi (HMK m. 53)."
kararlar:
  - id: "1228927900"
    ozet: |
      Davacı Hazine, bir tapu iptal ve tescil davası sırasında kendisine süre verilmesi üzerine, aynı murisin mirasçılarını gösteren üç ayrı mirasçılık belgesinin (iki sulh hukuk, bir asliye hukuk mahkemesinden) iptalini ve yeni belge verilmesini istemiştir. İlk derece mahkemesi üçünü de iptal etmiş, Özel Daire bozmuş, mahkeme direnmiştir.
      Hukuk Genel Kurulu, dava şartlarının her aşamada resen gözetildiğini hatırlatmış ve belgeleri tek tek değerlendirmiştir: birinci belge başka bir davada verilip kesinleşen hükümle zaten iptal edilmiş olduğundan kesin hüküm engeli vardır; ikinci belge Hazine'nin kendi mirasçılığını kabul eden belge olduğundan iptalinde Hazinenin hukuki yararı yoktur; üçüncü belgede ise gerçeğe aykırılık veya iptal sebebi bulunmadığından esastan ret gerekir.
      Karar, kesin hükmün ve hukuki yararın (HMK m. 114/1-i ve HMK m. 114/1-h) dava şartı olarak mahkemece resen gözetileceğini, bir davanın aynı anda hem usulden hem esastan sonuçlanabileceğini gösterir. Direnme kararı bozulmuştur.
  - id: "1228720800"
    ozet: |
      Davacı şirket, İİK m. 89 uyarınca kendisine gönderilen üçüncü haciz ihbarnamesini 22.02.2019'da tebliğ almış, 05.03.2019'da arabulucuya başvurmuş, süreç 13.03.2019'da anlaşmazlıkla bitmiş ve 18.03.2019'da menfi tespit davası açmıştır. Davalı, davanın on beş günlük süreden sonra açıldığını savunmuştur. Bölge adliye mahkemesi, menfi tespit davası o tarihte ticari davalarda zorunlu arabuluculuk kapsamında olmadığından arabuluculuğun süreyi etkilemediği gerekçesiyle davayı süreden reddetmiş ve direnmiştir.
      Hukuk Genel Kurulu, TTK m. 5/A'nın menfi tespit ve istirdat davalarını kapsayan düzenlemesinin 01.09.2023 ve sonrasında açılan davalara uygulandığını belirtmiştir. Buna rağmen kanun değişikliğinin uygulamadaki çelişkileri gidermek amacı taşıdığı, davacının zorunlu arabuluculuk düşüncesiyle yaptığı başvurunun aleyhine yorumlanmaması gerektiği sonucuna varmış; arabuluculuk görüşmelerinde geçen süre düşülünce davanın İİK m. 89'daki on beş günlük hak düşürücü süre içinde açıldığını kabul ederek direnme kararını bozmuştur.
      Karar, arabuluculuğun süreye etkisini ve zorunlu arabuluculuğun kapsamındaki belirsizliğin davacı aleyhine kullanılmayacağını gösterir.
sorular:
  - soru: |
      Aşağıdakilerden hangisi HMK m. 114/1 uyarınca olumsuz dava şartıdır?
    siklar:
      - "Gider avansının yatırılması"
      - "Aynı davanın daha önce açılmış ve hâlen görülmemesi"
      - "Mahkemenin görevli olması"
      - "Davacının hukuki yararının bulunması"
    dogru: 1
    aciklama: |
      Olumsuz dava şartları, bulunmaması gerekenlerdir: derdestlik (HMK m. 114/1-ı) ve kesin hüküm (HMK m. 114/1-i). Gider avansı, görev ve hukuki yarar olumlu şartlardır.
  - soru: |
      Mahkemenin dava şartlarını incelemesine ilişkin hangisi doğrudur?
    siklar:
      - "Yalnız davalı cevap dilekçesinde ileri sürerse incelenir"
      - "Yalnız ön inceleme duruşmasında incelenir"
      - "Davanın her aşamasında kendiliğinden araştırılır, taraflar da noksanlığı her zaman ileri sürebilir"
      - "Yalnız hükümden önce bir kez incelenir"
    dogru: 2
    aciklama: |
      Mahkeme dava şartlarının varlığını davanın her aşamasında kendiliğinden araştırır; taraflar da dava şartı noksanlığını her zaman ileri sürebilir (HMK m. 115/1). Dava şartı kamu düzenine ilişkindir; davalının ileri sürmemesi mahkemeyi bağlamaz.
  - soru: |
      Dava devam ederken davacı Ayşe'nin yatırdığı gider avansının yetmediği anlaşılmıştır. Mahkemenin izleyeceği yol hangisidir?
    siklar:
      - "Davayı derhâl usulden reddeder"
      - "Davacıya iki haftalık kesin süre verir; süre içinde tamamlanmazsa dava usulden reddedilir"
      - "Davalıdan avansı tamamlamasını ister"
      - "Davayı esastan reddeder"
    dogru: 1
    aciklama: |
      Avansın yeterli olmadığı dava sırasında anlaşılırsa mahkeme davacıya iki haftalık kesin süre verir (HMK m. 120/2). Giderilebilen dava şartı noksanlığında kesin süre verilir; süre içinde giderilmezse dava usulden reddedilir (HMK m. 115/2).
  - soru: |
      Ali vekiliyle dava açmış, vekâletname dosyada yoktur. Mahkeme bunu fark etmemiş, taraflar da ileri sürmemiştir. Esasa girilmiş ve hükümden önce vekâletname dosyaya sunulmuştur. Sonuç hangisidir?
    siklar:
      - "Dava başlangıçtaki eksiklik nedeniyle usulden reddedilir"
      - "Dava başlangıçtaki eksiklik nedeniyle usulden reddedilemez"
      - "Dava açılmamış sayılır"
      - "Vekile ceza verilerek dava yeniden başlar"
    dogru: 1
    aciklama: |
      Dava şartı noksanlığı esasa girilmeden önce fark edilmemiş, taraflarca ileri sürülmemiş ve hüküm anında giderilmişse, dava başlangıçtaki eksiklik nedeniyle usulden reddedilemez (HMK m. 115/3).
  - soru: |
      HMK m. 116/1'e göre ilk itirazlar hangileridir?
    siklar:
      - "Kesin yetki itirazı, tahkim itirazı ve zamanaşımı def'i"
      - "Kesin yetki kuralının bulunmadığı hâllerde yetki itirazı ve tahkim itirazı"
      - "Görev itirazı ve kesin hüküm itirazı"
      - "Yetki itirazı, iş bölümü itirazı ve tahkim itirazı"
    dogru: 1
    aciklama: |
      İlk itirazlar yalnızca kesin yetki kuralı bulunmayan hâllerde yetki itirazı ve tahkim itirazıdır (HMK m. 116/1-a ve b). İş bölümü itirazı 7251 sayılı Kanunla mülga edilmiştir (HMK m. 116/1-c). Kesin yetki ve görev dava şartıdır; zamanaşımı maddi hukuk savunmasıdır.
  - soru: |
      Davalı X Ltd. Şti., kesin olmayan yetkiye ilişkin itirazını cevap dilekçesinde yapmamış, sonradan ayrı bir dilekçeyle sunmuştur. Mahkemenin değerlendirmesi hangisidir?
    siklar:
      - "İtiraz her zaman ileri sürülebildiği için dinlenir"
      - "İtiraz dinlenemez; süresinde itiraz edilmediğinden dava açılan mahkeme yetkili hâle gelir"
      - "İtiraz yalnız davacı kabul ederse dinlenir"
      - "Mahkeme itirazı ön inceleme duruşmasında yeniden sorar"
    dogru: 1
    aciklama: |
      İlk itirazların hepsi cevap dilekçesinde ileri sürülmek zorundadır; aksi hâlde dinlenemez (HMK m. 117/1). Yetkinin kesin olmadığı davalarda davalı süresinde ve usulüne uygun itiraz etmezse davanın açıldığı mahkeme yetkili hâle gelir (HMK m. 19/4).
  - soru: |
      Mehmet, taşınmaz üzerindeki bir uyuşmazlık için kanunda kesin yetkili kılınmış mahkemeden başka bir mahkemede dava açmıştır. Davalı Ali cevap dilekçesinde yetki itirazı yapmamıştır. Mahkemenin yetkisi bakımından hangisi doğrudur?
    siklar:
      - "Davalı itiraz etmediği için mahkeme yetkili hâle gelir"
      - "Kesin yetki dava şartı olduğundan mahkeme yetkisini davanın sonuna kadar kendiliğinden araştırır"
      - "Mahkeme yetkisini yalnız ilk duruşmada inceleyebilir"
      - "Kesin yetki yalnız taraflarca ileri sürülebilir"
    dogru: 1
    aciklama: |
      Yetkinin kesin olduğu davalarda mahkeme yetkili olup olmadığını davanın sonuna kadar kendiliğinden araştırmak zorundadır; taraflar da mahkemenin yetkisiz olduğunu her zaman ileri sürebilir (HMK m. 19/1). Kesin yetki dava şartıdır (HMK m. 114/1-ç). Davalı itiraz etmese bile mahkeme yetkili hâle gelmez.
  - soru: |
      İlk itirazlar ile dava şartlarının incelenme sırası hakkında hangisi doğrudur?
    siklar:
      - "İlk itirazlar dava şartlarından önce incelenir"
      - "İlk itirazlar dava şartlarından sonra incelenir ve ön sorunlar gibi karara bağlanır"
      - "İlk itirazlar esasla birlikte hükümde karara bağlanır"
      - "Dava şartları yalnız ilk itirazlar reddedilirse incelenir"
    dogru: 1
    aciklama: |
      İlk itirazlar dava şartlarından sonra incelenir (HMK m. 117/2) ve ön sorunlar gibi incelenip karara bağlanır (HMK m. 117/3).
  - soru: |
      Tacir A, tacir B'den 800.000 TL satış bedeli alacağı için arabulucuya hiç başvurmadan asliye ticaret mahkemesinde dava açmıştır. Mahkemenin yapacağı işlem hangisidir?
    siklar:
      - "A'ya bir haftalık süre verir, süre içinde arabulucuya başvurmasını ister"
      - "Herhangi bir işlem yapmadan davayı dava şartı yokluğu nedeniyle usulden reddeder"
      - "Davayı esastan reddeder"
      - "Davayı arabuluculuğa gönderip bekletir"
    dogru: 1
    aciklama: |
      Konusu bir miktar para olan ticari alacak davalarında dava açılmadan önce arabulucuya başvurulmuş olması dava şartıdır (TTK m. 5/A/1). Arabulucuya başvurulmadan dava açıldığı anlaşılırsa herhangi bir işlem yapılmaksızın dava, dava şartı yokluğu nedeniyle usulden reddedilir (HUAK m. 18/A-2). Bir haftalık süre yalnız son tutanağın eksik sunulması hâlinde verilir.
  - soru: |
      İşçi Zeynep, kıdem tazminatı için arabulucuya başvurmuş, görüşmeler anlaşmazlıkla bitmiş ve son tutanak düzenlenmiştir. Zeynep iş mahkemesinde dava açarken son tutanağı dilekçeye eklememiştir. Mahkeme ne yapar?
    siklar:
      - "Davayı süre vermeden usulden reddeder"
      - "Zeynep'e bir haftalık kesin süre içinde tutanağı sunması gerektiği ihtarını içeren davetiye gönderir; ihtar yerine getirilmezse dilekçeyi tebliğe çıkarmadan usulden reddeder"
      - "Tutanak aranmaksızın davayı esastan inceler"
      - "Davalıdan tutanağı getirmesini ister"
    dogru: 1
    aciklama: |
      Davacı son tutanağı dilekçeye eklemek zorundadır. Eklemezse mahkeme bir haftalık kesin süre içinde tutanağın sunulması gerektiğini ve aksi hâlde davanın usulden reddedileceğini bildiren davetiye gönderir; ihtar yerine getirilmezse dava dilekçesi karşı tarafa tebliğe çıkarılmadan usulden reddedilir (7036 sayılı Kanun m. 3/2). Başvuru yapılmış olduğundan süre verilmeksizin ret söz konusu değildir.
  - soru: |
      Kemal, arabuluculuktaki ilk toplantıya geçerli bir mazeret göstermeden katılmamış, daha sonra açılan davada tamamen haklı çıkmıştır. Yargılama giderleri bakımından sonuç hangisidir?
    siklar:
      - "Yargılama giderinin tamamından sorumlu olur ve lehine vekâlet ücretine hükmedilmez"
      - "Karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumlu olur ve lehine vekâlet ücretinin yarısına hükmedilir"
      - "Hiçbir yaptırım uygulanmaz"
      - "Yalnız vekâlet ücretinden yoksun kalır, yargılama giderinden sorumlu olmaz"
    dogru: 1
    aciklama: |
      7531 sayılı Kanunla değiştirilen HUAK m. 18/A-11'e göre, mazeretsiz ilk toplantıya katılmayan taraf davada kısmen veya tamamen haklı çıksa bile karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumlu tutulur ve lehine Avukatlık Asgari Ücret Tarifesine göre belirlenen vekâlet ücretinin yarısına hükmedilir. Birinci şık eski metindir.
  - soru: |
      Aşağıdaki uyuşmazlıkların hangisinde arabulucuya başvurulması dava şartı değildir?
    siklar:
      - "Kiralanan taşınmazın ilamsız icra yoluyla tahliyesi dışındaki kira ilişkisinden kaynaklanan uyuşmazlık"
      - "Ortaklığın giderilmesi davası"
      - "İş kazasından kaynaklanan maddi ve manevi tazminat davası"
      - "Komşu hakkından kaynaklanan uyuşmazlık"
    dogru: 2
    aciklama: |
      İş kazası veya meslek hastalığından kaynaklanan maddi ve manevi tazminat ile bunlarla ilgili tespit, itiraz ve rücu davalarında iş arabuluculuğu hükmü uygulanmaz (7036 sayılı Kanun m. 3/3). Diğer üçü HUAK m. 18/B/1 kapsamındadır (kira, ortaklığın giderilmesi, komşu hakkı).
olaylar:
  - olay: |
      Tacir A, tacir B'ye sattığı ticari emtianın bedeli olan 800.000 TL'nin ödenmemesi üzerine arabulucuya hiç başvurmadan Ankara Asliye Ticaret Mahkemesinde alacak davası açmıştır. Dava açılırken yatırılan gider avansı da yetersiz kalmıştır. Dava dilekçesi B'ye tebliğ edilmiştir.

      B, cevap süresi dolduktan sonra verdiği ayrı bir dilekçede hem sözleşmedeki tahkim şartına dayanarak "uyuşmazlığın tahkimle çözülmesi gerektiğini" hem de "Ankara mahkemelerinin yetkisiz olduğunu" ileri sürmüştür. Yetkinin kesin olmadığı varsayılacaktır.

      1. Davanın arabuluculuk bakımından durumu nedir ve mahkeme ne yapar?
      2. Mahkeme A'ya arabulucuya başvurması için süre verebilir mi?
      3. B'nin tahkim ve yetki itirazları nasıl değerlendirilir?
      4. Eksik gider avansı sonucu nasıl etkiler?
    olcut:
      - {tespit: "Konusu para alacağı olan ticari davada arabulucuya başvurmanın dava şartı olması", puan: 20, madde: "TTK m. 5/A"}
      - {tespit: "Hiç başvurulmadığından süre verilmeksizin, herhangi bir işlem yapılmadan usulden ret; bir haftalık sürenin yalnız eksik son tutanak için olması", puan: 25, madde: "HUAK m. 18/A-2"}
      - {tespit: "Tahkim ve kesin olmayan yetki itirazlarının ilk itiraz olması", puan: 15, madde: "HMK m. 116/1"}
      - {tespit: "İlk itirazların cevap dilekçesinde ileri sürülmemesi nedeniyle dinlenememesi", puan: 20, madde: "HMK m. 117/1"}
      - {tespit: "Dava şartlarının ilk itirazlardan önce incelenmesi; eksik gider avansı için iki haftalık kesin sürenin yalnız giderilebilir noksanlık olması", puan: 20, madde: "HMK m. 117/2"}
    cozum: |
      **Nitelendirme:** Dava, konusu bir miktar para olan ticari bir alacak davasıdır; bu nedenle arabuluculuk **dava şartıdır**. B'nin itirazları kesin olmayan yetki ve tahkim itirazlarıdır; yani **ilk itirazdır**. Eksik gider avansı giderilebilir bir dava şartı noksanlığıdır.

      **Hukuki sorunlar:** (1) Arabulucuya hiç başvurulmamış olmasının sonucu; (2) süre verilip verilemeyeceği; (3) ilk itirazların akıbeti; (4) gider avansı eksikliğinin etkisi.

      **İlgili hükümler:** TTK m. 5/A/1, ticari davalardan konusu bir miktar para olan alacak ve tazminat davalarında dava açılmadan önce arabulucuya başvurulmuş olmasını dava şartı yapar. HUAK m. 18/A-2, arabulucuya başvurulmadan dava açıldığı anlaşılırsa herhangi bir işlem yapılmaksızın davanın dava şartı yokluğu sebebiyle usulden reddedileceğini, bir haftalık kesin sürenin ise yalnız son tutanağın eksik sunulmasında verileceğini söyler. HMK m. 116/1 ilk itirazları sayar; HMK m. 117/1 bunların cevap dilekçesinde ileri sürülmesini ister, aksi hâlde dinlenemeyeceğini belirtir; HMK m. 117/2 ilk itirazların dava şartlarından sonra incelenmesini düzenler. HMK m. 115/2 giderilebilir noksanlıkta kesin süre verilmesini, HMK m. 120/2 ise eksik avans için iki haftalık süreyi öngörür.

      **Değerlendirme:** A, arabulucuya hiç başvurmadığı için dava şartı eksiktir ve bu eksiklik sonradan başvuru yapılarak giderilemez; mahkeme süre vermeden, dilekçeyi işleme koymadan usulden ret kararı verir. Bir haftalık süre ancak başvuru yapılmış ve son tutanak eksik sunulmuşsa söz konusu olurdu.

      B'nin tahkim ve kesin olmayan yetki itirazları ilk itirazdır. Bunların hepsi cevap dilekçesinde ileri sürülmek zorundadır; B bunları cevap süresinden sonra ayrı dilekçeyle ileri sürdüğü için dinlenemez. Zaten ilk itirazlar dava şartlarından sonra incelendiğinden, dava şartı eksikliği (arabuluculuk) sebebiyle dava usulden reddedildiğinden ilk itirazlara hiç gelinmez. Yetkinin kesin olmadığı ve süresinde itiraz edilmediği için Ankara Asliye Ticaret Mahkemesi yetkili hâle gelmiştir (HMK m. 19/4).

      Eksik gider avansı giderilebilir bir noksanlık olup mahkeme normalde iki haftalık kesin süre verirdi; ancak arabuluculuk eksikliği giderilemediği için bu sonuç değişmez.

      **Sonuç:** Dava, arabulucuya başvurulmadığı için süre verilmeksizin usulden reddedilir. B'nin ilk itirazları süresinde ileri sürülmediğinden dinlenemez ve zaten incelenme sırası gelmez. Gider avansı eksikliği sonucu değiştirmez.
  - olay: |
      İşçi Ali, kıdem tazminatı alacağı için işvereni Y A.Ş.'ye karşı önce arabulucuya başvurmuştur. Y A.Ş., ilk toplantıya geçerli bir mazeret göstermeden katılmamış, arabulucu da son tutanağı düzenlemiştir. Başvuru 3 Mart, son tutanak 14 Mart tarihlidir.

      Ali, iş mahkemesinde açtığı davanın dilekçesine son tutanağı eklememiştir. Mahkeme gerekli işlemi yapmış, Ali tutanağı süresi içinde sunmuştur. Yargılama sonunda dava, kıdem tazminatı hakkının doğmadığı gerekçesiyle esastan reddedilmiştir. Y A.Ş. yargılama gideri ve vekâlet ücreti istemektedir.

      1. Ali'nin arabulucuya başvurması bu davada hangi niteliktedir?
      2. Son tutanağın eklenmemesine mahkeme nasıl tepki verir?
      3. 3 Mart ile 14 Mart arasında hak düşürücü süre ve zamanaşımı bakımından durum nedir?
      4. Y A.Ş. davada haklı çıkmıştır; mazeretsiz katılmaması nedeniyle yargılama gideri ve vekâlet ücreti bakımından sonuç nedir?
    olcut:
      - {tespit: "İşçi alacağı ve tazminatı davalarında arabulucuya başvurmanın dava şartı olması", puan: 15, madde: "7036 sayılı Kanun m. 3/1"}
      - {tespit: "Son tutanağın dilekçeye eklenmesi zorunluluğu; eklenmemişse bir haftalık kesin süre ve ihtar", puan: 25, madde: "7036 sayılı Kanun m. 3/2"}
      - {tespit: "Süre içinde sunulduğu için dava şartı eksikliğinin giderilmesi ve davanın esastan incelenmesi", puan: 10, madde: "HMK m. 115/2"}
      - {tespit: "Başvurudan son tutanağa kadar zamanaşımının durması, hak düşürücü sürenin işlememesi", puan: 10, madde: "7036 sayılı Kanun m. 3/17"}
      - {tespit: "Mazeretsiz katılmayan Y A.Ş.nin haklı çıksa bile karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumlu olması", puan: 25, madde: "7036 sayılı Kanun m. 3/12"}
      - {tespit: "Y A.Ş. lehine AAÜT'ye göre belirlenen vekâlet ücretinin yarısına hükmedilmesi", puan: 15, madde: "7036 sayılı Kanun m. 3/12"}
    cozum: |
      **Nitelendirme:** Ali'nin talebi kanuna dayanan işçi alacağı ve tazminatıdır; bu davada arabuluculuk **özel dava şartıdır**. Son tutanağın dilekçeye eklenmemesi **giderilebilir** bir noksanlıktır. Y A.Ş.nin ilk toplantıya mazeretsiz katılmaması yargılama giderleri bakımından özel yaptırım doğurur.

      **Hukuki sorunlar:** (1) Arabuluculuğun niteliği; (2) tutanağın eklenmemesi; (3) süreler; (4) mazeretsiz katılmamanın giderlere etkisi.

      **İlgili hükümler:** 7036 sayılı Kanun m. 3/1, kanuna veya iş sözleşmesine dayanan işçi alacağı ve tazminatı davalarında arabulucuya başvurulmuş olmasını dava şartı yapar. 7036 sayılı Kanun m. 3/2, davacının son tutanağı dilekçeye eklemek zorunda olduğunu, eklemezse bir haftalık kesin süre içinde sunması gerektiği ihtarını içeren davetiye gönderileceğini, ihtar yerine getirilmezse dilekçenin tebliğe çıkarılmadan usulden reddedileceğini düzenler. 7036 sayılı Kanun m. 3/17, başvurudan son tutanağa kadar zamanaşımının durmasını ve hak düşürücü sürenin işlememesini; 7036 sayılı Kanun m. 3/12 ise mazeretsiz katılmayan tarafın haklı çıksa bile karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumlu olmasını ve lehine vekâlet ücretinin yarısına hükmedilmesini düzenler.

      **Değerlendirme:** Ali arabulucuya başvurmuştur; dava şartı bu yönden gerçekleşmiştir. Son tutanağı dilekçeye eklememesi eksikliktir, ama bu eksiklik giderilebilir olduğundan mahkeme bir haftalık kesin süreli ihtarlı davetiye gönderir (HMK m. 115/2'nin genel kuralının özel uygulaması). Ali tutanağı süresinde sunduğundan dava şartı eksikliği giderilmiş, dava esastan incelenmiştir. 3 Mart ile 14 Mart arasında geçen sürede zamanaşımı durur, hak düşürücü süre işlemez; Ali bu süre nedeniyle hak kaybına uğramaz.

      Y A.Ş. ilk toplantıya mazeretsiz katılmamış ve son tutanakta bu belirtilmiştir. Dava reddedildiği için Y A.Ş. normalde yargılama giderlerinin tamamını ve vekâlet ücretini isteyebilirdi. 7036 sayılı Kanun m. 3/12 gereği, haklı çıksa bile Y A.Ş. karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumlu tutulur ve lehine AAÜT'ye göre belirlenen vekâlet ücretinin yalnız yarısına hükmedilir. Eski düzendeki gider yükü (tamamı) ve vekâlet ücretinin hiç verilmemesi artık uygulanmaz.

      **Sonuç:** Arabuluculuk dava şartı gerçekleşmiş, tutanak eksikliği süre içinde giderilmiştir. Süre işlemediği için Ali hak kaybına uğramamıştır. Y A.Ş. davada haklı çıkmış olsa da yargılama giderlerinin yarısından sorumlu tutulur ve vekâlet ücretinin yarısına hükmedilir.
kartlar:
  - on: "Olumsuz dava şartları hangileridir? (HMK m. 114/1)"
    arka: "Derdestlik (ı) ve kesin hüküm (i). Bunların bulunmaması gerekir."
  - on: "Mahkeme dava şartlarını ne zaman araştırır? (HMK m. 115/1)"
    arka: "Davanın her aşamasında kendiliğinden; taraflar da noksanlığı her zaman ileri sürebilir."
  - on: "Giderilebilen dava şartı noksanlığında mahkeme ne yapar? (HMK m. 115/2)"
    arka: "Kesin süre verir; süre içinde giderilmezse davayı usulden reddeder."
  - on: "Noksanlık hüküm anında giderilmişse? (HMK m. 115/3)"
    arka: "Esasa girilmeden fark edilmemiş ve ileri sürülmemişse dava başlangıçtaki eksiklik nedeniyle usulden reddedilemez."
  - on: "İlk itirazlar nelerdir? (HMK m. 116/1)"
    arka: "Kesin yetki kuralı bulunmayan hâllerde yetki itirazı ve tahkim itirazı. İş bölümü itirazı mülgadır."
  - on: "İlk itirazlar nerede ve ne zaman ileri sürülür? (HMK m. 117/1)"
    arka: "Cevap dilekçesinde; aksi hâlde dinlenemez. Dava şartlarından sonra, ön sorun gibi incelenir."
  - on: "Kesin yetki ile kesin olmayan yetki farkı?"
    arka: "Kesin yetki dava şartıdır (resen, HMK m. 19/1); kesin olmayan yetki ilk itirazdır, cevap dilekçesinde ileri sürülür (HMK m. 19/2)."
  - on: "Hangi alanlarda arabuluculuk dava şartıdır?"
    arka: "İş (7036 sayılı Kanun m. 3), ticari para alacakları (TTK m. 5/A), tüketici (TKHK m. 73/A), kira-ortaklığın giderilmesi-kat mülkiyeti-komşu hakkı (HUAK m. 18/B)."
  - on: "Arabulucuya hiç başvurulmadan dava açılırsa?"
    arka: "Süre verilmeksizin, işlem yapılmadan usulden ret (HUAK m. 18/A-2)."
  - on: "Başvuru var ama son tutanak dilekçede yoksa?"
    arka: "Bir haftalık kesin süre ve ihtar; yerine getirilmezse dilekçe tebliğe çıkarılmadan usulden ret (HUAK m. 18/A-2)."
  - on: "Arabuluculukta ilk toplantıya mazeretsiz katılmamanın yaptırımı? (📌 7531 sayılı Kanun)"
    arka: "Haklı çıksa bile karşı tarafın ödemekle yükümlü olduğu yargılama giderlerinin yarısından sorumlu; lehine vekâlet ücretinin yarısı hükmedilir (HUAK m. 18/A-11)."
  - on: "Arabuluculuk sürecinde zamanaşımı ve hak düşürücü süre ne olur?"
    arka: "Büroya başvurudan son tutanağa kadar zamanaşımı durur, hak düşürücü süre işlemez (HUAK m. 18/A-15)."
