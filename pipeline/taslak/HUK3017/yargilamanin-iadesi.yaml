doktrin: |
  ### "Hüküm" kavramı ve usule ilişkin nihai kararlar
  HMK m. 374 "hüküm"den söz eder. Baskın yorum, bununla maddi anlamda kesin hüküm doğuran, yani uyuşmazlığı esastan çözen kararların kastedildiğidir. Görevsizlik, yetkisizlik veya dava şartı eksikliğiyle verilen red gibi usule ilişkin kararlara karşı yeniden dava açılabildiğinden iade gereksiz görülür. Buna karşılık davanın açılmamış sayılması gibi usule ilişkin kararların fiilen maddi hakkı ortadan kaldırdığı özel durumlarda (örneğin kadastro uyuşmazlıkları) iadenin mümkün olup olmadığı tartışmalıdır; uygulama net bir kural koymamıştır.

  ### Bilirkişi raporu ve yeni belge
  Karardan sonra alınan yeni bir uzman görüşü veya başka bir dosyadaki rapor çoğu zaman HMK m. 375/1-ç anlamında "ele geçirilen belge" sayılmaz; bu bent yargılama sırasında var olan ama elde olmayan nedenlerle sunulamayan belgeyi hedefler. Bilirkişi raporuna dayalı iade ise ancak HMK m. 375/1-f'deki **kasten** gerçeğe aykırı beyan şartıyla mümkündür. Hesap hatası veya takdir farkı iade sebebi değildir. Sınırın nerede çizileceği olaya göre tartışılabilir.

  ### İadenin etkisi
  İade davası kendiliğinden icrayı durdurmadığı için, haksız bir hükmün uygulanmaya devam etmesi riski vardır. Kanun bu riski teminat karşılığı durdurma ile dengeler (HMK m. 381). Teminatın miktarı ve durdurmanın kapsamı mahkemenin takdirindedir.
sozluk:
  - terim: Yargılamanın iadesi
    tanim: "Kesin veya kesinleşmiş hükme karşı, kanunda sayılan sebeplerle başvurulan olağanüstü kanun yolu (HMK m. 374)."
  - terim: Kesin hüküm
    tanim: "Şeklî anlamda kesinleşmiş hükmün aynı taraf, sebep ve talep sonucu bakımından başka davada bağlayıcı olması (HMK m. 303)."
  - terim: Sınırlı sayı ilkesi
    tanim: "İade sebeplerinin HMK m. 375'te tek tek sayılması; kıyasla genişletilememesi."
  - terim: Yeni belge
    tanim: "Aleyhine karar verilen tarafın elinde olmayan nedenlerle elde edilemeyip karardan sonra ele geçen belge (HMK m. 375/1-ç)."
  - terim: Yalan tanıklık
    tanim: "Karara esas alınan tanığın karardan sonra yalan tanıklık yaptığının sabit olması (HMK m. 375/1-e)."
  - terim: Çelişik hüküm
    tanim: "Aynı taraf, konu ve sebepli ikinci davada önceki kesin hükme aykırı hüküm verilip kesinleşmesi (HMK m. 375/1-ı)."
  - terim: Hükmün iptali (üçüncü kişiler)
    tanim: "Alacaklıların ve yerine geçenlerin, tarafların danışıklı hilesi nedeniyle hükmün iptalini istemesi (HMK m. 376)."
  - terim: Üç ay ve on yıl
    tanim: "İade süresinin ilgili başlangıçtan itibaren üç ay ve her hâlde hükmün kesinleşmesinden itibaren on yıl olması (HMK m. 377/1)."
  - terim: Ön inceleme
    tanim: "Mahkemenin süre, kesinlik ve sebebin kanunda yazılı olup olmadığını kendiliğinden incelemesi (HMK m. 379)."
  - terim: Teminat
    tanim: "Karşı tarafın zararını karşılamak veya icranın durdurulmasını sağlamak için gösterilen güvence (HMK m. 378/2, m. 381/1)."
kararlar:
  - id: "1225335500"
    ozet: |
      Tekirdağ Kadastro Mahkemesinde görülen kadastro tespitine itiraz davasında verilen davanın açılmamış sayılması kararı, Yargıtay incelemesinden geçerek 02.05.1994 tarihinde kesinleşmiştir. Davacılar 07.11.2024 tarihinde açtıkları davada, HMK m. 375/1-ç'ye dayanarak çifte mera kaydı oluştuğunu ileri sürüp yargılamanın iadesini istemiş, temyiz dilekçesinde ayrıca yeni uzman raporu elde edildiğini belirtmiştir. İlk derece mahkemesi, hükmün kesinleşmesinden itibaren on yıllık sürenin geçtiği gerekçesiyle talebi reddetmiş, BAM istinaf başvurusunu esastan reddetmiştir. Yargıtay 8. Hukuk Dairesi, uyuşmazlığı iade şartlarının gerçekleşip gerçekleşmediği olarak belirlemiş ve BAM kararını HMK m. 370/1 uyarınca oy birliğiyle onamıştır. Karar, iade isteminin hükmün kesinleşmesinden otuz yıl sonra yapıldığı bir olayda, alt derece mahkemelerinin on yıllık üst süreyi dikkate alarak talebi reddetmesinin Yargıtayca hukuka uygun bulunduğunu gösterir.
  - id: "1213012900"
    ozet: |
      Hazine adına kadastro tespiti kesinleşen taşınmaz için davacının açtığı tapu iptali ve tescil davası reddedilmiş, karar Yargıtay incelemesinden geçerek 20.02.2007 tarihinde kesinleşmiştir. Davacı vekili, sonradan ele geçtiğini ileri sürdüğü ecrimisil ödeme belgelerine dayanarak HMK m. 375/1-ç uyarınca yargılamanın iadesi istemiştir. İlk derece mahkemesi talebi esasa girmeden reddetmiştir. BAM, kesinleşmeden itibaren on yıllık sürenin geçtiğini, dayanak belgelerin hükmün esasını etkileyecek nitelikte olmadığını, önceki yargılamada ve temyizde ileri sürüldüğünü ve ileri sürülen hususların HMK m. 375'te sınırlı sayılan sebeplerden olmadığını belirterek istinaf başvurusunu esastan reddetmiştir. Yargıtay 1. Hukuk Dairesi bu sonucu usul ve kanuna uygun bulup kararı HMK m. 370/1 uyarınca onamıştır. Karar, iade sebeplerinin sınırlı olduğunu, yeni belgenin gerçekten sonradan ele geçmesi ve karara etkili olması gerektiğini gösterir.
