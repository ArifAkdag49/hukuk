ozet: |
  - **Yetki sözleşmesi:** tacirler veya kamu tüzel kişileri, aralarında doğmuş veya doğabilecek uyuşmazlık için bir veya birden fazla mahkemeyi yetkili kılabilir. Aksi kararlaştırılmadıkça dava **sadece** sözleşmeyle belirlenen mahkemelerde açılır (HMK m. 17).
  - **Geçerlilik:** kesin yetki hâllerinde ve tarafların serbestçe tasarruf edemeyecekleri konularda yetki sözleşmesi yapılamaz (HMK m. 18/1). Ayrıca yazılı olmalı, hukuki ilişki belirli veya belirlenebilir olmalı ve yetkili kılınan mahkeme veya mahkemeler gösterilmelidir (HMK m. 18/2).
  - **Yetki itirazı:** kesin yetkide mahkeme yetkisini davanın sonuna kadar resen araştırır, taraflar da her zaman ileri sürebilir (HMK m. 19/1). Kesin olmayan yetkide itiraz **cevap dilekçesinde** yapılmalıdır; itiraz eden yetkili mahkemeyi, birden fazlaysa seçtiğini bildirmelidir, aksi hâlde itiraz dikkate alınmaz (HMK m. 19/2). Süresinde ve usulüne uygun itiraz yoksa dava açılan mahkeme yetkili hâle gelir (HMK m. 19/4).
  - **Yetkisizlik kararı:** mahkeme yetkili mahkemeyi de gösterir (HMK m. 19/3).
  - **Gönderme talebi (HMK m. 20/1):** görevsizlik veya yetkisizlik kararı üzerine taraflardan birinin, **iki hafta içinde kararı veren mahkemeye** başvurarak dosyanın gönderilmesini istemesi gerekir. Süre, karar verildiği anda kesinse tebliğden; kanun yoluna başvurulmadan kesinleşmişse kesinleşme tarihinden; kanun yoluna başvurulmuşsa başvurunun reddi kararının tebliğinden başlar. Başvurulmazsa dava açılmamış sayılır ve karar resen verilir.
  - **Gönderilen mahkeme** taraflara kendiliğinden davetiye gönderir (HMK m. 20/2). Yargılama giderleri konusunda HMK m. 331/2 uygulanır.
  - **Yargı yeri belirlenmesi:** davaya bakacak mahkemeyi belirlemek için başvurulur (HMK m. 21): engel çıkması, yargı çevresi sınırı tereddüdü, iki mahkemenin de görevsizlik kararı vermesi, kesin yetkide iki mahkemenin de yetkisizlik kararı vermesi (son ikisinde kararlar kanun yoluna başvurulmadan kesinleşmiş olmalıdır).
  - **Merci ve sonuç:** engel ve yargı çevresi tereddüdünde ilk derece mahkemeleri için bölge adliye mahkemesi, bölge adliye mahkemeleri için Yargıtay (HMK m. 22/1); iki mahkemenin kararları kanun yoluna başvurulmadan kesinleşmişse ilgisine göre bölge adliye mahkemesi veya Yargıtay (HMK m. 22/2; farklı bölge adliye mahkemesi çevrelerindeki mahkemeler arasında Yargıtay). İnceleme dosya üzerinden yapılabilir; belirleme ve kanun yolu incelemesi sonunda kesinleşen kararlar sonraki mahkemeyi bağlar (HMK m. 23).
  - **Sınav tuzakları:** münhasır yetki sözleşmesi kesin yetki doğurmaz; "mahkeme yetkisizdir" demek yetki itirazı için yetmez; iki hafta kararı veren mahkemeye yapılacak başvuruyla korunur.
anlatim: |
  ## 1. Yetki sözleşmesi: yetkiyi iradeyle değiştirmek
  Yetki kuralları kural olarak taraf iradesiyle değiştirilemez; ancak kesin olmayan yetki kurallarında kanun sınırlı bir esneklik tanır. **Yetki sözleşmesi**, aralarında doğmuş veya doğabilecek bir uyuşmazlığın hangi mahkemede görüleceğini belirleyen anlaşmadır. HMK m. 17'ye göre bunu yalnızca **tacirler veya kamu tüzel kişileri** yapabilir; bir veya birden fazla mahkemeyi yetkili kılabilirler.

  Sözleşmede başka bir şey söylenmemişse dava **sadece** sözleşmeyle belirlenen mahkemelerde açılır (HMK m. 17). Buna **münhasır yetki sözleşmesi** denir ve kanunun asıl kabul ettiği türdür. Taraflar, kanuni yetkili mahkemelerin yetkisinin de sürmesini ayrıca kararlaştırabilir; bu durumda sözleşme kanuni mahkemeleri devre dışı bırakmaz.

  > **Örnek:** İstanbul'daki A A.Ş. ile Mersin'deki B Ltd. Şti. aralarındaki satım sözleşmesine "Eskişehir mahkemeleri yetkilidir" yazmıştır. Başka bir şey kararlaştırılmadığından, uyuşmazlık için dava sadece Eskişehir'de açılabilir; genel yetkili mahkeme Mersin ya da ifa yeri mahkemesi artık seçilemez.

  **Geçerlilik şartları (HMK m. 18):**

  | Şart | Dayanak |
  |---|---|
  | Taraflar tacir veya kamu tüzel kişisi | HMK m. 17 |
  | Serbestçe tasarruf edilebilen konu | HMK m. 18/1 |
  | Kesin yetki hâli olmaması | HMK m. 18/1 |
  | Yazılı şekil | HMK m. 18/2 |
  | Belirli veya belirlenebilir hukuki ilişki ve gösterilen mahkeme(ler) | HMK m. 18/2 |

  - **Yazılı şekil.** HMK m. 18/2 yetki sözleşmesinin yazılı yapılmasını şart koşar.
  - **Belirlilik.** Hangi hukuki ilişkiden doğan uyuşmazlığın kapsandığı belirli veya belirlenebilir olmalıdır; "tüm uyuşmazlıklar" gibi sınırsız bir ifade bu ölçütle çelişir. Yetkili kılınan mahkeme veya mahkemeler de gösterilmelidir; yer olarak belirlenebilir olmayan bir kayıt şartı karşılamaz.
  - **Kesin yetki.** Kesin yetki hâllerinde (örneğin taşınmaz mülkiyetine ilişkin dava, HMK m. 12/1; iflas davası, İİK m. 154) yetki sözleşmesi yapılamaz.

  > ⚠️ **Sınavda dikkat:** Yetki sözleşmesi, münhasır olsa bile kanundaki anlamda **kesin yetki doğurmaz.** Davacı sözleşmeye aykırı olarak genel yetkili mahkemede dava açarsa mahkeme sözleşmeyi resen gözetemez; davalının bunu cevap dilekçesinde ilk itiraz olarak ileri sürmesi gerekir (HMK m. 19/2, HMK m. 116/1-a).

  Yargıtay 11. Hukuk Dairesinin incelediği bir dosyada sigortacı, ödediği hasarı rücuen istemişti. Yabancılık unsuru taşıyan bu uyuşmazlıkta konişmentodaki yetki şartı (Almanya mahkemeleri) bölge adliye mahkemesince Milletlerarası Özel Hukuk ve Usul Hukuku Hakkında Kanun'un 47. maddesi ve HMK m. 17 çerçevesinde geçerli bulunmuş; sigortalıyı bağlayan bu şartın, halef sıfatıyla sigortacıyı da bağladığı kabul edilmişti. Daire, kararı onadı (karar özetine bakınız).

  ## 2. Yetki itirazı
  Yetki itirazının rejimi, yetkinin kesin olup olmamasına göre değişir:

  | | Kesin yetki | Kesin olmayan yetki |
  |---|---|---|
  | Mahkeme resen inceler mi? | Evet, davanın sonuna kadar (HMK m. 19/1) | Hayır |
  | Taraf ne zaman ileri sürer? | Her zaman (HMK m. 19/1) | Cevap dilekçesinde (HMK m. 19/2) |
  | Sonuç | Dava şartı noksanlığı (HMK m. 114/1-ç) | İlk itiraz (HMK m. 116/1-a) |

  **Kesin olmayan yetkide** itiraz yalnızca cevap dilekçesinde yapılabilir. HMK m. 117/1 bütün ilk itirazların cevap dilekçesinde ileri sürülmesini zorunlu kılar; aksi hâlde dinlenmezler. Cevap süresi, dava dilekçesinin tebliğinden itibaren iki haftadır (HMK m. 127/1).

  **Yetki itirazının içeriği (HMK m. 19/2).** İtiraz eden taraf **yetkili mahkemeyi**, birden fazla yetkili mahkeme varsa **seçtiği mahkemeyi** bildirmelidir; aksi takdirde itiraz dikkate alınmaz. "Mahkemeniz yetkisizdir" demek yetmez; yanlış mahkeme göstermek de itirazı geçersiz kılar. Yargıtay 11. Hukuk Dairesi, ilamsız takibe itirazında yetkili icra dairesini doğru göstermeyen borçlunun itirazını dikkate almamıştır (İİK m. 50/1 uyarınca takip hukukunda da HMK'nın yetki hükümleri kıyasen uygulanır).

  > **Örnek:** Konya'da yerleşik Veli, Ankara'da açılan ve kesin yetki kuralı bulunmayan bir alacak davasının cevap dilekçesinde yalnızca "Ankara mahkemeleri yetkisizdir" yazarsa, itirazı yetkili mahkemeyi göstermediği için dikkate alınmaz. Dava Ankara'da görülmeye devam eder (HMK m. 19/2, HMK m. 19/4).

  **Sonuçlar.** Davalı süresinde ve usulüne uygun itiraz etmezse davanın açıldığı mahkeme yetkili hâle gelir (HMK m. 19/4). İtiraz yerindeyse mahkeme yetkisizlik kararı verir ve bu kararda **yetkili mahkemeyi de gösterir** (HMK m. 19/3).

  ## 3. Görevsizlik veya yetkisizlik kararından sonra: HMK m. 20
  Mahkeme görevsizlik veya yetkisizlik kararı verdiğinde dava kendiliğinden başka mahkemeye gitmez. Taraflardan birinin **iki hafta içinde, kararı veren mahkemeye başvurarak** dosyanın görevli veya yetkili mahkemeye gönderilmesini istemesi gerekir (HMK m. 20/1). Süre, durumuna göre farklı anlardan başlar:

  | Durum | Süre ne zaman başlar? |
  |---|---|
  | Karar verildiği anda kesin | Tebliğ tarihinden |
  | Kanun yoluna başvurulmadan kesinleşmiş | Kesinleşme tarihinden |
  | Kanun yoluna başvurulmuş | Başvurunun reddi kararının tebliğ tarihinden |

  **Başvurulmazsa** ne olur? **Dava açılmamış sayılır** ve görevsizlik veya yetkisizlik kararı veren mahkemece bu konuda **resen** karar verilir (HMK m. 20/1). Başvuru yapılırsa dosya gönderilir; dosya kendisine gönderilen mahkeme **kendiliğinden** taraflara davetiye gönderir (HMK m. 20/2). Hukuk Genel Kurulu, başvuru süresinin hak düşürücü nitelikte olduğunu ve gönderilen mahkemede yargılamanın aynı dava dilekçesi üzerinden sürdüğünü ifade etmiştir.

  > 📌 **Kesin bilgi:** 7251 sayılı Kanunla HMK m. 20/1'e "bu karar verildiği anda kesin ise tebliğ tarihinden" ibaresi eklendi; ayrıca eski "bu mahkemece davanın açılmamış sayılmasına karar verilir" ifadesi, "dava açılmamış sayılır ve görevsizlik veya yetkisizlik kararı veren mahkemece bu konuda resen karar verilir" şeklinde değiştirildi.

  > **Örnek:** Konya Asliye Hukuk Mahkemesi görevsizlik kararı vermiş, karar tebliğ edilmiş ve istinaf edilmemiştir. Karar, istinaf süresinin dolmasıyla kesinleşir; Zeynep'in dosyanın görevli mahkemeye gönderilmesini istemek için kesinleşme tarihinden itibaren iki haftası vardır. Dilekçeyi Konya mahkemesine vermelidir. Zeynep, süreyi kaçırırsa Konya mahkemesi davanın açılmamış sayılmasına resen karar verir.

  **Yargılama giderleri.** Görevsizlik veya yetkisizlik kararından sonra davaya başka bir mahkemede devam edilirse yargılama giderlerine o mahkeme hükmeder. Devam edilmemişse, **talep üzerine** davanın açıldığı mahkeme dosya üzerinden bu durumu tespit eder ve davacıyı yargılama giderlerini ödemeye mahkûm eder (HMK m. 331/2). Dikkat: davanın açılmamış sayılmasına karar **resen** verilir; yargılama gideri hükmü ise **talep** gerektirir.

  > ⚠️ **Sınavda dikkat:** Başvuru "kararı veren mahkemeye" yapılır, dosyanın gideceği mahkemeye değil (HMK m. 20/1). İstinaf süresi de iki haftadır ve karar usulen taraflara tebliğ edilince işlemeye başlar (HMK m. 345/1); iki süreyi karıştırma.

  **Sınırı.** Hukuk Genel Kurulu, HMK m. 20'nin adli yargı düzeni içindeki mahkemeler arasında verilen görevsizlik/yetkisizlik kararlarına ilişkin olduğunu belirtmiş; adli yargının, Uyuşmazlık Mahkemesi kararıyla görevli kılındığı bir davada, "davanın açılmamış sayılması" gibi ağır bir sonucun kıyasen uygulanamayacağını kabul etmiştir.

  ## 4. Yargı yeri belirlenmesi
  Bazen yetkili mahkemeyi kimse bulamaz ya da iki mahkeme birbirine "ben değil, o yetkili" der. Bu tıkanıklığı **yargı yeri belirlenmesi** çözer. HMK m. 21/1'e göre şu hâllerde başvurulur:

  - **a)** Davaya bakmakla görevli ve yetkili mahkemenin davaya bakmasına herhangi bir **engel** çıkarsa.
  - **b)** İki mahkeme arasında yargı çevrelerinin sınırlarının belirlenmesi konusunda **tereddüt** doğarsa.
  - **c)** İki mahkeme de **görevsizlik** kararı verir ve bu kararlar kanun yoluna başvurulmaksızın kesinleşirse.
  - **ç)** **Kesin yetki** hâllerinde iki mahkeme de **yetkisizlik** kararı verir ve bu kararlar kanun yoluna başvurulmaksızın kesinleşirse.

  Yargı yeri belirleme **merci** HMK m. 22'de düzenlenmiştir. Engel veya yargı çevresi tereddüdünde ilk derece mahkemeleri için bölge adliye mahkemesine, bölge adliye mahkemeleri için Yargıtaya başvurulur (HMK m. 22/1). Aynı dava hakkında iki mahkemenin göreve veya yetkiye ilişkin kararları kanun yoluna başvurulmaksızın kesinleşirse görevli veya yetkili mahkemeyi ilgisine göre bölge adliye mahkemesi veya Yargıtay belirler (HMK m. 22/2). Bölge adliye mahkemeleri hukuk daireleri, kendi yargı çevreleri içindeki ilk derece mahkemeleri arasındaki yetki ve görev uyuşmazlıklarını çözer (5235 sayılı Kanun m. 36/3). Farklı bölge adliye mahkemesi çevrelerindeki mahkemeler arasındaki uyuşmazlıklar ise Yargıtay 5. Hukuk Dairesinin verdiği kararlardan anlaşıldığı üzere Yargıtayda çözülür.

  **Usul ve sonuç (HMK m. 23).** İnceleme dosya üzerinden yapılabilir (HMK m. 23/1). Bölge adliye mahkemesince veya Yargıtayca verilen yargı yeri belirlemesi ile kanun yolu incelemesi sonucunda kesinleşen göreve veya yetkiye ilişkin kararlar, davaya ondan sonra bakacak mahkemeyi **bağlar** (HMK m. 23/2).

  > ⚠️ **Sınavda dikkat:** Kanun yoluna başvurulmadan kesinleşmiş ilk yetkisizlik kararı, bir üst mahkemenin incelemesinden geçmediği için dosyayı alan mahkemeyi HMK m. 23/2 anlamında bağlamaz; bu mahkeme de yetkisizlik kararı verirse ve kesin yetki varsa yargı yeri belirlenmesi yoluna gidilir (HMK m. 21/1-ç).

  > **Örnek:** Ankara'da açılan bir tapu iptali davasında Ankara mahkemesi, taşınmazın bulunduğu Manisa mahkemesini kesin yetkili göstererek yetkisizlik verir; karar kesinleşir. Manisa mahkemesi ise dosyayı Ankara'ya iade eder ve karar yine kesinleşir. Kesin yetki hâlinde iki mahkeme de yetkisiz olduğunu söylediği için yargı yeri belirlenmesine başvurulur; Yargıtayca belirlenen mahkeme davaya bakar (HMK m. 21/1-ç, HMK m. 22/2).

  ## 5. Sık yapılan hatalar
  - "Yetki sözleşmesi varsa mahkeme hemen resen yetkisizlik verir" demek. Yanlış: yetki kesin olmadığı için itiraz gerekir.
  - "Yetki itirazı için sadece mahkemenin yetkisiz olduğunu söylemek yeter" demek. Yanlış: yetkili mahkeme gösterilmelidir (HMK m. 19/2).
  - İki haftalık süreyi her durumda tebliğden başlatmak. Yanlış: kanun yoluna başvurulmadan kesinleşmede kesinleşme tarihi esastır (HMK m. 20/1).
  - Yargı yeri belirlenmesini her yetkisizlik kararı çatışmasında uygulamak. Yanlış: kararların kanun yoluna başvurulmadan kesinleşmesi ve yetki bakımından kesin yetki bulunması gerekir (HMK m. 21/1-ç).

  ## 6. Denetim şeması
  1. Yetki sözleşmesi var mı? Taraflar tacir/kamu tüzel kişisi mi, yazılı mı, ilişki ve mahkeme belirli mi, konu kesin yetkili mi? (HMK m. 17, HMK m. 18)
  2. Yetki kesin mi? Kesinse mahkeme resen inceler; değilse davalı cevap dilekçesinde itiraz etmelidir.
  3. İtiraz usulüne uygun mu? Yetkili mahkeme (veya seçilen mahkeme) bildirilmiş mi? (HMK m. 19/2)
  4. Yetkisizlik kararı verildi mi? Kararda yetkili mahkeme gösterildi mi? (HMK m. 19/3)
  5. İki haftalık gönderme talebi süresini, kararın durumuna göre doğru anından başlat; kararı veren mahkemeye başvuru yapıldı mı? (HMK m. 20/1)
  6. Başvuru yapılmadıysa dava açılmamış sayılır; giderler talep üzerine davacıya yükletilir. (HMK m. 20/1, HMK m. 331/2)
  7. İki mahkeme de dosyayı reddettiyse ve kararlar kesinleştiyse yargı yeri belirlenmesine git. (HMK m. 21, HMK m. 22 ve HMK m. 23)
kritik: |
  - 📌 Yetki sözleşmesini yalnızca **tacirler veya kamu tüzel kişileri** yapabilir (HMK m. 17).
  - 📌 Aksi kararlaştırılmadıkça yetki sözleşmesi **münhasırdır**: dava sadece belirlenen mahkemelerde açılır (HMK m. 17).
  - 📌 Geçerlilik: **yazılı**, hukuki ilişki **belirli/belirlenebilir**, mahkeme(ler) **gösterilmiş** (HMK m. 18/2); konu serbestçe tasarruf edilebilir olmalı ve **kesin yetki** bulunmamalıdır (HMK m. 18/1).
  - ⚠️ Münhasır yetki sözleşmesi **kesin yetki değildir**; davalı cevap dilekçesinde ilk itiraz olarak ileri sürmezse mahkeme resen yetkisizlik veremez (HMK m. 19/2, HMK m. 116/1-a).
  - 📌 Kesin yetkide mahkeme yetkiyi davanın sonuna kadar resen araştırır (HMK m. 19/1); kesin olmayan yetkide itiraz **cevap dilekçesinde** yapılır (HMK m. 19/2, HMK m. 117/1).
  - ⚠️ Yetki itirazında **yetkili mahkemeyi (birden fazlaysa seçileni) bildirmek** şarttır; aksi hâlde itiraz dikkate alınmaz (HMK m. 19/2).
  - 📌 İtiraz edilmezse davanın açıldığı mahkeme **yetkili hâle gelir** (HMK m. 19/4).
  - 📌 Yetkisizlik kararında mahkeme **yetkili mahkemeyi de gösterir** (HMK m. 19/3).
  - 📌 Gönderme talebi süresi **iki haftadır** ve **kararı veren mahkemeye** başvurularak kullanılır (HMK m. 20/1).
  - 📌 Süre başlangıcı: kesin kararda tebliğ; kanun yoluna başvurulmadan kesinleşmede kesinleşme tarihi; kanun yoluna başvuruda reddin tebliği (HMK m. 20/1).
  - ⚠️ Başvurulmazsa dava **açılmamış sayılır**; bu karar **resen** verilir, ancak yargılama giderine **talep üzerine** hükmedilir (HMK m. 20/1, HMK m. 331/2).
  - 📌 Yargı yeri belirlenmesinde iki mahkemenin de görevsizlik (HMK m. 21/1-c) veya kesin yetkide yetkisizlik (HMK m. 21/1-ç) kararı vermesi ve kararların kanun yoluna başvurulmadan kesinleşmesi gerekir.
doktrin: |
  ### Tacir ile tacir olmayan arasındaki yetki sözleşmesi
  HMK m. 17 yetki sözleşmesi yapma imkânını tacirlere ve kamu tüzel kişilerine tanır ve bunu "aralarında" doğabilecek uyuşmazlık için öngörür. Bu lafızdan hareketle bir görüş, sözleşmenin iki tarafının da bu sınıfa girmesi gerektiğini savunur; tacir olmayan bir tarafın bulunduğu hâlde kayıt geçerli sayılmaz. Daha dar bir yaklaşım ise tacir tarafı bağlayabileceği ihtimalini tartışmaya açar. Sınavda en güvenli yol, metnin açık lafzına dayanmak ve kayıt geçerli olmasa bile genel yetki kurallarının sürdüğünü hatırlatmaktır.

  ### Gönderme talebinin yapılacağı mahkeme
  HMK m. 20/1 başvurunun "kararı veren mahkemeye" yapılmasını söyler. Usul ekonomisini öne çıkararak, dilekçenin doğrudan gönderilecek mahkemeye verilmesinin de geçerli sayılması gerektiğini savunan görüşler vardır. Buna karşılık kanun metni açıktır ve süreye bağlı hak kaybı doğuran bir hüküm olduğu için lafza sıkı sıkıya bağlı kalınması, riskten kaçınma yönünden de önerilir. Olay çözümünde başvuruyu kararı veren mahkemeye yapılmış olarak kabul edin.

  ### İstinaf süresi dolmadan gönderme talebi
  Kanun yoluna başvurulmayarak kesinleşen kararlarda, istinaf süresi dolmadan yapılan gönderme talebinin geçerli olup olmadığı tartışmalıdır. Kesinleşme tarihi süre başlangıcı olduğu için erken talebin süreyi ne ölçüde etkilediği konusunda görüş ayrılığı vardır. Bu nokta olay çözümüne dayanak yapılmamalıdır.
sozluk:
  - terim: Yetki sözleşmesi
    tanim: "Tacirler veya kamu tüzel kişilerinin, aralarındaki uyuşmazlık için bir veya birden fazla mahkemeyi yetkili kıldıkları yazılı anlaşma (HMK m. 17-18)."
  - terim: Münhasır yetki sözleşmesi
    tanim: "Aksi kararlaştırılmadıkça davanın sadece sözleşmeyle belirlenen mahkemelerde açılabileceğini öngören yetki sözleşmesi; kesin yetki doğurmaz."
  - terim: Yetki itirazı
    tanim: "Kesin olmayan yetkide davalının cevap dilekçesinde ileri sürmesi gereken ilk itiraz; yetkili mahkemeyi (birden fazlaysa seçileni) göstermeyi gerektirir (HMK m. 19/2)."
  - terim: İlk itiraz
    tanim: "Cevap dilekçesinde ileri sürülmek zorunda olan itirazlar; kesin yetki kuralının bulunmadığı hâllerde yetki itirazı ve tahkim itirazı (HMK m. 116, HMK m. 117)."
  - terim: Yetkisizlik kararı
    tanim: "Mahkemenin yetkili olmadığını belirten ve yetkili mahkemeyi de gösteren karar (HMK m. 19/3)."
  - terim: Gönderme talebi
    tanim: "Görevsizlik/yetkisizlik kararından sonra iki hafta içinde kararı veren mahkemeye yapılan, dosyanın görevli/yetkili mahkemeye gönderilmesi başvurusu (HMK m. 20/1)."
  - terim: Dava açılmamış sayılır
    tanim: "İki haftalık gönderme talebi süresi içinde başvurulmamasının sonucu; karar resen verilir (HMK m. 20/1)."
  - terim: Yargı yeri belirlenmesi
    tanim: "Davaya bakacak mahkemenin, engel, sınır tereddüdü veya olumsuz görev/yetki uyuşmazlığı hâllerinde bölge adliye mahkemesi veya Yargıtayca belirlenmesi (HMK m. 21-23)."
  - terim: Olumsuz yetki uyuşmazlığı
    tanim: "İki mahkemenin de aynı davada yetkisizlik kararı vermesi; kesin yetkide kararlar kanun yoluna başvurulmadan kesinleşirse yargı yeri belirlenir (HMK m. 21/1-ç)."
  - terim: Münhasır yetki ile kesin yetki ayrımı
    tanim: "Yetki sözleşmesinin sadece belirli mahkemeleri yetkili kılması (münhasır), kamu düzenine ilişkin kesin yetki sayılmasını gerektirmez."
kararlar:
  - id: "1231649900"
    ozet: |
      Sigortacı, nakliyat emtia sigortası kapsamında sigortalısına ödediği 32.382,44 USD hasar tazminatını, sigortalıya halef olduğunu ileri sürerek taşıyandan rücuen istemiştir. Davalı, konişmentodaki yetki şartı gereği Türk mahkemelerinin yetkisiz olduğunu savunmuş; ilk derece mahkemesi, yabancılık unsuru bulunan uyuşmazlıkta konişmentodaki yetki şartına göre Almanya mahkemelerinin yetkili olduğu gerekçesiyle davayı yetkisizlik nedeniyle usulden reddetmiş, bölge adliye mahkemesi istinaf başvurusunu esastan reddetmiştir. Bölge adliye mahkemesinin gerekçesine göre (Milletlerarası Özel Hukuk ve Usul Hukuku Hakkında Kanun'un 47. maddesi de gözetilerek) yetki şartı yazılı, açık ve belirli, taraflar tacirdir; HMK m. 17 uyarınca yetki şartı genel yetkili mahkemelerin yetkisini ortadan kaldırır ve sigortalıyı bağlayan şart, halef olan sigortacıyı da bağlar. Yargıtay 11. Hukuk Dairesi bu kararı doğru bularak oy birliğiyle onamıştır.
  - id: "1230907900"
    ozet: |
      Taşıma ilişkisinden doğan konteyner bekleme (demuraj) ve ardiye ücretleri için Büyükçekmece İcra Dairesinde ilamsız takipler başlatılmış, borçlu yetki itirazında bulunmuştur. Dava itirazın iptali davasıdır; mahkemeler icra dairesinin yetkisiz olduğuna karar vermiştir. Yargıtay 11. Hukuk Dairesi, İİK m. 50/1 ve HMK m. 19/2 uyarınca borçlunun yetkili icra dairesini doğru bildirmesi, birden fazla yetkili yer varsa seçtiğini göstermesi gerektiğini, aksi takdirde itirazın dikkate alınmayacağını belirtmiştir. Borçlu şirketin adresi imza sirkülerine göre Edirne'nin Keşan ilçesi olduğu hâlde itirazda Edirne merkez icra dairesi yetkili gösterildiğinden itiraz geçersiz sayılmış, istinaf başvurusunun esastan reddine ilişkin karar bozulmuştur.
  - id: "1044872100"
    ozet: |
      Zorunlu mali mesuliyet sigortacısı, ödediği tazminatın rücuen tahsili için adli yargıda dava açmış; dava yargı yolu nedeniyle usulden reddedilmiş, davacı idari yargıda dava açmış, idare mahkemesi dosyayı Uyuşmazlık Mahkemesine göndermiş ve Uyuşmazlık Mahkemesi adli yargıyı görevli bulmuştur. Asliye hukuk mahkemesi, HMK m. 20'yi kıyasen uygulayarak davacının iki hafta içinde başvurmadığı gerekçesiyle davanın açılmamış sayılmasına karar vermiş, Özel Daire bozmuş, mahkeme direnmiştir. Hukuk Genel Kurulu, HMK m. 20'deki gönderme talebi usulünün aynı yargı kolu içindeki mahkemeler arasında verilen kararlara ilişkin olduğunu, başvuru süresinin hak düşürücü nitelikte olduğunu, kanunun öngörmediği bir yükün yorumla getirilemeyeceğini ve mahkemenin Uyuşmazlık Mahkemesi kararına uymakla yükümlü olduğunu belirterek direnme kararını bozmuştur. Kurulda karşı oy da kullanılmıştır.
sorular:
  - soru: |
      HMK'ya göre **yetki sözleşmesi** yapabilecek kişiler aşağıdakilerden hangisidir?
    siklar:
      - "Yalnızca gerçek kişiler"
      - "Tacirler veya kamu tüzel kişileri"
      - "Dernekler ve vakıflar dâhil bütün özel hukuk tüzel kişileri"
      - "Yalnızca kamu tüzel kişileri"
    dogru: 1
    aciklama: |
      HMK m. 17'ye göre aralarında doğmuş veya doğabilecek bir uyuşmazlık hakkında bir veya birden fazla mahkemeyi sözleşmeyle yetkili kılabilecekler tacirler veya kamu tüzel kişileridir. Gerçek kişi olmak veya tacir sıfatı taşımayan özel hukuk tüzel kişisi olmak, bu yetkiyi vermez.
  - soru: |
      Yetki sözleşmesinde "aksi kararlaştırılmadıkça" hangi sonuç doğar?
    siklar:
      - "Dava yine de genel yetkili mahkemede açılabilir."
      - "Dava sadece sözleşmeyle belirlenen mahkemelerde açılır."
      - "Sözleşme kesin yetki doğurur ve mahkeme resen yetkisizlik kararı verir."
      - "Yetki sözleşmesi hiçbir hukuki sonuç doğurmaz."
    dogru: 1
    aciklama: |
      HMK m. 17'ye göre taraflarca aksi kararlaştırılmadıkça dava sadece sözleşmeyle belirlenen mahkemelerde açılır (münhasır yetki sözleşmesi). Ancak bu, kanundaki anlamda kesin yetki değildir; itiraz cevap dilekçesinde yapılmalıdır.
  - soru: |
      İki tacir arasında yapılan bir sözleşmede, taşınmazın mülkiyetinin tapu iptali ile devrine ilişkin uyuşmazlıklar için İstanbul mahkemelerinin yetkili olduğu kararlaştırılmıştır. Taşınmaz Antalya'dadır. Bu yetki sözleşmesi bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Taraflar tacir olduğundan sözleşme tam geçerlidir ve Antalya mahkemesi yetkisiz hâle gelir."
      - "Taşınmazın aynına ilişkin davada kesin yetki bulunduğundan yetki sözleşmesi yapılamaz."
      - "Sözleşme yalnızca noterde yapılsaydı geçerli olurdu."
      - "Sözleşme geçerlidir ancak taşınmazın bulunduğu yer mahkemesi seçimlik olarak da yetkilidir."
    dogru: 1
    aciklama: |
      HMK m. 12/1 taşınmaz üzerindeki ayni hakka ilişkin veya ayni hak sahipliğinde değişikliğe yol açabilecek davalarda taşınmazın bulunduğu yer mahkemesini kesin yetkili kılar. HMK m. 18/1 kesin yetki hâllerinde yetki sözleşmesi yapılamayacağını söyler. Tarafların tacir olması bu sonucu değiştirmez.
  - soru: |
      Aşağıdakilerden hangisi HMK m. 18/2'ye göre yetki sözleşmesinin geçerlilik şartı **değildir**?
    siklar:
      - "Yazılı olarak yapılması"
      - "Uyuşmazlığın kaynaklandığı hukuki ilişkinin belirli veya belirlenebilir olması"
      - "Yetkili kılınan mahkeme veya mahkemelerin gösterilmesi"
      - "Sözleşmenin noter tarafından onaylanması"
    dogru: 3
    aciklama: |
      HMK m. 18/2 üç şart arar: yazılı olma, hukuki ilişkinin belirli veya belirlenebilir olması ve yetkili kılınan mahkeme veya mahkemelerin gösterilmesi. Noter onayı aranmaz.
  - soru: |
      İki tacir, satım sözleşmesine "Eskişehir mahkemeleri yetkilidir" şeklinde yazılı bir yetki şartı koymuştur. Alıcı B'ye karşı satıcı A, genel yetkili mahkeme olan Mersin'de dava açmış, B cevap dilekçesinde hiçbir yetki itirazında bulunmamıştır. Ne olur?
    siklar:
      - "Mersin mahkemesi yetki sözleşmesini resen gözeterek yetkisizlik kararı verir."
      - "Dava şartı yokluğundan dava usulden reddedilir."
      - "B süresinde itiraz etmediğinden Mersin mahkemesi yetkili hâle gelir."
      - "Dava resen Eskişehir mahkemesine gönderilir."
    dogru: 2
    aciklama: |
      Münhasır yetki sözleşmesi kesin yetki doğurmaz. Yetkinin kesin olmadığı davalarda davalı süresi içinde ve usulüne uygun itiraz etmezse davanın açıldığı mahkeme yetkili hâle gelir (HMK m. 19/4). İtiraz, HMK m. 116/1-a ve HMK m. 117/1'e göre cevap dilekçesinde yapılmalıdır.
  - soru: |
      Kesin olmayan yetkide yetki itirazı **ne zaman** ileri sürülmelidir?
    siklar:
      - "Davanın sonuna kadar her zaman"
      - "Cevap dilekçesinde"
      - "Hükmün verilmesinden sonra istinaf aşamasında"
      - "Tahkikatın sona ermesine kadar"
    dogru: 1
    aciklama: |
      HMK m. 19/2 kesin olmayan yetkide itirazın cevap dilekçesinde ileri sürülmesini ister. HMK m. 117/1 de ilk itirazların cevap dilekçesinde ileri sürülmesini zorunlu kılar. "Her zaman" ileri sürülebilmesi yalnızca kesin yetkide söz konusudur (HMK m. 19/1).
  - soru: |
      Konya'da açılan sözleşme alacağı davasında davalı Veli, süresi içinde verdiği cevap dilekçesinde yalnızca "Konya mahkemesi yetkisizdir, yetki itirazında bulunuyorum" demiş, yetkili mahkemeyi göstermemiştir. Sonuç aşağıdakilerden hangisidir?
    siklar:
      - "Yetki itirazı kabul edilir ve mahkeme yetkisizlik kararı verir."
      - "Mahkeme Veli'ye süre vererek yetkili mahkemeyi bildirmesini ister."
      - "Yetki itirazı dikkate alınmaz ve Konya mahkemesi yetkili hâle gelir."
      - "Dava resen yetkili mahkemeye gönderilir."
    dogru: 2
    aciklama: |
      HMK m. 19/2'ye göre yetki itirazında bulunan taraf yetkili mahkemeyi, birden fazla yetkili mahkeme varsa seçtiği mahkemeyi bildirir; aksi takdirde itiraz dikkate alınmaz. Bu durumda süresinde ve usulüne uygun itiraz bulunmadığından davanın açıldığı mahkeme yetkili hâle gelir (HMK m. 19/4).
  - soru: |
      Görevsizlik veya yetkisizlik kararından sonra dosyanın gönderilmesi için başvuru süresi ve başvurunun yapılacağı mahkeme aşağıdakilerden hangisidir?
    siklar:
      - "Bir hafta; dosyanın gideceği mahkeme"
      - "İki hafta; kararı veren mahkeme"
      - "İki hafta; dosyanın gideceği mahkeme"
      - "Otuz gün; bölge adliye mahkemesi"
    dogru: 1
    aciklama: |
      HMK m. 20/1 uyarınca taraflardan birinin iki hafta içinde kararı veren mahkemeye başvurarak dosyanın görevli ya da yetkili mahkemeye gönderilmesini talep etmesi gerekir. Aksi hâlde dava açılmamış sayılır.
  - soru: |
      Asliye hukuk mahkemesi yetkisizlik kararı vermiş, karar taraflara tebliğ edilmiş, kimse istinaf etmemiştir. Karar kesinleşmiş, davacı kesinleşme tarihinden bir ay sonra dosyanın yetkili mahkemeye gönderilmesini talep etmiştir. Ne olur?
    siklar:
      - "Dosya yetkili mahkemeye gönderilir; çünkü süre tebliğ tarihinden başlar ve uzatılabilir."
      - "Dava açılmamış sayılır ve bu karar, kararı veren mahkemece resen verilir."
      - "Dava, davalının talebi hâlinde açılmamış sayılır."
      - "Mahkeme davacıdan yeniden dava açmasını ister; ilk dava hiç açılmamış gibi sürer."
    dogru: 1
    aciklama: |
      Kanun yoluna başvurulmayarak kesinleşen kararlarda iki haftalık süre kesinleşme tarihinden başlar. Davacı bu süreyi kaçırmıştır; HMK m. 20/1 uyarınca dava açılmamış sayılır ve görevsizlik veya yetkisizlik kararı veren mahkemece bu konuda resen karar verilir. Davalının talebi aranmaz.
  - soru: |
      Yetkisizlik kararı üzerine kanun yoluna başvurulmuş ve başvuru reddedilmiştir. HMK m. 20/1'deki iki haftalık gönderme talebi süresi hangi tarihten itibaren başlar?
    siklar:
      - "Yetkisizlik kararının verildiği tarihten"
      - "İstinaf başvurusunun yapıldığı tarihten"
      - "Başvurunun reddi kararının tebliğ tarihinden"
      - "Kesinleşme şerhinin düzenlendiği tarihten"
    dogru: 2
    aciklama: |
      HMK m. 20/1'e göre kanun yoluna başvurulmuşsa süre, bu başvurunun reddi kararının tebliğ tarihinden itibaren işler. Karar verildiği anda kesin ise tebliğ tarihinden, kanun yoluna başvurulmadan kesinleşmişse kesinleşme tarihinden başlar.
  - soru: |
      Aşağıdakilerden hangisinde HMK m. 21'e göre **yargı yeri belirlenmesi** yoluna başvurulur?
    siklar:
      - "Davalı cevap dilekçesinde yetki itirazında bulunmuştur."
      - "Kesin yetki bulunan bir davada iki mahkeme de yetkisizlik kararı vermiş ve kararlar kanun yoluna başvurulmaksızın kesinleşmiştir."
      - "Davacı, iki hafta içinde gönderme talebinde bulunmamıştır."
      - "Taraflar yetki sözleşmesiyle bir mahkemeyi yetkili kılmıştır."
    dogru: 1
    aciklama: |
      HMK m. 21/1-ç, kesin yetki hâllerinde iki mahkemenin de yetkisizlik kararı vermesi ve bu kararların kanun yoluna başvurulmaksızın kesinleşmesi durumunda yargı yeri belirlenmesini öngörür. Diğer seçenekler yargı yeri belirlenmesini gerektirmeyen olaylardır.
  - soru: |
      Aynı bölge adliye mahkemesinin yargı çevresindeki A ve B asliye hukuk mahkemeleri aynı dava hakkında yetkisizlik kararı vermiş, kararlar kanun yoluna başvurulmaksızın kesinleşmiştir. Davada kesin yetki vardır. Yargı yeri belirlenmesi hangi merci tarafından yapılır?
    siklar:
      - "Yargıtay Hukuk Genel Kurulu"
      - "Adalet Bakanlığı"
      - "İlgili bölge adliye mahkemesi"
      - "Hâkimler ve Savcılar Kurulu"
    dogru: 2
    aciklama: |
      İki mahkemenin aynı dava hakkında verdiği yetkisizlik kararlarının kanun yoluna başvurulmaksızın kesinleşmesi hâlinde görevli veya yetkili mahkemeyi ilgisine göre bölge adliye mahkemesi veya Yargıtay belirler (HMK m. 22/2). Bölge adliye mahkemesi hukuk daireleri, kendi yargı çevreleri içindeki ilk derece mahkemeleri arasındaki yetki uyuşmazlıklarını çözer (5235 sayılı Kanun m. 36/3). Soruda iki mahkeme de aynı bölge adliye mahkemesinin çevresindedir.
olaylar:
  - olay: |
      İstanbul'da merkezi bulunan A A.Ş. ile Mersin'de merkezi bulunan B Ltd. Şti., ikisi de tacirdir. Aralarındaki yazılı satım sözleşmesinde "İşbu sözleşmeden doğacak uyuşmazlıklarda Eskişehir mahkemeleri yetkilidir" hükmü bulunmaktadır. Başka bir hüküm yoktur. B bedeli ödemediği için A A.Ş., 800.000 TL'lik alacağı nedeniyle Mersin Asliye Ticaret Mahkemesinde dava açmıştır.

      B Ltd. Şti., cevap süresi içinde verdiği dilekçede yalnızca "Mahkemeniz yetkisizdir, yetki itirazında bulunuyoruz" demiştir. Mahkeme, bu itirazı dikkate almamış ve yargılamaya devam etmiştir.

      Alternatif olarak B Ltd. Şti. cevap dilekçesinde "Aramızdaki yetki sözleşmesi uyarınca Eskişehir Asliye Ticaret Mahkemesi yetkilidir" demiş olsaydı mahkeme yetkisizlik kararı verecek ve karar taraflara tebliğ edilecekti. Bu karara karşı iki taraf da istinaf yoluna başvurmamış, karar 20 Mayıs 2026 tarihinde kesinleşmiştir. A A.Ş. dosyanın Eskişehir'e gönderilmesi için 20 Haziran 2026'da kararı veren mahkemeye dilekçe vermiştir.

      1. Yetki sözleşmesi geçerli midir? Geçerliyse niteliği nedir?
      2. Mersin mahkemesi yetki sözleşmesini resen gözetebilir mi? B'nin ilk cevap dilekçesi nasıl değerlendirilir?
      3. Alternatif durumda A A.Ş.'nin 20 Haziran 2026 tarihli başvurusunun sonucu nedir? Yargılama giderleri bakımından ne olur?
    olcut:
      - {tespit: "Yetki sözleşmesinin geçerli olduğunun tespiti: taraflar tacir, yazılı, hukuki ilişki ve mahkeme belirli, kesin yetki yok", puan: 20, madde: "HMK m. 17, HMK m. 18/2"}
      - {tespit: "Aksi kararlaştırılmadığı için sözleşmenin münhasır olduğu ancak kesin yetki doğurmadığı", puan: 15, madde: "HMK m. 17"}
      - {tespit: "Mahkemenin yetki sözleşmesini resen gözetemeyeceği; itirazın cevap dilekçesinde ilk itiraz olarak yapılması gerektiği", puan: 15, madde: "HMK m. 116/1-a"}
      - {tespit: "Yetkili mahkemeyi göstermeyen itirazın dikkate alınmaması ve Mersin mahkemesinin yetkili hâle gelmesi", puan: 20, madde: "HMK m. 19/2, HMK m. 19/4"}
      - {tespit: "Kanun yoluna başvurulmadan kesinleşen kararda iki haftalık sürenin kesinleşmeden başlaması ve sürenin kaçırılması; dava açılmamış sayılır, karar resen verilir", puan: 20, madde: "HMK m. 20/1"}
      - {tespit: "Yargılama giderine talep üzerine hükmedilmesi", puan: 10, madde: "HMK m. 331/2"}
    cozum: |
      **Nitelendirme:** Olay, tacirler arasındaki yazılı yetki sözleşmesine rağmen genel yetkili mahkemede açılan bir sözleşme alacağı davasıdır; ayrıca yetkisizlik kararından sonra gönderme talebi süresi sorunu içerir.

      **Hukuki sorunlar:** (1) Yetki sözleşmesi geçerli mi, hangi türdendir? (2) Mersin mahkemesi sözleşmeyi resen gözetir mi, B'nin itirazı yeterli mi? (3) Kesinleşen yetkisizlik kararından sonra iki haftalık süre geçirilirse ne olur?

      **İlgili hükümler:** HMK m. 17 yetki sözleşmesini tacirlere veya kamu tüzel kişilerine tanır ve aksi kararlaştırılmadıkça davanın sadece belirlenen mahkemelerde açılacağını söyler. HMK m. 18/2 yazılı şekil, hukuki ilişkinin belirliliği ve mahkemenin gösterilmesini arar. HMK m. 19/2 kesin olmayan yetkide itirazın cevap dilekçesinde yapılmasını ve yetkili mahkemenin bildirilmesini, HMK m. 19/4 itiraz edilmezse mahkemenin yetkili hâle geleceğini düzenler. HMK m. 116/1-a yetki itirazını ilk itiraz sayar. HMK m. 20/1 gönderme talebi için iki haftalık süreyi ve sonucunu, HMK m. 331/2 yargılama giderini düzenler.

      **Değerlendirme:** (1) Taraflar tacirdir, sözleşme yazılıdır, hukuki ilişki (satım sözleşmesi) ve yetkili mahkemeler (Eskişehir) belirlidir; satım uyuşmazlığı kesin yetkili bir konu değildir. Dolayısıyla yetki sözleşmesi geçerlidir. Aksi kararlaştırılmadığından münhasırdır. Ancak bu, kanundaki anlamda kesin yetki değildir.
      (2) Yetki kesin olmadığı için Mersin mahkemesi, sözleşmeyi resen gözetemez; B'nin sözleşmeye dayanarak cevap dilekçesinde ilk itiraz yapması gerekir. B yalnızca "mahkemeniz yetkisizdir" demiş, yetkili mahkemeyi (Eskişehir) göstermemiştir. HMK m. 19/2 uyarınca bu itiraz dikkate alınmaz ve HMK m. 19/4 gereği Mersin mahkemesi yetkili hâle gelir; dava orada sürer.
      (3) Alternatif durumda itiraz usulüne uygun yapıldığından Mersin mahkemesi yetkisizlik kararı verir ve kararda yetkili mahkemeyi (Eskişehir) gösterir (HMK m. 19/3). Karar kanun yoluna başvurulmadan 20 Mayıs 2026'da kesinleştiğinden iki haftalık süre kesinleşme tarihinden başlar (HMK m. 20/1). A A.Ş.'nin başvurusu 20 Haziran 2026'da, yani süre geçtikten sonra yapılmıştır. Sonuç olarak dava açılmamış sayılır ve karar Mersin mahkemesince resen verilir; davalının talebi gerekmez. Yargılama giderlerine ise talep üzerine ve davacı aleyhine hükmedilebilir (HMK m. 331/2).

      **Sonuç:** (1) Yetki sözleşmesi geçerli ve münhasırdır, kesin yetki doğurmaz. (2) B'nin itirazı yetkili mahkemeyi göstermediğinden dikkate alınmaz; Mersin mahkemesi yetkili hâle gelir. (3) Alternatifte A A.Ş.'nin başvurusu süresinde sayılamaz; dava açılmamış sayılır, giderler talep üzerine A A.Ş.'ye yükletilir.
  - olay: |
      Ankara'da yerleşik Mehmet, Manisa'da bulunan bir arsanın kendisine ait olduğunu ileri sürerek tapu iptali ve tescil davasını Ankara Asliye Hukuk Mahkemesinde açmıştır. Ankara mahkemesi, taşınmazın bulunduğu yer mahkemesinin kesin yetkili olduğunu belirterek yetkisizlik kararı vermiş ve yetkili mahkeme olarak Manisa Asliye Hukuk Mahkemesini göstermiştir. Karar kanun yoluna başvurulmadan kesinleşmiş, Mehmet iki hafta içinde kararı veren mahkemeye başvurarak dosyanın Manisa'ya gönderilmesini istemiştir.

      Dosyayı alan Manisa Asliye Hukuk Mahkemesi, davalının Ankara'da yerleşik olduğunu belirterek Ankara'nın yetkili olduğuna hükmetmiş ve yetkisizlik kararı vermiştir. Bu karar da kanun yoluna başvurulmadan kesinleşmiştir. Ankara ve Manisa mahkemelerinin yargı çevreleri farklı bölge adliye mahkemelerine bağlıdır (varsayınız).

      1. Ankara mahkemesinin kararı yerinde midir? Mehmet'in başvurusu yeterli midir?
      2. Manisa mahkemesinin kararı ilk karara bağlı olmak zorunda mıdır?
      3. Bu durumda hangi yola başvurulur, hangi merci karar verir ve sonuç ne olur?
    olcut:
      - {tespit: "Tapu iptali ve tescil davasında taşınmazın bulunduğu yerin kesin yetkili olması ve yetkisizliğin resen gözetilmesi", puan: 15, madde: "HMK m. 12/1, HMK m. 19/1"}
      - {tespit: "Yetkisizlik kararında yetkili mahkemenin gösterilmesi", puan: 10, madde: "HMK m. 19/3"}
      - {tespit: "İki hafta içinde kararı veren mahkemeye başvuru; dosyanın gönderilmesi ve yeni mahkemenin kendiliğinden davetiye göndermesi", puan: 15, madde: "HMK m. 20/1, HMK m. 20/2"}
      - {tespit: "Kanun yolu incelemesinden geçmeyen ilk kararın Manisa mahkemesini bağlamaması", puan: 15, madde: "HMK m. 23/2"}
      - {tespit: "Kesin yetkide iki mahkemenin de yetkisizlik kararı vermesi ve kararların kanun yoluna başvurulmadan kesinleşmesi şartlarıyla yargı yeri belirlenmesi", puan: 25, madde: "HMK m. 21/1-ç"}
      - {tespit: "Yargı çevreleri farklı bölge adliye mahkemeleri bakımından merciin Yargıtay olması ve belirlemenin sonraki mahkemeyi bağlaması", puan: 20, madde: "HMK m. 22/2, HMK m. 23/2"}
    cozum: |
      **Nitelendirme:** Olay, kesin yetkili bir davada iki mahkemenin birbiri aleyhine verdiği yetkisizlik kararlarının kesinleşmesi (olumsuz yetki uyuşmazlığı) ve buna bağlı yargı yeri belirlenmesi sorunudur.

      **Hukuki sorunlar:** (1) Birinci yetkisizlik kararı ve gönderme talebi usulü doğru mudur? (2) İkinci mahkeme ilk karara bağlı mıdır? (3) Uyuşmazlık nasıl çözülür?

      **İlgili hükümler:** HMK m. 12/1 taşınmaz üzerindeki ayni hak sahipliğinde değişikliğe yol açabilecek davalarda taşınmazın bulunduğu yer mahkemesini kesin yetkili kılar. HMK m. 19/1 kesin yetkide mahkemenin yetkiyi davanın sonuna kadar resen araştıracağını, HMK m. 19/3 yetkisizlik kararında yetkili mahkemenin gösterileceğini söyler. HMK m. 20/1 ve m. 20/2 iki haftalık gönderme talebini ve gönderilen mahkemenin davetiye gönderme yükümlülüğünü düzenler. HMK m. 21/1-ç kesin yetki hâllerinde iki mahkemenin de yetkisizlik kararı vermesi ve bu kararların kanun yoluna başvurulmaksızın kesinleşmesi durumunda yargı yeri belirlenmesini öngörür. HMK m. 22/2 merci olarak bölge adliye mahkemesini veya Yargıtayı gösterir; HMK m. 23/2 yalnızca belirleme ve kanun yolu incelemesi sonunda kesinleşen kararların sonraki mahkemeyi bağladığını düzenler.

      **Değerlendirme:** (1) Tapu iptali ve tescil davası ayni hak sahipliğinde değişikliğe yol açabilecek bir davadır; taşınmazın bulunduğu Manisa mahkemesi kesin yetkilidir (HMK m. 12/1). Ankara mahkemesi bu durumu resen gözetmiş, yetkili mahkemeyi göstermiş ve yetkisizlik kararı vermiştir; karar yerindedir. Mehmet iki hafta içinde kararı veren mahkemeye başvurduğundan HMK m. 20/1'in gereğini yerine getirmiştir; dosya Manisa'ya gönderilir ve Manisa mahkemesi kendiliğinden taraflara davetiye gönderir (HMK m. 20/2).
      (2) Ankara'nın kararı kanun yolu incelemesinden geçmeden kesinleştiği için HMK m. 23/2 anlamında Manisa mahkemesini bağlamaz. Dolayısıyla Manisa mahkemesi, kendi değerlendirmesiyle yetkisizlik kararı verebilir. Ancak burada Manisa'nın gerekçesi (davalının yerleşim yeri) kesin yetki kuralıyla bağdaşmaz; yine de karar kanun yoluna başvurulmadan kesinleştiği için sonuç yargı yeri belirlenmesidir.
      (3) Kesin yetki hâlinde iki mahkeme de yetkisizlik kararı vermiş ve kararlar kanun yoluna başvurulmaksızın kesinleşmiştir; HMK m. 21/1-ç şartları gerçekleşmiştir. Mahkemelerin yargı çevreleri farklı bölge adliye mahkemelerine bağlı olduğundan merci Yargıtaydır (HMK m. 22/2). İnceleme dosya üzerinden yapılabilir (HMK m. 23/1). Yargıtay, kesin yetki kuralı gereği taşınmazın bulunduğu Manisa mahkemesini davaya bakacak mahkeme olarak belirler; bu belirleme davaya sonradan bakacak mahkemeyi bağlar (HMK m. 23/2).

      **Sonuç:** (1) Ankara mahkemesinin kararı yerindedir; Mehmet'in başvurusu yeterlidir. (2) Manisa mahkemesi ilk karara bağlı değildir. (3) Kesin yetkide olumsuz yetki uyuşmazlığı doğduğundan Yargıtayca yargı yeri belirlenir ve davaya Manisa mahkemesi bakar.
kartlar:
  - on: "Yetki sözleşmesini kimler yapabilir?"
    arka: "Tacirler veya kamu tüzel kişileri; aralarında doğmuş veya doğabilecek uyuşmazlık için (HMK m. 17)."
  - on: "Yetki sözleşmesinin geçerlilik şartları?"
    arka: "Yazılı olma, hukuki ilişkinin belirli/belirlenebilir olması, yetkili kılınan mahkemenin gösterilmesi (HMK m. 18/2); ayrıca kesin yetki hâli olmamalı ve konu serbestçe tasarruf edilebilir olmalı (HMK m. 18/1)."
  - on: "Aksi kararlaştırılmadıkça yetki sözleşmesinin sonucu?"
    arka: "Dava sadece sözleşmeyle belirlenen mahkemelerde açılır (münhasır yetki sözleşmesi, HMK m. 17)."
  - on: "Münhasır yetki sözleşmesi kesin yetki midir?"
    arka: "Hayır. Davalı cevap dilekçesinde ilk itiraz olarak ileri sürmezse mahkeme resen yetkisizlik veremez (HMK m. 19/2, HMK m. 116/1-a)."
  - on: "Kesin yetkide yetki itirazı?"
    arka: "Mahkeme yetkiyi davanın sonuna kadar kendiliğinden araştırır; taraflar her zaman ileri sürebilir (HMK m. 19/1)."
  - on: "Kesin olmayan yetkide itiraz nasıl yapılır?"
    arka: "Cevap dilekçesinde; yetkili mahkeme (birden fazlaysa seçilen) bildirilmelidir, aksi hâlde itiraz dikkate alınmaz (HMK m. 19/2)."
  - on: "Davalı yetki itirazında bulunmazsa?"
    arka: "Kesin olmayan yetkide davanın açıldığı mahkeme yetkili hâle gelir (HMK m. 19/4)."
  - on: "Yetkisizlik kararında hangi unsur bulunmalıdır?"
    arka: "Mahkeme yetkili mahkemeyi de gösterir (HMK m. 19/3)."
  - on: "HMK m. 20/1'e göre gönderme talebi süresi ve mercii?"
    arka: "İki hafta; kararı veren mahkemeye başvurulur."
  - on: "HMK m. 20/1'de iki haftalık sürenin başlangıçları?"
    arka: "Kesin kararda tebliğden; kanun yoluna başvurulmadan kesinleşmede kesinleşme tarihinden; kanun yoluna başvuruda reddin tebliğinden."
  - on: "Gönderme talebi yapılmazsa sonuç ve giderler?"
    arka: "Dava açılmamış sayılır, karar resen verilir (HMK m. 20/1); yargılama giderine talep üzerine hükmedilir (HMK m. 331/2)."
  - on: "Yargı yeri belirlenmesinde başvuru sebepleri ve merci?"
    arka: "Engel, sınır tereddüdü, iki mahkemenin görevsizlik kararı, kesin yetkide iki yetkisizlik kararı (HMK m. 21/1). Merci: engel ve tereddütte ilk derece mahkemeleri için bölge adliye mahkemesi, bölge adliye mahkemeleri için Yargıtay (HMK m. 22/1); olumsuz görev/yetki uyuşmazlığında ilgisine göre bölge adliye mahkemesi veya Yargıtay (HMK m. 22/2)."
