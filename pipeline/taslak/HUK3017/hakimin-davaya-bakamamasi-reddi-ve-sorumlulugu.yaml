kararlar:
  - id: "1219964100"
    ozet: |
      Karşılıklı boşanma davasında Karaman 2. Aile Mahkemesinin kararına karşı yapılan istinaf başvurusunu Konya Bölge Adliye Mahkemesi 2. Hukuk Dairesi karara bağlamıştı. Yargıtay 2. Hukuk Dairesi, dosyada daha önce ilk derece mahkemesi hâkimi sıfatıyla talimat mahkemesinde tanık dinleyerek yargılamaya katılmış bir hâkimin, sonradan istinaf incelemesi yapan daire heyetinde yer aldığını tespit etti. Daire, HMK m. 36/1-c'de "hâkim sıfatıyla hareket etmiş olması" ret sebebi olarak düzenlendiğinden, bu üyenin yer almadığı bir heyetin kurulması gerektiğini belirtti. Üyenin katılımıyla oluşan heyetçe istinaf incelemesi yapılması doğru görülmedi ve karar bozuldu. Karar, aynı davada önce ilk derecede, sonra istinafta görev yapmanın tarafsızlık bakımından önemini gösterir.
  - id: "1199737100"
    ozet: |
      Davacı, kayıt olduğu baro levhasından silinmesine yol açan idari yargı sürecinde görev yapan hâkimlerin kanuna aykırı kararlar verdiği iddiasıyla Devlet aleyhine maddi ve manevi tazminat istemiştir. İlk derece mahkemesi sıfatıyla bakan Yargıtay 4. Hukuk Dairesi davayı esastan reddetti, HMK m. 49 uyarınca 1.000 TL disiplin para cezasına ve toplam 26.000 TL vekâlet ücretine hükmetti. Hukuk Genel Kurulu, HMK m. 46/1'deki sebeplerin sınırlı sayıda olduğunu, delillerin değerlendirilmesi ve hukuk kurallarının yorumunun takdir yetkisi kapsamında kaldığını, sebeplerin gerçekleşmediğini belirterek kararı oy birliğiyle onadı. Karar, hâkim sorumluluğunda kanunda sayılan sebeplerin dışına çıkılamayacağını ve esastan ret hâlinde disiplin cezasının verileceğini gösterir.
sorular:
  - soru: |
      Hâkim Selin'in amcasının oğlu (kuzeni) bir davada davalıdır. Selin'in bu davaya bakması bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yasaklılık sebebi vardır; Selin talep olmasa bile çekinmek zorundadır."
      - "Yasaklılık sebebi yoktur; ancak dördüncü derece yansoy hısımlık ret sebebidir."
      - "Ne yasaklılık ne ret sebebi vardır; hısımlık bu derecede önem taşımaz."
      - "Ret sebebi vardır, ancak yalnızca davacı bu sebebe dayanabilir."
    dogru: 1
    aciklama: |
      Yasaklılık, üçüncü derece dâhil kan ve kayın hısımlığını kapsar (HMK m. 34). Kuzen dördüncü derece yansoy hısımdır ve HMK m. 36/1-ç uyarınca ret sebebidir. Yaygın yanılgı, kuzeni de yasaklılığa saymaktır.
  - soru: |
      Boşanmış olsalar bile hâkimin eski eşinin davasına bakması bakımından hangisi doğrudur?
    siklar:
      - "Evlilik bağı kalktığı için engel kalmaz."
      - "Yalnızca ret sebebidir; taraf süresinde ileri sürmelidir."
      - "Yasaklılık sebebidir; hâkim talep olmasa bile çekinmek zorundadır."
      - "Yalnızca boşanmadan sonra bir yıl geçmemişse engel vardır."
    dogru: 2
    aciklama: |
      HMK m. 34 "aralarında evlilik bağı kalksa bile eşinin davasında" hâkimin davaya bakamayacağını söyler ve talep olmasa bile çekinmesini zorunlu kılar.
  - soru: |
      Hâkim Murat, iki yıl önce davanın taraflarından birinin avukatlığını yapmıştır ve şimdi bu davaya bakmaktadır. Hangisi doğrudur?
    siklar:
      - "Murat'ın taraf vekili olması ret sebebidir; taraf ilk duruşmada ileri sürmelidir."
      - "Murat'ın taraf vekili olması yasaklılık sebebidir; talep olmasa da çekinmelidir."
      - "Bu durum ancak tanıklık veya bilirkişilik yapmışsa sorun yaratır."
      - "Avukatlık, hâkimliğe geçildiğinde hukuki sonuç doğurmaz."
    dogru: 1
    aciklama: |
      İki taraftan birinin vekili sıfatıyla hareket ettiği davada hâkim davaya bakamaz (HMK m. 34/1-f). Vekillik, tanıklık veya bilirkişilikten farklı olarak yasaklılık sebebidir; tanıklık ve bilirkişilik HMK m. 36/1-c kapsamında ret sebebidir.
  - soru: |
      Davacı Ali, hâkimin ret sebebini ilk duruşmada biliyordu ancak bu duruşmada bir şey söylemedi; ikinci duruşmada ret dilekçesi verdi. Tek hâkimli mahkemede talep hakkında ne olur?
    siklar:
      - "Mahkeme, mensup olduğu mahkemece reddedilen hâkim katılmaksızın incelenmek üzere gönderir ve mutlaka kabul eder."
      - "Talep süresinde yapılmadığı için reddedilen hâkim tarafından geri çevrilir."
      - "Talep, kendiliğinden diğer asliye hukuk mahkemesine gönderilir ve süre aranmaz."
      - "Talep ancak hâkim kabul ederse dinlenir."
    dogru: 1
    aciklama: |
      Ret sebebini bilen taraf en geç ilk duruşmada bunu ileri sürmelidir (HMK m. 38/1). Süresinde yapılmayan talep geri çevrilir (HMK m. 41/1) ve tek hâkimli mahkemede bunu reddedilen hâkimin kendisi yapar (HMK m. 41/2).
  - soru: |
      Ret talebinde bulunan Zeynep, dilekçesini verdikten sonra vazgeçip geri almak istemektedir. Hangisi doğrudur?
    siklar:
      - "Hâkimin onayı ile geri alabilir."
      - "Karşı taraf rıza verirse geri alabilir."
      - "Ret talebi geri alınamaz."
      - "Merci karar verinceye kadar geri alabilir."
    dogru: 2
    aciklama: |
      HMK m. 38/4 açıkça "Ret talebi geri alınamaz" der.
  - soru: |
      Ret talebinin reddine ilişkin merci kararına karşı, esas hüküm bakımından istinaf yolu açık davada başvuru süresi nedir?
    siklar:
      - "Tebliğ tarihinden itibaren bir hafta."
      - "Tebliğ tarihinden itibaren iki hafta."
      - "Karar tarihinden itibaren on beş gün."
      - "Tefhim veya tebliğ tarihinden itibaren bir ay."
    dogru: 1
    aciklama: |
      HMK m. 43/2 uyarınca süre, 7499 sayılı Kanunla "tefhim veya" ibaresi çıkarılarak tebliğ tarihinden itibaren iki hafta olmuştur. Eski kaynaklardaki "bir hafta" güncel değildir.
  - soru: |
      Ret talebi hakkında merci henüz karar vermemiştir. Reddi istenen hâkim hakkında hangisi doğrudur?
    siklar:
      - "Hiçbir işlem yapamaz, gecikmesinde sakınca olan işler dahi."
      - "Her türlü işlemi yapmaya devam edebilir."
      - "Gecikmesinde sakınca bulunan işler dışında davaya bakamaz."
      - "Yalnızca duruşma yapabilir, karar veremez."
    dogru: 2
    aciklama: |
      HMK m. 42/4'e göre reddi istenen hâkim, merci karar verinceye kadar davaya bakamaz; gecikmesinde sakınca bulunan iş ve davalar bunun dışındadır.
  - soru: |
      Hâkim Hasan'ın verdiği hüküm nedeniyle zarar gördüğünü ileri süren Elif, tazminat için ne yapmalıdır?
    siklar:
      - "Hasan aleyhine asliye hukuk mahkemesinde dava açmalıdır."
      - "HMK m. 46'daki sebeplerden birine dayanarak Devlet aleyhine dava açmalıdır."
      - "Önce hâkim hakkında ceza mahkûmiyeti elde etmelidir."
      - "Dava açmadan Devletten idari yoldan tazminat istemelidir."
    dogru: 1
    aciklama: |
      Tazminat davası hâkime değil Devlet aleyhine açılır ve sayılı sebeplerden birine dayanmalıdır (HMK m. 46/1). Dava, hâkime karşı ceza soruşturmasına veya mahkûmiyete bağlanamaz (HMK m. 46/2).
  - soru: |
      Bir asliye hukuk mahkemesi hâkiminin fiili nedeniyle Devlet aleyhine açılacak tazminat davasına hangi mahkeme bakar?
    siklar:
      - "Aynı yerdeki başka bir asliye hukuk mahkemesi."
      - "Bölge adliye mahkemesi hukuk dairesi."
      - "Yargıtayın ilgili hukuk dairesi."
      - "İdare mahkemesi."
    dogru: 2
    aciklama: |
      HMK m. 47/1'e göre ilk derece ve bölge adliye mahkemesi hâkimlerinin fiil ve kararlarından dolayı Devlet aleyhine açılan tazminat davası Yargıtay ilgili hukuk dairesinde görülür.
  - soru: |
      Devlet, bir hâkim hakkındaki tazminat davasında hükmedilen tutarı 3 Mart tarihinde ödemiştir. Sorumlu hâkime rücu hakkı bakımından hangisi doğrudur?
    siklar:
      - "Ödeme tarihinden itibaren bir yıl içinde rücu eder."
      - "Dava tarihinden itibaren iki yıl içinde rücu eder."
      - "Rücu, hâkim hakkında ceza mahkûmiyeti verilmesine bağlıdır."
      - "Hâkimin görevinden ayrılmasından itibaren on yıl içinde rücu eder."
    dogru: 0
    aciklama: |
      HMK m. 46/3: Devlet, ödediği tazminat nedeniyle sorumlu hâkime ödeme tarihinden itibaren bir yıl içinde rücu eder.
  - soru: |
      Davacı Mert'in avukatı, genel dava vekâletnamesine dayanarak hâkimi reddetmiştir. Vekâletnamede hâkimi reddetme konusunda açık yetki yoktur. Sonuç nedir?
    siklar:
      - "Genel vekâletname ret için de yeterlidir."
      - "Vekil, açıkça yetki verilmedikçe hâkimi reddedemez."
      - "Ret talebi geçerlidir ancak vekil yargılama giderlerine mahkûm edilir."
      - "Ret talebini yalnızca asil sözlü olarak geri alabilir."
    dogru: 1
    aciklama: |
      HMK m. 74'e göre açıkça yetki verilmemişse vekil, hâkimi reddedemez ve hâkimlerin fiilleri sebebiyle Devlet aleyhine tazminat davası açamaz.
  - soru: |
      Hâkim Deniz, davada daha önce uyuşmazlığın arabulucusu olarak görev yapmıştır. Davanın tarafı bunu fark etmiştir. Hangisi doğrudur?
    siklar:
      - "Yasaklılık sebebidir; hüküm ve kararlar herhâlde iptal edilir."
      - "Ret sebebidir; taraf süresi içinde ret talebinde bulunmalıdır."
      - "Hiçbir sonuç doğurmaz; arabuluculuk hâkimliği etkilemez."
      - "Yalnızca zabıt kâtibi bakımından sebep olur."
    dogru: 1
    aciklama: |
      Uyuşmazlıkta arabuluculuk veya uzlaştırmacılık yapmış bulunmak, 7251 sayılı Kanunla HMK m. 36/1-c'ye eklenmiş bir ret sebebidir; yasaklılık sebebi değildir (HMK m. 34). Taraf ret talebini HMK m. 38/1'deki sürede yapmalıdır.
olaylar:
  - olay: |
      Ankara'da Asliye Hukuk Mahkemesinde görülen tapu iptali ve tescil davasında davacı Ahmet, davalı Burak'tır. Dava açıldıktan üç ay sonra mahkemenin tek hâkimi H1, Burak'ın kız kardeşi Canan ile evlenmiştir. Buna rağmen H1 davaya bakmaya devam etmiş, iki duruşma yapmış ve ihtiyati tedbirin kaldırılmasına karar vermiştir. Ahmet durumu öğrenince itiraz etmiştir.

      H1'in çekinmesi üzerine dosya H2'ye gitmiştir. H2'nin, avukatlık yaptığı dönemde aynı uyuşmazlıkta taraflar arasındaki ihtiyari arabuluculuk sürecinde **arabulucu** olarak görev yaptığı anlaşılmıştır. Ahmet'in avukatı V, yalnızca genel dava vekâletnamesine dayanarak H2'yi reddetmiştir. V, ret sebebini ispat için Ahmet'in yemin etmesini teklif etmiştir.

      Ahmet bu arada tedbirin kaldırılması nedeniyle zarar gördüğünü ileri sürerek H1 aleyhine doğrudan Ankara Nöbetçi Asliye Hukuk Mahkemesinde tazminat davası açmıştır.

      1. H1'in durumunu ve yapılan işlemlerin akıbetini değerlendiriniz.
      2. H2 hakkındaki ret talebini değerlendiriniz.
      3. Ahmet'in H1 aleyhine açtığı davayı değerlendiriniz.
    olcut:
      - {tespit: "H1 ile Burak arasında kayın hısımlık doğmuştur (2. derece); bu durum yasaklılık sebebidir ve H1 talep olmasa da çekinmek zorundadır", puan: 20, madde: "HMK m. 34"}
      - {tespit: "Yasaklılık sebebinin doğduğu tarihten itibaren yapılan işlemler üst mahkemece iptal olunabilir; hüküm ve kararlar herhâlde iptal olunur", puan: 20, madde: "HMK m. 35"}
      - {tespit: "Arabuluculuk yapmış olmak ret sebebidir (7251 sayılı Kanunla eklendi); yasaklılık sebebi değildir", puan: 20, madde: "HMK m. 36"}
      - {tespit: "Vekil, açık yetki olmadan hâkimi reddedemez; genel vekâletname yetmez", puan: 15, madde: "HMK m. 74"}
      - {tespit: "Ret sebepleri hakkında yemin teklif olunamaz; merci muhtemel görürse ret talebini kabul edebilir", puan: 10, madde: "HMK m. 42"}
      - {tespit: "Tazminat davası hâkime değil Devlet aleyhine, sayılı sebeplerden birine dayanarak ve Yargıtay ilgili hukuk dairesinde açılır", puan: 15, madde: "HMK m. 46"}
    cozum: |
      **Nitelendirme:** Olay, yasaklılık, hâkimin reddi ve hâkimin yargılama faaliyetinden doğan sorumluluk kurumlarının üçünü birlikte içerir.

      **Hukuki sorunlar:** (1) H1'in evlenmesiyle yasaklılık doğmuş mudur, yapılan işlemlerin akıbeti nedir? (2) Arabulucu olarak görev yapmış H2'ye ret talebi geçerli midir? (3) Tazminat davası doğru taraf ve mahkemeye karşı açılmış mıdır?

      **İlgili hükümler:** HMK m. 34, HMK m. 35, HMK m. 36, HMK m. 42, HMK m. 46, HMK m. 47, HMK m. 74.

      **Değerlendirme:** H1, Canan ile evlenmekle davalı Burak'ın kız kardeşinin eşi olmuştur. Davalı ile H1 arasında kayın hısımlığı doğar ve bu hısımlık üçüncü dereceye dâhildir. HMK m. 34 uyarınca hâkim bu davaya bakamaz ve talep olmasa bile çekinmek zorundadır. Sebep dava açıldıktan sonra doğduğu için, H1'in sebebin doğduğu tarihten itibaren yaptığı işlemler HMK m. 35 uyarınca üst mahkemece iptal olunabilir; hüküm ve kararlar ise herhâlde iptal olunur. Tedbirin kaldırılması kararı bu kapsamda değerlendirilir.

      H2 bakımından arabuluculuk yapmış olmak yasaklılık değil, HMK m. 36/1-c uyarınca ret sebebidir. Ret talebinin geçerli olması için V'nin vekâletnamesinde hâkimi reddetme yetkisinin açıkça verilmiş olması gerekir; genel dava vekâletnamesi yeterli değildir (HMK m. 74). Bu eksiklik tamamlanmadıkça talep geçerli yapılamaz; asilin kendisi ret talebinde bulunabilir. Ret sebepleri hakkında yemin teklif olunamaz (HMK m. 42/3). Sebep, inandırıcı delil veya emareyle, örneğin arabuluculuk tutanağıyla, gösterilmelidir (HMK m. 38/2, HMK m. 41/1-b). Talebin ilk duruşmada ileri sürülmesi şarttır (HMK m. 38/1).

      Ahmet'in H1'e karşı dava açması doğru değildir. Hâkimin yargılama faaliyetinden doğan tazminat Devlet aleyhine istenir (HMK m. 46/1). Ayrıca dava, kanunda sayılan sebeplerden birine dayanmalıdır; bu davada ilk derece hâkiminin fiili bakımından görevli mahkeme Yargıtay ilgili hukuk dairesidir (HMK m. 47/1). Asliye hukuk mahkemesi görevli değildir. Mahkeme davayı hâkime resen ihbar eder; dava esastan reddedilirse disiplin para cezası söz konusu olur (HMK m. 48, HMK m. 49).

      **Sonuç:** H1 yasaklıdır, işlemleri iptale tabidir. H2'ye ret talebi, açık yetkili vekil veya asil tarafından süresinde, dilekçeyle ve delil/emareyle yapılırsa kabul edilebilir. Hâkime karşı doğrudan açılan dava husumet ve görev bakımından hatalıdır; Devlet aleyhine, Yargıtay ilgili hukuk dairesinde açılmalıdır.
  - olay: |
      Davacı Selma, Mersin Asliye Hukuk Mahkemesinde alacak davası açmıştır. İlk duruşmada tek hâkim H, kanunen böyle bir açıklama yapması gerekmediği hâlde, davalı Tolga'nın savunmasının dayanaksız olduğunu söylemiştir. Tolga bu açıklamayı ilk duruşmada işitmiş, ama ret talebini üçüncü duruşmada dilekçe ile yapmıştır. Dilekçede ret sebebi olarak yalnızca "hâkimin bana karşı taraflı davrandığı" yazılmış, delil veya emare gösterilmemiştir.

      Hâkim H, ret dilekçesini incelemiş ve talebi kendisi geri çevirmiştir. Tolga, bu karara karşı hemen istinaf yoluna başvurmak istemektedir.

      1. Ret talebinin süresini ve şartlarını değerlendiriniz.
      2. Talebin kimce sonuçlandırılabileceğini belirtiniz.
      3. Tolga'nın kanun yolunu değerlendiriniz.
    olcut:
      - {tespit: "Hâkimin kanunen gerekmediği hâlde görüşünü açıklaması ret sebebidir", puan: 15, madde: "HMK m. 36"}
      - {tespit: "Ret sebebini bilen taraf en geç ilk duruşmada talebini ileri sürmelidir; sonradan yapılan talep süresinde değildir", puan: 25, madde: "HMK m. 38"}
      - {tespit: "Ret dilekçesinde sebep ile inandırıcı delil veya emare gösterilmelidir", puan: 15, madde: "HMK m. 38"}
      - {tespit: "Süresinde yapılmayan ve delil/emare göstermeyen talep geri çevrilir; tek hâkimli mahkemede bunu reddedilen hâkimin kendisi yapar", puan: 25, madde: "HMK m. 41"}
      - {tespit: "Geri çevirme kararına karşı istinaf yoluna ancak hükümle birlikte başvurulabilir", puan: 20, madde: "HMK m. 41"}
    cozum: |
      **Nitelendirme:** Olay, bir hâkimin reddi talebinin süresi, içeriği ve geri çevrilmesi ile kanun yolunu konu alır.

      **Hukuki sorunlar:** (1) Ret talebi süresinde ve usulüne uygun mu? (2) Talebi kim sonuçlandırır? (3) Tolga hemen istinaf edebilir mi?

      **İlgili hükümler:** HMK m. 36, HMK m. 38, HMK m. 41.

      **Değerlendirme:** Hâkimin kanunen gerekmediği hâlde görüşünü açıklaması, HMK m. 36/1-b'de ret sebebi sayılır. Ancak Tolga bu sebebi ilk duruşmada işitmiş olmasına rağmen ret talebini üçüncü duruşmada yapmıştır. HMK m. 38/1'e göre ret sebebini bilen tarafın talebini en geç ilk duruşmada ileri sürmesi gerekir; bu sürede yapılmayan talep dinlenmez. Ayrıca dilekçede yalnızca "taraflı davranış" gibi genel bir ifade yer almış, delil veya emare gösterilmemiştir. Oysa dilekçede sebepler ile delil veya emareler açıkça gösterilmelidir (HMK m. 38/2).

      HMK m. 41'e göre süresinde yapılmayan veya sebep ve inandırıcı delil/emare gösterilmeyen ret talebi kabul edilmeyerek geri çevrilir. Tek hâkimli mahkemede bu kararı reddedilen hâkimin kendisi verir (HMK m. 41/2). Dolayısıyla H'nin talebi kendisinin geri çevirmesi hukuka uygundur. Bu, HMK m. 40/1'deki genel kuralın (reddedilen hâkim katılmaz) kanunun öngördüğü istisnasıdır.

      Geri çevirme kararlarına karşı istinaf yoluna ancak hükümle birlikte başvurulabilir (HMK m. 41/3). Tolga hemen istinaf edemez; esas hükümle birlikte başvurabilir.

      **Sonuç:** Talep süresinde ve usulüne uygun yapılmamıştır; reddedilen hâkim kendisi geri çevirebilir. Kanun yolu ancak hükümle birlikte kullanılabilir.
kartlar:
  - on: "Yasaklılık ile ret arasındaki temel fark nedir?"
    arka: "Yasaklılıkta hâkim talep olmasa da çekinmek zorundadır (HMK m. 34); retta taraf talebi gerekir (HMK m. 36, HMK m. 38)."
  - on: "Yasaklılıkta hısımlık sınırı?"
    arka: "Üçüncü derece dâhil kan ve kayın hısımları, evlilik bağı kalksa da (HMK m. 34). Kuzen (4. derece) ret sebebidir (HMK m. 36/1-ç)."
  - on: "Vekil olmak yasaklılık mı ret mi?"
    arka: "Taraflardan birinin vekili, vasisi, kayyımı veya yasal danışmanı olmak yasaklılıktır (HMK m. 34/1-f). Tanık, bilirkişi, hakem, arabulucu olmak ret sebebidir (HMK m. 36/1-c)."
  - on: "Yasaklılığa rağmen verilen hüküm ve kararlar ne olur?"
    arka: "Herhâlde iptal olunur; işlemler ise üst mahkemece iptal olunabilir (HMK m. 35)."
  - on: "Ret talebi ne zaman yapılır?"
    arka: "Sebebi bilen taraf en geç ilk duruşmada; sonradan öğrenen, öğrendikten sonraki ilk duruşmada ve yeni işlemden önce (HMK m. 38/1)."
  - on: "Ret talebi geri alınabilir mi?"
    arka: "Hayır, geri alınamaz (HMK m. 38/4). Dilekçe reddi istenen hâkimin mahkemesine verilir (HMK m. 38/3)."
  - on: "Ret talebi hangi hâllerde geri çevrilir?"
    arka: "Süresinde yapılmamışsa, sebep ve inandırıcı delil/emare gösterilmemişse, davayı uzatma amacı açıksa (HMK m. 41/1). Tek hâkimli mahkemede reddedilen hâkim bizzat geri çevirir."
  - on: "Ret sebepleri hakkında hangi ispat aracı yasaktır?"
    arka: "Yemin teklif olunamaz; merci ret sebebini muhtemel görürse de kabul edebilir (HMK m. 42/2-3)."
  - on: "Ret kararına karşı kanun yolu süresi?"
    arka: "Tebliğden itibaren iki hafta; esas hüküm bakımından kanun yolu açıksa (HMK m. 43/2, HMK m. 44/2). 7499 sayılı Kanunla bir haftadan iki haftaya çıktı."
  - on: "Hâkimin hukuki sorumluluğunda davalı kimdir?"
    arka: "Devlet. Hâkim aleyhine doğrudan dava açılamaz; sebepler sayılıdır (HMK m. 46/1)."
  - on: "Devletin rücu süresi ve görevli mahkeme?"
    arka: "Ödeme tarihinden itibaren bir yıl (HMK m. 46/3); dava Yargıtay ilgili hukuk dairesinde görülür (HMK m. 47/1)."
  - on: "Vekil hâkimi reddedebilir mi?"
    arka: "Açık yetki yoksa hayır; hâkimlerin fiilleri sebebiyle Devlet aleyhine dava da açamaz (HMK m. 74)."
