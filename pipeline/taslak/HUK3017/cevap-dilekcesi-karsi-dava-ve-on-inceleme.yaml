  - ⚠️ HMK m. 129 (ğ) imzadır; (g) talep sonucu HMK m. 130 kapsamında değildir. Dava dilekçesindeki HMK m. 119/2 bent harfleriyle karıştırma.
  - 📌 İlk itirazlar cevap dilekçesinde ileri sürülür; cevap verildikten sonra ileri sürülemez (HMK m. 117/1, HMK m. 131).
