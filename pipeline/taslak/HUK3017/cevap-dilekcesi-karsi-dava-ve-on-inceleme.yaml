  - ⚠️ Şartsız karşı dava **ayrılır**, reddedilmez (HMK m. 132/2); süresinden sonra açılan karşı dava için de **davalar ayrılır** (HMK m. 133/2).
  - 📌 Karşı davaya karşı dava açılamaz (HMK m. 132/3); asıl davanın sona ermesi karşı davayı engellemez (HMK m. 134).
  - 📌 Cevaba cevap ve ikinci cevap: her biri tebliğden itibaren **iki hafta** (HMK m. 136/1); basit yargılamada verilemez (HMK m. 317/3).
  - 📌 Ön inceleme tamamlanmadan **tahkikata geçilemez** (HMK m. 137/2); davetiyedeki iki haftalık kesin süre sonucu: delile dayanmaktan vazgeçmiş sayılma (HMK m. 139, HMK m. 140/5).
  - 📌 Genişletme yasağı **dilekçelerin karşılıklı verilmesinden sonra** işler; saklı yollar ıslah ve **açık** muvafakat (HMK m. 141); kısmi davada artırım için HMK m. 109/4.
doktrin: |
  ### Cevap vermeyen davalı ne kadar "sabitlenir"?

  Kanun, cevap vermemenin tek sonucu olarak vakıaların inkâr edilmiş sayılmasını yazar (HMK m. 128). Yerleşik uygulamada bu davalı, ilk itirazlarını ileri süremez (HMK m. 117, HMK m. 131) ve sonradan yeni bir savunma vakıası ile bunun delillerini getiremez; getirmek istese ancak ıslah veya karşı tarafın açık muvafakati yoluyla mümkündür. Bu bilgi sınavda kanunun açık hükmü olarak değil, uygulamanın genel eğilimi olarak verilmelidir; kanunun kendi sonucu yalnız inkâr etmiş sayılmadır.

  ### Def'i ve itiraz ayrımı

  Tartışmanın bir ayağı, davalının cevap vermemesine rağmen hâkimin hangi savunmaları kendiliğinden dikkate alacağıdır. Bir yaklaşıma göre def'iler (zamanaşımı gibi) taraf tarafından zamanında ileri sürülmediyse genişletme yasağına takılır. İtirazlar ise (ödeme, hükümsüzlük, muvazaa gibi hakkın doğumunu engelleyen veya sona erdiren hâller) dosya kapsamından anlaşılıyorsa hâkimce kendiliğinden gözetilebilir. Dosyadan anlaşılamayan bir itiraz vakıası ise sonradan ileri sürülürse genişletme yasağına tabidir. Bu ayrım sınırı her olayda tartışmalıdır; olay çözümünde mutlaka dosyadan anlaşılma şartını ayrıca ara.

  ### Ek cevap süresinde ilk itiraz ve karşı dava

  Ek süre içinde verilen cevap dilekçesiyle ilk itirazların ileri sürülebileceği ve karşı dava açılabileceği yaygın biçimde kabul edilir. Ek sürenin de dolmasından sonra açılan karşı dava ise HMK m. 133/2 uyarınca ayrılır; ek sürenin "esasa cevap süresi"ne dahil olup olmadığı konusunda metin açık değildir, bu yüzden bu noktayı olay çözümünün ana dayanağı yapma.
sozluk:
  - terim: Cevap dilekçesi
    tanim: "Davalının dava dilekçesine karşı savunmasını içeren ve tebliğden itibaren iki hafta içinde verdiği dilekçe (HMK m. 126-127)."
  - terim: Ek cevap süresi
    tanim: "Cevap süresi içinde başvuran davalıya, süre bitiminden itibaren işlemek üzere bir defaya mahsus verilen, en çok bir aylık süre (HMK m. 127/1)."
  - terim: Karşı dava
    tanim: "Davalının asıl davayla takas/mahsup ilişkisi veya bağlantısı bulunan talebini aynı davada ileri sürmesi (HMK m. 132)."
  - terim: Cevaba cevap dilekçesi
    tanim: "Davacının davalının cevabına tebliğden itibaren iki hafta içinde verdiği dilekçe (HMK m. 136/1)."
  - terim: İkinci cevap dilekçesi
    tanim: "Davalının davacının cevaba cevabına karşı tebliğden itibaren iki hafta içinde verdiği dilekçe (HMK m. 136/1)."
  - terim: Ön inceleme
    tanim: "Dilekçelerden sonra tahkikattan önce yapılan; dava şartları, ilk itirazlar, uyuşmazlık konuları ve sulhe teşvikle ilgili aşama (HMK m. 137)."
  - terim: İnkâr etmiş sayılma
    tanim: "Süresinde cevap vermeyen davalının davacının vakıalarını kabul değil, inkâr etmiş sayılması (HMK m. 128)."
  - terim: İlk itiraz
    tanim: "Kesin yetki kuralı bulunmayan hâllerde yetki itirazı ve tahkim itirazı (HMK m. 116); cevap dilekçesinde ileri sürülür."
  - terim: İddia ve savunmanın genişletilmesi yasağı
    tanim: "Dilekçelerin karşılıklı verilmesinden sonra iddia veya savunmanın genişletilememesi veya değiştirilememesi kuralı (HMK m. 141)."
  - terim: Açık muvafakat
    tanim: "Karşı tarafın genişletmeye açıkça verdiği rıza; sessizlik muvafakat sayılmaz (HMK m. 141/2)."
kararlar:
  - id: "646348900"
    ozet: |
      İzmir 2. Aile Mahkemesinde açılan boşanma davasında davalı, dava dilekçesine süresinde cevap vermemiş; süresinden sonra vekili aracılığıyla verdiği dilekçeyle davanın reddini, olmazsa nafaka ile maddi ve manevi tazminat istemiş ve tanık bildirmiştir. Yargıtay 2. Hukuk Dairesi bozma kararında tanıkların en azından dinlenmesi gerektiğini söylemiş, yerel mahkeme direnmiştir. Hukuk Genel Kurulu, süresinde cevap vermeyen davalının HMK m. 128 uyarınca davacının vakıalarını inkâr etmiş sayıldığını, delil gösterme zamanının dilekçeler aşamasına bağlı olduğunu, kanunda yalnızca iddia ve savunmanın genişletilmesi (HMK m. 141) ile sonradan delil gösterilmesi (HMK m. 145) istisnalarının bulunduğunu belirtmiş ve süresinden sonra bildirilen tanıkların karşı ispat kapsamında da dinlenemeyeceğine, bu bakımdan direnmenin yerinde olduğuna karar vermiştir. Esasa ilişkin temyiz itirazları incelenmek üzere dosya Özel Daireye gönderilmiştir.
  - id: "1225450400"
    ozet: |
      Davacı, satın aldığı taşınmazı kullanan davalının fuzuli şagil olduğunu ileri sürerek elatmanın önlenmesi ve ecrimisil istemiştir. Davalı yargılama sırasında kira ilişkisinden söz etmemiş, kira sözleşmesini ancak istinaf dilekçesine eklemiştir. Bölge Adliye Mahkemesi kira ilişkisine dayanarak ecrimisili reddetmiş, Yargıtay 7. Hukuk Dairesi bozmuş, Bölge Adliye Mahkemesi direnmiştir. Hukuk Genel Kurulu, HMK m. 141 uyarınca dilekçelerin karşılıklı verilmesinden sonra savunmanın ancak ıslah veya karşı tarafın açık muvafakatiyle genişletilip değiştirilebileceğini, davacının açık muvafakatinin ve davalı tarafından yapılmış bir ıslahın bulunmadığını saptamış; sonradan ileri sürülen kira sözleşmesi savunmasının genişletme yasağı kapsamında olduğunu belirterek direnme kararını bozmuştur.
sorular:
  - soru: |
      Yazılı yargılama usulünde cevap dilekçesi verme süresi ne kadardır ve ne zaman başlar?
    siklar:
      - "Dava dilekçesinin tebliğinden itibaren bir hafta"
      - "Dava dilekçesinin kaydından itibaren iki hafta"
      - "Dava dilekçesinin davalıya tebliğinden itibaren iki hafta"
      - "Ön inceleme duruşmasından itibaren iki hafta"
    dogru: 2
    aciklama: |
      HMK m. 127/1'e göre cevap dilekçesini verme süresi, dava dilekçesinin davalıya tebliğinden itibaren iki haftadır. Kayıt tarihi davanın açılma anını belirler; cevap süresi tebliğle başlar.
  - soru: |
      Davalı Mehmet, cevap süresinin son gününden bir gün sonra mahkemeye başvurup ek süre istemiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Hâkim bir aya kadar ek süre verebilir"
      - "Hâkim iki haftalık ek süre verebilir"
      - "Ek süre verilemez; ek süre ancak cevap süresi içinde başvuran davalıya verilebilir"
      - "Ek süre yalnızca basit yargılamada verilir"
    dogru: 2
    aciklama: |
      HMK m. 127/1, ek süreyi "yine bu süre zarfında mahkemeye başvuran davalıya" tanır. Süre dolduktan sonra yapılan başvuru üzerine ek süre verilemez.
  - soru: |
      Davalı Zeynep, dava dilekçesinin tebliğine rağmen süresinde cevap dilekçesi vermemiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Zeynep davayı kabul etmiş sayılır"
      - "Zeynep davacının dava dilekçesinde ileri sürdüğü vakıaların tamamını inkâr etmiş sayılır"
      - "Dava otomatik olarak davacı lehine sonuçlanır"
      - "Zeynep'e ikinci bir cevap süresi verilir"
    dogru: 1
    aciklama: |
      HMK m. 128: süresi içinde cevap dilekçesi vermeyen davalı, davacının dava dilekçesinde ileri sürdüğü vakıaların tamamını inkâr etmiş sayılır. Kabul etmiş sayılmaz; davacı iddiasını ispatla yükümlüdür.
  - soru: |
      Davalı Ali'nin cevap dilekçesi imzasız olarak verilmiştir. Hâkim ne yapar?
    siklar:
      - "Dilekçeyi derhâl geçersiz sayar ve cevap verilmemiş kabul eder"
      - "Bir haftalık süre verir; tamamlanmazsa cevap dilekçesi verilmemiş sayılır"
      - "İki haftalık kesin süre verir; tamamlanmazsa dava davacı lehine sonuçlanır"
      - "İmza eksikliğini yok sayar"
    dogru: 1
    aciklama: |
      Cevap dilekçesindeki imza HMK m. 129/1'in son bendidir ve HMK m. 130 kapsamındadır. Hâkim bir haftalık süre verir; eksiklik giderilmezse cevap dilekçesi verilmemiş sayılır.
  - soru: |
      Davalı Selin'in cevap dilekçesinde açık talep sonucu yazılmamış, ancak dilekçe imzalanmış ve diğer unsurlar tamdır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Talep sonucu eksikliği HMK m. 130 kapsamındadır; bir hafta verilir, aksi hâlde cevap verilmemiş sayılır"
      - "Talep sonucu eksikliği HMK m. 130 kapsamında sayılmamıştır; bu nedenle HMK m. 130'daki bir haftalık yaptırım doğrudan uygulanmaz"
      - "Talep sonucu eksikliği dava dilekçesindeki gibi davanın açılmamış sayılmasına yol açar"
      - "Talep sonucu cevap dilekçesinde bulunması gereken bir unsur değildir"
    dogru: 1
    aciklama: |
      HMK m. 130 yalnız HMK m. 129/1'in mahkeme adı, taraf bilgileri, T.C. kimlik numarası, temsilci ve vekil bilgileri ile imza bentlerini sayar. Talep sonucu bu listede yoktur, ama HMK m. 129/1 gereği dilekçede bulunması gereken unsurlardandır. Dava dilekçesindeki bent harfleriyle karıştırılmamalıdır.
  - soru: |
      Karşı dava açılabilmesinin şartı aşağıdakilerden hangisidir?
    siklar:
      - "Asıl davanın sonuçlanmış olması"
      - "Karşı davadaki talep ile asıl davadaki talep arasında takas, mahsup ilişkisi veya bağlantı bulunması"
      - "Davacının karşı dava açılmasına rıza göstermesi"
      - "Karşı davanın farklı bir mahkemenin görevine girmesi"
    dogru: 1
    aciklama: |
      HMK m. 132/1: asıl davanın açılmış ve hâlen görülmekte olması ile talepler arasında takas veya mahsup ilişkisi ya da bağlantı bulunması şarttır. Davacının rızası aranmaz.
  - soru: |
      Davalı Kemal, esasa cevap süresi geçtikten sonra karşı dava açmıştır. Mahkemenin yapacağı işlem nedir?
    siklar:
      - "Karşı davayı usulden reddeder"
      - "Karşı davanın incelenmesine devam eder, süre bakımından hiçbir sonuç doğmaz"
      - "Davaların ayrılmasına karar verir"
      - "Asıl davayı düşürür"
    dogru: 2
    aciklama: |
      HMK m. 133/2: süresinden sonra karşı dava açılması hâlinde mahkeme davaların ayrılmasına karar verir. Karşı dava reddedilmez.
  - soru: |
      Davacı Ayşe, davalının açtığı karşı davaya karşı kendisi de bir dava açmak istemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Mümkündür, çünkü her davaya karşı karşı dava açılabilir"
      - "Mümkün değildir; karşı davaya karşı dava açılamaz"
      - "Yalnız davalının rızasıyla mümkündür"
      - "Yalnız ön inceleme duruşmasında mümkündür"
    dogru: 1
    aciklama: |
      HMK m. 132/3: karşı davaya karşı dava açılamaz.
  - soru: |
      Cevap dilekçesi davacı Leyla'ya 3 Mart'ta tebliğ edilmiştir. Leyla'nın cevaba cevap dilekçesi verme süresi ne kadardır?
    siklar:
      - "Bir hafta"
      - "Tebliğden itibaren iki hafta"
      - "Bir ay"
      - "Tahkikatın sonuna kadar"
    dogru: 1
    aciklama: |
      HMK m. 136/1: davacı cevap dilekçesinin kendisine tebliğinden itibaren iki hafta içinde cevaba cevap dilekçesi verebilir; davalı da bunun tebliğinden itibaren iki hafta içinde ikinci cevap dilekçesi verebilir.
  - soru: |
      Dilekçeler karşılıklı verilmiş, ön inceleme duruşması yapılmamıştır. Mahkeme hemen tahkikat için duruşma günü vermiştir. Bu işlem hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Hukuka uygundur, çünkü tahkikat dilekçelerden hemen sonra başlar"
      - "Hukuka aykırıdır; ön inceleme tamamlanmadan tahkikata geçilemez ve tahkikat için duruşma günü verilemez"
      - "Yalnızca basit yargılamada hukuka aykırıdır"
      - "Davacının rızası varsa uygundur"
    dogru: 1
    aciklama: |
      HMK m. 137/2: ön inceleme tamamlanmadan ve gerekli kararlar alınmadan tahkikata geçilemez ve tahkikat için duruşma günü verilemez.
  - soru: |
      Davalı Veli, ön inceleme duruşmasına davet edilirken davetiyede belgelerini iki haftalık kesin sürede sunması ihtar edilmiştir. Veli, dilekçesinde gösterdiği bir belgeyi bu sürede sunmamıştır. Sonuç nedir?
    siklar:
      - "Veli'nin davası reddedilir"
      - "Veli o belgeye dayanmaktan vazgeçmiş sayılır"
      - "Veli cevap vermemiş sayılır"
      - "Belge resen mahkemece toplanır"
    dogru: 1
    aciklama: |
      HMK m. 139 ihtar edilecek iki haftalık kesin süreyi, HMK m. 140/5 ise sonuç olarak bu delillere dayanmaktan vazgeçmiş sayılmasına karar verileceğini düzenler.
  - soru: |
      Davalı Hasan, ön inceleme sona erdikten sonra, cevap dilekçesinde hiç yer vermediği yeni bir savunma vakıasını ileri sürmüştür. Davacı açıkça muvafakat etmemiş ve ıslah yapılmamıştır. Hâkim ne yapar?
    siklar:
      - "Savunmayı serbestçe kabul eder, çünkü cevaba cevap aşaması devam etmektedir"
      - "Savunmanın genişletilmesi yasağı gereği bu savunmayı dikkate almaz"
      - "Davacının sessizliğini zımni muvafakat sayar"
      - "Davayı usulden reddeder"
    dogru: 1
    aciklama: |
      HMK m. 141/1: dilekçelerin karşılıklı verilmesinden sonra iddia veya savunma genişletilemez ya da değiştirilemez. Saklı yollar ıslah ve karşı tarafın açık muvafakatidir (HMK m. 141/2); sessizlik açık muvafakat sayılmaz, olayda ıslah da yoktur.
olaylar:
  - olay: |
      Davacı Ali Kaya, X Ltd. Şti.'ne karşı 200.000 TL'lik satış bedeli alacağı için dava açmıştır. Dava dilekçesi davalı şirkete 4 Ocak'ta tebliğ edilmiştir. Şirket vekili, cevap süresi içinde mahkemeye başvurup hazırlık için süre istemiş ve hâkim şirkete bir defaya mahsus olmak üzere iki hafta ek süre vermiştir.

      Şirket, ek süre içinde sunduğu cevap dilekçesinde zamanaşımı def'ini ileri sürmüş, dilekçeyi vekil imzalamamıştır. Hâkim bunu fark edip eksikliği bildirmiş, şirket vekili süre içinde imzalamıştır. Aynı dilekçeyle şirket, aynı satış sözleşmesinden doğan 60.000 TL'lik alacağı için karşı dava açmıştır. Ali, bu karşı davaya karşı bir dava açmak istemektedir.

      Cevap dilekçesi Ali'ye tebliğ edildikten sonra Ali, cevaba cevap dilekçesinde dava dilekçesinde bulunmayan yeni bir vakıa eklemiştir.

      1. Ek süre ve cevap dilekçesinin imzasızlığı bakımından durum nedir?
      2. Karşı dava geçerli midir, Ali karşı davaya karşı dava açabilir mi?
      3. Ali'nin cevaba cevap dilekçesiyle yeni vakıa eklemesi caiz midir?
    olcut:
      - {tespit: "Ek sürenin cevap süresi içinde başvuruyla, bir defaya mahsus ve en çok bir ay verilmesi", puan: 20, madde: "HMK m. 127"}
      - {tespit: "İmza eksikliğinin HMK m. 130 kapsamında bir haftalık süreyle giderilebilmesi", puan: 20, madde: "HMK m. 130"}
      - {tespit: "Karşı dava şartlarının (takas/mahsup veya bağlantı) bulunması", puan: 20, madde: "HMK m. 132"}
      - {tespit: "Karşı davaya karşı dava açılamaması", puan: 15, madde: "HMK m. 132"}
      - {tespit: "Cevaba cevap dilekçesinde iddianın serbestçe genişletilebilmesi ve süre", puan: 25, madde: "HMK m. 136"}
    cozum: |
      **Nitelendirme:** Olay, yazılı yargılamada cevap süresi ve ek süre, cevap dilekçesi eksikliği, karşı dava ve cevaba cevap dilekçesinin işlevini birlikte sorar.

      **Hukuki sorunlar:** (1) Ek süre ve eksik cevap dilekçesi; (2) karşı davanın şartları; (3) karşı davaya karşı dava; (4) cevaba cevapta iddianın genişletilmesi.

      **İlgili hükümler ve değerlendirme:**

      1. HMK m. 127/1'e göre cevap süresi tebliğden itibaren iki haftadır; cevap süresi içinde başvuran davalıya, süre bitiminden itibaren işlemeye başlamak, bir defaya mahsus olmak ve bir ayı geçmemek üzere ek süre verilebilir. Şirket süre içinde başvurduğu ve ek süre iki hafta verildiği için usul uygundur. Cevap dilekçesindeki imza HMK m. 129/1'in imza bendidir ve HMK m. 130 kapsamındadır. Hâkimin bir haftalık süre vermesi doğrudur; vekil süre içinde imzaladığı için cevap dilekçesi verilmemiş sayılmaz.

      2. Karşı dava, cevap dilekçesiyle açılabilir (HMK m. 133/1). Ek süre içinde verilen cevap dilekçesi süresinde verilmiş bir cevap dilekçesidir; karşı dava bu dilekçeyle açıldığından süre sorunu doğmaz. Şartlar: asıl dava derdesttir ve karşı dava aynı satış sözleşmesinden doğduğundan takas/mahsup ilişkisi veya bağlantı vardır (HMK m. 132/1). Dolayısıyla karşı dava geçerlidir. Şartlar bulunmasaydı karşı dava reddedilmez, asıl davadan ayrılırdı (HMK m. 132/2).

      3. Karşı davaya karşı dava açılamaz (HMK m. 132/3). Ali, karşı davaya savunma ile karşılık verebilir; yeni bir dava açamaz.

      4. Ali cevaba cevap dilekçesini cevap dilekçesinin tebliğinden itibaren iki hafta içinde verebilir (HMK m. 136/1). Taraflar cevaba cevap ve ikinci cevap dilekçeleriyle iddia ve savunmalarını serbestçe genişletebilir ya da değiştirebilir (HMK m. 141/1). Dolayısıyla yeni vakıa eklemesi, dilekçeyi süresinde vermişse caizdir. Sonradan, dilekçelerin karşılıklı verilmesi tamamlandıktan sonra böyle yeni bir vakıa eklemesi artık yasak olurdu.

      **Sonuç:** Ek süre ve imza işlemleri usulüne uygun; karşı dava geçerli, karşı davaya karşı dava açılamaz; Ali cevaba cevap dilekçesinde süresi içinde yeni vakıa ekleyebilir.
  - olay: |
      Davacı Meryem, komşusu Selim'e karşı elatmanın önlenmesi ve ecrimisil davası açmıştır. Dava dilekçesi Selim'e usulüne uygun tebliğ edilmiş, Selim süresinde cevap dilekçesi vermemiştir. Mahkeme dilekçeler aşamasının ardından ön inceleme duruşması günü belirlemiş ve davetiyede iki haftalık kesin sürede dilekçelerde gösterilen belgelerin sunulması ihtar edilmiştir. Meryem dilekçesinde gösterdiği tapu kaydını bu süre içinde dosyaya sunmamıştır.

      Dilekçeler aşaması tamamlandıktan sonra, ön inceleme duruşması yapılmadan önce Selim vekili bir dilekçe vermiş; taşınmazı Meryem'in babasının izniyle kullandığını ileri sürmüş ve bunu ispatlamak için iki tanık bildirmiştir. Meryem bu savunmaya açıkça muvafakat etmediğini bildirmiştir. Mahkeme ön incelemenin tamamlanması öncesinde tahkikat için duruşma günü vermiştir.

      1. Selim'in cevap vermemesinin sonucu nedir?
      2. Meryem'in tapu kaydını sunmamasının sonucu nedir?
      3. Selim'in sonradan ileri sürdüğü savunma ve tanık deliline itibar edilebilir mi?
      4. Mahkemenin tahkikat için gün vermesi doğru mudur?
    olcut:
      - {tespit: "Süresinde cevap vermeyen davalının vakıaları inkâr etmiş sayılması", puan: 20, madde: "HMK m. 128"}
      - {tespit: "Davetiyedeki iki haftalık kesin sürede belge sunmama: delile dayanmaktan vazgeçmiş sayılma", puan: 20, madde: "HMK m. 140"}
      - {tespit: "Sonradan ileri sürülen yeni savunmanın genişletme yasağına takılması", puan: 25, madde: "HMK m. 141"}
      - {tespit: "Muvafakatin açık olması ve ıslahın bulunmaması", puan: 15, madde: "HMK m. 141"}
      - {tespit: "Ön inceleme tamamlanmadan tahkikat için gün verilememesi", puan: 20, madde: "HMK m. 137"}
    cozum: |
      **Nitelendirme:** Olay, cevap vermeyen davalı, ön inceleme aşamasındaki belge ihtarı, savunmanın genişletilmesi yasağı ve ön incelemenin tamamlanması ilkesini birlikte sorar.

      **Hukuki sorunlar:** (1) Cevap verilmemesi; (2) belge sunmama; (3) sonradan savunma ve delil; (4) tahkikata erken geçiş.

      **İlgili hükümler ve değerlendirme:**

      1. Süresi içinde cevap dilekçesi vermeyen Selim, Meryem'in dava dilekçesinde ileri sürdüğü vakıaların tamamını inkâr etmiş sayılır (HMK m. 128). Kabul etmiş sayılmaz; Meryem iddiasını ispat etmek zorundadır. İlk itirazlar da cevap dilekçesinde ileri sürülmek zorunda olduğundan Selim bunları sonradan ileri süremez (HMK m. 117/1, HMK m. 131).

      2. Davetiyenin tebliğinden itibaren iki haftalık kesin sürede dilekçelerde gösterilip sunulmayan belge için, HMK m. 139 gereği yapılan ihtara rağmen belgeyi sunmayan tarafın bu delile dayanmaktan vazgeçmiş sayılmasına karar verilir (HMK m. 140/5). Meryem tapu kaydına dayanmaktan vazgeçmiş sayılır. Bu sonuç davayı kendiliğinden düşürmez; yalnız o delile dayanma imkânı kalmaz.

      3. Selim'in dilekçeler aşaması bittikten sonra ileri sürdüğü izin savunması yeni bir vakıadır; dilekçelerin karşılıklı verilmesinden sonra savunma genişletilemez ya da değiştirilemez (HMK m. 141/1). Saklı yollar ıslah ve karşı tarafın açık muvafakatidir (HMK m. 141/2). Meryem açıkça muvafakat etmediği ve ıslah da yapılmadığı için savunma dinlenmez. Cevap vermeyen davalının sonradan bildirdiği tanıklar bakımından, Hukuk Genel Kurulu karşı ispat bağlamında bile bu tanıkların dinlenemeyeceğini kabul etmiştir; bu nedenle tanık delillerine itibar edilmez.

      4. Ön inceleme tamamlanmadan ve gerekli kararlar alınmadan tahkikata geçilemez, tahkikat için duruşma günü verilemez (HMK m. 137/2). Ön inceleme duruşması tamamlanmadan tahkikat günü verilmesi bu nedenle hatalıdır. Tahkikat, ön inceleme tutanağı esas alınarak yürütülür (HMK m. 140/3).

      **Sonuç:** Selim vakıaları inkâr etmiş sayılır; Meryem tapu kaydına dayanmaktan vazgeçmiş sayılır; Selim'in sonradan ileri sürdüğü izin savunması ve tanıkları genişletme yasağı nedeniyle dinlenmez; erken tahkikat günü verilmesi HMK m. 137/2'ye aykırıdır.
kartlar:
  - on: "Cevap süresi ve başlangıcı?"
    arka: "Dava dilekçesinin davalıya tebliğinden itibaren iki hafta (HMK m. 127/1)."
  - on: "Ek cevap süresi şartları?"
    arka: "Cevap süresi içinde başvuru, bir defaya mahsus, bir ayı geçmez; süre bitiminden itibaren işler (HMK m. 127/1). Basit yargılamada en çok iki hafta (HMK m. 317/2)."
  - on: "Süresinde cevap vermeyen davalının durumu?"
    arka: "Davacının vakıalarının tamamını inkâr etmiş sayılır; kabul etmiş sayılmaz (HMK m. 128)."
  - on: "HMK m. 130 hangi bentleri kapsar?"
    arka: "HMK m. 129/1 (a), (b), (c), (ç), (ğ). Bir hafta süre; tamamlanmazsa cevap dilekçesi verilmemiş sayılır."
  - on: "İlk itirazlar nerede ileri sürülür?"
    arka: "Cevap dilekçesinde; cevap verildikten sonra ileri sürülemez (HMK m. 117/1, HMK m. 131)."
  - on: "Karşı dava şartları?"
    arka: "Asıl dava derdest + takas/mahsup ilişkisi veya bağlantı (HMK m. 132/1)."
  - on: "Şartsız veya süresiz karşı dava ne olur?"
    arka: "Reddedilmez, ayrılır: şartsızsa karşı dava asıl davadan ayrılır (HMK m. 132/2); süresizse davalar ayrılır (HMK m. 133/2)."
  - on: "Karşı davaya karşı dava açılabilir mi?"
    arka: "Hayır (HMK m. 132/3)."
  - on: "Cevaba cevap ve ikinci cevap süreleri?"
    arka: "Her biri karşı dilekçenin tebliğinden itibaren iki hafta (HMK m. 136/1)."
  - on: "Ön inceleme tamamlanmadan tahkikata geçilebilir mi?"
    arka: "Hayır; tahkikat için duruşma günü de verilemez (HMK m. 137/2)."
  - on: "HMK m. 139 davetiyesindeki iki haftalık kesin sürenin sonucu?"
    arka: "Dilekçelerde gösterilen belgeleri sunmayan veya açıklama yapmayan taraf o delile dayanmaktan vazgeçmiş sayılır (HMK m. 140/5)."
  - on: "Genişletme yasağı ne zaman başlar, istisnaları?"
    arka: "Dilekçelerin karşılıklı verilmesinden sonra (cevaba cevap/ikinci cevapla serbest). Saklı: ıslah ve karşı tarafın açık muvafakati (HMK m. 141); kısmi davada artırım için HMK m. 109/4."
