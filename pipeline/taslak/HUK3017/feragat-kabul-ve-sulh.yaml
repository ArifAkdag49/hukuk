    ozet: |
      Kefil, bankanın bir alacağı için menfi tespit davası açmış, banka ise birleşen davada itirazın iptalini istemişti. İlk derece mahkemesi kararından sonra, istinaf aşamasında taraflar karşılıklı olarak feragat beyanında bulundu; bölge adliye mahkemesi dosyayı bu beyanların alınması için ilk derece mahkemesine gönderdi ve mahkeme asıl ve birleşen davaları feragat nedeniyle reddetti. Banka vekili, feragat dilekçesinde alacağın "temlik işlemi ile" haricen tahsil edildiğini belirttiği hâlde alacağın üçüncü kişiye devredilmiş olduğunu, davanın devralan taraf yönünden sürmesi gerektiğini ileri sürdü. Yargıtay 11. Hukuk Dairesi mahkemenin temlik sözleşmesinin içeriğini, feragat beyanını ve dosyayı birlikte değerlendirmesi gerektiğini belirterek bozdu; ilk derece mahkemesi direndi. Hukuk Genel Kurulu, feragatin kesin hüküm gibi sonuç doğuran bir taraf usul işlemi olduğunu, ancak resmî memur önünde düzenlenen temlik sözleşmesi ile alacak devredildikten sonra bankanın tasarruf yetkisinin kalmadığını, kimsenin sahip olmadığı bir haktan feragat edemeyeceğini belirtti. Temlik sonrası yapılan işlemlerin sonuçlarının ayrıca değerlendirilmesi gerektiğini vurgulayıp direnme kararını oy birliğiyle bozdu. Karar, feragatin geçerli olması için feragat tarihinde dava konusu hak üzerinde tasarruf yetkisinin bulunması gerektiğini gösterir.
  - id: "1044928700"
    ozet: |
      Davacı, haricen satın aldığı ve teslim aldığı bağımsız bölümün davalılar arasında muvazaalı olarak devredildiğini ileri sürerek tapu iptali ve tescil, olmazsa tazminat istedi. Yargılama sırasında önceki malik davalılardan biri, dava konusu devrin kendi adına kayıtlı davalıya bedelsiz ve emaneten yapıldığını bildirerek tapu iptali ve tescil davasını kabul ettiğini belirtti. Tapuda malik görünen diğer davalı ise davaya karşı çıktı. Yargıtay 7. Hukuk Dairesi, diğer davalıların kabul beyanlarının kayıt maliki aleyhine sonuç doğurmayacağını belirterek bozdu; ilk derece mahkemesi direndi. Hukuk Genel Kurulu, kabul beyanlarının kayıt maliki bakımından sonuç doğurmadığını kabul etti, ancak dosyadaki delillerle (bedelin ödenmediği, değer farkı, davalıların bağlantıları gibi hususlar) kayıt malikinin iyiniyetli olmadığını ve devrin muvazaalı olduğunu davacının ispat ettiği sonucuna vararak direnme kararını oy çokluğuyla onadı. Karar, bir davalının kabul beyanının kendisi dışındaki davalıyı kendiliğinden bağlamadığını ve sonucun diğer delillerle ayrıca değerlendirilmesi gerektiğini gösterir.
sorular:
  - soru: |
      Davadan feragat bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Feragatin hüküm ifade etmesi davalının muvafakatine bağlıdır."
      - "Feragat, davacının talep sonucundan kısmen veya tamamen vazgeçmesidir ve karşı tarafın muvafakatine bağlı değildir."
      - "Feragat mahkemenin onayıyla hüküm doğurur."
      - "Feragat edilen dava yeniden açılabilir, çünkü feragat kesin hüküm doğurmaz."
    dogru: 1
    aciklama: |
      HMK m. 307 feragati davacının talep sonucundan vazgeçmesi olarak tanımlar; HMK m. 309/2'ye göre hüküm ifade etmesi karşı tarafın ve mahkemenin muvafakatine bağlı değildir. HMK m. 311 uyarınca feragat kesin hüküm gibi sonuç doğurur. Davalının rızası davayı geri alma için gereklidir (HMK m. 123).
  - soru: |
      Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Feragat ve kabul kayıtsız ve şartsız olmalıdır; sulh şarta bağlı olarak da yapılabilir."
      - "Feragat, kabul ve sulh şarta bağlı olarak yapılabilir."
      - "Feragat şarta bağlanabilir, kabul ve sulh bağlanamaz."
      - "Sulh şarta bağlanamaz, feragat ve kabul bağlanabilir."
    dogru: 0
    aciklama: |
      HMK m. 309/4 feragat ve kabulün kayıtsız ve şartsız olmasını arar; HMK m. 313/4 ise sulhün şarta bağlı olarak da yapılabileceğini söyler.
  - soru: |
      Davacı Ali, kira alacağı davasında ilk derece mahkemesinin davayı kabul eden hükmüne karşı davalının istinaf dilekçesi verdiği, dosyanın henüz bölge adliye mahkemesine gönderilmediği aşamada kayıtsız şartsız davadan feragat etmiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Feragat geçersizdir, çünkü hüküm verilmiştir."
      - "Dosya kanun yolu incelemesine gönderilmeden mahkemece feragat doğrultusunda ek karar verilir."
      - "Feragat ancak hüküm kesinleştikten sonra yapılabilir."
      - "Dosya bölge adliye mahkemesine gönderilir ve orada karar bozulur."
    dogru: 1
    aciklama: |
      HMK m. 310/1'e göre feragat hüküm kesinleşinceye kadar yapılabilir. HMK m. 310/2'ye göre hükmün verilmesinden sonra yapılan feragatte, kanun yoluna başvurulmuş olsa dahi dosya kanun yolu incelemesine gönderilmez ve ilk derece veya bölge adliye mahkemesince ek karar verilir.
  - soru: |
      Davalı Veli'nin temyiz incelemesinde olan dosyada davacı Ali, dosya Yargıtay'a gönderildikten sonra kayıtsız şartsız davadan feragat etmiştir. Yargıtay'ın yapacağı işlem aşağıdakilerden hangisidir?
    siklar:
      - "Temyiz incelemesini yapıp esas hakkında karar verir."
      - "Feragatin geçersiz olduğuna karar verir, çünkü dosya Yargıtay'dadır."
      - "Temyiz isteminin reddine karar verir."
      - "Temyiz incelemesi yapmaksızın dosyayı feragat hususunda ek karar verilmek üzere hükmü veren mahkemeye gönderir."
    dogru: 3
    aciklama: |
      HMK m. 310/3'e göre feragat dosyanın temyiz incelemesine gönderilmesinden sonra yapılmışsa Yargıtay temyiz incelemesi yapmaksızın dosyayı feragat hususunda ek karar verilmek üzere hükmü veren mahkemeye gönderir.
  - soru: |
      Davalı Zeynep, kendisine hiçbir ihtar gönderilmeden açılan 50.000 TL'lik alacak davasında, ilk duruşmada davayı kabul etmiştir. Yargılama giderleri bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Zeynep giderlere mahkûm edilmez, çünkü dava açılmasına sebebiyet vermemiş ve ilk duruşmada kabul etmiştir."
      - "Zeynep her hâlde giderlere mahkûm edilir, çünkü kabul eden taraf aleyhine hüküm verilmiş gibi sayılır."
      - "Zeynep yalnızca vekâlet ücretinden sorumlu olur."
      - "Giderler davacı üzerinde bırakılır, çünkü kabul davayı sona erdirmiştir."
    dogru: 0
    aciklama: |
      HMK m. 312/2'ye göre davalı, davanın açılmasına kendi hâl ve davranışıyla sebebiyet vermemiş ve yargılamanın ilk duruşmasında davacının talep sonucunu kabul etmişse yargılama giderlerini ödemeye mahkûm edilmez. İki şart da gerçekleşmiştir.
  - soru: |
      Davalı Murat, noter ihtarnamesiyle borcunu ödemesi istendiği hâlde ödememiş ve dava açılmıştır. Murat ilk duruşmada davayı kabul etmiştir. Yargılama giderleri bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Murat giderlerden sorumlu değildir, çünkü ilk duruşmada kabul etmiştir."
      - "Murat, davanın açılmasına sebebiyet verdiği için giderlere mahkûm edilir."
      - "Giderler yarı yarıya paylaştırılır."
      - "Mahkeme gider hakkında karar vermez."
    dogru: 1
    aciklama: |
      HMK m. 312/1'e göre kabul eden taraf aleyhine hüküm verilmiş gibi giderlere mahkûm edilir. HMK m. 312/2'deki istisna için davalının davanın açılmasına sebebiyet vermemiş olması da gerekir. İhtarnameye rağmen ödemeyen Murat sebebiyet vermiştir.
  - soru: |
      Taraflar mahkeme huzurunda sulh olmuş, sulhe göre karar verilmesini istememişlerdir. Mahkeme ne karar verir?
    siklar:
      - "Sulh sözleşmesine göre karar verir."
      - "Davayı esastan reddeder."
      - "Karar verilmesine yer olmadığına karar verir."
      - "Davanın açılmamış sayılmasına karar verir."
    dogru: 2
    aciklama: |
      HMK m. 315/1'e göre taraflar sulhe göre karar verilmesini isterlerse sulh sözleşmesine göre, istemezlerse karar verilmesine yer olmadığına karar verilir.
  - soru: |
      Aşağıdakilerden hangisi yalnız sulhün iptal sebebi olarak kanunda sayılmıştır?
    siklar:
      - "Aldatma"
      - "Korkutma"
      - "Aşırı yararlanma"
      - "Yanılma"
    dogru: 2
    aciklama: |
      HMK m. 311/1 feragat ve kabul için irade bozukluğu hâllerinde iptali öngörür. HMK m. 315/2 ise sulh için irade bozukluğuna ek olarak aşırı yararlanma hâllerinde iptali sayar. Aldatma, korkutma ve yanılma irade bozukluğu sebepleridir.
  - soru: |
      Davayı geri alma (HMK m. 123) ile davadan feragat arasındaki farkla ilgili aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Her ikisi de davalının rızasına bağlıdır."
      - "Geri almada davalının açık rızası gerekir ve dava açılmamış sayılır; feragatte rıza aranmaz ve kesin hüküm gibi sonuç doğar."
      - "Geri alma kesin hüküm gibi sonuç doğurur, feragat doğurmaz."
      - "Feragat davanın açılmamış sayılmasına yol açar."
    dogru: 1
    aciklama: |
      HMK m. 123'e göre davacı ancak davalının açık rızasıyla davasını geri alabilir ve davanın açılmamış sayılmasına karar verilir. Feragat ise karşı tarafın muvafakatine bağlı değildir (HMK m. 309/2) ve kesin hüküm gibi sonuç doğurur (HMK m. 311).
  - soru: |
      Av. Kaan'ın vekâletnamesinde yalnızca "davayı takip etme" yetkisi yazılıdır, özel yetki yoktur. Kaan, müvekkili Ayşe adına dava dilekçesiyle davadan feragat etmiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Feragat geçerlidir, çünkü vekil davayı takip yetkisiyle her işlemi yapabilir."
      - "Feragat geçerlidir ancak müvekkil iptal edebilir."
      - "Feragat için açıkça özel yetki gerekir; bu yetki olmadığından Kaan feragat edemez."
      - "Feragat yalnızca mahkemenin onayıyla geçerli olur."
    dogru: 2
    aciklama: |
      HMK m. 74/1 uyarınca açıkça yetki verilmemişse vekil davadan veya kanun yollarından feragat edemez, davasını kabul edemez ve sulh olamaz.
  - soru: |
      Davacı Mehmet, açtığı alacak davasından kayıtsız şartsız feragat etmiş ve mahkeme davayı feragat nedeniyle reddetmiştir; karar kesinleşmiştir. Mehmet aynı alacağı aynı sebeple yeniden dava ederse sonuç ne olur?
    siklar:
      - "Dava esastan incelenir, çünkü feragat usule ilişkindir."
      - "Dava, feragat kesin hüküm gibi sonuç doğurduğundan engellenir."
      - "Dava, davalının rızası varsa açılabilir."
      - "Dava açılabilir, çünkü kesin hüküm yalnızca kabul edilen davalarda doğar."
    dogru: 1
    aciklama: |
      HMK m. 311/1'e göre feragat kesin hüküm gibi hukuki sonuç doğurur. Aynı talebin aynı sebeple yeniden dava edilmesi bu nedenle engellenir. Davayı geri almadaki gibi davalının rızası burada konu değildir.
  - soru: |
      Aşağıdakilerden hangisi davayı kabulü ikrardan ayıran doğru farktır?
    siklar:
      - "Kabul maddi vakıaya, ikrar talep sonucuna ilişkindir."
      - "Kabul davalının talep sonucuna muvafakatidir; ikrar ise bir maddi vakıanın doğruluğunun kabulüdür ve davayı kendiliğinden sona erdirmez."
      - "İkrar yalnızca davacı tarafından yapılabilir."
      - "Kabul yalnızca sözlü yapılabilir."
    dogru: 1
    aciklama: |
      HMK m. 308/1 kabulü talep sonucuna muvafakat olarak tanımlar. HMK m. 188/1'e göre ikrar edilen vakıalar çekişmeli olmaktan çıkar ve ispatı gerekmez; ikrar davayı kendiliğinden bitirmez. Kabul dilekçeyle veya sözlü yapılabilir (HMK m. 309/1).
olaylar:
  - olay: |
      Davacı Ali, davalı Berk'e noterden ihtarname göndererek vadesi geçmiş 300.000 TL kira borcunu ödemesini istemiş; Berk ödemeyince Ali alacak davası açmıştır. İlk duruşmada tutanak imzalanmadan önce Berk, "davayı kabul ediyorum, ilk duruşmada kabul ettiğim için yargılama gideri ve vekâlet ücreti ödemem" demiştir.

      Ali ile Berk arasındaki ayrı bir ticari alacak davasında ilk derece mahkemesi davayı kabul etmiş, Berk kararı istinaf ve temyiz etmiştir. Dosya Yargıtay'da temyiz incelemesindeyken Ali'nin vekili Av. Cemal, Yargıtay'a bir dilekçe vererek "Berk 10 gün içinde 100.000 TL öderse davadan feragat ediyoruz" demiştir. Cemal'in vekâletnamesinde feragat ve sulh yetkisi bulunmamaktadır.

      1. İlk davada Berk yargılama giderlerinden kurtulur mu?
      2. İkinci davada Av. Cemal'in dilekçesi feragat olarak geçerli midir?
      3. Ali bizzat ve kayıtsız şartsız feragat etseydi Yargıtay ne yapardı?
    olcut:
      - {tespit: "Kabulün tanımı ve hükümleri; kabul eden tarafın kural olarak aleyhine hüküm verilmiş gibi giderlere mahkûm olması", puan: 15, madde: "HMK m. 312"}
      - {tespit: "HMK m. 312/2'deki iki şartın birlikte aranması; Berk'in ihtarnameye rağmen ödememesi nedeniyle davaya sebebiyet vermiş olması", puan: 25, madde: "HMK m. 312"}
      - {tespit: "Vekilin özel yetki olmadan feragat edememesi", puan: 20, madde: "HMK m. 74"}
      - {tespit: "Feragatin kayıtsız ve şartsız olması gerektiği; şartlı beyanın feragat olarak geçersiz olması", puan: 20, madde: "HMK m. 309"}
      - {tespit: "Temyiz incelemesine gönderildikten sonraki feragatte Yargıtay'ın incelemesiz olarak dosyayı hükmü veren mahkemeye göndermesi", puan: 20, madde: "HMK m. 310"}
    cozum: |
      **Nitelendirme:** Olay, davayı kabulün yargılama giderlerine etkisi (HMK m. 308, HMK m. 312), vekilin yetkisi (HMK m. 74), feragatin şekli (HMK m. 307, HMK m. 309) ve feragatin zamanı (HMK m. 310) sorunlarını içerir.

      **Hukuki sorunlar:** (1) Berk'in ilk duruşmadaki kabulü onu giderlerden kurtarır mı? (2) Av. Cemal'in şartlı beyanı geçerli bir feragat midir? (3) Dosya temyizdeyken yapılan feragatte Yargıtay ne yapar?

      **İlgili hükümler:** HMK m. 307, 308, 309/4, 310/3, 312/1-2 ve HMK m. 74/1.

      **Değerlendirme:** (1) Berk'in beyanı davacının talep sonucuna muvafakat olduğundan HMK m. 308 anlamında kabuldür. Kural olarak kabul eden taraf, aleyhine hüküm verilmiş gibi yargılama giderlerine mahkûm edilir (HMK m. 312/1). HMK m. 312/2'deki istisna için davalının davanın açılmasına kendi hâl ve davranışıyla sebebiyet vermemiş olması ve ilk duruşmada kabul etmesi birlikte aranır. Berk'e noterden ihtarname gönderilmiş ve o ödemeyi yapmamıştır; bu nedenle davanın açılmasına kendi davranışıyla sebebiyet vermiştir. İlk duruşmada kabul etmiş olması tek başına yeterli değildir.

      (2) HMK m. 74/1'e göre açıkça yetki verilmemişse vekil davadan feragat edemez ve sulh olamaz. Cemal'in vekâletnamesinde bu yetki yoktur. Ayrıca HMK m. 309/4 uyarınca feragat kayıtsız ve şartsız olmalıdır; "10 gün içinde 100.000 TL ödenirse feragat" beyanı şarta bağlıdır ve feragat olarak geçerli sonuç doğurmaz. Bu mantık sulh için farklıdır: sulh şarta bağlı yapılabilir (HMK m. 313/4), ancak sulh için de özel yetki ve mahkeme huzurunda iki tarafın sözleşmesi gerekir.

      (3) Feragat hüküm kesinleşinceye kadar her zaman yapılabilir (HMK m. 310/1). Dosya temyiz incelemesine gönderildikten sonra yapılan feragatte Yargıtay temyiz incelemesi yapmaksızın dosyayı feragat hususunda ek karar verilmek üzere hükmü veren mahkemeye gönderir (HMK m. 310/3).

      **Sonuç:** Berk giderlere mahkûm edilir. Av. Cemal'in dilekçesi hem yetki yokluğu hem şartlı olması nedeniyle geçerli bir feragat değildir. Ali bizzat ve kayıtsız şartsız feragat etseydi Yargıtay dosyayı incelemeden, feragat hususunda ek karar verilmek üzere hükmü veren mahkemeye gönderirdi.
  - olay: |
      Davacı Selin, davalı Orhan'a karşı 400.000 TL alacak davası açmıştır. Yargılama sürerken Selin ve Orhan, mahkeme huzurunda sulh olmuşlardır: Orhan 250.000 TL'yi altı eşit taksitte ödeyecek, ayrıca dava konusu olmayan ve taraflar arasında ihtilaflı olan bir araç satışına ilişkin borç da bu anlaşmayla çözülecektir. Sulh sözleşmesi, taksitlerin zamanında ödenmesi şartına bağlanmıştır. Taraflar sulhe göre karar verilmesini istememiştir. Daha sonra Orhan, Selin'in kendisinin içinde bulunduğu zor durumdan yararlanarak çok yüksek bir miktarı kabul ettirdiğini, edimler arasında açık bir oransızlık bulunduğunu ileri sürmektedir. Selin ise sulh sonrası mahkemenin hangi karar verdiğini ve sulhün kesin hüküm gibi sonuç doğurup doğurmadığını öğrenmek istemektedir.

      1. Sulh sözleşmesine dava dışı hususların ve şartın eklenmesi geçerli midir?
      2. Taraflar sulhe göre karar istemediğinden mahkeme hangi kararı verir?
      3. Orhan'ın iddiası sulhün hukuki sonucunu nasıl etkiler?
    olcut:
      - {tespit: "Sulhün mahkeme huzurunda yapılan sözleşme olduğu; tasarruf edilebilir uyuşmazlık şartı", puan: 15, madde: "HMK m. 313"}
      - {tespit: "Dava dışı hususların kapsama alınabilmesi", puan: 20, madde: "HMK m. 313"}
      - {tespit: "Sulhün şarta bağlı yapılabilmesi", puan: 15, madde: "HMK m. 313"}
      - {tespit: "Taraflar sulhe göre karar istemediğinden karar verilmesine yer olmadığına karar verilmesi", puan: 25, madde: "HMK m. 315"}
      - {tespit: "Sulhün kesin hüküm gibi sonuç doğurması ve irade bozukluğu veya aşırı yararlanma hâllerinde iptalinin istenebilmesi", puan: 25, madde: "HMK m. 315"}
    cozum: |
      **Nitelendirme:** Olay, mahkeme içi sulhün şartları, kapsamı ve sonuçları (HMK m. 313, HMK m. 315) ile sulhün iptalini konu alır.

      **Hukuki sorunlar:** (1) Dava dışı konu ve şart sulhte geçerli midir? (2) Taraflar sulhe göre karar istemezse mahkeme ne karar verir? (3) Sulh hükümsüz kılınabilir mi?

      **İlgili hükümler:** HMK m. 313/1-4 ve HMK m. 315/1-2; ayrıca kıyas için HMK m. 309/4 ve HMK m. 311.

      **Değerlendirme:** (1) HMK m. 313/1 sulhü, görülmekte olan davada tarafların uyuşmazlığı kısmen veya tamamen sona erdirmek için mahkeme huzurunda yaptıkları sözleşme olarak tanımlar. Alacak davası tarafların serbestçe tasarruf edebileceği bir uyuşmazlık olduğundan sulh yapılabilir (HMK m. 313/2). Dava konusunun dışında kalan hususlar da sulhün kapsamına dâhil edilebilir (HMK m. 313/3); dolayısıyla araç satışına ilişkin ihtilafın eklenmesi geçerlidir. Feragat ve kabul kayıtsız şartsız olmak zorundayken sulh şarta bağlı olarak da yapılabilir (HMK m. 313/4); taksitlerin zamanında ödenmesi şartı bu nedenle sulhü geçersiz kılmaz. Şartın kapsamı doktrinde tartışmalıdır; ancak edimlerin ifasına ilişkin bir şart sınavda sorun yaratmaz.

      (2) HMK m. 315/1'e göre mahkeme, taraflar sulhe göre karar verilmesini isterlerse sulh sözleşmesine göre; istemezlerse karar verilmesine yer olmadığına karar verir. Selin ve Orhan sulhe göre karar istemediğinden mahkeme karar verilmesine yer olmadığına karar verir. Sulh davayı sona erdirir.

      (3) HMK m. 315/1 sulhün kesin hüküm gibi hukuki sonuç doğurduğunu söyler; Orhan sulhten tek taraflı dönemez. Ancak HMK m. 315/2 irade bozukluğu veya aşırı yararlanma hâllerinde sulhün iptalini istemeye imkân verir. Orhan'ın zor durumundan yararlanıldığı ve açık oransızlık bulunduğu iddiası aşırı yararlanma çerçevesinde değerlendirilir. İddiasının ispatı gerekir; ispat edilirse sulhün iptali istenebilir.

      **Sonuç:** Sulh, dava dışı hususları ve şartı içermesine rağmen geçerlidir. Mahkeme karar verilmesine yer olmadığına karar verir. Sulh kesin hüküm gibi sonuç doğurur; Orhan ancak irade bozukluğu veya aşırı yararlanmayı ispat ederek iptalini isteyebilir.
kartlar:
  - on: "Feragat nedir (HMK m. 307)?"
    arka: "Davacının talep sonucundan kısmen veya tamamen vazgeçmesi; tek taraflı işlem, kesin hüküm gibi sonuç doğurur."
  - on: "Davayı kabul nedir (HMK m. 308)?"
    arka: "Davalının talep sonucuna kısmen veya tamamen muvafakat etmesi; yalnız serbestçe tasarruf edilebilir davalarda hüküm doğurur."
  - on: "Feragat ve kabul için karşı tarafın muvafakati gerekir mi?"
    arka: "Hayır (HMK m. 309/2). Davayı geri almada ise davalının açık rızası gerekir (HMK m. 123)."
  - on: "Feragat ve kabulde şart olur mu?"
    arka: "Hayır, kayıtsız ve şartsız olmalı (HMK m. 309/4). Sulh ise şarta bağlı yapılabilir (HMK m. 313/4)."
  - on: "Feragat/kabul/sulh ne zamana kadar yapılabilir?"
    arka: "Hüküm kesinleşinceye kadar her zaman (HMK m. 310/1, HMK m. 314/1)."
  - on: "Hüküm verildikten sonra feragat edilirse ne olur?"
    arka: "Dosya kanun yoluna gönderilmez; ilk derece veya bölge adliye mahkemesi ek karar verir (HMK m. 310/2)."
  - on: "Dosya temyize gönderildikten sonra feragat edilirse?"
    arka: "Yargıtay incelemeden dosyayı ek karar verilmek üzere hükmü veren mahkemeye gönderir (HMK m. 310/3)."
  - on: "Feragat ve kabulün sonucu?"
    arka: "Kesin hüküm gibi sonuç doğurur; irade bozukluğunda iptal istenebilir (HMK m. 311)."
  - on: "Feragat/kabul eden yargılama giderlerini öder mi?"
    arka: "Evet, aleyhine hüküm verilmiş gibi mahkûm olur (HMK m. 312/1)."
  - on: "Davalı hangi şartla giderlerden kurtulur (HMK m. 312/2)?"
    arka: "Davanın açılmasına kendi hâl ve davranışıyla sebebiyet vermemiş ve ilk duruşmada talep sonucunu kabul etmiş olmalı."
  - on: "Sulh nedir ve nelere dikkat edilir?"
    arka: "Mahkeme huzurunda yapılan sözleşme; tasarruf edilebilir uyuşmazlık; dava dışı hususlar ve şart mümkün (HMK m. 313)."
  - on: "Sulhün sonucu ve iptal sebebi?"
    arka: "Kesin hüküm gibi sonuç; sulhe göre karar istenmezse karar verilmesine yer olmadığına karar; irade bozukluğu veya aşırı yararlanmada iptal (HMK m. 315)."
