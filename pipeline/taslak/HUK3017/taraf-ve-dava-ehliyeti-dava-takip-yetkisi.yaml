doktrin: |
  ### Sıfat ile dava takip yetkisinin ayrımı
  Uygulamada "sıfat", "taraf ehliyeti" ve "dava takip yetkisi" çoğu zaman karıştırılır. Yargıtay Hukuk Genel Kurulu, ilk üçünün tarafların kişiliğiyle, sıfatın ise dava konusu subjektif hakla ilgili olduğunu vurgular. Önemli bir sonuç farkı vardır: sıfat yokluğunda esastan ret kesin hüküm doğurur ve davacı aynı davayı yeniden açamaz; dava takip yetkisi noksanlığında ise usulden ret, yeniden dava açmaya engel olmaz.

  ### Zorunlu dava arkadaşı eksikliğinin niteliği
  Zorunlu dava arkadaşlarından birinin davada bulunmaması hâlinin sıfat eksikliği mi yoksa dava takip yetkisi eksikliği mi olduğu tartışmalıdır. Bir görüş, bunu esasa ilişkin sıfat sorunu sayar ve esastan red sonucuna götürür. Diğer görüş, her dava arkadaşının tasarruf yetkisinin kısıtlandığını belirterek bunu dava takip yetkisi eksikliği sayar ve HMK m. 115/2 gereği süre verilmesini ister. Hukuk Genel Kurulu bir kararında oy çokluğuyla ilk görüşe yaklaşmış, karşı oyda ikinci görüş savunulmuştur. Bu konu olay çözümünde tek doğru cevap olarak kurulmamalıdır.

  ### "Dava açılmamış sayılır" ibaresi
  HMK m. 54/3, belge ibraz edilmezse davanın "açılmamış sayılacağını" söyler; HMK m. 115/2 ise dava şartı noksanlığında usulden ret öngörür. İki ifade arasındaki ilişki tartışılabilir. Uygulamada sonucun dava şartı eksikliği olarak değerlendirilmesi gerektiği görüşü ağırlık kazanmıştır; ancak kanun metnine uygun biçimde HMK m. 54/3'ü de bilmek gerekir.

  ### Dava öncesi ölmüş kişiye karşı dava
  Ölü kişiye karşı açılmış davada mahkemenin davacıya HMK m. 124 kapsamında soru yöneltip yöneltemeyeceği ve mirasçıları resen davaya dâhil edip edemeyeceği tartışmalıdır. Sınavlarda HMK m. 124/3-4 çerçevesindeki davacı talebi ve maddi hata ölçütü bilinmelidir; mahkemenin resen tarafı değiştirebileceği gibi kesin ifadelerden kaçınılmalıdır.
sozluk:
  - terim: Taraf ehliyeti
    tanim: "Davada davacı veya davalı olabilme ehliyeti; hak ehliyetine bağlıdır (HMK m. 50)."
  - terim: Dava ehliyeti
    tanim: "Davayı kendisi veya vekille yürütme ve geçerli usul işlemi yapma ehliyeti; fiil ehliyetine bağlıdır (HMK m. 51)."
  - terim: Dava takip yetkisi
    tanim: "Talep sonucu hakkında hüküm alabilme yetkisi (HMK m. 53)."
  - terim: Sıfat (husumet)
    tanim: "Dava konusu hak ile taraflar arasındaki maddi hukuk ilişkisi; aktif ve pasif olarak ikiye ayrılır."
  - terim: Kanuni temsilci
    tanim: "Ehliyeti olmayan kişi adına davayı yürüten veli veya vasi; tüzel kişilerde yetkili organ (HMK m. 52)."
  - terim: Hak ehliyeti
    tanim: "Haklara ve borçlara ehil olma; sağ doğmak koşuluyla ana rahmine düşmekle başlar, ölümle sona erer (TMK m. 28)."
  - terim: Fiil ehliyeti
    tanim: "Kendi fiilleriyle hak edinme ve borç altına girme yeteneği (TMK m. 9)."
  - terim: İzin belgesi
    tanim: "Davanın açılması için kanuni temsilcinin vesayet makamından alması gereken izin (TMK m. 462/8, HMK m. 54)."
  - terim: Kesin süre
    tanim: "Dava şartı noksanlığının giderilmesi için verilen, uyulmazsa hak kaybı doğuran süre (HMK m. 115/2)."
  - terim: Kayyım
    tanim: "Gecikmesinde sakınca bulunan hâllerde, talep üzerine davayı takip için atanan kişi (HMK m. 55)."
kararlar:
  - id: "1228875900"
    ozet: |
      Orman kadastrosuna itiraz ile tapu iptali ve tescil davasında davacılar yalnızca Orman İdaresini hasım göstermişti; taşınmaz ise orman niteliğiyle Hazine adına kayıtlıydı. İlk derece mahkemesi, Hazinenin davaya dâhil edilmesi için bir haftalık kesin süre verdi ve süre geçince davayı husumet nedeniyle reddetti. Yargıtay Özel Dairesi, pasif taraf sıfatını dava şartı sayarak bozdu; mahkeme direndi. Hukuk Genel Kurulu, taraf ehliyeti, dava ehliyeti ve dava takip yetkisinin dava şartı olduğunu, sıfatın ise maddi hukuka ilişkin olup dava şartı olmadığını belirtti. Hazine yönünden eksikliğin pasif husumet eksikliği olduğunu kabul etti, ancak verilen bir haftalık sürenin davanın niteliği ve karmaşıklığı karşısında makul olmadığı sonucuna vararak direnme kararını oy çokluğuyla bozdu. Karşı oyda, eksikliğin dava takip yetkisi olarak nitelenmesi gerektiği savunuldu. Karar, sıfat ile dava şartları arasındaki ayrımı ve noksanlık giderilirken makul süre verilmesi gerektiğini gösterir.
  - id: "1227133500"
    ozet: |
      Kat mülkiyetine tabi bir sitede davacılar, davalıların bağımsız bölümde onaylı projeye aykırı yapı ve tadilat yaptığını ileri sürerek müdahalenin önlenmesi ve eski hâle getirme istemiyle dava açmıştı. İlk derece mahkemesi davayı kabul etti. Bölge adliye mahkemesi, bir davacının dava sonrası malik olması ve site yönetiminin kat malikleri kurulu yetkisi olmadan dava açması nedeniyle bu davacılar yönünden aktif husumet yokluğundan ret kararı verdi. Yargıtay 5. Hukuk Dairesi bozdu, bölge adliye mahkemesi direndi. Hukuk Genel Kurulu, taraf ehliyeti ve dava ehliyetinin dava şartı olduğunu, taraf sıfatının (husumetin) ise dava şartı olmayıp esas hakkında karar verilirken incelendiğini belirtti. Kat malikleri kurulu toplantısında site yönetimine dava açma yetkisi verildiği anlaşıldığından direnme kararını oy çokluğuyla bozdu. Karar, sıfat yokluğunun esastan reddi gerektirdiğini ve yöneticinin dava açma yetkisinin kat malikleri kurulu kararına dayanabileceğini gösterir.
sorular:
  - soru: |
      Medenî haklardan yararlanma ehliyetine sahip olmak, davada hangi ehliyeti kazandırır?
    siklar:
      - "Dava ehliyetini"
      - "Taraf ehliyetini"
      - "Dava takip yetkisini"
      - "Sıfatı"
    dogru: 1
    aciklama: |
      HMK m. 50: medenî haklardan yararlanma (hak) ehliyetine sahip olan, davada taraf ehliyetine de sahiptir. Dava ehliyeti ise medenî hakları kullanma ehliyetine göre belirlenir (HMK m. 51).
  - soru: |
      Dava ehliyetinin ölçütü hangisidir?
    siklar:
      - "Medenî hakları kullanma ehliyeti"
      - "Maddi hukuktaki tasarruf yetkisi"
      - "Dava konusu hakla ilişki"
      - "Kişinin Türk vatandaşı olması"
    dogru: 0
    aciklama: |
      HMK m. 51'e göre dava ehliyeti, medenî hakları kullanma (fiil) ehliyetine göre belirlenir. Tasarruf yetkisi, dava takip yetkisinin ölçütüdür (HMK m. 53).
  - soru: |
      Hangi eksiklik hâlinde dava esastan reddedilir?
    siklar:
      - "Taraf ehliyeti yokluğu"
      - "Dava ehliyeti yokluğu"
      - "Dava takip yetkisi yokluğu"
      - "Davacının dava konusu hak bakımından sıfatının bulunmaması"
    dogru: 3
    aciklama: |
      Sıfat maddi hukuka ilişkindir ve dava şartı değildir; sıfat yokluğunda dava esastan reddedilir. Taraf ehliyeti, dava ehliyeti ve dava takip yetkisi ise dava şartıdır (HMK m. 114/1-d ve HMK m. 114/1-e) ve noksanlıkta usulden ret söz konusudur (HMK m. 115).
  - soru: |
      Dava takip yetkisi aşağıdakilerden hangisidir?
    siklar:
      - "Davada davacı veya davalı olabilme yeteneği"
      - "Davayı yürütme ehliyeti"
      - "Talep sonucu hakkında hüküm alabilme yetkisi"
      - "Dava konusu hakkın kime ait olduğu"
    dogru: 2
    aciklama: |
      HMK m. 53: dava takip yetkisi, talep sonucu hakkında hüküm alabilme yetkisidir ve kural olarak maddi hukuktaki tasarruf yetkisine göre belirlenir.
  - soru: |
      Ayırt etme gücü bulunmayan Cemal adına, kanuni temsilcisi olmaksızın bizzat dava açılmıştır. Dava ehliyeti noksanlığı giderilebilir niteliktedir. Mahkeme ne yapar?
    siklar:
      - "Davayı hemen esastan reddeder."
      - "Davayı hemen usulden reddeder."
      - "Noksanlığın giderilmesi için kesin süre verir, giderilmezse usulden reddeder."
      - "Cemal'in sözlü beyanıyla davaya devam eder."
    dogru: 2
    aciklama: |
      Dava ehliyeti dava şartıdır ve giderilmesi mümkün olan noksanlık için mahkeme kesin süre verir. Süre içinde giderilmezse dava usulden reddedilir (HMK m. 115/2).
  - soru: |
      Vasi Selin, kısıtlının alacağı için dava açmış ancak vesayet makamından izin belgesi almamıştır. İzin için sulh hukuk mahkemesine başvurması gerekmektedir. Hangisi doğrudur?
    siklar:
      - "Mahkeme izin için kesin süre verir; süre içinde başvurulursa karar verilinceye kadar beklenir."
      - "Mahkeme izin belgesi olmadığı için davayı hemen usulden reddeder."
      - "Vasi, vesayet makamının iznine ihtiyaç duymaz."
      - "Mahkeme bizzat vesayet makamı gibi izin verir."
    dogru: 0
    aciklama: |
      Vasinin dava açması vesayet makamının iznine bağlıdır (TMK m. 462/8). İzin için mahkemeye başvurulacaksa ilgiliye kesin süre verilir ve süre içinde başvurulursa karar verilinceye kadar beklenir (HMK m. 54/2).
  - soru: |
      Dava devam ederken davalı Hasan ölmüştür. Mirasçılar henüz mirası kabul veya reddetmemiştir ve kanundaki süreler dolmamıştır. Hangisi doğrudur?
    siklar:
      - "Dava, kanunla belirlenen süreler geçinceye kadar ertelenir."
      - "Dava kendiliğinden düşer."
      - "Mahkeme mirasçıları derhâl yargılamaya zorlar."
      - "Dava usulden reddedilir."
    dogru: 0
    aciklama: |
      HMK m. 55'e göre taraflardan birinin ölümü hâlinde mirasçılar mirası kabul veya reddetmemişse, kanunla belirlenen süreler geçinceye kadar dava ertelenir. Mirasın reddi süresi üç aydır (TMK m. 606).
  - soru: |
      Dava sırasında ölen tarafın mirasçıları belli olmadığında, gecikmesinde sakınca bulunan hâllerde davayı takip için kayyım atanması ne zaman mümkündür?
    siklar:
      - "Hâkimin kendiliğinden kararıyla"
      - "Talep üzerine"
      - "Yalnızca davalının isteğiyle"
      - "Hiçbir hâlde mümkün değildir"
    dogru: 1
    aciklama: |
      HMK m. 55: hâkim, gecikmesinde sakınca bulunan hâllerde talep üzerine davayı takip için kayyım atanmasına karar verebilir. Kayyım atanması resen değil, talep üzerine yapılır.
  - soru: |
      Cenin, aşağıdakilerden hangisi bakımından doğru nitelendirilir?
    siklar:
      - "Hiçbir hâlde hak ehliyeti yoktur."
      - "Sağ doğmak koşuluyla ana rahmine düştüğü andan itibaren hak ehliyetine sahiptir."
      - "Doğumdan sonra ancak bir yıl geçtikten sonra hak ehliyetini kazanır."
      - "Yalnızca yasal temsilcisi vasıtasıyla hak ehliyeti kazanır."
    dogru: 1
    aciklama: |
      TMK m. 28: çocuk hak ehliyetini, sağ doğmak koşuluyla, ana rahmine düştüğü andan başlayarak elde eder. Taraf ehliyeti hak ehliyetine bağlı olduğundan (HMK m. 50) cenin de buna bağlı olarak taraf ehliyetine sahip sayılır.
  - soru: |
      X Anonim Şirketi adına davayı açan yönetim kurulu üyesi, temsil belgesini dava dilekçesiyle sunmamıştır. Belge ibraz edilmesi için verilen süre içinde de ibraz edilmemiştir. HMK m. 54'e göre sonuç nedir?
    siklar:
      - "Dava açılmamış sayılır."
      - "Dava esastan reddedilir."
      - "Şirket davada hiçbir zaman taraf sayılmaz."
      - "Mahkeme şirketi ceza ile yükümlü kılar ve davaya devam eder."
    dogru: 0
    aciklama: |
      HMK m. 54/3'e göre süresi içinde belgelerin ibraz edilmemesi veya mahkemeye başvurulmaması hâlinde dava açılmamış veya gerçekleştirilen işlemler yapılmamış sayılır.
  - soru: |
      Ali, tapuda görünen malikin değil de başkasının alacağını kendi adına dava etmiştir. Ali'nin taraf ve dava ehliyeti vardır. Hangisi doğrudur?
    siklar:
      - "Dava usulden reddedilir, çünkü sıfat dava şartıdır."
      - "Dava esastan reddedilir, çünkü Ali'nin dava konusu hakla ilişkisi yoktur."
      - "Dava takip yetkisi bulunmadığı için hakkın kime ait olduğu incelenmeden usulden reddedilir."
      - "Mahkeme davayı kendiliğinden Ali'nin yerine gerçek hak sahibine yöneltir."
    dogru: 1
    aciklama: |
      Ali'nin dava konusu hakla maddi ilişkisi yoktur; bu bir sıfat sorunudur. Sıfat dava şartı değildir, esasa ilişkindir ve yokluğunda dava esastan reddedilir. Taraf değişikliği ancak HMK m. 124'teki usule göre yapılabilir.
  - soru: |
      Bir dava şartı noksanlığı mahkemece fark edilmemiş ve taraflarca ileri sürülmemiştir; ancak hüküm anında noksanlık giderilmiştir. Sonuç nedir?
    siklar:
      - "Dava başlangıçtaki noksanlık nedeniyle usulden reddedilir."
      - "Dava başlangıçtaki noksanlık nedeniyle usulden reddedilemez."
      - "Mahkeme taraflara yeniden dava açmalarını bildirir."
      - "Dava açılmamış sayılır."
    dogru: 1
    aciklama: |
      HMK m. 115/3: dava şartı noksanlığı esasa girilmeden önce fark edilmemiş, taraflarca ileri sürülmemiş ve hüküm anında giderilmişse başlangıçtaki noksanlıktan ötürü dava usulden reddedilemez.
olaylar:
  - olay: |
      Davacı Ayşe, tapuda Ahmet adına kayıtlı görünen taşınmaz ve Ahmet'in kısıtlanıp vasi atanan kardeşi Cemal aleyhine 10.3.2026 tarihinde tapu iptali ve tescil davası açmıştır. Yargılama sırasında yapılan nüfus kaydı incelemesinde şu hususlar ortaya çıkmıştır:

      (1) Ahmet, dava açılmadan üç ay önce vefat etmiştir; tapuda intikal yapılmadığı için Ayşe bunu bilmemektedir.
      (2) Cemal adına vasisi Vedat cevap dilekçesi vermiş, ancak vesayet makamından dava ve savunma için gerekli izni sunmamıştır.
      (3) Dava devam ederken davacı Ayşe de vefat etmiş, mirasçıları mirası henüz kabul veya reddetmemiştir.

      1. Ahmet bakımından taraf ehliyetini ve Ayşe'nin yapabileceğini değerlendiriniz.
      2. Cemal ve Vedat bakımından durumu ve mahkemenin yapacağını değerlendiriniz.
      3. Ayşe'nin ölümünün davaya etkisini değerlendiriniz.
    olcut:
      - {tespit: "Dava açılmadan önce ölen Ahmet'in kişiliği sona ermiştir; taraf ehliyeti yoktur", puan: 20, madde: "TMK m. 28"}
      - {tespit: "Ayşe'nin maddi hataya dayanan taraf değişikliği talebi, karşı tarafın rızası aranmaksızın hâkimce kabul edilir", puan: 20, madde: "HMK m. 124"}
      - {tespit: "Kısıtlı Cemal'in dava ehliyeti yoktur; vasisi tarafından temsil edilir", puan: 15, madde: "HMK m. 52"}
      - {tespit: "Vasi dava için vesayet makamından izin almalıdır; belge için kesin süre verilir, başvuru yapılırsa karar beklenir", puan: 25, madde: "HMK m. 54"}
      - {tespit: "Dava sırasında ölümde mirasçılar kabul veya ret kararı vermemişse kanuni süreler geçinceye kadar dava ertelenir; kayyım talep üzerine atanır", puan: 20, madde: "HMK m. 55"}
    cozum: |
      **Nitelendirme:** Olay, taraf ehliyeti, dava ehliyeti, kanuni temsil ve dava sırasında ölüm kurumlarını birlikte içerir.

      **Hukuki sorunlar:** (1) Dava açılmadan önce ölen kişiye karşı dava açılabilir mi? (2) Kısıtlı adına vasinin işlemleri geçerli mi? (3) Yargılama sırasında ölümün sonucu nedir?

      **İlgili hükümler:** TMK m. 28, HMK m. 50, HMK m. 51, HMK m. 52, HMK m. 54, HMK m. 55, HMK m. 114, HMK m. 115, HMK m. 124, TMK m. 462.

      **Değerlendirme:** Ahmet dava açılmadan önce öldüğü için kişiliği ve hak ehliyeti sona ermiştir (TMK m. 28); bu yüzden taraf ehliyeti de yoktur (HMK m. 50). Taraf ehliyeti dava şartıdır (HMK m. 114/1-d). Ancak Ayşe tapu kaydına güvenerek dava açtığından, bu durum maddi hatadan kaynaklanan taraf yanlışlığıdır. HMK m. 124/3'e göre maddi hatadan kaynaklanan veya dürüstlük kuralına aykırı olmayan taraf değişikliği talebi, karşı tarafın rızası aranmaksızın hâkimce kabul edilir. Ayşe davayı Ahmet'in mirasçılarına yöneltmek için talepte bulunursa bu talep kabul edilebilir. Çözüm, Ayşe'nin bu yöndeki talebine dayanır.

      Cemal kısıtlı olduğundan dava ehliyeti yoktur (HMK m. 51); davada kanuni temsilcisi olan vasisi Vedat tarafından temsil edilir (HMK m. 52). Vasinin dava açma ve sulh olma gibi işlemleri vesayet makamının iznine bağlıdır (TMK m. 462/8). İzin belgesi dava veya cevap dilekçesiyle verilmelidir (HMK m. 54/1). Belge alınması için mahkemeye başvurulması gerekiyorsa, Vedat'a başvuru için kesin süre verilir ve bu süre içinde başvurursa karar verilinceye kadar beklenir (HMK m. 54/2). Süresinde belge verilmez veya başvuru yapılmazsa işlemler yapılmamış sayılır (HMK m. 54/3). Bu, giderilebilir bir dava şartı noksanlığı olduğundan mahkeme önce kesin süre verir (HMK m. 115/2).

      Ayşe yargılama sırasında öldüğüne göre HMK m. 55 uygulanır. Mirasçılar mirası kabul veya reddetmemişse, kanunla belirlenen süreler, yani üç aylık ret süresi (TMK m. 606), geçinceye kadar dava ertelenir. Gecikmesinde sakınca bulunan hâllerde talep üzerine kayyım atanabilir.

      **Sonuç:** Ahmet bakımından taraf ehliyeti yoktur, Ayşe taraf değişikliği talep edebilir. Cemal bakımından izin belgesi için kesin süre verilmeli, başvuru olursa karar beklenmelidir. Ayşe'nin ölümü bakımından dava ertelenir, kayyım ancak talep üzerine atanır.
  - olay: |
      Hasan, arkadaşı Mert'in Ali'ye olan 100.000 TL alacağını "Mert bana yetki verdi" diyerek kendi adına dava etmiştir. Hasan ve Ali'nin taraf ve dava ehliyeti tamdır. Mahkeme dava şartlarını incelerken Hasan'ın dava konusu alacakla maddi hukuk ilişkisi bulunmadığını tespit etmiştir.

      Ayrıca ayırt etme gücüne sahip 16 yaşındaki Kerem, kiracısı Selim aleyhine kira alacağı için, anne babasının katılımı olmaksızın kendi adına ayrı bir dava açmıştır.

      1. Hasan'ın davasının niteliğini ve sonucunu değerlendiriniz.
      2. Kerem'in tek başına açtığı davayı değerlendiriniz.
    olcut:
      - {tespit: "Hasan'ın dava konusu hakla maddi ilişkisi yoktur; bu bir sıfat sorunudur ve dava şartı değildir", puan: 30, madde: "HMK m. 114"}
      - {tespit: "Sıfat yokluğunda dava esastan reddedilir; usulden ret kararı verilmez", puan: 25, madde: "HMK m. 115"}
      - {tespit: "Dava ehliyeti medenî hakları kullanma ehliyetine göre belirlenir; ayırt etme gücüne sahip küçük kural olarak temsilci rızası olmadan işlem yapamaz", puan: 20, madde: "HMK m. 51"}
      - {tespit: "Ehliyeti olmayanlar kanuni temsilcileri tarafından temsil edilir; noksanlık giderilebilirse kesin süre verilir", puan: 25, madde: "HMK m. 52"}
    cozum: |
      **Nitelendirme:** Olayın ilk kısmı sıfat ile dava şartlarının ayrımını, ikinci kısmı dava ehliyeti ve kanuni temsili konu alır.

      **Hukuki sorunlar:** (1) Başkasının alacağını kendi adına dava eden Hasan'ın davası usulden mi esastan mı reddedilir? (2) Küçük Kerem'in tek başına açtığı dava hangi sonuca bağlanır?

      **İlgili hükümler:** HMK m. 50, HMK m. 51, HMK m. 52, HMK m. 53, HMK m. 114, HMK m. 115, TMK m. 16.

      **Değerlendirme:** Hasan'ın ve Ali'nin taraf ve dava ehliyeti tamdır; dava takip yetkisi bakımından da kanunun öngördüğü bir istisna yoktur (HMK m. 53). Eksik olan, Hasan'ın dava konusu alacakla olan maddi ilişkisidir. Bu bir sıfat sorunudur. Yargıtay Hukuk Genel Kurulu sıfatın dava şartı olmadığını, maddi hukuka ilişkin olduğunu belirtir. Taraf ehliyeti, dava ehliyeti ve dava takip yetkisi ise HMK m. 114/1-d ve HMK m. 114/1-e gereği dava şartıdır. Bu nedenle Hasan'ın davası dava şartı yokluğundan usulden değil, aktif sıfat yokluğundan **esastan** reddedilir.

      Kerem'in durumunda ise ayırt etme gücüne sahip küçük, kural olarak yasal temsilcisinin rızası olmadan kendi işlemleriyle borç altına giremez; karşılıksız kazanmada ve kişiye sıkı sıkıya bağlı hakları kullanmada rıza gerekmez (TMK m. 16). Dava ehliyeti medenî hakları kullanma ehliyetine göre belirlendiğinden (HMK m. 51), Kerem'in dava ehliyeti kural olarak yoktur ve davada kanuni temsilcisi tarafından temsil edilir (HMK m. 52). Bu noksanlık giderilebilir olduğu için mahkeme kesin süre verir; süre içinde kanuni temsilci davaya katılmazsa dava usulden reddedilir (HMK m. 115/2).

      **Sonuç:** Hasan'ın davası sıfat yokluğundan esastan reddedilir. Kerem'in tek başına açtığı dava bu hâliyle yürütülemez; kesin süre verilmeli, giderilmezse usulden ret kararı verilmelidir.
kartlar:
  - on: "Taraf ehliyeti hangi maddi hukuk kavramına denk gelir?"
    arka: "Hak ehliyetine (HMK m. 50, TMK m. 8). Medenî haklardan yararlanma ehliyetine sahip olan davada taraf ehliyetine de sahiptir."
  - on: "Dava ehliyeti hangi ehliyete göre belirlenir?"
    arka: "Medenî hakları kullanma (fiil) ehliyetine göre (HMK m. 51, TMK m. 9)."
  - on: "Dava takip yetkisi nedir?"
    arka: "Talep sonucu hakkında hüküm alabilme yetkisi; kural olarak maddi hukuktaki tasarruf yetkisine göre belirlenir (HMK m. 53)."
  - on: "Sıfat dava şartı mıdır, yokluğunda ne olur?"
    arka: "Dava şartı değildir, maddi hukuka ilişkindir. Yokluğunda dava esastan reddedilir; taraf ehliyeti, dava ehliyeti, takip yetkisi yokluğunda usulden ret olur (HMK m. 114/1-d, HMK m. 114/1-e)."
  - on: "Dava şartı noksanlığı giderilebiliyorsa mahkeme ne yapar?"
    arka: "Kesin süre verir; süre içinde giderilmezse usulden reddeder (HMK m. 115/2)."
  - on: "Hüküm anında giderilen dava şartı noksanlığı?"
    arka: "Esasa girilmeden fark edilmemiş ve ileri sürülmemişse, başlangıçtaki noksanlıktan dolayı dava usulden reddedilemez (HMK m. 115/3)."
  - on: "Ehliyeti olmayan kişi davada kim tarafından temsil edilir?"
    arka: "Kanuni temsilcisi; tüzel kişiler yetkili organları tarafından (HMK m. 52)."
  - on: "Vasi dava açarken neye ihtiyaç duyar?"
    arka: "Vesayet makamının iznine (TMK m. 462/8). İzin belgesi dava veya cevap dilekçesiyle verilir (HMK m. 54/1)."
  - on: "İzin için mahkemeye başvuru gerekirse HMK m. 54'ün işleyişi?"
    arka: "Başvuru için kesin süre verilir; süre içinde başvurulursa karar verilinceye kadar beklenir. Süresinde belge ibraz edilmez veya başvuru yapılmazsa dava açılmamış sayılır (HMK m. 54/2-3)."
  - on: "Dava sırasında taraf ölürse ne olur?"
    arka: "Mirasçılar kabul veya ret yapmamışsa kanuni süreler geçinceye kadar dava ertelenir; kayyım talep üzerine atanabilir (HMK m. 55)."
  - on: "Cenin taraf ehliyetine sahip midir?"
    arka: "Sağ doğmak koşuluyla ana rahmine düştüğü andan itibaren hak ehliyeti kazanır (TMK m. 28), buna bağlı olarak taraf ehliyetine sahip sayılır."
  - on: "Yanlış tarafa dava açılmışsa taraf değişikliği ne zaman rıza aranmaksızın kabul edilir?"
    arka: "Maddi hatadan kaynaklanan veya dürüstlük kuralına aykırı olmayan taraf değişikliği talebi hâkimce karşı tarafın rızası aranmaksızın kabul edilir (HMK m. 124/3)."
