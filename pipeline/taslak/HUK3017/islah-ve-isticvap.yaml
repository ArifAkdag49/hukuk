  - 📌 Bozma veya kaldırmadan sonra ilk derece mahkemesi tahkikata ilişkin işlem yaparsa tahkikat sonuna kadar ıslah yapılabilir; bozmaya uymakla doğan hukuki durum ortadan kaldırılamaz (HMK m. 177/2).
  - 📌 Teminat **bir hafta içinde** yatırılmazsa ıslah yapılmamış sayılır (HMK m. 178/1).
  - ⚠️ İkrar, tanık ifadeleri, bilirkişi rapor ve beyanları, keşif ve isticvap tutanakları ıslahla geçersiz kılınamaz (HMK m. 179/2).
  - 📌 Tam ıslahta bildirimden itibaren bir hafta içinde yeni dava dilekçesi verilmezse ıslah hakkı kullanılmış sayılır (HMK m. 180).
  - ⚠️ Kısmi ıslahta süre içinde ıslah edilen işlem yapılmazsa ıslah hiç yapılmamış gibi devam edilir (HMK m. 181).
  - ⚠️ Kötüniyetli ıslah dikkate alınmaz ve disiplin para cezası verilir (HMK m. 182).
