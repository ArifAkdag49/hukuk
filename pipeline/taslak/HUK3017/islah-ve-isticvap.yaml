doktrin: |
  ### Islahın niteliği
  Islah, usul işlemini düzelten tek taraflı bir irade beyanı olarak tanımlanır ve hâkimin ya da karşı tarafın onayına bağlı değildir. Hâkim yalnız yasal şartların bulunup bulunmadığını denetler. Öğretide ıslahın, taraflara kısa sürede ve düşük masrafla talep sonucuna ulaşma imkânı verdiği vurgulanır.

  ### Tam ıslahta dava tarihinden sonraki vakıalar
  Tam ıslah, yeni bir dava dilekçesi verilmesini gerektirdiği için bir görüşe göre yeni dilekçeyle yeni vakıalar, dava tarihinden sonrakiler de dâhil, ileri sürülebilir. Bu görüşe göre tam ıslah adeta davanın başa dönmesi sonucunu doğurur ve geçersiz hâle gelen işlemler teminatla karşılanır. Karşı görüş ve Yargıtay Hukuk Genel Kurulunun yaklaşımı ise her davanın açıldığı tarihteki duruma göre karara bağlanması ilkesinden hareket eder: ıslah hatalı usul işlemini düzeltme imkânıdır, dava açıldığı tarihte gerçekleşmemiş bir vakıa "hatalı işlem" olamaz. Sınavda Yargıtay yaklaşımını kullanabilirsiniz, ancak karşı görüşün varlığını bilin.

  ### Bozma sonrası ıslah
  HMK m. 177/2 ile kanun koyucu, bozmadan sonra ıslah yapılamayacağı yönündeki eski uygulamayı yumuşatmıştır. "Tahkikata ilişkin işlem" ölçütünün kapsamı, örneğin yalnızca ek bilirkişi raporu alınmasının yeterli olup olmadığı, somut olaya göre değerlendirilir. Bu nedenle sınav olaylarında açıkça tahkikata ilişkin işlem yapıldığı belirtilmelidir.

  ### HMK m. 109/4 ve ıslahın ilişkisi
  Kısmi davada talep artırımı ile kısmi ıslah birbirine benzer; farklar zamanaşımı, teminat ve kapsamda toplanır. HMK m. 109/4 ile ıslah hakkının tüketilip tüketilmeyeceği ve görülmekte olan davalarda uygulanıp uygulanmayacağı metinden çıkarılamayan, öğretide tartışılacak konulardır.
sozluk:
  - terim: Islah
    tanim: "Tarafın yaptığı usul işlemini karşı tarafın muvafakatine bağlı olmadan kısmen veya tamamen düzeltmesi; aynı davada ancak bir kez yapılabilir."
  - terim: Tam ıslah
    tanim: "Davanın tamamen ıslahı; bildirimden itibaren bir hafta içinde yeni dava dilekçesi verilmesini gerektirir."
  - terim: Kısmi ıslah
    tanim: "Belirli bir usul işleminin düzeltilmesi; ıslah edilen işlemin bir haftalık sürede yapılması gerekir."
  - terim: Teşmil
    tanim: "Islahın etkisinin yayılacağı nokta; bu noktadan itibaren usul işlemleri yapılmamış sayılır."
  - terim: Teminat
    tanim: "Islah eden tarafın geçersiz hâle gelen işlemlerin giderleri ile karşı tarafın zararları için yatırdığı, hâkimin takdir ettiği güvence."
  - terim: Kötüniyetli ıslah
    tanim: "Davayı uzatmak veya karşı tarafı rahatsız etmek amacıyla yapılan ıslah; dikkate alınmaz ve disiplin para cezası gerektirir."
  - terim: Maddi hata
    tanim: "Dosyadaki belgelerde bulunan açık yazı veya hesap hatası; karar verilinceye kadar düzeltilebilir."
  - terim: İsticvap
    tanim: "Mahkemenin tarafı kendi aleyhine olan vakıalar hakkında bizzat sorguya çekmesi; gelmemenin veya cevapsız bırakmanın sonucu ikrardır."
  - terim: İkrar sayılma
    tanim: "Özürsüz gelmeyen veya soruları cevapsız bırakan isticvap edilenin sorulan vakıaları ikrar etmiş sayılması."
  - terim: Kısmi dava
    tanim: "Bölünebilir bir talep konusunun yalnız bir kısmının dava edilmesi."
  - terim: Usuli kazanılmış hak
    tanim: "Bozma kararına uyulmasıyla oluşan ve ıslahla ortadan kaldırılamayan hukuki durum."
kararlar:
  - id: "1186876800"
    ozet: |
      Davacı şirket, davalının 14.11.2008 tarihinden itibaren haksız işgalci olduğunu ileri sürerek ecrimisil istemiş; dava dilekçesinde şimdilik 10.000 TL talep etmiştir. Mahkeme taraf vekillerinin hazır olduğu 13.05.2014 tarihli celsede tahkikatın bittiğini bildirip sözlü yargılamaya geçmiş; davacı vekili 04.06.2014 tarihli dilekçesiyle talebini yaklaşık 2 milyon TL'ye çıkararak ıslah etmiştir. Mahkeme ıslahla artırılan miktarı da dikkate alarak karar vermiş, Özel Daire bozmuş, yerel mahkeme direnmiştir.

      Hukuk Genel Kurulu, HMK m. 177/1'e göre ıslahın tahkikatın sona ermesine kadar yapılabileceğini, tahkikatın bittiği ve sözlü yargılamaya geçildiği bildirildikten sonra yapılan ıslaha değer verilemeyeceğini belirtmiştir. Yerel mahkemenin direnme kararı oybirliğiyle bozulmuştur. Karar, ıslah için tahkikatın sona erme anının belirleyici olduğunu gösterir.
  - id: "867805500"
    ozet: |
      Taraflar arasında karşılıklı boşanma davaları görülürken erkek eş, evlilik birliğinin sarsılması sebebine dayanan davasını yargılama sırasında zina sebebine dayalı olarak tamamen ıslah etmiştir. İleri sürdüğü zina vakıası ise dava tarihinden sonra, 04.12.2015 tarihinde gerçekleşmiştir. Bölge adliye mahkemesi zina iddiasının ispatlandığını kabul etmiş, Özel Daire bozmuş, direnme kararı verilmiştir.

      Hukuk Genel Kurulu, dava açıldıktan sonra meydana gelen yeni bir vakıanın tam ıslah yoluyla ileri sürülüp sürülemeyeceğini incelemiştir. Her davanın açıldığı tarihteki duruma göre sonuçlandırılması gerektiğini, ıslahın hatalı usul işlemini düzeltme imkânı olduğunu ve dava tarihinde henüz gerçekleşmemiş bir vakıanın ıslahla davaya eklenemeyeceğini belirterek direnme kararını değişik gerekçeyle ve oy çokluğuyla bozmuştur: Kurula göre usulüne uygun açılmış bir dava bulunmadığından ıslahla ileri sürülen zina davası hakkında karar verilmesine yer olmadığına hükmedilmelidir. Karşı oyda, tam ıslahla yeni dava dilekçesi verildiği için bu dilekçenin verildiği tarihten önceki vakıaların, dava tarihinden sonra gerçekleşmiş olsalar da, ileri sürülebileceği savunulmuştur.
  - id: "638309400"
    ozet: |
      İş mahkemesinde görülen ücret alacağı davasında davacı, ücret alacağını "maaş alacağına mahsuben 100 TL" diyerek soyut biçimde talep etmiştir. Özel Daire, hangi aylara ait ücretin istendiğinin belirlenmesi için davacının isticvap edilmesi ve davalıdan ödeme belgelerinin istenmesi gerektiği gerekçesiyle kararı bozmuş, yerel mahkeme direnmiştir.

      Hukuk Genel Kurulu, isticvabın HMK m. 169-175 usulüne göre yapılan sorgulama olduğunu, tarafın hâkim tarafından salt dinlenmesinin teknik anlamda isticvap sayılmadığını belirtmiştir. Bir tarafın ancak kendi aleyhine olan vakıalar hakkında isticvap edilebileceğini, ücret alacağı iddiası davacının lehine olduğu için davacının isticvabının doğru olmadığını söylemiştir. Mahkemenin davacıya talebini somutlaştırması için uygun bir kesin süre vermesi gerektiğini belirterek direnme kararını değişik gerekçeyle bozmuştur (oy birliği).
sorular:
  - soru: |
      Islahla ilgili olarak aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Aynı davada taraflar ancak bir kez ıslah yoluna başvurabilir."
      - "Aynı davada taraflar iki kez ıslah yapabilir."
      - "Islah için karşı tarafın açık muvafakati şarttır."
      - "Islah ancak mahkemenin izniyle yapılabilir."
    dogru: 0
    aciklama: |
      HMK m. 176/2'ye göre aynı davada taraflar ancak bir kez ıslah yoluna başvurabilir. Islah, karşı tarafın muvafakatine veya mahkemenin iznine bağlı değildir; hâkim yalnız ıslahın yasal şartlarını denetler.
  - soru: |
      Islah hangi zamana kadar yapılabilir?
    siklar:
      - "Tahkikatın sona ermesine kadar."
      - "Hüküm verilinceye kadar."
      - "Ön inceleme duruşmasının sonuna kadar."
      - "Sözlü yargılamanın sonuna kadar."
    dogru: 0
    aciklama: |
      HMK m. 177/1'e göre ıslah tahkikatın sona ermesine kadar yapılabilir. Sözlü yargılama aşamasında veya hüküm aşamasında ıslah yapılamaz; ön inceleme ile sınırlama da kanunda yoktur.
  - soru: |
      İlk derece mahkemesi, taraf vekillerinin hazır olduğu duruşmada tahkikatın bittiğini ve sözlü yargılamaya geçildiğini bildirmiştir. Sonraki celseden önce davacı vekili dilekçe vererek talep miktarını ıslah etmek istemiştir. Hangisi doğrudur?
    siklar:
      - "Tahkikat sona erdikten sonra yapıldığı için ıslaha değer verilemez."
      - "Hüküm verilinceye kadar yapıldığı için ıslah geçerlidir."
      - "Islah, karşı tarafın muvafakatiyle geçerli olur."
      - "Islah, teminat yatırılırsa geçerli olur."
    dogru: 0
    aciklama: |
      HMK m. 177/1'e göre ıslah tahkikatın sona ermesine kadar yapılabilir. Tahkikatın bittiği duruşmada tefhim edilir ve sözlü yargılamaya geçilir (HMK m. 184 ve HMK m. 186/1). Bu anlardan sonra yapılan ıslaha değer verilmez; muvafakat veya teminat bu zaman sınırını aşmaz.
  - soru: |
      Islah eden tarafın hâkimin takdir edeceği teminatı yatırması ile ilgili hangisi doğrudur?
    siklar:
      - "Teminat bir hafta içinde yatırılmazsa ıslah yapılmamış sayılır."
      - "Teminat bir ay içinde yatırılır; yatırılmazsa ıslah sonradan tamamlanır."
      - "Teminat yalnız karşı tarafın talebi hâlinde aranır."
      - "Teminat yatırılmazsa ıslah geçerli kalır ve borç olarak tahsil edilir."
    dogru: 0
    aciklama: |
      HMK m. 178/1'e göre ıslah eden taraf, geçersiz hâle gelen işlemlerin giderleri ile karşı tarafın uğradığı ve uğrayabileceği zararlar için hâkimin takdir edeceği teminatı bir hafta içinde yatırmak zorundadır; aksi hâlde ıslah yapılmamış sayılır.
  - soru: |
      Dava devam ederken davacı talebini ıslah etmiştir. Davalı Mehmet ıslahtan önce yapılan duruşmada davanın temelini oluşturan bir vakıayı ikrar etmişti. Ayrıca ıslahtan önce tanıklar dinlenmişti. Hangisi doğrudur?
    siklar:
      - "İkrar ve tanık ifadeleri ıslahla geçersiz kılınamaz."
      - "Islahla birlikte ikrar da geçersiz olur."
      - "Tanık ifadeleri ıslahla mutlaka geçersiz olur."
      - "İkrar yalnız karşı tarafın açık muvafakatiyle geçerliliğini korur."
    dogru: 0
    aciklama: |
      HMK m. 179/2'ye göre ikrar, tanık ifadeleri, bilirkişi rapor ve beyanları, keşif ve isticvap tutanakları ıslahla geçersiz kılınamaz. Islahın genel etkisi, teşmil edilen noktadan itibaren diğer usul işlemlerinin yapılmamış sayılmasıdır (HMK m. 179/1).
  - soru: |
      Davacı Ayşe davasını tamamen ıslah ettiğini bildirmiş, ancak bu bildirimden sonra bir hafta içinde yeni dava dilekçesi vermemiştir. Hangisi doğrudur?
    siklar:
      - "Islah hakkı kullanılmış sayılır ve ıslah hiç yapılmamış gibi davaya devam edilir."
      - "Dava açılmamış sayılır."
      - "Islah hakkı saklı kalır ve ıslah bir kez daha yapılabilir."
      - "Dava otomatik olarak düşer."
    dogru: 0
    aciklama: |
      HMK m. 180'e göre davasını tamamen ıslah ettiğini bildiren taraf bildirimden itibaren bir hafta içinde yeni dava dilekçesi vermek zorundadır; aksi hâlde ıslah hakkı kullanılmış sayılır ve ıslah hiç yapılmamış gibi davaya devam edilir. Dava açılmamış sayılmaz.
  - soru: |
      Ayşe, kısmi dava olarak açtığı alacak davasında, tahkikat sürerken talebini aynı davada bir defaya mahsus olarak artırmak istemektedir. Artırılan kısım için zamanaşımının kesilme tarihi bakımından 7589 sayılı Kanunla eklenen HMK m. 109/4'e göre hangisi doğrudur?
    siklar:
      - "Zamanaşımı artırılan kısım bakımından da dava tarihinden itibaren kesilmiş sayılır."
      - "Zamanaşımı yalnız artırma tarihinde kesilir."
      - "Zamanaşımı artırılan kısım için hiç kesilmez."
      - "Zamanaşımı yalnız hüküm tarihinde kesilir."
    dogru: 0
    aciklama: |
      HMK m. 109/4'e göre alacağın sadece bir kısmının dava edildiği durumlarda talep konusu, aynı davada bir defaya mahsus olmak üzere iddianın genişletilmesi yasağına tabi olmaksızın tahkikatın sona ermesine kadar artırılabilir; bu durumda zamanaşımı artırılan kısım bakımından da dava tarihinden itibaren kesilmiş sayılır.
  - soru: |
      Davacının dava dilekçesindeki alacak kalemleri doğrudur, ancak kalemlerin toplamı hesap hatası nedeniyle yanlış yazılmıştır. Hatayı fark eden davacı, sözlü yargılama sırasında düzeltme talep etmiştir. Hangisi doğrudur?
    siklar:
      - "Açık hesap hatası karar verilinceye kadar düzeltilebilir."
      - "Düzeltme yalnız tahkikat bitmeden önce yapılabilir."
      - "Düzeltme için ıslah yapılması zorunludur."
      - "Hesap hatası hiçbir şekilde düzeltilemez."
    dogru: 0
    aciklama: |
      HMK m. 183/1'e göre tarafların veya mahkemenin dava dosyasında bulunan belgelerdeki açık yazı ve hesap hataları karar verilinceye kadar düzeltilebilir. Bu, ıslahın zaman sınırına bağlı değildir.
  - soru: |
      Mahkeme, davalı X A.Ş.'nin temsilcisi Zeynep'in isticvabına karar vermiş, isticvap konusu vakıaları ve ikrar ihtarını içeren davetiye Zeynep'e bizzat gönderilmiştir. Zeynep geçerli bir özrü olmadan isticvap oturumuna gelmemiştir. Hangisi doğrudur?
    siklar:
      - "Sorulan vakıalar ikrar edilmiş sayılır."
      - "Dava davalı lehine reddedilir."
      - "Zeynep'in önceki beyanları geçersiz olur."
      - "Mahkeme isticvaptan vazgeçmek zorundadır."
    dogru: 0
    aciklama: |
      HMK m. 171/2'ye göre çağrılan taraf özürsüz olarak gelmezse veya gelip soruları cevapsız bırakırsa mahkemece sorulan vakıalar ikrar edilmiş sayılır. Tüzel kişi adına temsil yetkisine sahip kimse isticvap olunur (HMK m. 170/1) ve davetiye bizzat gönderilir (HMK m. 171/1).
  - soru: |
      Tüzel kişi bir şirketin isticvabına karar verilmiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Tüzel kişi adına temsil yetkisine sahip kimseler isticvap olunur."
      - "Şirketin tüm çalışanları isticvap olunur."
      - "Tüzel kişi isticvap edilemez."
      - "Şirketin avukatı isticvap edilir."
    dogru: 0
    aciklama: |
      HMK m. 170/1'e göre tüzel kişiler adına, temsil yetkisine sahip kimseler isticvap olunur. Çalışanların veya avukatın isticvabı kanunda öngörülmemiştir.
  - soru: |
      Yargıtayın bozma kararından sonra dosya ilk derece mahkemesine dönmüş, mahkeme bozma gereğince tanıkları yeniden dinlemek için duruşma açarak tahkikata ilişkin işlem yapmıştır. Davacı bu aşamada ıslah talep etmektedir. Hangisi doğrudur?
    siklar:
      - "Tahkikat sona erinceye kadar ıslah yapılabilir; ancak bozmaya uymakla ortaya çıkan hukuki durum ortadan kaldırılamaz."
      - "Bozmadan sonra hiçbir hâlde ıslah yapılamaz."
      - "Islah yalnız bozmaya uyulmasıyla doğan hukuki durumu değiştirmek için yapılabilir."
      - "Islah yalnız Yargıtayın izniyle yapılabilir."
    dogru: 0
    aciklama: |
      HMK m. 177/2'ye göre bozma veya kaldırma kararından sonra dosya ilk derece mahkemesine gönderildiğinde, mahkeme tahkikata ilişkin bir işlem yaparsa tahkikat sona erinceye kadar da ıslah yapılabilir; ancak bozma kararına uymakla ortaya çıkan hukuki durum ortadan kaldırılamaz.
  - soru: |
      Mahkeme, bir tarafın ıslah dilekçesini inceleyerek ıslahın davayı uzatmak amacıyla yapıldığını deliller ve belirtilerle anlamıştır. Hangisi doğrudur?
    siklar:
      - "Mahkeme ıslahı dikkate almadan karar verir ve ıslaha başvuranı disiplin para cezasına mahkûm eder."
      - "Islah geçerli sayılır, yalnız yargılama giderleri ayrıca hükmedilir."
      - "Mahkeme davayı açılmamış sayar."
      - "Mahkeme ıslah için ikinci bir hak tanır."
    dogru: 0
    aciklama: |
      HMK m. 182'ye göre ıslahın davayı uzatmak veya karşı tarafı rahatsız etmek gibi kötüniyetli düşüncelerle yapıldığı deliller veya belirtilerle anlaşılırsa mahkeme ıslahı dikkate almadan karar verir. Hâkim ayrıca kötüniyetle ıslaha başvuranı karşı tarafın zararlarını ödemeye ve kanundaki sınırlar içinde disiplin para cezasına mahkûm eder.
olaylar:
  - olay: |
      Ayşe, Mehmet'in sürücüsü olduğu aracın çarpması sonucu uğradığı zararın tazmini için Mehmet aleyhine "şimdilik 50.000 TL" talepli kısmi dava açmıştır. Tahkikat sürerken bilirkişi raporu zararı 400.000 TL olarak belirleyince Ayşe, talebini 400.000 TL'ye çıkararak ıslah etmiştir. Hâkim teminatı belirlemiş, Ayşe teminatı ıslahtan beş gün sonra mahkeme veznesine yatırmıştır.

      Ayşe ıslahtan önce, Mehmet'in duruşmada davanın temelini oluşturan bir vakıayı ikrar ettiği ve iki tanığın dinlendiği tutanaklarda yer almaktadır. Daha sonra Ayşe, dilekçesinde kalemlerin toplamını yanlış hesapladığını fark etmiş ve tahkikat bitmeden önce düzeltmek istemiştir. Tahkikat bittikten sonra ise Ayşe, tazminat miktarını yeniden artırmak üzere ikinci bir ıslah talebinde bulunmuştur.

      1. Ayşe'nin ıslahı hangi şartlarla geçerlidir, teminat konusunda sonuç nedir?
      2. Mehmet'in ikrarı ve tanık ifadeleri ıslahtan etkilenir mi?
      3. Hesap hatasının düzeltilmesi ıslah mıdır?
      4. İkinci ıslah talebinin akıbeti ne olur?
    olcut:
      - {tespit: "Taraflardan her biri usul işlemlerini kısmen veya tamamen ıslah edebilir; Ayşe'nin talebi ıslah yoluyla artırması kısmi ıslahtır", puan: 15, madde: "HMK m. 176/1"}
      - {tespit: "Teminat bir hafta içinde yatırıldığı için ıslah geçerlidir; bir haftayı aşsaydı ıslah yapılmamış sayılırdı", puan: 20, madde: "HMK m. 178/1"}
      - {tespit: "İkrar ve tanık ifadeleri ıslahla geçersiz kılınamaz", puan: 20, madde: "HMK m. 179/2"}
      - {tespit: "Açık hesap hatası karar verilinceye kadar düzeltilebilir ve ıslah hakkının kullanılmasını gerektirmez", puan: 15, madde: "HMK m. 183"}
      - {tespit: "Aynı davada ancak bir kez ıslah yapılabilir; ikinci ıslah geçersizdir", puan: 20, madde: "HMK m. 176/2"}
      - {tespit: "Tahkikat bittikten sonra ıslah yapılamaz", puan: 10, madde: "HMK m. 177/1"}
    cozum: |
      **Nitelendirme:** Olay, kısmi davada talebin ıslahla artırılması, ıslahın teminat, etki, sayı ve zaman bakımından denetimi ile maddi hata düzeltmesine ilişkindir.

      **Hukuki sorunlar:** (1) Islahın şartları ve teminatın zamanında yatırılması. (2) Islahtan önceki ikrar ve tanık ifadelerinin akıbeti. (3) Hesap hatasının hukuki niteliği. (4) İkinci ıslahın geçerliliği.

      **İlgili hükümler ve değerlendirme:** Taraflardan her biri yapmış olduğu usul işlemlerini kısmen veya tamamen ıslah edebilir (HMK m. 176/1). Ayşe'nin kısmi davada talebini artırması, tahkikat sürerken yapıldığı için zaman bakımından geçerlidir (HMK m. 177/1). Islah eden taraf, hâkimin takdir edeceği teminatı bir hafta içinde yatırmak zorundadır; aksi hâlde ıslah yapılmamış sayılır (HMK m. 178/1). Ayşe teminatı ıslahtan beş gün sonra, yani bir hafta içinde yatırdığı için ıslah geçerlidir.

      Islah, teşmil edilen noktadan itibaren usul işlemlerini yapılmamış sayar (HMK m. 179/1). Buna karşılık ikrar ve tanık ifadeleri ıslahla geçersiz kılınamaz (HMK m. 179/2). Bu nedenle Mehmet'in ikrarı ve iki tanığın ifadeleri ıslahtan sonra da geçerliliğini korur.

      Kalemlerin toplamındaki hata açık bir hesap hatasıdır. Açık yazı ve hesap hataları karar verilinceye kadar düzeltilebilir (HMK m. 183). Bu düzeltme ıslahın süre ve sayı sınırlarına bağlı olmadığı için Ayşe'nin ıslah hakkını kullanmasını gerektirmez.

      Aynı davada taraflar ancak bir kez ıslah yoluna başvurabilir (HMK m. 176/2). Ayşe birinci ıslah hakkını kullanmıştır; ayrıca tahkikat bittikten sonra ıslah yapılamaz (HMK m. 177/1). İkinci ıslah talebi bu iki nedenle geçersizdir. HMK m. 109/4'teki talep artırımı da ancak tahkikatın sona ermesine kadar yapılabildiği için bu yol da Ayşe'ye açık değildir.

      **Sonuç:** İlk ıslah geçerlidir; ikrar ve tanık ifadeleri korunur; hesap hatası ıslahsız düzeltilebilir; ikinci ıslah talebine değer verilmez.
  - olay: |
      Kaya A.Ş., Zeynep'e karşı açtığı alacak davasında, davanın temelini oluşturan vakıalar hakkında Zeynep'in isticvabını istemiştir. Mahkeme isticvaba karar vermiş; isticvap konusu vakıaları ve özürsüz gelmemenin ikrar sonucunu bildiren davetiye ise Zeynep'in vekiline tebliğ edilmiştir. Zeynep geçerli bir özrü olmaksızın isticvap oturumuna gelmemiştir. Kaya A.Ş. vekili, sorulan vakıaların ikrar edilmiş sayılmasını talep etmiştir.

      Davanın ilk derece mahkemesince verilen hükmü Yargıtayca bozulmuş, mahkeme bozmaya uymuş ve dosya ilk derece mahkemesine dönmüştür. Mahkeme tanıkların yeniden dinlenmesi için duruşma günü vermiş ve duruşma yapmıştır. Bunun üzerine davacı Kaya A.Ş., daha önce hiç ıslah yapmamış olduğundan, yeniden dinlenen tanık beyanları ışığında talebini artırmak üzere ıslah dilekçesi vermiştir. Ayrıca Kaya A.Ş., bozmaya uymakla ortaya çıkan hukuki durumu da ıslahla değiştirmek istemektedir.

      1. Zeynep'in gelmemesi sorulan vakıaların ikrar edilmiş sayılması sonucunu doğurur mu?
      2. Bozmadan sonra ıslah yapılabilir mi?
      3. Kaya A.Ş.'nin ıslahla bozmaya uymakla ortaya çıkan hukuki durumu değiştirme talebi sonuç doğurur mu?
    olcut:
      - {tespit: "İsticvabına karar verilen kimseye bizzat davetiye gönderilir; vekile tebliğ usulüne uygun davet değildir", puan: 30, madde: "HMK m. 171/1"}
      - {tespit: "İkrar sayılma sonucu, usulüne uygun çağrılan ve özürsüz gelmeyen veya cevapsız bırakan taraf için doğar; olayda doğmaz", puan: 20, madde: "HMK m. 171/2"}
      - {tespit: "Bozmadan sonra ilk derece mahkemesi tahkikata ilişkin işlem yaparsa tahkikat sona erinceye kadar ıslah yapılabilir", puan: 25, madde: "HMK m. 177/2"}
      - {tespit: "Bozmaya uymakla ortaya çıkan hukuki durum ıslahla ortadan kaldırılamaz", puan: 25, madde: "HMK m. 177/2"}
    cozum: |
      **Nitelendirme:** Olay iki ayrı usul meselesini içerir: isticvaba çağrılan tarafın gelmemesinin sonucu ve bozmadan sonra ıslahın sınırı.

      **Hukuki sorunlar:** (1) İsticvap davetiyesinin usulüne uygunluğu ve ikrar sayılma. (2) Bozmadan sonra ıslahın mümkünlüğü. (3) Bozmaya uymakla ortaya çıkan hukuki durumun ıslahla değiştirilip değiştirilemeyeceği.

      **İlgili hükümler ve değerlendirme:** Mahkeme taraflardan her birinin isticvabına karar verebilir (HMK m. 169/1). İsticvabına karar verilen kimseye **bizzat** davetiye gönderilir; davetiyede isticvap konusu vakıalar gösterilir ve ikrar ihtarı yapılır (HMK m. 171/1). Olayda davetiye Zeynep'in vekiline tebliğ edilmiştir; bu, kanunun aradığı bizzat davet değildir. Özürsüz gelmeyen veya soruları cevapsız bırakan tarafın sorulan vakıaları ikrar etmiş sayılması (HMK m. 171/2), usulüne uygun çağrılmış taraf için söz konusudur. Zeynep usulüne uygun çağrılmadığı için ikrar sayılma sonucu doğmaz. Ayrıca isticvap olunacak kimsenin bizzat gelmesi gerekir (HMK m. 172).

      Bozma kararından sonra dosya ilk derece mahkemesine gönderildiğinde, mahkeme tahkikata ilişkin bir işlem yaparsa tahkikat sona erinceye kadar ıslah yapılabilir (HMK m. 177/2). Olayda mahkeme tanıkların yeniden dinlenmesi için duruşma yapmıştır; bu, tahkikata ilişkin işlemdir ve ıslah yolu açıktır. Kaya A.Ş. daha önce ıslah yapmadığı için aynı davada ancak bir kez ıslah sınırı da aşılmamıştır (HMK m. 176/2).

      Ancak bozma kararına uymakla ortaya çıkan hukuki durum ortadan kaldırılamaz (HMK m. 177/2). Bu nedenle Kaya A.Ş.'nin ıslahla bozmaya uymakla oluşan durumu değiştirme talebi sonuç doğurmaz; ıslah bu sınır içinde, örneğin talebin artırılması bakımından geçerli olabilir.

      **Sonuç:** Davetiye bizzat gönderilmediği için ikrar sayılma sonucu doğmaz. Bozmadan sonra tahkikata devam edildiği için ıslah mümkündür; fakat bozmaya uymakla doğan hukuki durum ıslahla ortadan kaldırılamaz.
kartlar:
  - on: "Islahın tanımı nedir?"
    arka: "Tarafın yaptığı usul işlemini karşı tarafın muvafakatine bağlı olmadan kısmen veya tamamen düzeltmesidir (HMK m. 176/1)."
  - on: "Aynı davada kaç kez ıslah yapılabilir?"
    arka: "Taraflar ancak bir kez ıslah yoluna başvurabilir (HMK m. 176/2)."
  - on: "Islah hangi zamana kadar yapılabilir?"
    arka: "Tahkikatın sona ermesine kadar; sözlü ya da yazılı yapılabilir (HMK m. 177/1 ve m. 177/3)."
  - on: "Bozma sonrası ıslahın şartı nedir?"
    arka: "İlk derece mahkemesinin tahkikata ilişkin bir işlem yapması; bozmaya uymakla doğan hukuki durum ortadan kaldırılamaz (HMK m. 177/2)."
  - on: "Islah teminatı ne zaman yatırılır, yatırılmazsa ne olur?"
    arka: "Bir hafta içinde; yatırılmazsa ıslah yapılmamış sayılır (HMK m. 178/1)."
  - on: "Islahla geçersiz kılınamayan işlemler nelerdir?"
    arka: "İkrar, tanık ifadeleri, bilirkişi rapor ve beyanları, keşif ve isticvap tutanakları ile belirli yemin işlemleri (HMK m. 179/2)."
  - on: "Tam ıslahta bir haftalık süre nedir?"
    arka: "Bildirimden itibaren bir hafta içinde yeni dava dilekçesi verilmezse ıslah hakkı kullanılmış sayılır ve ıslah yapılmamış gibi devam edilir (HMK m. 180)."
  - on: "Kısmi ıslahta bir haftalık süre ne içindir?"
    arka: "Islah edilen usul işlemini yapmak içindir; yapılmazsa ıslah hiç yapılmamış gibi devam edilir (HMK m. 181)."
  - on: "Kötüniyetli ıslahın sonucu nedir?"
    arka: "Mahkeme ıslahı dikkate almadan karar verir; kötüniyetli taraf zararı ödemeye ve disiplin para cezasına mahkûm edilir (HMK m. 182)."
  - on: "Açık yazı ve hesap hataları ne zamana kadar düzeltilebilir?"
    arka: "Karar verilinceye kadar (HMK m. 183)."
  - on: "📌 HMK m. 109/4 neyi düzenler?"
    arka: "Kısmi davada talebin aynı davada bir defaya mahsus, genişletme yasağına tabi olmaksızın tahkikat sonuna kadar artırılmasını; zamanaşımı dava tarihinden itibaren kesilmiş sayılır."
  - on: "İsticvapta gelmemenin sonucu nedir?"
    arka: "Özürsüz gelmeyen veya soruları cevapsız bırakan taraf sorulan vakıaları ikrar etmiş sayılır; davetiye bizzat gönderilir (HMK m. 171)."
