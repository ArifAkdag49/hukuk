doktrin: |
  ### İhbar edilenin taraf yerine geçmesi

  TBK m. 215/1, satıcının alıcının yanında katılmasının yanında "alıcı yerine geçerek" davayı takip etmesinden söz eder. HMK m. 63 ise ihbar edilene yalnız yanında katılma imkânı tanır ve genel bir taraf değiştirme kuralı içermez. Baskın görüş, HMK sisteminde ihbar edilenin ihbar edenin yerine geçemeyeceğini, TBK'daki ifadenin ise usul hukuku bakımından bu sonucu doğurmadığını kabul eder. Karşı görüş maddi hukukun açık ifadesini daha geniş yorumlar. Sınavda HMK m. 63'ün metnine bağlı kal.

  ### Asli müdahalenin çekişmesiz yargıda uygulanması

  HMK m. 65 "bir yargılamanın konusu" ifadesini kullanır. Bir görüşe göre bu ifade çekişmesiz yargı işlerini de kapsar ve orada da hüküm verilinceye kadar asli müdahale mümkündür. Diğer görüş, çekişmesiz yargıda taraflara karşı dava açılmasının çekişmeli yargının mantığına uyduğunu ileri sürer. Bu soru sınavda kesin sonuç olarak sorulmamalı; ancak bilmek yararlıdır.

  ### Fer'î müdahilin kanun yoluna başvurması

  Yargıtay uygulamasında fer'î müdahilin, yanında katıldığı taraf kanun yoluna başvurmamışsa tek başına başvuramayacağı yönünde kararlar vardır (bkz. kararlar). Karşıt görüş, HMK m. 68/1'deki "aykırı olmayan her türlü usul işlemi" ifadesine dayanarak, asıl tarafın yalnızca sessiz kalması durumunda müdahilin başvurusunun incelenmesi gerektiğini savunur. Burada da sınavda tartışmalı bir noktayı kesin cevap olarak sunma.
sozluk:
  - terim: Davanın ihbarı
    tanim: "Davayı kaybederse üçüncü kişiye rücu edeceğini veya üçüncü kişinin ona rücu edeceğini düşünen tarafın, davayı üçüncü kişiye yazılı bildirmesi (HMK m. 61-62)."
  - terim: İhbarın tevali ettirilmesi
    tanim: "Dava kendisine ihbar edilen kişinin aynı şartlarda davayı bir başkasına ihbar etmesi (zincirleme ihbar, HMK m. 61/2)."
  - terim: Fer'î müdahale
    tanim: "Üçüncü kişinin davayı kazanmasında hukuki yararı bulunan taraf yanında ve ona yardımcı olmak amacıyla davaya katılması (HMK m. 66)."
  - terim: Fer'î müdahil
    tanim: "Yardımcı olarak katılan, taraf olmayan, hüküm kendisi hakkında verilmeyen üçüncü kişi (HMK m. 68-69)."
  - terim: Hukuki yarar
    tanim: "Davanın sonucunun üçüncü kişinin hukuki durumunu etkilemesi; fer'î müdahalenin şartı."
  - terim: Müdahale etkisi
    tanim: "Fer'î müdahilin (HMK m. 64 yoluyla ihbar edilenin) tarafla rücu ilişkisinde asıl davadaki karar hakkında yanlışlık iddiasını ileri sürememesi (HMK m. 69/2)."
  - terim: Asli müdahale
    tanim: "Yargılamanın konusu hak veya şey üzerinde hak iddia eden üçüncü kişinin, hüküm verilinceye kadar tarafların ikisine karşı aynı mahkemede dava açması (HMK m. 65)."
  - terim: Asli müdahil
    tanim: "Kendi hakkı için dava açan, açtığı davanın davacısı olan üçüncü kişi."
  - terim: Tahkikat
    tanim: "Delillerin toplandığı ve ortaya konulduğu yargılama aşaması; ihbar ve fer'î müdahalenin zaman sınırı."
  - terim: Müdahale gideri
    tanim: "Fer'î müdahale nedeniyle doğan yargılama gideri; yanında katılınan taraf haksız çıkarsa müdahile yüklenir (HMK m. 328)."
kararlar:
  - id: "1227848500"
    ozet: |
      Üç mirasçı, annelerinin muvazaalı temlik yaptığını ileri sürerek kendi miras payları oranında tapu iptali ve tescil davası açmıştı. Dava uzun süre görüldükten sonra bir başka mirasçı, harçlandırdığı bir dilekçeyle aynı davaya kendi payı için katılmak istedi. Bölge adliye mahkemesi bu talebi asli müdahale olarak kabul etmedi. Hukuk Genel Kurulu, asli müdahalenin yargılamanın konusu hak veya şey üzerinde hak iddia eden üçüncü kişinin hüküm verilinceye kadar yargılamanın taraflarına karşı dava açması olduğunu, bu davanın ilk davanın davacısına ve davalısına birlikte yöneltilmesi gerektiğini belirtti. Mirasçının yalnız kendi payına yönelik talebinin, diğer mirasçıların dava konusu ettiği paylar üzerinde hak iddiası içermediğini, bu nedenle asli müdahale davasının usulüne uygun açıldığından söz edilemeyeceğini kabul etti. Direnme kararını oy çokluğuyla onadı; mirasçının kendi payı için ayrı dava açabileceğini ve davaların birleştirilmesinin mümkün olduğunu da vurguladı.
  - id: "1231262700"
    ozet: |
      Davacı, satın aldığı araca change olduğu gerekçesiyle el konulması üzerine satıcının mirasçılarına karşı zapta karşı tekeffül hükümlerine dayanarak 5.000 TL için dava açtı. Davalılar, aracın tescilinde denetim yapmadığını ileri sürdükleri idareye davanın ihbarını talep etti. Bölge adliye mahkemesi kararına karşı ihbar olunan idare de temyiz başvurusunda bulundu. Yargıtay 3. Hukuk Dairesi, davanın ihbarının ihbar olunanı davanın tarafı hâline getirmediğini, hakkında hüküm kurulmayan ihbar olunanın temyiz hakkı bulunmadığını belirterek ihbar olunanın temyiz dilekçesini reddetti. Esas bakımından ise alıcının zapt tarihindeki gerçek ve güncel zararını isteyebileceği gerekçesiyle karar bozuldu. Bozma oy çokluğuyla verilmiştir; karşı oy, zararın satış bedeli üzerinden belirlenmesi gerektiği yönündedir.
  - id: "1223367000"
    ozet: |
      Davacı ortak, anonim şirketin organ eksikliği nedeniyle feshini ve kayyım atanmasını istedi. Davalı şirket yanında fer'î müdahil olarak yer alan kişi, ilk derece mahkemesinin feshe ilişkin hükmünü istinaf etti; şirketin kendisi ise hükmü istinaf etmemişti. Bölge adliye mahkemesi, fer'î müdahilin yanında katıldığı taraf istinaf etmediği için tek başına istinaf hakkı bulunmadığı gerekçesiyle başvuruyu usulden reddetti. Yargıtay 11. Hukuk Dairesi, fer'î müdahilin temyiz itirazlarını reddetti ve bölge adliye mahkemesi kararını onadı. Kararda ayrıca, ilk kararı istinaf etmeyen tarafın istinafın reddi üzerine bölge adliye mahkemesi kararını temyiz edemeyeceği vurgulandı. Karar, fer'î müdahilin kanun yolundaki konumunun yardımcılık niteliğine bağlı olduğunu gösterir; ancak bu konu doktrinde tartışmalıdır.
sorular:
  - soru: |
      Aşağıdakilerden hangisi davanın ihbarı, fer'î müdahale ve asli müdahale bakımından zaman sınırlarını doğru gösterir?
    siklar:
      - "İhbar ve fer'î müdahale tahkikat sona erinceye kadar, asli müdahale hüküm verilinceye kadar yapılabilir."
      - "Üçü de hüküm verilinceye kadar yapılabilir."
      - "İhbar hüküm verilinceye kadar, fer'î müdahale ve asli müdahale tahkikat sona erinceye kadar yapılabilir."
      - "Üçü de dava açıldıktan sonraki ilk duruşmaya kadar yapılabilir."
    dogru: 0
    aciklama: |
      Davanın ihbarı tahkikat sonuçlanıncaya kadar (HMK m. 61/1), fer'î müdahale tahkikat sona erinceye kadar (HMK m. 66), asli müdahale ise hüküm verilinceye kadar (HMK m. 65/1) yapılabilir. Yaygın yanılgı, asli müdahalenin de tahkikat sonunda biteceğini düşünmektir.
  - soru: |
      HMK m. 61/1 uyarınca davanın ihbarı bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yalnız davalı ihbar edebilir."
      - "Taraflardan biri, davayı kaybettiği takdirde üçüncü kişiye veya üçüncü kişinin kendisine rücu edeceğini düşünüyorsa ihbar edebilir."
      - "İhbar için üçüncü kişinin rızası gerekir."
      - "İhbar yalnız kanun yollarında yapılabilir."
    dogru: 1
    aciklama: |
      HMK m. 61/1 "taraflardan biri" ifadesini kullanır; davacı da davalı da ihbar edebilir. Şart, davayı kaybettiği takdirde rücu ilişkisinin bulunmasıdır. Üçüncü kişinin rızası aranmaz ve ihbar tahkikat sonuna kadar yapılır.
  - soru: |
      HMK m. 62 uyarınca davanın ihbarı bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İhbar sözlü yapılabilir."
      - "İhbar yazılı yapılır; sebep gerekçeleriyle birlikte açıklanır ve yargılamanın hangi aşamada bulunduğu belirtilir."
      - "İhbar nedeniyle yargılama mutlaka ertelenir."
      - "İhbar için mahkemenin onayı şarttır."
    dogru: 1
    aciklama: |
      HMK m. 62/1: ihbar yazılı yapılır, ihbar sebebi gerekçeleriyle açıklanır ve yargılamanın hangi aşamada bulunduğu belirtilir. HMK m. 62/2'ye göre ihbar nedeniyle yargılama başka güne bırakılamaz; tevali gibi zorunlu durumlar dışında süre verilemez.
  - soru: |
      Ali, tabloyu galerici Gül'den satın almıştır. Mehmet tablonun kendisine ait olduğunu ileri sürerek Ali aleyhine dava açmıştır. Ali, tahkikat sürerken davayı Gül'e usulüne uygun ihbar etmiş, Gül davaya katılmamıştır. Ali davayı kaybedip Gül'e rücu davası açmıştır. Gül'ün rücu davasındaki durumu hangisidir?
    siklar:
      - "Gül, asıl davadaki kararın yanlış verildiğini hiçbir şekilde ileri süremez."
      - "Gül, ihbar nedeniyle taraf olduğundan rücu davasında asıl dava kararına her zaman itiraz edebilir."
      - "Gül, katılmadığı için ihbar hiçbir etki doğurmaz."
      - "Gül, ancak kanunda sayılan sınırlı istisnalardan birini ileri sürerek Ali'nin yargılamayı hatalı yürüttüğünü savunabilir."
    dogru: 3
    aciklama: |
      İhbar edilen davada verilen hükmün ihbar eden kişiye etkisi hakkında HMK m. 69/2 kıyasen uygulanır (HMK m. 64). Bu nedenle Gül, asıl davadaki uyuşmazlık hakkında yanlış karar verildiği iddiasını ileri süremez; ancak geç ihbar, imkânların kullanılmasının engellenmesi veya bilinmeyen imkânların ağır kusurla kullanılamaması gibi istisnalardan birini ileri sürerek Ali'nin yargılamayı hatalı yürüttüğünü savunabilir. Bu yüzden "hiçbir şekilde ileri süremez" ifadesi fazla mutlaktır.
  - soru: |
      HMK m. 63'e göre dava kendisine ihbar edilen kişi bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Kendiliğinden fer'î müdahil olur."
      - "İhbar edenin yerine geçerek davayı takip eder."
      - "Davayı kazanmasında hukuki yararı olan taraf yanında davaya katılabilir."
      - "Davanın tarafı hâline gelir."
    dogru: 2
    aciklama: |
      HMK m. 63: dava kendisine ihbar edilen kişi, davayı kazanmasında hukuki yararı olan taraf yanında davaya katılabilir. İhbar tek başına onu taraf veya müdahil yapmaz; katılırsa fer'î müdahil olur. Usulde ihbar edenin yerine geçme kuralı bu maddede yoktur.
  - soru: |
      Ali'nin Mehmet'e açtığı taşınır teslimi davasında tahkikat tamamlanmış ve sözlü yargılamaya geçilmiştir; hüküm henüz verilmemiştir. Zeynep, dava konusu şeyin gerçek malikinin kendisi olduğunu ileri sürmektedir. Zeynep'in başvurabileceği yol hangisidir?
    siklar:
      - "Fer'î müdahale; ancak tahkikat bittiği için başvuramaz."
      - "Davanın ihbarı."
      - "Asli müdahale; hüküm verilinceye kadar Ali ve Mehmet'e karşı aynı mahkemede dava açabilir."
      - "Yalnızca Ali'nin yanında fer'î müdahil olabilir."
    dogru: 2
    aciklama: |
      Yargılamanın konusu olan şey üzerinde tamamen hak iddia eden üçüncü kişi, hüküm verilinceye kadar yargılamanın taraflarına karşı aynı mahkemede dava açabilir (HMK m. 65/1). Zeynep'in iddiası her iki tarafı dışladığından fer'î müdahale değil asli müdahale söz konusudur ve tahkikatın bitmiş olması engel değildir.
  - soru: |
      Asli müdahale bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Asli müdahil taraflardan birinin yanında yardımcı olarak yer alır."
      - "Asli müdahale davası asıl yargılamanın taraflarına karşı açılır ve asıl yargılama ile birlikte yürütülüp karara bağlanır."
      - "Asli müdahale davası yalnız davalıya karşı açılır."
      - "Asli müdahale ancak tahkikat sona ermeden yapılabilir."
    dogru: 1
    aciklama: |
      HMK m. 65/1'e göre üçüncü kişi yargılamanın taraflarına karşı dava açar; HMK m. 65/2'ye göre asli müdahale davası ile asıl yargılama birlikte yürütülür ve karara bağlanır. Taraflardan birinin yanında yardımcı olarak yer almak fer'î müdahaledir.
  - soru: |
      Hasan Ltd. aleyhine açılan davada alt yüklenici A Ltd., Hasan Ltd.'nin kaybı hâlinde kendisine rücu edileceğini ileri sürerek Hasan Ltd.'nin yanında davaya katılmak istemektedir. Tahkikat sona ermiş ve duruşma bitmeden bu talep sunulmuştur. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Fer'î müdahale talebi hüküm verilinceye kadar yapılabilir."
      - "Fer'î müdahale için tahkikat sona erinceye kadar başvurulabileceğinden talep artık kabul edilemez."
      - "A Ltd. asli müdahil olarak katılır."
      - "Mahkeme müdahale talebini hiçbir şekilde karara bağlamaz."
    dogru: 1
    aciklama: |
      Fer'î müdahale, tahkikat sona erinceye kadar yapılabilir (HMK m. 66). Tahkikat sona erdiğine göre talep zamanında değildir. A Ltd.'nin hukuki yararı bulunsa bile zaman şartı gerçekleşmemiştir. Asli müdahale ise bağımsız hak iddiası gerektirir; burada bu yoktur.
  - soru: |
      HMK m. 68 uyarınca fer'î müdahil bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yanında katıldığı tarafın işlem ve açıklamalarına aykırı olmayan her türlü usul işlemini yapabilir."
      - "Yanında katıldığı tarafa aykırı olsa bile her işlemi yapabilir."
      - "Davayı en baştan itibaren yeniden başlatabilir."
      - "Davanın tarafı olur ve hüküm kendisi hakkında verilir."
    dogru: 0
    aciklama: |
      HMK m. 68/1: müdahil davayı ancak bulunduğu noktadan itibaren takip edebilir; yanında katıldığı tarafın yararına olan iddia veya savunma vasıtalarını ileri sürebilir ve onun işlem ve açıklamalarına aykırı olmayan her türlü usul işlemini yapabilir. Hüküm taraflar hakkında verilir (HMK m. 69/1).
  - soru: |
      Fer'î müdahale giderine ilişkin HMK m. 328 bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Fer'î müdahil, yanında katıldığı taraf haksız çıkarsa yalnızca fer'î müdahale giderinden sorumlu tutulur."
      - "Fer'î müdahil asıl davanın bütün yargılama giderinden sorumlu olur."
      - "Fer'î müdahale gideri her durumda diğer tarafa yüklenir."
      - "Fer'î müdahil hiçbir gider ödemez."
    dogru: 0
    aciklama: |
      HMK m. 328: fer'î müdahil olarak davada yer alan kimse, yanında katıldığı taraf haksız çıkarsa yalnızca fer'î müdahale giderinden sorumlu tutulur; aksi hâlde bu giderler diğer tarafa yükletilir. Lehine hüküm verilen tarafın hâl ve davranışı katılmayı gerektirmişse giderin bir kısmı veya tamamı o tarafa yükletilebilir.
  - soru: |
      Bir derneğin amacının sonradan kanuna aykırı hâle geldiği ileri sürülmektedir. Bu durumda Cumhuriyet savcısının konumu bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Savcı hiçbir hâlde hukuk davasında yer alamaz."
      - "Kanunda açıkça öngörüldüğü için savcının istemi üzerine mahkeme derneğin feshine karar verebilir; savcı davada taraf olarak yer alır."
      - "Savcı yalnız dernek aleyhine ihbar edilir."
      - "Savcı ancak dernek üyelerinin yanında fer'î müdahil olarak katılabilir."
    dogru: 1
    aciklama: |
      Derneğin amacı kanuna veya ahlâka aykırı hâle gelirse Cumhuriyet savcısının veya bir ilgilinin istemi üzerine mahkeme derneğin feshine karar verir (TMK m. 89). HMK m. 70/1'e göre savcı, kanunda açıkça öngörülen hâllerde hukuk davası açar veya açılmış hukuk davasında taraf olarak yer alır.
  - soru: |
      HMK m. 70/3'e göre Cumhuriyet savcısının yer aldığı dava ve işler bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Taraflar bu dava ve işler üzerinde serbestçe tasarruf edemezler."
      - "Taraflar yine de serbestçe feragat ve sulh yapabilir."
      - "Savcı davada yalnızca gözlemcidir."
      - "Savcının katıldığı dava otomatik olarak ihtiyari dava arkadaşlığına dönüşür."
    dogru: 0
    aciklama: |
      HMK m. 70/3: Cumhuriyet savcısının yer aldığı dava ve işler üzerinde taraflar serbestçe tasarruf edemezler. Bu, davanın kamu yararıyla ilgili yönünün korunmasını amaçlar.
olaylar:
  - olay: |
      Ali Kaya, antika bir resmi galerici Gül Er'den satın almıştır. Resmin gerçek sahibinin kendisi olduğunu ileri süren Mehmet Akın, resmin teslimi için Ali aleyhine Asliye Hukuk Mahkemesinde dava açmıştır. Ali, davayı kaybederse Gül'e rücu edeceğini düşünerek tahkikat sürerken yazılı bir dilekçeyle, ihbar sebebini ve yargılamanın aşamasını göstererek davayı Gül'e ihbar etmiştir. Gül davaya katılmamıştır.

      Tahkikat tamamlanıp sözlü yargılamaya geçildiği sırada, hüküm henüz verilmeden, üçüncü kişi Zeynep Ak, resmin gerçek sahibinin ne Mehmet ne de Ali olduğunu, kendisi olduğunu ileri sürerek resmin kendisine verilmesini talep etmiştir. Mahkeme Mehmet lehine karar vermiştir. Ali kararı istinaf etmemiş, ancak Gül hükmü öğrenince tek başına istinaf dilekçesi vermiştir. Daha sonra Ali, Gül'e rücu davası açmış; Gül, "ilk mahkeme delilleri yanlış değerlendirdi, karar hatalıdır" savunmasında bulunmuştur.

      1. Ali'nin ihbarını şekil ve zaman bakımından değerlendiriniz.
      2. Gül'ün davaya katılmamasının sonucunu açıklayınız.
      3. Zeynep'in talebinin niteliğini ve hukuki yolunu belirleyiniz.
      4. Gül'ün yaptığı istinaf başvurusunun durumunu değerlendiriniz.
      5. Gül'ün rücu davasındaki savunmasını değerlendiriniz.
    olcut:
      - {tespit: "İhbarın şartları, yazılı olması, gerekçe ve aşamanın belirtilmesi, tahkikat sonuna kadar yapılması", puan: 20, madde: "HMK m. 61"}
      - {tespit: "İhbar edilenin davaya katılmak zorunda olmaması; ihbar tek başına taraf yapmaz", puan: 15, madde: "HMK m. 63"}
      - {tespit: "Zeynep'in asli müdahalesi: hüküm verilinceye kadar, her iki tarafa karşı dava", puan: 25, madde: "HMK m. 65"}
      - {tespit: "Gül'ün istinaf başvurusu: hüküm taraflar hakkında verilir, ihbar edilen taraf değildir", puan: 20, madde: "HMK m. 69"}
      - {tespit: "Müdahale etkisi: rücu davasında asıl davadaki karar hakkında yanlışlık iddiasının dinlenmemesi ve istisnalar", puan: 20, madde: "HMK m. 64"}
    cozum: |
      **Nitelendirme:** Ali, davayı kaybederse satıcısı Gül'e rücu edebileceğini düşündüğü için davanın ihbarı yoluna gitmiştir. Zeynep ise dava konusu şey üzerinde bağımsız hak iddia eden üçüncü kişi olarak asli müdahale konumundadır. Gül, ihbar edilen olarak davaya katılmamıştır.

      **Hukuki sorunlar:** (1) İhbar geçerli midir? (2) Gül katılmazsa ne olur? (3) Zeynep ne yapabilir? (4) Gül istinaf edebilir mi? (5) Rücu davasında savunma dinlenir mi?

      **İlgili hükümler ve değerlendirme:** Taraflardan biri davayı kaybettiği takdirde üçüncü kişiye veya üçüncü kişinin kendisine rücu edeceğini düşünüyorsa tahkikat sonuçlanıncaya kadar davayı ihbar edebilir (HMK m. 61/1). Ali tahkikat sürerken, yazılı olarak, ihbar sebebini ve yargılamanın aşamasını göstererek ihbarda bulunduğundan HMK m. 62/1'in şekil şartlarını karşılamıştır. Maddi hukuk bakımından da satılanın elinden alınması tehlikesiyle karşılaşan alıcının davayı satıcıya bildirmesi öngörülmüş, elverişli zamanda yapılan bildirmenin alıcı aleyhine verilen hükmün satıcı için sonuç doğurmasına yol açabileceği belirtilmiştir (TBK m. 215).

      Dava kendisine ihbar edilen kişi, davayı kazanmasında hukuki yararı olan taraf yanında davaya katılabilir (HMK m. 63). Katılmak bir **imkândır**, zorunluluk değildir; Gül'ün katılmaması ihbarı geçersiz kılmaz. İhbar edilen davada verilen hükmün ihbar eden kişiye etkisi hakkında HMK m. 69/2 kıyasen uygulanır (HMK m. 64). Dolayısıyla Gül, katılmamış olsa da müdahale etkisine tabi olur.

      Zeynep resmin tamamı üzerinde kendi hakkını ileri sürdüğü için fer'î müdahil gibi bir tarafa yardımcı olmak istememektedir; kendi bağımsız hakkını iddia etmektedir. Bu, **asli müdahaledir**. Asli müdahale hüküm verilinceye kadar yapılabildiğinden (HMK m. 65/1), tahkikatın bitmiş olması engel değildir. Zeynep, Ali ve Mehmet'e karşı aynı mahkemede dava açar; bu dava ile asıl yargılama birlikte yürütülür ve karara bağlanır (HMK m. 65/2).

      Müdahilin de yer aldığı davada hüküm taraflar hakkında verilir (HMK m. 69/1). Gül hakkında hüküm kurulmamıştır; ihbar olunan taraf da değildir. Ali de hükmü istinaf etmediği için Gül'ün tek başına istinafı usulden reddedilecektir (Yargıtay uygulaması bu yöndedir; bkz. kararlar). Gül'ün rücu davasındaki "karar hatalıdır" savunması ise HMK m. 69/2'ye göre dinlenmez. Gül ancak sınırlı üç hâlden birini ileri sürebilir: zamanında ihbar yapılmadığı için geç katılma; Ali'nin iddia ve savunma imkânlarını kullanmasını engellemesi; kendisince bilinmeyen imkânların Ali'nin ağır kusuruyla kullanılmaması. Olayda ihbar tahkikat sürerken yapılmıştır; bu istisnaların varlığına dair bir bilgi yoktur.

      **Sonuç:** İhbar geçerlidir. Gül davaya katılmamakla ihbarın etkisinden kurtulmaz. Zeynep asli müdahale davası açabilir. Gül'ün istinafı usulden reddedilir. Gül'ün rücu davasındaki genel savunması dinlenmez; yalnız kanunda sayılan sınırlı istisnalar ileri sürülebilir.
  - olay: |
      Güneş Kültür ve Dayanışma Derneği'nin amacının sonradan kanuna aykırı hâle geldiği iddiasıyla Cumhuriyet savcısı, derneğin feshi için dava açmıştır. Dava devam ederken dernek yönetim kurulu başkanı Hasan Er, davayı kabul etmek ve sulh olmak istediğini bildirmiştir.

      Aynı ilde Zeynep Ak, evlendiği Ali Kaya'nın evlenme sırasında kanunun mutlak butlan sebebi saydığı bir engel bulunduğunu (olayda bu sebebin varlığı kabul edilmektedir) öğrenmiş ve evlenmenin mutlak butlanı için dava açmıştır. Cumhuriyet savcısı da bu davada yer almak istemektedir. Taraflardan Ali Kaya, "Cumhuriyet savcısının hukuk davasında yeri yoktur" demektedir. Ayrıca bir resmî daire, mutlak butlan nedenini savcılığa bildirmiş, ancak savcı dava açmamıştır.

      1. Cumhuriyet savcısının dernek feshi davasındaki durumunu belirleyiniz.
      2. Hasan Er'in davayı kabul ve sulh yoluyla sona erdirme isteminin sonucunu açıklayınız.
      3. Mutlak butlan davasında savcının yer alma yetkisini ve Ali Kaya'nın itirazını değerlendiriniz.
      4. Savcının dava açmaması hâlinde ihbar eden resmî dairenin başvurabileceği yolu belirtiniz.
    olcut:
      - {tespit: "Savcının kanunda açıkça öngörülen hâllerde dava açabilmesi ve taraf olarak yer alması; derneğin feshinde savcının istemi", puan: 25, madde: "HMK m. 70"}
      - {tespit: "Derneğin feshi davasında kanuni dayanak: amacın kanuna aykırı hâle gelmesi ve savcının istemi", puan: 15, madde: "TMK m. 89"}
      - {tespit: "Savcının yer aldığı davada tarafların kabul ve sulh yoluyla serbestçe tasarruf edememesi", puan: 25, madde: "HMK m. 70"}
      - {tespit: "Mutlak butlan davasının savcı tarafından re'sen açılması ve ilgisi olan herkesin de açabilmesi", puan: 20, madde: "TMK m. 146"}
      - {tespit: "Resmî dairenin bildirimine rağmen savcı dava açmazsa itiraz yolu", puan: 15, madde: "HMK m. 70"}
    cozum: |
      **Nitelendirma:** Her iki olayda da kamu yararı bakımından Cumhuriyet savcısının hukuk davasına katılması gündemdedir. Birinci olayda savcı kanunun öngördüğü şekilde dava açan taraftır; ikinci olayda mutlak butlan davası bakımından savcının re'sen dava açma yetkisi ve ilgililerin dava hakkı söz konusudur.

      **Hukuki sorunlar:** (1) Savcının yetkisinin dayanağı nedir? (2) Taraflar kabul ve sulh yoluyla davayı sona erdirebilir mi? (3) Mutlak butlan davasında savcının yeri var mıdır? (4) Savcı dava açmazsa resmî daire ne yapabilir?

      **İlgili hükümler ve değerlendirme:** Cumhuriyet savcısı, kanunda açıkça öngörülen hâllerde hukuk davası açar veya açılmış hukuk davasında taraf olarak yer alır (HMK m. 70/1). Derneğin amacı kanuna veya ahlâka aykırı hâle gelirse Cumhuriyet savcısının veya bir ilgilinin istemi üzerine mahkeme derneğin feshine karar verir (TMK m. 89). Bu hüküm savcıya açıkça dava yetkisi tanıdığından savcının dernek feshi davasındaki konumu HMK m. 70/1'e uygundur ve savcı davada taraftır.

      Cumhuriyet savcısının yer aldığı dava ve işler üzerinde taraflar serbestçe tasarruf edemezler (HMK m. 70/3). Bu nedenle Hasan Er, dernek adına davayı kabul ederek veya sulh olarak davayı kendi iradesiyle sonuçlandıramaz; mahkeme savcının katıldığı davada tarafların serbest tasarrufuna dayalı bir sonucu doğrudan kabul etmez.

      Mutlak butlan davası Cumhuriyet savcısı tarafından re'sen açılır ve ilgisi olan herkes tarafından da açılabilir (TMK m. 146). Bu hüküm kanunda açıkça öngörülmüş bir savcı yetkisidir; dolayısıyla Ali Kaya'nın "savcının hukuk davasında yeri yoktur" itirazı yerinde değildir. Zeynep'in dava hakkı da saklıdır ve savcı, açılmış davada taraf olarak yer alabilir (HMK m. 70/1).

      Resmî daire savcılığa bildirimde bulunmuş, savcı dava açmamıştır. Bu durumda ihbar eden resmî daire, savcının yargı çevresinde görev yaptığı ağır ceza merkezine en yakın kıdemli asliye hukuk mahkemesi hâkimine itiraz edebilir; Ceza Muhakemesi Kanununun 172 ve 173 üncü maddeleri kıyasen uygulanır (HMK m. 70/2).

      **Sonuç:** Savcı dernek feshi davasında kanuna dayanarak taraftır. Hasan Er'in kabul ve sulh yoluyla serbestçe tasarruf yetkisi yoktur. Ali Kaya'nın itirazı yerinde değildir; savcı mutlak butlan davası açabilir ve açılmış davada yer alabilir. Savcı dava açmazsa resmî daire HMK m. 70/2'deki itiraz yoluna başvurabilir.
kartlar:
  - on: "Davanın ihbarı ne zamana kadar yapılabilir (HMK m. 61/1)?"
    arka: "Tahkikat sonuçlanıncaya kadar."
  - on: "Davanın ihbarını kim, hangi şartla yapar?"
    arka: "Taraflardan biri; davayı kaybederse üçüncü kişiye veya üçüncü kişinin kendisine rücu edeceğini düşünüyorsa (HMK m. 61/1)."
  - on: "Davanın ihbarının şekli (HMK m. 62)?"
    arka: "Yazılıdır; sebep gerekçeleriyle birlikte açıklanır ve yargılamanın aşaması belirtilir. İhbar nedeniyle yargılama ertelenmez."
  - on: "İhbar edilen kişi (HMK m. 63) ne yapabilir?"
    arka: "Davayı kazanmasında hukuki yararı olan taraf yanında davaya katılabilir; ihbar tek başına onu taraf yapmaz."
  - on: "İhbarın etkisi hangi maddeye atıf yapar (HMK m. 64)?"
    arka: "HMK m. 69/2'ye (müdahale etkisi) kıyasen atıf yapar."
  - on: "Fer'î müdahalenin şartı ve zaman sınırı (HMK m. 66)?"
    arka: "Davayı kazanmasında hukuki yarar; tahkikat sona erinceye kadar."
  - on: "Fer'î müdahil taraf mıdır?"
    arka: "Hayır; yardımcıdır. Hüküm taraflar hakkında verilir (HMK m. 69/1)."
  - on: "Müdahale etkisinin üç istisnası (HMK m. 69/2)?"
    arka: "Geç ihbar nedeniyle geç katılma; iddia ve savunma imkânlarının kullanılmasının engellenmesi; kendisince bilinmeyen imkânların tarafın ağır kusuruyla kullanılamaması."
  - on: "Asli müdahale ne zamana kadar yapılır (HMK m. 65/1)?"
    arka: "Hüküm verilinceye kadar; yargılamanın taraflarına (her ikisine) karşı aynı mahkemede dava açılır."
  - on: "Asli ve fer'î müdahale arasındaki temel fark?"
    arka: "Asli müdahale bağımsız bir davadır (kendi hakkını iddia); fer'î müdahale bir tarafa yardımcı olarak katılmadır (hukuki yarar)."
  - on: "Fer'î müdahale giderini kim öder (HMK m. 328)?"
    arka: "Yanında katıldığı taraf haksız çıkarsa müdahil yalnızca fer'î müdahale giderinden sorumlu olur; aksi hâlde giderler diğer tarafa yüklenir."
  - on: "Cumhuriyet savcısı hukuk davasına ne zaman katılır (HMK m. 70)?"
    arka: "Kanunda açıkça öngörülen hâllerde dava açar veya taraf olarak yer alır; yer aldığı davada taraflar serbestçe tasarruf edemez."
