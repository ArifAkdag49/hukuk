  - 📌 Görevli mahkeme sulh hukuk (HMK m. 383); yetkili mahkeme talep edenin veya ilgililerden birinin oturduğu yer (HMK m. 384).
  - 📌 Çekişmesiz yargı kararları kural olarak maddi anlamda kesin hüküm oluşturmaz (HMK m. 388).
  - 📌 Çekişmesiz yargıda istinaf süresi öğrenmeden itibaren iki hafta (HMK m. 387); temyiz yolu kapalı (HMK m. 362/1-ç).
  - ⚠️ Tevdi mahalli gibi ivedi işlerde Yargıtay, talebin karşı tarafa tebliğ edilmeden karara bağlanmasını dinlenilme hakkının ihlali saymamıştır; bunu tüm çekişmesiz yargı işlerine genişletme.
  - 📌 İç tahkim yabancılık unsuru taşımayan ve tahkim yeri Türkiye olan uyuşmazlıklara uygulanır (HMK m. 407).
  - 📌 Taşınmaz üzerindeki ayni haklar ve iradeye tabi olmayan işler tahkime elverişli değildir (HMK m. 408).
  - 📌 Tahkim sözleşmesi yazılı yapılır; cevap dilekçesinde itiraz edilmeyen tahkim iddiası da yazılı şekli tamamlar (HMK m. 412/3).
  - ⚠️ Asıl sözleşmenin geçersizliği, tahkim sözleşmesine karşı ileri sürülemez; hakemin asıl sözleşmenin hükümsüzlüğüne karar vermesi tahkim sözleşmesini kendiliğinden ortadan kaldırmaz (HMK m. 412/4 ve HMK m. 422/1).
  - 📌 Tahkim itirazı bir ilk itirazdır; cevap dilekçesinde ileri sürülür, kabulünde dava usulden reddedilir (HMK m. 413/1 ve HMK m. 117/1).
  - 📌 Hakem sayısı tek olmalı, belirlenmemişse üç; kurulda en az biri beş yıl ve daha fazla kıdemli hukukçu (HMK m. 415 ve HMK m. 416/1-d).
  - 📌 Hakemi reddetme: öğrenmeden itibaren iki hafta (HMK m. 418/2).
  - 📌 Tahkim süresi bir yıl; hakemin seçildiği veya kurulun ilk toplantı tutanağının düzenlendiği tarihten başlar (HMK m. 427/1).
  - 📌 İptal davası: tahkim yeri bölge adliye mahkemesi, bildirimden itibaren bir ay, icrayı kendiliğinden durdurmaz (HMK m. 439/1 ve HMK m. 439/4).
doktrin: |
  ### Çekişmesiz yargının sınırı
  Çekişmesiz yargı ile çekişmeli yargı arasındaki sınır, karşı tarafın varlığına ve uyuşmazlığın gerçekten bulunup bulunmadığına göre çizilir. Bir görüşe göre kanunun saydığı işler çekişmesiz yargının "çekirdek" kümesidir, kanunda ayrıca öngörülen diğer işler de bu kümeye katılır. Karşı görüş, listedeki bazı işlerde fiilen tarafların bulunduğuna ve bu nedenle dinlenilme hakkının gözetilmesi gerektiğine dikkat çeker. Uygulamada ivedilik ile dinlenilme hakkının dengesi, işin niteliğine göre kurulur.

  ### Tahkim şartının süresi biten sözleşmeden sonra durumu
  Belirli süreli sözleşmenin süresi dolduktan sonra taraflar ilişkiyi fiilen sürdürürse, sözleşmedeki tahkim şartının da yaşamaya devam edip etmediği tartışmalıdır. Bir yaklaşım, tahkim sözleşmesinin ayrı bir sözleşme olduğunu ve devlet yargısının istisnasının ancak açık, kesin iradeyle kurulabileceğini vurgular. Karşı yaklaşım, taraflar sözleşmeyi sürdürme iradesini ortaya koyduğuna göre, sözleşmenin tahkim şartı dâhil hükümlerinin sürdüğünü savunur. Yargıtay Hukuk Genel Kurulu bir uyuşmazlıkta oy çokluğuyla ilk yaklaşımı benimsemiştir; karşı oy bulunduğu için bunu sınavda kesin kural gibi değil, çoğunluk görüşü olarak yaz.

  ### İptal davasında denetimin sınırı
  İptal davası bir temyiz veya istinaf değildir. Bölge adliye mahkemesi yalnız kanunda sayılan sebepleri inceler. Tartışma, kamu düzenine aykırılık sebebinin ne ölçüde geniş yorumlanacağındadır: dar yoruma göre yalnız temel hukuk düzenine açık aykırılık bu sebebe girer; geniş yoruma göre emredici kurallara aykırılık da yeterlidir. Dar yorum tahkimin amacına daha uygun görülür.

  ### Tahkim ve ihtiyati tedbir
  HMK m. 426/2 mahkemeden tedbir veya haciz alan tarafın iki hafta içinde tahkim davasını açmasını arar. Bu kuralın HMK m. 397/1'deki evrakın ibrazı yükümlülüğü ile birlikte nasıl uygulanacağı, ayrıntıda doktrinde tartışmalıdır.
sozluk:
  - terim: Çekişmesiz yargı
    tanim: "Karşıt taraf ve uyuşmazlık bulunmaksızın, hukukun hâkimce belirli durumlara uygulanması (HMK m. 382)."
  - terim: Maddi anlamda kesin hüküm
    tanim: "Kararın aynı konuda aynı taraflar arasında yeniden görülmesini engelleyen etkisi; çekişmesiz yargıda kural olarak bulunmaz (HMK m. 388)."
  - terim: Tevdi mahalli
    tanim: "Borcun ifa edilebileceği, alacaklının kabulden kaçındığı hâllerde belirlenen ödeme yeri; çekişmesiz yargı işidir (HMK m. 382/2)."
  - terim: Tahkim
    tanim: "Uyuşmazlığın devlet mahkemeleri yerine hakem veya hakem kurulunca çözülmesi yöntemi (HMK m. 407)."
  - terim: Tahkim sözleşmesi
    tanim: "Mevcut veya doğabilecek uyuşmazlıkların hakeme bırakılması hakkındaki yazılı anlaşma (HMK m. 412)."
  - terim: Tahkime elverişlilik
    tanim: "Uyuşmazlığın hakem önüne götürülebilmesi; ayni haklar ve irade dışı işler elverişsizdir (HMK m. 408)."
  - terim: Tahkim ilk itirazı
    tanim: "Mahkemede açılan davada cevap dilekçesiyle ileri sürülen, uyuşmazlığın tahkimle çözülmesi gerektiği itirazı (HMK m. 413, HMK m. 116/1-b)."
  - terim: Kompetenz-Kompetenz
    tanim: "Hakemin kendi yetkisi hakkında karar verebilmesi ilkesi (HMK m. 422)."
  - terim: Tahkim süresi
    tanim: "Hakem kararının verilmesi gereken, kural olarak bir yıllık süre (HMK m. 427)."
  - terim: İptal davası
    tanim: "Hakem kararına karşı tek kanun yolu; tahkim yeri bölge adliye mahkemesinde, bir ay içinde açılır (HMK m. 439)."
kararlar:
  - id: "1155984600"
    ozet: |
      Kiracılar, kira bedelini ödeyebilecekleri yerin belirlenmesini (tevdi mahalli) sulh hukuk mahkemesinden istemiş; bazı bölge adliye mahkemesi daireleri talep dilekçesinin karşı tarafa tebliğ edilmeden karar verilmesini hukuki dinlenilme hakkına aykırı bulurken, bazıları bulmamıştır. Bölge adliye mahkemeleri arasındaki bu uyuşmazlığın giderilmesi istenmiştir. Yargıtay 3. Hukuk Dairesi, tevdi mahallinin çekişmesiz yargı işi olduğunu, iki taraflı bir dava bulunmadığını, işin ivediliği nedeniyle kiracının temerrüde düşmesi ve tahliye riskinin önlenmesi gerektiğini, kararın uyuşmazlığın esasını çözmediğini ve istinaf yoluyla denetlenebildiğini belirterek, talep dilekçesi karşı tarafa tebliğ edilmeksizin karar verilmesinin mümkün olduğuna, bunun hukuki dinlenilme hakkını ihlal etmediğine oy birliğiyle kesin olarak karar vermiştir.
  - id: "984226400"
    ozet: |
      Taraflar arasında yazılı distribütörlük sözleşmeleri ve bunlarda tahkim şartı vardı; son sözleşmenin iki yıllık süresi dolmuş, yeni sözleşme yapılmadığı hâlde ilişki 2017'ye kadar fiilen sürmüştür. Davacının tazminat davasında davalı tahkim itirazında bulunmuş, ilk derece mahkemesi ve bölge adliye mahkemesi itirazı kabul ederek davayı usulden reddetmiştir. Özel Daire bozmuş, ilk derece mahkemesi direnmiştir. Hukuk Genel Kurulu, tahkim şartının sözleşmeden bağımsız ayrı bir sözleşme olduğunu, tahkimin ancak tarafların açık tahkim iradesine dayanabileceğini, süresi dolan sözleşmenin tahkim şartının uzatıldığına dair açık irade bulunmadığını belirterek direnme kararını oy çokluğuyla bozmuştur.
  - id: "1092674400"
    ozet: |
      Otuz yıllık kira sözleşmesindeki tahkim şartı uyarınca hakem kurulu, kira artış oranının belirlenmesi ve fazla ödenen kiranın tahsili konusunda karar vermiş; kiraya veren idare, uyuşmazlığın tahkime elverişli olmadığını ve kararın kamu düzenine aykırı olduğunu ileri sürerek bölge adliye mahkemesinde iptal davası açmıştır. Bölge adliye mahkemesi davayı reddetmiştir. Yargıtay 3. Hukuk Dairesi, tahkime elverişliliğin kiralananın vasfına ve kira türüne bağlı olduğunu, konut ve çatılı işyeri kiralarında artış oranına ilişkin emredici kurallar nedeniyle elverişlilik incelemesi gerektiğini, adi kira ve ürün kirasında ise taraf iradesinin geçerli olduğunu belirterek, kira türünün araştırılmadan karar verilmesini eksik bularak kararı oy birliğiyle bozmuştur.
sorular:
  - soru: |
      Aşağıdakilerden hangisi HMK m. 382/1'e göre bir işin çekişmesiz yargıya girmesi için aranan ölçütlerden biri değildir?
    siklar:
      - "İlgililer arasında uyuşmazlık bulunmaması"
      - "İlgililerin ileri sürebileceği herhangi bir hakkın bulunmaması"
      - "Hâkimin resen harekete geçmesi"
      - "Uyuşmazlığın değerinin kanunda belirlenen sınırı aşması"
    dogru: 3
    aciklama: |
      HMK m. 382/1'de üç ölçüt sayılır: uyuşmazlık olmaması, ileri sürülecek hak bulunmaması ve hâkimin resen harekete geçmesi. Uyuşmazlığın değeri bir ölçüt değildir.
  - soru: |
      Çekişmesiz yargı işlerinde aksine hüküm yoksa görevli ve yetkili mahkeme hangisidir?
    siklar:
      - "Asliye hukuk mahkemesi; davalının yerleşim yeri mahkemesi"
      - "Sulh hukuk mahkemesi; talep edenin veya ilgililerden birinin oturduğu yer mahkemesi"
      - "Sulh hukuk mahkemesi; yalnızca talep edenin doğum yeri mahkemesi"
      - "Aile mahkemesi; işin açıldığı yer mahkemesi"
    dogru: 1
    aciklama: |
      Görevli mahkeme sulh hukuk mahkemesidir (HMK m. 383). Yetkili mahkeme talepte bulunan kişinin veya ilgililerden birinin oturduğu yer mahkemesidir (HMK m. 384).
  - soru: |
      Ayşe'nin ad değiştirme talebi sulh hukuk mahkemesince çekişmesiz yargı işi olarak reddedilmiştir. Ayşe, kararın verildiğini 3 Mart'ta öğrenmiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Öğrenmeden itibaren iki hafta içinde istinaf yoluna başvurabilir"
      - "Öğrenmeden itibaren bir ay içinde temyiz yoluna başvurabilir"
      - "Karar kesindir; hiçbir yola başvurulamaz"
      - "Öğrenmeden itibaren bir hafta içinde itiraz edebilir"
    dogru: 0
    aciklama: |
      HMK m. 387'ye göre hukuki yararı bulunan ilgililer, kararın öğrenilmesinden itibaren iki hafta içinde istinaf yoluna başvurabilir. Bölge adliye mahkemesi kararına karşı temyiz yoktur (HMK m. 362/1-ç).
  - soru: |
      Çekişmesiz yargı kararları hakkında hangisi doğrudur?
    siklar:
      - "Kural olarak maddi anlamda kesin hüküm oluşturmaz"
      - "Her zaman maddi anlamda kesin hüküm oluşturur"
      - "Yalnızca temyiz edildiğinde kesin hüküm oluşturur"
      - "Hiçbir kanun yoluna tabi değildir"
    dogru: 0
    aciklama: |
      HMK m. 388: kanunda aksine hüküm bulunmayan hâllerde çekişmesiz yargı kararları maddi anlamda kesin hüküm teşkil etmez.
  - soru: |
      Mehmet ve Ali arasında, bir parselin mülkiyetinin tespiti ve tapu kaydının iptaline ilişkin uyuşmazlığın hakem önüne götürülmesi kararlaştırılmıştır. Bu konuda hangisi doğrudur?
    siklar:
      - "Uyuşmazlık taşınmaz üzerindeki ayni haklardan doğduğundan tahkime elverişli değildir"
      - "Taraflar anlaştığı için uyuşmazlık tahkime elverişlidir"
      - "Yalnızca bedel talebi varsa tahkime elverişlidir"
      - "Tahkime elverişlilik yalnız ticari uyuşmazlıklarda aranır"
    dogru: 0
    aciklama: |
      HMK m. 408: taşınmaz mallar üzerindeki ayni haklardan doğan uyuşmazlıklar tahkime elverişli değildir. Bu durumda hakem kararı verilirse iptal sebebi doğar (HMK m. 439/2-g).
  - soru: |
      X A.Ş. ile Y Ltd. arasındaki tahkim anlaşması imzalı bir belgede yer almamaktadır. X dava dilekçesinde yazılı bir tahkim sözleşmesinin varlığını ileri sürmüş, Y cevap dilekçesinde buna itiraz etmemiştir. Sonuç nedir?
    siklar:
      - "Yazılı şekil şartı yerine getirilmiş sayılır"
      - "Tahkim sözleşmesi şekil eksikliğinden geçersizdir"
      - "Tahkim sözleşmesi ancak noterde yapılırsa geçerlidir"
      - "Mahkeme resen tahkim sözleşmesini yok sayar"
    dogru: 0
    aciklama: |
      HMK m. 412/3: dava dilekçesinde yazılı bir tahkim sözleşmesinin varlığı iddia edilmiş ve davalı cevap dilekçesinde itiraz etmemişse yazılı şekil şartı yerine getirilmiş sayılır.
  - soru: |
      Arsa sahibi Zeynep ile yüklenici Burak'ın sözleşmesindeki tahkim şartı vardır. Zeynep, sözleşmenin şekil eksikliğinden geçersiz olduğunu ileri sürerek mahkemede dava açmıştır. Burak'ın tahkim itirazı bakımından hangisi doğrudur?
    siklar:
      - "Asıl sözleşmenin geçersizliği ileri sürülerek tahkim sözleşmesine itiraz edilemez"
      - "Asıl sözleşme geçersizse tahkim sözleşmesi de kendiliğinden geçersizdir"
      - "Mahkeme tahkim itirazını inceleyemez"
      - "Hakem yetkisi hakkında karar veremez"
    dogru: 0
    aciklama: |
      HMK m. 412/4: tahkim sözleşmesine karşı, asıl sözleşmenin geçerli olmadığı itirazında bulunulamaz. HMK m. 422/1 de tahkim şartının bağımsız değerlendirileceğini ve hakem kurulunun yetkisi hakkında karar verebileceğini söyler.
  - soru: |
      Tahkim sözleşmesinin konusu olan bir uyuşmazlık için mahkemede dava açılmıştır. Davalı hangi aşamada ve nasıl itiraz etmelidir?
    siklar:
      - "Cevap dilekçesinde tahkim ilk itirazında bulunmalıdır; geçerliyse dava usulden reddedilir"
      - "Karar verilinceye kadar her aşamada itiraz edebilir; dava esastan reddedilir"
      - "Yalnızca istinaf aşamasında ileri sürebilir"
      - "Tahkim itirazı mahkemeyi bağlamaz; yargılama sürer"
    dogru: 0
    aciklama: |
      Tahkim itirazı bir ilk itirazdır (HMK m. 116/1) ve cevap dilekçesinde ileri sürülmek zorundadır (HMK m. 117/1). Sözleşme geçerliyse mahkeme davayı usulden reddeder (HMK m. 413/1).
  - soru: |
      Taraflar hakem sayısını belirlememiştir. Bu durumda kaç hakem seçilir ve kurulda aranan nitelik nedir?
    siklar:
      - "Bir hakem; hukukçu olması şart değildir"
      - "Üç hakem; en az birinin kendi alanında beş yıl ve daha fazla kıdemli hukukçu olması"
      - "İki hakem; ikisinin de avukat olması"
      - "Beş hakem; hepsinin hâkim emeklisi olması"
    dogru: 1
    aciklama: |
      HMK m. 415/2: sayı kararlaştırılmamışsa üç hakem seçilir. HMK m. 416/1-d: birden fazla kişiden oluşan hakem kurulunda en az birinin kendi alanında beş yıl ve daha fazla kıdeme sahip hukukçu olması şarttır (taraflarca aksi kararlaştırılmamışsa uygulanan usul kuralı).
  - soru: |
      Aksi kararlaştırılmadıkça, üç hakemli bir kurulda tahkim süresi hangi tarihten itibaren ve ne kadardır?
    siklar:
      - "Tahkim sözleşmesinin imzasından itibaren bir yıl"
      - "Hakem kurulunun ilk toplantı tutanağının düzenlendiği tarihten itibaren bir yıl"
      - "Dava dilekçesinin verildiği tarihten itibaren altı ay"
      - "Üçüncü hakemin seçildiği tarihten itibaren iki yıl"
    dogru: 1
    aciklama: |
      HMK m. 427/1: birden çok hakemin görev yapacağı davalarda hakem kurulunun ilk toplantı tutanağının düzenlendiği tarihten itibaren bir yıl içinde esas hakkında karar verilir.
  - soru: |
      Hakem kurulu kararı 14 Nisan'da taraflara bildirilmiştir. Karar kamu düzenine aykırıdır ve kaybeden taraf kararı iptal ettirmek istemektedir. Hangisi doğrudur?
    siklar:
      - "Bildirimden itibaren bir ay içinde tahkim yeri bölge adliye mahkemesinde iptal davası açılır"
      - "Bildirimden itibaren iki hafta içinde asliye hukuk mahkemesinde iptal davası açılır"
      - "Karar doğrudan istinaf edilir"
      - "Karar kesindir; hiçbir yola başvurulamaz"
    dogru: 0
    aciklama: |
      HMK m. 439/1 ve 439/4: hakem kararına karşı yalnız iptal davası açılabilir; tahkim yeri bölge adliye mahkemesinde, bildirimden itibaren bir ay içinde açılır. Kamu düzenine aykırılık bir iptal sebebidir (HMK m. 439/2-ğ).
  - soru: |
      İptal davası açan şirket, hakem kararının icra edilmesini önlemek istemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İptal davasının açılması icrayı kendiliğinden durdurur"
      - "İcra, hükmedilen para veya eşyanın değerini karşılayacak teminat gösterilmesi şartıyla ve talep üzerine durdurulabilir"
      - "İcra ancak Yargıtay kararıyla durdurulabilir"
      - "İptal davası hiçbir hâlde icrayı etkileyemez"
    dogru: 1
    aciklama: |
      HMK m. 439/4: iptal davası açılması kararın icrasını durdurmaz; ancak taraflardan birinin talebi üzerine hükmolunan para veya eşyanın değerini karşılayacak bir teminat gösterilmek şartıyla icra durdurulabilir. İptal davası kararına karşı temyiz de icrayı durdurmaz (HMK m. 439/6).
olaylar:
  - olay: |
      Merkezi İstanbul'da bulunan (A) A.Ş. ile merkezi Ankara'da bulunan (B) Ltd. Şti., Ankara'daki bir arsa üzerinde kat karşılığı inşaat yapılması için yazılı bir sözleşme imzalamışlardır. Sözleşmedeki şart şöyledir: "Sözleşmeden doğacak uyuşmazlıklar tahkim yeri İstanbul olmak üzere HMK hükümlerine göre hakemlerce çözülecektir." (A) A.Ş., sözleşmenin gereken şekilde yapılmadığı için geçersiz olduğunu ileri sürerek devlet mahkemesinde alacak davası açmıştır. (B) Ltd. Şti. cevap dilekçesinde tahkim itirazında bulunmuştur. Sonradan taraflar tahkime gitmiş; hakem kurulunda (A) A.Ş. hem alacak talebinde bulunmuş hem de arsa üzerindeki tapunun iptali ve adına tescilini istemiştir. Hakem kurulu, 14.04.2025 tarihinde taraflara bildirilen kararıyla hem alacak hem de tapu iptali ve tescil talebini kabul etmiş, (B) Ltd. Şti.'nin hakem kararına karşı yapabileceği işlemler gündeme gelmiştir.
      1. (B) Ltd. Şti.'nin tahkim itirazı yerinde midir? Mahkemenin vereceği karar nedir?
      2. Tapu iptali ve tescil talebi hakkında hakem kararı verilebilir mi?
      3. (B) Ltd. Şti. bu karara karşı hangi yola, hangi mahkemede ve ne zamana kadar başvurabilir?
      4. İptal davası açılırsa karar icra edilebilir mi?
    olcut:
      - {tespit: "Asıl sözleşmenin geçersizliğinin tahkim sözleşmesini etkilememesi; tahkim sözleşmesinin yazılı olması", puan: 20, madde: "HMK m. 412/4"}
      - {tespit: "Tahkim itirazının cevap dilekçesinde ileri sürülmesi ve davanın usulden reddi", puan: 20, madde: "HMK m. 413/1"}
      - {tespit: "Taşınmaz üzerindeki ayni hakkın tahkime elverişli olmaması", puan: 20, madde: "HMK m. 408/1"}
      - {tespit: "Tek yolun iptal davası olması; tahkim yeri bölge adliye mahkemesi; bildirimden itibaren bir ay (14.05.2025)", puan: 25, madde: "HMK m. 439/1"}
      - {tespit: "İptal davasının icrayı kendiliğinden durdurmaması; teminatla durdurulabilmesi", puan: 15, madde: "HMK m. 439/4"}
    cozum: |
      **Nitelendirme:** Olay, iç tahkimde tahkim sözleşmesinin bağımsızlığı, tahkim itirazı, tahkime elverişlilik ve hakem kararının iptali sorunlarını içerir. Uyuşmazlıkta yabancılık unsuru yoktur ve tahkim yeri Türkiye'dir; HMK'nın iç tahkim hükümleri uygulanır (HMK m. 407).

      **Hukuki sorunlar:** (1) Asıl sözleşmenin geçersizliğinin tahkim şartına etkisi ve tahkim itirazı. (2) Tapu iptali ve tescil talebinin tahkime elverişliliği. (3) İptal davasının mahkemesi, süresi ve sebebi. (4) İcra.

      **İlgili hükümler:** HMK m. 412, HMK m. 413, HMK m. 116, HMK m. 117, HMK m. 408, HMK m. 439.

      **Değerlendirme:** HMK m. 412/4'e göre tahkim sözleşmesine karşı asıl sözleşmenin geçerli olmadığı itirazında bulunulamaz; HMK m. 422/1 de tahkim şartının sözleşmenin diğer hükümlerinden bağımsız değerlendirileceğini söyler. Bu nedenle (A) A.Ş.'nin kat karşılığı inşaat sözleşmesinin şekil eksikliğine dayanması tahkim şartını ortadan kaldırmaz. Tahkim sözleşmesi yazılı olarak yapılmıştır. (B) Ltd. Şti. tahkim itirazını ilk itiraz olarak cevap dilekçesinde ileri sürmüştür (HMK m. 116/1-b, HMK m. 117/1). Tahkim sözleşmesi hükümsüz, tesirsiz veya uygulanması imkânsız değilse mahkeme itirazı kabul eder ve davayı usulden reddeder (HMK m. 413/1).

      Tapu iptali ve tescil talebi taşınmaz üzerindeki ayni hakka ilişkindir. HMK m. 408/1'e göre bu tür uyuşmazlıklar tahkime elverişli değildir. Hakem kurulunun bu konuda karar vermesi, tahkime elverişli olmayan bir uyuşmazlık hakkında karar verilmesi sonucunu doğurur.

      (B) Ltd. Şti.'nin başvurabileceği tek yol iptal davasıdır; istinaf yolu yoktur. Dava tahkim yeri olan İstanbul bölge adliye mahkemesinde açılır (HMK m. 439/1). Süre, hakem kararının taraflara bildirildiği 14.04.2025 tarihinden itibaren bir aydır; yani 14.05.2025'e kadar dava açılmalıdır (HMK m. 439/4). İptal sebebi, uyuşmazlığın Türk hukukuna göre tahkime elverişli olmamasıdır (HMK m. 439/2-g). Alacak talebine ilişkin kısım bakımından hakem kurulunun hukuku yanlış uyguladığı iddiası ise iptal sebebi değildir; bölge adliye mahkemesi iptal davasında kararı esastan yeniden incelemez.

      İptal davası açılması kararın icrasını kendiliğinden durdurmaz. Ancak (B) talep eder ve hükmedilen para veya eşyanın değerini karşılayan teminat gösterirse icra durdurulabilir (HMK m. 439/4).

      **Sonuç:** Tahkim itirazı yerindedir, mahkeme davayı usulden reddeder. Tapu iptali ve tescil talebi tahkime elverişli değildir. (B), 14.05.2025'e kadar İstanbul bölge adliye mahkemesinde iptal davası açabilir; icra, teminat karşılığında talep üzerine durdurulabilir.
  - olay: |
      (C) A.Ş. ile (D) Ltd. Şti. arasındaki tahkim sözleşmesinde üç hakemli kurul öngörülmüş, tahkim süresi veya uzatma hakkında özel bir düzenleme yapılmamıştır. Hakem kurulunun ilk toplantı tutanağı 03.02.2025 tarihinde düzenlenmiştir. Taraflar süreyi uzatmak için anlaşmamış, mahkemeye de uzatma başvurusu yapılmamıştır. Hakem kurulu, esas hakkındaki kararını 20.03.2026 tarihinde vermiş ve karar 27.03.2026 tarihinde taraflara bildirilmiştir. Karar (D) aleyhinedir. (D), ayrıca hakem kurulunun bir üyesi hakkında, o üyenin (C)'nin ortağının yakını olduğunu 10.04.2026 tarihinde öğrendiğini söylemektedir.
      1. Karar tahkim süresi içinde verilmiş midir? (D) bunu nasıl ileri sürebilir?
      2. (D)'nin iptal davası için süre ve mahkeme nedir?
      3. (D), üyeyi 10.04.2026'da öğrendiği sebeple reddedebilir mi?
      4. Bölge adliye mahkemesinin iptal davası hakkındaki kararına karşı hangi yol vardır?
    olcut:
      - {tespit: "Tahkim süresinin ilk toplantı tutanağından itibaren bir yıl olması; sürenin 03.02.2026'da dolması ve kararın süre dışında verilmesi", puan: 25, madde: "HMK m. 427/1"}
      - {tespit: "Kararın tahkim süresi içinde verilmemesinin iptal sebebi olması", puan: 20, madde: "HMK m. 439/2"}
      - {tespit: "İptal davasının tahkim yeri bölge adliye mahkemesinde, bildirimden (27.03.2026) itibaren bir ay içinde açılması", puan: 20, madde: "HMK m. 439/4"}
      - {tespit: "Hakem reddi talebi için öğrenmeden itibaren iki hafta süre; karar verildikten sonra bu yolun anlamı", puan: 15, madde: "HMK m. 418/2"}
      - {tespit: "BAM'ın iptal davası kararına karşı temyiz yolu", puan: 20, madde: "HMK m. 439/6"}
    cozum: |
      **Nitelendirme:** Olay, iç tahkimde tahkim süresi, hakemin reddi ve hakem kararının iptali sorunlarını içerir.

      **Hukuki sorunlar:** (1) Tahkim süresine uyulup uyulmadığı. (2) İptal davasının şekli ve süresi. (3) Hakemin reddi için süre. (4) İptal davası kararına karşı kanun yolu.

      **İlgili hükümler:** HMK m. 427, HMK m. 439, HMK m. 417, HMK m. 418.

      **Değerlendirme:** Aksi kararlaştırılmadıkça birden çok hakemin görev yapacağı davalarda esas hakkında karar, hakem kurulunun ilk toplantı tutanağının düzenlendiği tarihten itibaren bir yıl içinde verilir (HMK m. 427/1). İlk toplantı tutanağı 03.02.2025'te düzenlendiğinden süre 03.02.2026'da dolmuştur. Süre taraf anlaşmasıyla veya mahkeme kararıyla uzatılabilirdi (HMK m. 427/2); olayda uzatma yoktur. Karar 20.03.2026'da, yani süre dolduktan sonra verildiğinden, kararın tahkim süresi içinde verilmediği ileri sürülebilir; bu bir iptal sebebidir (HMK m. 439/2-c).

      İptal davası, hakem kararının taraflara bildirildiği 27.03.2026 tarihinden itibaren bir ay içinde, yani 27.04.2026'ya kadar tahkim yeri bölge adliye mahkemesinde açılır (HMK m. 439/1 ve HMK m. 439/4). Tavzih, düzeltme veya tamamlama kararı verilirse süre o kararın bildirilmesinden başlar.

      Hakemin reddi için kural, ret sebebini öğrenmeden itibaren iki haftadır (HMK m. 418/2). (D), ret sebebini 10.04.2026'da öğrendiğine göre, tahkim yargılaması devam etseydi 24.04.2026'ya kadar ret talebinde bulunabilirdi. Ancak olayda hakem kararı çoktan verilmiştir; yargılama sona ermiştir. Bu nedenle ret yolunun artık işlevi kalmamıştır; ret sebebinin iptal davasında nasıl değerlendirileceği ayrıca tartışılabilir. Olayın tartışmasız iptal sebebi süredir.

      Bölge adliye mahkemesinin iptal davası hakkında verdiği karara karşı temyiz yoluna başvurulabilir; temyiz incelemesi iptal sebepleriyle sınırlıdır, öncelikle ve ivedilikle yapılır ve icrayı durdurmaz (HMK m. 439/6).

      **Sonuç:** Karar, tahkim süresi dolduktan sonra verilmiştir. (D) 27.04.2026'ya kadar tahkim yeri bölge adliye mahkemesinde iptal davası açabilir ve süre sebebine dayanabilir. İptal kararına karşı temyiz mümkündür.
kartlar:
  - on: "Çekişmesiz yargı ölçütleri?"
    arka: "İlgililer arasında uyuşmazlık olmaması, ileri sürülecek hak bulunmaması, hâkimin resen harekete geçmesi (HMK m. 382/1)."
  - on: "Çekişmesiz yargıda görevli ve yetkili mahkeme?"
    arka: "Sulh hukuk mahkemesi (HMK m. 383); talep edenin veya ilgililerden birinin oturduğu yer (HMK m. 384)."
  - on: "Çekişmesiz yargı kararlarında kanun yolu?"
    arka: "Öğrenmeden itibaren iki hafta içinde istinaf (HMK m. 387); temyiz yok (HMK m. 362/1-ç)."
  - on: "Çekişmesiz yargı kararlarının kesin hüküm etkisi?"
    arka: "Kural olarak maddi anlamda kesin hüküm oluşturmaz (HMK m. 388)."
  - on: "Hangi uyuşmazlıklar tahkime elverişli değildir?"
    arka: "Taşınmaz mallar üzerindeki ayni haklar ve iki tarafın iradesine tabi olmayan işler (HMK m. 408)."
  - on: "Tahkim sözleşmesinin şekli?"
    arka: "Yazılı; cevap dilekçesinde itiraz edilmeyen tahkim iddiası da yazılı şekli tamamlar (HMK m. 412/3)."
  - on: "Asıl sözleşme geçersizse tahkim şartı?"
    arka: "Etkilenmez; tahkim şartı bağımsızdır (HMK m. 412/4 ve HMK m. 422/1)."
  - on: "Tahkim itirazı hangi aşamada, sonucu ne?"
    arka: "Cevap dilekçesinde ilk itiraz olarak; geçerliyse dava usulden reddedilir (HMK m. 413/1 ve HMK m. 117/1)."
  - on: "Hakem sayısı ve niteliği?"
    arka: "Tek sayıda; belirlenmemişse üç. Kurulda en az biri beş yıl kıdemli hukukçu (HMK m. 415 ve HMK m. 416/1-d)."
  - on: "Tahkim süresi ne zaman başlar, ne kadardır?"
    arka: "Bir yıl; hakemin seçildiği veya kurulun ilk toplantı tutanağının düzenlendiği tarihten (HMK m. 427/1)."
  - on: "Hakem kararına karşı yol, mahkeme ve süre?"
    arka: "Yalnız iptal davası; tahkim yeri bölge adliye mahkemesi; bildirimden itibaren bir ay (HMK m. 439/1 ve HMK m. 439/4)."
  - on: "İptal davası icrayı durdurur mu?"
    arka: "Kendiliğinden durdurmaz; talep üzerine ve teminat karşılığı durdurulabilir. BAM kararına karşı temyiz var (HMK m. 439/4 ve HMK m. 439/6)."
