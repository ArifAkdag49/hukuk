ozet: |
  - **Çekişmesiz yargı (HMK m. 382-388):** Ortada karşıt iki taraf arasında çözülecek bir uyuşmazlık yoktur; üç ölçütten biri aranır: ilgililer arasında uyuşmazlık olmaması, ileri sürülebilecek bir hakkın bulunmaması veya hâkimin resen harekete geçmesi (HMK m. 382/1). Sayılan işler örnekleyicidir (ergin kılınma, ad değişikliği, gaiplik, mirasçılık belgesi, vesayet işleri, kıymetli evrakın iptali vb.).
  - **Görev ve yetki:** Aksine hüküm yoksa görevli mahkeme **sulh hukuk** (HMK m. 383); yetkili mahkeme talep edenin veya ilgililerden birinin oturduğu yer mahkemesi (HMK m. 384).
  - **Usul ve sonuç:** Niteliğine uygun düştüğü ölçüde basit yargılama usulü ve resen araştırma (HMK m. 385). Kararlar kural olarak **maddi anlamda kesin hüküm oluşturmaz** (HMK m. 388). Öğrenmeden itibaren **iki hafta** içinde istinaf (HMK m. 387); temyiz yok (HMK m. 362/1-ç).
  - **İç tahkim kapsamı (HMK m. 407-408):** Yabancılık unsuru taşımayan ve tahkim yeri Türkiye olan uyuşmazlıklar. **Taşınmaz üzerindeki ayni haklar** ve **tarafların iradesine tabi olmayan işler** tahkime elverişli değildir.
  - **Tahkim sözleşmesi (HMK m. 412):** Yazılı yapılır; şart olarak veya ayrı sözleşme olabilir. Cevap dilekçesinde itiraz edilmeyen iddia da yazılı şekli tamamlar. Asıl sözleşmenin geçersizliği tahkim sözleşmesini ortadan kaldırmaz. Hakem kendi yetkisine karar verir (HMK m. 422).
  - **Tahkim itirazı (HMK m. 413, HMK m. 116/1-b):** İlk itiraz olarak cevap dilekçesinde ileri sürülür (HMK m. 117/1); sözleşme geçerliyse dava usulden reddedilir.
  - **Hakemler:** Sayı tek olmalı, belirlenmemişse üç (HMK m. 415). Aksi kararlaştırılmadıkça gerçek kişi; kurulda en az biri beş yıl kıdemli hukukçu (HMK m. 416/1). Ret talebi iki hafta (HMK m. 418/2).
  - **Yargılama:** Eşitlik ve hukuki dinlenilme (HMK m. 423). Usulü taraflar belirler (HMK m. 424). Süre kural olarak bir yıl; hakemin seçildiği veya kurulun ilk toplantı tutanağının düzenlendiği tarihten başlar (HMK m. 427/1).
  - **İptal davası (HMK m. 439):** Hakem kararına karşı yalnız iptal davası; tahkim yeri bölge adliye mahkemesinde; bildirimden itibaren **bir ay**; sınırlı sebepler; icrayı kendiliğinden durdurmaz (teminatla durdurulabilir); BAM kararına karşı temyiz.
anlatim: |
  ## 1. Çekişmesiz yargı

  ### 1.1. Kavram
  Yargılamanın büyük bölümü iki tarafın birbirine karşı hak ileri sürdüğü çekişmeli yargıdır. **Çekişmesiz yargı** ise hukukun mahkemelerce, bir uyuşmazlığı çözmek için değil, belirli hukuki durumları kurmak, denetlemek veya korumak için uygulanmasıdır. HMK m. 382/1'e göre bir iş şu ölçütlerden birine veya birkaçına uyuyorsa bu yargıya girer:

  - İlgililer arasında uyuşmazlık olmaması.
  - İlgililerin ileri sürebileceği herhangi bir hakkın bulunmaması.
  - Hâkimin resen harekete geçmesi.

  > **Örnek:** Ayşe, mirasçı olduğunu gösteren belge almak için sulh hukuk mahkemesine başvurur. Karşısında davalı yoktur; mahkeme, talebi inceleyip belgeyi verir. Bu bir çekişmesiz yargı işidir.

  HMK m. 382/2 işleri konularına göre sayar: kişiler hukuku (ergin kılınma, ad ve soyad değişikliği, gaiplik, kayıt düzeltme), aile hukuku (evlenme izni, velayetin kaldırılması, vesayet işleri, aile konutu ile ilgili işlemler), miras hukuku (mirasçılık belgesi, mirasın reddi beyanının tespiti, vasiyetnameler), eşya, borçlar ve ticaret hukuku işleri (tevdi mahalli belirlenmesi, kıymetli evrakın iptali, ayıplı malın tespiti), icra ve iflas işleri (konkordato mühleti ve tasdik) ve çeşitli kanunlardaki işler. Listeyi ezberlemene gerek yok; sayılan işlerin ortak yönünü, yani karşıt taraf bulunmamasını kavramak yeterlidir.

  > ⚠️ **Sınavda dikkat:** Madde 382/2'deki liste "çekişmesiz yargı işlerinden sayılır" der. Kanun başka yerlerde de çekişmesiz yargı işi öngörebilir. Ayrıca bir iş listede olsa bile, niteliği gereği taraflar arasında gerçek bir uyuşmazlığa dönüşürse yargılama usulü ona göre değerlendirilir.

  ### 1.2. Görev, yetki, usul
  - **Görev:** Aksine düzenleme yoksa **sulh hukuk mahkemesi** (HMK m. 383).
  - **Yetki:** Aksine hüküm yoksa **talepte bulunanın veya ilgililerden birinin oturduğu yer** mahkemesi (HMK m. 384).
  - **Usul:** Niteliğine uygun düştüğü ölçüde **basit yargılama usulü** uygulanır ve aksine hüküm yoksa **resen araştırma ilkesi** geçerlidir (HMK m. 385/1-2). Mahkemeler dışındaki makamlara bırakılan işlerde usul özel kanunlarına tabidir (HMK m. 385/3).
  - **Dinlenilme:** Çekişmesiz yargıda her işte karşı tarafa tebligat yapılıp cevap alınması gerekmez. Yargıtay, kiracının kira bedelini yatırabileceği yerin belirlenmesi (tevdi mahalli) talebinde, talep dilekçesi karşı tarafa tebliğ edilmeden karar verilmesini hukuki dinlenilme hakkını (HMK m. 27) ihlal etmeyen bir uygulama saymıştır; gerekçesi işin ivediliği ve kararın istinaf yoluyla denetlenebilmesidir.

  ### 1.3. Kararların niteliği ve kanun yolu
  - **Kesin hüküm:** Kanunda aksine hüküm yoksa çekişmesiz yargı kararları **maddi anlamda kesin hüküm oluşturmaz** (HMK m. 388). Yani aynı konu, değişen koşullarda yeniden ele alınabilir.
  - **İstinaf:** Hukuki yararı bulunan ilgililer, kararın **öğrenilmesinden itibaren iki hafta** içinde istinaf yoluna başvurabilir (HMK m. 387).
  - **Temyiz:** Çekişmesiz yargı işlerinde verilen bölge adliye mahkemesi kararlarına karşı temyiz yoluna başvurulamaz (HMK m. 362/1-ç).

  > 💡 **Püf nokta:** Süre başlangıcı bu kararda "öğrenme"dir. Birçok başka kararda tefhim veya tebliğ aranır; çekişmesiz yargıda ilgili sayısı çok olabileceğinden başlangıç öğrenmedir.

  ## 2. İç tahkim

  ### 2.1. Kavram ve kapsam
  **Tahkim**, tarafların uyuşmazlıklarını devlet mahkemeleri yerine seçtikleri hakem veya hakem kurulunun çözmesine bırakmasıdır. HMK m. 407-444 **iç tahkimi** düzenler: yabancılık unsuru taşımayan ve tahkim yeri Türkiye olarak belirlenen uyuşmazlıklara uygulanır (HMK m. 407). Yabancılık unsuru taşıyan uyuşmazlıklar 4686 sayılı Milletlerarası Tahkim Kanunu'nun alanındadır. HMK m. 444 gereği bu Kısımda düzenlenen konularda, aksine hüküm bulunmadıkça HMK'nın diğer hükümleri uygulanmaz.

  ### 2.2. Tahkime elverişlilik
  HMK m. 408: **Taşınmaz mallar üzerindeki ayni haklardan** veya **iki tarafın iradelerine tabi olmayan işlerden** doğan uyuşmazlıklar tahkime elverişli değildir.

  > **Örnek:** Mehmet ile Ali arasındaki ticari alacak uyuşmazlığı tahkime götürülebilir. Ancak bir parselin mülkiyetinin tespiti veya tapu iptali ve tescil talebi ayni hakka ilişkin olduğundan hakem önüne götürülemez.

  Hakem kararı, tahkime elverişsiz bir uyuşmazlık hakkında verilmişse bu durum iptal sebebidir (HMK m. 439/2-g). Yargıtay, kira uyuşmazlıklarında kiralananın türüne bakılması gerektiğini vurgulamıştır: konut ve çatılı işyeri kiralarında artış oranını sınırlayan emredici kurallar bulunduğundan bu kiralar bakımından elverişlilik dikkatle incelenir; adi kira ve ürün kiralarında taraf iradesi daha geniş geçerli olduğundan sözleşmesel artış oranına ilişkin uyuşmazlık tahkime elverişli sayılabilir.

  ### 2.3. Tahkim sözleşmesi
  HMK m. 412:
  - Tarafların, sözleşme veya sözleşme dışı bir hukuki ilişkiden doğmuş ya da doğabilecek uyuşmazlıkları hakem veya hakem kuruluna bırakma anlaşmasıdır. Asıl sözleşmenin bir şartı (**tahkim şartı**) veya ayrı bir sözleşme (**compromis**) olabilir.
  - **Yazılı şekil** şarttır. İmzalı belge, mektup, faks, elektronik ortam gibi iletişim araçlarıyla teati edilmesi yeterlidir. Dava dilekçesinde yazılı bir tahkim sözleşmesinin varlığı iddia edilmiş ve davalı cevap dilekçesinde itiraz etmemişse yazılı şekil tamamlanmış sayılır. Tahkim şartı içeren bir belgeye yollama da yeterlidir.
  - **Bağımsızlık:** Tahkim sözleşmesine karşı, asıl sözleşmenin geçerli olmadığı veya sözleşmenin henüz doğmamış uyuşmazlığa ilişkin olduğu itirazında bulunulamaz (HMK m. 412/4). Hakem, asıl sözleşmenin hükümsüzlüğüne karar verse bile tahkim sözleşmesi kendiliğinden hükümsüz olmaz (HMK m. 422/1).
  - Yargılama sırasında taraflar tahkime gitmeye anlaşırsa dosya mahkemece hakeme gönderilir (HMK m. 412/5).

  > ⚠️ **Sınavda dikkat:** Tahkim, devlet yargısının istisnasıdır; tarafların hakem iradesi açık ve tereddütsüz olmalıdır. "Uyuşmazlık halinde hakeme veya mahkemeye gidilebilir" gibi seçimlik veya ihtimali bir kayıt, yerleşik uygulamaya göre geçerli tahkim iradesi oluşturmaz.

  ### 2.4. Tahkim itirazı
  Tahkim sözleşmesinin konusu bir uyuşmazlık için mahkemede dava açılırsa karşı taraf **tahkim ilk itirazında** bulunabilir (HMK m. 413/1). Bu bir ilk itirazdır (HMK m. 116/1-b) ve **cevap dilekçesinde** ileri sürülmelidir; aksi hâlde dinlenemez (HMK m. 117/1). Tahkim sözleşmesi hükümsüz, tesirsiz veya uygulanması imkânsız değilse mahkeme itirazı kabul eder ve davayı **usulden reddeder**. Tahkim itirazının ileri sürülmesi, tahkim yargılamasına engel değildir (HMK m. 413/2).

  ### 2.5. Hakemler
  - **Sayı:** Taraflar belirler ancak sayı **tek** olmalıdır; belirlenmemişse **üç** hakem seçilir (HMK m. 415).
  - **Seçim:** Taraflar seçim usulünü serbestçe belirler. Aksi kararlaştırılmadıkça gerçek kişiler hakem olabilir; tek hakemde anlaşılamazsa mahkeme seçer; üç hakemde her taraf birer hakem seçer, bunlar üçüncüyü (başkan) belirler. Karşı tarafın talebinin ulaşmasından itibaren **bir ay** içinde hakem seçilmezse veya iki hakem seçilmelerinden sonraki **bir ay** içinde üçüncüyü belirlemezse, mahkeme seçer. Birden fazla hakem varsa en az birinin kendi alanında **beş yıl ve daha fazla kıdeme sahip hukukçu** olması gerekir (HMK m. 416/1).
  - **Tarafsızlık:** Hakem adayı, bağımsızlığından şüphe doğuracak durumları açıklamak zorundadır (HMK m. 417/1). Hakem, kararlaştırılan niteliklere sahip olmazsa veya tarafsızlığından şüphe edilmesini haklı gösteren hâller varsa reddedilebilir (HMK m. 417/2). Ret talebi, seçimi veya ret sebebini öğrenmeden itibaren **iki hafta** içinde yapılır (HMK m. 418/2). Ret talebini kabul etmeyen karara karşı **bir ay** içinde mahkemeye başvurulabilir (HMK m. 418/3).
  - **Yetki kararı:** Hakem veya kurul kendi yetkisine ilişkin itirazlar dâhil yetkisi hakkında karar verir (HMK m. 422/1). Yetkisizlik itirazı en geç cevap dilekçesinde, yetkinin aşıldığı itirazı derhâl ileri sürülür (HMK m. 422/2-3).

  ### 2.6. Tahkim yargılaması
  - **Eşitlik ve dinlenilme:** Taraflar eşit hak ve yetkiye sahiptir ve hukuki dinlenilme hakkını kullanabilir (HMK m. 423/1).
  - **Usul:** Emredici hükümler saklı kalmak üzere usulü taraflar belirler; anlaşma yoksa hakem uygun bulduğu usulü izler (HMK m. 424).
  - **Dava tarihi:** Taraflar aksini kararlaştırmadıkça tahkim davası, hakem seçimi için mahkemeye veya seçmeye yetkili kişiye başvurulduğu ya da davacının hakemini seçip bunu karşı tarafa bildirdiği anda açılmış sayılır. Mahkemeden ihtiyati tedbir veya haciz kararı alınmışsa iki hafta içinde tahkim davası açılmalıdır; aksi hâlde tedbir veya haciz kendiliğinden kalkar (HMK m. 426).
  - **Tedbir ve delil tespiti:** Aksi kararlaştırılmadıkça hakem veya kurul tedbire karar verebilir, uygun teminat isteyebilir; icra edilebilirlik mahkemeden istenir (HMK m. 414).
  - **Katılmama:** Davalı cevap dilekçesi vermezse bu, iddianın ikrarı sayılmaz ve yargılama sürer. Davacı dava dilekçesini vermezse yargılamaya son verilir. Duruşmaya mazeretsiz gelmeyen veya delil sunmaktan kaçınan tarafa rağmen mevcut delillere göre karar verilebilir (HMK m. 430).
  - **Sulh:** Taraflar sulh olursa tahkim sona erer; kamu düzenine aykırı değilse sulh hakem kararı olarak tespit edilir (HMK m. 434).
  - **Süre:** Aksi kararlaştırılmadıkça esas hakkında karar, tek hakemde seçildiği, kurulda ilk toplantı tutanağının düzenlendiği tarihten itibaren **bir yıl** içinde verilir. Süre taraf anlaşmasıyla, anlaşılamazsa mahkemece uzatılabilir; mahkeme kararı kesindir (HMK m. 427).

  ### 2.7. Hakem kararı
  Karar; hakemlerin ve tarafların bilgilerini, hukuki sebepleri ve gerekçeyi, taraflara yüklenen hak ve borçları, iptal davasının açılabileceğini ve süresini, tahkim yeri ve tarihini, imzaları içerir (HMK m. 436/1). Karar, hakem veya kurul başkanı ya da tahkim kurumu tarafından taraflara bildirilir; aslı mahkemeye gönderilip orada saklanır (HMK m. 436/3, 7251 sayılı Kanunla değişik). Taraflar, bildirimden itibaren **iki hafta** içinde maddi hata düzeltmesi ve tavzih isteyebilir; **bir ay** içinde karara bağlanmamış konularda tamamlama isteyebilir (HMK m. 437). Bu kararlar hakem kararının parçası olur.

  ## 3. Hakem kararına karşı iptal davası

  HMK m. 439:
  - **Tek yol iptal davasıdır;** istinaf yoktur. Dava, **tahkim yeri bölge adliye mahkemesinde** açılır; öncelikle ve ivedilikle görülür, aksine karar verilmedikçe dosya üzerinden incelenir (HMK m. 439/1 ve HMK m. 439/5).
  - **Süre:** Hakem kararının veya tavzih, düzeltme ya da tamamlama kararının taraflara bildirilmesinden itibaren **bir ay** (HMK m. 439/4).
  - **Sebepler (sınırlı sayıda):**
    - Taraflardan birinin ehliyetsizliği veya tahkim sözleşmesinin geçersizliği.
    - Hakem seçiminde usule uyulmaması.
    - Kararın tahkim süresi içinde verilmemesi.
    - Hakemin hukuka aykırı olarak yetkili veya yetkisiz olduğuna karar vermesi.
    - Tahkim sözleşmesi dışında kalan konuda karar verilmesi, talebin tamamı hakkında karar verilmemesi veya yetkinin aşılması.
    - Yargılamanın usule uygun yürütülmemesi ve bunun esasa etkili olması.
    - Eşitlik ve hukuki dinlenilme hakkına riayet edilmemesi.
    - Uyuşmazlığın tahkime elverişli olmaması.
    - Kararın kamu düzenine aykırı olması.
  - **Kısmi iptal:** Sözleşme dışı konu hakkında karar verildiği iddiasında, tahkim kapsamındaki bölüm ayrılabiliyorsa yalnız sözleşme dışı bölüm iptal edilebilir (HMK m. 439/3).
  - **İcra:** İptal davası açılması kararın icrasını **durdurmaz**; ancak taraf talebi üzerine, hükmedilen para veya eşyanın değerini karşılayan teminat gösterilmesi şartıyla icra durdurulabilir (HMK m. 439/4).
  - **Temyiz:** İptal davası hakkında verilen karara karşı temyiz yoluna başvurulabilir; temyiz incelemesi iptal sebepleriyle sınırlıdır ve icrayı durdurmaz (HMK m. 439/6).
  - **Sonuç:** Kabul hâlinde, bazı sebeplerde taraflar aksini kararlaştırmamışsa hakemleri ve tahkim süresini yeniden belirleyebilir; isterlerse eski hakemleri atayabilirler (HMK m. 439/7).

  > ⚠️ **Sınavda dikkat:** İptal davası, bölge adliye mahkemesinin kararı yeniden esastan inceleyeceği bir istinaf değildir. Hakemin maddi hukuku yanlış uyguladığı veya delilleri yanlış değerlendirdiği iddiası, kamu düzenine aykırılık oluşturmadıkça iptal sebebi değildir. Kanunun saydığı dokuz sebep dışında iptal olmaz.

  > 📌 **Kesin bilgi:** İç tahkimde iptal davasının açılması icrayı kendiliğinden durdurmaz. Durdurma ancak teminat karşılığında ve talep üzerine olur.

  ## 4. Denetim şeması

  1. İş çekişmesiz yargı mı (HMK m. 382)? Öyleyse sulh hukuk, talep edenin veya ilgililerden birinin yerleşimi, iki hafta istinaf, temyiz yok.
  2. Uyuşmazlık yabancılık unsuru içeriyor mu? İçermiyorsa HMK m. 407.
  3. Tahkime elverişli mi (HMK m. 408)?
  4. Yazılı tahkim sözleşmesi var mı (HMK m. 412)? Asıl sözleşmenin geçersizliği sonucu değiştirmez.
  5. Mahkemede dava açıldıysa cevap dilekçesinde tahkim itirazı var mı (HMK m. 413)?
  6. Hakem sayısı ve nitelikleri, süre.
  7. Kararın bildirimi, iptal davası: tahkim yeri BAM, bir ay, sınırlı sebepler.
