ozet: |
  - **Görev:** Aynı yargı kolundaki ilk derece mahkemelerinden hangisinin bir davaya bakacağını belirleyen kurallardır. Görev ancak kanunla düzenlenir ve kamu düzenindendir (HMK m. 1; AY m. 142).
  - **Sonuçları:** Taraflar görevi anlaşmayla değiştiremez; görevli olmak dava şartıdır (HMK m. 114/1-c); mahkeme bunu davanın her aşamasında resen araştırır (HMK m. 115/1).
  - **Asliye hukuk (HMK m. 2):** Dava konusunun değer ve miktarına bakılmaksızın malvarlığı ve şahıs varlığı haklarına ilişkin davalarda, aksine düzenleme yoksa asliye hukuk mahkemesi görevlidir; bu genel görevli mahkemedir. 15.000 TL'lik de, 15 milyon TL'lik de alacak davası aksi bir kural yoksa asliye hukukta açılır.
  - **Sulh hukuk (HMK m. 4/1):** (a) kira ilişkisinden doğan uyuşmazlıklar (ilamsız icra yoluyla tahliye hükümleri hariç); (b) paylaştırma ve ortaklığın giderilmesi; (c) sadece zilyetliğin korunması; (ç) kanunların sulh hukuku görevlendirdiği işler (HMK m. 383: çekişmesiz yargı).
  - **İptal edilen madde:** Ölüm ve bedensel zarar davalarında görevi düzenleyen HMK m. 3, Anayasa Mahkemesince iptal edilmiştir; görev ilişkinin niteliğine göre belirlenir.
  - **Özel mahkemeler:** Asliye ticaret (TTK m. 5), iş (7036 sayılı Kanun m. 5), tüketici (6502 sayılı Kanun m. 73), aile (4787 sayılı Kanun m. 4). Asliye hukuk ile bu mahkemeler arasındaki ilişki görev ilişkisidir (TTK m. 5/3).
  - **Görevsizlik:** Görevsizlik kararı verilirse dosya, iki hafta içinde talep edilerek görevli mahkemeye gönderilir; aksi hâlde dava açılmamış sayılır (HMK m. 20/1).
  - 📌 **Arabuluculuk:** Kira, ortaklığın giderilmesi, kat mülkiyeti ve komşu hakkı uyuşmazlıklarında arabulucuya başvurmak dava şartıdır (HUAK m. 18/B).
anlatim: |
  ## 1. Görev nedir, neden önemlidir?

  **Görev**, aynı yargı kolundaki (burada adli yargı hukuk mahkemeleri) ilk derece mahkemelerinden hangisinin belirli bir davaya bakmaya yetkili olduğunu belirleyen kurallar bütünüdür. Yetki ise aynı türden mahkemeler arasında yer bakımından dağılımdır. Önce "hangi tür mahkeme?" (görev), sonra "hangi yerdeki mahkeme?" (yetki) sorusu sorulur.

  HMK m. 1 iki şey söyler: Mahkemelerin görevi ancak kanunla düzenlenir (bkz. AY m. 142/1) ve göreve ilişkin kurallar kamu düzenindendir. Bundan şu sonuçlar çıkar:

  - Taraflar görevi sözleşmeyle değiştiremez; "şu mahkeme görevli olsun" diye anlaşmak geçersizdir.
  - Görevli olmak bir **dava şartıdır** (HMK m. 114/1-c).
  - Mahkeme, dava şartlarını **davanın her aşamasında kendiliğinden** araştırır; taraflar da noksanlığı her zaman ileri sürebilir (HMK m. 115/1).
  - Davalı görev itirazında bulunmasa bile ya da süre geçse bile mahkeme görevli hâle gelmez. Yargıtay uygulamasında görev kamu düzeninden olduğu için bozma kararından sonra bile resen gözetilir.
  - Genel mahkeme ile özel mahkeme arasındaki ilişki de görev ilişkisidir (TTK m. 5/3).

  > ⚠️ **Sınavda dikkat:** Yetkide kural olarak davalının süresinde itiraz etmemesi mahkemeyi yetkili hâle getirir (HMK m. 19/4 mantığı); görevde böyle bir şey yoktur. Görev ve yetkiyi karıştırmayın.

  ## 2. Genel mahkeme: Asliye hukuk (HMK m. 2)

  HMK m. 2/1: Dava konusunun **değer ve miktarına bakılmaksızın** malvarlığı haklarına ilişkin davalarla şahıs varlığına ilişkin davalarda görevli mahkeme, aksine bir düzenleme bulunmadıkça **asliye hukuk mahkemesidir**. HMK m. 2/2: Kanunlarda aksine düzenleme yoksa asliye hukuk, diğer dava ve işler bakımından da görevlidir. Yani asliye hukuk **asıl ve genel** görevli mahkemedir; diğer mahkemelerin görevi istisnadır ve açık bir kanun hükmüne dayanmak zorundadır.

  Eski usul kanunu döneminde dava değerine göre asliye/sulh ayrımı yapılırdı; HMK ile bu ayrım kalkmıştır. Bugün değer görevi değil, başka şeyleri (ör. kanun yolu sınırları, ticari davalarda basit yargılama sınırı) etkiler.

  > **Örnek:** Ayşe, komşusunun kasten arabasını çizmesi nedeniyle 15.000 TL tazminat istiyor. Tutar küçük olsa bile ilişki kira, ortaklık vb. bir özel görev kuralına girmediğinden dava asliye hukuk mahkemesinde açılır.

  > ⚠️ **Sınavda dikkat:** "Değeri düşük olduğu için sulh hukuk" cevabı yanlıştır. Sulh hukukun görevi tutara değil, konuya göre sayılmıştır.

  ### HMK m. 3'ün iptali
  Ölüm veya vücut bütünlüğünün yitirilmesinden doğan zararların tazmini davalarında görevi düzenleyen HMK m. 3 hükmü, Anayasa Mahkemesinin 16.02.2012 tarihli ve E. 2011/35, K. 2012/23 sayılı kararıyla iptal edilmiştir. Bu yüzden böyle bir tazminat davasında mahkeme, uyuşmazlığın hukuki ilişkisine göre belirlenir: iş kazası ise iş mahkemesi (7036 sayılı Kanun m. 5), tüketici işlemi ise tüketici mahkemesi (6502 sayılı Kanun m. 73), ticari dava ise asliye ticaret, bunların hiçbiri değilse asliye hukuk.

  ## 3. Sulh hukuk mahkemesinin görevi (HMK m. 4)

  Sulh hukuk mahkemeleri, dava konusunun değer veya tutarına bakılmaksızın şu davaları görür (HMK m. 4/1):

  - **(a) Kira:** Kiralanan taşınmazların İİK'ya göre ilamsız icra yoluyla tahliyesine ilişkin hükümler ayrık olmak üzere, kira ilişkisinden doğan alacak davaları dâhil tüm uyuşmazlıkları konu alan davalar ve bunlara karşı açılan davalar. Örnek: kira alacağı, kira bedelinin tespiti, tahliye davası.
  - **(b) Paylaşma ve ortaklığın giderilmesi:** Taşınır ve taşınmaz mal veya hakkın paylaştırılmasına ve ortaklığın giderilmesine ilişkin davalar.
  - **(c) Zilyetliğin korunması:** Taşınır ve taşınmaz mallarda **sadece zilyetliğin korunmasına** yönelik davalar (gasp ve saldırıya karşı koruma: TMK m. 982, TMK m. 983).
  - **(ç) Kanunların sulh hukuku görevlendirdiği işler:** Mesela çekişmesiz yargı işlerinde aksine hüküm yoksa görevli mahkeme sulh hukuktur (HMK m. 383/1); örnekleri HMK m. 382'de sayılmıştır (mirasçılık belgesi verilmesi, tevdi mahalli belirlenmesi, vesayet işleri vb.). Ayrıca mirasın reddi beyanı sulh mahkemesine yapılır (TMK m. 609) ve tereke mallarını koruma önlemlerini mirasbırakanın yerleşim yeri sulh hâkimi alır (TMK m. 589). Kat Mülkiyeti Kanunu'nun ek 1. maddesi bu Kanunun uygulanmasından doğacak her türlü anlaşmazlığın sulh mahkemelerinde çözüleceğini söyler; kat malikleri kurulu kararlarına karşı iptal davası da sulh mahkemesinde açılır (KMK m. 33).

  ### Üç tuzak: İlamsız tahliye, zilyetlik, ortaklık

  **İlamsız tahliye.** HMK m. 4/1-a bu hükümleri sulh hukukun dışında bırakır. İİK'ya göre kira alacağına ilişkin ilamsız takipte itirazın kaldırılması ve tahliye istemleri icra mahkemesine aittir (İİK m. 269/a, İİK m. 269/b). Yani "kira" kelimesini görünce otomatik "sulh hukuk" demeyin; icra yoluyla ilamsız tahliye takibi ayrı bir mercidir.

  **Zilyetlik ve mülkiyet.** Sulh hukuk yalnızca **zilyetliğin korunmasına** bakar. Dava tapu/mülkiyet gibi üstün bir hakka dayanıyorsa (ör. mülkiyete dayalı elatmanın önlenmesi, TMK m. 683; taşınırlarda iyiniyetsiz zilyede karşı taşınır davası, TMK m. 991) bu, zilyetliğin korunması değil hakkın korunmasıdır; görevli mahkeme asliye hukuktur (HMK m. 2). Zilyetliğin korunması davası ise gasp veya saldırıdan sonra zilyedin fiili ve failini öğrenmesinden başlayarak iki ay, her hâlde fiilin üzerinden bir yıl içinde açılmalıdır (TMK m. 984).

  **Ortaklığın giderilmesinde çıkan mülkiyet uyuşmazlığı.** Ortaklığın giderilmesi davası sulh hukukta görülür (HMK m. 4/1-b). Ancak taşınmaz üzerindeki bina veya ağaç gibi bütünleyici parçaların (muhdesat) kime ait olduğu ayrı bir mülkiyet uyuşmazlığıdır. Bunu iddia eden paydaşa, görevli mahkemede dava açması için HMK m. 165 uyarınca uygun süre verilir; süre içinde dava açılırsa sonucu beklenir, açılmazsa o konuda uyuşmazlık yokmuş gibi devam edilir. Bu çözümü Yargıtay da benimsemiştir (bkz. kararlar).

  ## 4. Özel mahkemeler ve genel mahkemeyle ilişki

  | Mahkeme | Dayanak | Görev (özet) |
  |---|---|---|
  | Asliye ticaret | TTK m. 4-5 | Ticari davalar ve ticari nitelikte çekişmesiz işler |
  | İş | 7036 sayılı Kanun m. 5 | İşçi-işveren iş ilişkisi uyuşmazlıkları |
  | Tüketici | 6502 sayılı Kanun m. 73 | Tüketici işlemleri ve uygulamaları |
  | Aile | 4787 sayılı Kanun m. 4 | Aile hukuku dava ve işleri |

  - **Asliye ticaret.** Her iki tarafın ticari işletmesiyle ilgili hususlardan doğan davalar ve TTK m. 4/1'de sayılan konular ticari dava sayılır. Asliye ticaret mahkemesi, değer ve tutara bakılmaksızın tüm ticari davalara bakar (TTK m. 5/1). Asliye ticaret ile asliye hukuk arasındaki ilişki görev ilişkisidir (TTK m. 5/3). Asliye ticaret bulunmayan yargı çevresinde ticari davada görev kuralına dayanılmamışsa görevsizlik kararı verilmez; asliye hukuk davaya devam eder (TTK m. 5/4).
  - **İş.** İşçi ile işveren arasında iş ilişkisi nedeniyle sözleşmeden veya kanundan doğan her türlü hukuk uyuşmazlığına iş mahkemesi bakar (7036 sayılı Kanun m. 5/1-a).
  - **Tüketici.** Tüketici işlemlerinden ve tüketiciye yönelik uygulamalardan doğabilecek uyuşmazlıklarda görevli mahkeme tüketici mahkemesidir (6502 sayılı Kanun m. 73/1).
  - **Aile.** 4787 sayılı Kanun m. 4 aile hukukundan doğan dava ve işleri aile mahkemesine verir; TMK'nın ikinci kitabının üçüncü kısmı (vesayet) bu görevden hariç tutulmuştur. Vesayet işleri çekişmesiz yargı işi olarak sulh hukukun alanındadır (HMK m. 382, HMK m. 383).

  ## 5. Görevin denetlenmesi ve görevsizlik kararı

  Mahkeme görev noksanlığını tespit ederse davayı **görevsizlik kararıyla** usulden sonuçlandırır; esasa girmez. Dava şartı noksanlığı konusunda kural, noksanlığın giderilmesi mümkünse kesin süre verilmesi, aksi hâlde usulden redir (HMK m. 115/2). Görev noksanlığı ise taraf iradesiyle giderilemez; doğru uygulama görevsizlik kararı ve dosyanın görevli mahkemeye gönderilmesidir.

  HMK m. 20/1'e göre görevsizlik veya yetkisizlik kararı verildiğinde taraflardan birinin, karar verildiği anda kesin ise tebliğ tarihinden; kanun yoluna başvurulmayarak kesinleşmiş ise kesinleştiği tarihten; kanun yoluna başvurulmuşsa bu başvurunun reddi kararının tebliğ tarihinden itibaren **iki hafta içinde** kararı veren mahkemeye başvurup dosyanın görevli mahkemeye gönderilmesini istemesi gerekir. Aksi hâlde dava açılmamış sayılır. Dosya kendisine gönderilen mahkeme taraflara kendiliğinden davetiye gönderir (HMK m. 20/2).

  > **Örnek:** Hasan, kira alacağı davasını asliye hukukta açar; mahkeme görevsizlik kararı verir. Karar kanun yoluna başvurulmadan kesinleşirse Hasan, kesinleşme tarihinden itibaren iki hafta içinde dosyanın sulh hukuka gönderilmesini istemelidir. İstemezse dava açılmamış sayılır.

  Görevde karşı dava bakımından da dikkat gerekir: karşı dava şartları (asıl dava açılmış ve görülüyor, takas/mahsup ilişkisi veya bağlantı) sağlanmadan açılırsa mahkeme talep üzerine ya da resen karşı davanın ayrılmasına, gerekirse dosyanın görevli mahkemeye gönderilmesine karar verir (HMK m. 132/2). Yetkide "asıl davaya bakan mahkeme karşı davaya da bakar" kuralı (HMK m. 13) kesin yetkinin söz konusu olmadığı hâllere özgüdür; görevi dolaylı yoldan genişletmez.

  ### Görev nasıl tespit edilir?
  Görev, davacının dava dilekçesine verdiği ada göre değil, dilekçedeki **vakıalara ve talep sonucuna** göre, yani uyuşmazlığın gerçek hukuki niteliğine bakılarak belirlenir. Davacı "alacak davası" dese bile uyuşmazlığın özü kira ilişkisi ise sulh hukuk, iş ilişkisi ise iş mahkemesi, tüketici işlemi ise tüketici mahkemesi görevlidir. Hâkim de bu nitelendirmeyi resen yapar (HMK m. 33).

  ## 6. 📌 Arabuluculuk ve görev

  Dava şartı arabuluculuk, görev kuralının yerine geçmez; görevli mahkemede dava açmadan önce de yapılması gerekir. 7445 sayılı Kanunla HUAK'a eklenen 18/B maddesine göre aşağıdaki uyuşmazlıklarda dava açılmadan önce arabulucuya başvurulmuş olması dava şartıdır (HUAK m. 18/B/1):

  - Kiralanan taşınmazların ilamsız icra yoluyla tahliyesi hükümleri hariç, kira ilişkisinden kaynaklanan uyuşmazlıklar;
  - taşınır ve taşınmazların paylaştırılması ve ortaklığın giderilmesi;
  - Kat Mülkiyeti Kanunu'ndan kaynaklanan uyuşmazlıklar;
  - komşu hakkından kaynaklanan uyuşmazlıklar.

  Arabulucuya başvurulmadan dava açıldığı anlaşılırsa herhangi bir işlem yapılmaksızın dava, dava şartı yokluğu sebebiyle usulden reddedilir; son tutanak dilekçeye eklenmemişse davacıya bir haftalık kesin süre verilir (HUAK m. 18/A/2). Ticari davalarda da para alacağı gibi davalar için TTK m. 5/A, iş davalarında 7036 sayılı Kanun m. 3 aynı mantığı kurar.

  > **Örnek:** Cem, Oya ile paydaş olduğu arsanın satışla giderilmesini sulh hukukta ister ama arabulucuya hiç başvurmamıştır. Sulh hukuk görevli mahkemedir; yine de dava, dava şartı yokluğundan usulden reddedilir.

  ## 7. Denetim şeması

  Bir olayda görevli mahkemeyi bulmak için:
  1. Özel bir kanun hükmü var mı? (iş, tüketici, ticari, aile, kadastro, fikri haklar)
  2. Yoksa HMK m. 4/1'deki sulh hukuk konularından biri mi? Kira, ortaklığın giderilmesi, yalnız zilyetlik, çekişmesiz yargı, sulh hukuku görevlendiren kanun hükmü?
  3. İlamsız tahliye gibi hariç tutulan bir istisna var mı? (İcra mahkemesi)
  4. Hiçbiri değilse asliye hukuk (HMK m. 2).
  5. Dava şartı arabuluculuk kapsamında mı? (HUAK m. 18/B)
  6. Mahkeme görevli değilse görevsizlik ve HMK m. 20 süresi.
kritik: |
  - 📌 HMK m. 1: Görev ancak kanunla düzenlenir ve kamu düzenindendir. Taraflar anlaşmayla değiştiremez.
  - 📌 HMK m. 114/1-c ve HMK m. 115/1: Görevli olma dava şartıdır; mahkeme bunu davanın her aşamasında resen inceler.
  - 📌 HMK m. 2: Asliye hukuk, değer ve miktara bakılmaksızın genel görevli mahkemedir; aksi özel kural gerekir.
  - ⚠️ "Düşük değerli dava sulh hukukta görülür" ifadesi yanlıştır. Sulh hukukun görevi konuya göredir (HMK m. 4/1).
  - 📌 HMK m. 4/1: (a) kira (ilamsız icra yoluyla tahliye hükümleri hariç), (b) paylaşma ve ortaklığın giderilmesi, (c) sadece zilyetliğin korunması, (ç) sulh hukuku görevlendiren kanun hükümleri.
  - ⚠️ İlamsız icra yoluyla tahliye takibinde itirazın kaldırılması ve tahliye icra mahkemesinin görevindedir (İİK m. 269/a, İİK m. 269/b); HMK m. 4/1-a bunu hariç tutar.
  - ⚠️ Mülkiyete dayalı elatmanın önlenmesi (TMK m. 683) asliye hukukta görülür; sadece zilyetliğin korunması sulh hukukta.
  - 📌 HMK m. 3 Anayasa Mahkemesince iptal edilmiştir (E. 2011/35, K. 2012/23). Ölüm ve bedensel zarar davasında görev, ilişkinin niteliğine göre belirlenir.
  - 📌 TTK m. 5/3: Asliye ticaret ile asliye hukuk arasındaki ilişki görev ilişkisidir; TTK m. 5/4: Asliye ticaret bulunmayan yerde görev kuralına dayanılmamışsa görevsizlik kararı verilmez.
  - 📌 HMK m. 382 ve HMK m. 383: Çekişmesiz yargı işlerinde aksine hüküm yoksa görevli mahkeme sulh hukuktur.
  - 📌 HMK m. 20/1: Görevsizlik kararından sonra dosyanın gönderilmesi iki hafta içinde istenmelidir; aksi hâlde dava açılmamış sayılır.
  - 📌 HUAK m. 18/B/1: Kira, ortaklığın giderilmesi, kat mülkiyeti ve komşu hakkı uyuşmazlıklarında arabuluculuk dava şartıdır; ilamsız icra yoluyla tahliye hükümleri hariçtir.
  - ⚠️ Ortaklığın giderilmesinde muhdesat aidiyeti iddiasında HMK m. 165 uyarınca görevli mahkemede dava açmak için süre verilir.
doktrin: |
  ### Tacirler arasındaki kira uyuşmazlıkları
  TTK m. 4/1'e göre her iki tarafın ticari işletmesiyle ilgili hususlardan doğan davalar ticari dava sayılır ve TTK m. 5/1'e göre asliye ticaret mahkemesine aittir. HMK m. 4/1-a ise kira ilişkisinden doğan tüm uyuşmazlıkları sulh hukuka bırakır. İki hükmün çakıştığı tacirler arası işyeri kirasında iki görüş vardır.

  **Birinci görüş:** Her iki tarafın tacir olması ve kiranın ticari işletmeyi ilgilendirmesi hâlinde dava nispi ticari dava sayılır; asliye ticaret görevlidir.

  **İkinci görüş (ağırlıklı görüş ve Yargıtay uygulaması):** HMK m. 4/1-a özel bir görev kuralıdır; "tüm uyuşmazlıkları" kapsar. Taraflar tacir olsa bile adi kira ilişkisinden doğan dava sulh hukukta görülür. Sınavda bu tür sorularda genellikle bu yaklaşım beklenir; ancak sorunun dayandığı varsayımı mutlaka okuyun.

  ### Zilyetlik ile mülkiyete dayanma
  Davacı hem zilyetliğe hem mülkiyete dayanıyorsa görevin nasıl belirleneceği tartışmalıdır. Yargıtay uygulaması "sadece zilyetliğin korunması" ifadesine dayanır: Üstün hak (mülkiyet) iddiası davanın merkezindeyse sulh hukuk görevli olmaz; asliye hukuk bakar. Uygulamada davanın niteliği dilekçedeki talep ve dayanılan vakıalara göre belirlenir.

  ### Komşu hakkı ve arabuluculuk
  HUAK m. 18/B/1-ç komşu hakkından kaynaklanan uyuşmazlıkları dava şartı arabuluculuğa tabi kılar. Bir görüşe göre komşu taşınmazlar arasındaki her uyuşmazlık, taşkın inşaat ve mülkiyete dayalı elatmanın önlenmesi talepleri dahil, bu kapsamdadır. Karşı görüşe göre yalnız komşuluk hukukuna (TMK m. 737 vd.) dayanan talepler kapsama girer; mülkiyet hakkına (TMK m. 683) dayanan elatmanın önlenmesi davası komşular arasında görülse bile girmez. Uygulama yerleşmiş değildir; bu nokta sınavda kesin cevap olarak sorulmamalıdır.
sozluk:
  - terim: Görev
    tanim: "Aynı yargı kolundaki farklı türde mahkemeler arasında davaların konusuna göre dağılımı; bir davaya hangi tür mahkemenin bakacağını belirler (aynı tür mahkemenin daireleri arasındaki iş bölümünden farklıdır)."
  - terim: Yetki
    tanim: "Aynı tür mahkemeler arasında yer bakımından dağılım."
  - terim: Kamu düzeni
    tanim: "Tarafların anlaşmasıyla değiştirilemeyen, mahkemece resen gözetilen kuralların niteliği."
  - terim: Dava şartı
    tanim: "Davada esasa girilebilmesi için bulunması gereken şart; görevli olma bunlardandır (HMK m. 114/1-c)."
  - terim: Görevsizlik kararı
    tanim: "Mahkemenin görevli olmadığını tespit eden karar; esasa girmez, dosya talep üzerine görevli mahkemeye gönderilir (HMK m. 20)."
  - terim: Asliye hukuk mahkemesi
    tanim: "Değer ve miktara bakılmaksızın genel görevli hukuk mahkemesi (HMK m. 2)."
  - terim: Sulh hukuk mahkemesi
    tanim: "Kira, ortaklığın giderilmesi, zilyetliğin korunması ve kanunun verdiği işler (çekişmesiz yargı gibi) için görevli mahkeme (HMK m. 4, HMK m. 383)."
  - terim: Ortaklığın giderilmesi
    tanim: "Paylı veya elbirliği mülkiyetinde paydaşlığın (izale-i şüyu) sona erdirilmesi davası."
  - terim: Muhdesat
    tanim: "Taşınmaz üzerindeki bina, ağaç gibi bütünleyici parçalar."
  - terim: Çekişmesiz yargı
    tanim: "İlgililer arasında uyuşmazlık bulunmayan ya da hâkimin resen harekete geçtiği hukuki koruma işleri (HMK m. 382)."
  - terim: Nispi ticari dava
    tanim: "Her iki tarafın ticari işletmesiyle ilgili olması hâlinde ticari sayılan dava (TTK m. 4/1)."
  - terim: Dava şartı arabuluculuk
    tanim: "Bazı uyuşmazlıklarda dava açmadan önce arabulucuya başvurmanın zorunlu olması (HUAK m. 18/B)."
kararlar:
  - id: "863294600"
    ozet: |
      Bir bakanlık, yüklenici şirketin işçisine iş mahkemesi kararıyla ödediği 9.472,47 TL'yi rücuen istemişti. Davalı şirket hakkında daha önce iflas kararı verilmişti. Asliye ticaret mahkemesi görevsizlik kararı vererek dosyayı asliye hukuka gönderdi; Yargıtay 23. Hukuk Dairesi bu kararı bozdu, mahkeme önceki kararında direndi. Hukuk Genel Kurulu, görevin HMK m. 1 uyarınca kamu düzenine ilişkin olduğunu, görevli olmanın dava şartı olduğunu ve asliye hukuk ile asliye ticaret arasındaki ilişkinin görev ilişkisi olduğunu hatırlattı. Ardından, iflastan önce doğmuş bir alacağın masaya kaydı istendiği için davanın kayıt kabul davası niteliğinde olduğunu, İİK'nın 235. maddesi uyarınca iflasa karar veren yerdeki asliye ticaret mahkemesinin görevli olduğunu belirterek direnme kararını bozdu. Karar, görev belirlenirken davanın adına değil gerçek niteliğine bakıldığını gösterir.
  - id: "1210695200"
    ozet: |
      Sulh hukuk mahkemesinde açılan ortaklığın giderilmesi davasında bazı paydaşlar taşınmaz üzerindeki yapıların (muhdesat) kendilerine ait olduğunu ileri sürmüştü; mahkeme bozmaya uyarak davayı kısmen kabul etmişti. Yargıtay 7. Hukuk Dairesi, bu tür iddialarda öncelikle bu uyuşmazlığın giderilmesini isteyen paydaşa görevli mahkemede dava açmak üzere HMK m. 165 uyarınca uygun süre verilmesi gerektiğini belirtti. Süre içinde dava açılırsa sonucun beklenmesi, açılmazsa o konuda uyuşmazlık yokmuş gibi devam edilmesi gerekir. Bilirkişi raporları taraflara tebliğ edilmediği ve muhdesata ilişkin beyanlar alınıp aidiyet davası için süre ve imkân tanınmadığı için karar bozuldu. Karar, ortaklığın giderilmesi davasının sulh hukukta görülmesine karşın içindeki aidiyet uyuşmazlığının bekletici sorun mekanizmasıyla ele alındığını gösterir.
  - id: "1231469200"
    ozet: |
      Adana ve Ankara bölge adliye mahkemesi daireleri, kiracının TBK m. 319/2 uyarınca kiralananı gezip görmeye izin vermekle yükümlü olması nedeniyle açılan kiralananın gösterilmesine izin davalarının arabuluculuk dava şartına tabi olup olmadığı konusunda ayrı karar vermişlerdi. Yargıtay 3. Hukuk Dairesi uyuşmazlığı gidererek HUAK m. 18/B/1-a'nın ilamsız icra yoluyla tahliye hükümleri hariç kira ilişkisinden kaynaklanan uyuşmazlıkları kapsadığını, kanunda başka istisna bulunmadığını ve bu nedenle kiralananın gösterilmesine izin davalarında da arabulucuya başvurmanın dava şartı olduğunu, başvurulmadan açılan davanın usulden reddedileceğini belirtti. Karar, kira davalarının sulh hukukta görülmesinin yanı sıra dava şartı arabuluculuk koşulunun da kontrol edilmesi gerektiğini gösterir.
sorular:
  - soru: |
      Ayşe, komşusu Burak'ın arabasını kasten çizmesi nedeniyle 15.000 TL tazminat istemektedir. Olayda kira, ortaklığın giderilmesi, tüketici işlemi veya ticari ilişki yoktur. Dava hangi mahkemede açılır?
    siklar:
      - "Sulh hukuk mahkemesi; çünkü dava değeri düşüktür."
      - "Asliye hukuk mahkemesi; çünkü değer ve miktara bakılmaksızın genel görevli mahkemedir."
      - "Asliye ticaret mahkemesi."
      - "İcra hukuk mahkemesi."
    dogru: 1
    aciklama: |
      HMK m. 2/1'e göre dava konusunun değer ve miktarına bakılmaksızın malvarlığı haklarına ilişkin davalarda, aksine düzenleme yoksa asliye hukuk mahkemesi görevlidir. Sulh hukukun görevi değere göre değil HMK m. 4/1'deki konulara göre belirlenir.
  - soru: |
      Görev kuralları bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Taraflar yazılı anlaşma yaparak görevli mahkemeyi belirleyebilir."
      - "Davalı cevap dilekçesinde görev itirazında bulunmazsa mahkeme görevli hâle gelir."
      - "Mahkeme, görevli olup olmadığını davanın her aşamasında kendiliğinden araştırır."
      - "Görev yalnızca ilk itiraz olarak ileri sürülebilir."
    dogru: 2
    aciklama: |
      Görev kamu düzenindendir (HMK m. 1); görevli olma bir dava şartıdır (HMK m. 114) ve mahkeme dava şartlarını davanın her aşamasında kendiliğinden araştırır (HMK m. 115/1). Taraf iradesiyle değiştirilemez ve itiraz edilmemesi mahkemeyi görevli kılmaz.
  - soru: |
      Hasan, konut kiracısı Aylin aleyhine üç aylık kira alacağının tahsili ve temerrüt nedeniyle tahliyesi için genel hükümlere göre dava açacaktır (ilamsız icra yoluyla tahliye takibi yapılmamıştır). Görevli mahkeme hangisidir?
    siklar:
      - "Asliye hukuk mahkemesi"
      - "Sulh hukuk mahkemesi"
      - "Tüketici mahkemesi"
      - "İcra mahkemesi"
    dogru: 1
    aciklama: |
      HMK m. 4/1-a, ilamsız icra yoluyla tahliyeye ilişkin hükümler hariç, kira ilişkisinden doğan alacak davaları dâhil tüm uyuşmazlıklarda sulh hukuk mahkemesini görevli kılar. İcra mahkemesi yalnızca ilamsız tahliye takibine ilişkin işlerde devreye girer (İİK m. 269/a).
  - soru: |
      Kardeşler Oya ve Cem, miras yoluyla edindikleri arsada paydaştır. Oya paydaşlığın satış yoluyla giderilmesini istemektedir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Görevli mahkeme asliye hukuk mahkemesidir."
      - "Görevli mahkeme sulh hukuk mahkemesidir (HMK m. 4/1-b) ve dava açılmadan önce arabulucuya başvurulması dava şartıdır."
      - "Görevli mahkeme aile mahkemesidir."
      - "Dava yalnızca asliye ticaret mahkemesinde açılabilir."
    dogru: 1
    aciklama: |
      Ortaklığın giderilmesi davaları HMK m. 4/1-b uyarınca sulh hukukun görevindedir. Ayrıca HUAK m. 18/B/1 bu uyuşmazlıklarda dava açılmadan önce arabulucuya başvurulmasını dava şartı yapmıştır. Aile mahkemesi veya asliye ticaret görevli değildir.
  - soru: |
      Tapuda maliki olan Mehmet, komşusu Selim'in sınırdaki duvarı kendi arsasına taşırdığını ileri sürerek mülkiyet hakkına dayanarak elatmanın önlenmesini istemektedir. Görevli mahkeme hangisidir?
    siklar:
      - "Sulh hukuk mahkemesi; çünkü taşınmaza ilişkin bir dava vardır."
      - "Asliye hukuk mahkemesi; çünkü mülkiyete dayalı elatmanın önlenmesi sadece zilyetliğin korunması değildir."
      - "İcra hukuk mahkemesi."
      - "Tüketici mahkemesi."
    dogru: 1
    aciklama: |
      HMK m. 4/1-c sulh hukuku yalnızca zilyetliğin korunmasına yönelik davalarda görevli kılar. Mülkiyet hakkına dayalı elatmanın önlenmesi (TMK m. 683/2) ise hakkın korunmasıdır ve HMK m. 2 uyarınca asliye hukukun görevindedir.
  - soru: |
      Aşağıdakilerden hangisi sulh hukuk mahkemesinin görevinde değildir?
    siklar:
      - "Mirasın reddi beyanının alınması (TMK m. 609)"
      - "Mirasçılık belgesi verilmesi"
      - "Kat malikleri kurulu kararının iptali davası (KMK m. 33)"
      - "Ölüm nedeniyle tazminat davasının tamamı, hukuki ilişkinin niteliğine bakılmaksızın"
    dogru: 3
    aciklama: |
      Mirasın reddi sulh mahkemesine beyanla yapılır (TMK m. 609); mirasçılık belgesi çekişmesiz yargı işidir (HMK m. 382, HMK m. 383); kat malikleri kurulu kararının iptali davası sulh mahkemesinde açılır (KMK m. 33). Ölüm tazminatına ilişkin özel görev kuralı (HMK m. 3) iptal edilmiştir; görev ilişkinin niteliğine göre belirlenir.
  - soru: |
      Kiracı olan Naz, kira sözleşmesinden doğan itirazlarını ileri sürmüş; kiraya veren Kemal, İİK'ya göre başlattığı ilamsız tahliye takibinde itirazın kaldırılmasını ve tahliyeyi istemektedir. Bu istemde görevli merci hangisidir?
    siklar:
      - "Sulh hukuk mahkemesi"
      - "Asliye ticaret mahkemesi"
      - "İcra mahkemesi"
      - "Aile mahkemesi"
    dogru: 2
    aciklama: |
      İİK m. 269/b ilamsız takipte itirazın kaldırılması ve tahliyenin icra mahkemesinden istenmesini düzenler; HMK m. 4/1-a de bu hükümleri sulh hukukun görevinin dışında tutar.
  - soru: |
      İş kazasında ölen işçinin mirasçıları tazminat istemektedir. Görevli mahkemenin belirlenmesine ilişkin aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Ölüm ve bedensel zarar davalarında görevi düzenleyen HMK m. 3 yürürlüktedir; asliye hukuk görevlidir."
      - "HMK m. 3 Anayasa Mahkemesince iptal edilmiştir; görev, iş ilişkisine göre iş mahkemesidir."
      - "Her zaman sulh hukuk mahkemesidir."
      - "Her zaman asliye ticaret mahkemesidir."
    dogru: 1
    aciklama: |
      HMK m. 3, Anayasa Mahkemesinin 16.02.2012 tarihli ve E. 2011/35, K. 2012/23 sayılı kararıyla iptal edilmiştir. İşçi ile işveren arasındaki iş ilişkisinden doğan uyuşmazlıklara iş mahkemesi bakar (7036 sayılı Kanun m. 5/1-a).
  - soru: |
      Asliye ticaret mahkemesi bulunmayan bir ilçede ticari bir dava, asliye hukuk mahkemesinde açılmıştır. Davalı görev itirazında bulunmamıştır. Hâkim ne yapar?
    siklar:
      - "Görevsizlik kararı verip dosyayı en yakın ticaret mahkemesine gönderir."
      - "Davayı usulden reddeder."
      - "Davaya devam eder; çünkü asliye ticaret bulunmayan yargı çevresinde görev kuralına dayanılmamışsa görevsizlik kararı verilmez."
      - "Davacıdan arabuluculuk başvurusu yapmasını ister."
    dogru: 2
    aciklama: |
      TTK m. 5/4: Asliye ticaret mahkemesi bulunmayan yargı çevresindeki bir ticari davada görev kuralına dayanılmamış olması görevsizlik kararı verilmesini gerektirmez; asliye hukuk davaya devam eder.
  - soru: |
      Mahkeme görevsizlik kararı vermiş, karar kanun yoluna başvurulmadan 10 Mart günü kesinleşmiştir. Davacı Elif ne yapmalıdır?
    siklar:
      - "Kesinleşme tarihinden itibaren iki hafta içinde kararı veren mahkemeye başvurarak dosyanın görevli mahkemeye gönderilmesini istemelidir; aksi hâlde dava açılmamış sayılır."
      - "Süre olmaksızın istediği zaman görevli mahkemeye başvurabilir."
      - "Yeni bir dava açmak zorundadır; dosya gönderilmez."
      - "Dosya kendiliğinden görevli mahkemeye gider; davacının başvurusu gerekmez."
    dogru: 0
    aciklama: |
      HMK m. 20/1 uyarınca kanun yoluna başvurulmayarak kesinleşen görevsizlik kararında kesinleşme tarihinden itibaren iki hafta içinde başvurulmalıdır. Başvurulmazsa dava açılmamış sayılır.
  - soru: |
      Kat malikleri kurulunun bir kararına karşı iptal davası açmak isteyen kat maliki Tuna için aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Dava asliye hukuk mahkemesinde açılır."
      - "Dava sulh mahkemesinde açılır (KMK m. 33); Kat Mülkiyeti Kanunu'ndan kaynaklanan uyuşmazlıklarda arabuluculuk dava şartıdır (HUAK m. 18/B)."
      - "Dava tüketici mahkemesinde açılır."
      - "Dava asliye ticaret mahkemesinde açılır."
    dogru: 1
    aciklama: |
      KMK m. 33 iptal davasını anagayrimenkulün bulunduğu yerdeki sulh mahkemesinde açılacak dava olarak düzenler. HUAK m. 18/B/1 Kat Mülkiyeti Kanunu'ndan kaynaklanan uyuşmazlıklarda arabulucuya başvurmayı dava şartı yapmıştır.
  - soru: |
      Hasan, kira alacağı davasını sulh hukuk mahkemesinde açmış, ancak arabulucuya hiç başvurmamıştır. Mahkeme ne yapar?
    siklar:
      - "Davayı esastan inceler, arabuluculuk eksikliği önemsizdir."
      - "Davacıdan arabuluculuk son tutanağı istenmeksizin dava, dava şartı yokluğu sebebiyle usulden reddedilir."
      - "Dosyayı asliye hukuka gönderir."
      - "Davalıya cevap süresi verip esasa girer."
    dogru: 1
    aciklama: |
      Kira ilişkisinden kaynaklanan uyuşmazlıklarda arabulucuya başvurulması dava şartıdır (HUAK m. 18/B/1-a). HUAK m. 18/A/2'ye göre arabulucuya başvurulmadan dava açıldığı anlaşılırsa herhangi bir işlem yapılmaksızın dava, dava şartı yokluğu sebebiyle usulden reddedilir.
olaylar:
  - olay: |
      Emekli Hasan, evini gerçek kişi olan Aylin'e konut olarak kiralamıştır. Aylin üç aydır kira ödemediği için Hasan, 2026 yılında arabulucuya başvurmuş, anlaşma sağlanamamış ve son tutanak düzenlenmiştir. Hasan, kira alacağı ve tahliye istemiyle son tutanağı ekleyerek asliye hukuk mahkemesinde dava açmıştır. Mahkeme, davanın sulh hukukun görevinde olduğunu belirterek görevsizlik kararı vermiş, karar kanun yoluna başvurulmadan 10 Mart günü kesinleşmiştir. Hasan ayrıca komşusu Tarık'ın, tapu maliki olduğu arsanın sınırındaki duvarı kendi arsasına taşırdığını ileri sürerek mülkiyetine dayanan bir dava açmayı düşünmektedir.

      1. Kira alacağı ve tahliye davasında görevli mahkeme hangisidir?
      2. Asliye hukuk mahkemesinin yaptığı işlem ve sonucu nedir?
      3. Hasan bundan sonra ne yapmalıdır?
      4. Tarık'a karşı açılacak dava hangi mahkemede görülür?
    olcut:
      - {tespit: "Kira alacağı ve tahliyenin sulh hukukun görevinde olduğunun tespiti", puan: 25, madde: "HMK m. 4"}
      - {tespit: "Görevin dava şartı olduğu ve mahkemece resen incelendiği; görevsizlik kararının isabeti", puan: 20, madde: "HMK m. 115"}
      - {tespit: "Kesinleşmeden itibaren iki hafta içinde dosyanın gönderilmesini isteme yükümlülüğü ve sonucu", puan: 25, madde: "HMK m. 20"}
      - {tespit: "Kira davasında son tutanak mevcut olduğundan arabuluculuk dava şartının sağlandığının belirtilmesi", puan: 10, madde: "HUAK m. 18/B"}
      - {tespit: "Mülkiyete dayalı elatmanın önlenmesi davasının asliye hukukta açılacağı", puan: 20, madde: "HMK m. 2"}
    cozum: |
      **Nitelendirme:** Olay iki ayrı uyuşmazlıktan oluşur: kira ilişkisinden doğan alacak ve tahliye davası ile mülkiyete dayalı elatmanın önlenmesi. Her ikisi için görevli mahkeme ve dava şartı sorunları ayrıdır.

      **Hukuki sorunlar:** (1) Görevli mahkeme, (2) yanlış mahkemede açılan davanın akıbeti ve görevsizlik sonrası süre, (3) arabuluculuk dava şartı, (4) elatmanın önlenmesi için görevli mahkeme.

      **İlgili hükümler ve değerlendirme:** HMK m. 4/1-a, ilamsız icra yoluyla tahliyeye ilişkin hükümler ayrık olmak üzere, kira ilişkisinden doğan alacak davaları dâhil tüm uyuşmazlıkları konu alan davaları sulh hukuk mahkemesinin görevine verir. Hasan ilamsız tahliye takibi başlatmadığı, genel hükümlere göre dava açtığı için sulh hukuk görevlidir. Dava değerinin önemi yoktur.

      Görevli olma bir dava şartıdır (HMK m. 114/1-c) ve mahkeme bunu davanın her aşamasında kendiliğinden araştırır (HMK m. 115/1). Asliye hukuk mahkemesinin görevsizlik kararı vermesi doğrudur. Görev noksanlığı tarafların iradesiyle giderilemez; esasa girilmez.

      Görevsizlik kararı kanun yoluna başvurulmadan kesinleştiğinden HMK m. 20/1 uyarınca Hasan, kesinleşme tarihi olan 10 Mart'tan itibaren iki hafta içinde kararı veren mahkemeye başvurarak dosyanın görevli sulh hukuk mahkemesine gönderilmesini istemelidir. Süre kaçırılırsa dava açılmamış sayılır. Dosya kendisine gönderilen mahkeme taraflara kendiliğinden davetiye gönderir (HMK m. 20/2).

      Kira ilişkisinden kaynaklanan uyuşmazlıklarda arabulucuya başvurulması dava şartıdır (HUAK m. 18/B/1-a). Hasan arabulucuya başvurmuş ve son tutanağı dilekçeye eklemiştir (HUAK m. 18/A/2); bu dava şartı yönünden eksiklik yoktur.

      Tarık'a karşı dava mülkiyet hakkına dayanır; bu hakkın korunmasıdır, sadece zilyetliğin korunması değildir (HMK m. 4/1-c). Malik, haksız elatmanın önlenmesini dava edebilir (TMK m. 683/2). Aksi özel bir düzenleme bulunmadığından görevli mahkeme asliye hukuktur (HMK m. 2). Bu davanın "komşu hakkından kaynaklanan uyuşmazlık" sayılarak dava şartı arabuluculuğa (HUAK m. 18/B/1-ç) tabi olup olmadığı ayrı bir tartışma konusudur; görev sorusunun cevabını etkilemez (bkz. doktrin).

      **Sonuç:** Kira davasında sulh hukuk görevlidir; asliye hukukun görevsizlik kararı isabetlidir; Hasan iki hafta içinde dosyanın gönderilmesini istemelidir; arabuluculuk koşulu sağlanmıştır; elatma davası asliye hukukta açılır.
  - olay: |
      Kardeşler Oya ve Cem, babalarından kalan arsada paydaştır. Oya, arsanın satışla giderilmesi için arabulucuya başvurmadan sulh hukuk mahkemesinde dava açmıştır. Cem cevabında, arsa üzerindeki iki katlı binayı kendi parasıyla yaptırdığını, bu yüzden binanın kendisine ait olduğunu ileri sürmüştür. Babanın mirasçılık belgesi henüz alınmamıştır ve Oya bunu da sulh hukuk mahkemesinden istemektedir.

      1. Ortaklığın giderilmesi davasında görevli mahkeme hangisidir ve arabuluculuğa başvurulmamış olmasının sonucu nedir?
      2. Cem'in bina iddiası nasıl ele alınmalıdır?
      3. Mirasçılık belgesi için görevli mahkeme hangisidir?
    olcut:
      - {tespit: "Ortaklığın giderilmesi davasının sulh hukukun görevinde olduğunun tespiti", puan: 20, madde: "HMK m. 4"}
      - {tespit: "Arabulucuya başvurulmadan açılan davanın dava şartı yokluğundan usulden reddi", puan: 20, madde: "HUAK m. 18/A"}
      - {tespit: "Ortaklığın giderilmesi uyuşmazlıklarında arabuluculuğun dava şartı olduğunun belirtilmesi", puan: 10, madde: "HUAK m. 18/B"}
      - {tespit: "Muhdesat iddiasında görevli mahkemede dava açmak için uygun süre verilmesi ve sonucunun beklenmesi", puan: 30, madde: "HMK m. 165"}
      - {tespit: "Mirasçılık belgesinin çekişmesiz yargı işi olarak sulh hukukun görevinde olduğunun belirtilmesi", puan: 20, madde: "HMK m. 383"}
    cozum: |
      **Nitelendirme:** Olay üç unsurdan oluşur: ortaklığın giderilmesi davası, dava içindeki muhdesat (bina) mülkiyet iddiası ve çekişmesiz yargı işi niteliğinde mirasçılık belgesi isteği.

      **Hukuki sorunlar:** (1) Görevli mahkeme ve dava şartı arabuluculuk, (2) muhdesat uyuşmazlığının ele alınış biçimi, (3) mirasçılık belgesi için görevli mahkeme.

      **İlgili hükümler ve değerlendirme:** HMK m. 4/1-b, taşınır ve taşınmaz mal veya hakkın paylaştırılmasına ve ortaklığın giderilmesine ilişkin davaları sulh hukuk mahkemesinin görevine verir. Oya sulh hukuka başvurmakla doğru mahkemeyi seçmiştir.

      Ancak ortaklığın giderilmesi uyuşmazlıklarında dava açılmadan önce arabulucuya başvurulması dava şartıdır (HUAK m. 18/B/1-b). Arabulucuya başvurulmadan dava açıldığı anlaşılırsa herhangi bir işlem yapılmaksızın dava, dava şartı yokluğu sebebiyle usulden reddedilir (HUAK m. 18/A/2). Görevin doğru olması, dava şartı eksikliğini gidermez; iki kontrol ayrıdır. Dava bu nedenle usulden reddedileceğinden aşağıdaki muhdesat ve mirasçılık belgesi değerlendirmesi, Oya'nın arabulucuya başvurduktan sonra yeniden açacağı dava ve ayrıca yapacağı başvuru için geçerlidir.

      Cem'in bina iddiası, ortaklığın giderilmesi davasının içinde ortaya çıkan ayrı bir aidiyet (mülkiyet) uyuşmazlığıdır. Mahkeme bunu doğrudan çözmek yerine, uyuşmazlığın giderilmesini isteyen paydaşa görevli mahkemede dava açması için HMK m. 165/2 uyarınca uygun bir süre verir. Süre içinde dava açılırsa sonucu beklenir; açılmazsa ilgili taraf bu husustaki iddiasından vazgeçmiş sayılır ve esas dava hakkında karar verilir. Aksi özel bir görev kuralı bulunmayan bir aidiyet tespiti için genel görevli mahkeme asliye hukuktur (HMK m. 2).

      Mirasçılık belgesi verilmesi HMK m. 382/2-c'de çekişmesiz yargı işleri arasında sayılmıştır; aksine hüküm bulunmadığı sürece çekişmesiz yargı işlerinde görevli mahkeme sulh hukuk mahkemesidir (HMK m. 383/1).

      **Sonuç:** Ortaklığın giderilmesi için sulh hukuk görevlidir ama arabulucuya başvurulmadığından dava usulden reddedilmelidir; arabuluculuktan sonra yeniden açılacak ortaklığın giderilmesi davasında Cem'in muhdesat iddiası için HMK m. 165/2 uyarınca süre verilir; mirasçılık belgesi sulh hukukta alınır.
kartlar:
  - on: "Görev nedir, hangi niteliktedir?"
    arka: "Aynı yargı kolundaki farklı türde mahkemeler arasında davaların konusuna göre dağılımı; ancak kanunla düzenlenir ve kamu düzenindendir (HMK m. 1)."
  - on: "Görev, davanın hangi aşamasında incelenir?"
    arka: "Her aşamada kendiliğinden; görevli olmak dava şartıdır (HMK m. 114/1-c, HMK m. 115/1)."
  - on: "Asliye hukuk mahkemesinin görevi?"
    arka: "Değer ve miktara bakılmaksızın malvarlığı ve şahıs varlığı davaları ile aksine düzenleme olmayan diğer dava ve işler (HMK m. 2)."
  - on: "Sulh hukukun dört görev alanı?"
    arka: "Kira, paylaşma ve ortaklığın giderilmesi, sadece zilyetliğin korunması, sulh hukuku görevlendiren kanun hükümleri (HMK m. 4/1-a, b, c, ç)."
  - on: "HMK m. 4/1-a hangi istisnayı içerir?"
    arka: "İİK'ya göre ilamsız icra yoluyla tahliyeye ilişkin hükümler hariçtir; bu istemlerde icra mahkemesi görevlidir (İİK m. 269/a, İİK m. 269/b)."
  - on: "Mülkiyete dayalı elatmanın önlenmesinde görevli mahkeme?"
    arka: "Asliye hukuk (HMK m. 2, TMK m. 683); sulh hukuk yalnızca zilyetliğin korunmasında görevlidir (HMK m. 4/1-c)."
  - on: "HMK m. 3'ün durumu?"
    arka: "Anayasa Mahkemesinin E. 2011/35, K. 2012/23 sayılı kararıyla iptal edilmiştir; görev ilişkinin niteliğine göre belirlenir."
  - on: "Çekişmesiz yargı işlerinde görevli mahkeme?"
    arka: "Aksine hüküm yoksa sulh hukuk mahkemesi (HMK m. 383/1); örnekleri HMK m. 382'de sayılmıştır."
  - on: "Asliye ticaret ile asliye hukuk arası ilişki?"
    arka: "Görev ilişkisidir (TTK m. 5/3); asliye ticaret bulunmayan yerde görev kuralına dayanılmamışsa görevsizlik kararı verilmez (TTK m. 5/4)."
  - on: "Görevsizlik kararından sonra süre?"
    arka: "Kesinleşme veya tebliğden itibaren iki hafta içinde dosyanın gönderilmesi istenir; aksi hâlde dava açılmamış sayılır (HMK m. 20/1)."
  - on: "Ortaklığın giderilmesinde muhdesat iddiasında ne yapılır?"
    arka: "İddia sahibine görevli mahkemede dava açması için HMK m. 165 uyarınca uygun süre verilir."
  - on: "HUAK m. 18/B kapsamındaki uyuşmazlıklar?"
    arka: "Kira (ilamsız tahliye hükümleri hariç), paylaşma ve ortaklığın giderilmesi, Kat Mülkiyeti Kanunu, komşu hakkı; arabuluculuk dava şartıdır."
