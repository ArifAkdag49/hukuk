doktrin: |
  ### Adli tatilde yapılan tebligat ve sürenin başlaması
  Adli tatile tabi bir davada tatil içinde tebligat yapılabildiği (HMK m. 103/3) ve sürelerin tebliğle işlemeye başladığı (HMK m. 91) ortadadır. Bir görüş, tatil içinde tebliğ edilen kararın süresinin tatil boyunca işlememesi, 1 Eylül'den itibaren başlaması gerektiğini ileri sürer. Çoğunlukla kabul edilen görüş ise tebliğ anında süre başlar, HMK m. 104'ün yalnız sürenin **bitiminin** tatile rastlaması hâlinde bir haftalık uzama sağladığı yönündedir. Sınavda çoğunlukla kabul edilen görüşle çözüm kurulur; ayrıntı ancak sorulursa karşı görüş anılır.

  ### HMK m. 104'ün kapsamı: "bu Kanunun tayin ettiği süreler"
  HMK m. 104 yalnız "bu Kanunun tayin ettiği süreler"i uzatır. Maddi hukuktan doğan zamanaşımı ve hak düşürücü sürelerin bu kapsamda sayılıp sayılmayacağı tartışmalıdır. Adli tatilde dilekçe verilebildiği (HMK m. 103/3) için bu sürelerin uzamaması yönünde ağırlıklı bir yaklaşım vardır; ancak özel kanunlardaki sürelerde farklı değerlendirmeler yapılabilir. Bu nedenle konu sınavda belirsiz bırakılmadan, sadece HMK'daki usul süreleri üzerinden sorulur.

  ### Vekilin kusuru ve eski hâle getirme
  Süreyi kaçıran kişinin vekili olduğunda, vekilin kusurunun asılın "elde olmayan sebebi" sayılıp sayılmayacağı tartışmalıdır. Bir görüş, müvekkilin vekil seçiminde ve talimatında kusuru yoksa vekilin kusurlu ihmalinin müvekkile yüklenmemesi gerektiğini savunur. Karşı görüş, davaya vekâlette temsil hükümleri uygulandığından (HMK m. 72) vekilin kusurunun müvekkile ait sayılacağını, müvekkilin vekile rücu edebileceğini kabul eder. Vekilin ağır hastalığı veya kaza gibi gerçekten iradesi dışındaki bir engel ise ayrıca değerlendirilir.
sozluk:
  - terim: Kanuni süre
    tanim: "Kanunda belirtilen süre; kesindir ve kanundaki istisnai durumlar dışında hâkim tarafından artırılıp eksiltilemez (HMK m. 90/1, m. 94/1)."
  - terim: Hâkimin süresi
    tanim: "Hâkimin tespit ettiği süre; haklı sebeple artırılıp eksiltilebilir, kesin olduğu belirtilmedikçe kesin değildir; ancak ilk süreyi geçiren tarafa verilen ikinci süre kendiliğinden kesindir (HMK m. 90/2, m. 94/2)."
  - terim: Kesin süre
    tanim: "Geçirilmesi hâlinde ilgili işlemi yapma hakkını ortadan kaldıran süre (HMK m. 94/3)."
  - terim: Tebliğ
    tanim: "Mahkeme işleminin ilgiliye resmen bildirilmesi; süreler kural olarak tebliğle başlar (HMK m. 91)."
  - terim: Tefhim
    tanim: "Kararın sözlü olarak, ilgililerin huzurunda açıklanması; süre yalnız kanun öngördüğünde tefhimle başlar."
  - terim: Tatil saati
    tanim: "Sürenin son günü mesai saatinin bitimi; elektronik işlemlerde süre gün sonunda biter (HMK m. 92, m. 445/4)."
  - terim: Eski hâle getirme
    tanim: "Elde olmayan sebeple kaçırılan kesin sürenin telafisini sağlayan kurum (HMK m. 95-101)."
  - terim: Elde olmayan sebep
    tanim: "Kişinin iradesi dışında gelişen ve süre içinde işlemi yapmasına engel olan hâl; örneğin ani ağır hastalık veya kaza."
  - terim: Adli tatil
    tanim: "Her yıl 20 Temmuz-31 Ağustos arası; bu dönemde yalnız HMK m. 103'te sayılan dava ve işler görülür (HMK m. 102)."
  - terim: Adli tatilde görülen işler
    tanim: "HMK m. 103/1'deki sayılan dava ve işler; bunlarda süre uzaması uygulanmaz."
  - terim: Adli tatile tabi dava
    tanim: "HMK m. 103'te sayılmayan dava; süre bitişi tatile rastlarsa adli tatilin bittiği günden itibaren bir hafta uzar (HMK m. 104)."
kararlar:
  - id: "1153922600"
    ozet: |
      Davacı, Rusya'daki bir mermer atölyesinde çalışırken geçirdiği olayın iş kazası olduğunun tespitini SGK ve işveren şirket aleyhine istemiştir. Dava, kurumun sonradan olayı iş kazası olarak kabul etmesi üzerine konusuz kaldığı gerekçesiyle ilk derece mahkemesince karara yer olmadığıyla sonuçlandırılmış, davacı vekili kararı istinaf etmiştir. Bölge adliye mahkemesi başvuruyu süre yönünden reddetmiştir. Karar metninde aktarılan Yargıtay 10. Hukuk Dairesinin ilk bozma gerekçesine göre iş kazası tespiti davası HMK m. 103 kapsamında adli tatilde görülecek bir dava değildir, ivedi görülmesine karar verilmiş bir iş de değildir; bu nedenle davacı HMK m. 104'teki bir haftalık süreden yararlanır. Karar 7 Ağustos 2019'da tebliğ edilmiş, istinaf dilekçesi 22 Ağustos 2019'da verilmiştir; bu dilekçe süresindedir. Hukuk Genel Kurulunun asıl çözdüğü sorun ise sonraki aşamada davanın davalı işveren yönünden de konusuz kalıp kalmadığı ve işveren hakkında ayrıca hüküm kurulmasının gerekip gerekmediğidir (Kurul oy çokluğuyla direnmeyi uygun bulmuştur); adli tatil bakımından karar, Özel Daire gerekçesinin aktarımı niteliğindedir.
  - id: "1126618100"
    ozet: |
      Hukuk Genel Kurulunun karar metni, şirketin yöneticilerine karşı açılan tazminat davasında önce asıl uyuşmazlık olan görev sorununu (iş mahkemesi mi, asliye ticaret mahkemesi mi) çözer. Olgular arasında aktarılan Yargıtay 11. Hukuk Dairesinin karar düzeltme gerekçesi eski hâle getirme bakımından öğreticidir: Davalı vekili temyiz süresini, kendisinin göğüs ağrısıyla hastaneye başvurması nedeniyle kaçırdığını ileri sürmüş, 8-10 Mayıs 2012 tarihli rapor ekleyerek HMK m. 95 vd. uyarınca eski hâle getirme istemiştir. Yerel mahkeme temyiz isteminin süreden reddine karar vermiştir. Özel Daire, temyiz süresinin geçirilmesi hâlinde eski hâle getirme isteminin HMK m. 98 gereği temyizi inceleyecek Yargıtay dairesine ait olduğunu belirtmiş, mazereti HMK m. 95/1 ve m. 95/2 kapsamında değerlendirilebilir görerek eski hâle getirme isteminin kabulüne karar vermiştir. Bu bölüm, eski hâle getirmenin merciini ve elde olmayan sebep (hastalık) örneğini gösterir; Genel Kurulun kendi gerekçesi görev konusundadır.
sorular:
  - soru: |
      HMK m. 90'a göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Hâkim kanundaki süreleri haklı sebeple artırabilir veya eksiltebilir"
      - "Hâkim, kendisinin tespit ettiği süreleri haklı sebeplerle artırabilir veya eksiltebilir"
      - "Hâkimin belirlediği süreler her durumda kesindir"
      - "Süreleri yalnızca kanun belirler; hâkim süre tespit edemez"
    dogru: 1
    aciklama: |
      HMK m. 90/1'e göre hâkim, kanunda belirtilen istisnai durumlar dışında kanundaki süreleri artıramaz veya eksiltemez. HMK m. 90/2 ise hâkimin kendi tespit ettiği süreleri haklı sebeplerle artırıp eksiltebileceğini söyler. Hâkimin süresi, kesin olduğu açıkça belirtilmedikçe kesin değildir; ancak ilk süreyi geçiren tarafa verilen ikinci süre kesindir (HMK m. 94/2).
  - soru: |
      Ayşe'ye 3 Mart Pazartesi günü, kendisine on günlük süre veren bir ara karar tebliğ edilmiştir. Son günün resmî tatile veya hafta sonuna rastlamadığı varsayıldığında, süre hangi gün sona erer?
    siklar:
      - "12 Mart"
      - "13 Mart"
      - "14 Mart"
      - "17 Mart"
    dogru: 1
    aciklama: |
      HMK m. 92/1'e göre gün olarak belirlenen sürede tebliğ edildiği gün hesaba katılmaz. Sayım 4 Mart'ta başlar, onuncu gün 13 Mart'tır; süre o günün tatil saatinde (elektronik işlemde gün sonunda) biter. Tebliğ gününü sayan 12 Mart'ı bulur; fazladan gün sayan 14 Mart'ı bulur.
  - soru: |
      31 Ocak günü tebliğ edilen ve kanunda "bir ay" olarak belirlenmiş bir süre HMK m. 92/2'ye göre ne zaman biter?
    siklar:
      - "Mart ayının ilk günü"
      - "Şubat ayının son günü"
      - "Şubat ayının 28'inde, ayın kaç gün çektiğine bakılmaksızın"
      - "Mart ayının 3'ünde"
    dogru: 1
    aciklama: |
      HMK m. 92/2'ye göre sürenin bittiği ayda başladığı güne karşılık gelen bir gün yoksa süre o ayın son günü tatil saatinde biter. Şubat'ta 31 olmadığından Şubat ayının son günü (28 ya da 29 olabilir) süre biter. "28'inde" demek artık yıllarda yanlış olur.
  - soru: |
      Süresi bir Cumartesi gününe rastlayan bir işlem için, Pazartesi günü iş günü olduğuna göre HMK m. 93 uyarınca süre ne zaman biter?
    siklar:
      - "Cumartesi gününün sonunda; hafta sonu tatili süreye etki etmez"
      - "Cuma günü sonunda, çünkü süre tatile kalamaz"
      - "Tatili takip eden ilk iş günü olan Pazartesi çalışma saati sonunda"
      - "Salı günü sonunda"
    dogru: 2
    aciklama: |
      HMK m. 93'e göre resmî tatil günleri süreye dâhildir; ancak sürenin son günü resmî tatile rastlarsa süre tatili takip eden ilk iş günü çalışma saati sonunda biter. Süre tatilde akmaya devam eder; yalnızca son günün tatile gelmesi uzatma sağlar.
  - soru: |
      Mahkeme Mehmet'e delil avansını iki hafta içinde yatırmasını söylemiş, süreyi kesin olarak belirlememiştir. Mehmet bu süreyi geçirdikten sonra yeniden süre istemiştir. Hâkimin vereceği süre bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Verilecek ikinci süre kesindir ve yeniden süre verilemez"
      - "Hâkim sınırsız sayıda yeniden süre verebilir"
      - "İkinci süre de kesin olmayabilir; her seferinde kesin olduğu belirtilmelidir"
      - "Hâkim yeniden süre veremez, çünkü ilk süre geçmiştir"
    dogru: 0
    aciklama: |
      HMK m. 94/2'ye göre kesin olduğu belirtilmeyen süreyi geçirmiş olan taraf yeniden süre isteyebilir; bu şekilde verilecek ikinci süre kesindir ve yeniden süre verilemez. Kesin süre içinde işlemi yapmayanın o işlemi yapma hakkı ortadan kalkar (HMK m. 94/3).
  - soru: |
      Eski hâle getirme talebi bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Talep, engelin ortadan kalkmasından itibaren bir ay içinde yapılmalıdır"
      - "Talep, engelin ortadan kalkmasından itibaren iki hafta içinde yapılmalı; süresinde yapılamayan işlem de aynı süre içinde yapılmalıdır"
      - "Talep, nihai karardan sonra hiçbir koşulda yapılamaz"
      - "Talebin dilekçeyle yapılması şart değildir; sözlü beyan yeterlidir"
    dogru: 1
    aciklama: |
      HMK m. 96/1 ve HMK m. 97 uyarınca talep engelin kalkmasından itibaren iki hafta içinde dilekçeyle yapılır ve süresinde yapılamayan işlem de bu süre içinde yapılmalıdır. Nihai karar bir tarafın yokluğunda verilmişse tahkikatta kaçırılan süreler için karardan sonra da talep edilebilir (HMK m. 96/2).
  - soru: |
      Davacı Ali, kesin süre içinde yapması gereken bir işlemi kaçırmıştır; ancak aynı hukuki sonuca ıslah gibi başka bir hukuki yoldan ulaşabilmektedir. Ali eski hâle getirme talebinde bulunursa sonuç ne olur?
    siklar:
      - "Talep kabul edilir, çünkü Ali kusursuzdur"
      - "Talep kabul edilir ancak giderler karşı tarafa yükletilir"
      - "Talep edilemez, çünkü süresinde yapılamayan işlemle ulaşılmak istenen sonuca başka bir hukuki yoldan ulaşılabilmektedir"
      - "Talep ancak teminat gösterilirse incelenir"
    dogru: 2
    aciklama: |
      HMK m. 95/2'ye göre süresinde yapılamayan işlemle ulaşılmak istenen aynı sonuca, eski hâle getirme dışında başka bir hukuki yoldan ulaşılabiliyorsa eski hâle getirme talebinde bulunulamaz. Eski hâle getirme tali bir yoldur.
  - soru: |
      Hasan'ın avukatı ağır bir kaza geçirdiği için istinaf süresi kaçırılmış, bölge adliye mahkemesi de başvuru hakkının düşmesine karar vermiştir. Hasan eski hâle getirme talebini hangi mercie yapmalıdır?
    siklar:
      - "Kararı veren ilk derece mahkemesine"
      - "Bölge adliye mahkemesine"
      - "Yargıtaya"
      - "Hâkimler ve Savcılar Kurulu'na"
    dogru: 1
    aciklama: |
      HMK m. 98/2: Eski hâle getirme, istinaf yoluna başvuru hakkının düşmesi hâlinde bölge adliye mahkemesinden; temyiz yoluna başvuru hakkının düşmesi hâlinde ise Yargıtaydan talep edilir. Genel kural, işlem hakkında hangi mahkemede inceleme yapılacaksa oradan talep edilmesidir (HMK m. 98/1).
  - soru: |
      Eski hâle getirme talebi kabul edilen Zeynep'in talebi sebebiyle ortaya çıkan giderler kime yükletilir?
    siklar:
      - "Karşı tarafa, çünkü Zeynep haklı çıkmıştır"
      - "Giderler Hazineye bırakılır"
      - "Talepte bulunan Zeynep'e; karşı taraf asılsız itirazla giderleri artırmışsa hâkim bir kısmını karşı tarafa yükleyebilir"
      - "Giderler iki tarafa eşit paylaştırılır"
    dogru: 2
    aciklama: |
      HMK m. 101: Eski hâle getirme talebi sebebiyle ortaya çıkan giderler talepte bulunan tarafa yükletilir. Yalnızca karşı taraf talebe karşı asılsız itirazlar ileri sürerek giderlerin artmasına sebep olmuşsa hâkim giderlerin tümünü veya bir kısmını karşı tarafa yükleyebilir. Haklı çıkmak kural olarak giderlerin yer değiştirmesini sağlamaz.
  - soru: |
      Aşağıdakilerden hangisi HMK m. 103 uyarınca adli tatilde görülen dava ve işlerden değildir?
    siklar:
      - "Nafaka davaları"
      - "Velayete ilişkin dava ve işler"
      - "İhtiyati haciz talepleri hakkında karar verilmesi"
      - "Satış sözleşmesinden doğan alacak davası"
    dogru: 3
    aciklama: |
      HMK m. 103/1'e göre nafaka davaları, velayet, soybağı ve vesayete ilişkin dava ve işler ile ihtiyati haciz gibi geçici hukuki koruma talepleri adli tatilde görülür. Satış sözleşmesinden doğan alacak davası listede sayılmadığı için adli tatilde görülen işlerden değildir; bu dava adli tatile tabidir.
  - soru: |
      Asliye ticaret mahkemesinde görülen fatura alacağı davasında hüküm A'ya 12 Ağustos 2026 Çarşamba günü tebliğ edilmiştir. İstinaf süresi iki haftadır. A istinaf dilekçesini 4 Eylül 2026 Cuma günü vermiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Süre 26 Ağustos'ta bitmiştir, dilekçe süreden sonra verilmiştir"
      - "Süre 31 Ağustos'ta bitmiştir, dilekçe süreden sonra verilmiştir"
      - "Fatura alacağı davası adli tatilde görülen işlerden değildir; süre bitişi tatile rastladığından adli tatilin bittiği günden itibaren bir hafta uzar ve dilekçe süresindedir"
      - "Adli tatilde süre işlemez; süre 1 Eylül'de başlar ve dilekçe süresindedir"
    dogru: 2
    aciklama: |
      Fatura alacağı davası HMK m. 103'te sayılmadığından adli tatile tabidir. İki haftalık süre 26 Ağustos'ta (adli tatil içinde) biteceği için HMK m. 104 uyarınca adli tatilin bittiği günden itibaren bir hafta uzatılmış sayılır ve 7 Eylül 2026'da biter. 4 Eylül'de verilen dilekçe süresindedir. Süre, tebliğ ile adli tatil içinde de işlemeye başlamıştır; son seçenekteki "1 Eylül'de başlar" ifadesi HMK m. 104'e uymaz.
  - soru: |
      Bir işçi, işvereni aleyhine iş sözleşmesine dayanan kıdem tazminatı davası açmıştır. Hüküm işveren vekiline 5 Ağustos 2026 Çarşamba günü tebliğ edilmiş, işveren iki haftalık istinaf süresinin adli tatile rastladığı düşüncesiyle istinaf dilekçesini 4 Eylül 2026'da vermiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Süre HMK m. 104 uyarınca 7 Eylül'e uzamıştır, dilekçe süresindedir"
      - "Dava HMK m. 103/1-ç'deki işçilerin açtığı davalardandır; adli tatilde görülen işlerde HMK m. 104 uzaması uygulanmaz ve süre 19 Ağustos'ta bitmiştir"
      - "Süre 31 Ağustos'ta bitmiştir"
      - "Adli tatilde yapılan tebligat geçersizdir, süre başlamamıştır"
    dogru: 1
    aciklama: |
      HMK m. 103/1-ç hizmet akdi veya iş sözleşmesi sebebiyle işçilerin açtıkları davaları adli tatilde görülen işler arasında sayar. HMK m. 104 "adli tatile tabi olan" dava ve işler içindir; bu dava adli tatilde görüldüğünden uzama olmaz. Tebliğ 5 Ağustos'ta yapıldığı için iki haftalık süre 19 Ağustos Çarşamba günü biter; 4 Eylül tarihli dilekçe geçtir. Adli tatilde her türlü tebligat yapılabilir (HMK m. 103/3).
olaylar:
  - olay: |
      Aşağıdaki üç davada istinaf süresi iki haftadır (HMK m. 345). Hiçbir davanın ivedi görülmesine karar verilmemiştir ve tarihlerde resmî tatil bulunmadığı varsayılacaktır.

      a) İşçi İsmail, işvereni X A.Ş. aleyhine kıdem tazminatı davası açmış ve dava kabul edilmiştir. Gerekçeli karar X A.Ş. vekiline 5 Ağustos 2026 Çarşamba günü tebliğ edilmiştir. Vekil, adli tatil olduğu için sürenin uzadığını düşünerek istinaf dilekçesini 4 Eylül 2026 Cuma günü vermiştir.

      b) Tacir A, tacir B aleyhine Asliye Ticaret Mahkemesinde fatura alacağı davası açmış ve dava kabul edilmiştir. Karar B'ye 12 Ağustos 2026 Çarşamba günü tebliğ edilmiş, B istinaf dilekçesini 4 Eylül 2026 Cuma günü vermiştir.

      c) Aynı ticari davada, bir başka karar C'ye 20 Ağustos 2026 Perşembe günü tebliğ edilmiş, C dilekçesini 7 Eylül 2026 Pazartesi günü vermiştir.

      1. Her bir istinaf dilekçesinin süresinde olup olmadığını gerekçesiyle değerlendiriniz.
      2. Adli tatilde görülen işler ile adli tatile tabi işlerin farkını açıklayınız.
    olcut:
      - {tespit: "Sürenin tebliğle başladığı ve iki haftalık sürenin karşılık gelen günde bittiği", puan: 15, madde: "HMK m. 92"}
      - {tespit: "İşçinin açtığı davanın adli tatilde görülen işlerden olduğu", puan: 20, madde: "HMK m. 103"}
      - {tespit: "(a) bakımından HMK m. 104 uzamasının uygulanmadığı, sürenin 19 Ağustos 2026'da bittiği ve dilekçenin süreden sonra verildiği", puan: 20, madde: "HMK m. 104"}
      - {tespit: "(b) bakımından ticari alacak davasının adli tatile tabi olduğu, sürenin tatilde bittiği ve 7 Eylül 2026'ya uzandığı, dilekçenin süresinde olduğu", puan: 20, madde: "HMK m. 104"}
      - {tespit: "(c) bakımından süre bitişi adli tatile rastlamadığı için uzama olmadığı, sürenin 3 Eylül 2026'da bittiği ve dilekçenin süreden sonra verildiği", puan: 15, madde: "HMK m. 102"}
      - {tespit: "Adli tatilin 20 Temmuz-31 Ağustos arası olduğu ve tatilde tebligatın yapılabildiği", puan: 10, madde: "HMK m. 103"}
    cozum: |
      **Nitelendirme:** Olay, istinaf süresinin hesabına ve adli tatilin sürelere etkisine ilişkindir. Üç davada da süre iki haftalıktır; fark, davanın HMK m. 103'te sayılan işlerden olup olmaması ve sürenin bitişinin adli tatile rastlayıp rastlamamasıdır.

      **Hukuki sorunlar:** (1) Süre ne zaman başlar ve nasıl biter? (2) Davalar adli tatilde görülen işlerden midir? (3) HMK m. 104'teki bir haftalık uzama hangi davalara ve hangi hâllerde uygulanır?

      **İlgili hükümler:** HMK m. 91, HMK m. 92, HMK m. 102, HMK m. 103, HMK m. 104 ve HMK m. 345.

      **Değerlendirme:**
      1. Süreler tebliğle başlar (HMK m. 91). İki hafta olarak belirlenen süre, başladığı güne son hafta içindeki karşılık gelen günün tatil saatinde biter (HMK m. 92/2). Adli tatil 20 Temmuz'da başlayıp 31 Ağustos'ta sona erer (HMK m. 102). Tatilde dava ve işlerle ilgili her türlü tebligat yapılabildiği için (HMK m. 103/3) tebliğ geçerlidir ve süre tebliğle işlemeye başlar.
      2. (a) İsmail'in açtığı kıdem tazminatı davası, HMK m. 103/1-ç uyarınca hizmet akdi veya iş sözleşmesi sebebiyle işçilerin açtıkları davalardandır; bu dava adli tatilde görülür. HMK m. 104 "adli tatile tabi olan dava ve işler" için uzama sağladığından bu davada uzama söz konusu olmaz. Karar 5 Ağustos 2026 Çarşamba günü tebliğ edildiğinden iki haftalık süre 19 Ağustos 2026 Çarşamba günü sona ermiştir. 4 Eylül 2026'da verilen dilekçe süresinden sonradır; istinaf dilekçesi süre yönünden reddedilir (HMK m. 346).
      3. (b) Fatura alacağı davası HMK m. 103'te sayılan işlerden değildir ve ivedi görülmesine karar verilmediğinden adli tatile tabidir. Tebliğ 12 Ağustos 2026 Çarşamba günü yapılmış, süre normalde 26 Ağustos 2026 Çarşamba günü biterdi. Bu gün adli tatil içindedir; HMK m. 104 gereği süre ayrıca karar gerekmeksizin adli tatilin bittiği günden itibaren bir hafta uzatılmış sayılır ve 7 Eylül 2026 Pazartesi günü biter. B'nin 4 Eylül 2026'daki dilekçesi süresindedir.
      4. (c) Aynı dava adli tatile tabi olmakla birlikte uzama için sürenin bitiminin adli tatile rastlaması gerekir. Tebliğ 20 Ağustos 2026 Perşembe günü yapıldığından iki haftalık süre 3 Eylül 2026 Perşembe günü sona ermektedir; bu gün adli tatilin dışındadır. Dolayısıyla HMK m. 104 uygulanmaz. C'nin 7 Eylül 2026'daki dilekçesi süresinden sonradır.
      5. Fark: Adli tatilde görülen işler HMK m. 103/1'de sayılan işlerdir ve bunlarda tatil nedeniyle uzama olmaz. Adli tatile tabi işler bunların dışında kalan davalardır; süre bitişi tatile rastlarsa bir hafta uzar.

      **Sonuç:** (a) istinaf dilekçesi süreden sonra verilmiştir; (b) süresindedir; (c) süreden sonra verilmiştir.
  - olay: |
      Mehmet, Zeynep Ltd. Şti. aleyhine açtığı alacak davasında, tensip zaptıyla delil avansı olan 3.000 TL'yi iki hafta içinde yatırmakla yükümlü kılınmıştır. Hâkim süreyi kesin olarak belirlememiştir. Mehmet avansı yatırmamıştır.

      Hâkimin ihtarı üzerine Mehmet yeniden süre istemiş, hâkim ona iki hafta daha süre vermiştir. İkinci süre devam ederken Mehmet ağır bir trafik kazası geçirmiş ve yoğun bakıma alınmıştır; ikinci süre bu sırada dolmuştur. Mehmet 2 Kasım 2026 Pazartesi günü taburcu olmuş, yani engel o gün ortadan kalkmıştır. Mehmet 10 Kasım 2026'da eski hâle getirme dilekçesini, kaza raporunu delil olarak sunarak vermiş ve avansı aynı gün yatırmıştır. Davalı Zeynep Ltd. Şti. talebe karşı asılsız itirazlar ileri sürmüştür.

      1. Hâkimin ilk süresi ve ikinci süresi hukuken nasıl nitelendirilir?
      2. Mehmet'in eski hâle getirme talebi kabul edilir mi?
      3. Talebi hangi mahkeme inceler, yargılama ertelenir mi ve gider kime yükletilir?
    olcut:
      - {tespit: "Hâkimin belirlediği ilk sürenin kesin olmadığı; ikinci sürenin kesin olduğu ve yeniden süre verilemeyeceği", puan: 20, madde: "HMK m. 94/2"}
      - {tespit: "Kesin sürede yapılmayan işlemi yapma hakkının ortadan kalktığı", puan: 15, madde: "HMK m. 94/3"}
      - {tespit: "Elde olmayan sebep (yoğun bakım) ve kesin sürenin kaçırılması", puan: 20, madde: "HMK m. 95/1"}
      - {tespit: "Talebin engelin kalkmasından itibaren iki hafta içinde dilekçeyle yapıldığı ve işlemin de bu süre içinde yerine getirildiği", puan: 20, madde: "HMK m. 96/1"}
      - {tespit: "Talebin ilk derece mahkemesine yapılacağı; yargılamayı kendiliğinden ertelemeyeceği", puan: 10, madde: "HMK m. 98/1"}
      - {tespit: "Giderlerin talepte bulunan Mehmet'e yükletileceği; asılsız itiraz hâlinde hâkimin giderlerin bir kısmını karşı tarafa yükleyebileceği", puan: 15, madde: "HMK m. 101"}
    cozum: |
      **Nitelendirme:** Olay, hâkimin belirlediği süre, kesin süre ve eski hâle getirme kurumlarına ilişkindir.

      **Hukuki sorunlar:** (1) Hâkimin ilk ve ikinci sürelerinin niteliği. (2) Eski hâle getirmenin şartları ve süresi. (3) Merci, yargılamaya etkisi ve giderler.

      **İlgili hükümler:** HMK m. 90, HMK m. 94, HMK m. 95, HMK m. 96, HMK m. 97, HMK m. 98, HMK m. 99 ve HMK m. 101.

      **Değerlendirme:**
      1. Delil avansı için verilen süre hâkimin tespit ettiği süredir (HMK m. 90/2). Hâkim bunu kesin olarak belirlememiştir; bu nedenle ilk süre kesin değildir ve Mehmet yeniden süre isteyebilmiştir. Bu şekilde verilen ikinci süre kanunen kesindir ve yeniden süre verilemez (HMK m. 94/2). Kesin süre içinde yapılması gereken işlemi yapmayan tarafın o işlemi yapma hakkı ortadan kalkar (HMK m. 94/3). Dolayısıyla Mehmet eski hâle getirme olmasaydı avansı yatırarak gösterilecek delilden yararlanma hakkını yitirirdi.
      2. Eski hâle getirme için elde olmayan bir sebeple kanunda belirtilen veya hâkimin kesin olarak belirlediği süre içinde işlemin yapılamamış olması gerekir (HMK m. 95/1). İkinci süre kesindir ve Mehmet yoğun bakımda olduğu için iradesi dışında işlemi yapamamıştır; bu bir elde olmayan sebeptir. Olayda delil avansı yatırmanın başka bir hukuki yoldan telafisi de görünmemektedir (HMK m. 95/2). Talep engelin kalktığı 2 Kasım'dan itibaren iki hafta içinde, dilekçeyle ve sebep ile delil gösterilerek (kaza raporu) yapılmıştır; kaçırılan işlem de aynı süre içinde, 10 Kasım'da yerine getirilmiştir (HMK m. 96/1, HMK m. 97). Şartlar gerçekleştiğinden talep kabul edilir.
      3. Talep, yapılamayan işlem hakkında inceleme yapacak mahkemeden, yani davaya bakan ilk derece mahkemesinden istenir (HMK m. 98/1) ve ön sorunlara ilişkin usulle incelenir (HMK m. 100/1). Eski hâle getirme talebi yargılamanın ertelenmesini gerektirmez ve hükmün icrasına engel olmaz (HMK m. 99). Giderler talepte bulunan Mehmet'e yükletilir; ancak karşı taraf asılsız itirazlarla giderlerin artmasına sebep olduğundan hâkim bu giderin tümünü veya bir kısmını Zeynep Ltd. Şti.'ne yükleyebilir (HMK m. 101).

      **Sonuç:** İlk süre kesin değildir, ikinci süre kesindir. Mehmet'in talebi şartları taşıdığından kabul edilir. Talep ilk derece mahkemesince incelenir, yargılamayı kendiliğinden ertelemez; giderler kural olarak Mehmet'e, asılsız itiraz bulunduğu ölçüde karşı tarafa yükletilebilir.
kartlar:
  - on: "Hâkim kanundaki süreleri değiştirebilir mi?"
    arka: "Hayır, istisnalar dışında artıramaz veya eksiltemez; kendi tespit ettiği süreleri haklı sebeple artırıp eksiltebilir (HMK m. 90)."
  - on: "Süreler nasıl başlar?"
    arka: "Tebliğ tarihinden; kanunda öngörülen hâllerde tefhim tarihinden (HMK m. 91)."
  - on: "Gün olarak belirlenen süre nasıl hesaplanır?"
    arka: "Tebliğ veya tefhim günü hesaba katılmaz; süre son günün tatil saatinde biter (HMK m. 92/1)."
  - on: "Hafta, ay, yıl olarak belirlenen süre nerede biter?"
    arka: "Başladığı güne son hafta, ay veya yıl içindeki karşılık gelen günde; yoksa ayın son günü (HMK m. 92/2)."
  - on: "Son gün resmî tatile rastlarsa?"
    arka: "Tatili izleyen ilk iş günü çalışma saati sonunda biter; resmî tatil süreye dâhildir (HMK m. 93)."
  - on: "Hâkimin süresi nasıl kesin olur?"
    arka: "Hâkim kesin olduğuna karar verir, işlemi duraksamaya yer vermeyecek şekilde açıklar ve sonucu tutanağa geçirerek ihtar eder (HMK m. 94/2)."
  - on: "Kesin olmayan süre geçirilirse?"
    arka: "Yeniden süre istenebilir; verilen ikinci süre kesindir ve yeniden süre verilemez (HMK m. 94/2)."
  - on: "Kesin süreyi kaçırmanın sonucu?"
    arka: "O işlemi yapma hakkı ortadan kalkar (HMK m. 94/3)."
  - on: "Eski hâle getirmenin şartları?"
    arka: "Elde olmayan sebep; kanuni veya hâkimin kesin süresi; aynı sonuca başka yoldan ulaşılamaması (HMK m. 95)."
  - on: "Eski hâle getirme süresi ve mercii?"
    arka: "Engelin kalkmasından itibaren iki hafta (işlem de bu sürede yapılır); inceleme yapacak mahkemeden, istinaf hakkı düşmüşse BAM'dan, temyiz hakkı düşmüşse Yargıtaydan (HMK m. 96-98)."
  - on: "Eski hâle getirme giderleri kime yükletilir?"
    arka: "Talepte bulunana; asılsız itiraz hâlinde hâkim bir kısmını karşı tarafa yükleyebilir (HMK m. 101)."
  - on: "Adli tatil ve sürelere etkisi?"
    arka: "20 Temmuz-31 Ağustos. Adli tatile tabi davada süre bitişi tatile rastlarsa tatilin bittiği günden itibaren bir hafta uzar; HMK m. 103'teki işlerde uzama yok (HMK m. 102-104)."
