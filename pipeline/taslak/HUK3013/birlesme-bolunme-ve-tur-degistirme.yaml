  - soru: |
      A Anonim Şirketi ile B Anonim Şirketi birleşmiş, birleşme 02.03.2026'da tescil edilmiştir. B'nin alacaklısı Ayşe, alacağının teminata bağlanmasını 10.05.2026'da istemiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İstem süresindedir; tescilden itibaren üç ay içinde olduğundan devralan şirket teminat altına alır."
      - "İstem süresindedir; çünkü alacaklılar için süre sınırı yoktur."
      - "İstem süresi geçmiştir; teminat istemi birleşme kararından önce yapılmalıydı."
      - "İstem yerinde değildir; alacaklılar birleşmede teminat isteyemez."
    dogru: 0
    aciklama: |
      TTK m. 157/1: birleşmeye katılan şirketlerin alacaklıları, birleşmenin hukuken geçerlilik kazanmasından itibaren üç ay içinde istemde bulunursa devralan şirket alacaklarını teminat altına alır. Tescil 02.03.2026, istem 10.05.2026 olduğundan üç aylık süre içindedir. Önceden çağrı ve teminat bölünme için öngörülmüştür (TTK m. 174-175).
  - soru: |
      Devrolunan Kollektif Şirketin ortağı Mehmet, birleşme öncesi doğmuş şirket borçlarından kişisel olarak sorumluydu. Birleşme kararı 01.06.2026'da ilan edilmiştir. Mehmet'in bu borçlardan kişisel sorumluluğuna ilişkin istemler bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Birleşmeyle sorumluluk ortadan kalkar."
      - "İstemler birleşme kararının ilanı tarihinden itibaren üç yıl geçince zamanaşımına uğrar."
      - "İstemler ilandan itibaren altı ay içinde ileri sürülmezse düşer."
      - "İstemler on yıl sonra zamanaşımına uğrar."
