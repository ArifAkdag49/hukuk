    aciklama: |
      TTK m. 158/1-2: devrolunan şirketin borçlarından birleşmeden önce sorumlu olan ortakların sorumlulukları birleşmeden sonra da devam eder ve bu istemler birleşme kararının ilanı tarihinden itibaren üç yıl geçince zamanaşımına uğrar. Alacak ilandan sonra muaccel olursa süre muacceliyetten başlar.
  - soru: |
      Aşağıdakilerden hangisi TTK m. 160'a göre bölünebilir?
    siklar:
      - "Kollektif şirket"
      - "Komandit şirket"
      - "Anonim şirket (sermaye şirketlerine ve kooperatiflere)"
      - "Adi ortaklık"
    dogru: 2
    aciklama: |
      TTK m. 160/1: sermaye şirketleri ve kooperatifler sermaye şirketlerine ve kooperatiflere bölünebilir. Şahıs şirketleri bölünemez; adi ortaklık ise ticaret şirketi değildir.
  - soru: |
      B Anonim Şirketi kısmi bölünme yoluyla fabrika işletmesini yeni kurulan Y Anonim Şirketi'ne devretmiş, fabrika borçları bölünme planında Y'ye tahsis edilmiştir. Alacaklı A, alacağını teminat altına almak için süresinde istemde bulunmuş ancak teminat verilmemiştir. Y iflas etmemiş, konkordato süresi almamış ve hakkında kesin aciz vesikası şartları doğmamıştır. A'nın doğrudan B'ye başvurması bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "A, her hâlde B'yi birinci derecede sorumlu olarak takip edebilir."
      - "B ikinci derecede sorumludur; Y'nin iflas etmesi, konkordato süresi alması veya kesin aciz vesikası şartlarının doğması gibi şartlar gerçekleşmeden B takip edilemez."
      - "Bölünme sonrası B'nin hiçbir sorumluluğu kalmaz."
      - "A yalnız bölünmenin iptalini isteyebilir."
    dogru: 1
    aciklama: |
      TTK m. 176/1: borç tahsis edilen şirket birinci derecede sorumludur; diğer katılan şirketler ikinci derecede müteselsilen sorumludur. TTK m. 176/2: ikinci derecede sorumlu şirketlerin takip edilebilmesi için alacağın teminat altına alınmamış olması ve birinci derecede sorumlu şirketin iflas etmesi, konkordato süresi alması, kesin aciz vesikası şartlarının doğması vb. gerekir.
  - soru: |
