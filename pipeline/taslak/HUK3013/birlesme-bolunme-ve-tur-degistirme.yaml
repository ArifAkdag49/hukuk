  - terim: Denkleştirme ödemesi
    tanim: "Değişim oranını tamamlayan nakdi ödeme; gerçek değerin onda birini aşamaz (TTK m. 140/2)."
  - terim: Ayrılma akçesi
    tanim: "Pay iktisabı yerine veya seçimlik olarak ortağa verilen, payın gerçek değerine denk karşılık (TTK m. 141)."
