    aciklama: |
      TTK m. 127/1 genel kuralı verir, ancak TTK m. 127/2 TTK m. 581/1'i saklı tutar. Limited şirkette hizmet edimleri, kişisel emek, ticari itibar ve vadesi gelmemiş alacaklar sermaye olamaz. Bilirkişi değerlemesi veya tapuya şerh bu yasağı ortadan kaldırmaz.
  - soru: |
