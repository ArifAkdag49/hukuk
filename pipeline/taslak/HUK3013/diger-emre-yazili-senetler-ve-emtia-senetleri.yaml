    siklar:
      - "İİK'nın kambiyo senetlerine özgü haciz yoluyla takip başlatmak"
      - "Senede bono hükümlerinin uygulanması nedeniyle genel haciz yoluyla ya da dava ile alacağı istemek; kambiyo takibi yapamaz"
      - "Senet bono sayılmadığından hiçbir şekilde alacak isteyememek"
      - "Yalnız Mustafa'ya karşı hak kullanmak; ciranta Hasan'a hiçbir durumda başvuramamak"
    dogru: 1
    aciklama: |
      Açıkça emre yazılı olan ve bono unsurlarını taşıyan ödeme vaadi bono hükmündedir (TTK m. 830/1); ama İİK'nın kambiyo senetlerine özgü takip hükümleri uygulanmaz (TTK m. 830/2). Veli, alacağını genel yollarla isteyebilir. Senet bono hükmünde olduğundan ciranta Hasan'ın sorumluluğu da kural olarak bono hükümlerine göre doğar; "yalnız Mustafa" demek yanlıştır.
  - soru: |
      Emre yazılı bir senetten doğan alacağa karşı borçlu, hangi hâlde düzenleyenle veya önceki hamille arasındaki ilişkiye dayanan def'iyi yeni hamile karşı ileri sürebilir?
    siklar:
      - "Hamil senedi ücretsiz iktisap etmişse"
      - "Hamil senedi iktisap ederken bilerek borçlunun zararına hareket etmişse"
      - "Hamil tacir ise"
      - "Senet vadesi geçmişse"
