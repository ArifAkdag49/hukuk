kararlar:
  - id: "1094956700"
    ozet: |
      Arsa sahibi, kat karşılığı inşaat sözleşmesinde yüklenici şirkete teminat olarak verdiği 105.000 TL bedelli bonoyu, tutanakta açıkça teminat senedi olduğu belirtilmesine rağmen şirketin başka bir kişiye ciro ettiğini ve bu kişinin senedi icra takibine koyduğunu ileri sürerek menfi tespit davası açmıştır. İlk derece mahkemesi ve istinaf, yüklenici şirket yönünden davayı kabul etmiş, ciro alan kişi yönünden bu kişinin kötüniyetini ispatlanamamış sayarak davayı reddetmiştir. Yargıtay 6. Hukuk Dairesi, TTK m. 825'i uygulamış: borçlu, önceki hamille arasındaki ilişkiye dayanan def'iyi ancak hamil senedi iktisap ederken bilerek borçlunun zararına hareket etmişse ileri sürebilir. Dairenin değerlendirmesine göre ciro alanın sunduğu belgelerin her zaman düzenlenebilecek nitelikte olması, çelişkili beyanları ve aynı şirketten arsa sahiplerinin birden çok senedini devralmış olması karşısında bilerek borçlunun zararına hareket ettiği kabul edilmeli; bu yüzden davacının temyizi üzerine Bölge Adliye Mahkemesi kararı oy birliğiyle bozulmuştur.
  - id: "1010346900"
    ozet: |
      Toprak Mahsulleri Ofisi, borçludan aldığı çeltik karşılığında makbuz senedi düzenlemiş, borçlu da bu senetlerle banka kredisi kullanmış ve ödememiştir. Ofis, garantör olarak bankaya ödeme yapıp senetleri geri almıştır. Ofis, bu borçlunun deposundan kendi deposuna getirdiği 150 ton çeltiğin haczedilmesi üzerine istihkak iddiasında bulunmuş; ilk derece mahkemesi iddiayı reddetmiş, 8. Hukuk Dairesi önce hükmü onamıştır. Karar düzeltme aşamasında Daire, makbuz senedinin mülkiyeti, varantın rehni temsil ettiğini; sözleşmede çeltik karşılığında yalnız makbuz senedi düzenlendiğini ve senedin devriyle çeltiklerin mülkiyetinin Ofis'e geçtiğini belirterek haczin kaldırılması gerektiği sonucuna varmış, ayrıca hükmün taraf sıfatlarını yanlış nitelemesi nedeniyle infaza elverişsiz olduğunu da saptayarak onama kararını kaldırıp ilk derece hükmünü bozmuştur. Karar, eski Ticaret Kanunu dönemine aittir; ilke bugünkü TTK m. 839'daki düzenlemeyle uyumludur.
sorular:
  - soru: |
      Aşağıdakilerden hangisi emre yazılı havalenin poliçeden bir farkıdır?
    siklar:
      - "Muhatabın adı yazılmaz"
      - "Kabul için ibraz edilemez"
      - "Düzenleyenin imzası aranmaz"
      - "Ödeme yeri gösterilemez"
    dogru: 1
    aciklama: |
      Emre yazılı havale kabul için ibraz edilemez; ibraz edilip kabulden kaçınılsa bile hamilin bu sebeple başvurma hakkı doğmaz (TTK m. 827). Diğer şıklar kanunda öngörülmüş farklar değildir; havale de poliçedeki unsurları taşır (TTK m. 826).
  - soru: |
