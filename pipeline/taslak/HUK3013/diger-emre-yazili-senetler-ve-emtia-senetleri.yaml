  - soru: |
      Tevdi edilen malın makbuz senedi ve varantı birlikte bir kişiye ciro edilmiştir. Bu cironun sonucu nedir?
    siklar:
      - "Yalnız rehin hakkı devredilir"
      - "Malların mülkiyeti devredilir"
      - "Yalnız zilyetlik devredilir"
      - "Hiçbir hak geçmez, çünkü senetler ayrı ayrı ciro edilmelidir"
