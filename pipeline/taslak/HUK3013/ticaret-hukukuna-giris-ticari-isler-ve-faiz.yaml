  - 📌 Kanuni faiz: TCMB reeskont oranının %80'i (3095 sayılı Kanun m. 1, 7589 sayılı Kanunla değişik); ticari işte temerrüt faizi istem hâlinde avans faizi oranından (3095 sayılı Kanun m. 2/2).
doktrin: |
  ### Ticari işte temerrüt faizinde TBK m. 120 sınırı
  TTK m. 8/1 ticari işlerde faiz oranını serbest bırakır. Tartışma, bu serbestinin yalnız akdi (anapara) faizi mi yoksa sözleşmeyle belirlenen temerrüt faizini de kapsayıp kapsamadığıdır.

  Birinci yaklaşıma göre ticari işlerde faiz serbestisi sözleşmesel temerrüt faizini de kapsar; adi işlerdeki sınırlar (TBK m. 88/2 ve TBK m. 120/2: yüzde elli ve yüzde yüz fazlası) ticari işte uygulanmaz. Yargıtay 6. Hukuk Dairesinin kararlar bölümünde anlatılan kooperatif kararında çoğunluk bu yönde sonuca varmıştır.

  İkinci yaklaşım (aynı kararın karşı oyu) TTK m. 8'in yalnız akdi faize ilişkin olduğunu, temerrüt faizi bakımından TTK m. 9'un genel mevzuata yollama yaptığını ve bu yüzden TBK m. 120'deki tavanın ticari işlerde de geçerli olduğunu savunur. Bu görüş, temerrüdün çoğu kez ödeyememe hâli olduğunu, ağır temerrüt faizinin borçluyu daha da güçsüzleştireceğini vurgular.

  Konu sınavda tartışmalı nokta olarak sorulursa iki görüş de gerekçesiyle yazılmalıdır; olay çözümünde tek cevap bu tartışmaya dayandırılmaz.

  ### Haksız fiilde ticari iş ve avans faizi
  TTK m. 19/2 yalnız "sözleşmeler" için konuşur. Metnin lafzına dayanan yaklaşıma göre, tacir olmayanın tacire karşı işlediği haksız fiil bu hüküm yoluyla ticari iş sayılmaz. Buna karşılık haksız fiilin faili tacirse ve fiil ticari işletmesiyle ilgiliyse, borç doğrudan TTK m. 3 ve TTK m. 19/1'e göre ticaridir. Yargıtay Hukuk Genel Kurulu bu durumda alacaklı tacir olmasa da istem hâlinde avans faizine hükmedilmesi gerektiğini kabul etmiştir. Ticari araç olarak tescilli olmak, işletenin tacir olduğunu kendiliğinden göstermez; bu yönde bir karşı oy gerekçesi vardır ve işletenin gerçekten tacir olup olmadığı olayda araştırılmalıdır.
sozluk:
  - terim: Ticari hüküm
    tanim: "TTK'daki kurallar ile bir ticari işletmeyi ilgilendiren işlem ve fiillere ilişkin diğer kanunlardaki özel hükümler (TTK m. 1/1)."
  - terim: Teamül
    tanim: "Ticaret çevresinde tekrarlanan ama ticari örf ve âdet sayıldığı belirlenmemiş davranış biçimi; hükme esas olamaz, yorumda dikkate alınır (TTK m. 2/1)."
  - terim: Ticari örf ve âdet
    tanim: "Ticaret çevresinde hukuk kuralı gücünde benimsenmiş uygulama; ticari hüküm yoksa genel hükümlerden önce gelir (TTK m. 1/2, TTK m. 2)."
  - terim: Ticari iş
    tanim: "TTK'da düzenlenen hususlar ile bir ticari işletmeyi ilgilendiren bütün işlem ve fiiller (TTK m. 3/1)."
  - terim: Nispi ticari dava
    tanim: "Her iki tarafın da ticari işletmesiyle ilgili hususlardan doğan hukuk davası (TTK m. 4/1)."
  - terim: Mutlak ticari dava
    tanim: "Tarafların tacir olup olmadığına bakılmaksızın TTK m. 4/1-a ilâ f'de sayılan hususlardan doğan dava."
  - terim: Basit yargılama usulü
    tanim: "Miktar veya değeri kanundaki parasal sınırı geçmeyen ticari davalarda uygulanan usul (TTK m. 4/2)."
  - terim: Dava şartı arabuluculuk
    tanim: "Para alacağı gibi sayılı ticari davalarda dava açmadan önce arabulucuya başvurma zorunluluğu (TTK m. 5/A)."
  - terim: Teselsül karinesi
    tanim: "Ticari iş dolayısıyla birlikte borçlananların ve ticari borca kefillerin kural olarak müteselsil sorumlu sayılması (TTK m. 7)."
  - terim: Bileşik (mürekkep) faiz
    tanim: "Faizin anaparaya eklenip birlikte yeniden faiz yürütülmesi; ticari işte yalnız TTK m. 8/2'deki şartlarla geçerli."
  - terim: Avans faizi
    tanim: "TCMB'nin kısa vadeli avanslar için uyguladığı oran; ticari işte temerrüt faizi istem hâlinde bu orana göre istenebilir (3095 sayılı Kanun m. 2/2)."
kararlar:
  - id: "1151979800"
    ozet: |
      Yapı kooperatifi ortağı, kooperatifin 03.05.2015 tarihli genel kurulunda gündemin 8. maddesiyle alınan ve eski alacaklarını ödemeyen ortaklara aylık yüzde 3 (yıllık yüzde 36) gecikme faizi uygulanmasını öngören kararın mutlak butlanla batıl olduğunun tespitini istemiştir; dava 08.08.2019'da açılmıştır. İlk derece mahkemesi bir aylık hak düşürücü sürenin geçtiğini belirterek davayı reddetmiş, istinaf mahkemesi ise bu maddenin kanunun emredici hükmüne aykırı olduğunu ve mutlak butlanla batıl bulunduğunu tespit etmiştir. Yargıtay 6. Hukuk Dairesi, İçtihadı Birleştirme Büyük Genel Kurulunun 12.11.2021 tarihli kararıyla yapı kooperatifleri tacir kabul edildiğinden kooperatif genel kurulunda faiz oranının serbestçe belirlenebildiğini, bu yüzden maddenin yok hükmünde olduğu yönündeki talebin reddi gerektiğini belirterek istinaf kararını oy çokluğuyla bozmuştur. Karşı oyda temerrüt faizi bakımından TBK m. 120 tavanının ticari işte de uygulanması gerektiği savunulmuştur; karar konuya TTK m. 8/1 serbestisinin pratikteki etkisini ve doktrindeki tartışmayı göstermesi bakımından katkı sağlar.
  - id: "792146600"
    ozet: |
      Davacı, 29.05.2011 tarihinde ticari taksi olan bir aracın çarpması sonucu yaralanmış, maddi ve manevi tazminatı olay tarihinden itibaren ticari faizle istemiştir. Asliye hukuk mahkemesi yasal faize hükmetmiş; Yargıtay (kapatılan) 17. Hukuk Dairesi, aracın ticari taksi olması ve ticari faiz istenmesi nedeniyle 3095 sayılı Kanun m. 2/2 uyarınca avans faizi gerektiğini belirterek bozmuş, mahkeme bozmaya direnmiştir. Hukuk Genel Kurulu, avans faizi istenebilmesi için borçlunun tacir ve borcun ticari işletmesiyle ilgili olmasının yeterli olduğunu, alacaklının tacir olmasının gerekmediğini; haksız eylem dahil her türlü nedenden doğan alacakta açıkça talep edilirse TCMB'nin kısa vadeli avans oranında temerrüt faizine hükmedileceğini belirterek direnme kararını oy çokluğuyla bozmuştur. Olay 2011 tarihli olduğundan karar mülga TTK'nın ilgili hükümlerine dayanır; bugünkü karşılıkları TTK m. 3 ve TTK m. 19'dur. Karşı oy, ticari faiz isteminin yasal faiz anlamına geldiğini ve ticari plakanın tacir sıfatını tek başına göstermeyeceğini savunmuştur.
sorular:
  - soru: |
      Hakkında ticari bir hüküm bulunmayan bir ticari işte TTK m. 1/2'ye göre hâkim hangi sırayı izler?
    siklar:
      - "Ticari örf ve âdet, o da yoksa genel hükümler"
      - "Genel hükümler, bunlar yoksa ticari örf ve âdet"
      - "Teamül, o da yoksa genel hükümler"
      - "Hâkimin yaratacağı kural, sonra ticari örf ve âdet"
    dogru: 0
    aciklama: |
      Kanun, ticari hüküm yoksa önce ticari örf ve âdete, o da yoksa genel hükümlere gidilmesini söyler (TTK m. 1/2). Genel hükümler örf ve âdetin önüne geçmez. Teamül ise örf ve âdet sayıldığı belirlenmedikçe hükme esas olamaz (TTK m. 2/1).
  - soru: |
      Ticari örf ve âdet olarak kabul edildiği belirlenmemiş bir teamül bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Mahkemenin yargısına esas olamaz, ancak irade açıklamalarının yorumunda dikkate alınır"
      - "Mahkemenin yargısına her hâlde esas olabilir"
      - "Hiçbir hâlde, yorumda bile dikkate alınamaz"
      - "Yalnız tacir olmayanlara karşı uygulanabilir"
    dogru: 0
    aciklama: |
      TTK m. 2/1'e göre teamül, ticari örf ve âdet olarak kabul edildiği belirlenmedikçe mahkemenin yargısına esas olamaz; fakat irade açıklamalarının yorumunda teamüller de dikkate alınır. Yaygın yanılgı, teamülü örf ve âdetle aynı saymaktır.
  - soru: |
      Tacir Ali, işletmesi ile ilgisi olmayan aile ihtiyacı için bir koltuk takımı satın alırken satıcıya, işlemi yaptığı anda bunun ticari işletmesiyle ilgili olmadığını açıkça bildirmiştir. Ali gerçek kişi tacirdir. Ali'nin bu borcu bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Borç adi sayılır"
      - "Tacir olduğu için borç her hâlde ticaridir"
      - "Borç ancak ticaret siciline kayıtlıysa adi sayılır"
      - "Satıcı tacir olmadığı için borç ticaridir"
    dogru: 0
    aciklama: |
      Tacirin borçlarının ticari olması asıldır; ancak gerçek kişi tacir, işlemi yaptığı anda bunun ticari işletmesiyle ilgili olmadığını diğer tarafa açıkça bildirirse borç adi sayılır (TTK m. 19/1). Satıcının sıfatı bu sonucu değiştirmez.
  - soru: |
      X, Y ve Z tacir değildir; X, Z'ye Y'ye 20.000 TL ödemesi için talimat veren bir havale (TBK m. 555) düzenlemiştir. Havale hiçbir ticari işletmeyi ilgilendirmemektedir. Havaleden doğan uyuşmazlık hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Havale TBK m. 555 ilâ 560'ta düzenlendiğinden her hâlde ticari davadır"
      - "Hiçbir ticari işletmeyi ilgilendirmeyen havale davası ticari dava sayılmaz"
      - "Havale tutarı basit yargılama sınırını aşarsa dava ticari dava olur"
      - "Uyuşmazlık nispi ticari davadır, çünkü havale ticari bir işlemdir"
    dogru: 1
    aciklama: |
      TTK m. 4/1 son cümleye göre herhangi bir ticari işletmeyi ilgilendirmeyen havale, vedia ve fikir ve sanat eserlerine ilişkin haklardan doğan davalar ticari dava sayılmaz. Havale hükümlerinin listede sayılmış olması bu istisnayı ortadan kaldırmaz.
  - soru: |
      Asliye ticaret mahkemesi bulunmayan bir ilçede, ticari bir alacak davası asliye hukuk mahkemesinde açılmıştır. Taraflardan hiçbiri görev kuralına dayanmamıştır. Asliye hukuk mahkemesi ne yapar?
    siklar:
      - "Görevsizlik kararı verir ve dosyayı ATM'ye gönderir"
      - "Davayı usulden reddeder"
      - "Davaya devam eder"
      - "Dosyayı HSK'ya gönderir"
    dogru: 2
    aciklama: |
      ATM bulunmayan yargı çevresindeki bir ticari davada görev kuralına dayanılmamış olması görevsizlik kararı verilmesini gerektirmez; asliye hukuk mahkemesi davaya devam eder (TTK m. 5/4). ATM bulunan yerlerde ise ilişki görev ilişkisidir (TTK m. 5/3).
  - soru: |
      Tacir A Ltd. Şti., tacir B A.Ş. aleyhine, satış bedelinden doğan 800.000 TL'lik para alacağı için, arabulucuya başvurmadan doğrudan asliye ticaret mahkemesinde alacak davası açmıştır. Mahkeme ne yapmalıdır?
    siklar:
      - "Davayı esastan inceler, arabuluculuğa ancak sonradan yönlendirir"
      - "Dava şartı yokluğu sebebiyle davayı usulden reddeder"
      - "Görevsizlik kararı verir"
      - "Davayı kabul eder ve arabuluculuk giderini davalıya yükler"
    dogru: 1
    aciklama: |
      Konusu bir miktar para olan alacak davalarında ticari davada arabulucuya başvurulmuş olması dava şartıdır (TTK m. 5/A/1). Arabulucuya başvurulmadan dava açıldığı anlaşılırsa dava, dava şartı yokluğundan usulden reddedilir (HUAK m. 18/A/2). Görev bakımından bir sorun yoktur.
  - soru: |
      TTK m. 5/A uyarınca arabulucu, başvuruyu görevlendirildiği tarihten itibaren ne kadar sürede sonuçlandırır?
    siklar:
      - "Üç hafta; zorunlu hâlde en çok bir hafta uzatılabilir"
      - "Altı hafta; zorunlu hâlde en çok iki hafta uzatılabilir"
      - "Dört hafta; zorunlu hâlde en çok iki hafta uzatılabilir"
      - "Sekiz hafta; uzatılamaz"
    dogru: 1
    aciklama: |
      TTK m. 5/A/2'ye göre süre altı haftadır ve zorunlu hâllerde arabulucu tarafından en fazla iki hafta uzatılabilir. Üç + bir hafta, HUAK m. 18/A/9'daki genel süredir; ticari davalar için özel hüküm uygulanır.
  - soru: |
      Tacir Kemal bir bankadan işletme kredisi almış; kardeşi memur Zeynep, sözleşmede "müteselsil" sözcüğü geçmeksizin kefil olmuştur (kefaletin şekil ve eş rızası gibi şartlarının tamam olduğu varsayılsın). Kredi tüketici işlemi değildir. Zeynep'in sorumluluğu bakımından hangisi doğrudur?
    siklar:
      - "Adi kefildir; çünkü müteselsil sözcüğü yazılmamıştır"
      - "Müteselsil kefil sayılır; ancak kendisine ihbar edilmeden temerrüt faizi yürütülemez"
      - "Müteselsil kefil sayılır ve ihbar edilmeden de temerrüt faizi işletilebilir"
      - "Zeynep tacir olmadığı için kefalet geçersizdir"
    dogru: 1
    aciklama: |
      Ticari borçlara kefalette TTK m. 7/1'deki teselsül karinesi asıl borçlu ile kefil arasında da geçerlidir (TTK m. 7/2); adi işlerdeki aksine müteselsil sözcüğü gerekmez (karşılaştırma için TBK m. 586). Yine de kefile taahhüdün ya da ödemenin yerine getirilmediği ihbar edilmeden temerrüt faizi yürütülemez (TTK m. 7/1 son cümle).
  - soru: |
      Aşağıdaki faiz kayıtlarından hangisi bileşik faiz bakımından TTK m. 8/2'ye uygun biçimde geçerlidir?
    siklar:
      - "İki tacir arasındaki ödünç sözleşmesinde faizin her üç ayda bir anaparaya eklenmesi"
      - "İki tacir arasındaki ödünç sözleşmesinde faizin her ay anaparaya eklenmesi"
      - "İki tacir arasındaki kira sözleşmesinde gecikme faizinin üç ayda bir anaparaya eklenmesi"
      - "Tüketici kredisinde faizin üç ayda bir anaparaya eklenmesi"
    dogru: 0
    aciklama: |
      Bileşik faiz şartı, üç aydan aşağı olmamak üzere, yalnız cari hesaplarla her iki taraf bakımından da ticari iş olan ödünç sözleşmelerinde geçerlidir (TTK m. 8/2). Aylık dönem üç aydan kısadır; kira sözleşmesi bu iki istisna dışında kalır; tüketici işlemlerinde bileşik faiz uygulanmaz (6502 sayılı Kanun m. 4/7). Aykırı faiz yok hükmündedir (TTK m. 8/4).
  - soru: |
      Tacir Burak, tacir Cemil'e vadesi belirlenmemiş ticari bir borcu için ihtarname göndermiş, ihtarname 10 Mart'ta Cemil'e tebliğ edilmiştir. Aksi yönde sözleşme yoktur. Borcun faizi ne zaman işlemeye başlar?
    siklar:
      - "Borcun doğduğu günden"
      - "10 Mart'tan, yani ihtar gününden"
      - "Dava açıldığı günden"
      - "İhtardan on beş gün sonra"
    dogru: 1
    aciklama: |
      Aksine sözleşme yoksa ticari borcun faizi vadenin bitiminden, belli bir vade yoksa ihtar gününden itibaren işlemeye başlar (TTK m. 10/1). Tacirin verdiği avans ve giderlerin faizi ise ödeme tarihinden işler (TTK m. 20); iki kuralı karıştırmamak gerekir.
  - soru: |
      3095 sayılı Kanun m. 1'in 7589 sayılı Kanunla değişik metnine göre, miktarı sözleşmeyle belirlenmemiş kanuni faiz nasıl hesaplanır?
    siklar:
      - "TCMB'nin önceki yılın 31 Aralık günü kısa vadeli kredi işlemlerinde uyguladığı reeskont oranının yüzde sekseni üzerinden"
      - "TCMB'nin kısa vadeli avans faizi oranının tamamı üzerinden"
      - "TCMB reeskont oranının iki katı üzerinden"
      - "Her yıl Cumhurbaşkanının belirlediği sabit oran üzerinden"
    dogru: 0
    aciklama: |
      3095 sayılı Kanun m. 1'e göre ödeme, önceki yılın 31 Aralık günü kısa vadeli kredi işlemlerinde uygulanan reeskont oranının yüzde sekseni üzerinden yapılır; 30 Haziran oranı beş puan veya daha fazla farklıysa yılın ikinci yarısında 30 Haziran oranının yüzde sekseni geçerli olur. Avans faizi ise ticari işte temerrüt faizi için ayrıca (3095 sayılı Kanun m. 2/2) istenebilir.
  - soru: |
      Lojistik A.Ş.'nin işletmesiyle ilgili olarak kullandığı aracı, tacir olmayan Selin'in aracına çarpmış ve Selin tazminat davasında açıkça "ticari faiz" istemiştir. Hukuk Genel Kurulunun yaklaşımına göre Selin'in avans faizi isteyebilmesi için aşağıdakilerden hangisi gerekir?
    siklar:
      - "Selin'in de tacir olması"
      - "Borçlunun tacir olması ve borcun ticari işletmesiyle ilgili bulunması"
      - "Tarafların aralarında yazılı bir faiz sözleşmesi yapmış olması"
      - "Haksız fiil olduğundan avans faizi hiçbir şekilde istenememesi"
    dogru: 1
    aciklama: |
      Hukuk Genel Kurulu, avans faizi istenebilmesi için borçlunun tacir ve borcun ticari işletmesiyle ilgili olmasının yeterli olduğunu, alacaklının tacir olmasının aranmadığını kabul etmiştir; haksız eylem de dahil olmak üzere her türlü nedenden doğan alacakta, istem hâlinde TCMB avans oranında temerrüt faizi uygulanır (3095 sayılı Kanun m. 2/2, TTK m. 3 ve TTK m. 19/1).
olaylar:
  - olay: |
      Tacir Murat Aksoy (gerçek kişi tacir, mobilya toptancısı), işletmesinin finansmanı için Doğu Bank A.Ş.'den 2.000.000 TL işletme kredisi kullanmıştır. Kredi sözleşmesinde yıllık akdi faiz oranı yüksek bir oran olarak kararlaştırılmış, ayrıca "işlemiş faizler her ay sonunda anaparaya eklenir ve birlikte faiz yürütülür" kaydı konmuştur. Murat'ın kardeşi, tacir olmayan memur Selma Aksoy, sözleşmede "müteselsil" sözcüğünü kullanmadan kefil olmuştur (kefaletin şekil ve eş rızası şartlarının sağlandığı kabul edilecektir). Kredi tüketici işlemi değildir.

      Murat taksitleri ödemeyince banka, Selma'ya hiçbir bildirim yapmadan Selma'dan hem borcu hem de borç için temerrüt faizi istemiştir. Banka, ödenmeyen alacağı dava etmek istemektedir.

      1. Selma'nın kefaletinin niteliği nedir?
      2. Selma'ya ihbar yapılmadan temerrüt faizi istenebilir mi?
      3. Aylık anaparaya ekleme kaydı geçerli midir; ticari işte akdi faiz oranı için bir üst sınır var mıdır?
      4. Banka alacağı için asliye ticaret mahkemesinde dava açmadan önce neye başvurmak zorundadır?
    olcut:
      - {tespit: "Ticari borca kefalette teselsül karinesi: Selma müteselsil kefil sayılır", puan: 25, madde: "TTK m. 7"}
      - {tespit: "Kefile taahhüdün yerine getirilmediği ihbar edilmeden temerrüt faizi yürütülemez", puan: 25, madde: "TTK m. 7"}
      - {tespit: "Aylık bileşik faiz kaydı: dönem üç aydan az olduğundan yok hükmündedir", puan: 25, madde: "TTK m. 8"}
      - {tespit: "Ticari işte akdi faiz oranı serbesttir, adi işteki yüzde elli sınırı uygulanmaz", puan: 10, madde: "TTK m. 8"}
      - {tespit: "Para alacağı davasında arabulucuya başvuru dava şartıdır (altı hafta + iki hafta)", puan: 15, madde: "TTK m. 5/A"}
    cozum: |
      **Nitelendirme:** Uyuşmazlık, tacir Murat'ın işletmesiyle ilgili kullandığı banka kredisinden ve bu krediye bağlanan kefaletten doğan ticari bir iştir. Tacirin borçlarının ticari olması asıldır (TTK m. 19/1); kredi, tüketici işlemi de değildir. Bu nedenle ticari hükümler uygulanır.

      **Hukuki sorunlar:** (1) Müteselsil sözcüğü yazılmayan kefalette kefalet türü; (2) kefile ihbar edilmeden temerrüt faizi; (3) bileşik faiz kaydının geçerliliği ve akdi faiz oranının sınırı; (4) bankanın dava öncesi yükümlülüğü.

      **İlgili hükümler:** TTK m. 7/1 ve TTK m. 7/2: ticari iş dolayısıyla birlikte borçlananlar ve ticari borçlara kefil olanlar kanunda ya da sözleşmede aksi öngörülmemişse müteselsil sorumludur; kefile ihbar edilmeden temerrüt faizi yürütülemez. Adi kefalette ise alacaklı borçluya başvurmadıkça kefili takip edemez (TBK m. 585) ve müteselsil kefalet için bu sıfatın ya da eş anlamlı bir ifadenin kullanılması gerekir (TBK m. 586). TTK m. 8/1: ticari işlerde faiz oranı serbesttir; TTK m. 8/2: bileşik faiz yalnız cari hesaplarda ve iki tarafça ticari ödüncte, üç aydan aşağı olmamak üzere geçerlidir; TTK m. 8/4: aykırı faiz yok hükmündedir. TTK m. 5/A: konusu para olan alacak davalarında arabuluculuk dava şartıdır.

      **Değerlendirme:** (1) Kredi ticari bir iştir; Selma tacir olmasa da kefalet ticari borca ilişkin olduğundan TTK m. 7/2 gereği kefaletin müteselsil olduğu kabul edilir. Sözleşmede "müteselsil" yazılmamış olması bu sonucu engellemez; çünkü karine, aksi öngörülmedikçe işler. (2) Müteselsil kefil olsa bile Selma'ya taahhüdün ya da ödemenin yerine getirilmediği ihbar edilmeden temerrüt faizi yürütülemez; banka bu ihbarı yapana kadar Selma'dan temerrüt faizi isteyemez. Anaparanın istenmesi ise ihbara bağlı değildir. (3) Faizlerin her ay anaparaya eklenmesi, dönem üç aydan kısa olduğu için TTK m. 8/2'deki şartı sağlamaz; bu hâlde aykırı olarak işletilen faiz yok hükmündedir (TTK m. 8/4). Kredi sözleşmesi iki tarafça ticari ödünç niteliğinde olsa da dönem şartı eksiktir. Akdi faiz oranı ise ticari işte serbestçe belirlendiğinden TBK m. 88/2'deki yüzde elli sınırı bu oran için ileri sürülemez. (4) Banka, para alacağı davası açmak isterse dava açmadan önce arabulucuya başvurmak zorundadır; arabulucu altı hafta içinde sonuçlandırır, zorunlu hâlde süre en çok iki hafta uzatılır. Başvuru yapılmazsa dava, dava şartı yokluğundan usulden reddedilir.

      **Sonuç:** Selma müteselsil kefildir; ancak ihbar yapılmadan temerrüt faizi yürütülemez. Aylık bileşik faiz kaydı yok hükmündedir, akdi faiz oranı ise serbesttir. Banka, ticari davadan önce arabuluculuk başvurusu yapmalıdır.
  - olay: |
      Lojistik Nakliyat A.Ş.'nin işletmesinin kullandığı kamyon, 14.03.2025 tarihinde Selin Kara'nın (öğretmen, tacir değil) otomobiline çarpmış, Selin yaralanmış ve aracı hasar görmüştür. Kazanın nakliyat işi sırasında meydana geldiği ve kamyonun şirket işletmesine bağlı olduğu uyuşmazlık konusu değildir. Selin, şirketten maddi tazminat istemekte ve dava dilekçesinde olay tarihinden itibaren açıkça TCMB avans faizi oranında temerrüt faizi ("ticari faiz") talep etmektedir. Şirket, nakliye sektöründe "tazminat ödemelerinde ancak fatura kesilince faiz işler" yönünde bir ticari örf ve âdet bulunduğunu ileri sürmektedir. Selin böyle bir örf ve âdeti bilmemektedir; nakliye sektörüyle hiçbir bağlantısı olmadığından bilmesi de gerekmemektedir. Başka bir kanunda bu dava için dava şartı arabuluculuk öngörülmediği varsayılacaktır.

      1. Şirketin borcu ticari midir?
      2. Dava ticari dava mıdır; hangi mahkeme görevlidir?
      3. TTK m. 5/A'daki arabuluculuk şartı burada aranır mı?
      4. Selin avans faizi isteyebilir mi?
      5. Şirketin ileri sürdüğü örf ve âdet Selin'e karşı uygulanabilir mi?
    olcut:
      - {tespit: "Tüzel kişi tacirin borcu ticaridir; ticari işletmesiyle ilgili fiil ticari iştir", puan: 20, madde: "TTK m. 19"}
      - {tespit: "Selin tacir olmadığından iki tarafın ticari işletmesiyle ilgili nispi ticari dava yoktur; asliye hukuk mahkemesi görevlidir", puan: 25, madde: "TTK m. 4"}
      - {tespit: "Arabuluculuk şartı yalnız ticari davalarda aranır; bu dava ticari dava olmadığından TTK m. 5/A uygulanmaz", puan: 15, madde: "TTK m. 5/A"}
      - {tespit: "Borçlu tacir ve borç ticari işletmesiyle ilgili olduğundan istem hâlinde avans faizi istenebilir", puan: 25, madde: "3095 sayılı Kanun m. 2"}
      - {tespit: "Ticari örf ve âdet tacir olmayana ancak bildiği veya bilmesi gerektiği takdirde uygulanır", puan: 15, madde: "TTK m. 2"}
    cozum: |
      **Nitelendirme:** Olay, bir anonim şirketin işletmesiyle ilgili faaliyeti sırasında tacir olmayan bir kişiye verdiği zarardan (haksız fiil) doğan tazminat ve bu tazminata uygulanacak faiz sorunudur.

      **Hukuki sorunlar:** (1) Borcun ticari niteliği; (2) davanın ticari dava olup olmadığı ve görev; (3) arabuluculuk dava şartının aranıp aranmayacağı; (4) faiz türü; (5) ticari örf ve âdetin Selin'e uygulanması.

      **İlgili hükümler:** TTK m. 3/1: ticari işletmeyi ilgilendiren bütün işlem ve fiiller ticari iştir. TTK m. 19/1: tacirin borçlarının ticari olması asıldır; adi sayılma imkânı yalnız gerçek kişi tacire tanınmıştır. TTK m. 4/1: nispi ticari dava, her iki tarafın da ticari işletmesiyle ilgili hususlardan doğan davadır. TTK m. 5/A: arabuluculuk, ticari davalardan sayılan para davalarında dava şartıdır. 3095 sayılı Kanun m. 2/2: ticari işlerde temerrüt faizi, avans faizi oranı üzerinden istenebilir. TTK m. 2/3: ticari örf ve âdet tacir olmayanlara ancak bildikleri veya bilmeleri gerektiği takdirde uygulanır.

      **Değerlendirme:** (1) Lojistik Nakliyat A.Ş. tüzel kişi tacirdir ve TTK m. 19/1 yalnız gerçek kişi tacire borcun adi olduğunu bildirme imkânı verir. Kaza işletmesinin faaliyeti sırasında olduğundan borç ticaridir. (2) Nispi ticari dava için iki tarafın da ticari işletmesiyle ilgili hususlardan doğan bir uyuşmazlık gerekir; Selin'in ticari işletmesi yoktur. Uyuşmazlık TTK m. 4/1-a ilâ f'deki mutlak ticari dava kaynaklarından birine de dayanmamaktadır. Bu nedenle dava ticari dava değildir ve genel görevli asliye hukuk mahkemesi bakar. (3) TTK m. 5/A yalnız ticari davalarda aranır; dava ticari olmadığından bu hükme dayanılarak arabuluculuk aranmaz (başka bir kanunda şart bulunmadığı varsayılmıştır). (4) Hukuk Genel Kurulunun yaklaşımına göre avans faizi için borçlunun tacir ve borcun ticari işletmesiyle ilgili olması yeterlidir; alacaklının tacir olması gerekmez. Selin avans faizini açıkça istediğinden, TCMB'nin kısa vadeli avans oranında temerrüt faizi istenebilir. (5) Şirketin dayandığı örf ve âdet bulunsa bile Selin bunu bilmediğinden ve bilmesi de gerekmediğinden ona uygulanamaz (TTK m. 2/3).

      **Sonuç:** Borç ticaridir; ancak dava ticari dava sayılmadığından asliye hukuk mahkemesi görevlidir ve TTK m. 5/A'daki arabuluculuk şartı uygulanmaz. Selin, istem hâlinde avans faizi isteyebilir. Şirketin ileri sürdüğü örf ve âdet, Selin tarafından bilinmediği ve bilinmesi gerekmediği için ona karşı uygulanamaz.
kartlar:
  - on: "Ticari işte uygulanacak kurallar sırası (TTK m. 1/2)?"
    arka: "Ticari hüküm yoksa önce ticari örf ve âdet, o da yoksa genel hükümler."
  - on: "Teamül hükme esas olabilir mi (TTK m. 2/1)?"
    arka: "Ticari örf ve âdet olarak kabul edildiği belirlenmedikçe hayır; ancak irade açıklamalarının yorumunda dikkate alınır."
  - on: "Farklı bölgelerdeki taraflar arasında hangi örf ve âdet uygulanır (TTK m. 2/2)?"
    arka: "Kanunda veya sözleşmede aksi yoksa ifa yerindeki ticari örf ve âdet."
  - on: "Ticari örf ve âdet tacir olmayana ne zaman uygulanır (TTK m. 2/3)?"
    arka: "Ancak onun tarafından bilindiği veya bilinmesi gerektiği takdirde."
  - on: "Tacirin borcu ne zaman adi sayılır (TTK m. 19/1)?"
    arka: "Yalnız gerçek kişi tacir, işlem anında ticari işletmesiyle ilgisi olmadığını açıkça bildirirse veya işin ticari sayılmasına durum elverişli değilse."
  - on: "Mutlak ve nispi ticari dava farkı (TTK m. 4/1)?"
    arka: "Nispi: iki tarafın da ticari işletmesiyle ilgili dava. Mutlak: tarafların tacir olup olmadığına bakılmaksızın TTK m. 4/1-a ilâ f'deki hususlardan doğan dava."
  - on: "Hangi davalar ticari işletmeyi ilgilendirmiyorsa ticari dava sayılmaz (TTK m. 4/1)?"
    arka: "Havale, vedia (saklama) ve fikir ve sanat eserlerine ilişkin haklardan doğan davalar."
  - on: "ATM bulunmayan yerde görev kuralına dayanılmazsa ne olur (TTK m. 5/4)?"
    arka: "Görevsizlik kararı verilmez; asliye hukuk mahkemesi davaya devam eder."
  - on: "Hangi davalarda arabuluculuk dava şartıdır (TTK m. 5/A)?"
    arka: "Ticari davalardan konusu bir miktar para olan alacak, tazminat, itirazın iptali, menfi tespit ve istirdat davalarında; süre 6 hafta + en çok 2 hafta."
  - on: "Ticari işte teselsül karinesi ne söyler (TTK m. 7)?"
    arka: "Ticari iş dolayısıyla birlikte borçlananlar ve ticari borca kefiller müteselsil sorumludur; kefile ihbar edilmeden temerrüt faizi yürütülemez."
  - on: "Bileşik faizin geçerlilik şartları (TTK m. 8/2)?"
    arka: "En az üç aylık dönem; yalnız cari hesap veya iki tarafça ticari ödünç sözleşmesi; sözleşenleri tacir olmayanlara uygulanmaz. Aykırı faiz yok hükmündedir (TTK m. 8/4)."
  - on: "Kanuni faiz ve ticari temerrüt faizi (3095 sayılı Kanun m. 1 ve m. 2/2)?"
    arka: "Kanuni faiz: TCMB reeskont oranının %80'i (7589 sayılı Kanunla değişik). Ticari işte temerrüt faizi istem hâlinde avans faizi oranından istenebilir."
