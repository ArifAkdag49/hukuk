    ozet: |
      Bir limited şirketin kurucu ortağı, bilgi alma ve inceleme hakkının engellendiğini, genel kurula çağrılmadığını ve kâr dağıtılmadığını ileri sürerek haklı sebeple çıkmasını ve ayrılma akçesini istemiştir (TTK m. 638/2, TTK m. 641). Şirket karşı davada, ortağın rakip bir dergi için çizim yaptırdığını söyleyerek onun şirketten çıkarılmasını (TTK m. 640/3) talep etmiş ve bunu 02.11.2016 tarihli genel kurul kararına dayandırmıştır. İlk derece mahkemesi asıl davayı kabul ederek davacının haklı sebeple çıkmasına ve çıkma payının ticari avans faiziyle tahsiline karar vermiş, karşı davayı reddetmiştir. Bölge adliye mahkemesi istinaf başvurusunu esastan reddederken, çıkarma kararının alındığı genel kurula davacının usulüne uygun çağrılmadığını (TTK m. 617, TTK m. 416) ve kararın bu nedenle geçerli olmadığını belirtmiştir; esas sözleşmede ortaklar için rekabet yasağı da yoktur. Yargıtay 11. HD bu kararı oy birliğiyle onamıştır. Karar, çıkarma davasının dayanağı olan genel kurul kararının usulüne uygun toplantıda alınması gerektiğini ve bilgi alma hakkının engellenmesi gibi hâllerin ortak yönünden haklı çıkma sebebi olabileceğini gösterir.
  - id: "1210369300"
    ozet: |
