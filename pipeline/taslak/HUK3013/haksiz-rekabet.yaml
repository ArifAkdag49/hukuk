ozet: |
  - **Amaç ve ilke (TTK m. 54):** Haksız rekabet kurallarının amacı bütün katılanların menfaatine dürüst ve bozulmamış rekabeti sağlamaktır. Rakipler arasında veya tedarik edenlerle müşteriler arasındaki ilişkileri etkileyen aldatıcı veya dürüstlük kuralına aykırı davranışlar ve ticari uygulamalar haksız ve hukuka aykırıdır.
  - **Fiiller (TTK m. 55):** Sayım örnekleyicidir ("başlıca"). Gruplar: reklam ve satış yöntemleri (a), sözleşmeyi ihlale yöneltme (b), iş ürünlerinden yetkisiz yararlanma (c), sır ifşası (d), iş şartlarına uymama (e), dürüstlüğe aykırı genel işlem şartları (f).
  - **Davalar (TTK m. 56/1):** tespit, men, ref (maddi durumun kaldırılması, beyanın düzeltilmesi, gerekirse araç ve malların imhası), kusur varsa maddi tazminat, TBK m. 58 şartlarında manevi tazminat.
  - **Dava hakkı sahipleri:** Zarar gören veya tehlikeyle karşılaşan kişi bütün davaları açar. **Müşteriler** de açar ama imhayı isteyemez (TTK m. 56/2). **Odalar, borsalar, meslek birlikleri ve tüketici örgütleri** yalnız tespit, men ve ref davalarını açar (TTK m. 56/3).
  - **Hükmün genişlemesi:** Men ve ref hükmü, malları ticari amaçla davalıdan elde etmiş kişilere karşı da icra olunur (TTK m. 56/4).
  - **Çalıştıran ve basın-yayın:** Tespit, men ve ref çalıştıran aleyhine de açılır (TTK m. 57/1); tazminatta TBK uygulanır. Basın, yayın ve bilişim yoluyla işlenen fiillerde davalı sırası TTK m. 58'de gösterilmiştir.
  - **İlan, tedbir:** Kesinleşen hükmün ilanı (TTK m. 59). İhtiyati tedbir ve gümrükte el koyma (TTK m. 61).
  - **Zamanaşımı (TTK m. 60):** Öğrenmeden itibaren **1 yıl**, her hâlde doğumdan itibaren **3 yıl**; fiil daha uzun ceza zamanaşımına bağlı bir suçsa o süre uygulanır.
  - **Ceza (TTK m. 62-63):** Kasten işlenir, hukuk davası açma hakkı olanlardan birinin şikâyetine bağlıdır; iki yıla kadar hapis veya adli para cezası. Tüzel kişide organ üyeleri ve ortaklar cezalandırılır.

anlatim: |
  ## 1. Amaç ve genel ilke (TTK m. 54)

  Haksız rekabet hukuku, rakipleri olduğu kadar **müşterileri, tedarikçileri ve kamuyu** da korur. TTK m. 54/1'e göre bu Kısım'ın amacı, bütün katılanların menfaatine, dürüst ve bozulmamış rekabetin sağlanmasıdır. Koruma yalnız "rakibin zararı" üzerine kurulu değildir.

  **Genel hüküm.** TTK m. 54/2, rakipler arasında veya tedarik edenlerle müşteriler arasındaki ilişkileri etkileyen **aldatıcı** ya da dürüstlük kuralına diğer şekillerdeki **aykırı** davranışları ve ticari uygulamaları haksız ve hukuka aykırı sayar. Bu madde bir **torba hükümdür**: TTK m. 55'teki fiillere uymayan ama dürüstlüğe aykırı davranışlar da buraya girer.

  > ⚠️ **Sınavda dikkat:** Haksız rekabetin varlığı için rekabet ilişkisinin, failin kusurunun ya da zararın bulunması gerekmediği Yargıtay'ca kabul edilir. Kanun kusuru açıkça **maddi tazminat** için arar (TTK m. 56/1-d); manevi tazminat TBK m. 58'deki şartlara bağlıdır. Tespit, men ve ref ise kusura bağlanmamıştır. Yargıtay da kusur ve zararın yalnız tazminat (maddi ve manevi) davalarında önem taşıdığını belirtir.

  İnceleme sırası da önemlidir: önce TTK m. 55'teki bir hâle uyup uymadığına, uymuyorsa TTK m. 54/2'ye bakılır.

  ## 2. Başlıca haksız rekabet hâlleri (TTK m. 55)

  TTK m. 55/1 "aşağıda sayılan hâller haksız rekabet hâllerinin **başlıcalarıdır**" der. Liste örnekleyicidir; sınırlı sayım (numerus clausus) yoktur.

  | Bent | Fiil | Kısa örnek |
  |---|---|---|
  | a/1 | Kötüleme (yanlış, yanıltıcı, gereksiz yere incitici) | Rakibin kremi için "zehirli" demek |
  | a/2 | Kendisi hakkında gerçek dışı açıklama | Olmayan stoğu varmış gibi duyurmak |
  | a/3 | Almadığı paye, diploma, ödülü varmış gibi sunma | "Altın ödüllü" yazıp ödül almamak |
  | a/4 | Başkasıyla karıştırılmaya yol açan önlemler | Rakibe benzer ambalaj |
  | a/5 | Gerçeğe aykırı ya da gereksiz kötüleyici karşılaştırma | "Rakibimizden 3 kat iyi" |
  | a/6 | Seçilmiş malı birden çok kere tedarik fiyatının altında satıp vurgulamak | Reklamda dikkat çeken zararına satış |
  | a/7-9 | Ek edimle yanıltma, saldırgan satış, özellik gizleme | Israrlı kapıdan satış |
  | a/10-12 | Taksit ve tüketici kredisi ilanlarında eksik bilgi | Efektif faizi yazmamak |
  | b | Sözleşmeyi ihlale veya sona erdirmeye yöneltme | Rakibin müşterisini sözleşmeyi bozmaya itmek |
  | c | Başkasının iş ürününden yetkisiz yararlanma | Emanet projeyi kullanmak |
  | d | Üretim ve iş sırlarını hukuka aykırı ifşa | Gizlice ele geçirilen reçeteyi satmak |
  | e | Olağan iş şartlarına uymamak | Sigortasız işçi çalıştırarak fiyat kırmak |
  | f | Dürüstlüğe aykırı genel işlem şartları | Taraf aleyhine dengeyi bozan formlar |

  **Tedarik fiyatı altında satış (a/6).** Satış fiyatı, aynı çeşit malın benzer hacimde alımında uygulanan tedarik fiyatının altındaysa **yanıltmanın varlığı karine** sayılır. Davalı gerçek tedarik fiyatını ispatlarsa değerlendirmeye o fiyat esas alınır.

  > **Örnek:** Bir market zinciri, normalde 40 TL'ye aldığı ürünü yüksek sesli reklamla 30 TL'ye satıyor ve müşterilere "her şey bu kadar ucuz" izlenimi veriyor. Yanıltma karinesi vardır; market gerçek tedarik fiyatını ispatlayarak karineyi etkileyebilir.

  **Karıştırılma (a/4).** Yargıtay Hukuk Genel Kurulu'na göre karıştırılma, ürün veya faaliyetin **dış görünüşü** (sunum, görsellik, arayüz) ve **duyuruşu** ile ilgilidir. Dışarıdan görünmeyen iç benzerlik (kaynak kodu gibi) bu hükmün kapsamında kabul edilmez. Karıştırılma nesnel değerlendirilir; hedef müşteri kitlesinin izlenimi esastır.

  > **Örnek:** Eski çalışan Deniz, işten ayrıldıktan sonra kurduğu işletmede eski işverenin yazılımıyla modül adları ve arayüzü olağan dışı ölçüde aynı olan bir program satıyor. Kaynak kodları farklı olsa bile, müşteriye görünen sunum benzerliği TTK m. 55/1-a/4 kapsamında haksız rekabet sayılabilir.

  ## 3. Hukuki sorumluluk: davalar (TTK m. 56)

  Haksız rekabet yüzünden müşterileri, kredisi, mesleki itibarı, ticari faaliyetleri veya diğer ekonomik menfaatleri zarar gören **ya da böyle bir tehlikeyle karşılaşabilecek** kimse şunları isteyebilir (TTK m. 56/1):
  - **a) Tespit:** fiilin haksız olup olmadığı belirlensin.
  - **b) Men:** haksız rekabet önlensin.
  - **c) Ref:** maddi durum ortadan kaldırılsın; yanlış veya yanıltıcı beyanlar düzeltilsin; tecavüzün önlenmesi için kaçınılmaz ise araç ve malların imhası.
  - **d) Maddi tazminat:** kusur varsa zararın tazmini (TBK m. 49 bağlantısı).
  - **e) Manevi tazminat:** TBK m. 58'deki şartlar varsa.

  Hâkim, tazminat olarak, haksız rekabet sonucunda davalının elde etmesi mümkün görülen **menfaatin karşılığına** da karar verebilir.

  **Kimler hangi davayı açar?** (TTK m. 56/1-3)

  | Davacı | Açabileceği davalar |
  |---|---|
  | Zarar gören veya tehlikeyle karşılaşan | Hepsi (a-e) |
  | Zarar gören müşteri | Hepsi, ama imha hariç |
  | Oda, borsa, meslek birliği, tüketici örgütü | Yalnız a, b, c |

  > ⚠️ **Sınavda dikkat:** Müşteri **tazminat** davası açabilir ama **malların imhasını** isteyemez (TTK m. 56/2). Tüketici derneği ise **tazminat** davası açamaz; yalnız tespit, men ve ref davalarını açar (TTK m. 56/3).

  **Hükmün üçüncü kişilere etkisi (TTK m. 56/4).** Men ve ref hükmü, haksız rekabete konu malları doğrudan veya dolaylı olarak davalıdan **ticari amaçla** elde etmiş kişiler hakkında da icra olunur. Kişisel kullanım için alan son tüketici bu hükmün sayma ölçüsü olan "ticari amaç"ın dışındadır.

  **Dava türü ve arabuluculuk.** Haksız rekabet davaları kanundaki bir hususa dayandığı için ticari davadır (TTK m. 4/1). Konusu bir miktar para olan alacak ve tazminat davalarında dava açmadan önce arabulucuya başvurmak **dava şartıdır** (TTK m. 5/A). Tespit, men ve ref davaları para ödenmesini konu almadığı için genellikle bu sistemin dışında anlatılır.

  ## 4. Çalıştıran ve basın-yayın kuruluşlarının sorumluluğu

  **Çalıştıran (TTK m. 57).** Haksız rekabet fiili çalışan veya işçi tarafından hizmetini gördüğü sırada işlenmişse, TTK m. 56/1-a, b ve c bentlerindeki **tespit, men ve ref davaları çalıştıran aleyhine de** açılabilir. Tazminat davalarında (d ve e bentleri) TBK hükümleri uygulanır; adam çalıştıranın sorumluluğuna ilişkin TBK m. 66'da çalıştıranın seçme, talimat ve gözetimde gerekli özeni gösterdiğini ispatlayarak kurtulma imkânı vardır. Bir işletmede adam çalıştıran ise ancak işletmenin çalışma düzeninin zararı önlemeye elverişli olduğunu ispatlarsa kurtulur (TBK m. 66/3).

  **Basın, yayın, iletişim ve bilişim (TTK m. 58).** Haksız rekabet bu araçlarla işlenmişse tespit, men ve ref davaları öncelikle yayımlanan şeyin **sahipleri ve ilan verenler** aleyhine açılır. Şu hâllerde dava, sırasıyla yazı işleri müdürü, genel yayın yönetmeni, program yapımcısı, içeriği yayın aracına koyan veya koyduran kişi ve ilan servisi şefine; bunlar gösterilemiyorsa **işletme veya kuruluş sahibine** yöneltilir:
  - yayın sahibinin veya ilan verenin haberi yoksa ya da onayına aykırıysa,
  - sahibin veya ilan verenin kim olduğunun bildirilmesinden kaçınılırsa,
  - sahibe veya ilan verene ulaşmak ya da onlara karşı Türk mahkemesinde dava açmak mümkün değilse.

  Sayılan kişilerden birinin kusuru varsa sıraya bakılmadan kusurlu kişiye dava açılabilir (TTK m. 58/2). **Hizmet sağlayıcı**, fiilin iletimini başlatmamış, alıcıyı veya içeriği seçmemiş ve içeriği değiştirmemişse aleyhine bu davalar açılamaz; ancak mahkeme olumsuz sonuçlar kapsamlı veya zarar büyük olacaksa hizmet sağlayıcıyı dinleyerek içeriğin geçici kaldırılması gibi tedbirleri alabilir (TTK m. 58/4).

  ## 5. İlan, zamanaşımı ve ihtiyati tedbir

  **Kararın ilanı (TTK m. 59).** Mahkeme, davayı kazanan tarafın istemiyle, gideri haksız çıkan taraftan alınmak üzere, **hükmün kesinleşmesinden sonra** ilan edilmesine karar verebilir.

  **Zamanaşımı (TTK m. 60).** TTK m. 56'daki davalar, hak sahibinin hakların doğumunu **öğrendiği günden itibaren bir yıl** ve **her hâlde doğumundan itibaren üç yıl** geçmekle zamanaşımına uğrar. Haksız rekabet fiili aynı zamanda TCK'ya göre **daha uzun dava zamanaşımına** tabi bir suç niteliğindeyse bu süre hukuk davaları için de geçerli olur.

  > 📌 **Kesin bilgi:** 1 yıl öğrenmeden, 3 yıl hakların doğumundan itibaren işler. TBK m. 72'deki iki yıl ve on yıl bu davalar için esas değildir (haksız rekabette özel süre vardır). Ceza zamanaşımının uygulanması için fiilin gerçekten suç oluşturması gerekir. Yargıtay, tescilli tasarıma dayanarak savcılığa başvurulmasını yasal hakkın kullanımı sayıp suç oluşturmadığı için 1 ve 3 yıllık sürelerin uygulandığı kararı onamıştır.

  **İhtiyati tedbir (TTK m. 61).** Dava açma hakkına sahip kimsenin talebiyle mahkeme, mevcut durumun korunmasına, maddi durumun ortadan kaldırılmasına, haksız rekabetin önlenmesine, yanlış beyanların düzeltilmesine ve diğer tedbirlere HMK'nin ihtiyati tedbir hükümlerine göre karar verebilir. Yani yalnızca "muhafaza" tedbiri değil, **eda niteliğinde** tedbirler de mümkündür. Ayrıca hak sahibinin yetkilerine tecavüz oluşturması hâlinde cezayı gerektiren haksız rekabet konusu mallara ithalat veya ihracatta gümrük idarelerince hak sahibinin talebiyle ihtiyati tedbir niteliğinde el konulabilir. Gümrük idaresinin kararının tebliğinden itibaren **on gün** içinde esas hakkında dava açılmaz veya tedbir alınmazsa el koyma kalkar (TTK m. 61/4).

  ## 6. Cezai sorumluluk (TTK m. 62-63)

  TTK m. 62, şu fiilleri ceza yaptırımına bağlar:
  - TTK m. 55'teki haksız rekabet fiillerinden birini **kasten** işlemek,
  - kendi teklifinin tercih edilmesi için kişisel durumu, ürünleri, ticari faaliyeti hakkında **kasten yanlış veya yanıltıcı bilgi** vermek,
  - çalışanları, vekilleri veya yardımcıları, çalıştıranın veya müvekkilin üretim veya ticaret sırlarını ele geçirmeleri için **aldatmak**,
  - çalışanın cezayı gerektiren haksız rekabet işlediğini öğrenip de **önlememek** veya gerçeğe aykırı beyanları düzeltmemek (çalıştıran veya müvekkil sıfatıyla).

  Yaptırım **iki yıla kadar hapis veya adli para cezasıdır**; fiil daha ağır cezayı gerektiren başka bir suç oluşturmuyorsa uygulanır. Kovuşturma, TTK m. 56 uyarınca **hukuk davası açma hakkına sahip olanlardan birinin şikâyetine** bağlıdır. Genel kural olarak şikâyete bağlı suçlarda şikâyet süresi, fiili ve failin kim olduğunu öğrenmeden itibaren altı aydır (TCK m. 73/1-2).

  **Tüzel kişiler (TTK m. 63).** Tüzel kişinin işleri görülürken haksız rekabet fiili işlenirse TTK m. 62 hükmü, tüzel kişi adına hareket eden veya etmesi gereken **organın üyeleri veya ortakları** hakkında uygulanır. Tüzel kişi hakkında ise ona özgü güvenlik tedbirlerine (TCK m. 60) karar verilebilir.

  ## 7. Denetim şeması

  1. Fiil TTK m. 55'teki bir bende uyuyor mu? Uymuyorsa TTK m. 54/2'deki genel dürüstlük ölçütüne aykırı mı?
  2. Hedef kitle ve etki: rakipler, tedarikçiler veya müşteriler arasındaki ilişkiyi etkiliyor mu?
  3. Kim dava açabilir (TTK m. 56/1-3)? Kime karşı (fail, çalıştıran, basın-yayın sırası)?
  4. Hangi dava: tespit, men, ref, maddi veya manevi tazminat? Kusur gerekli mi?
  5. Süre: öğrenmeden 1 yıl, doğumdan 3 yıl; ceza zamanaşımı istisnası var mı?
  6. Tedbir (TTK m. 61), ilan (TTK m. 59) ve ceza yolu (TTK m. 62, şikâyet) istenecek mi?
  7. Para konulu dava ise arabuluculuk başvurusu yapıldı mı (TTK m. 5/A)?

kritik: |
  - 📌 TTK m. 54: amaç dürüst ve bozulmamış rekabet; hukuka aykırılık ölçütü "aldatıcı veya dürüstlük kuralına aykırı" davranış.
  - ⚠️ TTK m. 55'teki liste **örnekleyicidir** ("başlıca"); sınırlı sayım yoktur.
  - ⚠️ Tespit, men ve ref için kusur aranmaz; kanun kusuru açıkça **maddi tazminat** için arar (TTK m. 56/1-d), manevi tazminat TBK m. 58 şartlarına bağlıdır.
  - 📌 TTK m. 55/1-a/6: tedarik fiyatının altında satışta **yanıltma karinesi**; davalı gerçek tedarik fiyatını ispatlarsa o esas alınır.
  - 📌 Karıştırılma (TTK m. 55/1-a/4): dış görünüş ve duyuruş ölçütüdür; dışarıdan görünmeyen iç benzerlik kapsam dışıdır (Yargıtay).
  - ⚠️ **Müşteri** tazminat davası açabilir, **imhayı** isteyemez (TTK m. 56/2).
  - ⚠️ **Oda, borsa, meslek birliği ve tüketici örgütleri** yalnız tespit, men ve ref davası açar; tazminat davası açamaz (TTK m. 56/3).
  - 📌 Men ve ref hükmü, malları davalıdan **ticari amaçla** elde edenlere karşı da icra olunur (TTK m. 56/4).
  - 📌 Çalıştıran aleyhine tespit, men ve ref davası açılabilir (TTK m. 57/1); tazminat için TBK hükümleri (TBK m. 66 kurtuluş kanıtı).
  - 📌 Basın-yayın: önce sahip ve ilan veren; sonra yazı işleri müdürü vb.; bunlar yoksa işletme sahibi (TTK m. 58).
  - 📌 Zamanaşımı: öğrenmeden **1 yıl**, her hâlde doğumdan **3 yıl** (TTK m. 60); fiil daha uzun ceza zamanaşımına tabi bir suçsa o süre.
  - 📌 Ceza (TTK m. 62): **kasten**, **şikâyete bağlı**, **iki yıla kadar hapis veya adli para cezası**; şikâyet hakkı TTK m. 56 uyarınca dava açabilenlerdendir.

doktrin: |
  ### TTK m. 55 sayımının niteliği

  Maddedeki hâller "başlıcalar" olarak sayıldığı için örnekleyicidir. Yargıtay'ın izlediği yol iki aşamalıdır: önce özel hüküm niteliğindeki TTK m. 55'te bir hâle uyup uymadığına, uymuyorsa genel hüküm olan TTK m. 54/2'ye bakılır. Böylece sayıma girmeyen bir davranış da dürüstlüğe aykırılık nedeniyle yaptırıma bağlanabilir.

  ### Sınai mülkiyet hakları ile kümülatif koruma

  Tescilli marka veya tasarıma tecavüz hâlinde hak sahibi aynı fiil için hem Sınai Mülkiyet Kanunu'na hem de haksız rekabet hükümlerine dayanabilir mi? Bir görüşe göre iki rejim farklı menfaatleri korur (birey tekeli ile piyasa dürüstlüğü), şartları varsa birlikte uygulanır. Yargıtay Hukuk Genel Kurulu'nun 2026 tarihli bir kararında oy çokluğuyla benimsenen görüş ise, mülga TTK'daki "ad, unvan, marka, işaret gibi tanıtma vasıtaları" ibaresinin 6102 sayılı TTK m. 55/1-a/4'e alınmadığını ve tescilli sınai haklar ile tescilsiz tasarımlarda özel kanunun (SMK) üstün koruma getirdiğini, özel bir hüküm yoksa haksız rekabet hükümlerinin aynı anda uygulanamayacağını söyler. Konu karşı oy da içerdiği için sınavda iki görüş ve gerekçeleri anlatılmalıdır.

  ### Tespit ve men ile tazminatın birlikte istenmesi

  Aynı davada hem tespit/men hem tazminat isteniyorsa arabuluculuğun dava şartı olup olmadığı (tüm dava için mi, yalnız tazminat istemi için mi) uygulamada farklı yorumlanmaktadır. Tazminat istemi bakımından arabuluculuğun şart olduğu açıktır (TTK m. 5/A).

sozluk:
  - terim: Haksız rekabet
    tanim: "Rakipler arasındaki veya tedarik edenlerle müşteriler arasındaki ilişkileri etkileyen aldatıcı ya da dürüstlük kuralına aykırı davranış ve ticari uygulama (TTK m. 54)."
  - terim: İltibas
    tanim: "Mal, iş ürünü, faaliyet veya işlerin karıştırılması; TTK m. 55/1-a/4'te dış görünüş ve duyuruş bağlamında aranır."
  - terim: Karşılaştırmalı reklam
    tanim: "Kendini veya malını başkasıyla kıyaslayan reklam; gerçeğe aykırı, yanıltıcı, gereksiz kötüleyici ya da gereksiz yere tanınmışlıktan yararlanıyorsa haksız rekabettir (TTK m. 55/1-a/5)."
  - terim: Tespit davası
    tanim: "Fiilin haksız rekabet olup olmadığının belirlenmesini isteyen dava (TTK m. 56/1-a)."
  - terim: Men davası
    tanim: "Haksız rekabetin önlenmesini, sona erdirilmesini isteyen dava (TTK m. 56/1-b)."
  - terim: Ref davası
    tanim: "Haksız rekabetin sonucu olan durumun ortadan kaldırılmasını, beyanların düzeltilmesini ve gerekirse araç ve malların imhasını isteyen dava (TTK m. 56/1-c)."
  - terim: Aktif dava ehliyeti
    tanim: "Davayı açabilme sıfatı; TTK m. 56'da zarar görenler, müşteriler ve meslek kuruluşları için ayrı ayrı belirlenmiştir."
  - terim: Basamaklı sorumluluk
    tanim: "Basın-yayın yoluyla haksız rekabette dava edilecek kişilerin kanunda sıralanması (TTK m. 58)."
  - terim: Eda niteliğinde tedbir
    tanim: "Yalnızca durumu korumayan, ref ve men gibi sonuçları geçici olarak sağlayan ihtiyati tedbir (TTK m. 61)."
  - terim: Şikâyete bağlı suç
    tanim: "Soruşturulması ve kovuşturulması, yetkili kişinin şikâyetine bağlı suç; TTK m. 62 suçları böyledir."
  - terim: Kümülatif koruma
    tanim: "Aynı fiile karşı birden çok kanunun (ör. SMK ve haksız rekabet hükümleri) birlikte uygulanması."

kararlar:
  - id: "920314600"
    ozet: |
      Davacı yazılım şirketi, 2008-2012 arasında kendisinde yazılım mühendisi olarak çalışmış davalının sonradan kurduğu işletmede, davacının "İSGPro" programına modül adları, arayüz ve işleyiş bakımından çok benzeyen "EHSCore" programını pazarladığını ve internet sitesinde davacının müşterileriyle yürütülen projeleri kendi deneyimi gibi gösterdiğini ileri sürerek haksız rekabetin tespitini, men'ini ve maddi tazminat istedi. İlk Derece Mahkemesi ve Bölge Adliye Mahkemesi, kaynak kodlarının farklı olduğu gerekçesiyle davayı reddetti; Yargıtay 11. Hukuk Dairesi bozdu, Bölge Adliye Mahkemesi direndi. Hukuk Genel Kurulu direnme kararını oy birliğiyle bozdu. Gerekçesine göre TTK m. 55/1-a/4'teki karıştırılma, ürünün müşteriye görünen dış görünüşü ve duyuruşu ile ilgilidir; dışarıdan görünmeyen kod farklılığı hükmü ortadan kaldırmaz. Programların sunumundaki olağan dışı benzerlik karıştırılmaya yol açıyorsa haksız rekabet vardır. İnternet sitesindeki, davacının müşterileriyle yürütülen projeleri davalının bağımsız faaliyeti gibi sunan ifadeler de TTK m. 54/2 anlamında aldatıcı bir ticari uygulamadır. Rekabet ilişkisi, kusur ve zarar haksız rekabetin varlığı için aranmaz; kusur ve zarar yalnızca tazminat davalarında önem taşır.
  - id: "1227805600"
    ozet: |
      Davacı, davalıların tasarım tescillerine dayanarak Cumhuriyet Başsavcılığına şikâyette bulunmaları üzerine iş yerinde arama ve el koyma yapıldığını ve davalılardan birinin noterden bir "bilgilendirme" yazısı gönderdiğini ileri sürerek haksız rekabetin tespitini, önlenmesini ve 100.000 TL manevi tazminatı istedi. Olaylar 2006-2007 tarihlidir; dava ise ilk olaydan yaklaşık dört yıl sonra, 2010 yılında açıldı. Davalılar, mahkemenin görevsizlik kararından önce zamanaşımı def'inde bulundu. İlk Derece Mahkemesi, kayıtlı tasarıma dayanarak savcılığa başvurulmasını ve arama kararı alınmasını yasal hakkın kullanımı sayarak bunun suç oluşturmadığını, bu yüzden TTK m. 60'ın ceza zamanaşımına ilişkin son cümlesinin uygulanmayacağını, 1 ve 3 yıllık süreler dolduğu için davanın zamanaşımından reddi gerektiğini kabul etti. Bölge Adliye Mahkemesi istinafı esastan reddetti. Yargıtay 11. Hukuk Dairesi, ilk derece kararında isabetsizlik görmeyerek Bölge Adliye Mahkemesinin esastan ret kararını oy birliğiyle onadı. Karar, TTK m. 60'ın istisnasının ancak fiil gerçekten ceza gerektiren bir suç oluşturuyorsa işlediğini gösterir.

sorular:
  - soru: |
      Haksız rekabet sebebiyle açılan davalarda kusura ilişkin aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Tespit, men ve ref davaları için de maddi tazminatta olduğu gibi kusur şarttır."
      - "Kusur kanunda yalnızca maddi tazminat isteminin şartı olarak anılır; tespit, men ve ref kusura bağlanmamıştır."
      - "Haksız rekabet davalarında kusur hiçbir istem için aranmaz."
      - "Manevi tazminat dışında hiçbir istem için kusur aranmaz."
    dogru: 1
    aciklama: |
      TTK m. 56/1-d, "kusur varsa" zararın tazminini düzenler; a, b ve c bentlerindeki tespit, men ve ref ise kusura bağlanmamıştır. Manevi tazminat TBK m. 58 şartlarına bağlıdır. Çeldiriciler, kusurun her istemde veya hiçbir istemde aranacağını söyler.

  - soru: |
      Bir süpermarket zinciri, bazı ürünlerini alış fiyatının çok altında satışa sunmuş ve bu satışları reklamlarında özellikle vurgulayarak müşterileri kendisinin ve rakiplerinin yeteneği hakkında yanıltmıştır. Satış fiyatı, benzer hacimde alımda uygulanan tedarik fiyatının altında olduğuna göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yanıltmanın varlığı karine olarak kabul edilir; davalı gerçek tedarik fiyatını ispatlarsa bu fiyat esas alınır."
      - "Yanıltma, davacı tarafından kesin delillerle ispatlanmak zorundadır; karine yoktur."
      - "Tedarik fiyatı altında satış, kanunda hiçbir koşulda haksız rekabet sayılmaz."
      - "Yalnızca fiyat kırma tek başına cezayı gerektirir."
    dogru: 0
    aciklama: |
      TTK m. 55/1-a/6'ya göre satış fiyatının benzer hacimde alımda uygulanan tedarik fiyatının altında olması hâlinde yanıltmanın varlığı karine olarak kabul olunur; davalı gerçek tedarik fiyatını ispatlarsa bu fiyat değerlendirmeye esas olur. Hükmün şartı, seçilmiş malların birden çok kere tedarik fiyatının altında sunulması, reklamda vurgulanması ve müşterinin yanıltılmasıdır.

  - soru: |
      Zeynep Ltd. Şti., rakibi Yıldız A.Ş.'nin piyasadaki tanınmış ambalajına, müşteriyi yanıltacak ölçüde benzeyen bir ambalajla ürün sunmaktadır. Zeynep'in bu davranışı hangi haksız rekabet hâline girer?
    siklar:
      - "TTK m. 55/1-a/4: başkasının malları veya iş ürünleriyle karıştırılmaya yol açan önlemler almak."
      - "TTK m. 55/1-d: üretim ve iş sırlarını ifşa etmek."
      - "TTK m. 55/1-e: iş şartlarına uymamak."
      - "TTK m. 55/1-f: genel işlem şartları kullanmak."
    dogru: 0
    aciklama: |
      Karıştırılmaya (iltibasa) yol açan önlemler TTK m. 55/1-a/4'tedir. Yargıtay'a göre karıştırılma, ürünün müşteriye görünen dış görünüşü ve duyuruşu bağlamında değerlendirilir ve nesnel ölçütle hedef kitle izlenimine bakılır. Diğer bentler sır ifşası, iş şartları ve genel işlem şartlarıyla ilgilidir.

  - soru: |
      Toptancı Hasan, rakibi Deniz'in müşterisi Mehmet'e, kendisiyle sözleşme yapabilmesi için Mehmet'in Deniz'le yaptığı sözleşmeye aykırı davranması yönünde baskı yapmıştır. Hasan'ın bu davranışı bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Davranış TTK m. 55/1-b kapsamında, sözleşmeyi ihlale yöneltme hâli olarak haksız rekabet sayılabilir."
      - "Davranış, yalnızca TTK m. 55/1-c'deki iş ürününden yetkisiz yararlanma olur."
      - "Davranış, rekabet hukuku bakımından tamamen serbesttir."
      - "Davranış yalnızca TTK m. 55/1-e kapsamındadır."
    dogru: 0
    aciklama: |
      TTK m. 55/1-b/1, müşterilerle kendisinin bizzat sözleşme yapabilmesi için onları başkalarıyla yapmış oldukları sözleşmelere aykırı davranmaya yöneltmeyi haksız rekabet sayar; b grubu genel olarak sözleşmeyi ihlale veya sona erdirmeye yöneltmeyi kapsar. c bendi iş ürünü kullanımı, e bendi ise iş şartlarına uymamaktır.

  - soru: |
      Mimar Ali, bir müteahhide hazırladığı konut projesi ve maliyet hesabını teklif amacıyla emanet etmiştir. Anlaşma gerçekleşmeyince müteahhit, bu plan ve hesabı Ali'nin izni olmadan kendi projesinde kullanmıştır. Bu davranış hangi hâl kapsamındadır?
    siklar:
      - "TTK m. 55/1-a/1: kötüleme"
      - "TTK m. 55/1-c/1: kendisine emanet edilmiş teklif, hesap veya plan gibi iş ürününden yetkisiz yararlanma"
      - "TTK m. 55/1-e: iş şartlarına uymamak"
      - "TTK m. 55/1-b/4: tüketici kredisinden caymaya yöneltme"
    dogru: 1
    aciklama: |
      TTK m. 55/1-c/1, kendisine emanet edilmiş teklif, hesap veya plan gibi bir iş ürününden yetkisiz yararlanmayı haksız rekabet sayar. Olayda kötüleme, iş şartlarına uymama ya da kredi sözleşmesinden caymaya yöneltme yoktur.

  - soru: |
      Bir gıda ürününü satın alan müşteri Murat, satıcının gerçek dışı "organik" beyanıyla yanıltılmış ve zarar görmüştür. Murat'ın TTK m. 56 çerçevesindeki dava hakkı bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Murat hiçbir dava açamaz; yalnız rakipler açabilir."
      - "Murat tespit, men, ref ve tazminat davalarını açabilir, ancak araç ve malların imhasını isteyemez."
      - "Murat yalnızca tespit davası açabilir."
      - "Murat araç ve malların imhasını da isteyebilir, ancak tazminat isteyemez."
    dogru: 1
    aciklama: |
      TTK m. 56/2: ekonomik çıkarları zarar gören veya tehlikeyle karşılaşan müşteriler birinci fıkradaki davaları açabilir, ancak araçların ve malların imhasını isteyemez. Çeldiriciler müşterinin dava hakkını fazla daraltır veya imhayı da tanır.

  - soru: |
      Bir Tüketici Derneği, haksız rekabet teşkil eden yanıltıcı bir reklam kampanyasına karşı dava açmak istemektedir. Derneğin TTK m. 56/3'e göre açabileceği davalar bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yalnızca tespit, men ve ref davalarını açabilir; tazminat davası açamaz."
      - "Bütün davaları, maddi ve manevi tazminat dâhil açabilir."
      - "Hiçbir dava açamaz; yalnız savcılığa şikâyet edebilir."
      - "Yalnızca manevi tazminat davası açabilir."
    dogru: 0
    aciklama: |
      TTK m. 56/3, tüzüklerine göre tüketicilerin ekonomik menfaatlerini koruyan sivil toplum kuruluşlarına ve kamusal nitelikteki kurumlara birinci fıkranın a, b ve c bentlerindeki davaları, yani tespit, men ve ref davalarını açma imkânı tanır. Tazminat (d ve e bentleri) bu kapsamda sayılmamıştır.

  - soru: |
      Haksız rekabete konu mallar hakkında davalı aleyhine verilmiş men ve ref hükmü (TTK m. 56/1-b ve c) kimlere karşı icra olunabilir?
    siklar:
      - "Yalnızca davalının kendisine"
      - "Davalıya ve malları ondan kişisel kullanım amacıyla alan tüm tüketicilere"
      - "Davalıya ve haksız rekabete konu malları doğrudan veya dolaylı bir şekilde ondan ticari amaçla elde etmiş kişilere"
      - "Davalının bütün alacaklılarına"
    dogru: 2
    aciklama: |
      TTK m. 56/4'e göre bir kimse aleyhine b ve c bentleri gereğince verilmiş olan hüküm, haksız rekabete konu malları doğrudan veya dolaylı bir şekilde ondan ticari amaçla elde etmiş olan kişiler hakkında da icra olunur. Kişisel tüketim amacı ölçüt değildir.

  - soru: |
      Bir firmanın satış elemanı İsmail, iş saatinde müşterilere rakip firmayı yalan beyanlarla kötülemiştir. Rakip firma, işverene karşı tespit, men ve ref davası açmak istemektedir. Bu bakımdan aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İşverene karşı hiçbir dava açılamaz; yalnız İsmail dava edilebilir."
      - "Tespit, men ve ref davaları çalıştıran işverene karşı da açılabilir; tazminat davalarında ise TBK hükümleri uygulanır."
      - "İşverene karşı yalnızca tazminat davası açılabilir."
      - "İşverene karşı dava ancak İsmail mahkûm olursa açılabilir."
    dogru: 1
    aciklama: |
      TTK m. 57/1: fiil çalışanlar tarafından hizmetlerini gördükleri sırada işlenmişse, TTK m. 56/1-a, b ve c davaları çalıştıranlara karşı da açılabilir. Tazminat (d ve e bentleri) bakımından TBK hükümleri uygulanır (TTK m. 57/2); adam çalıştıranın sorumluluğu ve kurtuluş kanıtı bu kapsamda gündeme gelir (TBK m. 66).

  - soru: |
      TTK m. 56'da yazılı davalarda zamanaşımı bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Öğrenmeden itibaren iki yıl, her hâlde fiilden itibaren on yıl"
      - "Öğrenmeden itibaren bir yıl, her hâlde doğumundan itibaren üç yıl"
      - "Öğrenmeden itibaren altı ay, her hâlde bir yıl"
      - "Zamanaşımı yoktur; tecavüz sürdükçe dava açılabilir"
    dogru: 1
    aciklama: |
      TTK m. 60: TTK m. 56'daki davalar, hakkı olanın bu hakların doğumunu öğrendiği günden itibaren bir yıl ve her hâlde doğumundan itibaren üç yıl geçmekle zamanaşımına uğrar. İki ve on yıl TBK m. 72'nin genel haksız fiil süreleridir. Fiil daha uzun ceza zamanaşımına tabi bir suçsa o süre hukuk davaları için de geçerlidir.

  - soru: |
      Pazarlama müdürü Kerem, rakibin ürününün zararlı olmadığını bile bile, müşterilere "bu ürün zehirlidir" demiştir. Rakip firma, Kerem'i şikâyet etmek istemektedir. TTK m. 62 bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Fiil, re'sen soruşturulur; şikâyet gerekmez."
      - "Fiil, kasten işlenmesi hâlinde, hukuk davası açma hakkı olanlardan birinin şikâyeti üzerine iki yıla kadar hapis veya adli para cezası ile cezalandırılır."
      - "Fiil taksirle de işlenebilir ve yalnızca idari para cezası gerektirir."
      - "Fiil ancak bir yıldan fazla hapis cezası gerektirir."
    dogru: 1
    aciklama: |
      TTK m. 62/1'e göre fiil kasten işlenmeli ve TTK m. 56 uyarınca hukuk davası açma hakkına sahip olanlardan birinin şikâyeti bulunmalıdır; yaptırım iki yıla kadar hapis veya adli para cezasıdır. Şikâyet için genel süre TCK m. 73'te altı aydır.

  - soru: |
      Basın yoluyla işlenen bir haksız rekabette, yayımlanan ilanın sahibi veya ilan verenin kim olduğunun bildirilmesinden kaçınılmaktadır. TTK m. 58'e göre tespit, men ve ref davaları kime açılabilir?
    siklar:
      - "Yalnızca okuyuculara"
      - "Yazı işleri müdürü, genel yayın yönetmeni, program yapımcısı, içeriği koyan veya koyduran kişi ve ilan servisi şefi; bunlar gösterilemiyorsa işletme veya kuruluş sahibi"
      - "Yalnızca gazete bayiine"
      - "Hiç kimseye; basın yoluyla işlenen haksız rekabete dava açılamaz"
    dogru: 1
    aciklama: |
      TTK m. 58/1: davalar ancak yayımlananın sahipleri ile ilan verenler aleyhine açılabilir; ancak sahibin veya ilan verenin kim olduğunun bildirilmesinden kaçınılırsa, yazı işleri müdürü, genel yayın yönetmeni, program yapımcısı, içeriği koyan veya koyduran kişi ve ilan servisi şefi, bunlar gösterilemiyorsa işletme veya kuruluş sahibi aleyhine açılabilir.

olaylar:
  - olay: |
      Kozmetik üreticisi K A.Ş.'nin satış müdürü Selim, şirket yönetiminin bilgisi dışında bastırdığı broşürlerde, rakip R A.Ş.'nin kremlerini, bu iddiaların gerçeğe aykırı olduğunu bildiği hâlde "cildi bozar, içeriği zararlıdır" diye kötülemiş; ayrıca K A.Ş.'nin kremlerinin "Altın Ödüllü" olduğunu yazmıştır. Böyle bir ödül yoktur ve Selim bunu bilmektedir. Broşürü okuyan müşteri Mine, bu söze güvenerek K A.Ş.'nin kremini almış ve cildinde tahriş yaşamıştır. Tüketici Derneği (T) de kampanyaya karşı dava açmak istemektedir.

      1. Selim'in davranışı hangi haksız rekabet hâllerine girer?
      2. R A.Ş. kime karşı hangi davaları açabilir?
      3. Mine ve T Derneği hangi davaları açabilir?
      4. Selim'in cezai sorumluluğu var mıdır?
    olcut:
      - {tespit: "Rakibi yanlış beyanla kötülemek ve olmayan ödülü varmış gibi sunmak haksız rekabet hâlleridir", puan: 20, madde: "TTK m. 55/1-a"}
      - {tespit: "Çalışan hizmeti sırasında haksız rekabet işlediğinden tespit, men ve ref davaları işveren K A.Ş.'ye karşı da açılabilir", puan: 20, madde: "TTK m. 57/1"}
      - {tespit: "Tazminat davalarında TBK uygulanır; K A.Ş. adam çalıştıran olarak özen ispatıyla kurtulmayı deneyebilir", puan: 15, madde: "TBK m. 66"}
      - {tespit: "Müşteri Mine tespit, men, ref ve tazminat isteyebilir ama araç ve malların imhasını isteyemez", puan: 15, madde: "TTK m. 56/2"}
      - {tespit: "Tüketici Derneği yalnız tespit, men ve ref davalarını açabilir; tazminat istenemez", puan: 15, madde: "TTK m. 56/3"}
      - {tespit: "Kasten işlenmiş fiil şikâyet üzerine iki yıla kadar hapis veya adli para cezası gerektirir", puan: 15, madde: "TTK m. 62"}
    cozum: |
      **Nitelendirme:** Olay, reklam ve satış yöntemleri yoluyla işlenen haksız rekabeti (kötüleme ve gerçek dışı beyan), çalıştıranın sorumluluğunu ve dava hakkı sahiplerinin kapsamını birlikte sorar.

      **Hukuki sorunlar:** (1) Fiiller hangi bentlere girer? (2) Rakip, işverene karşı hangi davayı açabilir? (3) Müşteri ve tüketici örgütü hangi davalarda aktif ehliyete sahiptir? (4) Ceza sorumluluğu var mıdır?

      **İlgili hükümler:** TTK m. 54/2 genel ilkeyi, TTK m. 55/1-a/1, a/2 ve a/3 kötüleme, gerçek dışı açıklama ve almadığı ödülü varmış gibi gösterme hâllerini düzenler. TTK m. 56 davaları ve dava hakkı sahiplerini, TTK m. 57 çalıştıranın sorumluluğunu, TTK m. 62 cezai sorumluluğu belirler.

      **Değerlendirme:** Selim'in "cildi bozar" gibi yanlış ve gereksiz yere incitici açıklamaları TTK m. 55/1-a/1'e, "Altın Ödüllü" iddiası almadığı ödülü varmış gibi göstermesi nedeniyle TTK m. 55/1-a/3'e (ve gerçek dışı açıklama olarak TTK m. 55/1-a/2'ye) girer. Selim hizmetini görürken hareket ettiği için R A.Ş., tespit, men ve ref davalarını (TTK m. 56/1-a, b, c) K A.Ş.'ye karşı da açabilir (TTK m. 57/1); yönetimin bilgisi dışında olması bu davalar bakımından sonucu değiştirmez. Maddi ve manevi tazminat davalarında ise TBK hükümleri uygulanır (TTK m. 57/2); adam çalıştıranın sorumluluğunda K A.Ş. seçme, talimat ve gözetimde gerekli özeni gösterdiğini ispat ederek kurtulmaya çalışabilir (TBK m. 66/2); K A.Ş. bir işletme olduğundan ayrıca işletmenin çalışma düzeninin zararı önlemeye elverişli olduğunu da ispat etmesi gerekir (TBK m. 66/3). Müşteri Mine'nin ekonomik çıkarları zarar gördüğü için tespit, men, ref ve tazminat davalarını açabilir; ancak araç ve malların imhasını isteyemez (TTK m. 56/2). Tüketici Derneği ise tüketicilerin menfaatini korumak üzere yalnızca tespit, men ve ref davalarını açabilir; tazminat davası açamaz (TTK m. 56/3). Selim beyanlarının gerçeğe aykırı olduğunu bilerek, yani kasten hareket ettiğinden, hukuk davası açma hakkına sahip olanlardan birinin şikâyeti üzerine iki yıla kadar hapis veya adli para cezası ile cezalandırılır (TTK m. 62/1). Para konulu tazminat davalarında dava açmadan önce arabulucuya başvurulması da gerekir (TTK m. 5/A).

      **Sonuç:** Selim'in davranışı TTK m. 55/1-a kapsamında haksız rekabettir. R A.Ş. tespit, men ve ref davalarını K A.Ş.'ye de yöneltebilir, tazminatta TBK uygulanır. Mine imha hariç bütün davaları açabilir; T Derneği yalnız tespit, men ve ref davası açabilir. Selim şikâyet üzerine TTK m. 62 uyarınca cezalandırılabilir.

  - olay: |
      Ankara'daki B A.Ş., 12 Mart 2021'de dağıttığı bültende, rakibi A Ltd. Şti.'nin ürünleri için "sağlığa zararlı ve sahte" ifadelerini kullanmıştır. B'nin pazarlama direktörü ürünlerin sahte veya zararlı olmadığını bilmektedir. A Ltd. bültenin varlığını 20 Mart 2021'de öğrenmiş ve 5 Nisan 2021'de Cumhuriyet savcılığına şikâyette bulunmuştur. A Ltd., 15 Mart 2023'te B A.Ş.'ye karşı haksız rekabetin tespiti, men'i ve maddi tazminat için dava açmıştır. B A.Ş. zamanaşımı def'inde bulunmuştur. A Ltd., ayrıca dava sürerken bültenin dağıtımının durdurulmasını istemektedir.

      1. Fiil hangi hâle girer ve hangi davalar açılabilir?
      2. TTK m. 60'a göre zamanaşımı süreleri nedir; B'nin def'i yerinde midir?
      3. A Ltd. dava süresince bültenin dağıtımının durdurulması için ne yapabilir?
      4. B'nin pazarlama direktörünün cezai sorumluluğu var mıdır?
    olcut:
      - {tespit: "Rakibi yanlış ve yanıltıcı açıklamalarla kötülemek haksız rekabettir; tespit, men, ref ve kusur varsa tazminat istenebilir", puan: 20, madde: "TTK m. 55/1-a/1"}
      - {tespit: "Genel zamanaşımı: öğrenmeden itibaren bir yıl, her hâlde doğumundan itibaren üç yıl", puan: 20, madde: "TTK m. 60"}
      - {tespit: "Fiil aynı zamanda daha uzun dava zamanaşımına tabi bir suçsa o süre hukuk davaları için de geçerlidir; kasten işlenen fiil TTK m. 62 kapsamında suçtur", puan: 25, madde: "TTK m. 60"}
      - {tespit: "Pazarlama direktörü kasten hareket ettiğinden şikâyet üzerine iki yıla kadar hapis veya adli para cezası", puan: 15, madde: "TTK m. 62"}
      - {tespit: "İhtiyati tedbirle haksız rekabetin önlenmesi ve yanlış beyanların düzeltilmesi istenebilir (eda niteliğinde tedbir)", puan: 10, madde: "TTK m. 61"}
      - {tespit: "Para konulu tazminat istemi için dava öncesi arabuluculuk dava şartıdır", puan: 10, madde: "TTK m. 5/A"}
    cozum: |
      **Nitelendirme:** Olay, rakibin yanlış beyanlarla kötülenmesi (reklam ve bülten yoluyla haksız rekabet), TTK m. 60'taki zamanaşımı ve bu zamanaşımının ceza zamanaşımı istisnası ile ihtiyati tedbiri birlikte ele alır.

      **Hukuki sorunlar:** (1) Fiil hangi hâle girer? (2) Dava zamanaşımına uğramış mıdır, ceza zamanaşımı istisnası uygulanır mı? (3) Dava sürerken hangi tedbir istenebilir? (4) Kişisel ceza sorumluluğu nedir?

      **İlgili hükümler:** TTK m. 55/1-a/1 yanlış, yanıltıcı veya gereksiz yere incitici açıklamalarla kötülemeyi haksız rekabet sayar. TTK m. 56 davaları, TTK m. 60 zamanaşımını, TTK m. 61 ihtiyati tedbiri, TTK m. 62 cezai sorumluluğu düzenler. TCK m. 66 dava zamanaşımı sürelerini içerir.

      **Değerlendirme:** B'nin bülteni, A'nın ürünleri hakkında yanlış ve yanıltıcı açıklamalarla kötülemeyi içerdiğinden TTK m. 55/1-a/1'e girer. A Ltd., tespit, men, ref ve kusur ispatlanmak koşuluyla maddi tazminat isteyebilir (TTK m. 56/1). TTK m. 60'a göre davalar, hakkın doğumunu öğrenmeden itibaren bir yıl, her hâlde doğumdan itibaren üç yıl içinde açılmalıdır. A Ltd. 20 Mart 2021'de öğrendiği hâlde 15 Mart 2023'te, yani yaklaşık iki yıl sonra dava açtığı için bir yıllık süre geçmiştir; yalnız bu süre esas alınırsa B'nin def'i yerindedir. Ancak TTK m. 60'ın son cümlesi, haksız rekabet fiili aynı zamanda TCK gereğince daha uzun dava zamanaşımına tabi bir suç niteliğindeyse bu süreyi hukuk davaları için de geçerli kılar. Pazarlama direktörü ürünlerin zararlı veya sahte olmadığını bile bile kasten yanlış bilgi verdiğinden fiil TTK m. 62 kapsamında suç oluşturur ve iki yıla kadar hapis veya adli para cezası öngörüldüğünden ceza dava zamanaşımı TCK m. 66/1-e uyarınca sekiz yıldır; bu süre bir ve üç yıldan uzun olduğu için hukuk davasında da uygulanır ve dava zamanaşımına uğramamıştır. A Ltd., dava süresince TTK m. 61 uyarınca ihtiyati tedbir isteyebilir; mahkeme yalnız mevcut durumun korunmasına değil, haksız rekabetin önlenmesine ve yanlış beyanların düzeltilmesine de karar verebilir. Tazminat istemi bakımından dava öncesi arabuluculuk dava şartıdır (TTK m. 5/A). Pazarlama direktörü, hukuk davası açma hakkına sahip A Ltd.'nin şikâyeti üzerine iki yıla kadar hapis veya adli para cezası ile cezalandırılabilir (TTK m. 62/1).

      **Sonuç:** Fiil TTK m. 55/1-a/1 kapsamında haksız rekabettir. Genel süre bir yıl ve üç yıl olsa da kasten işlenen suç niteliği nedeniyle daha uzun ceza zamanaşımı hukuk davasına da uygulanır, B'nin zamanaşımı def'i yerinde değildir. A Ltd. ihtiyati tedbir isteyebilir; pazarlama direktörü şikâyet üzerine cezalandırılabilir.

kartlar:
  - on: "TTK m. 54'ün amacı ve genel ilkesi nedir?"
    arka: "Amaç, bütün katılanların menfaatine dürüst ve bozulmamış rekabettir. Rakipler arasında veya tedarikçi ile müşteri arasındaki ilişkileri etkileyen aldatıcı ya da dürüstlüğe aykırı davranışlar haksızdır."
  - on: "TTK m. 55'teki fiil listesi sınırlı mıdır?"
    arka: "Hayır. 'Başlıca' haller sayılmıştır; örnekleyicidir. Listeye girmeyen dürüstlüğe aykırı davranışlar TTK m. 54/2 ile yakalanır."
  - on: "Tedarik fiyatının altında satışta karine nedir?"
    arka: "Yanıltmanın varlığı karine sayılır; davalı gerçek tedarik fiyatını ispatlarsa o fiyat esas alınır (TTK m. 55/1-a/6)."
  - on: "Karıştırılma (TTK m. 55/1-a/4) neye bakar?"
    arka: "Ürün veya faaliyetin dış görünüşü ve duyuruşu. Dışarıdan görünmeyen iç benzerlik (kaynak kodu gibi) kapsam dışıdır; ölçüt hedef kitle izlenimi (Yargıtay)."
  - on: "TTK m. 56/1'deki davalar nelerdir?"
    arka: "Tespit, men, ref (düzeltme ve gerekirse imha), kusur varsa maddi tazminat, TBK m. 58 şartlarında manevi tazminat."
  - on: "Müşterilerin dava hakkı neleri kapsar?"
    arka: "TTK m. 56/1'deki davaların hepsi, ancak araç ve malların imhası istenemez (TTK m. 56/2)."
  - on: "Oda, borsa ve tüketici örgütleri hangi davaları açar?"
    arka: "Yalnız tespit, men ve ref davalarını; tazminat davası açamazlar (TTK m. 56/3)."
  - on: "TTK m. 56/4'ün anlamı nedir?"
    arka: "Men ve ref hükmü, malları davalıdan doğrudan veya dolaylı ve ticari amaçla elde eden kişilere karşı da icra olunur."
  - on: "Çalıştıran aleyhine hangi davalar açılır?"
    arka: "Çalışanın hizmeti sırasında işlediği haksız rekabette tespit, men ve ref davaları çalıştıran aleyhine de açılır (TTK m. 57/1); tazminatta TBK uygulanır."
  - on: "TTK m. 60'ın süreleri nelerdir?"
    arka: "Öğrenmeden itibaren 1 yıl, her hâlde doğumdan itibaren 3 yıl; fiil daha uzun ceza zamanaşımına tabi suçsa o süre."
  - on: "TTK m. 62 suçunun özellikleri nelerdir?"
    arka: "Kasten işlenir; TTK m. 56 uyarınca dava hakkı olanlardan birinin şikâyetine bağlıdır; iki yıla kadar hapis veya adli para cezası."
  - on: "Kararın ilanı ne zaman istenebilir?"
    arka: "Davayı kazanan tarafın istemiyle, gideri haksız çıkan taraftan alınmak üzere ve hükmün kesinleşmesinden sonra (TTK m. 59)."
