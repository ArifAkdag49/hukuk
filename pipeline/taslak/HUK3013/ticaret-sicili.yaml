  - 📌 Tescili isteme süresi **15 gündür**; sicil müdürlüğünün yetki çevresi dışında oturanlar için **1 aydır** (TTK m. 30).
  - 📌 Süre, tescili gerekli işlem veya olgunun gerçekleştiği (belgeye bağlıysa belgenin düzenlendiği) tarihte başlar (TTK m. 30/2).
  - 📌 Müdür, tescil için kanuni şartları inceler; tescil edilecek hususlar gerçeği tam yansıtmalı, yanlış izlenim yaratmamalı ve kamu düzenine aykırı olmamalıdır (TTK m. 32).
  - 📌 Çözümü mahkeme kararına bağlı ya da kesin tescili duraksanan hususlar geçici tescil edilir; ilgililer **3 ay** içinde mahkemeye başvuru veya anlaşmayı ispat etmezse kayıt resen silinir (TTK m. 32/4).
  - 📌 Tescile davete uymayan ve kaçınma sebebi bildirmeyen kişiye, müdürün teklifi üzerine **mahallin en büyük mülki amiri** idari para cezası verir (TTK m. 33/2).
  - 📌 Müdür kararına itiraz süresi tebliğden itibaren **8 gündür**; mahkeme sicilin bulunduğu yerdeki asliye ticaret mahkemesidir (TTK m. 34).
  - 📌 Sicil herkese açıktır; ilan Türkiye Ticaret Sicili Gazetesi ile yapılır (TTK m. 35).
  - ⚠️ Kayıtlar, ilanı **izleyen iş gününden** itibaren üçüncü kişiler hakkında sonuç doğurur (TTK m. 36/1). Olumlu etkide bilmediğini ileri sürmek dinlenmez; olumsuz etkide tescil/ilan edilmeyen husus ancak bilindiği veya bilinmesi gerektiği ispatlanırsa ileri sürülür (TTK m. 36/3 ve TTK m. 36/4).
doktrin: |
  ### Sicil müdürünün inceleme yetkisinin sınırı

  TTK m. 32, müdüre kanuni şartları inceleme görevi verir; hükmün lafzı yalnızca belgelerin eksiksizliğini değil, içeriğin gerçeği yansıtması, yanlış izlenim yaratmaması ve kamu düzenine uygunluğu gibi esasa ilişkin kontrolleri de kapsayacak genişliktedir. Bir görüş, müdürün yalnızca şekli denetim yapabileceğini, uyuşmazlık gerektiren konuların mahkemeye ait olduğunu savunur. Diğer görüş, kanunun açıkça emredici hükümlere ve kamu düzenine aykırılığı da denetim konusu yaptığını belirtir. Hangi görüş benimsenirse benimsensin, çözümü yargılamayı gerektiren konularda kesin tescil yapılmamalı; geçici tescil (TTK m. 32/4) ya da ret yoluna gidilmelidir.

  ### Görünüşe güven: tescil ve ilan birlikte yanlışsa?

  TTK m. 37 yalnız tescil kaydı ile ilan edilen durum arasındaki aykırılığı düzenler. Hem tescil hem ilan gerçeğe aykırıysa maddenin uygulanıp uygulanmayacağı ve ilgili tacirin yanlış kaydın doğmasında kusuru olup olmadığının aranıp aranmayacağı öğretide tartışmalıdır; bu konuyu doğrudan çözen bir içtihadı birleştirme kararı yoktur. Ağırlıklı yaklaşım, hukuki görünüşe sebep olan tacirin sorumluluğuna dayanır; tacirin hiçbir dahli yoksa zarar Devlet ve oda yoluyla (TTK m. 25/2) giderilir. Bu nokta sınavda olay sonucu olarak değil, tartışma olarak anlatılmalıdır.

  ### Olumsuz etki kurucu tescillerde işler mi?

  Bir görüşe göre TTK m. 36/4 yalnız bildirici tescillerde uygulanır: Kurucu tescilde tescil yapılmadıkça hukuki sonuç doğmadığından, üçüncü kişi durumu bilse bile doğmamış bir sonuç ona karşı ileri sürülemez.

  ### Müdür kararına itiraz edebilen "ilgililer"

  TTK m. 34, "ilgililer"e itiraz hakkı tanır. Yargıtay Hukuk Genel Kurulu, ağırlaştırılmış nisaba aykırı alınan yönetim kurulu kararının tescili hâlinde karara muhalif üyelerin ve pay sahiplerinin de bu kapsamda sayılabileceğini kabul etmiştir. Bu yaklaşım, kavramı yalnız tescil isteyen kişiyle sınırlamaz; ancak içtihadın sınırları somut olaylarla gelişmektedir.
sozluk:
  - terim: Ticaret sicili
    tanim: "Tacirlerle ticari işletmelere ilişkin kanunda öngörülen hususların kaydedildiği, herkese açık resmî kütük."
  - terim: Tescil
    tanim: "Bir hususun ticaret siciline kaydedilmesi."
  - terim: İlan
    tanim: "Tescil edilen hususların Türkiye Ticaret Sicili Gazetesi'nde yayımlanması (TTK m. 35)."
  - terim: MERSİS
    tanim: "Sicil kayıtlarının toplandığı, Bakanlık ve TOBB nezdindeki merkezi ortak veri tabanı (TTK m. 24/3)."
  - terim: Geçici tescil
    tanim: "Çözümü mahkeme kararına bağlı ya da müdürün kesin tescilde duraksadığı hususun, 3 ay şartıyla geçici olarak kaydedilmesi (TTK m. 32/4)."
  - terim: Tescile davet
    tanim: "Müdürün, zorunlu tescilin yapılmadığını öğrenince ilgilileri uygun süre içinde tescile çağırması (TTK m. 33/1)."
  - terim: İlgililer
    tanim: "Tescil istemini yapabilen, tescil konusu hususla ilgili kişiler (tacir; tüzel kişide yetkili organları). İstemi onlar ya da temsilcileri veya hukuki halefleri yapar (TTK m. 28/1). İtiraz bakımından (TTK m. 34) Yargıtay, yok hükmündeki kararın tescilinde menfaati ihlal edilen yönetim kurulu üyeleri ile pay sahiplerini de ilgili saymıştır."
  - terim: Olumlu etki
    tanim: "Sonuç doğurmaya başlayan kayıtları bilmediğini ileri sürmenin dinlenmemesi (TTK m. 36/3)."
  - terim: Olumsuz etki
    tanim: "Tescili/ilanı zorunlu olup yapılmayan hususun, ancak bilindiği veya bilinmesi gerektiği ispatlanırsa üçüncü kişiye karşı ileri sürülebilmesi (TTK m. 36/4)."
  - terim: Görünüşe güven
    tanim: "Tescil ile ilan çelişirse, gerçek durum bilinmedikçe ilan edilen duruma güvenin korunması (TTK m. 37)."
  - terim: Kurucu tescil
    tanim: "Hukuki sonucun tescille doğduğu tescil; ör. ticaret şirketinin tüzel kişilik kazanması."
  - terim: Bildirici tescil
    tanim: "Hak veya durumun tescilden önce de var olduğu, tescilin yalnız duyurduğu tescil; ör. ticari temsilci yetkisinin tescili (TBK m. 547/2)."
kararlar:
  - id: "1230972100"
    ozet: |
      Bir anonim şirketin 2017'de oy birliğiyle kabul edilip tescil ve ilan edilen iç yönergesi, yönetim kurulu kararlarında en az %80 (4/5) çoğunluk arıyordu. 30.11.2021'de çoğunluk üyeler, yeni bir iç yönergeyi ve iki yönetim kurulu kararını 3/5 çoğunlukla kabul etti; muhalif üyeler tescilden önce sicil müdürlüğüne itiraz dilekçesi vermesine rağmen kararlar tescil ve ilan edildi. Davacılar TTK m. 34 uyarınca tescilin iptalini istedi; bölge adliye mahkemesi davacıların "ilgililer" kapsamında olmadığı gerekçesiyle davayı reddetti, Özel Daire bozdu, mahkeme direndi. Hukuk Genel Kurulu direnme kararını oy birliğiyle bozdu: TTK m. 34 yalnız ret kararlarıyla sınırlı değildir; sicil müdürü TTK m. 32 gereği emredici hükümlere ve esas sözleşmeye (eki niteliğindeki iç yönergeye) uygunluğu araştırmalıdır; ağırlaştırılmış nisaba uyulmadan alınan karar yok hükmünde olup menfaati ihlal edilen yönetim kurulu üyeleri ve pay sahipleri de "ilgililer" kapsamındadır.
  - id: "1051089000"
    ozet: |
      Davacılar, keşideci şirket kaşesi üzerine atılan imza nedeniyle düzenlenmiş iki bononun kendilerini bağlamadığını ileri sürerek menfi tespit davası açtı. İmzayı atan kişi sicilde müdür olarak tescilli değildi; ancak şirketin tescilli müdürü ona vekâletnameyle geniş yetkiler vermişti. İlk derece mahkemesi davayı kabul etti. Bölge adliye mahkemesi, geniş yetkili kişinin TBK m. 547/1 anlamında ticari temsilci olduğunu ve işletme sahibinin ticari temsilcinin fiillerinden sorumluluğunun tescile bağlı olmadığını (TBK m. 547/2) belirterek şirketin sorumluluğunu kabul etti. Yargıtay 11. Hukuk Dairesi bu kararı oy birliğiyle onadı. Karar, ticari temsilcinin sicilde kayıtlı olmamasının işletme sahibinin sorumluluğunu ortadan kaldırmadığını gösterir; bu, tescilin bildirici niteliğinin somut bir örneğidir.
sorular:
  - soru: |
      Türk ticaret sicili sistemine ilişkin aşağıdaki ifadelerden hangisi doğrudur?
    siklar:
      - "Sicili, asliye ticaret mahkemesinin bünyesindeki sicil memurlukları tutar."
      - "Sicili, doğrudan TOBB genel merkezi tutar ve Bakanlık denetim yetkisine sahip değildir."
      - "Sicil, Bakanlığın gözetim ve denetiminde, odalarda faaliyet gösteren ticaret sicili müdürlükleri ve şubeleri tarafından tutulur."
      - "Sicil, yalnızca vergi daireleri tarafından tutulur."
    dogru: 2
    aciklama: |
      TTK m. 24'e göre Bakanlık il merkezindeki ticaret ve sanayi odaları ile ticaret odalarında faaliyet gösterecek şekilde ticaret sicili müdürlükleri kurar ve sicil, Bakanlığın gözetim ve denetiminde bu müdürlükler ve şubeler tarafından tutulur. Sicili mahkeme, vergi dairesi ya da TOBB'un doğrudan tutması kanuna aykırıdır.
  - soru: |
      Ticaret sicilinin tutulmasından doğan zararlardan TTK m. 25/2'ye göre kim sorumludur?
    siklar:
      - "Yalnızca zarara sebep olan sicil memuru"
      - "Yalnızca Devlet"
      - "Yalnızca ilgili oda"
      - "Devlet ve ilgili oda müteselsilen; kusurlu görevliye rücu edilir"
    dogru: 3
    aciklama: |
      TTK m. 25/2'ye göre sicilin tutulmasından doğan bütün zararlardan Devlet ve ilgili oda müteselsilen sorumludur; Devlet ve atamaya yetkili kurum zararın doğmasında kusuru bulunanlara rücu eder. TTK m. 38 ise gerçeğe aykırı beyan veren kişilerin idari para cezasını ve tazminat sorumluluğunu düzenler; Devlet ve oda sorumluluğunun dayanağı değildir.
  - soru: |
      X Ltd. Şti., Ankara sicil müdürlüğünün yetki çevresinde faaliyet göstermektedir. Şirketin müdürü Ayşe İstanbul'da oturmaktadır. Tescili gereken bir karar 1 Eylül'de alınmış, Ayşe tescil istemini 28 Eylül'de yapmıştır. Hukuken durum nedir?
    siklar:
      - "İstem süresindedir; yetki çevresi dışında oturanlar için süre bir aydır (TTK m. 30/3)."
      - "İstem süresi geçmiştir; süre herkes için 15 gündür."
      - "İstem süresi geçmiştir; süre herkes için üç aydır."
      - "Süre hiç işlemez; tescil için süre öngörülmemiştir."
    dogru: 0
    aciklama: |
      TTK m. 30/1'e göre tescili isteme süresi 15 gündür; ancak TTK m. 30/3'e göre müdürlüğün yetki çevresi dışında oturanlar için süre bir aydır. 1 Eylül'den 28 Eylül'e kadar bir ay dolmadığı için istem süresindedir. Üç ay, geçici tescil için ilgililere tanınan süredir (TTK m. 32/4).
  - soru: |
      Bir hususun tescilini istemeye birden çok kişi zorunlu ve yetkili olduğu hâlde bunlardan yalnız biri başvurmuştur. Kanunda aksine hüküm yoksa tescil bakımından sonuç nedir?
    siklar:
      - "Başvurmayan kişiler bakımından istem yapılmamış sayılır ve tescil yapılamaz."
      - "Bunlardan birinin talebi üzerine yapılan tescil, tümü tarafından istenmiş sayılır."
      - "Yalnızca en yüksek paya sahip olanın başvurusu geçerlidir."
      - "Başvuru ancak tüm yetkililerin noter onaylı imzasıyla yapılabilir."
    dogru: 1
    aciklama: |
      TTK m. 28/2'ye göre tescili istemeye birden çok kimse zorunlu ve yetkili olduğu takdirde, kanunda aksine hüküm bulunmadıkça, bunlardan birinin talebi üzerine yapılan tescil tümü tarafından istenmiş sayılır. İmzanın noter onaylı olması yalnız kimlik ispatını gereksiz kılar (TTK m. 29/2); başvurunun geçerliliğinin şartı değildir.
  - soru: |
      Sicil müdürü, çözümü bir mahkeme kararına bağlı olan bir hususu ilgililerin isteğiyle geçici olarak tescil etmiştir. İlgililer 3 ay içinde mahkemeye başvurduklarını veya anlaştıklarını ispat edemezlerse ne olur?
    siklar:
      - "Geçici tescil kendiliğinden kesin tescile dönüşür."
      - "Geçici tescil resen silinir."
      - "Müdür, ilgililere ayrıca bir yıl süre vermek zorundadır."
      - "Geçici tescil, ancak üçüncü kişilerin itirazıyla silinir."
    dogru: 1
    aciklama: |
      TTK m. 32/4'e göre ilgililer üç ay içinde mahkemeye başvurduklarını veya aralarında anlaştıklarını ispat etmezlerse geçici tescil resen silinir. Geçici tescilin kendiliğinden kesinleşmesi ya da silinmesi için ayrıca talep aranması kanuna aykırıdır.
  - soru: |
      Tescili zorunlu bir husus süresinde istenmemiş; sicil müdürü ilgiliyi uygun bir süre vererek tescile davet etmiş, ilgili ne tescil istemiş ne de kaçınma sebebi bildirmiştir. İdari para cezasını kim verir?
    siklar:
      - "Sicil müdürü kendisi"
      - "Asliye ticaret mahkemesi hâkimi doğrudan"
      - "Müdürün teklifi üzerine mahallin en büyük mülki amiri"
      - "Oda yönetim kurulu"
    dogru: 2
    aciklama: |
      TTK m. 33/2'ye göre verilen süre içinde tescil isteminde bulunmayan ve kaçınma sebeplerini de bildirmeyen kişi, sicil müdürünün teklifi üzerine mahallin en büyük mülki amiri tarafından idari para cezasıyla cezalandırılır. Kaçınma sebebi bildirilmişse dosyayı asliye ticaret mahkemesi inceler (TTK m. 33/3).
  - soru: |
      Sicil müdürlüğü, X A.Ş.'nin tescil isteminin bir kısmını reddetmiş ve karar 2 Ekim'de X'e tebliğ edilmiştir. X, bu karara karşı hangi süre ve mercide itiraz edebilir?
    siklar:
      - "15 gün içinde idare mahkemesine"
      - "Tebliğden itibaren 8 gün içinde sicilin bulunduğu yerdeki asliye ticaret mahkemesine"
      - "30 gün içinde Bakanlığa"
      - "3 ay içinde sulh hukuk mahkemesine"
    dogru: 1
    aciklama: |
      TTK m. 34/1'e göre ilgililer, müdürlüğün tescil, değişiklik veya silinme istemleriyle ilgili kararlarına karşı tebliğlerinden itibaren sekiz gün içinde sicilin bulunduğu yerde ticari davalara bakmakla görevli asliye ticaret mahkemesine dilekçeyle itiraz edebilir. Mahkeme dosya üzerinden karar verir. 15 gün tescili isteme, 3 ay geçici tescil süresidir.
  - soru: |
      Ticaret siciline ilişkin aşağıdaki ifadelerden hangisi TTK m. 35'e göre doğrudur?
    siklar:
      - "Sicil yalnızca kayıt sahibi tacirler tarafından incelenebilir."
      - "Sicil içeriğini inceleme izni için hukuki yarar gösterilmesi gerekir ve onaylı suret verilmez."
      - "Herkes sicilin içeriğini ve müdürlükte saklanan tüm senet ve belgeleri inceleyebilir, giderini ödeyerek onaylı suretlerini alabilir."
      - "Tescil edilen hususlar hiçbir koşulda ilan edilmez."
    dogru: 2
    aciklama: |
      TTK m. 35/2'ye göre herkes ticaret sicilinin içeriğini ve müdürlükte saklanan tüm senet ve belgeleri inceleyebileceği gibi giderini ödeyerek bunların onaylı suretlerini de alabilir. Hukuki yarar aranmaz. Tescil edilen hususlar kanun veya yönetmelikte aksi yoksa ilan olunur (TTK m. 35/3).
  - soru: |
      Bir şirketin müdür değişikliği tescil edilmiş ve ilanın tamamı bir Cuma günü Türkiye Ticaret Sicili Gazetesi'nin aynı nüshasında yayımlanmıştır. Sicil kaydı üçüncü kişiler hakkında hangi tarihten itibaren hukuki sonuç doğurur? (Cumartesi ve Pazar iş günü değildir.)
    siklar:
      - "Aynı Cuma günü"
      - "Cumartesi günü"
      - "Takip eden Pazartesi günü"
      - "İlandan 15 gün sonra"
    dogru: 2
    aciklama: |
      TTK m. 36/1'e göre sicil kayıtları, tescilin Türkiye Ticaret Sicili Gazetesi'nde ilan edildiği günü (ilanın tamamı aynı nüshada yayımlanmamışsa son kısmının yayımlandığı günü) izleyen iş gününden itibaren üçüncü kişiler hakkında sonuç doğurur. Cuma'yı izleyen iş günü Pazartesi'dir. Hafta sonu iş günü olmadığından Cumartesi doğru değildir.
  - soru: |
      A.Ş., ticari temsilcisinin yetkisini başka bir ticari temsilciyle birlikte imzaya bağlamış fakat bu sınırlamayı ticaret siciline tescil ettirmemiştir. Ticari temsilci tek başına imzalayarak iyiniyetli Banka ile kredi sözleşmesi yapmıştır. Bankanın sınırlamayı bildiğine veya bilmesi gerektiğine dair bir delil yoktur. Sonuç nedir?
    siklar:
      - "Sınırlama tescil edilmemiş olsa da Banka'ya karşı ileri sürülebilir; A.Ş. bağlı değildir."
      - "Sınırlama tescilsiz olduğundan, Banka bildiği veya bilmesi gerektiği ispat edilmedikçe A.Ş. bu sınırlamayı Banka'ya karşı ileri süremez ve sözleşmeyle bağlı olur."
      - "Sözleşme, sınırlama tescil edilmediği için kesin olarak hükümsüzdür."
      - "Sözleşme ancak Banka'nın sicili kontrol ettiği ispatlanırsa geçerlidir."
    dogru: 1
    aciklama: |
      TTK m. 36/4'e göre tescili zorunlu olduğu hâlde tescil edilmemiş bir husus, ancak üçüncü kişilerin bunu bildikleri veya bilmeleri gerektiği ispat edilirse onlara karşı ileri sürülebilir. Ticari temsil yetkisine ilişkin birlikte imza sınırlaması da tescil edilmedikçe iyiniyetli üçüncü kişilere karşı hüküm doğurmaz (TBK m. 549/2 ve TBK m. 549/3). Bu nedenle A.Ş. sözleşmeyle bağlıdır.
  - soru: |
      Bir limited şirketin sicilde tescilli müdürü Ali iken, Türkiye Ticaret Sicili Gazetesi'nde basım hatasıyla müdürün Veli olduğu ilan edilmiştir. Gerçek durumu bilmeyen iyiniyetli Banka, ilana güvenerek Veli ile kredi sözleşmesi yapmıştır. TTK m. 37'ye göre Banka bakımından sonuç nedir?
    siklar:
      - "Banka, tescil kaydını bilmediğini ileri süremez; yalnız sicil kaydı esas alınır."
      - "Banka'nın ilan edilen duruma güveni, tescil edilmiş gerçek durumu bildiği ispat edilmedikçe korunur."
      - "İlan hükümsüzdür; Banka sicili inceleme külfetini yerine getirmediği için sözleşme geçersizdir."
      - "Banka'nın güveni yalnız ilan düzeltildikten sonra korunur."
    dogru: 1
    aciklama: |
      TTK m. 37'ye göre tescil kaydı ile ilan edilen durum arasında aykırılık bulunması hâlinde, tescil edilmiş olan gerçek durumu bildikleri ispat edilmediği sürece üçüncü kişilerin ilan edilen duruma güvenleri korunur. TTK m. 36/3 sonuç doğurmaya başlayan kayıtlar için bilmemeyi ileri sürmeyi engeller; ancak tescil ile ilan çeliştiğinde özel hüküm olan TTK m. 37 uygulanır.
  - soru: |
      Aşağıdakilerden hangisinde tescil **kurucu** etkiye sahiptir?
    siklar:
      - "Gerçek kişi tacirin işletmesini tescil ettirmesi"
      - "Ticari temsilcilik yetkisinin tescili"
      - "Anonim şirketin ticaret siciline tescille tüzel kişilik kazanması"
      - "İlgili bir olgunun ticaret sicilinden onaylı belge olarak alınması"
    dogru: 2
    aciklama: |
      TTK m. 355/1'e göre anonim şirket ticaret siciline tescil ile tüzel kişilik kazanır; tescil kurucudur. Zaten tacir olan kişinin işletmesini tescil ettirmesi tacir sıfatını doğurmaz; tacir sıfatı işletmenin işletilmesiyle kazanılır (TTK m. 12/1). Ayrıca ticari temsilcinin fiillerinden işletme sahibinin sorumluluğu tescile bağlı değildir (TBK m. 547/2); bu ikisi bildirici örneklerdir.
olaylar:
  - olay: |
      Y Ltd. Şti.'nin müdürü Cemal 6 Ekim'de görevden alınmış; bu husus tescil edilmiş ve ilanın tamamı 10 Ekim Cuma günü Türkiye Ticaret Sicili Gazetesi'nin aynı nüshasında yayımlanmıştır. Cemal, 11 Ekim Cumartesi günü hâlâ müdürmüş gibi iyiniyetli tedarikçi T ile sözleşme yapmıştır. Daha sonra, 14 Ekim Salı günü iyiniyetli tedarikçi U da, azli bilmeden Cemal ile sözleşme yapmış ve "Gazeteyi okumadım, bilmiyordum" demiştir.

      Y Ltd. Şti., müdürlerinin birlikte imzasıyla temsil edileceğini iç düzenlemede kararlaştırmış, ancak bu sınırlamayı tescil ettirmemiştir. Tek başına imza atan diğer müdür Derya, iyiniyetli Banka B ile kredi sözleşmesi imzalamıştır.

      Son olarak, sicilde tescilli şirket sermayesi 100.000 TL iken Gazete ilanında basım hatasıyla 1.000.000 TL yazılmış ve iyiniyetli E, ilana güvenerek şirketle işlem yapmıştır.

      1. Azil kaydı hangi tarihten itibaren üçüncü kişiler hakkında sonuç doğurur? T ve U bakımından durum nedir?
      2. Birlikte imza sınırlaması Banka B'ye karşı ileri sürülebilir mi?
      3. E'nin ilana güveni korunur mu?
      4. Tescil ve ilanın etkilerine ilişkin sistem içindeki üç kavramı adlandırınız.
    olcut:
      - {tespit: "Kaydın ilanı izleyen iş günü olan Pazartesi'den (13 Ekim) itibaren sonuç doğurduğu", puan: 20, madde: "TTK m. 36/1"}
      - {tespit: "11 Ekim Cumartesi tarihli işlemde azlin henüz T'ye karşı sonuç doğurmadığı", puan: 15, madde: "TTK m. 36/1"}
      - {tespit: "U'nun kaydı bilmediği iddiasının dinlenmeyeceği (olumlu etki)", puan: 20, madde: "TTK m. 36/3"}
      - {tespit: "Tescil edilmeyen birlikte imza sınırlamasının, bildiği veya bilmesi gerektiği ispat edilmeyen iyiniyetli B'ye karşı ileri sürülememesi", puan: 20, madde: "TTK m. 36/4"}
      - {tespit: "Tescil ile ilan arasındaki aykırılıkta E'nin ilan edilen duruma güveninin korunması", puan: 20, madde: "TTK m. 37"}
      - {tespit: "Olumlu etki, olumsuz etki ve görünüşe güven ayrımının kurulması", puan: 5, madde: "TTK m. 36/3-4 ve m. 37"}
    cozum: |
      **Nitelendirme:** Olayda ticaret sicilinin üçüncü kişilere etkileri (TTK m. 36), tescil edilmeyen sınırlamanın sonucu ve tescil ile ilan arasındaki aykırılık (TTK m. 37) birlikte sorulmaktadır.

      **Hukuki sorunlar:** (1) Kayıt hangi tarihte üçüncü kişiler hakkında sonuç doğurur ve U bilmediğini ileri sürebilir mi? (2) Tescil edilmeyen sınırlama Banka'ya karşı ileri sürülebilir mi? (3) Tescil ile ilan çelişirse üçüncü kişinin güveni korunur mu?

      **İlgili hükümler:** TTK m. 36/1 başlangıcı, TTK m. 36/3 olumlu etkiyi, TTK m. 36/4 olumsuz etkiyi, TTK m. 37 görünüşe güveni düzenler. Limited şirket müdürlerinin temsil yetkisinin sınırlandırılmasına anonim şirket hükümleri kıyasen uygulanır (TTK m. 629/1); temsil yetkisinin birlikte kullanılmasına ilişkin sınırlama ancak tescil ve ilan edilmişse iyiniyetli üçüncü kişilere karşı geçerlidir (TTK m. 371/3).

      **Değerlendirme:** (1) İlan 10 Ekim Cuma günü tamamlanmış olduğundan kayıt, ilanı izleyen iş günü olan 13 Ekim Pazartesi'den itibaren üçüncü kişiler hakkında sonuç doğurur (TTK m. 36/1). Cumartesi iş günü sayılmaz. 11 Ekim'de T ile yapılan işlem kaydın sonuç doğurmadığı döneme rastladığından, azil T'ye karşı henüz ileri sürülemez. 14 Ekim'de U ile yapılan işlemde ise kayıt sonuç doğurmaya başlamıştır; TTK m. 36/3 uyarınca U'nun kaydı bilmediği iddiası dinlenmez. (2) Birlikte imza sınırlaması tescili zorunlu bir husustur ve tescil edilmemiştir. TTK m. 36/4'e göre ancak üçüncü kişilerin bunu bildikleri veya bilmeleri gerektiği ispat edilirse onlara karşı ileri sürülebilir; olayda Banka B'nin iyiniyeti kabul edildiğinden Y Ltd. sınırlamayı ileri süremez ve kredi sözleşmesiyle bağlı olur (TTK m. 629/1 ile TTK m. 371/3). (3) Tescil kaydı 100.000 TL, ilan 1.000.000 TL olduğundan tescil ile ilan arasında aykırılık vardır. TTK m. 37'ye göre E, tescil edilmiş gerçek durumu bildiği ispat edilmediği sürece ilan edilen duruma güvenebilir. Hem tescilin hem ilanın yanlış olduğu hâller bu olayda söz konusu değildir; o durumun uygulaması öğretide tartışmalıdır.

      **Sonuç:** Kayıt 13 Ekim Pazartesi'den itibaren sonuç doğurur; T'ye karşı azil ileri sürülemez, U bilmediğini ileri süremez. Tescilsiz sınırlama Banka B'ye karşı ileri sürülemez. E'nin ilana güveni korunur. Böylece sicilin üçüncü kişilere etkisi olumlu etki (TTK m. 36/3), olumsuz etki (TTK m. 36/4) ve görünüşe güven (TTK m. 37) olarak ayrılır.
  - olay: |
      Ankara Ticaret Sicili Müdürlüğü'ne kayıtlı Z Ltd. Şti.'nin genel kurulu 1 Eylül'de şirket merkezinin aynı şehirdeki yeni adrese taşınmasına karar vermiştir. Tescil gerektiren bu işlem için müdür Ayşe, İstanbul'da oturduğundan 28 Eylül'de dilekçeyle başvurmuş ve dilekçedeki imza noterce onaylıdır. Aynı dönemde şirketin diğer müdürü Tolga, şirketin esas sözleşme değişikliğiyle ilgili bir hususun tescilini de istemiştir; ancak bu hususun çözümü, ortaklar arasında görülecek bir davanın sonucuna bağlıdır ve sicil müdürü kesin tescilde duraksamıştır.

      Z Ltd. Şti., bir şube açmış ama bu şubenin tescilini süresinde istememiştir. Durumu öğrenen sicil müdürü şirketi 20 gün süre vererek tescile çağırmış; şirket süre içinde ne tescil istemiş ne de bir kaçınma sebebi bildirmiştir.

      Son olarak, sicil müdürü Z Ltd. Şti.'nin başka bir tescil istemini reddetmiş ve ret kararı 2 Ekim'de tebliğ edilmiştir.

      1. Ayşe'nin başvurusu süresinde midir? Dilekçe şekli bakımından eksiklik var mıdır?
      2. Tolga'nın istemi bakımından sicil müdürü nasıl hareket edebilir? İlgililerin ne yapması gerekir?
      3. Şubeye ilişkin tescil yapılmadığında hangi yaptırım uygulanabilir ve cezayı kim verir?
      4. Ret kararına karşı Z Ltd. Şti. hangi sürede ve nereye başvurabilir?
    olcut:
      - {tespit: "Yetki çevresi dışında oturan için süre 1 aydır; 1 Eylül'den 28 Eylül'e kadar süre dolmadığından başvuru süresindedir", puan: 20, madde: "TTK m. 30/3"}
      - {tespit: "İstemin dilekçeyle yapılması ve noter onaylı imza nedeniyle ayrıca kimlik ispatına gerek bulunmaması", puan: 15, madde: "TTK m. 29"}
      - {tespit: "Çözümü mahkeme kararına bağlı veya duraksanan hususun ilgililerin istemiyle geçici tescil edilebilmesi", puan: 15, madde: "TTK m. 32/4"}
      - {tespit: "3 ay içinde mahkemeye başvuru veya anlaşma ispat edilmezse geçici tescilin resen silinmesi", puan: 15, madde: "TTK m. 32/4"}
      - {tespit: "Müdürün teklifi üzerine mahallin en büyük mülki amirinin idari para cezası vermesi", puan: 20, madde: "TTK m. 33/2"}
      - {tespit: "Tebliğden itibaren 8 gün içinde asliye ticaret mahkemesine dilekçeyle itiraz", puan: 15, madde: "TTK m. 34/1"}
    cozum: |
      **Nitelendirme:** Olayda tescil isteminin şekli ve süresi, geçici tescil, tescile davet ile idari para cezası ve müdür kararına itiraz birlikte sorulmaktadır.

      **Hukuki sorunlar:** (1) Başvuru süresinde ve şekil bakımından yeterli midir? (2) Çözümü mahkeme kararına bağlı husus nasıl tescil edilir? (3) Süresinde istenmeyen zorunlu tescilde yaptırım nedir? (4) Ret kararına karşı hangi yol açıktır?

      **İlgili hükümler:** Şekil TTK m. 29'da, süre TTK m. 30'da, inceleme ve geçici tescil TTK m. 32'de, tescile davet ve ceza TTK m. 33'te, itiraz TTK m. 34'te düzenlenmiştir.

      **Değerlendirme:** (1) TTK m. 30/1'e göre tescili isteme süresi 15 gündür; ancak müdürlüğün yetki çevresi dışında oturanlar için süre bir aydır (TTK m. 30/3). Ayşe İstanbul'da oturduğundan süre bir aydır. Süre, işlemin gerçekleştiği 1 Eylül'den başladığından 28 Eylül'deki başvuru süresindedir. İstem dilekçeyle yapılmıştır (TTK m. 29/1); imza noterce onaylı olduğundan ayrıca kimlik ispatı gerekmez (TTK m. 29/2). (2) Tolga'nın talep ettiği husus ortaklar arasındaki bir davanın sonucuna bağlıdır. Çözümü mahkeme kararına bağlı veya müdürün kesin tescilinde duraksadığı hususlar ilgililerin istemi üzerine geçici olarak tescil edilir (TTK m. 32/4). İlgililer üç ay içinde mahkemeye başvurduklarını veya aralarında anlaştıklarını ispat etmezlerse geçici tescil resen silinir. (3) Tescili zorunlu şube kaydı süresinde istenmediğinden müdür, şirketi uygun bir süre vererek tescile çağırmıştır (TTK m. 33/1). Şirket süre içinde tescil istemediği ve kaçınma sebeplerini de bildirmediği için, müdürün teklifi üzerine mahallin en büyük mülki amiri tarafından idari para cezasıyla cezalandırılır (TTK m. 33/2). Cezayı müdür veya mahkeme değil, mülki amir verir. (4) Ret kararı tescil istemiyle ilgili bir müdürlük kararıdır; tebliğden itibaren sekiz gün içinde, sicilin bulunduğu yerdeki asliye ticaret mahkemesine dilekçeyle itiraz edilir (TTK m. 34/1). Mahkeme dosya üzerinden karar verir (TTK m. 34/2).

      **Sonuç:** Ayşe'nin başvurusu süresinde ve şekil bakımından yeterlidir. Tolga'nın istemi geçici tescil edilebilir; 3 ay içinde başvuru veya anlaşma ispatlanmazsa kayıt silinir. Şirkete mahallin en büyük mülki amiri idari para cezası verir. Ret kararına tebliğden itibaren 8 gün içinde asliye ticaret mahkemesinde itiraz edilebilir.
kartlar:
  - on: "Ticaret sicilini kim tutar?"
    arka: "Bakanlığın gözetim ve denetiminde, odalarda faaliyet gösteren ticaret sicili müdürlükleri ve şubeleri (TTK m. 24)."
  - on: "Sicilin tutulmasından doğan zarardan kim sorumludur?"
    arka: "Devlet ve ilgili oda müteselsilen; kusurlu görevliye rücu edilir (TTK m. 25/2)."
  - on: "MERSİS nedir?"
    arka: "Sicil kayıtlarının toplandığı, Bakanlık ve TOBB nezdinde oluşturulan merkezi ortak veri tabanı (TTK m. 24/3)."
  - on: "Tescil istemi kimden gelir, hangi şekilde yapılır?"
    arka: "İlgililer, temsilcileri veya hukuki halefleri tarafından, dilekçeyle ve kimlik ispatıyla; noter onaylı imzada kimlik ispatı gerekmez (TTK m. 28 ve TTK m. 29)."
  - on: "Tescili isteme süresi nedir?"
    arka: "15 gün; müdürlüğün yetki çevresi dışında oturanlar için 1 ay (TTK m. 30)."
  - on: "Sicil müdürü tescilden önce neleri inceler?"
    arka: "Kanuni şartları; tescil edilecek hususlar gerçeği yansıtmalı, yanlış izlenim yaratmamalı, kamu düzenine aykırı olmamalıdır (TTK m. 32)."
  - on: "Geçici tescil ne zaman silinir?"
    arka: "İlgililer 3 ay içinde mahkemeye başvurduklarını veya anlaştıklarını ispat etmezse resen silinir (TTK m. 32/4)."
  - on: "Tescile davete uymayana idari para cezasını kim verir?"
    arka: "Müdürün teklifi üzerine mahallin en büyük mülki amiri (TTK m. 33/2)."
  - on: "Müdür kararına itiraz süresi ve mercii nedir?"
    arka: "Tebliğden itibaren 8 gün; sicilin bulunduğu yerdeki asliye ticaret mahkemesi (TTK m. 34)."
  - on: "Kayıtlar üçüncü kişilere karşı ne zaman sonuç doğurur?"
    arka: "İlanın yapıldığı günü (tamamı aynı nüshada yayımlanmamışsa son kısmın yayımlandığı günü) izleyen iş gününden itibaren (TTK m. 36/1)."
  - on: "Sicilin olumlu ve olumsuz etkisi nedir?"
    arka: "Olumlu: kaydı bilmediğini ileri sürememe (TTK m. 36/3). Olumsuz: tescil/ilan edilmeyen husus ancak bilindiği veya bilinmesi gerektiği ispatlanırsa ileri sürülür (TTK m. 36/4)."
  - on: "Tescil ile ilan çelişirse ne olur?"
    arka: "Tescil edilmiş gerçek durum bilindiği ispat edilmedikçe üçüncü kişilerin ilan edilen duruma güveni korunur (TTK m. 37)."
