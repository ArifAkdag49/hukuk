  - soru: |
      Tacir Kerem, Y A.Ş. ile yaptığı tedarik sözleşmesinde malları geç teslim ederse 500.000 TL ceza ödemeyi kabul etmiştir. Teslimi geciktiren Kerem, ceza borcuna karşı "ceza aşırıdır" diyerek mahkemeden indirim istemiştir. Hukuken durum nedir?
    siklar:
      - "Hâkim TBK m. 182/3 uyarınca her durumda cezayı indirmek zorundadır."
      - "Kerem tacir borçlu olduğundan aşırı olduğu iddiasıyla sözleşme cezasının indirilmesini mahkemeden isteyemez (TTK m. 22)."
      - "Ceza koşulu tacirler arasında yapılamayacağından sözleşme hükmü geçersizdir."
      - "Kerem, cezayı tek taraflı olarak yarıya indirme hakkına sahiptir."
    dogru: 1
    aciklama: |
      TTK m. 22'ye göre tacir sıfatını haiz borçlu, TBK m. 182/3'te yazılı hâllerde aşırı ceza kararlaştırıldığı iddiasıyla sözleşme cezasının indirilmesini mahkemeden isteyemez. Genel kural olan hâkimin indirim yetkisi (TBK m. 182/3) tacir borçlu bakımından uygulanmaz. Ceza koşulu tacirler arasında da geçerlidir; borçlunun tek taraflı indirme hakkı yoktur.
  - soru: |
      Tekstil A.Ş., Makine Ltd. Şti.'den aldığı dokuma makinesini 3 Mart'ta teslim almış; gövdedeki eziklik teslimde açıkça belli olmasına rağmen satıcıya 8 Mart'ta bildirmiştir. Bu durumda aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Açık ayıp için iki günlük ihbar süresi geçmiştir (TTK m. 23/1-c)."
      - "Açık ayıp için 8 günlük süre içinde bildirim yapıldığından ihbar süresindedir."
      - "Tacirler arasında ayıp için süre aranmaz."
      - "İhbar süresi ayıp ortaya çıkar çıkmaz hemen bildirme esasına bağlıdır."
    dogru: 0
    aciklama: |
      TTK m. 23/1-c'ye göre malın ayıplı olduğu teslim sırasında açıkça belli ise alıcı iki gün içinde durumu satıcıya ihbar etmelidir. Bildirim teslimden beş gün sonra yapıldığı için süre geçmiştir. Sekiz günlük süre, ayıbın açıkça belli olmadığı ve muayene gerektirdiği durumlar içindir; "hemen" kuralı ise olağan gözden geçirmeyle anlaşılamayan ayıplar içindir (TBK m. 223/2).
  - soru: |
      Kumaş A.Ş., tacir Moda Ltd. Şti.'ye 10 Mayıs'ta kumaş teslim etmiştir. Kumaştaki kalite eksikliği teslimde açıkça belli değildir; ancak Moda Ltd. 16 Mayıs'ta yaptığı incelemede bunu fark edip aynı gün satıcıya bildirmiştir. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Bildirim süresindedir; teslimden sonra sekiz gün içinde inceleme ve ihbar yapılmıştır (TTK m. 23/1-c)."
      - "Bildirim süresinde değildir; iki gün içinde bildirmek gerekirdi."
      - "Bildirim süresinde değildir; ayıp ortaya çıkar çıkmaz hemen bildirmek gerekirdi."
      - "Tacirler arasında muayene ayıbı için ihbar yükümlülüğü yoktur."
    dogru: 0
    aciklama: |
      TTK m. 23/1-c'ye göre ayıp teslim sırasında açıkça belli değilse alıcı malı teslim aldıktan sonra sekiz gün içinde incelemek veya incelettirmek ve ayıplıysa bu süre içinde ihbar etmekle yükümlüdür. 10 Mayıs'taki tesliminden 16 Mayıs'a kadar altı gün geçmiştir; ihbar süresindedir. İki günlük süre yalnız teslimde açıkça belli ayıplar içindir.
  - soru: |
      Esnaf olmayan tacir Okan, kendi işletmesinin ofis mobilyasını tacir olmayan Elif'ten satın almıştır. Bu sözleşmenin Okan ve Elif bakımından niteliği hakkında TTK m. 19/2'ye göre aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Sözleşme yalnız Okan için ticari iştir; Elif bakımından adidir."
      - "Sözleşme yalnız Elif için ticari iştir."
      - "Sözleşme, her iki taraf için de ticari iş sayılır."
      - "Sözleşme hiçbir taraf için ticari iş sayılmaz."
    dogru: 2
    aciklama: |
      TTK m. 19/2'ye göre taraflardan yalnız biri için ticari iş niteliğinde olan sözleşmeler, kanunda aksine hüküm bulunmadıkça diğeri için de ticari iş sayılır. Okan'ın tacir olarak işletmesi için yaptığı alım ticari iştir; bu nitelik Elif'e de yansır. Yalnız bir tarafı ticari sayan seçenekler maddenin ikinci fıkrasına aykırıdır.
  - soru: |
      Taşıma işini meslek edinen tacir Ali, ticari işletmesiyle ilgili olarak tacir olmayan Veli için bir yük taşımış ve yol masrafı olarak 3.000 TL ödemiştir. TTK m. 20'ye göre Ali aşağıdakilerden hangisini isteyebilir?
    siklar:
      - "Yalnızca masrafın kendisini; faiz ve ücret isteyemez."
      - "Ücret isteyemez, çünkü Veli tacir değildir."
      - "Uygun bir ücret ve verdiği avans ile yaptığı giderler için ödeme tarihinden itibaren faiz."
      - "Ücret ve masraf için dava tarihinden itibaren faiz, ancak uygun ücret isteyemez."
    dogru: 2
    aciklama: |
      TTK m. 20/1'e göre tacir olan veya olmayan bir kişiye ticari işletmesiyle ilgili iş veya hizmet görmüş olan tacir uygun bir ücret isteyebilir. Ayrıca verdiği avanslar ve yaptığı giderler için ödeme tarihinden itibaren faize hak kazanır. Karşı tarafın tacir olması aranmaz; faiz başlangıcı dava tarihi değil, ödeme tarihidir.
olaylar:
  - olay: |
      Kamile, 15 yaşındaki oğlu Emre'ye babasından kalan tekstil fabrikasını Emre'nin velisi sıfatıyla işletmektedir. Fabrikanın ticari defterleri hiç tutulmamıştır. Kamu görevlisi Nuri, görevi nedeniyle kendisine ticaret yasağı bulunmasına rağmen kendi adına bir restoran işletmektedir. Mehmet, henüz kurulmamış "Yıldız İnşaat A.Ş." adına ortak sıfatıyla hareket ederek iyiniyetli demir tedarikçisi Ece'den 1.000.000 TL'lik demir satın almıştır. "Çocuklara Umut Derneği" ise kamu yararına çalışan bir dernek olup bir kafeterya işletmektedir.

      1. Fabrikada tacir sıfatı kime aittir? Defter tutulmamasına ilişkin ceza hükümleri bakımından Kamile'in durumu nedir?
      2. Nuri tacir midir? Yasağa aykırılığın başka sonuçları var mıdır?
      3. Mehmet'in Ece'ye karşı durumu nedir?
      4. Dernek, kafeterya işletmesi nedeniyle tacir midir?
    olcut:
      - {tespit: "Tacir sıfatının küçük Emre'ye ait olduğu, veli Kamile'in tacir sayılmadığı", puan: 20, madde: "TTK m. 13"}
      - {tespit: "Kamile'in ceza hükümlerinin uygulanması yönünden tacir gibi sorumlu olduğu", puan: 15, madde: "TTK m. 13"}
      - {tespit: "Nuri'nin yasağa rağmen işletme işletmesi nedeniyle tacir sayıldığı", puan: 20, madde: "TTK m. 14/1"}
      - {tespit: "Nuri'nin hukuki, cezai ve disiplin sorumluluğunun saklı olduğu", puan: 10, madde: "TTK m. 14/2"}
      - {tespit: "Mehmet'in iyiniyetli Ece'ye karşı tacir gibi sorumlu olduğu", puan: 20, madde: "TTK m. 12/3"}
      - {tespit: "Kamu yararına çalışan derneğin işletme işletse de kendisinin tacir sayılmadığı", puan: 15, madde: "TTK m. 16/2"}
    cozum: |
      **Nitelendirme:** Olayda gerçek kişilere ve tüzel kişi bir derneğe ilişkin tacir sıfatı sorunları vardır: küçüğe ait işletme (Emre ve Kamile), yasağa aykırı işletme (Nuri), var sayılmayan şirket adına işlem (Mehmet) ve kamu yararına çalışan dernek.

      **Hukuki sorunlar:** (1) Küçüğe ait işletmede tacir kimdir? (2) Yasağa aykırı işletme tacir sıfatını engeller mi? (3) Hukuken var olmayan şirket adına hareket eden kişi nasıl sorumlu olur? (4) Kamu yararına çalışan dernek tacir midir?

      **İlgili hükümler:** TTK m. 12/1 tacirliğin temel kuralını verir. TTK m. 13 küçük ve kısıtlılara ait işletmeyi yasal temsilcinin işletmesini düzenler. TTK m. 14 yasağa aykırı işletmeyi, TTK m. 12/3 var sayılmayan şirket adına işlemleri, TTK m. 16/2 de kamu yararına çalışan dernekleri düzenler.

      **Değerlendirme:** (1) TTK m. 13'e göre küçüğe ait işletmeyi onun adına işleten yasal temsilci tacir sayılmaz; tacir sıfatı temsil edilene, yani Emre'ye aittir. Yine de yasal temsilci olan Kamile, ceza hükümlerinin uygulanması yönünden tacir gibi sorumlu olur; defter tutulmaması gibi ceza hükmü doğuran fiillerde Kamile sorumlu tutulur. İflas gibi tacirlik sonuçları ise Emre bakımından doğar. (2) TTK m. 14/1'e göre görevi dolayısıyla kanundan doğan bir yasağa aykırı biçimde ticari işletme işleten kişi de tacir sayılır. Nuri restoranı kendi adına işlettiği için tacirdir. Aynı maddenin ikinci fıkrası hukuki, cezai ve disiplin sorumluluğunu saklı tutar; Nuri hakkında disiplin soruşturması yapılabilir. (3) TTK m. 12/3'e göre hukuken var sayılmayan bir şirket adına ortak sıfatıyla işlem yapan kişi iyiniyetli üçüncü kişilere karşı tacir gibi sorumlu olur. Mehmet gerçekte tacir olmasa da iyiniyetli Ece'ye karşı tacir gibi sorumludur. (4) TTK m. 16/1'e göre amacına varmak için ticari işletme işleten dernekler tacirdir; ancak TTK m. 16/2 kamu yararına çalışan dernekleri bunun dışında tutar. Dernek kafeterya işletse de kendisi tacir sayılmaz.

      **Sonuç:** Tacir Emre'dir; Kamile ceza hükümleri yönünden tacir gibi sorumludur. Nuri tacir sayılır ve disiplin sorumluluğu saklıdır. Mehmet Ece'ye karşı tacir gibi sorumludur. Dernek tacir sayılmaz.
  - olay: |
      Gıda A.Ş. ile Marketçilik Ltd. Şti. tacirdir. Gıda A.Ş., 2 Haziran'da 100 koli salçayı Marketçilik'e teslim etmiş, 800.000 TL'lik faturayı da Marketçilik aynı gün teslim almıştır. Sözleşmede, Marketçilik fatura bedelini vadesinde ödemezse 200.000 TL sözleşme cezası ödeyeceği kararlaştırılmıştır. Teslimde bazı kolilerin ambalajının yırtık olduğu açıkça görülmüş; Marketçilik bunu 8 Haziran'da Gıda A.Ş.'ye bildirmiştir. Marketçilik, faturaya 15 Haziran'da "birim fiyatlar yüksek" diye itiraz etmiş ve vadeyi kaçırınca dava açılmıştır. Marketçilik davada 200.000 TL cezanın fahiş olduğunu ileri sürerek indirim istemiştir. Gıda A.Ş. ise Marketçilik'i temerrüde düşürmek için daha önce adi mektupla ihtar göndermiştir.

      1. Faturaya yapılan itirazın sonucu nedir?
      2. Marketçilik cezanın indirilmesini isteyebilir mi?
      3. Ambalaj ayıbına ilişkin ihbar süresinde yapılmış mıdır?
      4. Gıda A.Ş.'nin temerrüt ihtarı için TTK m. 18/3 hangi vasıtaları öngörür?
    olcut:
      - {tespit: "Faturanın alındığı tarihten itibaren 8 gün içinde itiraz edilmediği, içeriğin kabul edilmiş sayıldığı", puan: 25, madde: "TTK m. 21/2"}
      - {tespit: "Tacir borçlunun aşırı olduğu iddiasıyla sözleşme cezasının indirilmesini isteyememesi", puan: 25, madde: "TTK m. 22"}
      - {tespit: "Genel kural olan hâkimin indirim yetkisinin tacir borçluda uygulanmaması", puan: 10, madde: "TBK m. 182/3"}
      - {tespit: "Teslimde açıkça belli ayıp için 2 günlük sürenin geçmiş olması", puan: 25, madde: "TTK m. 23/1-c"}
      - {tespit: "Tacirler arası temerrüt ihtarının noter, taahhütlü mektup, telgraf veya güvenli elektronik imzalı KEP ile yapılması", puan: 15, madde: "TTK m. 18/3"}
    cozum: |
      **Nitelendirme:** Taraflar tacir olduğundan tacirler arası ticari satım ilişkisi vardır. Sorunlar fatura itirazı, sözleşme cezası, ayıp ihbarı ve temerrüt ihtarının şeklidir.

      **Hukuki sorunlar:** (1) Faturaya geç itiraz sonuç doğurur mu? (2) Tacir borçlu cezanın indirimini isteyebilir mi? (3) Açık ayıp süresinde bildirilmiş midir? (4) Tacirler arası ihtar hangi vasıtalarla yapılır?

      **İlgili hükümler:** Faturaya itiraz TTK m. 21/2'de, ceza indirimi TTK m. 22 ile TBK m. 182/3'te, ticari satışta ayıp ihbarı TTK m. 23/1-c'de, ihtar şekli TTK m. 18/3'te düzenlenmiştir.

      **Değerlendirme:** (1) Fatura alan kişi, aldığı tarihten itibaren sekiz gün içinde içeriğe itiraz etmezse içeriği kabul etmiş sayılır (TTK m. 21/2). Marketçilik faturayı 2 Haziran'da almış, 15 Haziran'da itiraz etmiştir. Süre geçmiştir; birim fiyat ve bedel gibi olağan içerik kabul edilmiş sayılır. (2) Genel hukukta hâkim aşırı gördüğü ceza koşulunu kendiliğinden indirir (TBK m. 182/3). TTK m. 22 ise tacir sıfatını haiz borçlunun bu hâllerde aşırı ceza kararlaştırıldığı iddiasıyla indirim istemesini engeller. Marketçilik tacir ve borçlu olduğu için aşırılık iddiasıyla indirim isteyemez. Olayda borçlunun ekonomik yıkımına ilişkin bir bilgi bulunmamaktadır; bu istisna doktrinde ele alındığı için çözümün sonucunu değiştirmez. (3) TTK m. 23/1-c'ye göre ayıp teslim sırasında açıkça belli ise alıcı iki gün içinde ihbar etmelidir. Ambalaj yırtığı teslimde görülmüş, ihbar ise teslimden altı gün sonra yapılmıştır. İki günlük süre geçmiştir. Süresinde bildirilmeyen ayıpla satılan kabul edilmiş sayılır (TBK m. 223/2). Olayda satıcının ağır kusurunu ya da satıcının bilmesi gereken bir ayıbı gösteren bir olgu bulunmadığından TBK m. 225 istisnası uygulanmaz. (4) TTK m. 18/3'e göre tacirler arasında temerrüde düşürmeye ilişkin ihtar noter aracılığıyla, taahhütlü mektupla, telgrafla veya güvenli elektronik imzalı KEP ile yapılır. Adi mektup bu vasıtalar arasında değildir. Şekle aykırı ihtarın hukuki sonucu (geçerlilik mi, ispat şartı mı) tartışmalıdır (bkz. doktrin); her hâlükârda Gıda A.Ş.'nin ihtarı kanundaki vasıtalardan biriyle yapması gerekir.

      **Sonuç:** Fatura içeriği kabul edilmiş sayılır. Marketçilik cezanın indirimini isteyemez. Ambalaj ayıbının ihbarı 2 günlük süreyi aşmıştır. Temerrüt ihtarı TTK m. 18/3'teki dört vasıtadan biriyle yapılmalıdır.
kartlar:
  - on: "Gerçek kişide tacir sıfatının üç unsuru nedir?"
    arka: "Ticari işletme bulunması, işletmenin faaliyette olması ve işletmenin kısmen de olsa kendi adına işletilmesi (TTK m. 12/1)."
  - on: "İşletmesini ilan eden ama henüz başlamamış kişi tacir midir?"
    arka: "Evet. Halka bildiren veya tescil ettirip ilan eden kimse fiilen başlamasa da tacir sayılır (TTK m. 12/2)."
  - on: "TTK m. 12/3'te kişi tacir midir?"
    arka: "Hayır, tacir değil; hukuken var sayılmayan şirket adına ortak sıfatıyla işlem yapan kişi iyiniyetli üçüncü kişilere karşı tacir gibi sorumlu olur (TTK m. 12/3)."
  - on: "Küçüğe ait işletmeyi velisi işletirse tacir kimdir?"
    arka: "Küçük tacirdir; veli tacir sayılmaz ama ceza hükümleri yönünden tacir gibi sorumlu olur (TTK m. 13)."
  - on: "Ticaret yasağına rağmen işletme işleten memur tacir midir?"
    arka: "Evet, tacir sayılır; hukuki, cezai ve disiplin sorumluluğu saklıdır (TTK m. 14)."
  - on: "Hangi kamu veya hayır kuruluşları ticari işletme işletse de tacir sayılmaz?"
    arka: "Devlet, il özel idaresi, belediye, köy ve diğer kamu tüzel kişileri; kamu yararına çalışan dernekler; gelirinin yarısından fazlasını kamu görevi niteliğindeki işlere harcayan vakıflar (TTK m. 16/2)."
  - on: "Tacir hangi borçlar için iflasa tabidir?"
    arka: "Her türlü borcu için; adi borçlar dahil (TTK m. 18/1)."
  - on: "Tacirler arası temerrüt, fesih ve dönme ihtarı hangi vasıtalarla yapılır?"
    arka: "Noter, taahhütlü mektup, telgraf veya güvenli elektronik imzalı KEP (TTK m. 18/3)."
  - on: "Tacirin basiretli iş adamı yükümlülüğü hangi faaliyetleri kapsar?"
    arka: "Ticaretine ait bütün faaliyetlerini; her tacir basiretli bir iş adamı gibi hareket etmelidir (TTK m. 18/2)."
  - on: "Fatura ve teyit mektubuna itiraz süresi nedir?"
    arka: "Alındığı tarihten itibaren 8 gün; itiraz edilmezse içerik kabul edilmiş sayılır (TTK m. 21/2-3)."
  - on: "Tacir borçlu hangi hâllerde indirim isteyemez?"
    arka: "TBK m. 121/2, TBK m. 182/3 ve TBK m. 525'teki hâllerde aşırı ücret veya ceza iddiasıyla indirimi mahkemeden isteyemez (TTK m. 22)."
  - on: "Ticari satışta ayıp ihbar süreleri nelerdir?"
    arka: "Teslimde açıkça belli ayıp 2 gün; açıkça belli olmayan ayıp için teslimden sonra 8 gün içinde inceleme ve ihbar; diğerlerinde TBK m. 223/2 (TTK m. 23/1-c)."
