  - soru: |
      X A.Ş., Y Ltd. Şti.'ye 4 Mart'ta teslim ettiği mallar için kestiği faturayı Y'ye 5 Mart'ta ulaştırmıştır. Y, faturayı 20 Mart'ta "fiyatlar yüksek" diyerek protesto etmiştir. Aşağıdakilerden hangisi doğrudur?
