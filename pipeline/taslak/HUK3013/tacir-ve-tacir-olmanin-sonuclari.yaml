sorular:
  - soru: |
      Aşağıdakilerden hangisi, **fiilen işletmeye başlamamış olsa bile** TTK m. 12/2'ye göre tacir sayılır?
    siklar:
      - "Mağaza açacağını yakınlarına söyleyen ama hiçbir ilan yapmayan Selin"
      - "İşletmesini ticaret siciline tescil ettirip ilan eden Ayşe"
      - "Başkasına ait işletmeyi aylık maaşla yöneten Zeynep"
      - "Aynı işletmeye yalnız mal tedarik eden ve işletmeyi kendi adına işletmeyen Kemal"
    dogru: 1
    aciklama: |
      TTK m. 12/2'ye göre işletmesini ticaret siciline tescil ettirerek durumu ilan eden kimse fiilen işletmeye başlamamış olsa bile tacir sayılır. Yalnız niyet beyanı yeterli değildir; kanun ilan araçlarıyla halka bildirmeyi veya tescil ve ilanı arar. Ücretli yönetici işletmeyi kendi adına işletmediği için tacir olmaz (TTK m. 12/1).
  - soru: |
      Hukuken var sayılmayan bir şirket adına ortak sıfatıyla hareket eden Bora, iyiniyetli tedarikçi Ece'den mal satın almıştır. Bora'nın durumu hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Bora, iyiniyetli üçüncü kişiye karşı tacir gibi sorumlu olur."
      - "Bora, hiçbir sorumluluk taşımaz çünkü şirket hukuken yoktur."
      - "Bora, tacirin bütün haklarından ve külfetlerinden aynen yararlanır."
      - "Bora, yalnızca kendisi de bu iddiada bulunursa sorumlu olur."
    dogru: 0
    aciklama: |
      TTK m. 12/3'e göre hukuken var sayılmayan şirket adına ortak sıfatıyla işlem yapan kimse iyiniyetli üçüncü kişilere karşı tacir gibi sorumlu olur. Bu, görünüşe güvenen kişiyi korur. Kişi gerçekte tacir sayılmaz; bu nedenle tacirin haklarından yararlanamaz.
  - soru: |
      Dokuz yaşındaki Deniz'e miras kalan tekstil atölyesini velisi Hasan Deniz adına işletmektedir. Atölyenin ticari defterlerini tutmayan Hasan hakkında ceza hükümleri uygulanacaktır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Tacir Hasan'dır; Deniz tacir sayılmaz."
      - "Ne Hasan ne Deniz tacirdir; atölye tacirsiz kalır."
      - "Tacir Deniz'dir; Hasan ceza hükümlerinin uygulanması yönünden tacir gibi sorumlu olur."
      - "Hasan hem tacir sayılır hem de Deniz tacir sayılır."
    dogru: 2
    aciklama: |
      TTK m. 13'e göre küçüğe ait işletmeyi onun adına işleten yasal temsilci tacir sayılmaz; tacir sıfatı temsil edilene aittir. Yasal temsilci yalnız ceza hükümlerinin uygulanması yönünden tacir gibi sorumlu olur. Bu yüzden defter tutmama gibi ceza hükümlerinde Hasan sorumlu tutulabilir.
  - soru: |
      Kamu görevlisi Murat, görevi nedeniyle ticaret yapma yasağı bulunmasına rağmen kendi adına bir lokanta işletmektedir. Murat'ın durumu bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Yasağa aykırı davrandığı için tacir sayılmaz."
      - "Yalnızca tacir gibi sorumlu olur; tacir sıfatı kazanmaz."
      - "Tacir sayılır; disiplin ve diğer sorumlulukları saklıdır."
      - "Tacir sayılır, ancak disiplin sorumluluğu doğmaz."
