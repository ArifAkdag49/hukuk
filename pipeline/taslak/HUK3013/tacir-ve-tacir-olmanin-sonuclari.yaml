      TTK m. 14/1'e göre meslek ve görevi dolayısıyla kanundan doğan bir yasağa aykırı biçimde ticari işletme işleten kişi de tacir sayılır. Aynı maddenin ikinci fıkrası hukuki, cezai ve disipline ilişkin sorumluluğu saklı tutar. Kişi, yasağa aykırı davranışına dayanarak tacir sayılmaktan kurtulamaz.
