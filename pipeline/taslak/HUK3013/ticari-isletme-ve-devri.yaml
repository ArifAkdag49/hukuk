doktrin: |
  ### Tescil ve ilanın hukuki niteliği
  TTK m. 11/3 devir sözleşmesinin yazılı yapılmasını, ticaret siciline tescil ve ilan edilmesini birlikte söyler. Yazılı şeklin geçerlilik şartı olduğu Yargıtay uygulamasında kabul edilmektedir. Tartışma, tescil ve ilanın da devrin geçerliliğine bağlı kurucu bir işlem mi, yoksa yalnız üçüncü kişilere duyuran bildirici bir işlem mi olduğudur.

  Bir yaklaşım, TTK m. 11/3'ün son cümlesinin lafzına ve sicil mevzuatındaki düzenlemeye dayanarak tescilin kurucu olduğunu savunur. Diğer yaklaşım ise TBK m. 202'de bildirimle ilanın seçimlik olarak öngörülmesini, ilanın asıl işlevinin alacaklıları haberdar edip devralanın sorumluluğunu ve devredenin iki yıllık süresini başlatmak olduğunu vurgular; bu nedenle tescil ve ilanın bildirici sayılması gerektiğini ileri sürer. Konu sınavda sorulursa iki görüş ve gerekçeleri açıkça yazılmalı, olay çözümünde tek cevap bu tartışmaya bağlanmamalıdır.

  ### Taşınmazların devri
  Bütünlük ilkesi, işletmeye dahil taşınmazların da ayrı bir tasarruf işlemi olmaksızın geçip geçmediği sorusunu doğurur. Bir görüş, TTK m. 11/3'ün tasarruf işlemlerinin ayrı ayrı yapılmasına gerek olmadığını söylediğini ve taşınmazın da sözleşmeyle geçeceğini, tapuda yalnız açıklayıcı bir tescil yapılacağını savunur. Karşı görüş ise taşınmaz mülkiyetinin geçişi için TMK'daki tescil kuralından açıkça ayrılan bir hüküm bulunmadığını, bu yüzden tapu tescilinin gerektiğini ileri sürer. Konu tartışmalıdır; bu nedenle sınav olaylarında taşınmaz devri sonucu kesin cevap olarak kurulmamalıdır.
sozluk:
  - terim: Ticari işletme
    tanim: "Esnaf sınırını aşan düzeyde gelir sağlamayı hedef tutan faaliyetlerin devamlı ve bağımsız yürütüldüğü işletme (TTK m. 11/1)."
  - terim: Esnaf
    tanim: "Ekonomik faaliyeti sermayesinden fazla bedenî çalışmasına dayanan, geliri sınırı aşmayan ve sanat veya ticaretle uğraşan kişi (TTK m. 15/1)."
  - terim: Şube
    tanim: "Merkeze bağlı, dış ilişkilerde bağımsız davranabilen, merkezle aynı kişiye ait faaliyet birimi; kendi yerinde sicile tescil edilir (TTK m. 40/3)."
  - terim: Bütünlük ilkesi
    tanim: "Ticari işletmenin unsurları için ayrı ayrı tasarruf işlemi yapılmadan bir bütün hâlinde devredilebilmesi (TTK m. 11/3)."
  - terim: İşletme değeri (peştamallık)
    tanim: "İşletmenin müşteri çevresi, itibarı ve örgütlenmesinden doğan ekonomik değeri; aksi öngörülmedikçe devre dahildir (TTK m. 11/3)."
  - terim: Duran malvarlığı
    tanim: "İşletmede sürekli kullanılmak üzere bulundurulan makine, bina, demirbaş gibi varlıklar; devir kapsamına dahildir (TTK m. 11/3)."
  - terim: Aktif ve pasifleriyle devralma
    tanim: "İşletmenin hem malvarlığı hem borçlarıyla birlikte devralınması; TBK m. 202 sorumluluğunun şartı."
  - terim: Müteselsil sorumluluk süresi
    tanim: "Devredenin devralanla birlikte iki yıl sorumlu kalması; muaccel borçta bildirme veya duyurudan, sonradan muaccel olacak borçta muacceliyetten başlar (TBK m. 202/2)."
  - terim: Dış üstlenme
    tanim: "Borcun alacaklıya karşı üstlenilmesi; TBK m. 202/3'e göre işletme devrinde borçların üstlenilmesinin sonuçları buna özdeştir."
  - terim: Ticaret unvanı
    tanim: "Tacirin işletmesini işlettiği ad; işletmeden ayrı devredilemez, işletmenin devriyle birlikte devredilir (TTK m. 49)."
kararlar:
  - id: "1218930400"
    ozet: |
      Özel hastane işleten davacı şirketin pay sahibi, icra müdürlüğünde yapılan taşınır açık artırma ihalesinden borçlu bir tıp merkezine ait ruhsatname ile faaliyet izin belgesini satın almış ve bunu hastanenin kapasite artışında kullanmıştır. Davalı Kurum bu işlemi TBK m. 202 anlamında işletme devri sayarak davacının sağlık hizmeti sözleşmesini feshedeceğini bildirmiş ve eski tıp merkezinin borçları için hak edişlerinden 57.604,16 TL kesinti yapmıştır. İlk derece mahkemesi, TBK m. 202 anlamında devir için malvarlığı veya işletmenin aktif ve pasifleriyle birlikte devredilmesi gerektiğini, yalnız ruhsat ve faaliyet izin belgesinin cebrî icradan alınmasının bunu oluşturmadığını belirterek Kurum işleminin iptaline ve kesintinin iadesine karar vermiş, istinaf başvurusunu esastan reddetmiştir. Yargıtay 3. Hukuk Dairesi, Kurumun muvazaa iddiası bulunmadığını ve ortada işletme devri olmadığını belirterek kararı oy birliğiyle onamıştır. Karar, TBK m. 202 sorumluluğunun tekil unsurların (ruhsat gibi) satın alınmasıyla doğmayacağını gösterir.
  - id: "933061900"
    ozet: |
      Alacaklı, borçlu şirketin 1.285.000 TL tutarındaki senet borcunu ödemediğini, şirketin şubelerine ait malzeme, araç, demirbaş, işçi ve müşteri portföyünü başka bir kargo şirketine devrettiğini, devir sözleşmesi taslağının 01.10.2016'da e-postayla gönderildiğini ileri sürerek TBK m. 202 uyarınca devralan şirketin de sorumlu tutulması için itirazın iptali davası açmıştır. Denizli Asliye Ticaret Mahkemesi ile istinaf mahkemesi devralan kargo şirketini de sorumlu tutmuştur. Yargıtay 11. Hukuk Dairesi, TTK m. 11/3 ve TBK m. 202'yi birlikte değerlendirerek ticari işletme devrinin geçerliliğinin yazılı yapılmasına bağlı olduğunu, yasadaki yazılı şeklin geçerlilik şartı olduğunu belirtmiştir. Davacı TTK m. 11 ve TBK m. 202'ye uygun bir işletme devir sözleşmesi sunmadığından devralan şirketin borçtan sorumlu tutulmasını doğru bulmayarak kararı oy birliğiyle bozmuştur. Karar, fiilî devir emareleri bulunsa bile yazılı sözleşme olmadan TBK m. 202 sorumluluğunun doğmayacağını gösterir.
sorular:
  - soru: |
      Aşağıdakilerden hangisi TTK m. 11/1'e göre ticari işletmenin kurucu unsurlarından biri değildir?
    siklar:
      - "Faaliyetin devamlı yürütülmesi"
      - "Faaliyetin bağımsız yürütülmesi"
      - "Esnaf işletmesi için öngörülen sınırı aşan düzeyde gelir hedefi"
      - "Faaliyetten fiilen kâr elde edilmiş olması"
    dogru: 3
    aciklama: |
      Kanun, gelir sağlamayı hedef tutan faaliyetin devamlı ve bağımsız yürütülmesini ve esnaf sınırını aşan düzeyde bir gelir hedefini arar (TTK m. 11/1). Önemli olan hedeftir; işletmenin fiilen kâr etmiş olması şart değildir.
  - soru: |
      Ticari işletme ile esnaf işletmesi arasındaki sınır TTK m. 11/2'ye göre nasıl belirlenir?
    siklar:
      - "Kanun metninde yazılı sabit bir tutarla"
      - "Cumhurbaşkanı kararıyla"
      - "Her olayda hâkimin takdiriyle"
      - "Ticaret sicili müdürünün kararıyla"
    dogru: 1
    aciklama: |
      TTK m. 11/2: ticari işletme ile esnaf işletmesi arasındaki sınır Cumhurbaşkanı kararıyla belirlenir (700 sayılı KHK ile "Bakanlar Kurulu" ibaresi bu hâle getirilmiştir). Kanun metninde sabit bir tutar yoktur.
  - soru: |
      TTK m. 15'e göre esnafa da uygulanan, tacirlere özgü hükümler aşağıdakilerden hangisinde doğru sıralanmıştır?
    siklar:
      - "Ücret ve faiz isteme (TTK m. 20), işletme adı (TTK m. 53), hapis hakkında bağlantı karinesi (TMK m. 950/2)"
      - "Ticari defter tutma, iflasa tabi olma, ticaret unvanı seçme"
      - "Basiretli iş adamı gibi davranma, ihtarların noter yoluyla yapılması, ticari satışta ayıp bildirimi"
      - "Ticaret siciline tescil, ticaret unvanı seçme, iflasa tabi olma"
    dogru: 0
    aciklama: |
      TTK m. 15/1 son cümle, tacirlere özgü 20 ve 53. maddeler ile TMK m. 950/2 hükmünün esnafa da uygulanacağını söyler. Defter, unvan, sicil ve iflas gibi yükümler TTK m. 18/1'e göre tacire aittir; esnaf tacir olmadığından bunlara tabi değildir.
  - soru: |
      Esnaf Hasan, tacir olmayan Veli'nin evine, ticari işletmesiyle ilgili bir hizmet vermiştir; ücret sözleşmede belirlenmemiştir. Hasan hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Esnaf olduğu için ücret isteyemez"
      - "TTK m. 15 uyarınca tacirlere özgü TTK m. 20 esnafa da uygulandığından uygun bir ücret isteyebilir"
      - "Ücret isteyebilmesi için ticaret siciline kayıtlı olması gerekir"
      - "Veli tacir olmadığı için ücret ancak sözleşmede belirlenmişse istenir"
    dogru: 1
    aciklama: |
      TTK m. 15/1'e göre tacirlere özgü TTK m. 20 esnafa da uygulanır. TTK m. 20'ye göre ticari işletmesiyle ilgili bir iş veya hizmet görmüş olan kişi, hizmetin görüldüğü kimse tacir olsun olmasın, uygun bir ücret isteyebilir. Sicil kaydı koşul değildir.
  - soru: |
      Ali, mobilya fabrikasını Ayşe'ye tek bir yazılı sözleşmeyle devretmiştir. Fabrikada onlarca makine vardır. Makinelerin devri bakımından aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Her makine için ayrı ayrı yazılı devir sözleşmesi gerekir"
      - "Her makinenin ayrı ayrı tescili gerekir"
      - "TTK m. 11/3 uyarınca unsurlar için zorunlu tasarruf işlemlerinin ayrı ayrı yapılmasına gerek yoktur"
      - "Makineler ancak sonradan ayrıca bir sözleşmeyle devredilebilir"
    dogru: 2
    aciklama: |
      Bütünlük ilkesine göre ticari işletme, içerdiği malvarlığı unsurlarının devri için zorunlu tasarruf işlemlerinin ayrı ayrı yapılmasına gerek olmaksızın bir bütün hâlinde devredilebilir (TTK m. 11/3). Burada makineler gibi taşınır unsurlar söz konusu olduğundan ayrı ayrı işlem aranmaz.
  - soru: |
      İşletme devir sözleşmesinde kapsam konusunda hiçbir hüküm yoksa TTK m. 11/3'e göre aşağıdakilerden hangisinin devre dahil olduğu kabul edilir?
    siklar:
      - "Devredenin eşine ait malvarlığı"
      - "Devredenin işletmeyle ilgisiz kişisel eşyaları"
      - "Kiracılık hakkı ve ticaret unvanı"
      - "Devredenin işletme dışındaki ayrı bir ticari işletmesi"
    dogru: 2
    aciklama: |
      Aksi öngörülmemişse devir sözleşmesinin duran malvarlığını, işletme değerini, kiracılık hakkını, ticaret unvanı ile diğer fikrî mülkiyet haklarını ve sürekli olarak işletmeye özgülenen malvarlığı unsurlarını içerdiği kabul olunur (TTK m. 11/3). İşletme ile ilgisi olmayan malvarlığı bu karinenin dışındadır.
  - soru: |
      Alacaklı Cemal, borçlu Y Ltd. Şti.'nin işyerini, müşterilerini ve aracını Z A.Ş.'nin e-postayla gönderilen imzasız bir sözleşme taslağı ve fiilî devirle kullanmaya başladığını ileri sürerek TBK m. 202'ye dayanıp Z'den alacağını istemiştir. Yazılı ve imzalı bir işletme devir sözleşmesi yoktur. Yargıtay'ın yaklaşımına göre sonuç ne olur?
    siklar:
      - "Fiilî devir yeterlidir, Z müteselsilen sorumludur"
      - "TTK m. 11/3'teki yazılı şekil geçerlilik şartı olduğundan Z, TBK m. 202'ye göre sorumlu tutulamaz"
      - "Z yalnız ilan tarihinden sonra doğan borçlardan sorumludur"
      - "Z ancak tescil edilmişse sorumludur"
    dogru: 1
    aciklama: |
      Yargıtay, TTK m. 11/3'teki yazılı şekli geçerlilik şartı sayar ve TTK m. 11 ile TBK m. 202'ye uygun yazılı bir işletme devir sözleşmesi sunulamıyorsa devralan olduğu ileri sürülen şirketin TBK m. 202 uyarınca borçtan sorumlu tutulamayacağını kabul eder.
  - soru: |
      TBK m. 202/1'e göre işletmeyi aktif ve pasifleriyle devralanın borçlardan sorumluluğu ne zaman başlar?
    siklar:
      - "Devir sözleşmesinin imzalandığı tarihten"
      - "Devralanın bunu alacaklılara bildirdiği veya ilanla duyurduğu tarihten"
      - "Devredenin iflas ettiği tarihten"
      - "Devir tarihinden iki yıl sonra"
    dogru: 1
    aciklama: |
      Aktif ve pasifleri ile devralan, bunu alacaklılara bildirdiği veya ticari işletmeler için Ticaret Sicili Gazetesinde yayımlanacak ilanla duyurduğu tarihten başlayarak borçlardan sorumlu olur (TBK m. 202/1). İki yıl ise devredenin müteselsil sorumluluk süresidir.
  - soru: |
      Deniz, işletmesini Altın A.Ş.'ye devretmiş; devralan 10.03.2024'te Ticaret Sicili Gazetesinde ilan vermiştir. Bankaya olan kredi borcunun vadesi 15.08.2025'tir. Deniz'in bu borç bakımından TBK m. 202/2'deki iki yıllık müteselsil sorumluluk süresi ne zaman başlar?
    siklar:
      - "10.03.2024'te, ilan tarihinde"
      - "Devir sözleşmesinin yapıldığı tarihte"
      - "15.08.2025'te, borcun muaccel olduğu tarihte"
      - "Hiçbir zaman başlamaz"
    dogru: 2
    aciklama: |
      İki yıllık süre, muaccel borçlar için bildirme veya duyuru tarihinden, daha sonra muaccel olacak borçlar için ise muacceliyet tarihinden işlemeye başlar (TBK m. 202/2). Banka kredisi ilandan sonra muaccel olacağından süre vade tarihinden işler.
  - soru: |
      Devralan Altın A.Ş., devri alacaklılara hiç bildirmemiş ve ilan da etmemiştir. Üç yıl sonra alacaklı, devredene başvurmuştur. Devredenin sorumluluğu bakımından hangisi doğrudur?
    siklar:
      - "Devredenin iki yıllık sorumluluğu devir tarihinden işlediği için sona ermiştir"
      - "Devredenin iki yıllık sorumluluğu sona ermiştir, çünkü üç yıl geçmiştir"
      - "Bildirme veya ilan yapılmadıkça iki yıllık süre işlemeye başlamadığından devreden hâlâ sorumludur"
      - "Devralan bildirmediği için devir geçersizdir ve devreden artık sorumlu değildir"
    dogru: 2
    aciklama: |
      Bildirme veya ilanla duyurma yükümlülüğü devralan tarafından yerine getirilmedikçe TBK m. 202/2'de öngörülen iki yıllık süre işlemeye başlamaz (TBK m. 202/4). Bu yüzden üç yıl geçmiş olsa bile devreden devralanla birlikte sorumlu kalmaya devam eder.
  - soru: |
      Özel hastane işleten X Ltd. Şti.'nin pay sahibi, icra ihalesinden borçlu bir tıp merkezinin yalnız ruhsatını ve faaliyet izin belgesini satın almıştır. Alacaklı kurum bunu işletme devri sayıp tıp merkezinin borçlarını X'ten kesmiştir. Yargıtay'ın yaklaşımına göre kesinti bakımından hangisi doğrudur?
    siklar:
      - "Ruhsat satın alınması TBK m. 202 anlamında işletme devridir, kesinti haklıdır"
      - "Aktif ve pasifleriyle bir bütün olarak işletme devri bulunmadığından TBK m. 202'ye dayanılamaz"
      - "Sözleşmede yazılı şekil aranmadığı için kesinti haklıdır"
      - "Kesinti ancak devrin tescil edilmesi hâlinde haksız olur"
    dogru: 1
    aciklama: |
      TBK m. 202 aktif ve pasifleri ile birlikte devralmayı arar. Yargıtay, cebrî icra yoluyla yalnız ruhsat ve faaliyet izin belgesinin satın alınmasını işletme devri saymamış, devralanın eski borçlardan TBK m. 202 uyarınca sorumlu tutulamayacağına karar vermiştir.
  - soru: |
      Bir ticari işletme, sözleşmede ticaret unvanıyla ilgili hiçbir hüküm bulunmaksızın devredilmiştir. Unvan bakımından hangisi doğrudur?
    siklar:
      - "Unvan, işletmeden ayrı devredilemeyeceği için devredende kalır"
      - "İşletmenin devri aksi açıkça kabul edilmedikçe unvanın da devri sonucunu doğurur"
      - "Unvanın ayrıca bir devir sözleşmesiyle noter huzurunda devri zorunludur"
      - "Unvan, devirden itibaren iki yıl devreden ve devralanda birlikte kalır"
    dogru: 1
    aciklama: |
      TTK m. 49/2: işletmenin devri, aksi açıkça kabul edilmedikçe unvanın da devri sonucunu doğurur; TTK m. 11/3 de ticaret unvanını devir kapsamında sayar. TTK m. 49/1'deki yasak, unvanın işletmeden ayrı olarak tek başına devrine ilişkindir.
olaylar:
  - olay: |
      Deniz Yılmaz (gerçek kişi tacir), mobilya fabrikasını Altın Mobilya A.Ş.'ye yazılı devir sözleşmesiyle devretmiştir. Sözleşmede fabrikadaki makineler, stok ve işçiler yazılıdır; ancak kiracılık hakkı ve ticaret unvanı konusunda hiçbir hüküm yoktur. Altın Mobilya A.Ş., devri 10.03.2024'te Ticaret Sicili Gazetesinde ilan ettirmiştir. İşletmenin tedarikçi Ü Ltd. Şti.'ye 200.000 TL hammadde borcu bulunmaktadır; bu borcun vadesi 01.02.2024'tür. İşletmenin Doğu Bank A.Ş.'ye 500.000 TL kredi borcunun vadesi ise 15.08.2025'tir. Her iki alacaklı da bugüne kadar hiçbir işlem yapmamıştır. Doğu Bank, 20.05.2026'da Deniz'e başvurmuştur.

      1. Devir sözleşmesinin kapsamı ve şekli bakımından değerlendirme yapınız; kiracılık hakkı ve ticaret unvanı devre dahil midir?
      2. Altın Mobilya A.Ş.'nin borçlardan sorumluluğu ne zaman başlar?
      3. Deniz'in Ü Ltd. Şti. ve Doğu Bank bakımından müteselsil sorumluluğu devam etmekte midir?
    olcut:
      - {tespit: "Ticari işletmenin bütün hâlinde devri; unsurlar için ayrı ayrı tasarruf işlemi gerekmez", puan: 15, madde: "TTK m. 11"}
      - {tespit: "Aksi öngörülmediğinden kiracılık hakkı ve ticaret unvanı devre dahildir", puan: 15, madde: "TTK m. 11"}
      - {tespit: "Devir sözleşmesi yazılı yapılmış, ilan yapılmıştır; şekil aranan şekilde yerine getirilmiştir", puan: 10, madde: "TTK m. 11"}
      - {tespit: "Devralanın sorumluluğu bildirme veya ilan tarihinden başlar", puan: 20, madde: "TBK m. 202"}
      - {tespit: "Ü Ltd. Şti.'nin muaccel borcunda iki yıl ilan tarihinden başlar ve dolmuştur", puan: 20, madde: "TBK m. 202"}
      - {tespit: "Banka borcunda iki yıl muacceliyetten başlar; Deniz'in müteselsil sorumluluğu sürmektedir", puan: 20, madde: "TBK m. 202"}
    cozum: |
      **Nitelendirme:** Olay, bir ticari işletmenin yazılı sözleşmeyle bütün hâlinde devri ve devralanın ile devredenin işletme borçlarından sorumluluğuyla ilgilidir. Fabrika; gelir hedefiyle devamlı ve bağımsız yürütülen bir ticari işletmedir (TTK m. 11/1).

      **Hukuki sorunlar:** (1) Devrin kapsamı ve şekli; (2) devralanın sorumluluğunun başlangıcı; (3) devredenin iki yıllık müteselsil sorumluluğunun iki borç bakımından başlangıcı ve sona ermesi.

      **İlgili hükümler:** TTK m. 11/3: işletme, unsurlarının devri için tasarruf işlemleri ayrı ayrı yapılmadan bir bütün hâlinde devredilebilir; aksi öngörülmemişse devre kiracılık hakkı ve ticaret unvanı da dahildir; devir sözleşmesi yazılı yapılır, tescil ve ilan edilir. TBK m. 202/1: aktif ve pasifleriyle devralan, bildirme veya ilan tarihinden başlayarak borçlardan sorumludur. TBK m. 202/2: devreden iki yıl müteselsil sorumlu kalır; süre muaccel borçlarda bildirme veya duyuru tarihinden, sonradan muaccel olacak borçlarda muacceliyet tarihinden başlar.

      **Değerlendirme:** (1) İşletme bütün hâlinde devredilebildiğinden makine ve stok için ayrı ayrı tasarruf işlemi aranmaz. Sözleşme kiracılık hakkı ve ticaret unvanı konusunda sustuğundan, aksi öngörülmemiş olduğu için ikisi de devre dahil kabul edilir; ticaret unvanı bakımından TTK m. 49/2 de aynı sonuca götürür. Devir yazılı yapılmış ve Ticaret Sicili Gazetesinde ilan edilmiştir. (2) Altın Mobilya A.Ş. aktif ve pasifleriyle devralmış ve ilan etmiştir; sorumluluğu 10.03.2024 ilan tarihinden başlar. (3) Ü Ltd. Şti.'nin alacağı, devir ve ilandan önce 01.02.2024'te muaccel olmuştur. Muaccel borçta iki yıllık süre ilan tarihinden başladığından 10.03.2024'ten iki yıl sonra, yani 10.03.2026'da dolmuştur; Deniz bu alacak bakımından artık müteselsil sorumlu değildir (devralan sorumluluğu devam eder). Doğu Bank'ın alacağı ise sonradan muaccel olacak borçtur; süre muacceliyet tarihi olan 15.08.2025'ten işler ve ancak 15.08.2027'de dolar. Doğu Bank 20.05.2026'da başvurduğundan bu tarihte süre dolmamıştır; Deniz, Altın Mobilya A.Ş. ile birlikte bu borçtan müteselsil sorumludur.

      **Sonuç:** Kiracılık hakkı ve ticaret unvanı devre dahildir; devir şekil bakımından geçerlidir. Altın Mobilya A.Ş. 10.03.2024'ten itibaren işletme borçlarından sorumludur. Deniz'in müteselsil sorumluluğu Ü Ltd. Şti. bakımından sona ermiş, Doğu Bank bakımından devam etmektedir.
  - olay: |
      Y Nakliyat Ltd. Şti., Cemal Er'e 900.000 TL borçlanmıştır. Y Nakliyat, borcunu ödemeden araçlarını, müşterilerini ve işçilerini kısa süre içinde aynı adreste faaliyet göstermeye başlayan Z Lojistik A.Ş.'nin kullanımına bırakmıştır. İki şirket arasında imzalanmış hiçbir devir sözleşmesi yoktur; Cemal'in elinde yalnızca Y'nin yetkilisinin Z'ye e-postayla gönderdiği imzasız bir devir sözleşmesi taslağı vardır. Z, alacaklılara bir bildirim yapmamış ve ilan da vermemiştir. Cemal, işletmenin Z'ye devredildiğini ileri sürerek hem Y'ye hem de Z'ye karşı 900.000 TL için TBK m. 202'ye dayalı bir alacak davası açmak istemektedir.

      1. TBK m. 202 anlamında bir işletme devri var mıdır; Z borçtan sorumlu tutulabilir mi?
      2. Cemal'in açmak istediği dava ticari dava mıdır; görevli mahkeme hangisidir?
      3. Cemal dava açmadan önce neye başvurmak zorundadır?
    olcut:
      - {tespit: "İşletme devri için ticari işletmenin bütün hâlinde, aktif ve pasifiyle devri gerekir", puan: 20, madde: "TBK m. 202"}
      - {tespit: "Devir sözleşmesi yazılı yapılmalıdır; yazılı şekil geçerlilik şartıdır, imzasız taslak yeterli değildir", puan: 25, madde: "TTK m. 11"}
      - {tespit: "Yazılı sözleşme olmadığından Z, TBK m. 202'ye göre borçtan sorumlu tutulamaz", puan: 15, madde: "TBK m. 202"}
      - {tespit: "TBK m. 202'den doğan dava mutlak ticari davadır; asliye ticaret mahkemesi görevlidir", puan: 20, madde: "TTK m. 4"}
      - {tespit: "Para alacağı davasında arabulucuya başvuru dava şartıdır", puan: 20, madde: "TTK m. 5/A"}
    cozum: |
      **Nitelendirme:** Olay, alacaklının borçlu şirketin ticari işletmesinin başka bir şirkete fiilen devredildiği iddiasıyla devralanı TBK m. 202'ye dayanarak sorumlu tutmak istemesine ilişkindir.

      **Hukuki sorunlar:** (1) TBK m. 202 sorumluluğunun şartları ve yazılı şekil; (2) davanın niteliği ve görev; (3) dava şartı arabuluculuk.

      **İlgili hükümler:** TBK m. 202/1: bir işletmeyi aktif ve pasifleri ile birlikte devralan, bildirme veya ilan tarihinden başlayarak borçlardan sorumlu olur. TTK m. 11/3: işletme bir bütün hâlinde devredilebilir; devir sözleşmesi yazılı yapılır, tescil ve ilan edilir. TTK m. 4/1-c: TBK m. 202 ve TBK m. 203'ten doğan davalar ticari davadır. TTK m. 5/1: asliye ticaret mahkemesi ticari davalara bakar. TTK m. 5/A: konusu para olan alacak davalarında arabuluculuk dava şartıdır.

      **Değerlendirme:** (1) TBK m. 202 sorumluluğu için ortada aktif ve pasifleriyle bir işletme devri bulunmalı, bu devir TTK m. 11/3'e uygun yazılı bir sözleşmeyle yapılmalıdır. Yargıtay'ın yaklaşımına göre yazılı şekil geçerlilik şartıdır. Olayda imzalı bir devir sözleşmesi yoktur, yalnızca imzasız bir taslak ve fiilî unsurlar (aynı adres, müşteri, işçi) vardır. Bu durumda TBK m. 202'ye dayanılarak Z borçtan sorumlu tutulamaz. Z'nin bildirim veya ilan yapmamış olması, zaten yazılı sözleşmenin eksikliğini gidermez. (2) Dava TBK m. 202'ye dayandığından TTK m. 4/1-c uyarınca mutlak ticari davadır; tarafların tacir olup olmaması önemli değildir. TTK m. 5/1'e göre değerine bakılmaksızın asliye ticaret mahkemesi görevlidir. (3) Konusu bir miktar para olan alacak davası olduğundan TTK m. 5/A/1 uyarınca dava açmadan önce arabulucuya başvurulması dava şartıdır. Başvuru yapılmadan dava açılırsa dava, dava şartı yokluğundan usulden reddedilir (HUAK m. 18/A/2).

      **Sonuç:** Yazılı devir sözleşmesi bulunmadığından Z, TBK m. 202 uyarınca sorumlu tutulamaz. Dava mutlak ticari davadır, görevli mahkeme asliye ticaret mahkemesidir ve dava açılmadan önce arabulucuya başvurulması gerekir.
kartlar:
  - on: "Ticari işletmenin unsurları (TTK m. 11/1)?"
    arka: "Gelir sağlamayı hedef tutma, devamlılık, bağımsızlık ve esnaf işletmesi için öngörülen sınırı aşma. Hedef yeterlidir, fiilen kâr şart değil."
  - on: "Ticari işletme–esnaf sınırını kim belirler (TTK m. 11/2)?"
    arka: "Cumhurbaşkanı kararı. Uygulamada 2007/12362 sayılı Bakanlar Kurulu Kararı esas alınır; yeni karar çıkıp çıkmadığı ayrıca kontrol edilmelidir."
  - on: "Esnaf kimdir (TTK m. 15/1)?"
    arka: "Ekonomik faaliyeti sermayesinden fazla bedenî çalışmasına dayanan, geliri belirlenen sınırı aşmayan ve sanat veya ticaretle uğraşan kişi."
  - on: "Esnafa uygulanan tacirlere özgü hükümler?"
    arka: "TTK m. 20 (ücret ve faiz), TTK m. 53 (işletme adı) ve TMK m. 950/2 (hapis hakkında bağlantı karinesi)."
  - on: "Şubenin unvanı nasıl kullanılır (TTK m. 48/1)?"
    arka: "Merkezin ticaret unvanı, şube olduğu belirtilerek kullanılır."
  - on: "Bütünlük ilkesi nedir (TTK m. 11/3)?"
    arka: "İşletme, unsurları için ayrı ayrı tasarruf işlemi yapılmadan bir bütün hâlinde devredilebilir ve diğer hukuki işlemlere konu olabilir."
  - on: "Aksi öngörülmemişse işletme devri neleri kapsar (TTK m. 11/3)?"
    arka: "Duran malvarlığı, işletme değeri, kiracılık hakkı, ticaret unvanı ve diğer fikrî mülkiyet hakları, sürekli işletmeye özgülenen unsurlar."
  - on: "İşletme devri hangi şekilde yapılır (TTK m. 11/3)?"
    arka: "Yazılı yapılır, ticaret siciline tescil ve ilan edilir. Yargıtay yazılı şekli geçerlilik şartı sayar."
  - on: "Ticaret unvanı işletmeden ayrı devredilebilir mi (TTK m. 49)?"
    arka: "Hayır. İşletmenin devri ise aksi açıkça kabul edilmedikçe unvanın devri sonucunu doğurur."
  - on: "Devralanın borçlardan sorumluluğu ne zaman başlar (TBK m. 202/1)?"
    arka: "Aktif ve pasifleriyle devralanın bunu alacaklılara bildirdiği veya ilanla duyurduğu tarihten."
  - on: "Devredenin iki yıllık sorumluluk süresi ne zaman başlar (TBK m. 202/2)?"
    arka: "Muaccel borçlarda bildirme veya duyuru tarihinden, sonradan muaccel olacak borçlarda muacceliyet tarihinden. Bildirme veya ilan yapılmadıkça işlemez (TBK m. 202/4)."
  - on: "TBK m. 203 neyi düzenler?"
    arka: "İşletmelerin birleşmesi ve tek kişiye ait işletmenin kollektif ya da komandit ortaklığa dönüşmesi; alacaklılar bütün alacaklarını yeni işletmeden alabilir."
