    tanim: "Yönetimin iç yönergeyle devredildiği üçüncü kişi; müdür olarak temsil yetkisi de alabilir (TTK m. 367, TTK m. 370/2)."
  - terim: İç yönerge
    tanim: "Yönetim kurulunun düzenlediği, yönetimin devrini, görevleri ve bağlılık ilişkilerini belirleyen belge (TTK m. 367/1)."
  - terim: Kooptasyon
    tanim: "Boşalan üyeliğe kurulun geçici üye seçip ilk genel kurulun onayına sunması (TTK m. 363/1)."
  - terim: Çift imza
    tanim: "Esas sözleşmede aksi yoksa ve kurul tek kişi değilse temsil yetkisinin birlikte kullanılması (TTK m. 370/1)."
  - terim: Batıl karar
    tanim: "Eşit işlem, temel yapı, vazgeçilmez haklar veya devredilemez yetkilere aykırı yönetim kurulu kararı (TTK m. 391)."
  - terim: Elden dolaştırma
    tanim: "Toplantı istenmediğinde, yazılı öneriye üye tam sayısının çoğunluğunun yazılı onayı alınarak karar verilmesi (TTK m. 390/4)."
  - terim: Devredilemez görev
    tanim: "Yönetim kurulunun başkasına bırakamayacağı, vazgeçemeyeceği yedi görev ve yetki (TTK m. 375/1)."
  - terim: Borca batıklık
    tanim: "Aktiflerin alacaklıların alacaklarını karşılamaya yetmemesi; kurul mahkemeye bildirir ve iflası ister (TTK m. 376/3)."
  - terim: Sıradan çekilme
    tanim: "Alacaklının alacağının sırasının diğer tüm alacaklılardan sonraya konulmasını yazılı kabul etmesi (TTK m. 376/3)."
kararlar:
  - id: "1230972100"
    ozet: |
      Bir anonim şirketin yönetim kurulu, 2017'de tescil edilen iç yönergede şirketin temsil ve ilzamı için üyelerin en az yüzde seksenin (dörtte beşin) olumlu oyunu aramıştır. Sonradan yeni iç yönerge ve ilgili yönetim kurulu kararları üyelerin beşte üçünün oyuyla alınıp tescil edilmiş; muhalif üyeler ve pay sahipleri ticaret sicili kararına itiraz etmiştir. Uyuşmazlığın merkezinde, bu kişilerin TTK m. 34 anlamında "ilgili" sayılıp sayılmayacağı bulunuyordu. Hukuk Genel Kurulu, iç yönergenin esas sözleşmenin eki gibi değerlendirilmesi gerektiğini, yönergedeki nisaba uyulmadan alınan yönetim kurulu kararının yok hükmünde olduğunu ve zarar gören muhalif üyelerle pay sahiplerinin ilgili sayılması gerektiğini belirterek bölge adliye mahkemesinin direnme kararını bozmuştur. Karar, TTK m. 390/1'deki nisabın esas sözleşme veya onun eki niteliğindeki yönergeyle ağırlaştırılabileceğini ve sicil müdürünün bunu incelemesi gerektiğini gösterir.
  - id: "1042756700"
    ozet: |
      Anonim şirketin olağan genel kurulu, esas sözleşmenin ilgili maddesine dayanarak bir kişiyi üç yıllığına yönetim kurulu başkanı seçmiş, ticaret sicili müdürlüğü ise seçimi bir yıl için tescil ve ilan etmiştir. Şirket, tescilin düzeltilmesi için sicil müdürlüğünün kararına itiraz etmiştir. Dosyada TTK m. 366/1'in o tarihte yürürlükte olan "her yıl" ibaresi ve emredici hükümler ilkesi (TTK m. 340) tartışılmış; Yargıtay Hukuk Genel Kurulunun önceki bir kararına uyan bozma sonrasında bölge adliye mahkemesi itirazı reddetmiş, Yargıtay 11. Hukuk Dairesi de bu kararı onamıştır. Böylece başkanın genel kurulca seçilmesi öngörülse bile eski metin döneminde bir yıldan uzun süre geçerli sayılmamıştır. 📌 Bu ibare 2024 değişikliğiyle metinden çıkarılmıştır.
sorular:
  - soru: |
      Yönetim kurulu üyeliğiyle ilgili aşağıdaki ifadelerden hangisi doğrudur?
    siklar:
      - "Üye olabilmek için şirketin pay sahibi olmak şarttır."
      - "Tüzel kişi üye seçildiğinde tüzel kişi adına belirlenen yalnız bir gerçek kişi tescil ve ilan edilir."
      - "Yönetim kurulu en az üç üyeden oluşmak zorundadır."
      - "Üyeler en çok beş yıl için seçilir."
    dogru: 1
    aciklama: |
      TTK m. 359/2'ye göre tüzel kişi üye seçilirse tüzel kişiyle birlikte yalnız bir gerçek kişi tescil ve ilan edilir. Pay sahibi olma şartı ve asgari üç üye şartı kaldırılmıştır (TTK m. 359/1); görev süresi en çok üç yıldır (TTK m. 362/1).
  - soru: |
      Yönetim kurulu üyeliği boşalan bir anonim şirkette yapılması gereken aşağıdakilerden hangisidir?
    siklar:
      - "Genel kurul olağanüstü toplanarak yeni üye seçmek zorundadır."
      - "Yönetim kurulu, kanuni şartları taşıyan birini geçici olarak seçip ilk genel kurulun onayına sunar."
      - "Üyelik, ticaret sicili müdürünün kararıyla doldurulur."
      - "Başkan, istediği kişiyi tek başına süresiz üye atar."
    dogru: 1
    aciklama: |
      TTK m. 363/1 kooptasyonu düzenler. Geçici üye ilk genel kurula kadar görev yapar, onaylanırsa selefinin süresini tamamlar.
  - soru: |
      Aşağıdakilerden hangisi genel kurulun yönetim kurulu üyesini görevden alabilmesi için kanunun aradığı hâllerden biridir?
    siklar:
      - "Üyenin esas sözleşmeyle atanmamış olması."
      - "Gündemde ilgili bir maddenin bulunması veya gündemde madde yokken haklı sebebin varlığı."
      - "Üyenin pay sahibi olmaması."
      - "Yönetim kurulu başkanının onayı."
    dogru: 1
    aciklama: |
      TTK m. 364/1'e göre esas sözleşmeyle atanmış üyeler de gündemde madde varsa veya haklı sebep bulunuyorsa genel kurulca her zaman görevden alınabilir.
  - soru: |
      Bir anonim şirketin esas sözleşmesinde yönetimin devrine ilişkin hüküm yoktur. Yönetim kurulu bir iç yönerge hazırlayarak yönetimi tamamen dışarıdan atanan Mehmet'e devretmiştir. Bu durumda aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Devir geçerlidir, çünkü iç yönerge yeterlidir."
      - "Devir için esas sözleşmede hüküm bulunması gerektiğinden yönetim, devredilmediği takdirde tüm üyelere aittir."
      - "Devir yalnız genel kurul kararıyla yapılabilir."
      - "Devir ancak üyelerden birine yapılabilir, üçüncü kişiye yapılamaz."
    dogru: 1
    aciklama: |
      TTK m. 367/1 esas sözleşmeye konulacak bir hüküm ve iç yönergeyi birlikte arar; devir yoksa yönetim kurulunun tüm üyelerine aittir (TTK m. 367/2). Üçüncü kişiye de devir mümkündür.
  - soru: |
      Bir anonim şirketin yönetim kurulu, tüm temsil yetkisini, kurul üyesi olmayan genel müdüre devretmiştir. Kurulda temsil yetkisine sahip hiçbir üye kalmamıştır. Bu devir hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Geçerlidir, çünkü temsil yetkisi serbestçe devredilebilir."
      - "TTK m. 370/2 uyarınca en az bir yönetim kurulu üyesinin temsil yetkisini haiz olması şart olduğundan bu devir kanuna uygun değildir."
      - "Geçerlidir, çünkü genel müdür müdür sıfatıyla her şeyi yapabilir."
      - "Yalnız tescil edilmezse geçersizdir."
    dogru: 1
    aciklama: |
      TTK m. 370/2: temsil yetkisi murahhas üyeye veya müdür olarak üçüncü kişilere devredilebilir, ancak en az bir yönetim kurulu üyesinin temsil yetkisini haiz olması şarttır.
  - soru: |
      Bir anonim şirketin temsilcisi, işletme konusu dışında kalan bir işlemi iyiniyetli bir üçüncü kişiyle yapmıştır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "İşlem şirketi bağlamaz, çünkü konu dışındadır."
      - "İşlem şirketi bağlar; şirket üçüncü kişinin işlemin konu dışında olduğunu bildiğini veya bilebilecek durumda olduğunu ispat ederse bağlanmaz."
      - "İşlem şirketi bağlar, hiçbir koşulda ileri sürülemez."
      - "İşlem, esas sözleşmenin ilan edilmiş olması nedeniyle üçüncü kişinin kötüniyetli sayılmasına yol açar."
    dogru: 1
    aciklama: |
      TTK m. 371/2: konu dışı işlemler de şirketi bağlar; şirketin ispat yükü vardır ve esas sözleşmenin ilanı tek başına yeterli delil değildir.
  - soru: |
      Mavi A.Ş.'nin murahhas üyesi Ayşe'nin tescilli yetkisi "tek işlem için en çok 1.000.000 TL" biçiminde sınırlandırılmıştır. Ayşe, iyiniyetli Ali'den şirket adına 3.000.000 TL'lik bir makine almıştır. Sonuç nedir?
    siklar:
      - "Tutar sınırlaması tescilli olduğundan Ali'ye karşı ileri sürülebilir ve şirket bağlanmaz."
      - "Tutar sınırlaması TTK m. 371/3'teki iki istisna dışında kaldığından iyiniyetli Ali'ye karşı hüküm ifade etmez ve şirket bağlanır."
      - "İşlem Ayşe'yi değil, yalnız yönetim kurulu başkanını bağlar."
      - "İşlem, genel kurul onayı olmadan hiçbir zaman geçerli olmaz."
    dogru: 1
    aciklama: |
      TTK m. 371/3'e göre yalnız merkez veya şube işlerine özgüleme ve birlikte kullanma sınırlamaları iyiniyetli üçüncü kişiye karşı geçerlidir. Tutar sınırı bunlardan değildir; şirketin Ayşe'ye rücu hakkı saklıdır (TTK m. 371/1).
  - soru: |
      Aşağıdakilerden hangisi 7511 sayılı Kanunla yapılan değişikliğin sonucudur?
    siklar:
      - "Şube müdürlerinin atanması ve görevden alınması TTK m. 375/1-d kapsamından çıkarılmıştır."
      - "Yönetim kurulu üyeleri için pay sahibi olma şartı getirilmiştir."
      - "Yönetim kurulunun üye sayısı en az üç olarak belirlenmiştir."
      - "Yönetim kurulu toplantısına vekille katılma imkânı getirilmiştir."
    dogru: 0
    aciklama: |
      TTK m. 375/1-d'de 23/05/2024 tarihli değişiklikle "şube müdürleri hariç olmak üzere" ibaresi yer almıştır. Diğer seçenekler kanuna aykırıdır (TTK m. 359/1 ve TTK m. 390/2).
  - soru: |
      Altı üyeli bir yönetim kurulunun esas sözleşmesinde nisaba ilişkin ağırlaştırıcı hüküm yoktur. Toplantıya üç üye katılmıştır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Üç üye katıldığı için toplantı nisabı sağlanmıştır."
      - "Toplantı nisabı üye tam sayısının çoğunluğu olduğundan en az dört üye bulunmadıkça nisap sağlanmış olmaz."
      - "Nisap yönetim kurulu başkanının oyuyla tamamlanır."
      - "Toplantıya katılamayan üyeler vekil gönderebilir."
    dogru: 1
    aciklama: |
      TTK m. 390/1'e göre kurul üye tam sayısının çoğunluğuyla toplanır; altı üyede çoğunluk yarıdan fazlası olan dörttür. Üyeler vekil aracılığıyla katılamaz (TTK m. 390/2).
  - soru: |
      Dört üyeli yönetim kurulunda bir öneri oylanmış, iki üye kabul, iki üye ret oyu vermiştir. Konu bir sonraki toplantıya bırakılmış, orada da aynı sonuç çıkmıştır. Öneri hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Başkanın oyu iki sayılır ve öneri kabul edilir."
      - "Öneri reddedilmiş sayılır."
      - "Öneri genel kurula havale edilir."
      - "Oylama sonsuza kadar tekrarlanır."
    dogru: 1
    aciklama: |
      TTK m. 390/3'e göre oylar eşitse konu gelecek toplantıya bırakılır; ikinci toplantıda da eşitlik olursa öneri reddedilmiş sayılır.
  - soru: |
      Altı üyeli yönetim kurulunun dört üyesi, başkandan kurulu toplantıya çağırmasını yazılı olarak istemiştir. Başkan istemin ulaşmasından otuz beş gün sonra hâlâ çağrı yapmamıştır. Aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Üyeler yalnızca genel kurula başvurabilir."
      - "Çağrı doğrudan istem sahibi üyelerce yapılabilir."
      - "Çağrı için mahkemeden izin almak zorunludur."
      - "Toplantı ancak başkan katılırsa yapılabilir."
    dogru: 1
    aciklama: |
      TTK m. 392/7: üyelerin çoğunluğunun yazılı istemi üzerine başkan istemin ulaştığı tarihten itibaren en geç otuz gün içinde yapılacak şekilde kurulu çağırmak zorundadır; bu sürede çağrılmazsa çağrı doğrudan istem sahiplerince yapılabilir. Dört üye, altı üyenin çoğunluğudur.
  - soru: |
      Aşağıdaki durumların hangisinde TTK m. 395/2'ye göre şirketin alacaklıları ilgili kişiyi doğrudan takip edebilir?
    siklar:
      - "Pay sahibi olan bir üyenin şirketten nakit borç almasında."
      - "Pay sahibi olmayan bir üyenin şirketten nakit borç almasında."
      - "Üyenin genel kurul izniyle şirkete taşınmaz satmasında."
      - "Üyenin rakip şirkette çalışan kardeşine maaş ödenmesinde."
    dogru: 1
    aciklama: |
      TTK m. 395/2: pay sahibi olmayan üyeler ve onların TTK m. 393'te sayılan, pay sahibi olmayan yakınları şirkete nakit borçlanamaz; aksi hâlde şirket alacaklıları bu kişileri şirketin yükümlendirildiği tutarda doğrudan takip edebilir.
olaylar:
  - olay: |
      Bahar Gıda A.Ş.'nin yönetim kurulu altı üyeden oluşmaktadır: Ali (başkan), Ayşe, Mehmet, Zeynep, Can ve Elif. Esas sözleşmede toplantı ve karar nisabına ilişkin ağırlaştırıcı hüküm yoktur; yönetimin devrine ilişkin hüküm de yoktur ve bir iç yönerge de düzenlenmemiştir.

      Ali, Ayşe ve Mehmet 12 Mart günü toplanarak şu kararları almıştır: (1) şirketin yönetimi tamamen dışarıdan atanan genel müdür Selim'e bırakılacak; (2) şirketin bütün temsil yetkisi Selim'e verilecek, kurul üyelerinden hiçbirinin temsil yetkisi bulunmayacak; (3) şube müdürlerinin atanması da Selim'e bırakılacaktır. Zeynep, Can ve Elif toplantıdan haberdar edilmemişlerdir.

      Selim aynı hafta, şirket adına iyiniyetli Barış Ltd. Şti. ile bir tedarik sözleşmesi imzalamıştır.

      1. 12 Mart tarihli toplantıda alınan kararların nisap yönünden durumu nedir?
      2. Yönetimin ve temsilin devri yönünden değerlendirme yapınız.
      3. Şube müdürlerinin atanması yetkisinin devri yönünden değerlendirme yapınız.
      4. Hukuki durum nedir?
    olcut:
      - {tespit: "Toplantı nisabı üye tam sayısının çoğunluğudur; altı üyede en az dört üye gerekir, üç üyeyle alınan kararlar bu nedenle geçerli sayılmaz", puan: 25, madde: "TTK m. 390/1"}
      - {tespit: "Yönetimin devri için esas sözleşme hükmü ve iç yönerge şarttır; bunlar yokken yönetim tüm üyelere aittir", puan: 20, madde: "TTK m. 367"}
      - {tespit: "Temsil yetkisinin devrinde en az bir yönetim kurulu üyesinin temsil yetkisini haiz olması şarttır", puan: 20, madde: "TTK m. 370/2"}
      - {tespit: "Şube müdürleri 2024 değişikliğiyle devredilemez görevler kapsamı dışındadır; müdürlerin atanması ise devredilemez", puan: 15, madde: "TTK m. 375/1-d"}
      - {tespit: "Üçüncü kişinin iyiniyeti ve temsil yetkisinin sınırlandırılmasının üçüncü kişilere etkisi", puan: 20, madde: "TTK m. 371/3"}
    cozum: |
      **Nitelendirme:** Olay, anonim şirkette yönetim kurulu kararının toplantı nisabı, yönetimin ve temsilin devri ile devredilemez görevlere ilişkin sınırlar ve üçüncü kişinin korunması sorunlarını içermektedir.

      **Hukuki sorunlar:** (1) Üç üyeyle yapılan toplantıda alınan kararlar geçerli midir? (2) Esas sözleşme hükmü ve iç yönerge olmadan yönetim devredilebilir mi? (3) Temsil yetkisi tamamen üçüncü kişiye bırakılabilir mi? (4) Şube müdürü atama yetkisi devredilebilir mi? (5) Selim'in yaptığı sözleşme şirketi bağlar mı?

      **İlgili hükümler:** TTK m. 390/1'e göre esas sözleşmede ağırlaştırıcı hüküm yoksa kurul üye tam sayısının çoğunluğuyla toplanır ve hazır üyelerin çoğunluğuyla karar alır. TTK m. 367/1 yönetimin devri için esas sözleşme hükmü ve iç yönerge arar; devir yoksa yönetim tüm üyelere aittir (TTK m. 367/2). TTK m. 370/2'ye göre temsil devredilebilir, ancak en az bir kurul üyesinin temsil yetkisini haiz olması şarttır. TTK m. 375/1-d müdürlerin atanmasını devredilemez saymakla birlikte şube müdürlerini kapsam dışında bırakır. TTK m. 371/3 temsil yetkisinin sınırlandırılmasının iyiniyetli üçüncü kişiye karşı etkisini düzenler.

      **Değerlendirme:** Altı üyeli kurulda üye tam sayısının çoğunluğu, yarıdan fazlası olan dört üyedir. Toplantıya yalnız üç üye katıldığından toplantı nisabı sağlanmamıştır ve alınan kararlar geçerli bir yönetim kurulu kararı sayılmaz; bu sakatlığın yokluk, batıllık veya geçersizlik olarak nitelendirilmesi tartışılabilir ama sonuç değişmez. Nisap sağlansaydı bile kararlar başka yönlerden de hukuka aykırı olurdu: esas sözleşmede devir hükmü ve iç yönerge olmadığından yönetim devredilemez ve yönetim tüm üyelere aittir. Temsil yetkisinin Selim'e verilmesi de kurul içinde temsil yetkisini haiz bir üye bırakmadığı için TTK m. 370/2'ye aykırıdır. Şube müdürlerinin atanması yetkisi ise TTK m. 375/1-d'nin 2024 değişikliğinden sonra devredilemez görevler arasında sayılmadığından, esas sözleşme ve iç yönerge şartları sağlandığında devredilebilirdi; ancak somut olayda bu şartlar da yoktur.

      Selim'in Barış Ltd. Şti. ile yaptığı sözleşmede ise iyiniyetli üçüncü kişinin korunması esastır. Temsil yetkisinin sınırlandırılması iyiniyetli üçüncü kişiye karşı hüküm ifade etmez; yalnız merkez veya şube işlerine özgüleme ile birlikte kullanma sınırlamaları tescil ve ilan edilmişse geçerlidir (TTK m. 371/3). Olayda böyle bir tescilli sınırlama bulunmamaktadır. Ayrıca işlemin yönetim kurulu kararına veya esas sözleşmeye aykırılığı iyiniyetli üçüncü kişinin şirkete başvurmasına engel değildir (TTK m. 371/4). Yetki devrinin şirket içi geçersizliğinin üçüncü kişiye karşı etkisi bakımından yetkinin tescil ve ilan durumu da önem taşır.

      **Sonuç:** Üç üyenin katıldığı toplantıdaki kararlar toplantı nisabı sağlanmadığından geçerli değildir. Yönetim ve temsilin Selim'e devri esas sözleşme hükmü, iç yönerge ve kurulda en az bir temsile yetkili üye bulunmaması nedenleriyle kanuna uygun değildir. Şube müdürü atama yetkisi kural olarak devredilebilir olmakla birlikte somut olayda şartlar oluşmamıştır. Barış Ltd. Şti. iyiniyetliyse yaptığı sözleşme şirketi bağlama bakımından korunur; şirketin Selim ve sorumlu üyelere rücu hakkı saklıdır.
  - olay: |
      Güneş Teknoloji A.Ş.'nin yönetim kurulu Ali, Ayşe, Cem, Deniz ve Eda'dan oluşmaktadır. Ali başkandır. Eda 2025 yılında istifa edince kalan dört üye Fatma'yı geçici üye seçmiş ve bu seçimi ilk genel kurulun onayına sunmak üzere karara bağlamıştır.

      Daha sonra Ayşe, Cem ve Deniz, şirketin kasasından belirsiz tutarlar alındığını fark ederek Ali'den kurulu toplantıya çağırmasını yazılı olarak istemişlerdir. Ali istemin kendisine ulaşmasından kırk gün sonra da toplantı yapmamıştır.

      Bunun üzerine genel kurul, gündeminde yönetim kurulu üyelerinin görevden alınmasına ilişkin ayrı bir madde bulunmamasına rağmen, kasadan para çekildiğinin kesinleşmesi üzerine Ali'yi görevden almıştır. Genel kurul toplantısında Ali, kendisinin görevden alınamayacağını ve tazminat hakkı bulunduğunu ileri sürmüştür.

      Ayrıca Cem, pay sahibi olmadığı hâlde şirketten 400.000 TL nakit borç almıştır. Cem'in kardeşi Gül de pay sahibi olmayıp şirket bu borç için Gül'e kefalet vermiştir.

      1. Fatma'nın üyeliğinin hukuki durumu nedir?
      2. Ayşe, Cem ve Deniz'in çağrı hakkını değerlendiriniz.
      3. Ali'nin görevden alınması geçerli midir? Tazminat hakkı var mıdır?
      4. Cem'in borçlanması ve kefalet işlemini değerlendiriniz.
    olcut:
      - {tespit: "Boşalan üyeliğe kurulun geçici üye seçmesi (kooptasyon), ilk genel kurula kadar görev yapma ve onay hâlinde selefin süresini tamamlama", puan: 20, madde: "TTK m. 363/1"}
      - {tespit: "Üyelerin çoğunluğunun yazılı istemine rağmen otuz gün içinde çağrı yapılmazsa çağrının doğrudan istem sahiplerince yapılabilmesi", puan: 25, madde: "TTK m. 392/7"}
      - {tespit: "Gündemde madde olmasa bile haklı sebep varsa genel kurulun üyeyi her zaman görevden alabilmesi ve tazminat hakkının saklı olması", puan: 25, madde: "TTK m. 364"}
      - {tespit: "Pay sahibi olmayan üyenin şirkete nakit borçlanma yasağı ve alacaklıların doğrudan takip hakkı", puan: 20, madde: "TTK m. 395/2"}
      - {tespit: "Üyenin yakınları için şirketin kefalet, garanti, teminat verememesi", puan: 10, madde: "TTK m. 393"}
    cozum: |
      **Nitelendirme:** Olay, yönetim kurulunda kooptasyon, çağrı hakkı, görevden alma ve borçlanma yasağına ilişkin sorunları içermektedir.

      **Hukuki sorunlar:** (1) Kalan üyelerin Fatma'yı seçmesi geçerli midir? (2) Başkan çağrı yapmayınca üyeler ne yapabilir? (3) Gündemde madde yokken Ali'nin görevden alınması geçerli midir, tazminat hakkı var mıdır? (4) Pay sahibi olmayan Cem'in borçlanması ve Gül lehine verilen kefalet hukuka uygun mudur?

      **İlgili hükümler:** TTK m. 363/1 geçici üye seçimini düzenler. TTK m. 392/7'ye göre üyelerin çoğunluğunun yazılı istemi üzerine başkan en geç otuz gün içinde toplantı yapılacak şekilde çağrı yapmak zorundadır; aksi hâlde çağrı doğrudan istem sahiplerince yapılabilir ve toplantıda TTK m. 390/1'deki nisaplar uygulanır. TTK m. 364/1 gündemde madde olmasa bile haklı sebep varsa görevden almaya imkân verir; TTK m. 364/2 tazminat hakkını saklı tutar. TTK m. 395/2 pay sahibi olmayan üyelerin ve TTK m. 393'te sayılan pay sahibi olmayan yakınlarının nakit borçlanmasını yasaklar.

      **Değerlendirme:** Eda'nın istifasıyla boşalan üyeliğe kalan üyelerin Fatma'yı geçici olarak seçmesi kanuna uygundur. Fatma ilk genel kurula kadar görev yapar; genel kurul onaylarsa Eda'nın süresini tamamlar. Kurul beş üyeye döndüğünden Ayşe, Cem ve Deniz üyelerin çoğunluğunu oluşturur. Ali, istemden itibaren kırk gün geçmesine rağmen otuz günlük süre içinde çağrı yapmadığından çağrıyı üç üye doğrudan yapabilir. Çağrı üzerine yapılacak toplantıda beş üyeli kurul için en az üç üyenin hazır bulunması gerekir (TTK m. 390/1).

      Görevden almada Ali'nin itirazı yerinde değildir: TTK m. 364/1'e göre gündemde ilgili madde bulunmasa bile haklı bir sebep varsa genel kurul üyeyi görevden alabilir. Kasadan para alınması haklı sebep niteliğindedir; haklı sebebin gerçekten var olup olmadığı ise ispat meselesidir. Tazminat bakımından TTK m. 364/2 görevden alınan üyenin tazminat hakkını saklı tutar; ancak somut olayda tazminat talebinin kabulü haklı sebebin Ali'nin kusuruyla doğup doğmadığına bağlı olarak değerlendirilecektir.

      Cem pay sahibi olmayan bir yönetim kurulu üyesi olduğundan şirkete nakit borçlanamaz (TTK m. 395/2). Şirketin Gül'e kefalet vermesi de aynı hükümle yasaklanmıştır; Gül, Cem'in TTK m. 393'te sayılan kardeşi olup pay sahibi değildir. Kanun, bu kişiler için şirketin kefalet, garanti ve teminat veremeyeceğini söyler. Aksi hâlde şirket alacaklıları, şirketin yükümlendirildiği tutarda bu kişileri doğrudan takip edebilir.

      **Sonuç:** Fatma'nın seçimi geçerlidir ve ilk genel kurulun onayına tabidir. Çağrı hakkı Ayşe, Cem ve Deniz'e geçmiştir. Ali haklı sebebe dayanılarak gündemde madde olmasa da görevden alınabilir; tazminat hakkı saklıdır. Cem'in borçlanması ve Gül lehine kefalet TTK m. 395/2'ye aykırıdır; alacaklılar Cem ve Gül'ü doğrudan takip edebilir.
kartlar:
  - on: "Yönetim kurulu kaç kişiden oluşur ve üye olmak için pay sahibi olmak gerekir mi?"
    arka: "Bir veya daha fazla kişiden oluşur; pay sahibi olmak şart değildir (TTK m. 359/1)."
  - on: "Tüzel kişi yönetim kuruluna seçilirse kim tescil edilir?"
    arka: "Tüzel kişiyle birlikte, tüzel kişi adına belirlenen yalnız bir gerçek kişi tescil ve ilan edilir; toplantıya yalnız o katılır (TTK m. 359/2)."
  - on: "Yönetim kurulu üyelerinin görev süresi?"
    arka: "En çok üç yıl; esas sözleşmede aksine hüküm yoksa yeniden seçilebilirler (TTK m. 362/1)."
  - on: "Kooptasyon nedir?"
    arka: "Boşalan üyeliğe yönetim kurulunun geçici üye seçip ilk genel kurulun onayına sunması; onaylanırsa selefin süresi tamamlanır (TTK m. 363/1)."
  - on: "Genel kurul üyeyi hangi hâllerde görevden alabilir?"
    arka: "Gündemde madde varsa veya gündemde madde yokken haklı sebep varsa her zaman; tazminat hakkı saklıdır (TTK m. 364)."
  - on: "Yönetimin devri için hangi şartlar aranır?"
    arka: "Esas sözleşmede hüküm ve yönetim kurulunca düzenlenen iç yönerge; devir yoksa yönetim tüm üyelere aittir (TTK m. 367)."
  - on: "Temsil yetkisi devredilirse en az kaç yönetim kurulu üyesinin temsil yetkisi kalmalı?"
    arka: "En az bir üye (TTK m. 370/2)."
  - on: "İyiniyetli üçüncü kişiye karşı hangi temsil sınırlamaları geçerlidir?"
    arka: "Tescil ve ilan edilmek şartıyla yalnız merkez veya şube işlerine özgüleme ile birlikte kullanma (çift imza) sınırlamaları (TTK m. 371/3)."
  - on: "Şube müdürlerinin atanması devredilemez görev midir?"
    arka: "Hayır; 2024 değişikliğiyle şube müdürleri TTK m. 375/1-d'nin kapsamı dışına çıkarılmıştır."
  - on: "Sermayenin yarısı karşılıksız kalırsa kurul ne yapar?"
    arka: "Genel kurulu hemen toplantıya çağırır ve iyileştirici önlemleri sunar (TTK m. 376/1)."
  - on: "Yönetim kurulu toplantı ve karar nisabı?"
    arka: "Üye tam sayısının çoğunluğuyla toplanır, hazır üyelerin çoğunluğuyla karar verir; vekille katılım yoktur (TTK m. 390/1 ve TTK m. 390/2)."
  - on: "Üyelerin çoğunluğu kurulu toplantıya çağırmasını isterse başkanın süresi?"
    arka: "İstemin ulaştığı tarihten itibaren en geç otuz gün içinde toplantı yapılacak şekilde çağırır; yoksa çağrıyı istem sahipleri yapar (TTK m. 392/7)."
