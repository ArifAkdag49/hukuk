  - **Esas sözleşme değişikliği (TTK m. 452 ve TTK m. 453):** Genel kurul, aksine hüküm yoksa esas sözleşmenin bütün hükümlerini değiştirebilir; müktesep ve vazgeçilemez haklar saklıdır. Nisap TTK m. 421'e göre belirlenir: kural olarak sermayenin en az yarısı toplantıda temsil edilir, mevcut oyların çoğunluğuyla karar alınır; ikinci toplantıda en az üçte bir. İşletme konusunun tamamen değişmesi, imtiyazlı pay oluşturulması ve nama yazılı pay devrinin sınırlanması için sermayenin en az yüzde yetmişbeşi gerekir (TTK m. 421/3).
  - **Tescil (TTK m. 455):** Değiştirme kararı üçüncü kişilere karşı tescilden önce hüküm ifade etmez.
  - **İmtiyazlı pay sahipleri özel kurulu (TTK m. 454):** Haklarını ihlal eden karar özel kurulda onanmadıkça uygulanamaz. Özel kurul, imtiyazlı paylı sermayenin yüzde altmışının çoğunluğuyla toplanır; çağrıya rağmen süresinde toplanamazsa genel kurul kararı onanmış sayılır.
  - **Artırımın ortak şartları (TTK m. 456):** İç kaynaklar hariç, nakdî bedeller tamamen ödenmeden sermaye artırılamaz. Karar tarihinden itibaren üç ay içinde tescil edilmezse karar ve izin geçersiz hâle gelir.
  - **Dış kaynaklı artırım:** Esas sermaye sisteminde genel kurul (TTK m. 459), kayıtlı sermayede yönetim kurulu yetkisi en çok beş yıl için esas sözleşmeyle verilir (TTK m. 460).
  - **Rüçhan hakkı (TTK m. 461):** Pay sahibi mevcut payı oranında yeni pay alma hakkına sahiptir. Hak, haklı sebep varsa ve en az esas sermayenin yüzde altmışının olumlu oyuyla sınırlandırılır veya kaldırılır. Kullanım süresi en az onbeş gündür; hak devredilebilir.
  - **İç kaynaklı artırım (TTK m. 462):** Bilançodaki sermayeye eklenebilir fonlar varsa, bunlar dönüştürülmeden sermaye taahhüdüyle artırım yapılamaz. Bedelsiz paylar tescille kendiliğinden edinilir; bu hak kaldırılamaz, sınırlandırılamaz, vazgeçilemez.
  - **Şarta bağlı artırım (TTK m. 463 ve TTK m. 464):** Şartlı artan sermayenin toplam itibarî değeri sermayenin yarısını aşamaz.
  - **Azaltım (TTK m. 473-475):** Alacaklıların haklarını karşılayacak aktifin varlığı belirlenmelidir; karar nisabı sermayenin en az yüzde yetmişbeşi (TTK m. 473/3 ve TTK m. 421/3). Sermaye en az sermaye tutarının altına indirilemez. Yedişer gün arayla üç ilan yapılır, üçüncü ilandan itibaren iki ay beklenir; zarar kaynaklı açığı kapatmak amacıyla ve o oranda azaltımda çağrıdan vazgeçilebilir (TTK m. 474).
  - 📌 **Güncel:** 7887 sayılı Cumhurbaşkanı Kararıyla anonim şirkette en az esas sermaye 250.000 TL, kayıtlı sermayeli halka açık olmayan şirkette en az başlangıç sermayesi 500.000 TL; TTK'nın geçici 15. maddesi uyarınca uyum süresi 31.12.2026.
anlatim: |
  ## 1. Neden "sermaye değişikliği = esas sözleşme değişikliği"?

  Anonim şirkette esas sermaye esas sözleşmede yazılıdır. Bu yüzden esas sermaye sisteminde sermayeyi artırmak veya azaltmak, aynı zamanda **esas sözleşmenin değiştirilmesidir**. Bu konuda önce genel kuralları (esas sözleşme değişikliği), sonra artırım türlerini, rüçhan hakkını ve sonunda azaltımı ele alıyoruz.

  ## 2. Esas sözleşmenin değiştirilmesi

  ### 2.1 Yetki ve sınır

  Genel kurul, esas sözleşmede aksine hüküm yoksa, kanundaki şartlara uyarak esas sözleşmenin bütün hükümlerini değiştirebilir. Ama **müktesep ve vazgeçilemez haklar** saklıdır (TTK m. 452/1). Yani çoğunluk, ortağın dokunulmaz haklarını değişiklikle ortadan kaldıramaz.

  ### 2.2 Süreç ve nisap

  Genel kurul, esas sözleşmenin değiştirilmesi için toplantıya çağrıldığında; kuruluşu için Bakanlık izni gereken şirketlerde izin alınmış olmalı, diğer şirketlerde yönetim kurulunca hazırlanan değişiklik taslağı, değiştirilecek mevcut hükümlerle birlikte ilan edilmelidir (TTK m. 453/1). Karara TTK m. 421'deki nisaplar uygulanır.

  | Karar | Nisap (TTK m. 421) |
  | --- | --- |
  | Kural | İlk toplantıda sermayenin en az yarısı; mevcut oyların çoğunluğu |
  | İkinci toplantı | En az sermayenin üçte biri (en geç bir ay içinde) |
  | Zarar kapatma yükümlülüğü, merkezin yurt dışına taşınması | Oybirliği (m. 421/2) |
  | İşletme konusunun tamamen değişmesi, imtiyazlı pay, nama yazılı payın devrinin sınırlanması | Sermayenin en az yüzde yetmişbeşi (m. 421/3) |

  İkinci ve üçüncü fıkradaki nisaplara ilk toplantıda ulaşılamazsa sonraki toplantılarda da aynı nisap aranır (TTK m. 421/4). Payları borsada işlem gören şirketlerde, esas sözleşmede aksine hüküm yoksa, sermaye artırımı ve kayıtlı sermaye tavanının yükseltilmesine ilişkin esas sözleşme değişikliklerinde TTK m. 418'deki toplantı nisabı uygulanır (TTK m. 421/5).

  ### 2.3 İmtiyazlı pay sahipleri özel kurulu

  Genel kurulun esas sözleşme değişikliği veya yönetim kuruluna sermaye artırma yetkisi verilmesi kararı, ya da yönetim kurulunun sermaye artırım kararı **imtiyazlı pay sahiplerinin haklarını ihlal edecek nitelikteyse**, bu pay sahiplerinin özel toplantısında onanmadıkça uygulanamaz (TTK m. 454/1).

  - Yönetim kurulu, genel kurul kararının ilanından itibaren **bir ay içinde** özel kurulu çağırır; çağırmazsa her imtiyazlı pay sahibi onbeş gün içinde mahkemeden çağrı yapılmasını isteyebilir (TTK m. 454/2).
  - Özel kurul, imtiyazlı payları temsil eden sermayenin **yüzde altmışının** çoğunluğuyla toplanır, toplantıda temsil edilen payların çoğunluğuyla karar alır (TTK m. 454/3).
  - Çağrıya rağmen özel kurul süresi içinde toplanamazsa genel kurul kararı **onanmış sayılır** (TTK m. 454/5).
  - Özel kurulun onaylamama kararına karşı yönetim kurulu, karar tarihinden itibaren **bir ay içinde** kararın iptali ve genel kurul kararının tescili davası açabilir (TTK m. 454/7).

  > ⚠️ **Sınavda dikkat:** Özel kurul toplanamazsa karar reddedilmiş değil, onanmış sayılır.

  ### 2.4 Tescil

  Esas sözleşme değişikliği kararı yönetim kurulunca ticaret siciline tescil edilir; **değiştirme kararı üçüncü kişilere karşı tescilden önce hüküm ifade etmez** (TTK m. 455/1).

  ## 3. Sermaye artırımı: türler ve ortak şartlar

  ### 3.1 Türler

  1. **Dış kaynaklı (sermaye taahhüdüyle) artırım:** Ortaklar veya yeni girenler yeni pay taahhüt eder; esas sermaye sisteminde genel kurul karar verir (TTK m. 459), kayıtlı sermayede yönetim kurulu esas sözleşmedeki tavan içinde karar verir (TTK m. 460).
  2. **İç kaynaklı (bedelsiz) artırım:** Yedek akçeler ve fonlar sermayeye eklenir (TTK m. 462).
  3. **Şarta bağlı artırım:** Tahvil veya benzeri borçlanma araçları nedeniyle alacaklı olanlara ya da çalışanlara yeni pay edinme hakkı tanınır (TTK m. 463).

  ### 3.2 Ortak şartlar

  - **Nakdî bedeller ödenmiş olmalı:** İç kaynaklardan yapılan artırım hariç, payların nakdî bedelleri tamamen ödenmediği sürece sermaye artırılamaz. Sermayeye oranla **önemli sayılmayan** tutarların ödenmemiş olması engel değildir (TTK m. 456/1).
  - **Tescil süresi:** Artırım, karar tarihinden itibaren **üç ay içinde** tescil edilemezse genel kurul veya yönetim kurulu kararı ve alınmışsa izin **geçersiz hâle gelir** (TTK m. 456/3).
  - **Yönetim kurulu beyanı:** Artırımın türüne göre yönetim kurulu bir beyan imzalar; nakdî sermayenin taahhüt edildiğini ve gereken tutarın ödendiğini, ayni sermaye, takas, fon ve rüçhan hakkı sınırlamaları hakkındaki bilgileri içerir (TTK m. 457).
  - **Kıyasen uygulama:** Tüm artırım türlerine TTK m. 353 ve TTK m. 354 ile TTK m. 355/1 kıyasen uygulanır (TTK m. 456/4). TTK m. 353/1 anonim şirketin butlanına veya yokluğuna karar verilemeyeceğini söyler; bu yüzden tescil edilmiş sermaye artırımına ilişkin sonuç tartışılırken bu yollama gözetilir.

  > **Örnek:** K A.Ş.'nin 10.000.000 TL sermayesinin 4.000.000 TL'si ödenmemiştir. Genel kurul kuruluşta taahhüt edilen bu bedel ödenmeden yeni sermaye taahhüdüyle artırım kararı alırsa, 4.000.000 TL "önemli sayılmayan" bir tutar olmadığı için TTK m. 456/1 ihlal edilmiş olur.

  ## 4. Dış kaynaklı artırım

  ### 4.1 Esas sermaye sistemi (TTK m. 459)

  Artırılan sermayeyi temsil eden payların tamamı ya değişik esas sözleşmede ya da iştirak taahhütnamelerinde taahhüt edilir. İştirak taahhüdü kayıtsız, şartsız ve yazılı yapılır. Nakdî sermaye taahhüdüne ve ödemeye ilişkin kuruluş hükümleri kıyasen uygulanır; örneğin nakden taahhüt edilen payların itibarî değerlerinin en az yüzde yirmibeşi tescilden önce, kalanı tescili izleyen yirmidört ay içinde ödenir (TTK m. 344/1). Çıkarma primlerinin tamamı tescilden önce ödenir.

  ### 4.2 Kayıtlı sermaye sistemi (TTK m. 460)

  Halka açık olmayan anonim şirkette esas sözleşme yönetim kuruluna kayıtlı sermaye tavanına kadar sermayeyi artırma yetkisi verebilir. Bu yetki **en çok beş yıl** için tanınır (TTK m. 460/1). Yönetim kurulunun imtiyazlı veya itibarî değerinin üzerinde pay çıkarabilmesi ve yeni pay alma haklarını sınırlandırabilmesi için esas sözleşmeyle yetkilendirilmiş olması şarttır (TTK m. 460/4). Yönetim kurulu kararlarına karşı pay sahipleri ve yönetim kurulu üyeleri, TTK m. 445'teki sebeplerin varlığında kararın ilanından itibaren **bir ay içinde** iptal davası açabilir (TTK m. 460/5).

  ## 5. Rüçhan (yeni pay alma) hakkı

  **Rüçhan hakkı**, her pay sahibinin yeni çıkarılan payları mevcut paylarının sermayeye oranına göre alma hakkıdır (TTK m. 461/1). Amaç, ortağın şirketteki oranının seyrelmesini önlemektir.

  ### 5.1 Sınırlandırma veya kaldırma

  Genel kurulun sermaye artırım kararıyla rüçhan hakkı **ancak haklı sebepler bulunduğu takdirde** ve **en az esas sermayenin yüzde altmışının olumlu oyuyla** sınırlandırılabilir veya kaldırılabilir. Halka arz, işletmelerin, işletme kısımlarının, iştiraklerin devralınması ve işçilerin şirkete katılmaları haklı sebep sayılır. Sınırlandırma veya kaldırma yoluyla hiç kimse haklı görülmeyecek şekilde yararlandırılamaz veya kayba uğratılamaz (TTK m. 461/2).

  > ⚠️ **Sınavda dikkat:** Yüzde altmış oranı, toplantıda temsil edilen sermayeye değil **esas sermayenin tamamına** göre aranır. Metin "esas sermayenin yüzde altmışının olumlu oyu" der.

  > **Örnek:** Bir A.Ş.'de %55 paya sahip Cem, kendi payını artırmak için diğer ortakların rüçhan hakkını kaldırmak ister. Ne haklı sebep vardır ne de oy yüzde altmışa ulaşır; karar bu yönden hukuka aykırıdır.

  ### 5.2 Kullanım

  - Yönetim kurulu, yeni pay alma hakkının kullanılmasının esaslarını bir kararla belirler ve pay sahiplerine **en az onbeş gün** süre verir; karar tescil ve ilan edilir, internet sitesine konur (TTK m. 461/3).
  - Rüçhan hakkı **devredilebilir** (TTK m. 461/4).
  - Şirket, nama yazılı payların devrinin esas sözleşmeyle sınırlandırılmış olduğunu ileri sürerek rüçhan hakkının kullanılmasını engelleyemez (TTK m. 461/5).
  - Eşit işlem ilkesi (TTK m. 357/1) rüçhan sınırlandırmasında da gözetilir.

  ## 6. İç kaynaklardan (bedelsiz) artırım (TTK m. 462)

  Esas sözleşme veya genel kurul kararıyla ayrılmış ve belirli bir amaca özgülenmemiş yedek akçeler, kanuni yedek akçelerin serbestçe kullanılabilen kısımları ve mevzuatın sermayeye eklenmesine izin verdiği fonlar sermayeye dönüştürülerek artırım yapılabilir (TTK m. 462/1). Tutarın şirkette gerçekten var olduğu onaylı yıllık bilanço ve yönetim kurulunun açık yazılı beyanıyla doğrulanır (TTK m. 462/2).

  İki kritik kural vardır (TTK m. 462/3):

  1. **Fon önceliği:** Bilançoda sermayeye eklenmesine mevzuatın izin verdiği fonlar varsa, bu fonlar dönüştürülmeden sermaye taahhüdüyle artırım yapılamaz. Hem fonların dönüştürülmesi hem aynı zamanda ve aynı oranda taahhütle artırım yapılabilir.
  2. **Bedelsiz pay hakkı:** Tescille, o anda mevcut pay sahipleri paylarının sermayeye oranına göre bedelsiz payları **kendiliğinden iktisap eder**. Bu hak **kaldırılamaz, sınırlandırılamaz, vazgeçilemez**.

  > 💡 **Püf nokta:** Rüçhan hakkı haklı sebep ve %60 oyla kaldırılabilir; bedelsiz pay hakkı hiçbir çoğunlukla kaldırılamaz.

  ## 7. Şarta bağlı artırım (TTK m. 463 ve TTK m. 464)

  Genel kurul, yeni çıkarılan tahviller veya benzeri borçlanma araçları nedeniyle şirketten ya da topluluk şirketlerinden alacaklı olanlara veya çalışanlara, esas sözleşmede değiştirme veya alım haklarını kullanmak yoluyla yeni pay edinme hakkı sağlayarak sermayenin şarta bağlı artırılmasına karar verebilir (TTK m. 463/1). Sermaye, hak kullanıldığı ve sermaye borcu takas veya ödeme yoluyla yerine getirildiği anda ve ölçüde **kendiliğinden artar** (TTK m. 463/2). Şartlı olarak artırılan sermayenin toplam itibarî değeri **sermayenin yarısını aşamaz** (TTK m. 464/1).

  ## 8. Esas sermayenin azaltılması

  ### 8.1 Karar şartları (TTK m. 473)

  - Genel kurul esas sözleşmenin gerektiği şekilde değiştirilmesini karara bağlar; çağrıda azaltmanın sebepleri, amacı ve şekli ayrıntılı açıklanır; yönetim kurulu raporu genel kurulca onaylanır, tescil ve ilan edilir (TTK m. 473/1).
  - Azaltmaya rağmen **alacaklıların haklarını tamamen karşılayacak aktifin varlığı** belirlenmedikçe karar verilmez (TTK m. 473/2).
  - Karara TTK m. 421'in üçüncü fıkrasının birinci cümlesi uygulanır; yani sermayenin **en az yüzde yetmişbeşini** oluşturan payların sahiplerinin veya temsilcilerinin olumlu oyları gerekir (TTK m. 473/3).
  - Sermaye hiçbir suretle TTK m. 332 ile belirlenen **en az tutardan** aşağı indirilemez (TTK m. 473/5). 📌 Bu tutar 7887 sayılı Cumhurbaşkanı Kararıyla anonim şirkette 250.000 TL, kayıtlı sermayeli halka açık olmayan şirkette başlangıç sermayesi bakımından 500.000 TL'dir.

  ### 8.2 Alacaklılara çağrı (TTK m. 474)

  Yönetim kurulu azaltma kararını internet sitesine koyar ve Türkiye Ticaret Sicili Gazetesinde ve esas sözleşmede öngörülen şekilde **yedişer gün arayla üç defa** ilan eder. İlanda alacaklılara, **üçüncü ilandan itibaren iki ay içinde** alacaklarını bildirerek ödenmesini veya teminat altına alınmasını isteyebilecekleri belirtilir; bilinen alacaklılara ayrıca mektup gönderilir (TTK m. 474/1).

  **İstisna:** Sermaye, zararlar sonucunda bilançoda oluşan bir açığı kapatmak amacıyla ve bu açıklar oranında azaltılırsa yönetim kurulu alacaklıları çağırmaktan ve haklarının ödenmesinden veya teminattan vazgeçebilir (TTK m. 474/2).

  > ⚠️ **Sınavda dikkat:** Bu istisna çağrı ve bekleme merasimine ilişkindir. Genel kurul karar nisabını (TTK m. 473/3) ve aktif şartını (TTK m. 473/2) düşürdüğüne dair bir hüküm yoktur.

  ### 8.3 Uygulama ve tescil (TTK m. 475)

  Sermaye ancak alacaklılara verilen sürenin sona ermesinden ve beyan edilen alacakların ödenmesinden veya teminat altına alınmasından sonra azaltılabilir; aksi hâlde alacaklılar, azaltma işleminin tescilinin ilanından itibaren **iki yıl içinde** sermayenin azaltılmasının iptali davasını açabilir (TTK m. 475/1). Şartlara uyulduğunu gösteren belgeler ibraz edilmedikçe azaltma kararı ve azaltmanın gerçekleştiği olgusu tescil edilemez (TTK m. 475/4).

  ## 9. Güncel düzenleme: asgari sermaye ve uyum

  📌 7887 sayılı Cumhurbaşkanı Kararıyla (24.11.2023) anonim şirkette en az esas sermaye 250.000 TL, kayıtlı sermaye sistemini kabul etmiş halka açık olmayan şirkette en az başlangıç sermayesi 500.000 TL olarak belirlenmiştir (TTK m. 332'nin dipnotu; kanun metnindeki eski rakamlar 50.000 / 100.000 TL'dir). TTK'nın geçici 15. maddesi uyarınca sermayesi en az tutarın altındaki şirketler **31.12.2026'ya kadar** sermayelerini yükseltmezse infisah etmiş sayılır. Bu amaçla yapılan genel kurullarda toplantı nisabı aranmaz, kararlar mevcut oyların çoğunluğuyla alınır ve imtiyaz kullanılamaz. Bakanlık süreyi birer yıl olarak en çok iki defa uzatabilir; uzatma yapılıp yapılmadığını resmî kaynaktan ayrıca kontrol etmek gerekir.

  ## 10. Denetim şeması

  1. Esas sermaye mi kayıtlı sermaye mi? Karar organı kim?
  2. Nakdî bedeller ödenmiş mi (TTK m. 456/1)? Fon varsa dönüştürülmüş mü (TTK m. 462/3)?
  3. Rüçhan hakkı kaldırılıyorsa haklı sebep ve %60 var mı (TTK m. 461/2)? Kullanım süresi en az onbeş gün mü?
  4. İmtiyazlı payların hakları etkileniyorsa özel kurul (TTK m. 454)?
  5. Tescil üç ay içinde (TTK m. 456/3)? Üçüncü kişilere karşı tescille hüküm (TTK m. 455)?
  6. Azaltımsa: aktif, yüzde yetmişbeş nisap, üç ilan ve iki ay, en az sermaye (TTK m. 473 ve TTK m. 474)?
kritik: |
  - 📌 Esas sözleşme değişikliğinde kural: sermayenin en az yarısı toplantıda temsil edilir, mevcut oyların çoğunluğu; ikinci toplantıda en az üçte bir (TTK m. 421/1).
  - 📌 İşletme konusunun tamamen değişmesi, imtiyazlı pay oluşturulması, nama yazılı pay devrinin sınırlanması: sermayenin en az yüzde yetmişbeşi (TTK m. 421/3).
  - ⚠️ Esas sözleşme değişikliği üçüncü kişilere karşı tescilden önce hüküm ifade etmez (TTK m. 455).
  - 📌 İmtiyazlı pay sahipleri özel kurulu: imtiyazlı payları temsil eden sermayenin yüzde altmışının çoğunluğuyla toplanır; toplanamazsa genel kurul kararı onanmış sayılır (TTK m. 454/3 ve TTK m. 454/5).
  - 📌 Nakdî bedeller tamamen ödenmeden sermaye artırılamaz; iç kaynak hariç; önemli sayılmayan eksik engel değildir (TTK m. 456/1).
  - 📌 Artırım kararı üç ay içinde tescil edilmezse karar ve izin geçersiz hâle gelir (TTK m. 456/3).
  - 📌 Kayıtlı sermayede yönetim kurulu yetkisi en çok beş yıl; yönetim kurulu kararına karşı ilandan itibaren bir ay içinde iptal davası (TTK m. 460/1 ve TTK m. 460/5).
  - 📌 Rüçhan hakkı: haklı sebep ve esas sermayenin en az yüzde altmışının olumlu oyu (TTK m. 461/2); kullanım süresi en az onbeş gün (TTK m. 461/3); hak devredilebilir (TTK m. 461/4).
  - ⚠️ Bedelsiz pay hakkı kaldırılamaz, sınırlandırılamaz, vazgeçilemez (TTK m. 462/3); rüçhan hakkı ise sınırlandırılabilir.
  - ⚠️ Bilançoda sermayeye eklenebilir fon varsa, dönüştürülmeden sermaye taahhüdüyle artırım yapılamaz (TTK m. 462/3).
  - 📌 Şartlı artırılan sermaye sermayenin yarısını aşamaz (TTK m. 464/1).
  - 📌 Azaltım kararı: sermayenin en az yüzde yetmişbeşi (TTK m. 473/3); aktif şartı (TTK m. 473/2); en az tutarın altına inilemez (TTK m. 473/5).
  - 📌 Yedişer gün arayla üç ilan; üçüncü ilandan itibaren iki ay; zarar kaynaklı açık oranında azaltımda çağrıdan vazgeçilebilir (TTK m. 474).
  - 📌 Tescilin ilanından itibaren iki yıl içinde alacaklılar azaltma işleminin iptali davası açabilir (TTK m. 475/1).
doktrin: |
  ### Bilançodaki fonlar ibaresinin kapsamı (TTK m. 462/3)
  TTK m. 462/3, bilançoda sermayeye eklenmesine mevzuatın izin verdiği fonlar bulunuyorsa bunlar dönüştürülmeden taahhütle artırımı yasaklar. Bir görüşe göre bu ibare TTK m. 462/1'de sayılan bütün iç kaynakları, yani serbest yedek akçeleri de kapsar; bu durumda şirketin kârlarını önce sermayeye eklemesi gerekir. Diğer görüşe ve uygulamaya göre yasak yalnızca özel mevzuat uyarınca bilançoda yer alan ve sermayeye eklenmesine izin verilen fonlara (ör. belirli düzeltme veya satış kazancı fonları) ilişkindir; dağıtılmamış kârlar ve yedek akçeler eklenmeden de taahhütle artırım yapılabilir. Sınavda kanun metnine sadık kalıp "mevzuatın izin verdiği fonlar" ifadesini kullanın ve tartışmayı kısaca anın.

  ### Eş zamanlı azaltım ve artırım ("akordeon")
  Sermaye aynı genel kurulda azaltılıp aynı anda önceki tutara veya daha fazlasına artırıldığında, alacaklıların güvencesi olan sermaye rakamı düşmediği için üç ilan ve iki aylık bekleme merasiminin gerekip gerekmediği tartışmalıdır. Ağırlıklı yaklaşım alacaklıların korunmasının gerekliliğine dayanır; karşı görüş sonuçta sermayenin azalmadığını vurgular. Kesin bir kural gibi yazmamak gerekir.

  ### Seyreltme amaçlı artırım
  Azlığın payını düşürmek (seyreltme) amacıyla, şirketin gerçek bir finansman ihtiyacı olmadığı hâlde alınan artırım kararı, dürüstlük kuralına aykırılık nedeniyle TTK m. 445 kapsamında iptal edilebilir sayılabilir. Karar somut olayın koşullarına göre değerlendirilir; mahkeme azlığın rüçhan hakkını kullanma imkânını ve artırımın gerekçesini inceler.

  ### Tescil edilen artırımın sonradan sakatlığı
  TTK m. 456/4, TTK m. 353 ve TTK m. 354 hükümlerini sermaye artırımına kıyasen uygular; TTK m. 353/1 anonim şirketin butlanına veya yokluğuna karar verilemeyeceğini söyler. Bu yollamanın tescilli sermaye artırımı kararına karşı butlan veya yokluk davasının önüne geçip geçmediği ve iptal davasının ne ölçüde açık kaldığı uygulamada değerlendirilen bir konudur; Yargıtay mahkemeden bu yollamanın da gözetilmesini istemiştir.
