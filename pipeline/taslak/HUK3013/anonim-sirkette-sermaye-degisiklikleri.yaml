kararlar:
  - id: "1163292100"
    ozet: |
      Davacı ortak, davalı anonim şirketin 07.10.2023 tarihli olağan genel kurulunda sermayenin 350.000.000 TL'ye çıkarılmasına karar verildiğini; önceki nakdî sermaye artırım bedelleri ödenmediği hâlde, kendi payını düşürmek amacıyla ve dürüstlük kuralına aykırı biçimde artırım yapıldığını ileri sürerek kararın iptalini istedi. İlk derece mahkemesi, davacının oylamadan sonra muhalefet bildirmediği ve TTK m. 446/1-a şartının gerçekleşmediği gerekçesiyle davayı usulden reddetti; Bölge Adliye Mahkemesi istinafı esastan reddetti. Yargıtay 11. Hukuk Dairesi kararı bozdu: butlan sebepleri mahkemece re'sen araştırılmalı, butlan hâlinde muhalefet şerhi bulunmamasının önemi yoktur. Mahkeme; vazgeçilmez hakların ve rüçhan hakkının etkilenip etkilenmediğini, TTK m. 456/1'deki şartların (nakdî bedellerin ödenmesi) bulunup bulunmadığını ve TTK m. 456/4 yollamasıyla TTK m. 353 uyarınca tescil edilen artırım kararı yönünden yokluk ve butlan kararı verilemeyeceği hususunu gözeterek yeniden karar vermelidir.
  - id: "1223707000"
    ozet: |
      Davacılar, bir anonim şirketin imtiyazlı A grubu pay sahibi olarak, 15.12.2021 tarihli olağanüstü genel kurulda esas sözleşme değişikliği ve sermaye artırımı kararı alındığını, 15.12.2021 tarihli genel kurul ile 17.12.2021 tarihli imtiyazlı pay sahipleri özel kurulu tutanakları ve esas sözleşme değişikliği tescil edilmemişken, yönetim kurulunun rüçhan hakkının kullanılmasına ilişkin kararının 13.01.2022 tarihli Ticaret Sicil Gazetesinde tescil ve ilan edildiğini ileri sürerek bu tescilin kaldırılmasını istedi. İlk derece mahkemesi, davacıların önce TTK m. 34 uyarınca sicil müdürlüğüne başvurup, ret hâlinde tebliğden itibaren sekiz gün içinde mahkemeye itiraz yolunu işletmeden doğrudan dava açtığı gerekçesiyle davayı reddetti; Bölge Adliye Mahkemesi istinafı esastan reddetti. Yargıtay 11. Hukuk Dairesi kararı oy birliğiyle onadı. Karar, sicil işleminin kaldırılması için önce sicil müdürlüğü ve TTK m. 34'teki itiraz yolunun izlenmesi gerektiğini gösterir.
sorular:
  - soru: |
      Anonim şirkette kural olarak esas sözleşmeyi değiştiren genel kurul kararlarında nisap aşağıdakilerden hangisidir?
    siklar:
      - "Sermayenin en az yarısının temsil edildiği toplantıda, mevcut oyların çoğunluğu."
      - "Sermayenin en az dörtte biri; mevcut oyların üçte ikisi."
      - "Oybirliği."
      - "Sermayenin en az yüzde yetmişbeşi."
    dogru: 0
    aciklama: |
      TTK m. 421/1: aksine hüküm yoksa esas sözleşmeyi değiştiren kararlar sermayenin en az yarısının temsil edildiği genel kurulda mevcut oyların çoğunluğuyla alınır. Oybirliği ve yüzde yetmişbeş yalnız TTK m. 421/2 ve TTK m. 421/3'teki özel kararlar içindir.
  - soru: |
      Esas sözleşme değişikliği kararı için hangisi doğrudur?
    siklar:
      - "Kararla birlikte kendiliğinden herkese karşı geçerli olur."
      - "Genel kurul kararından itibaren on gün sonra hüküm doğurur."
      - "Üçüncü kişilere karşı tescilden önce hüküm ifade etmez."
      - "Tescil yalnız şirketin iç ilişkisinde önemlidir."
    dogru: 2
    aciklama: |
      TTK m. 455/1: esas sözleşmenin değiştirilmesine ilişkin karar tescil edilir ve değiştirme kararı üçüncü kişilere karşı tescilden önce hüküm ifade etmez.
  - soru: |
      İmtiyazlı pay sahiplerinin haklarını ihlal eden bir esas sözleşme değişikliği genel kurulda kabul edilmiştir. İmtiyazlı pay sahipleri özel kurulu, çağrıya rağmen süresi içinde toplanamamıştır. Sonuç nedir?
    siklar:
      - "Genel kurul kararı reddedilmiş sayılır."
      - "Genel kurul kararı onaylanmış sayılır."
      - "Karar mahkemece iptal edilir."
      - "Şirket genel kurulu yeniden toplanıp aynı nisapla kararı tekrarlar."
    dogru: 1
    aciklama: |
      TTK m. 454/5: çağrıya rağmen süresi içinde özel kurul toplanamazsa genel kurul kararı onaylanmış sayılır.
  - soru: |
      K A.Ş.'nin 10.000.000 TL sermayesinin 4.000.000 TL'si ortak Ahmet tarafından ödenmemiştir. Genel kurul, bu bedel ödenmeden dış kaynaklı sermaye artırımına karar vermiştir. Bu karar bakımından doğru olan hangisidir?
    siklar:
      - "Sorun yoktur; ödenmemiş bedel sermaye artırımını hiçbir hâlde engellemez."
      - "Sermayeye oranla önemli sayılmayan bir tutar olmadığından TTK m. 456/1 aykırıdır."
      - "Artırım ancak oybirliğiyle yapılabilir."
      - "Yalnız yönetim kurulu bu artırımı yapabilir."
    dogru: 1
    aciklama: |
      TTK m. 456/1: iç kaynaklardan yapılan artırım hariç, payların nakdî bedelleri tamamen ödenmediği sürece sermaye artırılamaz. Sermayeye oranla önemli sayılmayan tutarların ödenmemiş olması engel değildir; %40'lık eksik önemli sayılır.
  - soru: |
      Sermaye artırımı kararı 10.03.2026'da alınmış, tescil başvurusu 20.07.2026'da yapılmıştır. Hukuki sonuç nedir?
    siklar:
      - "Karar, tescil için üç ay geçtiği için ve alınmışsa izinle birlikte geçersiz hâle gelir."
      - "Karar geçerlidir; süre yalnız tavsiye niteliğindedir."
      - "Karar iptal edilebilir hâle gelir, ancak üç ay içinde dava açılması gerekir."
      - "Süre iki yıldır."
    dogru: 0
    aciklama: |
      TTK m. 456/3: artırım, genel kurul veya yönetim kurulu kararı tarihinden itibaren üç ay içinde tescil edilemezse karar ve alınmışsa izin geçersiz hâle gelir.
  - soru: |
      Halka açık olmayan X A.Ş.'nin genel kurulu, yeni payların tamamını ortak Sevgi'ye vermek için diğer ortakların rüçhan hakkını kaldırmak istemektedir. Hangisi doğrudur?
    siklar:
      - "Basit çoğunlukla kaldırılabilir."
      - "Esas sözleşmeyle peşinen kaldırılabilir."
      - "Hiçbir hâlde kaldırılamaz."
      - "Ancak haklı sebep varsa ve en az esas sermayenin yüzde altmışının olumlu oyuyla kaldırılabilir."
    dogru: 3
    aciklama: |
      TTK m. 461/2: rüçhan hakkı ancak haklı sebepler bulunduğu takdirde ve en az esas sermayenin yüzde altmışının olumlu oyuyla sınırlandırılabilir veya kaldırılabilir. Basit çoğunluk yeterli değildir.
  - soru: |
      Rüçhan hakkıyla ilgili hangisi doğrudur?
    siklar:
      - "Yönetim kurulu kullanma süresini en az onbeş gün olarak belirlemelidir ve hak devredilebilir."
      - "Rüçhan hakkı devredilemez."
      - "Kullanma süresi en az yedi gündür."
      - "Nama yazılı payların devri sınırlıysa şirket rüçhan hakkının kullanılmasını engelleyebilir."
    dogru: 0
    aciklama: |
      TTK m. 461/3 en az onbeş gün süre verilmesini, TTK m. 461/4 rüçhan hakkının devredilebilirliğini, TTK m. 461/5 ise şirketin nama yazılı payların devir sınırlamasına dayanarak hakkın kullanılmasını engelleyemeyeceğini söyler.
  - soru: |
      İç kaynaklardan sermaye artırımı sonucunda mevcut pay sahiplerinin edindiği bedelsiz paylarla ilgili hangisi doğrudur?
    siklar:
      - "Genel kurul bu hakkı yüzde altmışla kaldırabilir."
      - "Esas sözleşme bu hakkı sınırlayabilir."
      - "Bedelsiz pay hakkı kaldırılamaz, sınırlandırılamaz ve bu haktan vazgeçilemez."
      - "Pay sahibi yalnız talep ederse bedelsiz payı iktisap eder."
    dogru: 2
    aciklama: |
      TTK m. 462/3: tescil ile o anda mevcut pay sahipleri bedelsiz payları kendiliğinden iktisap eder; bu hak kaldırılamaz ve sınırlandırılamaz, haktan vazgeçilemez. Yüzde altmış kuralı rüçhan hakkına özgüdür.
  - soru: |
      Bilançoda sermayeye eklenmesine mevzuatın izin verdiği 5.000.000 TL tutarında fon bulunan bir şirket, bu fonu sermayeye dönüştürmeden yalnızca taahhüde dayalı artırım yapmak istemektedir. Durum nedir?
    siklar:
      - "Yapılabilir; fonların dönüştürülmesi isteğe bağlıdır."
      - "Yapılamaz; fonlar dönüştürülmeden sermaye taahhüdü yoluyla artırım yapılamaz."
      - "Yalnız yönetim kurulu kararıyla yapılabilir."
      - "Yalnız halka açık şirketlerde yasaktır."
    dogru: 1
    aciklama: |
      TTK m. 462/3: bilançoda sermayeye eklenmesine mevzuatın izin verdiği fonlar bulunuyorsa, bu fonlar dönüştürülmeden sermaye taahhüdüyle artırım yapılamaz. Hem fonların dönüştürülmesi hem aynı zamanda ve aynı oranda taahhütle artırım yapılabilir.
  - soru: |
      Şarta bağlı sermaye artırımında artırılan sermayenin toplam itibarî değeri hangi sınırı aşamaz?
    siklar:
      - "Sermayenin dörtte birini"
      - "Sermayenin yarısını"
      - "Sermayenin yüzde yetmişbeşini"
      - "Sermayenin iki katını"
    dogru: 1
    aciklama: |
      TTK m. 464/1: şartlı olarak artırılan sermayenin toplam itibarî değeri sermayenin yarısını aşamaz.
  - soru: |
      Z A.Ş.'nin genel kurulunda sermayenin ortaklara iade amacıyla azaltılmasına karar verilecektir. Yönetim kurulunun alacaklılar bakımından yapması gereken nedir?
    siklar:
      - "Hiçbir işlem gerekmez."
      - "Yedişer gün arayla üç defa ilan eder; alacaklılar üçüncü ilandan itibaren iki ay içinde başvurabilir."
      - "Tek ilan yeterlidir; alacaklılar bir ay içinde başvurur."
      - "Alacaklıların tamamından yazılı muvafakat alınır."
    dogru: 1
    aciklama: |
      TTK m. 474/1: yönetim kurulu, kararı internet sitesine koyar ve yedişer gün arayla üç defa ilan eder; alacaklılar üçüncü ilandan itibaren iki ay içinde alacaklarını bildirerek ödenmesini veya teminat altına alınmasını isteyebilir. Zarar kaynaklı açık kapatma istisnası (TTK m. 474/2) bu olayda yoktur.
  - soru: |
      Zararlar sonucunda bilançoda oluşan açığı kapatmak amacıyla ve bu açıklar oranında yapılan sermaye azaltımı için hangisi doğrudur?
    siklar:
      - "Genel kurul karar nisabı da aranmaz."
      - "Alacaklıları çağırmaktan vazgeçilebilir; ancak genel kurul karar nisabı (en az yüzde yetmişbeş) ve aktif şartı aranır."
      - "Sermaye en az sermaye tutarının altına da indirilebilir."
      - "Tescil gerekmez."
    dogru: 1
    aciklama: |
      TTK m. 474/2 yalnız yönetim kurulunun alacaklıları çağırmaktan ve hakların ödenmesinden veya teminattan vazgeçebileceğini söyler. Karar nisabı TTK m. 473/3, aktif şartı TTK m. 473/2 ve en az tutar sınırı TTK m. 473/5'te kalır.
olaylar:
  - olay: |
      Merkezi İzmir'de bulunan, halka açık olmayan K Gıda A.Ş.'nin esas sermayesi 10.000.000 TL'dir. Paylar şöyle dağılmıştır: Ahmet %55, Berna %25, Can %20. Şirketin kuruluşundan kalan nakdî sermaye taahhüdünün 4.000.000 TL'si Ahmet tarafından hâlâ ödenmemiştir. Ayrıca şirket bilançosunda, mevzuatın sermayeye eklenmesine izin verdiği 5.000.000 TL tutarında bir fon bulunmaktadır. Şirket genel kurulu 12.05.2026'da bütün ortakların katılımıyla toplanmıştır. Ahmet, bilançodaki fonu sermayeye eklemeden ve kendi 4.000.000 TL bakiye borcunu ödemeden, esas sermayenin nakdî taahhütle 30.000.000 TL'ye çıkarılmasını ve Berna ile Can'ın rüçhan haklarının kaldırılarak bütün yeni payların kendisi tarafından taahhüt edilmesini önermiştir. Oylamada Ahmet (%55) olumlu, Berna (%25) ve Can (%20) olumsuz oy verip muhalefetlerini tutanağa geçirtmiştir. Toplantı başkanı %55 oyla artırım ve rüçhan hakkının kaldırılması kararlarının kabul edildiğini açıklamıştır. Yönetim kurulu bu kararı tescil ettirmek için 20.09.2026'da ticaret sicili müdürlüğüne başvurmuştur.

      1. Sermaye artırımının önünde hangi engeller vardır?
      2. Rüçhan hakkının kaldırılması kararı hukuka uygun mudur?
      3. Tescil başvurusunun zamanında olup olmadığını değerlendiriniz.
    olcut:
      - {tespit: "Önceki nakdî bedeller tamamen ödenmediğinden, eksik tutar önemli sayılmayan nitelikte olmadığı için artırım yapılamaz", puan: 20, madde: "TTK m. 456"}
      - {tespit: "Bilançoda sermayeye eklenebilir fon varken fon dönüştürülmeden taahhütle artırım yapılamaz", puan: 20, madde: "TTK m. 462"}
      - {tespit: "Rüçhan hakkı için haklı sebep ve esas sermayenin en az %60'ının olumlu oyu gerekir; Ahmet'in %55'i yetersizdir ve haklı sebep gösterilmemiştir", puan: 25, madde: "TTK m. 461"}
      - {tespit: "Kararın tescili için karar tarihinden itibaren üç ay geçtiğinden karar ve izin geçersiz hâle gelir", puan: 20, madde: "TTK m. 456"}
      - {tespit: "Berna ve Can muhalefet şerhi koydurduklarından karar tarihinden itibaren üç ay içinde iptal davası açabilir; eşit işlem ilkesi de gözetilir", puan: 15, madde: "TTK m. 445"}
    cozum: |
      **Nitelendirme:** Olay, esas sermaye sisteminde dış kaynaklı (sermaye taahhüdüyle) artırım, rüçhan hakkının kaldırılması ve artırımın tescilini içerir. Karar esas sözleşme değişikliği niteliğinde de olduğundan genel kurul nisabı bakımından TTK m. 421/1 uygulanır; bütün ortaklar toplantıda temsil edildiği ve Ahmet'in %55'i çoğunluk sağladığı için bu nisap yönünden sorun görünmemektedir.

      **Hukuki sorunlar:** (1) Artırımın ortak şartları, (2) fon önceliği, (3) rüçhan hakkının kaldırılma şartları, (4) tescil süresi.

      **İlgili hükümler:** TTK m. 456/1, TTK m. 456/3, TTK m. 459, TTK m. 461/2, TTK m. 462/3, TTK m. 357 ve TTK m. 445.

      **Değerlendirme:** İlk olarak, iç kaynaklardan yapılan artırım hariç, payların nakdî bedelleri tamamen ödenmediği sürece sermaye artırılamaz (TTK m. 456/1). Ahmet'in 4.000.000 TL'lik bakiye borcu, 10.000.000 TL'lik sermayenin %40'ıdır ve "sermayeye oranla önemli sayılmayan tutar" olarak nitelendirilemez. Bu nedenle artırım kararı bu şarta aykırıdır.

      İkinci olarak, bilançoda sermayeye eklenmesine mevzuatın izin verdiği 5.000.000 TL'lik fon bulunmaktadır. Bu fon sermayeye dönüştürülmeden sermaye taahhüdüyle artırım yapılamaz; ancak hem fonun dönüştürülmesi hem de aynı zamanda ve aynı oranda taahhütle artırım mümkündür (TTK m. 462/3). Karar bu bakımdan da hukuka aykırıdır.

      Üçüncü olarak, rüçhan hakkı ancak haklı sebepler varsa ve en az esas sermayenin yüzde altmışının olumlu oyuyla sınırlandırılabilir veya kaldırılabilir (TTK m. 461/2). Metinde sayılan haklı sebepler (halka arz, işletme veya iştirak devralınması, işçilerin katılımı) bu olayda yoktur; Ahmet'in amacı kendi payını artırmaktır. Ayrıca Ahmet'in oyu yalnızca %55'tir ve yüzde altmış sınırının altındadır. Pay sahiplerine eşit işlem ilkesi de (TTK m. 357/1) ihlal edilmektedir. Kararın bu bölümü de hukuka aykırıdır.

      Dördüncü olarak, artırım kararı 12.05.2026'da alınmış, tescil başvurusu 20.09.2026'da yapılmıştır. Karar tarihinden itibaren üç ay içinde tescil edilemeyen artırımda karar ve izin geçersiz hâle gelir (TTK m. 456/3). Üç ay 12.08.2026'da dolmuştur; başvuru bu süreden sonradır.

      Berna ve Can toplantıda hazır bulunup olumsuz oy vermiş ve muhalefetlerini tutanağa geçirtmiştir. TTK m. 446/1-a gereği karar tarihinden itibaren üç ay içinde TTK m. 445 uyarınca iptal davası açabilirler. Fon önceliği ve ödeme şartlarına aykırılık nedeniyle butlan iddiaları da tartışılabilir; bu konu kararlarda mahkemece resen değerlendirilmektedir.

      **Sonuç:** Artırım kararı TTK m. 456/1 ve TTK m. 462/3'e, rüçhan hakkının kaldırılması TTK m. 461/2'ye aykırıdır; ayrıca tescil üç aylık süreyi aşmış olduğundan karar ve izin geçersiz hâle gelmiştir.
  - olay: |
      Z Tekstil A.Ş.'nin esas sermayesi 1.000.000 TL'dir ve bilançoda 600.000 TL tutarında zarar oluşmuştur. Paylar şöyledir: Ali %60, Ayşe %15, Mehmet %25. Yönetim kurulu, sermayenin 400.000 TL'ye düşürülmesini önermiştir. Genel kurulda Ali ve Ayşe olumlu, Mehmet olumsuz oy kullanmıştır. Mehmet, azaltmanın alacaklılara üç ilanla duyurulması gerektiğini, ayrıca sermayenin 200.000 TL'ye kadar da düşürülebileceğini ileri sürmektedir. Yönetim kurulu ise bu azaltmanın bilanço zararını kapatmak amacıyla yapıldığını, alacaklılara çağrıdan vazgeçeceklerini söylemektedir. Şirketin aktifleri alacaklılara olan borçları karşılayacak niteliktedir.

      1. Genel kurul kararı nisap bakımından yeterli midir?
      2. Alacaklılara çağrı yapılması zorunlu mudur?
      3. Mehmet'in 200.000 TL önerisi mümkün müdür?
      4. Azaltma işlemi bakımından alacaklıların hakları nelerdir?
    olcut:
      - {tespit: "Azaltma kararı için sermayenin en az %75'ini oluşturan payların olumlu oyu gerekir; Ali ve Ayşe birlikte %75'tir", puan: 20, madde: "TTK m. 473"}
      - {tespit: "Alacaklıların haklarını karşılayacak aktif varlığı belirlenmedikçe karar verilemez; olayda aktifler yeterlidir", puan: 15, madde: "TTK m. 473"}
      - {tespit: "Zarardan doğan bilanço açığını kapatmak amacıyla ve açık oranında azaltmada yönetim kurulu alacaklıları çağırmaktan vazgeçebilir; 600.000 TL zarar ve 600.000 TL azaltma oranlıdır", puan: 25, madde: "TTK m. 474"}
      - {tespit: "Sermaye en az sermaye tutarının (250.000 TL) altına indirilemez; 200.000 TL mümkün değildir", puan: 20, madde: "TTK m. 473"}
      - {tespit: "Çağrı yapılmışsa sermaye ancak süre bitip alacaklar ödendikten veya teminat verildikten sonra azaltılır; aksi hâlde alacaklılar tescilin ilanından itibaren iki yıl içinde iptal davası açabilir; belgeler ibraz edilmeden tescil olmaz", puan: 20, madde: "TTK m. 475"}
    cozum: |
      **Nitelendirme:** Olay, anonim şirkette esas sermayenin azaltılmasına ilişkindir. Azaltma, esas sözleşmenin değiştirilmesini de gerektirdiğinden genel kurul kararı şarttır.

      **Hukuki sorunlar:** (1) Karar nisabı ve aktif şartı, (2) alacaklılara çağrı zorunluluğu ve istisna, (3) azaltmanın alt sınırı, (4) alacaklıların korunması ve tescil.

      **İlgili hükümler:** TTK m. 473/2, TTK m. 473/3, TTK m. 473/5, TTK m. 474, TTK m. 475, TTK m. 421/3 ve TTK m. 332.

      **Değerlendirme:** Sermayenin azaltılması kararına TTK m. 421'in üçüncü fıkrasının birinci cümlesi uygulanır (TTK m. 473/3); sermayenin en az yüzde yetmişbeşini oluşturan payların sahiplerinin olumlu oyu gerekir. Ali (%60) ve Ayşe (%15) birlikte %75'e ulaşmaktadır; "en az yüzde yetmişbeş" ifadesi eşitliği kapsadığından nisap sağlanmıştır. Mehmet'in olumsuz oyu sonucu değiştirmez. Aktiflerin alacaklılara olan borçları karşıladığı belirtildiğinden TTK m. 473/2'deki şart da gerçekleşmiştir.

      Alacaklılara çağrı bakımından kural, yönetim kurulunun azaltma kararını yedişer gün arayla üç defa ilan etmesi ve alacaklılara üçüncü ilandan itibaren iki ay içinde alacaklarının ödenmesini veya teminat altına alınmasını isteme hakkı tanımasıdır (TTK m. 474/1). Ancak sermaye, zararlar sonucunda bilançoda oluşan bir açığı kapatmak amacıyla ve bu açıklar oranında azaltılıyorsa yönetim kurulu çağrıdan vazgeçebilir (TTK m. 474/2). Olayda zarar 600.000 TL'dir ve sermaye 1.000.000 TL'den 400.000 TL'ye, yani 600.000 TL azaltılmaktadır; azaltma açık oranındadır. Dolayısıyla Mehmet'in üç ilan gereği iddiası olayda isabetli değildir; çağrı zorunlu değildir, vazgeçilebilir. Bu istisna nisabı ve aktif şartını ortadan kaldırmaz.

      Mehmet'in 200.000 TL önerisi ise mümkün değildir. Sermaye hiçbir suretle TTK m. 332 ile belirlenen en az tutardan aşağı indirilemez (TTK m. 473/5). 📌 Anonim şirkette bu tutar 7887 sayılı Cumhurbaşkanı Kararıyla 250.000 TL'dir; 200.000 TL bunun altındadır. Ayrıca 600.000 TL zarara göre sermaye 200.000 TL'ye indirilirse azaltma açık oranını da aşardı.

      Alacaklıların korunması bakımından sermaye, çağrı yapılan hâllerde ancak sürenin bitiminden ve bildirilen alacakların ödenmesinden veya teminat altına alınmasından sonra azaltılabilir; aksi hâlde alacaklılar tescilin ilanından itibaren iki yıl içinde azaltmanın iptali davası açabilir (TTK m. 475/1). Şartlara uyulduğunu gösteren belgeler ibraz edilmedikçe karar ve azaltmanın gerçekleşmiş olması olgusu ticaret siciline tescil edilemez (TTK m. 475/4).

      **Sonuç:** Karar nisabı sağlanmıştır; alacaklılara çağrıdan vazgeçilebilir; sermaye 200.000 TL'ye düşürülemez, 400.000 TL'ye düşürülebilir (250.000 TL alt sınırı üzerinde).
kartlar:
  - on: "Esas sözleşme değişikliğinde kural nisap?"
    arka: "Sermayenin en az yarısı temsil edilir, mevcut oyların çoğunluğu; ikinci toplantıda en az üçte bir (TTK m. 421/1)."
  - on: "Hangi esas sözleşme değişiklikleri %75 ister?"
    arka: "İşletme konusunun tamamen değişmesi, imtiyazlı pay oluşturulması, nama yazılı pay devrinin sınırlanması (TTK m. 421/3)."
  - on: "Esas sözleşme değişikliği ne zaman üçüncü kişilere karşı hüküm doğurur?"
    arka: "Tescilden sonra; tescilden önce hüküm ifade etmez (TTK m. 455/1)."
  - on: "İmtiyazlı pay sahipleri özel kurulu toplanamazsa?"
    arka: "Genel kurul kararı onanmış sayılır (TTK m. 454/5). Özel kurul %60 sermayeyle toplanır (TTK m. 454/3)."
  - on: "Sermaye artırımı için nakdî bedellerle ilgili ön şart?"
    arka: "Nakdî bedeller tamamen ödenmeden artırım yapılamaz; iç kaynak hariç, önemsiz eksik engel değil (TTK m. 456/1)."
  - on: "Artırım kararının tescil süresi?"
    arka: "Karar tarihinden itibaren üç ay; aksi hâlde karar ve izin geçersiz (TTK m. 456/3)."
  - on: "Kayıtlı sermayede yönetim kurulu yetkisi en çok kaç yıl?"
    arka: "Beş yıl (TTK m. 460/1). Kararlara karşı ilandan itibaren bir ay içinde iptal davası (TTK m. 460/5)."
  - on: "Rüçhan hakkı nasıl kaldırılır?"
    arka: "Haklı sebep ve en az esas sermayenin %60'ının olumlu oyu (TTK m. 461/2)."
  - on: "Rüçhan hakkı kullanım süresi ve devri?"
    arka: "En az onbeş gün; hak devredilebilir (TTK m. 461/3-4)."
  - on: "Bedelsiz pay hakkı kaldırılabilir mi?"
    arka: "Hayır; kaldırılamaz, sınırlandırılamaz, vazgeçilemez (TTK m. 462/3)."
  - on: "Şarta bağlı artırımın sınırı?"
    arka: "Sermayenin yarısını aşamaz (TTK m. 464/1)."
  - on: "Sermaye azaltımında nisap ve ilan?"
    arka: "Sermayenin en az %75'i (TTK m. 473/3); yedişer gün arayla 3 ilan, üçüncüden itibaren 2 ay (TTK m. 474/1). Zarar açığı oranında azaltımda çağrıdan vazgeçilebilir (TTK m. 474/2)."
