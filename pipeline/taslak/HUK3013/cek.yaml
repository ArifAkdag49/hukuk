      - {tespit: "Ankara'da düzenlenip İstanbul'da ödenecek çek 1 ay içinde ibraz edilmeli; süre 5 Mart 2027'de başlar", puan: 20, madde: "TTK m. 796"}
      - {tespit: "Ödememe protesto, muhatabın tarihli beyanı veya takas odası beyanıyla tespit edilir ve ibraz süresi geçmeden yapılmalıdır", puan: 20, madde: "TTK m. 808"}
      - {tespit: "Banka karşılığı olmayan çekte karşılıksızdır işlemi yapar ve kanunda öngörülen sorumluluk tutarını öder", puan: 15, madde: "5941 sayılı Kanun m. 3"}
      - {tespit: "D, bedelin %10'u ile zararı ödemekle yükümlüdür; hamilin şikâyetiyle icra mahkemesinde D'nin mali işlerinden sorumlu yönetim organı üyesine adli para cezası, D ve yetkililerine çek yasağı", puan: 15, madde: "TTK m. 783"}
      - {tespit: "Başvurma haklarının zamanaşımı ibraz süresinin bitiminden itibaren 3 yıldır", puan: 10, madde: "TTK m. 814"}
    cozum: |
      **Nitelendirme:** Olaydaki senet, Y Bankası üzerine düzenlenmiş emre yazılı bir çektir. Çek ödeme yerinden (İstanbul) farklı bir yerde (Ankara) düzenlenmiştir. Karşılığın bulunmaması çekin geçerliliğini etkilemez (TTK m. 783/1).

      **Hukuki sorunlar:** (1) Düzenleme tarihinden önceki ibraz; (2) ibraz süresinin hesabı; (3) ödememenin tespiti; (4) banka ve düzenleyenin sorumluluğu; (5) zamanaşımı.

      **İlgili hükümler:** TTK m. 795, TTK m. 796, TTK m. 816, TTK m. 808-809, TTK m. 783/3, TTK m. 814/1, 5941 sayılı Kanun m. 3 ve 5941 sayılı Kanun m. 5/1, ayrıca 5941 sayılı Kanunun geçici 3. maddesinin beşinci fıkrası.

      **Değerlendirme:** TTK m. 795/2 çeki düzenleme gününden önce ibraz edilse bile ibraz günü ödenir saysa da, 5941 sayılı Kanunun geçici 3. maddesinin beşinci fıkrası 31/12/2028'e kadar düzenleme tarihinden önceki ibrazı geçersiz kılmıştır. Bu nedenle 26 Şubat 2027'deki ibraz geçersizdir; banka ödeme yapmamakta haklıdır ve bu ibrazdan hareketle ödememe tespit edilemez. Ayrıca 5941 sayılı Kanun m. 3/8 uyarınca bu ibrazla ilgili hukuki takip de yapılamaz.

      Düzenleyen yerden başka bir yerde ödenecek çek bir ay içinde ibraz edilmelidir (TTK m. 796/1). Süre, yazılı düzenleme tarihinin ertesi günü, yani 5 Mart 2027'de başlar ve bir ay dolunca 4 Nisan 2027'de biter. O gün Pazar olduğundan süre izleyen ilk iş günü olan 5 Nisan 2027 Pazartesi gününe uzar (TTK m. 816/2). L'nin 30 Mart'taki ibrazı süre içindedir ve geçerlidir.

      Banka karşılıksızdır işlemi yapmıştır. Ödememe, bu yolla (muhatabın ibraz gününü de gösteren tarihli beyanı), protesto veya takas odası beyanıyla süresi geçmeden tespit edilebilir (TTK m. 808, TTK m. 809). Bu tespit olmadan hamil cirantalara ve düzenleyene başvuramaz. Banka, süresinde ibraz edilen her çek yaprağı için kanundaki sorumluluk tutarını ödemekle yükümlüdür; karşılığın hiç bulunmaması hâlinde bu tutarı, kısmen bulunması hâlinde kısmi karşılığa ilave olarak ödeyeceği tutarı hamile verir (5941 sayılı Kanun m. 3/3). Güncel tutar TCMB'nin her yıl Ocak ayında Resmî Gazete'de yayımladığı rakamdır.

      D, karşılıksız kalan bedelin yüzde onunu ödemek ve hamilin zararını tazmin etmekle yükümlüdür (TTK m. 783/3). Süresinde ibrazda karşılıksızdır işlemi yapıldığı için hamilin şikâyeti üzerine icra mahkemesinde binbeşyüz güne kadar adli para cezası ve çek düzenleme ve çek hesabı açma yasağı gündeme gelir (5941 sayılı Kanun m. 5/1). D bir limited şirket olduğundan adli para cezası şirkete değil, karşılığı bulundurmakla yükümlü olan kişiye, yani D'nin mali işlerini yürütmekle görevlendirilen yönetim organı üyesine (böyle bir belirleme yoksa yönetim organını oluşturan gerçek kişilere) verilir (5941 sayılı Kanun m. 5/2). Çek düzenleme ve çek hesabı açma yasağı ise D'ye, D adına çek düzenleyenlere ve şirket yetkililerine uygulanır (5941 sayılı Kanun m. 5/1). Bu dava şikâyete bağlıdır; L şikâyetten vazgeçerse ya da karşılıksız kalan bedel faiziyle birlikte tamamen ödenirse davanın düşmesine karar verilir (5941 sayılı Kanun m. 6/1-2).

      Zamanaşımı bakımından L'nin düzenleyen D'ye karşı başvurma hakları ibraz süresinin bitiminden itibaren üç yıl geçmekle zamanaşımına uğrar (TTK m. 814/1). Bu süre içinde haklarını kullanmazsa sebepsiz zenginleşme istemi kalır; o da çekin zamanaşımına uğradığı tarihi izleyen tarihten itibaren bir yıllıktır (TTK m. 818/1-m ile uygulanan TTK m. 732/4).

      **Sonuç:** 26 Şubat 2027 ibrazı geçersizdir; ibraz süresi 5 Mart 2027'de başlayıp 5 Nisan 2027'de biter (Pazar günü uzaması); 30 Mart ibrazı geçerlidir; D %10 ve zarardan sorumludur, banka sorumluluk tutarını öder, şikâyet üzerine D'nin mali işlerinden sorumlu yönetim organı üyesine adli para cezası, D ve yetkililerine çek yasağı söz konusudur; başvurma hakları üç yılda zamanaşımına uğrar.
  - olay: |
      Mert (A), Seda'nın (S) emrine, genel çizgili ve "emre yazılı" bir çeki düzenlemiştir. Seda çeki arkasını yalnızca imzalayarak (beyaz ciro) Burak'a (B) vermiş, Burak da çekin bedeli tahsil edilmeden önce Nehir'e (N) satmıştır. Çeki devralan Nehir:

      - Muhatap Z Bankası'nın şubesine gidip çek bedelini nakden istemiş, Nehir bu bankada müşteri değildir; Z Bankası ödemeyi reddetmiştir.
      - Bunun üzerine Nehir, Z Bankası'ndan çek üzerine "kabul edilmiştir" şerhi yazmasını istemiş, banka şerhi yazmıştır.
      - Nehir, çekin ibraz süresi geçtikten sonra çeki kredi borcuna teminat olarak Y Bankası'na "bedeli teminattır" kaydıyla ciro etmiştir.

      1. Burak yetkili hamil midir?
      2. Z Bankası'nın nakden ödemeyi reddetmesi doğru mudur?
      3. "Kabul edilmiştir" şerhi ne sonuç doğurur?
      4. Nehir'in Y Bankası'na yaptığı ciro hangi sonuçları doğurur?
      5. Başvurma hakları için zamanaşımı ne zaman başlar ve ne kadar sürer?
    olcut:
      - {tespit: "Hakkı kesintisiz ciro zincirinden anlaşılan hamil, son ciro beyaz olsa da yetkili hamildir", puan: 15, madde: "TTK m. 790"}
      - {tespit: "Genel çizgili çek muhatap tarafından ancak bir bankaya veya muhatabın müşterisine ödenir; banka ödemeyi reddetmekte haklıdır", puan: 20, madde: "TTK m. 804"}
      - {tespit: "Çek üzerine yazılan kabul kaydı yazılmamış sayılır, banka borçlu olmaz", puan: 15, madde: "TTK m. 784"}
      - {tespit: "İbraz süresi geçtikten sonra yapılan ciro yalnız alacağın temliki sonuçlarını doğurur", puan: 20, madde: "TTK m. 793"}
      - {tespit: "Çekte rehin cirosu yapılamaz; TTK m. 818/1-d, TTK m. 689'a atıf yapmaz ve 'bedeli teminattır' ibareli ciro Yargıtay'a göre bankaya meşru hamil sıfatı kazandırmaz", puan: 15, madde: "TTK m. 818"}
      - {tespit: "Başvurma hakları ibraz süresinin bitiminden itibaren 3 yılda zamanaşımına uğrar", puan: 15, madde: "TTK m. 814"}
    cozum: |
      **Nitelendirme:** Olaydaki senet, Z Bankası muhatap olmak üzere, genel çizgili, emre yazılı bir çektir. Seda'dan Burak'a, Burak'tan Nehir'e devir ciro yoluyla yapılmıştır.

      **Hukuki sorunlar:** (1) Beyaz ciro ve yetkili hamil; (2) çizgili çekin ödenmesi; (3) kabul kaydı; (4) ibraz süresi sonrası ciro ve rehin cirosu; (5) zamanaşımı.

      **İlgili hükümler:** TTK m. 788, TTK m. 790, TTK m. 784, TTK m. 793, TTK m. 803-804, TTK m. 818/1-d, TTK m. 689, TTK m. 814.

      **Değerlendirme:** Emre yazılı çek ciro ve zilyetliğin geçirilmesiyle devredilir (TTK m. 788/1). Çeki elinde bulunduran kişinin hakkı kesintisiz ve birbirine bağlı cirolardan anlaşılıyorsa, son ciro beyaz ciro olsa bile yetkili hamil sayılır (TTK m. 790). Burak, Seda'nın beyaz cirosuyla çeki almış ve Nehir'e devretmiştir; ciro zinciri kesintisizdir ve Nehir de yetkili hamildir.

      Genel çizgili çek, muhatap tarafından ancak bir bankaya veya muhatabın bir müşterisine ödenebilir (TTK m. 804/1). Nehir bankanın müşterisi değildir ve kendisi de banka değildir; bu yüzden Z Bankası'nın nakden ödemeyi reddetmesi doğrudur. Nehir çeki kendi bankasına tevdi ederek tahsil ettirmelidir. Aykırı ödeme yapan muhatap, çek bedelini aşmamak üzere zarardan sorumlu olurdu (TTK m. 804/5).

      Çekte kabul işlemi yapılamaz, çek üzerine yazılmış kabul kaydı yazılmamış sayılır (TTK m. 784). Z Bankası'nın şerh yazması ona bir çek borcu yüklemez; Nehir bu şerhe dayanarak bankadan ödeme isteyemez.

      İbraz süresi geçtikten sonra yapılan ciro yalnız alacağın temliki sonuçlarını doğurur (TTK m. 793/1). Ayrıca TTK m. 818/1-d, ciroya ilişkin poliçe hükümlerinden TTK m. 683-685'i çeke uyguladığı hâlde rehin cirosunu düzenleyen TTK m. 689'a atıf yapmaz; bu nedenle çekte rehin cirosu yapılamaz. Hukuk Genel Kurulu, çekin arkasına "bedeli teminat içindir" kaydı yazılan bankayı meşru hamil saymamıştır. Dolayısıyla Nehir'in "bedeli teminattır" kaydıyla yaptığı ciro, Y Bankası'na çek üzerinde rehin hakkı kazandırmaz; Y Bankası bu ciro nedeniyle çekten doğan hakları meşru hamil olarak kullanamaz.

      Başvurma hakkının zamanaşımı ibraz süresinin bitiminden itibaren üç yıldır (TTK m. 814/1). Süre geçtikten sonra hak sebepsiz zenginleşme hükümlerine kalır (TTK m. 818/1-m ile uygulanan TTK m. 732).

      **Sonuç:** Burak ve Nehir yetkili hamildir; Z Bankası'nın ödemeyi reddetmesi haklıdır; kabul şerhi yazılmamış sayılır; Y Bankası'na yapılan ciro çekte rehin cirosu olarak geçersizdir; başvurma hakları ibraz süresinin bitiminden üç yılda zamanaşımına uğrar.
kartlar:
  - on: "Çekin zorunlu unsurları nelerdir?"
    arka: "'Çek' kelimesi, kayıtsız şartsız havale, muhatabın unvanı, ödeme yeri, düzenlenme tarihi ve yeri, düzenleyenin imzası, seri numarası ve karekod (TTK m. 780). Vade ve lehtar yoktur."
  - on: "Çekte muhatap kim olabilir?"
    arka: "Türkiye'de ödenecek çekte ancak banka. Başka kişi üzerine çekilen senet yalnız havale hükmündedir (TTK m. 782)."
  - on: "Çekte kabul mümkün müdür?"
    arka: "Hayır. Kabul kaydı yazılmamış sayılır (TTK m. 784). Faiz şartı da yazılmamış sayılır (TTK m. 786)."
  - on: "Karşılıksız çek düzenleyenin TTK'ya göre sorumluluğu?"
    arka: "Karşılıksız kalan bedelin %10'unu öder ve hamilin zararını tazmin eder (TTK m. 783/3)."
  - on: "İbraz süreleri nelerdir?"
    arka: "Aynı yerde 10 gün; başka yerde 1 ay; yurt dışından aynı kıtada 1 ay, ayrı kıtada 3 ay. Düzenlenme tarihinin ertesi günü başlar (TTK m. 796)."
  - on: "Düzenleme tarihinden önce ibraz edilirse ne olur?"
    arka: "5941 sayılı Kanunun geçici 3. maddesinin beşinci fıkrasına göre 31/12/2028'e kadar ibraz geçersizdir."
  - on: "Çekten cayma ne zaman etkilidir?"
    arka: "Yalnız ibraz süresi geçtikten sonra (TTK m. 799/1). Cayma yoksa banka süre sonrası da ödeyebilir (TTK m. 799/2)."
  - on: "Hamiline yazılı çeke ciro yapılırsa?"
    arka: "Çek emre yazılı olmaz; ciranta başvurma hükümlerine göre sorumlu olur (TTK m. 791)."
  - on: "Çekte rehin cirosu yapılabilir mi?"
    arka: "Hayır. TTK m. 818/1-d, TTK m. 689'a atıf yapmaz; HGK da 'bedeli teminat içindir' kaydını rehin cirosu sayıp geçersiz bulmuştur."
  - on: "Genel çizgili çek kime ödenir?"
    arka: "Yalnız bir bankaya veya muhatabın müşterisine (TTK m. 804/1). Özel çizgide yalnız unvanı yazılı bankaya (TTK m. 804/2)."
  - on: "Ödememe nasıl tespit edilir?"
    arka: "Protesto, muhatabın tarihli beyanı veya takas odasının tarihli beyanı; ibraz süresi geçmeden (TTK m. 808, TTK m. 809)."
  - on: "Çekte zamanaşımı ve yaptırım?"
    arka: "Başvurma hakları ibraz süresinin bitiminden itibaren 3 yıl (TTK m. 814/1). Karşılıksızda hamilin şikâyetiyle icra mahkemesinde binbeşyüz güne kadar adli para cezası ve çek yasağı (5941 sayılı Kanun m. 5/1)."
