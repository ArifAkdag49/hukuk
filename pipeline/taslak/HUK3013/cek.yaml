ozet: |
  - **Niteliği:** Çek, muhatabı **banka** olan, görüldüğünde ödenen bir havale senedidir (TTK m. 780, TTK m. 782, TTK m. 795). Poliçe ve bonodan farkı, vadeli kredi değil **ödeme aracı** olmasıdır. Kambiyo hukuku TTK'nın çek kısmında (780 ila 823. maddeler), banka ilişkisi ve karşılıksız çek yaptırımı 5941 sayılı Kanun'dadır.
  - **Unsurlar (TTK m. 780):** "çek" kelimesi, kayıtsız şartsız havale, muhatabın ticaret unvanı, ödeme yeri, düzenlenme tarihi ve yeri, düzenleyenin imzası, banka tarafından verilen seri numarası ve karekod. **Vade ve lehtar zorunlu değildir**; lehtarsız çek hamiline yazılı sayılır (TTK m. 785/3). Eksik unsur çeki geçersiz kılar; ödeme yeri ve düzenlenme yeri için tamamlayıcı kurallar vardır (TTK m. 781).
  - **Karşılık ve kabul:** Karşılık ya da çek anlaşması yoksa senet yine çektir (TTK m. 783/1). Karşılıksız bırakan düzenleyen, karşılıksız kalan bedelin **yüzde onunu** öder ve hamilin zararını tazmin eder (TTK m. 783/3). **Çek kabul edilemez**; kabul kaydı yazılmamış sayılır (TTK m. 784). Faiz şartı da yazılmamış sayılır (TTK m. 786).
  - **Devir:** Emre yazılı çek ciro ve teslimle, nama yazılı çek alacağın temliki ile, hamiline yazılı çek teslimle devredilir (TTK m. 785, TTK m. 788). Muhatabın cirosu batıldır, muhatap lehine ciro makbuz hükmündedir (TTK m. 789). Hamiline çeke ciro, çeki emre yazılı yapmaz (TTK m. 791). Çekte **rehin cirosu yapılamaz** (TTK m. 818/1-d).
  - **İbraz süreleri (TTK m. 796):** düzenlendiği yerde ödenecekse **10 gün**, başka yerde ödenecekse **1 ay**; yurt dışından aynı kıtada 1 ay, ayrı kıtalarda 3 ay. Süre, çekteki düzenlenme tarihinin ertesi günü başlar. 📌 Düzenleme tarihinden önce ibraz, 5941 sayılı Kanunun geçici 3. maddesinin beşinci fıkrasına göre **31/12/2028'e kadar geçersizdir**.
  - **Cayma:** Çekten cayma ancak ibraz süresi geçtikten sonra hüküm ifade eder (TTK m. 799).
  - **Çizgili çek ve hesaba geçirilecek çek (TTK m. 803-805):** Genel çizgili çek yalnız bankaya ya da muhatabın müşterisine ödenir.
  - **Başvurma ve zamanaşımı:** Ödememe, süresinde ibraz edilen çekte protesto, muhatabın tarihli beyanı veya takas odası beyanıyla tespit edilir (TTK m. 808); protesto ya da denk belirleme ibraz süresi geçmeden yapılır (TTK m. 809). Hamilin başvurma hakkı **ibraz süresinin bitiminden itibaren 3 yılda** zamanaşımına uğrar (TTK m. 814/1).
  - **5941 sayılı Kanun:** Banka, süresinde ibraz edilen her yaprak için kanunda öngörülen **sorumluluk tutarını** öder (5941 sayılı Kanun m. 3/3); karşılıksızdır işlemine sebebiyet verene **binbeşyüz güne kadar adli para cezası** ve çek düzenleme ve hesap açma yasağı uygulanır (5941 sayılı Kanun m. 5/1).
anlatim: |
  ## 1. Çek nedir, neden ayrı düşünülür?

  **Çek**, düzenleyenin bir bankaya (muhatap) bağlı olarak, kayıtsız şartsız belirli bir bedelin ödenmesi için verdiği havaledir. Poliçeye benzer: düzenleyen, muhatap ve lehtar olmak üzere üç taraf vardır. Fark şudur: poliçe ve bono ileri bir tarihte ödenecek bir **kredi aracıdır**, çek ise **görüldüğünde ödenen** bir ödeme aracıdır. TTK m. 795/1 çekin görüldüğünde ödeneceğini söyler ve buna aykırı kaydı yazılmamış sayar. Bu yüzden çekte vade yoktur; ileri tarih yazılsa bile hukuken çek görüldüğünde ödenir.

  Konunun iki kaynağı var: kambiyo hukuku yönü **TTK'nın çek kısmı (780 ila 823. maddeler)**, banka ilişkisi, çek defteri ve karşılıksız çekin yaptırımı **5941 sayılı Çek Kanunu**. Sınavda ikisini birlikte kurman beklenir.

  ## 2. Zorunlu unsurlar

  TTK m. 780/1'e göre çek şunları içerir:

  1. Senet metninde **"çek" kelimesi**,
  2. Kayıtsız şartsız belirli bir bedelin ödenmesi için **havale**,
  3. **Muhatabın** ticaret unvanı,
  4. **Ödeme yeri**,
  5. **Düzenlenme tarihi ve yeri**,
  6. **Düzenleyenin imzası**,
  7. Banka tarafından verilen **seri numarası** (6728 sayılı Kanunla eklendi),
  8. **Karekod** (6728 sayılı Kanunla eklendi).

  Bu unsurlardan birini içermeyen senet, kanunun saydığı tamamlayıcı kurallar dışında çek sayılmaz (TTK m. 781/1).

  > ⚠️ **Sınavda dikkat:** Poliçe ve bonodan farklı olarak çekte **vade ve lehtar zorunlu unsur değildir** (TTK m. 780 ile TTK m. 671 ve TTK m. 776'yı karşılaştır). Kimin lehine düzenlendiği gösterilmeyen çek hamiline yazılı çek hükmündedir (TTK m. 785/3).

  Tamamlayıcı kurallar (TTK m. 781):
  - Çekte ödeme yeri yoksa, muhatabın unvanı yanında gösterilen yer ödeme yeridir. Birden fazla yer varsa ilk gösterilen, hiçbiri yoksa muhatabın merkezinin bulunduğu yer geçerlidir.
  - Düzenlenme yeri yazılmamışsa çek, düzenleyenin adı yanında yazılı yerde düzenlenmiş sayılır.
  - Yabancı banka tarafından bastırılan çekte seri numarası ve karekodun bulunmaması çekin geçerliliğini etkilemez.

  5941 sayılı Kanun m. 2 çek defterinin her yaprağına yazılacak bilgileri sayar (hesap numarası, şube, hesap sahibinin adı ve vergi kimlik numarası, basım tarihi gibi). Bu bilgilere aykırılık, **TTK'daki unsurlar bulunduğu sürece** çekin geçerliliğini etkilemez (5941 sayılı Kanun m. 2/9).

  ## 3. Muhatap, karşılık ve kabul yasağı

  Türkiye'de ödenecek çekte muhatap ancak **banka** olabilir. Başka bir kişi üzerine düzenlenen senet çek değildir, yalnız **havale** hükmündedir (TTK m. 782). Çekin düzenlenebilmesi için normalde muhatapta düzenleyenin emrine ayrılmış bir **karşılık** ve **çek anlaşması** bulunmalıdır; ama bunlara uyulmaması senedin çek olarak geçerliliğini etkilemez (TTK m. 783/1).

  Karşılığın yalnız bir kısmı varsa muhatap o kısmı ödemekle yükümlüdür (TTK m. 783/2). Karşılığı kısmen veya tamamen bulunmayan çeki düzenleyen, karşılıksız kalan bedelin **yüzde onunu** ödemekle yükümlüdür ve ayrıca hamilin bu yüzden uğradığı zararı tazmin eder (TTK m. 783/3).

  Çekte **kabul işlemi yapılamaz**, çek üzerine yazılmış kabul kaydı yazılmamış sayılır (TTK m. 784). Bu yüzden çekte "asıl borçlu" yoktur: muhatap banka çek borçlusu değildir, düzenleyen de başvurma borçlusudur. Faiz şartı da yazılmamış sayılır (TTK m. 786).

  > **Örnek:** Ali, Y Bankası üzerine düzenlediği çekin arkasına bankaya "kabul edilmiştir" yazdırıyor. Bu kayıt hiç yazılmamış sayılır; Y Bankası bu kayıtla çek borçlusu olmaz (TTK m. 784).

  ## 4. Kime düzenlenir, nasıl devredilir?

  | Çek türü | Devir yolu | Dayanak |
  |---|---|---|
  | Emre yazılı | Ciro + teslim | TTK m. 788/1 |
  | Nama yazılı ("emre yazılı değildir") | Alacağın temliki | TTK m. 788/2 |
  | Hamiline yazılı | Teslim | TTK m. 785 |

  Belirli bir kişi lehine düzenlenen çek, "emre yazılı" kaydı olmasa da emre yazılıdır (TTK m. 785/1-a). Belirli kişi lehine "veya hamiline" eklenmişse çek hamiline yazılı sayılır (TTK m. 785/2).

  Ciro çekte de kayıtsız ve şartsız olmalıdır; şart yazılmamış sayılır. **Kısmi ciro ve muhatabın cirosu batıldır**, muhatap lehindeki ciro ise yalnız makbuz hükmündedir (muhatabın başka bir şubesi lehine olmadıkça; TTK m. 789). Çeki elinde bulunduran, hakkı kesintisiz ciro zincirinden anlaşılıyorsa son ciro beyaz olsa bile **yetkili hamildir** (TTK m. 790). Kötüniyetle ya da ağır kusurla iktisap etmedikçe yeni hamil çeki geri vermez (TTK m. 792).

  > ⚠️ **Sınavda dikkat:** Hamiline yazılı çeke yapılan ciro, çeki emre yazılı hâle **getirmez**; yalnız cirantayı başvurma hükümlerine göre sorumlu kılar (TTK m. 791).

  Protestodan veya ibraz süresinin geçmesinden sonra yapılan ciro yalnız **alacağın temliki** sonuçlarını doğurur (TTK m. 793/1). Çekin ödenmesi kısmen veya tamamen **aval** ile de güvence altına alınabilir; avalı muhatap veremez (TTK m. 794).

  ### Rehin cirosu yasağı

  TTK m. 818/1, ciroya ilişkin poliçe hükümlerinden TTK m. 683-685'i (bent d) ve vekâleten (tahsil) cirosuna ilişkin TTK m. 688'i (bent f) çeke uygular. Rehin cirosunu düzenleyen **TTK m. 689'a atıf yoktur**. Bu nedenle çekte rehin cirosu yapılamaz. Yargıtay Hukuk Genel Kurulu, çekin arkasına "bedeli teminat içindir" yazılmasını rehin cirosu sayıp bu ciroyla çeki alan bankayı meşru hamil kabul etmemiştir. Gerekçe şudur: çek ödeme aracıdır, bedelinin kısa sürede ödenmesi beklenir, teminat olarak ciro edilmesi bu işlevle bağdaşmaz.

  ## 5. İbraz: ne zaman, nereye?

  Çek, çekte yazılı **düzenlenme tarihinin ertesi günü başlayan** sürelerde muhataba ibraz edilmelidir (TTK m. 796):

  | Durum | Süre |
  |---|---|
  | Düzenlendiği yerde ödenecek | 10 gün |
  | Başka yerde ödenecek (Türkiye içi) | 1 ay |
  | Yurt dışında düzenlenmiş, aynı kıtada ödenecek | 1 ay |
  | Yurt dışında düzenlenmiş, ayrı kıtada ödenecek | 3 ay |

  Sürenin son günü Pazar ya da başka bir tatil gününe gelirse süre, izleyen ilk iş gününe uzar; çekin ibrazı ve protestosu da ancak iş gününde yapılabilir (TTK m. 816). Çekin takas odasına ibrazı, ödeme için ibraz yerine geçer (TTK m. 798). 5941 sayılı Kanun m. 8/3'e göre, çeklerin fiziken ibraz edilmeden yalnız çek bilgileriyle takas odaları aracılığıyla elektronik ortamda muhatap bankaya gönderilmesi de takas odasına ibraz sayılır.

  > **Örnek:** Düzenleme yeri Ankara, ödeme yeri İstanbul olan ve üzerinde 4 Mart 2027 yazılı çekin ibraz süresi 5 Mart'ta başlar ve bir ay dolunca 4 Nisan 2027'de biter. O gün Pazar ise süre 5 Nisan Pazartesi günü sona erer (TTK m. 796, TTK m. 816).

  ### İleri tarihli çek ve erken ibraz

  TTK m. 795/2'ye göre düzenlenme gününden önce ibraz edilen çek, ibraz günü ödenir. Ancak 📌 **5941 sayılı Kanunun geçici 3. maddesinin beşinci fıkrası** uyarınca **31/12/2028 tarihine kadar**, çekin üzerinde yazılı düzenleme tarihinden önce ödenmek için muhatap bankaya ibrazı **geçersizdir**. Tarih, önceki değişikliklerle ertelene ertelene bu noktaya gelmiştir. Ayrıca düzenleme tarihinden önce ibraz edilen çekin ödenmemesi hâlinde bununla ilgili hukuki takip yapılamaz; ileri tarihli çek için takip yapılabilmesi, çekin düzenleme tarihine göre kanuni ibraz süresi içinde bankaya ibraz edilip karşılıksızdır işlemine tabi tutulmasına bağlıdır (5941 sayılı Kanun m. 3/8).

  ## 6. Çekten cayma

  Çekten cayma ancak **ibraz süresi geçtikten sonra** hüküm ifade eder (TTK m. 799/1). Cayma yoksa muhatap, ibraz süresi geçtikten sonra da çeki ödeyebilir (TTK m. 799/2). Süre içindeki cayma beyanı bankayı bağlamaz.

  > 💡 **Püf nokta:** Süre içinde cayma = etkisiz. Süre sonrası cayma = banka ödeyemez. Süre sonrası cayma yoksa = banka ödeyebilir.

  Çekin tedavüle çıkarılmasından sonra düzenleyenin ölümü, ehliyetini kaybetmesi ya da iflası çekin geçerliliğini etkilemez (TTK m. 800).

  ## 7. Çizgili çek ve hesaba geçirilecek çek

  Düzenleyen ya da hamil, çekin ön yüzüne **iki paralel çizgi** çekerek çeki çizebilir (TTK m. 803).
  - **Genel çizgi:** çizgilerin arası boş veya "banka" yazılı. Muhatap bu çeki ancak **bir bankaya veya muhatabın müşterisine** öder (TTK m. 804/1).
  - **Özel çizgi:** çizgiler arasına belirli bir bankanın unvanı yazılı. Çek ancak o bankaya, o banka muhatapsa onun müşterisine ödenir (TTK m. 804/2).
  - Genel çizgi özel çizgiye dönüştürülebilir, tersi olmaz; çizgilerin silinmesi hükümsüzdür (TTK m. 803/5-6).

  Çekin ön yüzüne **"hesaba geçirilecektir"** yazılırsa çek nakden ödenmez, yalnız hesaba alacak kaydı, takas veya hesap nakli yoluyla kayden ödenir (TTK m. 805). Hükme aykırı ödeme yapan banka, çek bedelini aşmamak üzere zarardan sorumludur (TTK m. 804/5, TTK m. 805/3).

  ## 8. Ödememe ve başvurma

  Süresinde ibraz edilen çek ödenmezse hamil, **cirantalara, düzenleyene ve diğer çek borçlularına** başvurabilir; ama önce ödememenin üç yoldan biriyle tespit edilmesi gerekir (TTK m. 808):

  1. **Protesto** (resmî belge),
  2. Muhatabın çek üzerine yazdığı, ibraz gününü de gösteren **tarihli beyan**,
  3. Takas odasının, çekin zamanında teslim edildiği hâlde ödenmediğini belirten **tarihli beyanı**.

  Protesto ya da denk belirleme **ibraz süresi geçmeden** yapılmalıdır; ibraz sürenin son gününde yapılmışsa izleyen iş gününde de yapılabilir (TTK m. 809). Hamil başvurma yoluyla ödenmemiş bedeli, ibraz gününden itibaren faizini, protesto ve ihbarname gibi giderleri ve bedelin binde üçünü aşmayan komisyonu isteyebilir (TTK m. 810).

  Sahte veya tahrif edilmiş çeki ödeyen muhatap zarara katlanır; yalnız düzenleyene çek defterini iyi saklamamak gibi bir kusur yüklenebiliyorsa durum değişir (TTK m. 812). Yabancı para üzerinden düzenlenen çekte aynen ödeme şartı yoksa bedel ibraz günündeki değere göre ödenebilir (TTK m. 802).

  ### Zamanaşımı

  Hamilin cirantalara, düzenleyene ve diğer çek borçlularına karşı başvurma hakları **ibraz süresinin bitiminden itibaren üç yıl** geçmekle zamanaşımına uğrar (TTK m. 814/1). Çek borçlularından birinin diğerine karşı hakkı ise çeki ödediği ya da çekin dava yoluyla kendisine karşı ileri sürüldüğü tarihten itibaren üç yılda zamanaşımına uğrar (TTK m. 814/2). Başvurma hakkının zamanaşımına uğraması ya da kaybedilmesi hâlinde **sebepsiz zenginleşme** hükümleri devreye girer. TTK m. 818/1-m ile uygulanan TTK m. 732/4'e göre bu istem, çekin zamanaşımına uğradığı tarihi izleyen tarihten itibaren **bir yıl** geçmekle zamanaşımına uğrar.

  ## 9. 5941 sayılı Kanun: banka ve düzenleyen açısından yaptırımlar

  **Bankanın ödeme yükümlülüğü.** Karşılığı bulunan çek hesabın bulunduğu bankanın herhangi bir şubesine ibraz edilince ödenir; başka şubeye ibrazda o şube karşılığı sorar (5941 sayılı Kanun m. 3/1). Karşılık yetmezse muhatap banka, süresinde ibraz edilen her çek yaprağı için, kanunda belirlenen **sorumluluk tutarını** (karşılık hiç yoksa bu tutarı, kısmen varsa kısmi karşılığa ilave edilecek tutarı) hamile ödemek zorundadır (5941 sayılı Kanun m. 3/3). Kanun metnindeki tutar her yıl Ocak ayında TCMB tarafından fiyat endeksindeki değişmeye göre belirlenir; güncel rakamı mutlaka Resmî Gazete'den kontrol et. Banka bu tutarı ödemekle birlikte karşılıksız kalan kısım için "karşılıksızdır" işlemi yapar (5941 sayılı Kanun m. 3/2). Çek, baskı tarihinden itibaren beş yıl içinde ibraz edilmezse bankanın bu sorumluluğu sona erer (5941 sayılı Kanun m. 3/9). Hamilin parasını geciktiren bankaya her gün için binde üç gecikme cezası uygulanır (5941 sayılı Kanun m. 3/7).

  **Düzenleyenin sorumluluğu.** Kanuni ibraz süresi içinde ibrazda karşılıksızdır işlemine sebebiyet veren kişi hakkında, hamilin şikâyeti üzerine her çek için **binbeşyüz güne kadar adli para cezası** verilir; ceza karşılıksız kalan miktardan az olamaz. Mahkeme ayrıca **çek düzenleme ve çek hesabı açma yasağına** hükmeder (5941 sayılı Kanun m. 5/1). Dava **icra mahkemesinde** görülür. Karşılığı bulundurmakla yükümlü kişi, hesap sahibidir; sahibi tüzel kişiyse mali işleri yürütmekle görevli yönetim organı üyesi sorumludur (5941 sayılı Kanun m. 5/2). Gerçek kişi, adına çek düzenlemesi için temsilci tayin edemez (5941 sayılı Kanun m. 5/3).

  Karşılıksız kalan bedeli, kanuni ibraz tarihinden itibaren ticari işlerde temerrüt faiziyle birlikte tamamen ödeyen kişi hakkında davanın düşmesine karar verilir (5941 sayılı Kanun m. 6/1). Tacirin ticari işletmesiyle ilgili işlemlerinde tacir olmayan kişinin çek defterini kullanarak çek düzenlemek veya düzenletmek de ayrı bir suçtur (5941 sayılı Kanun m. 7/1).

  ## 10. Denetim şeması

  1. Senet çek mi? Unsurlar (TTK m. 780-781), muhatap banka mı (TTK m. 782)?
  2. Devir şekli (TTK m. 785, TTK m. 788) ve cironun geçerliliği (TTK m. 789-793, rehin yasağı).
  3. İbraz süresi ve erken ibraz yasağı (TTK m. 796, geçici 3. madde).
  4. Cayma, çizgi, hesaba geçirilecek kaydı (TTK m. 799, TTK m. 803-805).
  5. Ödememenin tespiti ve süresi (TTK m. 808-809).
  6. Başvurma kapsamı ve zamanaşımı (TTK m. 810, TTK m. 814).
  7. Banka sorumluluğu ve düzenleyenin cezai yaptırımı (5941 sayılı Kanun m. 3, 5).
kritik: |
  - 📌 **Çekte vade ve lehtar zorunlu unsur değildir**; seri numarası ve karekod ise zorunludur (yabancı banka çekinde değil) (TTK m. 780, TTK m. 781/4).
  - 📌 **Muhatap ancak banka olabilir**; başka kişi üzerine çekilen senet yalnız havale hükmündedir (TTK m. 782).
  - 📌 **Çek kabul edilemez.** Kabul kaydı yazılmamış sayılır; faiz şartı da yazılmamış sayılır (TTK m. 784, TTK m. 786).
  - ⚠️ Karşılık veya çek anlaşması olmaması çeki **geçersiz kılmaz**; düzenleyen karşılıksız kalan bedelin %10'unu ve zararı öder (TTK m. 783).
  - 📌 **İbraz süreleri:** aynı yerde 10 gün, başka yerde 1 ay, yurt dışından aynı kıtada 1 ay, ayrı kıtada 3 ay; başlangıç düzenlenme tarihinin ertesi günü (TTK m. 796).
  - 📌 **Erken ibraz:** düzenleme tarihinden önce ibraz 31/12/2028'e kadar geçersizdir (5941 sayılı Kanunun geçici 3. maddesinin beşinci fıkrası).
  - 📌 **Çekten cayma** ancak ibraz süresi geçtikten sonra etkilidir (TTK m. 799).
  - ⚠️ **Hamiline yazılı çeke ciro** çeki emre yazılı yapmaz (TTK m. 791); **muhatabın cirosu batıl**, muhatap lehine ciro makbuz hükmündedir (TTK m. 789).
  - ⚠️ **Çekte rehin cirosu yoktur**: TTK m. 818/1-d, TTK m. 689'a atıf yapmaz.
  - 📌 **Genel çizgili çek** yalnız bankaya veya muhatabın müşterisine ödenir (TTK m. 804/1); "hesaba geçirilecektir" kaydı nakden ödemeyi önler (TTK m. 805).
  - 📌 **Ödememenin tespiti:** protesto, muhatabın tarihli beyanı veya takas odası beyanı; ibraz süresi geçmeden (TTK m. 808, TTK m. 809).
  - 📌 **Zamanaşımı:** başvurma hakları ibraz süresinin bitiminden itibaren 3 yıl (TTK m. 814/1); sebepsiz zenginleşme istemi bir yıl (TTK m. 732/4).
  - 📌 **Yaptırım:** hamilin şikâyeti üzerine icra mahkemesinde binbeşyüz güne kadar adli para cezası ve çek düzenleme ve çek hesabı açma yasağı (5941 sayılı Kanun m. 5/1).
doktrin: |
  ### Çek ödeme aracı mı, kredi aracı mı?

  Kanun, çekin görüldüğünde ödeneceğini ve buna aykırı kaydın yazılmamış sayılacağını söylediği için çek hukuken bir ödeme aracıdır. Uygulamada ise çek çoğu zaman ileri tarihle düzenlenip fiilen vadeli senet gibi kullanılır. Bu durum karşılıksız çek sorununu büyütmüştür. Kanun koyucunun cevabı, bir yandan erken ibraz yasağını geçici olarak sürdürmek, bir yandan karşılıksızdır işlemine karşı cezai yaptırım, banka sorumluluğu ve risk merkezine dayalı bir izleme sistemi kurmak olmuştur. Sınavda "ödeme aracı" niteliğini TTK m. 795/1 ile ilişkilendirmek yeterlidir.

  ### Teminat amaçlı ciro: rehin cirosu mu, inançlı temlik mi?

  Çekte açık veya gizli rehin cirosu yapılamaz. Bankalar ise kredi teminatı olarak çeki sıkça ciro alır. Bu işlemin "gizli rehin cirosu" mu yoksa "teminat amaçlı inançlı temlik cirosu" mu sayılacağı tartışmalıdır. Yargıtay Hukuk Genel Kurulu'nun önceki kararlarında bu sorun gündeme gelmiş; son dönem kararlarından birinde, şekil itibarıyla temlik cirosu olan devrin teminat amacıyla yapılmasının inançlı temlik cirosu olarak geçerli olduğu ve bankanın meşru hamil sayılabileceği oy çokluğuyla kabul edilmiştir. Buna karşılık çekin arkasına "bedeli teminat içindir" gibi açıkça rehni gösteren bir ibare yazılmışsa, ciro rehin cirosu olarak değerlendirilir ve geçerli olmaz. Bu ayrım ispat bakımından önemlidir: ciro şekil itibarıyla temlikse, rehin amacıyla yapıldığını iddia eden borçlu bunu ispatla yükümlüdür.

  ### Başvurma hakkı kaybı ve sebepsiz zenginleşme

  Süresinde ibraz edilmeyen ya da ödememesi gereği gibi tespit edilmeyen çekte hamil, kambiyo borçlularına karşı başvurma hakkını yitirir. Bu noktada TTK m. 818/1-m ile çeke uygulanan TTK m. 732 devreye girer. Zamanaşımı bakımından hangi tarihin esas alınacağı hesaplanırken ibraz süresinin bitiminden başlayan üç yıl ile onu izleyen bir yıl ayrı ayrı düşünülmelidir. Bu iki süre karıştırılırsa olay sorusunda yanlış sonuca varılır.
sozluk:
  - terim: Çek
    tanim: "Muhatabı banka olan, görüldüğünde ödenen, kayıtsız şartsız belirli bir bedelin ödenmesi için verilmiş havale senedi (TTK m. 780, TTK m. 795)."
  - terim: Muhatap
    tanim: "Çekte ödemeyi yapacak kişi; Türkiye'de ödenecek çekte ancak bir banka olabilir (TTK m. 782)."
  - terim: Karşılık
    tanim: "Muhatap bankada düzenleyenin emrine ayrılmış tutar; yokluğu senedin çek olarak geçerliliğini etkilemez (TTK m. 783/1)."
  - terim: Çek anlaşması
    tanim: "Düzenleyenin karşılık üzerinde çek düzenleyerek tasarruf edebileceğine dair banka ile düzenleyen arasındaki açık veya zımni anlaşma (TTK m. 783/1)."
  - terim: İbraz
    tanim: "Çekin ödenmesi için muhataba ya da takas odasına sunulması; süreleri TTK m. 796'dadır."
  - terim: Çizgili çek
    tanim: "Ön yüzüne iki paralel çizgi çekilmiş çek; genel çizgili olabilir ya da özel çizgili olabilir (TTK m. 803-804)."
  - terim: Hesaba geçirilecek çek
    tanim: "Ön yüzüne 'hesaba geçirilecektir' yazılan, yalnız kayden ödenebilen çek (TTK m. 805)."
  - terim: Çekten cayma
    tanim: "Düzenleyenin ödenmemesini bildirmesi; ancak ibraz süresi geçtikten sonra hüküm ifade eder (TTK m. 799)."
  - terim: Karşılıksızdır işlemi
    tanim: "Muhatap bankanın, çekin karşılığının bulunmadığını çek üzerine yazması; hamilin başvurmasına temel olur (5941 sayılı Kanun m. 3)."
  - terim: Çek düzenleme ve çek hesabı açma yasağı
    tanim: "Karşılıksızdır işlemine sebebiyet verene mahkemece uygulanan yasaklama (5941 sayılı Kanun m. 5/1)."
  - terim: Sorumluluk tutarı
    tanim: "Banka, süresinde ibraz edilen karşılıksız her çek yaprağı için kanuna göre ödemekle yükümlü olduğu, TCMB'nin her yıl Ocak ayında güncellediği tutar (5941 sayılı Kanun m. 3/3)."
kararlar:
  - id: "1008178400"
    ozet: |
      Davalı şirketten demir malzeme sipariş eden davacı, siparişe karşılık avans olarak verdiği iki çekin, mal teslim edilmediği hâlde şirket tarafından davalı bankaya kredi teminatı olarak devredildiğini ve çek bedelinin ödenmemesi gerektiğini ileri sürerek menfi tespit ve istirdat davası açmıştır. Çeklerden birinin arkasında bankanın yazdığı "Bedeli teminat içindir" kaydı vardı; diğeri beyaz ciroyla devredilip bankalararası takas odası aracılığıyla elektronik ortamda muhatap bankaya ibraz edilmişti. Hukuk Genel Kurulu, çekte rehin cirosunun yapılamayacağını, çünkü TTK m. 818'in TTK m. 689'a atıf yapmadığını belirtmiş ve "teminat içindir" kaydı bulunan çek bakımından banka meşru hamil olmadığından direnme kararını bozmuştur. İkinci çek bakımından ise beyaz cironun temlik cirosu niteliğinde olduğunu ve çekin takas odası yoluyla muhataba ibraz edildiğini saptayarak bankayı yetkili hamil saymış, bu çek yönünden direnme kararını onamıştır.
  - id: "1042347700"
    ozet: |
      Bir banka, düzenleyene karşı iki çekten dolayı ilamsız icra takibi başlatmış, takibe itiraz üzerine itirazın iptalini istemiştir. Çekler düzenleme yerinde ödenecek çeklerdi ve ibraz süresinin geçmesinden sonra bankaya ibraz edilmişti. İlk derece mahkemesi davayı şu gerekçeyle reddetmiş, istinaf başvurusu esastan reddedilmiş, Yargıtay 11. Hukuk Dairesi de bu kararı oy birliğiyle onamıştır: aynı yerde ödenecek çek 10 gün içinde ibraz edilmelidir (TTK m. 796); başvurma hakkı ibraz süresinin bitiminden itibaren 3 yılda zamanaşımına uğrar (TTK m. 814); sebepsiz zenginleşme istemi ise çekin zamanaşımına uğradığı tarihi izleyen tarihten itibaren 1 yıldır (TTK m. 732/4). Takip bu süreler dolduktan sonra, 2018 yılında yapıldığı için itirazın iptali istemi reddedilmiştir.
sorular:
  - soru: |
      Aşağıdakilerden hangisi çekin TTK m. 780'de sayılan zorunlu unsurlarından biri DEĞİLDİR?
    siklar:
      - "Düzenleyenin imzası"
      - "Muhatabın ticaret unvanı"
      - "Vade"
      - "Düzenlenme tarihi ve yeri"
    dogru: 2
    aciklama: |
      Vade çekin zorunlu unsurları arasında yoktur; çek görüldüğünde ödenir (TTK m. 795/1). Diğer üçü TTK m. 780/1'de sayılan unsurlardır. Poliçe ve bonodaki vade unsuru ile karıştırılması sık yapılan yanılgıdır.
  - soru: |
      Ahmet, Türkiye'de ödenmek üzere, banka olmayan Kaya Ltd. Şti. üzerine "çek" kelimesini taşıyan ve diğer çek unsurlarını içeren bir senet düzenlemiştir. Bu senet hakkında hangisi doğrudur?
    siklar:
      - "Çek olarak geçerlidir, limited şirket muhatap bankadır"
      - "Çek sayılmaz, yalnız havale hükmündedir"
      - "Poliçe hükmündedir"
      - "Bono hükmündedir"
    dogru: 1
    aciklama: |
      Türkiye'de ödenecek çekte muhatap ancak banka olabilir; başka kişi üzerine düzenlenen senet yalnız havale hükmündedir (TTK m. 782). Poliçe veya bono sayılması için o senetlerin kendi unsurlarının bulunması gerekir.
  - soru: |
      Çekin muhatap bankası, çek üzerine "kabul edilmiştir" şerhi yazdırmıştır. Bu şerhin hukuki sonucu nedir?
    siklar:
      - "Banka çek borçlusu olur"
      - "Şerh yazılmamış sayılır"
      - "Şerh çeki bono hâline getirir"
      - "Çek geçersiz hâle gelir"
    dogru: 1
    aciklama: |
      Çekte kabul işlemi yapılamaz; çek üzerine yazılmış kabul kaydı yazılmamış sayılır (TTK m. 784). Çek bundan etkilenmez, banka da bu kayıtla borçlu olmaz.
  - soru: |
      Zeynep Ltd. Şti., Ankara'da düzenlediği çeki İzmir'de ödenmek üzere Selim'e vermiştir. Çek üzerinde yazılı düzenleme tarihi 10 Haziran'dır. Çek için ibraz süresi ile başlangıcı aşağıdakilerden hangisidir?
    siklar:
      - "10 gün, 10 Haziran'dan itibaren"
      - "1 ay, 11 Haziran'dan itibaren"
      - "3 ay, 11 Haziran'dan itibaren"
      - "1 ay, çekin tesliminden itibaren"
    dogru: 1
    aciklama: |
      Düzenlendiği yerden başka bir yerde ödenecek çek bir ay içinde ibraz edilmelidir ve süre, çekte yazılı düzenlenme tarihinin ertesi günü başlar (TTK m. 796/1 ve TTK m. 796/3). Üç ay yalnız ayrı kıtalar arasındaki çekler içindir. Süre tesliminden değil, yazılı tarihten işler.
  - soru: |
      Gökhan, 15 Mart 2027 tarihli çeki 2 Mart 2027'de ödenmek üzere muhatap bankaya ibraz etmiştir. 5941 sayılı Kanunun geçici 3. maddesinin beşinci fıkrasındaki süre devam ederken bu ibraz hakkında hangisi doğrudur?
    siklar:
      - "İbraz geçerlidir, banka çeki 15 Mart'ta öder"
      - "İbraz geçerlidir, banka çeki ibraz günü öder"
      - "İbraz geçersizdir"
      - "İbraz, çeki bonoya dönüştürür"
    dogru: 2
    aciklama: |
      TTK m. 795/2 genel kuralı ibraz günü ödeme olsa da, 5941 sayılı Kanunun geçici 3. maddesinin beşinci fıkrası 31/12/2028 tarihine kadar, üzerinde yazılı düzenleme tarihinden önce çekin ödenmek için muhatap bankaya ibrazını geçersiz saymıştır.
  - soru: |
      Düzenleyen Ece, çeki 10 günlük ibraz süresi içinde, 5. gün bankaya noter ihtarıyla "çekten cayıyorum" bildirmiştir. Hamil Barış çeki 7. gün ibraz etmiş, hesapta karşılık bulunmaktadır. Hangisi doğrudur?
    siklar:
      - "Banka cayma nedeniyle ödeme yapamaz"
      - "Cayma ibraz süresi içinde hüküm ifade etmez, banka karşılığı bulunan çeki öder"
      - "Cayma bildirimi çeki sona erdirir ve hamil düzenleyene başvurur"
      - "Banka karşılıksızdır işlemi yapmak zorundadır"
    dogru: 1
    aciklama: |
      Çekten cayma ancak ibraz süresi geçtikten sonra hüküm ifade eder (TTK m. 799/1). Süre içinde ibraz edilen ve karşılığı bulunan çek ödenir (5941 sayılı Kanun m. 3/1). Karşılık varken karşılıksızdır işlemi yapılamaz.
  - soru: |
      "Hamiline" yazılı bir çeki elinde bulunduran Cem, çeki arkasını imzalayarak Deniz'e vermiştir. Bu ciro bakımından hangisi doğrudur?
    siklar:
      - "Çek bu ciroyla emre yazılı çek hâline gelir"
      - "Ciro hükümsüzdür, Cem hiçbir şekilde sorumlu olmaz"
      - "Çek emre yazılı hâle gelmez, Cem başvurma hükümlerine göre sorumlu olur"
      - "Ciro, alacağın temliki sayılır ve Cem sorumlu olmaz"
    dogru: 2
    aciklama: |
      Hamiline yazılı çeke yapılan ciro, cirantayı başvurma hakkına dair hükümlere göre sorumlu kılar; ama senedin niteliğini değiştirip emre yazılı çek hâline getirmez (TTK m. 791).
  - soru: |
      Hangisi muhatap bankanın çekle ilgili cirosu bakımından doğrudur?
    siklar:
      - "Muhatabın cirosu geçerlidir"
      - "Muhatap lehine ciro, muhatabın başka şubesi lehine olmadıkça makbuz hükmündedir"
      - "Muhatap lehine ciro, çeki nama yazılı hâle getirir"
      - "Muhatap lehine ciro her hâlde batıldır"
    dogru: 1
    aciklama: |
      TTK m. 789/2'ye göre muhatabın cirosu batıldır. TTK m. 789/4'e göre muhatap lehindeki ciro ise yalnız makbuz hükmündedir; muhatabın birden fazla şubesi olup cironun muhatap şubeden başka bir şube üzerine yazılmış olması istisnadır.
  - soru: |
      Üzerine iki paralel çizgi çekilmiş ve çizgilerin arasına hiçbir ibare yazılmamış çek, muhatap banka tarafından kime ödenebilir?
    siklar:
      - "Yalnız bir bankaya veya muhatabın bir müşterisine"
      - "Yalnız çizgiler arasında unvanı yazılı bankaya"
      - "Çeki ibraz eden herkese nakden"
      - "Yalnız düzenleyene"
    dogru: 0
    aciklama: |
      Çizgiler arasına ibare konmamışsa ya da "banka" yazılmışsa çek genel çizgilidir (TTK m. 803/3) ve muhatap bu çeki ancak bir bankaya veya muhatabın bir müşterisine ödeyebilir (TTK m. 804/1). Özel çizgide ise yalnız unvanı yazılı bankaya ödenebilir.
  - soru: |
      Süresinde bankaya ibraz edilen çekin ödenmediğini hamilin hangi belgeyle ispatlaması TTK m. 808'e göre mümkün DEĞİLDİR?
    siklar:
      - "Noter protestosu"
      - "Muhatabın çek üzerine yazdığı, ibraz gününü gösteren tarihli beyan"
      - "Takas odasının tarihli beyanı"
      - "Düzenleyenin telefonda yaptığı sözlü ikrar"
    dogru: 3
    aciklama: |
      Ödememe, protesto, muhatabın tarihli beyanı veya takas odasının tarihli beyanı ile tespit edilir (TTK m. 808/1-a, b, c). Düzenleyenin sözlü ikrarı bu yollardan biri değildir.
  - soru: |
      Süresinde ibraz edilen ve protesto ile ödememesi tespit edilen çekin hamili, başvurma hakları bakımından zamanaşımını hangi tarihten itibaren üç yıl olarak hesaplar?
    siklar:
      - "Çekin düzenlenme tarihinden"
      - "İbraz süresinin bitiminden"
      - "Çekin hamile tesliminden"
      - "Protesto tarihinden"
    dogru: 1
    aciklama: |
      Hamilin cirantalara, düzenleyene ve diğer çek borçlularına karşı başvurma hakları, ibraz süresinin bitiminden itibaren üç yıl geçmekle zamanaşımına uğrar (TTK m. 814/1).
  - soru: |
      Karşılıksız çeke ilişkin 5941 sayılı Kanun m. 5/1 uyarınca, süresinde ibrazda karşılıksızdır işlemine sebebiyet veren kişi hakkında aşağıdakilerden hangisi uygulanır?
    siklar:
      - "Cumhuriyet savcısı re'sen davayı açar, ceza yalnız hapistir"
      - "Hamilin şikâyeti üzerine icra mahkemesinde binbeşyüz güne kadar adli para cezası ve çek düzenleme ve hesap açma yasağı"
      - "Yalnız idari para cezası verilir"
      - "Yalnız çek bedelinin yüzde onu tazminat olarak ödenir"
    dogru: 1
    aciklama: |
      Hamilin şikâyeti üzerine her çek için binbeşyüz güne kadar adli para cezası verilir ve mahkeme çek düzenleme ve çek hesabı açma yasağına hükmeder; davalar icra mahkemesinde görülür (5941 sayılı Kanun m. 5/1). Yüzde on tazminat TTK m. 783/3'teki ayrı bir sorumluluktur.
olaylar:
  - olay: |
      Dilek Tekstil Ltd. Şti. (D), İstanbul'da bulunan Y Bankası'ndaki çek hesabından, Ankara'da düzenlediği ve üzerinde 4 Mart 2027 tarihi yazılı bir çeki Leman Tic. (L) lehine vermiştir. Çek İstanbul'da ödenecektir ve emre yazılıdır. L, nakit sıkıntısı nedeniyle çeki 26 Şubat 2027'de Y Bankası'na ibraz etmiş, banka işlem yapmamıştır. L daha sonra çeki 30 Mart 2027'de yeniden ibraz etmiş, D'nin hesabında karşılık bulunmadığı için banka, ibraz gününü de göstererek çek üzerine "karşılıksızdır" beyanını yazmıştır. Çek hiç ciro edilmemiştir ve hâlâ L'nin elindedir.

      1. 26 Şubat 2027'deki ibrazın hukuki sonucu nedir?
      2. Çekin ibraz süresi ne zaman başlar, ne zaman biter? Son gün Pazar ise ne olur?
      3. Ödememe hangi yollarla tespit edilir ve neden önemlidir?
      4. Y Bankası'nın ve D'nin sorumlulukları nelerdir?
      5. L, zamanaşımı bakımından hangi süreleri dikkate almalıdır?
    olcut:
