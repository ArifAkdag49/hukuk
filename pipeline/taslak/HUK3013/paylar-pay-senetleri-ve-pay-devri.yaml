  - ⚠️ Nama yazılı pay sahibine ıskat ihtarı iadeli taahhütlü mektupla yapılır ve bir ay mektubun alındığı tarihten başlar (TTK m. 483/2).
  - 📌 Bedeli tamamen ödenmemiş paylar için hamiline senet çıkarılamaz; çıkarılırsa geçersizdir (TTK m. 484/2).
  - 📌 Hamiline payın devri: zilyetliğin geçirilmesi ve devralanın MKK'ya bildirimi; bildirim yoksa paya bağlı haklar kullanılamaz (TTK m. 489/1).
  - 📌 Nama yazılı payın hukuki işlemle devri: ciro edilmiş senedin zilyetliğinin geçirilmesi (TTK m. 490/2).
  - ⚠️ Kanuni bağlamda (bedel ödenmemiş nama yazılı pay) ret ancak ödeme yeterliliği şüpheliyse ve teminat verilmemişse mümkündür (TTK m. 491/2).
  - ⚠️ Miras, mal rejimi ve cebrî icrada önemli sebep ileri sürülemez; ret için gerçek değer önerisi şarttır (TTK m. 493/4).
  - 📌 Şirket onay istemini üç ay içinde reddetmezse onay verilmiş sayılır (TTK m. 494/3); gerçek değere devralanın bir aylık itiraz süresi ayrıdır (TTK m. 493/6).
  - 📌 Şirketle ilişkide yalnız pay defterine kayıtlı kişi pay sahibi sayılır; hamiline paylar deftere yazılmaz (TTK m. 499/4).
doktrin: |
  ### MKK bildiriminin hukuki niteliği

  7262 sayılı Kanunla değişen TTK m. 489/1'e göre hamiline yazılı pay devri, şirket ve üçüncü kişiler hakkında ancak MKK'ya yapılan bildirimle hüküm ifade eder. Tartışma, bildirimin payın mülkiyetinin geçişi için **kurucu** olup olmadığındadır. Bir yaklaşım, bildirimin yalnızca paya bağlı hakların şirkete ve üçüncü kişilere karşı ileri sürülebilmesi için gerekli bir şart olduğunu, mülkiyetin devredenle devralan arasında zilyetliğin geçirilmesiyle geçtiğini söyler. Diğer yaklaşım, kanun metnindeki "hüküm ifade eder" ifadesinden hareketle bildirimi devrin etkisinin asıl anı sayar. Konu tartışmalıdır; sınavda kanun metnini ("şirket ve üçüncü kişiler hakkında ... hüküm ifade eder", bildirimsiz haklar kullanılamaz) aktarmak en güvenli yoldur.

  ### Senede bağlanmamış paylarda bağlam

  Esas sözleşmede nama yazılı payların devri şirket onayına bağlanmışsa ve henüz senet veya ilmühaber çıkarılmamışsa bağlam hükümlerinin (TTK m. 492-494) uygulanıp uygulanmayacağı sorulur. Öğretide ve uygulamada bu hükümlerin senetsiz paylara da uygulanması benimsenir; çünkü bağlamın amacı, pay sahipleri çevresinin bileşimini korumaktır ve bu amaç senedin çıkarılmasına bağlı değildir.

  ### Pay defterine kaydın niteliği

  TTK m. 499/4, şirketle ilişkilerde yalnız deftere kayıtlı kişiyi pay sahibi sayar. Buna karşılık Yargıtay uygulaması, usulüne uygun devredilen payın sahibinin, kaydın yapılmaması hâlinde pay sahipliğinin tespiti ve deftere kayıt davası açabileceğini kabul eder; yani kayıt devrin geçerlilik şartı değil, devrin şirkete karşı ileri sürülmesini sağlayan açıklayıcı bir işlemdir.
sozluk:
  - terim: Pay
    tanim: "Anonim şirket sermayesinin bölündüğü, bir kuruş ve katları itibarî değere sahip birim; aynı zamanda ortaklık sıfatını ifade eder."
  - terim: İmtiyazlı pay
    tanim: "Kâr, tasfiye payı, rüçhan veya oy gibi alanlarda üstün bir hak tanıyan ya da kanunda olmayan yeni bir hak veren pay."
  - terim: Tek borç ilkesi
    tanim: "Pay sahibine pay bedeli ve prim ifası dışında borç yüklenememesi (TTK m. 480/1)."
  - terim: İkincil yükümlülük
    tanim: "Devri onaya bağlı paylarda esas sözleşmeyle konabilen, para konusu olmayan ve tekrarlanan edim yükümlülüğü."
  - terim: Iskat
    tanim: "Sermaye borcunu ödemeyen ortağın iştirak taahhüdünden ve kısmi ödemelerden doğan haklarından yoksun bırakılması."
  - terim: Hamiline yazılı pay senedi
    tanim: "Sahibi belirtilmeyen, zilyetlikle devredilen ve devri MKK bildirimiyle hüküm ifade eden senet."
  - terim: Nama yazılı pay senedi
    tanim: "Sahibinin adı yazılı olan, ciro ve zilyetliğin geçirilmesiyle devredilen ve pay defterine kaydedilen senet."
  - terim: İlmühaber
    tanim: "Pay senedi bastırılıncaya kadar verilebilen geçici belge; nama yazılı senet hükümlerine kıyasen uygulanır."
  - terim: Bağlam
    tanim: "Nama yazılı payların devrinin şirket onayına bağlanması."
  - terim: Kaçış klozu
    tanim: "Şirketin, devri reddederken paylarını gerçek değerle devralmayı önermesi."
  - terim: Pay defteri
    tanim: "Nama yazılı ve senetsiz pay sahipleri ile intifa hakkı sahiplerinin kaydedildiği defter."
kararlar:
  - id: "1199854800"
    ozet: |
      Davacı, nama yazılı ilmühaber bastırılmış bir anonim şirketin sermayesinin yarısını oluşturan 6.000 payı, 17.10.2017 tarihli devir sözleşmesi ve cirolanmış ilmühaberlerin zilyetliğini alarak devraldığını ileri sürmüştür. Aynı paylar daha sonra 18.11.2017 tarihli sözleşmeyle diğer davalıya devredilmiş ve bu kişi şirketin tek ortağı olarak görünmüştür. Davacı, payların kendisine ait olduğunun tespitini ve pay defterine kaydını istemiştir. Bölge Adliye Mahkemesi, TTK m. 490 uyarınca ciro ve teslimle yapılan ilk devrin geçerli olduğunu, esas sözleşmede devir sınırlaması bulunmadığını ve devreden payını sattıktan sonra aynı payları ikinci kez devrederek karşı tarafı ortak yapamayacağını kabul ederek davayı tüm davalılar yönünden kabul etmiştir. Yargıtay 11. Hukuk Dairesi bu hükmü onamıştır. Karar, ilmühaberli nama yazılı payların devrinde belirleyici olanın ciro ve zilyetliğin geçişi olduğunu gösterir.
  - id: "1199671600"
    ozet: |
      Davacılar, davalı anonim şirketin %40 hissesini 05.06.2017 tarihli sözleşmeyle devraldıklarını ve hamiline pay senedi asıllarının kendilerine teslim edildiğini belirterek payların pay defterine işlenmesini ve şirkete kayyım atanmasını istemiştir. Mahkemeler, TTK m. 499 uyarınca pay defterine nama yazılı senetlerin kaydedildiğini, hamiline senetlerin deftere kaydedilme olanağı bulunmadığını ve hamiline senetlerde devirden sonra MKK sistemine kayıt yapılabileceğini belirterek davayı reddetmiştir. Yargıtay 11. Hukuk Dairesi, ilk derece ve istinaf mahkemelerinin kararında isabetsizlik görmeyerek reddi onamıştır. Karar, hamiline payların pay defteri yerine MKK kaydıyla takip edildiğini hatırlatır.
sorular:
  - soru: |
      Z A.Ş. paylarını 0,5 kuruş itibarî değerle çıkarmış ve pay bedellerini toplamıştır. Bu paylar hakkında aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Paylar geçerlidir; itibarî değer kendiliğinden 1 kuruşa yükselir"
      - "Paylar geçersizdir; ödemeden doğan haklar saklıdır ve ihraç edenler zarar verdiklerine karşı müteselsilen sorumludur"
      - "Paylar yalnız nama yazılı olarak geçerlidir"
      - "Paylar kesin hükümsüzdür; yapılan ödemeler hiçbir şekilde istenemez"
    dogru: 1
    aciklama: |
      Payın itibarî değeri en az bir kuruştur; buna aykırı çıkarılan paylar geçersizdir, ancak pay için yapılan ödemeden doğan haklar saklıdır ve ihraç edenler zarar verdikleri kişilere karşı müteselsilen sorumludur (TTK m. 476/1-2). Ödemeden doğan haklar saklı olduğundan ödemelerin istenemeyeceği söylenemez.
  - soru: |
      Anonim şirkette oyda imtiyazlı paylara ilişkin aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Bir paya en çok 15 oy verilebilir; esas sözleşme değişikliği kararında oyda imtiyaz kullanılamaz"
      - "Bir paya en çok 5 oy verilebilir; her kararda kullanılır"
      - "Bir paya sınırsız oy verilebilir; yalnız yönetim kurulu seçiminde kullanılamaz"
      - "Oyda imtiyaz yalnızca halka açık şirketlerde tanınabilir"
    dogru: 0
    aciklama: |
      Bir paya en çok onbeş oy hakkı tanınabilir; kurumlaşma veya haklı sebep hâlinde mahkeme istisna tanıyabilir (TTK m. 479/2). Oyda imtiyaz esas sözleşme değişikliği ile ibra ve sorumluluk davası açılması kararlarında kullanılamaz (TTK m. 479/3).
  - soru: |
      X A.Ş. esas sözleşmesi, pay sahiplerine zarar çıkması hâlinde pay başına 500 TL ek ödeme yapma yükümlülüğü getirmiş ve payların devrini yönetim kurulu onayına bağlamıştır. Bu hükümle ilgili hangisi doğrudur?
    siklar:
      - "Ek ödeme yükümlülüğü, devir onaya bağlı olduğu için geçerlidir"
      - "Ek ödeme hükmü anonim şirkette tek borç ilkesine aykırıdır; onaya bağlı paylarda ancak para dışı, tekrarlanan edimler yüklenebilir"
      - "Ek ödeme yalnız en çok itibarî değerin iki katı kadar öngörülebilir"
      - "Ek ödeme hükmü ancak genel kurul oybirliğiyle konabilir"
    dogru: 1
    aciklama: |
      Esas sözleşmeyle pay sahibine pay bedeli ve prim ifası dışında borç yüklenemez (TTK m. 480/1). Devri onaya bağlı paylarda yalnızca konusu para olmayan, belli zamanlarda tekrarlanan edimler yüklenebilir (TTK m. 480/4). İtibarî değerin iki katı sınırı limited şirkete özgü ek ödeme düzenlemesinde yer alır (TTK m. 603).
  - soru: |
      Ortak Ali, sermaye borcunun son taksitini esas sözleşmede belirlenen vadede ödememiştir. Şirket hiçbir ihtar çekmemiştir. Ali bakımından hangisi doğrudur?
    siklar:
      - "Ali ihtar çekilmedikçe hiçbir yükümlülük altına girmez"
      - "Ali ihtara gerek olmaksızın temerrüt faizi ödemekle yükümlüdür"
      - "Ali ancak yönetim kurulunun ödemeye çağrı ilanı yaptığı tarihten itibaren faiz öder"
      - "Ali temerrüt hâlinde otomatik olarak payından yoksun kalır"
    dogru: 1
    aciklama: |
      Sermaye koyma borcunu süresi içinde yerine getirmeyen pay sahibi, ihtara gerek olmaksızın temerrüt faizi öder (TTK m. 482/1). Haklardan yoksun bırakma (ıskat) ise ayrıca bir aylık süreli ihtar usulünü gerektirir (TTK m. 483/1); otomatik kayıp yoktur.
  - soru: |
      Nama yazılı pay senedi sahibi olan ortağı ıskat etmek isteyen yönetim kurulunun yapması gereken aşağıdakilerden hangisidir?
    siklar:
      - "Yalnızca gazete ilanı yapmak yeterlidir"
      - "İhtarı iadeli taahhütlü mektupla ve internet sitesi mesajıyla yapmak; bir aylık süre mektubun alındığı tarihten başlar"
      - "İhtarı noterden çekmek zorundadır; başka yol yoktur"
      - "Genel kurul kararı almak ve bir hafta süre vermek"
    dogru: 1
    aciklama: |
      Nama yazılı pay senedi sahiplerine davet ve ihtar, ilan yerine iadeli taahhütlü mektupla ve internet sitesi mesajı ile yapılır; bir aylık süre mektubun alındığı tarihten başlar (TTK m. 483/2). Süre bir aydır, bir hafta değildir (TTK m. 483/1).
  - soru: |
      Y A.Ş., ödenmiş sermayesinin yalnızca %60'ı karşılanmış paylar için hamiline yazılı pay senedi bastırıp dağıtmıştır. Bu senetler hakkında hangisi doğrudur?
    siklar:
      - "Senetler geçerlidir; kalan bedel hamilden istenir"
      - "Senetler yalnızca devredilemez olarak geçerlidir"
      - "Senetler geçersizdir; iyiniyet sahiplerinin tazminat hakları saklıdır"
      - "Senetler nama yazılı sayılır"
    dogru: 2
    aciklama: |
      Bedelleri tamamen ödenmemiş paylar için hamiline yazılı pay senedi çıkarılamaz; çıkarılanlar geçersizdir ve iyiniyet sahiplerinin tazminat hakları saklıdır (TTK m. 484/2). Kendiliğinden nama yazılıya dönüşme gibi bir sonuç kanunda yoktur.
  - soru: |
      Zeynep, hamiline yazılı pay senetlerini Mehmet'ten teslim almıştır, ancak Merkezi Kayıt Kuruluşuna bildirimde bulunmamıştır. Zeynep bakımından hangisi doğrudur?
    siklar:
      - "Zeynep pay sahibi hakları serbestçe kullanabilir; bildirim yalnızca idari bir düzenlemedir"
      - "Zeynep, bildirim yapılıncaya kadar kanundan doğan paya bağlı haklarını kullanamaz"
      - "Zeynep'in iktisabı kesin hükümsüzdür ve senetleri iade etmelidir"
      - "Zeynep pay defterine kaydedilerek haklarını kullanabilir"
    dogru: 1
    aciklama: |
      Hamiline yazılı pay senetlerinin devri, şirket ve üçüncü kişiler hakkında ancak zilyetliğin geçirilmesiyle payı devralan tarafından MKK'ya yapılacak bildirimle hüküm ifade eder; bildirim yapılmazsa paya bağlı haklar bildirim yapılıncaya kadar kullanılamaz (TTK m. 489/1). Hamiline paylar pay defterine yazılmaz (TTK m. 499/1).
  - soru: |
      Bedeli tamamen ödenmemiş nama yazılı payını Selin'e devretmek isteyen Murat'ın devrine yönetim kurulu onay vermemektedir. Şirket onayı hangi sebeple reddedebilir?
    siklar:
      - "Selin'in şirketin rakibi olması sebebiyle"
      - "Selin'in ödeme yeterliliği şüpheliyse ve istenen teminat verilmemişse"
      - "Esas sözleşmede bağlam olmasa da dilediği her sebeple"
      - "Yönetim kurulu üyelerinden birinin Selin'i tanımaması sebebiyle"
    dogru: 1
    aciklama: |
      Bedeli tamamen ödenmemiş nama yazılı paylar ancak şirketin onayıyla devredilir; şirket yalnızca devralanın ödeme yeterliliği şüpheli ise ve istenen teminat verilmemişse onayı reddedebilir (TTK m. 491/1-2). Başka sebep kanuni bağlamda ileri sürülemez.
  - soru: |
      Borsaya kote olmayan B A.Ş. esas sözleşmesi, rakip şirket ortaklarının B A.Ş. pay sahibi olmasını önemli ret sebebi saymaktadır. Pay sahibi Cemal ölmüş, payları mirasçısı Selin'e geçmiştir; Selin rakip şirketin ortağıdır. Şirketin onayı reddedebilmesi için ne gerekir?
    siklar:
      - "Esas sözleşmedeki önemli sebebe dayanması yeterlidir"
      - "Payları gerçek değeriyle devralmayı önermesi gerekir"
      - "Genel kurulun oybirliğiyle ret kararı alması gerekir"
      - "Ret mümkün değildir; mirasçı her hâlde oy hakkıyla pay sahibi olur"
    dogru: 1
    aciklama: |
      Paylar miras gereği iktisap edilmişse şirket, payı edinene sadece paylarını gerçek değeriyle devralmayı önerdiği takdirde onay vermeyi reddedebilir (TTK m. 493/4). Önemli sebep bu hâlde yeterli olmaz. Ret tümüyle yasak da değildir; genel kurul oybirliği de aranmaz.
  - soru: |
      Nama yazılı payların devrine ilişkin onay istemini alan şirket, üç ay içinde hiçbir cevap vermemiştir. Sonuç hangisidir?
    siklar:
      - "İstem reddedilmiş sayılır"
      - "Onay verilmiş sayılır"
      - "Devralan gerçek değer önerisini kabul etmiş sayılır"
      - "Süre bir yıla uzar"
    dogru: 1
    aciklama: |
      Şirket, onaylamaya ilişkin istemi aldığı tarihten itibaren en geç üç ay içinde reddetmemişse veya ret haksızsa onay verilmiş sayılır (TTK m. 494/3). Gerçek değer önerisine bir ay içinde itiraz edilmemesi ise ayrı bir kural olup öneriyi kabul sonucunu doğurur (TTK m. 493/6).
  - soru: |
      Pay defterine ilişkin hangisi doğrudur?
    siklar:
      - "Hamiline yazılı paylar da pay defterine kaydedilir"
      - "Şirketle ilişkilerde yalnız pay defterinde kayıtlı kimse pay sahibi olarak kabul edilir"
      - "Devralan, devri ispat etmese de deftere yazılabilir"
      - "Pay defterine kayıt, ciro ve zilyetlik olmaksızın nama yazılı payı kendiliğinden devreder"
    dogru: 1
    aciklama: |
      Şirketle ilişkilerde yalnız pay defterinde kayıtlı kimse pay sahibi sayılır (TTK m. 499/4). Defter nama yazılı ve senetsiz payları ile intifa hakkı sahiplerini kapsar (TTK m. 499/1); devralan, devrin usulüne uygun yapıldığını ispatlamadıkça deftere yazılamaz (TTK m. 499/2).
  - soru: |
      Anonim şirket genel kurulu, esas sözleşmeyi değiştirerek bazı paylara kâr payında imtiyaz tanıyan yeni bir pay grubu oluşturmak istemektedir. Karar için aşağıdaki nisaplardan hangisi gerekir?
    siklar:
      - "Sermayenin en az %75'ini oluşturan payların sahiplerinin olumlu oyu"
      - "Toplantıda hazır bulunan oyların salt çoğunluğu"
      - "Sermayenin tümünü oluşturan payların sahiplerinin oybirliği"
      - "Sermayenin en az dörtte birinin olumlu oyu"
    dogru: 0
    aciklama: |
      İmtiyazlı pay oluşturulması, sermayenin en az yüzde yetmişbeşini oluşturan payların sahiplerinin veya temsilcilerinin olumlu oylarıyla alınır (TTK m. 421/3). Oybirliği, bilanço zararlarının kapatılması için yükümlülük koyan kararlar gibi başka konulara özgüdür (TTK m. 421/2).
olaylar:
  - olay: |
      Borsaya kote olmayan Marmara Gıda A.Ş.'nin esas sözleşmesi, ortaklara şu hükümleri yüklemektedir: (i) şirket zarar ederse her ortak, payının itibarî değeri kadar ek ödeme yapacaktır; (ii) nama yazılı payların devri yönetim kurulu onayına bağlıdır ve her nama yazılı pay sahibi yılda üç hafta şirkette ücretsiz teknik danışmanlık verecektir.

      Ortak Hakan, esas sermaye taahhüdünün son taksitini esas sözleşmede belirlenen vadede ödememiştir. Yönetim kurulu bir ihtar çekmeden, aynı hafta içinde Hakan'ı ıskat etmiş ve payını satmıştır. Hakan'ın bir yakını da şirketin ödenmemiş bedelli payları için hamiline yazılı pay senetleri basılıp dağıtıldığını öğrenmiştir.

      1. Esas sözleşmenin (i) ve (ii) numaralı hükümlerinin geçerliliğini değerlendiriniz.
      2. Hakan'ın vadeden itibaren ödemesi gereken bir şey var mı, ıskat kararı geçerli midir?
      3. Hamiline pay senetlerinin durumunu değerlendiriniz.
    olcut:
      - {tespit: "Anonim şirkette nakdî ek ödeme yükümlülüğü tek borç ilkesine aykırıdır", puan: 20, madde: "TTK m. 480/1"}
      - {tespit: "Devri onaya bağlı paylarda konusu para olmayan, tekrarlanan ikincil yükümlülük geçerlidir", puan: 10, madde: "TTK m. 480/4"}
      - {tespit: "Hakan ihtara gerek olmaksızın temerrüt faizi öder", puan: 20, madde: "TTK m. 482/1"}
      - {tespit: "Iskat için bir ay süreli ve ıskat uyarılı ihtar zorunludur; ihtarsız ıskat geçersizdir", puan: 25, madde: "TTK m. 483/1"}
      - {tespit: "Bedeli ödenmemiş paylar için çıkarılan hamiline senetler geçersizdir", puan: 15, madde: "TTK m. 484/2"}
      - {tespit: "Mütemerrit ortağın yeni pay sahibinin ödemelerinden açık kalan tutar için sorumluluğu", puan: 10, madde: "TTK m. 483/3"}
    cozum: |
      **Nitelendirme:** Olay, anonim şirkette pay sahibinin borçları (tek borç ilkesi), sermaye borcunda temerrüdün sonuçları ve ıskat usulü ile hamiline pay senedi çıkarma şartlarına ilişkindir.

      **Hukuki sorunlar:** (1) Esas sözleşmeye konan yükümlülüklerin geçerliliği. (2) Temerrüt faizi ve ıskat kararının usulü. (3) Bedeli ödenmemiş paylar için hamiline senet.

      **İlgili hükümler ve değerlendirme:** Anonim şirkette kanundaki istisnalar dışında esas sözleşmeyle pay sahibine pay bedelini veya primi ifa dışında borç yüklenemez (TTK m. 480/1). Bu nedenle zarar hâlinde nakdî ek ödeme yükümlülüğü geçersizdir; limited şirkette öngörülebilen ek ödeme (TTK m. 603) anonim şirkete uygulanmaz. Buna karşılık pay devirleri şirketin onayına bağlı olduğundan, esas sözleşmeyle konusu para olmayan ve belli zamanlarda tekrarlanan edimler yüklenebilir (TTK m. 480/4); yılda üç hafta ücretsiz danışmanlık bu nitelikte olup geçerlidir.

      Hakan sermaye borcunu süresinde ödemediğinden, ihtar çekilmesine gerek olmaksızın temerrüt faizi ödemekle yükümlüdür (TTK m. 482/1). Yönetim kurulu ayrıca onu haklarından yoksun bırakmaya ve payını satıp yerine başkasını almaya yetkilidir (TTK m. 482/2); ancak bu yetkinin kullanılması için TTK m. 483/1'deki ihtar usulü zorunludur: ilan ve internet sitesi mesajı (nama yazılı pay sahibi için iadeli taahhütlü mektup ve internet sitesi mesajı, TTK m. 483/2), bir aylık ödeme süresi ve ıskat uyarısı. Olayda ihtar çekilmediğinden ıskat kararı geçersizdir. Yönetim kurulu usulüne uygun ihtardan sonra payı sattığında Hakan, yeni pay sahibinin ödemelerinden açık kalan tutar için şirkete karşı sorumlu kalır (TTK m. 483/3).

      Bedelleri tamamen ödenmemiş paylar için hamiline yazılı pay senedi çıkarılamaz; çıkarılanlar geçersizdir, iyiniyet sahiplerinin tazminat hakları saklıdır (TTK m. 484/2). Yönetim kurulunun bastırıp dağıttığı senetler bu nedenle geçersizdir.

      **Sonuç:** Nakdî ek ödeme hükmü geçersiz, ikincil yükümlülük hükmü geçerlidir; Hakan ihtarsız temerrüt faizi öder, ancak ihtarsız ıskat kararı geçersizdir; ödenmemiş bedelli paylar için basılan hamiline senetler geçersizdir.
  - olay: |
      Borsaya kote olmayan Doğan Lojistik A.Ş.'nin esas sözleşmesinde, nama yazılı payların devri yönetim kurulu onayına bağlanmış ve "şirketle rekabet eden işletmelerin ortak veya yöneticilerinin pay sahibi olması, şirketin ekonomik bağımsızlığını tehlikeye sokacağından reddi haklı kılan önemli sebep sayılır" hükmü konulmuştur; bu hükmün şirketin ekonomik bağımsızlığını korumaya hizmet ettiği kabul edilmektedir.

      Pay sahibi Ayşe, payını ciro edip senet zilyetliğini devrederek rakip şirketin ortağı Murat'a devretmek istemiştir. Yönetim kurulu, hiçbir öneri sunmadan esas sözleşmedeki önemli sebebe dayanarak onay istemini reddetmiştir. Öte yandan ortak Cemal ölmüş, payları mirasçısı Selin'e geçmiştir; Selin de rakip şirketin ortağıdır. Yönetim kurulu aynı sebeple Selin'e hiçbir öneri sunmadan onay vermeyi reddetmiştir. Selin, payların gerçek değeriyle devralınmasına itiraz etmek istemektedir.

      1. Ayşe'nin Murat'a devrine ilişkin retin geçerliliğini ve payın kimde kaldığını değerlendiriniz.
      2. Selin yönünden yönetim kurulunun retini ve Selin'in pay üzerindeki haklarının durumunu değerlendiriniz.
      3. Şirket sonradan Selin'e gerçek değerle devralma önerirse Selin'in hakları ve süreler neler olur?
    olcut:
      - {tespit: "İradi devirde esas sözleşmedeki önemli sebep ileri sürülerek onay reddedilebilir", puan: 20, madde: "TTK m. 493/1-2"}
      - {tespit: "Onay verilmedikçe mülkiyet ve haklar devredende kalır", puan: 15, madde: "TTK m. 494/1"}
      - {tespit: "Miras yoluyla iktisapta önemli sebep ileri sürülemez; ret için gerçek değer önerisi şarttır", puan: 25, madde: "TTK m. 493/4"}
      - {tespit: "Mirasta mülkiyet ve mali haklar derhâl geçer; oy hakkı onaya kadar bekler", puan: 15, madde: "TTK m. 494/2"}
      - {tespit: "Gerçek değer asliye ticaret mahkemesince belirlenebilir; giderler şirketçe karşılanır", puan: 15, madde: "TTK m. 493/5"}
      - {tespit: "Devralan bir ay içinde reddetmezse öneri kabul edilmiş sayılır", puan: 10, madde: "TTK m. 493/6"}
    cozum: |
      **Nitelendirme:** Borsaya kote olmayan anonim şirkette nama yazılı payların esas sözleşmesel bağlamı ve iradi devir ile miras yoluyla iktisabın farklı sonuçları söz konusudur.

      **Hukuki sorunlar:** (1) İradi devirde onayın reddi. (2) Mirasçıya karşı ret. (3) Gerçek değer önerisi, değerleme ve süreler.

      **İlgili hükümler ve değerlendirme:** Esas sözleşme nama yazılı payların ancak şirketin onayıyla devredilebileceğini öngörebilir (TTK m. 492/1). Hukuki işlemle devir ciro edilmiş senedin zilyetliğinin geçirilmesiyle yapılsa da (TTK m. 490/2), bağlam varsa onay gerekir. İradi devirde şirket, esas sözleşmede öngörülmüş önemli bir sebep ileri sürerek onayı reddedebilir; pay sahipleri çevresinin bileşimine ilişkin hükümler işletmenin ekonomik bağımsızlığı yönünden reddi haklı gösteriyorsa önemli sebep oluşur (TTK m. 493/1-2). Olayda bu şart bulunduğundan Ayşe-Murat devri bakımından ret geçerlidir ve şirket ayrıca gerçek değer önermek zorunda değildir. Onay verilmediği sürece payların mülkiyeti ve tüm haklar devreden Ayşe'de kalır (TTK m. 494/1).

      Selin ise payı miras yoluyla iktisap etmiştir. Bu hâlde şirket önemli sebep ileri süremez; onayı ancak payları gerçek değeriyle devralmayı önererek reddedebilir (TTK m. 493/4). Yönetim kurulu hiçbir öneri sunmadan önemli sebebe dayandığından Selin bakımından ret kanuni şartı taşımamaktadır. Ayrıca miras gereği iktisapta mülkiyet ve malvarlığına ilişkin haklar derhâl Selin'e geçer; yalnız genel kurula katılma ve oy hakları şirketin onayına kadar bekler (TTK m. 494/2). Şirket onay istemini en geç üç ay içinde reddetmemişse veya ret haksızsa onay verilmiş sayılır (TTK m. 494/3).

      Şirket sonradan Selin'e gerçek değerle devralma önerirse, Selin paylarının gerçek değerinin belirlenmesini şirket merkezinin bulunduğu yerdeki asliye ticaret mahkemesinden isteyebilir; mahkeme şirketin karar tarihine en yakın tarihteki değeri esas alır ve değerleme giderlerini şirket karşılar (TTK m. 493/5). Selin, gerçek değeri öğrendiği tarihten itibaren bir ay içinde bu fiyatı reddetmezse şirketin devralma önerisini kabul etmiş sayılır (TTK m. 493/6).

      **Sonuç:** Ayşe-Murat devrinde ret geçerlidir ve paylar Ayşe'de kalır; Selin yönünden önemli sebeple yapılan ret yetersizdir, mali haklar derhâl Selin'e geçmiştir; şirket ancak gerçek değer önerisiyle onayı reddedebilir ve Selin'in bir aylık itiraz süresi vardır.
kartlar:
  - on: "Payın asgari itibarî değeri nedir?"
    arka: "En az 1 kuruş; birer kuruş ve katları olarak yükseltilir. Aykırı paylar geçersizdir (TTK m. 476)."
  - on: "Bir paya en çok kaç oy verilebilir?"
    arka: "15 oy; esas sözleşme değişikliği ile ibra ve sorumluluk davası açılması kararlarında oyda imtiyaz kullanılamaz (TTK m. 479/2-3)."
  - on: "İmtiyazlı pay oluşturma kararının nisabı?"
    arka: "Sermayenin en az %75'ini oluşturan payların olumlu oyu (TTK m. 421/3)."
  - on: "Tek borç ilkesi nedir?"
    arka: "Pay sahibine pay bedeli ve prim ifası dışında borç yüklenemez; nakdî ek ödeme konulamaz (TTK m. 480/1)."
  - on: "İkincil yükümlülük hangi payda ve nasıl olur?"
    arka: "Devri onaya bağlı paylarda, konusu para olmayan ve belli zamanlarda tekrarlanan edimler (TTK m. 480/4)."
  - on: "Temerrüt faizi için ihtar gerekir mi?"
    arka: "Hayır, ihtarsız temerrüt faizi işler (TTK m. 482/1)."
  - on: "Iskat için ihtar şartı?"
    arka: "Bir ay süreli, ıskat uyarılı ihtar; nama yazılıya iadeli taahhütlü mektup, süre mektubun alındığı tarihten başlar (TTK m. 483)."
  - on: "Bedeli ödenmemiş pay için hamiline senet?"
    arka: "Çıkarılamaz; çıkarılırsa geçersizdir (TTK m. 484/2)."
  - on: "Hamiline payın devri nasıl yapılır?"
    arka: "Zilyetliğin geçirilmesi ve devralanın MKK'ya bildirimi; bildirimsiz haklar kullanılamaz (TTK m. 489/1)."
  - on: "Nama yazılı payın hukuki işlemle devri?"
    arka: "Ciro edilmiş senedin zilyetliğinin devralana geçirilmesi (TTK m. 490/2)."
  - on: "Miras yoluyla iktisapta şirket onayı nasıl reddeder?"
    arka: "Yalnızca gerçek değerle devralmayı önererek; önemli sebep ileri sürülemez (TTK m. 493/4)."
  - on: "Onay istemine şirket kaç ay içinde cevap vermelidir?"
    arka: "En geç üç ay; reddetmezse onay verilmiş sayılır (TTK m. 494/3)."
