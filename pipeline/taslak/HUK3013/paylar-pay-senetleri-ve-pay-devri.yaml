  - 📌 İmtiyazlı pay oluşturulması ve nama yazılı pay devrinin sınırlandırılması kararları için sermayenin en az %75'i gerekir (TTK m. 421/3).
  - ⚠️ Anonim şirkette nakdî ek ödeme yükümlülüğü konulamaz (TTK m. 480/1); limited şirketteki ek ödeme (TTK m. 603) ile karıştırma.
