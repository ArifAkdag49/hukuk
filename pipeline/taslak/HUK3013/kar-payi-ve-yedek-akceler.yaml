kararlar:
  - id: "1213844500"
    ozet: |
      Davacı, kazanç payı dağıtan şirketin ortağı olan başka bir şirketin pay sahibidir. Davaya konu şirketin genel kurulunda, icra görevi bulunmayan iki yönetim kurulu üyesine toplam 1.683.561,27 TL kazanç payı verilmesine oybirliğiyle karar verilmiştir. Davacı, bu payın pay sahiplerine temettü olarak dağıtılması gerektiğini, kazanç payının örtülü kâr dağıtımı olduğunu ve oy kullanan yöneticilerin şirketin ortağını zarara uğrattığını ileri sürerek tazminat istemiştir. Dosyada, 2.710.000 TL ödenmiş sermayenin %5'i olan 135.500 TL birinci temettünün dağıtılmasından sonra kalan 16.835.612,67 TL'nin %10'unun kazanç payı olarak verildiği, genel kanuni yedek akçe ayrımının ise esas sözleşmedeki tavana ulaşıldığı için yapılmadığı belirtilmiştir. Mahkemeler, kararın kanun ve esas sözleşmeye aykırı olmadığını, bu nedenle yöneticilerin hukuka aykırı bir eyleminin bulunmadığını kabul etmiş; Yargıtay 11. Hukuk Dairesi de davanın reddine ilişkin kararı onamıştır. Karar, TTK m. 511'in yöneticinin icracı olup olmamasına bakmadan, ancak şartlara uyulmuşsa kazanç payına izin verdiğini gösterir.
  - id: "1227641400"
    ozet: |
      Üç eşit paylı bir limited şirkette yönetimde yer almayan davacı ortak, genel kurulun 2023 finansal tablolarını onayan kararının TTK m. 515'e aykırı olduğunu ve iki müdüre ayrı ayrı aylık 400.000 TL huzur hakkı verilmesine ilişkin kararın örtülü kâr payı dağıtımı olduğunu ileri sürerek iptal istemiştir. Mahkemeler finansal tablolarda gerçeğe aykırı somut bir hususun gösterilmediğini kabul ederek bu istemi reddetmiş; yıllık toplam 9.600.000 TL'yi bulan huzur hakkı kararını ise şirketin kârının yaklaşık iki katı olduğu, 2023 kârını eriteceği, emsallerle uyumuna dair delil sunulmadığı ve davacının kâr payı alma hakkını engelleyecek ölçüde fahiş olduğu gerekçesiyle iptal etmiştir. Yargıtay 11. Hukuk Dairesi bu kararı onamıştır. Karar limited şirkete ilişkindir ve kâr payı hakkının yönetici ücretiyle boşa çıkarılmasına karşı koruma sağlama bakımından örnek niteliğindedir.
sorular:
  - soru: |
      A.Ş.'de Ali'nin payının itibarî değeri 100.000 TL olup bunun 40.000 TL'si ödenmiştir. Ayşe'nin aynı itibarî değerli payının 80.000 TL'si ödenmiştir. Esas sözleşmede kâr dağıtımı hakkında hüküm yoktur. Kâr payı paylaşımı nasıl olur?
    siklar:
      - "Eşit itibarî değer nedeniyle Ali ve Ayşe eşit kâr payı alır"
      - "Kâr payı pay sahiplerinin ödemeleriyle orantılıdır; Ayşe, Ali'nin iki katı alır"
      - "Kâr payı yalnızca tam ödenmiş paylara dağıtılır"
      - "Ayşe 80.000 TL, Ali 40.000 TL tutarında sabit kâr payı alır"
    dogru: 1
    aciklama: |
      Esas sözleşmede aksine hüküm yoksa kâr ve tasfiye payı, pay sahibinin sermaye payı için şirkete yaptığı ödemelerle orantılı hesaplanır (TTK m. 508/1). Ali 40.000, Ayşe 80.000 TL ödediğinden Ayşe iki kat pay alır. Tam ödenmiş paya sınırlama kanunda yoktur; sabit tutar ödemesi de sermaye için faiz yasağıyla bağdaşmaz (TTK m. 509/1).
  - soru: |
      Anonim şirket esas sözleşmesinde pay sahiplerine her yıl ödenmiş sermayeleri üzerinden %8 sabit faiz ödeneceği yazılmıştır. Bu hüküm hakkında hangisi doğrudur?
    siklar:
      - "Geçerlidir; faiz kâr olmasa da ödenir"
      - "Sermaye için faiz ödenemeyeceğinden hüküm TTK m. 509/1'e aykırıdır"
      - "Yalnız yönetim kurulu üyesi olan ortaklara ödenebilir"
      - "Genel kurulda oybirliği sağlanırsa geçerli olur"
    dogru: 1
    aciklama: |
      Sermaye için faiz ödenemez (TTK m. 509/1). Hazırlık dönemi faizi (TTK m. 510) esas sözleşmede öngörülebilen istisna olup işletme tam faaliyete başlayana kadarki dönemle sınırlıdır; sürekli yıllık faiz bu istisnaya girmez.
  - soru: |
      Kâr payının hangi kaynaklardan dağıtılabileceğine ilişkin aşağıdakilerden hangisi doğrudur?
    siklar:
      - "Ödenmiş sermayeden ve genel kanuni yedek akçeden"
      - "Net dönem kârından ve serbest yedek akçelerden"
      - "Yalnız net dönem kârından"
      - "Yalnız yedek akçelerden"
    dogru: 1
    aciklama: |
      Kâr payı ancak net dönem kârından ve serbest yedek akçelerden dağıtılabilir (TTK m. 509/2).
  - soru: |
      Ödenmiş sermayesi 5.000.000 TL olan Y A.Ş.'de genel kurul, kanuni yedek akçe için belirli ayrım yapılmış olmasına rağmen pay sahiplerine hiçbir kâr payı dağıtmadan yönetim kurulu üyelerine net kârdan kazanç payı vermeye karar vermiştir. Bu karar hakkında hangisi doğrudur?
    siklar:
      - "Kanuni yedek akçe ayrıldığı için karar geçerlidir"
      - "Pay sahiplerine ödenmiş sermayenin %5'i oranında kâr payı dağıtılmadan kazanç payı verilemeyeceğinden karar TTK m. 511/1'e aykırıdır"
      - "Kazanç payı serbest yedek akçeden verilebileceğinden karar geçerlidir"
      - "Yönetim kurulu üyelerine kazanç payı hiçbir hâlde verilemez"
    dogru: 1
    aciklama: |
      Yönetim kurulu üyelerine kazanç payı sadece net kârdan ve ancak kanuni yedek akçe için belirli ayrım yapıldıktan ve pay sahiplerine ödenmiş sermayenin %5'i oranında veya esas sözleşmedeki daha yüksek oranda kâr payı dağıtıldıktan sonra verilebilir (TTK m. 511/1). Üç şart birlikte aranır; tek başına yedek akçe ayrımı yetmez. Kazanç payı serbest yedek akçeden de verilemez.
  - soru: |
      Haksız yere kâr payı alan pay sahibinden iade istenmesine ilişkin hangisi doğrudur?
    siklar:
      - "Kötüniyetle alan geri vermekle yükümlüdür; geri alma hakkı paranın alındığı tarihten itibaren beş yılda zamanaşımına uğrar"
      - "İyiniyetli alıcı da iade eder; süre iki yıldır"
      - "Kötüniyetle alan geri vermekle yükümlüdür; süre bilançonun onaylandığı tarihten üç yıldır"
      - "İade istenemez; kâr payı kesin kazanılmıştır"
    dogru: 0
    aciklama: |
      Haksız yere ve kötüniyetle kâr payı veya hazırlık dönemi faizi alan pay sahipleri bunları geri vermekle yükümlüdür; geri alma hakkı paranın alındığı tarihten itibaren beş yıl geçmekle zamanaşımına uğrar (TTK m. 512). İflas hâlindeki yönetici iadesi ise TTK m. 513'te ayrıca düzenlenmiştir.
  - soru: |
      Z A.Ş. iflas etmiştir. Yönetim kurulu üyesi Murat, iflastan iki yıl önce uygun ücreti aşan ve bilanço uygun ücrete göre düzenlenseydi ödenmemesi gereken 800.000 TL'yi hizmetine karşılık almıştır. Murat bakımından hangisi doğrudur?
    siklar:
      - "Murat iflasın açılmasından önceki son üç yıl içinde aldığı bu parayı şirket alacaklılarına karşı geri vermekle yükümlüdür"
      - "Murat hiçbir hâlde iade etmez; yalnız kötüniyetli pay sahipleri iade eder"
      - "Murat beş yıl geçmedikçe iade etmek zorunda değildir"
      - "Murat yalnızca pay sahiplerine karşı sorumludur"
    dogru: 0
    aciklama: |
      Şirketin iflası hâlinde yönetim kurulu üyeleri, iflasın açılmasından önceki son üç yıl içinde aldıkları ve uygun ücreti aşan, bilanço uygun ücrete göre tedbirli düzenlenseydi ödenmemesi gereken paraları şirket alacaklılarına karşı geri vermekle yükümlüdür (TTK m. 513/1). Beş yıllık süre TTK m. 512'deki olağan iade içindir.
  - soru: |
      Yönetim kurulunun finansal tabloları, eklerini ve yıllık faaliyet raporunu hazırlayıp genel kurula sunma süresi hangisidir?
    siklar:
      - "Bilanço gününü izleyen hesap döneminin ilk üç ayı"
      - "Bilanço gününden itibaren on beş gün"
      - "Bilanço gününü izleyen hesap döneminin ilk altı ayı"
      - "Genel kurul toplantısından en az bir ay önce"
    dogru: 0
    aciklama: |
      Yönetim kurulu finansal tablolarını, eklerini ve yıllık faaliyet raporunu bilanço gününü izleyen hesap döneminin ilk üç ayı içinde hazırlar ve genel kurula sunar (TTK m. 514/1).
  - soru: |
      Finansal tabloların hangi ilkeye göre düzenlenmesi gerekir?
    siklar:
      - "Gerçeği dürüst, aynen ve aslına sadık yansıtma (dürüst resim) ilkesi"
      - "Sadece vergi mevzuatına uygunluk ilkesi"
      - "Yönetim kurulunun serbestçe belirlediği gösterim ilkesi"
      - "Yalnızca esas sözleşmedeki gösterim ilkesi"
    dogru: 0
    aciklama: |
      Anonim şirketlerin finansal tabloları, Türkiye Muhasebe Standartlarına göre şirketin malvarlığını, borç ve yükümlülüklerini, öz kaynaklarını ve faaliyet sonuçlarını gerçeği dürüst, aynen ve aslına sadık surette yansıtacak şekilde çıkarılır (TTK m. 515/1).
  - soru: |
      Ödenmiş sermayesi 3.000.000 TL olan, yedek akçesi henüz ödenmiş sermayenin %20'sine ulaşmamış bir şirkette yıllık kâr 2.000.000 TL'dir. Birinci tertip genel kanuni yedek akçeye ayrılacak tutar kural olarak ne kadardır?
    siklar:
      - "Yıllık kârın %5'i, yani 100.000 TL"
      - "Yıllık kârın %10'u, yani 200.000 TL"
      - "Ödenmiş sermayenin %5'i, yani 150.000 TL"
      - "Yıllık kârın %20'si, yani 400.000 TL"
    dogru: 0
    aciklama: |
      Yıllık kârın yüzde beşi, ödenmiş sermayenin yüzde yirmisine ulaşıncaya kadar genel kanuni yedek akçeye ayrılır (TTK m. 519/1). 2.000.000 TL'nin %5'i 100.000 TL'dir. %10 oranı ikinci tertipteki kâr payından sonraki dağıtıma, ödenmiş sermayenin %5'i ise birinci temettüye ilişkindir.
  - soru: |
      Ödenmiş sermayesi 1.000.000 TL olan ve yedek akçesi zaten ödenmiş sermayenin %20'sine ulaşmış olan şirkette pay sahiplerine %5 kâr payı ödendikten sonra, kârdan pay alacak kişilere dağıtılacak toplam tutar 400.000 TL'dir. Genel kanuni yedek akçeye ek olarak ne kadar eklenir? (Şirket holding değildir.)
    siklar:
      - "Eklenmez; %20 sınırına ulaşıldığı için ayrım sona erer"
      - "40.000 TL"
      - "20.000 TL"
      - "100.000 TL"
    dogru: 1
    aciklama: |
      Birinci fıkradaki sınıra ulaşıldıktan sonra da pay sahiplerine %5 oranında kâr payı ödendikten sonra kârdan pay alacak kişilere dağıtılacak toplam tutarın %10'u genel kanuni yedek akçeye eklenir (TTK m. 519/2-c). 400.000 TL'nin %10'u 40.000 TL'dir. Sınıra ulaşılması bu eklemeyi durdurmaz; yalnız birinci tertipteki %5'lik ayrımı sona erdirir.
  - soru: |
      Genel kanuni yedek akçesi sermayenin %40'ı olan (yani yarısını aşmayan) bir anonim şirket (holding değildir), genel kurul kararıyla bu yedek akçeyi pay sahiplerine kâr payı olarak dağıtmak istemektedir. Bu karar hakkında hangisi doğrudur?
    siklar:
      - "Yedek akçe sermayenin yarısını aşmadığından yalnız zarar kapatma, işletmeyi sürdürme veya işsizliği önleme amacıyla kullanılabilir; dağıtım bu amaçlara girmez"
      - "Genel kurul oy çokluğuyla dilediği şekilde kullanabilir"
      - "Yedek akçenin yarısı dağıtılabilir"
      - "Yalnız yönetim kurulu üyelerine kazanç payı olarak dağıtılabilir"
    dogru: 0
    aciklama: |
      Genel kanuni yedek akçe sermayenin veya çıkarılmış sermayenin yarısını aşmadığı takdirde sadece zararların kapatılmasına, işlerin iyi gitmediği zamanlarda işletmeyi devam ettirmeye veya işsizliğin önüne geçmeye ve sonuçlarını hafifletmeye elverişli önlemler alınması için kullanılabilir (TTK m. 519/3). Kâr payı ise net dönem kârı ve serbest yedek akçelerden verilir (TTK m. 509/2).
  - soru: |
      Genel kurul, kanunda ve esas sözleşmede öngörülenlerden başka yedek akçe ayırmaya hangi hâlde karar verebilir?
    siklar:
      - "Yalnız aktiflerin yeniden sağlanması için gerekliyse"
      - "Aktiflerin yeniden sağlanması için gerekliyse veya şirketin sürekli gelişimi ve olabildiğince kararlı kâr payı dağıtımı yönünden bütün pay sahiplerinin menfaatleri dikkate alındığında haklı görülüyorsa"
      - "Yönetim kurulu isterse her zaman"
      - "Azınlık oybirliğiyle onay verirse"
    dogru: 1
    aciklama: |
      Genel kurul, aktiflerin yeniden sağlanabilmesi için gerekliyse veya bütün pay sahiplerinin menfaatleri dikkate alındığında şirketin sürekli gelişimi ve olabildiğince kararlı kâr payı dağıtımı yönünden haklı görülüyorsa başka yedek akçe ayrılmasına karar verebilir (TTK m. 523/2). Bu iki durum seçimlik olduğu için ilk şık eksiktir.
olaylar:
  - olay: |
      Ödenmiş sermayesi 8.000.000 TL olan Zeytin Mobilya A.Ş.'nin genel kanuni yedek akçesi 500.000 TL'dir. Şirketin 31.12.2025 tarihli bilançosuna göre net dönem kârı 3.000.000 TL'dir. Yönetim kurulu, finansal tabloları ve yıllık faaliyet raporunu 24.04.2026 tarihinde hazırlayıp genel kurula sunmuştur.

      Genel kurul 15.05.2026 tarihinde şu kararları almıştır: (a) Kanuni yedek akçe ayrılmadan ve pay sahiplerine hiçbir kâr payı dağıtılmadan yönetim kurulu üyelerine toplam 300.000 TL kazanç payı verilmesi; (b) ortaklara ayrıca 400.000 TL tutarında kâr payının genel kanuni yedek akçeden dağıtılması. Ortak Ali, 12.03.2022 tarihinde, bilançonun gerçeğe aykırı olduğunu bilerek 200.000 TL kâr payı almıştı; şirket bu ödemeyi 2026 yılının eylül ayında geri istemektedir.

      1. Finansal tabloların sunulma zamanını değerlendiriniz.
      2. 2025 kârından genel kanuni yedek akçeye ayrılacak tutarı belirleyiniz.
      3. (a) ve (b) numaralı kararların hukuka uygunluğunu değerlendiriniz.
      4. Ali'den iade istenebilir mi?
    olcut:
      - {tespit: "Finansal tablolar ve faaliyet raporu bilanço gününü izleyen ilk üç ay içinde hazırlanmalıydı; 24 Nisan geç kalmıştır", puan: 15, madde: "TTK m. 514/1"}
      - {tespit: "Birinci tertip: yıllık kârın %5'i (150.000 TL) %20 sınırına ulaşılmadığından ayrılır", puan: 20, madde: "TTK m. 519/1"}
      - {tespit: "Kazanç payı için kanuni yedek akçe ayrımı ve ödenmiş sermayenin %5'i oranında kâr payı dağıtımı şarttır; (a) kararı aykırıdır", puan: 25, madde: "TTK m. 511/1"}
      - {tespit: "Kâr payı net dönem kârından ve serbest yedek akçelerden dağıtılır; genel kanuni yedek akçeden dağıtım (b) kararı aykırıdır", puan: 15, madde: "TTK m. 509/2"}
      - {tespit: "Kötüniyetle alınan kâr payı geri alınır; süre paranın alındığı tarihten 5 yıl", puan: 15, madde: "TTK m. 512"}
      - {tespit: "İsteğe bağlı yedek akçeler ayrılmadıkça kâr payı belirlenemez; hukuka aykırı genel kurul kararları 3 ay içinde iptal davasına konu olur", puan: 10, madde: "TTK m. 445/1"}
    cozum: |
      **Nitelendirme:** Olay anonim şirkette finansal tabloların sunulma süresi, yedek akçe ayrımı, kâr payı ve kazanç payı dağıtımının şartları ile haksız alınan kâr payının iadesine ilişkindir.

      **Hukuki sorunlar:** (1) Finansal tabloların zamanında hazırlanması. (2) Birinci tertip yedek akçe tutarı. (3) Kazanç payı ve kâr payı kararlarının hukuka uygunluğu. (4) Kâr payı iadesi.

      **İlgili hükümler ve değerlendirme:** Yönetim kurulu finansal tablolarını ve yıllık faaliyet raporunu bilanço gününü (31.12.2025) izleyen hesap döneminin ilk üç ayı içinde, yani 31 Mart 2026'ya kadar hazırlayıp genel kurula sunmalıdır (TTK m. 514/1). 24 Nisan 2026 tarihi bu süreyi aşmaktadır.

      Genel kanuni yedek akçe için yıllık kârın %5'i, ödenmiş sermayenin %20'sine ulaşıncaya kadar ayrılır (TTK m. 519/1). Ödenmiş sermayenin %20'si 1.600.000 TL'dir; mevcut yedek akçe 500.000 TL olduğundan sınıra ulaşılmamıştır ve 3.000.000 TL'nin %5'i olan 150.000 TL ayrılmalıdır.

      Yönetim kurulu üyelerine kazanç payı sadece net kârdan ve ancak kanuni yedek akçe için belirli ayrım yapıldıktan ve pay sahiplerine ödenmiş sermayenin %5'i (8.000.000 TL'nin %5'i, yani 400.000 TL) oranında veya esas sözleşmedeki daha yüksek oranda kâr payı dağıtıldıktan sonra verilebilir (TTK m. 511/1). Olayda ne yedek akçe ayrımı yapılmış ne de kâr payı dağıtılmıştır; (a) kararı bu nedenle hukuka aykırıdır. (b) kararı ise genel kanuni yedek akçeyi kâr payı olarak dağıtmaktadır; oysa kâr payı yalnız net dönem kârından ve serbest yedek akçelerden verilebilir (TTK m. 509/2). Ayrıca genel kanuni yedek akçe sermayenin yarısını aşmadığından yalnız zarar kapatma, işletmeyi sürdürme ve işsizliği önleme amaçlarıyla kullanılır (TTK m. 519/3). Bu iki karar kanuna aykırı olduğundan, TTK m. 446'da sayılan kişiler tarafından karar tarihinden itibaren üç ay içinde iptal davasına konu edilebilir (TTK m. 445/1).

      Haksız yere ve kötüniyetle kâr payı alan pay sahibi bunu geri verir; geri alma hakkı paranın alındığı tarihten itibaren beş yıl geçmekle zamanaşımına uğrar (TTK m. 512). Ali ödemeyi 12.03.2022'de almış, talep 2026 eylülünde yapılmaktadır; beş yıl dolmadığından iade talebi zamanaşımına uğramamıştır. Ali'nin bilançonun gerçeğe aykırı olduğunu bilmesi kötüniyet unsurunu da karşılar.

      **Sonuç:** Finansal tablolar geç sunulmuştur; 150.000 TL birinci tertip yedek akçe ayrılmalıdır; (a) ve (b) kararları kanuna aykırıdır ve iptal edilebilir; Ali'den kötüniyetli olduğu için iade istenebilir.
  - olay: |
      Atlas Holding A.Ş., başlıca amacı başka işletmelere katılmak olan bir holding şirketidir. Ödenmiş sermayesi 10.000.000 TL, genel kanuni yedek akçesi 1.200.000 TL'dir. 2025 hesap döneminde net dönem kârı 4.000.000 TL'dir. Yıl içinde yeni pay ihracından 2.000.000 TL emisyon primi elde edilmiş, bunun 300.000 TL'si ihraç giderleri için kullanılmıştır.

      Genel kurul toplantısında pay sahiplerine ödenmiş sermayenin %5'i oranında kâr payı ödendikten sonra kârdan pay alacak kişilere toplam 2.000.000 TL dağıtılmasına karar verilmiştir. Ayrıca genel kurul, şirketin aktiflerinin yeniden sağlanabilmesi için 600.000 TL ve işçiler için yardım sandığı kurulması amacıyla 100.000 TL yedek akçe ayrılmasını oylamıştır. Esas sözleşmede bu konuda hüküm yoktur. Bir azınlık ortağı, "yedek akçe ayrılmadan kâr payı dağıtılamaz; ayrıca %10 yedek akçe ayrılması gerekir" diyerek itiraz etmiştir.

      1. Emisyon priminin yedek akçe bakımından durumunu değerlendiriniz.
      2. Holding olmasının yedek akçe ayrımına etkisini ve azınlık ortağın itirazını değerlendiriniz.
      3. Genel kurulun yedek akçe kararlarının hukuka uygunluğunu değerlendiriniz.
    olcut:
      - {tespit: "Birinci tertip: yıllık kârın %5'i (200.000 TL) %20 sınırına (2.000.000 TL) ulaşılmadığından holding de dahil ayrılır", puan: 15, madde: "TTK m. 519/1"}
      - {tespit: "Emisyon priminin kullanılmayan kısmı (1.700.000 TL) genel kanuni yedek akçeye eklenir", puan: 20, madde: "TTK m. 519/2-a"}
      - {tespit: "Holding şirketlerde dağıtılacak tutarın %10'unun eklenmesi uygulanmaz; azınlığın itirazı bu yönden yersizdir", puan: 20, madde: "TTK m. 519/4"}
      - {tespit: "Aktiflerin yeniden sağlanması için genel kurul başka yedek akçe ayırabilir", puan: 25, madde: "TTK m. 523/2"}
      - {tespit: "İşçi yardım sandığı için esas sözleşmede hüküm olmasa da bilanço kârından yedek akçe ayrılabilir", puan: 10, madde: "TTK m. 523/3"}
      - {tespit: "Kanuni ve isteğe bağlı yedek akçeler ayrılmadıkça kâr payı belirlenemez", puan: 10, madde: "TTK m. 523/1"}
    cozum: |
      **Nitelendirme:** Olay, holding şirketi bakımından genel kanuni yedek akçenin ikinci tertibinin ve genel kurulun olağanüstü yedek akçe ayırma yetkisinin sınırlarına ilişkindir.

      **Hukuki sorunlar:** (1) Emisyon priminin yedek akçeye eklenmesi. (2) Holding istisnasının kapsamı. (3) Genel kurulun TTK m. 523 yetkisi.

      **İlgili hükümler ve değerlendirme:** Genel kanuni yedek akçenin birinci tertibi yıllık kârın %5'inin, ödenmiş sermayenin %20'sine ulaşıncaya kadar ayrılmasıdır (TTK m. 519/1). Ödenmiş sermayenin %20'si 2.000.000 TL, mevcut yedek akçe 1.200.000 TL olduğundan sınıra ulaşılmamıştır; 4.000.000 TL'nin %5'i olan 200.000 TL ayrılır. Holding şirketleri bu hükmün dışında değildir.

      Birinci fıkradaki sınıra ulaşıldıktan sonra da, yeni payların çıkarılması dolayısıyla sağlanan primin, çıkarılma giderleri, itfa karşılıkları ve hayır amaçlı ödemeler için kullanılmamış kısmı genel kanuni yedek akçeye eklenir (TTK m. 519/2-a). Olayda 2.000.000 TL primden 300.000 TL harcandığından 1.700.000 TL eklenir. Bu bent holding şirketler için de uygulanır.

      Pay sahiplerine %5 oranında kâr payı ödendikten sonra dağıtılacak toplam tutarın %10'unun eklenmesini düzenleyen (c) bendi ile genel kanuni yedek akçenin kullanım sınırını düzenleyen üçüncü fıkra, başlıca amacı başka işletmelere katılmaktan ibaret olan holding şirketler hakkında uygulanmaz (TTK m. 519/4). Dolayısıyla 2.000.000 TL'nin %10'u olan 200.000 TL eklenmez; azınlık ortağının bu yöndeki itirazı yersizdir. Kâr payı bakımından ise kanuni ve esas sözleşmede öngörülen isteğe bağlı yedek akçeler ayrılmadıkça kâr payı belirlenemez (TTK m. 523/1); olayda kanuni ayrım yapılmalı, sonra kâr payı belirlenmelidir.

      Genel kurul, aktiflerin yeniden sağlanabilmesi için gerekliyse kanun ve esas sözleşmede öngörülenlerden başka yedek akçe ayrılmasına karar verebilir (TTK m. 523/2); 600.000 TL'lik ayrım bu sebebe dayandığı için geçerlidir. İşçiler için yardım sandığı kurulması amacıyla ise esas sözleşmede hüküm bulunmasa bile bilanço kârından yedek akçe ayrılabilir (TTK m. 523/3); 100.000 TL'lik ayrım da geçerlidir.

      **Sonuç:** 200.000 TL birinci tertip ve 1.700.000 TL emisyon primi artığı genel kanuni yedek akçeye eklenir; %10'luk ekleme holding olduğu için yapılmaz ve azınlığın itirazı yersizdir; her iki olağanüstü yedek akçe kararı TTK m. 523 uyarınca geçerlidir.
kartlar:
  - on: "Kâr ve tasfiye payı nasıl hesaplanır?"
    arka: "Esas sözleşmede aksi yoksa pay sahibinin sermaye payı için şirkete yaptığı ödemelerle orantılı (TTK m. 508/1)."
  - on: "Sermaye için faiz ödenebilir mi?"
    arka: "Hayır (TTK m. 509/1); hazırlık dönemi faizi esas sözleşmede öngörülürse istisnadır (TTK m. 510)."
  - on: "Kâr payı hangi kaynaklardan dağıtılır?"
    arka: "Net dönem kârından ve serbest yedek akçelerden (TTK m. 509/2)."
  - on: "Kazanç payı (tantiem) için üç şart?"
    arka: "Sadece net kârdan; kanuni yedek akçe ayrımı yapılmış; pay sahiplerine ödenmiş sermayenin %5'i oranında kâr payı dağıtılmış (TTK m. 511/1)."
  - on: "Haksız alınan kâr payını kim, ne zamana kadar geri verir?"
    arka: "Kötüniyetli pay sahibi ve yönetim kurulu üyesi; paranın alındığı tarihten 5 yıl (TTK m. 512)."
  - on: "İflasta yönetim kurulu üyelerinin iade yükümü?"
    arka: "İflastan önceki son 3 yıl içinde aldıkları, uygun ücreti aşan paralar (TTK m. 513/1)."
  - on: "Finansal tabloların hazırlanma süresi?"
    arka: "Bilanço gününü izleyen hesap döneminin ilk 3 ayı (TTK m. 514/1)."
  - on: "Dürüst resim ilkesi nedir?"
    arka: "Finansal tabloların gerçeği dürüst, aynen ve aslına sadık yansıtması (TTK m. 515/1)."
  - on: "Genel kanuni yedek akçe birinci tertip?"
    arka: "Yıllık kârın %5'i, ödenmiş sermayenin %20'sine ulaşıncaya kadar (TTK m. 519/1)."
  - on: "Genel kanuni yedek akçe ikinci tertip bentleri?"
    arka: "Emisyon primi artığı, ıskat artığı ve %5 kâr payından sonra dağıtılacak toplamın %10'u (TTK m. 519/2)."
  - on: "Yedek akçe sermayenin yarısını aşmadıkça nerede kullanılır?"
    arka: "Yalnız zarar kapatma, işletmeyi sürdürme ve işsizliği önleme önlemlerinde (TTK m. 519/3)."
  - on: "Holding şirketlerde hangi hükümler uygulanmaz?"
    arka: "TTK m. 519/2-c ve TTK m. 519/3 (TTK m. 519/4)."
