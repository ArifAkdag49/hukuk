      TTK m. 703'e göre aşağıdaki vade yazım biçimlerinden hangisi poliçeyi **batıl** kılar?
    siklar:
      - "Poliçede vadenin hiç gösterilmemesi"
      - "Poliçenin \"görüldüğünde\" ödenmesinin yazılması"
      - "Poliçenin \"ilk taksit 01.03, ikinci taksit 01.04\" biçiminde birbirini izleyen vadeler içermesi"
      - "Poliçenin düzenlenme gününden 3 ay sonra ödenmesinin yazılması"
    dogru: 2
    aciklama: |
      TTK m. 703/2'ye göre vadesi başka şekilde yazılan veya birbirini takip eden çeşitli vadeleri gösteren poliçe batıldır. Vadenin hiç yazılmaması ise poliçeyi batıl yapmaz; bu durumda poliçe görüldüğünde ödenmesi şart edilmiş sayılır (TTK m. 672/2). Diğer iki vade türü TTK m. 703/1'de sayılan geçerli vadelerdir.
  - soru: |
      Görüldüğünde ödenecek bir poliçe hakkında hangisi doğrudur?
    siklar:
